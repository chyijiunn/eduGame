// v0.2 延續 v0.13 配置資料模型：未來 v0.4 編輯器將覆寫寫回同一份 HTML。
// 鍵名為穩定的分類 ID 及「分類ID:遊戲ID」，不依遊戲清單順序。
const PUBLISHED_LAYOUT={schemaVersion:1,islands:{},games:{}};
const STORAGE_KEY='eduGame.archipelago.layout.v1';
function isFiniteNumber(x){return typeof x==='number'&&Number.isFinite(x)}
function validatePose(v,kind){if(!v||typeof v!=='object')return null;const out={};for(const key of (kind==='island'?['x','z','radius','rotation']:['x','z','rotation','scale']))if(isFiniteNumber(v[key]))out[key]=v[key];if(out.radius!==undefined&&out.radius<=0)delete out.radius;if(out.scale!==undefined&&(out.scale<=0||out.scale>5))delete out.scale;return Object.keys(out).length?out:null}

function normalizeLayout(raw){const out={schemaVersion:1,islands:{},games:{}};for(const kind of ['islands','games'])for(const [id,v] of Object.entries(raw?.[kind]||{})){const pose=validatePose(v,kind==='islands'?'island':'game');if(pose)out[kind][id]=pose}return out}

function saveLayout(layout){const data=normalizeLayout(layout);localStorage.setItem(STORAGE_KEY,JSON.stringify(data));return data}
function exportLayoutJSON(){return JSON.stringify(SAVED_LAYOUT,null,2)}

const URLS=['https://raw.githubusercontent.com/chyijiunn/eduGame/main/index.html','https://raw.githubusercontent.com/chyijiunn/eduGame/master/index.html'];
const origin='https://chyijiunn.github.io/eduGame/';
function parseGames(source){const match=source.match(/const\s+GAME_LIST\s*=\s*\[([\s\S]*?)\n\s*\];/);if(!match)throw Error('找不到 GAME_LIST');const data=match[1];const blocks=[...data.matchAll(/\{\s*id:\s*"([^"]+)"([\s\S]*?)\n\s*\}/g)];const get=(s,k)=>(s.match(new RegExp('\\b'+k+'\\s*:\\s*"((?:\\\\.|[^"\\\\])*)"'))||[])[1]||'';const arr=(s,k)=>{const m=s.match(new RegExp('\\b'+k+'\\s*:\\s*\\[([^\\]]*)\\]'));return m?[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]):[]};const games=blocks.map(x=>{const b=x[0];return {id:x[1],name:get(b,'name'),url:get(b,'url'),desc:get(b,'desc'),cats:arr(b,'cats'),tags:arr(b,'tags'),grade:get(b,'grade')}}).filter(g=>g.name&&g.url&&g.cats.length);if(games.length<20)throw Error('遊戲資料解析不完整：'+games.length+' 筆');return games}
async function loadGames(){let err;for(const u of URLS){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return parseGames(await r.text())}catch(e){err=e}}throw err}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let s=seed>>>0;return()=>((s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296)}
function material(color){return new THREE.MeshStandardMaterial({color,flatShading:true,roughness:.9})}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9dcddd);scene.fog=new THREE.FogExp2(0x9dcddd,.0037);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,600);camera.position.set(0,125,155);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x477582,2.5));const sunlight=new THREE.DirectionalLight(0xfff4d9,2.2);sunlight.position.set(-50,90,60);scene.add(sunlight);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=8;controls.maxDistance=240;controls.maxPolarAngle=Math.PI*.47;controls.enablePan=true;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(600,600,35,35),new THREE.MeshStandardMaterial({color:0x368fa8,roughness:.43,metalness:.04,flatShading:true}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.5;scene.add(ocean);
const islandMeshes=[],gameMeshes=[],labels=[],islands={};const gameTargets=new Map();let flight=null;let selectedGame=null;let highlight=null,markerRing=null,markerBeacon=null;
function clearSelection(){selectedGame=null;if(highlight)highlight.visible=false;$('#detail').style.removeProperty('display');$('#detail').hidden=true;}
const boats=[],planes=[],bridges=[],buses=[];const opticalEntrances=[];let physicsAirport=null;
// 由既有配置先決定座標。沒有保存資料的新島才使用關聯演算法。
function mergeIslandLayout(automatic){
 const result={};for(const [id,auto] of Object.entries(automatic)){
  const manual=validatePose(SAVED_LAYOUT.islands[id],'island')||{};
  result[id]={...auto,...manual};if(id==='tool')result[id].radius=5.7;
 }
 return result;
}
function ensureIslandSnapshot(layout){
 // 首次載入保存已發布的自動位置；後續新增遊戲不會搬動舊島。
 let changed=false;for(const [id,p] of Object.entries(layout))if(!SAVED_LAYOUT.islands[id]){
  SAVED_LAYOUT.islands[id]={x:p.x,z:p.z,radius:p.radius,rotation:p.rotation};changed=true;
 }
 if(changed){try{saveLayout(SAVED_LAYOUT)}catch(e){console.warn('瀏覽器無法保存配置',e)}}
}
function gameKey(islandId,gameId){return islandId+':'+gameId}
function stableGamePositions(items,id,radius){
 const result=new Map(),occupied=[];const usable=radius*.78,spacing=id==='tool'?3.2:4.35;
 // 已配置物件先固定；新增物件只搜尋剩餘空位，不重排既有建築。
 for(const g of items){const pose=validatePose(SAVED_LAYOUT.games[gameKey(id,g.id)],'game');if(pose&&isFiniteNumber(pose.x)&&isFiniteNumber(pose.z)){
  if(Math.hypot(pose.x,pose.z)<=usable&&occupied.every(p=>Math.hypot(p.x-pose.x,p.z-pose.z)>spacing*.9)){result.set(g.id,pose);occupied.push(pose)}
 }}
 for(const g of [...items].filter(g=>!result.has(g.id)).sort((a,b)=>a.id.localeCompare(b.id))){
  const r=rng(hash(id+':'+g.id));let pose=null;
  for(let k=0;k<600;k++){
   const a=r()*Math.PI*2,d=Math.sqrt(r())*usable;
   const x=Math.cos(a)*d,z=Math.sin(a)*d;
   if(occupied.every(p=>Math.hypot(p.x-x,p.z-z)>spacing)){pose={x,z,rotation:0,scale:1};break}
  }

  SAVED_LAYOUT.games[gameKey(id,g.id)]={...pose};

}

// 依實際遊戲資料計算島嶼關聯圖：共同遊戲 > 共同標籤，並使用碰撞排斥保持海峽。
function computeIslandLayout(games){
 const ids=CATS.map(c=>c[0]),n=ids.length;
 const by=Object.fromEntries(ids.map(id=>[id,games.filter(g=>g.cats.includes(id))]));
 const tagSets=Object.fromEntries(ids.map(id=>[id,new Set(by[id].flatMap(g=>g.tags))]));
 const weights=Array.from({length:n},()=>Array(n).fill(0));
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
  const A=ids[i],B=ids[j];
  const sharedGames=by[A].filter(g=>g.cats.includes(B)).length;
  const commonTags=[...tagSets[A]].filter(t=>tagSets[B].has(t));
  // 排除過於通用的標籤，並降低單一弱標籤對布局的影響。
  const generic=new Set(['game','系統','反應','練習','code','md']);
  const sharedTags=commonTags.filter(t=>!generic.has(t)).length;
  weights[i][j]=weights[j][i]=sharedGames*5+sharedTags*.72;
 }
 const degree=ids.map((_,i)=>weights[i].reduce((a,b)=>a+b,0));
 const links=ids.map((_,i)=>weights[i].filter(w=>w>0).length);
 const score=ids.map((_,i)=>degree[i]*(1+.09*links[i]));
 const hub=score.indexOf(Math.max(...score));
 const sizes=ids.map(id=>by[id].length);
 const radii=sizes.map((c,i)=>ids[i]==='tool'?5.7:8+Math.sqrt(c)*2.2);
 const points=ids.map((id,i)=>{
  if(i===hub)return {x:0,z:0};
  const angle=2*Math.PI*i/n+((hash(id)%101)/101-.5)*.45;
  const dist=44+((hash(id+'distance')%100)/100)*24;
  return {x:Math.cos(angle)*dist,z:Math.sin(angle)*dist};
 });
 // 力導向布局：強關聯吸引、所有島嶼互斥、中心節點固定。
 for(let iter=0;iter<1100;iter++){
  const fx=Array(n).fill(0),fz=Array(n).fill(0);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
   const dx=points[j].x-points[i].x,dz=points[j].z-points[i].z;
   const d=Math.max(1,Math.hypot(dx,dz)),ux=dx/d,uz=dz/d;
   const minD=radii[i]+radii[j]+7.5;
   const w=weights[i][j];
   // 關聯越強，理想距離越短；無關聯者仍需彼此避讓。
   const ideal=minD+Math.max(5,36-5.5*Math.log1p(w));
   const attraction=w>0?Math.min(.13,.018+w*.005)*(d-ideal):0;
   const overlap=d<minD?(minD-d)*.32:0;
   const repulsion=220/(d*d);
   const force=attraction-overlap-repulsion;
   fx[i]+=force*ux;fz[i]+=force*uz;fx[j]-=force*ux;fz[j]-=force*uz;

 const previous=pointerDownPoint;pointerDownPoint=null;
 const multi=gestureHadMultipleFingers;
 if(e.pointerType==='touch'){activeTouchPointers.delete(e.pointerId);if(!activeTouchPointers.size)gestureHadMultipleFingers=false}
 if(multi||!previous||previous.id!==e.pointerId)return;
 const move=Math.hypot(e.clientX-previous.x,e.clientY-previous.y);
 const threshold=e.pointerType==='touch'?13:8;
 if(move>threshold||(e.pointerType==='touch'&&performance.now()-previous.when>650))return;
 if(e.pointerType==='mouse')lastMouseUpHandled=performance.now();
 selectAtPointer(e);
});
// Allow users to test the information window independently of 3D hit testing by using search results.
// Keep island selection accessible without obscuring the viewport on narrow devices.
const islandToggle=$('#mobile-islands-toggle'),islandList=$('#islands');
const compactQuery=matchMedia('(max-width:820px), (pointer:coarse)');
function updateCompactNavigation(){
 if(compactQuery.matches){islandList.classList.add('mobile-collapsed');islandToggle.setAttribute('aria-expanded','false')}
 else{islandList.classList.remove('mobile-collapsed');islandToggle.setAttribute('aria-expanded','true')}
}
islandToggle.addEventListener('click',()=>{
 const collapsed=islandList.classList.toggle('mobile-collapsed');
 islandToggle.setAttribute('aria-expanded',String(!collapsed));
 islandToggle.textContent=collapsed?'選擇島嶼 ▾':'收合島嶼 ▴';
});
islandList.addEventListener('click',e=>{if(compactQuery.matches&&e.target.closest('button')){islandList.classList.add('mobile-collapsed');islandToggle.textContent='選擇島嶼 ▾';islandToggle.setAttribute('aria-expanded','false')}});
compactQuery.addEventListener?.('change',updateCompactNavigation);updateCompactNavigation();
const clock=new THREE.Clock(),projection=new THREE.Vector3();function render(){requestAnimationFrame(render);const time=clock.getElapsedTime();window.__islandTime=time;if(highlight?.visible){markerRing.rotation.z=time*.45;markerRing.material.opacity=.65+.25*Math.sin(time*3);markerBeacon.position.y=4.8+Math.sin(time*3)*.25;}for(const animate of animations)animate(time);animateTransport(time);if(flight){const t=Math.min(1,(performance.now()-flight.start)/1050),v=t*t*(3-2*t);camera.position.lerpVectors(flight.from,flight.to,v);controls.target.lerpVectors(flight.fromTarget,flight.toTarget,v);if(t>=1)flight=null}else if(controls.state!==-1){/* User camera input is handled by OrbitControls. */}controls.update();const attr=ocean.geometry.attributes.position;for(let i=0;i<attr.count;i++)attr.setZ(i,Math.sin(attr.getX(i)*.11+time*.65)*.19+Math.cos(attr.getY(i)*.13+time*.6)*.15);attr.needsUpdate=true;ocean.geometry.computeVertexNormals();const activeIsland=Object.values(islands).sort((a,b)=>a.center.distanceTo(controls.target)-b.center.distanceTo(controls.target))[0];const touchView=compactQuery.matches;const localView=activeIsland&&activeIsland.center.distanceTo(controls.target)<activeIsland.radius*(touchView?1.4:.9)&&camera.position.distanceTo(controls.target)<Math.max(touchView?58:42,activeIsland.radius*(touchView?3.8:3.1));for(const l of labels){if(l.type==='game'&&(!localView||l.island!==activeIsland.id)){l.el.style.display='none';continue}projection.copy(l.point).project(camera);const ok=projection.z>-1&&projection.z<1&&Math.abs(projection.x)<1.1&&Math.abs(projection.y)<1.1;l.el.style.display=ok?'block':'none';if(ok){l.el.style.left=(projection.x*.5+.5)*innerWidth+'px';l.el.style.top=(-projection.y*.5+.5)*innerHeight+'px'}}updateModelHitTargets(performance.now(),activeIsland,localView);renderer.render(scene,camera)}render();
