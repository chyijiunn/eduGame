<!DOCTYPE html>
<html lang="zh-Hant">
<head><script src="/eduGame/ga4.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>proha v0.3｜布拉格 10 天步行放射旅圖</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#111a2b;
      --panel-2:#18233a;
      --card:#0f1727;
      --line:#2b3b5a;
      --muted:#91a4c3;
      --text:#f5f7fb;
      --accent:#7c9cff;
      --accent-2:#59d0ff;
      --ok:#65d28b;
      --warn:#ffd166;
      --danger:#ff7a7a;
      --shadow:0 16px 40px rgba(0,0,0,.28);
      --radius:18px;
      --radius-sm:12px;
      --font: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
    body{overflow:hidden}
    a{color:inherit}
    button{
      appearance:none;border:0;cursor:pointer;font:inherit;color:var(--text);
      background:linear-gradient(180deg, #1b2740, #11192b);padding:12px 14px;border-radius:14px;
      border:1px solid rgba(255,255,255,.08);transition:.18s transform,.18s background,.18s border-color,.18s opacity;
      box-shadow:0 6px 16px rgba(0,0,0,.18);touch-action:manipulation;
    }
    button:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.18)}
    button:active{transform:translateY(0)}
    .btn-secondary{background:linear-gradient(180deg, #152036, #0d1524)}
    .app,.map-wrap{height:100vh;width:100vw}
    .map-wrap{position:relative;overflow:hidden}
    #map{height:100%;width:100%;background:#d8e5f2}

    .boot-overlay{
      position:fixed;inset:0;z-index:4000;display:flex;align-items:center;justify-content:center;padding:22px;
      background:radial-gradient(circle at 20% 20%, rgba(89,208,255,.16), transparent 30%), linear-gradient(180deg, #0a1020, #0b1220);
      transition:opacity .28s ease, visibility .28s ease;
    }
    .boot-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .boot-card{
      width:min(560px, 100%);padding:22px 20px;border-radius:24px;background:linear-gradient(180deg, rgba(17,26,43,.96), rgba(11,18,32,.96));
      border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow)
    }
    .boot-title{font-size:1.05rem;font-weight:800;margin:0 0 8px}
    .boot-desc{margin:0;color:#d8e2f2;line-height:1.6;font-size:.94rem}
    .boot-note{margin-top:10px;color:var(--muted);font-size:.84rem;line-height:1.55}

    .floating-panel{
      position:absolute;top:12px;left:12px;z-index:1200;
      width:min(390px, calc(100vw - 24px));max-height:calc(100vh - 24px);
      display:flex;flex-direction:column;overflow:hidden;
      background:linear-gradient(180deg, rgba(17,26,43,.96), rgba(11,18,32,.94));
      border:1px solid rgba(255,255,255,.08);border-radius:20px;box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      transition:width .22s ease, transform .22s ease;
    }
    .floating-panel.collapsed{width:60px}
    .panel-head{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(9,15,26,.38)
    }
    .panel-title{font-size:.95rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .icon-btn{
      width:36px;height:36px;padding:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
      font-size:1rem;font-weight:900;flex:0 0 auto
    }
    .floating-panel.collapsed .panel-title{display:none}
    .floating-panel.collapsed .panel-head{border-bottom:0;justify-content:center;padding:10px}
    .panel-content{display:flex;flex-direction:column;gap:10px;padding:12px;overflow:auto;min-height:0}
    .floating-panel.collapsed .panel-content{display:none}

    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .days{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .day-btn{
      min-height:68px;padding:10px 12px;display:flex;align-items:center;justify-content:flex-start;
      text-align:left;position:relative;overflow:hidden
    }
    .day-btn-main{display:flex;align-items:center;gap:10px;min-width:0}
    .day-btn .num{
      width:32px;height:32px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
      font-weight:900;font-size:.9rem;background:rgba(124,156,255,.18);border:1px solid rgba(124,156,255,.28);flex:0 0 auto
    }
    .day-btn .label{font-size:.9rem;font-weight:700;line-height:1.25;min-width:0}
    .day-btn.active{border-color:rgba(255,255,255,.26);background:linear-gradient(180deg, #223257, #15203a)}
    .day-btn.active::after{
      content:"";position:absolute;right:10px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--ok);
      box-shadow:0 0 12px rgba(101,210,139,.85)
    }
    .tool-btn.active{background:linear-gradient(180deg, #27406b, #15203a);border-color:rgba(124,156,255,.38)}

    .detail-wrap{display:grid;gap:12px}
    .detail-empty{
      padding:14px;border-radius:16px;border:1px dashed rgba(255,255,255,.12);color:var(--muted);line-height:1.6;background:rgba(255,255,255,.02)
    }
    .day-card{
      background:linear-gradient(180deg, rgba(24,35,58,.9), rgba(13,21,36,.94));
      border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px 16px 14px;box-shadow:var(--shadow)
    }
    .day-card h3{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .swatch{width:14px;height:14px;border-radius:50%;display:inline-block;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.16) inset}
    .theme{color:var(--accent-2);font-size:.85rem;margin:0 0 8px}
    .intro{margin:0 0 10px;color:#d8e2f2;line-height:1.58;font-size:.92rem}
    .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
    .stat{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);font-size:.8rem;color:#d9e1f3}
    .mini-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .mini-actions a,.mini-actions button{
      text-decoration:none;font-size:.84rem;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)
    }
    .poi-list{display:grid;gap:8px}
    .poi-item{padding:10px 12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:14px}
    .poi-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .poi-name{font-weight:700;font-size:.92rem}
    .poi-code{font-size:.76rem;color:var(--muted);white-space:nowrap}
    .poi-desc{margin-top:4px;font-size:.84rem;color:#d3deef;line-height:1.48}
    .poi-meta{margin-top:6px;font-size:.77rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px}
    .overlap-box{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.18);font-size:.82rem;color:#ffe4a1;line-height:1.5}

    .map-floating{
      position:absolute;top:12px;right:12px;z-index:600;display:flex;flex-direction:column;gap:10px;
      max-width:min(380px, calc(100vw - 24px));pointer-events:none
    }
    .float-card{
      pointer-events:auto;background:rgba(17,26,43,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:16px;
      box-shadow:var(--shadow);padding:12px 14px;font-size:.88rem;line-height:1.5
    }
    .status-row{display:flex;align-items:flex-start;gap:10px}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px rgba(101,210,139,.7);margin-top:4px;flex:0 0 auto}
    .status-text{font-weight:700}
    .status-sub{margin-top:4px;color:var(--muted);font-size:.82rem}

    .route-label{
      background:rgba(17,26,43,.92);color:#fff;border:1px solid rgba(255,255,255,.12);padding:6px 10px;border-radius:999px;
      font-size:.76rem;font-weight:700;box-shadow:0 6px 14px rgba(0,0,0,.25)
    }
    .poi-marker{
      width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;
      color:#fff;border:2px solid rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(0,0,0,.28);font-size:.72rem
    }
    .base-marker{
      width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;
      color:#fff;border:2px solid rgba(255,255,255,.92);box-shadow:0 10px 22px rgba(0,0,0,.32);font-size:.8rem
    }
    .user-dot{
      width:18px;height:18px;border-radius:50%;background:#2f8cff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,140,255,.22), 0 5px 14px rgba(0,0,0,.28)
    }

    @media (max-width: 860px){
      .floating-panel{width:min(360px, calc(100vw - 20px));top:10px;left:10px;max-height:calc(100vh - 20px)}
      .map-floating{right:10px;top:auto;bottom:10px;left:10px;max-width:none}
    }
    @media (max-width: 520px){
      .floating-panel{width:min(340px, calc(100vw - 20px))}
      .controls{grid-template-columns:1fr 1fr}
      .days{grid-template-columns:1fr}
      .panel-title{font-size:.9rem}
      .day-btn{min-height:64px}
      .map-floating{left:74px;right:10px;bottom:10px}
      .float-card{padding:10px 12px;font-size:.84rem}
    }
  </style>
</head>
<body>
  <div class="boot-overlay" id="bootOverlay">
    <div class="boot-card">
      <p class="boot-title" id="bootTitle">proha v0.3 正在準備地圖</p>
      <p class="boot-desc" id="bootDesc">首次使用會先載入地圖引擎；若要離線使用，之後再按「離線包」預先下載本旅圖範圍。</p>
      <div class="boot-note" id="bootNote">同一瀏覽器、同一裝置再次開啟時，會優先使用已保存的地圖元件與離線快取。</div>
    </div>
  </div>

  <div class="app">
    <main class="map-wrap">
      <div id="map"></div>

      <aside class="floating-panel" id="panel">
        <div class="panel-head">
          <div class="panel-title">proha v0.3｜布拉格 10 天旅圖</div>
          <button id="panelToggle" class="icon-btn btn-secondary" type="button" aria-expanded="true" aria-label="收合操作面板">×</button>
        </div>
        <div class="panel-content" id="panelContent">
          <div class="controls">
            <button id="clearBtn" class="btn-secondary tool-btn" type="button">清除</button>
            <button id="fitBtn" class="btn-secondary tool-btn" type="button">縮放</button>
            <button id="locateBtn" class="btn-secondary tool-btn" type="button">定位</button>
            <button id="offlineBtn" class="btn-secondary tool-btn" type="button">離線包</button>
          </div>
          <div id="days" class="days"></div>
          <div class="detail-wrap" id="detailWrap">
            <div class="detail-empty">尚未顯示任何一天，請先點選天數。</div>
          </div>
        </div>
      </aside>

      <div class="map-floating">
        <div class="float-card">
          <div class="status-row">
            <span class="dot" id="statusDot"></span>
            <div>
              <div class="status-text" id="statusText">待命中</div>
              <div class="status-sub" id="statusSub">點選天數後會載入路線。</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

    async function ensureLeafletAssets(){
      injectLeafletCss(localStorage.getItem(LEAFLET_CSS_KEY) || '');
      const cachedJs = localStorage.getItem(LEAFLET_JS_KEY);
      if (cachedJs) {
        await injectLeafletJs(cachedJs);
        return;
      }
      if (!navigator.onLine) throw new Error('目前離線且此瀏覽器尚未保存地圖引擎。');
      const [cssText, jsText] = await Promise.all([
        fetchText(LEAFLET_CSS_URL),
        fetchText(LEAFLET_JS_URL)
      ]);
      localStorage.setItem(LEAFLET_CSS_KEY, cssText);
      localStorage.setItem(LEAFLET_JS_KEY, jsText);
      injectLeafletCss(cssText);
      await injectLeafletJs(jsText);
    }

    function injectLeafletCss(cssText){
      if (!cssText || document.getElementById('leaflet-inline-style')) return;
      const style = document.createElement('style');
      style.id = 'leaflet-inline-style';
      style.textContent = cssText + '\n.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10192a;color:#f5f7fb;border:1px solid rgba(255,255,255,.1)}\n.leaflet-popup-content{margin:14px 16px;line-height:1.55}\n.leaflet-container{background:#d8e5f2;touch-action:pan-x pan-y pinch-zoom}\n.leaflet-control-zoom a{background:#111a2b !important;color:#fff !important;border-color:rgba(255,255,255,.1) !important}';
      document.head.appendChild(style);
    }

    function injectLeafletJs(jsText){
      return new Promise((resolve, reject) => {
        if (window.L) return resolve();
        const script = document.createElement('script');
        script.text = jsText + '\n//# sourceURL=proha_leaflet_inline.js';
        document.head.appendChild(script);
        setTimeout(() => {
          if (window.L) resolve();
          else reject(new Error('Leaflet 初始化失敗'));
        }, 0);
      });
    }

    }

    function createPersistentTileLayer(urlTemplate, options){
      if (!('caches' in window)) {
        return LRef.tileLayer(urlTemplate, options);
      }
      return new (LRef.TileLayer.extend({
        createTile: function(coords, done) {
          const tile = document.createElement('img');
          tile.alt = '';
          tile.setAttribute('role', 'presentation');
          tile.decoding = 'async';
          tile.loading = 'lazy';
          tile.crossOrigin = 'anonymous';
          LRef.DomEvent.on(tile, 'load', () => {
            const objUrl = tile.dataset.objUrl;
            if (objUrl) {
              setTimeout(() => URL.revokeObjectURL(objUrl), 1500);
              delete tile.dataset.objUrl;
            }
            done(null, tile);
          });
          LRef.DomEvent.on(tile, 'error', (err) => done(err, tile));
          const url = this.getTileUrl(coords);
          getCachedTileSource(url).then(src => {
            tile.src = src || url;
            if (src && src.startsWith('blob:')) tile.dataset.objUrl = src;
          }).catch(() => { tile.src = url; });
          return tile;
        }
      }))(urlTemplate, options);
    }

    async function getCachedTileSource(url){
      if (!('caches' in window)) return null;
      const cache = await caches.open(TILE_CACHE_NAME);
      const match = await cache.match(url);
      if (match) {
        const blob = await match.blob();
        return URL.createObjectURL(blob);
      }
      if (!navigator.onLine) return null;
      try {
        const res = await fetch(url, { mode:'cors', cache:'force-cache' });
        if (!res.ok) throw new Error('tile fetch ' + res.status);
        await cache.put(url, res.clone());
        const blob = await res.blob();
        return URL.createObjectURL(blob);
      } catch (err) {
        console.warn('Tile fetch failed:', url, err);
        return null;
      }
    }

      DAY_DATA.forEach(day => {
        const btn = document.createElement('button');
        btn.className = 'day-btn' + (state.activeDays.has(day.id) ? ' active' : '');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', state.activeDays.has(day.id) ? 'true' : 'false');
        btn.innerHTML = `
          <div class="day-btn-main">
            <span class="num">${day.id}</span>
            <span class="label">${day.title}</span>
          </div>
        `;
        btn.addEventListener('click', () => toggleDay(day.id));
        dayButtonsEl.appendChild(btn);
      });
    }

    async function initActiveDays(){
      const ids = [...state.activeDays].sort((a,b) => a - b);
      if (!ids.length) return;
      for (const id of ids) {
        await ensureDayLayer(id);
      }
      fitVisibleLayers();
    }

    async function toggleDay(dayId){
      if (state.activeDays.has(dayId)) {
        deactivateDay(dayId);
      } else {
        state.activeDays.add(dayId);
        state.focusDay = dayId;
        createDayButtons();
        persistState();
        renderDetails();
        await ensureDayLayer(dayId);
      }
      renderDetails();
    }

    function deactivateDay(dayId){
      state.activeDays.delete(dayId);
      if (state.dayLayers.has(dayId)) {
        map.removeLayer(state.dayLayers.get(dayId));
      }
      if (state.focusDay === dayId) {
        state.focusDay = [...state.activeDays].slice(-1)[0] || null;
      }
      createDayButtons();
      persistState();
      renderDetails();
      if (!state.activeDays.size && state.locateWatchId === null) {
        setStatus('待命中', offlineMeta ? buildOfflineSummary() : '點選天數後會載入路線。', 'ok');
      }
    }

    function persistState(){
      saveJson(STORAGE_KEY, { activeDays:[...state.activeDays], focusDay:state.focusDay, version:APP_VERSION });
      saveJson(COORD_CACHE_KEY, coordCache);
      saveJson(ROUTE_CACHE_KEY, routeCache);
      if (offlineMeta) saveJson(OFFLINE_META_KEY, offlineMeta);
    }

    async function ensureDayLayer(dayId){
      const day = DAY_DATA.find(d => d.id === dayId);
      if (!day) return;
      if (state.dayLayers.has(dayId)) {
        state.dayLayers.get(dayId).addTo(map);
        return;
      }
      if (state.loadingDays.has(dayId)) return;
      state.loadingDays.add(dayId);
      setStatus(`載入 Day ${day.id}：${day.title}`, '正在定位景點與計算步行路徑… 第一次載入會比較久。', 'loading');
      try {
        const resolvedPoints = await resolveDayPoints(day);
        const layer = LRef.layerGroup();
        const routeResult = await buildRoute(day, resolvedPoints, layer);
        state.dayLayers.set(dayId, layer);
        state.dayStats.set(dayId, {
          resolvedPoints,
          ...routeResult,
          googleUrl: createGoogleMapsUrl(resolvedPoints),
        });
        if (state.activeDays.has(dayId)) layer.addTo(map);
        setStatus(`Day ${day.id} 已完成`, offlineMeta ? buildOfflineSummary() : '可繼續疊加其他天數檢查重複。', 'ok');
      } catch (err) {
        console.error(err);
        setStatus(`Day ${day.id} 載入未完整`, '已保留可用點位；部分景點或步行線可能需重新整理後再試。', 'warn');
      } finally {
        state.loadingDays.delete(dayId);
        renderDetails();
      }
    }

    async function resolveDayPoints(day){
      const resolved = [];
      for (let i = 0; i < day.points.length; i++) {
        const point = day.points[i];
        const geo = await resolvePoint(point.query, point.name);
        resolved.push({
          ...point,
          lat: geo?.lat ?? null,
          lng: geo?.lng ?? null,
          ok: !!geo,
          idx: i + 1,
        });
      }
      return resolved;
    }

    async function resolvePoint(query, fallbackName){
      if (coordCache[query]) return coordCache[query];
      if (!navigator.onLine) return null;
      const url = new URL('https://nominatim.openstreetmap.org/search');
      url.searchParams.set('format', 'jsonv2');
      url.searchParams.set('limit', '1');
      url.searchParams.set('countrycodes', 'cz');
      url.searchParams.set('accept-language', 'zh-TW,en');
      url.searchParams.set('q', query);
      try {
        const res = await fetch(url.toString(), { headers: { 'Accept': 'application/json' }, cache: 'force-cache' });
        if (!res.ok) throw new Error('Geocode HTTP ' + res.status);
        const data = await res.json();
        if (!data || !data.length) throw new Error('No geocode result for ' + fallbackName);
        const item = data[0];
        const geo = { lat: round5(Number(item.lat)), lng: round5(Number(item.lon)) };
        coordCache[query] = geo;
        persistState();
        await sleep(250);
        return geo;
      } catch (e) {
        console.warn('Geocode failed:', query, e);
        return null;
      }
    }

    function routeSignature(usable){
      return usable.map(p => `${p.name}@${round5(p.lat)},${round5(p.lng)}`).join('>');
    }

    async function getRouteData(day, points){
      const usable = points.filter(p => p.ok);
      const signature = routeSignature(usable);
      const cached = routeCache[day.id];
      if (cached && cached.signature === signature) return cached;

      let routeGeo = null;
      let legs = [];
      let totalDistance = 0;
      let totalDuration = 0;
      let usedRoutingService = false;

      if (usable.length >= 2 && navigator.onLine) {
        try {
          const coords = usable.map(p => `${p.lng},${p.lat}`).join(';');
          const routeUrl = `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true&annotations=distance,duration`;
          const res = await fetch(routeUrl, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('Routing HTTP ' + res.status);
          const data = await res.json();
          const route = data.routes && data.routes[0];
          if (!route || !route.geometry || !route.geometry.coordinates?.length) throw new Error('No route geometry');
          routeGeo = route.geometry.coordinates.map(([lng, lat]) => [round5(lat), round5(lng)]);
          legs = (route.legs || []).map(leg => ({ distance: Math.round(leg.distance || 0), duration: Math.round(leg.duration || 0) }));
          totalDistance = Math.round(route.distance || 0);
          totalDuration = Math.round(route.duration || 0);
          usedRoutingService = true;
        } catch (e) {
          console.warn('Walking route service failed, fallback to straight lines:', e);
        }
      }

      if (!routeGeo) {
        routeGeo = usable.map(p => [round5(p.lat), round5(p.lng)]);
        totalDistance = Math.round(roughDistanceKm(routeGeo) * 1000);
        totalDuration = Math.round((roughDistanceKm(routeGeo) / 4.5) * 3600);
        legs = usable.slice(1).map((p, i) => {
          const km = haversine(usable[i].lat, usable[i].lng, p.lat, p.lng);
          return { distance: Math.round(km * 1000), duration: Math.round((km / 4.5) * 3600) };
        });
      }

      const packed = { signature, routeGeo, legs, totalDistance, totalDuration, usedRoutingService };
      routeCache[day.id] = packed;
      persistState();
      return packed;
    }

    function createRouteMarker(dayId, idx, latlng, color, isBase){
      const html = isBase
        ? `<div class="base-marker" style="background:${color}">起終</div>`
        : `<div class="poi-marker" style="background:${color}">${dayId}-${idx}</div>`;
      return LRef.marker(latlng, {
        icon: LRef.divIcon({ className:'', html, iconSize: isBase ? [42,42] : [34,34], iconAnchor: isBase ? [21,21] : [17,17] })
      });
    }

    async function buildRoute(day, points, layer){
      const usable = points.filter(p => p.ok);
      const color = COLORS[(day.id - 1) % COLORS.length];
      const labelLatLng = usable[0]?.lat && usable[0]?.lng ? [usable[0].lat, usable[0].lng] : [THEATRE_COORD.lat, THEATRE_COORD.lng];
      const routeData = await getRouteData(day, points);
      const routeGeo = routeData.routeGeo;
      const legs = routeData.legs;

      const polyline = LRef.polyline(routeGeo, {
        color,
        weight: 6,
        opacity: 0.88,
        lineCap: 'round',
        lineJoin: 'round'
      }).bindPopup(`
        <strong>Day ${day.id}｜${day.title}</strong><br>
        總距離：約 ${formatKm(routeData.totalDistance)}<br>
        總步行：約 ${formatDuration(routeData.totalDuration)}<br>
        方式：${routeData.usedRoutingService ? '即時步行路線 / 離線可重播' : '備援折線 / 估算步行時間'}
      `);
      polyline.addTo(layer);

      const labelMarker = LRef.marker(labelLatLng, {
        icon: LRef.divIcon({ className:'', html:`<div class="route-label">Day ${day.id}・${day.title}</div>`, iconSize:[120,32], iconAnchor:[0,0] })
      });
      labelMarker.addTo(layer);

      let usableIndex = 0;
      points.forEach((point, allIndex) => {
        if (!point.ok) return;
        const isBase = allIndex === 0 || allIndex === points.length - 1;
        const marker = createRouteMarker(day.id, allIndex + 1, [point.lat, point.lng], color, isBase);
        const leg = usableIndex > 0 ? legs[usableIndex - 1] : null;
        marker.bindPopup(`
          <strong>Day ${day.id}-${allIndex + 1}｜${escapeHtml(point.name)}</strong><br>
          ${escapeHtml(point.blurb)}<br>
          座標：${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}<br>
          ${leg ? `上一段步行：約 ${formatKm(leg.distance)}・${formatDuration(leg.duration)}<br>` : ''}
          查詢字串：${escapeHtml(point.query)}
        `);
        marker.addTo(layer);
        usableIndex += 1;
      });

      return {
        totalDistance: routeData.totalDistance,
        totalDuration: routeData.totalDuration,
        points,
        legs,
        usedRoutingService: routeData.usedRoutingService,
      };
    }

    async function prepareOfflineBundle(){
      if (state.offlineBusy) return;
      if (!('caches' in window)) {
        setStatus('無法建立離線包', '這個瀏覽器不支援 Cache Storage，無法保存地圖瓦片。', 'warn');
        return;
      }
      if (!navigator.onLine) {
        setStatus('目前離線', '請先連網，才能下載這 10 天旅圖的離線地圖範圍。', 'warn');
        return;
      }
      state.offlineBusy = true;
      updateOfflineButton();
      try {
        setStatus('建立離線包', '正在解析 10 天景點與步行路線…', 'loading');
        const coords = [];
        for (let i = 0; i < DAY_DATA.length; i++) {
          const day = DAY_DATA[i];
          setStatus(`建立離線包 ${i+1}/${DAY_DATA.length}`, `正在處理 Day ${day.id}：${day.title}`, 'loading');
          const points = await resolveDayPoints(day);
          points.filter(p => p.ok).forEach(p => coords.push([p.lat, p.lng]));
          const routeData = await getRouteData(day, points);
          (routeData.routeGeo || []).forEach(([lat, lng]) => coords.push([lat, lng]));
        }
        if (!coords.length) throw new Error('尚未取得可用座標，無法建立離線範圍。');
        const bounds = padBounds(coordsBounds(coords), 0.12);
        const summary = await warmTilesForBounds(bounds, OFFLINE_ZOOMS, (done, total, hits, failed) => {
          setStatus('下載離線地圖', `瓦片 ${done}/${total} · 已保存 ${hits} · 失敗 ${failed}`, 'loading');
        });
        offlineMeta = {
          preparedAt: new Date().toISOString(),
          tileCount: summary.saved,
          totalChecked: summary.total,
          days: DAY_DATA.length,
          zooms: OFFLINE_ZOOMS,
          bounds,
        };
        persistState();
        updateOfflineButton();
        setStatus('離線包已完成', buildOfflineSummary(), 'ok');
      } catch (err) {
        console.error(err);
        setStatus('離線包建立失敗', err.message || '請稍後再試。', 'error');
      } finally {
        state.offlineBusy = false;
        updateOfflineButton();
      }
    }

    async function warmTilesForBounds(bounds, zooms, onProgress){
      const cache = await caches.open(TILE_CACHE_NAME);
      const urls = new Set();
      zooms.forEach(z => {
        const min = latLngToTile(bounds.maxLat, bounds.minLng, z);
        const max = latLngToTile(bounds.minLat, bounds.maxLng, z);
        for (let x = min.x; x <= max.x; x++) {
          for (let y = min.y; y <= max.y; y++) {
            urls.add(TILE_URL_TEMPLATE.replace('{z}', z).replace('{x}', x).replace('{y}', y));
          }
        }
      });
      const list = [...urls];
      let done = 0;
      let saved = 0;
      let failed = 0;
      const concurrency = 6;
      let index = 0;
      async function worker(){
        while (index < list.length) {
          const current = list[index++];
          try {
            const existing = await cache.match(current);
            if (existing) {
              saved += 1;
            } else {
              const res = await fetch(current, { mode:'cors', cache:'no-cache' });
              if (!res.ok) throw new Error('tile ' + res.status);
              await cache.put(current, res.clone());
              saved += 1;
            }
          } catch (err) {
            failed += 1;
          } finally {
            done += 1;
            if (onProgress) onProgress(done, list.length, saved, failed);
          }
        }
      }
      await Promise.all(Array.from({length: concurrency}, worker));
      return { total: list.length, saved, failed };
    }

    function coordsBounds(coords){
      let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
      coords.forEach(([lat, lng]) => {
        minLat = Math.min(minLat, lat); maxLat = Math.max(maxLat, lat);
        minLng = Math.min(minLng, lng); maxLng = Math.max(maxLng, lng);
      });
      return { minLat, maxLat, minLng, maxLng };
    }

    function padBounds(bounds, ratio){
      const latSpan = Math.max(bounds.maxLat - bounds.minLat, 0.02);
      const lngSpan = Math.max(bounds.maxLng - bounds.minLng, 0.02);
      const latPad = latSpan * ratio;
      const lngPad = lngSpan * ratio;
      return {
        minLat: bounds.minLat - latPad,
        maxLat: bounds.maxLat + latPad,
        minLng: bounds.minLng - lngPad,
        maxLng: bounds.maxLng + lngPad,
      };
    }

    function latLngToTile(lat, lng, zoom){
      const n = 2 ** zoom;
      const x = Math.floor((lng + 180) / 360 * n);
      const latRad = lat * Math.PI / 180;
      const y = Math.floor((1 - Math.asinh(Math.tan(latRad)) / Math.PI) / 2 * n);
      return { x, y };
    }

    function toggleLocationTracking(){
      if (state.locateWatchId !== null) {
        stopLocationTracking();
        return;
      }
      if (!navigator.geolocation) {
        setStatus('瀏覽器不支援定位', '這台裝置的瀏覽器沒有 Geolocation 功能。', 'warn');
        return;
      }
      updateLocateButton();
      setStatus('GPS 啟動中', '請允許位置權限；定位成功後會在地圖上顯示你的位置。', 'loading');
      state.locateWatchId = navigator.geolocation.watchPosition(handleLocationSuccess, handleLocationError, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 5000,
      });
      updateLocateButton();
    }

    function stopLocationTracking(){
      if (state.locateWatchId !== null) navigator.geolocation.clearWatch(state.locateWatchId);
      state.locateWatchId = null;
      if (state.userMarker) { map.removeLayer(state.userMarker); state.userMarker = null; }
      if (state.userAccuracy) { map.removeLayer(state.userAccuracy); state.userAccuracy = null; }
      updateLocateButton();
      setStatus('GPS 已關閉', offlineMeta ? buildOfflineSummary() : '已移除你的位置標記。', 'ok');
    }

    function handleLocationSuccess(position){
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy || 0;
      const latlng = [lat, lng];
      if (!state.userMarker) {
        state.userMarker = LRef.marker(latlng, {
          icon: LRef.divIcon({ className:'', html:'<div class="user-dot"></div>', iconSize:[18,18], iconAnchor:[9,9] })
        }).bindPopup('你目前的位置');
        state.userMarker.addTo(map);
      } else {
        state.userMarker.setLatLng(latlng);
      }
      if (!state.userAccuracy) {
        state.userAccuracy = LRef.circle(latlng, { radius: accuracy, color:'#2f8cff', weight:1.5, fillColor:'#2f8cff', fillOpacity:0.12 }).addTo(map);
      } else {
        state.userAccuracy.setLatLng(latlng).setRadius(accuracy);
      }
      if (!state.didAutoCenterOnUser) {
        state.didAutoCenterOnUser = true;
        map.flyTo(latlng, Math.max(map.getZoom(), 15), { duration: 0.6 });
      }
      setStatus('已顯示你的位置', `GPS 精度約 ±${Math.round(accuracy)} 公尺。${offlineMeta ? ' ' + buildOfflineSummary() : ''}`, 'ok');
    }

    function handleLocationError(err){
      console.warn(err);
      state.locateWatchId = null;
      updateLocateButton();
      const messages = {
        1: '你拒絕了定位權限。',
        2: '目前無法取得位置，可能是 GPS / 網路訊號不足。',
        3: '定位逾時，請稍後再試。'
      };
      setStatus('定位失敗', messages[err.code] || '瀏覽器未提供定位資訊。若仍失敗，請改用 HTTPS 或 localhost 開啟。', 'warn');
    }

    function createGoogleMapsUrl(points){
      const usable = points.filter(p => p.ok);
      if (usable.length < 2) return null;
      const origin = `${usable[0].lat},${usable[0].lng}`;
      const destination = `${usable[usable.length - 1].lat},${usable[usable.length - 1].lng}`;
      const waypoints = usable.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|');
      const url = new URL('https://www.google.com/maps/dir/');
      url.searchParams.set('api', '1');
      url.searchParams.set('origin', origin);
      url.searchParams.set('destination', destination);
      url.searchParams.set('travelmode', 'walking');
      if (waypoints) url.searchParams.set('waypoints', waypoints);
      return url.toString();
    }

    function formatDuration(sec){
      const mins = Math.round(sec / 60);
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h && m) return `${h} 小時 ${m} 分`;
      if (h) return `${h} 小時`;
      return `${m} 分`;
    }
    function formatKm(meters){ return `${(meters / 1000).toFixed(1)} km`; }
    function roughDistanceKm(latlngs){
      let sum = 0;
      for (let i = 1; i < latlngs.length; i++) {
        sum += haversine(latlngs[i-1][0], latlngs[i-1][1], latlngs[i][0], latlngs[i][1]);
      }
      return sum;
    }
    function haversine(lat1, lon1, lat2, lon2){
      const R = 6371;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
    function round5(n){ return Number(Number(n).toFixed(5)); }

    function renderDetails(){
      const activeIds = [...state.activeDays].sort((a,b) => a - b);
      if (!activeIds.length) {
        detailWrap.innerHTML = '<div class="detail-empty">尚未顯示任何一天，請先點選天數。</div>';
        return;
      }

      const overlaps = computeOverlaps(activeIds);
      const cards = activeIds.map(id => {
        const day = DAY_DATA.find(d => d.id === id);
        const stats = state.dayStats.get(id);
        const color = COLORS[(id - 1) % COLORS.length];
        const points = stats?.points || day.points.map((p, i) => ({ ...p, idx:i+1, ok:false }));
        const legs = stats?.legs || [];
        let usableCounter = 0;
        const listHtml = points.map((p, idx) => {
          let legHtml = '';
          if (p.ok && usableCounter > 0) {
            const leg = legs[usableCounter - 1];
            if (leg) legHtml = `<span>上一段：約 ${formatKm(leg.distance)}・${formatDuration(leg.duration)}</span>`;
          }
          if (p.ok) usableCounter += 1;
          return `
            <div class="poi-item">
              <div class="poi-top">
                <div class="poi-name">${idx + 1}. ${escapeHtml(p.name)}</div>
                <div class="poi-code">Day ${id}-${idx + 1}</div>
              </div>
              <div class="poi-desc">${escapeHtml(p.blurb)}</div>
              <div class="poi-meta">
                ${p.ok ? `<span>座標 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span>` : '<span>座標載入中 / 暫未取得</span>'}
                ${legHtml}
              </div>
            </div>
          `;
        }).join('');

        const overlapList = overlaps.get(id);
        const overlapHtml = overlapList?.length
          ? `<div class="overlap-box"><strong>和其他已開路線重複的景點名：</strong>${overlapList.join('、')}</div>`
          : '';

        return `
          <section class="day-card">
            <h3><span class="swatch" style="background:${color}"></span>Day ${id}｜${escapeHtml(day.title)}</h3>
            <div class="theme">${escapeHtml(day.theme)}</div>
            <p class="intro">${escapeHtml(day.intro)}</p>
            <div class="stats">
              <span class="stat">規劃距離 ${day.plannedKm}</span>
              <span class="stat">${day.points.length} 個節點</span>
              <span class="stat">${stats ? `總步行 ${formatKm(stats.totalDistance)}・${formatDuration(stats.totalDuration)}` : '路線計算中'}</span>
              <span class="stat">${stats ? (stats.usedRoutingService ? '即時步行路線 / 已可快取' : '備援折線估算') : '等待服務回應'}</span>
            </div>
            <div class="mini-actions">
              ${stats?.googleUrl ? `<a href="${stats.googleUrl}" target="_blank" rel="noopener">Google Maps 步行導航</a>` : ''}
              <button type="button" onclick="window.prohaFitDay(${id})">縮放到這一天</button>
              <button type="button" onclick="window.prohaToggle(${id})">${state.activeDays.has(id) ? '隱藏這一天' : '顯示這一天'}</button>
            </div>
            <div class="poi-list">${listHtml}</div>
            ${overlapHtml}
          </section>
        `;
      }).join('');
      detailWrap.innerHTML = cards;
    }

    function computeOverlaps(activeIds){
      const pointOwners = new Map();
      activeIds.forEach(id => {
        const day = DAY_DATA.find(d => d.id === id);
        day.points.forEach((p, idx) => {
          if (idx === 0 || idx === day.points.length - 1) return;
          const key = p.name.trim();
          if (!pointOwners.has(key)) pointOwners.set(key, []);
          pointOwners.get(key).push(id);
        });
      });
      const overlapsByDay = new Map(activeIds.map(id => [id, []]));
      pointOwners.forEach((owners, pointName) => {
        if (owners.length > 1) {
          owners.forEach(id => overlapsByDay.get(id).push(pointName));
        }
      });
      return overlapsByDay;
    }

    function fitVisibleLayers(){
      const groups = [...state.activeDays]
        .map(id => state.dayLayers.get(id))
        .filter(Boolean);
      if (state.userMarker) groups.push(state.userMarker);
      if (state.userAccuracy) groups.push(state.userAccuracy);
      if (!groups.length) {
        map.setView([THEATRE_COORD.lat, THEATRE_COORD.lng], 14);
        return;
      }
      const master = LRef.featureGroup(groups);
      const bounds = master.getBounds();
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.08));
    }

    function applyPanelState(collapsed){
      panelEl.classList.toggle('collapsed', collapsed);
      panelToggle.textContent = collapsed ? '≡' : '×';
      panelToggle.setAttribute('aria-expanded', String(!collapsed));
      panelToggle.setAttribute('aria-label', collapsed ? '展開操作面板' : '收合操作面板');
      saveJson(PANEL_KEY, { collapsed });
    }

    updateLocateButton();
  })();
  </script>
</body>
