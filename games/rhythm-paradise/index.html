<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luminaria Rhythm Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="menu hidden" id="menu">
      <div class="menu-head">
        <p class="kicker">Luminaria Rhythm Lab</p>
        <h1>五關 + Remix</h1>
        <p>每關有不同角色、動作與輸入規則。Remix 會切換五關特色並重排節奏。</p>
      </div>
      <div class="level-grid" id="levelGrid"></div>
    </section>

    <section class="game" id="game">
      <div class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="上一關">←</button>
        <div>
          <div class="game-title" id="gameTitle"></div>
          <div class="game-rule" id="gameRule"></div>
        </div>
        <div class="togglebar">
          <button class="toggle-btn" id="feedbackToggle" aria-pressed="false">回饋 OFF</button>
          <button class="toggle-btn" id="accuracyToggle" aria-pressed="false">答對率 OFF</button>
        </div>
        <div class="scorebox">
          <span id="scoreText">--</span>
          <small id="comboText">hidden</small>
        </div>
      </div>

      <canvas id="stage" width="1280" height="720"></canvas>

      <div class="input-row" id="inputRow"></div>

      <div class="nav-row" id="navRow">
        <button class="nav-btn" id="prevLevelBtn">← 上一關</button>
        <button class="nav-btn" id="restartLevelBtn">↻ 本關重來</button>
        <span class="level-status" id="levelStatusText">1 / 6</span>
        <button class="nav-btn" id="nextLevelBtn">下一關 →</button>
      </div>

      <div class="result hidden" id="result">
        <h2 id="rankText">OK</h2>
        <p id="detailText"></p>
        <button class="primary" id="retryBtn">再玩一次</button>
        <button class="secondary" id="menuBtn">下一關</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
