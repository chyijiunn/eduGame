<!doctype html>
<html lang="zh-Hant">
<head>
<script src="/eduGame/ga4.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#181818" />
<meta name="application-name" content="Marionette Designer" />
<meta name="version" content="0.1" />
<title>Marionette Designer v0.1</title>
<style>
  :root{
    --bg:#181818;
    --panel:#202020;
    --panel2:#242424;
    --fg:#f3f3f3;
    --muted:#929292;
    --dim:#555;
    --line:#d9d9d9;
    --soft:#2c2c2c;
    --danger:#bdbdbd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans TC",monospace;min-height:100%;}
  body{overflow-x:hidden}
  button,input{font:inherit}
  button{border:0;background:#2d2d2d;color:var(--fg);min-width:38px;height:36px;border-radius:9px;cursor:pointer;touch-action:manipulation}
  button:hover{background:#383838}
  button.active{background:#f1f1f1;color:#151515}
  button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .topbar{position:fixed;z-index:30;right:12px;top:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .version{font-size:11px;color:#777;padding:0 4px;user-select:none}
  .help-btn{font-weight:800;font-size:16px;width:36px}
  .stage-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;padding:12px 12px 40px;align-items:start}
  .panel{min-width:0;background:transparent;position:relative;padding:18px 4px 22px;}
  .panel:nth-child(-n+2){min-height:calc(100vh - 18px)}
  .panel:nth-child(n+3){min-height:78vh;padding-top:26px}
  .panel-caption{position:absolute;left:8px;top:5px;color:#737373;font-size:10px;letter-spacing:.08em;text-transform:uppercase;user-select:none}
  .design-toolbar{height:42px;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding-right:6px}
  .design-toolbar button{font-weight:700;min-width:42px;padding:0 10px}
  .design-cols{height:calc(100vh - 86px);min-height:560px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:stretch}
  .subview{position:relative;min-width:0;background:var(--panel);border-radius:14px;overflow:hidden}
  .subview-title{position:absolute;z-index:2;top:8px;left:10px;color:#777;font-size:10px;letter-spacing:.08em;pointer-events:none}
  .editor-svg,.cut-svg{display:block;width:100%;height:100%;touch-action:none;user-select:none}
  .dimension-rail{padding:34px 12px 12px;overflow:auto}
  .dim-item{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #292929}
  .dim-item:last-child{border-bottom:0}
  .dim-name{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dim-line{height:16px;position:relative}
  .dim-line:before{content:"";position:absolute;left:0;right:0;top:8px;border-top:1px solid #777}
  .dim-line:after{content:"";position:absolute;left:0;top:5px;width:3px;height:7px;border-left:1px solid #aaa;border-right:1px solid #aaa;box-shadow:calc(100% - 2px) 0 0 -1px #aaa}
  .dim-values{grid-column:2;font-size:10px;color:#6f6f6f;margin-top:-5px}
  .cut-panel-inner{height:calc(100vh - 52px);min-height:620px;background:var(--panel);border-radius:14px;position:relative;overflow:hidden}
  .cut-info{position:absolute;top:10px;right:12px;z-index:3;font-size:10px;color:#777;background:#202020cc;padding:4px 7px;border-radius:6px;pointer-events:none}
  .material-wrap{background:var(--panel);border-radius:14px;min-height:64vh;overflow:auto;padding:8px 10px 18px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{position:sticky;top:0;background:#202020;color:#777;font-size:10px;font-weight:500;padding:10px 6px;text-align:right;z-index:1}
  th:first-child,td:first-child{text-align:left}
  td{padding:7px 6px;border-top:1px solid #2b2b2b;text-align:right;vertical-align:middle}
  .part-code{display:inline-flex;width:28px;color:#747474}
  .part-name{color:#e5e5e5}
  .qty{color:#777}
  .num-input{width:70px;background:#191919;border:1px solid #343434;color:#f2f2f2;border-radius:7px;padding:7px 7px;text-align:right}
  .num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .model-wrap{height:70vh;min-height:560px;background:var(--panel);border-radius:14px;position:relative;overflow:hidden;touch-action:none}
  #model3d{width:100%;height:100%;display:block;touch-action:none}
  .model-hint{position:absolute;left:12px;bottom:10px;color:#646464;font-size:10px;pointer-events:none}
  .model-badge{position:absolute;right:12px;bottom:10px;color:#858585;font-size:10px;pointer-events:none}
  .modal-backdrop{position:fixed;inset:0;background:#0009;z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
  .modal-backdrop.show{display:flex}
  .modal{width:min(820px,96vw);height:min(78vh,760px);background:#202020;border-radius:16px;box-shadow:0 20px 80px #000c;display:flex;flex-direction:column;overflow:hidden}
  .modal-head{height:52px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 10px;border-bottom:1px solid #2c2c2c}
  .modal-head button{width:38px}
  .modal-body{padding:18px 22px 30px;overflow:auto;line-height:1.65;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px}
  .modal-body h1,.modal-body h2,.modal-body h3{line-height:1.25;margin:1.2em 0 .55em}
  .modal-body h1{font-size:24px}.modal-body h2{font-size:19px}.modal-body h3{font-size:16px}
  .modal-body code{background:#151515;padding:2px 5px;border-radius:5px;font-family:ui-monospace,monospace}
  .modal-body pre{background:#151515;padding:12px;border-radius:9px;overflow:auto}
  .readme-warn{color:#aaa;background:#181818;padding:8px 10px;border-radius:8px;margin-bottom:12px;font-size:12px}
  #printSheet{display:none;background:white;color:black}
  @media(max-width:980px){
    .stage-grid{grid-template-columns:1fr;gap:0;padding:10px}
    .panel:nth-child(-n+2){min-height:88vh}
    .panel:nth-child(n+3){min-height:auto}
    .design-cols{height:78vh;min-height:560px;grid-template-columns:.9fr 1.05fr 1.05fr}
    .cut-panel-inner{height:72vh;min-height:520px}
    .model-wrap{height:72vh;min-height:520px}
  }
  @media(max-width:620px){
    .design-cols{grid-template-columns:.72fr 1fr 1fr;gap:5px;min-height:500px}
    .dimension-rail{padding:32px 7px 8px}
    .dim-item{grid-template-columns:1fr;gap:2px;padding:6px 0}
    .dim-line{display:none}.dim-values{grid-column:1;margin:0}
    .num-input{width:58px;padding:6px 4px}
    th,td{padding-left:4px;padding-right:4px}
  }
  @media print{
    @page{size:A4 portrait;margin:6mm}
    body{background:white!important;color:black!important}
    body>*:not(#printSheet){display:none!important}
    #printSheet{display:block!important;width:198mm;height:285mm;overflow:hidden}
    #printSheet svg{display:block;width:198mm;height:285mm}
  }
</style>
</head>
<body>
  <div class="topbar"><span class="version">v0.1</span><button id="helpBtn" class="help-btn" title="說明">?</button></div>

  <main class="stage-grid">
    <section class="panel" id="designPanel">
      <span class="panel-caption">01</span>
      <div class="design-toolbar">
        <button id="gapBtn" class="active" title="3 mm gap 開 / 關">↕</button>
        <button id="packBtn" title="自動排列切割方塊">▦</button>
        <button id="printBtn" title="A4 1:1 輸出">A4</button>
      </div>
      <div class="design-cols">
        <div class="subview dimension-rail" id="dimensionRail"><span class="subview-title">mm</span></div>
        <div class="subview"><span class="subview-title">FRONT</span><svg id="frontSvg" class="editor-svg" viewBox="0 0 220 560" aria-label="Front view"></svg></div>
        <div class="subview"><span class="subview-title">SIDE</span><svg id="sideSvg" class="editor-svg" viewBox="0 0 220 560" aria-label="Side view"></svg></div>
      </div>
    </section>

    <section class="panel" id="cutPanel">
      <span class="panel-caption">02</span>
      <div class="cut-panel-inner">
        <div class="cut-info">100 mm</div>
        <svg id="cutSvg" class="cut-svg" viewBox="0 0 130 400" aria-label="Cut layout"></svg>
      </div>
    </section>

    <section class="panel" id="materialPanel">
      <span class="panel-caption">03</span>
      <div class="material-wrap">
        <table>
          <thead><tr><th>material</th><th>qty</th><th>H</th><th>W</th><th>D</th></tr></thead>
          <tbody id="materialBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="modelPanel">
      <span class="panel-caption">04</span>
      <div class="model-wrap" id="modelWrap">
        <canvas id="model3d"></canvas>
        <div class="model-hint">drag · wheel / pinch</div>
        <div class="model-badge">3D</div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="helpModal" role="dialog" aria-modal="true" aria-label="操作說明">
    <div class="modal">
      <div class="modal-head"><button id="reloadReadme" title="重新讀取 README.md">↻</button><button id="closeHelp" title="關閉">×</button></div>
      <div class="modal-body" id="readmeBody"></div>
    </div>
  </div>

  <div id="printSheet"></div>

<script>
(() => {
  'use strict';

  const VERSION = '0.1';
  const MM_GAP = 3;
  const NECK_EMBED = 5;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  // Default values: H/W are based on the supplied size sketch; D follows the supplied rough-blank reference.
  const parts = {
    head:      { code:'HD', name:'head',      h:45, w:32, d:32, qty:1 },
    neck:      { code:'NK', name:'neck',      h:18, w:15, d:15, qty:1 },
    torso:     { code:'TS', name:'torso',     h:55, w:40, d:25, qty:1 },
    pelvis:    { code:'PV', name:'pelvis',    h:35, w:40, d:25, qty:1 },
    upperArm:  { code:'UA', name:'upper arm', h:35, w:15, d:15, qty:2 },
    forearm:   { code:'FA', name:'forearm',   h:30, w:13, d:13, qty:2 },
    palm:      { code:'PM', name:'palm',      h:20, w:15, d:12, qty:2 },
    thigh:     { code:'TH', name:'thigh',     h:50, w:20, d:20, qty:2 },
    lowerLeg:  { code:'LL', name:'lower leg', h:50, w:18, d:18, qty:2 },
    shoe:      { code:'SH', name:'shoe',      h:15, w:18, d:37, qty:2 }
  };
  const partOrder = ['head','neck','torso','pelvis','upperArm','forearm','palm','thigh','lowerLeg','shoe'];
  let gapEnabled = true;
  let autoPacked = true;
  let packManual = Object.create(null);
  let selectedPart = null;

  const $ = s => document.querySelector(s);
  const frontSvg = $('#frontSvg');
  const sideSvg = $('#sideSvg');
  const cutSvg = $('#cutSvg');
  const dimensionRail = $('#dimensionRail');
  const materialBody = $('#materialBody');
  const gapBtn = $('#gapBtn');
  const packBtn = $('#packBtn');
  const printBtn = $('#printBtn');

  function el(tag, attrs={}, text=''){
    const n = document.createElementNS(SVG_NS, tag);
    for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
    if(text) n.textContent = text;
    return n;
  }
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const round1 = v => Math.round(v*10)/10;

  function currentGap(){ return gapEnabled ? MM_GAP : 0; }

  function computeFrontLayout(withGap=gapEnabled){
    const g = withGap ? MM_GAP : 0;
    const p = parts;
    const boxes = [];
    const headY = 0;
    const neckY = headY + p.head.h - NECK_EMBED;
    const torsoY = neckY + p.neck.h - NECK_EMBED;
    const pelvisY = torsoY + p.torso.h + g;
    const thighY = pelvisY + p.pelvis.h + g;
    const lowerY = thighY + p.thigh.h + g;
    const shoeY = lowerY + p.lowerLeg.h + g;
    const totalH = shoeY + p.shoe.h;
    const shoulderY = torsoY + 8;
    const upperY = shoulderY;
    const foreY = upperY + p.upperArm.h + g;
    const palmY = foreY + p.forearm.h + g;
    const legCX = p.thigh.w/2 + g/2;
    const armCX = p.torso.w/2 + g + p.upperArm.w/2;

    boxes.push({id:'head',key:'head',x:0,y:headY,w:p.head.w,h:p.head.h});
    boxes.push({id:'neck',key:'neck',x:0,y:neckY,w:p.neck.w,h:p.neck.h});
    boxes.push({id:'torso',key:'torso',x:0,y:torsoY,w:p.torso.w,h:p.torso.h});
    boxes.push({id:'pelvis',key:'pelvis',x:0,y:pelvisY,w:p.pelvis.w,h:p.pelvis.h});
    for(const side of [-1,1]){
      const s = side<0?'L':'R';
      boxes.push({id:`${s}-upperArm`,key:'upperArm',x:side*armCX,y:upperY,w:p.upperArm.w,h:p.upperArm.h,side});
      boxes.push({id:`${s}-forearm`,key:'forearm',x:side*armCX,y:foreY,w:p.forearm.w,h:p.forearm.h,side});
      boxes.push({id:`${s}-palm`,key:'palm',x:side*armCX,y:palmY,w:p.palm.w,h:p.palm.h,side});
      boxes.push({id:`${s}-thigh`,key:'thigh',x:side*legCX,y:thighY,w:p.thigh.w,h:p.thigh.h,side});
      boxes.push({id:`${s}-lowerLeg`,key:'lowerLeg',x:side*legCX,y:lowerY,w:p.lowerLeg.w,h:p.lowerLeg.h,side});
      boxes.push({id:`${s}-shoe`,key:'shoe',x:side*legCX,y:shoeY,w:p.shoe.w,h:p.shoe.h,side});
    }
    return {boxes,totalH,torsoY,pelvisY,thighY,lowerY,shoeY};
  }

  function computeSideLayout(withGap=gapEnabled){
    const g = withGap ? MM_GAP : 0;
    const p = parts;
    const boxes=[];
    const headY=0;
    const neckY=p.head.h-NECK_EMBED;
    const torsoY=neckY+p.neck.h-NECK_EMBED;
    const pelvisY=torsoY+p.torso.h+g;
    const thighY=pelvisY+p.pelvis.h+g;
    const lowerY=thighY+p.thigh.h+g;
    const shoeY=lowerY+p.lowerLeg.h+g;
    const totalH=shoeY+p.shoe.h;
    const armX=p.torso.d/2+g+p.upperArm.d/2;
    const upperY=torsoY+8;
    const foreY=upperY+p.upperArm.h+g;
    const palmY=foreY+p.forearm.h+g;

    boxes.push({id:'head',key:'head',x:0,y:headY,w:p.head.d,h:p.head.h});
    boxes.push({id:'neck',key:'neck',x:0,y:neckY,w:p.neck.d,h:p.neck.h});
    boxes.push({id:'torso',key:'torso',x:0,y:torsoY,w:p.torso.d,h:p.torso.h});
    boxes.push({id:'pelvis',key:'pelvis',x:0,y:pelvisY,w:p.pelvis.d,h:p.pelvis.h});
    // Back-side pair is shown faintly and slightly offset so both pieces are apparent.
    boxes.push({id:'B-upperArm',key:'upperArm',x:-armX*.28,y:upperY,w:p.upperArm.d,h:p.upperArm.h,ghost:true});
    boxes.push({id:'B-forearm',key:'forearm',x:-armX*.28,y:foreY,w:p.forearm.d,h:p.forearm.h,ghost:true});
    boxes.push({id:'B-palm',key:'palm',x:-armX*.28,y:palmY,w:p.palm.d,h:p.palm.h,ghost:true});
    boxes.push({id:'F-upperArm',key:'upperArm',x:armX,y:upperY,w:p.upperArm.d,h:p.upperArm.h});
    boxes.push({id:'F-forearm',key:'forearm',x:armX,y:foreY,w:p.forearm.d,h:p.forearm.h});
    boxes.push({id:'F-palm',key:'palm',x:armX,y:palmY,w:p.palm.d,h:p.palm.h});
    boxes.push({id:'B-thigh',key:'thigh',x:-3,y:thighY,w:p.thigh.d,h:p.thigh.h,ghost:true});
    boxes.push({id:'B-lowerLeg',key:'lowerLeg',x:-3,y:lowerY,w:p.lowerLeg.d,h:p.lowerLeg.h,ghost:true});
    boxes.push({id:'B-shoe',key:'shoe',x:-4,y:shoeY,w:p.shoe.d,h:p.shoe.h,ghost:true});
    boxes.push({id:'F-thigh',key:'thigh',x:3,y:thighY,w:p.thigh.d,h:p.thigh.h});
    boxes.push({id:'F-lowerLeg',key:'lowerLeg',x:3,y:lowerY,w:p.lowerLeg.d,h:p.lowerLeg.h});
    boxes.push({id:'F-shoe',key:'shoe',x:5,y:shoeY,w:p.shoe.d,h:p.shoe.h});
    return {boxes,totalH};
  }

  function renderDimensionRail(){
    dimensionRail.querySelectorAll('.dim-item').forEach(n=>n.remove());
    for(const key of partOrder){
      const p=parts[key];
      const row=document.createElement('div'); row.className='dim-item';
      row.innerHTML=`<div class="dim-name">${p.name}</div><div class="dim-line"></div><div class="dim-values">H ${p.h}${key==='neck'?` (visible ${round1(p.h-NECK_EMBED*2)})`:''} · W ${p.w} · D ${p.d} mm${p.qty>1?` · ×${p.qty}`:''}</div>`;
      dimensionRail.appendChild(row);
    }
  }

  const dragState = {active:false};
  function svgPoint(svg,e){
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function addResizeHandles(svg, group, rect, box, axis, scale){
    if(box.ghost) return;
    const dirs=[
      ['n',rect.x,rect.y,rect.w,10],['s',rect.x,rect.y+rect.h-10,rect.w,10],
      ['w',rect.x,rect.y,10,rect.h],['e',rect.x+rect.w-10,rect.y,10,rect.h],
      ['nw',rect.x-2,rect.y-2,14,14],['ne',rect.x+rect.w-12,rect.y-2,14,14],
      ['sw',rect.x-2,rect.y+rect.h-12,14,14],['se',rect.x+rect.w-12,rect.y+rect.h-12,14,14]
    ];
    for(const [dir,x,y,w,h] of dirs){
      const hit=el('rect',{x,y,width:w,height:h,fill:'transparent','data-dir':dir,'data-key':box.key,'data-axis':axis,style:'pointer-events:all'});
      hit.addEventListener('pointerdown', e=>startResize(e,svg,box.key,axis,dir,scale));
      group.appendChild(hit);
    }
    if(selectedPart===box.key){
      for(const [dir,x,y] of [['nw',rect.x,rect.y],['ne',rect.x+rect.w,rect.y],['sw',rect.x,rect.y+rect.h],['se',rect.x+rect.w,rect.y+rect.h]]){
        group.appendChild(el('rect',{x:x-3,y:y-3,width:6,height:6,fill:'#f2f2f2',rx:1,'pointer-events':'none'}));
      }
    }
  }

  function startResize(e,svg,key,axis,dir,scale){
    e.preventDefault(); e.stopPropagation();
    const pt=svgPoint(svg,e);
    selectedPart=key;
    Object.assign(dragState,{active:true,svg,pointerId:e.pointerId,key,axis,dir,scale,startPt:pt,startH:parts[key].h,startHor:axis==='front'?parts[key].w:parts[key].d});
    svg.setPointerCapture(e.pointerId);
    render2D();
  }

  function moveResize(e){
    if(!dragState.active || e.pointerId!==dragState.pointerId) return;
    const {svg,key,axis,dir,scale,startPt,startH,startHor}=dragState;
    const pt=svgPoint(svg,e);
    const dx=(pt.x-startPt.x)/scale, dy=(pt.y-startPt.y)/scale;
    let h=startH, hor=startHor;
    if(dir.includes('e')) hor=startHor+dx;
    if(dir.includes('w')) hor=startHor-dx;
    if(dir.includes('s')) h=startH+dy;
    if(dir.includes('n')) h=startH-dy;
    h=round1(clamp(h,5,160)); hor=round1(clamp(hor,5,100));
    parts[key].h=h;
    if(axis==='front') parts[key].w=hor; else parts[key].d=hor;
    if(autoPacked) packManual={};
    updateMaterialInputsFor(key);
    renderAll(false);
  }
  function endResize(e){
    if(!dragState.active || e.pointerId!==dragState.pointerId) return;
    try{dragState.svg.releasePointerCapture(e.pointerId)}catch(_){ }
    dragState.active=false;
    renderAll(false);
  }
  window.addEventListener('pointermove',moveResize,{passive:false});
  window.addEventListener('pointerup',endResize);
  window.addEventListener('pointercancel',endResize);

  function renderEditor(svg,mode){
    svg.innerHTML='';
    const layout=mode==='front'?computeFrontLayout():computeSideLayout();
    const scale=Math.min(1.62, 485/layout.totalH);
    const ox=110, oy=44;
    const axis=mode;
    const guide=el('line',{x1:ox,y1:32,x2:ox,y2:oy+layout.totalH*scale+12,stroke:'#3b3b3b','stroke-dasharray':'3 4','stroke-width':1});
    svg.appendChild(guide);

    const boxes=layout.boxes.slice().sort((a,b)=>(a.ghost? -1:1)-(b.ghost?-1:1));
    for(const box of boxes){
      const rx=ox+(box.x-box.w/2)*scale, ry=oy+box.y*scale, rw=box.w*scale, rh=box.h*scale;
      const g=el('g',{'data-key':box.key});
      const selected=selectedPart===box.key;
      const base=el('rect',{x:rx,y:ry,width:rw,height:rh,rx:2,fill:box.ghost?'#262626':selected?'#efefef':'#d7d7d7',stroke:selected?'#fff':'#858585','stroke-width':selected?1.8:1,opacity:box.ghost?.23:.94});
      g.appendChild(base);

  function physicalBlocks(){
    const arr=[];
    for(const key of partOrder){
      const p=parts[key];
      for(let i=0;i<p.qty;i++) arr.push({key,code:p.code,index:i,w:p.w,h:p.h,d:p.d,id:`${key}-${i}`});
    }
    return arr;
  }

  function autoPackBlocks(){
    const blocks=physicalBlocks().sort((a,b)=>b.h-a.h || b.w-a.w);
    const limit=100, gap=1;
    let x=0,y=0,rowH=0,maxY=0;
    const out={};
    for(const b of blocks){
      if(x>0 && x+b.w>limit){ y+=rowH+gap; x=0; rowH=0; }
      out[b.id]={x,y};
      x+=b.w+gap; rowH=Math.max(rowH,b.h); maxY=Math.max(maxY,y+b.h);
    }
    return {pos:out,height:maxY};
  }

  const cutDrag={active:false};
  function renderCut(){

    const blocks=physicalBlocks();

    const vbH=Math.max(340,maxH+24);
    cutSvg.setAttribute('viewBox',`0 0 124 ${vbH}`);
    cutSvg.appendChild(el('rect',{x:12,y:10,width:100,height:Math.max(300,maxH+4),fill:'#1b1b1b',stroke:'#444','stroke-width':.5,'stroke-dasharray':'2 2'}));
    cutSvg.appendChild(el('text',{x:62,y:7,fill:'#6f6f6f','font-size':4,'text-anchor':'middle'},'100 mm'));
    for(const b of blocks){
      let q=packManual[b.id]||{x:0,y:0};
      q.x=clamp(q.x,0,Math.max(0,100-b.w)); q.y=Math.max(0,q.y);
      packManual[b.id]=q;
      const x=12+q.x,y=12+q.y;
      const g=el('g',{'data-id':b.id});
      const r=el('rect',{x,y,width:b.w,height:b.h,rx:.7,fill:'#d8d8d8',stroke:'#777','stroke-width':.6,style:'cursor:grab;touch-action:none'});
      const label=el('text',{x:x+b.w/2,y:y+Math.min(b.h/2+1.4,5),fill:'#191919','font-size':Math.max(3,Math.min(5,b.w*.22)),'text-anchor':'middle','pointer-events':'none'},b.code);
      g.append(r,label); cutSvg.appendChild(g);
      r.addEventListener('pointerdown',e=>{

  }

  // ---------- 3D ----------
  const canvas=$('#model3d'), ctx=canvas.getContext('2d');
  const camera={yaw:-.38,pitch:.12,zoom:2.05,panX:0,panY:10};
  const pose={
    Larm:0,Rarm:0,Lleg:0,Rleg:0,
    Larm2:0,Rarm2:0,Lleg2:0,Rleg2:0,
    touchedAt:0

  let modelHit=[];
  const modelPointers=new Map();
  let modelGesture=null;
  let pickedLimb=null;

  function resizeCanvas(){
    const r=canvas.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
    const w=Math.max(1,Math.floor(r.width*dpr)), h=Math.max(1,Math.floor(r.height*dpr));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  }
  function rotX(v,a){const c=Math.cos(a),s=Math.sin(a);return [v[0],v[1]*c-v[2]*s,v[1]*s+v[2]*c];}
  function rotY(v,a){const c=Math.cos(a),s=Math.sin(a);return [v[0]*c+v[2]*s,v[1],-v[0]*s+v[2]*c];}
  function rotZ(v,a){const c=Math.cos(a),s=Math.sin(a);return [v[0]*c-v[1]*s,v[0]*s+v[1]*c,v[2]];}
  function add(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
  function mul(v,s){return[v[0]*s,v[1]*s,v[2]*s]}
  function dirDown(a){return [0,-Math.cos(a),Math.sin(a)]}

  function modelBoxes(time){
    const p=parts,g=currentGap();
    const idle=(time/1000);
    const recent=performance.now()-pose.touchedAt<1800;
    const amp=recent?.018:.055;
    const aL=pose.Larm + Math.sin(idle*1.5)*amp;
    const aR=pose.Rarm - Math.sin(idle*1.5)*amp;
    const lL=pose.Lleg + Math.sin(idle*1.35)*amp*1.15;
    const lR=pose.Rleg - Math.sin(idle*1.35)*amp*1.15;
    const boxes=[];
    const torsoC=[0,0,0];
    boxes.push(box3('torso','torso',torsoC,[p.torso.w,p.torso.h,p.torso.d],0));
    const neckBaseY=p.torso.h/2+NECK_EMBED;
    const neckC=[0,neckBaseY+p.neck.h/2-NECK_EMBED,0];
    boxes.push(box3('neck','neck',neckC,[p.neck.w,p.neck.h,p.neck.d],0));
    const headBottom=neckC[1]+p.neck.h/2-NECK_EMBED;
    const headC=[0,headBottom+p.head.h/2,0];
    boxes.push(box3('head','head',headC,[p.head.w,p.head.h,p.head.d],0));
    const pelvisTop=-p.torso.h/2-g;
    const pelvisC=[0,pelvisTop-p.pelvis.h/2,0];
    boxes.push(box3('pelvis','pelvis',pelvisC,[p.pelvis.w,p.pelvis.h,p.pelvis.d],0));
    const shoulderY=p.torso.h/2-8;
    const armX=p.torso.w/2+g;
    boxes.push(...limbChain('Larm',-1,[ -armX,shoulderY,0],['upperArm','forearm','palm'],[aL,aL+pose.Larm2,aL+pose.Larm2*.5]));
    boxes.push(...limbChain('Rarm', 1,[  armX,shoulderY,0],['upperArm','forearm','palm'],[aR,aR+pose.Rarm2,aR+pose.Rarm2*.5]));
    const hipY=pelvisC[1]-p.pelvis.h/2;
    const legX=p.thigh.w/2+g/2;
    boxes.push(...limbChain('Lleg',-1,[-legX,hipY,0],['thigh','lowerLeg','shoe'],[lL,lL+pose.Lleg2,lL*.35]));
    boxes.push(...limbChain('Rleg', 1,[ legX,hipY,0],['thigh','lowerLeg','shoe'],[lR,lR+pose.Rleg2,lR*.35]));
    return boxes;
  }
  function box3(id,key,c,size,rx=0,rz=0){return{id,key,c,size,rx,rz}}
  function limbChain(prefix,side,pivot,keys,angles){
    const out=[]; let joint=pivot.slice();
    for(let i=0;i<keys.length;i++){
      const key=keys[i],p=parts[key],a=angles[i]||0;
      const length=p.h;
      const dir=dirDown(a);
      const c=add(joint,mul(dir,length/2));
      out.push(box3(prefix+'-'+key,key,c,[p.w,p.h,p.d],a));
      joint=add(joint,mul(dir,length+((i<keys.length-1)?currentGap():0)));
    }
    return out;
  }
  const faces=[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]];
  function boxVertices(b){
    const [w,h,d]=b.size; const base=[[-w,-h,-d],[w,-h,-d],[-w,h,-d],[w,h,-d],[-w,-h,d],[w,-h,d],[-w,h,d],[w,h,d]].map(v=>[v[0]/2,v[1]/2,v[2]/2]);
    return base.map(v=>add(rotZ(rotX(v,b.rx||0),b.rz||0),b.c));
  }
  function cameraTransform(v){return rotX(rotY(v,camera.yaw),camera.pitch)}
  function project(v,cw,ch){
    const vv=cameraTransform(v); const dist=460; const z=vv[2]+dist; const s=(camera.zoom*dist)/z;
    return [cw/2+(vv[0]*s)+camera.panX, ch/2-(vv[1]*s)+camera.panY, vv[2]];
  }
  function polyContains(poly,x,y){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];const intersect=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-9)+xi);if(intersect)c=!c;}return c;}
  function drawModel(t){
    resizeCanvas(); const cw=canvas.width,ch=canvas.height; ctx.clearRect(0,0,cw,ch);
    const scale=canvas.width/canvas.getBoundingClientRect().width; ctx.save(); ctx.scale(scale,scale);
    const W=cw/scale,H=ch/scale;
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#222');bg.addColorStop(1,'#191919');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const allFaces=[]; modelHit=[];
    for(const b of modelBoxes(t)){
      const verts=boxVertices(b); const pro=verts.map(v=>project(v,W,H));
      const cx=pro.reduce((s,v)=>s+v[0],0)/8, cy=pro.reduce((s,v)=>s+v[1],0)/8;
      const polys=[];
      faces.forEach((f,fi)=>{
        const poly=f.map(i=>pro[i]); const depth=poly.reduce((s,v)=>s+v[2],0)/4;
        const a=[verts[f[0]][0],verts[f[0]][1],verts[f[0]][2]], bb=[verts[f[1]][0],verts[f[1]][1],verts[f[1]][2]], cc=[verts[f[2]][0],verts[f[2]][1],verts[f[2]][2]];
        const u=[bb[0]-a[0],bb[1]-a[1],bb[2]-a[2]],v=[cc[0]-a[0],cc[1]-a[1],cc[2]-a[2]];
        let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]; n=cameraTransform(n);
        const visible=n[2]<0;
        if(visible) allFaces.push({b,poly,depth,n,fi});
        polys.push(poly);
      });
      modelHit.push({b,polys,cx,cy});
    }
    allFaces.sort((a,b)=>b.depth-a.depth);
    const light=[-.45,.65,-.6];
    for(const f of allFaces){
      const n=f.n, len=Math.hypot(...n)||1; const dot=clamp((n[0]*light[0]+n[1]*light[1]+n[2]*light[2])/len,-1,1);
      const base=f.b.key==='head'?185: f.b.key==='torso'||f.b.key==='pelvis'?155:172;
      const shade=clamp(base+dot*38,82,224)|0;
      ctx.beginPath(); f.poly.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
      ctx.fillStyle=`rgb(${shade},${shade},${shade})`; ctx.fill(); ctx.strokeStyle='#4d4d4d';ctx.lineWidth=.7;ctx.stroke();
    }
    // floor shadow
    const groundY=H*.94; const rg=ctx.createRadialGradient(W/2,groundY,5,W/2,groundY,W*.23); rg.addColorStop(0,'#0008');rg.addColorStop(1,'#0000');ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(W/2,groundY,W*.23,24,0,0,Math.PI*2);ctx.fill();
    ctx.restore(); requestAnimationFrame(drawModel);
  }

  function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  function pickModel(x,y){
    for(let i=modelHit.length-1;i>=0;i--){const h=modelHit[i];if(h.polys.some(p=>polyContains(p,x,y))) return h.b;}
    return null;
  }
  canvas.addEventListener('wheel',e=>{e.preventDefault();camera.zoom=clamp(camera.zoom*(e.deltaY>0?.92:1.08),.65,5);},{passive:false});
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId); const p=canvasPoint(e); modelPointers.set(e.pointerId,p);
    if(modelPointers.size===1){
      const hit=pickModel(p.x,p.y);
      pickedLimb=hit && /^(L|R)(arm|leg)-/.test(hit.id) ? hit.id.split('-')[0] : null;
      modelGesture={mode:pickedLimb?'limb':'rotate',last:p};
    } else if(modelPointers.size===2){
      const a=[...modelPointers.values()]; const dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;
      modelGesture={mode:'touch2',dist:Math.hypot(dx,dy),cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,zoom:camera.zoom,panX:camera.panX,panY:camera.panY};
    }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!modelPointers.has(e.pointerId))return; const p=canvasPoint(e);modelPointers.set(e.pointerId,p);
    if(modelPointers.size===2){
      const a=[...modelPointers.values()];const dx=a[0].x-a[1].x,dy=a[0].y-a[1].y,dist=Math.hypot(dx,dy),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;
      if(modelGesture?.mode!=='touch2') modelGesture={mode:'touch2',dist, cx,cy,zoom:camera.zoom,panX:camera.panX,panY:camera.panY};
      camera.zoom=clamp(modelGesture.zoom*(dist/modelGesture.dist),.65,5);camera.panX=modelGesture.panX+(cx-modelGesture.cx);camera.panY=modelGesture.panY+(cy-modelGesture.cy);return;
    }
    if(!modelGesture)return; const dx=p.x-modelGesture.last.x,dy=p.y-modelGesture.last.y;modelGesture.last=p;
    if(modelGesture.mode==='limb' && pickedLimb){
      const k=pickedLimb==='Larm'?'Larm':pickedLimb==='Rarm'?'Rarm':pickedLimb==='Lleg'?'Lleg':'Rleg';
      pose[k]=clamp(pose[k]+dx*.012+dy*.004,-1.15,1.15);pose.touchedAt=performance.now();
    }else if(modelGesture.mode==='rotate'){

    }
  });
  function endModelPointer(e){modelPointers.delete(e.pointerId);pickedLimb=null;if(modelPointers.size===1){const p=[...modelPointers.values()][0];modelGesture={mode:'rotate',last:p};}else if(modelPointers.size===0){modelGesture=null;}try{canvas.releasePointerCapture(e.pointerId)}catch(_){}}
  canvas.addEventListener('pointerup',endModelPointer); canvas.addEventListener('pointercancel',endModelPointer);

  function printBox(svg,x,y,w,h,label,dim){
    svg.appendChild(el('rect',{x,y,width:w,height:h,fill:'none',stroke:'#000','stroke-width':.35}));
    const fs=Math.min(3.2,Math.max(1.8,Math.min(w,h)*.18));
    svg.appendChild(el('text',{x:x+w/2,y:y+Math.min(h/2,5),fill:'#000','font-size':fs,'text-anchor':'middle'},label));
    svg.appendChild(el('text',{x:x+w/2,y:y+Math.min(h/2+3.7,9),fill:'#000','font-size':Math.max(1.6,fs*.72),'text-anchor':'middle'},dim));
  }
  function buildPrintSheet(){
    const root=$('#printSheet');root.innerHTML='';
    const svg=el('svg',{xmlns:SVG_NS,width:'198mm',height:'285mm',viewBox:'0 0 198 285'});
    const f=computeFrontLayout(false),s=computeSideLayout(false); const frontCx=50, sideCx=146, y0=7;
    svg.appendChild(el('text',{x:50,y:4,fill:'#000','font-size':3,'text-anchor':'middle'},'FRONT · 1:1 · no gap'));
    svg.appendChild(el('text',{x:146,y:4,fill:'#000','font-size':3,'text-anchor':'middle'},'SIDE · 1:1 · no gap'));
    for(const b of f.boxes){
      const x=frontCx+b.x-b.w/2,y=y0+b.y;
      printBox(svg,x,y,b.w,b.h,parts[b.key].code,`${parts[b.key].h}×${parts[b.key].w} mm`);
    }
    for(const b of s.boxes.filter(b=>!b.ghost)){
      const x=sideCx+b.x-b.w/2,y=y0+b.y;
      printBox(svg,x,y,b.w,b.h,parts[b.key].code,`${parts[b.key].h}×${parts[b.key].d} mm`);
    }
    // Small legend
    let ly=272; const legend=partOrder.map(k=>`${parts[k].code} ${parts[k].name}`).join('  ·  ');
    svg.appendChild(el('text',{x:99,y:ly,fill:'#000','font-size':2.5,'text-anchor':'middle'},legend));
    svg.appendChild(el('text',{x:99,y:278,fill:'#000','font-size':2.3,'text-anchor':'middle'},'Print at 100% / Actual size. Disable “Fit to page”.'));
    root.appendChild(svg);
  }

  const README_FALLBACK = `# Marionette Designer v0.1\n\n這是一個用來規劃懸絲偶木料尺寸、切割排列與立體組裝的互動工具。\n\n## 畫面四區\n\n1. **左上：Front / Side** － 調整正視與側視尺寸。\n2. **右上：切割排列** － 把所有木料方塊排進 100 mm 寬的切割區。\n3. **左下：材料表** － 直接輸入高度 H、寬度 W、厚度 D。\n4. **右下：3D** － 查看組裝後比例與手腳動作。\n\n## Front / Side 怎麼改尺寸\n\n- 點選方塊後，拖曳方塊的邊或角落。\n- Front 改的是 **寬度 W + 高度 H**。\n- Side 改的是 **厚度 D + 高度 H**。\n- 同一個零件會自動同步，左右手、左右腳也會一起更新。\n- 放開後，零件會重新依人體中軸排列。\n\n## 三個按鈕\n\n- **↕**：切換 3 mm 關節 gap。Head → Neck → Torso 仍維持 Neck 上下各埋入 5 mm。\n- **▦**：把右上所有切割方塊重新緊湊排列。\n- **A4**：以 1:1 真實尺寸列印 Front / Side，輸出固定使用 no gap。列印時請選 100% / Actual size，不要使用 Fit to page。\n\n## 切割排列\n\n- 材料區固定寬 **100 mm**，高度可以一直往下延伸。\n- 每個零件以代號顯示；成對零件會放兩塊。\n- 可以直接拖曳排列位置。尺寸改變後，方塊大小會同步。\n- 按 **▦** 可以重新自動排列。\n\n## 材料表\n\n- **H**：高度\n- **W**：正視寬度\n- **D**：側視厚度\n- 改任何數字，Front、Side、切割圖與 3D 都會一起更新。\n\n## 3D 操作\n\n### 電腦\n- 左鍵拖曳背景：旋轉視角。\n- 滾輪：縮放。\n- 點到手或腳再拖曳：改變手腳擺動角度。\n\n### 手機 / 平板\n- 單指在空白處水平拖曳：水平旋轉視角。\n- 單指拖曳手或腳：調整動作。\n- 雙指：縮放並移動畫面。\n\n沒有操作時，手腳會有很小的待機擺動；左右腳的節奏相反，模擬走路感。\n\n## README.md\n\n按右上角 **?** 時，頁面會嘗試重新讀取同資料夾的 \`README.md\`。如果你用本機伺服器或網站開啟，只要修改 README.md，下一次開啟說明就會讀到新內容。直接用 \`file://\` 開啟 HTML 時，部分瀏覽器會阻擋讀取同資料夾檔案，因此頁面會改用內建備援說明。`;

  function mdToHtml(md){
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let src=esc(md).replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${c.trim()}</code></pre>`).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    const lines=src.split(/\r?\n/); let html='',inUl=false,inOl=false;
    const closeLists=()=>{if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}};
    for(const line of lines){
      if(/^###\s+/.test(line)){closeLists();html+=`<h3>${line.replace(/^###\s+/,'')}</h3>`}
      else if(/^##\s+/.test(line)){closeLists();html+=`<h2>${line.replace(/^##\s+/,'')}</h2>`}
      else if(/^#\s+/.test(line)){closeLists();html+=`<h1>${line.replace(/^#\s+/,'')}</h1>`}
      else if(/^[-*]\s+/.test(line)){if(!inUl){closeLists();html+='<ul>';inUl=true}html+=`<li>${line.replace(/^[-*]\s+/,'')}</li>`}
      else if(/^\d+\.\s+/.test(line)){if(!inOl){closeLists();html+='<ol>';inOl=true}html+=`<li>${line.replace(/^\d+\.\s+/,'')}</li>`}
      else if(!line.trim()){closeLists();html+='<div style="height:.35em"></div>'}
      else {closeLists();html+=`<p>${line}</p>`}
    }
    closeLists(); return html;
  }
  async function loadReadme(){
    const body=$('#readmeBody');body.innerHTML='<div style="color:#777">loading…</div>';
    try{
      const res=await fetch(`./readme.md?v=${Date.now()}`,{cache:'no-store'}); if(!res.ok)throw new Error(res.status);
      body.innerHTML=mdToHtml(await res.text());
    }catch(err){
      body.innerHTML=`<div class="readme-warn">README.md 無法直接讀取，目前顯示內建說明。若以網站 / 本機伺服器開啟，說明會即時讀取同資料夾 README.md。</div>`+mdToHtml(README_FALLBACK);
    }
  }

  $('#helpBtn').addEventListener('click',async()=>{$('#helpModal').classList.add('show');await loadReadme();});
  $('#closeHelp').addEventListener('click',()=>$('#helpModal').classList.remove('show'));
  $('#reloadReadme').addEventListener('click',loadReadme);
  $('#helpModal').addEventListener('pointerdown',e=>{if(e.target===$('#helpModal'))$('#helpModal').classList.remove('show')});
  window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#helpModal').classList.remove('show')});

  gapBtn.addEventListener('click',()=>{gapEnabled=!gapEnabled;gapBtn.classList.toggle('active',gapEnabled);renderAll(false)});
  packBtn.addEventListener('click',()=>{autoPacked=true;packManual={};renderCut()});
  printBtn.addEventListener('click',()=>{buildPrintSheet();setTimeout(()=>window.print(),60)});

  function render2D(){renderDimensionRail();renderEditor(frontSvg,'front');renderEditor(sideSvg,'side');}
  function renderAll(rebuildTable=false){render2D();renderCut();if(rebuildTable)renderMaterialTable();}

  renderMaterialTable(); renderAll(false); resizeCanvas(); requestAnimationFrame(drawModel);
  window.addEventListener('resize',resizeCanvas);
})();
</script>
