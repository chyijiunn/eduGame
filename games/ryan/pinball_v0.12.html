function board(){let g=X.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#171f2b');g.addColorStop(1,'#0d121a');X.fillStyle=g;X.strokeStyle='#435166';X.lineWidth=5;X.beginPath();X.roundRect(18,18,VW-36,VH-36,30);X.fill();X.stroke();X.strokeStyle='rgba(255,255,255,.055)';X.lineWidth=1;for(let y=90;y<1010;y+=55){X.beginPath();X.moveTo(60,y);X.lineTo(660,y);X.stroke()}X.strokeStyle='#d9e1eb';X.lineWidth=9;X.lineCap='round';border.forEach(z=>{X.beginPath();X.moveTo(z[0],z[1]);X.lineTo(z[2],z[3]);X.stroke()})}function drawObj(o){X.save();if(o.kind==='circle'){let R=o.radius*o.scale,g=X.createRadialGradient(o.x-R*.28,o.y-R*.32,4,o.x,o.y,R);g.addColorStop(0,'#f7f9fb');g.addColorStop(.3,'#aeb9c8');g.addColorStop(.32,'#38475b');g.addColorStop(1,'#151c27');X.fillStyle=g;X.strokeStyle='#edf2f7';X.lineWidth=4;X.beginPath();X.arc(o.x,o.y,R,0,Math.PI*2);X.fill();X.stroke()}else{let a=poly(o);X.beginPath();X.moveTo(a[0].x,a[0].y);for(let i=1;i<a.length;i++)X.lineTo(a[i].x,a[i].y);X.closePath();X.fillStyle=o.kind==='star'?'#202937':o.kind==='flipper'?'#d8e0e9':'#283343';X.strokeStyle='#e2e9f1';X.lineWidth=o.kind==='flipper'?4:3;X.fill();X.stroke();

let pointers=new Map(),gesture=null,drag=null;Wk.addEventListener('pointerdown',e=>{audio();Wk.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};gesture={m,panX:S.panX,panY:S.panY};drag=null;return}let p=local(e.clientX,e.clientY);if(S.edit){if(S.drawing){S.drawPts=[p];return}let o=sel();if(o){let b=bounds(o),d=12,x2=b.x2+d,y2=b.y2+d,rx=(b.x1+b.x2)/2,ry=b.y1-d-28;if(h(p.x-x2,p.y-y2)<20){drag={type:'scale',id:o.id,startScale:o.scale,startDist:h(p.x-o.x,p.y-o.y)};return}if(h(p.x-rx,p.y-ry)<22){drag={type:'rotate',id:o.id,startAngle:Math.atan2(p.y-o.y,p.x-o.x),startRot:o.rot};return}if(hitObj(p,o)){drag={type:'move',id:o.id,dx:p.x-o.x,dy:p.y-o.y};return}}selectAt(p);o=sel();if(o)drag={type:'move',id:o.id,dx:p.x-o.x,dy:p.y-o.y};return}if(p.y>800){let L=S.objects.find(o=>o.flipperSide==='left'),R=S.objects.find(o=>o.flipperSide==='right');if(p.x<360&&L){L.kick=.18;flipSound()}else if(p.x>=360&&R){R.kick=.18;flipSound()}}});Wk.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&gesture){let a=[...pointers.values()],m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};S.panX=cl(gesture.panX+m.x-gesture.m.x,-180,180);S.panY=cl(gesture.panY+m.y-gesture.m.y,-220,220);pan();return}let p=local(e.clientX,e.clientY);if(S.edit&&S.drawing){S.drawPts.push(p);return}if(!S.edit||!drag)return;let o=S.objects.find(x=>x.id===drag.id);if(!o)return;if(drag.type==='move'){o.x=p.x-drag.dx;o.y=p.y-drag.dy;o.baseX=o.x;o.baseY=o.y}else if(drag.type==='scale'){o.scale=cl(drag.startScale*h(p.x-o.x,p.y-o.y)/Math.max(8,drag.startDist),.2,5)}else if(drag.type==='rotate'){let a=Math.atan2(p.y-o.y,p.x-o.x);o.rot=drag.startRot+(a-drag.startAngle);if(o.flipper){o.restRot=o.rot;o.activeRot=o.flipperSide==='right'?o.rot+r(90):o.rot-r(90)}}});function up(e){pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(S.edit&&S.drawing&&S.drawPts.length>=3){let o=sel(),pts=[];for(let i=0;i<S.drawPts.length;i+=7)pts.push(S.drawPts[i]);pts.push(S.drawPts[S.drawPts.length-1]);if(o&&pts.length>=3){let cx=pts.reduce((a,p)=>a+p.x,0)/pts.length,cy=pts.reduce((a,p)=>a+p.y,0)/pts.length;o.kind='custom';o.points=pts.map(p=>({x:p.x-cx,y:p.y-cy}));delete o.radius;o.x=o.baseX=cx;o.y=o.baseY=cy;o.rot=0;o.scale=1;o.flipper=false;o.flipperSide='custom'}S.drawing=false;S.drawPts=[];E('drawnote').classList.remove('show');refresh();save()}drag=null;save()}Wk.addEventListener('pointerup',up);Wk.addEventListener('pointercancel',up);
