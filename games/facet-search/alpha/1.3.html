<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>捷克超市食材分類食譜 v3</title>
<style>
:root{
 --bg:#0b1220; --panel:#111827; --card:#172033; --line:#2b3950; --text:#f8fafc; --muted:#cbd5e1;
 --accent:#22c55e; --accent2:#38bdf8; --chip:#0e1728; --shadow:0 12px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#08101d,#111827);color:var(--text)}
header{padding:14px 14px 8px}
.wrap{max-width:1050px;margin:0 auto;padding:0 14px 110px}
h1{font-size:1.28rem;line-height:1.25;margin:0}
.sub{margin-top:8px;color:var(--muted);font-size:.94rem;line-height:1.6}
.statsBar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0 22px}
.card{background:rgba(23,32,51,.98);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.title{font-size:1.08rem;font-weight:900;line-height:1.35}
.cz{margin-top:4px;color:#93c5fd;font-size:.93rem}
.summary{margin-top:10px;color:var(--muted);font-size:.93rem;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{padding:6px 9px;border-radius:999px;background:#0b1220;border:1px solid var(--line);color:#dbeafe;font-size:.78rem}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:none;border-radius:12px;padding:11px 12px;font-weight:900}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#052617}
.btn.secondary{background:#0b1220;color:var(--text);border:1px solid var(--line)}

.floatPanel{
 position:fixed; left:12px; right:12px; bottom:12px; z-index:55;
 background:rgba(17,24,39,.96); border:1px solid rgba(255,255,255,.08); border-radius:22px;
 box-shadow:0 18px 42px rgba(0,0,0,.42); padding:12px;
}
.floatHeader{display:flex;justify-content:space-between;align-items:center;gap:12px}
.floatTitle{font-size:.96rem;font-weight:900}
.floatSub{font-size:.82rem;color:var(--muted);margin-top:2px}
.floatBtns{display:flex;gap:8px}
.miniBtn{border:none;border-radius:999px;padding:9px 12px;font-weight:800}
.toggleBtn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#052617}
.resetBtn{background:#e2e8f0;color:#0f172a}
.panelBody{margin-top:12px;max-height:42vh;overflow:auto;display:none}
.floatPanel.open .panelBody{display:block}
.groupTitle{font-size:.88rem;color:#93c5fd;margin:0 0 8px 0;font-weight:800}
.groupWrap{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 12px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--text);font-size:.92rem;cursor:pointer}
.chip.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#052617;border-color:transparent;font-weight:900}

.modal{position:fixed;inset:0;background:rgba(2,6,23,.78);display:none;align-items:flex-end;justify-content:center;z-index:99}
.modal.open{display:flex}
.sheet{width:100%;max-width:880px;max-height:92vh;background:#0f172a;border-radius:24px 24px 0 0;overflow:auto;border-top:1px solid rgba(255,255,255,.08)}
.sheetHeader{position:sticky;top:0;background:rgba(15,23,42,.94);backdrop-filter:blur(10px);padding:12px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.closeBtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:#0b1220;color:#fff;font-size:1.1rem}
.sheetBody{padding:14px}
.heroImg{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.heroImg img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.infoCard,.section{background:#111827;border:1px solid var(--line);border-radius:16px;padding:14px}
.infoCard small{display:block;color:var(--muted);margin-bottom:4px}
.section{margin-top:12px}
.section ul,.section ol{margin:0;padding-left:18px;line-height:1.8}
.note{margin-top:8px;color:#93c5fd;font-size:.88rem}
@media (min-width:720px){
 .grid{grid-template-columns:1fr 1fr}
 .sheet{border-radius:28px;max-height:90vh;align-self:center}
 .floatPanel{left:50%;transform:translateX(-50%);max-width:980px}
}
</style>
</head>
<body>
<header class="wrap">
  <h1>捷克超市食材分類食譜</h1>
  <div class="sub">升級版：菜色擴充到 50 道，並把肉類、海鮮、奶蛋合併成「蛋白質」。食材選單改成底部浮動視窗，方便手機用大拇指操作。調味料不在篩選列顯示，但在每道食譜內都會特別標註。</div>
</header>

<main class="wrap">
  <div class="statsBar">
    <span id="stats">目前顯示 0 道料理</span>
    <span>先選食材，再點料理看完整做法</span>
  </div>
  <section class="grid" id="grid"></section>
</main>

<div class="floatPanel open" id="floatPanel">
  <div class="floatHeader">
    <div>
      <div class="floatTitle">食材篩選</div>
      <div class="floatSub">固定在下方，方便手機大拇指點選</div>
    </div>
    <div class="floatBtns">
      <button class="miniBtn resetBtn" id="resetBtn">清除</button>
      <button class="miniBtn toggleBtn" id="toggleBtn">收合</button>
    </div>
  </div>
  <div class="panelBody">
    <div class="groupWrap">
      <div class="groupTitle">蛋白質</div>
      <div class="chips" id="proteinChips"></div>
    </div>
    <div class="groupWrap">
      <div class="groupTitle">捷克超市常買蔬菜</div>
      <div class="chips" id="vegChips"></div>
    </div>
    <div class="groupWrap">
      <div class="groupTitle">主食與搭配</div>
      <div class="chips" id="stapleChips"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheetHeader">
      <strong id="mTitle">料理</strong>
      <button class="closeBtn" id="closeModal">✕</button>
    </div>
    <div class="sheetBody" id="modalBody"></div>
  </div>
</div>

": ["優格", "小黃瓜"], "seasonings": ["檸檬", "黑胡椒", "鹽"], "steps": ["小黃瓜切薄片。", "優格加檸檬汁與黑胡椒。", "全部拌勻，冷藏後更好吃。"]}, {"id": "r41", "name": "馬鈴薯濃湯", "cz": "Bramborová polévka", "photo": "https://source.unsplash.com/1200x800/?potato,soup", "summary": "馬鈴薯在捷克超市非常常見，這道便宜又有飽足感。", "ingredients": ["馬鈴薯", "洋蔥", "牛奶"], "seasonings": ["奶油", "黑胡椒", "鹽"], "steps": ["馬鈴薯和洋蔥煮軟。", "加入牛奶與奶油。", "壓碎或攪勻後調味。"]}, {"id": "r42", "name": "蘑菇起司炒蛋吐司", "cz": "Vejce s houbami a sýrem na toastu", "photo": "https://source.unsplash.com/1200x800/?mushroom,eggs,toast", "summary": "蘑菇和起司是高命中率早餐組合。", "ingredients": ["蘑菇", "雞蛋", "起司", "吐司"], "seasonings": ["奶油", "鹽", "黑胡椒"], "steps": ["蘑菇先炒香。", "加入蛋液輕拌。", "放入起司。", "鋪到吐司上。"]}, {"id": "r43", "name": "番茄起司焗烤麵", "cz": "Zapečené těstoviny se sýrem", "photo": "https://source.unsplash.com/1200x800/?baked,pasta,cheese,tomato", "summary": "番茄、起司、義大利麵是很好消耗庫存的組合。", "ingredients": ["番茄", "起司", "義大利麵", "洋蔥"], "seasonings": ["奶油", "鹽", "黑胡椒"], "steps": ["義大利麵煮八分熟。", "加入番茄和洋蔥拌炒。", "鋪上起司進烤箱烤到金黃。"]}, {"id": "r44", "name": "甜椒番茄炒蛋", "cz": "Vejce s paprikou a rajčaty", "photo": "https://source.unsplash.com/1200x800/?pepper,tomato,eggs", "summary": "甜椒和番茄都很適合當快炒配菜或主食配角。", "ingredients": ["甜椒", "番茄", "雞蛋", "洋蔥"], "seasonings": ["奶油", "鹽", "黑胡椒"], "steps": ["洋蔥與甜椒先炒香。", "加入番茄煮軟。", "最後倒入蛋液拌炒。"]}, {"id": "r45", "name": "高麗菜奶油炒鍋", "cz": "Zelí na másle", "photo": "https://source.unsplash.com/1200x800/?cabbage,butter,pan", "summary": "高麗菜很耐放，十天住宿很實用。", "ingredients": ["高麗菜", "洋蔥"], "seasonings": ["奶油", "黑胡椒", "鹽"], "steps": ["洋蔥先炒香。", "加入高麗菜絲拌炒。", "用奶油和黑胡椒收尾。"]}, {"id": "r46", "name": "芥末奶油馬鈴薯", "cz": "Brambory s hořčicí a máslem", "photo": "https://source.unsplash.com/1200x800/?potato,mustard,butter", "summary": "芥末在中歐很常見，拌馬鈴薯特別合適。", "ingredients": ["馬鈴薯"], "seasonings": ["奶油", "芥末", "黑胡椒", "鹽"], "steps": ["馬鈴薯煮熟切塊。", "奶油融化後拌入芥末。", "把醬拌進馬鈴薯中。"]}, {"id": "r47", "name": "蒜香番茄麵包盅", "cz": "Rajčatový chléb s česnekem", "photo": "https://source.unsplash.com/1200x800/?tomato,bread,garlic", "sum const GROUPS = {
  protein:["雞肉","豬肉","牛肉","魚","蝦","貝類","雞蛋","起司","牛奶","優格"],
  veg:["馬鈴薯","蘑菇","番茄","小黃瓜","甜椒","高麗菜","洋蔥","菠菜","生菜","蘋果","香蕉"],
  staple:["麵包","義大利麵","白飯","鮮奶油","吐司"]
};
const state = { selected:new Set() };

function renderChips(id, arr){
  const root = document.getElementById(id);
  root.innerHTML = "";
  arr.forEach(item=>{
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = item;
    btn.onclick = ()=>{
      if(state.selected.has(item)){ state.selected.delete(item); btn.classList.remove("active"); }
      else { state.selected.add(item); btn.classList.add("active"); }
      render();
    };
    root.appendChild(btn);
  });
}
renderChips("proteinChips", GROUPS.protein);
renderChips("vegChips", GROUPS.veg);
renderChips("stapleChips", GROUPS.staple);

const grid = document.getElementById("grid");
const stats = document.getElementById("stats");
function matches(recipe){
  if(state.selected.size===0) return true;
  for(const item of state.selected){
    if(!recipe.ingredients.includes(item)) return false;
  }
  return true;
}
function card(r){
  return `
    <article class="card">
      <div class="title">${r.name}</div>
      <div class="cz">${r.cz}</div>
      <div class="summary">${r.summary}</div>
      <div class="tags">${r.ingredients.slice(0,7).map(i=>`<span class="tag">${i}</span>`).join("")}</div>
      <div class="actions">
        <button class="btn secondary" onclick="quickTag('${r.ingredients[0]}')">看更多同食材</button>
        <button class="btn primary" onclick="openRecipe('${r.id}')">查看詳細食譜</button>
      </div>
    </article>`;
}
function render(){
  const list = RECIPES.filter(matches);
  stats.textContent = `目前顯示 ${list.length} 道料理`;
  if(list.length===0){
    grid.innerHTML = `<div class="card"><div class="title">找不到符合條件的料理</div><div class="summary">建議先減少 1-2 個食材條件，例如只先選「雞肉 + 蘑菇」或「馬鈴薯 + 奶油」類型的核心食材。</div></div>`;
    return;
  }
  grid.innerHTML = list.map(card).join("");
}
window.quickTag = function(tag){
  state.selected = new Set([tag]);
  document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('active', ch.textContent===tag));
  render();
}

const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const mTitle = document.getElementById("mTitle");
window.openRecipe = function(id){
  const r = RECIPES.find(x=>x.id===id);
  if(!r) return;
  mTitle.textContent = r.name;
  modalBody.innerHTML = `
    <div class="heroImg"><img src="${r.photo}" alt="${r.name}"></div>
    <div class="info">
      <div class="infoCard"><small>捷克文名稱</small><strong>${r.cz}</strong></div>
      <div class="infoCard"><small>主要食材</small><strong>${r.ingredients.join("、")}</strong></div>
    </div>
    <div class="section">
      <strong>這道菜重點</strong>
      <div style="margin-top:8px;color:var(--muted);line-height:1.7">${r.summary}</div>
    </div>
    <div class="section">
      <strong>需要食材</strong>
      <ul>${r.ingredients.map(x=>`<li>${x}</li>`).join("")}</ul>
      <div class="note">調味與輔助材料：${r.seasonings.join("、")}</div>
    </div>
    <div class="section">
      <strong>詳細作法</strong>
      <ol>${r.steps.map(x=>`<li>${x}</li>`).join("")}</ol>
    </div>
  `;
  modal.classList.add("open");
};
document.getElementById("closeModal").onclick = ()=> modal.classList.remove("open");
modal.onclick = (e)=>{ if(e.target===modal) modal.classList.remove("open"); };

const floatPanel = document.getElementById("floatPanel");
const toggleBtn = document.getElementById("toggleBtn");
toggleBtn.onclick = ()=>{
  floatPanel.classList.toggle("open");
  toggleBtn.textContent = floatPanel.classList.contains("open") ? "收合" : "展開";
};
document.getElementById("resetBtn").onclick = ()=>{
  state.selected.clear();
  document.querySelectorAll('.chip').forEach(ch=>ch.classList.remove('active'));
  render();
};
render();
</script>
</body>
</html>
