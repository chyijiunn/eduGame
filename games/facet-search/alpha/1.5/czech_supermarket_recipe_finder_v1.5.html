<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>捷克超市食材分類食譜 v1.4</title><style>

header{padding:14px 14px 8px}.wrap{max-width:1050px;margin:0 auto;padding:0 14px 110px}h1{font-size:1.28rem;line-height:1.25;margin:0}.sub{margin-top:8px;color:var(--muted);font-size:.94rem;line-height:1.6}

.title{font-size:1.08rem;font-weight:900;line-height:1.35}.cz{margin-top:4px;color:#93c5fd;font-size:.93rem}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{padding:6px 9px;border-radius:999px;background:#0b1220;border:1px solid var(--line);color:#dbeafe;font-size:.78rem}

.floatHeader{display:flex;justify-content:space-between;align-items:center;gap:12px}.floatTitle{font-size:.96rem;font-weight:900}.floatSub{font-size:.82rem;color:var(--muted);margin-top:2px}.floatBtns{display:flex;gap:8px}.miniBtn{border:none;border-radius:999px;padding:9px 12px;font-weight:800}.toggleBtn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#052617}.resetBtn{background:#e2e8f0;color:#0f172a}
.panelBody{margin-top:12px;max-height:42vh;overflow:auto;display:none}.floatPanel.open .panelBody{display:block}.groupTitle{font-size:.88rem;color:#93c5fd;margin:0 0 8px 0;font-weight:800}.groupWrap{margin-top:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--text);font-size:.92rem;cursor:pointer}.chip.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#052617;border-color:transparent;font-weight:900}

.sheetBody{padding:14px}.heroImg{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#0b1220}.heroImg img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.infoCard,.section{background:#111827;border:1px solid var(--line);border-radius:16px;padding:14px}.infoCard small{display:block;color:var(--muted);margin-bottom:4px}.section{margin-top:12px}.section ul,.section ol{margin:0;padding-left:18px;line-height:1.8}.note{margin-top:8px;color:#93c5fd;font-size:.88rem}

<header class="wrap"><h1>捷克超市食材分類食譜 v1.4</h1><div class="sub">修正版：列表頁不再顯示料理介紹與按鈕，直接點料理名稱就進入詳細頁。所有料理圖片已改為讀取本地打包圖片，可離線開啟，不再依賴外部載入。</div></header>
<main class="wrap"><div class="statsBar"><span id="stats">目前顯示 0 道料理</span><span>先選食材，再點料理名稱進入</span></div><section class="grid" id="grid"></section></main>
<div class="floatPanel open" id="floatPanel"><div class="floatHeader"><div><div class="floatTitle">食材篩選</div><div class="floatSub">固定下方，方便手機大拇指操作</div></div><div class="floatBtns"><button class="miniBtn resetBtn" id="resetBtn">清除</button><button class="miniBtn toggleBtn" id="toggleBtn">收合</button></div></div><div class="panelBody"><div class="groupWrap"><div class="groupTitle">蛋白質</div><div class="chips" id="proteinChips"></div></div><div class="groupWrap"><div class="groupTitle">捷克超市常買蔬菜</div><div class="chips" id="vegChips"></div></div><div class="groupWrap"><div class="groupTitle">主食與搭配</div><div class="chips" id="stapleChips"></div></div></div></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheetHeader"><strong id="mTitle">料理</strong><button class="closeBtn" id="closeModal">✕</button></div><div class="sheetBody" id="modalBody"></div></div></div>
<script>
const RECIPES = [{"id": "r01", "name": "奶油蘑菇雞胸麵", "cz": "Kuřecí těstoviny s houbami", "summary": "雞胸、蘑菇、鮮奶油與義大利麵都很適合在捷克超市一次買齊。", "ingredients": ["雞肉", "蘑菇", "鮮奶油", "義大利麵"], "seasonings": ["蒜頭", "黑胡椒", "奶油", "鹽"], "steps": ["雞胸切片，加少量鹽與黑胡椒。", "先煮義大利麵。", "奶油下鍋，炒香蒜頭與蘑菇。", "加入雞肉炒熟，倒入鮮奶油。", "拌入義大利麵，收汁即可。"], "photo": "images/r01.jpg"}, {"id": "r02", "name": "雞肉甜椒炒飯", "cz": "Kuřecí rýže s paprikou", "summary": "雞肉和甜椒是很穩的組合，適合當中午或晚上的快手主食。", "ingredients": ["雞肉", "甜椒", "白飯", "洋蔥", "雞蛋"], "seasonings": ["黑胡椒", "鹽", "奶油"], "steps": ["雞肉切丁先炒熟。", "加入洋蔥與甜椒拌炒。", "放入白飯炒鬆。", "最後加入蛋液炒散，調味後上桌。"], "photo": "images/r02.jpg"}, {"id": "r03", "name": "優格雞肉沙拉碗", "cz": "Kuřecí salát s jogurtem", "summary": "優格與雞肉很適合做成清爽沙拉，旅行中想吃輕一點很方便。", "ingredients": ["雞肉", "優格", "小黃瓜", "番茄", "生菜"], "seasonings": ["檸檬", "黑胡椒", "鹽"], "steps": ["雞胸煎熟後切片。", "小黃瓜、番茄與生菜切好。", "優格加檸檬汁與黑胡椒拌成醬。", "把雞肉鋪在沙拉上，淋醬即可。"], "photo": "images/r03.jpg"}, {"id": "r04", "name": "烤雞腿馬鈴薯盤", "cz": "Pečené kuře s bramborami", "summary": "如果住宿有烤箱，雞腿和馬鈴薯一起烤最省事。", "ingredients": ["雞肉", "馬鈴薯", "洋蔥", "甜椒"], "seasonings": ["奶油", "鹽", "黑胡椒", "橄欖油"], "steps": ["雞腿與馬鈴薯切塊，拌少量油、鹽和黑胡椒。", "加入洋蔥與甜椒。", "鋪入烤盤，200°C 烤到雞腿熟透。"], "photo": "images/r04.jpg"}, {"id": "r05", "name": "雞肉番茄燉鍋", "cz": "Kuřecí rajčatový hrnec", "summary": "罐頭番茄或新鮮番茄都能做，適合和麵包一起吃。", "ingredients": ["雞肉", "番茄", "洋蔥", "罐頭番茄"], "seasonings": ["蒜頭", "黑胡椒", "鹽"], "steps": ["洋蔥與蒜頭炒香。", "加入雞肉煎到表面上色。", "倒入番茄或罐頭番茄。", "小火燉到湯汁濃縮。"], "photo": "images/r05.jpg"}, {"id": "r06", "name": "起司菠菜雞蛋餅", "cz": "Vaječná omeleta se špenátem a sýrem", "summary": "這道雖偏早餐，但晚餐也很適合，材料取得很容易。", "ingredients": ["雞肉", "雞蛋", "起司", "菠菜"], "seasonings": ["奶油", "黑胡椒", "鹽"], "steps": ["雞肉先切小丁炒熟。", "蛋打散後加入黑胡椒。", "鍋中放奶油，先下菠菜與雞肉。", "倒蛋液，半熟時放起司，對折成蛋餅。"], "photo": "images/r06.jpg"}, {"id": "r07", "name": "雞肉高麗菜炒鍋", "cz": "Kuře se zelím na pánvi", "summary": "高麗菜耐放，十天住宿中很適合和雞肉搭配。", "ingredients": ["雞肉", "高麗菜", "洋蔥"], "seasonings": ["蒜頭", "黑胡椒", "奶油", "鹽"], "steps": ["雞肉切片先炒熟。", "加入洋蔥與高麗菜絲。", "炒到高麗菜變軟後調味。"], "photo": "images/r07.jpg"}, {"id": "r08", "name": "雞肉蘋果優格捲餅", "cz": "Kuřecí wrap s jablkem a jogurtem", "summary": "雞肉加蘋果和優格會比較清爽，適合當輕食。", "ingredients": ["雞肉", "優格", "蘋果", "生菜", "麵包"], "seasonings": ["黑胡椒", "鹽", "檸檬"], "steps": ["雞肉煎熟切條。", "蘋果切絲，與優格拌成醬。", "把雞肉、生菜、蘋果包進扁麵包或吐司中。"], "photo": "images/r08.jpg"}, {"id": "r09", "name": "雞肉蘑菇濃湯", "cz": "Krémová kuřecí polévka s houbami", "summary": "天冷時很適合，一鍋就能解決。", "ingredients": ["雞肉", "蘑菇", "牛奶", "洋蔥"], "seasonings": ["奶油", "黑胡椒", "鹽", "蒜頭"], "steps": ["洋蔥與蘑菇先炒香。", "加入雞肉拌炒。", "倒入牛奶與少量水，小火煮到雞肉熟透。"], "photo": "images/r09.jpg"}, {"id": "r10", "name": "雞肉起司熱吐司", "cz": "Kuřecí toast se sýrem", "summary": "材料簡單，很適合沒有太多鍋具時。", "ingredients": ["雞肉", "起司", "麵包", "番茄"], "seasonings": ["奶油", "黑胡椒"], "steps": ["雞肉煎熟切片。", "麵包夾雞肉、起司和番茄。", "平底鍋抹奶油，煎到外層金黃。"], "photo": "images/r10.jpg"}, {"id": "r11", "name": "奶油煎豬排", "cz": "Vepřový řízek na másle", "summary": "捷克常見豬肉料理基礎版，簡單卻很實用。", "ingredients": ["豬肉"], "seasonings": ["奶油", "黑胡椒", "檸檬", "鹽"], "steps": ["豬排拍鬆。", "雙面撒黑胡椒與鹽。", "奶油熱鍋後兩面煎熟，擠少量檸檬汁。"], "photo": "images/r11.jpg"}, {"id": "r12", "name": "豬肉甜椒炒飯", "cz": "Rýže s vepřovým masem a paprikou", "summary": "平底鍋就能完成，是住宿自煮很常用的類型。", "ingredients": ["豬肉", "甜椒", "白飯", "洋蔥", "雞蛋"], "seasonings": ["奶油", "鹽", "黑胡椒"], "steps": ["豬肉片炒熟。", "加入洋蔥與甜椒。", "放入白飯拌炒。", "需要更香可加入少量奶油。"], "photo": "images/r12.jpg"}, {"id": "r13", "name": "高麗菜豬肉鍋", "cz": "Zelí s vepřovým masem", "summary": "高麗菜在中歐非常常見，和豬肉一起炒很下飯。", "ingredients": ["豬肉", "高麗菜", "洋蔥"], "seasonings": ["芥末", "黑胡椒", "鹽"], "steps": ["洋蔥先炒香。", "加入豬肉片炒到變色。", "放入高麗菜絲炒軟。", "起鍋前可加一點芥末提味。"], "photo": "images/r13.jpg"}, {"id": "r14", "name": "豬肉蘑菇奶油麵", "cz": "Vepřové těstoviny s houbami", "summary": "如果買到豬里肌或薄片肉，這道非常快。", "ingredients": ["豬肉", "蘑菇", "鮮奶油", "義大利麵"], "seasonings": ["蒜頭", "黑胡椒", "鹽"], "steps": ["義大利麵先煮熟。", "蒜頭與蘑菇炒香。", "加入豬肉片快速炒熟。", "倒入鮮奶油，最後拌麵。"], "photo": "images/r14.jpg"}, {"id": "r15", "name": "馬鈴薯豬肉煎鍋", "cz": "Brambory s vepřovým masem na pánvi", "summary": "馬鈴薯和豬肉都是捷克超市很穩的選擇。", "ingredients": ["豬肉", "馬鈴薯", "洋蔥"], "seasonings": ["奶油", "黑胡椒", "鹽"], "steps": ["馬鈴薯切片先煎到微焦。", "加入洋蔥與豬肉片拌炒。", "最後用奶油和黑胡椒收香。"], "photo": "images/r15.jpg"}, {"id": "r16", "name": "番茄豬肉燉飯", "cz": "Rajčatová rýže s vepřovým masem", "summary": "番茄和白飯很搭，味道溫和。", "ingredients": ["豬肉", "番茄", "白飯", "洋蔥"], "seasonings": ["蒜頭", "鹽", "黑胡椒"], "steps": ["豬肉與洋蔥先炒香。", "加入番茄煮出汁。", "拌入白飯，炒到均勻吸附醬汁。"], "photo": "images/r16.jpg"}, {"id": "r17", "name": "豬肉小黃瓜三明治", "cz": "Vepřový sendvič s okurkou", "summary": "若有熟豬肉片，做成三明治很方便。", "ingredients": ["豬肉", "小黃瓜", "麵包", "起司"], "seasonings": ["芥末", "黑胡椒"], "steps": ["麵包抹少量芥末。", "夾入豬肉、小黃瓜與起司。", "可直接吃，也可加熱。"], "photo": "images/r17.jpg"}, {"id": "r18", "name": "豬肉洋蔥熱麵", "cz": "Vepřové nudle s cibulí", "summary": "洋蔥很容易買到，和豬肉快炒非常搭。", "ingredients": ["豬肉", "洋蔥", "義大利麵"], "seasonings": ["黑胡椒", "蒜頭", "鹽"], "steps": ["義大利麵先煮熟。", "洋蔥炒到微焦。", "加入豬肉片快炒，最後拌麵。"], "photo": "images/r18.jpg"}, {"id": "r19", "name": "豬肉番茄焗烤飯", "cz": "Zapečená rýže s vepřovým masem", "summary": "有烤箱時可以把剩飯變得更像正式料理。", "ingredients": ["豬肉", "番茄", "白飯", "起司"], "seasonings": ["黑胡椒", "鹽", "奶油"], "steps": ["豬肉與番茄先炒香。", "與白飯拌勻。", "鋪起司進烤箱烤到表面金黃。"], "photo": "images/r19.jpg"}, {"id": "r20", "name": "豬肉奶油濃湯", "cz": "Krémová polévka s vepřovým masem", "summary": "如果想做比較溫暖的晚餐，這道不錯。", "ingredients": ["豬肉", "牛奶", "馬鈴薯", "洋蔥"], "seasonings": ["黑胡椒", "鹽", "奶油"], "steps": ["洋蔥與馬鈴薯先煮軟。", "加入豬肉煮熟。", "倒入牛奶與奶油，小火煮到濃郁。"], "photo": "images/r20.jpg"}, {"id": "r21", "name": "奶油蘑菇牛排", "cz": "Hovězí steak s houbami", "summary": "如果買到真空牛排，這道最有餐廳感。", "ingredients": ["牛肉", "蘑菇"], "seasonings": ["奶油", "蒜頭", "黑胡椒", "鹽"], "steps": ["牛排擦乾後靜置回溫。", "大火煎到喜歡熟度。", "取出靜置。", "同鍋用奶油炒蒜頭和蘑菇，淋在牛排上。"], "photo": "images/r21.jpg"}, {"id": "r22", "name": "牛肉酸黃瓜三明治", "cz": "Hovězí sendvič s okurkou", "summary": "用熟牛肉片就能快速完成，適合午餐。", "ingredients": ["牛肉", "麵包", "小黃瓜", "起司"], "seasonings": ["芥末", "黑胡椒"], "steps": ["麵包切開。", "抹少量芥末。", "夾入熟牛肉、起司與小黃瓜。"], "photo": "images/r22.jpg"}, {"id": "r23", "name": "牛肉馬鈴薯燉鍋", "cz": "Hovězí s bramborami", "summary": "很適合冷天，煮一 麵包"], "seasonings": ["蒜頭", "奶油", "黑胡椒", "鹽"], "steps": ["麵包切厚片。", "番茄和蒜頭炒成簡單配料。", "鋪在麵包上，再抹少量奶油。"], "photo": "images/r47.jpg"}, {"id": "r48", "name": "蘑菇奶油烤馬鈴薯", "cz": "Pečené brambory s houbami", "summary": "蘑菇和馬鈴薯很適合做成烤盤料理。", "ingredients": ["蘑菇", "馬鈴薯", "洋蔥"], "seasonings": ["奶油", "黑胡椒", "鹽"], "steps": ["馬鈴薯切塊先半熟。", "與蘑菇、洋蔥拌勻。", "放奶油進烤箱烤到表面微焦。"], "photo": "images/r48.jpg"}, {"id": "r49", "name": "小黃瓜番茄冷沙拉", "cz": "Salát z okurek a rajčat", "summary": "幾乎不需要烹調，最適合搭配主菜。", "ingredients": ["小黃瓜", "番茄"], "seasonings": ["黑胡椒", "鹽", "檸檬"], "steps": ["小黃瓜與番茄切塊。", "拌入鹽與黑胡椒。", "加一點檸檬汁即可。"], "photo": "images/r49.jpg"}, {"id": "r50", "name": "洋蔥蘑菇熱麵包", "cz": "Chléb s cibulí a houbami", "summary": "很適合當簡單早午餐或配湯。", "ingredients": ["洋蔥", "蘑菇", "麵包", "起司"], "seasonings": ["奶油", "黑胡椒", "鹽"], "steps": ["洋蔥與蘑菇炒到香。", "鋪在麵包上。", "撒起司後加熱到略融。"], "photo": "images/r50.jpg"}];
const GROUPS = {protein:["雞肉","豬肉","牛肉","魚","蝦","貝類","雞蛋","起司","牛奶","優格"],veg:["馬鈴薯","蘑菇","番茄","小黃瓜","甜椒","高麗菜","洋蔥","菠菜","生菜","蘋果","香蕉"],staple:["麵包","義大利麵","白飯","鮮奶油","吐司"]};
const state = { selected:new Set() };
function renderChips(id, arr){const root=document.getElementById(id);root.innerHTML="";arr.forEach(item=>{const btn=document.createElement("button");btn.className="chip";btn.textContent=item;btn.onclick=()=>{if(state.selected.has(item)){state.selected.delete(item);btn.classList.remove("active")}else{state.selected.add(item);btn.classList.add("active")}render()};root.appendChild(btn);});}
renderChips("proteinChips", GROUPS.protein);renderChips("vegChips", GROUPS.veg);renderChips("stapleChips", GROUPS.staple);
const grid=document.getElementById("grid");const stats=document.getElementById("stats");
function matches(recipe){if(state.selected.size===0) return true;for(const item of state.selected){if(!recipe.ingredients.includes(item)) return false;}return true;}
function card(r){return `<article class="card"><button class="titleBtn" onclick="openRecipe('${r.id}')"><div class="title">${r.name}</div><div class="cz">${r.cz}</div></button><div class="tags">${r.ingredients.slice(0,7).map(i=>`<span class="tag">${i}</span>`).join("")}</div></article>`;}
function render(){const list=RECIPES.filter(matches);stats.textContent=`目前顯示 ${list.length} 道料理`;if(list.length===0){grid.innerHTML=`<div class="card"><div class="title">找不到符合條件的料理</div><div class="cz">建議先減少 1-2 個食材條件</div></div>`;return;}grid.innerHTML=list.map(card).join("");}
const modal=document.getElementById("modal");const modalBody=document.getElementById("modalBody");const mTitle=document.getElementById("mTitle");
window.openRecipe=function(id){const r=RECIPES.find(x=>x.id===id);if(!r) return;mTitle.textContent=r.name;modalBody.innerHTML=`<div class="heroImg"><img src="${r.photo}" alt="${r.name}"></div><div class="info"><div class="infoCard"><small>捷克文名稱</small><strong>${r.cz}</strong></div><div class="infoCard"><small>主要食材</small><strong>${r.ingredients.join("、")}</strong></div></div><div class="section"><strong>這道菜重點</strong><div style="margin-top:8px;color:var(--muted);line-height:1.7">${r.summary}</div></div><div class="section"><strong>需要食材</strong><ul>${r.ingredients.map(x=>`<li>${x}</li>`).join("")}</ul><div class="note">調味與輔助材料：${r.seasonings.join("、")}</div></div><div class="section"><strong>詳細作法</strong><ol>${r.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>`;modal.classList.add("open");};
document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");modal.onclick=(e)=>{if(e.target===modal) modal.classList.remove("open");};
const floatPanel=document.getElementById("floatPanel");const toggleBtn=document.getElementById("toggleBtn");toggleBtn.onclick=()=>{floatPanel.classList.toggle("open");toggleBtn.textContent=floatPanel.classList.contains("open")?"收合":"展開";};
document.getElementById("resetBtn").onclick=()=>{state.selected.clear();document.querySelectorAll('.chip').forEach(ch=>ch.classList.remove('active'));render();};
render();
</script></body></html>
