function makeChips(containerId, items, onClick){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  items.forEach(item=>{
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = item;
    chip.addEventListener("click", ()=>onClick(chip, item));
    el.appendChild(chip);
  });
}
function toggleChip(setRef, value, chip){
  if(setRef.has(value)){ setRef.delete(value); chip.classList.remove("active"); }
  else { setRef.add(value); chip.classList.add("active"); }
  render();
}

makeChips("timeChips", timeOptions, (chip, item)=>toggleChip(state.times, item, chip));

function parseMinutes(str){
  const n = parseFloat((str || "").replace(/[^\d.]/g, "")) || 0;
  return n;
}
function timeMatch(recipe){
  if(state.times.size===0) return true;
  const mins = parseMinutes(recipe.time);
  for(const t of state.times){
    if(t==="10分鐘內" && mins <= 10) return true;
    if(t==="15分鐘內" && mins <= 15) return true;
    if(t==="20分鐘內" && mins <= 20) return true;
    if(t==="30分鐘內" && mins <= 30) return true;
    if(t==="30分鐘以上" && mins > 30) return true;
  }
  return false;
}
function includesAllSelected(recipe){
  if(state.meals.size && !state.meals.has(recipe.meal)) return false;
  if(state.methods.size && !state.methods.has(recipe.method)) return false;
  if(!timeMatch(recipe)) return false;
  if(state.facets.size){
    for(const f of state.facets){
      if(!(recipe.facets.includes(f) || recipe.ingredients.includes(f))) return false;
    }
  }
  if(state.q){
    const hay = [recipe.name, recipe.cz, recipe.meal, recipe.method, recipe.time, recipe.summary].concat(recipe.ingredients, recipe.facets).join(" ").toLowerCase();
    const q = state.q.toLowerCase().trim();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function card(recipe){
  const tags = recipe.facets.map(t=>`<span class="tag">${t}</span>`).join("");
  const ings = recipe.ingredients.slice(0,5).map(i=>`<span class="badge">${i}</span>`).join("");
  return `
  <article class="card">
    <div class="thumb"><img loading="lazy" src="${recipe.photo}" alt="${recipe.name}"></div>
    <div class="body">
      <div class="title">${recipe.name}</div>
      <div class="cz">${recipe.cz}</div>
      <div class="meta">
        <span class="badge">${recipe.meal}</span>
        <span class="badge">${recipe.method}</span>
        <span class="badge">${recipe.time}</span>
        <span class="badge">${recipe.difficulty}</span>
      </div>
      <div class="summary">${recipe.summary}</div>
      <div class="meta">${ings}</div>
      <div class="tags">${tags}</div>
      <div class="actions">
        <button class="secondary" onclick="quickFilter('${recipe.meal}')">看同餐別</button>
        <button class="primary" onclick="openRecipe('${recipe.id}')">查看食譜</button>
      </div>
    </div>
  </article>`;
}
function render(){
  const filtered = RECIPES.filter(includesAllSelected);
  stats.textContent = `目前顯示 ${filtered.length} 道料理`;
  if(filtered.length===0){
    grid.innerHTML = `<div class="panel"><strong>找不到符合條件的料理。</strong><div class="sub">建議先清掉 1-2 個食材條件，或只留餐別與時間。</div></div>`;
  } else {
    grid.innerHTML = filtered.map(card).join("");
  }
}
window.quickFilter = function(meal){
  state.meals = new Set([meal]);
  document.querySelectorAll('#mealChips .chip').forEach(ch=>ch.classList.toggle('active', ch.textContent===meal));
  render();
}
window.openRecipe = function(id){
  const r = RECIPES.find(x=>x.id===id);
  if(!r) return;
  mTitle.textContent = r.name;
  modalBody.innerHTML = `
    <div class="sheetHero"><img src="${r.photo}" alt="${r.name}"></div>
    <div class="infoGrid">
      <div class="info"><small>捷克文名稱</small><strong>${r.cz}</strong></div>
      <div class="info"><small>餐別 / 時間</small><strong>${r.meal} · ${r.time}</strong></div>
      <div class="info"><small>料理方式</small><strong>${r.method}</strong></div>
      <div class="info"><small>難度</small><strong>${r.difficulty}</strong></div>
    </div>
    <div class="ing"><strong>需要食材</strong><ul>${r.ingredients.map(i=>`<li>${i}</li>`).join("")}</ul></div>
    <div class="steps"><strong>詳細作法</strong><ol>${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
    <div class="ing"><strong>這道菜的重點</strong><div style="margin-top:8px; color:var(--muted); line-height:1.7">${r.summary}</div></div>
  `;
  modal.classList.add("open");
}
document.getElementById("closeModal").addEventListener("click", ()=>modal.classList.remove("open"));
modal.addEventListener("click", (e)=>{ if(e.target===modal) modal.classList.remove("open"); });
searchInput.addEventListener("input", e=>{ state.q = e.target.value; render(); });
document.getElementById("clearAll").addEventListener("click", ()=>{
  state.q = ""; searchInput.value = "";
  state.meals.clear(); state.facets.clear(); state.methods.clear(); state.times.clear();
  document.querySelectorAll(".chip").forEach(ch=>ch.classList.remove("active"));
  render();
});
render();
</script>
</body>
</html>
