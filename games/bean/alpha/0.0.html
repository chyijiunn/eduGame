<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>豆子磨擦力實驗</title>
<style>
  :root{
    --bg:#f6f1e8;
    --panel:#fffaf1;
    --ink:#2f2923;
    --muted:#8a7b68;
    --line:#d8c8b0;
    --accent:#8c6239;
    --accent2:#b8874d;
    --soft:#eadcc8;
    --floor:#b99b73;
    --danger:#a65338;
    --shadow:0 10px 30px rgba(65,45,25,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;overflow-x:hidden;}
  body{touch-action:manipulation;}
  button,input{font:inherit;}
  .app{width:min(1180px,100vw);margin:0 auto;padding:10px clamp(8px,2vw,18px) 18px;}
  .tabs{display:flex;gap:8px;align-items:center;justify-content:center;margin:2px 0 8px;}
  .tab{border:1px solid var(--line);background:rgba(255,250,241,.8);color:var(--muted);height:38px;min-width:68px;border-radius:999px;box-shadow:none;cursor:pointer;font-weight:800;letter-spacing:.03em;}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .scene{display:none;}
  .scene.active{display:block;}
  .topControls,.bottomControls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;}
  .card{background:rgba(255,250,241,.86);border:1px solid var(--line);border-radius:18px;padding:9px;box-shadow:var(--shadow);min-width:0;}
  .toprow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;}
  .pill{height:36px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-weight:800;white-space:nowrap;cursor:pointer;}
  .pill:active{transform:translateY(1px);}
  .pill.secondary{background:var(--soft);}
  .pill.reset{background:#fff4ec;color:var(--danger);border-color:#e1bca9;}
  .sliderBlock{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;margin:6px 0;}
  .label{width:34px;text-align:center;color:var(--ink);font-weight:900;font-size:13px;}
  .value{width:38px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;}
  input[type="range"]{width:100%;accent-color:var(--accent);}
  .worldWrap{position:relative;background:linear-gradient(180deg,#fffaf1 0%,#f3e7d5 100%);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;}
  canvas{display:block;width:100%;height:min(55vh,500px);min-height:315px;touch-action:none;cursor:grab;}
  canvas.dragging{cursor:grabbing;}
  .hud{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);pointer-events:none;}
  .metric{margin:0 8px 8px;background:rgba(255,250,241,.82);border:1px solid rgba(216,200,176,.8);border-radius:14px;padding:5px 8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted);backdrop-filter:blur(5px);}
  .metric strong{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;}
  .tiny{font-size:11px;color:var(--muted);line-height:1.25;}
  .scene2box{height:min(70vh,560px);min-height:360px;border:1px dashed var(--line);background:rgba(255,250,241,.65);border-radius:22px;box-shadow:var(--shadow);display:grid;place-items:center;color:#b2a38f;font-size:64px;}
  .scene2box small{display:block;font-size:13px;letter-spacing:.08em;text-align:center;color:var(--muted);margin-top:8px;}
  @media (max-width:720px){
    .app{padding:8px 6px 12px;}
    .topControls,.bottomControls{gap:5px;}
    .card{padding:7px;border-radius:14px;}
    .toprow{grid-template-columns:1fr;gap:5px;}
    .pill{height:32px;padding:0 7px;font-size:12px;}
    .sliderBlock{grid-template-columns:auto 1fr;gap:4px;margin:5px 0;}
    .value{display:none;}
    .label{width:25px;font-size:12px;}
    canvas{height:58vh;min-height:390px;}
    .metric{margin:0 4px 5px;padding:4px 5px;gap:3px;font-size:10px;border-radius:10px;grid-template-columns:1fr;}
    .metric strong{font-size:12px;}
    .tiny{display:none;}
  }
  @media (max-width:430px){
    .tab{height:34px;min-width:54px;font-size:12px;}
    .topControls,.bottomControls{grid-template-columns:repeat(3,minmax(0,1fr));}
    .card{padding:5px;}
    .pill{font-size:11px;height:30px;}
    .label{width:22px;}
    input[type="range"]{height:22px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="tabs" aria-label="場景切換">
    <button class="tab active" data-scene="one" title="場景一">●●●</button>
    <button class="tab" data-scene="two" title="場景二">棒</button>
  </div>

  <section id="scene-one" class="scene active">
    <div class="topControls" id="topControls"></div>
    <div class="worldWrap">
      <canvas id="world" aria-label="豆子顆粒模擬畫布"></canvas>
      <div class="hud" id="hud"></div>
    </div>
    <div class="bottomControls" id="bottomControls"></div>
  </section>

  <section id="scene-two" class="scene">
    <div class="scene2box">
      <div>棒<small>場景二保留</small></div>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d', { alpha: false });
  const topControls = document.getElementById('topControls');
  const bottomControls = document.getElementById('bottomControls');
  const hud = document.getElementById('hud');

  const ZONE_COUNT = 3;
  const MAX_PARTICLES_PER_ZONE = 650;
  const PARTICLE_RADIUS = 5.0;
  const MAX_DT = 1.35;

  let dpr = 1;
  let worldW = 1000;
  let worldH = 460;
  let lastT = performance.now();
  let particles = [];
  let spawnQueues = [0,0,0];
  let frameCount = 0;
  let dragging = false;
  let activePointer = null;
  let pan = { x: 0, y: 0 };
  let twoTouch = null;

  const zones = Array.from({length: ZONE_COUNT}, (_, i) => ({
    i,
    count: 100,
    density: 1.0,
    grainFriction: 0.55,
    tableFriction: 0.55,
    metrics: { h: 0, a: 0, stable: false, count: 0 },
    x0: 0,
    x1: 0,
    floor: 0,
    colorSeed: i * 37 + 11,
  }));

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function rand(min,max){ return min + Math.random()*(max-min); }
  function fmt(n){ return Number.isFinite(n) ? n.toFixed(1) : '0.0'; }

  function makeSlider({label, min, max, step, value, onInput}){
    const wrap = document.createElement('div');
    wrap.className = 'sliderBlock';
    const lab = document.createElement('div');
    lab.className = 'label';
    lab.textContent = label;
    const input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = value;
    const val = document.createElement('div');
    val.className = 'value';
    val.textContent = value;
    input.addEventListener('input', () => {
      val.textContent = input.value;
      onInput(Number(input.value));
    });
    wrap.append(lab, input, val);
    return wrap;
  }

  function buildUI(){
    topControls.innerHTML = '';
    bottomControls.innerHTML = '';
    hud.innerHTML = '';
    zones.forEach((z, idx) => {
      const top = document.createElement('div');
      top.className = 'card';
      const row = document.createElement('div');
      row.className = 'toprow';
      const countSlider = makeSlider({
        label: '豆', min: 100, max: 500, step: 50, value: z.count,
        onInput: v => z.count = v
      });
      const pour = document.createElement('button');
      pour.className = 'pill';
      pour.textContent = '倒豆子';
      pour.addEventListener('click', () => pourBeans(idx));
      row.append(countSlider, pour);
      top.append(row);
      topControls.append(top);

      const bottom = document.createElement('div');
      bottom.className = 'card';
      bottom.append(
        makeSlider({label:'ρ', min:0.4, max:2.4, step:0.1, value:z.density, onInput:v => z.density = v}),
        makeSlider({label:'μ豆', min:0.05, max:1.00, step:0.05, value:z.grainFriction, onInput:v => z.grainFriction = v}),
        makeSlider({label:'μ桌', min:0.05, max:1.00, step:0.05, value:z.tableFriction, onInput:v => z.tableFriction = v})
      );
      const reset = document.createElement('button');
      reset.className = 'pill reset';
      reset.textContent = '↺';
      reset.title = '重置';
      reset.addEventListener('click', () => resetZone(idx));
      const note = document.createElement('div');
      note.className = 'tiny';
      note.textContent = 'ρ 密度｜μ豆 粒間磨擦｜μ桌 桌面磨擦';
      const resetRow = document.createElement('div');
      resetRow.style.display = 'grid';
      resetRow.style.gridTemplateColumns = 'auto 1fr';
      resetRow.style.gap = '8px';
      resetRow.style.alignItems = 'center';
      resetRow.append(reset, note);
      bottom.append(resetRow);
      bottomControls.append(bottom);

      const m = document.createElement('div');
      m.className = 'metric';
      m.dataset.zone = idx;
      m.innerHTML = `<span>高度<strong>0.0</strong></span><span>面積<strong>0.0</strong></span>`;
      hud.append(m);
    });
  }

  function resize(){
    const rect = canvas.getBoundingClientRect();
    dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    worldW = Math.max(320, rect.width);
    worldH = Math.max(280, rect.height);
    canvas.width = Math.round(worldW * dpr);
    canvas.height = Math.round(worldH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutZones();
    keepParticlesInBounds();
  }

  function layoutZones(){
    const floor = worldH - 38;
    for(let i=0;i<ZONE_COUNT;i++){
      const x0 = i * worldW / ZONE_COUNT;
      const x1 = (i+1) * worldW / ZONE_COUNT;
      zones[i].x0 = x0;
      zones[i].x1 = x1;
      zones[i].floor = floor;
      zones[i].left = x0 + 9;
      zones[i].right = x1 - 9;
    }
  }

  function keepParticlesInBounds(){
    particles.forEach(p => {
      const z = zones[p.zone];
      p.x = clamp(p.x, z.left + p.r, z.right - p.r);
      p.y = clamp(p.y, -180, z.floor - p.r);
    });
  }

  function pourBeans(zoneIndex){
    const z = zones[zoneIndex];
    const current = particles.filter(p => p.zone === zoneIndex).length + spawnQueues[zoneIndex];
    const canAdd = Math.max(0, MAX_PARTICLES_PER_ZONE - current);
    spawnQueues[zoneIndex] += Math.min(z.count, canAdd);
  }

  function resetZone(zoneIndex){
    particles = particles.filter(p => p.zone !== zoneIndex);
    spawnQueues[zoneIndex] = 0;
    zones[zoneIndex].metrics = { h:0, a:0, stable:false, count:0 };
    updateHud();
  }

  function spawnStep(){
    for(let zi=0; zi<ZONE_COUNT; zi++){
      if(spawnQueues[zi] <= 0) continue;
      const z = zones[zi];
      const batch = Math.min(spawnQueues[zi], worldW < 650 ? 7 : 12);
      for(let k=0;k<batch;k++){
        const center = (z.left + z.right)/2;
        const spread = Math.max(18, (z.right - z.left) * 0.18);
        const x = clamp(center + rand(-spread, spread), z.left + 12, z.right - 12);
        const y = rand(-90, 4);
        const densityN = (z.density - 0.4) / 2.0;
        const r = PARTICLE_RADIUS * lerp(0.96, 1.08, densityN);
        particles.push({
          x, y,
          vx: rand(-0.7,0.7),
          vy: rand(0,0.7),
          r,
          zone: zi,
          sleep: 0,
          tone: rand(-10, 10),
          supported: false,
          stuck: false
        });
      }
      spawnQueues[zi] -= batch;
    }
  }

  function integrate(dt){
    for(const p of particles){
      p.supported = false;
      const z = zones[p.zone];
      if(p.stuck){
        if(p.y + p.r > z.floor) p.y = z.floor - p.r;
        continue;
      }
      const densityN = (z.density - 0.4) / 2.0;
      const g = 0.26 * lerp(0.82, 1.32, densityN);
      p.vy += g * dt;

      const air = lerp(0.998, 0.992, densityN);
      p.vx *= Math.pow(air, dt);
      p.vy *= Math.pow(0.999, dt);

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      const left = z.left + p.r;
      const right = z.right - p.r;
      if(p.x < left){ p.x = left; p.vx = Math.abs(p.vx) * 0.12; p.vy *= 0.93; }
      if(p.x > right){ p.x = right; p.vx = -Math.abs(p.vx) * 0.12; p.vy *= 0.93; }
      if(p.y + p.r > z.floor){
        p.y = z.floor - p.r;
        p.supported = true;
        if(p.vy > 0) p.vy *= -0.035;
        const grip = clamp(0.70 - z.tableFriction*0.48 - densityN*0.10, 0.20, 0.88);
        p.vx *= Math.pow(grip, dt);
        if(Math.abs(p.vy) < 0.16) p.vy = 0;
        if(Math.abs(p.vx) < 0.025) p.vx = 0;
      }
    }
  }

  function collide(){
    const cellSize = PARTICLE_RADIUS * 4.3;
    const grid = new Map();
    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      const key = `${p.zone}:${Math.floor(p.x/cellSize)}:${Math.floor(p.y/cellSize)}`;
      let arr = grid.get(key);
      if(!arr) grid.set(key, arr = []);
      arr.push(i);
    }

    for(let pass=0; pass<3; pass++){
      for(let i=0;i<particles.length;i++){
        const p = particles[i];
        const cx = Math.floor(p.x/cellSize);
        const cy = Math.floor(p.y/cellSize);
        for(let ox=-1; ox<=1; ox++){
          for(let oy=-1; oy<=1; oy++){
            const arr = grid.get(`${p.zone}:${cx+ox}:${cy+oy}`);
            if(!arr) continue;
            for(const j of arr){
              if(j <= i) continue;
              const q = particles[j];
              const dx = q.x - p.x;
              const dy = q.y - p.y;
              const minD = p.r + q.r;
              let d2 = dx*dx + dy*dy;
              if(d2 <= 0.0001 || d2 >= minD*minD) continue;
              const d = Math.sqrt(d2);
              const nx = dx/d;
              const ny = dy/d;
              const overlap = minD - d;
              const z = zones[p.zone];
              const densityN = (z.density - 0.4) / 2.0;
              const belowBias = clamp((Math.max(p.y, q.y) / z.floor), 0, 1);
              const pressure = 0.65 + densityN*0.95 + belowBias*0.38;

              const corr = overlap * 0.62;
              const pinv = p.stuck ? 0 : 1;
              const qinv = q.stuck ? 0 : 1;
              const invSum = pinv + qinv;
              if(invSum > 0){
                p.x -= nx * corr * (pinv / invSum);
                p.y -= ny * corr * (pinv / invSum);
                q.x += nx * corr * (qinv / invSum);
                q.y += ny * corr * (qinv / invSum);
              }

              const rvx = q.vx - p.vx;
              const rvy = q.vy - p.vy;
              const vn = rvx*nx + rvy*ny;
              const tx = -ny;
              const ty = nx;
              const vt = rvx*tx + rvy*ty;

              if(ny > 0.25 && (q.supported || q.stuck || q.y + q.r > z.floor - 2)) p.supported = true;
              if(ny < -0.25 && (p.supported || p.stuck || p.y + p.r > z.floor - 2)) q.supported = true;

              if(vn < 0.45){
                const restitution = 0.015;
                const impulse = -(1 + restitution) * vn * 0.5;
                if(!p.stuck){ p.vx -= impulse * nx; p.vy -= impulse * ny; }
                if(!q.stuck){ q.vx += impulse * nx; q.vy += impulse * ny; }

                const mu = clamp(z.grainFriction * pressure, 0.04, 1.65);
                const maxF = Math.max(0.025, Math.abs(impulse) * mu + overlap*0.010*mu);
                const f = clamp(-vt * 0.58, -maxF, maxF);
                if(!p.stuck){ p.vx -= f * tx; p.vy -= f * ty; }
                if(!q.stuck){ q.vx += f * tx; q.vy += f * ty; }
                const staticGrip = (z.grainFriction*0.62 + z.tableFriction*0.38) * (0.78 + densityN*0.55);
                if(p.supported && !p.stuck && Math.abs(p.vx)+Math.abs(p.vy) < 0.23*staticGrip) { p.vx=0; p.vy=0; p.stuck = staticGrip > 0.18; }
                if(q.supported && !q.stuck && Math.abs(q.vx)+Math.abs(q.vy) < 0.23*staticGrip) { q.vx=0; q.vy=0; q.stuck = staticGrip > 0.18; }
              }
            }
          }
        }
      }
      // enforce walls after each pass
      for(const p of particles){
        const z = zones[p.zone];
        p.x = clamp(p.x, z.left + p.r, z.right - p.r);
        if(p.y + p.r > z.floor) p.y = z.floor - p.r;
      }
    }
  }

  function relaxPile(dt){
    // 額外的顆粒「休止」近似：磨擦越大、越接近底層，水平滑移越快停止。
    for(const p of particles){
      const z = zones[p.zone];
      if(p.stuck){
        if(p.y + p.r > z.floor) p.y = z.floor - p.r;
        continue;
      }
      const densityN = (z.density - 0.4) / 2.0;
      const nearFloor = clamp((p.y - worldH*0.32) / (z.floor - worldH*0.32), 0, 1);
      const slopeGrip = clamp((z.grainFriction*0.58 + z.tableFriction*0.42) * (0.78 + densityN*0.55) * nearFloor, 0, 1.35);
      const supportedBoost = p.supported ? 1.65 : 0.55;
      p.vx *= Math.pow(clamp(1 - slopeGrip*0.11*supportedBoost, 0.62, 0.992), dt);
      if(p.supported) p.vy *= Math.pow(0.80, dt);
      if(Math.abs(p.vx) < 0.012 && Math.abs(p.vy) < 0.060 && (p.supported || p.y > z.floor - p.r - 2)){
        p.vx = 0; p.vy = 0;
      }
    }
  }

  function updateMetrics(){
    if(frameCount % 12 !== 0) return;
    for(const z of zones){
      const ps = particles.filter(p => p.zone === z.i);
      if(ps.length === 0){ z.metrics = { h:0, a:0, stable:false, count:0 }; continue; }
      let minY = Infinity, minX = Infinity, maxX = -Infinity, speedSum = 0;
      for(const p of ps){
        minY = Math.min(minY, p.y - p.r);
        minX = Math.min(minX, p.x - p.r);
        maxX = Math.max(maxX, p.x + p.r);
        speedSum += Math.abs(p.vx) + Math.abs(p.vy);
      }
      const heightUnit = 10;
      const areaUnit = 100;
      const h = Math.max(0, (z.floor - minY) / heightUnit);
      const footprintWidth = Math.max(0, maxX - minX);
      const a = (footprintWidth * (PARTICLE_RADIUS*2)) / areaUnit;
      const stable = spawnQueues[z.i] === 0 && (speedSum / ps.length) < 0.075;
      z.metrics = { h, a, stable, count: ps.length };
    }
    updateHud();
  }

  function updateHud(){
    hud.querySelectorAll('.metric').forEach(el => {
      const z = zones[Number(el.dataset.zone)];
      const strongs = el.querySelectorAll('strong');
      const mark = z.metrics.stable ? '' : '…';
      strongs[0].textContent = fmt(z.metrics.h) + mark;
      strongs[1].textContent = fmt(z.metrics.a) + mark;
    });
  }

  function draw(){
    ctx.clearRect(0,0,worldW,worldH);
    const grad = ctx.createLinearGradient(0,0,0,worldH);
    grad.addColorStop(0,'#fffaf1');
    grad.addColorStop(1,'#eee0cb');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,worldW,worldH);

    // subtle grid
    ctx.save();
    ctx.strokeStyle = 'rgba(180,150,110,.13)';
    ctx.lineWidth = 1;
    const grid = 24;
    for(let x=0; x<worldW; x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,worldH); ctx.stroke(); }
    for(let y=0; y<worldH; y+=grid){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(worldW,y); ctx.stroke(); }
    ctx.restore();

    // zones, dividers, floors
    for(const z of zones){
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.fillRect(z.x0,0,z.x1-z.x0,worldH);
      ctx.fillStyle = '#b99b73';
      ctx.fillRect(z.x0+9,z.floor,z.x1-z.x0-18,12);
      ctx.fillStyle = 'rgba(94,68,45,.12)';
      ctx.fillRect(z.x0+9,z.floor+12,z.x1-z.x0-18,worldH-z.floor-12);
      // pour guide
      ctx.strokeStyle = 'rgba(140,98,57,.22)';
      ctx.setLineDash([5,6]);
      ctx.beginPath();
      const c = (z.left+z.right)/2;
      ctx.moveTo(c, 0); ctx.lineTo(c, Math.min(70, z.floor-20)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(118,91,63,.25)';
    ctx.lineWidth = 1.5;
    for(let i=1;i<ZONE_COUNT;i++){
      const x = i*worldW/ZONE_COUNT;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,worldH); ctx.stroke();
    }

    // particles sorted by y for more natural overlap
    const sorted = particles.slice().sort((a,b)=>a.y-b.y);
    for(const p of sorted){
      const z = zones[p.zone];
      const baseHue = 31 + p.tone*0.25;
      const light = 42 + p.tone*0.15;
      ctx.beginPath();
      ctx.fillStyle = `hsl(${baseHue}, 42%, ${light}%)`;
      ctx.arc(p.x + pan.x, p.y + pan.y, p.r, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(70,48,28,.22)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
      // tiny highlight, still flat enough
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,241,210,.28)';
      ctx.arc(p.x - p.r*0.28 + pan.x, p.y - p.r*0.28 + pan.y, p.r*0.26, 0, Math.PI*2);
      ctx.fill();
    }

    // spawn count hint
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '700 12px -apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial';
    zones.forEach(z => {
      if(spawnQueues[z.i] > 0){
        ctx.fillStyle = 'rgba(47,41,35,.52)';
        ctx.fillText(`+${spawnQueues[z.i]}`, (z.left+z.right)/2, 10);
      }
    });
    ctx.restore();
  }

  function tick(t){
    const dt = Math.min(MAX_DT, (t - lastT) / 16.67);
    lastT = t;
    frameCount++;
    spawnStep();
    integrate(dt);
    collide();
    relaxPile(dt);
    updateMetrics();
    draw();
    requestAnimationFrame(tick);
  }

  function getCanvasPointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left, y:e.clientY-rect.top};
  }

  function nudgeAt(x,y,zoneIndex){
    const radius = 42;
    for(const p of particles){
      if(zoneIndex !== undefined && p.zone !== zoneIndex) continue;
      const dx = p.x - x, dy = p.y - y;
      const d2 = dx*dx + dy*dy;
      if(d2 < radius*radius && d2 > 0.1){
        const d = Math.sqrt(d2);
        const push = (1 - d/radius) * 0.85;
        p.stuck = false;
        p.vx += (dx/d)*push;
        p.vy += (dy/d)*push*0.45;
      }
    }
  }

  function zoneFromX(x){ return clamp(Math.floor(x / (worldW/ZONE_COUNT)), 0, ZONE_COUNT-1); }

  canvas.addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch') return; // touch handled separately for two-finger drag
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
    dragging = true;
    activePointer = { id:e.pointerId, last:getCanvasPointFromEvent(e) };
  });
  canvas.addEventListener('pointermove', e => {
    if(!dragging || !activePointer || activePointer.id !== e.pointerId) return;
    const pt = getCanvasPointFromEvent(e);
    const dx = pt.x - activePointer.last.x;
    const dy = pt.y - activePointer.last.y;
    const zi = zoneFromX(pt.x);
    nudgeAt(pt.x, pt.y, zi);
    for(const p of particles){
      if(p.zone === zi && Math.abs(p.x - pt.x) < 34 && Math.abs(p.y - pt.y) < 34){
        p.stuck = false; p.vx += dx*0.05; p.vy += dy*0.05;
      }
    }
    activePointer.last = pt;
  });
  function endPointer(e){
    if(activePointer && activePointer.id === e.pointerId){
      dragging = false; activePointer = null; canvas.classList.remove('dragging');
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('click', e => {
    const pt = getCanvasPointFromEvent(e);
    nudgeAt(pt.x, pt.y, zoneFromX(pt.x));
  });

  // Mobile/tablet: one finger = tap/select/nudge; two fingers = drag/roll nearby beans.
  canvas.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      e.preventDefault();
      const a = e.touches[0], b = e.touches[1];
      const rect = canvas.getBoundingClientRect();
      twoTouch = { x:(a.clientX+b.clientX)/2-rect.left, y:(a.clientY+b.clientY)/2-rect.top };
    }
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    if(e.touches.length === 2 && twoTouch){
      e.preventDefault();
      const a = e.touches[0], b = e.touches[1];
      const rect = canvas.getBoundingClientRect();
      const x = (a.clientX+b.clientX)/2-rect.left;
      const y = (a.clientY+b.clientY)/2-rect.top;
      const dx = x - twoTouch.x;
      const dy = y - twoTouch.y;
      const zi = zoneFromX(x);
      nudgeAt(x,y,zi);
      for(const p of particles){
        if(p.zone === zi && Math.abs(p.x - x) < 48 && Math.abs(p.y - y) < 48){
          p.stuck = false; p.vx += dx*0.065; p.vy += dy*0.065;
        }
      }
      twoTouch = {x,y};
    }
  }, {passive:false});
  canvas.addEventListener('touchend', e => {
    if(e.touches.length < 2) twoTouch = null;
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const one = document.getElementById('scene-one');
      const two = document.getElementById('scene-two');
      if(btn.dataset.scene === 'one'){
        one.classList.add('active'); two.classList.remove('active');
        setTimeout(resize, 40);
      }else{
        two.classList.add('active'); one.classList.remove('active');
      }
    });
  });

  window.addEventListener('resize', () => setTimeout(resize, 80));
  buildUI();
  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
