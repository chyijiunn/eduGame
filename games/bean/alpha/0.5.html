<style>
  :root{
    --bg:#080b10;
    --panel:#111820;
    --panel2:#151f2a;
    --ink:#eef3f8;
    --muted:#9aa8b8;
    --line:#2a3644;
    --line2:#3b4a5d;
    --accent:#d09a50;
    --accent2:#78a8ff;
    --danger:#ff806e;
    --ok:#72d18a;
    --warn:#ffd166;
    --floor:#5c4732;
    --glass:rgba(150,190,230,.16);
    --shadow:0 18px 48px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#17202c 0%,var(--bg) 48%,#05070a 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;overflow-x:hidden;}

  button,input{font:inherit;}
  button{user-select:none;}
  .app{width:min(1220px,100vw);margin:0 auto;padding:10px clamp(8px,2vw,18px) 16px;}
  .tabs{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 8px;}
  .tab{border:1px solid var(--line);background:rgba(18,26,36,.86);color:var(--muted);height:38px;min-width:68px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;font-weight:900;letter-spacing:.03em;}
  .tab.active{background:linear-gradient(180deg,#29384a,#111a25);color:var(--ink);border-color:#536377;}
  .scene{display:none;}
  .scene.active{display:block;}
  .topControls,.bottomControls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;}
  .topControls.two,.bottomControls.two{grid-template-columns:repeat(2,1fr);}

  .pill.reset{background:#2a1516;color:#ffd9d5;border-color:#6d3032;}
  .pill.ghost{background:#0e151e;color:var(--muted);}

<script>
(() => {
  'use strict';

  const README_FALLBACK = `# 豆子摩擦力實驗操作說明

這個互動頁面有兩個場景，目標是觀察「顆粒堆積」與「顆粒卡塞」如何受到摩擦力、密度和插入深度影響。

## 場景一：豆子倒在桌面上

畫面中央有三個區域，可以分別倒入豆子做比較。

操作方式：

1. 上方的「豆」滑桿可以設定一次倒入的豆子數量，範圍是 100 到 500。
2. 按下「倒」後，豆子會落到桌面並形成堆積。
3. 下方三個滑桿可以改變同一區域的條件：
   - ρ：豆子密度。這個模型中，密度越大，下層受到壓力越明顯，豆堆越容易被壓塌並向外擴散。
   - μ豆：豆子和豆子之間的摩擦。數值越大，豆子越不容易彼此滑開。
   - μ桌：桌面和豆子之間的摩擦。數值越大，底層豆子越不容易向外滑動。
4. 豆子停止移動後，畫面下方會顯示該豆堆的高度與面積。
5. 按下重置符號，該區會清空豆子，並把數值恢復預設。

觀察重點：

- 相同摩擦條件下，ρ 較大時，豆堆比較容易塌陷、變矮、向外擴散。
- 相同摩擦條件下，ρ 較小時，豆堆比較容易保留較高的堆積。
- μ豆較大時，豆堆通常比較陡，也比較能往上堆高。
- μ桌較大時，底部比較不容易散開，豆堆的擴散面積可能變小。

## 場景二：木棒插入豆子杯

這個場景呈現一根或多根木棒插入豆子中，當摩擦條件足夠時，木棒往上拉會把整杯豆子一起提起；條件不足時，木棒會滑出來。

操作方式：

1. 每個杯子上方有「放豆」按鈕。
2. 每按一次「放豆」，杯內會增加 100 顆豆子，最多 500 顆。
3. 每個杯子下方有兩組 x1、x2、x3 按鈕：
   - μ棒：棒子材質等級，代表豆子與棒子之間的摩擦力。
   - ρ：豆子密度等級，代表豆子對棒子的側向壓力效果。
4. 下方的「棒＋」可以增加棒子，最多 20 根；「－棒」會先移除最後新增的棒子。
5. 按下重置符號後，兩個杯子會恢復完整狀態，且每個杯子中央各有一根棒子。
6. 用滑鼠或手指拖曳棒子插入杯中。棒子最深會以杯底位置為界，不需要超出杯底才算插到底。
7. 同一個杯子中有兩根以上棒子插入時，杯子上方會出現「連鎖」按鈕。開啟後，拉其中一根棒子，同杯中的其他棒子會一起移動。
8. 「力圖」預設關閉。開啟後，可以看到豆子對棒子的摩擦力箭頭。μ棒 或 ρ 越大，箭頭越長。
9. 「滑出提示」預設關閉。開啟後，杯子下方會顯示目前是可提起，還是會滑出。
10. 如果杯子已經被提起，卻把棒子從杯子側面移出，杯子會掉落破裂，豆子會流出。破裂後需要按重置才能恢復。

提起判定：

- 系統使用簡化公式：有效豆子數量 × μ棒 × ρ × 棒子數量 ≥ 4500。
- 有效豆子數量會受插入深度影響。例如杯內有 500 顆豆子，但棒子只插到豆層深度的 4/5，就只算 400 顆有效豆子。
- 例子：500 顆豆子、μ棒 x2、ρ x3、2 根棒子，若插到底，分數是 500 × 2 × 3 × 2 = 6000，可以提起。

## 這不是完整真實物理

這個頁面使用簡化模型，重點是幫助觀察趨勢。真實豆子還會受到形狀、大小、表面粗糙度、杯壁摩擦、棒子粗細、插入角度等因素影響。這裡先把那些因素固定，方便比較密度與摩擦力的效果。
`;

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function rand(min,max){ return min + Math.random()*(max-min); }
  function fmt(n){ return Number.isFinite(n) ? n.toFixed(1) : '0.0'; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderMarkdown(md){
    const lines = md.replace(/\r/g,'').split('\n');
    let html = '', list = null;
    const closeList = () => { if(list){ html += `</${list}>`; list = null; } };
    const inline = s => escapeHtml(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    for(const raw of lines){
      const line = raw.trimEnd();
      if(!line.trim()){ closeList(); continue; }
      if(line.startsWith('# ')){ closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; continue; }
      if(line.startsWith('## ')){ closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
      const bullet = line.match(/^\s*-\s+(.*)$/);
      const ordered = line.match(/^\s*\d+\.\s+(.*)$/);
      if(bullet){ if(list !== 'ul'){ closeList(); list = 'ul'; html += '<ul>'; } html += `<li>${inline(bullet[1])}</li>`; continue; }
      if(ordered){ if(list !== 'ol'){ closeList(); list = 'ol'; html += '<ol>'; } html += `<li>${inline(ordered[1])}</li>`; continue; }
      closeList(); html += `<p>${inline(line.trim())}</p>`;
    }
    closeList();
    return html;
  }

  function makeSlider({label, min, max, step, value, onInput}){
    const wrap = document.createElement('div');
    wrap.className = 'sliderBlock';
    const lab = document.createElement('div');
    lab.className = 'label';
    lab.textContent = label;
    const input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = value;
    const val = document.createElement('div');
    val.className = 'value';
    val.textContent = value;
    input.addEventListener('input', () => {
      val.textContent = input.value;
      onInput(Number(input.value));
    });
    wrap.append(lab, input, val);
    return {wrap, input, val, set(v){ input.value = v; val.textContent = String(v); onInput(Number(v)); }};
  }

  // ------------------------ Scene 1 ------------------------
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d', { alpha: false });
  const topControls = document.getElementById('topControls');
  const bottomControls = document.getElementById('bottomControls');
  const hud = document.getElementById('hud');
  const ZONE_COUNT = 3;
  const MAX_PARTICLES_PER_ZONE = 650;
  const PARTICLE_RADIUS = 5.0;
  const MAX_DT = 1.35;
  const S1_DEFAULT = { count:100, density:1.0, grainFriction:0.55, tableFriction:0.55 };
  let dpr = 1, worldW = 1000, worldH = 460, lastT = performance.now(), frameCount = 0;
  let particles = [], spawnQueues = [0,0,0], particleSerial = 1;
  let dragging = false, activePointer = null, twoTouch = null;

  const zones = Array.from({length: ZONE_COUNT}, (_, i) => ({
    i,
    count:S1_DEFAULT.count,
    density:S1_DEFAULT.density,
    grainFriction:S1_DEFAULT.grainFriction,
    tableFriction:S1_DEFAULT.tableFriction,
    metrics:{ h:0, a:0, stable:false, count:0 },
    x0:0,x1:0,floor:0,left:0,right:0,
    ctrl:{}
  }));

  function buildScene1UI(){
    topControls.innerHTML = '';
    bottomControls.innerHTML = '';
    hud.innerHTML = '';
    zones.forEach((z, idx) => {
      const top = document.createElement('div');
      top.className = 'card';
      const row = document.createElement('div');
      row.className = 'toprow';

  }

  function resizeScene1(){
    const rect = canvas.getBoundingClientRect();
    if(rect.width < 2 || rect.height < 2) return;
    dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    worldW = Math.max(320, rect.width);
    worldH = Math.max(280, rect.height);
    canvas.width = Math.round(worldW * dpr);
    canvas.height = Math.round(worldH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutZones();
    keepParticlesInBounds();
  }

  function layoutZones(){
    const floor = worldH - 38;
    for(let i=0;i<ZONE_COUNT;i++){
      const x0 = i * worldW / ZONE_COUNT;
      const x1 = (i+1) * worldW / ZONE_COUNT;
      zones[i].x0 = x0; zones[i].x1 = x1; zones[i].floor = floor;
      zones[i].left = x0 + 9; zones[i].right = x1 - 9;
    }
  }

  function keepParticlesInBounds(){
    particles.forEach(p => {
      const z = zones[p.zone];
      p.x = clamp(p.x, z.left + p.r, z.right - p.r);
      p.y = clamp(p.y, -180, z.floor - p.r);
    });
  }

  function pourBeans(zoneIndex){
    const current = particles.filter(p => p.zone === zoneIndex).length + spawnQueues[zoneIndex];
    const canAdd = Math.max(0, MAX_PARTICLES_PER_ZONE - current);
    spawnQueues[zoneIndex] += Math.min(zones[zoneIndex].count, canAdd);
  }



  // 場景一 0.5：保留初版自然堆積，但修正密度高時更容易壓塌、密度低時較容易堆高。
  function resetZone(zoneIndex){
    particles = particles.filter(p => p.zone !== zoneIndex);
    spawnQueues[zoneIndex] = 0;
    const z = zones[zoneIndex];
    z.metrics = { h:0, a:0, stable:false, count:0 };
    z.ctrl.countSlider.set(S1_DEFAULT.count);
    z.ctrl.density.set(S1_DEFAULT.density);
    z.ctrl.grain.set(S1_DEFAULT.grainFriction);
    z.ctrl.table.set(S1_DEFAULT.tableFriction);
    updateHud();
  }

  function spawnStep(){
    for(let zi=0; zi<ZONE_COUNT; zi++){
      if(spawnQueues[zi] <= 0) continue;
      const z = zones[zi];
      const batch = Math.min(spawnQueues[zi], worldW < 650 ? 7 : 12);
      for(let k=0;k<batch;k++){
        const center = (z.left + z.right)/2;
        const spread = Math.max(18, (z.right - z.left) * 0.18);
        const x = clamp(center + rand(-spread, spread), z.left + 12, z.right - 12);
        const y = rand(-90, 4);
        const densityN = (z.density - 0.4) / 2.0;
        const r = PARTICLE_RADIUS * lerp(1.06, 0.96, densityN);
        particles.push({
          x, y,
          vx: rand(-0.7,0.7),
          vy: rand(0,0.7),
          r,
          zone: zi,
          sleep: 0,
          tone: rand(-10, 10),
          supported: false,
          stuck: false
        });
      }
      spawnQueues[zi] -= batch;
    }
  }

  function integrate(dt){
    for(const p of particles){
      p.supported = false;
      const z = zones[p.zone];
      if(p.stuck){
        if(p.y + p.r > z.floor) p.y = z.floor - p.r;
        continue;
      }
      const densityN = (z.density - 0.4) / 2.0;
      const g = 0.26 * lerp(0.82, 1.32, densityN);
      p.vy += g * dt;

      const air = lerp(0.998, 0.992, densityN);
      p.vx *= Math.pow(air, dt);
      p.vy *= Math.pow(0.999, dt);

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      const left = z.left + p.r;
      const right = z.right - p.r;
      if(p.x < left){ p.x = left; p.vx = Math.abs(p.vx) * 0.12; p.vy *= 0.93; }
      if(p.x > right){ p.x = right; p.vx = -Math.abs(p.vx) * 0.12; p.vy *= 0.93; }
      if(p.y + p.r > z.floor){
        p.y = z.floor - p.r;
        p.supported = true;
        if(p.vy > 0) p.vy *= -0.035;
        const grip = clamp(0.70 - z.tableFriction*0.48 + densityN*0.22, 0.22, 0.94);
        p.vx *= Math.pow(grip, dt);
        if(Math.abs(p.vy) < 0.16) p.vy = 0;
        if(Math.abs(p.vx) < 0.025) p.vx = 0;
      }
    }
  }

  function collide(){
    const cellSize = PARTICLE_RADIUS * 4.3;
    const grid = new Map();
    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      const key = `${p.zone}:${Math.floor(p.x/cellSize)}:${Math.floor(p.y/cellSize)}`;
      let arr = grid.get(key);
      if(!arr) grid.set(key, arr = []);
      arr.push(i);
    }

    for(let pass=0; pass<3; pass++){
      for(let i=0;i<particles.length;i++){
        const p = particles[i];
        const cx = Math.floor(p.x/cellSize);
        const cy = Math.floor(p.y/cellSize);
        for(let ox=-1; ox<=1; ox++){
          for(let oy=-1; oy<=1; oy++){
            const arr = grid.get(`${p.zone}:${cx+ox}:${cy+oy}`);
            if(!arr) continue;
            for(const j of arr){
              if(j <= i) continue;
              const q = particles[j];
              const dx = q.x - p.x;
              const dy = q.y - p.y;
              const minD = p.r + q.r;
              let d2 = dx*dx + dy*dy;
              if(d2 <= 0.0001 || d2 >= minD*minD) continue;
              const d = Math.sqrt(d2);
              const nx = dx/d;
              const ny = dy/d;
              const overlap = minD - d;
              const z = zones[p.zone];
              const densityN = (z.density - 0.4) / 2.0;
              const belowBias = clamp((Math.max(p.y, q.y) / z.floor), 0, 1);
              const pressure = 0.70 + (1-densityN)*0.70 + belowBias*0.26;

              const corr = overlap * 0.62;
              const pinv = p.stuck ? 0 : 1;
              const qinv = q.stuck ? 0 : 1;
              const invSum = pinv + qinv;
              if(invSum > 0){
                p.x -= nx * corr * (pinv / invSum);
                p.y -= ny * corr * (pinv / invSum);
                q.x += nx * corr * (qinv / invSum);
                q.y += ny * corr * (qinv / invSum);
              }

              const rvx = q.vx - p.vx;
              const rvy = q.vy - p.vy;
              const vn = rvx*nx + rvy*ny;
              const tx = -ny;
              const ty = nx;
              const vt = rvx*tx + rvy*ty;

              if(ny > 0.25 && (q.supported || q.stuck || q.y + q.r > z.floor - 2)) p.supported = true;
              if(ny < -0.25 && (p.supported || p.stuck || p.y + p.r > z.floor - 2)) q.supported = true;

              if(vn < 0.45){
                const restitution = 0.015;
                const impulse = -(1 + restitution) * vn * 0.5;
                if(!p.stuck){ p.vx -= impulse * nx; p.vy -= impulse * ny; }
                if(!q.stuck){ q.vx += impulse * nx; q.vy += impulse * ny; }

                const mu = clamp(z.grainFriction * pressure, 0.04, 1.65);
                const maxF = Math.max(0.025, Math.abs(impulse) * mu + overlap*0.010*mu);
                const f = clamp(-vt * 0.58, -maxF, maxF);
                if(!p.stuck){ p.vx -= f * tx; p.vy -= f * ty; }
                if(!q.stuck){ q.vx += f * tx; q.vy += f * ty; }
                const staticGrip = (z.grainFriction*0.62 + z.tableFriction*0.38) * (1.18 - densityN*0.56);
                if(p.supported && !p.stuck && Math.abs(p.vx)+Math.abs(p.vy) < 0.23*staticGrip) { p.vx=0; p.vy=0; p.stuck = staticGrip > 0.18; }
                if(q.supported && !q.stuck && Math.abs(q.vx)+Math.abs(q.vy) < 0.23*staticGrip) { q.vx=0; q.vy=0; q.stuck = staticGrip > 0.18; }
              }
            }
          }
        }
      }
      // enforce walls after each pass
      for(const p of particles){
        const z = zones[p.zone];
        p.x = clamp(p.x, z.left + p.r, z.right - p.r);
        if(p.y + p.r > z.floor) p.y = z.floor - p.r;
      }
    }
  }

  function relaxPile(dt){
    // 額外的顆粒「休止」近似：磨擦越大、越接近底層，水平滑移越快停止。
    for(const p of particles){
      const z = zones[p.zone];
      if(p.stuck){
        if(p.y + p.r > z.floor) p.y = z.floor - p.r;
        continue;
      }
      const densityN = (z.density - 0.4) / 2.0;
      const nearFloor = clamp((p.y - worldH*0.32) / (z.floor - worldH*0.32), 0, 1);
      const slopeGrip = clamp((z.grainFriction*0.58 + z.tableFriction*0.42) * (1.22 - densityN*0.62) * nearFloor, 0, 1.35);
      const supportedBoost = p.supported ? 1.65 : 0.55;
      if(densityN > 0.45 && p.supported && Math.abs(p.vx) < 0.18){
        const center = (z.left + z.right) / 2;
        const outward = p.x >= center ? 1 : -1;
        p.vx += outward * (densityN - 0.45) * 0.010 * dt;
      }
      p.vx *= Math.pow(clamp(1 - slopeGrip*0.11*supportedBoost, 0.62, 0.992), dt);
      if(p.supported) p.vy *= Math.pow(0.80, dt);
      if(Math.abs(p.vx) < 0.012 && Math.abs(p.vy) < 0.060 && (p.supported || p.y > z.floor - p.r - 2)){
        p.vx = 0; p.vy = 0;
      }
    }
  }

  function updateMetrics(){
    if(frameCount % 12 !== 0) return;
    for(const z of zones){
      const ps = particles.filter(p => p.zone === z.i);
      if(!ps.length){ z.metrics = {h:0,a:0,stable:false,count:0}; continue; }
      let minY=Infinity,minX=Infinity,maxX=-Infinity,speedSum=0;
      for(const p of ps){ minY=Math.min(minY,p.y-p.r); minX=Math.min(minX,p.x-p.r); maxX=Math.max(maxX,p.x+p.r); speedSum += Math.abs(p.vx)+Math.abs(p.vy); }
      const h = Math.max(0,(z.floor-minY)/10);
      const a = (Math.max(0,maxX-minX)*(PARTICLE_RADIUS*2))/100;
      const stable = spawnQueues[z.i]===0 && (speedSum/ps.length)<0.075;
      z.metrics = {h,a,stable,count:ps.length};
    }
    updateHud();
  }

  function updateHud(){
    hud.querySelectorAll('.metric').forEach(el => {
      const z = zones[Number(el.dataset.zone)], strongs = el.querySelectorAll('strong'), mark = z.metrics.stable ? '' : '…';
      strongs[0].textContent = fmt(z.metrics.h) + mark;
      strongs[1].textContent = fmt(z.metrics.a) + mark;
    });
  }

  function drawScene1(){
    ctx.clearRect(0,0,worldW,worldH);
    const grad = ctx.createLinearGradient(0,0,0,worldH);
    grad.addColorStop(0,'#111a25'); grad.addColorStop(1,'#070b10');
    ctx.fillStyle = grad; ctx.fillRect(0,0,worldW,worldH);
    ctx.save();
    ctx.strokeStyle = 'rgba(125,150,180,.10)'; ctx.lineWidth = 1;
    const grid = 24;
    for(let x=0; x<worldW; x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,worldH); ctx.stroke(); }
    for(let y=0; y<worldH; y+=grid){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(worldW,y); ctx.stroke(); }
    ctx.restore();
    for(const z of zones){
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.025)'; ctx.fillRect(z.x0,0,z.x1-z.x0,worldH);
      ctx.fillStyle = '#5c4732'; ctx.fillRect(z.x0+9,z.floor,z.x1-z.x0-18,12);
      ctx.fillStyle = 'rgba(0,0,0,.20)'; ctx.fillRect(z.x0+9,z.floor+12,z.x1-z.x0-18,worldH-z.floor-12);
      ctx.strokeStyle = 'rgba(208,154,80,.28)'; ctx.setLineDash([5,6]);
      const c = (z.left+z.right)/2;
      ctx.beginPath(); ctx.moveTo(c,0); ctx.lineTo(c,Math.min(70,z.floor-20)); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
    ctx.strokeStyle = 'rgba(130,150,175,.30)'; ctx.lineWidth = 1.2;
    for(let i=1;i<ZONE_COUNT;i++){ const x=i*worldW/ZONE_COUNT; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,worldH); ctx.stroke(); }
    const sorted = particles.slice().sort((a,b)=>a.y-b.y);
    for(const p of sorted){
      const baseHue = 31 + p.tone*0.25, light = 46 + p.tone*0.15;
      ctx.beginPath(); ctx.fillStyle = `hsl(${baseHue}, 46%, ${light}%)`; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(20,14,8,.42)'; ctx.lineWidth=.6; ctx.stroke();
      ctx.beginPath(); ctx.fillStyle='rgba(255,235,195,.28)'; ctx.arc(p.x-p.r*.28,p.y-p.r*.28,p.r*.26,0,Math.PI*2); ctx.fill();
    }
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font='800 12px -apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial';
    zones.forEach(z => { if(spawnQueues[z.i]>0){ ctx.fillStyle='rgba(238,243,248,.62)'; ctx.fillText(`+${spawnQueues[z.i]}`,(z.left+z.right)/2,10); } });
    ctx.restore();
  }

  function tickScene1(t){
    const dt = Math.min(MAX_DT,(t-lastT)/16.67 || 1); lastT = t; frameCount++;
    spawnStep(); integrate(dt); collide(); relaxPile(dt); updateMetrics(); drawScene1();
    requestAnimationFrame(tickScene1);
  }

  function getCanvasPoint(e, cnv){ const rect = cnv.getBoundingClientRect(); return {x:e.clientX-rect.left,y:e.clientY-rect.top}; }
  function zoneFromX(x){ return clamp(Math.floor(x/(worldW/ZONE_COUNT)),0,ZONE_COUNT-1); }
  function nudgeAt(x,y,zoneIndex){
    const radius=42;
    for(const p of particles){
      if(zoneIndex !== undefined && p.zone !== zoneIndex) continue;
      const dx=p.x-x, dy=p.y-y, d2=dx*dx+dy*dy;
      if(d2<radius*radius && d2>0.1){ const d=Math.sqrt(d2), push=(1-d/radius)*0.85; p.vx+=(dx/d)*push; p.vy+=(dy/d)*push*.45; }
    }
  }

  canvas.addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch') return;
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); dragging=true; activePointer={id:e.pointerId,last:getCanvasPoint(e,canvas)};
  });
  canvas.addEventListener('pointermove', e => {
    if(!dragging || !activePointer || activePointer.id !== e.pointerId) return;
    const pt=getCanvasPoint(e,canvas), dx=pt.x-activePointer.last.x, dy=pt.y-activePointer.last.y, zi=zoneFromX(pt.x);
    nudgeAt(pt.x,pt.y,zi);
    for(const p of particles){ if(p.zone===zi && Math.abs(p.x-pt.x)<34 && Math.abs(p.y-pt.y)<34){ p.vx+=dx*.05; p.vy+=dy*.05; } }
    activePointer.last=pt;
  });
  function endScene1Pointer(e){ if(activePointer && activePointer.id===e.pointerId){ dragging=false; activePointer=null; canvas.classList.remove('dragging'); } }
  canvas.addEventListener('pointerup', endScene1Pointer); canvas.addEventListener('pointercancel', endScene1Pointer);
  canvas.addEventListener('click', e => { const pt=getCanvasPoint(e,canvas); nudgeAt(pt.x,pt.y,zoneFromX(pt.x)); });
  canvas.addEventListener('touchstart', e => { if(e.touches.length===2){ e.preventDefault(); const a=e.touches[0],b=e.touches[1],rect=canvas.getBoundingClientRect(); twoTouch={x:(a.clientX+b.clientX)/2-rect.left,y:(a.clientY+b.clientY)/2-rect.top}; } }, {passive:false});
  canvas.addEventListener('touchmove', e => { if(e.touches.length===2 && twoTouch){ e.preventDefault(); const a=e.touches[0],b=e.touches[1],rect=canvas.getBoundingClientRect(); const x=(a.clientX+b.clientX)/2-rect.left,y=(a.clientY+b.clientY)/2-rect.top,dx=x-twoTouch.x,dy=y-twoTouch.y,zi=zoneFromX(x); nudgeAt(x,y,zi); for(const p of particles){ if(p.zone===zi && Math.abs(p.x-x)<48 && Math.abs(p.y-y)<48){ p.vx+=dx*.065; p.vy+=dy*.065; } } twoTouch={x,y}; } }, {passive:false});
  canvas.addEventListener('touchend', e => { if(e.touches.length<2) twoTouch=null; });

  // ------------------------ Scene 2 ------------------------

  const cups = [
    {i:0, beanCount:0, material:1, density:1, liftY:0, addPulse:0, chain:false, broken:false, dropping:false, dropV:0, spill:[], spillProgress:0, ctrl:{}, layout:{}},
    {i:1, beanCount:0, material:1, density:1, liftY:0, addPulse:0, chain:false, broken:false, dropping:false, dropV:0, spill:[], spillProgress:0, ctrl:{}, layout:{}}
  ];

  function layoutCups(){
    const cupW = clamp(s2W * (s2W < 640 ? 0.34 : 0.24), 126, 230);
    const cupH = clamp(s2H*.58, 230, 330);
    const top = s2H*.25;
    const centers = s2W < 640 ? [s2W*.29, s2W*.71] : [s2W*.31, s2W*.69];
    cups.forEach((cup,i) => {
      const x = clamp(centers[i] - cupW/2, 14, s2W - cupW - 14);
      cup.layout = {x, y:top, w:cupW, h:cupH, bottom:top+cupH, innerPad:14, center:x+cupW/2};
    });
    updateChainOverlay();
  }

  function rodLength(){
    const maxCupH = Math.max(...cups.map(c => c.layout && c.layout.h ? c.layout.h : 250));
    return Math.max(300, maxCupH + 86);
  }
  function makeRod(){
    return {id:rodSerial++, x:0, y:0, w:14, h:rodLength(), cup:null, parked:true, colorShift:rods.length};
  }
  function placeRodInCup(r, cup){
    r.h = rodLength();
    r.x = cup.layout.center;
    r.y = cup.layout.bottom + cup.liftY - r.h;
    r.cup = cup.i;
    r.parked = false;
  }
  function updateRodLengths(){
    const h = rodLength();
    rods.forEach(r => {
      const oldTip = r.y + r.h;
      r.h = h;
      if(r.parked){ parkRod(r); }
      else if(r.cup !== null && cups[r.cup] && !cups[r.cup].broken && !cups[r.cup].dropping){
        const cup = cups[r.cup];
        r.y = Math.min(r.y, cup.layout.bottom + cup.liftY - r.h);
      }else{
        r.y = oldTip - r.h;
      }
    });
  }
  function addRod(){
    if(rods.length >= 20) return;
    const r = makeRod();
    rods.push(r); arrangeParkedRods(); updateRodCount(); updateChainOverlay();
  }
  function removeRod(){
    if(rods.length <= 2) return;
    rods.pop();
    cups.forEach(c => { if(c.chain && rodsInCup(c).length < 2) c.chain = false; });
    arrangeParkedRods(); updateRodCount(); updateChainOverlay(); checkLiftedCups();
  }

  function resetScene2(resetValues=true){
    cups.forEach(cup => {
      cup.beanCount = 0;
      cup.material = 1;
      cup.density = 1;
      cup.liftY = 0;
      cup.addPulse = 0;
      cup.chain = false;
      cup.broken = false;
      cup.dropping = false;
      cup.dropV = 0;
      cup.spill = [];
      cup.spillProgress = 0;
      if(cup.ctrl && cup.ctrl.beanInfo) updateBeanReadout(cup.i);
      if(cup.ctrl && cup.ctrl.material) cup.ctrl.material.set(1);
      if(cup.ctrl && cup.ctrl.density) cup.ctrl.density.set(1);
    });
    rods.length = 0;
    rodSerial = 1;
    cups.forEach(cup => {
      const r = makeRod();
      rods.push(r);
      placeRodInCup(r, cup);
    });
    updateRodCount();
    updateChainOverlay();
  }

  function updateRodCount(){ rodCount.textContent = String(rods.length); }
  function arrangeParkedRods(){ rods.forEach(r => { if(r.parked) parkRod(r); }); }
  function parkRod(r){
    const parked = rods.filter(x => x.parked);
    const idx = parked.indexOf(r);
    const total = Math.max(1, parked.length);
    const spacing = clamp((s2W-52) / Math.max(1,total), 10, s2W < 520 ? 16 : 22);
    r.x = clamp(s2W/2 + (idx - (total-1)/2) * spacing, 18, s2W-18);
    r.y = 22 + (idx%2)*6;
    r.parked = true; r.cup = null;
  }

  function updateChainOverlay(){
    if(!chainOverlay) return;
    chainOverlay.innerHTML = '';
    cups.forEach(cup => {
      if(!cup.layout || !cup.layout.w) return;
      const count = rodsInCup(cup).length;
      if(count < 2){ cup.chain = false; return; }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chainBtn' + (cup.chain ? ' active' : '');
      btn.textContent = cup.chain ? '已連鎖' : '連鎖';
      btn.style.left = `${cup.layout.center}px`;
      btn.style.top = `${Math.max(24, cup.layout.y + cup.liftY - 20)}px`;
      btn.addEventListener('click', ev => { ev.stopPropagation(); cup.chain = !cup.chain; updateChainOverlay(); });
      chainOverlay.append(btn);
    });
  }

  function cupAtX(x){ return cups.find(c => !c.broken && !c.dropping && x >= c.layout.x+6 && x <= c.layout.x+c.layout.w-6); }
  function beanTop(cup){ return cup.layout.bottom + cup.liftY - (cup.layout.h-36) * (cup.beanCount/500); }
  function insertionPx(rod, cup){
    if(!cup || cup.beanCount <= 0) return 0;
    const ly = cup.layout.y + cup.liftY, by = cup.layout.bottom + cup.liftY;
    if(rod.x < cup.layout.x+12 || rod.x > cup.layout.x+cup.layout.w-12) return 0;
    const top = beanTop(cup);
    const tip = rod.y + rod.h;
    return clamp(tip - top, 0, by - top);
  }
  function insertionUnits(rod, cup){
    if(!cup || cup.beanCount<=0) return 0;
    const bed = Math.max(1, cup.layout.bottom + cup.liftY - beanTop(cup));
    return insertionPx(rod,cup) / bed * cup.beanCount;
  }
  function rodsInCup(cup){ return rods.filter(r => insertionUnits(r,cup) > 1); }
  function liftState(cup, pulledRod=null){
    if(!cup || cup.broken || cup.dropping) return {can:false, inserted:0, contributors:0, effectiveDepth:0, score:0};
    const insertedAll = rodsInCup(cup);
    let contributors;
    if(pulledRod){
      contributors = insertedAll.includes(pulledRod) ? insertedAll : [];
    }else{
      contributors = insertedAll;
    }
    if(!contributors.length) return {can:false, inserted:insertedAll.length, contributors:0, effectiveDepth:0, score:0};
    const effectiveDepth = contributors.reduce((s,r)=>s+insertionUnits(r,cup),0) / contributors.length;
    const score = effectiveDepth * cup.material * cup.density * contributors.length;
    const can = score >= 4500;
    return {can, inserted:insertedAll.length, contributors:contributors.length, effectiveDepth, score};
  }

  function updateRodCup(r){
    const cup = cupAtX(r.x);
    if(cup && insertionUnits(r,cup)>0){ r.cup = cup.i; r.parked=false; }
    else { r.cup = null; }
    updateChainOverlay();
  }

  function findRodAt(x,y){
    for(let i=rods.length-1;i>=0;i--){
      const r=rods[i];
      if(x>=r.x-r.w*1.4 && x<=r.x+r.w*1.4 && y>=r.y-12 && y<=r.y+r.h+16) return r;
    }
    return null;
  }

  function drawArrow(ctx,x1,y1,x2,y2,color){
    const ang = Math.atan2(y2-y1,x2-x1), head=6;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-Math.cos(ang-.55)*head,y2-Math.sin(ang-.55)*head); ctx.lineTo(x2-Math.cos(ang+.55)*head,y2-Math.sin(ang+.55)*head); ctx.closePath(); ctx.fill();
  }

  function seededPoint(i,cup){
    const a = Math.sin((i+1)*12.9898 + cup.i*78.233) * 43758.5453;
    const b = Math.sin((i+1)*39.3467 + cup.i*17.713) * 24634.6345;
    const rx = a - Math.floor(a), ry = b - Math.floor(b);
    return {rx, ry};
  }

  function makeSpill(cup){
    const count = cup.beanCount;
    cup.spill = [];
    const L = cup.layout;
    const startBottom = L.bottom;
    for(let i=0;i<count;i++){
      const p = seededPoint(i,cup);
      const side = (i % 2 === 0 ? -1 : 1);
      const spread = lerp(L.w*.35, Math.min(s2W*.36, L.w*1.55), p.rx);
      const targetX = clamp(L.center + side*spread, 18, s2W-18);
      const targetY = s2H - 44 - (i%5)*1.2;
      cup.spill.push({
        sx: lerp(L.x+L.w*.31, L.x+L.w*.69, p.rx),
        sy: lerp(L.y+L.h*.35, startBottom-16, p.ry),
        tx: targetX,
        ty: targetY,
        lift: 18 + (i%11)*2.2
      });
    }
    cup.spillProgress = 0;
    cup.beanCount = 0;
    updateBeanReadout(cup.i);
  }

  function triggerDrop(cup){
    if(!cup || cup.broken || cup.dropping || cup.liftY >= -4) return;
    cup.dropping = true;
    cup.dropV = 0;
    cup.chain = false;
    rods.forEach(r => { if(r.cup === cup.i) r.cup = null; });
    updateChainOverlay();
  }

  function checkLiftedCups(){
    cups.forEach(cup => {
      if(cup.liftY < -6 && !cup.broken && !cup.dropping && !liftState(cup).can){
        triggerDrop(cup);
      }
    });
  }

  function updateCupMotion(){
    cups.forEach(cup => {
      if(cup.addPulse>0) cup.addPulse = Math.max(0,cup.addPulse-.025);
      if(cup.dropping){
        cup.dropV += 0.72;
        cup.liftY += cup.dropV;
        if(cup.liftY >= 0){
          cup.liftY = 0;
          cup.dropping = false;
          cup.broken = true;
          makeSpill(cup);
        }
      }
      if(cup.broken && cup.spillProgress < 1){
        cup.spillProgress = Math.min(1, cup.spillProgress + 0.026);
      }
    });
  }

  function drawBrokenCup(cup){
    const L = cup.layout, x=L.x, w=L.w, bottom=L.bottom;
    c2.save();
    const t = cup.spillProgress;
    const ease = t*t*(3-2*t);
    c2.lineWidth = 2;
    c2.strokeStyle = 'rgba(150,190,230,.55)';
    c2.beginPath();
    c2.moveTo(x+w*.22,bottom-4); c2.lineTo(x+w*.38,bottom-30); c2.lineTo(x+w*.48,bottom-6);
    c2.moveTo(x+w*.78,bottom-4); c2.lineTo(x+w*.62,bottom-34); c2.lineTo(x+w*.52,bottom-6);
    c2.moveTo(x+w*.36,bottom-3); c2.lineTo(x+w*.64,bottom-3);
    c2.stroke();
    for(let i=0;i<cup.spill.length;i++){
      const b = cup.spill[i];
      const x1 = lerp(b.sx, b.tx, ease);
      const y1 = lerp(b.sy, b.ty, ease) - Math.sin(ease*Math.PI)*b.lift;
      const hue = 31 + (i%9-4)*.6;
      c2.beginPath();
      c2.fillStyle = `hsl(${hue},44%,${44+(i%7)}%)`;
      c2.arc(x1,y1,3.8,0,Math.PI*2); c2.fill();
      c2.strokeStyle='rgba(12,8,5,.36)'; c2.lineWidth=.45; c2.stroke();
    }
    c2.restore();
  }

  function drawCup(cup){
    if(cup.broken){ drawBrokenCup(cup); return; }
    const L = cup.layout, lift = cup.liftY;
    const x=L.x, y=L.y+lift, w=L.w, h=L.h, bottom=L.bottom+lift;
    const bedTop = beanTop(cup);
    const state = liftState(cup);

    c2.save();
    c2.fillStyle = 'rgba(255,255,255,.02)';
    c2.strokeStyle = 'rgba(150,190,230,.38)';
    c2.lineWidth = 2;
    c2.beginPath();
    c2.moveTo(x+w*.15,y+6); c2.lineTo(x+w*.85,y+6); c2.lineTo(x+w*.74,bottom); c2.lineTo(x+w*.26,bottom); c2.closePath();
    c2.fill(); c2.stroke();
    c2.fillStyle = 'rgba(120,168,255,.08)';
    c2.beginPath(); c2.moveTo(x+w*.17,y+12); c2.lineTo(x+w*.83,y+12); c2.lineTo(x+w*.72,bottom-5); c2.lineTo(x+w*.28,bottom-5); c2.closePath(); c2.fill();

    if(cup.beanCount>0){
      c2.save();
      c2.beginPath();
      c2.moveTo(x+w*.18,bedTop); c2.lineTo(x+w*.82,bedTop); c2.lineTo(x+w*.72,bottom-6); c2.lineTo(x+w*.28,bottom-6); c2.closePath(); c2.clip();
      const pulseLift = cup.addPulse > 0 ? Math.sin((1-cup.addPulse)*Math.PI)*36 : 0;
      for(let i=0;i<cup.beanCount;i++){
        const p=seededPoint(i,cup);
        const shrink = 0.17 + (p.ry*.12);
        let bx = lerp(x+w*(0.25-shrink*.08), x+w*(0.75+shrink*.08), p.rx);
        let by = lerp(bedTop+6, bottom-12, p.ry) - (i > cup.beanCount-100 ? pulseLift*cup.addPulse : 0);
        for(const r of rods){
          const ins = insertionPx(r,cup); if(ins<=0) continue;
          const tip = r.y+r.h;
          if(by >= bedTop && by <= Math.min(tip,bottom) && Math.abs(bx-r.x)<22){
            const dir = bx < r.x ? -1 : 1;
            const strength = (1-Math.abs(bx-r.x)/22) * 18 * (ins/(bottom-bedTop));
            bx += dir*strength;
          }
        }
        const hue = 31 + (i%9-4)*.6;
        c2.beginPath();
        c2.fillStyle = `hsl(${hue},44%,${44+(i%7)}%)`;
        c2.arc(bx,by,3.7,0,Math.PI*2); c2.fill();
        c2.strokeStyle='rgba(12,8,5,.34)'; c2.lineWidth=.45; c2.stroke();
      }
      c2.restore();
      c2.strokeStyle = slipOn ? (state.can ? 'rgba(114,209,138,.75)' : 'rgba(255,209,102,.42)') : 'rgba(150,190,230,.24)';
      c2.lineWidth = 1.8;
      c2.beginPath(); c2.moveTo(x+w*.23, bedTop); c2.quadraticCurveTo(x+w*.5, bedTop-5, x+w*.77, bedTop); c2.stroke();
    }

    if(slipOn){
      c2.save();
      c2.font = '900 13px -apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial';
      c2.textAlign='center'; c2.textBaseline='middle';
      const badgeX = x+w/2, badgeY = bottom+18;
      c2.fillStyle = state.can ? 'rgba(50,120,70,.45)' : 'rgba(90,70,35,.42)';
      c2.strokeStyle = state.can ? 'rgba(114,209,138,.65)' : 'rgba(255,209,102,.42)';
      c2.beginPath(); c2.roundRect(badgeX-48,badgeY-13,96,26,13); c2.fill(); c2.stroke();
      c2.fillStyle = state.can ? '#bdf3c9' : '#ffe0a3';
      c2.fillText(state.can ? '可提起' : '會滑出', badgeX, badgeY);
      c2.restore();
    }
    c2.restore();
  }

  function drawRod(r){
    c2.save();
    c2.strokeStyle='rgba(157,209,255,.92)';
    c2.lineWidth=2.4;
    c2.fillStyle='rgba(0,0,0,0)';
    c2.beginPath();
    c2.roundRect(r.x-r.w/2,r.y,r.w,r.h,5);
    c2.stroke();
    c2.strokeStyle='rgba(215,239,255,.55)';
    c2.lineWidth=1;
    c2.beginPath();
    c2.moveTo(r.x-r.w*.18, r.y+8);
    c2.lineTo(r.x-r.w*.18, r.y+r.h-8);
    c2.stroke();
    c2.restore();
  }

  function drawForces(){
    if(!forceOn) return;
    c2.save();
    for(const r of rods){
      const cup = r.cup === null ? cupAtX(r.x) : cups[r.cup];
      if(!cup || cup.broken || cup.dropping) continue;
      const depth = insertionPx(r,cup); if(depth<=2 || cup.beanCount<=0) continue;
      const groups = clamp(Math.floor(cup.beanCount/100)*3,0,15);
      if(groups<=0) continue;
      const top = beanTop(cup), tip = Math.min(r.y+r.h, cup.layout.bottom+cup.liftY);
      const depthNorm = clamp(depth/(cup.layout.bottom+cup.liftY-top),0,1);
      for(let i=0;i<groups;i++){
        const t = (i+1)/(groups+1);
        const y = lerp(top+8, tip-8, t);
        const len = clamp((5.2 + 5.6*t) * depthNorm * cup.density * cup.material, 4, 86);
        const color = `rgba(120,168,255,${0.25+0.55*t})`;
        drawArrow(c2,r.x-len-8,y,r.x-r.w/2-2,y,color);
        drawArrow(c2,r.x+len+8,y,r.x+r.w/2+2,y,color);
      }
    }
    c2.restore();
  }

  function drawScene2(){
    updateCupMotion();
    c2.clearRect(0,0,s2W,s2H);
    const grad = c2.createLinearGradient(0,0,0,s2H);
    grad.addColorStop(0,'#111a25'); grad.addColorStop(1,'#070b10');
    c2.fillStyle=grad; c2.fillRect(0,0,s2W,s2H);
    c2.save(); c2.strokeStyle='rgba(125,150,180,.10)'; c2.lineWidth=1;
    for(let x=0;x<s2W;x+=28){ c2.beginPath(); c2.moveTo(x,0); c2.lineTo(x,s2H); c2.stroke(); }
    for(let y=0;y<s2H;y+=28){ c2.beginPath(); c2.moveTo(0,y); c2.lineTo(s2W,y); c2.stroke(); }
    c2.restore();
    c2.fillStyle='#5c4732'; c2.fillRect(18,s2H-34,s2W-36,12);
    cups.forEach(drawCup);
    drawForces();
    rods.forEach(drawRod);
    requestAnimationFrame(drawScene2);
  }

  s2.addEventListener('pointerdown', e => {
    const pt=getCanvasPoint(e,s2), r=findRodAt(pt.x,pt.y);
    if(!r) return;
    e.preventDefault(); s2.setPointerCapture(e.pointerId); s2.classList.add('dragging');
    activeRod = {id:e.pointerId, rod:r, last:pt};
    r.parked=false;
  });
  s2.addEventListener('pointermove', e => {
    if(!activeRod || activeRod.id !== e.pointerId) return;
    e.preventDefault();
    const pt=getCanvasPoint(e,s2), r=activeRod.rod;
    let dx=pt.x-activeRod.last.x, dy=pt.y-activeRod.last.y;
    updateRodCup(r);
    const currentCup = r.cup !== null ? cups[r.cup] : cupAtX(r.x);
    const movingUp = dy < -0.4;
    const state = currentCup ? liftState(currentCup, r) : {can:false};
    const linked = currentCup && currentCup.chain && rodsInCup(currentCup).includes(r);
    let movers = linked ? rodsInCup(currentCup) : [r];
    if(!movers.includes(r)) movers.push(r);

    if(currentCup && dy > 0){
      const cupBottom = currentCup.layout.bottom + currentCup.liftY;
      let maxDy = dy;
      for(const m of movers){
        if(cupAtX(m.x) === currentCup || m.cup === currentCup.i){
          maxDy = Math.min(maxDy, cupBottom - (m.y + m.h));
        }
      }
      dy = Math.max(0, maxDy);
    }

    if(currentCup && movingUp && state.can){
      const newLift = clamp(currentCup.liftY + dy, -120, 0);
      const applied = newLift - currentCup.liftY;
      currentCup.liftY = newLift;
      movers.forEach(other => { other.x += dx; other.y += applied; other.cup = currentCup.i; other.parked=false; });
    }else if(currentCup && dy > .4 && currentCup.liftY < 0 && insertionUnits(r,currentCup)>1){
      const newLift = clamp(currentCup.liftY + dy, -120, 0);
      const applied = newLift - currentCup.liftY;
      currentCup.liftY = newLift;
      movers.forEach(other => { other.x += dx; other.y += applied; other.cup = currentCup.i; other.parked=false; });
    }else{
      movers.forEach(other => { other.x += dx; other.y += dy; other.parked=false; });
    }
    movers.forEach(other => {
      other.x = clamp(other.x, 16, s2W-16); other.y = clamp(other.y, -other.h+24, s2H-44);
      const c = other.cup !== null ? cups[other.cup] : cupAtX(other.x);
      if(c && (cupAtX(other.x) === c || other.cup === c.i)){
        const bottom = c.layout.bottom + c.liftY;
        if(other.y + other.h > bottom) other.y = bottom - other.h;
      }
      updateRodCup(other);
    });
    updateChainOverlay();
    checkLiftedCups();
    activeRod.last=pt;
  }, {passive:false});
  function endRodDrag(e){
    if(activeRod && activeRod.id === e.pointerId){ updateRodCup(activeRod.rod); updateChainOverlay(); checkLiftedCups(); activeRod=null; s2.classList.remove('dragging'); }
  }
  s2.addEventListener('pointerup', endRodDrag); s2.addEventListener('pointercancel', endRodDrag);
  rodPlus.addEventListener('click', addRod);
  rodMinus.addEventListener('click', removeRod);
  forceToggle.addEventListener('click', () => { forceOn = !forceOn; forceToggle.classList.toggle('active', forceOn); });
  slipToggle.addEventListener('click', () => { slipOn = !slipOn; slipToggle.classList.toggle('active', slipOn); });
  scene2Reset.addEventListener('click', () => resetScene2(true));

  // ------------------------ Modal and tabs ------------------------
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalBody = document.getElementById('modalBody');
  const helpBtn = document.getElementById('helpBtn');
  const modalClose = document.getElementById('modalClose');
  async function openHelp(){
    let md = README_FALLBACK;
    try{
      const res = await fetch('./readme.md', {cache:'no-store'});
      if(res.ok) md = await res.text();
    }catch(e){}
    modalBody.innerHTML = renderMarkdown(md);
    modalBackdrop.classList.add('open'); modalBackdrop.setAttribute('aria-hidden','false');
  }
  function closeHelp(){ modalBackdrop.classList.remove('open'); modalBackdrop.setAttribute('aria-hidden','true'); }
  helpBtn.addEventListener('click', openHelp);
  modalClose.addEventListener('click', closeHelp);
  modalBackdrop.addEventListener('click', e => { if(e.target === modalBackdrop) closeHelp(); });
  window.addEventListener('keydown', e => { if(e.key==='Escape') closeHelp(); });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const one = document.getElementById('scene-one'), two = document.getElementById('scene-two');
      if(btn.dataset.scene === 'one'){
        one.classList.add('active'); two.classList.remove('active');
        if(legendText) legendText.textContent = 'ρ 密度｜μ豆 粒間摩擦｜μ桌 桌面摩擦';
        setTimeout(resizeScene1,40);
      }else{
        two.classList.add('active'); one.classList.remove('active');
        if(legendText) legendText.textContent = 'ρ 豆密度｜μ棒 棒子摩擦';
        setTimeout(resizeScene2,40);
      }
    });
  });

  window.addEventListener('resize', () => { setTimeout(() => { resizeScene1(); resizeScene2(); }, 80); });
  buildScene1UI(); buildScene2UI(); resizeScene1(); resizeScene2(); requestAnimationFrame(tickScene1); requestAnimationFrame(drawScene2);
})();
</script>
