<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太陽核融合互動模擬 v0.2 (3D視角)</title>
<style>
  html,body{margin:0;height:100%;background:#070b12;color:#e9f1ff;font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial}
  #canvas{position:fixed;inset:0 360px 0 0;touch-action:none}
  #ui{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:90vw;background:rgba(10,14,24,.9);backdrop-filter:blur(6px);border-left:1px solid #182235;display:flex;flex-direction:column}
  #header{padding:10px 12px;border-bottom:1px solid #182235;display:flex;gap:8px;align-items:center}
  .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#15213a;color:#9bdcff;border:1px solid #223359}
  #panel{padding:10px 12px;overflow:auto;flex:1}
  .card{border:1px solid #27324a;border-radius:10px;padding:10px;background:#0e1626;margin-bottom:10px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #2a3d6b;border-radius:999px;padding:4px 8px;background:#0f1625;font-size:12px}
  .dot{width:10px;height:10px;border-radius:50%}
  .p{background:#ff4d4d;box-shadow:0 0 8px #ff4d4d80}
  .n{background:#58a6ff;box-shadow:0 0 8px #58a6ff80}
  .e{background:#6cff8f;box-shadow:0 0 8px #6cff8f80}
  button{background:#1a2743;color:#e6f0ff;border:1px solid #2a3d6b;padding:8px 10px;border-radius:8px;cursor:pointer}
  button:hover{background:#22345b}
  button.primary{background:#2b6cb0;border-color:#2b6cb0}
  button.danger{background:#9b2c2c;border-color:#9b2c2c}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .small{font-size:12px;color:#9bb3ff}
  .stat{font-variant-numeric:tabular-nums}
  .log{font-size:12px;line-height:1.4;white-space:pre-wrap;background:#0b131f;border:1px solid #1a2743;padding:8px;border-radius:8px;max-height:180px;overflow:auto}
  .palette{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .chip{border:1px solid #2a3d6b;border-radius:999px;padding:3px 8px;background:#0f1625;font-size:12px}
  .kbd{padding:1px 6px;border:1px solid #2a3d6b;border-bottom-width:2px;border-radius:6px;background:#0b131f;font-family:ui-monospace,Consolas,Menlo,monospace}
  #footer{padding:8px 12px;border-top:1px solid #182235;color:#8ea7ff;font-size:12px}
  @media (max-width:1000px){
    #canvas{inset:0 0 45% 0}
    #ui{inset:auto 0 0 0;height:45%;width:100%;border-left:none;border-top:1px solid #182235}
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui" role="complementary" aria-label="控制面板">
  <div id="header">
    <span class="tag">太陽核融合模擬</span>
    <span class="tag">v0.2 3D</span>
  </div>
  <div id="panel">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div>
          <div class="small">反應器狀態</div>
          <div id="status" class="stat">把兩顆原子拖進中央「反應器圈」，<b>輕點</b>兩顆做為 A、B 再按「融合」。</div>
        </div>
        <button id="reset" class="danger">全部清除</button>
      </div>
      <div class="legend">
        <span class="pill"><span class="dot p"></span>質子</span>
        <span class="pill"><span class="dot n"></span>中子</span>
        <span class="pill"><span class="dot e"></span>電子</span>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="fuse" class="primary" disabled>融合（選兩個）</button>
        <button id="predict" disabled>預測產物</button>
        <button id="deleteSel" disabled>刪除選取</button>
      </div>
      <div class="row" style="margin-top:6px">
        <label><input id="showElectrons" type="checkbox" checked> 顯示電子</label>
        <label style="margin-left:8px"><input id="ppOnly" type="checkbox" checked> pp-鏈模式</label>
      </div>
      <div class="small" style="margin-top:6px">手勢：<span class="kbd">單指拖曳</span>移動原子、<span class="kbd">輕點</span>選取 A/B、<span class="kbd">雙指張合</span>縮放、<span class="kbd">雙指旋轉</span>旋轉視角、<span class="kbd">雙擊空白</span>重置視角。</div>
    </div>

    <div class="card">
      <div class="small">原子調色盤（點一下加入一顆）</div>
      <div class="palette" id="palette"></div>
      <div class="small" style="margin-top:6px">內建穩定同位素與 H-3（不穩定）。</div>
    </div>

    <div class="card">
      <div class="small">選取資訊</div>
      <div id="selA" class="stat">A：未選取</div>
      <div id="selB" class="stat">B：未選取</div>
      <div id="predictText" class="small" style="margin-top:6px"></div>
    </div>

    <div class="card">
      <div class="small">事件紀錄</div>
      <div id="log" class="log"></div>
    </div>
  </div>
  <div id="footer">教育用途模型。pp-鏈：p+p→D+e<sup>+</sup>+ν；D+p→He-3+γ；He-3+He-3→He-4+p+p。</div>
</div>

<script>
/* ===== 基本資料 ===== */
const STABLE = new Map([
  ["1,0",{sym:"H-1",name:"氫-1"}],
  ["1,1",{sym:"H-2",name:"氘"}],
  ["2,1",{sym:"He-3",name:"氦-3"}],
  ["2,2",{sym:"He-4",name:"氦-4"}],
  ["3,3",{sym:"Li-6",name:"鋰-6"}],
  ["3,4",{sym:"Li-7",name:"鋰-7"}],
  ["4,5",{sym:"Be-9",name:"鈹-9"}],
  ["5,5",{sym:"B-10",name:"硼-10"}],
  ["5,6",{sym:"B-11",name:"硼-11"}],
  ["6,6",{sym:"C-12",name:"碳-12"}],
  ["6,7",{sym:"C-13",name:"碳-13"}],
  ["7,7",{sym:"N-14",name:"氮-14"}],
  ["7,8",{sym:"N-15",name:"氮-15"}],
  ["8,8",{sym:"O-16",name:"氧-16"}],
  ["8,9",{sym:"O-17",name:"氧-17"}],
  ["8,10",{sym:"O-18",name:"氧-18"}],
]);
const UNSTABLE = new Map([["1,2",{sym:"H-3",name:"氚"}]]);
const PALETTE=[{Z:1,N:0},{Z:1,N:1},{Z:1,N:2},{Z:2,N:1},{Z:2,N:2},{Z:3,N:3},{Z:3,N:4},{Z:4,N:5},{Z:5,N:5},{Z:5,N:6},{Z:6,N:6},{Z:6,N:7},{Z:7,N:7},{Z:7,N:8},{Z:8,N:8},{Z:8,N:9},{Z:8,N:10}];

function keyZN(Z,N){return Z+','+N}
function infoZN(Z,N){
  const k=keyZN(Z,N);
  if (STABLE.has(k)) return {...STABLE.get(k), stable:true, Z,N, A:Z+N};
  if (UNSTABLE.has(k)) return {...UNSTABLE.get(k), stable:false, Z,N, A:Z+N};
  return {sym:`Z${Z}N${N}`, name:"非資料庫", stable:false, Z,N, A:Z+N};
}
function byMassCandidates(A){
  const out=[];
  STABLE.forEach((v,k)=>{const [Z,N]=k.split(',').map(Number); if (Z+N===A) out.push({Z,N,...v,stable:true,A});});
  return out;
}

/* ===== 畫布與 3D 視角 ===== */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
function resize(){
  const uiRight = (window.innerWidth>1000)?360:0;
  canvas.width = window.innerWidth - uiRight;
  canvas.height = (window.innerWidth>1000)? window.innerHeight : window.innerHeight*0.55;
}
window.addEventListener('resize',resize); resize();

// 簡易 3D 相機（Yaw/Pitch/Zoom）
const cam={yaw:0, pitch:0, dist:600, zoom:1, tx:0, ty:0, fov:650};
function resetView(){ cam.yaw=0; cam.pitch=0; cam.dist=600; cam.zoom=1; cam.tx=0; cam.ty=0; }
canvas.addEventListener('dblclick', ()=>resetView());

/* ===== 場景物件 ===== */
const REACTOR={x:0,y:0,z:0,r:120};
let ATOMS=[]; // {id,Z,N,e,x,y,z,r,sel,t,dead,fade,nucs:[{x,y,z}],shells:[], angle}
let PARTICLES=[]; // flying products
let selIds=[]; let idCounter=1;

function addAtom(Z,N,pos){
  const id=idCounter++;
  const e=Z;
  const r = 26 + Math.min(20,(Z+N)*0.8);
  const x = pos?.x ?? (Math.random()*300-150);
  const y = pos?.y ?? (Math.random()*200-100);
  const z = pos?.z ?? 0;
  const nucs = makeNucleusPoints(Z+N, r*0.5);
  const shells = shellLayout(e).map((n,i)=>({n,R:r+22+i*16,phi:Math.random()*Math.PI*2, tilt:(i%2?0.5:-0.3)}));
  ATOMS.push({id,Z,N,e,x,y,z,r,sel:false,t:Math.random()*100,dead:false,fade:1,nucs,shells,angle:Math.random()*Math.PI*2});
  log(`生成 ${infoZN(Z,N).sym}（Z=${Z}, N=${N}, e=${e}）`);
}

function removeAtomById(id){ const i=ATOMS.findIndex(a=>a.id===id); if (i>=0) ATOMS.splice(i,1); }

/* ===== UI邏輯 ===== */
function setStatus(s){ document.getElementById('status').innerHTML=s }
function log(msg){ const el=document.getElementById('log'); el.textContent=(new Date()).toLocaleTimeString()+"  "+msg+"\n"+el.textContent; }
const selAEl=document.getElementById('selA'), selBEl=document.getElementById('selB'), predictText=document.getElementById('predictText');
const fuseBtn=document.getElementById('fuse'), predBtn=document.getElementById('predict'), delBtn=document.getElementById('deleteSel');
const showElectrons=document.getElementById('showElectrons'), ppOnly=document.getElementById('ppOnly');

function updateSelUI(){
  const A=ATOMS.find(a=>a.id===selIds[0]);
  const B=ATOMS.find(a=>a.id===selIds[1]);
  selAEl.textContent = A? `A：${infoZN(A.Z,A.N).sym}（Z=${A.Z}, N=${A.N}, e=${A.e})` : "A：未選取";
  selBEl.textContent = B? `B：${infoZN(B.Z,B.N).sym}（Z=${B.Z}, N=${B.N}, e=${B.e})` : "B：未選取";
  fuseBtn.disabled = !(A && B);
  predBtn.disabled = fuseBtn.disabled;
  delBtn.disabled = selIds.length===0;
  if (A&&B){
    const pred=predictProduct(A,B, ppOnly.checked);
    if (pred.ok){ predictText.innerHTML=`可能產物：<span class="chip">${pred.desc}</span>`;}
    else { predictText.textContent="此配對在目前模式下不會穩定。"; }
  }else{ predictText.textContent=""; }
}

document.getElementById('reset').onclick=()=>{ ATOMS.length=0; PARTICLES.length=0; selIds.length=0; updateSelUI(); log("場景清除。"); };
document.getElementById('deleteSel').onclick=()=>{ selIds.forEach(id=>removeAtomById(id)); selIds.length=0; updateSelUI(); };

// Palette
const paletteEl=document.getElementById('palette');
PALETTE.forEach(({Z,N})=>{
  const inf=infoZN(Z,N);
  const btn=document.createElement('button');
  btn.innerHTML=`${inf.sym}<div class="small">Z=${Z} N=${N}</div>`;
  btn.onclick=()=>addAtom(Z,N);
  paletteEl.appendChild(btn);
});

/* ===== 手勢與互動（修正手機 A/B 選取） ===== */
let draggingId=null;
let gesture={fingerCount:0, last:[], prevAngle:0, prevDist:0, moved:false, tapCandidate:null, tapTime:0};

function hitTestAtom(sx,sy){
  // 用投影半徑做命中
  for (let i=ATOMS.length-1;i>=0;i--){
    const a=ATOMS[i];
    const p=project(a.x,a.y,a.z);
    if (!p) continue;
    const rr = a.r * p.scale;
    if ((sx-p.x)**2 + (sy-p.y)**2 <= rr*rr) return a;
  }
  return null;
}

function onPointerDown(clientX,clientY,id,isTouch){
  const rect=canvas.getBoundingClientRect();
  const sx=clientX-rect.left, sy=clientY-rect.top;
  gesture.fingerCount++;
  gesture.last.push({id,x:sx,y:sy});
  gesture.moved=false;
  gesture.tapCandidate={x:sx,y:sy,id, t:performance.now()};
  if (gesture.fingerCount===1){
    const hit=hitTestAtom(sx,sy);
    if (hit){ draggingId=hit.id; bringToTop(draggingId); }
  }else if (gesture.fingerCount===2){
    const g=calcGesture();
    gesture.prevAngle=g.angle; gesture.prevDist=g.dist;
  }
}

function onPointerMove(clientX,clientY,id){
  const rect=canvas.getBoundingClientRect();
  const sx=clientX-rect.left, sy=clientY-rect.top;
  const idx=gesture.last.findIndex(o=>o.id===id);
  if (idx>=0){ gesture.last[idx].x=sx; gesture.last[idx].y=sy; }
  if (gesture.fingerCount===1){
    const l=gesture.last[0];
    if (draggingId!=null){
      // 單指拖曳：移動原子（世界座標平面）
      const a=ATOMS.find(o=>o.id===draggingId); if (!a) return;
      const dx = sx - l.x, dy = sy - l.y;
      const f = 1/ (cam.zoom*0.9);
      const cosY=Math.cos(cam.yaw), sinY=Math.sin(cam.yaw);
      a.x += (dx*cosY)*f;
      a.y += (dy)*f;
      gesture.moved=true;
      gesture.last[0].x=sx; gesture.last[0].y=sy;
    }
  }else if (gesture.fingerCount===2){
    // 雙指：縮放 + 旋轉視角
    const g=calcGesture();
    const dAngle = g.angle - gesture.prevAngle;
    const scale = g.dist / Math.max(1, gesture.prevDist);
    cam.yaw += dAngle*0.8;
    cam.zoom *= scale;
    cam.zoom = Math.max(0.6, Math.min(2.2, cam.zoom));
    gesture.prevAngle=g.angle; gesture.prevDist=g.dist;
    gesture.moved=true;
  }
}

function onPointerUp(clientX,clientY,id){
  const now=performance.now();
  if (gesture.tapCandidate && gesture.tapCandidate.id===id){
    const rect=canvas.getBoundingClientRect();
    const sx=clientX-rect.left, sy=clientY-rect.top;
    const dx=sx-gesture.tapCandidate.x, dy=sy-gesture.tapCandidate.y;
    const moved=Math.hypot(dx,dy)>8 || gesture.moved;
    const short=(now-gesture.tapCandidate.t)<300;
    if (!moved && short){
      const hit=hitTestAtom(sx,sy);
      if (hit){ toggleSelection(hit.id); }
      else { clearSelection(); }
    }
  }
  draggingId=null;
  gesture.last=gesture.last.filter(o=>o.id!==id);
  gesture.fingerCount=Math.max(0, gesture.fingerCount-1);
  gesture.tapCandidate=null;
}

function toggleSelection(id){
  const a=ATOMS.find(o=>o.id===id);
  if (!a) return;
  a.sel = !a.sel;
  if (a.sel){
    if (!selIds.includes(id)) selIds.push(id);
    if (selIds.length>2){
      const removed=selIds.shift();
      const old=ATOMS.find(o=>o.id===removed); if (old) old.sel=false;
    }
  }else{
    selIds=selIds.filter(x=>x!==id);
  }
  updateSelUI();
}
function clearSelection(){ selIds.forEach(id=>{const o=ATOMS.find(a=>a.id===id); if(o) o.sel=false;}); selIds.length=0; updateSelUI(); }
function bringToTop(id){ const i=ATOMS.findIndex(o=>o.id===id); if (i>=0){ const [obj]=ATOMS.splice(i,1); ATOMS.push(obj);} }

// 滑鼠事件
let rotatingRight=false;
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('mousedown', e=>{
  if (e.button===2){ rotatingRight=true; gesture.last=[{id:'mouse',x:e.offsetX,y:e.offsetY}]; return; }
  onPointerDown(e.clientX,e.clientY,'mouse',false);
});
window.addEventListener('mousemove', e=>{
  if (rotatingRight){
    const cur={x:e.offsetX,y:e.offsetY}; const last=gesture.last[0];
    const dx=cur.x-last.x, dy=cur.y-last.y;
    cam.yaw += dx*0.01; cam.pitch += dy*0.01; cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch));
    gesture.last[0]=cur; return;
  }
  if (gesture.last.some(o=>o.id==='mouse')) onPointerMove(e.clientX,e.clientY,'mouse');
});
window.addEventListener('mouseup', e=>{
  if (rotatingRight){ rotatingRight=false; gesture.last=[]; return; }
  onPointerUp(e.clientX,e.clientY,'mouse');
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.zoom *= Math.exp(-e.deltaY*0.001);
  cam.zoom = Math.max(0.6, Math.min(2.2, cam.zoom));
},{passive:false});

// 觸控事件
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); for (const t of e.changedTouches) onPointerDown(t.clientX,t.clientY,t.identifier,true); },{passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); for (const t of e.changedTouches) onPointerMove(t.clientX,t.clientY,t.identifier); },{passive:false});
canvas.addEventListener('touchend', e=>{ e.preventDefault(); for (const t of e.changedTouches) onPointerUp(t.clientX,t.clientY,t.identifier); },{passive:false});

function calcGesture(){
  if (gesture.last.length<2) return {angle:0,dist:1};
  const [a,b]=gesture.last;
  const dx=b.x-a.x, dy=b.y-a.y;
  return {angle:Math.atan2(dy,dx), dist:Math.hypot(dx,dy)};
}

/* ===== 反應邏輯 ===== */
function isInReactor(a){
  const dx=a.x-REACTOR.x, dy=a.y-REACTOR.y;
  return Math.hypot(dx,dy) <= REACTOR.r-6; // 簡化：僅 x-y 平面
}

function predictProduct(a,b,ppMode){
  const rule=ppRules(a,b);
  if (rule) return {ok:true, desc:rule.desc, make:rule.make};
  if (ppMode) return {ok:false};
  const A=a.Z+a.N + b.Z+b.N;
  const Zsum=a.Z+b.Z;
  const cands=byMassCandidates(A);
  if (!cands.length) return {ok:false};
  cands.sort((u,v)=>Math.abs(u.Z-Zsum)-Math.abs(v.Z-Zsum));
  const best=cands[0];
  const deltaZ=best.Z-Zsum;
  let extra=""; if (deltaZ===-1) extra=" + e⁺ + ν"; else if (deltaZ===1) extra=" + e⁻ + ν̄";
  const desc=`${infoZN(best.Z,best.N).sym}${extra}（A=${A}）`;
  return {ok:true, desc, make:()=>{
    addAtom(best.Z,best.N,{x:0,y:0,z:0});
    if (deltaZ===-1){ spawnParticle('pos'); spawnParticle('nu'); spawnPhoton(2); }
    else if (deltaZ===1){ spawnParticle('ele'); spawnParticle('anu'); spawnPhoton(2); }
    else { spawnPhoton(1); }
  }};
}

function ppRules(a,b){
  const k=x=>keyZN(x.Z,x.N);
  if (k(a)==="1,0" && k(b)==="1,0"){
    return {desc:"H-1 + H-1 → H-2 + e⁺ + ν + γ", make:()=>{ addAtom(1,1,{x:0,y:0,z:0}); spawnParticle('pos'); spawnParticle('nu'); spawnPhoton(2);}}
  }
  const set=new Set([k(a),k(b)]);
  if (set.has("1,1") && set.has("1,0")){
    return {desc:"H-2 + H-1 → He-3 + γ", make:()=>{ addAtom(2,1,{x:0,y:0,z:0}); spawnPhoton(2);}}
  }
  if (k(a)==="2,1" && k(b)==="2,1"){
    return {desc:"He-3 + He-3 → He-4 + p + p + γ", make:()=>{ addAtom(2,2,{x:0,y:0,z:0}); spawnParticle('p'); spawnParticle('p'); spawnPhoton(3);}}
  }
  if (k(a)==="1,1" && k(b)==="1,1"){
    return {desc:"H-2 + H-2 → He-3 + n（或 T + p）（簡化）", make:()=>{
      if (Math.random()<0.5){ addAtom(2,1,{x:0,y:0,z:0}); spawnParticle('n'); } else { addAtom(1,2,{x:0,y:0,z:0}); spawnParticle('p'); }
      spawnPhoton(1);
    }}
  }
  return null;
}

/* ===== 粒子動畫 ===== */
function spawnPhoton(k=1){ for (let i=0;i<k;i++) PARTICLES.push({type:'gamma',x:0,y:0,z:0,v:randUnit().scale(2.5),life:1}); }
function spawnParticle(type){ PARTICLES.push({type,x:0,y:0,z:0,v:randUnit().scale(2),life:1}); }
function randUnit(){ const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1); const x=Math.cos(th)*Math.sin(ph), y=Math.sin(th)*Math.sin(ph), z=Math.cos(ph); return {x,y,z, scale(s){this.x*=s;this.y*=s;this.z*=s;return this;}}; }

/* ===== 繪製（3D→2D 投影） ===== */
function project(x,y,z){
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  let X = x*cy - z*sy;
  let Z = x*sy + z*cy;
  let Y = y*cp - Z*sp;
  Z = y*sp + Z*cp;
  Z += cam.dist;
  if (Z<=1) return null;
  const scale = cam.zoom * (cam.fov / Z);
  return {x: canvas.width/2 + X*scale + cam.tx, y: canvas.height/2 + Y*scale + cam.ty, z:Z, scale};
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  drawReactorRing();

  const sprites=[];

  for (const p of PARTICLES){
    p.x += p.v.x; p.y += p.v.y; p.z += p.v.z; p.life -= 0.01;
  }
  PARTICLES = PARTICLES.filter(p=>p.life>0.02);
  for (const p of PARTICLES){
    const pr=project(p.x,p.y,p.z); if (!pr) continue;
    sprites.push({type:'particle', p, pr, depth:pr.z});
  }

  const drawAtom = (a)=>{
    const cen=project(a.x,a.y,a.z); if (!cen) return;
    sprites.push({type:'label', a, pr:cen, depth:cen.z-1});
    const protonCount=a.Z;
    for (let i=0;i<a.nucs.length;i++){
      const n=a.nucs[i];
      const pr=project(a.x+n.x,a.y+n.y,a.z+n.z); if (!pr) continue;
      sprites.push({type:'nucleon', isProton:i<protonCount, pr, r:5*pr.scale, depth:pr.z});
    }
    if (document.getElementById('showElectrons').checked){
      for (const s of a.shells){
        const pts=[]; const steps=48;
        for (let i=0;i<steps;i++){
          const ang=i/steps*Math.PI*2 + a.t*0.01 + s.phi;
          const cx=Math.cos(ang)*s.R;
          const cy=Math.sin(ang)*s.R*Math.cos(s.tilt);
          const cz=Math.sin(ang)*s.R*Math.sin(s.tilt);
          const pr=project(a.x+cx, a.y+cy, a.z+cz); if (pr) pts.push(pr);
        }
        sprites.push({type:'ring', pts, depth:cen.z-2});
        for (let i=0;i<s.n;i++){
          const ang=i/s.n*Math.PI*2 + a.t*0.025 + s.phi;
          const ex=Math.cos(ang)*s.R;
          const ey=Math.sin(ang)*s.R*Math.cos(s.tilt);
          const ez=Math.sin(ang)*s.R*Math.sin(s.tilt);
          const pr=project(a.x+ex,a.y+ey,a.z+ez); if (pr) sprites.push({type:'electron', pr, r:3.3*pr.scale, depth:pr.z});
        }
      }
    }
    const prR = cen.scale * a.r;
    sprites.push({type:'halo', pr:cen, r:prR*1.3, depth:cen.z+0.1, alpha:0.5});
    sprites.push({type:'atomCircle', pr:cen, r:prR, sel:a.sel, depth:cen.z});
  };

  ATOMS.forEach(a=>{ if (a.dead){ a.fade-=0.02; if (a.fade<=0) a._remove=true; } a.t+=1; drawAtom(a); });
  ATOMS=ATOMS.filter(a=>!a._remove);

  sprites.sort((u,v)=>v.depth-u.depth);

  for (const s of sprites){
    if (s.type==='particle'){
      const alpha=Math.max(0,s.p.life);
      ctx.save(); ctx.globalAlpha=alpha;
      if (s.p.type==='gamma'){ ctx.strokeStyle='#ffd54a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(s.pr.x-6,s.pr.y); ctx.lineTo(s.pr.x+6,s.pr.y); ctx.stroke(); }
      else if (s.p.type==='pos'){ drawSphere(s.pr.x,s.pr.y,4*s.pr.scale,'#ff7ab6'); }
      else if (s.p.type==='ele'){ drawSphere(s.pr.x,s.pr.y,4*s.pr.scale,'#6cff8f'); }
      else if (s.p.type==='anu' || s.p.type==='nu'){ drawSphere(s.pr.x,s.pr.y,3*s.pr.scale,'#9bb3ff'); }
      else if (s.p.type==='p'){ drawSphere(s.pr.x,s.pr.y,5*s.pr.scale,'#ff4d4d'); }
      else if (s.p.type==='n'){ drawSphere(s.pr.x,s.pr.y,5*s.pr.scale,'#58a6ff'); }
      ctx.restore();
    }else if (s.type==='nucleon'){
      const col=s.isProton? '#ff4d4d' : '#58a6ff';
      drawSphere(s.pr.x,s.pr.y, s.r, col);
    }else if (s.type==='electron'){
      drawSphere(s.pr.x,s.pr.y, s.r, '#6cff8f');
    }else if (s.type==='ring'){
      ctx.save(); ctx.globalAlpha=0.6; ctx.strokeStyle='#28466f'; ctx.lineWidth=1;
      ctx.beginPath();
      for (let i=0;i<s.pts.length;i++){ const p=s.pts[i]; if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }else if (s.type==='halo'){
      ctx.save(); ctx.globalAlpha=0.25; drawGlow(s.pr.x,s.pr.y, s.r); ctx.restore();
    }else if (s.type==='atomCircle'){
      ctx.save(); ctx.globalAlpha=1;
      ctx.strokeStyle=s.sel? '#8ea7ff' : '#2a3d6b'; ctx.lineWidth=s.sel? 2.5:1.5;
      ctx.beginPath(); ctx.arc(s.pr.x,s.pr.y, s.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }else if (s.type==='label'){
      const lab=infoZN(s.a.Z,s.a.N).sym + (STABLE.has(keyZN(s.a.Z,s.a.N))?'':'★');
      ctx.save();
      ctx.fillStyle='#dbe9ff'; ctx.font='bold 12px ui-monospace,monospace'; ctx.textAlign='center';
      ctx.fillText(lab, s.pr.x, s.pr.y - s.a.r*s.pr.scale - 14);
      ctx.fillStyle='#9bb3ff'; ctx.font='11px ui-monospace,monospace';
      ctx.fillText(`Z=${s.a.Z} N=${s.a.N} e=${s.a.e}`, s.pr.x, s.pr.y - s.a.r*s.pr.scale - 2);
      if (isInReactor(s.a)){ ctx.fillStyle='#9bb3ff99'; ctx.font='10px ui-monospace,monospace'; ctx.fillText('在反應器內', s.pr.x, s.pr.y + s.a.r*s.pr.scale + 12); }
      ctx.restore();
    }
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function drawGlow(x,y,R){
  const g=ctx.createRadialGradient(x,y,2, x,y,R);
  g.addColorStop(0,'#1b2a4e'); g.addColorStop(1,'#0000');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
}
function drawSphere(x,y,r,color){
  const g=ctx.createRadialGradient(x-r*0.6,y-r*0.6, r*0.2, x,y,r);
  g.addColorStop(0, shade(color, 1.2));
  g.addColorStop(0.4, color);
  g.addColorStop(1, shade(color, 0.4));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
}
function shade(hex, k){
  const c=parseInt(hex.slice(1),16); let r=(c>>16)&255,g=(c>>8)&255,b=c&255;
  r=Math.min(255,Math.round(r*k)); g=Math.min(255,Math.round(g*k)); b=Math.min(255,Math.round(b*k));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ===== Reactor ring (3D 圈) ===== */
function drawReactorRing(){
  const pts=[]; const steps=100;
  for (let i=0;i<steps;i++){
    const ang=i/steps*Math.PI*2;
    const x=REACTOR.r*Math.cos(ang), y=REACTOR.r*Math.sin(ang), z=0;
    const p=project(x,y,z); if (p) pts.push(p);
  }
  ctx.save(); ctx.strokeStyle='#2b6cb0'; ctx.globalAlpha=0.9; ctx.setLineDash([6,6]); ctx.lineWidth=2;
  ctx.beginPath(); for (let i=0;i<pts.length;i++){ const p=pts[i]; if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); } ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#9bb3ff'; ctx.font='12px ui-monospace,monospace'; ctx.textAlign='center';
  const c=project(0,0,0); if (c) ctx.fillText('反應器圈（把兩個原子拖進來）', c.x, c.y -  REACTOR.r*(c.scale)+16);
  ctx.restore();
}

/* ===== 背景 ===== */
function drawBackground(){
  const W=canvas.width, H=canvas.height;
  const g=ctx.createRadialGradient(W/2,H/2,40, W/2,H/2, Math.max(W,H)*0.9);
  g.addColorStop(0,'#0c1322'); g.addColorStop(1,'#04070c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

/* ===== Nucleus 布點 & 電子殼層 ===== */
function makeNucleusPoints(total, R){
  const pts=[];
  for (let i=0;i<total;i++){
    let th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    let x=Math.cos(th)*Math.sin(ph)*R*0.6, y=Math.sin(th)*Math.sin(ph)*R*0.6, z=Math.cos(ph)*R*0.6;
    pts.push({x,y,z});
  }
  for (let iter=0; iter<30; iter++){
    for (let i=0;i<pts.length;i++){
      let fx=0,fy=0,fz=0;
      for (let j=0;j<pts.length;j++){ if (i===j) continue;
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, dz=pts[i].z-pts[j].z;
        const d=Math.hypot(dx,dy,dz)+0.01; const rep= (R*0.18)/(d*d);
        fx += dx/d * rep; fy += dy/d * rep; fz += dz/d * rep;
      }
      pts[i].x += fx*0.05; pts[i].y += fy*0.05; pts[i].z += fz*0.05;
      const d=Math.hypot(pts[i].x,pts[i].y,pts[i].z)+1e-6;
      const s=Math.min(1, R*0.85/d); pts[i].x*=s; pts[i].y*=s; pts[i].z*=s;
    }
  }
  return pts;
}
function shellLayout(e){
  const caps=[2,8,8,18]; const out=[]; let left=e;
  for (let c of caps){ if (left<=0) break; const v=Math.min(c,left); out.push(v); left-=v; } return out;
}

/* ===== 按鈕：融合 & 預測 ===== */
document.getElementById('fuse').onclick=()=>{
  const A=ATOMS.find(a=>a.id===selIds[0]);
  const B=ATOMS.find(a=>a.id===selIds[1]);
  if (!(A&&B)) return;
  if (!isInReactor(A)||!isInReactor(B)){ setStatus('請把兩個原子拖入「反應器圈」內再融合。'); return; }
  const pred=predictProduct(A,B, ppOnly.checked);
  if (!pred.ok){
    A.dead=true; B.dead=true; log(`不穩定：${infoZN(A.Z,A.N).sym} + ${infoZN(B.Z,B.N).sym} → 失敗，消失。`);
    setStatus('反應不穩定：配對不符合目前模式。'); spawnPhoton(1); selIds.length=0; updateSelUI(); return;
  }
  removeAtomById(A.id); removeAtomById(B.id); pred.make();
  log(`反應成功：${pred.desc}`); setStatus(`融合成功！${pred.desc}`);
  selIds.length=0; updateSelUI();
};
document.getElementById('predict').onclick=()=>{
  const A=ATOMS.find(a=>a.id===selIds[0]); const B=ATOMS.find(a=>a.id===selIds[1]);
  if (!(A&&B)) return; const p=predictProduct(A,B, ppOnly.checked);
  if (p.ok) setStatus('預測：'+p.desc); else setStatus('此配對在目前模式下不會穩定。');
};
