<!DOCTYPE html>
<html lang="zh-Hant">
<head><script src="/eduGame/ga4.js"></script>
  <meta charset="UTF-8">
  <title>Flanker Task 小遊戲 v0.7</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      overflow: hidden; /* 重要：禁止 scroll */
    }

    /* 整個遊戲區 = 視窗大小 */
    .root {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* 上方 HUD（標題＋狀態） */
    .hud-top {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: min(640px, 96vw);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(16px, 2.4vw, 20px);
      margin: 0;
    }

    .help-btn {
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.12s ease, background-color 0.12s ease;
      white-space: nowrap;
    }
    .help-btn:active {
      transform: scale(0.96);
    }
    .help-btn:hover {
      background-color: rgba(255,255,255,0.08);
    }

    .status-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .status-box {
      border: 1px solid #ffffff;
      border-radius: 10px;
      padding: 3px 6px;
      font-size: 12px;
      min-width: 80px;
    }

    .status-label {
      opacity: 0.7;
      margin-right: 4px;
    }

    /* 隨機箭頭列（直接鋪在 root 上） */
    .arrow-row {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 下方 HUD（說明＋按鈕＋訊息） */
    .hud-bottom {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: min(640px, 96vw);
      text-align: center;
    }

    .info-text {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 4px;
    }

    .btn {
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      padding: 6px 8px;
      border-radius: 999px;
      font-size: clamp(13px, 2vw, 15px);
      cursor: pointer;
      text-align: center;
      transition: transform 0.08s ease, opacity 0.12s ease, background-color 0.12s ease;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:hover {
      background-color: rgba(255,255,255,0.08);
    }

    .btn.disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn-main {
      grid-column: 1 / span 2;
    }

    .message {
      min-height: 40px;
      font-size: 13px;
      text-align: center;
      margin-top: 2px;
    }

    .message table {
      margin: 4px auto;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 80%;
      max-width: 100%;
    }
    .message th,
    .message td {
      border: 1px solid #ffffff;
      padding: 3px 4px;
      text-align: center;
    }
    .message th {
      background: rgba(255,255,255,0.05);
    }

    .msg-good {
      color: #a7f3d0;
    }

    .msg-bad {
      color: #fb7185;
    }

    .version {
      font-size: 10px;
      opacity: 0.45;
      text-align: right;
      margin-top: 2px;
    }

    /* 說明 overlay */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .overlay.show { display: flex; }

    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(2px);
    }

    .overlay-content {
      position: relative;
      background: #000000;
      border: 1px solid #ffffff;
      border-radius: 14px;
      padding: 12px 12px 8px;
      width: min(720px, 96vw);
      max-height: 80vh;
      overflow: auto;
      z-index: 1;
    }

    .overlay-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .overlay-title-row h2 {
      font-size: 18px;
      margin: 0;
    }

    .close-btn {
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .close-btn:hover {
      background-color: rgba(255,255,255,0.08);
    }

    .help-body {
      font-size: 14px;
      line-height: 1.6;
    }

    .help-body h1,
    .help-body h2,
    .help-body h3 {
      margin-top: 0.8em;
      margin-bottom: 0.3em;
    }

    .help-body ul {
      padding-left: 1.4em;
      margin: 0.2em 0 0.4em;
    }

    .help-body li {
      margin-bottom: 0.2em;
    }

    .help-body p {
      margin: 0.2em 0 0.4em;
    }
  </style>
</head>
<body>
  <div class="root">
    <!-- 上方 HUD -->
    <div class="hud-top">
      <div class="top-row">
        <h1>Flanker Task 小遊戲</h1>
        <button id="helpBtn" class="help-btn">說明</button>
      </div>

      <div class="status-row">
        <div class="status-box">
          <span class="status-label">題目</span>
          <span id="roundNow">0</span>/<span id="roundTotal">10</span>
        </div>
        <div class="status-box">
          <span class="status-label">得分</span>
          <span id="score">0</span>
        </div>
        <div class="status-box">
          <span class="status-label">錯誤</span>
          <span id="wrong">0</span>
        </div>
        <div class="status-box">
          <span class="status-label">漏答</span>
          <span id="missed">0</span>
        </div>
      </div>
    </div>

    <!-- 隨機位置箭頭列 -->
    <div id="arrowRow" class="arrow-row">
      <<<<<
    </div>

    <!-- 下方 HUD -->
    <div class="hud-bottom">
      <div class="info-text">
        箭頭列的位置每一題都會不同（上下＋左右皆隨機）。<br>
        中間那一個箭頭才是目標，左右兩側是干擾。請依「中間箭頭方向」決定要選左或選右。<br>
        可以按按鈕，或直接用鍵盤方向鍵 ← / →。
      </div>

      <div class="controls-row">
        <button id="btnLeft"  class="btn" data-side="left">選左邊（←）</button>
        <button id="btnRight" class="btn" data-side="right">選右邊（→）</button>
        <button id="btnStart" class="btn btn-main">開始遊戲</button>
      </div>

      <div id="message" class="message"></div>
      <div class="version">v0.7 Flanker</div>
    </div>
  </div>

  <!-- 說明 overlay -->
  <div id="helpOverlay" class="overlay">
    <div class="overlay-backdrop"></div>
    <div class="overlay-content">
      <div class="overlay-title-row">
        <h2>遊戲說明（readme.md）</h2>
        <button id="closeHelpBtn" class="close-btn">關閉</button>
      </div>
      <div id="helpBody" class="help-body">
        讀取說明中…
      </div>
    </div>
  </div>

  <script>
    // ===== 遊戲參數 =====
    const TOTAL_ROUNDS = 10;
    const MIN_DURATION_MS = 1200;
    const MAX_DURATION_MS = 2500;

    // DOM
    const roundNowSpan   = document.getElementById('roundNow');
    const roundTotalSpan = document.getElementById('roundTotal');
    const scoreSpan      = document.getElementById('score');
    const wrongSpan      = document.getElementById('wrong');
    const missedSpan     = document.getElementById('missed');
    const arrowRow       = document.getElementById('arrowRow');
    const btnLeft        = document.getElementById('btnLeft');
    const btnRight       = document.getElementById('btnRight');
    const btnStart       = document.getElementById('btnStart');
    const messageDiv     = document.getElementById('message');

    const helpBtn        = document.getElementById('helpBtn');
    const helpOverlay    = document.getElementById('helpOverlay');
    const closeHelpBtn   = document.getElementById('closeHelpBtn');
    const helpBody       = document.getElementById('helpBody');

    roundTotalSpan.textContent = TOTAL_ROUNDS;

    // 狀態
    let currentRound = 0;
    let score = 0;
    let wrong = 0;
    let missed = 0;

    let isAccepting = false;
    let targetDirection = null;
    let currentCorrectSide = null;
    let questionStartTime = null;
    let gameStartTime = null;
    let currentDurationMs = 0;
    let timeoutId = null;

    let reactionTimes = [];
    let congruentRTs = [];
    let incongruentRTs = [];
    let currentIsCongruent = false;

    let congruentTrials = 0;
    let incongruentTrials = 0;
    let congruentCorrect = 0;
    let congruentWrong = 0;
    let incongruentCorrect = 0;
    let incongruentWrong = 0;

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function enableAnswerButtons() {
      btnLeft.classList.remove('disabled');
      btnRight.classList.remove('disabled');
      btnLeft.disabled = false;
      btnRight.disabled = false;
    }

    function disableAnswerButtons() {
      btnLeft.classList.add('disabled');
      btnRight.classList.add('disabled');
      btnLeft.disabled = true;
      btnRight.disabled = true;
    }

    function clearCurrentTimeout() {
      if (timeoutId !== null) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
    }

    function randomizeArrowPosition() {
      // 上下：為了避開 HUD，上界下界收窄一點
      const topPercent = randomInRange(20, 70);   // 20%~70%
      const leftPercent = randomInRange(15, 85);  // 15%~85%
      arrowRow.style.top = topPercent + '%';
      arrowRow.style.left = leftPercent + '%';
    }

    function startGame() {
      currentRound = 0;
      score = 0;
      wrong = 0;
      missed = 0;
      reactionTimes = [];
      congruentRTs = [];
      incongruentRTs = [];
      congruentTrials = 0;
      incongruentTrials = 0;
      congruentCorrect = 0;
      congruentWrong = 0;
      incongruentCorrect = 0;
      incongruentWrong = 0;

      scoreSpan.textContent = score;
      wrongSpan.textContent = wrong;
      missedSpan.textContent = missed;
      roundNowSpan.textContent = 0;
      messageDiv.textContent = '';
      messageDiv.className = 'message';

      btnStart.textContent = '作答中…';
      btnStart.classList.add('disabled');
      btnStart.disabled = true;

      enableAnswerButtons();

      gameStartTime = Date.now();
      nextQuestion();
    }

    function nextQuestion() {
      clearCurrentTimeout();
      currentRound++;
      if (currentRound > TOTAL_ROUNDS) {
        endGame();
        return;
      }

      roundNowSpan.textContent = currentRound;
      messageDiv.textContent = '';
      messageDiv.className = 'message';

      targetDirection = Math.random() < 0.5 ? 'left' : 'right';
      currentCorrectSide = targetDirection;

      const congruent = Math.random() < 0.5;
      currentIsCongruent = congruent;
      if (congruent) {
        congruentTrials++;
      } else {
        incongruentTrials++;
      }

      let patternStr = '';
      // 目標左：一致 <<<<<   不一致 >><>>
      // 目標右：一致 >>>>>   不一致 <<><<
      if (targetDirection === 'left') {
        patternStr = congruent ? '<<<<<' : '>><>>';
      } else {
        patternStr = congruent ? '>>>>>' : '<<><<';
      }

      arrowRow.textContent = patternStr;
      randomizeArrowPosition();

      currentDurationMs = randomInRange(MIN_DURATION_MS, MAX_DURATION_MS);
      isAccepting = true;
      questionStartTime = Date.now();
      enableAnswerButtons();

      timeoutId = setTimeout(() => {
        handleTimeout();
      }, currentDurationMs);
    }

    function handleAnswer(side) {
      if (!isAccepting) return;

      isAccepting = false;
      disableAnswerButtons();
      clearCurrentTimeout();

      const rt = Date.now() - questionStartTime;
      reactionTimes.push(rt);
      if (currentIsCongruent) {
        congruentRTs.push(rt);
      } else {
        incongruentRTs.push(rt);
      }

      if (side === currentCorrectSide) {
        score++;
        scoreSpan.textContent = score;

        if (currentIsCongruent) {
          congruentCorrect++;
        } else {
          incongruentCorrect++;
        }

        messageDiv.textContent = '✔ 正確！';
        messageDiv.className = 'message msg-good';
      } else {
        wrong++;
        wrongSpan.textContent = wrong;

        if (currentIsCongruent) {
          congruentWrong++;
        } else {
          incongruentWrong++;
        }

        messageDiv.textContent = '✘ 錯誤！請只看中間那一個箭頭。';
        messageDiv.className = 'message msg-bad';
      }

      setTimeout(() => {
        nextQuestion();
      }, 700);
    }

    function handleTimeout() {
      if (!isAccepting) return;

      isAccepting = false;
      disableAnswerButtons();
      clearCurrentTimeout();

      missed++;
      missedSpan.textContent = missed;

      messageDiv.textContent = '⏱ 未在時間內作答，算一次漏答。';
      messageDiv.className = 'message msg-bad';

      setTimeout(() => {
        nextQuestion();
      }, 700);
    }

    function avgSec(array) {
      if (!array.length) return null;
      const sum = array.reduce((a, b) => a + b, 0);
      return (sum / array.length) / 1000;
    }

    function endGame() {
      clearCurrentTimeout();
      const totalMs = Date.now() - gameStartTime;
      const totalSec = totalMs / 1000;

      const avgRtAllSec   = avgSec(reactionTimes);
      const avgCongSec    = avgSec(congruentRTs);
      const avgIncongSec  = avgSec(incongruentRTs);

      const fmt = (v) => (v === null ? '—' : v.toFixed(2));

      messageDiv.className = 'message';
      messageDiv.innerHTML =
        `遊戲結束！<br>` +
        `<table>
          <thead>
            <tr>
              <th>條件</th>
              <th>題數</th>
              <th>答對數</th>
              <th>答錯數</th>
              <th>平均反應時間（秒）</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>一致</td>
              <td>${congruentTrials}</td>
              <td>${congruentCorrect}</td>
              <td>${congruentWrong}</td>
              <td>${fmt(avgCongSec)}</td>
            </tr>
            <tr>
              <td>不一致</td>
              <td>${incongruentTrials}</td>
              <td>${incongruentCorrect}</td>
              <td>${incongruentWrong}</td>
              <td>${fmt(avgIncongSec)}</td>
            </tr>
          </tbody>
        </table>
        整體平均反應時間：<strong>${fmt(avgRtAllSec)}</strong> 秒／題<br>
        總錯誤：<strong>${wrong}</strong>，總漏答：<strong>${missed}</strong><br>
        總作答時間：約 <strong>${totalSec.toFixed(2)}</strong> 秒`;

      btnStart.textContent = '再玩一次';
      btnStart.classList.remove('disabled');
      btnStart.disabled = false;
      disableAnswerButtons();
    }

    btnStart.addEventListener('click', startGame);
    btnLeft.addEventListener('click', () => handleAnswer('left'));
    btnRight.addEventListener('click', () => handleAnswer('right'));

    window.addEventListener('keydown', (e) => {
      if (!isAccepting) return;
      if (e.key === 'ArrowLeft') {
        handleAnswer('left');
      } else if (e.key === 'ArrowRight') {
        handleAnswer('right');
      }
    });

    // readme 區
    let readmeLoaded = false;

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function markdownToHtml(md) {
      const lines = md.split(/\r?\n/);
      let html = '';
      let inList = false;

      function closeList() {
        if (inList) {
          html += '</ul>';
          inList = false;
        }
      }

      for (let line of lines) {
        const trimmed = line.trim();

        const headingMatch = /^(#{1,6})\s+(.*)$/.exec(trimmed);
        if (headingMatch) {
          closeList();
          const level = headingMatch[1].length;
          const text = headingMatch[2];
          html += `<h${level}>${escapeHtml(text)}</h${level}>`;
          continue;
        }

        if (/^[-*+]\s+/.test(trimmed)) {
          if (!inList) {
            html += '<ul>';
            inList = true;
          }
          const item = trimmed.replace(/^[-*+]\s+/, '');
          html += `<li>${escapeHtml(item)}</li>`;
          continue;
        }

        if (trimmed === '') {
          closeList();
          html += '<br>';
          continue;
        }

        closeList();
        html += `<p>${escapeHtml(line)}</p>`;
      }
      closeList();

      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      return html;
    }

    async function loadReadme() {
      try {
        const res = await fetch('readme.md');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        helpBody.innerHTML = markdownToHtml(text);
      } catch (err) {
        helpBody.innerHTML =
          '<p>無法讀取 <code>readme.md</code>。請確認檔案是否與本遊戲 HTML 在同一資料夾，或部署在支援的伺服器上。</p>' +
          `<p>錯誤資訊：${escapeHtml(String(err))}</p>`;
      }
    }

    helpBtn.addEventListener('click', () => {
      helpOverlay.classList.add('show');
      if (!readmeLoaded) {
        readmeLoaded = true;
        helpBody.textContent = '讀取說明中…';
        loadReadme();
      }
    });

    function closeHelp() {
      helpOverlay.classList.remove('show');
    }

    closeHelpBtn.addEventListener('click', closeHelp);
    helpOverlay.addEventListener('click', (e) => {
      if (e.target === helpOverlay || e.target.classList.contains('overlay-backdrop')) {
        closeHelp();
      }
    });
  </script>
</body>
</html>
