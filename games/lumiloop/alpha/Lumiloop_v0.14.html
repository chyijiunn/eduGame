<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Lumiloop v0.14</title>
  <style>
    :root {
      --bg1: #02030a;
      --bg2: #12092a;
      --bg3: #351063;
      --panel: rgba(8, 10, 20, 0.42);
      --stroke: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.92);
      --sub: rgba(255,255,255,0.64);
      --accent: rgba(169, 146, 255, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(120, 80, 255, 0.35), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(32, 176, 255, 0.18), transparent 24%),
        radial-gradient(circle at 74% 84%, rgba(255, 70, 170, 0.18), transparent 25%),
        linear-gradient(180deg, var(--bg3) 0%, #130830 36%, var(--bg2) 60%, var(--bg1) 100%);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .hud {
      position: fixed;
      inset: env(safe-area-inset-top, 0) 0 auto 0;
      padding: calc(12px + env(safe-area-inset-top, 0)) 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 20;
    }

    .titleBlock, .miniHelp {
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      padding: 10px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .titleBlock {
      max-width: min(72vw, 420px);
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--sub);
    }

    .miniHelp {
      max-width: min(40vw, 240px);
      font-size: 12px;
      line-height: 1.45;
      color: var(--sub);
      text-align: right;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0));
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(8, 10, 20, 0.44);
      color: var(--text);
      padding: 12px 14px;
      min-width: 84px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(1px) scale(0.985);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
      background:
        radial-gradient(circle at center, rgba(98, 63, 194, 0.28), rgba(1, 2, 10, 0.84));
      transition: opacity 280ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: min(92vw, 460px);
      background: rgba(10, 11, 24, 0.68);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 26px;
      padding: 22px 20px 20px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.34);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .card h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .card p {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.7;
      color: var(--sub);
    }

    .startBtn {
      margin-top: 18px;
      width: 100%;
      appearance: none;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 800;
      color: white;
      background:
        linear-gradient(135deg, rgba(142, 97, 255, 0.96), rgba(68, 208, 255, 0.9));
      box-shadow: 0 14px 40px rgba(78, 91, 255, 0.34);
      touch-action: manipulation;
    }

    .footnote {
      margin-top: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.48);
    }

    @media (max-width: 680px) {
      .hud {
        padding: calc(10px + env(safe-area-inset-top, 0)) 10px 0;
        gap: 8px;
      }
      .miniHelp {
        display: none;
      }
      .titleBlock {
        max-width: calc(100vw - 20px);
      }
      .controls {
        gap: 8px;
      }
      .btn {
        min-width: 74px;
        padding: 11px 12px;
        font-size: 13px;
      }
      .card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="hud">
    <div class="titleBlock">
      <div class="title">Lumiloop v0.14</div>
      <div class="subtitle">修正手機上圈圈轉不動的問題：加入 touch 備援，放寬可拖動區域，音高仍維持 4 段速度等級。</div>
    </div>
    <div class="miniHelp">已修正手機拖動。<br>音高維持 4 段速度級距。</div>
  </div>

  <div class="controls">
    <button class="btn" id="shuffleBtn">重排</button>
    <button class="btn" id="muteBtn">靜音</button>
    <button class="btn" id="calmBtn">歸零</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1>電子浮游・致敬實驗</h1>
      <p>這是手機版 v0.14。<br>修正手機拖動偵測，加入 touch 備援，並把可旋轉區放寬。</p>
      <button class="startBtn" id="startBtn">點一下開始</button>
      <div class="footnote">為了符合手機瀏覽器規則，聲音需要由你主動點擊後啟動。</div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const muteBtn = document.getElementById('muteBtn');
      const calmBtn = document.getElementById('calmBtn');

      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      let W = 0;
      let H = 0;
      let centerX = 0;
      let centerY = 0;
      let t = 0;
      let started = false;
      let audioReady = false;
      let muted = false;
      let layoutVariant = 0;

      const pointers = new Map();
      const rings = [];
      const particles = [];
      const ambientBubbles = [];

      const palette = [
        ['#dcb7ff', '#966dff'],
        ['#95e5ff', '#4ea0ff'],
        ['#ffaddc', '#ff6ea8'],
        ['#ffc88e', '#ff8a5c']
      ];

      const lowToneSet = [45, 50, 52, 57]; // A2 D3 E3 A3, open / soothing

      let audioCtx = null;
      let masterGain = null;
      let wetGain = null;
      let dryGain = null;
      let analyser = null;

      function midiToFreq(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }

      function lerp(a, b, k) {
        return a + (b - a) * k;
      }

      function getLayoutPresets() {
        const compact = W < 430 || H < 760;
        if (compact) {
          return [
            [
              { x: 0.24, y: 0.27, r: 0.185, t: 0.25 },
              { x: 0.77, y: 0.31, r: 0.145, t: 0.25 },
              { x: 0.22, y: 0.66, r: 0.155, t: 0.25 },
              { x: 0.74, y: 0.67, r: 0.145, t: 0.25 }
            ],
            [
              { x: 0.22, y: 0.30, r: 0.175, t: 0.24 },
              { x: 0.76, y: 0.24, r: 0.14, t: 0.25 },
              { x: 0.28, y: 0.63, r: 0.15, t: 0.25 },
              { x: 0.76, y: 0.62, r: 0.14, t: 0.25 }
            ],
            [
              { x: 0.26, y: 0.24, r: 0.18, t: 0.25 },
              { x: 0.74, y: 0.34, r: 0.145, t: 0.25 },
              { x: 0.19, y: 0.66, r: 0.145, t: 0.25 },
              { x: 0.72, y: 0.62, r: 0.155, t: 0.25 }
            ]
          ];
        }
        return [
          [
            { x: 0.25, y: 0.26, r: 0.17, t: 0.24 },
            { x: 0.76, y: 0.28, r: 0.14, t: 0.24 },
            { x: 0.23, y: 0.67, r: 0.15, t: 0.24 },
            { x: 0.75, y: 0.66, r: 0.145, t: 0.24 }
          ],
          [
            { x: 0.22, y: 0.32, r: 0.165, t: 0.24 },
            { x: 0.78, y: 0.23, r: 0.135, t: 0.24 },
            { x: 0.31, y: 0.69, r: 0.145, t: 0.24 },
            { x: 0.77, y: 0.60, r: 0.145, t: 0.24 }
          ],
          [
            { x: 0.28, y: 0.23, r: 0.17, t: 0.24 },
            { x: 0.73, y: 0.35, r: 0.145, t: 0.24 },
            { x: 0.18, y: 0.66, r: 0.14, t: 0.24 },
            { x: 0.70, y: 0.63, r: 0.15, t: 0.24 }
          ]
        ];
      }

      function applyLayoutToRing(ring, slot) {
        const minDim = Math.min(W, H);
        ring.slot = { ...slot };
        ring.x = W * slot.x;
        ring.y = H * slot.y;
        ring.radius = minDim * slot.r;
        ring.thickness = ring.radius * slot.t;
        ring.innerRadius = ring.radius - ring.thickness * 0.86;
      }

      function resize() {
        W = Math.max(1, window.innerWidth);
        H = Math.max(1, window.innerHeight);
        centerX = W * 0.5;
        centerY = H * 0.52;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        if (!rings.length) buildRings();
        else fitRings();
        buildAmbientBubbles();
      }

      function buildRings() {
        rings.length = 0;
        const presets = getLayoutPresets();
        const slots = presets[layoutVariant % presets.length];
        for (let i = 0; i < 4; i++) {
          const slot = slots[i];
          const ring = makeRing(palette[i], lowToneSet[i], i);
          applyLayoutToRing(ring, slot);
          rings.push(ring);
        }
      }

      function fitRings() {
        const presets = getLayoutPresets();
        const slots = presets[layoutVariant % presets.length];
        rings.forEach((ring, i) => applyLayoutToRing(ring, slots[i]));
      }

      function makeRing(colors, midi, index) {
        return {
          x: 0,
          y: 0,
          radius: 0,
          thickness: 0,
          innerRadius: 0,
          angle: rand(0, Math.PI * 2),
          vel: 0,
          glow: 0.24,
          hueA: colors[0],
          hueB: colors[1],
          midi,
          activePointers: new Set(),
          shimmer: rand(0, Math.PI * 2),
          lastEmit: 0,
          synth: null,
          index,
          slot: null
        };
      }

      function rebuildLayout() {
        layoutVariant = (layoutVariant + 1) % getLayoutPresets().length;
        fitRings();
        rings.forEach((ring) => {
          ring.vel *= 0.45;
          ring.glow = Math.max(ring.glow, 0.45);
        });
      }

      function buildAmbientBubbles() {
        ambientBubbles.length = 0;
        const count = Math.round((W * H) / 36000);
        for (let i = 0; i < count; i++) {
          ambientBubbles.push({
            x: rand(0, W),
            y: rand(0, H),
            r: rand(2, 18),
            drift: rand(-0.05, 0.05),
            rise: rand(0.08, 0.42),
            alpha: rand(0.08, 0.3)
          });
        }
      }

      function createImpulseResponse(ctx, duration = 3.2, decay = 2.8) {
        const rate = ctx.sampleRate;
        const length = rate * duration;
        const impulse = ctx.createBuffer(2, length, rate);
        for (let ch = 0; ch < 2; ch++) {
          const data = impulse.getChannelData(ch);
          for (let i = 0; i < length; i++) {
            const n = i / length;
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - n, decay);
          }
        }
        return impulse;
      }

      async function initAudio() {
        if (audioReady) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        dryGain = audioCtx.createGain();
        wetGain = audioCtx.createGain();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;

        dryGain.gain.value = 0.92;
        wetGain.gain.value = 0.32;
        masterGain.gain.value = muted ? 0 : 0.84;

        const convolver = audioCtx.createConvolver();
        convolver.buffer = createImpulseResponse(audioCtx);

        const delay = audioCtx.createDelay(1.2);
        delay.delayTime.value = 0.24;
        const feedback = audioCtx.createGain();
        feedback.gain.value = 0.26;
        const delayTone = audioCtx.createBiquadFilter();
        delayTone.type = 'lowpass';
        delayTone.frequency.value = 1700;
        delayTone.Q.value = 0.2;

        dryGain.connect(masterGain);
        wetGain.connect(convolver);
        convolver.connect(masterGain);

        wetGain.connect(delay);
        delay.connect(delayTone).connect(masterGain);
        delayTone.connect(feedback).connect(delay);

        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);

        for (const ring of rings) {
          ring.synth = createRingSynth(ring);
        }

        audioReady = true;
      }

      function createRingSynth(ring) {
        const groupOut = audioCtx.createGain();
        groupOut.gain.value = 0;

        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.value = 980;
        lowpass.Q.value = 0.9;

        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 420;
        bandpass.Q.value = 0.5;

        const mix = audioCtx.createGain();
        mix.gain.value = 1;

        const shimmer = audioCtx.createGain();
        shimmer.gain.value = 0.94;
        const shimmerLfo = audioCtx.createOscillator();
        const shimmerLfoGain = audioCtx.createGain();
        shimmerLfo.frequency.value = rand(0.05, 0.12);
        shimmerLfoGain.gain.value = 0.03;
        shimmerLfo.connect(shimmerLfoGain).connect(shimmer.gain);
        shimmerLfo.start();

        const voiceCfg = [
          { type: 'sine', interval: 0, gain: 0.26, detune: -4 },
          { type: 'sine', interval: 0, gain: 0.23, detune: 4 },
          { type: 'sine', interval: -12, gain: 0.17, detune: 0 },
          { type: 'triangle', interval: 7, gain: 0.07, detune: 0 }
        ];

        const voices = voiceCfg.map(cfg => {
          const osc = audioCtx.createOscillator();
          osc.type = cfg.type;
          osc.detune.value = cfg.detune;
          const gain = audioCtx.createGain();
          gain.gain.value = cfg.gain;
          osc.connect(gain).connect(lowpass);
          osc.start();
          return { osc, gain, ...cfg };
        });

        lowpass.connect(bandpass);
        lowpass.connect(mix);
        bandpass.connect(mix);
        mix.connect(shimmer).connect(groupOut);
        groupOut.connect(dryGain);
        groupOut.connect(wetGain);

        return { groupOut, lowpass, bandpass, mix, voices, shimmerLfo, shimmerLfoGain };
      }

      function updateRingAudio(ring, now) {
        if (!audioReady || !ring.synth) return;
        const speed = Math.abs(ring.vel);
        const currentTime = audioCtx.currentTime;
        const audible = speed > 0.0025;

        let level = 0;
        if (speed >= 0.014) level = 1;
        if (speed >= 0.038) level = 2;
        if (speed >= 0.075) level = 3;

        const pitchSteps = [0, 2, 4, 7];
        const filterSteps = [620, 860, 1160, 1480];
        const gainSteps = [0.088, 0.096, 0.106, 0.116];
        const qSteps = [0.78, 1.0, 1.22, 1.45];
        const drift = Math.sin(now * 0.00018 + ring.index * 1.6 + ring.angle * 0.18) * 0.08;
        const directionBias = ring.vel >= 0 ? 0.18 : -0.08;
        const base = ring.midi + drift + directionBias + pitchSteps[level];
        const bandpassHz = midiToFreq(base + 12) * (1.18 + level * 0.08);
        const targetGain = muted ? 0 : (audible ? gainSteps[level] : 0);

        ring.synth.groupOut.gain.setTargetAtTime(targetGain, currentTime, 0.08);
        ring.synth.lowpass.frequency.setTargetAtTime(filterSteps[level] + ring.index * 28, currentTime, 0.11);
        ring.synth.lowpass.Q.setTargetAtTime(qSteps[level], currentTime, 0.13);
        ring.synth.bandpass.frequency.setTargetAtTime(bandpassHz, currentTime, 0.11);
        ring.synth.bandpass.Q.setTargetAtTime(0.38 + level * 0.24, currentTime, 0.13);
        ring.synth.shimmerLfo.frequency.setTargetAtTime(0.05 + level * 0.045, currentTime, 0.15);
        ring.synth.shimmerLfoGain.gain.setTargetAtTime(0.02 + level * 0.006, currentTime, 0.15);

        ring.synth.voices.forEach((voice) => {
          const freq = midiToFreq(base + voice.interval);
          voice.osc.frequency.setTargetAtTime(freq, currentTime, 0.09);
          const lift = voice.interval === -12 ? 0.98 : (voice.interval === 7 ? 0.82 : 1);
          const targetVG = voice.gain * (0.9 + level * 0.035) * lift;
          voice.gain.gain.setTargetAtTime(targetVG, currentTime, 0.1);
        });
      }

      function stopAllAudioSmooth() {
        if (!audioReady) return;
        rings.forEach(ring => {
          if (ring.synth) ring.synth.groupOut.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
        });
      }

      function distance(x1, y1, x2, y2) {
        return Math.hypot(x2 - x1, y2 - y1);
      }

      function angleAt(ring, x, y) {
        return Math.atan2(y - ring.y, x - ring.x);
      }

      function normalizeAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }


      function pickRing(x, y) {
        let best = null;
        let bestScore = Infinity;
        for (const ring of rings) {
          const d = distance(x, y, ring.x, ring.y);
          const stopRadius = ring.innerRadius * 0.32; // only tiny center stops
          const spinOuter = ring.radius + ring.thickness * 1.15;
          if (d < stopRadius) {
            return { ring, mode: 'stop', score: 0 };
          }
          // whole disc except tiny center can spin; prefer nearer ring body
          if (d < spinOuter) {
            const ringBodyDiff = Math.abs(d - ring.radius);
            const score = ringBodyDiff * 0.7 + Math.abs(d - ring.innerRadius) * 0.3;
            if (score < bestScore) {
              best = { ring, mode: 'spin', score };
              bestScore = score;
            }
          }
        }
        return best;
      }

      function applySpinDelta(ring, lastX, lastY, x, y) {
        const ax = lastX - ring.x;
        const ay = lastY - ring.y;
        const bx = x - ring.x;
        const by = y - ring.y;
        const cross = ax * by - ay * bx;
        const moveDist = Math.hypot(x - lastX, y - lastY);
        const radiusNow = Math.max(12, Math.hypot(bx, by));
        if (moveDist < 0.4) return;

        // Tangential component is more reliable on phones than raw angle delta.
        const tangential = cross / (radiusNow * radiusNow + 1e-6);
        let delta = tangential * 0.95;

        // Fallback: classic angular delta for slower arcs.
        const angA = Math.atan2(ay, ax);
        const angB = Math.atan2(by, bx);
        delta += normalizeAngle(angB - angA) * 0.18;

        ring.vel += delta;
        ring.vel = clamp(ring.vel, -0.16, 0.16);
        ring.glow = Math.min(1.35, ring.glow + Math.abs(delta) * 3.6 + moveDist * 0.006 + 0.02);
        if (Math.random() < 0.38) burst(x, y, ring.hueB, 1, 0.32);
      }

      function handlePointerDown(ev) {
        ev.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const y = ev.clientY - rect.top;
        const target = pickRing(x, y);
        const info = { x, y, lastX: x, lastY: y, ring: null, mode: 'none' };
        if (target) {
          info.ring = target.ring;
          info.mode = target.mode;
          if (target.mode === 'stop') {
            target.ring.vel *= 0.06;
            target.ring.glow = 0.6;
            burst(target.ring.x, target.ring.y, target.ring.hueA, 10, 0.8);
          } else {
            target.ring.activePointers.add(ev.pointerId);
            target.ring.glow = Math.max(target.ring.glow, 0.6);
            burst(x, y, target.ring.hueA, 6, 0.55);
          }
        }
        pointers.set(ev.pointerId, info);
        try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
      }

      function handlePointerMove(ev) {
        const p = pointers.get(ev.pointerId);
        if (!p) return;
        ev.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const y = ev.clientY - rect.top;
        if (p.ring && p.mode === 'spin') {
          applySpinDelta(p.ring, p.lastX, p.lastY, x, y);
        }
        p.lastX = x;
        p.lastY = y;
      }

      function handlePointerUp(ev) {
        ev.preventDefault();
        const p = pointers.get(ev.pointerId);
        if (p && p.ring) p.ring.activePointers.delete(ev.pointerId);
        pointers.delete(ev.pointerId);
        try { canvas.releasePointerCapture(ev.pointerId); } catch (_) {}
      }

      function handleTouchStart(ev) {
        ev.preventDefault();
        const rect = canvas.getBoundingClientRect();
        for (const touch of ev.changedTouches) {
          const x = touch.clientX - rect.left;
          const y = touch.clientY - rect.top;
          const target = pickRing(x, y);
          const info = { x, y, lastX: x, lastY: y, ring: null, mode: 'none' };
          if (target) {
            info.ring = target.ring;
            info.mode = target.mode;
            if (target.mode === 'stop') {
              target.ring.vel *= 0.06;
              target.ring.glow = 0.6;
              burst(target.ring.x, target.ring.y, target.ring.hueA, 10, 0.8);
            } else {
              target.ring.activePointers.add('t'+touch.identifier);
              target.ring.glow = Math.max(target.ring.glow, 0.6);
              burst(x, y, target.ring.hueA, 6, 0.55);
            }
          }
          pointers.set('t'+touch.identifier, info);
        }
      }

      function handleTouchMove(ev) {
        ev.preventDefault();
        const rect = canvas.getBoundingClientRect();
        for (const touch of ev.changedTouches) {
          const key = 't'+touch.identifier;
          const p = pointers.get(key);
          if (!p) continue;
          const x = touch.clientX - rect.left;
          const y = touch.clientY - rect.top;
          if (p.ring && p.mode === 'spin') {
            applySpinDelta(p.ring, p.lastX, p.lastY, x, y);
          }
          p.lastX = x;
          p.lastY = y;
        }
      }

      function handleTouchEnd(ev) {
        ev.preventDefault();
        for (const touch of ev.changedTouches) {
          const key = 't'+touch.identifier;
          const p = pointers.get(key);
          if (p && p.ring) p.ring.activePointers.delete(key);
          pointers.delete(key);
        }
      }
      function burst(x, y, color, count, energy = 1) {
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const s = rand(0.2, 1.2) * energy;
          particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - rand(0.05, 0.7),
            r: rand(1.2, 4.8) * energy,
            life: rand(18, 42),
            maxLife: 42,
            color
          });
        }
      }

      function update(dt, now) {
        t += dt;

        for (const b of ambientBubbles) {
          b.y -= b.rise * dt * 0.06;
          b.x += Math.sin(now * 0.0003 + b.r * 0.1) * b.drift * dt * 0.3;
          if (b.y < -30) {
            b.y = H + rand(10, 60);
            b.x = rand(0, W);
          }
        }

        for (const ring of rings) {
          ring.innerRadius = ring.radius - ring.thickness * 0.86;
          ring.angle += ring.vel * dt * 0.06;
          ring.vel *= Math.pow(0.9935, dt);
          if (Math.abs(ring.vel) < 0.00008) ring.vel = 0;
          ring.glow = lerp(ring.glow, 0.22 + Math.abs(ring.vel) * 7.2, 0.06);
          ring.shimmer += dt * 0.0005 * (0.32 + Math.abs(ring.vel) * 54);
          if (Math.abs(ring.vel) > 0.018 && now - ring.lastEmit > 92) {
            const a = ring.angle + Math.sin(ring.shimmer) * 0.5;
            burst(ring.x + Math.cos(a) * ring.radius, ring.y + Math.sin(a) * ring.radius, ring.hueA, 2, 0.38);
            ring.lastEmit = now;
          }
          updateRingAudio(ring, now);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt * 0.06;
          p.y += p.vy * dt * 0.06;
          p.vx *= 0.992;
          p.vy *= 0.992;
          p.life -= dt * 0.06;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function drawBackground(now) {
        ctx.clearRect(0, 0, W, H);

        const bgGrad = ctx.createRadialGradient(centerX, centerY, Math.min(W, H) * 0.08, centerX, centerY, Math.max(W, H));
        bgGrad.addColorStop(0, 'rgba(90, 65, 170, 0.16)');
        bgGrad.addColorStop(0.35, 'rgba(32, 14, 75, 0.14)');
        bgGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        for (const b of ambientBubbles) {
          ctx.save();
          ctx.globalAlpha = b.alpha;
          ctx.strokeStyle = 'rgba(255,255,255,0.68)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.26, Math.max(0.8, b.r * 0.18), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.26)';
          ctx.fill();
          ctx.restore();
        }

        const waveY = H * 0.76;
        const amp = Math.min(W, H) * 0.04;
        ctx.save();
        ctx.globalAlpha = 0.12;
        const waveGrad = ctx.createLinearGradient(0, waveY - amp * 2, 0, H);
        waveGrad.addColorStop(0, 'rgba(255, 132, 218, 0.12)');
        waveGrad.addColorStop(1, 'rgba(255, 132, 218, 0)');
        ctx.fillStyle = waveGrad;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += 24) {
          const y = waveY + Math.sin(x * 0.01 + now * 0.0011) * amp + Math.sin(x * 0.004 + now * 0.0005) * amp * 0.7;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawRing(ring, now) {
        ctx.save();
        ctx.translate(ring.x, ring.y);
        ctx.rotate(ring.angle);

        const outer = ring.radius;
        const inner = ring.innerRadius;
        const glow = clamp(ring.glow, 0.15, 1.5);

        ctx.shadowBlur = 28 + glow * 26;
        ctx.shadowColor = ring.hueB;

        const ringGrad = ctx.createRadialGradient(0, 0, inner * 0.45, 0, 0, outer + ring.thickness * 0.65);
        ringGrad.addColorStop(0, 'rgba(0,0,0,0)');
        ringGrad.addColorStop(0.48, ring.hueA + '22');
        ringGrad.addColorStop(0.65, ring.hueA + '66');
        ringGrad.addColorStop(0.83, ring.hueB + 'd9');
        ringGrad.addColorStop(1, ring.hueA + '00');

        ctx.fillStyle = ringGrad;
        ctx.beginPath();
        ctx.arc(0, 0, outer, 0, Math.PI * 2);
        ctx.arc(0, 0, inner, 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.lineWidth = Math.max(1.4, ring.thickness * 0.09);
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.beginPath();
        ctx.arc(0, 0, outer - ring.thickness * 0.18, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = Math.max(1, ring.thickness * 0.06);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.arc(0, 0, inner + ring.thickness * 0.12, 0, Math.PI * 2);
        ctx.stroke();

        for (let i = 0; i < 8; i++) {
          const a = (Math.PI * 2 * i) / 8 + ring.shimmer * 0.6;
          const rr = lerp(inner + ring.thickness * 0.15, outer - ring.thickness * 0.15, 0.3 + 0.2 * Math.sin(now * 0.001 + i + ring.index));
          ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.16)' : ring.hueA + '77';
          ctx.beginPath();
          ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, Math.max(2, ring.thickness * 0.11), 0, Math.PI * 2);
          ctx.fill();
        }

        const holeGrad = ctx.createRadialGradient(-inner * 0.14, -inner * 0.14, inner * 0.1, 0, 0, inner);
        holeGrad.addColorStop(0, 'rgba(10, 12, 32, 0.2)');
        holeGrad.addColorStop(1, 'rgba(0, 0, 0, 0.92)');
        ctx.fillStyle = holeGrad;
        ctx.beginPath();
        ctx.arc(0, 0, inner * 0.96, 0, Math.PI * 2);
        ctx.fill();

        if (ring.activePointers.size) {
          ctx.globalAlpha = 0.45;
          ctx.strokeStyle = 'rgba(255,255,255,0.76)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, outer + ring.thickness * 0.18, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          const alpha = clamp(p.life / p.maxLife, 0, 1) * 0.75;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color + 'cc';
          ctx.shadowBlur = 14;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawAudioHalo() {
        if (!audioReady || !analyser) return;
        const arr = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(arr);
        let sum = 0;
        for (let i = 0; i < arr.length; i++) sum += arr[i];
        const energy = sum / (arr.length * 255);
        const r = Math.min(W, H) * (0.18 + energy * 0.05);

        ctx.save();
        ctx.globalAlpha = 0.1 + energy * 0.1;
        const g = ctx.createRadialGradient(centerX, centerY, r * 0.35, centerX, centerY, r * 1.7);
        g.addColorStop(0, 'rgba(145, 110, 255, 0.24)');
        g.addColorStop(0.62, 'rgba(80, 180, 255, 0.08)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(centerX, centerY, r * 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function render(now) {
        drawBackground(now);
        drawAudioHalo();
        rings.forEach(ring => drawRing(ring, now));
        drawParticles();
      }

      let last = performance.now();
      function loop(now) {
        const dt = Math.min(32, now - last);
        last = now;
        update(dt, now);
        render(now);
        requestAnimationFrame(loop);
      }

      async function startExperience() {
        if (!audioReady) await initAudio();
        if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
        overlay.classList.add('hidden');
        started = true;
      }

      startBtn.addEventListener('click', startExperience, { passive: true });

      shuffleBtn.addEventListener('click', () => {
        rebuildLayout();
        burst(centerX, centerY, '#ffffff', 18, 1.3);
      });

      muteBtn.addEventListener('click', async () => {
        if (!audioReady) await startExperience();
        muted = !muted;
        muteBtn.textContent = muted ? '開聲' : '靜音';
        if (audioReady && masterGain) {
          masterGain.gain.setTargetAtTime(muted ? 0 : 0.84, audioCtx.currentTime, 0.05);
        }
      });

      calmBtn.addEventListener('click', () => {
        rings.forEach(r => { r.vel *= 0.08; r.glow = 0.35; });
        burst(centerX, centerY, '#bcd9ff', 14, 0.9);
        stopAllAudioSmooth();
      });

      canvas.addEventListener('pointerdown', async (ev) => {
        if (!started) await startExperience();
        handlePointerDown(ev);
      }, { passive: false });
      canvas.addEventListener('pointermove', handlePointerMove, { passive: false });
      canvas.addEventListener('pointerup', handlePointerUp, { passive: false });
      canvas.addEventListener('pointercancel', handlePointerUp, { passive: false });
      canvas.addEventListener('pointerleave', handlePointerUp, { passive: false });

      canvas.addEventListener('touchstart', async (ev) => {
        if (!started) await startExperience();
        handleTouchStart(ev);
      }, { passive: false });
      canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
      canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

      window.addEventListener('resize', resize);
      document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('touchmove', (e) => {
        if (e.target === canvas) e.preventDefault();
      }, { passive: false });

      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
