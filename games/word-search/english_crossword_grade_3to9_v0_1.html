
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>英文填字小遊戲（國小三年級～國中九年級）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #111827;
      --card: #1f2937;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.18);
      --accent-strong: #16a34a;
      --text-main: #e5e7eb;
      --text-sub: #9ca3af;
      --error: #f97373;
      --correct: #4ade80;
      --grid-border: #4b5563;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang TC","Microsoft JhengHei",sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 40%, #020617 100%);
      color: var(--text-main);
    }
    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      background: linear-gradient(145deg, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border-radius: 20px;
      border: 1px solid rgba(148,163,184,0.4);
      box-shadow:
        0 20px 45px rgba(0,0,0,0.7),
        0 0 0 1px rgba(15,23,42,0.9);
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (min-width: 900px) {
      .app {
        padding: 22px 24px 24px;
      }
    }
    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: radial-gradient(circle at 30% 20%, #bbf7d0 0, #22c55e 28%, #166534 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(22,163,74,0.6), 0 12px 24px rgba(0,0,0,0.6);
      font-weight: 800;
      color: #022c22;
      font-size: 18px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: 0.03em;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    h1 span.grade-label {
      font-size: 13px;
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 10px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.4);
    }
    .subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--text-sub);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }
    .select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .select-wrap label {
      white-space: nowrap;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: rgba(15,23,42,0.95);
      color: var(--text-main);
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      padding: 7px 28px 7px 12px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 10px;
      font-size: 11px;
      color: var(--text-sub);
      pointer-events: none;
    }
    button {
      border-radius: 999px;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
    }
    button:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #022c22;
      box-shadow: 0 10px 18px rgba(34,197,94,0.35);
    }
    .btn-secondary {
      background: rgba(15,23,42,0.9);
      color: var(--text-main);
      border: 1px solid rgba(148,163,184,0.7);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-sub);
      border: 1px dashed rgba(75,85,99,0.9);
    }
    .btn-primary span.icon {
      font-size: 14px;
    }
    .main {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 16px;
      align-items: flex-start;
    }
    @media (max-width: 800px) {
      .main {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .card {
      background: radial-gradient(circle at top left, rgba(15,23,42,0.98), rgba(15,23,42,0.98));
      border-radius: 16px;
      border: 1px solid rgba(55,65,81,0.9);
      padding: 14px 14px 12px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(34,197,94,0.16), transparent 60%);
      opacity: 0.7;
      pointer-events: none;
    }
    .card-inner {
      position: relative;
      z-index: 1;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-title-pill {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      color: var(--text-sub);
    }
    .card-subtitle {
      font-size: 12px;
      color: var(--text-sub);
      margin: 0;
    }
    .grid-wrapper {
      overflow-x: auto;
      padding-bottom: 6px;
    }
    table.crossword {
      border-collapse: collapse;
      margin-top: 4px;
    }
    .crossword td {
      width: 32px;
      height: 32px;
      border: 1px solid var(--grid-border);
      padding: 0;
      position: relative;
      background: radial-gradient(circle at top left, rgba(31,41,55,0.95), rgba(15,23,42,1));
    }
    .cell-number {
      position: absolute;
      top: 1px;
      left: 3px;
      font-size: 9px;
      color: var(--text-sub);
      pointer-events: none;
      user-select: none;
    }
    .crossword input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-main);
    }
    .cell-empty {
      background: radial-gradient(circle at top, #020617, #020617);
    }
    .cell-correct {
      box-shadow: inset 0 0 0 2px rgba(34,197,94,0.7);
      background: radial-gradient(circle at center, rgba(34,197,94,0.16), rgba(15,23,42,1));
    }
    .cell-wrong {
      box-shadow: inset 0 0 0 2px rgba(248,113,113,0.8);
      background: radial-gradient(circle at center, rgba(127,29,29,0.9), rgba(15,23,42,1));
    }
    .grid-footer {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
    }
    .status-text {
      font-size: 12px;
      color: var(--text-sub);
    }
    .status-text strong {
      color: var(--accent);
      font-weight: 600;
    }
    .status-text.error strong {
      color: var(--error);
    }
    .status-text.ok strong {
      color: var(--correct);
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .clue-groups {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 310px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .clue-group-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-sub);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .clue-group-title::before {
      content: "";
      width: 12px;
      height: 1px;
      background: linear-gradient(90deg, rgba(148,163,184,0.9), transparent);
    }
    ul.clue-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }
    ul.clue-list li {
      padding: 4px 8px;
      border-radius: 9px;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(55,65,81,0.9);
      line-height: 1.3;
      cursor: default;
    }
    .clue-meta {
      font-size: 11px;
      color: var(--text-sub);
    }
    .clue-english {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }
    .helper-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-sub);
    }
    .badge-soft {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.9);
      background: rgba(15,23,42,0.8);
    }
    .legend {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }
    .legend-swatch.ok {
      background: var(--accent);
    }
    .legend-swatch.err {
      background: var(--error);
    }
    .footer-note {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title-block">
        <div class="title-row">
          <div class="title-badge">EN</div>
          <h1>
            英文填字小遊戲
            <span class="grade-label" id="currentGradeLabel">國小三年級～國中九年級</span>
          </h1>
        </div>
        <p class="subtitle">
          先選年級 → 產生題目 → 依中文提示填入<span style="color:#facc15;">英文單字</span>，練習字彙與拼字。
        </p>
      </div>
      <div class="controls">
        <div class="select-wrap">
          <label for="gradeSelect">選擇年級</label>

            <option value="3">國小三年級</option>
            <option value="4">國小四年級</option>
            <option value="5">國小五年級</option>
            <option value="6">國小六年級</option>
            <option value="7">國中七年級</option>
            <option value="8">國中八年級</option>
            <option value="9">國中九年級</option>
          </select>
        </div>
        <button class="btn-primary" id="btnNew">
          <span class="icon">✦</span>
          產生新題目
        </button>
      </div>
    </header>

    <main class="main">
      <section class="card">
        <div class="card-inner">
          <div class="card-header">
            <div>
              <div class="card-title">
                Crossword Grid
                <span class="card-title-pill">打字填空</span>
              </div>
              <p class="card-subtitle">點選格子直接輸入英文。完成後可按「檢查答案」。</p>
            </div>
          </div>

          <div class="grid-wrapper">
            <table class="crossword" id="grid"></table>
          </div>

          <div class="grid-footer">
            <div class="status-text" id="statusText">
              先從上方選年級，再產生題目。
            </div>
            <div class="btn-group">
              <button class="btn-secondary" id="btnCheck">檢查答案</button>
              <button class="btn-ghost" id="btnReveal">顯示解答</button>
              <button class="btn-ghost" id="btnClear">全部清除</button>
            </div>
          </div>

          <div class="helper-row">
            <div class="badge-soft">
              提示：
              <span style="color:#a5b4fc;">同一列為一個英文單字，不分大小寫。</span>
            </div>
            <div class="legend">
              <span class="legend-item">
                <span class="legend-swatch ok"></span> 正確
              </span>
              <span class="legend-item">
                <span class="legend-swatch err"></span> 錯誤
              </span>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-inner">
          <div class="card-header">
            <div>
              <div class="card-title">
                Clues &amp; Words
                <span class="card-title-pill">中文提示 / 英文拼字</span>
              </div>
              <p class="card-subtitle">依照編號找到對應橫列，將中文提示轉成英文單字填入。</p>
            </div>
          </div>

          <div class="clue-groups" id="clueGroups">
            <!-- 動態生成 -->
          </div>

          <div class="helper-row">
            <div class="badge-soft">
              小提醒：
              <span style="color:#a5b4fc;">老師可依年級讓學生輪流上台填字，也可當小組競賽。</span>
            </div>
            <div>本頁可離線使用，直接用瀏覽器開啟 .html 即可。</div>
          </div>

          <div class="footer-note">
            版本 0.1 • Crossword 練習（台灣國小 / 國中）
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // 年級字庫：可以依需求自行修改 / 擴充
    // 每個項目：answer = 英文, zh = 中文提示
    const WORD_BANK = {

      ],
      "6": [
        { answer: "holiday", zh: "假日；假期" },
        { answer: "future", zh: "未來" },
        { answer: "travel", zh: "旅行" },
        { answer: "problem", zh: "問題；困難" },
        { answer: "answer", zh: "答案；回答" },
        { answer: "reason", zh: "理由" },
        { answer: "forest", zh: "森林" },
        { answer: "recycle", zh: "回收" }
      ],
      "7": [
        { answer: "hobby", zh: "嗜好" },
        { answer: "mobile", zh: "行動的；手機" },
        { answer: "internet", zh: "網際網路" },
        { answer: "improve", zh: "改善；進步" },
        { answer: "energy", zh: "能量；精力" },
        { answer: "camera", zh: "照相機" },
        { answer: "culture", zh: "文化" },
        { answer: "nature", zh: "自然" }
      ],
      "8": [
        { answer: "history", zh: "歷史" },
        { answer: "physics", zh: "物理（學）" },
        { answer: "biology", zh: "生物學" },
        { answer: "climate", zh: "氣候" },
        { answer: "plastic", zh: "塑膠" },
        { answer: "robot", zh: "機器人" },
        { answer: "concert", zh: "音樂會" },
        { answer: "project", zh: "專題；計畫" }
      ],
      "9": [
        { answer: "pressure", zh: "壓力" },
        { answer: "nervous", zh: "緊張的；神經質的" },
        { answer: "challenge", zh: "挑戰" },
        { answer: "career", zh: "職涯；事業" },
        { answer: "decision", zh: "決定" },
        { answer: "support", zh: "支持" },
        { answer: "freedom", zh: "自由" },
        { answer: "prepare", zh: "準備" }
      ]
    };

    const gradeLabelMap = {
      "3": "國小三年級",
      "4": "國小四年級",
      "5": "國小五年級",
      "6": "國小六年級",
      "7": "國中七年級",
      "8": "國中八年級",
      "9": "國中九年級"
    };

    const gridEl = document.getElementById("grid");
    const clueGroupsEl = document.getElementById("clueGroups");
    const statusTextEl = document.getElementById("statusText");
    const gradeSelectEl = document.getElementById("gradeSelect");
    const gradeLabelEl = document.getElementById("currentGradeLabel");
    const btnNew = document.getElementById("btnNew");
    const btnCheck = document.getElementById("btnCheck");
    const btnReveal = document.getElementById("btnReveal");
    const btnClear = document.getElementById("btnClear");

    // 目前題目狀態
    let currentPuzzle = null;

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function createPuzzleForGrade(grade) {
      const words = WORD_BANK[grade];
      if (!words || words.length === 0) return null;

      // 打亂並取前 6～8 個單字
      const shuffled = shuffleArray(words);
      const count = Math.min(8, Math.max(6, shuffled.length));
      const selected = shuffled.slice(0, count);

      let maxLen = 0;
      selected.forEach((w) => {
        const len = w.answer.length;
        if (len > maxLen) maxLen = len;
      });

      const rowGap = 1; // 單字之間保留一列空白
      const rows = selected.length * (1 + rowGap) - rowGap;
      const cols = maxLen;

      // 建立格子資料
      const cells = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          row.push({
            letter: null, // 正確答案
            clueIndex: null, // 對應第幾題
            isStart: false
          });
        }
        cells.push(row);
      }

      // 放單字：全部橫向排列，每題一列
      let puzzleClues = [];
      for (let i = 0; i < selected.length; i++) {
        const baseRow = i * (1 + rowGap);
        const wordObj = selected[i];
        const ans = wordObj.answer.toLowerCase();
        for (let j = 0; j < ans.length; j++) {
          cells[baseRow][j].letter = ans[j];
          cells[baseRow][j].clueIndex = i; // 第 i 題
          if (j === 0) {
            cells[baseRow][j].isStart = true; // 顯示題號
          }
        }
        puzzleClues.push({
          no: i + 1,
          english: wordObj.answer.toLowerCase(),
          zh: wordObj.zh,
          row: baseRow,
          colStart: 0,
          length: ans.length
        });
      }

      return {
        grade,
        rows,
        cols,
        cells,
        cluesAcross: puzzleClues
      };
    }

    function renderGrid(puzzle) {
      gridEl.innerHTML = "";
      if (!puzzle) return;

      for (let r = 0; r < puzzle.rows; r++) {
        const tr = document.createElement("tr");
        for (let c = 0; c < puzzle.cols; c++) {
          const td = document.createElement("td");
          const cellData = puzzle.cells[r][c];

          if (cellData.letter === null) {
            td.classList.add("cell-empty");
          } else {
            const num = document.createElement("div");
            num.className = "cell-number";
            if (cellData.isStart && cellData.clueIndex !== null) {
              num.textContent = puzzle.cluesAcross[cellData.clueIndex].no;
            }
            td.appendChild(num);

            const input = document.createElement("input");
            input.setAttribute("maxlength", "1");
            input.dataset.row = r;
            input.dataset.col = c;

            input.addEventListener("input", (e) => {
              const v = e.target.value.toUpperCase();
              e.target.value = v.replace(/[^A-Z]/g, "").slice(0, 1);
              clearCellState(td);
              moveToNextCell(r, c);
            });

            input.addEventListener("focus", () => {
              clearCellState(td);
            });

            td.appendChild(input);
          }

          tr.appendChild(td);
        }
        gridEl.appendChild(tr);
      }
    }

    function clearCellState(td) {
      td.classList.remove("cell-correct");
      td.classList.remove("cell-wrong");
    }

    function renderClues(puzzle) {
      clueGroupsEl.innerHTML = "";
      if (!puzzle) return;

      const groupAcross = document.createElement("div");
      const titleAcross = document.createElement("div");
      titleAcross.className = "clue-group-title";
      titleAcross.textContent = "ACROSS 橫列提示";
      groupAcross.appendChild(titleAcross);

      const ulAcross = document.createElement("ul");
      ulAcross.className = "clue-list";

      puzzle.cluesAcross.forEach((clue) => {
        const li = document.createElement("li");
        const main = document.createElement("div");
        main.innerHTML = `<strong>${clue.no}.</strong> ${clue.zh}`;
        const meta = document.createElement("div");
        meta.className = "clue-meta";
        meta.innerHTML =
          `列：第 <strong>${clue.row + 1}</strong> 列，長度：<strong>${clue.length}</strong> 格`;
        const eng = document.createElement("div");
        eng.className = "clue-english";
        eng.textContent = `英文：${clue.english}`;

        li.appendChild(main);
        li.appendChild(meta);
        li.appendChild(eng);
        ulAcross.appendChild(li);
      });

      groupAcross.appendChild(ulAcross);
      clueGroupsEl.appendChild(groupAcross);
    }

    function updateStatus(message, type) {
      statusTextEl.textContent = "";
      statusTextEl.classList.remove("ok", "error");

      if (!message) {
        statusTextEl.textContent = "";
        return;
      }
      if (type === "ok") {
        statusTextEl.classList.add("ok");
      } else if (type === "error") {
        statusTextEl.classList.add("error");
      }
      // 強調的部分放在 <strong> 中
      statusTextEl.innerHTML = message;
    }

    function moveToNextCell(row, col) {
      if (!currentPuzzle) return;
      const puzzle = currentPuzzle;

      // 向右尋找同一列下一個有字母的格子
      for (let c = col + 1; c < puzzle.cols; c++) {
        if (puzzle.cells[row][c].letter !== null) {
          const nextInput = gridEl.querySelector('input[data-row="' + row + '"][data-col="' + c + '"]');
          if (nextInput) {
            nextInput.focus();
          }
          return;
        }
      }
    }

    function checkAnswers() {
      if (!currentPuzzle) return;

      const puzzle = currentPuzzle;
      let hasAny = false;
      let allFilled = true;
      let allCorrect = true;

      for (let r = 0; r < puzzle.rows; r++) {
        for (let c = 0; c < puzzle.cols; c++) {
          const cell = puzzle.cells[r][c];
          if (cell.letter === null) continue;

          const td = gridEl.rows[r].cells[c];
          const input = td.querySelector("input");
          const v = (input.value || "").toLowerCase();

          if (v !== "") hasAny = true;
          else allFilled = false;

          clearCellState(td);

          if (v === "") continue;

          if (v === cell.letter) {
            td.classList.add("cell-correct");
          } else {
            td.classList.add("cell-wrong");
            allCorrect = false;
          }
        }
      }

      if (!hasAny) {
        updateStatus("尚未作答，先試著填幾個單字再按「檢查答案」。", "error");
      } else if (allCorrect && allFilled) {
        updateStatus("<strong>太厲害了！</strong> 所有單字都正確！", "ok");
      } else if (allCorrect && !allFilled) {
        updateStatus("目前<strong>已填寫的格子都正確</strong>，再把剩下的完成吧！", "ok");
      } else {
        updateStatus("有些格子<strong>拼錯了</strong>，請依照紅框提示再檢查看看。", "error");
      }
    }

    function revealAnswers() {
      if (!currentPuzzle) return;
      const puzzle = currentPuzzle;

      for (let r = 0; r < puzzle.rows; r++) {
        for (let c = 0; c < puzzle.cols; c++) {
          const cell = puzzle.cells[r][c];
          if (cell.letter === null) continue;

          const td = gridEl.rows[r].cells[c];
          const input = td.querySelector("input");
          if (input) {
            input.value = cell.letter.toUpperCase();
          }
          clearCellState(td);
          td.classList.add("cell-correct");
        }
      }
      updateStatus("已顯示所有答案，想再練習可以按「產生新題目」。", "ok");
    }

    function clearInputs() {
      if (!currentPuzzle) return;
      const puzzle = currentPuzzle;

      for (let r = 0; r < puzzle.rows; r++) {
        for (let c = 0; c < puzzle.cols; c++) {
          const cell = puzzle.cells[r][c];
          if (cell.letter === null) continue;

          const td = gridEl.rows[r].cells[c];
          const input = td.querySelector("input");
          if (input) {
            input.value = "";
          }
          clearCellState(td);
        }
      }
      updateStatus("已清除本題所有作答，可以重新練習。", null);
    }

    function newPuzzle() {
      const grade = gradeSelectEl.value;
      const p = createPuzzleForGrade(grade);
      currentPuzzle = p;
      renderGrid(p);
      renderClues(p);

      gradeLabelEl.textContent = gradeLabelMap[grade] || "國小三年級～國中九年級";
      updateStatus("已為 <strong>" + (gradeLabelMap[grade] || "") + "</strong> 產生新題目，請依提示填入英文單字。", "ok");

      // 自動聚焦第一格
      setTimeout(() => {
        const firstInput = gridEl.querySelector("input");
        if (firstInput) firstInput.focus();
      }, 50);
    }

    btnNew.addEventListener("click", () => {
      newPuzzle();
    });

    btnCheck.addEventListener("click", () => {
      checkAnswers();
    });

    btnReveal.addEventListener("click", () => {
      const sure = confirm("確定要顯示全部答案嗎？\n（建議先自己試試看再偷看解答！）");
      if (sure) {
        revealAnswers();
      }
    });

    btnClear.addEventListener("click", () => {
      clearInputs();
    });

    // 預設載入顯示三年級範例題
    window.addEventListener("load", () => {
      newPuzzle();
    });
  </script>
</body>
</html>
