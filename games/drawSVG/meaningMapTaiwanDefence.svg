<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#555555" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="700" y="60" text-anchor="middle" font-size="26" fill="#222222">
    「2027 武力犯台可能性」作為混沌之龍的拆解圖
  </text>
  <text x="700" y="90" text-anchor="middle" font-size="16" fill="#666666">
    以《意義地圖》模型：從混沌 → 秩序，區分政治層面與人民層面
  </text>

  <!-- 上方：混沌之龍 -->
  <rect x="260" y="120" width="880" height="140" rx="18" ry="18" fill="#f5eefb" stroke="#7b3f98" stroke-width="2"/>
  <text x="700" y="152" text-anchor="middle" font-size="20" fill="#5a2879">
    混沌之龍：中華人民共和國 2027 年可能武力犯台
  </text>
  <text x="280" y="182" font-size="14" fill="#5a2879">
    ● 不確定：會不會打？何時、何種形式（封鎖、飛彈、登陸、網攻、灰色地帶）？
  </text>
  <text x="280" y="204" font-size="14" fill="#5a2879">
    ● 不確定：美國、日本及其他國家如何介入？制裁與供應鏈如何變化？
  </text>
  <text x="280" y="226" font-size="14" fill="#5a2879">
    ● 不確定：台灣內部政治、社會心理、資訊戰在危機中會如何被撕裂或團結？
  </text>

  <!-- 中央：共同目標 -->
  <circle cx="700" cy="390" r="120" fill="#fdf7e3" stroke="#b38b00" stroke-width="2"/>
  <text x="700" y="360" text-anchor="middle" font-size="18" fill="#b38b00">
    共同目標
  </text>
  <text x="700" y="385" text-anchor="middle" font-size="14" fill="#8a6d00">
    嚇阻戰爭、降低傷害、
  </text>
  <text x="700" y="407" text-anchor="middle" font-size="14" fill="#8a6d00">
    守住民主與生活方式
  </text>
  <text x="700" y="431" text-anchor="middle" font-size="12" fill="#8a6d00">
    （站在秩序與混沌交界，以行動創造意義）
  </text>

  <!-- 左：政治層面 -->
  <rect x="60" y="320" width="520" height="500" rx="20" ry="20" fill="#e9f7f0" stroke="#2f8f5b" stroke-width="2"/>
  <text x="320" y="350" text-anchor="middle" font-size="20" fill="#1b5e3b">
    政治層面：政府／政黨／國防與外交
  </text>

  <!-- 政治：混沌 -->
  <text x="80" y="380" font-size="16" fill="#1b5e3b">
    ① 需要面對的「混沌」
  </text>
  <text x="100" y="405" font-size="13" fill="#1b5e3b">
    ● 北京實際意圖與內部情勢（經濟、內政壓力、領導穩定度）
  </text>
  <text x="100" y="427" font-size="13" fill="#1b5e3b">
    ● 軍事手段型態：登陸、飛彈打擊、海空封鎖、網路與電力戰
  </text>
  <text x="100" y="449" font-size="13" fill="#1b5e3b">
    ● 他國反應：美國、日本、區域盟友在各種情境下的實際投入程度
  </text>
  <text x="100" y="471" font-size="13" fill="#1b5e3b">
    ● 國際金融與供應鏈震盪：能源、半導體、航運
  </text>
  <text x="100" y="493" font-size="13" fill="#1b5e3b">
    ● 危機下內部政治對立是否被放大、被外部勢力利用

  </text>

  <!-- 政治：秩序／行動 -->
  <text x="80" y="523" font-size="16" fill="#1b5e3b">
    ② 可轉成「秩序」的具體行動
  </text>
  <text x="100" y="548" font-size="13" fill="#1b5e3b">
    ● 長期、跨選期的國防建軍計畫與穩定預算（含非對稱戰力）
  </text>
  <text x="100" y="570" font-size="13" fill="#1b5e3b">
    ● 強化關鍵基礎設施防護：電力、通訊、海底電纜、資料備援
  </text>
  <text x="100" y="592" font-size="13" fill="#1b5e3b">
    ● 與美、日及其他夥伴的聯合演習與戰爭推演、情報共享
  </text>
  <text x="100" y="614" font-size="13" fill="#1b5e3b">
    ● 民防體系：避難所、疏散路線、醫療與糧食儲備、分散指揮中心
  </text>
  <text x="100" y="636" font-size="13" fill="#1b5e3b">
    ● 危機時期的資訊發布機制：透明、頻繁，減少謠言真空
  </text>
  <text x="100" y="658" font-size="13" fill="#1b5e3b">
    ● 讓國防與安全成為可理性辯論的公共議題，而非單純動員工具
  </text>

  <!-- 政治：英雄 -->
  <text x="80" y="688" font-size="16" fill="#1b5e3b">
    ③ 在中間行走的「英雄角色」
  </text>
  <text x="100" y="713" font-size="13" fill="#1b5e3b">
    ● 行政與國防決策者：願意面對不受歡迎的現實與長期風險
  </text>
  <text x="100" y="735" font-size="13" fill="#1b5e3b">
    ● 朝野政黨：可激烈辯論，但在國家安全底線上有基本共識
  </text>
  <text x="100" y="757" font-size="13" fill="#1b5e3b">
    ● 專家與媒體：將複雜情勢翻譯給大眾，避免煽動式恐慌或幻覺
  </text>
  <text x="100" y="779" font-size="13" fill="#1b5e3b">
    ● 外交與軍事專業人員：在國際場域中穩定傳遞台灣的訊號
  </text>

  <!-- 右：人民層面 -->
  <rect x="820" y="320" width="520" height="500" rx="20" ry="20" fill="#eef4ff" stroke="#4a68b3" stroke-width="2"/>
  <text x="1080" y="350" text-anchor="middle" font-size="20" fill="#23408f">
    人民層面：社會／社區／家庭／個人
  </text>

  <!-- 人民：混沌 -->
  <text x="840" y="380" font-size="16" fill="#23408f">
    ① 需要面對的「混沌」
  </text>
  <text x="860" y="405" font-size="13" fill="#23408f">
    ● 斷電、斷網、封鎖下，日常生活具體會變成什麼樣？
  </text>
  <text x="860" y="427" font-size="13" fill="#23408f">
    ● 家人分散各地時，如何取得訊息與確認安全？
  </text>
  <text x="860" y="449" font-size="13" fill="#23408f">
    ● 工作、學校、貸款、存款在重大危機中怎麼運作？
  </text>
  <text x="860" y="471" font-size="13" fill="#23408f">
    ● 假訊息、心理戰、深偽影片如何影響情緒與社會信任？
  </text>
  <text x="860" y="493" font-size="13" fill="#23408f">
    ● 政治立場、族群、世代之間的緊張是否會轉為內鬥？
  </text>

  <!-- 人民：秩序／行動 -->
  <text x="840" y="523" font-size="16" fill="#23408f">
    ② 可轉成「秩序」的具體行動
  </text>
  <text x="860" y="548" font-size="13" fill="#23408f">
    ● 建立心理與資訊韌性：準備 ≠ 一定會打仗，不亂傳未證實訊息
  </text>
  <text x="860" y="570" font-size="13" fill="#23408f">
    ● 學習基本的媒體識讀：查來源、看多方、警覺情緒被刻意挑動
  </text>
  <text x="860" y="592" font-size="13" fill="#23408f">
    ● 家庭準備：緊急聯絡方式、簡單備糧與飲水、常用藥物與文件備份
  </text>
  <text x="860" y="614" font-size="13" fill="#23408f">
    ● 社區準備：確認社區中可互助的資源（醫護、里長、設備）
  </text>
  <text x="860" y="636" font-size="13" fill="#23408f">
    ● 維持日常：照常工作、學習與創作，讓生活與制度盡可能持續
  </text>
  <text x="860" y="658" font-size="13" fill="#23408f">
    ● 公民參與：理性討論國防與政策，依自己價值選擇支持的路線
  </text>

  <!-- 人民：英雄 -->
  <text x="840" y="688" font-size="16" fill="#23408f">
    ③ 在中間行走的「英雄角色」
  </text>
  <text x="860" y="713" font-size="13" fill="#23408f">
    ● 一般公民：不否認風險，也不被恐懼完全控制，做得到的準備就去做
  </text>
  <text x="860" y="735" font-size="13" fill="#23408f">
    ● 家庭照顧者、老師、社工：在壓力中幫助他人穩定情緒與行為
  </text>
  <text x="860" y="757" font-size="13" fill="#23408f">
    ● 線上社群參與者：當真相的過濾器，而不是恐慌的擴音器
  </text>
  <text x="860" y="779" font-size="13" fill="#23408f">
    ● 志工與民防參與者：在不冒不必要風險的前提下，支援社會運作
  </text>

  <!-- 連結箭頭：龍 → 共同目標 → 兩個層面 -->
  <line x1="700" y1="260" x2="700" y2="270" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="390" x2="580" y2="390" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="390" x2="820" y2="390" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="255" font-size="12" fill="#555555">
    把不確定性說清楚
  </text>
  <text x="540" y="382" font-size="12" fill="#555555" text-anchor="end">
    轉成政策與制度
  </text>
  <text x="860" y="382" font-size="12" fill="#555555">
    轉成社會與個人準備
  </text>
</svg>