<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#666666" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff" />

  <!-- 大圓：人的經驗世界 -->
  <circle cx="600" cy="400" r="320" fill="none" stroke="#dddddd" stroke-width="2" />
  <text x="600" y="75" text-anchor="middle" font-size="18" fill="#555555">
    人的經驗世界（World of Experience）
  </text>

  <!-- 中央：意義 -->
  <circle cx="600" cy="400" r="90" fill="#fdf7e3" stroke="#b38b00" stroke-width="2" />
  <text x="600" y="388" text-anchor="middle" font-size="28" fill="#b38b00">
    意義
  </text>
  <text x="600" y="418" text-anchor="middle" font-size="14" fill="#8a6d00">
    行動的含意：在秩序與混沌交界，
  </text>
  <text x="600" y="438" text-anchor="middle" font-size="14" fill="#8a6d00">
    自願面對未知時產生的狀態
  </text>

  <!-- 上方：認知者／英雄 -->
  <rect x="340" y="110" width="520" height="170" rx="18" ry="18" fill="#eef4ff" stroke="#4a68b3" stroke-width="2" />
  <text x="600" y="145" text-anchor="middle" font-size="22" fill="#23408f">
    認知者／英雄／Logos
  </text>

  <text x="360" y="178" font-size="14" fill="#23408f">
    ● 站在秩序與混沌邊界的「我」：有意識、能選擇、能承擔責任
  </text>
  <text x="360" y="200" font-size="14" fill="#23408f">
    ● 任務：偵測「現狀（what is）」與「應然（what should be）」的落差
  </text>
  <text x="360" y="222" font-size="14" fill="#23408f">
    ● 自願踏入未知 → 面對恐懼與不確定 → 帶回新知重建秩序
  </text>
  <text x="360" y="244" font-size="14" fill="#23408f">
    ● 英雄模式：誠實、勇氣、承擔；反面是暴君（只要秩序）或虛無（只要混沌）
  </text>

  <!-- 左下：已知／秩序 -->
  <rect x="70" y="420" width="420" height="290" rx="18" ry="18" fill="#e9f7f0" stroke="#2f8f5b" stroke-width="2" />
  <text x="280" y="452" text-anchor="middle" font-size="20" fill="#1b5e3b">
    已知領域：秩序（Order／Known）
  </text>

  <text x="90" y="482" font-size="14" fill="#1b5e3b">
    ● 文化、傳統、制度、法律、日常習慣、角色與身分
  </text>
  <text x="90" y="504" font-size="14" fill="#1b5e3b">
    ● 偉大父親（Great Father）原型：
  </text>
  <text x="110" y="526" font-size="14" fill="#1b5e3b">
    ▶ 正面：保護、穩定、提供結構與規則
  </text>
  <text x="110" y="548" font-size="14" fill="#1b5e3b">
    ▶ 負面：僵化、官僚、壓制、暴君式控制
  </text>
  <text x="90" y="578" font-size="14" fill="#1b5e3b">
    ● 心理狀態：
  </text>
  <text x="110" y="600" font-size="14" fill="#1b5e3b">
    ▶ 正面：安全感、可預測、清楚知道「該怎麼做」
  </text>
  <text x="110" y="622" font-size="14" fill="#1b5e3b">
    ▶ 過度秩序：無聊、失去活力、壓抑、走向法西斯與集體僵化
  </text>
  <text x="90" y="652" font-size="14" fill="#1b5e3b">
    ● 目標：讓秩序「可修正」，而不是鎖死成絕對正確的地圖
  </text>

  <!-- 右下：未知／混沌 -->
  <rect x="710" y="420" width="420" height="290" rx="18" ry="18" fill="#fdeff2" stroke="#c2185b" stroke-width="2" />
  <text x="920" y="452" text-anchor="middle" font-size="20" fill="#880e4f">
    未知領域：混沌（Chaos／Unknown）
  </text>

  <text x="730" y="482" font-size="14" fill="#880e4f">
    ● 未探索的世界：新關係、新觀念、新技術、危機與災難
  </text>
  <text x="730" y="504" font-size="14" fill="#880e4f">
    ● 偉大而可怕的母親（Great &amp; Terrible Mother）原型：
  </text>
  <text x="750" y="526" font-size="14" fill="#880e4f">
    ▶ 正面：滋養、創造力、重生、機會、成長的來源
  </text>
  <text x="750" y="548" font-size="14" fill="#880e4f">
    ▶ 負面：吞噬、迷失、無邊界的混亂、人格解體
  </text>
  <text x="730" y="578" font-size="14" fill="#880e4f">
    ● 心理狀態：
  </text>
  <text x="750" y="600" font-size="14" fill="#880e4f">
    ▶ 正面：好奇、驚奇、靈感、創造
  </text>
  <text x="750" y="622" font-size="14" fill="#880e4f">
    ▶ 過度混沌：恐慌、憂鬱、成癮、自我毀滅
  </text>
  <text x="730" y="652" font-size="14" fill="#880e4f">
    ● 不是要消滅混沌，而是學會與未知對話、把其中的養分帶回秩序
  </text>

  <!-- 連結到中央「意義」的箭頭 -->
  <line x1="600" y1="280" x2="600" y2="310" stroke="#666666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="420" y1="420" x2="500" y2="380" stroke="#666666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="780" y1="420" x2="700" y2="380" stroke="#666666" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 底部：三個關鍵問句 -->
  <rect x="300" y="700" width="600" height="70" rx="12" ry="12" fill="#f5f5f5" stroke="#999999" stroke-width="1" />
  <text x="600" y="726" text-anchor="middle" font-size="15" fill="#444444">
    三個關鍵問句：地圖如何形成？
  </text>
  <text x="320" y="750" font-size="13" fill="#444444">
    1. 現在「是什麼」（what is）？   2. 應該「變成什麼」（what should be）？
  </text>
  <text x="320" y="770" font-size="13" fill="#444444">
    3. 我要「怎麼做」才能從現在走到那裡（how to get from one to the other）？
  </text>

</svg>