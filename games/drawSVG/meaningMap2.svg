<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#555555" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="700" y="60" text-anchor="middle" font-size="26" fill="#222222">
    神話式的經驗世界（The Mythological World of Experience）
  </text>
  <text x="700" y="90" text-anchor="middle" font-size="16" fill="#666666">
    由四個基本元素構成：未知、已知、認知者，以及先於三者的原初混沌
  </text>

  <!-- 外圈：原初混沌之龍 -->
  <circle cx="700" cy="460" r="360" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="700" y="130" text-anchor="middle" font-size="18" fill="#555555">
    原初混沌（Primordial Chaos）
  </text>
  <text x="700" y="152" text-anchor="middle" font-size="14" fill="#555555">
    「萬物之源」──先於已知、未知與認知者的一切可能性
  </text>

  <!-- 上方：原初混沌之龍（烏洛波洛斯） -->
  <rect x="460" y="160" width="480" height="110" rx="16" ry="16" fill="#f5eefb" stroke="#7b3f98" stroke-width="2"/>
  <text x="700" y="188" text-anchor="middle" font-size="18" fill="#5a2879">
    原初混沌之龍（Dragon of Primordial Chaos）
  </text>
  <text x="700" y="210" text-anchor="middle" font-size="14" fill="#5a2879">
    烏洛波洛斯：自我吞噬的龍，象徵「全部尚未分化的可能性」
  </text>
  <text x="700" y="232" text-anchor="middle" font-size="14" fill="#5a2879">
    從此分化出：未知（Great Mother）、已知（Great Father）、認知者（Exploratory Hero）
  </text>

  <!-- 中央：世界作為行動舞台 -->
  <circle cx="700" cy="460" r="130" fill="#fdf7e3" stroke="#b38b00" stroke-width="2"/>
  <text x="700" y="445" text-anchor="middle" font-size="20" fill="#b38b00">
    世界＝行動的舞台
  </text>
  <text x="700" y="468" text-anchor="middle" font-size="14" fill="#8a6d00">
    （World as Forum for Action）
  </text>
  <text x="700" y="492" text-anchor="middle" font-size="13" fill="#8a6d00">
    一切經驗＝認知者在「已知」與「未知」之間行動的歷程
  </text>

  <!-- 左：未知／偉大母親 -->
  <rect x="110" y="350" width="360" height="240" rx="18" ry="18" fill="#fdeff2" stroke="#c2185b" stroke-width="2"/>
  <text x="290" y="382" text-anchor="middle" font-size="18" fill="#880e4f">
    未知／未探索領域（Unknown）
  </text>
  <text x="290" y="404" text-anchor="middle" font-size="14" fill="#880e4f">
    偉大母親（The Great Mother）
  </text>

  <text x="130" y="434" font-size="13" fill="#880e4f">
    ● 現象面：尚未被分類、理解、掌控的事物與情境
  </text>
  <text x="130" y="456" font-size="13" fill="#880e4f">
    ● 正面：新機會、創造力、潛能、重生的來源
  </text>
  <text x="130" y="478" font-size="13" fill="#880e4f">
    ● 負面：混亂、恐懼、迷失、自我解體、災難
  </text>
  <text x="130" y="508" font-size="13" fill="#880e4f">
    ● 神話角色：黑暗深淵、大地母神、海洋、夢境、冥府
  </text>
  <text x="130" y="538" font-size="13" fill="#880e4f">
    ● 心理狀態：好奇＋焦慮；吸引人又令人畏懼
  </text>

  <!-- 右：已知／偉大父親 -->
  <rect x="930" y="350" width="360" height="240" rx="18" ry="18" fill="#e9f7f0" stroke="#2f8f5b" stroke-width="2"/>
  <text x="1110" y="382" text-anchor="middle" font-size="18" fill="#1b5e3b">
    已知／已探索領域（Known）
  </text>
  <text x="1110" y="404" text-anchor="middle" font-size="14" fill="#1b5e3b">
    偉大父親（The Great Father）
  </text>

  <text x="950" y="434" font-size="13" fill="#1b5e3b">
    ● 現象面：文化、傳統、制度、語言、角色與規則
  </text>
  <text x="950" y="456" font-size="13" fill="#1b5e3b">
    ● 正面：秩序、安全、穩定、可預測性、知識的累積
  </text>
  <text x="950" y="478" font-size="13" fill="#1b5e3b">
    ● 負面：僵化、官僚、壓抑、暴君式控制、思想窒息
  </text>
  <text x="950" y="508" font-size="13" fill="#1b5e3b">
    ● 神話角色：天空之父、國王、律法頒佈者、老祖宗
  </text>
  <text x="950" y="538" font-size="13" fill="#1b5e3b">
    ● 心理狀態：安全＋束縛；提供框架也可能扼殺更新
  </text>

  <!-- 下方：認知者／探索英雄 -->
  <rect x="440" y="620" width="520" height="190" rx="18" ry="18" fill="#eef4ff" stroke="#4a68b3" stroke-width="2"/>
  <text x="700" y="652" text-anchor="middle" font-size="18" fill="#23408f">
    認知者／探索英雄（Knower / Exploratory Hero）
  </text>
  <text x="700" y="674" text-anchor="middle" font-size="14" fill="#23408f">
    在已知與未知之間「踐行的意識」，也是神話中的英雄原型
  </text>

  <text x="460" y="704" font-size="13" fill="#23408f">
    ● 任務：辨識現狀（Point A）與理想未來（Point B）的落差，設計行動路徑
  </text>
  <text x="460" y="726" font-size="13" fill="#23408f">
    ● 正面模式：自願面對未知、誠實、勇敢、願意修正自己與文化
  </text>
  <text x="460" y="748" font-size="13" fill="#23408f">
    ● 失衡一：過度認同已知 → 法西斯／暴君，企圖消滅所有未知
  </text>
  <text x="460" y="770" font-size="13" fill="#23408f">
    ● 失衡二：沉溺未知 → 虛無主義、頹廢、拒絕責任、玩世不恭
  </text>

  <!-- 箭頭：原初混沌 → 三元素 -->
  <line x1="700" y1="270" x2="520" y2="360" stroke="#777777" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="700" y1="270" x2="880" y2="360" stroke="#777777" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="700" y1="270" x2="700" y2="600" stroke="#777777" stroke-width="1.8" marker-end="url(#arrow)" />

  <text x="610" y="320" font-size="12" fill="#555555">
    混沌分化出「未知」
  </text>
  <text x="790" y="320" font-size="12" fill="#555555">
    混沌分化出「已知」
  </text>
  <text x="720" y="330" font-size="12" fill="#555555">
    並喚醒「認知者」
  </text>

  <!-- 箭頭：未知／已知／認知者 → 世界作為行動舞台 -->
  <line x1="470" y1="460" x2="560" y2="460" stroke="#777777" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="930" y1="460" x2="840" y2="460" stroke="#777777" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="700" y1="620" x2="700" y2="560" stroke="#777777" stroke-width="1.8" marker-end="url(#arrow)" />

  <text x="515" y="447" font-size="12" fill="#555555" text-anchor="middle">
    未知滲入經驗
  </text>
  <text x="885" y="447" font-size="12" fill="#555555" text-anchor="middle">
    已知規範經驗
  </text>
  <text x="720" y="585" font-size="12" fill="#555555">
    認知者在其中行動
  </text>

  <!-- 下方小框：四個基本元素提要 -->
  <rect x="120" y="810" width="1160" height="70" rx="12" ry="12" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1"/>
  <text x="140" y="835" font-size="13" fill="#333333">
    ● 基本結構：
  </text>
  <text x="260" y="835" font-size="13" fill="#333333">
    1) 未知（未知領域／偉大母親）
  </text>
  <text x="530" y="835" font-size="13" fill="#333333">
    2) 已知（已知領域／偉大父親）
  </text>
  <text x="800" y="835" font-size="13" fill="#333333">
    3) 認知者（探索英雄）
  </text>
  <text x="260" y="857" font-size="13" fill="#333333">
    4) 原初混沌（原初之龍／烏洛波洛斯）──先於並生成上述三者
  </text>
  <text x="800" y="857" font-size="13" fill="#333333">
    神話只是把這四者具象成人物與故事，用來指引人類如何行動。
  </text>
</svg>