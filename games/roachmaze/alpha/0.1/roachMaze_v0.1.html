# roachMaze

自由編排由 T 字型、一字型與空白方塊組成的迷宮。支援滑鼠與手機、平板單指操作。

## 編排
- 點一下 T 字型或一字型方塊：順時針旋轉 90 度；空白方塊不旋轉。
- 按住拖曳：放到另一個方塊上會交換位置；放到空格則移入該格。
- 拖出主舞台：放入外側暫存區。暫存方塊會緩慢漂移、旋轉，遇到舞台或可用視窗邊界會反彈。
- 從暫存區拖入已有方塊的格子：原方塊會移到暫存區；放到空格則直接填入。
- 拖曳時以方塊中心決定落點，亮框表示將要放入的格子。放開後會整齊對位。
- 鍵盤操作：Tab 選擇方塊，Enter 或空白鍵旋轉。按 M 選取要移動的方塊，以方向鍵選擇格子、Enter 放入；Escape 取消。按 Delete 將選定方塊移到暫存區。

## 按鈕
- **⋯ 更多**：開啟功能選單。
- **鉛筆**：編輯格子數與三種方塊的數量。可按加減或直接輸入數量。
- **？ 說明**：開啟本說明。點視窗外側、叉號或按 Escape 即可關閉。
- **環形箭頭**：確認後清除本工具的儲存資料，恢復 4 × 4 預設並重新隨機排列。
- 畫面下方的方格圖示顯示已放入數量／舞台容量；散放圖示顯示暫存數量。

## 格子與數量
- 4 × 4：T 字型 8 個、一字型 7 個、空白 1 個。
- 5 × 5：T 字型 13 個、一字型 11 個、空白 1 個。25 格的一半無法取整數，T 字型取上整數，一字型填滿其餘非空白格。
- 6 × 6：T 字型 18 個、一字型 17 個、空白 1 個。
- 切換格子數時回到該尺寸的預設數量，盡可能保留原有方塊的位置與方向，補入的方塊填滿空格。
- 手動增加的方塊一律加入暫存區，不會自動填入舞台。
- 減少同類型方塊時，先刪除暫存區中最後放入者；暫存區不足才刪除舞台中最後放入者。
- 每種類型可設定 0 至 999 個。大量暫存方塊可能彼此重疊；可降低數量以方便操作。

## 尺寸
每個方塊以 24 × 24 mm 設計，舞台最外框厚 3 mm，T 型與一字型隔板寬 3 mm，畫面等比例縮放。舞台總外徑為 102、126 或 150 mm 的設計比例；螢幕上不保證實際公釐尺寸。

方塊之間的細線只是對位提示，不代表額外隔板；T 型有三個半臂，一字型有兩個相對半臂，空白型沒有中央隔板。空白方塊上的小圓點只是操作辨識標記，並非實體孔洞。

## 自動記憶
每次操作會自動儲存在目前瀏覽器的 localStorage，重新整理會保留格子、數量、位置與方位。只有首次使用、沒有有效紀錄，或確認重置時才會重新隨機建立。

不同裝置、瀏覽器或網站網址不會共用資料。無痕模式、清除網站資料或瀏覽器禁止儲存，可能使紀錄無法保留；儲存失敗時畫面會提示。直接開啟 HTML 時，記憶功能依瀏覽器對本機檔案的支援而定，固定放在同一網站網址使用較穩定。

## 說明檔
本頁優先讀取同資料夾的 `readme.md`，並呈現 Markdown 標題、清單、表格等格式。若直接開啟本機檔案、沒有說明檔或讀取失敗，會顯示這份內嵌說明，不影響編排功能。

function hideTarget(){target.style.display='none'}
function point(e){const r=arena.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function cancelDrag(){if(!drag)return;const d=drag;drag=null;d.el.classList.remove('dragging');try{if(d.el.hasPointerCapture(d.pointer))d.el.releasePointerCapture(d.pointer)}catch(e){}position(d.tile);hideTarget()}
arena.addEventListener('pointerdown',e=>{if(modal||drag||e.button!==0||!e.isPrimary)return;const el=e.target.closest('.tile');if(!el)return;keyboard=null;const t=tileById(el.dataset.id),p=point(e),c=center(t);drag={tile:t,el,pointer:e.pointerId,start:p,p:c,dx:c.x-p.x,dy:c.y-p.y,active:false};el.setPointerCapture(e.pointerId);e.preventDefault();el.focus({preventScroll:true})});
arena.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;const p=point(e),d=drag;if(!d.active&&Math.hypot(p.x-d.start.x,p.y-d.start.y)<7)return;d.active=true;d.el.classList.add('dragging');d.p={x:p.x+d.dx,y:p.y+d.dy};d.el.style.transform='translate3d('+(d.p.x-layout.unit/2)+'px,'+(d.p.y-layout.unit/2)+'px,0)';showTarget(cellAt(d.p.x,d.p.y));e.preventDefault()});
arena.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointer)return;const d=drag;drag=null;d.el.classList.remove('dragging');if(d.el.hasPointerCapture(e.pointerId))d.el.releasePointerCapture(e.pointerId);hideTarget();if(d.active)drop(d.tile,cellAt(d.p.x,d.p.y),d.p);else rotate(d.tile);position(d.tile)});
arena.addEventListener('pointercancel',cancelDrag);arena.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.pointer)cancelDrag()});
arena.addEventListener('click',e=>{if(e.detail===0&&!modal){const el=e.target.closest('.tile');if(el)rotate(tileById(el.dataset.id))}});
arena.addEventListener('keydown',e=>{const el=e.target.closest('.tile');if(!el||modal)return;const t=tileById(el.dataset.id);if(e.key.toLowerCase()==='m'){e.preventDefault();keyboard={tile:t,cell:t.cell??0};showTarget(keyboard.cell);toast('方向鍵選擇格子，Enter 放入，Escape 取消。')}else if(keyboard){if(e.key==='Escape'){keyboard=null;hideTarget()}else if(e.key==='Enter'){e.preventDefault();const k=keyboard;keyboard=null;drop(k.tile,k.cell,center(k.tile));hideTarget()}else if(e.key.startsWith('Arrow')){e.preventDefault();let row=Math.floor(keyboard.cell/state.n),col=keyboard.cell%state.n;if(e.key==='ArrowUp')row--;if(e.key==='ArrowDown')row++;if(e.key==='ArrowLeft')col--;if(e.key==='ArrowRight')col++;keyboard.cell=Math.max(0,Math.min(state.n-1,row))*state.n+Math.max(0,Math.min(state.n-1,col));showTarget(keyboard.cell)}}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();drop(t,null,center(t))}});
function changeCount(type,count){count=Math.max(0,Math.min(999,Math.round(Number(count)||0)));const items=state.tiles.filter(t=>t.type===type);if(count>items.length){for(let i=items.length;i<count;i++){const t=makeTile(type);state.tiles.push(t);bounded(t,false)}}else if(count<items.length){items.sort((a,b)=>(a.cell===null?0:1)-(b.cell===null?0:1)||b.stamp-a.stamp);const removed=new Set(items.slice(0,items.length-count).map(t=>t.id));state.tiles=state.tiles.filter(t=>!removed.has(t.id))}render();save();syncCounts();}
function changeSize(n){if(n===state.n)return;const oldN=state.n;state.n=n;for(const t of state.tiles){if(t.cell===null)continue;const row=Math.floor(t.cell/oldN),col=t.cell%oldN;if(row<n&&col<n)t.cell=row*n+col;else {t.cell=null;t.stamp=++state.clock}}const counts=defaults(n);for(const type of ['T','I','O']){const items=state.tiles.filter(t=>t.type===type).sort((a,b)=>(a.cell===null?0:1)-(b.cell===null?0:1)||b.stamp-a.stamp);if(items.length>counts[type]){const remove=new Set(items.slice(0,items.length-counts[type]).map(t=>t.id));state.tiles=state.tiles.filter(t=>!remove.has(t.id))}else for(let i=items.length;i<counts[type];i++)state.tiles.push(makeTile(type))}const waiting=state.tiles.filter(t=>t.cell===null);for(let c=0;c<n*n;c++)if(!occupant(c)&&waiting.length){const t=waiting.shift();t.cell=c;t.angle=0;t.stamp=++state.clock}render();save();syncCounts();}
function syncCounts(){for(const type of ['T','I','O']){const count=state.tiles.filter(t=>t.type===type).length;const input=$('count-'+type);if(input)input.value=count;const minus=$('minus-'+type),plus=$('plus-'+type);if(minus)minus.disabled=count===0;if(plus)plus.disabled=count===999}document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.size===state.n)))}
function close(){modal=null;$('overlay').hidden=true;lastFocus?.focus({preventScroll:true})}
function open(mode){cancelDrag();keyboard=null;hideTarget();if(!modal)lastFocus=document.activeElement;modal=mode;$('overlay').hidden=false;$('panel').className='panel'+(mode==='help'?' help-panel':'');const content=$('dialog-body');if(mode==='menu'){$('dialog-title').textContent='更多';content.innerHTML='<div class="menu-items"><button class="icon-btn" data-open="edit" title="編輯" aria-label="編輯">'+svgIcon('edit')+'</button><button class="icon-btn" data-open="help" title="說明" aria-label="說明">'+svgIcon('help')+'</button><button class="icon-btn" data-open="reset" title="重置" aria-label="重置">'+svgIcon('reset')+'</button></div>';}else if(mode==='edit'){$('dialog-title').textContent='編排設定';content.innerHTML='<fieldset><legend>主舞台</legend><div class="grid-options">'+[4,5,6].map(n=>'<button data-size="'+n+'" aria-pressed="'+(state.n===n)+'">'+n+' × '+n+'</button>').join('')+'</div></fieldset><fieldset><legend>方塊數量</legend>'+['T','I','O'].map(type=>'<div class="counter"><label class="counter-label" for="count-'+type+'">'+tileSVG(type)+'<span>'+names[type]+'</span></label><div class="stepper"><button id="minus-'+type+'" class="icon-btn" data-type="'+type+'" data-delta="-1" aria-label="減少'+names[type]+'">'+svgIcon('minus')+'</button><input id="count-'+type+'" data-count="'+type+'" type="number" inputmode="numeric" min="0" max="999" step="1" aria-label="'+names[type]+'數量"><button id="plus-'+type+'" class="icon-btn" data-type="'+type+'" data-delta="1" aria-label="增加'+names[type]+'">'+svgIcon('plus')+'</button></div></div>').join('')+'</fieldset><p class="note">新增 → 暫存區<br>減少 → 先暫存，再舞台；後放先移除。</p>';syncCounts();}else if(mode==='help'){$('dialog-title').textContent='使用說明';content.innerHTML='<article id="help-body"></article>';$('help-body').innerHTML=markdown($('readme').textContent);loadHelp();}else{$('dialog-title').textContent='重新開始？';content.innerHTML='<p class="note">清除目前的編排與暫存方塊，回到隨機的 4 × 4 預設。</p><div class="confirm-actions"><button data-cancel>取消</button><button data-reset>重置</button></div>';} $('close').focus({preventScroll:true});}
$('more').onclick=()=>open('menu');$('close').onclick=close;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});
$('dialog-body').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.open)open(btn.dataset.open);if(btn.dataset.size)changeSize(+btn.dataset.size);if(btn.dataset.delta){const type=btn.dataset.type;changeCount(type,state.tiles.filter(t=>t.type===type).length+Number(btn.dataset.delta))}if(btn.hasAttribute('data-cancel'))close();if(btn.hasAttribute('data-reset')){try{localStorage.removeItem(KEY)}catch(e){}fresh();render();save();close();toast('已重置')}});
$('dialog-body').addEventListener('change',e=>{if(e.target.dataset.count)changeCount(e.target.dataset.count,e.target.value)});
document.addEventListener('keydown',e=>{if(!modal){if(e.key==='Escape')cancelDrag();return}if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const focusable=[...$('panel').querySelectorAll('button:not(:disabled),input,a[href]')],first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return escape(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');}
function markdown(src){const lines=src.replace(/\r/g,'').split('\n');let out='',list=null,code=false,buf=[];const closeList=()=>{if(list){out+='</'+list+'>';list=null}};for(let i=0;i<lines.length;i++){const line=lines[i];if(line.startsWith('```')){closeList();if(code){out+='<pre><code>'+escape(buf.join('\n'))+'</code></pre>';buf=[]}code=!code;continue}if(code){buf.push(line);continue}const head=line.match(/^(#{1,6})\s+(.+)$/),li=line.match(/^\s*(?:([-*+])|\d+\.)\s+(.+)$/);if(head){closeList();out+='<h'+head[1].length+'>'+inline(head[2])+'</h'+head[1].length+'>'}else if(li){const tag=li[1]?'ul':'ol';if(list!==tag){closeList();out+='<'+tag+'>';list=tag}out+='<li>'+inline(li[2])+'</li>'}else if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){closeList();const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|');out+='<table><thead><tr>'+cells(line).map(c=>'<th>'+inline(c.trim())+'</th>').join('')+'</tr></thead><tbody>';i++;while(i+1<lines.length&&lines[i+1].includes('|'))out+='<tr>'+cells(lines[++i]).map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';out+='</tbody></table>'}else{closeList();if(/^>\s?/.test(line))out+='<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>';else if(line.trim())out+='<p>'+inline(line)+'</p>'}}closeList();if(code)out+='<pre><code>'+escape(buf.join('\n'))+'</code></pre>';return out;}
async function loadHelp(){if(!/^https?:$/.test(location.protocol))return;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2500);try{const response=await fetch(new URL('readme.md',location.href),{signal:controller.signal,cache:'no-cache'});if(!response.ok)throw Error();const text=await response.text();if(text.length>200000||/^\s*<!doctype|^\s*<html/i.test(text))throw Error();if(modal==='help'&&$('help-body'))$('help-body').innerHTML=markdown(text)}catch(e){}finally{clearTimeout(timer)}}
let previous=0,lastSaved=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function frame(time){const dt=Math.min((time-previous)/1000,.05);previous=time;if(layout&&!modal&&!document.hidden){for(const t of state.tiles){if(t.cell!==null||drag?.tile===t||keyboard?.tile===t)continue;const slow=reduced.matches?.25:1;t.x+=t.vx*dt*slow/layout.w;t.y+=t.vy*dt*slow/layout.h;t.angle=(t.angle+t.spin*dt*slow)%360;bounded(t);position(t)}if(time-lastSaved>5000&&state.tiles.some(t=>t.cell===null)){save();lastSaved=time}}requestAnimationFrame(frame)}
new ResizeObserver(resize).observe(arena);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelDrag();save()}previous=performance.now()});window.addEventListener('pagehide',save);window.addEventListener('blur',cancelDrag);
render();save();requestAnimationFrame(frame);
})();
</script>
