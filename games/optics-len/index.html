<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>近視與矯正成像互動模擬 v0.11</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background: #0b1020;
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 8px 10px;
      background: #141a33;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      margin: 0 10px 0 0;
      white-space: nowrap;
    }
    .mode-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .mode-btn {
      border: 1px solid #3a4b7a;
      background: #1c2547;
      color: #f5f5f5;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: #3f7cff;
      border-color: #5c8dff;
      box-shadow: 0 0 0 1px rgba(92,141,255,0.8);
    }
    .mode-btn:active {
      transform: scale(0.97);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-left: auto;
    }
    .control-group {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #c8d0f0;
    }
    .control-group label {
      white-space: nowrap;
    }
    .control-group input[type="range"] {
      width: 130px;
    }
    main {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    #viewportWrapper {
      position: absolute;
      inset: 0;
      touch-action: none; /* Pointer Events 處理拖曳與縮放 */
    }
    svg {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 10%, #182544 0, #060919 60%, #02020a 100%);
    }
    .info-panel {
      position: absolute;
      right: 8px;
      bottom: 8px;
      max-width: 260px;
      background: rgba(10,14,30,0.92);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.5;
      border: 1px solid rgba(120,150,255,0.4);
      backdrop-filter: blur(8px);
    }
    .info-panel h2 {
      font-size: 12px;
      margin: 0 0 4px 0;
      color: #9fb5ff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid rgba(159,181,255,0.6);
      font-size: 10px;
      margin-bottom: 4px;
    }
    .ray {
      stroke: #ffd86b;
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
      opacity: 0.9;
    }
    .ray.soft {
      opacity: 0.35;
      stroke-dasharray: 3 3;
    }
    .object-arrow {
      fill: #ff7a7a;
      stroke: #ffe1e1;
      stroke-width: 1;
    }
    .eye-outline {
      fill: #0b1020;
      stroke: #4c5c9b;
      stroke-width: 1.2;
    }
    .retina {
      stroke: #ff7ab8;
      stroke-width: 2.4;
      fill: none;
      filter: drop-shadow(0 0 4px rgba(255,122,184,0.7));
    }
    .lens-normal {
      fill: url(#lensGradient);
      stroke: #9ed4ff;
      stroke-width: 1;
    }
    .lens-myopic {
      fill: url(#lensGradientMyopic);
      stroke: #9ed4ff;
      stroke-width: 1;
    }
    .lens-glasses {
      fill: url(#lensGradientGlasses);
      stroke: #a0ffe6;
      stroke-width: 1;
    }
    .image-indicator {
      stroke-width: 2;
      stroke: #7fffd4;
      stroke-dasharray: 4 2;
    }
    .blur-indicator {
      stroke-width: 2;
      stroke: #ff4e6a;
      stroke-dasharray: 4 2;
      opacity: 0.85;
    }
    .ui-hint {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 2px;
    }
    @media (max-width: 600px) {
      header {
        align-items: flex-start;
      }
      .controls {
        width: 100%;
        margin-left: 0;
        justify-content: flex-start;
      }
      .control-group input[type="range"] {
        width: 110px;
      }
      .info-panel {
        max-width: 70%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>近視與矯正成像模擬 v0.11</h1>
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="1">頁面一：正常眼</button>
      <button class="mode-btn" data-mode="2">頁面二：近視眼</button>
      <button class="mode-btn" data-mode="3">頁面三：近視＋凹透鏡</button>
    </div>
    <div class="controls">
      <div class="control-group">
        <label for="objectSlider">物體距離</label>
        <input id="objectSlider" type="range" min="40" max="260" value="160" />
        <span id="objectValue">中等</span>
      </div>
      <div class="control-group" id="glassesGroup" style="display:none;">
        <label for="glassesSlider">近視眼鏡度數(模擬)</label>
        <input id="glassesSlider" type="range" min="2" max="8" value="4" />
        <span id="glassesValue">-4D</span>
      </div>
    </div>
  </header>
  <main>
    <div id="viewportWrapper">
      <svg id="mainSvg" viewBox="0 0 900 420">
        <defs>
          <linearGradient id="lensGradient" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="#6fdcff" />
            <stop offset="50%" stop-color="#b9f2ff" />
            <stop offset="100%" stop-color="#6fdcff" />
          </linearGradient>
          <linearGradient id="lensGradientMyopic" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="#5bc0ff" />
            <stop offset="50%" stop-color="#c2e4ff" />
            <stop offset="100%" stop-color="#5bc0ff" />
          </linearGradient>
          <linearGradient id="lensGradientGlasses" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="#1e3758" />
            <stop offset="50%" stop-color="#89ffe5" />
            <stop offset="100%" stop-color="#1e3758" />
          </linearGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feColorMatrix in="blur" type="matrix"
              values="0 0 0 0 0.8
                      0 0 0 0 0.95
                      0 0 0 0 1
                      0 0 0 0.6 0" />
          </filter>
        </defs>
        <g id="sceneRoot">
          <rect x="-1000" y="-1000" width="3000" height="3000" fill="transparent"></rect>
          <g id="scene" transform="translate(0,0) scale(1)">
            <!-- 物體 -->
            <g id="objectGroup" transform="translate(160,210)">
              <polygon class="object-arrow" points="0,0 0,-80 -16,-80 8,-120 32,-80 16,-80 16,0"/>
              <text x="0" y="18" fill="#ffb0b0" font-size="12" text-anchor="middle">物體</text>
            </g>

            <!-- 眼球與視網膜 -->
            <g id="eyeGroup" transform="translate(520,210)">
              <!-- 眼球外框 -->
              <ellipse class="eye-outline" cx="0" cy="0" rx="140" ry="95"/>
              <!-- 視網膜 -->
              <path id="retina" class="retina"
                    d="M110,-72 C124,-40 132,0 124,40 C116,72 104,86 96,88" />
              <text x="118" y="-80" fill="#ffb7de" font-size="11">視網膜</text>
              <!-- 水晶體 -->
              <g id="lensGroup">
                <path id="lensShape" class="lens-normal" d="M-10,-60 C10,-40 10,40 -10,60 C-26,40 -26,-40 -10,-60 Z" filter="url(#softGlow)" />
              </g>
              <text x="-24" y="-80" fill="#c5e4ff" font-size="11">水晶體</text>

              <!-- 近視眼鏡凹透鏡 -->
              <g id="glassesGroupSvg" transform="translate(-90,0)" opacity="0">
                <path id="glassesLens" class="lens-glasses"
                      d="M-12,-55 C-30,-30 -30,30 -12,55 C-8,40 -8,-40 -12,-55 Z" />
                <text x="0" y="-66" fill="#a7ffe8" font-size="11" text-anchor="middle">凹透鏡眼鏡</text>
              </g>

              <!-- 成像位置指示 -->
              <line id="imagePlane" class="image-indicator" x1="0" y1="-85" x2="0" y2="85" />
              <line id="blurPlane" class="blur-indicator" x1="0" y1="-85" x2="0" y2="85" opacity="0" />
            </g>

            <!-- 光線 -->
            <g id="raysGroup"></g>
          </g>
        </g>
      </svg>
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="badge">
        <span>👁️</span><span id="modeLabel">正常眼：水晶體自動調整焦距</span>
      </div>
      <h2>操作說明</h2>
      <ul>
        <li>拖曳左側紅色箭頭「物體」前後移動，觀察成像位置變化。</li>
        <li>頁面一：水晶體會依物距改變焦距，讓影像落在視網膜上。</li>
        <li>頁面二：近視眼的水晶體過厚，看遠方時成像落在視網膜前方。</li>
        <li>頁面三：在前方加上凹透鏡眼鏡，調整度數，讓成像重新回到視網膜。</li>
      </ul>
      <div class="ui-hint">電腦：滑鼠滾輪縮放、拖曳畫面平移。手機平板：雙指縮放、單指拖曳。</div>
    </div>
  </main>
  <script>
    // =================== 模式與基本設定 ===================
    const modes = {
      1: "正常眼：水晶體自動調整焦距",
      2: "近視眼：成像落在視網膜前方",
      3: "近視＋凹透鏡：矯正後回到視網膜"
    };
    let currentMode = 1;

    const modeButtons = document.querySelectorAll(".mode-btn");
    const modeLabelSpan = document.getElementById("modeLabel");

    modeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const mode = Number(btn.dataset.mode);
        setMode(mode);
      });
    });

    function setMode(mode) {
      currentMode = mode;
      modeButtons.forEach(b => b.classList.toggle("active", Number(b.dataset.mode) === mode));
      modeLabelSpan.textContent = modes[mode];

      const glassesGroupSvg = document.getElementById("glassesGroupSvg");
      const glassesControlGroup = document.getElementById("glassesGroup");

      if (mode === 3) {
        glassesGroupSvg.setAttribute("opacity", "1");
        glassesControlGroup.style.display = "flex";
        lensShape.classList.remove("lens-normal");
        lensShape.classList.add("lens-myopic");
      } else if (mode === 2) {
        glassesGroupSvg.setAttribute("opacity", "0");
        glassesControlGroup.style.display = "none";
        lensShape.classList.remove("lens-normal");
        lensShape.classList.add("lens-myopic");
      } else {
        glassesGroupSvg.setAttribute("opacity", "0");
        glassesControlGroup.style.display = "none";
        lensShape.classList.remove("lens-myopic");
        lensShape.classList.add("lens-normal");
      }
      updateScene();
    }

    // =================== 場景元素 ===================
    const objectSlider = document.getElementById("objectSlider");
    const objectValueSpan = document.getElementById("objectValue");
    const glassesSlider = document.getElementById("glassesSlider");
    const glassesValueSpan = document.getElementById("glassesValue");

    const objectGroup = document.getElementById("objectGroup");
    const lensShape = document.getElementById("lensShape");
    const imagePlane = document.getElementById("imagePlane");
    const blurPlane = document.getElementById("blurPlane");
    const raysGroup = document.getElementById("raysGroup");

    // 座標設定
    const lensX = 520; // 水晶體中心在整個 SVG 中的 x
    const eyeCenterY = 210;
    const retinaX = lensX + 110; // 視網膜位置（近似）
    const glassesX = lensX - 90; // 眼鏡凹透鏡位置

    // 模擬焦距（單位：SVG 座標）
    const normalEyeDi = retinaX - lensX; // 視網膜到水晶體距離
    const myopicF = normalEyeDi * 0.7;   // 近視眼固定較短焦距

    // 更新文字顯示
    function updateObjectLabel(value) {
      const val = Number(value);
      if (val < 80) objectValueSpan.textContent = "很近";
      else if (val < 140) objectValueSpan.textContent = "中等";
      else if (val < 220) objectValueSpan.textContent = "偏遠";
      else objectValueSpan.textContent = "很遠";
    }

    function updateGlassesLabel(value) {
      glassesValueSpan.textContent = "-" + value + "D";
    }

    objectSlider.addEventListener("input", () => {
      updateObjectLabel(objectSlider.value);
      updateScene();
    });
    glassesSlider.addEventListener("input", () => {
      updateGlassesLabel(glassesSlider.value);
      updateScene();
    });

    updateObjectLabel(objectSlider.value);
    updateGlassesLabel(glassesSlider.value);

    // 建立光線（多段直線），points = [{x,y}, ...]
    function createRay(points, cls) {
      if (!points || points.length < 2) return;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      let d = "M " + points[0].x + " " + points[0].y;
      for (let i = 1; i < points.length; i++) {
        d += " L " + points[i].x + " " + points[i].y;
      }
      path.setAttribute("d", d);
      path.setAttribute("class", cls);
      raysGroup.appendChild(path);
    }

    // =================== 成像計算與繪製 ===================
    function updateScene() {
      const objX = Number(objectSlider.value); // 左側物體 x
      const objY = eyeCenterY;
      objectGroup.setAttribute("transform", `translate(${objX},${objY})`);

      // 清空舊光線
      while (raysGroup.firstChild) raysGroup.removeChild(raysGroup.firstChild);

      // 物體頂端位置（用來畫一支代表性主光線）
      const objTopY = objY - 80;

      if (currentMode === 1) {
        // -------- 模式一：正常眼，水晶體自動改變焦距 --------
        const doEye = lensX - objX; // 物距（>0）
        const diEye = normalEyeDi;  // 成像固定在視網膜上
        const fEye = 1 / (1 / doEye + 1 / diEye); // 自動調整焦距（只用於說理）

        // 成像位置與大小：在視網膜上
        const imageX = retinaX;
        const m = -diEye / doEye;
        const imageTopY = eyeCenterY - m * 80;

        // 調整水晶體曲率：近時變厚，遠時變薄（示意）
        const t = Math.max(0, Math.min(1, (doEye - 40) / 220));
        const thickness = 26 + (1 - t) * 16;
        const d = thickness;
        const pathD = `M${-d/2},-60 C${d/2},-40 ${d/2},40 ${-d/2},60 C${-d-10},40 ${-d-10},-40 ${-d/2},-60 Z`;
        lensShape.setAttribute("d", pathD);

        // 成像平面指示：在視網膜位置
        imagePlane.setAttribute("x1", retinaX - lensX);
        imagePlane.setAttribute("x2", retinaX - lensX);
        blurPlane.setAttribute("opacity", "0");

        // 代表性主光線（經過透鏡時光路為直線，只在透鏡處改變方向）
        const mid = {
          x: lensX,
          y: eyeCenterY + (objTopY - eyeCenterY) * 0.4
        };
        createRay(
          [
            { x: objX, y: objTopY },
            mid,
            { x: imageX, y: imageTopY }
          ],
          "ray"
        );

      } else if (currentMode === 2) {
        // -------- 模式二：近視眼，固定較短焦距 myopicF --------
        const doEye = lensX - objX;
        const f = myopicF;
        let diEye = 1 / (1 / f - 1 / doEye);
        if (!isFinite(diEye)) diEye = f;
        const imageX = lensX + diEye;
        const m = -diEye / doEye;
        const imageTopY = eyeCenterY - m * 80;

        // 成像平面指示：實際成像 plane
        imagePlane.setAttribute("x1", imageX - lensX);
        imagePlane.setAttribute("x2", imageX - lensX);

        // 視網膜 plane 上如果沒有對焦，顯示紅色模糊標示
        const blurAmount = Math.abs(imageX - retinaX);
        const showBlur = blurAmount > 6;
        blurPlane.setAttribute("opacity", showBlur ? "1" : "0");
        blurPlane.setAttribute("x1", retinaX - lensX);
        blurPlane.setAttribute("x2", retinaX - lensX);

        // 代表性主光線：直線到水晶體中心，再折射到成像點
        const mid = {
          x: lensX,
          y: eyeCenterY + (objTopY - eyeCenterY) * 0.4
        };
        createRay(
          [
            { x: objX, y: objTopY },
            mid,
            { x: imageX, y: imageTopY }
          ],
          "ray"
        );

        // 再從成像點延伸到視網膜，畫成虛線表現「未對焦」
        createRay(
          [
            { x: imageX, y: imageTopY },
            { x: retinaX, y: eyeCenterY + (imageTopY - eyeCenterY) * 1.3 }
          ],
          "ray soft"
        );

      } else if (currentMode === 3) {
        // -------- 模式三：近視眼 + 凹透鏡眼鏡（兩個薄透鏡串聯） --------
        const do1 = glassesX - objX;              // 物體到凹透鏡距離
        const powerD = Number(glassesSlider.value); // 2~8 D
        // 參照你提供的頁面：焦距與屈光度的關係（縮放常數調整為畫面適用）
        const fGlass = -600 / powerD;             // 焦距為負：凹透鏡

        let xVirtual = objX;
        let mTotal = 1;

        // 凹透鏡成像（虛像）
        if (Math.abs(do1) > 1e-3) {
          let di1 = 1 / (1 / fGlass - 1 / do1);
          if (!isFinite(di1)) di1 = fGlass;
          xVirtual = glassesX + di1; // 虛像位置
          const m1 = -di1 / do1;
          mTotal *= m1;

          // 第一段光線：物體 → 凹透鏡 → 虛像方向（直線，僅在凹透鏡處改變方向）
          const midGlass = { x: glassesX, y: eyeCenterY - 10 };
          createRay(
            [
              { x: objX, y: objTopY },
              midGlass,
              { x: xVirtual, y: eyeCenterY - 15 }
            ],
            "ray soft"
          );
        }

        // 虛像作為近視眼水晶體的物體
        const doEye2 = lensX - xVirtual;
        const fEye = myopicF;
        let diEye2 = 1 / (1 / fEye - 1 / doEye2);
        if (!isFinite(diEye2)) diEye2 = fEye;
        const imageX = lensX + diEye2;
        const m2 = -diEye2 / doEye2;
        mTotal *= m2;

        const imageTopY = eyeCenterY - mTotal * 80;

        // 成像 plane 指示：實際成像位置
        imagePlane.setAttribute("x1", imageX - lensX);
        imagePlane.setAttribute("x2", imageX - lensX);

        // 若成像與視網膜接近，視為對焦；否則顯示模糊 plane
        const blurAmount = Math.abs(imageX - retinaX);
        const showBlur = blurAmount > 6;
        blurPlane.setAttribute("opacity", showBlur ? "1" : "0");
        blurPlane.setAttribute("x1", retinaX - lensX);
        blurPlane.setAttribute("x2", retinaX - lensX);

        // 第二段光線：從虛像出發，進入近視眼水晶體，再到成像點
        const midLens = { x: lensX, y: eyeCenterY - 3 };
        createRay(
          [
            { x: xVirtual, y: eyeCenterY - 15 },
            midLens,
            { x: imageX, y: imageTopY }
          ],
          "ray"
        );
      }
    }

    // =================== 視窗平移與縮放 (Pan & Zoom) ===================
    const sceneRoot = document.getElementById("sceneRoot");
    const scene = document.getElementById("scene");
    const viewportWrapper = document.getElementById("viewportWrapper");

    let viewScale = 1;
    let viewOffsetX = 0;
    let viewOffsetY = 0;

    function applyViewTransform() {
      scene.setAttribute(
        "transform",
        `translate(${viewOffsetX},${viewOffsetY}) scale(${viewScale})`
      );
    }

    function clampScale(s) {
      return Math.min(3.0, Math.max(0.6, s));
    }

    // 滑鼠滾輪縮放
    viewportWrapper.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = viewportWrapper.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;

      const delta = -e.deltaY;
      const zoomFactor = delta > 0 ? 1.06 : 0.94;
      const newScale = clampScale(viewScale * zoomFactor);
      const scaleChange = newScale / viewScale;

      // 以滑鼠位置為中心縮放
      viewOffsetX = cx - scaleChange * (cx - viewOffsetX);
      viewOffsetY = cy - scaleChange * (cy - viewOffsetY);
      viewScale = newScale;
      applyViewTransform();
    }, { passive: false });

    // Pointer Events 處理拖曳與雙指縮放
    const activePointers = new Map();
    let lastPanX = 0;
    let lastPanY = 0;
    let isPanning = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let pinchCenterScreen = { x: 0, y: 0 };

    function getDistance(p1, p2) {
      const dx = p1.clientX - p2.clientX;
      const dy = p1.clientY - p2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    viewportWrapper.addEventListener("pointerdown", (e) => {
      viewportWrapper.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, e);
      if (activePointers.size === 1) {
        // 單指拖曳
        isPanning = true;
        lastPanX = e.clientX;
        lastPanY = e.clientY;
      } else if (activePointers.size === 2) {
        // 進入雙指縮放模式
        isPanning = false;
        const pts = Array.from(activePointers.values());
        pinchStartDist = getDistance(pts[0], pts[1]);
        pinchStartScale = viewScale;
        const rect = viewportWrapper.getBoundingClientRect();
        pinchCenterScreen = {
          x: (pts[0].clientX + pts[1].clientX) / 2 - rect.left,
          y: (pts[0].clientY + pts[1].clientY) / 2 - rect.top
        };
      }
    });

    viewportWrapper.addEventListener("pointermove", (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, e);

      if (activePointers.size === 1 && isPanning) {
        // 單指/滑鼠拖曳
        const dx = e.clientX - lastPanX;
        const dy = e.clientY - lastPanY;
        lastPanX = e.clientX;
        lastPanY = e.clientY;
        viewOffsetX += dx;
        viewOffsetY += dy;
        applyViewTransform();
      } else if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        const currentDist = getDistance(pts[0], pts[1]);
        if (pinchStartDist > 0) {
          let newScale = clampScale(pinchStartScale * currentDist / pinchStartDist);
          const scaleChange = newScale / viewScale;
          viewOffsetX = pinchCenterScreen.x - scaleChange * (pinchCenterScreen.x - viewOffsetX);
          viewOffsetY = pinchCenterScreen.y - scaleChange * (pinchCenterScreen.y - viewOffsetY);
          viewScale = newScale;
          applyViewTransform();
        }
      }
    });

    function endPointer(e) {
      if (activePointers.has(e.pointerId)) {
        activePointers.delete(e.pointerId);
      }
      if (activePointers.size === 0) {
        isPanning = false;
      } else if (activePointers.size === 1) {
        // 回到單指拖曳模式
        const remaining = Array.from(activePointers.values())[0];
        lastPanX = remaining.clientX;
        lastPanY = remaining.clientY;
        isPanning = true;
      }
    }

    viewportWrapper.addEventListener("pointerup", endPointer);
    viewportWrapper.addEventListener("pointercancel", endPointer);
    viewportWrapper.addEventListener("pointerleave", (e) => {
      endPointer(e);
    });

    // =================== 初始化視角 ===================
    function centerInitialView() {
      const rect = viewportWrapper.getBoundingClientRect();
      const svgWidth = 900;
      const svgHeight = 420;
      const scaleX = rect.width / svgWidth;
      const scaleY = rect.height / svgHeight;
      viewScale = Math.min(scaleX, scaleY) * 0.95;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const sceneCenterX = svgWidth / 2;
      const sceneCenterY = svgHeight / 2;
      viewOffsetX = cx - viewScale * sceneCenterX;
      viewOffsetY = cy - viewScale * sceneCenterY;
      applyViewTransform();
    }

    window.addEventListener("resize", () => {
      centerInitialView();
    });

    // =================== 啟動 ===================
    window.addEventListener("load", () => {
      centerInitialView();
      updateScene();
    });
  </script>
</body>
</html>
