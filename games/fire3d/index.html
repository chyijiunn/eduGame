<style>

.kicker{font-size:10px;letter-spacing:.12em;font-weight:700;color:#97a7a7;margin:0 0 10px}.sect{margin:0 0 17px}.sect:last-child{margin-bottom:0}.sect-title{font-size:12px;font-weight:700;color:#52676d;margin:0 0 10px}.subtle{font-size:11px;color:#91a0a4;line-height:1.6}.list{display:grid;gap:7px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f5f8f7;border:1px solid #e6eded;border-radius:12px}.item strong{font-size:12px;font-weight:650}.item small{font-size:10px;color:#96a6a8}.item.active{border-color:#78b5b2;background:#edf7f4}.btn{padding:10px 13px;border:1px solid #dae6e4;border-radius:11px;background:#fff;color:#526c70;font-weight:600;font-size:12px;white-space:nowrap}.btn:hover{border-color:#8fbfba}.btn.primary{background:#347f84;color:#fff;border-color:#347f84}.btn.primary:hover{background:#256e72}.btn.danger{color:#ad6c5c;border-color:#f0dbd4}.btn:disabled{opacity:.42}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.furniture-pick{min-height:79px;padding:11px 7px;border:1px solid #e3ebea;border-radius:12px;background:#f9fbfa;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#647a7f}.furniture-pick:hover{background:#edf5f2;border-color:#a7cfcb}.furniture-pick .symbol{font-size:25px;line-height:1.2}.furniture-pick span:last-child{font-size:11px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:10px;color:#899b9d}.field input,.field select{width:100%;min-width:0;height:37px;padding:0 9px;border:1px solid #dce7e6;border-radius:9px;background:#fbfcfc;color:#405a61;outline:0;font-size:12px}.field input:focus,.field select:focus{border-color:#7fb6b5;background:#fff}.field input[type=range]{padding:0;height:24px;accent-color:#337e83}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row{display:flex;align-items:center;gap:7px}.row.between{justify-content:space-between}.stack{display:grid;gap:9px}.line{height:1px;background:#eaf0ee;margin:13px 0}.tag{font-size:10px;padding:4px 7px;border-radius:6px;background:#edf5f2;color:#41827e;font-weight:600}.tiptxt{font-size:11px;line-height:1.7;color:#8d9fa1;background:#f4f8f7;padding:10px 11px;border-radius:9px}.color-dot{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid #a5aaa54d;vertical-align:middle;margin-right:8px}.full{width:100%}.panel-tabs{display:flex;gap:4px;background:#f2f6f5;border-radius:10px;padding:4px;margin-bottom:15px}.panel-tabs button{flex:1;border:0;padding:8px 0;background:transparent;border-radius:8px;font-size:11px;color:#86969b}.panel-tabs button.active{background:#fff;color:#357c7f;box-shadow:0 2px 8px #577a7a15;font-weight:700}
#wallMeasure{position:absolute;z-index:16;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);background:rgba(34,84,88,.96);color:#fff;padding:7px 10px;border-radius:9px;font-size:11px;line-height:1.45;box-shadow:0 6px 20px #23535728;white-space:nowrap;max-width:min(90vw,350px);text-align:center}#wallMeasure[hidden]{display:none}#wallMeasure small{color:#c4e6e1;font-size:10px}#gl.wall-hover{cursor:grab}#gl.wall-grab{cursor:grabbing}

#file{display:none}.loading{position:absolute;inset:0;z-index:90;background:#f7fafa;display:flex;align-items:center;justify-content:center;color:#7b9295;font-size:13px;flex-direction:column;gap:13px}.loading .spin{width:26px;height:26px;border:3px solid #dceae8;border-top-color:#438e8f;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* v0.2 正向燃燒：維持白底低彩 UI；火焰與煙霧為計算狀態之示意，不是 CFD */
#fx{position:absolute;inset:0;z-index:2;display:block;width:100%;height:100%;pointer-events:none;touch-action:none}
#gl{z-index:1} .header{z-index:11}.toolbar{z-index:12}.bottom{z-index:9}
.fire-timeline{position:absolute;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);display:none;align-items:center;gap:9px;padding:10px 13px;border:1px solid #e2e8e4;border-radius:18px;background:rgba(255,255,255,.96);backdrop-filter:blur(22px);box-shadow:0 12px 35px rgba(32,62,69,.14);max-width:calc(100vw - 26px)}
.fire-timeline.visible{display:flex}.fire-time{width:86px;display:grid;gap:2px}.fire-time span{font-size:19px;font-weight:750;letter-spacing:.025em;font-variant-numeric:tabular-nums}.fire-timeline small{font-size:10px;color:#8c9d9f;white-space:nowrap}.fire-ctl{padding:10px 12px;font-size:12px}.fire-readout{display:grid;gap:2px;min-width:95px}.fire-readout strong{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
#fireSpeed{height:37px;border:1px solid #e1e8e6;border-radius:10px;background:#f8fbf9;color:#52676d;padding:0 8px}
#app.sim-running .bottom{bottom:94px}#app.sim-running .scene-meta{padding:10px 14px}
#gl.ignite-mode{cursor:crosshair}
@media(max-width:650px){.fire-timeline{bottom:8px;width:calc(100% - 14px);gap:5px;padding:8px 6px;border-radius:13px;justify-content:space-between}.fire-time{width:auto}.fire-time span{font-size:15px}.fire-time small{font-size:9px}.fire-ctl{padding:9px 8px;font-size:11px}.fire-readout{min-width:55px}.fire-readout strong{font-size:11px}.fire-readout small{font-size:8px}#fireSpeed{height:32px;padding:0 3px;font-size:11px}#app.sim-running .bottom{bottom:84px}#app.sim-running .scene-meta{display:none}#app.sim-running .view-controls{gap:1px;padding:3px}.float.minimized{width:170px!important;left:auto!important;right:10px!important;top:76px!important;height:45px!important}.float.minimized .panelhead{height:44px;padding:0 7px 0 11px}.float.minimized .panel-title{font-size:10px}.float.minimized .panelhead button{width:25px;height:25px}}
/* v0.5: 災後損傷圖層及火場歷程資料，輕量按鈕不遮擋主場景 */
#fireAfter.active{background:#453e3a;color:#fff;border-color:#453e3a}
.damage-data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}
.damage-data .item{display:block;min-width:0}.damage-data .item strong{display:block;margin-top:5px;font-size:16px}
.damage-note{font-size:10px;color:#8d9c9e;line-height:1.6;margin:8px 0}
@media(max-width:650px){#fireAfter{padding:9px 7px;min-width:40px;font-size:10px}}
/* v0.4：房間風險，低彩量化介面，避免覆蓋室內家具 */
.risk-number{font-variant-numeric:tabular-nums;font-weight:750}
.risk-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.risk-bar{height:7px;background:#edf1f0;border-radius:20px;overflow:hidden;margin-top:7px}
.risk-bar>i{display:block;height:100%;border-radius:20px}
.risk-score{font-size:39px;line-height:1;letter-spacing:-.055em;font-weight:750}
.risk-stat{border:1px solid #e1e9e7;background:#f9fbfa;border-radius:11px;padding:10px 9px;min-width:0}
.risk-stat span{font-size:10px;color:#87989b;display:block;margin-bottom:4px}
.risk-stat strong{font-size:15px;font-variant-numeric:tabular-nums}
.risk-meta{font-size:11px;color:#6a7f81;line-height:1.7}
.risk-list-btn{width:100%;text-align:left;border:1px solid #e4ebea;background:#f8faf9;border-radius:11px;padding:11px;display:flex;align-items:center;gap:9px;justify-content:space-between;color:#465c62}
.risk-list-btn.active{border-color:#8ebbb2;background:#eaf5f2}
.risk-list-btn strong{font-size:12px}
.risk-delta{font-size:10px;color:#72868b;margin-left:4px}
.risk-delta.raised{color:#b36044}.risk-delta.lowered{color:#2a817c}
.risk-chip{display:inline-block;font-size:10px;border:1px solid #e0e9e5;border-radius:20px;padding:5px 8px;color:#627d7d;background:#f8fbfa}
@media(max-width:690px){.toolbar{gap:2px;padding:4px}.tool{width:35px;height:40px}.tool svg{width:18px;height:18px}}

/* v0.6 品質驗證浮窗：保留單一簡潔可拖曳面板 */
.qa-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0}.qa-kpi div{background:#f4f8f8;border:1px solid #e4eded;padding:9px 5px;border-radius:10px;text-align:center}.qa-kpi b{display:block;font-size:14px;color:#2c5962;font-variant-numeric:tabular-nums}.qa-kpi span{display:block;font-size:10px;color:#7b9297;margin-top:3px}.qa-hint{border-left:3px solid #d1a054;padding:9px 10px;background:#fff9ee;border-radius:0 8px 8px 0;color:#816a48;font-size:10px;line-height:1.65}.qa-table{width:100%;border-collapse:collapse;font-size:10px}.qa-table td,.qa-table th{padding:7px 5px;border-bottom:1px solid #e9eeee;text-align:right}.qa-table th:first-child,.qa-table td:first-child{text-align:left}.qa-table th{font-weight:650;color:#788d91}.qa-good{color:#368475}.qa-bad{color:#b36c50}.qa-chart{width:100%;background:#f9fbfb;border:1px solid #e3ebeb;border-radius:10px;padding:7px}.qa-chart svg{display:block;width:100%;height:auto}.qa-detail{font-size:10px;color:#7d9195;line-height:1.7}.qa-detail a{color:#337e83}
</style>

<body>
<div id="app">
  <canvas id="gl" aria-label="可旋轉及編輯的 3D 公寓"></canvas><canvas id="fx" aria-hidden="true"></canvas>
  <div class="header"><div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z" stroke-width="1.7"/><path d="M9 21v-7h6v7M3 10.5l9 3 9-3" stroke-width="1.3"/></svg></div><div><strong>FIRE 3D · 火災現場逆向評估系統</strong><small>FORENSIC INCIDENT RECONSTRUCTION &amp; EVALUATION SYSTEM <span style="color:#397e80">/ v0.6</span></small></div></div>
    <div class="header-right"><button class="chip desktop" id="modeLabel" title="此版本先完成室內配置">● 災前配置模式</button><button class="chip" id="btnTemplate">範本 <span style="font-size:9px">⌄</span></button><button class="chip" id="btnSaveTop">儲存 <span style="font-size:10px">↗</span></button></div>
  </div>
  <nav class="toolbar" aria-label="場景編輯工具">
    <button class="tool active" data-tool="select" data-tip="選取與編輯" aria-label="選取與編輯"><svg viewBox="0 0 24 24"><path d="m5 3 13 9-7 1-3 7z"/></svg></button>
    <button class="tool" data-tool="furniture" data-tip="家具庫" aria-label="家具庫"><svg viewBox="0 0 24 24"><path d="M4 13V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5M3 13h18v6H3zM6 19v2m12-2v2M7 13v-2h10v2"/></svg></button>
    <button class="tool" data-tool="rooms" data-tip="隔間與尺寸" aria-label="隔間與尺寸"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM13 4v10H4M13 14h7M8 14v6"/></svg></button>
    <button class="tool" data-tool="materials" data-tip="地坪與牆面材質" aria-label="地坪與牆面材質"><svg viewBox="0 0 24 24"><path d="m4 9 8-5 8 5-8 5zM4 14l8 5 8-5M4 18l8 5 8-5"/></svg></button>
    <button class="tool" data-tool="openings" data-tip="門窗設計" aria-label="門窗設計"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4zM12 3v18M4 12h16M9 10h.1M15 14h.1"/></svg></button>
    <button class="tool" data-tool="fire" data-tip="正向燃燒" aria-label="正向燃燒"><svg viewBox="0 0 24 24"><path d="M12.5 21c4.1-.9 6.5-3.5 6.5-7.4 0-2.7-1.6-5.1-4.2-7.5.2 2.5-.7 4-2.2 4.8C12.5 7 10.9 4.6 8.8 3c.2 4-1.4 6.4-3.3 8.8-1.4 1.7-1.5 3.3-1.1 4.7.7 2.8 3.5 4.2 8.1 4.5Z"/><path d="M12.5 21c1.3-.8 1.7-2 1.4-3.2-.2-.7-1-1.8-1.5-2.3-1.2 1.1-2.5 2.8-2.1 4.1"/></svg></button>
    <button class="tool" data-tool="risk" data-tip="隔間蔓延風險" aria-label="隔間蔓延風險"><svg viewBox="0 0 24 24"><path d="M4 20h16M5 17V9m5 8V5m5 12v-6m5 6V3"/><path d="M3 8 9 3l4 5 8-6"/></svg></button>
    <button class="tool" data-tool="layers" data-tip="場景顯示" aria-label="場景顯示"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></button>
    <button class="tool" data-tool="files" data-tip="匯入／匯出" aria-label="匯入／匯出"><svg viewBox="0 0 24 24"><path d="M4 7h7l2 2h7v11H4zM4 7V4h7l2 3M12 12v6m-3-3 3-3 3 3"/></svg></button>

function mergeRoom(){const info=state.selected?.kind==='room'?getNode(state.selected.id):null;if(!info||!info.parent){toast('請先選取可合併的隔間');return;}

 checkpoint();const parent=info.parent,keep=deep(info.node),oldId=parent.id;Object.keys(parent).forEach(k=>delete parent[k]);Object.assign(parent,keep);
 state.data.openings=state.data.openings.filter(o=>o.segId!==oldId);calcLayout();relocateAfterPartition();state.selected={kind:'room',id:keep.id,item:state.rooms.find(r=>r.id===keep.id)};touchSave();openPanel('rooms');toast('已移除一道隔間，房間已合併');

function nodeBounds(id,n=state.data.layout,x=0,z=0,w=state.data.width,d=state.data.depth){
  if(n.id===id)return {x,z,w,d};

  if(n.axis==='x'){
    const cut=w*n.ratio;return nodeBounds(id,n.first,x,z,cut,d)||nodeBounds(id,n.second,x+cut,z,w-cut,d);
  }
  const cut=d*n.ratio;return nodeBounds(id,n.first,x,z,w,cut)||nodeBounds(id,n.second,x,z+cut,w,d-cut);
}

 const cfg=wallLimits(firstFound.node.id);if(!cfg?.valid)return;checkpoint();const next=cfg.start+(cfg.n.ratio*cfg.extent)+delta*(firstFound.side==='first'?1:-1);setWallCoordinate(firstFound.node.id,next);state.selected.item=state.rooms.find(r=>r.id===id)||state.selected.item;touchSave();renderPanel();

function validImport(d){
  if(!d||!['fire3d-interior-v0.1','fire-interior-v0.1'].includes(d.schema)||!Number.isFinite(d.width)||d.width<4||d.width>40||!Number.isFinite(d.depth)||d.depth<4||d.depth>40||!Number.isFinite(d.height)||d.height<2||d.height>5||!Array.isArray(d.furniture)||d.furniture.length>500||!Array.isArray(d.openings)||d.openings.length>150)return false;
  const validId=id=>typeof id==='string'&&/^[a-zA-Z0-9_-]{1,60}$/.test(id);
  let count=0;
  function checkTree(n,depth=0){if(!n||!validId(n.id)||depth>12||++count>100)return false;
    if(n.first||n.second)return n.first&&n.second&&['x','z'].includes(n.axis)&&Number.isFinite(n.ratio)&&n.ratio>.12&&n.ratio<.88&&checkTree(n.first,depth+1)&&checkTree(n.second,depth+1);
    return typeof n.name==='string'&&n.name.length<=60&&MAT[n.floor]&&MAT[n.wall];
  }
  if(!checkTree(d.layout))return false;
  for(let o of d.furniture)if((o.fireProfile!==undefined&&o.fireProfile!==''&&!(o.type==='bed'&&['Test039','Test037','Test038'].includes(o.fireProfile)))||!validId(o.id)||!TYPES[o.type]||!MAT[o.mat]||!['x','z','w','d','h','rot'].every(k=>Number.isFinite(o[k]))||o.w<.03||o.d<.03||o.h<.005||o.w>15||o.d>15||o.h>7||Math.abs(o.x)>100||Math.abs(o.z)>100)return false;
  for(let o of d.openings)if(!validId(o.id)||!validId(o.segId)||!['door','window'].includes(o.type)||!Number.isFinite(o.width)||o.width<.1||o.width>8||!Number.isFinite(o.t)||o.t<0||o.t>1||typeof o.open!=='boolean')return false;
  if(d.openWallIds&&(!Array.isArray(d.openWallIds)||d.openWallIds.some(v=>!validId(v))))return false;
  if(typeof d.sceneName!=='string'||d.sceneName.length>100||!['cut','full','none'].includes(d.wallMode))return false;
  return true;
}
function loadJson(file){if(!file)return;const rdr=new FileReader();rdr.onload=()=>{try{const d=JSON.parse(String(rdr.result));if(!validImport(d))throw new Error('格式不符合');checkpoint();if(window.__fire3dRiskRebase)window.__fire3dRiskRebase();state.data=d;state.data.schema='fire3d-interior-v0.1';state.selected=null;calcLayout();setView();touchSave();openPanel('files');toast('JSON 配置匯入成功');}catch(e){toast('檔案無法匯入：需為 v0.1 的有效配置 JSON');}};rdr.readAsText(file);}

function benchPower(shape,age){

}

function isolatedBedSimulation(refId,kind='generic',dt=.4){
 const ref=NIST_BEDS[refId];if(!ref)return null;
 const cfg={...TYPES.bed,id:'lab-bed',type:'bed',mat:'fabric',w:TYPES.bed.w,d:TYPES.bed.d,h:TYPES.bed.h};
 if(kind==='fitted')cfg.fireProfile=refId;
 const p=fireProps(cfg),shape=kind==='fitted'?getBedLabShape(refId):null;
 const end=ref.durationMin*60,limit=p.initialKJ;
 let energy=limit,peak=0,timePeak=0,total=0,series=[];
 for(let t=0;t<end-1e-6;){const d=Math.min(dt,end-t),at=t+d*.5;
  const q0=shape?benchPower(shape,at)*p.labScale:Math.min(p.peakKW,p.alpha*(at+5)**2);
  const q=Math.min(q0,energy/d);energy=Math.max(0,energy-q*d);total+=q*d;
  if(q>peak){peak=q;timePeak=at;}
  if(series.length===0||at-series[series.length-1][0]>=10)series.push([at,q]);t+=d;
 }
 return {kind,peak:+peak.toFixed(2),timePeak:+(timePeak/60).toFixed(3),thr:+(total/1000).toFixed(3),left:+energy.toFixed(2),series};
}
function labError(model,truth){return truth?100*(model-truth)/truth:0;}

function baselineMetrics(refId){const ref=NIST_BEDS[refId];return {id:refId,ref,
 original:isolatedBedSimulation(refId,'generic'),fitted:isolatedBedSimulation(refId,'fitted'),
 caveat:'隔離單件、充足氧氣且指定成功引燃的模型計算；與 NIST 含床架／寢具／特定點火條件的實際試體並不相同。'};}
function checkApartmentRepeat(){
 const bed=selectedLabBed();if(!bed)return {status:'skipped',note:'目前配置沒有床；請先加入床，再進行可重複的單一床鋪／關門測試。'};
 const roomId=sceneRoom(bed.x,bed.z),origin={x:bed.x,z:bed.z,itemId:bed.id};
 if(!roomId)return {status:'skipped',note:'床未落在合法房間內。'};
 const roomDoors=flowNetwork().filter(e=>e.kind==='door'&&(e.a===roomId||e.b===roomId)).length;
 const options=[
  {name:'A 不燃裝修＋關門',env:{targetId:roomId,floor:'tile',wall:'white',doorTarget:roomId,doorOpen:false,closeTargetWindows:true}},
  {name:'B 可燃裝修＋開門',env:{targetId:roomId,floor:'carpet',wall:'woodpanel',doorTarget:roomId,doorOpen:true,closeTargetWindows:true}},
  {name:'C 可燃裝修＋關門',env:{targetId:roomId,floor:'carpet',wall:'woodpanel',doorTarget:roomId,doorOpen:false,closeTargetWindows:true}}
 ];
 const run=(env,dt)=>{
  const sim=newOfflineFire(env,origin);let finite=true,bounds=true,energy=true,minO2=99,peak=0,maxTemp=22,firstSurface=null,hrIntegral=0,pilotIntegral=0;
  const initial=new Map([...sim.records].map(([id,r])=>[id,r.energy]));
  const surfaceInit=new Map(sim.surfaces.map(s=>[s.id,s.energy]));
  while(sim.simTime<300-1e-6&&!sim.finished){const step=Math.min(dt,300-sim.simTime);advanceFireEnvironment(sim,step,false);
   if(!Number.isFinite(sim.totalQ)||!Number.isFinite(sim.maxTemp))finite=false;
   hrIntegral+=sim.totalQ*step;pilotIntegral+=(sim.source?.q||0)*step;
   peak=Math.max(peak,sim.totalQ);maxTemp=Math.max(maxTemp,sim.maxTemp);
   for(const z of sim.zones.values()){
    const o=100*z.o2Mass/z.mass;minO2=Math.min(minO2,o);
    if(!Number.isFinite(z.temp)||!Number.isFinite(z.o2Mass)||!Number.isFinite(z.smoke))finite=false;
    if(o<-.00001||o>23.2001||z.temp<21.99||z.smoke<-.0001||z.smoke>1.0001)bounds=false;
   }
   for(const [id,r] of sim.records){if(!Number.isFinite(r.energy)||r.energy<-.001||r.energy>initial.get(id)+.001)energy=false;}
   for(const sf of sim.surfaces){if(!Number.isFinite(sf.energy)||sf.energy<-.001||sf.energy>surfaceInit.get(sf.id)+.001)energy=false;}
   if(firstSurface===null&&sim.firstSurface!==null)firstSurface=sim.firstSurface;
  }
  const consumed=[...sim.records].reduce((acc,[id,r])=>acc+(initial.get(id)-r.energy),0)+sim.surfaces.reduce((acc,s)=>acc+(surfaceInit.get(s.id)-s.energy),0);
  const closure=Math.abs(hrIntegral-consumed-pilotIntegral)/Math.max(1,hrIntegral);
  return {dt,energyClosurePct:+(closure*100).toFixed(3),peak:+peak.toFixed(2),maxTemp:+maxTemp.toFixed(2),minO2:+minO2.toFixed(3),firstSurface:firstSurface===null?null:+firstSurface.toFixed(2),releasedMJ:+(hrIntegral/1000).toFixed(3),finite,bounds,energy};
 };
 const a=run(options[0].env,.4),b=run(options[1].env,.4),c=run(options[2].env,.4);
 const repeat=run(options[0].env,.4),smallStep=run(options[0].env,.2);
 const reproducible=JSON.stringify(a)===JSON.stringify(repeat);
 const relative={peak:Math.abs(a.peak-smallStep.peak)/Math.max(1,a.peak),temp:Math.abs(a.maxTemp-smallStep.maxTemp)/Math.max(1,a.maxTemp),released:Math.abs(a.releasedMJ-smallStep.releasedMJ)/Math.max(1,a.releasedMJ)};
 const regressionPassed=[a,b,c,repeat,smallStep].every(x=>x.finite&&x.bounds&&x.energy)&&reproducible&&relative.peak<.05&&relative.temp<.05&&relative.released<.05&&roomDoors>0&&[a,b,c,repeat,smallStep].every(x=>x.energyClosurePct<.5);
 return {status:regressionPassed?'pass':'review',referenceRoom:roomId,connectedDoorCount:roomDoors,caseSettings:options,results:[{name:options[0].name,...a},{name:options[1].name,...b},{name:options[2].name,...c}],repeatExact:reproducible,stepComparison:{dt:.2,metrics:smallStep,relativeDifferencePct:Object.fromEntries(Object.entries(relative).map(([k,v])=>[k,+(v*100).toFixed(2)]))},checks:{finite:[a,b,c,repeat,smallStep].every(x=>x.finite),oxygenAndBounds:[a,b,c,repeat,smallStep].every(x=>x.bounds),fuelEnergyBounds:[a,b,c,repeat,smallStep].every(x=>x.energy),sourceEnergyClosure:[a,b,c,repeat,smallStep].every(x=>x.energyClosurePct<.5),doorConnection:roomDoors>0},note:'自動化檢查只代表本演算法可重複、數值有限與時間步長在此配置下相近；與現場量測吻合度仍未知。'};
}

function riskAction(action,arg){

 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=url;a.download='v0.4_fire3d_risk_'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('已匯出風險評估 JSON（非鑑識報告）');

function drawRiskOverlay(w,h){if(!risk.results.length||(!risk.showNumbers&&!risk.heatmap))return;
 const ctx=fxCtx;ctx.save();
 for(const r of state.rooms){const data=riskById(r.id);if(!data)continue;const col=data.scenarioCount?riskColor(data.score):'#8b9f9f';
  if(risk.heatmap&&data.scenarioCount){const pts=[[r.x+.08,r.z+.08],[r.x+r.w-.08,r.z+.08],[r.x+r.w-.08,r.z+r.d-.08],[r.x+.08,r.z+r.d-.08]].map(([x,z])=>project(x,.075,z));ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fillStyle=data.score>=70?'rgba(177,92,69,.19)':data.score>=40?'rgba(211,165,73,.18)':'rgba(73,157,137,.12)';ctx.fill();}
  if(!risk.showNumbers)continue;const point=project(r.x+r.w/2,.11,r.z+r.d/2),xx=point.x,yy=point.y;

  ctx.fillStyle='rgba(255,255,255,.94)';ctx.strokeStyle=selected?'#337e83':'#d9e5e2';ctx.lineWidth=selected?2.2:1;
  ctx.beginPath();ctx.roundRect(xx-ww/2,yy-17,ww,32,9);ctx.fill();ctx.stroke();
  ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(riskScoreText(data),xx,yy-1);
  if(state.focusTool==='risk'){ctx.font='500 10px system-ui, -apple-system, sans-serif';const txt=r.name.length>7?r.name.slice(0,7):r.name;const namelen=ctx.measureText(txt).width+16;ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(xx-namelen/2,yy+18,namelen,17);ctx.fillStyle='#536e72';ctx.fillText(txt,xx,yy+27);}
 }
 ctx.restore();
}
