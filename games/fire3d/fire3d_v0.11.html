<script type="module">

 stove:{name:'電陶爐櫃',icon:'▤',w:.84,d:.65,h:.9,mat:'metal',category:'餐廚'},rug:{name:'地毯',icon:'▱',w:2.7,d:1.6,h:.02,mat:'carpet',category:'裝飾'},

const S=(id,axis,ratio,first,second)=>({id,axis,ratio,first,second});

  // 10.3 x 7.7m：左側客餐與廚房、中間 1.32m 連通走道、右側兩間臥室與浴室。

      S('split-bedroom-top','z',.42,R('room-bedroom1','主臥室','walnut','sage'),
        S('split-bedroom-bottom','z',.54,R('room-bedroom2','次臥室','oak','white'),R('room-bath','浴室','stone')))));
}

  // 8.9 x 7.3m：開放式餐廚 + 臥室 + 浴室。

      S('split-bedroom-bottom','z',.55,R('room-bedroom2','次臥室','oak'),R('room-bath','浴室','stone'))));
}

const presetDefinitions=[

  {id:'dense',name:'高家具密度雙房',sub:'約 79㎡ · 同格局增加書櫃及布料家具'},

  {id:'open',name:'雙房開放式餐廚',sub:'約 78㎡ · 客餐廚連通、兩臥一衛'}
];

  if(kind==='furniture')openPanel('selection');else if(kind==='room'&&['select','rooms','materials'].includes(state.focusTool))openPanel(state.focusTool==='materials'?'materials':'selection');else if(kind==='opening')openPanel('selection');

function adjustObject(key,value){if(state.selected?.kind!=='furniture')return;let o=state.data.furniture.find(o=>o.id===state.selected.id);if(!o)return;checkpoint();if(key==='rot')o[key]=Number(value)*Math.PI/180;else if(key==='mat')o[key]=value;else o[key]=Number(value);if(!['rot','mat'].includes(key)){
  keepInsideRoom(o);
}touchSave();renderPanel();}
function addFurniture(type){const info=TYPES[type];if(!info)return;checkpoint();const r=state.selected?.kind==='room'?state.rooms.find(v=>v.id===state.selected.id):state.rooms.find(v=>v.name.includes(type==='toilet'||type==='basin'?'浴':(type==='bed'||type==='wardrobe'?'臥':(type==='stove'||type==='fridge'||type==='counter'?'廚':'客'))))||state.rooms[0];
 const candidate=F(type,r.x+r.w/2,r.z+r.d/2);candidate.w=Math.min(candidate.w,r.w-.22);candidate.d=Math.min(candidate.d,r.d-.22);
 if(FRONT_TYPES.has(type))wallPlacement(candidate,r);keepInsideRoom(candidate,r);state.data.furniture.push(candidate);touchSave();select('furniture',candidate);toast(`已新增${info.name}，可在場景中拖曳位置`);
}
function splitRoom(axis){const target=state.selected?.kind==='room'?getNode(state.selected.id):null;if(!target){toast('請先點選要分割的房間');return;}
 const r=state.rooms.find(r=>r.id===target.node.id);if(!r){return}if((axis==='x'?r.w:r.d)<3.1){toast('房間寬度不足，無法再分割');return;}
 checkpoint();const old=deep(target.node),newRoom=room(uid('room-'),'新隔間',old.floor,old.wall);
 Object.keys(target.node).forEach(k=>delete target.node[k]);Object.assign(target.node,{id:uid('split-'),axis,ratio:.5,first:old,second:newRoom});
 calcLayout();relocateAfterPartition();state.selected=null;touchSave();openPanel('rooms');toast('已新增隔間，點選房間可再調整尺寸');
}
function mergeRoom(){const info=state.selected?.kind==='room'?getNode(state.selected.id):null;if(!info||!info.parent){toast('請先選取可合併的隔間');return;}
 const other=info.parent[info.side==='first'?'second':'first'];if(other.first){toast('相鄰區域尚有其他隔間，請先合併其子隔間');return;}
 checkpoint();const parent=info.parent,keep=deep(info.node),oldId=parent.id;Object.keys(parent).forEach(k=>delete parent[k]);Object.assign(parent,keep);
 state.data.openings=state.data.openings.filter(o=>o.segId!==oldId);calcLayout();relocateAfterPartition();state.selected={kind:'room',id:keep.id,item:state.rooms.find(r=>r.id===keep.id)};touchSave();openPanel('rooms');toast('已移除一道隔間，房間已合併');
}
function nodeBounds(id,n=state.data.layout,x=0,z=0,w=state.data.width,d=state.data.depth){
  if(n.id===id)return {x,z,w,d};
  if(!n.first)return null;
  if(n.axis==='x'){
    const cut=w*n.ratio;return nodeBounds(id,n.first,x,z,cut,d)||nodeBounds(id,n.second,x+cut,z,w-cut,d);
  }
  const cut=d*n.ratio;return nodeBounds(id,n.first,x,z,w,cut)||nodeBounds(id,n.second,x,z+cut,w,d-cut);
}
function changeDivider(axis,delta){const id=state.selected?.kind==='room'?state.selected.id:null,info=id?getNode(id):null;if(!info)return;
 let curr=info,firstFound=null;while(curr.parent){if(curr.parent.axis===axis){firstFound={node:curr.parent,side:curr.side};break;}curr=getNode(curr.parent.id)}
 if(!firstFound){toast('此隔間沿該方向沒有可調整的分割牆');return;}
 const parentBounds=nodeBounds(firstFound.node.id),extent=axis==='x'?parentBounds?.w:parentBounds?.d;if(!extent)return;checkpoint();firstFound.node.ratio=clamp(firstFound.node.ratio+(delta/extent)*(firstFound.side==='first'?1:-1),.18,.82);calcLayout();relocateAfterPartition();state.selected.item=state.rooms.find(r=>r.id===id)||state.selected.item;touchSave();renderPanel();
}
function setRoomProp(key,value){const id=state.selected?.kind==='room'?state.selected.id:null,info=id?getNode(id):null;if(!info)return;checkpoint();info.node[key]=value;calcLayout();relocateAfterPartition();state.selected.item=state.rooms.find(r=>r.id===id)||state.selected.item;touchSave();renderPanel();}
function addOpening(type){const seg=state.segments.find(s=>s.id==='split-root')||state.segments.find(s=>s.interior)||state.segments[0];checkpoint();const op={id:uid('opening'),type,segId:seg.id,t:.5,width:type==='door'?.92:1.45,open:type==='door'};state.data.openings.push(op);touchSave();select('opening',op);toast('已新增門窗，可選擇所在牆面與位置');}
function setOpeningProp(key,value){if(state.selected?.kind!=='opening')return;const o=state.data.openings.find(o=>o.id===state.selected.id);if(!o)return;checkpoint();o[key]=['t','width'].includes(key)?Number(value):key==='open'?value==='true':value;touchSave();renderPanel();}

 state.selected=null;touchSave();openPanel('furniture');toast('已移除選取物件');}

function exportJson(){const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='v0.1_fire3d_'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已匯出 JSON 配置檔');}
function validImport(d){
  if(!d||!['fire3d-interior-v0.1','fire-interior-v0.1'].includes(d.schema)||!Number.isFinite(d.width)||d.width<4||d.width>40||!Number.isFinite(d.depth)||d.depth<4||d.depth>40||!Number.isFinite(d.height)||d.height<2||d.height>5||!Array.isArray(d.furniture)||d.furniture.length>500||!Array.isArray(d.openings)||d.openings.length>150)return false;
  const validId=id=>typeof id==='string'&&/^[a-zA-Z0-9_-]{1,60}$/.test(id);
  let count=0;
  function checkTree(n,depth=0){if(!n||!validId(n.id)||depth>12||++count>100)return false;
    if(n.first||n.second)return n.first&&n.second&&['x','z'].includes(n.axis)&&Number.isFinite(n.ratio)&&n.ratio>.12&&n.ratio<.88&&checkTree(n.first,depth+1)&&checkTree(n.second,depth+1);
    return typeof n.name==='string'&&n.name.length<=60&&MAT[n.floor]&&MAT[n.wall];
  }
  if(!checkTree(d.layout))return false;
  for(let o of d.furniture)if(!validId(o.id)||!TYPES[o.type]||!MAT[o.mat]||!['x','z','w','d','h','rot'].every(k=>Number.isFinite(o[k]))||o.w<.03||o.d<.03||o.h<.005||o.w>15||o.d>15||o.h>7||Math.abs(o.x)>100||Math.abs(o.z)>100)return false;
  for(let o of d.openings)if(!validId(o.id)||!validId(o.segId)||!['door','window'].includes(o.type)||!Number.isFinite(o.width)||o.width<.1||o.width>8||!Number.isFinite(o.t)||o.t<0||o.t>1||typeof o.open!=='boolean')return false;
  if(d.openWallIds&&(!Array.isArray(d.openWallIds)||d.openWallIds.some(v=>!validId(v))))return false;
  if(typeof d.sceneName!=='string'||d.sceneName.length>100||!['cut','full','none'].includes(d.wallMode))return false;
  return true;
}
function loadJson(file){if(!file)return;const rdr=new FileReader();rdr.onload=()=>{try{const d=JSON.parse(String(rdr.result));if(!validImport(d))throw new Error('格式不符合');checkpoint();state.data=d;state.data.schema='fire3d-interior-v0.1';state.selected=null;calcLayout();setView();touchSave();openPanel('files');toast('JSON 配置匯入成功');}catch(e){toast('檔案無法匯入：需為 v0.1 的有效配置 JSON');}};rdr.readAsText(file);}

     <div class="sect"><div class="grid2">${field('寬度 (m)',o.width,'o.width')}${field('沿牆位置（0～1）',o.t,'o.t','number','.05','0','max="1"')}</div></div>

const PANEL_CONTENT={selection:selectPanel,rooms:roomPanel,furniture:furniturePanel,materials:materialPanel,openings:openingPanel,templates:templatePanel,layers:layerPanel,files:filePanel};
const PANEL_NAMES={selection:'物件與隔間編輯',rooms:'房間與隔間',furniture:'家具庫',materials:'材質編輯',openings:'門窗編輯',templates:'快速套用範本',layers:'場景顯示',files:'儲存與匯入'};
let panelGeom={};try{panelGeom=JSON.parse(localStorage.getItem('fire3d-v0.1-panel')||'{}')}catch(e){};
function openPanel(key){if(!PANEL_CONTENT[key])return;let old=panels.querySelector('.float');if(old&&state.panelKey===key){if(old.classList.contains('minimized'))old.classList.remove('minimized');renderPanel();return;}
  if(old)old.remove();state.panelKey=key;state.panelMoved=false;
  let el=document.createElement('section');el.className='float';el.id='activePanel';const point=state.selected?.kind==='furniture'?state.data.furniture.find(v=>v.id===state.selected.id):state.selected?.kind==='room'?state.rooms.find(v=>v.id===state.selected.id):null;const screenPoint=point?project(state.selected?.kind==='room'?point.x+point.w/2:point.x,0,state.selected?.kind==='room'?point.z+point.d/2:point.z):null;const defaultLeft=screenPoint&&screenPoint.x>window.innerWidth*.60?Math.max(94,window.innerWidth*.075):Math.max(100,window.innerWidth-405);el.style.left=panelGeom.left||defaultLeft+'px';el.style.top=panelGeom.top||'102px';el.style.width=panelGeom.width||'344px';el.style.height=panelGeom.height||'auto';
  el.innerHTML=`<div class="panelhead"><div class="panel-title"></div><button class="minbtn" title="縮小視窗">${svg(icons.minus)}</button><button class="closebtn" title="關閉視窗">${svg(icons.close)}</button></div><div class="panelbody"></div><div class="grip"></div>`;
  panels.appendChild(el);el.querySelector('.closebtn').onclick=()=>{panels.innerHTML='';state.panelKey=null;setActiveTool('select',false)};
  el.querySelector('.minbtn').onclick=()=>el.classList.toggle('minimized');
  function begin(e,kind){if(e.button!==0)return;e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);const b=el.getBoundingClientRect();el._move={id:e.pointerId,kind,startX:e.clientX,startY:e.clientY,left:b.left,top:b.top,w:b.width,h:b.height};}
  el.querySelector('.panelhead').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;begin(e,'move')});
  el.querySelector('.grip').addEventListener('pointerdown',e=>begin(e,'resize'));
  el.addEventListener('pointermove',e=>{const m=el._move;if(!m||m.id!==e.pointerId)return;const dx=e.clientX-m.startX,dy=e.clientY-m.startY;
    if(m.kind==='move'){el.style.left=clamp(m.left+dx,4,window.innerWidth-el.offsetWidth-4)+'px';el.style.top=clamp(m.top+dy,65,window.innerHeight-55)+'px';}
    else{el.style.width=clamp(m.w+dx,270,window.innerWidth-10)+'px';el.style.height=clamp(m.h+dy,130,window.innerHeight-85)+'px';}
    state.panelMoved=true;
  });
  el.addEventListener('pointerup',()=>{if(!el._move)return;el._move=null;panelGeom={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};try{localStorage.setItem('fire3d-v0.1-panel',JSON.stringify(panelGeom))}catch(e){}});
  el.addEventListener('pointercancel',()=>el._move=null);
  el.addEventListener('change',onPanelChange);el.addEventListener('click',onPanelClick);
  if(window.innerWidth<690){el.style.left='8px';el.style.top='76px';el.style.width=Math.min(344,window.innerWidth-16)+'px';el.style.height=Math.min(375,window.innerHeight*.46)+'px';}
  renderPanel();
}
function renderPanel(){let el=$('#activePanel');if(!el||!state.panelKey)return;let body=el.querySelector('.panelbody'),prev=body.scrollTop;el.querySelector('.panel-title').textContent=PANEL_NAMES[state.panelKey];body.innerHTML=PANEL_CONTENT[state.panelKey]();body.scrollTop=prev;}
function onPanelChange(e){const key=e.target.dataset.edit;if(!key)return;let v=e.target.value;if(key.startsWith('f.'))adjustObject(key.slice(2),v);
 else if(key.startsWith('r.')){const attr=key.slice(2);if(attr==='w'||attr==='d'){const r=state.rooms.find(r=>r.id===state.selected?.id);const next=Number(v);if(r&&Number.isFinite(next)&&next>0)changeDivider(attr==='w'?'x':'z',next-r[attr]);}else setRoomProp(attr,v);}
 else if(key.startsWith('o.'))setOpeningProp(key.slice(2),v);
 else if(key.startsWith('scene.')){const attr=key.slice(6),num=Number(v);if(!Number.isFinite(num))return;checkpoint();const oldSize=state.data[attr];state.data[attr]=clamp(num,attr==='height'?2.0:5,attr==='height'?4.8:30);if(attr==='width')state.data.furniture.forEach(o=>o.x=o.x*state.data.width/oldSize);if(attr==='depth')state.data.furniture.forEach(o=>o.z=o.z*state.data.depth/oldSize);calcLayout();relocateAfterPartition();state.target.x=state.data.width/2;state.target.z=state.data.depth/2;touchSave();renderPanel();}
}
function onPanelClick(e){let btn=e.target.closest('[data-action]');if(!btn)return;let action=btn.dataset.action,arg=btn.dataset.arg;
 if(action==='tool'){setActiveTool(arg);openPanel(arg)}
 else if(action==='preset')switchPreset(arg);
 else if(action==='faceInside'){const o=state.selected?.kind==='furniture'&&state.data.furniture.find(f=>f.id===state.selected.id);if(o){checkpoint();autoFaceRoom(o);touchSave();renderPanel();toast('已依最近牆面調整櫃體正面朝向');}}
 else if(action==='addFurniture')addFurniture(arg);
 else if(action==='selectroom'){let r=state.rooms.find(r=>r.id===arg);if(r){select('room',r);if(state.focusTool==='materials')openPanel('materials');}}
 else if(action==='selectopening'){let o=state.data.openings.find(o=>o.id===arg);if(o)select('opening',o)}
 else if(action==='split')splitRoom(arg);
 else if(action==='merge')mergeRoom();
 else if(action==='resize'){let [axis,d]=arg.split(':');changeDivider(axis,Number(d));}
 else if(action==='delete')deleteSelected();
 else if(action==='addOpening')addOpening(arg);
 else if(action==='walls'){checkpoint();state.data.wallMode=arg;touchSave();renderPanel();}
 else if(action==='camera')setView(arg==='top');
 else if(action==='undo')undo();else if(action==='export')exportJson();else if(action==='import')$('#file').click();
 else if(action==='reset'){if(confirm('確定還原一般家庭範本？目前修改仍可用「復原」返回。'))switchPreset('home');}
}
function setActiveTool(tool,open=true){state.focusTool=tool;$$('.tool').forEach(t=>t.classList.toggle('active',t.dataset.tool===tool));if(open&&tool!=='select')openPanel(tool);else if(open&&tool==='select')openPanel('selection');}
$$('.tool').forEach(t=>t.addEventListener('click',()=>setActiveTool(t.dataset.tool)));
$('#btnTemplate').onclick=()=>openPanel('templates');$('#btnSaveTop').onclick=()=>openPanel('files');
$('#btnView45').onclick=()=>setView(false);$('#btnTop').onclick=()=>setView(true);$('#btnZoomIn').onclick=()=>state.zoom=clamp(state.zoom*1.2,.35,3.8);$('#btnZoomOut').onclick=()=>state.zoom=clamp(state.zoom/1.2,.35,3.8);$('#btnUndo').onclick=undo;
$('#file').addEventListener('change',e=>{loadJson(e.target.files[0]);e.target.value=''});
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='Escape'){panels.innerHTML='';state.panelKey=null;state.selected=null;state.geomDirty=true;updateStatus();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if(['Backspace','Delete'].includes(e.key)&&state.selected?.kind==='furniture')deleteSelected();});
window.addEventListener('resize',()=>{const el=$('#activePanel');if(el&&window.innerWidth>690){el.style.left=clamp(parseFloat(el.style.left)||8,4,window.innerWidth-el.offsetWidth-4)+'px';el.style.top=clamp(parseFloat(el.style.top)||74,62,window.innerHeight-56)+'px';}});
$('#btnUndo').disabled=true;updateStatus();render();$('#loading').remove();
// 調試與自動化測試入口，不會修改公開 UI。
window.__fire3d={getState:()=>deep(state.data),getLayout:()=>deep(state.rooms),selectRoom:id=>{let r=state.rooms.find(o=>o.id===id);if(r)select('room',r)},addFurniture,splitRoom,switchPreset,undo,exportJson};
</script>
</body>
</html>
