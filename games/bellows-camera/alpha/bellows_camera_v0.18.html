const DOCS={"zh": "# 機身包絡尺寸與精簡介面\n第三頁的箱體尺寸以機身軸線對齊的正投影包絡箱表示，順序寬×高×長，非材料實體體積。只包含前後木框與蛇腹，不含鏡頭、鏡頭板、片盒把手、壓扣、腳架、導軌、螺母座及其固定件；需攜帶完整相機時自行另留餘量。寬高按木框偏移、抽板方向與蛇腹預覽摺峰計算，與視角無關。機身長＝蛇腹固定面間距＋前後木框深度。最大值使用最大伸長E，最小值使用最短設定Emin，不是經物理驗證的極限收合。堆疊粗估不能取代實作量測；Emin不足堆疊估計時仍會提示。\n主頁保留摺組數、實際格距及材料尺寸；製作角度、骨條尺寸、展開長度及對焦計算移到「圖面」內查看。點選欄位只在模型顯示名稱與引線，影響說明顯示於參數欄頂部，不再以方框遮擋模型。常駐標題、操作說明、儲存成功字樣與XYZ軸移除，但儲存、錯誤與條件式警告仍保留。\n\n# 等距承口與片盒配色更新\n第二、三頁片盒使用半透明淡綠（顯示透明，不代表製作材料可透光）。承口在後框外形中央，上下左右至外框邊緣距離相同；右欄列出單一「承口四邊等距」，背面路由圖使用同一數值。共用邊距依完整片盒、通光開口與木條截面計算，必要時增大框體外形。木條仍20×20mm，但背面開槽後保留的邊距並不是20mm。\n框體中心跟隨片盒外形中心；因抽板端額外長度，相紙中心不等於盒身中心。整個後框相對光軸向上偏移半個抽板口餘量，通光孔相對框體向下偏移相同量，因此相紙中心仍對準鏡頭；側抽時連同偏移一併旋轉。兩種偏移不改變承口至外框的四邊等距。以下歷史版本的不等距敘述已廢止。\n\n# 後框更新\n木條截面預設20×20mm，正面框邊由通光開口到外緣均為20mm。開口至少容納畫幅，並依完整片盒外形與抽板端餘量檢查承口四周至少3mm剩餘木料；需要時增大開口及外形，不改變木條截面。\n後框從背面開封閉承口，不再把承口一路敞開到頂。20mm總深、8.6mm片盒、9.6mm承口、10.4mm定位肩。頂木只在抽板所在深度開狹槽：槽厚＝抽板厚＋間隙，位置＝定位肩深＋片盒正面板厚；槽寬按抽板寬加間隙。頂部模板給出位置，實際加工須試配並加遮光絨或遮光唇；尺寸未計遮光絨壓縮量，試作後調整間隙。\n第二頁藍色為片盒，木色為後框。爆炸按鈕讓整個片盒沿光軸向後移出45mm，再按裝回；不是拆散片盒各層。第三頁一律顯示已裝回狀態，不受第二頁取出示意影響。側抽仍以轉動整個後框片盒實現。片盒局部取出示意不改製作尺寸。\n以下歷史版本開放通道說明已廢止。\n\n# 內嵌片盒與抽板出口更新\n\n木條預設20×20mm。後框外尺寸＝相紙尺寸＋兩倍木條框邊寬，中心對準相紙。承口在木條背面挖入，不在片盒外另加木條寬；總框深仍為20mm，預設片盒8.6mm、後退1mm，承口9.6mm，硬定位肩10.4mm。\n\n出口參數0上、1右、2左。側向以整組後框與片盒轉90°實現，因此相紙方向也轉動，並非在同一片盒上換一個孔。第三頁蛇腹後端寬高隨方向更新。木條加工圖以未轉向的製作座標標示，上出口組裝後隨後框轉到選定方向；圖上有方向註記。背面承口延伸至出口形成開放通道，預覽顯示實際缺口。這不是密封完成的抽板口：必須在片盒抽板口設雙層遮光絨／柔性遮光唇，並實測漏光。不可只用空孔防漏光。\n\n目前通道從定位肩延伸至框背，不是窄縫加工；可在試作後加可拆遮光罩縮小開口。背面壓扣可能突出框背，屬獨立五金，不計入木條20mm厚度。\n\n以下前版尺寸敘述若與本段牴觸，以本段為準。\n\n# 蛇腹相機：使用與製作說明\n\n## 操作\n上方三頁籤依序為片盒、木條框體、蛇腹。拖曳旋轉，右鍵拖曳平移，滾輪或雙指縮放。頁籤一可切換爆炸圖；點選數值會高亮對應部件。圖面按鈕檢視目前頁籤製作圖；第三頁下載三組 DXF 或 SVG。地球切換中英文，旁邊 ⓘ 開啟說明。參數、頁籤、語言及視角儲存在同一瀏覽器；可匯出 JSON 備份。清除網站資料會清除記錄，離線檔案的儲存行為依瀏覽器而異。\n\n## 1 片盒與對焦背板\n預設相紙 63.5 × 88.9 mm，四邊白邊 1 mm，有效畫面 61.5 × 86.9 mm。片盒主要板厚 3 mm。正面板、抽板間隔、遮罩、相紙槽、可拆背蓋共用尺寸。遮罩及抽板必須不透光。透明壓克力不能直接作遮光遮罩。\n\n片盒正面朝鏡頭；正面板接觸後框硬定位肩。相紙感光面距片盒正面 zf＝主板厚＋抽板厚＋抽板間隙＋遮罩厚。片盒總厚＝zf＋相紙厚＋0.15 mm 裝紙餘隙＋背蓋厚。背蓋鎖固、抽板口遮光絨與密封須另行實物試作。對焦背板採相同正面基準，3 mm 對焦屏的朝鏡頭霧面須與感光面重合；墊片可供校正。\n\n## 2 45°木條框體\n前後框由木條四邊45°拼合，預設截面30 × 30 mm；框邊寬 w 和光軸方向深度 d 分開調整。不是3mm板件疊合。四角建議以薄片榫或角撐補強。前端內開口獨立設定，鏡頭板仍為可雷切薄板。\n\n後框從背面開承口。承口寬＝片盒外寬＋總裝卸間隙；高同理。間隙數值是兩側合計。片盒後退量 r 預設1 mm；承口深度＝片盒總厚＋r。後框剩餘定位肩深度＝d－承口深度，至少保留4 mm，否則阻止加工檔下載。片盒正面靠硬定位肩，背面低於木框背面r；不能用泡棉壓縮量作對焦基準。\n\n承口孔與通光孔是不同孔：通光孔對準相紙中心，承口容納整個片盒，包含抽板端盒身。後框高於光軸的中心偏移量為抽板口餘量的一半；預覽及承口路由圖使用同一偏移。\n\n密封槽設於定位肩、距片盒外緣2mm處，寬度可調，深度暫定1mm。搭配可替換遮光密封條，保留硬接觸區。抽板入口仍需獨立遮光結構；後框密封不能代替它。背面旋轉壓扣固定片盒。\n\n裁切圖包含八根木條的45°輪廓、長邊及短邊尺寸，以及後框承口路由圖。木條長邊＝框體外尺寸；短邊＝長邊－2w。路由圖 GUIDE 代表銑槽位置，不是雷切貫穿線；加工深度以 LABEL 註記。這是木工加工，不可把全部圖層當雷切路徑。\n\n前後框底部中央各預留1/4″-20 UNC金屬螺母安裝；底部鑽孔模板以GUIDE標示。圓孔只是螺栓通道，不是螺紋。六角螺母孔對邊尺寸與深度依實物調整；本版固定採捕捉式金屬螺母，需從內側加工及另作固定，不能只鑽圓孔就算完成。導軌、腳架與鏡頭僅示意，不包含其製造圖。\n\n## 3 一片式蛇腹\n外皮Tyvek預設0.15mm、中間分離紙板骨條0.40mm、內襯Tyvek預設0.15mm；骨條區不含膠厚0.70mm。膠厚參數是兩面膠層合計估計。雙層Tyvek不保證遮光，內層也不保證消光，須以實際材料完成貼合、反覆摺疊及相紙漏光測試。\n\n外皮及內襯依PDF封面與圖10–12保留五區完整排樣：底面完整樣板A、左側、頂面、右側、底面完整樣板B。這不是五個成品面，也不是預切兩個半底面；兩端底面樣板包合後相互重疊形成同一個第四面。兩張皮料各為一片。先貼頂面與兩側骨條，再用模具對正第四面、沿斜接參考線試合修邊並黏合，最後貼完整底面骨條。\n\nTRIM_REFERENCE紫色線是模具上修邊參考，不是自動切割線；完整排樣故意保留多餘底面材料。外皮搭接寬預設8mm、內襯5mm，兩者均可調；這是小尺寸相機試作值，非原書的1.5吋及1吋。外皮及內襯斜接方向相反，接縫須錯位。內襯沿骨條及鉸鏈壓貼，不將整片等比例縮小；本版沒有經實物校正的彎折厚度補償，不應宣稱已保證收合。\n\n中層僅四組完整骨條：TOP頂面、BOTTOM底面、LEFT左側、RIGHT右側，每組2N條；底面骨條不切半。外皮/內襯的GUIDE顯示骨條位置，兩端底面樣板上的定位為同一組底面骨條的重複參考，不能貼成兩層。\n\nA／B為後／前端頂底面寬，C／D為後／前端側面高。A＝後端通光寬＋2b，B＝前端內開口寬＋2b；C及D為對應內開口高。b是蛇腹固定邊，不是木條寬；蛇腹只佔木框面的一部分，所以增加木條框邊寬未必改變展開輪廓。\n\n一片式使用相鄰梯形共邊展開；前後寬高差不同時會形成扇形，不能直接水平並排。L為未摺展開參考軸長＝最大工作伸長×(1＋餘量百分比)，各面依錐度取得斜長後剛性展開；摺線及骨條定位同步轉換。五區排樣與斜接組裝順序遵循原PDF，數值座標為本工具實作，非經作者驗證的CAD公式；有限材料厚度、角落皺褶及貼合變形須紙模型驗證。不可把預覽動畫視為材料摺疊物理模擬。\n\nFW為摺組格距，本工具N＝ceil(L/FW)，實際格距＝L/N；每組兩個摺面，總2N面。原PDF的fold計數需對照圖面，不可只比數字。寬窄骨條及角度參考PDF角形方法，骨條向內退讓gap/2以留鉸鏈；間隙使窄骨條消失時阻止下載。\n\n工作伸長E是前框朝後蛇腹固定面到後框朝前固定面的距離。最近對焦以薄透鏡公式 v＝fu/(u－f)估算；所需蛇腹長＝v－前框深度－鏡頭板厚－後框固定面到感光面距離－光學偏移。150mm焦距不等於蛇腹長；實際鏡頭主平面須由光學偏移校正。堆疊厚度2N×總層厚僅粗估，不含角落堆疊。\n\n## 製作與檢查\n1. 先製作一個片盒，實測外形、總厚及感光面位置。\n2. 試做後框承口，確認插拔、硬定位及密封，再製作木框與對焦背板。\n3. 用1:1紙模型驗證一片展開的前後開口、收合、轉角及搭接；再裁正式材料。\n4. 依GUIDE貼骨條、留摺縫，貼內襯，待膠固化後逐摺成形；膠與Tyvek須相容。\n5. 安裝導軌並維持前後框平行，校正對焦面；在預定外拍光照及時間下用相紙測漏光。\n\n## 輸出與加工\n所有尺寸mm、1:1、名目尺寸；切縫補償由加工端處理。CUT裁切，FOLD_M/FOLD_V摺線，GUIDE定位／木工路由，TRIM_REFERENCE斜接修邊參考，LABEL文字，CALIBRATION校尺。不要裁切GUIDE或FOLD；只有獨立骨條輪廓用CUT。Tyvek與塗層材料先確認加工設備適用性；PVC不可雷切。整片外皮所需幅寬顯示於第三頁，材料不足時不得自行縮放。\n\n## 參考資料\nJ. B. Harlin（2008），*Bellows Construction*。[原始PDF](https://www.jbhphoto.com/wp-content/uploads/2015/01/bbuildingjbh2008.pdf)。\n蛇腹骨條與試作方法參考上述文件；木條框體、片盒接口、五區數值排樣與互動功能為本工具新增設計。本文自行撰寫，未重製原書圖片。\n", "en": "# Body envelope and simplified interface\nTab3 envelope is axis-aligned width×height×length, not solid material volume. Includes only timber frames and schematic bellows; excludes lens, lens board, cassette handle/clips, tripod, rail and mounts. Add packing clearance separately. Width/height follow frame offsets and fold peaks independent of view. Length=E(or Emin)+both frame depths. Minimum is the configured setting, not a physically verified collapse limit. Detailed fabrication values are in Drawing. Field focus shows unboxed label/leader; explanation moves to parameter panel. Persistence and actionable warnings remain active.\n\n# Equal rebate margins and colour update\nTabs2/3 show a pale green translucent cassette for visual distinction only; real materials must remain opaque. The rebate is centred in the rear outline with a single equal edge offset on all four sides, shown in derived dimensions and machining labels. The computed offset preserves cassette and optical clearance and may enlarge the outline. Timber section remains20x20mm; routed edge margin is a different measurement. Rear frame centre is offset by half the cassette mouth allowance while optical opening offsets oppositely, retaining paper/lens alignment. Side orientation rotates the entire rear unit including these offsets. This supersedes conflicting historical layout notes below.\n\n# Rear frame update\n20x20mm timber. Face width is measured from optical opening. Opening/outline expand as needed to contain cassette and mouth with at least3mm rebate walls. Closed rear rebate and a narrow top slit replace the open channel. Slot thickness=slide+clearance; axial position=shoulder+front plate. Fit felt/lips and test leaks. Tab2 blue cassette can be removed axially45mm by the Explode/Insert button; tab3 stays assembled. Side exit still rotates complete back. Historical open-channel text below is obsolete.\n\n# Inset cassette and slide exit update\n\nDefault timber 20x20mm. Rear outer size = paper + 2 face widths, centred on paper. Rebate is machined inside timber, not added outside the holder. Default depth: frame20, holder8.6, rebate9.6, hard shoulder10.4mm. Exit0=top,1=right,2=left rotates the entire rear assembly and image format; it does not create a new slot in an unchanged holder. Bellows rear dimensions follow. Routing coordinates remain unrotated with exit assembly notes. Backside channel opens to the selected edge from shoulder to frame back. This is an open channel, not a light-tight finished slot. Add felt/lips at cassette slot and test leaks. Rear clips are external hardware. This update supersedes conflicting old dimensions below.\n\n# Bellows Camera: fabrication guide\n\n## Controls and persistence\nUse the three tabs in order: holder, timber frames, bellows. Drag to orbit, right-drag to pan, wheel/pinch to zoom. Explode is available only in tab 1. Drawing opens the current fabrication layout; tab 3 exports all three sets. Focus a field to highlight its part. Globe toggles language; adjacent info opens this guide. localStorage retains parameters, tab, language and view in this browser. Export JSON for backup; clearing site data clears saved settings. File-URL storage depends on the browser.\n\n## Holder and focusing screen\nDefaults: 63.5 × 88.9 mm paper, 1 mm margins, 61.5 × 86.9 mm image, 3 mm structural board. Front plate, slide spacer, opaque mask, paper pocket and removable back form the stack. Mask and slide must be opaque. Emulsion datum zf = board + slide + slide clearance + mask. Total holder depth = zf + paper + 0.15 mm loading allowance + back board. The screen assembly shares the front datum; the lens-facing matte surface must coincide with emulsion. Calibrate using shims. Back fastening and slide-slot light traps still require practical development.\n\n## 45-degree timber frames\nBoth frames use four mitered timber members, default cross section 30 × 30 mm. Face width w and optical-axis depth d are independent. Reinforce corner joints with splines or braces. Lens board remains a separate thin sheet.\n\nRear rebate width/height follow the whole holder plus total fit clearance (shared across both sides). Rebate depth = holder depth + rear recess, default recess 1 mm. Remaining hard shoulder = timber depth minus rebate depth; less than 4 mm blocks fabrication exports. The holder front rests against this hard datum, never against compressible foam alone.\n\nOptical opening and holder rebate are different. The rear frame centre sits half the slide-mouth allowance above the optical axis, matching holder paper centring. A seal groove follows a rectangle 2 mm inside the holder edge, width adjustable, depth provisionally 1 mm. Preserve hard contact surfaces. Independent slide-slot light traps remain necessary. Rotating clips retain the holder.\n\nEight miter outlines include long and short points: short = long minus twice timber face width. An assembled rear routing plan specifies rebate size/depth; GUIDE is a routing reference, not a through-cut. Bottom drill templates specify metal 1/4-20 UNC nut capture pockets, dimensions matched to actual hardware. A clearance circle is not a thread; machine and secure the hex pocket separately. Rail, tripod and lens are illustrative and not fabrication parts.\n\n## One-piece bellows\nDefaults: outer Tyvek 0.15 mm, separate card ribs 0.40 mm, inner Tyvek 0.15 mm. Ribbed zones total 0.70 mm excluding glue; glue parameter estimates both adhesive layers combined. Dual Tyvek is not guaranteed opaque or matte. Test the laminated, repeatedly folded material using actual photographic paper.\n\nOuter and liner each retain the five full cover-style templates from PDF Figures 10–12: full bottom A, left, top, right, full bottom B. The ends overlap to make one fourth face, not five finished faces. Neither bottom template is pre-cut in half. Bond top and side ribs first; align the fourth face on a form, trim an oblique seam, overlap and glue, then install full bottom ribs. Purple TRIM_REFERENCE lines guide trimming on the form and must not be automatically cut. Outer overlap defaults to 8 mm, liner 5 mm: small-camera trial values, not the source 1.5 and 1 inch. Liner seam slopes opposite the outer seam; stagger them. Press liner around ribs and hinges; do not uniformly shrink it. No physically calibrated bend-thickness compensation is claimed. The core has four full rib sets TOP, BOTTOM, LEFT, RIGHT, 2N ribs each. The two bottom guide areas duplicate one set, not two layers of ribs.\n\nA/B are rear/front top-bottom widths: rear optical width + 2b and front opening width + 2b. C/D are rear/front side opening heights. Attachment border b is independent of timber face width: widening timber need not change the bellows outline.\n\nAdjacent trapezoids are unfolded about equal shared edges into a fan. They are not placed side by side as unrelated trapezoids. L = maximum working extension × (1 + length allowance). Each face gets its tapered slant length; folds and rib guides follow the same rigid transform. The five-zone layout and seam assembly follow the source; numerical coordinates are this tool’s implementation, not author-validated CAD. Material thickness, corner wrinkles and adhesive distortion require a full-size paper model. The 3D animation is schematic, not a physical cloth simulation.\n\nN = ceil(L / requested Fold Width); actual pitch = L/N. Each repeat has two faces, total 2N. Compare this convention with the source drawings rather than assuming identical fold counts. Rib geometry follows the source corner method, inset gap/2 from hinges. Vanishing ribs block exports.\n\nWorking extension E is the gap between the
