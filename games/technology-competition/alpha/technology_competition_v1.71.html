<body>
<canvas id="scene" aria-label="WebGL 立體場地：拖拉車輛、旋轉視角與縮放"></canvas>
<header class="topbar"><div class="brand"><h1>災後安全巡檢</h1></div><div class="score" id="scoreBtn" role="button" tabindex="0" aria-label="展開計分明細"><div><div class="label">目前得分</div><div><strong id="totalScore">0</strong><span class="slash">/ 100</span></div></div><span class="chev">明細 ▾</span></div></header>
<aside class="status"><div class="pill">警示 <b id="lampLabel">正常待命</b></div><div class="pill">救援 <b id="rescueLabel">0 / 4</b></div><div class="pill">階段 <b id="phaseLabel">準備中</b></div></aside>

<div id="touchDrive" role="group" aria-label="車輛方向搖桿：上前進、下後退、左右轉向"><div class="joy-ring"><span class="joy-dir up">▲</span><span class="joy-dir down">▼</span><span class="joy-dir left">◀</span><span class="joy-dir right">▶</span><div class="joy-nub" id="joyNub"></div></div></div>
<div class="time" id="clock" role="timer" aria-label="競賽計時器">03:00</div>
<div class="bottom"><div class="controls" aria-label="場地操作"><button id="modeBtn" class="btn mode" title="計時：三分鐘倒數；不計時：自由練習。切換會重置場地" aria-pressed="false">計時</button><button id="playBtn" class="btn primary" title="開始競賽並釋放落石">開始</button><button id="lowerBtn" class="btn" title="下降鏟斗：卸貨或接近物品">鏟斗↓</button><button id="raiseBtn" class="btn" title="升起鏟斗：承載物品">鏟斗↑</button><button id="resetBtn" class="btn compact" title="重置場地" aria-label="重置場地">↻</button></div></div>
<div class="panel" id="scorePanel"><button class="close" id="closePanel" aria-label="關閉">×</button><h2>即時計分明細</h2><div id="scoreDetails"></div><div class="footnote">依 115 學年度全國生活科技組公告版計分；本頁用於流程練習，不代替裁判判定；電子零件僅外觀示意、非實際接線圖。違規扣分未納入自動偵測。<label class="faultmode"><input type="checkbox" id="faultToggle"> 測試警示失效／安全迂迴路線（開始前設定）</label></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* 115 學年度生活科技救援競賽：原生 WebGL 深度測試 + 離線幾何 / 互動物理。
   尺寸以 cm 為單位；場地詳細障礙位置仍為公告圖示意。v1.71: A 區四個可推動路障改為小方塊，其他比例、碰撞及計分維持 v1.7。 */
(()=>{
const $=id=>document.getElementById(id), canvas=$('scene');
const gl=canvas.getContext('webgl',{alpha:false,antialias:true,depth:true,stencil:false,premultipliedAlpha:false, preserveDrawingBuffer:true});
if(!gl){const d=document.createElement('div');d.style.cssText='position:fixed;inset:26% 15%;padding:32px;border:1px solid #466078;border-radius:16px;background:#142539;z-index:20;text-align:center';d.textContent='此瀏覽器無法啟用 WebGL，請檢查 Safari「硬體加速」或改用更新的瀏覽器。';document.body.append(d);return}
const VS=`attribute vec3 p;attribute vec3 c;uniform vec3 eye;uniform vec3 right;uniform vec3 up;uniform vec3 forward;uniform vec2 viewport;uniform float focal;varying vec3 vColor;void main(){vec3 d=p-eye;float z=dot(d,forward);float zn=0.2;float zf=1800.0;float zz=(zf+zn)/(zf-zn)*z-(2.0*zf*zn)/(zf-zn);gl_Position=vec4(dot(d,right)*2.0*focal/viewport.x,dot(d,up)*2.0*focal/viewport.y,zz,z);vColor=c;}`;
const FS=`precision mediump float;uniform float alpha;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,alpha);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const loc={p:gl.getAttribLocation(program,'p'),c:gl.getAttribLocation(program,'c'),eye:gl.getUniformLocation(program,'eye'),right:gl.getUniformLocation(program,'right'),up:gl.getUniformLocation(program,'up'),forward:gl.getUniformLocation(program,'forward'),viewport:gl.getUniformLocation(program,'viewport'),focal:gl.getUniformLocation(program,'focal'),alpha:gl.getUniformLocation(program,'alpha')};
let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(loc.p);gl.enableVertexAttribArray(loc.c);gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(loc.c,3,gl.FLOAT,false,24,12);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.clearColor(.029,.055,.085,1);
const PI=Math.PI,TAU=2*PI,MAX_TIME=180,GAP=55,CA=-205,CR=-55;
const P={start:{x:4,x2:34,y:-40,y2:-12},safe:{x:6,x2:26,y:16,y2:36},road:{x:138,x2:150,y:-45,y2:45},rock:{x:CA+2,x2:CA+23,y:-43,y2:-25},bay:{x:CA+57,x2:CA+93,y:-3,y2:18},warning:{x:CA+5,x2:CA+44,y:12,y2:42}};
// 單一幾何來源：繪圖與物理碰撞使用相同的木條、燈塔尺寸（cm）。
const A_BARS={x:60,x2:105,yBands:[[-19,-15],[14,18]]}; // 兩條均由 60 cm 縮為 45 cm，並為入口留出轉向空間。
const LAMP={x:CA+27,y:29,width:6.5,depth:7.5,height:24}; // 將燈塔向落石滑道側收攏。
const lampBody={x:LAMP.x-LAMP.width/2-.85,x2:LAMP.x+LAMP.width/2+.85,
                y:LAMP.y-LAMP.depth/2-.35,y2:LAMP.y+LAMP.depth/2+3.3};
const V=(x,y,z=0)=>({x,y,z}),add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),mul=(a,n)=>V(a.x*n,a.y*n,a.z*n),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),normal=a=>{let t=Math.hypot(a.x,a.y,a.z)||1;return mul(a,1/t)},clamp=(v,a,b)=>Math.max(a,Math.min(v,b)),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),within=(p,r,z=0)=>p.x-r>=z.x&&p.x+r<=z.x2&&p.y-r>=z.y&&p.y+r<=z.y2;
// Camera: 全部 3D 模型由 GPU 的深度緩衝進行遮擋，不再按面片中心距離排序。
let W=1,H=1,dpr=1,focal=800;let cam={yaw:-1.06,elev:.73,dist:405,target:V(-25,0,3)},eye,right,up,forward;
function cameraBasis(){eye=add(cam.target,V(cam.dist*Math.cos(cam.elev)*Math.cos(cam.yaw),cam.dist*Math.cos(cam.elev)*Math.sin(cam.yaw),cam.dist*Math.sin(cam.elev)));forward=normal(sub(cam.target,eye));right=normal(cross(forward,V(0,0,1)));up=normal(cross(right,forward));focal=Math.min(W*1.02,H*1.50)}

   const ts=targets.filter(t=>t!==pickupBlock&&!t.delivered&&!t.carried&&inScoop(t)&&distance(car,t)<24);

function draw(time){cameraBasis();gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.uniform3f(loc.eye,eye.x,eye.y,eye.z);gl.uniform3f(loc.right,right.x,right.y,right.z);gl.uniform3f(loc.up,up.x,up.y,up.z);gl.uniform3f(loc.forward,forward.x,forward.y,forward.z);gl.uniform2f(loc.viewport,W,H);gl.uniform1f(loc.focal,focal);worldGeometry(time);
// GL depth test replaces painter's algorithm: 斜角不再有假性消失／畫面穿透。
const upload=(data)=>{gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(loc.c,3,gl.FLOAT,false,24,12);gl.drawArrays(gl.TRIANGLES,0,data.length/6)};
gl.disable(gl.BLEND);gl.depthMask(true);gl.uniform1f(loc.alpha,1);upload(verts);
// 高牆透明面按實際視點排序，但仍受已寫入的像素深度約束。

}
function updateUI(force=false){let sc=score();$('totalScore').textContent=String(sc.total);

function frame(ts){let wallDt=Math.max(0,(ts-lastTime)/1000||0);let dt=Math.min(wallDt,.038);lastTime=ts;simulation(dt,wallDt);draw(finished&&modeChoice==='official'?freezeTime:ts);if(ts-uiTime>125){updateUI();uiTime=ts}requestAnimationFrame(frame)}
// Interaction: 游標投影到桌面平面；接觸移動需逐格檢查，不能瞬移穿越牆。
