<style>

.status{position:fixed;right:20px;top:102px;display:grid;gap:7px;z-index:2;pointer-events:none}.status .pill{border-radius:10px;padding:7px 10px;background:rgba(10,20,32,.86);border:1px solid #293a4e;font-size:11px;color:#aac2d1;white-space:nowrap;text-align:right;backdrop-filter:blur(8px)}.pill b{color:white}.pill.alert b{color:var(--red)}

.guide{width:min(380px,42vw);padding:15px 17px}.guide .head{font-size:11px;letter-spacing:1.2px;font-weight:850;color:var(--teal);margin-bottom:7px}.guide p{color:#c4d4e0;margin:0 0 9px;font-size:12px;line-height:1.6;min-height:38px}.keys{display:flex;flex-wrap:wrap;gap:5px}.key{border-radius:5px;padding:3px 6px;background:#25394a;border:1px solid #385366;font-size:10px;color:#c3d7e3}.controls{display:flex;flex-wrap:wrap;gap:7px;padding:10px;justify-content:flex-end;max-width:min(960px,78vw)}.btn{border:1px solid #314a61;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:720;letter-spacing:.1px;color:#d8e8f2;background:#192e42;cursor:pointer;transition:background .15s,transform .15s;white-space:nowrap}.btn:hover{background:#26415a}.btn:active{transform:scale(.97)}.btn.primary{background:#127b7d;color:white;border-color:#30b9b8}.btn.primary:hover{background:#179799}.btn.warn{background:#62431f;border-color:#ad722e;color:#ffe1b3}.btn:disabled{opacity:.43;cursor:default}.btn.compact{font-size:15px;padding:8px 10px}.btn.mode{border-color:#397083;color:#9cf0e5;background:#173640}.btn.mode.testing{background:#493d22;border-color:#a48439;color:#ffdf92}.time{font-variant-numeric:tabular-nums;font-weight:900;font-size:13px;color:#e3eef6;padding:10px 8px;min-width:65px;text-align:center}
.panel{position:fixed;top:102px;right:20px;width:min(350px,calc(100vw - 28px));max-height:calc(100vh - 228px);overflow:auto;z-index:6;background:#101f2e;border:1px solid #345365;box-shadow:0 16px 46px #0009;border-radius:16px;padding:14px 16px;display:none}.panel.visible{display:block}.panel h2{margin:2px 0 13px;font-size:16px}.scorecard{background:#172b3d;border:1px solid #2a4559;border-radius:11px;padding:11px;margin-top:9px}.scorecard .row,.scorecard .detail{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.scorecard .row{font-weight:800;color:#d5edf9;font-size:13px}.scorecard .detail{margin-top:7px;font-size:11px;color:#a8bac8}.scorecard .detail span:last-child{color:#e8eef2;font-variant-numeric:tabular-nums}.scorecard .row strong{color:var(--teal)}.footnote{font-size:11px;color:#819cac;line-height:1.65;padding:9px 1px}.panel .close{float:right;color:#cfe5e8;font-size:18px;border:0;background:transparent;cursor:pointer}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);padding:12px 19px;border-radius:10px;background:#0f2735e8;border:1px solid #318e91;box-shadow:0 12px 30px #0009;z-index:5;font-size:14px;font-weight:700;color:#d4fcf6;pointer-events:none;opacity:0;transition:opacity .24s,transform .24s;text-align:center;max-width:min(400px,90vw)}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 觸控裝置專用虛擬搖桿：有指標且能產生觸控才顯示，避免遮擋桌機視野。 */
#touchDrive{display:none;position:fixed;left:max(13px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:148px;height:148px;z-index:5;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;pointer-events:auto}
.touch-device #touchDrive{display:block}
.joy-ring{position:absolute;inset:8px;border:1.5px solid #427488b8;border-radius:50%;background:radial-gradient(circle at 45% 40%,rgba(37,72,92,.68),rgba(9,25,38,.78) 70%);box-shadow:0 7px 28px #0007,inset 0 0 0 12px rgba(37,63,79,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.joy-ring:before,.joy-ring:after{content:'';position:absolute;pointer-events:none;background:#83c7d0;opacity:.32}
.joy-ring:before{height:1px;left:24px;right:24px;top:50%}
.joy-ring:after{width:1px;top:24px;bottom:24px;left:50%}
.joy-nub{position:absolute;left:50%;top:50%;width:57px;height:57px;border-radius:50%;border:2px solid #71d4d2;background:linear-gradient(150deg,#286676,#153949);box-shadow:0 5px 18px #000b,inset 0 2px 6px #8be8e83d;transform:translate(calc(-50% + var(--joy-x,0px)),calc(-50% + var(--joy-y,0px)));pointer-events:none;transition:background .13s}
.joy-nub:after{content:'';position:absolute;inset:23px;border-radius:50%;background:#bdf3f0;box-shadow:0 0 10px #6bdbdca8}
.joy-dir{position:absolute;color:#abcfdb91;font-size:13px;font-weight:800;line-height:1;pointer-events:none}.joy-dir.up{top:14px;left:50%;transform:translateX(-50%)}.joy-dir.down{bottom:14px;left:50%;transform:translateX(-50%)}.joy-dir.left{left:13px;top:50%;transform:translateY(-50%)}.joy-dir.right{right:13px;top:50%;transform:translateY(-50%)}
#touchDrive.engaged .joy-ring{border-color:#5ddccf;box-shadow:0 7px 28px #0007,inset 0 0 0 1px #5ddccf33}
#touchDrive.engaged .joy-nub{background:linear-gradient(150deg,#328c90,#155365)}
#touchDrive.inactive{opacity:.55}
@media(max-width:800px){.touch-device .bottom{left:173px;right:8px;bottom:calc(15px + env(safe-area-inset-bottom));width:auto;align-items:stretch}.touch-device .controls{max-width:100%;min-width:0}.touch-device .panel{max-height:calc(100vh - 240px)}}

.bottom{left:auto;right:max(13px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:auto;max-width:calc(100vw - 26px);align-items:flex-end}

/* v1.72 — HUD：四項狀態全部無框；分數右側僅留可展開的三角形。 */
.topbar .score{background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-radius:0!important;padding:3px 0 3px 9px!important;gap:9px!important}

.score[aria-expanded="true"] .chev{transform:rotate(180deg)}

.status{top:76px!important;gap:4px!important}

.bottom .controls,.controls{border:0!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-radius:0!important;padding:0!important;overflow:visible!important}
.bottom .controls{gap:7px!important}
.bottom .btn,.bottom .btn.compact,.touch-device .bottom .btn{display:flex!important;align-items:center!important;justify-content:center!important;width:62px!important;height:62px!important;min-width:0!important;min-height:0!important;padding:3px!important;flex:0 0 62px!important;aspect-ratio:1!important;border-radius:50%!important;border:1px solid #55758a9c!important;background:rgba(12,29,45,.20)!important;box-shadow:0 2px 13px #0002!important;color:#e1f0fa!important;white-space:normal!important;text-align:center!important;font-size:12px!important;line-height:1.17!important;font-weight:740!important;letter-spacing:0!important}
.bottom .btn:hover{background:rgba(48,91,117,.24)!important;border-color:#9fc9d0cc!important}
.bottom #modeBtn{color:#80e7db!important;border-color:#67bcb7a6!important}
.bottom #modeBtn.testing{color:#f9d89b!important;border-color:#d5b075a6!important}
.bottom #playBtn{color:#6ce6d9!important;border-color:#66dad3cc!important}
.bottom #resetBtn{font-size:27px!important}

/* 首次進站三秒桌機提示，不佔操作區且不阻擋滑鼠。 */
.keyboard-hint{position:fixed;bottom:108px;left:50%;transform:translate(-50%,8px);display:flex;align-items:center;gap:18px;padding:14px 22px;background:rgba(8,24,38,.84);border:1px solid #48677891;border-radius:17px;z-index:8;pointer-events:none;user-select:none;opacity:0;visibility:hidden;transition:opacity .6s ease,transform .6s ease,visibility .6s}

.hint-group{display:grid;gap:8px;justify-items:center}.hint-keys{display:flex;gap:5px}.hint-keys span{display:grid;place-items:center;width:33px;height:32px;border:1px solid #7898a9;border-radius:7px;background:#223c50;color:#e5f9ff;font-size:15px;font-weight:800;box-shadow:inset 0 -2px 0 #162936}.hint-caption{font-size:12px;color:#b7d4e4;font-weight:650;white-space:nowrap}.hint-separator{height:40px;border-left:1px solid #3c5364}
@media (max-width:800px){.status{right:9px!important;top:68px!important}.status .pill{font-size:11px!important}.score .chev{font-size:14px!important}.bottom .controls{max-width:calc(100vw - 18px)!important}}
@media (max-width:650px){.touch-device .bottom{left:170px!important;right:max(8px,env(safe-area-inset-right))!important;bottom:calc(12px + env(safe-area-inset-bottom))!important;align-items:flex-end!important;width:auto!important}

.touch-device .bottom .btn{width:min(57px,calc((100vw - 164px)/3))!important;height:min(57px,calc((100vw - 164px)/3))!important;flex:none!important;font-size:11px!important}

}

/* v1.91: 重製視覺地形；三主題依然使用相同物理規則。 */

<body>
<canvas id="scene" aria-label="WebGL 立體場地：拖拉車輛、旋轉視角與縮放"></canvas>

 const trial=[[dx,dy,angle]];
 if(Math.abs(dx)>1e-5&&Math.abs(dy)>1e-5){
  // 優先保留較大的切向分量，減少斜向碰撞造成的抖動。

 }

function shapedCoast(cx,seed,kind){

 const isA=cx>0,baseMargin=kind==='island'?(isA?18:30):(isA?36:43);

  const a=(i/n)*TAU,c=Math.cos(a),d=Math.sin(a);
  const r=Math.min(75/Math.max(.0001,Math.abs(c)),45/Math.max(.0001,Math.abs(d)));

  let margin=baseMargin*wiggle;

  if((isA&&c<-.25)||(!isA&&c>.25))margin=Math.min(margin,6.5+2.5*Math.abs(d));
  let edge=r+margin;
  const h=kind==='island'?-.95-1.7*hashTerrain(seed*90+i*2):-1.1-1.5*hashTerrain(seed*70+i*3);
  inner.push(V(cx+c*r,d*r,0));
  coast.push(V(cx+c*edge,d*edge,h));

 }

}
