<!DOCTYPE html>
<html lang="zh-Hant">
<head><script src="/eduGame/ga4.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>說明與投影片</title>
  <style>
    :root {
      --bg-color: #05070a;
      --bg-elevated: #111827;
      --bg-elevated-soft: #0b1120;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.1);
      --accent-hover: #16a34a;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.7));
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-icon {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #22c55e, #0f766e 60%, #0b1120 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.65);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease-out;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #020617;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.6);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(34, 197, 94, 0.45);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .btn-ghost:hover {
      border-color: rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
    }

    .btn span.icon {
      font-size: 1rem;
      line-height: 1;
    }

    main {
      flex: 1;
      padding: 14px 0 0;
    }

    .card {
      background: radial-gradient(circle at top left, #020617 0, #020617 40%, #050816 100%);
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.8);
      padding: 18px 18px 20px;
      min-height: 260px;
      overflow: visible;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: var(--text-muted);
    }

    #status {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      min-height: 1.2em;
    }

    .markdown-body {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-main);
      max-height: calc(100vh - 220px);
      overflow: auto;
      padding-right: 4px;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: #f9fafb;
      font-weight: 600;
      margin-top: 1.1em;
      margin-bottom: 0.4em;
    }

    .markdown-body h1 {
      font-size: 1.4rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.3em;
    }

    .markdown-body h2 {
      font-size: 1.2rem;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 0.2em;
    }

    .markdown-body h3 {
      font-size: 1.05rem;
    }

    .markdown-body p {
      margin: 0.4em 0;
    }

    .markdown-body a {
      color: #4ade80;
      text-decoration: none;
      border-bottom: 1px dashed rgba(74, 222, 128, 0.7);
    }

    .markdown-body a:hover {
      border-bottom-style: solid;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.25em;
      margin: 0.35em 0;
      list-style-position: inside;
    }

    .markdown-body li {
      margin: 0.2em 0;
    }

    .markdown-body code {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
        "Courier New", monospace;
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 4px;
      padding: 0.12em 0.35em;
      border: 1px solid rgba(30, 64, 175, 0.7);
    }

    .markdown-body pre {
      background: #020617;
      border-radius: 8px;
      padding: 10px 12px;
      overflow: auto;
      border: 1px solid rgba(30, 64, 175, 0.7);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 0.8rem;
    }

    .markdown-body blockquote {
      margin: 0.4em 0;
      padding: 0.35em 0.85em;
      border-left: 3px solid #4b5563;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 4px;
      color: #d1d5db;
    }

    .markdown-body table {
      border-collapse: collapse;
      margin: 0.6em 0;
      width: 100%;
      font-size: 0.85rem;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid #1f2937;
      padding: 6px 8px;
    }

    .markdown-body th {
      background: #020617;
      font-weight: 600;
    }

    .markdown-body tr:nth-child(even) td {
      background: rgba(15, 23, 42, 0.9);
    }
    .markdown-body img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 8px auto;
      border-radius: 8px;
    }

    .scroll-hint {
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
      margin-top: 4px;
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions {
        width: 100%;
        justify-content: flex-start;
      }
      .btn {
        flex: 1 1 auto;
        justify-content: center;
      }
    }
  </style>

  <!-- Markdown 解析器（使用 CDN 的 marked.js） -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="page">
    <header>
      <div class="title-block">
        <div class="title">
          <span class="title-icon">◎</span>
          <span>課程說明與投影片</span>
        </div>
        <div class="subtitle">readme.md 會自動載入，slide.pdf 可直接下載。</div>
      </div>

      <div class="actions">
        <a href="/eduGame/games/ai-game-maker/media/slide.pdf" class="btn btn-primary" download>
          <span class="icon">⬇️</span>
          <span>下載投影片（PDF）</span>
        </a>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="card-header">
          <div class="card-title">
            <span>📄 說明文件（readme.md）</span>
          </div>
          <div class="status-pill" id="status-pill">等待載入…</div>
        </div>
        <div id="status"></div>
        <article id="markdown" class="markdown-body">
          <!-- readme.md 的內容會載入在這裡 -->
        </article>
        <div class="scroll-hint">（若內容較長，可向下捲動）</div>
      </section>
    </main>
  </div>

  <script>
    async function loadReadme() {
      const statusEl = document.getElementById("status");
      const statusPill = document.getElementById("status-pill");
      const mdContainer = document.getElementById("markdown");

      statusEl.textContent = "正在讀取 readme.md…";
      statusPill.textContent = "載入中";

      try {
        const res = await fetch("readme.md", { cache: "no-cache" });
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        const text = await res.text();

        // 使用 marked 將 Markdown 轉成 HTML
        if (window.marked) {
          mdContainer.innerHTML = marked.parse(text);
        } else {
          // 若 marked 沒載到，就直接顯示純文字
          mdContainer.textContent = text;
        }

        statusEl.textContent = "";
        statusPill.textContent = "載入完成";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "讀取 readme.md 失敗，請確認檔案是否存在於同一資料夾。";
        statusPill.textContent = "載入失敗";
        mdContainer.innerHTML =
          "<p>找不到 <code>readme.md</code>。請確認檔案已放在與 <code>index.html</code> 相同的資料夾中。</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", loadReadme);
  </script>
</body>
</html>
