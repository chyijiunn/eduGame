<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
  <title>proha v0.1｜捷克自助旅行語言卡</title>
  <style>
    :root{
      --bg:#07111f;
      --bg2:#0f1c31;
      --card:rgba(255,255,255,.08);
      --card2:rgba(255,255,255,.12);
      --line:rgba(255,255,255,.12);
      --text:#f5f8ff;
      --sub:#b7c2d9;
      --muted:#8fa0bf;
      --accent:#7c9cff;
      --accent2:#8ef0c7;
      --accent3:#ffd27d;
      --danger:#ff8f8f;
      --shadow:0 18px 48px rgba(0,0,0,.28);
      --radius:22px;
      --radius-sm:16px;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:radial-gradient(circle at top,#14284b 0%, #091321 40%, #050c16 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;touch-action:pan-x pan-y pinch-zoom}
    body{min-height:100vh}
    button,input,select{font:inherit}
    button{touch-action:manipulation}
    .app{max-width:920px;margin:0 auto;padding:calc(14px + var(--safe-top)) 14px calc(88px + var(--safe-bottom))}
    .hero{
      background:linear-gradient(180deg,rgba(124,156,255,.20),rgba(142,240,199,.08));
      border:1px solid rgba(255,255,255,.12);
      border-radius:28px;
      padding:18px;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .hero:before,.hero:after{
      content:"";position:absolute;border-radius:999px;filter:blur(18px);opacity:.45;pointer-events:none;
    }
    .hero:before{width:180px;height:180px;right:-50px;top:-50px;background:#7c9cff}
    .hero:after{width:160px;height:160px;left:-50px;bottom:-70px;background:#8ef0c7}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
    .title{font-size:clamp(1.5rem,4vw,2.3rem);font-weight:800;letter-spacing:.02em}
    .subtitle{margin-top:6px;color:var(--sub);font-size:.98rem;line-height:1.55}
    .version{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);font-size:.9rem;white-space:nowrap}
    .quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;position:relative;z-index:1}
    .pill-btn,.tab,.chip,.action-btn,.seg-btn,.ghost-btn{
      border:none;background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:11px 14px;cursor:pointer;border:1px solid rgba(255,255,255,.10);transition:.18s transform,.18s background,.18s border-color,.18s opacity;
    }
    .pill-btn:active,.tab:active,.chip:active,.action-btn:active,.seg-btn:active,.ghost-btn:active,.icon-btn:active,.fav-btn:active{transform:scale(.98)}
    .pill-btn.active,.tab.active,.chip.active,.seg-btn.active{background:linear-gradient(135deg,rgba(124,156,255,.30),rgba(142,240,199,.18));border-color:rgba(142,240,199,.45)}
    .topbar{position:sticky;top:0;z-index:30;padding-top:10px;background:linear-gradient(180deg,rgba(5,12,22,.96),rgba(5,12,22,.78) 75%,rgba(5,12,22,0));backdrop-filter:blur(14px)}
    .search-wrap{display:flex;gap:10px;align-items:center;margin-top:12px}
    .search{
      flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:13px 14px;border-radius:18px;box-shadow:0 12px 24px rgba(0,0,0,.15)
    }
    .search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:1rem}
    .search input::placeholder{color:#97a7c7}
    .icon-btn,.fav-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}
    .tab-row,.chip-row,.seg-row{display:flex;gap:10px;overflow:auto;padding:12px 2px 2px;scrollbar-width:none}
    .tab-row::-webkit-scrollbar,.chip-row::-webkit-scrollbar,.seg-row::-webkit-scrollbar{display:none}
    .tab{white-space:nowrap;font-weight:700}
    .chip{white-space:nowrap;font-size:.95rem;padding:10px 13px}
    .seg{margin-top:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;overflow:auto}
    .seg-btn{white-space:nowrap;padding:10px 14px;background:transparent}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;position:relative;z-index:1}
    .meta-card{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
    .meta-card .small{color:var(--muted);font-size:.83rem}
    .meta-card strong{display:block;margin-top:4px;font-size:1rem}
    .panel{margin-top:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:var(--shadow)}
    .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
    .section-title{font-size:1.2rem;font-weight:800}
    .section-desc{color:var(--sub);font-size:.94rem;line-height:1.55;margin-top:4px}
    .hint{font-size:.88rem;color:var(--muted)}
    .voice-status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-size:.84rem;color:var(--sub);white-space:nowrap}
    .dot{width:9px;height:9px;border-radius:50%;background:#ffd27d;box-shadow:0 0 0 6px rgba(255,210,125,.12)}
    .dot.ok{background:#8ef0c7;box-shadow:0 0 0 6px rgba(142,240,199,.10)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid.words,.grid.phonetics{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      padding:14px;
      position:relative;
      min-height:174px;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:hidden;
    }
    .card::after{
      content:"";position:absolute;right:-40px;top:-40px;width:100px;height:100px;background:radial-gradient(circle,#7c9cff44 0%, transparent 68%);pointer-events:none
    }
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:var(--sub);font-size:.78rem;width:max-content}
    .cz{font-size:1.32rem;font-weight:800;line-height:1.25;word-break:break-word}
    .phoneme{font-size:1.6rem;letter-spacing:.02em}
    .zh{font-size:1rem;color:#f4f6ff}
    .pron{color:var(--accent3);font-size:.92rem;line-height:1.45}
    .note{color:var(--sub);font-size:.9rem;line-height:1.55;flex:1}
    .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
    .action-btn{padding:10px 12px;border-radius:14px;font-size:.92rem}
    .action-btn.primary{background:linear-gradient(135deg,#7c9cff,#65b8ff);border-color:transparent;color:#06111f;font-weight:800}
    .action-btn.secondary{background:rgba(255,255,255,.08)}
    .empty{padding:20px;border:1px dashed rgba(255,255,255,.18);border-radius:22px;color:var(--sub);text-align:center;background:rgba(255,255,255,.03)}
    .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
    .tip-card{padding:14px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
    .tip-card h4{margin:0 0 8px;font-size:1rem}
    .tip-card p{margin:0;color:var(--sub);line-height:1.55;font-size:.92rem}
    .bottom-nav{
      position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-bottom));z-index:40;
      width:min(880px,calc(100vw - 20px));padding:8px;background:rgba(10,18,31,.82);border:1px solid rgba(255,255,255,.12);border-radius:24px;backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:var(--shadow)
    }
    .nav-btn{background:transparent;border:none;color:var(--sub);padding:10px 8px;border-radius:16px;font-weight:700;cursor:pointer}
    .nav-btn.active{background:rgba(255,255,255,.10);color:var(--text)}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:102px;z-index:60;background:rgba(0,0,0,.82);color:#fff;padding:12px 16px;border-radius:999px;font-size:.92rem;opacity:0;pointer-events:none;transition:.24s opacity,.24s transform;max-width:min(92vw,520px);text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .stats{display:flex;gap:8px;flex-wrap:wrap}
    .tiny{font-size:.82rem;color:var(--muted)}
    @media (max-width:640px){
      .grid,.grid.words,.grid.phonetics,.mini-grid,.meta{grid-template-columns:1fr}
      .hero{padding:16px}
      .title{font-size:1.45rem}
      .subtitle{font-size:.95rem}
      .section-head{flex-direction:column;align-items:flex-start}
      .bottom-nav{grid-template-columns:repeat(4,1fr)}
      .nav-btn{font-size:.84rem}
    }
    @media (min-width:860px){
      .grid.words{grid-template-columns:repeat(3,minmax(0,1fr))}
      .grid.phonetics{grid-template-columns:repeat(3,minmax(0,1fr))}
      .grid.sentences{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="title">proha v0.1</div>
          <div class="subtitle">捷克自助旅行捷克語教學網頁。手機優先、單檔可開、可搜尋、可收藏、可按鈕發音。支援瀏覽器原生雙指縮放與拖曳頁面、單指點選操作。</div>
        </div>
        <div class="version">CZ Travel Cards</div>
      </div>
      <div class="quick-actions">
        <button class="pill-btn" id="playRandomBtn">🎲 隨機一句</button>
        <button class="pill-btn" id="playFavBtn">⭐ 播放收藏</button>
        <button class="pill-btn" id="resetBtn">↺ 清除搜尋</button>
      </div>
      <div class="meta">
        <div class="meta-card"><span class="small">音標與常見字</span><strong id="metaPhonetics">0 筆</strong></div>
        <div class="meta-card"><span class="small">旅行單字卡</span><strong id="metaWords">0 筆</strong></div>
        <div class="meta-card"><span class="small">旅行句型</span><strong id="metaSentences">0 筆</strong></div>
      </div>
    </section>

    <div class="topbar">
      <div class="search-wrap">
        <label class="search" for="searchInput">
          <span>🔎</span>
          <input id="searchInput" type="text" placeholder="搜尋捷克文、中文、發音提示，例如：票、záchod、metro" />
        </label>
        <button class="icon-btn" id="clearFavFilterBtn" title="顯示全部">∞</button>
        <button class="icon-btn" id="favOnlyBtn" title="只看收藏">⭐</button>
      </div>
      <div class="tab-row" id="tabRow"></div>
      <div class="chip-row" id="categoryRow"></div>
    </div>

    <section class="panel">
      <div class="section-head">
        <div>
          <div class="section-title" id="sectionTitle">音標教學</div>
          <div class="section-desc" id="sectionDesc">先熟悉捷克語字母與常見旅遊字，再切到單字與句型會更快上手。</div>
        </div>
        <div class="voice-status" id="voiceStatus"><span class="dot" id="voiceDot"></span><span id="voiceText">正在檢查捷克語語音</span></div>
      </div>
      <div class="seg" id="segmentRow"></div>
      <div id="contentArea"></div>
      <div class="mini-grid">
        <div class="tip-card">
          <h4>使用方式</h4>
          <p>點卡片上的「🔊 發音」會用瀏覽器的 Czech / cs-CZ 語音朗讀。若你的裝置沒有捷克語音，仍會嘗試播放，但準確度可能受系統語音影響。</p>
        </div>
        <div class="tip-card">
          <h4>我幫你加的分類</h4>
          <p>除了日常口語、交通、飲食，我另外加入「住宿、購物、緊急」兩組旅行最常用的應急內容，出國會更實用。</p>
        </div>
      </div>
    </section>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-tab="phonetics">音標</button>
    <button class="nav-btn" data-tab="words">單字</button>
    <button class="nav-btn" data-tab="sentences">句型</button>
    <button class="nav-btn" data-tab="favorites">收藏</button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const phonetics = [
      {id:'ph-a', group:'母音', cz:'A / a', zh:'像「阿」', pron:'短母音，嘴巴自然張開。例：ano（是）', note:'捷克語多數字母一個字母對應一個主要音值，初學者先把母音念穩。', say:'a ano'},
      {id:'ph-e', group:'母音', cz:'E / e', zh:'像短「欸／ㄝ」', pron:'例：ne（不）', note:'保持短促清楚，不要拖得太長。', say:'e ne'},
      {id:'ph-i', group:'母音', cz:'I / Í / Y / Ý', zh:'都接近「依」', pron:'i、y 在發音上很接近；長音 í、ý 會更長。', note:'初學先把它們都抓成「依」，再慢慢熟悉拼字規則。', say:'i í y ý'},
      {id:'ph-o', group:'母音', cz:'O / o', zh:'像「喔」', pron:'例：dobrý den 的 do-、prosím 的 pro-', note:'唇形比中文更圓、更穩。', say:'o dobrý den prosím'},
      {id:'ph-u', group:'長母音', cz:'U / Ú / Ů', zh:'像「烏」', pron:'ú、ů 都是長音。例：dům、kůň', note:'看到長音符號時，母音時間拉長一點。', say:'u ú ů'},
      {id:'ph-long', group:'長母音', cz:'Á É Í Ó Ú Ý', zh:'長母音', pron:'長音會比短母音多停一拍。', note:'旅遊中像 nádraží、dobrý、pivo 的節奏會更自然。', say:'á é í ó ú ý'},
      {id:'ph-c', group:'特殊字母', cz:'Č / č', zh:'像英文 church 的 ch', pron:'例：čaj（茶）、česky（捷克語）', note:'常出現在旅遊常用字裡，很重要。', say:'č čaj česky'},
      {id:'ph-s', group:'特殊字母', cz:'Š / š', zh:'像 sh', pron:'例：šest（六）', note:'舌頭位置比中文「ㄒ」更靠後。', say:'š šest'},
      {id:'ph-z', group:'特殊字母', cz:'Ž / ž', zh:'像英文 measure 裡的 zh', pron:'例：nádraží（車站）最後的 ží', note:'中文沒有完全對應音，先抓成「日／熱」之間的摩擦音。', say:'ž nádraží'},
      {id:'ph-rz', group:'特殊字母', cz:'Ř / ř', zh:'捷克語招牌難音', pron:'像 r 與 ž 混合的顫音。例：Dvořák', note:'先不必追求完美，旅行時能辨認即可。', say:'ř Dvořák'},
      {id:'ph-soft', group:'特殊字母', cz:'Ě / Ď / Ť / Ň', zh:'軟化音', pron:'會讓前面的音更柔、更貼近硬顎。', note:'旅遊常見如 děkuji、něco、letiště。', say:'děkuji něco letiště'},
      {id:'ph-ch', group:'特殊字母', cz:'CH / ch', zh:'像德文 Bach 的喉音', pron:'不是 c+h，而是一個獨立音。例：záchod', note:'喉嚨後方摩擦出聲。', say:'ch záchod'},
      {id:'ph-stress', group:'規則', cz:'重音', zh:'多半落在第一音節', pron:'例如 PRO-sím、DO-brý den', note:'初學只要記得大多數字的第一拍重，就會自然很多。', say:'prosím dobrý den děkuji'},
      {id:'ph-signs', group:'常見字', cz:'Otevřeno / Zavřeno', zh:'營業中 / 打烊', pron:'商店門口很常見', note:'旅途中看到招牌就能快速判斷店家是否營業。', say:'otevřeno zavřeno'},
      {id:'ph-signs2', group:'常見字', cz:'Vchod / Východ', zh:'入口 / 出口', pron:'交通站、百貨、建築物常見', note:'在車站或大型建築物很實用。', say:'vchod východ'},
      {id:'ph-signs3', group:'常見字', cz:'WC / Záchod', zh:'廁所', pron:'záchod 很常用', note:'只要先會這個字，旅行壓力會瞬間下降。', say:'záchod'}
    ];

    const words = [
      {id:'w-ano', category:'日常口語', cz:'Ano', zh:'是', pron:'AH-noh', note:'最基本的肯定回答。', say:'Ano'},
      {id:'w-ne', category:'日常口語', cz:'Ne', zh:'不', pron:'neh', note:'拒絕、否定都會用到。', say:'Ne'},
      {id:'w-prosim', category:'日常口語', cz:'Prosím', zh:'請／麻煩了', pron:'PRO-seem', note:'也可能有「請說、給你」的語感。', say:'Prosím'},
      {id:'w-dekuji', category:'日常口語', cz:'Děkuji', zh:'謝謝', pron:'DYEH-koo-yih', note:'正式、穩妥的說法。', say:'Děkuji'},
      {id:'w-prominte', category:'日常口語', cz:'Promiňte', zh:'不好意思／借過', pron:'PROH-mih-nyteh', note:'叫人、打擾、要發問時很好用。', say:'Promiňte'},
      {id:'w-ahoj', category:'日常口語', cz:'Ahoj', zh:'嗨', pron:'ahoy', note:'偏口語、朋友間使用。', say:'Ahoj'},
      {id:'w-dd', category:'日常口語', cz:'Dobrý den', zh:'您好', pron:'DOH-bree den', note:'最安全、最好用的正式招呼。', say:'Dobrý den'},
      {id:'w-ns', category:'日常口語', cz:'Na shledanou', zh:'再見', pron:'NAHSH-leh-dah-noh', note:'離開店家、櫃台時很常用。', say:'Na shledanou'},
      {id:'w-nerozumim', category:'日常口語', cz:'Nerozumím', zh:'我聽不懂', pron:'NEH-roh-zoo-meem', note:'不懂就先丟這句，對方通常會放慢。', say:'Nerozumím'},
      {id:'w-anglicky', category:'日常口語', cz:'Anglicky', zh:'英文', pron:'AHN-glihts-kee', note:'可搭配 Mluvíte anglicky? 使用。', say:'anglicky'},

      {id:'w-vlak', category:'交通', cz:'Vlak', zh:'火車', pron:'vlahk', note:'車站與班次查詢常會看到。', say:'vlak'},
      {id:'w-autobus', category:'交通', cz:'Autobus', zh:'公車／巴士', pron:'OW-toh-boos', note:'城市內外交通都常見。', say:'autobus'},
      {id:'w-metro', category:'交通', cz:'Metro', zh:'地鐵', pron:'MEH-troh', note:'布拉格很常用。', say:'metro'},
      {id:'w-nadrazi', category:'交通', cz:'Nádraží', zh:'車站', pron:'NAH-drah-zhee', note:'火車站、公車站常見核心字。', say:'nádraží'},
      {id:'w-letiste', category:'交通', cz:'Letiště', zh:'機場', pron:'LEH-tihsh-tyeh', note:'問路與轉機都會用到。', say:'letiště'},
      {id:'w-jizdenka', category:'交通', cz:'Jízdenka', zh:'車票', pron:'YEEZ-dehn-kah', note:'交通購票最重要單字之一。', say:'jízdenka'},
      {id:'w-zastavka', category:'交通', cz:'Zastávka', zh:'站牌／停靠站', pron:'zahs-TAHV-kah', note:'下一站也會看到這個字根。', say:'zastávka'},
      {id:'w-centrum', category:'交通', cz:'Centrum', zh:'市中心', pron:'TSEN-trum', note:'觀光問路常用。', say:'centrum'},
      {id:'w-taxi', category:'交通', cz:'Taxík', zh:'計程車', pron:'TAHK-seek', note:'招車時很直觀。', say:'taxík'},
      {id:'w-prestup', category:'交通', cz:'Přestup', zh:'轉乘', pron:'PRZHEH-stoop', note:'看路線圖時很實用。', say:'přestup'},

      {id:'w-voda', category:'飲食', cz:'Voda', zh:'水', pron:'VOH-dah', note:'最基本飲料。', say:'voda'},

    const state = {

      favOnly: false,

    };

    const tabConfig = {
      phonetics: {label:'音標教學', desc:'字母、重音、常見旅遊字，先練聲音再背單字。'},
      words: {label:'單字卡', desc:'依情境分類的旅行高頻單字，適合快速複習。'},
      sentences: {label:'旅行句型', desc:'直接可用的完整句子，問路、點餐、住宿都能上。'},
      favorites: {label:'收藏清單', desc:'你按星號收藏的音標、單字、句型都會集中在這裡。'}
    };

    const tabRow = document.getElementById('tabRow');
    const categoryRow = document.getElementById('categoryRow');
    const segmentRow = document.getElementById('segmentRow');
    const contentArea = document.getElementById('contentArea');
    const searchInput = document.getElementById('searchInput');
    const sectionTitle = document.getElementById('sectionTitle');
    const sectionDesc = document.getElementById('sectionDesc');
    const toast = document.getElementById('toast');
    const voiceText = document.getElementById('voiceText');
    const voiceDot = document.getElementById('voiceDot');

    document.getElementById('metaPhonetics').textContent = `${phonetics.length} 筆`;
    document.getElementById('metaWords').textContent = `${words.length} 筆`;
    document.getElementById('metaSentences').textContent = `${sentences.length} 筆`;

    function saveFavorites(){
      localStorage.setItem('proha_v0.1_favorites', JSON.stringify(state.favorites));
    }

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(()=>toast.classList.remove('show'), 1800);
    }

    function isFavorite(id){
      return state.favorites.includes(id);
    }

    function toggleFavorite(id){
      if(isFavorite(id)){
        state.favorites = state.favorites.filter(x => x !== id);
        showToast('已取消收藏');
      }else{
        state.favorites.push(id);
        showToast('已加入收藏');
      }
      saveFavorites();
      render();
    }

    function escapeHtml(str=''){
      return str.replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
    }

    function getCurrentData(){
      if(state.tab === 'phonetics') return phonetics;
      if(state.tab === 'words') return words;
      if(state.tab === 'sentences') return sentences;
      const all = [
        ...phonetics.map(x=>({...x,_type:'音標'})),
        ...words.map(x=>({...x,_type:'單字'})),
        ...sentences.map(x=>({...x,_type:'句型'}))
      ];
      return all.filter(x => isFavorite(x.id));
    }

    function getSegments(){
      if(state.tab === 'phonetics') return ['全部','母音','長母音','特殊字母','規則','常見字'];
      if(state.tab === 'favorites') return ['全部','音標','單字','句型'];
      return ['全部','日常口語','交通','飲食','住宿','購物','緊急'];
    }

    function applyFilters(items){
      const q = state.search.trim().toLowerCase();
      return items.filter(item => {
        const segOk = state.segment === '全部'
          || (state.tab === 'favorites' && state.segment !== '全部' && item._type === state.segment)
          || item.group === state.segment
          || item.category === state.segment;
        const favOk = !state.favOnly || isFavorite(item.id);
        const hay = `${item.cz || ''} ${item.zh || ''} ${item.pron || ''} ${item.note || ''} ${item.group || ''} ${item.category || ''} ${item._type || ''}`.toLowerCase();
        const qOk = !q || hay.includes(q);
        return segOk && favOk && qOk;
      });
    }

    function renderTabs(){
      const tabs = [
        ['phonetics','音標'],
        ['words','單字'],
        ['sentences','句型'],
        ['favorites','收藏']
      ];
      tabRow.innerHTML = tabs.map(([key,label]) => `<button class="tab ${state.tab===key?'active':''}" data-tab="${key}">${label}</button>`).join('');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === state.tab));
    }

    function renderCategories(){
      const suggestions = state.tab === 'phonetics'
        ? ['重音','特殊字母','廁所','車站']
        : state.tab === 'favorites'
          ? ['收藏複習','快速回聽','旅行前總整理']
          : ['先背日常','再練交通','最後練住宿'];
      categoryRow.innerHTML = suggestions.map(text => `<span class="chip">${text}</span>`).join('');
      const segments = getSegments();
      segmentRow.innerHTML = segments.map(seg => `<button class="seg-btn ${state.segment===seg?'active':''}" data-seg="${seg}">${seg}</button>`).join('');
    }

    function cardHeaderTag(item){
      return item.group || item.category || item._type || '卡片';
    }

    function makeFavoriteBtn(item){
      return `<button class="action-btn secondary" data-fav="${item.id}">${isFavorite(item.id)?'★ 已收藏':'☆ 收藏'}</button>`;
    }

    function renderPhonetics(items){
      if(!items.length) return `<div class="empty">沒有符合的內容，試試看搜尋別的字，或取消收藏篩選。</div>`;
      return `<div class="grid phonetics">${items.map(item => `
        <article class="card">
          <div class="card-head">
            <span class="badge">${escapeHtml(cardHeaderTag(item))}</span>
          </div>
          <div class="cz phoneme">${escapeHtml(item.cz)}</div>
          <div class="zh">${escapeHtml(item.zh)}</div>
          <div class="pron">${escapeHtml(item.pron)}</div>
          <div class="note">${escapeHtml(item.note)}</div>
          <div class="card-actions">
            <button class="action-btn primary" data-say="${escapeHtml(item.say || item.cz)}">🔊 發音</button>
            ${makeFavoriteBtn(item)}
          </div>
        </article>
      `).join('')}</div>`;
    }

    function renderWords(items){
      if(!items.length) return `<div class="empty">目前沒有符合的單字。可以搜尋中文、捷克文或發音提示。</div>`;
      return `<div class="grid words">${items.map(item => `
        <article class="card">
          <div class="card-head">
            <span class="badge">${escapeHtml(item.category)}</span>
          </div>
          <div class="cz">${escapeHtml(item.cz)}</div>
          <div class="zh">${escapeHtml(item.zh)}</div>
          <div class="pron">${escapeHtml(item.pron)}</div>
          <div class="note">${escapeHtml(item.note)}</div>
          <div class="card-actions">
            <button class="action-btn primary" data-say="${escapeHtml(item.say || item.cz)}">🔊 發音</button>
            ${makeFavoriteBtn(item)}
          </div>
        </article>
      `).join('')}</div>`;
    }

    function renderSentences(items){
      if(!items.length) return `<div class="empty">目前沒有符合的句型。你可以搜尋「票、刷卡、房間、醫生」等關鍵字。</div>`;
      return `<div class="grid sentences">${items.map(item => `
        <article class="card">
          <div class="card-head">
            <span class="badge">${escapeHtml(item.category || item._type || '句型')}</span>
          </div>
          <div class="cz">${escapeHtml(item.cz)}</div>
          <div class="zh">${escapeHtml(item.zh)}</div>
          <div class="pron">${escapeHtml(item.pron)}</div>
          <div class="note">${escapeHtml(item.note)}</div>
          <div class="card-actions">
            <button class="action-btn primary" data-say="${escapeHtml(item.say || item.cz)}">🔊 發音</button>
            ${makeFavoriteBtn(item)}
          </div>
        </article>
      `).join('')}</div>`;
    }

    function renderFavoritesSummary(items){
      const groups = {
        音標: items.filter(x=>x._type==='音標').length,
        單字: items.filter(x=>x._type==='單字').length,
        句型: items.filter(x=>x._type==='句型').length,
      };
      return `
        <div class="stats" style="margin-bottom:12px;">
          <span class="badge">音標 ${groups.音標}</span>
          <span class="badge">單字 ${groups.單字}</span>
          <span class="badge">句型 ${groups.句型}</span>
          <span class="badge">總收藏 ${items.length}</span>
        </div>
      `;
    }

    function render(){
      renderTabs();
      renderCategories();
      searchInput.value = state.search;
      sectionTitle.textContent = tabConfig[state.tab].label;
      sectionDesc.textContent = tabConfig[state.tab].desc;

      let items = getCurrentData();
      items = applyFilters(items);

      if(state.tab === 'phonetics'){
        contentArea.innerHTML = renderPhonetics(items);
      }else if(state.tab === 'words'){
        contentArea.innerHTML = renderWords(items);
      }else if(state.tab === 'sentences'){
        contentArea.innerHTML = renderSentences(items);
      }else{
        contentArea.innerHTML = renderFavoritesSummary(items) + renderSentences(items);
      }
    }

    let cachedVoices = [];
    let bestVoice = null;

    function updateVoiceStatus(){
      cachedVoices = speechSynthesis.getVoices();
      bestVoice = cachedVoices.find(v => /^cs(-|_)?/i.test(v.lang) || /czech/i.test(v.name)) || null;
      if(bestVoice){
        voiceText.textContent = `已找到捷克語語音：${bestVoice.name}`;
        voiceDot.classList.add('ok');
      }else{
        voiceText.textContent = '未偵測到專用捷克語音，仍可嘗試播放';
        voiceDot.classList.remove('ok');
      }
    }

    function speak(text){
      if(!('speechSynthesis' in window)){
        showToast('這個瀏覽器不支援語音朗讀');
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = bestVoice ? bestVoice.lang : 'cs-CZ';
      if(bestVoice) u.voice = bestVoice;
      u.rate = 0.9;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }

    function pickRandomSentence(){
      const pool = sentences;
      const item = pool[Math.floor(Math.random() * pool.length)];
      speak(item.say || item.cz);
      showToast(`隨機句型：${item.cz}`);
    }

    function speakFavorites(){
      const all = [...phonetics, ...words, ...sentences].filter(x => isFavorite(x.id));
      if(!all.length){
        showToast('你還沒有收藏內容');
        return;
      }
      const item = all[Math.floor(Math.random() * all.length)];
      speak(item.say || item.cz);
      showToast(`播放收藏：${item.cz}`);
    }

    tabRow.addEventListener('click', e => {
      const btn = e.target.closest('[data-tab]');
      if(!btn) return;
      state.tab = btn.dataset.tab;
      state.segment = '全部';
      render();
    });

    document.getElementById('bottomNav').addEventListener('click', e => {
      const btn = e.target.closest('[data-tab]');
      if(!btn) return;
      state.tab = btn.dataset.tab;
      state.segment = '全部';
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    });

    segmentRow.addEventListener('click', e => {
      const btn = e.target.closest('[data-seg]');
      if(!btn) return;
      state.segment = btn.dataset.seg;
      render();
    });

    contentArea.addEventListener('click', e => {
      const sayBtn = e.target.closest('[data-say]');
      if(sayBtn){
        speak(sayBtn.dataset.say);
        return;
      }
      const favBtn = e.target.closest('[data-fav]');
      if(favBtn){
        toggleFavorite(favBtn.dataset.fav);
      }
    });

    searchInput.addEventListener('input', e => {
      state.search = e.target.value;
      render();
    });

    document.getElementById('playRandomBtn').addEventListener('click', pickRandomSentence);
    document.getElementById('playFavBtn').addEventListener('click', speakFavorites);
    document.getElementById('resetBtn').addEventListener('click', () => {
      state.search = '';
      state.segment = '全部';
      state.favOnly = false;
      render();
      showToast('已重設搜尋與篩選');
    });

    document.getElementById('favOnlyBtn').addEventListener('click', () => {
      state.favOnly = !state.favOnly;
      showToast(state.favOnly ? '已切換為只看收藏' : '已顯示全部內容');
      render();
    });

    document.getElementById('clearFavFilterBtn').addEventListener('click', () => {
      state.favOnly = false;
      render();
      showToast('已顯示全部內容');
    });

    window.speechSynthesis?.addEventListener?.('voiceschanged', updateVoiceStatus);
    updateVoiceStatus();
    render();
  </script>
</body>
</html>
