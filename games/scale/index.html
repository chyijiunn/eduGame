<!doctype html>
<html lang="zh-Hant">
<head><script src="/eduGame/ga4.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darwin Flash</title>

  <!-- Ruffle：一行就夠 -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    .wrap { height: 100%; display: grid; place-items: center; }
    /* 你可以改成固定 800x600，或用 100% 滿版 */
    .player { width: min(100vw, 1000px); aspect-ratio: 4 / 3; }
    @media (max-aspect-ratio: 4/3) { .player { width: 100vw; height: auto; } }
    @media (min-aspect-ratio: 4/3) { .player { height: 100vh; width: auto; } }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Ruffle 會自動接管 object/embed -->
    <object class="player"
            data="scale.swf"
            type="application/x-shockwave-flash">
    </object>
  </div>
</body>
</html>
