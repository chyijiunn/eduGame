<script>
(() => {
  'use strict';

  const APP_VERSION = '0.20';

  const README_MD = `# 流體壓力 操作說明

## 主題
這個互動頁面目前有三個主題：**器壁液壓**、**連通管**、**大氣壓力**。

## 基本操作
- 上方頁籤可以切換三個主題。
- 下方控制列有 **重置、暫停 / 播放、下一個、灌水、鑽孔工具、繪圖工具、說明**。
- 畫面固定，不提供縮放、旋轉或平移舞台。
- 只有工具本身可以操作：繪圖工具可畫線，鑽孔工具可拖曳針；在大氣壓力場景中，開啟針筒後會出現灌氣與抽氣按鈕。

## 器壁液壓
### 杯子
- 按 **💧** 灌水，水龍頭會往杯中加水。
- 按 **⊙** 後，針會從右邊出現，往左戳破杯壁。
- 洞越低，水噴得通常越遠。

### 水球
- 灌水後水球會變大，水太多會爆掉。
- 破洞後，洞會跟著水球的大小一起移動。

### 水壩
- 左邊是河道，右邊是梯形水壩。
- 針從右側戳入會形成水平貫通孔。
- 位置越低，水流越強。

## 連通管
- 這個主題只有一個舞台。
- 按 **✎** 後，可以在舞台上畫出一條開口容器曲線，系統會把這條曲線視為容器壁；曲線不會被強制封閉。
- 按 **💧** 後，上方水龍頭會開始加水，容器內會盛水。
- 按 **⊙** 後，針會從上方出現，往下戳穿你畫出的器壁。
- 若洞口低於液面，水會**垂直向上噴出**；噴到最高的位置，會和容器內的最高液面一樣高。
- 隨著液面下降，噴泉的高度也會跟著下降。
- 洞越多，失水越快。
- 若容器線段沒有形成封閉輪廓，水位碰到開口端時會從開口漏出；封閉容器則只會從孔洞漏水。
- 灌入液體後，可以直接拖拉已畫好的容器，容器會繞著圖形上下左右正中央旋轉傾斜。
- 液體表面會受重力影響維持水平，並因拖拉產生晃動波浪。
- 液體不會從開口或邊緣外漏，只會從被針戳出的孔洞噴出。

## 大氣壓力
- 先用繪圖工具畫一個開放式容器。
- 先灌水，再按封閉按鈕把容器封起來。
- 封閉後可像連通管一樣拖拉旋轉。
- 點選鑽孔工具後會出現針筒。針筒可戳洞，也能推拉活塞來加壓或抽氣。
- 控制台中央會顯示針筒、大氣與容器空腔的壓力值。
`;


  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const sceneTabs = document.getElementById('sceneTabs');
  const stageTabs = document.getElementById('stageTabs');
  const resetBtn = document.getElementById('resetBtn');
  const eraseHolesBtn = document.getElementById('eraseHolesBtn');
  const glueBtn = document.getElementById('glueBtn');
  const playBtn = document.getElementById('playBtn');
  const nextBtn = document.getElementById('nextBtn');
  const fillBtn = document.getElementById('fillBtn');
  const drillBtn = document.getElementById('drillBtn');
  const injectBtn = document.getElementById('injectBtn');
  const vacuumBtn = document.getElementById('vacuumBtn');
  const drawBtn = document.getElementById('drawBtn');
  const sealBtn = document.getElementById('sealBtn');
  const centerInfo = document.getElementById('centerInfo');
  const helpBtn = document.getElementById('helpBtn');
  const helpModal = document.getElementById('helpModal');
  const closeHelp = document.getElementById('closeHelp');
  const mdContent = document.getElementById('mdContent');
  const statusPill = document.getElementById('statusPill');


const scenes = [
  { id:'liquid', label:'器壁液壓', stages:[
    { id:'cup', icon:'▱', label:'杯子' },
    { id:'balloon', icon:'◯', label:'水球' },
    { id:'dam', icon:'▰', label:'水壩' },
  ] },
  { id:'tube', label:'連通管', stages:[
    { id:'tube-a', icon:'∪', label:'連通管' },
  ] },
  { id:'air', label:'大氣壓力', stages:[
    { id:'air-a', icon:'◉', label:'大氣壓力' },
  ] },
];

  const camera = { angle:0, zoom:1, x:0, y:0 };
  const pointer = {
    active:false,
    mode:null,
    id:null,
    lastX:0,
    lastY:0,
    touches:new Map(),
    pinchDist:0,
    pinchZoom:1,
    pinchCenter:{x:0,y:0},
    pinchCam:{x:0,y:0},
    worldX:0,
    worldY:0
  };


const sim = {
  scene:0,
  stage:0,
  paused:false,
  filling:false,
  drill:false,
  drawMode:false,
  lastTime:performance.now(),
  particles:[],
  holes:[],
  patches:[],
  glueMode:false,
  needle:{x:-260,y:20,len:118,grab:false},
  cup:{water:0.56,capacity:1.03},
  balloon:{water:0.42,capacity:1,burst:false},
  river:{water:0.50,capacity:1.12},
  tube:{strokes:[],current:[],drawing:false,water:0,capacity:1},
  air:{strokes:[],current:[],drawing:false,water:0,capacity:1},
  rain:[],
};

  function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
  function lerp(a,b,t){return a+(b-a)*t;}
  function hypot(a,b){return Math.sqrt(a*a+b*b);}



function tubeDefault(){
  return {
    strokes:[],
    current:[],
    drawing:false,
    water:0,
    capacity:1,
    angle:0,
    waveAmp:0,
    wavePhase:0,
    dragging:false,
    dragLastAngle:0,
    dragLastTime:0
  };
}
function clampPointToTubeArea(p){
  return {x:p.x, y:p.y};
}
function simplifyPath(points, minDist=6){
  const out = [];
  for(const p of points){
    if(!out.length || hypot(p.x-out[out.length-1].x, p.y-out[out.length-1].y) >= minDist) out.push({x:p.x,y:p.y});
  }
  if(out.length && points.length){
    const last = points[points.length-1];
    const cur = out[out.length-1];
    if(cur.x !== last.x || cur.y !== last.y) out.push({x:last.x,y:last.y});
  }
  return out;
}
function finalizeTubePath(points){
  const pts = simplifyPath(points.map(clampPointToTubeArea), 5);
  return pts.length >= 2 ? pts : [];
}
function tubeStrokes(includeCurrent=false){
  const strokes = sim.tube.strokes.filter(s=>s && s.length >= 2);
  if(includeCurrent && sim.tube.current && sim.tube.current.length >= 2) strokes.push(sim.tube.current);
  return strokes;
}
function tubeAllPoints(includeCurrent=false){
  return tubeStrokes(includeCurrent).flat();
}
function tubeMetrics(includeCurrent=true){
  const strokes = includeCurrent ? tubeStrokes(true) : tubeStrokes(false);
  const pts = strokes.flat();
  if(pts.length < 2) return null;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const ends = [];
  for(const s of strokes){
    if(s.length >= 2){ ends.push(s[0].y, s[s.length-1].y); }
  }
  const rimY = ends.length ? Math.max(...ends) : Math.min(...ys);
  const bottomY = Math.max(...ys);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const sortedStrokes = strokes.slice().sort((a,b)=>a[0].x-b[0].x);
  const first = sortedStrokes[0];
  const last = sortedStrokes[sortedStrokes.length-1];
  const left = first ? first[0] : {x:minX,y:rimY};
  const right = last ? last[last.length-1] : {x:maxX,y:rimY};
  const center = {x:(minX+maxX)/2, y:(minY+maxY)/2};
  return {rimY,bottomY,minX,maxX,minY,maxY,left,right,center};
}
function tubeCenter(){
  const m = tubeMetrics(true);
  return m ? m.center : {x:0,y:0};
}
function rotateAround(p,c,a){
  const dx=p.x-c.x, dy=p.y-c.y;
  const ca=Math.cos(a), sa=Math.sin(a);
  return {x:c.x + dx*ca - dy*sa, y:c.y + dx*sa + dy*ca};
}
function vectorRotate(v,a){
  const ca=Math.cos(a), sa=Math.sin(a);
  return {x:v.x*ca - v.y*sa, y:v.x*sa + v.y*ca};
}
function tubePointToWorld(p){
  return rotateAround(p, tubeCenter(), sim.tube.angle || 0);
}
function tubePointToLocal(p){
  return rotateAround(p, tubeCenter(), -(sim.tube.angle || 0));
}
function tubeWorldStrokes(includeCurrent=false){
  return tubeStrokes(includeCurrent).map(stroke=>stroke.map(tubePointToWorld));
}
function tubeWorldMetrics(){
  const strokes = tubeWorldStrokes(true);
  const pts = strokes.flat();
  if(pts.length < 2) return null;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  return {minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys), center:tubePointToWorld(tubeCenter())};
}
function tubeWaterBaseY(){
  const wm = tubeWorldMetrics();
  if(!wm) return 9999;
  const h = Math.max(1, wm.maxY - wm.minY);
  return wm.maxY - clamp(sim.tube.water,0,1) * h;
}
function tubeWaterSurfaceY(x){
  const wm = tubeWorldMetrics();
  const base = tubeWaterBaseY();
  if(!wm) return base;
  // 水面基準保持水平，只疊加小幅波動，避免看起來整體傾斜。
  const amp = Math.min(sim.tube.waveAmp || 0, 14);
  const phase = sim.tube.wavePhase || 0;
  return base + Math.sin((x - wm.center.x)*0.03 + phase) * amp;
}
function closestPointOnSegment(px,py,ax,ay,bx,by){
  const abx = bx-ax, aby = by-ay;
  const ab2 = abx*abx + aby*aby || 1;
  const t = clamp(((px-ax)*abx + (py-ay)*aby)/ab2, 0, 1);
  return {x:ax + abx*t, y:ay + aby*t, t};
}
function closestPointOnTube(pLocal){
  const strokes = tubeStrokes(false);
  if(!strokes.length) return null;
  const c = tubeCenter();
  let best = null;
  for(const stroke of strokes){
    for(let i=0;i<stroke.length-1;i++){
      const a = stroke[i], b = stroke[i+1];
      const q = closestPointOnSegment(pLocal.x,pLocal.y,a.x,a.y,b.x,b.y);
      const d = hypot(q.x-pLocal.x, q.y-pLocal.y);
      const tx = b.x - a.x;
      const ty = b.y - a.y;
      const len = hypot(tx,ty) || 1;
      let n1 = {x:-ty/len, y:tx/len};
      const out = {x:q.x-c.x, y:q.y-c.y};
      if(n1.x*out.x + n1.y*out.y < 0) n1 = {x:-n1.x, y:-n1.y};
      if(!best || d < best.d) best = {x:q.x,y:q.y,d,index:i,nx:n1.x,ny:n1.y};
    }
  }
  return best;
}
function drawStrokePath(stroke){
  if(!stroke || stroke.length < 2) return false;
  ctx.beginPath();
  ctx.moveTo(stroke[0].x, stroke[0].y);
  for(let i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x, stroke[i].y);
  return true;
}
function tubeClipPathWorld(){
  const strokes = tubeStrokes(true);
  if(!strokes.length) return false;
  ctx.beginPath();
  for(const stroke of strokes){
    if(!stroke || stroke.length < 2) continue;
    const first = tubePointToWorld(stroke[0]);
    ctx.moveTo(first.x, first.y);
    for(let i=1;i<stroke.length;i++){
      const q = tubePointToWorld(stroke[i]);
      ctx.lineTo(q.x, q.y);
    }
    // 直接以首尾連線封閉，避免用人工 rimY 造成奇怪的缺口與斜切。
    ctx.closePath();
  }
  return true;
}

function tubeEndpointData(){
  const strokes = tubeStrokes(false);
  const endpoints = [];
  for(let si=0; si<strokes.length; si++){
    const s = strokes[si];
    if(!s || s.length < 2) continue;
    const first = s[0], second = s[1];
    const last = s[s.length-1], prev = s[s.length-2];
    const tvStart = {x:first.x-second.x, y:first.y-second.y};
    const tvEnd = {x:last.x-prev.x, y:last.y-prev.y};
    endpoints.push({stroke:si, end:'start', p:first, tangent:tvStart, paired:false});
    endpoints.push({stroke:si, end:'end', p:last, tangent:tvEnd, paired:false});
  }
  const pairDist = 14;
  for(let i=0;i<endpoints.length;i++){
    if(endpoints[i].paired) continue;
    let best=-1, bestD=Infinity;
    for(let j=i+1;j<endpoints.length;j++){
      if(endpoints[j].paired) continue;
      const d = hypot(endpoints[i].p.x-endpoints[j].p.x, endpoints[i].p.y-endpoints[j].p.y);
      if(d < bestD){ bestD=d; best=j; }
    }
    if(best >= 0 && bestD <= pairDist){
      endpoints[i].paired = true;
      endpoints[best].paired = true;
    }
  }
  return endpoints;
}
function tubeOpenings(){
  return tubeEndpointData().filter(e=>!e.paired);
}
function tubeIsClosedShape(){
  const endpoints = tubeEndpointData();
  return endpoints.length >= 2 && endpoints.every(e=>e.paired);
}
function normalized(v){
  const len = hypot(v.x, v.y) || 1;
  return {x:v.x/len, y:v.y/len};
}
function simulateTubeOpenLeaks(dt, m){
  if(!m || sim.tube.water <= .001) return;
  const openings = tubeOpenings();
  if(!openings.length) return;
  let leakCount = 0;
  for(const op of openings){
    const pWorld = tubePointToWorld(op.p);
    const surfaceY = tubeWaterSurfaceY(pWorld.x);
    const head = pWorld.y - surfaceY;
    // y 軸向下；head >= 0 代表開口已低於液面。保留一點容差讓水面碰到開口時就會外漏。
    if(head >= -6){
      leakCount++;
      const tangent = vectorRotate(normalized(op.tangent), sim.tube.angle || 0);
      const fallBias = 42 + Math.max(0, head) * 0.35;

  for(const h of sim.patches.filter(h=>h.kind==='air')){ const p=airPointToWorld({x:h.lx ?? h.x, y:h.ly ?? h.y}); const normal=vectorRotate({x:h.nx ?? 0,y:h.ny ?? -1}, sim.air.angle || 0); drawPatchBlob(p.x,p.y,Math.atan2(normal.y, normal.x)); }

  function resize(){
    const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize, {passive:true});
  resize();

  function worldToScreen(p){
    const rect = canvas.getBoundingClientRect();
    return {
      x: rect.width/2 + p.x,
      y: rect.height/2 + p.y
    };
  }
  function screenToWorld(x,y){
    const rect = canvas.getBoundingClientRect();
    return {
      x: x - rect.width/2,
      y: y - rect.height/2
    };
  }

  function applyWorld(){
    const rect = canvas.getBoundingClientRect();
    ctx.translate(rect.width/2, rect.height/2);
  }

  function holeBelongsToCurrentScene(h){
  if(sim.scene===0){
    const kind = sim.stage===0 ? 'cup' : sim.stage===1 ? 'balloon' : 'river';
    return h.kind===kind && h.stage===sim.stage;
  }
  if(sim.scene===1) return h.kind==='tube' && h.stage===sim.stage;
  if(sim.scene===2) return h.kind==='air';
  return false;
}

  function holeWorldPos(h){
  if(h.kind==='balloon'){
    const c={x:0,y:-40};
    const r=balloonRadius();
    return {x:c.x+Math.cos(h.a)*r, y:c.y+Math.sin(h.a)*r};
  }
  if(h.kind==='tube') return tubePointToWorld({x:h.lx ?? h.x, y:h.ly ?? h.y});
  if(h.kind==='air') return airPointToWorld({x:h.lx ?? h.x, y:h.ly ?? h.y});
  if(h.kind==='river') return {x:h.outX ?? h.x, y:h.y};
  return {x:h.x, y:h.y};
}

  function addPatchFromHole(h){
  const pos = holeWorldPos(h);
  const exists = sim.patches.some(p=>p.kind===h.kind && p.stage===h.stage && hypot(holeWorldPos(p).x-pos.x, holeWorldPos(p).y-pos.y) < 12);
  if(!exists) sim.patches.push({...h, patched:true});
}

  function sealHoleIndex(idx){
  const h = sim.holes[idx];
  if(!h) return;
  addPatchFromHole(h);
  sim.holes.splice(idx,1);
  if(h.kind==='air') sim.air.syringe.insertedHole = -1;
}

  function nearestCurrentHoleIndex(pWorld){
  let best=-1, bestD=22;
  for(let i=0;i<sim.holes.length;i++){
    const h=sim.holes[i];
    if(!holeBelongsToCurrentScene(h)) continue;
    const pos = holeWorldPos(h);
    const d = hypot(pos.x-pWorld.x, pos.y-pWorld.y);
    if(d < bestD){ bestD=d; best=i; }
  }
  return best;
}

  function clearCurrentHoles(){
  const kept=[];
  for(const h of sim.holes){
    if(holeBelongsToCurrentScene(h)) addPatchFromHole(h); else kept.push(h);
  }
  sim.holes = kept;
  if(sim.scene===2) sim.air.syringe.insertedHole = -1;
  updateControls();
}

  function sealNearestCurrentHole(pWorld){
  const idx = nearestCurrentHoleIndex(pWorld);
  if(idx>=0){ sealHoleIndex(idx); updateControls(); return true; }
  return false;
}

  function renderMarkdown(md){
    const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const lines = esc(md).split('\n');
    let html = '', inList = false;
    for(const raw of lines){
      const line = raw.trimEnd();
      if(!line.trim()){
        if(inList){ html += '</ul>'; inList=false; }
        continue;
      }
      if(line.startsWith('---')){ if(inList){html+='</ul>';inList=false;} html+='<hr>'; continue; }
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      if(h){ if(inList){html+='</ul>';inList=false;} const level=h[1].length; html += `<h${level}>${inlineMd(h[2])}</h${level}>`; continue; }
      const li = line.match(/^[-*]\s+(.*)$/);
      if(li){ if(!inList){html+='<ul>';inList=true;} html += `<li>${inlineMd(li[1])}</li>`; continue; }
      if(inList){ html+='</ul>'; inList=false; }
      html += `<p>${inlineMd(line)}</p>`;
    }
    if(inList) html+='</ul>';
    return html;
  }
  function inlineMd(s){
    return s
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/`(.+?)`/g,'<code>$1</code>');
  }

  function drawRoundedRect(x,y,w,h,r, fill, stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
  }

  function drawWaterRect(x,y,w,h){
    ctx.save();
    const grad = ctx.createLinearGradient(0,y,0,y+h);
    grad.addColorStop(0,'rgba(83,190,255,.72)');
    grad.addColorStop(1,'rgba(44,132,228,.86)');
    ctx.fillStyle = grad;
    ctx.fillRect(x,y,w,h);
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath();
    ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.stroke();
    ctx.restore();
  }

  function spawnDrop(x,y,vx,vy,size=3,life=5){
    sim.particles.push({x,y,vx,vy,r:size,life,maxLife:life,type:'water'});
  }

  function updateParticles(dt){
    const g = 480;
    for(let i=sim.particles.length-1;i>=0;i--){
      const p = sim.particles[i];
      p.vy += g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if(p.life <= 0 || Math.abs(p.x)>900 || p.y>520) sim.particles.splice(i,1);
    }
    for(let i=sim.rain.length-1;i>=0;i--){
      const r = sim.rain[i];
      r.y += r.vy*dt;
      r.life -= dt;
      if(r.life<=0 || r.y>100) sim.rain.splice(i,1);
    }
  }

  function drawParticles(){
    ctx.save();
    for(const p of sim.particles){
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = 'rgba(70,178,255,.92)';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for(const r of sim.rain){
      ctx.strokeStyle = 'rgba(94,188,255,.72)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.x,r.y-9); ctx.lineTo(r.x-2,r.y+9); ctx.stroke();
    }
    ctx.restore();
  }


function drawNeedle(){
  if(!sim.drill || (sim.scene !== 0 && sim.scene !== 1)) return;
  const n = sim.needle;
  ctx.save();
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#f2f2f2';
  ctx.fillStyle = '#f2f2f2';
  if(sim.scene===1){
    ctx.beginPath();
    ctx.moveTo(n.x, n.y - n.len/2);
    ctx.lineTo(n.x, n.y + n.len/2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(n.x, n.y + n.len/2 + 15);
    ctx.lineTo(n.x - 8, n.y + n.len/2 - 8);
    ctx.lineTo(n.x + 8, n.y + n.len/2 - 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(n.x, n.y - n.len/2 - 15, 12, 0, Math.PI*2);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(n.x - n.len/2, n.y); ctx.lineTo(n.x + n.len/2, n.y); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(n.x - n.len/2 - 15, n.y);
    ctx.lineTo(n.x - n.len/2 + 8, n.y - 8);
    ctx.lineTo(n.x - n.len/2 + 8, n.y + 8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(n.x-n.len/2-15,n.y,12,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function nearNeedle(p){

  function angleDiff(a,b){
    return Math.atan2(Math.sin(a-b), Math.cos(a-b));
  }

  function addHole(hole){
    const exists = sim.holes.some(h=>{
      if(h.stage!==sim.stage || h.kind!==hole.kind) return false;
      if(hole.kind==='balloon') return Math.abs(angleDiff(h.a, hole.a)) < 0.14;
      if(hole.kind==='tube') return hypot((h.lx ?? h.x)-(hole.lx ?? hole.x),(h.ly ?? h.y)-(hole.ly ?? hole.y))<18;
      return hypot(h.x-hole.x,h.y-hole.y)<18;
    });
    if(!exists) sim.holes.push({...hole, stage:sim.stage, cool:0});
  }

  function drawHole(x,y,angle=0){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(angle);
    ctx.fillStyle = '#111';
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0,0,8,5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawPatchBlob(x,y,angle=0){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(angle);
    const g=ctx.createRadialGradient(-2,-2,1,0,0,11);
    g.addColorStop(0,'rgba(120,210,255,.95)');
    g.addColorStop(1,'rgba(70,160,255,.68)');
    ctx.fillStyle=g;
    ctx.strokeStyle='rgba(255,255,255,.78)';
    ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(-8,0);
    ctx.bezierCurveTo(-7,-7,5,-8,8,-1);
    ctx.bezierCurveTo(10,5,2,9,-4,8);
    ctx.bezierCurveTo(-9,7,-11,3,-8,0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function tubeContainsWorldPoint(p){
    if(!tubeClipPathWorld()) return false;
    return ctx.isPointInPath(p.x,p.y);
  }

  function airContainsWorldPoint(p){
    if(!airClipPathWorld()) return false;
    return ctx.isPointInPath(p.x,p.y);
  }

  function drawRiverTunnel(h){
    const outX = h.outX || damRightFaceX(h.y);
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,.95)';
    ctx.lineWidth = 7;
    ctx.beginPath();

    ctx.lineTo(outX, h.y-5);
    ctx.moveTo(h.x, h.y+5);
    ctx.lineTo(outX, h.y+5);
    ctx.stroke();
    ctx.restore();
    drawHole(outX, h.y, -0.32);
  }

  function simulateCup(dt){
    const cup = {x:0,y:-150,w:180,h:270,bottom:120};
    const waterH = clamp(sim.cup.water,0,1) * cup.h;
    const waterY = cup.bottom - waterH;
    if(sim.filling){
      sim.cup.water += 0.18*dt;
      for(let i=0;i<4;i++) spawnDrop(-5 + Math.random()*10, -215 + Math.random()*20, (Math.random()-.5)*30, 180+Math.random()*70, 2.4, 1.2);
    }
    if(sim.cup.water > sim.cup.capacity){
      sim.cup.water = sim.cup.capacity;
      for(let i=0;i<5;i++){
        const side = Math.random()<.5?-1:1;
        spawnDrop(side*(cup.w/2+4), cup.y+8+Math.random()*8, side*(90+Math.random()*70), -40+Math.random()*80, 3, 2.8);
      }
      sim.cup.water -= 0.05*dt;
    }
    handleCupNeedle(cup);
    for(const h of sim.holes.filter(h=>h.stage===0 && h.kind==='cup')){
      if(h.y > waterY && sim.cup.water > .005){
        const depth = h.y - waterY;
        const power = Math.sqrt(Math.max(0,depth))*29;
        h.cool -= dt;
        if(h.cool <= 0){
          h.cool = clamp(.10 - depth*.00032,.018,.08);
          spawnDrop(h.x, h.y, h.side*power, -32 + Math.random()*18, 2.7, 3.2);
          sim.cup.water = Math.max(0, sim.cup.water - (0.0018 + depth*0.000012));
        }
      }
    }
  }

  function handleCupNeedle(cup){
    if(!sim.drill) return;
    const tip = needleTip();
    const left = cup.x - cup.w/2;
    const right = cup.x + cup.w/2;
    const inY = tip.y > cup.y+8 && tip.y < cup.bottom-4;
    if(inY && Math.abs(tip.x-right)<10) addHole({kind:'cup',x:right,y:tip.y,side:1});
  }

  function drawCup(){
    const cup = {x:0,y:-150,w:180,h:270,bottom:120};
    const waterH = clamp(sim.cup.water,0,1) * cup.h;

  function drawFaucet(x,y){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=5; ctx.lineCap='round';

  function balloonRadius(){
    if(sim.balloon.burst) return 0;
    return 42 + Math.sqrt(Math.max(0, sim.balloon.water))*96;
  }

  function balloonShape(){
    const r = balloonRadius();
    const flat = sim.balloon.water < .02;
    return {cx:0, cy:40, r, flat, rx:flat ? 82 : r, ry:flat ? 23 : r*0.92};
  }

  function balloonMembranePoint(a){
    const b = balloonShape();
    return {x:b.cx + Math.cos(a)*b.rx, y:b.cy + Math.sin(a)*b.ry, shape:b};
  }

  function simulateBalloon(dt){
    if(sim.balloon.burst){ return; }
    if(sim.filling){
      sim.balloon.water += 0.22*dt;
      for(let i=0;i<4;i++) spawnDrop(-3+Math.random()*6,-190+Math.random()*15,(Math.random()-.5)*24,150+Math.random()*60,2.5,1.0);
    }
    if(sim.balloon.water > 1.04){
      sim.balloon.burst = true;
      const r = balloonRadius() || 135;
      for(let i=0;i<120;i++){
        const a = Math.random()*Math.PI*2;
        const sp = 70 + Math.random()*360;
        spawnDrop(Math.cos(a)*r*.35, 28+Math.sin(a)*r*.35, Math.cos(a)*sp, Math.sin(a)*sp-80, 2+Math.random()*2.5, 2.2+Math.random()*1.6);
      }
      sim.balloon.water = 0;
      return;
    }
    handleBalloonNeedle();
    const shape = balloonShape();
    const top = shape.cy - shape.ry;
    for(const h of sim.holes.filter(h=>h.stage===1 && h.kind==='balloon')){
      if(sim.balloon.water <= .003) continue;
      const p = balloonMembranePoint(h.a);
      h.x = p.x; h.y = p.y;
      const depth = p.y - top;
      const power = Math.sqrt(Math.max(0, depth))*30;
      h.cool -= dt;
      if(h.cool <= 0){
        h.cool = clamp(.09-depth*.00024,.018,.08);
        spawnDrop(p.x,p.y,Math.cos(h.a)*power,Math.sin(h.a)*power-24,2.8,3.0);
        sim.balloon.water = Math.max(0, sim.balloon.water - (0.0015 + depth*0.00001));
      }
    }
  }

  function handleBalloonNeedle(){
    if(!sim.drill) return;
    const tip = needleTip();
    const b = balloonShape();
    if(b.rx <= 18 || b.ry <= 10 || tip.x < b.cx) return;
    const nx = (tip.x - b.cx) / b.rx;
    const ny = (tip.y - b.cy) / b.ry;
    const q = nx*nx + ny*ny;
    if(Math.abs(q - 1) < 0.18){
      const a = Math.atan2(ny, nx);
      const p = balloonMembranePoint(a);
      addHole({kind:'balloon',x:p.x,y:p.y,a});
    }
  }

  function drawBalloon(){
    ctx.save();
    if(sim.filling) drawFaucet(0,-245);
    if(sim.balloon.burst){
      ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3;
      for(let i=0;i<12;i++){
        const a=i/12*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*34,40+Math.sin(a)*22); ctx.lineTo(Math.cos(a)*(70+Math.random()*6),40+Math.sin(a)*(50+Math.random()*6)); ctx.stroke();
      }
      ctx.restore(); return;
    }
    const b = balloonShape();
    const r = b.r, rx = b.rx, ry = b.ry, flat = b.flat;
    ctx.fillStyle = flat ? 'rgba(58,167,255,.12)' : 'rgba(58,167,255,.56)';
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(b.cx,b.cy,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.ellipse(b.cx-r*.28,b.cy-r*.22,Math.max(6,r*.12),Math.max(3,r*.045),-.55,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3;
    const knotY = b.cy - ry;
    ctx.beginPath(); ctx.moveTo(b.cx-15,knotY+2); ctx.quadraticCurveTo(b.cx,knotY-27,b.cx+17,knotY+4); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.ellipse(b.cx,knotY-8,18,8,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(b.cx,knotY-8,18,8,0,0,Math.PI*2); ctx.stroke();
    for(const h of sim.holes.filter(h=>h.stage===1 && h.kind==='balloon')){
      const p = balloonMembranePoint(h.a);
      h.x = p.x; h.y = p.y;
      drawHole(p.x,p.y,h.a);
    }
    ctx.restore();
  }

  function damLeftFaceX(){ return 62; }
  function damRightFaceX(y){
    const yTop = -120, yBot = 150;
    const t = clamp((y - yTop) / (yBot - yTop), 0, 1);
    return lerp(220, 292, t);
  }

  function simulateRiver(dt){
    if(sim.filling){
      sim.river.water += 0.14*dt;
      if(Math.random()<.75){ sim.rain.push({x:-210+Math.random()*210,y:-240+Math.random()*45,vy:220+Math.random()*120,life:1.4}); }
    }
    if(sim.river.water > sim.river.capacity){
      sim.river.water = sim.river.capacity;
      for(let i=0;i<8;i++) spawnDrop(48 + Math.random()*28, -128 + Math.random()*14, 80+Math.random()*120, -20+Math.random()*60, 3, 2.5);
      sim.river.water -= 0.045*dt;
    }
    handleRiverNeedle();
    const bottom = 150, top = -120, h = bottom-top;
    const waterY = bottom - clamp(sim.river.water,0,1)*h;
    for(const hole of sim.holes.filter(h=>h.stage===2 && h.kind==='river')){
      if(hole.y > waterY && sim.river.water > .005){
        const depth = hole.y - waterY;
        const power = Math.sqrt(Math.max(0,depth))*33;
        hole.cool -= dt;
        if(hole.cool <= 0){
          hole.cool = clamp(.12-depth*.0003,.02,.09);
          spawnDrop((hole.outX || hole.x)+4,hole.y,power,-20+Math.random()*20,2.8,3.2);
          sim.river.water = Math.max(0, sim.river.water - (0.0015 + depth*0.000012));
        }
      }
    }
  }

  function handleRiverNeedle(){
    if(!sim.drill) return;
    const tip = needleTip();
    if(tip.y < -120 || tip.y > 150) return;
    const inX = damLeftFaceX();
    const outX = damRightFaceX(tip.y);
    if(Math.abs(tip.x - outX)<12) addHole({kind:'river',x:inX,y:tip.y,outX,side:1});
  }

  function drawCloud(x,y){

  function drawRiver(){

      ctx.beginPath(); ctx.moveTo(72,y); ctx.lineTo(damRightFaceX(y)-10,y); ctx.stroke();
    }
    if(sim.filling) drawCloud(-115,-245);

function handleTubeNeedle(){
  if(!sim.drill || !tubeStrokes(false).length) return;
  const tipWorld = needleTip();
  const tipLocal = tubePointToLocal(tipWorld);
  const hit = closestPointOnTube(tipLocal);
  if(hit && hit.d < 11){
    const pWorld = tubePointToWorld({x:hit.x, y:hit.y});
    addHole({kind:'tube', x:pWorld.x, y:pWorld.y, lx:hit.x, ly:hit.y, nx:hit.nx, ny:hit.ny});
  }
}

function simulateTube(dt){
  const m = tubeMetrics(false);
  if(sim.filling && m){
    sim.tube.water += 0.18*dt;
    for(let i=0;i<4;i++) spawnDrop(-5 + Math.random()*10, -220 + Math.random()*20, (Math.random()-.5)*18, 160 + Math.random()*70, 2.4, 1.1);
    if(sim.tube.water > sim.tube.capacity) sim.tube.water = sim.tube.capacity;
  }
  sim.tube.wavePhase += dt * (4.2 + (sim.tube.waveAmp || 0) * 0.08);
  sim.tube.waveAmp *= Math.exp(-dt * 1.45);
  if(sim.tube.waveAmp < 0.2) sim.tube.waveAmp = 0;
  handleTubeNeedle();
  simulateTubeOpenLeaks(dt, m);
  for(const h of sim.holes.filter(h=>h.stage===0 && h.kind==='tube')){
    if(!m || sim.tube.water <= .001) continue;
    const local = {x:h.lx ?? h.x, y:h.ly ?? h.y};
    const pWorld = tubePointToWorld(local);
    h.x = pWorld.x; h.y = pWorld.y;
    const surfaceY = tubeWaterSurfaceY(pWorld.x);
    if(pWorld.y > surfaceY){
      const depth = pWorld.y - surfaceY;
      const normal = vectorRotate({x:h.nx ?? 0, y:h.ny ?? -1}, sim.tube.angle || 0);
      const nLen = hypot(normal.x, normal.y) || 1;
      const nx = normal.x / nLen;
      const ny = normal.y / nLen;
      const speed = Math.sqrt(Math.max(0, 2*520*depth));
      h.cool -= dt;
      if(h.cool <= 0){
        h.cool = clamp(.12 - depth*.00034, .018, .09);
        for(let i=0;i<2;i++){
          const jitter = (Math.random()-.5) * 12;
          spawnDrop(pWorld.x + nx*4, pWorld.y + ny*4, nx*speed + jitter, ny*speed + (Math.random()-.5)*12, 2.5, 2.8);
        }
        sim.tube.water = Math.max(0, sim.tube.water - (0.0015 + depth*0.000012));
      }
    }
  }
}

function drawTubeWater(wm){
  const baseY = tubeWaterBaseY();
  const amp = Math.min(sim.tube.waveAmp || 0, 14);
  const phase = sim.tube.wavePhase || 0;
  const x0 = wm.minX - 180;
  const x1 = wm.maxX + 180;
  const yBottom = wm.maxY + 220;
  ctx.save();
  if(tubeClipPathWorld()){
    ctx.clip();
    const grad = ctx.createLinearGradient(0,baseY-90,0,yBottom);
    grad.addColorStop(0,'rgba(83,190,255,.66)');
    grad.addColorStop(1,'rgba(44,132,228,.88)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x0, yBottom);
    ctx.lineTo(x0, baseY);
    const steps = 72;
    for(let i=0;i<=steps;i++){
      const x = x0 + (x1-x0)*i/steps;
      const y = baseY + Math.sin((x - wm.center.x)*0.03 + phase) * amp;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(x1,yBottom);
    ctx.closePath();
    ctx.fill();
    // 水面描邊維持接近水平，避免視覺上出現整塊斜掉的錯覺。
    ctx.strokeStyle='rgba(255,255,255,.16)';
    ctx.lineWidth=1.2;
    ctx.beginPath();
    for(let i=0;i<=steps;i++){
      const x = x0 + (x1-x0)*i/steps;
      const y = baseY + Math.sin((x - wm.center.x)*0.03 + phase) * amp;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawTube(){
  ctx.save();
  drawFaucet(0,-245);
  const strokes = tubeStrokes(true);
  if(!strokes.length){
    ctx.restore();
    return;
  }
  const wm = tubeWorldMetrics();
  if(wm && sim.tube.water > 0.001) drawTubeWater(wm);
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.92)';
  ctx.lineWidth=4;
  for(const stroke of sim.tube.strokes){
    const ws = stroke.map(tubePointToWorld);
    if(drawStrokePath(ws)) ctx.stroke();
  }
  ctx.restore();
  if(sim.tube.current && sim.tube.current.length>1){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.45)';
    ctx.lineWidth=2;
    const ws = sim.tube.current.map(tubePointToWorld);
    if(drawStrokePath(ws)) ctx.stroke();
    ctx.restore();
  }
  for(const h of sim.holes.filter(h=>h.stage===0 && h.kind==='tube')){
    const p = tubePointToWorld({x:h.lx ?? h.x, y:h.ly ?? h.y});
    const normal = vectorRotate({x:h.nx ?? 0, y:h.ny ?? -1}, sim.tube.angle || 0);
    drawHole(p.x,p.y,Math.atan2(normal.y, normal.x));
  }
  if(sim.tube.water > .001 && tubeStrokes(false).length){
    const c = tubeCenter();
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.35)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(c.x,c.y,6,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

  function drawGrid(){
    const rect = canvas.getBoundingClientRect();
    ctx.save();
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.fillStyle='#242424'; ctx.fillRect(0,0,rect.width,rect.height);
    ctx.strokeStyle='rgba(255,255,255,.045)'; ctx.lineWidth=1;
    const step=48;
    for(let x=((rect.width/2)%step);x<rect.width;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,rect.height);ctx.stroke();}
    for(let y=((rect.height/2)%step);y<rect.height;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(rect.width,y);ctx.stroke();}
    ctx.restore();
  }

  function draw(){
    const rect = canvas.getBoundingClientRect();
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.restore();
    drawGrid();
    ctx.save();
    applyWorld();
    ctx.lineCap='round'; ctx.lineJoin='round';
    if(sim.scene===0) drawSceneLiquid();
    if(sim.scene===1){ drawTube(); drawParticles(); drawNeedle(); }
    if(sim.scene===2){ drawAir(); drawParticles(); }
    ctx.restore();
    if(sim.paused){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(0,0,rect.width,rect.height);
      ctx.fillStyle='rgba(255,255,255,.78)'; ctx.font='700 42px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Ⅱ',rect.width/2,rect.height/2);
      ctx.restore();
    }
  }

  function tick(now){
    const dt = clamp((now - sim.lastTime)/1000, 0, .04);
    sim.lastTime = now;
    if(!sim.paused){
      if(sim.scene===0) simulateLiquid(dt);
      if(sim.scene===1) simulateTube(dt);
      if(sim.scene===2) simulateAir(dt);
      updateParticles(dt);
      updateCenterInfo();
    }
    draw();
    requestAnimationFrame(tick);
  }


canvas.addEventListener('wheel', e=>{ e.preventDefault(); }, {passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

function pointerStillPressed(e){
  if(e.pointerType === 'mouse' || e.pointerType === 'pen') return (e.buttons & 1) === 1;
  return true;
}

function startTubeStroke(e){
  const p = clampPointToTubeArea(tubePointToLocal(screenToWorld(e.clientX, e.clientY)));
  pointer.active = true;
  pointer.id = e.pointerId;
  pointer.mode = 'draw';
  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;
  sim.tube.drawing = true;
  sim.tube.current = [p];
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
}

function addTubeStrokePoint(e){
  if(!sim.tube.drawing || pointer.mode !== 'draw' || e.pointerId !== pointer.id) return;
  if(!pointerStillPressed(e)){
    finishTubeStroke();
    return;
  }
  const p = clampPointToTubeArea(tubePointToLocal(screenToWorld(e.clientX, e.clientY)));
  const path = sim.tube.current || [];
  if(!path.length || hypot(p.x-path[path.length-1].x, p.y-path[path.length-1].y) > 3){
    path.push(p);
    sim.tube.current = path;
  }
}

function finishTubeStroke(){
  if(pointer.mode === 'draw'){
    const stroke = finalizeTubePath(sim.tube.current || []);
    if(stroke.length >= 2) sim.tube.strokes.push(stroke);
    sim.tube.current = [];
    sim.tube.drawing = false;
  }
  pointer.active = false;
  pointer.id = null;
  pointer.mode = null;
  sim.needle.grab = false;
  canvas.classList.remove('dragging');
}


function finishNeedleDrag(){
  pointer.active = false;
  pointer.id = null;
  pointer.mode = null;
  sim.needle.grab = false;
  canvas.classList.remove('dragging');
}

function airHoleArray(){ return sim.holes.filter(h=>h.kind==='air'); }
function finishSyringeDrag(){
  const idx = findAirHoleAtTip();
  sim.air.syringe.insertedHole = idx;
  sim.air.syringe.plunger = 0.5;
  pointer.active = false; pointer.id = null; pointer.mode = null; canvas.classList.remove('dragging');
  updateCenterInfo();
}
function updateSyringeMove(e){
  const p=screenToWorld(e.clientX,e.clientY); const s=sim.air.syringe; s.x = p.x - (s.offX||0); s.y = p.y - (s.offY||0); handleAirSyringeNeedle();
}

function canDragTube(){
  return sim.scene===1 && sim.tube.water > .001 && tubeStrokes(false).length;
}
function isNearTubeWorld(pWorld){
  const hit = closestPointOnTube(tubePointToLocal(pWorld));
  return !!((hit && hit.d < 34) || tubeContainsWorldPoint(pWorld));
}
function pointerAngleAroundTube(e){
  const c = tubeCenter();
  const p = screenToWorld(e.clientX, e.clientY);
  return Math.atan2(p.y-c.y, p.x-c.x);
}
function startTubeDrag(e){
  pointer.active = true;
  pointer.id = e.pointerId;
  pointer.mode = 'tubeDrag';
  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;
  sim.tube.dragging = true;
  sim.tube.dragLastAngle = pointerAngleAroundTube(e);
  sim.tube.dragLastTime = performance.now();
  canvas.classList.add('dragging');
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
}
function updateTubeDrag(e){
  const now = performance.now();
  const a = pointerAngleAroundTube(e);
  const prev = sim.tube.dragLastAngle || a;
  const delta = Math.atan2(Math.sin(a-prev), Math.cos(a-prev));
  if(Number.isFinite(delta)){
    sim.tube.angle = clamp((sim.tube.angle || 0) + delta, -Math.PI*0.82, Math.PI*0.82);
    sim.tube.waveAmp = clamp((sim.tube.waveAmp || 0) + Math.abs(delta)*95, 0, 42);
  }
  sim.tube.dragLastAngle = a;
  sim.tube.dragLastTime = now;
  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;
}
function finishTubeDrag(){
  sim.tube.dragging = false;
  pointer.active = false;
  pointer.id = null;
  pointer.mode = null;
  canvas.classList.remove('dragging');
}

canvas.addEventListener('pointerdown', e=>{
  if(!e.isPrimary) return;
  pointer.touches.set(e.pointerId, {x:e.clientX,y:e.clientY});
  const p = screenToWorld(e.clientX, e.clientY);
  pointer.worldX = p.x; pointer.worldY = p.y;

  if(sim.drill && (sim.scene===0 || sim.scene===1) && nearNeedle(p)){
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    canvas.classList.add('dragging');
    pointer.active = true; pointer.id = e.pointerId; pointer.mode = 'needle';
    sim.needle.grab = true; sim.needle.offX = p.x - sim.needle.x; sim.needle.offY = p.y - sim.needle.y; return;
  }
  if(sim.drill && sim.scene===2 && nearAirSyringeBody(p)){
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    canvas.classList.add('dragging');
    pointer.active=true; pointer.id=e.pointerId; pointer.mode='syringeMove';
    sim.air.syringe.offX = p.x - sim.air.syringe.x; sim.air.syringe.offY = p.y - sim.air.syringe.y; return;
  }

  if(canDragTube() && isNearTubeWorld(p)){
    e.preventDefault();
    startTubeDrag(e);
    return;
  }
  if(canDragAir() && isNearAirWorld(p)){
    e.preventDefault();
    startAirDrag(e);
    return;
  }

  if(sim.glueMode){
    e.preventDefault();
    sealNearestCurrentHole(p);
    return;
  }
  if(sim.scene===1 && sim.drawMode){
    e.preventDefault(); startTubeStroke(e); return;
  }
  if(sim.scene===2 && sim.drawMode){
    e.preventDefault(); startAirStroke(e); return;
  }
}, {passive:false});

canvas.addEventListener('pointermove', e=>{
  if(pointer.touches.has(e.pointerId)) pointer.touches.set(e.pointerId, {x:e.clientX,y:e.clientY});
  const wp = screenToWorld(e.clientX, e.clientY);
  pointer.worldX = wp.x; pointer.worldY = wp.y;
  if(!pointer.active || e.pointerId !== pointer.id) return;
  if(pointer.mode==='draw'){ e.preventDefault(); addTubeStrokePoint(e); return; }
  if(pointer.mode==='airDraw'){ e.preventDefault(); addAirStrokePoint(e); return; }
  if(pointer.mode==='needle'){
    e.preventDefault(); const p = screenToWorld(e.clientX, e.clientY); sim.needle.x = p.x - (sim.needle.offX || 0); sim.needle.y = p.y - (sim.needle.offY || 0);
    if(sim.scene===0){ if(sim.stage===0) handleCupNeedle({x:0,y:-150,w:180,h:270,bottom:120}); if(sim.stage===1) handleBalloonNeedle(); if(sim.stage===2) handleRiverNeedle(); }
    if(sim.scene===1) handleTubeNeedle(); return;
  }
  if(pointer.mode==='syringeMove'){ e.preventDefault(); updateSyringeMove(e); return; }
  if(pointer.mode==='tubeDrag'){ e.preventDefault(); updateTubeDrag(e); return; }
  if(pointer.mode==='airDrag'){ e.preventDefault(); updateAirDrag(e); return; }
}, {passive:false});

function endPointer(e){
  pointer.touches.delete(e.pointerId);
  if(e.pointerId !== pointer.id) return;
  if(pointer.mode==='draw') finishTubeStroke();
  else if(pointer.mode==='airDraw') finishAirStroke();
  else if(pointer.mode==='needle') finishNeedleDrag();
  else if(pointer.mode==='syringeMove') finishSyringeDrag();
  else if(pointer.mode==='tubeDrag') finishTubeDrag();
  else if(pointer.mode==='airDrag') finishAirDrag();
  else finishNeedleDrag();
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
}

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', e=>{
  if(e.pointerId === pointer.id && pointer.mode === 'draw') finishTubeStroke();
  if(e.pointerId === pointer.id && pointer.mode === 'airDraw') finishAirStroke();
  if(e.pointerId === pointer.id && pointer.mode === 'tubeDrag') finishTubeDrag();
  if(e.pointerId === pointer.id && pointer.mode === 'airDrag') finishAirDrag();
});
canvas.addEventListener('pointerleave', e=>{
  if(e.pointerType==='mouse' && e.pointerId === pointer.id && pointer.mode === 'draw') finishTubeStroke();
  if(e.pointerType==='mouse' && e.pointerId === pointer.id && pointer.mode === 'airDraw') finishAirStroke();
});

  resetCamera();
  renderTabs();
  requestAnimationFrame(tick);
})();
</script>
</body>
