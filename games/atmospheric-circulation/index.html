<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>v0.418｜風場模擬（太平洋隨機 L/H＋氣候月份參數）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
<style>
:root{ --bg:#070c16; --panel:#0e1726; --ink:#e6eefb; --muted:#8aa0c5; }
*{box-sizing:border-box}
html,body{height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC",ui-sans-serif,system-ui,Segoe UI,Arial}
#app{position:fixed; inset:0; display:grid; grid-template-columns: minmax(0,1fr) minmax(260px,25vw);}
#map{position:relative; background:transparent; transition:background 200ms ease; min-height:0; overflow:hidden}
#map .leaflet-container{position:absolute; inset:0}
#overlay{pointer-events:none; position:absolute; inset:0; width:100%; height:100%; display:block; z-index:100000}
#ui{background:linear-gradient(180deg,rgba(17,26,44,.96),rgba(14,23,38,.96)); border-left:1px solid #16213c; padding:14px 12px 18px; overflow:auto}
h1{margin:0 0 8px; font-size:18px; letter-spacing:.5px; color:#9cc9ff; display:flex; align-items:center; gap:8px}
.badge{font:600 11px/1.8 ui-monospace,monospace; padding:2px 8px; border-radius:999px; background:#12213c; color:#7fbfff; border:1px solid #1a3a63}
.row{display:flex; align-items:center; gap:8px; margin:10px 0 8px; flex-wrap:wrap}
button{cursor:pointer; border:1px solid #3a4b6f; border-radius:10px; padding:8px 10px; color:var(--ink); background:#0f1a2e; font-weight:700}
button:active{transform:translateY(1px)}
label{font-size:12px; color:#8aa0c5}
input[type="range"]{width:100%}
.card{background:#0f1a2e; border:1px solid #1a2b4d; border-radius:14px; padding:10px; margin:10px 0}
.card h3{margin:0 0 6px; font-size:14px; color:#bcd1ff}
.small{font-size:12px; color:#8aa0c5}
.kv{display:flex; align-items:center; justify-content:space-between; font:600 12px/1 ui-monospace,monospace; color:#cfe4ff}
.toast{position:absolute; left:50%; transform:translateX(-50%); bottom:12px; background:rgba(0,0,0,.45); border:1px solid #1a2b4d; border-radius:10px; padding:6px 10px; font-size:12px; color:#d7e8ff; pointer-events:none; z-index:100001}
.legend{height:10px; border-radius:6px; border:1px solid #294060; margin-top:6px; position:relative}
.timebox{display:grid; grid-template-columns: 1fr auto; gap:8px; align-items:center}
#playBtn{border-radius:999px; width:34px; height:34px; display:grid; place-items:center}
.tag{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:999px; font:700 12px ui-monospace; margin-right:6px}
.tag.user{background:#2b2133; color:#ffd6e5; border:1px solid #61345b}
.sys .hdr{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
.sys .hdr h3{font-size:13px; color:#d9e6ff; margin:0}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <canvas id="overlay"></canvas>
    <div id="toast" class="toast" style="display:none"></div>
  </div>
  <aside id="ui">
    <h1>東亞＋西太平洋風場 <span class="badge">v0.418</span></h1>
    <div class="card">
      <h3>時間</h3>
      <div class="row timebox">
        <div class="row" style="gap:6px">
          <span style="color:#9bb8e4;font:600 12px ui-monospace,monospace">年份</span>
          <input id="yearInput" type="number" min="1950" max="2100" step="1" style="width:92px;background:#0b1424;color:#dfe9ff;border:1px solid #294060;border-radius:8px;padding:4px 6px;font:700 13px ui-monospace,monospace">
          <button id="applyYear">套用</button>
        </div>
        <button id="playBtn" title="播放 / 暫停">⏵</button>
      </div>
      <div class="row kv"><span>日期</span><span id="dateLabel" class="mono">—</span></div>
      <input id="daySlider" type="range" min="1" max="366" step="1">
      <div class="row kv"><span>時間倍率</span><span id="tMulLabel" class="mono">1.0×</span></div>
      <input id="timeSpeed" type="range" min="0.1" max="10" step="0.1" value="1">
      <div class="small">每幀＝一天；時間倍率影響播放速度（0.1×–10×），不改變單幀步長。</div>
    </div>

    <div class="small">「新增 L/H」會隨機放在**太平洋**（依月份偏好區域），並套用該月份的氣候參數。</div>
    <div class="row">
      <button id="addLow">新增低壓（L）</button>
      <button id="addHigh">新增高壓（H）</button>
      <button id="reset">清空自訂 L/H</button>
      <button id="toggleMap">關閉底圖</button>
    </div>

    <div class="card">
      <h3>顯示與效能</h3>
      <div class="row kv"><span>粒子數（上限 10,000）</span><span id="pcnt" class="mono"></span></div>
      <input id="particles" type="range" min="200" max="10000" step="100" value="2000">
      <div class="row kv"><span>尾跡長度</span><span id="trailLen" class="mono">0.08</span></div>
      <input id="trail" type="range" min="0.02" max="0.2" step="0.01" value="0.08">
      <div class="row kv"><span>可視速度（倍速）</span><span id="vSpd" class="mono">1×</span></div>
      <input id="visSpeed" type="range" min="1" max="10" step="1" value="1">
      <div class="small">顏色對照（0–50 m/s）：</div>
      <div id="legendWrap" class="legend"></div>
      <div class="row"><label><input type="checkbox" id="showGrid"> 顯示緯經格網</label></div>
    </div>

    <div id="systems"></div>

    <div class="card">
      <h3>資料</h3>
      <div class="row">
        <button id="exportBtn">匯出設定</button>
        <button id="importBtn">匯入設定</button>
        <button id="snapBtn">下載疊圖快照</button>
      </div>
      <input id="fileInput" type="file" accept="application/json" style="display:none">
      <div class="small">匯出內容含 UI 參數與自訂 L/H；快照僅為風場疊圖（不含底圖磚）。</div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<script>
// Map
const map = L.map('map', { center:[23.5,121], zoom:4.2, zoomControl:true, attributionControl:true, worldCopyJump:true });
const tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  maxZoom: 11, minZoom: 3, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);
let mapVisible = true;

// Canvas
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d', { alpha:true });
let DPR=1, W=0, H=0;
function resize(){
  DPR = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  const rect = canvas.getBoundingClientRect();
  W = Math.max(2, Math.floor(rect.width * DPR));
  H = Math.max(2, Math.floor(rect.height * DPR));
  if(W!==canvas.width || H!==canvas.height){ canvas.width=W; canvas.height=H; drawLegend(); }
}
function softClear(a=0.06){
  if(W===0||H===0) return;
  ctx.globalCompositeOperation='destination-in'; ctx.fillStyle=`rgba(0,0,0,${a})`;
  ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over';
}
new ResizeObserver(()=>{ resize(); }).observe(document.getElementById('map'));
document.getElementById('map').appendChild(canvas);

// UI elements
const particlesRange = document.getElementById('particles');
const pcnt = document.getElementById('pcnt');
const trailRange = document.getElementById('trail');
const trailLenLabel = document.getElementById('trailLen');
const visSpeed = document.getElementById('visSpeed');
const vSpdLabel = document.getElementById('vSpd');
const showGrid = document.getElementById('showGrid');
const daySlider = document.getElementById('daySlider');
const dateLabel = document.getElementById('dateLabel');
const playBtn = document.getElementById('playBtn');
const toggleMapBtn = document.getElementById('toggleMap');
const addLowBtn = document.getElementById('addLow');
const addHighBtn = document.getElementById('addHigh');
const resetBtn = document.getElementById('reset');
const systemsWrap = document.getElementById('systems');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const fileInput = document.getElementById('fileInput');
const snapBtn = document.getElementById('snapBtn');
const legendWrap = document.getElementById('legendWrap');
const toast = document.getElementById('toast');
const yearInput = document.getElementById('yearInput');
const applyYearBtn = document.getElementById('applyYear');
const timeSpeed = document.getElementById('timeSpeed');
const tMulLabel = document.getElementById('tMulLabel');

// Date helpers
function isLeap(y){ return (y%4===0 && y%100!==0) || (y%400===0); }
function daysInMonth(y, m0){ return new Date(y, m0+1, 0).getDate(); }
function dateToDOY(d){ const start = new Date(d.getFullYear(),0,1); return Math.floor((d - start)/(24*3600*1000)) + 1; }
function doyToDate(y, doy){ const d=new Date(y,0,1); d.setDate(doy); return d; }
function monthFracFromDate(d){
  const m = d.getMonth();
  const dim = daysInMonth(d.getFullYear(), m);
  return m + (d.getDate()-1)/dim;
}

// Time state
const NOW = new Date();
let SIM_YEAR = NOW.getFullYear();
let simDate = new Date(SIM_YEAR, NOW.getMonth(), NOW.getDate());
daySlider.max = isLeap(SIM_YEAR) ? 366 : 365;
daySlider.value = String(dateToDOY(simDate));
yearInput.value = String(SIM_YEAR);

// animation loop state
let autoPlay=true;
let timeAccum=0; // ms accumulated for day stepping
const FRAME_MS = 180; // base 1x speed: 1 day / 180 ms
const UI = {
  particleCount:+particlesRange.value, trail:+trailRange.value, visSpeed:+visSpeed.value,
  showGrid:false, monthDesired: monthFracFromDate(simDate), monthEff: monthFracFromDate(simDate),
  paused:false, version:'0.418', timeMul:+timeSpeed.value
};
const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function setLabels(){
  pcnt.textContent = UI.particleCount.toLocaleString();
  trailLenLabel.textContent = UI.trail.toFixed(2);
  vSpdLabel.textContent = `${UI.visSpeed}×`;
  tMulLabel.textContent = `${(+UI.timeMul).toFixed(1)}×`;
  const y=simDate.getFullYear(), m=simDate.getMonth(), d=simDate.getDate();
  dateLabel.textContent = `${y} 年 ${MONTH_NAMES[m]} ${d} 日`;
  daySlider.value = String(dateToDOY(simDate));
}
function ping(msg){ toast.textContent=msg; toast.style.display='block'; clearTimeout(ping._t); ping._t=setTimeout(()=>toast.style.display='none',1500); }

// UI wiring
particlesRange.oninput = e=>{ UI.particleCount=+e.target.value; resetParticles(true); setLabels(); softClear(0.04); };
trailRange.oninput = e=>{ UI.trail=+e.target.value; setLabels(); softClear(0.04); };
visSpeed.oninput = e=>{ UI.visSpeed=+e.target.value; setLabels(); softClear(0.04); };
timeSpeed.oninput = e=>{ UI.timeMul=+e.target.value; setLabels(); };
showGrid.onchange = e=>{ UI.showGrid = e.target.checked; softClear(0.04); };
daySlider.oninput = e=>{
  const doy = +e.target.value;
  const maxd = isLeap(SIM_YEAR)?366:365;
  const d = Math.min(Math.max(1,doy), maxd);
  simDate = doyToDate(SIM_YEAR, d);
  UI.monthDesired = monthFracFromDate(simDate);
  setLabels(); regenClimoIfNeeded();
};
applyYearBtn.onclick = ()=>{
  const y = Math.round(+yearInput.value || SIM_YEAR);
  const clamped = Math.min(2100, Math.max(1950, y));
  SIM_YEAR = clamped;
  const prevDOY = dateToDOY(simDate);
  const maxd = isLeap(SIM_YEAR)?366:365;
  const newDOY = Math.min(prevDOY, maxd);
  simDate = doyToDate(SIM_YEAR, newDOY);
  daySlider.max = String(maxd);
  daySlider.value = String(newDOY);
  YEAR_NOISE = SIM_YEAR; // update stochastic year key
  setLabels(); regenClimoIfNeeded(true); ping(`年份已切換：${SIM_YEAR}`);
};
playBtn.onclick = ()=>{ autoPlay=!autoPlay; playBtn.textContent = autoPlay ? '⏸' : '⏵'; };

toggleMapBtn.onclick = ()=>{
  mapVisible = !mapVisible;
  if(mapVisible){ tiles.addTo(map); document.getElementById('map').style.background='transparent'; }
  else{ map.removeLayer(tiles); document.getElementById('map').style.background='radial-gradient(115% 80% at 50% 20%, #0b1730 0%, #081221 60%, #061020 100%)'; }
  toggleMapBtn.textContent = mapVisible ? '關閉底圖' : '開啟底圖';
  softClear(0.08);
};

// Math helpers
function ll2px(lon, lat){ const p = map.latLngToContainerPoint([lat, lon]); return [p.x*DPR, p.y*DPR]; }
function px2ll(x, y){ const p = map.containerPointToLatLng([x/DPR, y/DPR]); return [p.lng, p.lat]; }
function kmToPxAtLat(km, lat){
  const dLat=(km/111.32);
  const p1=map.latLngToContainerPoint([lat,0]);
  const p2=map.latLngToContainerPoint([lat+dLat,0]);
  return Math.abs((p2.y-p1.y)*DPR);
}
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function smoothstep(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function smoothpeak(a,b,c,d,x){ return smoothstep(a,b,x) * (1 - smoothstep(c,d,x)); }
function wrapDiff(a,b){ let d=b-a; if(d>6) d-=12; if(d<-6) d+=12; return d; }
function hash32(n){ n|=0; n=(n+0x7ed55d16)+(n<<12); n=(n^0xc761c23c)^(n>>>19); n=(n+0x165667b1)+(n<<5); n=(n+0xd3a2646c)^(n<<9); n=(n+0xfd7046c5)+(n<<3); n=(n^0xb55a4f09)^(n>>>16); return n>>>0; }
function rndSeed(seed){ let s=seed>>>0; return ()=>{ s=hash32(s+0x9e3779b9); return (s&0xffff)/0xffff; }; }
function cycTri(m, peak, w){ let d=((m-peak+6)%12+12)%12-6; d=Math.abs(d); return clamp(1-d/w,0,1); }
function wrapLon180(lon){ let L = ((lon + 180) % 360 + 360) % 360 - 180; return L; }
function deg2rad(a){ return a*Math.PI/180; }
// --- Antimeridian wrapping helpers ---
function ll2pxAll(lon, lat){
  const shifts = [-360, 0, +360];
  const out = [];
  for(const s of shifts){
    const p = map.latLngToContainerPoint([lat, lon + s]);
    out.push([p.x*DPR, p.y*DPR, lon+s]);
  }
  return out;
}
function ll2pxWrap(lon, lat){
  const arr = ll2pxAll(lon, lat);
  let best = arr[0], bestd = Infinity;
  const cx = (W||canvas.width||1)/2;
  for(const a of arr){
    const d = Math.abs(a[0]-cx);
    if(d<bestd){best=a; bestd=d;}
  }
  return best;
}
function ll2pxNearestTo(x, y, lon, lat){
  const arr = ll2pxAll(lon, lat);
  let best = arr[0], bestd = Infinity;
  for(const a of arr){
    const d = Math.hypot(a[0]-x, a[1]-y);
    if(d<bestd){best=a; bestd=d;}
  }
  return best;
}

// Legend
function speedToColor(s){
  const t=clamp(s/50,0,1);
  const stops=[[0,46,109,246],[0.17,59,214,255],[0.34,128,255,177],[0.50,255,239,107],[0.67,255,155,61],[0.84,255,61,61],[1.00,255,255,255]];
  for(let i=1;i<stops.length;i++){
    if(t<=stops[i][0]){ const t0=stops[i-1][0], t1=stops[i][0], a=(t-t0)/(t1-t0);
      const r=Math.round(stops[i-1][1]*(1-a)+stops[i][1]*a);
      const g=Math.round(stops[i-1][2]*(1-a)+stops[i][2]*a);
      const b=Math.round(stops[i-1][3]*(1-a)+stops[i][3]*a);
      return `rgba(${r},${g},${b},0.95)`; }
  } return 'rgba(255,255,255,0.95)';
}
function drawLegend(){
  const w = legendWrap.clientWidth || 340;
  const h = legendWrap.clientHeight || 10;
  legendWrap.innerHTML='';
  const c = document.createElement('canvas');
  const cw = Math.floor(w*DPR), ch = Math.floor(h*DPR);
  c.width = cw; c.height = ch; c.style.width=w+'px'; c.style.height=h+'px';
  const g = c.getContext('2d');
  for(let x=0;x<c.width;x++){
    const t = x / c.width;
    const s = t*50; // 0..50 m/s
    g.strokeStyle = speedToColor(s);
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,c.height); g.stroke();
  }
  legendWrap.appendChild(c);
}

// Seasonal background
let YEAR_NOISE = SIM_YEAR;
function monthPhase(m){ return (m/12.0) * Math.PI*2; }
function noise2(lon, lat, m, seedA, seedB){
  const x = lon * Math.PI/180, y = lat * Math.PI/180;
  const ph = monthPhase(m) + (YEAR_NOISE*0.37);
  const a = 0.9 + 0.2*Math.sin(seedA + ph);
  const b = 1.3 + 0.3*Math.cos(seedB + ph*0.7);
  const n1 = Math.sin(a*x + 1.7*y + seedA) * Math.cos(0.6*x - b*y + 0.3*seedB);
  const n2 = Math.cos(1.2*x - 0.8*y + 0.7*seedA) * Math.sin(b*x + 1.1*y + seedB);
  return [n1, n2];
}

// Background global circulation
function itczLat(m){ const amp=12, phase=3; return amp*Math.sin(2*Math.PI*(m-phase)/12); }
function winterFactor(lat,m){ const nh=lat>=0?1:-1; const s=Math.cos(2*Math.PI*m/12); return 1+0.35*(nh*s); }
function bgGlobalCore(lon, lat, m){
  const itcz=itczLat(m); const rel=lat-itcz; const absRel=Math.abs(rel);
  const wH=smoothpeak(0,5,28,35,absRel), wF=smoothpeak(25,33,58,66,absRel), wP=smoothstep(57,70,absRel);
  const wSum=wH+wF+wP+1e-6, WH=wH/wSum, WF=wF/wSum, WP=wP/wSum;
  const facW=winterFactor(lat,m);
  const Ue=9.0, Uw=12.0*facW, Up=6.0, Ve=3.0, Vf=1.5*facW, Vp=1.2;
  let uH=-Ue*Math.cos(Math.PI*clamp(absRel,0,30)/30);
  let vH=-Math.sign(rel||1e-6)*Ve*Math.sin(Math.PI*clamp(absRel,0,30)/30);
  let uF=+Uw*Math.cos(Math.PI*clamp(absRel-30,0,30)/30);
  let signF=(absRel>=45?+1:-1)*Math.sign(rel||1e-6);
  let vF=signF*Vf*Math.sin(Math.PI*clamp(Math.abs(absRel-45),0,15)/15);
  let uP=-Up*Math.cos(Math.PI*clamp(absRel-60,0,30)/30);
  let vP=-Math.sign(rel||1e-6)*Vp*Math.cos(Math.PI*clamp(absRel-60,0,30)/30);
  let u=WH*uH+WF*uF+WP*uP, v=WH*vH+WF*vF+WP*vP;
  if(lon>=110 && lon<=135 && lat>=10 && lat<=30){
    const wWin = Math.pow(cycTri(m, 1.0, 2.2), 1.2);
    u += -3.0 * wWin; v += -4.0 * wWin;
  }
  if(lon>=90 && lon<=120 && lat>=5 && lat<=25){
    const sw = Math.pow(cycTri(m, 7.0, 3.0), 1.1);
    u += 1.5*sw; v += 2.2*sw;
  }
  const mag=Math.hypot(u,v), LIM=22; if(mag>LIM){ u*=LIM/mag; v*=LIM/mag; } return [u,v];
}
function bgGlobalAt(lon, lat, m){
  let [u,v] = bgGlobalCore(lon,lat,m);
  const [n1,n2]=noise2(lon,lat,m, 1.234, 3.21);
  const amp = 0.8;
  u += amp * n1; v += amp * n2;
  return [u,v];
}

// Land/terrain masks (coarse)
function sRect(lon,lat,W,E,S,N,pad){
  const sx = smoothstep(W-pad,W,lon) * (1 - smoothstep(E,E+pad,lon));
  const sy = smoothstep(S-pad,S,lat) * (1 - smoothstep(N,N+pad,lat));
  return clamp(sx*sy,0,1);
}
// retain previous detailed East Asia land/orog; sufficient for West Pac sampling
function landMask(lon,lat){
  let m=0;
  m = 1 - (1 - 0.9*sRect(lon,lat,100,150,15,55,2))
        * (1 - 0.6*sRect(lon,lat,124,133,33,40,1.2))
        * (1 - 0.8*sRect(lon,lat,129,146,30,46,2.0))
        * (1 - 0.7*sRect(lon,lat,122,131,24,28,0.8))
        * (1 - 0.8*sRect(lon,lat,117,126,5,21,1.4))
        * (1 - 1.0*sRect(lon,lat,119,122,21.5,25.5,0.5));
  return clamp(m,0,1);
}
function orogMask(lon,lat){
  let m=0;
  m = Math.max(m, 0.9*sRect(lon,lat,120.6,122.1,22.2,24.7,0.3));
  m = Math.max(m, 0.7*sRect(lon,lat,137.0,139.5,35.0,37.8,0.4));
  m = Math.max(m, 0.6*sRect(lon,lat,120.6,122.2,15.0,19.0,0.5));
  return clamp(m,0,1);
}
function frictionFactor(lon,lat){
  const L = landMask(lon,lat);
  const O = orogMask(lon,lat);
  const f = 1 - (0.30*L + 0.15*L*L) - 0.20*O;
  return clamp(f, 0.45, 1.0);
}

// SST boosts
function sstBoost(lon,lat,m){
  const warm = sRect(lon,lat,120,160,5,20,3.0) * Math.pow(cycTri(m, 7.5, 2.5), 1.2);
  const cold = sRect(lon,lat,145,170,25,40,2.5) * Math.pow(cycTri(m, 1.5, 2.0), 1.0);
  return clamp(0.9*warm - 0.6*cold, -1, +1);
}

// Climo systems
let climo=[];
function addHL(arr,type,lon,lat,r,v,spiral,id,rng){
  const jx=(rng()-0.5), jy=(rng()-0.5);
  const lonJ=lon + jx*(type==='high'?3.0:2.4);
  const latJ=lat + jy*(type==='high'?2.2:2.0);
  const rJ = r * (0.9 + 0.2*rng());
  const vJ = v * (0.9 + 0.2*rng());
  arr.push({id,type,lon:lonJ,lat:latJ,radiusKm:rJ,vmax:vJ,spiral:(spiral ?? (type==='low'?0.25:0.12)), decayKm:rJ*1.8, isClimo:true});
}
function generateClimo(m){
  const seed = Math.floor(m*10007) ^ (SIM_YEAR*2654435761>>>0) ^ 0x5a8b13;
  const rng = rndSeed(seed);
  const L=[];
  const wSib = Math.pow(cycTri(m, 1.0, 2.4), 1.1);
  const H_r = 1000*(0.6+0.9*wSib), H_v = 12*(0.6+0.9*wSib);
  addHL(L,'high', 110, 45, H_r, H_v, 0.10, 'SiberianMongolianHigh', rng);
  const wWNP = Math.pow(cycTri(m, 7.0, 3.0), 1.0) + 0.25*Math.pow(cycTri(m, 5.0, 1.6), 1.2);
  const SH_r = 1100*(0.5+0.9*wWNP), SH_v = 13*(0.5+0.9*wWNP);
  addHL(L,'high', 140, 25, SH_r, SH_v, 0.10, 'WNP_SubtropicalHigh', rng);
  const wMei = Math.pow(cycTri(m, 5.8, 1.3), 1.3);
  if(wMei>0.05){
    const L_r = 650*(0.6+0.6*wMei), L_v = 15*(0.6+0.7*wMei);
    addHL(L, 'low', 125, 27, L_r, L_v, 0.26, 'MeiyuFrontalLow', rng);
  }
  climo = L;
}

// === NEW: Pacific-random placement & climate-aware defaults ===
function rand(a,b){ return a + Math.random()*(b-a); }
function choose(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// pick a Pacific ocean position (focus West/Central Pacific near our domain);
function randomPacificSpot(type, m){
  // seasonal lat band preference: NH TC season JASO; SH DJF-MAM
  const nhPeak = cycTri(m, 8.5, 2.5);
  const shPeak = cycTri((m+6)%12, 8.5, 2.5);
  let lon, lat;
  if(type==='low'){
    if(nhPeak >= shPeak){
      // West North Pacific genesis belt 120E–170E, 5–25N (shift poleward into peak)
      const beltLat = rand(6, 22) + 6*nhPeak;
      lon = rand(120, 170);
      lat = beltLat;
    }else{
      // South Pacific 150E–170W (i.e., 150..180, -180..-170), 5–20S
      const useWest = Math.random()<0.7;
      if(useWest){ lon = rand(150, 179.5); } else { lon = rand(-179.5, -170); }
      lat = -rand(6, 22);
    }
  }else{
    // Subtropical Pacific High belt 130E–170E, 15–35N; stronger in MJJAS
    lon = rand(130, 170);
    const belt = 15 + 18*cycTri(m, 6.0, 3.0); // 15..33
    lat = rand(Math.max(12, belt-5), Math.min(38, belt+5));
  }
  // avoid immediate land using coarse East-Asia mask; if land, nudge eastward
  for(let i=0;i<6;i++){
    if(landMask(lon, lat) < 0.4) break;
    lon += 2.5; if(lon>180) lon -= 360;
  }
  return [wrapLon180(lon), clamp(lat, -40, 55)];
}

function climateDefaults(type, lon, lat, m){
  // weights
  const nh = lat>=0;
  const nhTC = nh ? Math.pow(cycTri(m, 8.5, 2.5),1.1) : Math.pow(cycTri((m+6)%12, 8.5, 2.5),1.1);
  const subtHigh = Math.pow(cycTri(m, 6.0, 3.0),1.0);
  if(type==='low'){
    // stronger in peak TC season & warm SST zones
    const warmBoost = clamp(0.5 + 0.8*nhTC + 0.3*sstBoost(lon,lat,m), 0.4, 1.5);
    const radius = 160 + 260*nhTC;   // 160..420 km
    const vmax   = 18 + 28*nhTC;     // 18..46 m/s
    const spiral = 0.30 + 0.10*nhTC; // 0.30..0.40
    return { radiusKm: radius*warmBoost, vmax: vmax*warmBoost, spiral, baseR: radius, baseVRef: 30 };
  }else{
    // Pacific High larger/stronger in MJJAS
    const size = 600 + 750*subtHigh; // 600..1350 km
    const vmax = 8 + 8*subtHigh;     // 8..16 m/s
    const spiral = 0.10 + 0.03*subtHigh;
    return { radiusKm: size, vmax, spiral, baseR: size, baseVRef: 15 };
  }
}

// Field helpers
function coriolisHemSign(lat){ return (lat>=0)?+1:-1; }
function tangentVec(dx,dy,rot){ const r=Math.hypot(dx,dy)+1e-9; return (rot>0)? [ (dy/r), (-dx/r) ] : [ (-dy/r), (dx/r) ]; }
function radialVec(dx,dy){ const r=Math.hypot(dx,dy)+1e-9; return [dx/r, dy/r]; }
function systemFieldAtPx_single(s,x,y){
  const [_sx,_sy,_lonUsed]=ll2pxNearestTo(x,y,s.lon, s.lat); const dx=x-_sx, dy=y-_sy;
  const r=Math.hypot(dx,dy)+1e-6; const rc=kmToPxAtLat(s.radiusKm,s.lat); const decay=s.decayKm?kmToPxAtLat(s.decayKm,s.lat):rc*1.8;
  const vt=s.vmax*(r/rc)*Math.exp(-(r*r)/(decay*decay)); const hem=coriolisHemSign(s.lat); const rot=(s.type==='low'?+1:-1)*hem;
  const [tx,ty]=tangentVec(dx,dy,rot); const [rx,ry]=radialVec(dx,dy); const vr=(s.spiral ?? (s.type==='low'?0.25:0.12))*vt*(s.type==='low'?-1:+1);
  return [vt*tx + vr*rx, vt*ty + vr*ry];
}
function systemsFieldAtPx(x,y){ let u=0,v=0; for(const s of climo){ const z=systemFieldAtPx_single(s,x,y); u+=z[0]; v+=z[1]; } for(const s of systemsUser){ const z=systemFieldAtPx_single(s,x,y); u+=z[0]; v+=z[1]; } return [u,v]; }
function fieldAtPx(x,y){
  const [lon,lat]=px2ll(x,y);
  const bg=bgGlobalAt(lon,lat,UI.monthEff);
  const sys=systemsFieldAtPx(x,y);
  const fr = frictionFactor(lon,lat);
  return [(bg[0]+sys[0])*fr, (bg[1]+sys[1])*fr];
}

// Local derivatives
function envDerivativesAtPx(x,y,h){
  const hp = h, hm = -h;
  const [uR,vR] = fieldAtPx(x+hp,y);
  const [uL,vL] = fieldAtPx(x+hm,y);
  const [uT,vT] = fieldAtPx(x,y+hp);
  const [uB,vB] = fieldAtPx(x,y+hm);
  const du_dx = (uR - uL) / (2*h);
  const dv_dy = (vT - vB) / (2*h);
  const du_dy = (uT - uB) / (2*h);
  const dv_dx = (vR - vL) / (2*h);
  const div = du_dx + dv_dy;
  const zeta = dv_dx - du_dy;
  const shear = Math.hypot(du_dy, dv_dx);
  return {div, zeta, shear};
}

// β-drift (simplified)
function betaDriftVector(s){
  const hem = coriolisHemSign(s.lat);
  const B = 0.8 * Math.pow(s.radiusKm/250, 0.7) * Math.pow(Math.max(5,s.vmax)/30, 0.8);
  let u = -B;
  let v = (s.type==='low' ? +hem : -0.3*hem) * 0.6*B;
  return [u, v];
}

// Evolution
const SYS_MOB_BASE = 6.0;
const G_ZETA_BASE = 55.0;
const G_DIV_BASE  = 45.0;
const G_SHEAR     = 25.0;
const DAMP        = 0.6;
function updateUserSystems(dt){
  const h = 8 * DPR;
  for(const s of systemsUser){
    const [cx,cy] = ll2px(s.lon, s.lat);
    const [u1,v1] = fieldAtPx(cx,cy);
    const mx = cx + 0.5 * dt * (SYS_MOB_BASE * (s.mobility??1)) * u1;
    const my = cy + 0.5 * dt * (SYS_MOB_BASE * (s.mobility??1)) * v1;
    const [u2,v2] = fieldAtPx(mx,my);
    const nx = cx + dt * (SYS_MOB_BASE * (s.mobility??1)) * u2;
    const ny = cy + dt * (SYS_MOB_BASE * (s.mobility??1)) * v2;
    let [nlon,nlat] = px2ll(nx,ny);

    const [ub, vb] = betaDriftVector(s);
    const m_per_deg_lat = 111320;
    const m_per_deg_lon = Math.max(1e-6, m_per_deg_lat * Math.cos(deg2rad(s.lat)));
    nlat += (vb * dt) / m_per_deg_lat;
    nlon += (ub * dt) / m_per_deg_lon;

    if(nlat>80) nlat=80; if(nlat<-80) nlat=-80;
    s.lon = wrapLon180(nlon); s.lat = nlat;

    const {div, zeta, shear} = envDerivativesAtPx(cx,cy,h);
    const hem = coriolisHemSign(s.lat);
    const cyclPref = (s.type==='low') ? +hem : -hem;
    const envCycl = Math.max(0, zeta * cyclPref);
    const envConv = Math.max(0, (s.type==='low' ? -div : +div));
    const gain = (s.envGain ?? 1);

    const sb = sstBoost(s.lon, s.lat, UI.monthEff);
    const sstGain = (s.type==='low') ? (1 + 0.6*sb) : (1 - 0.4*sb);

    const land = landMask(s.lon, s.lat);
    const orog = orogMask(s.lon, s.lat);
    const landDamp = (s.type==='low' ? (1.8*land + 1.2*orog) : (0.8*land + 0.6*orog));

    let dv = ((G_ZETA_BASE*gain*sstGain)*envCycl + (G_DIV_BASE*gain*sstGain)*envConv - G_SHEAR*shear) * dt - (DAMP*0.2 + landDamp*0.25) * dt;
    s.vmax += dv;

    const vmin = (s.type==='low'? 8:6), vmax = (s.type==='low'? 55:30);
    if(s.vmax < vmin) s.vmax = vmin;
    if(s.vmax > vmax) s.vmax = vmax;

    if(!s.baseR) s.baseR = s.radiusKm;
    if(!s.baseVRef) s.baseVRef = (s.type==='low'?30:15);
    const rTarget = clamp(s.baseR * Math.pow(s.baseVRef/Math.max(5,s.vmax), 0.35), 80, 1200);
    const rate = clamp(0.8*dt*(s.radiusGain??1), 0, 0.25);
    s.radiusKm += (rTarget - s.radiusKm) * rate;
    s.decayKm = s.radiusKm * 1.8;
  }
}

// Grid & systems drawing
function drawGrid(){
  if(!UI.showGrid) return;
  const b=map.getBounds(); const latMin=Math.floor(b.getSouth()/10)*10, latMax=Math.ceil(b.getNorth()/10)*10; const lonMin=Math.floor(b.getWest()/10)*10, lonMax=Math.ceil(b.getEast()/10)*10;
  ctx.save(); ctx.lineWidth=1; ctx.strokeStyle='rgba(88,118,163,0.35)'; ctx.fillStyle='#87a7d6'; ctx.font=`${12*DPR}px ui-monospace`;
  for(let lat=latMin; lat<=latMax; lat+=10){ const a=ll2px(lonMin,lat), c=ll2px(lonMax,lat); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(c[0],c[1]); ctx.stroke(); ctx.fillText(`${lat}°`, a[0]+6*DPR, a[1]-2*DPR); }
  for(let lon=lonMin; lon<=lonMax; lon+=10){ const a=ll2px(lon,latMin), c=ll2px(lon,latMax); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(c[0],c[1]); ctx.stroke(); }
  ctx.restore();
}
function drawSystems(){
  ctx.save();
  const margin = 120*DPR;
  for(const s of climo){
    const arr = ll2pxAll(s.lon,s.lat);
    for(const a of arr){ const x=a[0], y=a[1]; if(x<-margin||x>W+margin||y<-margin||y>H+margin) continue;
      ctx.font=`${13*DPR}px ui-monospace`;
      ctx.lineWidth=3*DPR; ctx.strokeStyle='rgba(5,10,20,0.7)';
      ctx.strokeText(s.type==='low'?'L':'H', x+4*DPR, y-4*DPR);
      ctx.fillStyle='#d8e9ff';
      ctx.fillText(s.type==='low'?'L':'H', x+4*DPR, y-4*DPR);
    }
  }
  for(const s of systemsUser){
    const arr = ll2pxAll(s.lon,s.lat);
    for(const a of arr){ const x=a[0], y=a[1]; if(x<-margin||x>W+margin||y<-margin||y>H+margin) continue;
      const rpx = (s.radiusKm>0)? kmToPxAtLat(s.radiusKm, s.lat) : 0;
      if(rpx>0){
        ctx.beginPath(); ctx.arc(x,y, rpx, 0, Math.PI*2);
        ctx.strokeStyle = s.type==='low' ? '#ff8fa3' : '#9ac7ff'; ctx.lineWidth = 1.6*DPR; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(x,y, 3*DPR, 0, Math.PI*2);
      ctx.fillStyle = s.type==='low' ? '#ffb3c1' : '#b3d7ff'; ctx.fill();
      ctx.font = `${12*DPR}px ui-monospace`; ctx.fillStyle = s.type==='low' ? '#ffd8df' : '#d8e9ff';
      ctx.fillText(s.type==='low'?'L':'H', x+5*DPR, y-5*DPR);
    }
  }
  ctx.restore();
}

// Animation
let last=performance.now();
const K=14;
function advectRK2(x,y,dt){
  const k=K*UI.visSpeed*DPR; let u1=0,v1=0; [u1,v1]=fieldAtPx(x,y);
  const xm=x+0.5*dt*k*u1, ym=y+0.5*dt*k*v1; let u2=0,v2=0; [u2,v2]=fieldAtPx(xm,ym);
  const nx=x+dt*k*u2, ny=y+dt*k*v2;
  return [nx,ny,Math.hypot(u2,v2)];
}
function stepSimDay(){
  let doy = dateToDOY(simDate) + 1;
  const maxd = isLeap(SIM_YEAR) ? 366 : 365;
  if(doy>maxd){
    SIM_YEAR += 1;
    yearInput.value = String(SIM_YEAR);
    YEAR_NOISE = SIM_YEAR;
    daySlider.max = String(isLeap(SIM_YEAR)?366:365);
    doy = 1;
    regenClimoIfNeeded(true);
  }
  simDate = doyToDate(SIM_YEAR, doy);
  UI.monthDesired = monthFracFromDate(simDate);
  setLabels();
}
function tick(now){
  if(W===0||H===0){ resize(); requestAnimationFrame(tick); return; }
  const dt = Math.min(0.05, (now - last)/1000); last = now;

  if(autoPlay && !UI.paused){
    timeAccum += dt*1000 * (UI.timeMul||1);
    while(timeAccum >= FRAME_MS){
      stepSimDay();
      timeAccum -= FRAME_MS;
    }
    const tau=0.35; const k=clamp(dt/tau,0,1); const d=wrapDiff(UI.monthEff, UI.monthDesired); UI.monthEff=(UI.monthEff+k*d+12)%12;
  }

  updateUserSystems(dt);

  ctx.globalCompositeOperation='destination-in'; const alpha=1-UI.trail; ctx.fillStyle=`rgba(0,0,0,${alpha})`; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';
  drawGrid();
  const n=P.length/2; ctx.lineWidth=Math.max(1*DPR,1);
  for(let i=0;i<n;i++){
    const idx=2*i, x=P[idx], y=P[idx+1];
    let nx,ny,spd; [nx,ny,spd]=advectRK2(x,y,dt);
    if(spd>25){ let mx,my; [mx,my]=advectRK2(x,y,dt*0.5); [nx,ny,spd]=advectRK2(mx,my,dt*0.5); }
    ctx.strokeStyle=speedToColor(spd); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); ctx.stroke();
    if(nx<0||nx>=W||ny<0||ny>=H){ P[idx]=Math.random()*W; P[idx+1]=Math.random()*H; continue; }
    P[idx]=nx; P[idx+1]=ny;
  }
  drawSystems();
  requestAnimationFrame(tick);
}

        for(const k of ['visSpeed','trail','particleCount','showGrid','monthDesired','monthEff','paused','timeMul']) if(typeof obj.UI[k] !== 'undefined'){ UI[k]=obj.UI[k]; }
        visSpeed.value=UI.visSpeed; trailRange.value=UI.trail; particlesRange.value=UI.particleCount; showGrid.checked=!!UI.showGrid; timeSpeed.value=UI.timeMul||1;
      }
      if(Array.isArray(obj.systemsUser)){ systemsUser = obj.systemsUser; rebuildSystemCards(); }
      setLabels(); drawLegend(); regenClimoIfNeeded(true); ping('設定已載入。');
    }catch(err){ ping('載入失敗：' + err.message); }
  };
  reader.readAsText(f);
};
snapBtn.onclick = ()=>{
  const out = document.createElement('canvas'); out.width=canvas.width; out.height=canvas.height;
  const octx = out.getContext('2d'); octx.drawImage(canvas,0,0);
  out.toBlob(blob=>{ const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'wind_overlay_v0_418.png'; a.click(); URL.revokeObjectURL(url); });
};

// Climo regen
let lastClimoM=-999;
function regenClimoIfNeeded(force=false){
  const diff = Math.abs(wrapDiff(lastClimoM<0?UI.monthDesired:lastClimoM, UI.monthDesired));
  if(force || diff>0.25 || lastClimoM<0){ generateClimo(UI.monthDesired); lastClimoM=UI.monthDesired; }
}

// Boot
function initParticles(){ const n=UI.particleCount; P=new Float32Array(n*2); for(let i=0;i<n;i++){ P[2*i]=Math.random()*W; P[2*i+1]=Math.random()*H; } }
map.whenReady(()=>{
  resize(); drawLegend(); setLabels(); regenClimoIfNeeded(true); initParticles(); rebuildSystemCards();
  requestAnimationFrame((t)=>{ last=t; tick(t); });
});
</script>
