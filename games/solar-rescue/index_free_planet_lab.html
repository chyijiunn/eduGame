<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Free Planet Lab — 自創行星與軌道實驗室</title>
<style>
  :root{ --sidebar-w: 340px; }
  *{box-sizing:border-box}
  html, body { margin:0; height:100%; background:#000; color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Helvetica Neue",Arial;
    -webkit-user-select:none; user-select:none; overscroll-behavior:none }
  #topbar{position:fixed;left:0;right:var(--sidebar-w);top:0;display:flex;gap:10px;padding:8px 12px;align-items:center;
      background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.25));backdrop-filter:blur(2px);z-index:3;font-size:14px}
  .pill{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08)}
  #msg{position:fixed;left:calc(50% - var(--sidebar-w)/2);top:54px;transform:translateX(-50%);padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.6);
       z-index:3;pointer-events:none;opacity:0;transition:opacity .2s ease;white-space:pre-line}
  #canvasWrap{position:fixed;left:0;top:0;bottom:0;right:var(--sidebar-w);}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #side{position:fixed;right:0;top:0;bottom:0;width:var(--sidebar-w);background:#0f1116;border-left:1px solid rgba(255,255,255,.12);
        z-index:4;display:flex;flex-direction:column}
  #side header{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
  #side h3{margin:0;font-size:16px}
  #side .scroll{overflow:auto;padding:12px 12px 40px}
  .sec{margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed rgba(255,255,255,.08)}
  .sec h4{margin:0 0 8px 0;font-size:13px;opacity:.9}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}
  .row label{font-size:12px;opacity:.9}
  .row input[type=range]{width:168px}
  .badge{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px;font-size:12px}
  .color{display:flex;gap:6px;align-items:center}
  .color input[type=color]{width:32px;height:24px;border:0;background:none;padding:0}
  .btn{background:rgba(255,255,255,.12);border:0;border-radius:8px;color:#fff;padding:6px 10px;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.18)}
  #hint{position:fixed;left:10px;bottom:12px;z-index:3;background:#00000073;padding:6px 10px;border-radius:8px;font-size:12px}
  @media (max-width: 860px){
    :root{ --sidebar-w: 100vw; }
    #topbar{right:0}
    #canvasWrap{right:0; bottom:50vh}
    #side{top:50vh;width:100vw}
    #msg{left:50%}
  }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">自創行星實驗室（Free）</div>
  <div class="pill">已救援 🧍：<span id="rescued">0</span></div>
  <div class="pill">死亡 💀：<span id="dead">0</span></div>
  <div class="pill">星艦能源 🔋：<span id="energy">∞</span></div>
  <button class="btn" id="clearShips">清除小星艦</button>
  <button class="btn" id="clearCreatures">重生生物</button>
</div>
<div id="msg"></div>

<div id="canvasWrap"><canvas id="game"></canvas></div>

<aside id="side">
  <header>
    <h3>⚙️ 設定</h3>
    <div style="display:flex;gap:8px">
      <button class="btn" id="reset">回預設</button>
      <button class="btn" id="export">匯出設定</button>
    </div>
  </header>
  <div class="scroll">
    <div class="sec">
      <h4>行星幾何與外觀</h4>
      <div class="row"><label>半徑 R</label><input id="R" type="range" min="70" max="220" step="1"><span class="badge" id="Rv"></span></div>
      <div class="row color"><label>顏色</label><input id="color" type="color"><span class="badge" id="colorv"></span></div>
      <div class="row"><label>外環（像土星環）</label><input id="ring" type="checkbox"></div>
      <div class="row"><label>表面條紋</label>
        <select id="stripe">
          <option value="none">無</option>
          <option value="bands">水平條帶</option>
          <option value="storm">風暴斑</option>
        </select>
      </div>
    </div>
    <div class="sec">
      <h4>重力與大氣</h4>
      <div class="row"><label>表面重力 g</label><input id="g" type="range" min="2" max="30" step="0.1"><span class="badge" id="gv"></span></div>
      <div class="row"><label>大氣阻力（drag）</label><input id="dragMul" type="range" min="0" max="3" step="0.01"><span class="badge" id="dragMulv"></span></div>
      <div class="row"><label>核心軟化係數</label><input id="soft" type="range" min="0.2" max="0.7" step="0.01"><span class="badge" id="softv"></span></div>
    </div>
    <div class="sec">
      <h4>入軌輔助（教學用途）</h4>
      <div class="row"><label>切線化強度</label><input id="assist" type="range" min="0" max="1.5" step="0.01"><span class="badge" id="assistv"></span></div>
      <div class="row"><label>向心抑制</label><input id="radial" type="range" min="0" max="1.8" step="0.01"><span class="badge" id="radialv"></span></div>
      <div class="row"><label>物理子步進</label><input id="substeps" type="range" min="1" max="10" step="1"><span class="badge" id="substepsv"></span></div>
    </div>
    <div class="sec">
      <h4>生物（圓周剪影）</h4>
      <div class="row"><label>數量</label><input id="creaturesN" type="range" min="3" max="24" step="1"><span class="badge" id="creaturesNv"></span></div>
      <div class="row"><label>種類（1–5種隨機混搭）</label><input id="speciesKinds" type="range" min="1" max="5" step="1"><span class="badge" id="speciesKindsv"></span></div>
      <div class="row"><label>速度倍率</label><input id="creatureSpeed" type="range" min="0.3" max="2.0" step="0.01"><span class="badge" id="creatureSpeedv"></span></div>
    </div>
    <div class="sec">
      <h4>小星艦</h4>
      <div class="row"><label>拉弓初速倍率</label><input id="launchScale" type="range" min="0.1" max="1.2" step="0.01"><span class="badge" id="launchScalev"></span></div>
      <div class="row"><label>救援後推進力</label><input id="pickupThrust" type="range" min="0" max="40" step="1"><span class="badge" id="pickupThrustv"></span></div>
      <div class="row"><label>推進模式</label>
        <select id="pickupMode">
          <option value="prograde">沿速度方向（prograde）</option>
          <option value="radialOut">徑向外推（radialOut）</option>
        </select>
      </div>
      <div class="row"><label>無限能源</label><input id="infiniteEnergy" type="checkbox" checked></div>
    </div>
  </div>
</aside>

<div id="hint">拉弓式：按下=發射點 → 往後拉=速度（方向取反）→ 放開=發射；救援後可推進逃逸。右側調整行星與小星艦參數即時更新。</div>

<script>
const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d',{alpha:false});
function resizeCanvas(){ const dpr=Math.max(1,window.devicePixelRatio||1); const rect=document.getElementById('canvasWrap').getBoundingClientRect(); canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr) }
addEventListener('resize',resizeCanvas); if(window.visualViewport) window.visualViewport.addEventListener('resize',resizeCanvas); addEventListener('orientationchange',()=>setTimeout(resizeCanvas,200)); resizeCanvas();
const $=(id)=>document.getElementById(id);
function bindRange(id,obj,key,fmt=(v)=>v){const el=$(id),lab=$(id+'v');const apply=()=>{obj[key]=Number(el.value);if(lab)lab.textContent=fmt(obj[key])};el.addEventListener('input',apply);apply();return el}
function bindSelect(id,obj,key){const el=$(id);const apply=()=>{obj[key]=el.value};el.addEventListener('change',apply);apply();return el}
function bindCheck(id,obj,key){const el=$(id);const apply=()=>{obj[key]=el.checked};el.addEventListener('change',apply);apply();return el}
function showMsg(t,ms=1200){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(showMsg._t);showMsg._t=setTimeout(()=>m.style.opacity=0,ms)}
const STATE={rescued:0,dead:0,energy:Infinity,infiniteEnergy:true};
const planet={R:140,color:"#5fb9e5",ring:false,stripe:"bands",g:9.81,dragMul:1.0,soft:0.33,assist:0.8,radial:0.85,substeps:6};
const bio={creaturesN:10,speciesKinds:3,creatureSpeed:1.0};
const shipCfg={launchScale:0.35,pickupThrust:18,pickupMode:"prograde"};
const MU_SCALE=0.22, BASE_DRAG=0.00011, GRAV_CAP=28; const ORBIT_BAND_IN=1.03, ORBIT_BAND_OUT=1.9;
function planetCenter(){ const rect=document.getElementById('canvasWrap').getBoundingClientRect(); return {x:rect.width*0.5,y:rect.height*0.56} }
const SPECIES=["bud","tri","ring","tall","blob"]; let creatures=[];
function rand(a,b){return a+Math.random()*(b-a)} function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function spawnCreatures(){ creatures=[]; const kinds=new Set(); while(kinds.size<Math.min(bio.speciesKinds,SPECIES.length)) kinds.add(pick(SPECIES)); const used=[...kinds];
  for(let i=0;i<bio.creaturesN;i++){ const spec=used[i%used.length]; const ang=Math.random()*Math.PI*2; const size=Math.round(rand(8,16)*(spec==="blob"?1.2:1)*(spec==="tall"?1.1:1)); const spd=(Math.random()<0.5?-1:1)*(0.32+Math.random()*0.5)*bio.creatureSpeed*(spec==="tri"?1.1:1);
    creatures.push({alive:true,angle:ang,speed:spd,species:spec,size}); } }
let ships=[]; let dragging=false,anchor=null,pointer=null,activePointerId=null;
function addShip(pos,release){ if(!STATE.infiniteEnergy){ if(!Number.isFinite(STATE.energy)) STATE.energy=50; if(STATE.energy<2){showMsg('⚠️ 能源不足'); return} STATE.energy-=2; }
  const dx=release.x-pos.x, dy=release.y-pos.y; const s=shipCfg.launchScale; let vx=-dx*s, vy=-dy*s; ships.push({x:pos.x,y:pos.y,vx,vy,alive:true,carrying:false,trail:[],_orbitStable:false,_timer:0}); updateTopbar(); }
function updateTopbar(){ $('rescued').textContent=STATE.rescued; $('dead').textContent=STATE.dead; $('energy').textContent= STATE.infiniteEnergy ? '∞' : Math.max(0,Math.round(STATE.energy||0)); }
$('clearShips').onclick=()=>{ships.length=0}; $('clearCreatures').onclick=()=>{spawnCreatures()};
canvas.addEventListener('pointerdown',e=>{e.preventDefault();activePointerId=e.pointerId;canvas.setPointerCapture(activePointerId);dragging=true;const r=canvas.getBoundingClientRect();anchor={x:e.clientX-r.left,y:e.clientY-r.top};pointer=anchor});
canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==activePointerId) return; e.preventDefault();const r=canvas.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top}});
function endGesture(e){if(!dragging||e.pointerId!==activePointerId) return; e.preventDefault(); const r=canvas.getBoundingClientRect(); const rel={x:e.clientX-r.left,y:e.clientY-r.top}; addShip(anchor,rel); dragging=false; activePointerId=null}
canvas.addEventListener('pointerup',endGesture); canvas.addEventListener('pointercancel',endGesture);
function substep(dt){ const c=planetCenter();
  for(const b of creatures){ if(b.alive) b.angle+=b.speed*dt }
  for(const s of ships){ if(!s.alive) continue; const rx=c.x-s.x, ry=c.y-s.y, r2=rx*rx+ry*ry, r=Math.sqrt(r2);
    const mu=MU_SCALE*planet.g*(planet.R*planet.R); const soft=(planet.soft*planet.R)**2; let grav=mu/Math.max(r2+soft,800); grav=Math.min(grav,GRAV_CAP);
    const invr=1/(r||1); const ax=grav*(rx*invr), ay=grav*(ry*invr);
    const drag=BASE_DRAG*planet.dragMul; s.vx+=(ax - s.vx*drag)*dt; s.vy+=(ay - s.vy*drag)*dt;
    const near=r>planet.R*ORBIT_BAND_IN && r<planet.R*ORBIT_BAND_OUT;
    if(near && !s.carrying){ const vr=(s.vx*rx+s.vy*ry)*invr; if(vr<0){ const k=planet.radial*dt; s.vx-=(vr*rx*invr)*k; s.vy-=(vr*ry*invr)*k; }
      const sign=(s.vx*ry - s.vy*rx)>=0?1:-1; const tx=-sign*ry*invr, ty=sign*rx*invr; const vCirc=Math.sqrt(Math.max(mu*invr,0)); const blend=planet.assist*dt*0.35; s.vx=s.vx*(1-blend)+(tx*vCirc)*blend; s.vy=s.vy*(1-blend)+(ty*vCirc)*blend; }
    if(s.carrying){ const thrust=shipCfg.pickupThrust; if(shipCfg.pickupMode==="prograde"){ const vmag=Math.hypot(s.vx,s.vy)||1; s.vx+=(s.vx/vmag)*thrust*dt; s.vy+=(s.vy/vmag)*thrust*dt; } else { s.vx+=(-rx*invr)*thrust*dt; s.vy+=(-ry*invr)*thrust*dt; } }
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(r<planet.R*0.95){ const alive=creatures.filter(b=>b.alive); let kill=Math.min(alive.length, Math.max(1, Math.floor(Math.hypot(s.vx,s.vy)/140))); for(let i=0;i<alive.length&&kill>0;i++){alive[i].alive=false;kill--} STATE.dead += Math.max(1,Math.floor(Math.hypot(s.vx,s.vy)/140)); updateTopbar(); showMsg('💥 墜毀！'); s.alive=false; continue; }
    const vmag=Math.hypot(s.vx,s.vy); const dot=(s.vx*rx+s.vy*ry)/(vmag*r+1e-6); const nearT=Math.abs(dot)<.26;
    if(near && nearT){ s._timer=(s._timer||0)+dt; if(s._timer>0.55) s._orbitStable=true } else { s._timer=Math.max(0,(s._timer||0)-dt*.7); if(s._timer<.18) s._orbitStable=false }
    if(s._orbitStable && !s.carrying){ const cap=18; for(const b of creatures){ if(!b.alive) continue; const bx=c.x+Math.cos(b.angle)*(planet.R*1.05), by=c.y+Math.sin(b.angle)*(planet.R*1.05); if(Math.hypot(s.x-bx,s.y-by)<cap){ b.alive=false; s.carrying=true; STATE.rescued++; updateTopbar(); showMsg('🧍 救援成功！推進啟動'); break; } } }
    s.trail.push({x:s.x,y:s.y,life:1}); for(let i=0;i<s.trail.length;i++) s.trail[i].life-=dt*0.9; s.trail=s.trail.filter(p=>p.life>0); if(s.trail.length>280) s.trail.shift();
  } }
function step(dt){ const n=Math.max(1,Math.floor(planet.substeps)); const h=dt/n; for(let i=0;i<n;i++) substep(h); ships=ships.filter(s=>s.alive) }
function lighten(hex,k){ const n=parseInt(hex.replace('#',''),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; const L=c=>Math.min(255,Math.round(c+(255-c)*k)); return `rgb(${L(r)},${L(g)},${L(b)})` }
function shade(hex,k){ const n=parseInt(hex.replace('#',''),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; const S=c=>Math.max(0,Math.round(c*(1-k))); return `rgb(${S(r)},${S(g)},${S(b)})` }
function drawCreature(kind,x,y,s){ ctx.save(); ctx.translate(x,y); ctx.fillStyle="#000"; ctx.shadowColor="rgba(0,0,0,.25)"; ctx.shadowBlur=6; ctx.beginPath();
  if(kind==="bud"){ ctx.moveTo(0,-s*.9); ctx.quadraticCurveTo(s*.9,-s*.1,0,s); ctx.quadraticCurveTo(-s*.9,-s*.1,0,-s*.9); }
  else if(kind==="tri"){ ctx.moveTo(0,-s); for(let i=1;i<6;i++){ const a=i*(Math.PI*2/6); const r=i%2? s: s*0.55; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) } ctx.closePath(); }
  else if(kind==="ring"){ ctx.arc(0,0,s*0.9,0,Math.PI*2); ctx.moveTo(s*0.55,0); ctx.arc(0,0,s*0.55,0,Math.PI*2,true); }
  else if(kind==="tall"){ ctx.moveTo(-s*0.4,s*0.9); ctx.quadraticCurveTo(0,-s*1.2,s*0.4,s*0.9); ctx.closePath(); }
  else{ for(let i=0;i<7;i++){ const a=i*(Math.PI*2/7); const r=s*(0.75+0.35*Math.sin(i*2.2)); if(i===0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r); else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) } ctx.closePath(); }
  ctx.fill(); ctx.restore(); }
function draw(){
  const rect=document.getElementById('canvasWrap').getBoundingClientRect(); const W=rect.width, H=rect.height, c=planetCenter();
  const grd=ctx.createRadialGradient(W*.15,H*.2,30,W*.15,H*.2,Math.max(W,H)*.9); grd.addColorStop(0,`rgba(220,150,40,.45)`); grd.addColorStop(1,'#000'); ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  const R=planet.R; const pgr=ctx.createRadialGradient(c.x-R*.35,c.y-R*.35,R*.2,c.x,c.y,R*1.2); pgr.addColorStop(0,lighten(planet.color,.28)); pgr.addColorStop(.7,planet.color); pgr.addColorStop(1,shade(planet.color,.65));
  ctx.fillStyle=pgr; ctx.beginPath(); ctx.arc(c.x,c.y,R,0,Math.PI*2); ctx.fill();
  if(planet.stripe!=="none"){ ctx.save(); ctx.clip();
    if(planet.stripe==="bands"){ for(let i=-R;i<=R;i+=Math.max(6,R/14)){ const y=c.y+i; ctx.strokeStyle=i%2===0?"rgba(255,255,255,.10)":"rgba(0,0,0,.12)"; ctx.lineWidth=Math.max(3,R/28); ctx.beginPath(); ctx.ellipse(c.x,y,R,R*0.25,0,0,Math.PI*2); ctx.stroke(); } }
    else if(planet.stripe==="storm"){ ctx.fillStyle="rgba(255,255,255,.08)"; for(let k=0;k<12;k++){ const a=Math.random()*Math.PI*2, rr=R*rand(0.15,0.7); ctx.beginPath(); ctx.ellipse(c.x+Math.cos(a)*rr, c.y+Math.sin(a)*rr, R*0.18*rand(.7,1.3), R*0.12*rand(.7,1.3), rand(0,Math.PI), 0, Math.PI*2); ctx.fill(); } }
    ctx.restore(); }
  if(planet.ring){ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(-.35); ctx.strokeStyle="rgba(230,210,160,.65)"; ctx.lineWidth=12; ctx.beginPath(); ctx.ellipse(0,0,R*1.55,R*.75,0,0,Math.PI*2); ctx.stroke(); ctx.lineWidth=4; ctx.strokeStyle="rgba(230,210,160,.3)"; ctx.beginPath(); ctx.ellipse(0,0,R*1.35,R*.66,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  for(const b of creatures){ if(!b.alive) continue; const bx=c.x+Math.cos(b.angle)*R*1.05, by=c.y+Math.sin(b.angle)*R*1.05; drawCreature(b.species,bx,by,b.size); }
  for(const s of ships){ if(!s.alive || s.trail.length<2) continue; for(let i=1;i<s.trail.length;i++){ const p0=s.trail[i-1], p1=s.trail[i]; const alpha=Math.max(0,Math.min(1,p1.life)); ctx.strokeStyle=`rgba(255,255,255,${alpha})`; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); } }
  for(const s of ships){ if(s.alive){ const ang=Math.atan2(s.vy,s.vx); ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(ang); ctx.fillStyle=s.carrying?"#7bffc9":"#fff"; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,-6); ctx.lineTo(-6,0); ctx.lineTo(-10,6); ctx.closePath(); ctx.fill(); ctx.fillStyle=s.carrying?"rgba(100,255,200,.8)":"rgba(255,160,80,.9)"; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-18,-3); ctx.lineTo(-16,0); ctx.lineTo(-18,3); ctx.closePath(); ctx.fill(); ctx.restore(); } }
  if(dragging && anchor && pointer){ ctx.save(); ctx.setLineDash([8,6]); ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(anchor.x,anchor.y); ctx.lineTo(pointer.x,pointer.y); ctx.stroke(); ctx.setLineDash([]); const dx=pointer.x-anchor.x, dy=pointer.y-anchor.y; const ax=anchor.x-dx*0.18, ay=anchor.y-dy*0.18; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax-dx*0.12, ay-dy*0.12); ctx.strokeStyle="rgba(160,220,255,.9)"; ctx.stroke(); ctx.fillStyle="rgba(255,255,255,.15)"; ctx.beginPath(); ctx.arc(anchor.x,anchor.y,6,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(c.x,c.y,R*1.2,0,Math.PI*2); ctx.stroke();
}
let last=performance.now(); function loop(now){ const dt=Math.min(.033,(now-last)/1000); last=now; const n=Math.max(1,Math.floor(planet.substeps)); const h=dt/n; for(let i=0;i<n;i++) substep(h); ships=ships.filter(s=>s.alive); draw(); requestAnimationFrame(loop) } requestAnimationFrame(loop);
bindRange('R',planet,'R',v=>v+' px'); bindRange('g',planet,'g',v=>Number(v).toFixed(2)+' m/s²'); bindRange('dragMul',planet,'dragMul',v=>Number(v).toFixed(2)); bindRange('soft',planet,'soft',v=>Number(v).toFixed(2));
bindRange('assist',planet,'assist',v=>Number(v).toFixed(2)); bindRange('radial',planet,'radial',v=>Number(v).toFixed(2)); bindRange('substeps',planet,'substeps',v=>v);
bindSelect('stripe',planet,'stripe'); bindCheck('ring',planet,'ring'); (function(){ const el=$('color'),lab=$('colorv'); const apply=()=>{planet.color=el.value; lab.textContent=planet.color}; el.addEventListener('input',apply); el.value=planet.color; apply(); })();
bindRange('creaturesN',bio,'creaturesN',v=>v); bindRange('speciesKinds',bio,'speciesKinds',v=>v); bindRange('creatureSpeed',bio,'creatureSpeed',v=>Number(v).toFixed(2));
bindRange('launchScale',shipCfg,'launchScale',v=>Number(v).toFixed(2)); bindRange('pickupThrust',shipCfg,'pickupThrust',v=>v+' N'); bindSelect('pickupMode',shipCfg,'pickupMode'); bindCheck('infiniteEnergy',STATE,'infiniteEnergy');
$('infiniteEnergy').addEventListener('change',()=>{ if(STATE.infiniteEnergy){STATE.energy=Infinity}else{STATE.energy=50} updateTopbar() }); function updateTopbar(){ $('rescued').textContent=STATE.rescued; $('dead').textContent=STATE.dead; $('energy').textContent= STATE.infiniteEnergy ? '∞' : Math.max(0,Math.round(STATE.energy||0)); }
spawnCreatures();
$('export').onclick=()=>{ const cfg={planet,bio,shipCfg}; const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='free_planet_config.json'; a.click(); URL.revokeObjectURL(url); };
$('reset').onclick=()=>{ planet.R=140; planet.color="#5fb9e5"; planet.ring=false; planet.stripe="bands"; planet.g=9.81; planet.dragMul=1.0; planet.soft=0.33; planet.assist=0.8; planet.radial=0.85; planet.substeps=6;
  bio.creaturesN=10; bio.speciesKinds=3; bio.creatureSpeed=1.0; shipCfg.launchScale=0.35; shipCfg.pickupThrust=18; shipCfg.pickupMode="prograde";
  ['R','g','dragMul','soft','assist','radial','substeps','creaturesN','speciesKinds','creatureSpeed','launchScale','pickupThrust'].forEach(id=>{ const el=$(id); const v=(id=='creaturesN')?bio.creaturesN:(id=='creatureSpeed')?bio.creatureSpeed:(shipCfg[id]??planet[id]); el.value=v; el.dispatchEvent(new Event('input')); });
  $('pickupMode').value=shipCfg.pickupMode; $('pickupMode').dispatchEvent(new Event('change')); $('ring').checked=planet.ring; $('ring').dispatchEvent(new Event('change')); $('stripe').value=planet.stripe; $('stripe').dispatchEvent(new Event('change')); $('color').value=planet.color; $('color').dispatchEvent(new Event('input'));
  spawnCreatures(); showMsg('已回復預設'); };
</script>
</body>
</html>
