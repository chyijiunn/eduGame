<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>消失的漁獲｜平板共玩版</title>
<style>
:root{--sea1:#9bd5e6;--sea2:#66afcd;--ink:#203f54;--paper:#fff8df;--red:#d95360;--orange:#e59632;--green:#15988e;--panel:rgba(255,255,255,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0}body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#27485d;color:var(--ink);overflow:hidden}button,select{font:inherit}button{border:0;border-radius:16px;padding:10px 16px;font-weight:900;color:#fff;background:#d76545;box-shadow:0 5px 0 #97482f;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #97482f}button.secondary{background:#4d8fb0;box-shadow:0 5px 0 #2b6179}button:disabled{opacity:.45;filter:grayscale(.5);cursor:not-allowed}select{border:2px solid #88b4c7;border-radius:12px;padding:7px;background:#fff;font-weight:850;color:var(--ink)}
#app{width:100vw;height:100vh;position:relative;background:linear-gradient(145deg,var(--sea1),var(--sea2));overflow:hidden}.watermark{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 22%,rgba(255,255,255,.18),transparent 32%),radial-gradient(ellipse at 80% 76%,rgba(255,255,255,.13),transparent 36%);pointer-events:none}.patch{position:absolute;border-radius:50%;background:rgba(44,124,158,.18);transform:rotate(-18deg);pointer-events:none}.route{position:absolute;inset:8vh 6vw;border:9px solid rgba(255,245,245,.94);border-radius:34px;pointer-events:none}.route:after{content:"";position:absolute;left:13%;top:16%;height:45%;border-left:7px dotted rgba(255,245,245,.94)}
#sea{position:absolute;inset:0}.fish{position:absolute;width:34px;height:17px;border-radius:50% 65% 65% 50%;background:#fff9d7;box-shadow:inset -7px -2px rgba(0,0,0,.12);transform-origin:center;z-index:5;pointer-events:none}.fish:before{content:"";position:absolute;left:-9px;top:4px;border-right:12px solid #fff9d7;border-top:5px solid transparent;border-bottom:5px solid transparent}.fish:after{content:"";position:absolute;right:6px;top:5px;width:3px;height:3px;border-radius:50%;background:#223}.fish.big{width:45px;height:23px;background:#ffd46e}.fish.big:before{border-right-color:#ffd46e}.fish.small{width:27px;height:14px;background:#e8fbff}.fish.small:before{border-right-color:#e8fbff}.fish.caught{animation:pop .28s forwards}@keyframes pop{to{transform:scale(0) rotate(30deg);opacity:0}}.fish.birth{animation:birth .55s ease-out}@keyframes birth{0%{transform:scale(.15);opacity:.05}65%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}
#hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:45;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.pill{background:var(--panel);border:2px solid rgba(32,68,90,.13);border-radius:999px;padding:7px 13px;font-weight:850;box-shadow:0 5px 0 rgba(32,68,90,.08);white-space:nowrap}.methodPill.A{background:#fff1f4;color:#a43145}.methodPill.B{background:#fff0d9;color:#94561a}.methodPill.C{background:#e1fbf7;color:#086b63}
.boat{position:absolute;width:118px;height:76px;z-index:20;transition:left .72s cubic-bezier(.18,.8,.28,1),top .72s cubic-bezier(.18,.8,.28,1),transform .72s cubic-bezier(.18,.8,.28,1),filter .2s;display:flex;align-items:center;justify-content:center;font-weight:1000;color:white;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}.boat .name{position:absolute;top:-27px;background:#fff;border:2px solid #6b493e;border-radius:10px;padding:3px 9px;color:#442;font-size:15px;text-shadow:none;white-space:nowrap}.boat .hull{position:absolute;left:7px;right:7px;bottom:8px;height:34px;border-radius:9px 9px 38px 38px;box-shadow:0 10px 0 rgba(24,75,96,.18)}.boat .cab{position:absolute;top:17px;width:44px;height:32px;border-radius:9px 9px 4px 4px;background:#fff1df;border:3px solid #754;z-index:2}.boat .sail{position:absolute;top:3px;width:0;height:0;border-bottom:45px solid #fff7e8;border-left:26px solid transparent;border-right:10px solid transparent;filter:drop-shadow(0 2px 0 #754);display:none}.boat.shape1 .hull{background:linear-gradient(#f05752,#8d3230)}.boat.shape2 .hull{background:linear-gradient(#4b9cd3,#225b8d);border-radius:45px 12px 34px 34px}.boat.shape2 .cab{left:26px}.boat.shape3 .hull{background:linear-gradient(#49b57d,#26724e);border-radius:12px 45px 34px 34px}.boat.shape3 .cab{right:26px}.boat.shape4 .hull{background:linear-gradient(#9d70d8,#5b3c91)}.boat.shape4 .sail{display:block}.boat.shape4 .cab{display:none}.boat.shape5 .hull{background:linear-gradient(#f0b84b,#a96d20);height:28px}.boat.shape5:after{content:"";position:absolute;bottom:40px;width:76px;height:8px;background:#fff7e8;border-radius:999px}.boat.active{filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 6px #fff);transform:scale(1.12)}
.scoreBox{position:absolute;z-index:35;width:200px;background:rgba(255,255,255,.88);border:3px solid rgba(255,255,255,.9);border-radius:18px;padding:9px;box-shadow:0 10px 24px rgba(0,0,0,.13);font-size:13px}.scoreBox h3{margin:0 0 5px;font-size:16px}.scoreBox .small{font-size:12px;opacity:.75}.scoreBox.active{outline:5px solid rgba(255,255,255,.75)}.corner1{left:10px;top:68px}.corner2{right:10px;top:68px}.corner3{right:10px;bottom:10px}.corner4{left:10px;bottom:10px}.corner5{left:50%;bottom:10px;transform:translateX(-50%)}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;width:min(450px,54vw);text-align:center;pointer-events:none}.dice{margin:0 auto;width:122px;height:122px;border-radius:26px;background:#fff;border:6px solid #fff6d9;box-shadow:0 15px 0 rgba(32,68,90,.18),0 20px 50px rgba(0,0,0,.15);display:grid;place-items:center;font-size:66px;font-weight:1000;color:#203f54;cursor:pointer;user-select:none;pointer-events:auto;touch-action:manipulation}.dice.disabled{opacity:.5;filter:grayscale(.4);cursor:not-allowed}.centerCard{margin-top:12px;background:rgba(255,248,223,.95);border:4px solid #fff;border-radius:22px;padding:13px;box-shadow:0 14px 40px rgba(0,0,0,.18)}.centerCard h2{margin:0 0 5px;font-size:24px}.centerCard p{margin:4px 0;font-weight:760;line-height:1.45}.roundBanner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;background:rgba(255,248,223,.98);border:5px solid #fff;border-radius:25px;padding:18px 28px;box-shadow:0 18px 60px rgba(0,0,0,.25);font-size:24px;font-weight:1000;text-align:center;display:none;pointer-events:none}.roundBanner small{display:block;font-size:16px;margin-top:5px;color:#406273}
.startPanel{position:absolute;inset:0;z-index:100;background:rgba(32,68,90,.72);display:flex;align-items:center;justify-content:center}.startBox{width:min(650px,90vw);background:var(--paper);border:5px solid #fff;border-radius:28px;padding:22px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}.methodChoices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}.choice{min-width:160px;padding:14px 18px;border-radius:18px;color:#fff;font-weight:1000;box-shadow:0 7px 0 rgba(0,0,0,.18);cursor:pointer}.choice small{font-weight:800}.choice.A{background:var(--red)}.choice.B{background:var(--orange)}.choice.C{background:var(--green)}.choice.selected{outline:6px solid #fff;transform:translateY(-4px)}
#summary{position:absolute;inset:4vh 4vw;z-index:120;background:rgba(255,250,236,.98);border:5px solid white;border-radius:26px;padding:18px;display:none;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}#summary h1{margin:0 0 12px;text-align:center}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;margin:10px 0}th,td{border:1px solid #c8d8df;padding:8px;text-align:center}th{background:#d9edf5}.winner{font-weight:1000;color:#b5422d}.note{font-size:13px;opacity:.76;text-align:center}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.scoreBox{width:170px;font-size:12px}.summaryGrid{grid-template-columns:1fr}}
@media (orientation:portrait){#app:before{content:"建議將平板轉為橫向遊玩";position:absolute;z-index:200;inset:0;background:rgba(32,68,90,.94);color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;text-align:center;padding:30px}}
</style>
</head>
<body>
<div id="app">
  <div class="watermark"></div><div class="route"></div><div id="sea"></div><div id="boats"></div><div id="scores"></div>
  <div id="hud">
    <span class="pill">第 <b id="round">1</b> / <b id="maxRoundText">4</b> 輪</span>
    <span class="pill">本輪第 <b id="turnOrder">1</b> 位</span>
    <span class="pill">輪到：<b id="current">甲</b></span>
    <span class="pill methodPill" id="methodLabel">尚未選漁法</span>
    <span class="pill">海中魚：<b id="fishCount">0</b></span>
    <label class="pill">玩家數 <select id="playerCount"><option>3</option><option selected>4</option><option>5</option></select></label>
    <button id="resetBtn" class="secondary">重來</button>
  </div>
  <div id="roundBanner" class="roundBanner"></div>
  <div id="center"><button id="dice" class="dice disabled" type="button">?</button><div class="centerCard"><h2 id="centerTitle">選擇漁法後開始</h2><p id="centerText">每位玩家的船會從角落開到中央；骰子會先快速旋轉，玩家點擊後才逐漸停下來。</p></div></div>
  <div id="startPanel" class="startPanel"><div class="startBox"><h1>消失的漁獲</h1><p><b>一開始決定一種漁法</b>，整場都使用同一種捕撈規則。每位玩家輪流捕魚；全體玩家都玩過一次後，魚群才繁殖一次，繁殖後海中魚量＝留存魚量 × 2。</p><label>玩家數 <select id="startPlayerCount"><option>3</option><option selected>4</option><option>5</option></select></label><div class="methodChoices"><div class="choice A" data-m="A">A 一支釣<br><small>骰子點數 - 3；1–3 點不取魚</small></div><div class="choice B" data-m="B">B 延繩釣<br><small>骰到幾點就取幾條魚</small></div><div class="choice C" data-m="C">C 大型圍網<br><small>骰子點數 + 3</small></div></div><button id="startBtn" disabled>開始遊戲</button></div></div>
  <div id="summary"><h1>結果總表</h1><div id="summaryBody"></div><p style="text-align:center"><button id="again" class="secondary">再玩一次</button></p></div>
</div>
<script>
const names=['甲','乙','丙','丁','戊'];
const maxRounds=4;
const initialFish=30;
const methods={
 A:{name:'A 一支釣',cls:'A',desc:'骰子點數減 3；若擲出 1、2、3，這次不取魚。',cap:d=>Math.max(0,d-3)},
 B:{name:'B 延繩釣',cls:'B',desc:'骰到幾點，這次就取幾條魚。',cap:d=>d},
 C:{name:'C 大型圍網',cls:'C',desc:'骰子點數加 3，就是這次取走的魚量。',cap:d=>d+3}
};
let playerN=4, selectedMethod=null, turn=0, round=1, fish=[], records=[], roundStats=[], locked=true, stopping=false, spinTimer=null, boatAtCenter=false, canRoll=false, roundStartFish=initialFish;
const app=document.getElementById('app'), sea=document.getElementById('sea'), boats=document.getElementById('boats'), scores=document.getElementById('scores'), dice=document.getElementById('dice'), banner=document.getElementById('roundBanner');
function rnd(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
for(let i=0;i<14;i++){const p=document.createElement('i');p.className='patch';p.style.left=rnd(10,85)+'vw';p.style.top=rnd(12,80)+'vh';p.style.width=rnd(48,140)+'px';p.style.height=rnd(18,42)+'px';app.appendChild(p)}
function addFish(kind='normal', near=null, birth=false){const el=document.createElement('div');el.className='fish '+(kind==='big'?'big':kind==='small'?'small':'')+(birth?' birth':'');sea.appendChild(el);const base=near||{x:rnd(18,82),y:rnd(18,78)};const f={el,kind,x:Math.max(12,Math.min(88,base.x+rnd(-4,4))),y:Math.max(15,Math.min(85,base.y+rnd(-4,4))),vx:rnd(-.12,.12)||.05,vy:rnd(-.07,.07)||.03};fish.push(f);placeFish(f);if(birth)setTimeout(()=>el.classList.remove('birth'),650)}
function seedFish(n=initialFish){for(let i=0;i<n;i++)addFish(pick(['normal','normal','normal','big','small']))}
function placeFish(f){f.el.style.left=f.x+'vw';f.el.style.top=f.y+'vh';f.el.style.transform=`rotate(${f.vx>=0?0:180}deg)`}
function animateSea(){fish.forEach(f=>{f.x+=f.vx;f.y+=f.vy;if(f.x<12||f.x>88)f.vx*=-1;if(f.y<15||f.y>85)f.vy*=-1;placeFish(f)});requestAnimationFrame(animateSea)}
function boatPos(i){const corner=[['4vw','12vh'],['calc(100vw - 150px)','12vh'],['calc(100vw - 150px)','calc(100vh - 108px)'],['4vw','calc(100vh - 108px)'],['calc(50vw - 59px)','calc(100vh - 108px)']];if(i===turn&&boatAtCenter)return ['calc(50vw - 59px)','calc(50vh - 128px)'];return corner[i]}
function buildBoats(){boats.innerHTML='';for(let i=0;i<playerN;i++){const b=document.createElement('div');b.dataset.i=i;b.innerHTML=`<span class="name">玩家 ${names[i]}</span><div class="sail"></div><div class="cab"></div><div class="hull"></div><b>${names[i]}</b>`;boats.appendChild(b)}}
function renderBoats(){if(boats.children.length!==playerN)buildBoats();[...boats.children].forEach(b=>{const i=+b.dataset.i;b.className=`boat shape${i+1} ${i===turn&&boatAtCenter?'active':''}`;const pos=boatPos(i);b.style.left=pos[0];b.style.top=pos[1]})}
function totalCatchOf(p){return records.filter(r=>r.p===p).reduce((s,r)=>s+r.catch,0)}
function recordText(p,r){const rec=records.find(x=>x.p===p&&x.round===r);return rec?`${rec.dice}點→${rec.catch}條`:'—'}
function renderScores(){scores.innerHTML='';for(let i=0;i<playerN;i++){const box=document.createElement('div');box.className=`scoreBox corner${i+1} ${i===turn&&boatAtCenter?'active':''}`;let rounds='';for(let r=1;r<=maxRounds;r++)rounds+=`<div>第${r}輪：${recordText(i,r)}</div>`;box.innerHTML=`<h3>玩家 ${names[i]} 漁獲紀錄</h3>${rounds}<b>總漁獲：${totalCatchOf(i)} 條</b><div class="small">${i===turn&&boatAtCenter?'目前輪到此玩家':' '}</div>`;scores.appendChild(box)}}
function updateHud(){document.getElementById('round').textContent=Math.min(round,maxRounds);document.getElementById('maxRoundText').textContent=maxRounds;document.getElementById('turnOrder').textContent=Math.min(turn+1,playerN);document.getElementById('current').textContent=names[turn]||'—';document.getElementById('fishCount').textContent=fish.length;const ml=document.getElementById('methodLabel');if(selectedMethod){ml.textContent=methods[selectedMethod].name;ml.className='pill methodPill '+methods[selectedMethod].cls}else{ml.textContent='尚未選漁法';ml.className='pill methodPill'}renderBoats();renderScores()}
function showBanner(html,duration=1200){banner.innerHTML=html;banner.style.display='block';setTimeout(()=>{banner.style.display='none'},duration)}
function startSpin(){clearInterval(spinTimer);spinTimer=setInterval(()=>{if(!locked&&!stopping)dice.textContent=1+Math.floor(Math.random()*6)},45)}
function setCenter(title,text){document.getElementById('centerTitle').textContent=title;document.getElementById('centerText').textContent=text}
function prepareTurn(){locked=true;canRoll=false;stopping=false;boatAtCenter=false;dice.textContent='?';dice.classList.add('disabled');setCenter(`玩家 ${names[turn]}，船正在進場`,`目前海中有 ${fish.length} 條魚。船到中央後，骰子會快速旋轉，再點擊骰子讓它停下。`);updateHud();setTimeout(()=>{boatAtCenter=true;updateHud()},80);setTimeout(()=>{locked=false;canRoll=true;dice.classList.remove('disabled');setCenter(`玩家 ${names[turn]}，請點骰子`,methods[selectedMethod].desc);startSpin()},880)}
function startGame(){playerN=+document.getElementById('startPlayerCount').value;document.getElementById('playerCount').value=playerN;turn=0;round=1;records=[];roundStats=[];fish.forEach(f=>f.el.remove());fish=[];seedFish(initialFish);roundStartFish=fish.length;document.getElementById('startPanel').style.display='none';document.getElementById('summary').style.display='none';showBanner(`第 1 輪開始<small>海中放入 ${initialFish} 條魚</small>`,1100);prepareTurn()}
function rollDice(){if(locked||stopping||!selectedMethod||!canRoll)return;stopping=true;canRoll=false;dice.classList.add('disabled');clearInterval(spinTimer);let delay=60,ticks=0,final=1+Math.floor(Math.random()*6);function step(){dice.textContent=ticks>10?final:1+Math.floor(Math.random()*6);ticks++;delay+=30;if(ticks<14)setTimeout(step,delay);else resolveTurn(final)}step()}
function removeCaught(n){for(let i=0;i<n;i++){if(!fish.length)break;const idx=Math.floor(Math.random()*fish.length);const f=fish[idx];f.el.classList.add('caught');setTimeout(()=>f.el.remove(),240);fish.splice(idx,1)}}
function reproduceRound(){const survivors=[...fish];const beforeBirth=survivors.length;if(beforeBirth<=0)return 0;survivors.forEach((f,idx)=>setTimeout(()=>addFish('small',f,true),idx*22));return beforeBirth}
function resolveTurn(d){const method=methods[selectedMethod];const before=fish.length;const caught=Math.min(before,method.cap(d));removeCaught(caught);records.push({p:turn,round,dice:d,catch:caught,before,afterCatch:before-caught});setCenter(`玩家 ${names[turn]}：${d} 點，捕獲 ${caught} 條`,`捕撈前 ${before} 條，捕撈後剩 ${before-caught} 條。魚群要等到所有玩家都玩過一次後才繁殖。`);setTimeout(()=>{updateHud();if(fish.length<=0){finish(true,'海中魚量歸零，提前結束。');return}if(turn===playerN-1){completeRound()}else{turn++;setTimeout(prepareTurn,850)}},290)}
function completeRound(){locked=true;canRoll=false;stopping=true;clearInterval(spinTimer);dice.classList.add('disabled');const afterCatchAll=fish.length;showBanner(`第 ${round} 輪結束<small>魚群繁殖中：留存 ${afterCatchAll} 條 × 2 = ${afterCatchAll*2} 條</small>`,1500);setCenter(`第 ${round} 輪結束，魚群繁殖中`,`全體玩家都完成一次捕撈後，海中留存魚量直接乘以二。`);const birth=reproduceRound();roundStats.push({round,start:roundStartFish,afterCatch:afterCatchAll,birth,afterBirth:afterCatchAll*2});setTimeout(()=>{updateHud();if(round>=maxRounds){finish(false,'完成最多輪數。');return}round++;turn=0;roundStartFish=fish.length;showBanner(`第 ${round} 輪開始<small>海中魚量：${fish.length} 條</small>`,1000);setTimeout(prepareTurn,900)},Math.min(1800,500+birth*22))}
function finish(early=false,reason='遊戲結束。'){locked=true;canRoll=false;boatAtCenter=false;stopping=true;clearInterval(spinTimer);dice.classList.add('disabled');renderBoats();renderScores();const totals=names.slice(0,playerN).map((n,i)=>({n,total:totalCatchOf(i)}));const win=Math.max(...totals.map(t=>t.total));let html=`<div class="summaryGrid"><div><p><b>本組漁法：</b>${methods[selectedMethod].name}</p><p><b>結束原因：</b>${reason}</p><p><b>海中剩餘魚量：</b>${fish.length} 條</p></div><div><p><b>判讀提醒：</b>漁獲量高，不一定代表資源狀態好；要同時比較最後海中魚量。</p><p><b>本局進行輪數：</b>${Math.max(...records.map(r=>r.round),0)} 輪</p></div></div>`;html+=`<table><thead><tr><th>玩家</th>`;for(let r=1;r<=maxRounds;r++)html+=`<th>第${r}輪捕獲量</th>`;html+=`<th>總漁獲</th></tr></thead><tbody>`;totals.forEach((t,i)=>{html+=`<tr class="${t.total===win?'winner':''}"><td>${t.n}</td>`;for(let r=1;r<=maxRounds;r++){const rec=records.find(x=>x.p===i&&x.round===r);html+=`<td>${rec?rec.catch:'—'}</td>`}html+=`<td>${t.total}</td></tr>`});html+=`</tbody></table>`;html+=`<table><thead><tr><th>輪次</th><th>該輪開始魚量</th><th>全體捕撈後魚量</th><th>繁殖新增</th><th>繁殖後魚量（留存×2）</th></tr></thead><tbody>`;for(let r=1;r<=maxRounds;r++){const st=roundStats.find(x=>x.round===r);html+=`<tr><td>第${r}輪</td><td>${st?st.start:'—'}</td><td>${st?st.afterCatch:(records.some(x=>x.round===r)?fish.length:'—')}</td><td>${st?st.birth:(early?'0':'—')}</td><td>${st?st.afterBirth:(early?fish.length:'—')}</td></tr>`}html+=`</tbody></table><p class="note">「魚群繁殖」只在一大輪結束後發生：所有玩家都玩過一次後，海中留存魚量直接乘以二。</p>`;document.getElementById('summaryBody').innerHTML=html;document.getElementById('summary').style.display='block';updateHud()}
function reset(){locked=true;canRoll=false;boatAtCenter=false;stopping=false;clearInterval(spinTimer);selectedMethod=null;turn=0;round=1;records=[];roundStats=[];fish.forEach(f=>f.el.remove());fish=[];seedFish(initialFish);roundStartFish=fish.length;dice.textContent='?';dice.classList.add('disabled');document.getElementById('startPanel').style.display='flex';document.getElementById('summary').style.display='none';document.getElementById('startBtn').disabled=true;document.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));setCenter('選擇漁法後開始','每位玩家的船會從角落開到中央；骰子會先快速旋轉，玩家點擊後才逐漸停下來。');updateHud()}
document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{selectedMethod=c.dataset.m;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');document.getElementById('startBtn').disabled=false;updateHud()});
document.getElementById('startBtn').onclick=startGame;
function handleDiceInput(e){if(e){e.preventDefault();e.stopPropagation()}rollDice()}
dice.addEventListener('pointerdown',handleDiceInput,{passive:false});
dice.addEventListener('click',handleDiceInput,{passive:false});
document.getElementById('resetBtn').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('playerCount').onchange=e=>{document.getElementById('startPlayerCount').value=e.target.value;reset()};document.getElementById('startPlayerCount').onchange=e=>{document.getElementById('playerCount').value=e.target.value;playerN=+e.target.value;updateHud()};
seedFish(initialFish);updateHud();animateSea();
</script>
</body>
</html>
