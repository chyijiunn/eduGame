#helpBody h1{font-size:24px;margin:8px 0 14px;line-height:1.25;color:#fff}#helpBody h2{font-size:18px;margin:22px 0 10px;border-bottom:1px solid #3b587a;padding-bottom:6px;color:#dff}#helpBody h3{font-size:15px;margin:16px 0 8px;color:#bdf}#helpBody p{margin:7px 0}#helpBody ul{margin:8px 0 10px 24px;padding-left:8px}#helpBody li{margin:5px 0}#helpBody table{border-collapse:collapse;width:100%;margin:10px 0 14px;font-size:12px;background:#07101a}#helpBody td,#helpBody th{border:1px solid #3b587a;padding:6px 8px;vertical-align:top}#helpBody tr:first-child td{font-weight:bold;background:#10243a;color:#fff}#helpBody hr{border:0;border-top:1px solid #304866;margin:14px 0}#helpBody code{background:#172235;border:1px solid #2b3d5a;border-radius:4px;padding:1px 4px;color:#ffd}

#stats{position:fixed;left:8px;top:142px;width:230px;z-index:7;font-size:11px}#statsHd,#bioHd{padding:4px 8px;background:linear-gradient(90deg,#5096ff,#3ce6aa);display:flex;justify-content:space-between;cursor:pointer}#statsBd{padding:4px}.srow{display:flex;justify-content:space-between;padding:2px 4px;border-radius:4px}.srow:hover{background:rgba(255,255,255,.08);cursor:pointer}
#bioPanel{position:fixed;left:8px;top:330px;width:230px;z-index:7;font-size:11px;padding:4px}#bioChart{width:100%;height:70px;background:#05060a;border-radius:4px}#bioDetail{display:block;margin-top:4px;border-top:1px solid #334;padding-top:4px}#bioLegend{display:flex;flex-wrap:wrap;gap:3px 6px}#bioLegend label{font-size:10px}#bioDetailChart{width:100%;height:110px;background:#05060a;border-radius:4px}
#miniMap{position:fixed;left:8px;bottom:8px;width:170px;height:170px;background:rgba(0,0,0,.72);border-radius:6px;border:1px solid #666;z-index:7}#miniMap canvas{width:100%;height:100%}#miniMapLabel{position:absolute;left:6px;top:6px;font-size:10px}#miniMapNS{position:absolute;right:6px;top:6px;font-size:10px}
#birthFX{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);pointer-events:none;opacity:0;z-index:30;text-align:center}#birthHeart{font-size:72px;color:#ff6fb0;text-shadow:0 0 12px #ff6fb0}#birthFX.show{animation:birthPop 1s ease-out forwards}@keyframes birthPop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.45);opacity:0}}#birthToast{position:fixed;right:12px;top:12px;z-index:31;background:rgba(0,0,0,.78);border:1px solid #888;border-radius:6px;padding:6px 10px;opacity:0;transition:.25s}

<script>
window.onerror=function(msg,src,line,col,err){var d=document.getElementById('debug');d.style.display='block';d.textContent='JS 錯誤：'+msg+'\\nline:'+line+' col:'+col+'\\n'+(err&&err.stack?err.stack:'');};
(function(){
const README = "# 漫苗森林 v0.3 說明\n\n## 本版重點\n\n- 移除能量塔最外層框線。\n- 新增「灰熊」，可在右上角「⋯」選單中開啟，預設關閉。\n- 灰熊是雜食性高階消費者，最優先捕食麋鹿。\n- 灰熊相關數值已加入表格。\n\n## 食性與能量取得\n\n| 生物 | 食物來源 | 攝食獲得體重/能量 |\n|---|---|---:|\n| 蝴蝶 | 樹上果實 | 果實 1 → 體重 +0.05 |\n| 松鼠 | 樹上果實、地面果實 | 果實 1 → 體重 +0.05 |\n| 兔子 | 地面果實 | 果實 1 → 體重 +0.05 |\n| 麋鹿 | 樹葉 | 樹能量 1 → 體重 +0.1 |\n| 鳥 | 蝴蝶、樹上果實 | 蝴蝶約 2 能量；果實 1 → 體重 +0.05 |\n| 老鷹 | 兔子、鳥、地面松鼠 | 兔子 +3.5；鳥 +2.5；地面松鼠 +3 |\n| 灰熊 | 麋鹿、果實、兔子、松鼠、蝴蝶、鳥 | 麋鹿 +18；果實 +0.08；兔子 +3.5；松鼠 +3；鳥 +2.5；蝴蝶 +0.2 |\n\n## 灰熊食性優先順序\n\n1. 麋鹿：只要附近有麋鹿，灰熊會優先追捕。\n2. 果實：沒有麋鹿時，灰熊第二優先吃果實。\n3. 其他動物：都沒有果實時，才捕食兔子、地面松鼠、蝴蝶、鳥。\n\n## 生存與每日消耗\n\n| 生物 | 體重 | DailyNeed | DailyLoss |\n|---|---:|---:|---:|\n| 蝴蝶 | 2 | 3 | 0.1 |\n| 松鼠 | 40 | 10 | 1 |\n| 兔子 | 40 | 10 | 1 |\n| 麋鹿 | 200 | 30 | 5 |\n| 鳥 | 30 | 10 | 1.4 |\n| 老鷹 | 100 | 20 | 3 |\n| 灰熊 | 160 | 28 | 4 |\n\n## 生殖參數\n\n| 生物 | 生殖潛能 | 生殖後體重消耗 | 生殖間隔 |\n|---|---:|---:|---:|\n| 蝴蝶 | 120 | 10% | 1 天 |\n| 松鼠 | 18 | 20% | 1 天 |\n| 兔子 | 40 | 20% | 1 天 |\n| 麋鹿 | 3 | 50% | 5 天 |\n| 鳥 | 12 | 15% | 1 天 |\n| 老鷹 | 4 | 25% | 3 天 |\n| 灰熊 | 2 | 30% | 6 天 |\n\n## 能量塔\n\n- 生產者：樹、果實\n- 初級消費者：蝴蝶、松鼠、兔子、麋鹿、鳥\n- 二級消費者：鳥、老鷹、灰熊\n- 三級消費者：老鷹、灰熊\n";
function mdEsc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function inlineMd(s){return mdEsc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function mdToHtml(md){
  const lines=md.split('\n'); let out='', list=false, table=false, para=[];
  function flushPara(){ if(para.length){ out+='<p>'+inlineMd(para.join(' '))+'</p>'; para=[]; } }
  function closeList(){ if(list){ out+='</ul>'; list=false; } }
  function closeTable(){ if(table){ out+='</table>'; table=false; } }
  function closeAll(){ flushPara(); closeList(); closeTable(); }
  for(let raw of lines){
    const line=raw.replace(/\s+$/,'');
    if(!line.trim()){ closeAll(); continue; }
    if(line.trim()==='---'){ closeAll(); out+='<hr>'; continue; }
    if(line.startsWith('|')){
      flushPara(); closeList();
      const cells=line.split('|').slice(1,-1).map(s=>s.trim());
      if(cells.every(c=>/^[-: ]+$/.test(c))) continue;
      if(!table){ out+='<table>'; table=true; }
      out+='<tr>'+cells.map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>';
      continue;
    } else closeTable();
    if(line.startsWith('# ')){ closeAll(); out+='<h1>'+inlineMd(line.slice(2))+'</h1>'; }
    else if(line.startsWith('## ')){ closeAll(); out+='<h2>'+inlineMd(line.slice(3))+'</h2>'; }
    else if(line.startsWith('### ')){ closeAll(); out+='<h3>'+inlineMd(line.slice(4))+'</h3>'; }
    else if(line.trim().startsWith('- ')){ flushPara(); closeTable(); if(!list){ out+='<ul>'; list=true; } out+='<li>'+inlineMd(line.trim().slice(2))+'</li>'; }
    else { closeList(); closeTable(); para.push(line.trim()); }
  }
  closeAll(); return out;
}
document.getElementById('helpBody').innerHTML=mdToHtml(README);
document.getElementById('helpBtn').onclick=()=>document.getElementById('helpOverlay').style.display='block';
document.getElementById('moreBtn').onclick=()=>{const m=document.getElementById('moreMenu');m.style.display=m.style.display==='block'?'none':'block';};
document.getElementById('moreHelp').onclick=()=>{document.getElementById('helpOverlay').style.display='block';document.getElementById('moreMenu').style.display='none';};
const toggleMapEl=document.getElementById('toggleMap'); if(toggleMapEl)toggleMapEl.onchange=e=>{document.getElementById('miniMap').classList.toggle('mapOn',e.target.checked);};
const toggleEagleEl=document.getElementById('toggleEagle'); if(toggleEagleEl)toggleEagleEl.onchange=e=>{
  eagleEnabled=e.target.checked;
  if(eagleEnabled && animals.filter(a=>a.type==='eagle').length===0){
    addAnimal('eagle',randPos(30,90));
    addAnimal('eagle',randPos(30,90));
  }
  refreshStatsNow();
};
const toggleTowerEl=document.getElementById('toggleTower'); if(toggleTowerEl)toggleTowerEl.onchange=e=>{document.getElementById('energyTower').style.display=e.target.checked?'block':'none';};
const toggleDeerChaosEl=document.getElementById('toggleDeerChaos'); if(toggleDeerChaosEl)toggleDeerChaosEl.onchange=e=>{
  deerChaos=e.target.checked;
  if(deerChaos){
    for(let i=0;i<12;i++)addAnimal('deer',randPos(15,80));
  }

canvas.onmousedown=e=>{if(e.button===0)shoot()};document.getElementById('shootBtn').onclick=shoot;
function crossPoint(){raycaster.setFromCamera(mouseNDC,camera);let h=raycaster.intersectObject(grid,true);return h.length?h[0].point:holder.position}
function spawnType(t){let p=crossPoint();if(t==='fruit'){for(let i=0;i<10;i++)spawnFruitAt(p.x+(Math.random()-.5)*4,p.z+(Math.random()-.5)*4)}else if(t==='butterfly'){for(let i=0;i<10;i++)addAnimal(t,new THREE.Vector3(p.x+(Math.random()-.5)*6,0,p.z+(Math.random()-.5)*6))}else addAnimal(t,new THREE.Vector3(p.x,0,p.z));refreshStatsNow()}
document.querySelectorAll('#statsBd .srow').forEach(r=>r.onclick=()=>spawnType(r.dataset.type));
let yaw=0,pitch=0,lastX=null,lastY=null,lock=true,keys={};function rot(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}rot();
window.onkeydown=e=>{let k=e.key.toLowerCase();if(k==='tab'){e.preventDefault();lock=!lock;document.body.style.cursor=lock?'none':'default';lastX=null;if(!lock&&document.pointerLockElement)document.exitPointerLock&&document.exitPointerLock();return}keys[k]=true};
window.onkeyup=e=>keys[e.key.toLowerCase()]=false;
canvas.addEventListener('click',()=>{if(!isMobile&&lock&&document.pointerLockElement!==canvas)canvas.requestPointerLock&&canvas.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>{lastX=null;lastY=null;});
window.onmousemove=e=>{
  if(isMobile||!lock)return;
  let dx,dy;
  if(document.pointerLockElement===canvas){dx=e.movementX||0;dy=e.movementY||0;}
  else{if(lastX===null){lastX=e.clientX;lastY=e.clientY;return}dx=e.clientX-lastX;dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;}
  const sens=.006;
  yaw-=dx*sens;pitch-=dy*sens;
  pitch=Math.max(-Math.PI/2+.05,Math.min(Math.PI/2-.05,pitch));
  rot();
};
window.addEventListener('wheel',e=>{e.preventDefault();camera.fov=Math.max(30,Math.min(90,camera.fov+e.deltaY*.02));camera.updateProjectionMatrix()},{passive:false});
const isMobile=('ontouchstart'in window)||navigator.maxTouchPoints>0,joy=document.getElementById('joy'),joyb=document.getElementById('joyb'),joyk=document.getElementById('joyk');let jF=0,jS=0;if(isMobile){joy.style.display='block';document.getElementById('shootBtn').style.display='block';lock=false}
let tRot=false,tX=0,tY=0,pinch=false,pD=0,pFov=60;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){tRot=true;tX=e.touches[0].clientX;tY=e.touches[0].clientY}else if(e.touches.length===2){pinch=true;let dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pD=Math.hypot(dx,dy);pFov=camera.fov}} ,{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===1&&tRot){let x=e.touches[0].clientX,y=e.touches[0].clientY;yaw-=(x-tX)*.003;pitch-=(y-tY)*.003;tX=x;tY=y;rot()}else if(e.touches.length===2&&pinch){let dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);camera.fov=Math.max(30,Math.min(90,pFov/(d/(pD||d))));camera.updateProjectionMatrix()}e.preventDefault()},{passive:false});
canvas.addEventListener('touchend',e=>{if(!e.touches.length)tRot=false;if(e.touches.length<2)pinch=false});
let jAct=false,jCX=0,jCY=0;function jm(x,y){let dx=x-jCX,dy=y-jCY,d=Math.hypot(dx,dy),mx=40;if(d>mx){dx*=mx/d;dy*=mx/d}jS=dx/mx;jF=-dy/mx;joyk.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))'}
joy.addEventListener('touchstart',e=>{jAct=true;let r=joyb.getBoundingClientRect();jCX=r.left+r.width/2;jCY=r.top+r.height/2;jm(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
joy.addEventListener('touchmove',e=>{if(jAct)jm(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()},{passive:false});
joy.addEventListener('touchend',()=>{jAct=false;jF=0;jS=0;joyk.style.transform='translate(-50%,-50%)'});
function updateStats(){
  let n={fruit:0,butterfly:0,squirrel:0,rabbit:0,deer:0,bird:0,eagle:0,bear:0};
  n.fruit=fruits.filter(f=>f && f.parent && !f.userData.eaten && !f.userData.seeded).length;
  for(const a of animals){
    if(a && a.g && a.g.parent && Object.prototype.hasOwnProperty.call(n,a.type)) n[a.type]++;
  }
  document.getElementById('nFruit').textContent=n.fruit;
  document.getElementById('nButterfly').textContent=n.butterfly;
  document.getElementById('nSquirrel').textContent=n.squirrel;
  document.getElementById('nRabbit').textContent=n.rabbit;
  document.getElementById('nDeer').textContent=n.deer;
  document.getElementById('nBird').textContent=n.bird;if(document.getElementById('nEagle'))document.getElementById('nEagle').textContent=n.eagle;if(document.getElementById('nBear'))document.getElementById('nBear').textContent=n.bear;
  return n;
}
function refreshStatsNow(){
  updateStats();
  drawCharts();
  miniMap();
}
const bioC=document.getElementById('bioChart'),bioCtx=bioC.getContext('2d'),bioD=document.getElementById('bioDetailChart'),bioDCtx=bioD.getContext('2d');let hist=[],sample=0;
document.getElementById('bioHd').onclick=()=>{let d=document.getElementById('bioDetail'),open=d.style.display==='none'||!d.style.display;d.style.display=open?'block':'none';document.getElementById('bioArrow').textContent=open?'▲':'▼'};
document.querySelectorAll('#bioLegend input').forEach(c=>c.onchange=drawCharts);
function drawLine(ctx,w,h,key,color,max){ctx.strokeStyle=color;ctx.beginPath();let T=hist.length?hist[hist.length-1].t:1;hist.forEach((p,i)=>{let x=w*p.t/T,y=h-(p[key]/max)*(h-4)-2;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});ctx.stroke()}
function drawCharts(){let w=bioC.width,h=bioC.height;bioCtx.clearRect(0,0,w,h);if(hist.length>1){let m=Math.max(1,...hist.map(p=>p.total));drawLine(bioCtx,w,h,'total','#00ff88',m)}let checks=[...document.querySelectorAll('#bioLegend input')].filter(x=>x.checked).map(x=>x.dataset.key),w2=bioD.width,h2=bioD.height;bioDCtx.clearRect(0,0,w2,h2);if(hist.length>1&&checks.length){let m=Math.max(1,...hist.flatMap(p=>checks.map(k=>p[k]||0))),cols={butterflyN:'#ff66ff',birdN:'#ffff66',deerN:'#ffb366',rabbitN:'#66ff66',squirrelN:'#66ffff',treeBiomass:'#00bbaa',fruitN:'#ff99ff',eagleN:'#ffffff',bearN:'#c58a4a'};checks.forEach(k=>drawLine(bioDCtx,w2,h2,k,cols[k]||'#fff',m))}}

function updateEnergyTower(treeBio){
  const eagleN=animals.filter(a=>a.type==='eagle').length;
  const bearN=animals.filter(a=>a.type==='bear').length;
  const birdN=animals.filter(a=>a.type==='bird').length;
  const primaryN=animals.filter(a=>['butterfly','squirrel','rabbit','deer','bird'].includes(a.type)).length;
  const producer=Math.max(0,treeBio/120+fruits.length);
  const secondary=birdN+eagleN+bearN;
  const tertiary=eagleN+bearN;
  const vals=[producer,primaryN,secondary,tertiary,1];
  const max=Math.max(...vals);
  function set(id,val){let el=document.getElementById(id);if(el)el.style.width=Math.max(4,Math.min(100,val/max*100))+'%';}
  function txt(id,val){let el=document.getElementById(id);if(el)el.textContent=Math.round(val);}
  set('etProducer',producer);set('etPrimary',primaryN);set('etSecondary',secondary);set('etTertiary',tertiary);
  txt('etProducerVal',producer);txt('etPrimaryVal',primaryN);txt('etSecondaryVal',secondary);txt('etTertiaryVal',tertiary);let tb=document.getElementById('towerBioText');if(tb)tb.textContent='總生物量：'+lastTotalBio.toFixed(1)+'｜樹生物量：'+treeBio.toFixed(1);
}

const mini=document.getElementById('miniMapCanvas'),mctx=mini.getContext('2d');
function miniMap(){let w=mini.width,h=mini.height,cx=w/2,cy=h/2,s=Math.min(w,h)*.45/forestR;mctx.fillStyle='#05060a';mctx.fillRect(0,0,w,h);mctx.strokeStyle='#666';mctx.beginPath();mctx.arc(cx,cy,forestR*s,0,Math.PI*2);mctx.stroke();mctx.strokeStyle='#58f';mctx.beginPath();riverPts.forEach((p,i)=>{let x=cx+p.x*s,y=cy+p.z*s;if(i)mctx.lineTo(x,y);else mctx.moveTo(x,y)});mctx.stroke();for(const t of trees){let p=t.g.position;mctx.fillStyle=t.stage==='sapling'?'#66ff66':t.stage==='mid'?'#00cc66':'#007744';mctx.fillRect(cx+p.x*s-1,cy+p.z*s-1,2,2)}let d=new THREE.Vector3();camera.getWorldDirection(d);d.y=0;d.normalize();let px=cx+holder.position.x*s,py=cy+holder.position.z*s,a=Math.atan2(d.z,d.x);mctx.fillStyle='#ff6';mctx.beginPath();mctx.moveTo(px+Math.cos(a)*6,py+Math.sin(a)*6);mctx.lineTo(px+Math.cos(a+2.5)*4,py+Math.sin(a+2.5)*4);mctx.lineTo(px+Math.cos(a-2.5)*4,py+Math.sin(a-2.5)*4);mctx.fill()}
let fwd=new THREE.Vector3(),right=new THREE.Vector3(),up=new THREE.Vector3(0,1,0),bob=0,last=performance.now();
function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;let sdt=dt*timeScale;simTime+=sdt;fruitTimer+=sdt;while(fruitTimer>=DAY_SEC/6){fruitTimer-=DAY_SEC/6;fruitTick()}let kF=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),kS=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mF=kF+jF,mS=kS+jS;camera.getWorldDirection(fwd);fwd.y=0;if(fwd.lengthSq())fwd.normalize();right.crossVectors(fwd,up).normalize();holder.position.x+=(fwd.x*mF+right.x*mS)*18*sdt;holder.position.z+=(fwd.z*mF+right.z*mS)*18*sdt;if(Math.hypot(holder.position.x,holder.position.z)>forestR*.95){let sc=forestR*.95/Math.hypot(holder.position.x,holder.position.z);holder.position.x*=sc;holder.position.z*=sc}holder.position.y=2.5;if(Math.abs(mF)+Math.abs(mS)>.01)bob+=sdt*7;else bob*=.9;camera.position.set(Math.sin(bob*4)*.1,1.8+Math.sin(bob*2)*.2,0);updateFruits(sdt);updateTrees(sdt);updateAnimals(sdt,simTime);refreshStatsNow();let total=0,treeBio=0,counts={butterflyN:0,birdN:0,deerN:0,rabbitN:0,squirrelN:0,eagleN:0,bearN:0};for(const a of animals){total+=a.weight;counts[a.type+'N']++}lastTotalBio=total;for(const t of trees)treeBio+=t.energy;sample+=sdt;if(sample>=1){sample-=1;hist.push(Object.assign({t:simTime,total:total,treeBiomass:treeBio,fruitN:fruits.length},counts));if(hist.length>600)hist.shift()}drawCharts();updateEnergyTower(treeBio);document.getElementById('bioText').textContent='總生物量：'+total.toFixed(1)+'｜樹生物量：'+treeBio.toFixed(1);dayTimer+=sdt;if(dayTimer>=DAY_SEC){dayTimer-=DAY_SEC;daily()}document.getElementById('clkHand').style.transform='translate(-50%,-100%) rotate('+(dayTimer/DAY_SEC*360)+'deg)';document.getElementById('dayText').textContent='已過 '+Math.floor(simTime/DAY_SEC)+' 天';miniMap();renderer.render(scene,camera)}
refreshStatsNow();miniMap();drawCharts();loop();
window.onresize=()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix()};
})();
