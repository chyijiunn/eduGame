const README = "# 漫苗森林 sketch forest v0.261 說明

v0.261 是 v0.26 的穩定修正版，目標是修正「主畫面沒有樹、沒有動物、小地圖與折線圖沒有資料」的問題。

## 操作

- 電腦：
  - W：往視野前方前進
  - S：後退
  - A / D：左右側移
  - 滑鼠移動：轉動視角
  - Tab：切換滑鼠鎖定 / 解鎖
  - 滑鼠滾輪：縮放視角
  - 滑鼠左鍵：消滅準星上的生物、移除樹，或在空地放置果實

- 手機 / 平板：
  - 單指拖曳：旋轉視角
  - 雙指捏合：縮放
  - 左下搖桿：移動
  - 右下按鈕：消滅 / 種果實

## v0.261 修正重點

1. 重新檢查初始化流程，避免 JS 中途錯誤導致 3D 場景完全不出現。
2. 初始化後一定會建立地面格線、多棵線稿樹、河流、五種動物、果實、迷你地圖與生物量圖。
3. 修正松鼠、鳥、蝴蝶靠近果實卻吃不到：進食改用水平距離與高度容許，不再只用完整 3D 距離。
4. 蝴蝶躲藏限制：遇到鳥會躲進樹叢；若樹上沒有果實，最多躲 1 小時，之後必須離開。
5. 動物改成目標導向移動：餓了找食物；吃飽找同種異性；沒有目標時探索森林其他區域。
6. 自然繁殖後會立刻更新統計數字。
7. 說明視窗會以 Markdown 標題、清單、表格等形式呈現。

## 生物規則簡表

| 物種 | 食物 | 特色 |
|---|---|---|
| 蝴蝶 | 樹上果實 | 會飛，遇到鳥會躲樹，但不能無限躲 |
| 鳥 | 蝴蝶、樹上果實 | 優先捕食蝴蝶，視野大 |
| 松鼠 | 樹上果實、地面果實 | 可在樹上與地面移動 |
| 兔子 | 地面果實 | 地面速度快，吃飽後容易繁殖 |
| 麋鹿 | 樹葉 | 吃樹會降低樹的生物量 |

## 生物量

- 總生物量：所有動物體重加總。
- 樹生物量：所有樹的 energy 加總。
- 詳細圖可勾選蝴蝶、鳥、麋鹿、兔子、松鼠、果實、樹生物量。

## 生殖

- 同種、異性、兩者都吃飽、距離夠近，才會繁殖。
- 生殖後產生一隻新個體，父母體重減半，父母重新進入飢餓狀態，生殖潛能減 1。
- 生殖潛能用完即死亡。
- 生殖瞬間會顯示愛心與右上角出生訊息。


## v0.262 新增修正

- 說明視窗改為更接近 GitHub Markdown 的排版：標題、段落、清單、表格會自動分行與縮排。

- 移除原點的紅、綠、藍 X/Y/Z 軸線。

- 初始場景加入更多地面果實，讓兔子更容易取得食物並觸發生殖。

function mdEsc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function inlineMd(s){return mdEsc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function mdToHtml(md){
  const lines=md.split('\n'); let out='', list=false, table=false, para=[];
  function flushPara(){ if(para.length){ out+='<p>'+inlineMd(para.join(' '))+'</p>'; para=[]; } }
  function closeList(){ if(list){ out+='</ul>'; list=false; } }
  function closeTable(){ if(table){ out+='</table>'; table=false; } }
  function closeAll(){ flushPara(); closeList(); closeTable(); }
  for(let raw of lines){
    const line=raw.replace(/\s+$/,'');
    if(!line.trim()){ closeAll(); continue; }
    if(line.trim()==='---'){ closeAll(); out+='<hr>'; continue; }
    if(line.startsWith('|')){
      flushPara(); closeList();
      const cells=line.split('|').slice(1,-1).map(s=>s.trim());
      if(cells.every(c=>/^[-: ]+$/.test(c))) continue;
      if(!table){ out+='<table>'; table=true; }
      out+='<tr>'+cells.map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>';
      continue;
    } else closeTable();
    if(line.startsWith('# ')){ closeAll(); out+='<h1>'+inlineMd(line.slice(2))+'</h1>'; }
    else if(line.startsWith('## ')){ closeAll(); out+='<h2>'+inlineMd(line.slice(3))+'</h2>'; }
    else if(line.startsWith('### ')){ closeAll(); out+='<h3>'+inlineMd(line.slice(4))+'</h3>'; }
    else if(line.trim().startsWith('- ')){
      flushPara(); closeTable();
      if(!list){ out+='<ul>'; list=true; }
      out+='<li>'+inlineMd(line.trim().slice(2))+'</li>';
    } else {
      closeList(); closeTable(); para.push(line.trim());
    }
  }
  closeAll(); return out;
}

function animalMesh(type,c){const g=new THREE.Group(),m=mat(c);function add(geo,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);g.add(o);return o}if(type==='deer'){add(new THREE.BoxGeometry(3,1.2,1),0,1.1,0);add(new THREE.BoxGeometry(.9,.7,.7),2,2.2,0);for(let x of [-1,1])for(let z of[-.35,.35])add(new THREE.CylinderGeometry(.15,.18,1.2,6),x,.6,z)}else if(type==='rabbit'){add(new THREE.SphereGeometry(.45,10,8),0,.45,0,1.5,1,1);add(new THREE.SphereGeometry(.32,10,8),.55,.75,0);add(new THREE.BoxGeometry(.12,.7,.15),.7,1.1,.13);add(new THREE.BoxGeometry(.12,.7,.15),.7,1.1,-.13)}else if(type==='squirrel'){add(new THREE.SphereGeometry(.4,10,8),0,.4,0,1.4,.9,1);add(new THREE.SphereGeometry(.3,10,8),.55,.7,0);let tail=add(new THREE.SphereGeometry(.35,10,8),-.55,.9,0,.8,1.6,.8);tail.rotation.z=.7}else if(type==='bird'){add(new THREE.SphereGeometry(.3,10,8),0,.5,0,1.5,1,1);add(new THREE.SphereGeometry(.22,10,8),.4,.72,0);add(new THREE.BoxGeometry(.05,.35,.7),0,.5,.5);add(new THREE.BoxGeometry(.05,.35,.7),0,.5,-.5)}else{let body=add(new THREE.CylinderGeometry(.05,.05,.5,6),0,.6,0);body.rotation.z=Math.PI/2;let w1=add(new THREE.PlaneGeometry(.7,.9),0,.6,.35),w2=add(new THREE.PlaneGeometry(.7,.9),0,.6,-.35);w1.rotation.y=Math.PI/2.4;w2.rotation.y=-Math.PI/2.4}return g}
function addAnimal(type,pos){let c=cfg[type];if(!c)return;let g=animalMesh(type,c.c);g.position.copy(pos||new THREE.Vector3());scene.add(g);animals.push({type,g,weight:c.w,initW:c.w,dailyNeed:c.need,dailyFood:0,loss:c.loss,sex:Math.random()<.5?'M':'F',repro:c.repro,full:false,hidden:false,hiddenT:0,walkSeed:Math.random()*9,wander:null});updateStats()}
function randPos(a,b){let ang=Math.random()*Math.PI*2,r=a+Math.random()*(b-a);return new THREE.Vector3(Math.cos(ang)*r,0,Math.sin(ang)*r)}
for(let i=0;i<4;i++)addAnimal('deer',randPos(40,80));for(let i=0;i<10;i++)addAnimal('rabbit',randPos(30,70));for(let i=0;i<10;i++)addAnimal('squirrel',randPos(30,70));for(let i=0;i<12;i++)addAnimal('bird',randPos(40,90));for(let i=0;i<22;i++)addAnimal('butterfly',randPos(20,80));
function horiz(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function canEat(a,f){let y=Math.abs(a.g.position.y-f.position.y),h=horiz(a.g.position,f.position);if(a.type==='rabbit')return !f.userData.attached&&f.position.y<=.65&&h<1.35;if(a.type==='squirrel')return h<1.8&&(f.userData.attached?y<4.5:true);if(a.type==='butterfly')return f.userData.attached&&h<1.8&&y<4.8;if(a.type==='bird')return f.userData.attached&&h<2.2&&y<6;return false}
function nearestFruit(a,max,filter){let best=null,bd=max;for(const f of fruits){if(f.userData.eaten)continue;if(filter&&!filter(f))continue;let d=horiz(a.g.position,f.position);if(d<bd){bd=d;best=f}}return best}
function nearestAnimal(pos,type,max,filter){let best=null,bd=max;for(const a of animals){if(a.type!==type)continue;if(filter&&!filter(a))continue;let d=horiz(pos,a.g.position);if(d<bd){bd=d;best=a}}return best}
function nearestMate(a,max){return nearestAnimal(a.g.position,a.type,max,b=>b!==a&&b.sex!==a.sex&&b.full&&b.repro>0)}
function nearestTree(pos,max){let best=null,bd=max;for(const t of trees){if(t.energy<PLANT.sapling*.3)continue;let d=horiz(pos,t.g.position);if(d<bd){bd=d;best=t}}return best}
function moveToward(a,target,speed,dt){if(!target)return;let dir=new THREE.Vector3(target.x-a.g.position.x,0,target.z-a.g.position.z);if(dir.lengthSq()>1e-4){dir.normalize();a.g.position.add(dir.multiplyScalar(speed*dt))}}

function eatFruit(a,f){if(!f||f.userData.eaten||a.full)return;f.userData.eaten=true;a.dailyFood+=1;a.weight+=a.type==='deer'?.1:.05;if(a.dailyFood>=a.dailyNeed)a.full=true}

const birthFX=document.getElementById('birthFX'),birthMsg=document.getElementById('birthMsg'),birthToast=document.getElementById('birthToast');let birthTimer;
function showBirth(type){let txt='恭喜 '+cname[type]+' 誕生一隻新個體！';birthMsg.textContent=txt;birthToast.textContent=txt;birthFX.classList.remove('show');void birthFX.offsetWidth;birthFX.classList.add('show');birthToast.style.opacity=1;clearTimeout(birthTimer);birthTimer=setTimeout(()=>birthToast.style.opacity=0,2300)}
function reproduce(a){if(!a.full||a.repro<=0)return;let m=nearestMate(a,a.type==='deer'?10:a.type==='rabbit'?8:5);if(!m||horiz(a.g.position,m.g.position)>(a.type==='deer'?5:a.type==='rabbit'?4:2.5))return;let pos=a.g.position.clone().add(m.g.position).multiplyScalar(.5);addAnimal(a.type,pos);showBirth(a.type);for(const x of [a,m]){x.weight*=.5;x.dailyFood=0;x.full=false;x.repro--}for(const x of [a,m])if(x.repro<=0){scene.remove(x.g);let i=animals.indexOf(x);if(i>=0)animals.splice(i,1)}updateStats()}
function updateAnimals(dt,now){const center=new THREE.Vector3(0,0,0);for(let i=animals.length-1;i>=0;i--){let a=animals[i],c=cfg[a.type],p=a.g.position;a.weight-=c.loss*dt/DAY_SEC;if(a.weight<=a.initW*.3){scene.remove(a.g);animals.splice(i,1);updateStats();continue}let ratio=a.weight/a.initW,scale=Math.max(.4,Math.min(1.6,ratio));a.g.scale.set(scale,scale,scale);let col=ratio<=.4?0xff5555:ratio<=.5?0xffaa55:c.c;a.g.traverse(o=>{if(o.isMesh)o.material.color.set(col)});if(Math.hypot(p.x,p.z)>forestR*(a.type==='butterfly'?1.25:.98))moveToward(a,center,6,dt);a.hidden=false;

else if(a.type==='butterfly'){let pred=nearestAnimal(p,'bird',25,b=>true),tree=nearestTree(p,35);if(pred&&horiz(p,pred.g.position)<18&&tree){moveToward(a,tree.g.position,6,dt);if(horiz(p,tree.g.position)<2.8){a.hidden=true;a.hiddenT+=dt;if(hasFruitNearTree(tree))a.hiddenT=0;if(a.hiddenT>HOUR_SEC){a.wander=null;moveToward(a,wanderTarget(a),6,dt);a.hidden=false;a.hiddenT=0}}}else{a.hiddenT=0;let f=nearestFruit(a,55,f=>f.userData.attached);if(f){moveToward(a,f.position,4.2,dt);if(canEat(a,f))eatFruit(a,f)}else moveToward(a,wanderTarget(a),3.5,dt)}p.y=1.2+Math.sin(now*3+a.walkSeed)*.35}

else if(a.type==='rabbit'||a.type==='squirrel'){let f=nearestFruit(a,a.type==='rabbit'?70:55,f=>a.type==='rabbit'?!f.userData.attached&&f.position.y<=.65:true);let speed=a.type==='rabbit'?8.5:5.5;if(f){moveToward(a,f.position,speed,dt);if(canEat(a,f))eatFruit(a,f)}else moveToward(a,wanderTarget(a),speed*.65,dt);if(a.type==='squirrel'){let t=nearestTree(p,8);p.y=t&&horiz(p,t.g.position)<3?1.6+Math.sin(now*3+a.walkSeed)*.6:0}else p.y=0}
}}
function daily(){for(const a of animals){a.dailyFood=0;a.full=false}}

function shoot(){raycaster.setFromCamera(mouseNDC,camera);let hits=raycaster.intersectObjects(scene.children,true);if(hits.length){let obj=hits[0].object;for(let i=0;i<animals.length;i++){let g=animals[i].g;if(obj===g||obj.parent===g||obj.parent?.parent===g){scene.remove(g);animals.splice(i,1);updateStats();return}}for(let i=0;i<trees.length;i++){let t=trees[i];if(obj===t.g||obj.parent===t.g||obj.userData.isTreePart){scene.remove(t.g);trees.splice(i,1);return}}for(const f of fruits)if(f===obj){f.userData.eaten=true;return}}let gh=raycaster.intersectObject(grid,true);if(gh.length)spawnFruitAt(gh[0].point.x,gh[0].point.z)}

function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;let sdt=dt*timeScale;simTime+=sdt;fruitTimer+=sdt;while(fruitTimer>=DAY_SEC/6){fruitTimer-=DAY_SEC/6;fruitTick()}let kF=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),kS=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mF=kF+jF,mS=kS+jS;camera.getWorldDirection(fwd);fwd.y=0;if(fwd.lengthSq())fwd.normalize();right.crossVectors(fwd,up).normalize();holder.position.x+=(fwd.x*mF+right.x*mS)*18*sdt;holder.position.z+=(fwd.z*mF+right.z*mS)*18*sdt;if(Math.hypot(holder.position.x,holder.position.z)>forestR*.95){let sc=forestR*.95/Math.hypot(holder.position.x,holder.position.z);holder.position.x*=sc;holder.position.z*=sc}holder.position.y=2.5;if(Math.abs(mF)+Math.abs(mS)>.01)bob+=sdt*7;else bob*=.9;camera.position.set(Math.sin(bob*4)*.1,1.8+Math.sin(bob*2)*.2,0);updateFruits(sdt);updateTrees(sdt);updateAnimals(sdt,simTime);updateStats();let total=0,treeBio=0,counts={butterflyN:0,birdN:0,deerN:0,rabbitN:0,squirrelN:0};for(const a of animals){total+=a.weight;counts[a.type+'N']++}for(const t of trees)treeBio+=t.energy;sample+=sdt;if(sample>=1){sample-=1;hist.push(Object.assign({t:simTime,total:total,treeBiomass:treeBio,fruitN:fruits.length},counts));if(hist.length>600)hist.shift()}drawCharts();document.getElementById('bioText').textContent='總生物量：'+total.toFixed(1)+'｜樹生物量：'+treeBio.toFixed(1);dayTimer+=sdt;if(dayTimer>=DAY_SEC){dayTimer-=DAY_SEC;daily()}document.getElementById('clkHand').style.transform='translate(-50%,-100%) rotate('+(dayTimer/DAY_SEC*360)+'deg)';document.getElementById('dayText').textContent='已過 '+Math.floor(simTime/DAY_SEC)+' 天';miniMap();renderer.render(scene,camera)}
