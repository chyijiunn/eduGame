<script>
(() => {
if (typeof THREE === "undefined") {
  const info = document.getElementById("info");
  if (info) info.textContent += "\\n⚠ three.js 載入失敗，請確認網路或改用本機 three.min.js。";

// ---- 說明文件 ----
const README = `# 漫苗森林 sketch forest v0.181

本頁面模擬一個線稿 3D 森林生態系，包含蝴蝶、松鼠、兔子、麋鹿、鳥等動物，
並用「體重」代表生命值與能量，搭配每日代謝、覓食、生殖條件與死亡門檻。

v0.18 之後的重點修正：

- 點左側統計面板新增任一動物時：
  - **新生個體會出現在「第一人稱視角中央十字準星所對準的地面位置附近」**，
    而不是地圖中心或隨機位置。
  - 若十字準星沒有交到地面（例如你抬頭看天空），則該次新增動物不會產生。
- 其他與 v0.18 相同：
  - 十字準星點擊：
    1. 對準「動物」→ 消滅該動物；
    2. 對準「樹木」→ 砍掉該棵樹；
    3. 若都沒命中 → 在準星對準的地面位置種 1 顆果實。
  - 生物只會因為飢餓（體重低於原始體重 30%）、被捕食、或被玩家消滅而消失，
    不會再被程式自動「砍掉多餘個體」。

---

## 操作摘要

### 電腦

- 滑鼠移動：旋轉視角（在 Tab 切到「視角模式」時）。
- Tab：切換滑鼠模式：
  - 視角模式：游標隱藏，以中央十字為準心，滑鼠移動會旋轉視角。
  - 編輯模式：游標顯示，視角固定，可操作介面與按鈕。
- W / S：前進、後退（沿視線方向）。
- A / D：左右平移。
- 滾輪：視角縮放。
- 滑鼠左鍵（中央十字）：
  1. 若對準動物 → 消滅該動物。
  2. 若對準樹木 → 砍掉該棵樹。
  3. 若都沒命中 → 在十字準星對準的地面位置種 1 顆果實。
- 左側統計面板：
  - 點「果實」：一次增加 10 顆果實（隨機掛在樹上）。
  - 點「蝴蝶／松鼠／兔子／麋鹿／鳥」：
    - 新增個體會出現在「十字準星所瞄準的地面附近」。
    - 若準星無法投射到地面（看天空）則不會生成。

### 手機 / 平板

- 左下搖桿：模擬 WASD 方向移動。
- 單指拖曳：旋轉視角。
- 雙指：縮放視角。
- 右下十字按鈕：
  - 功能與滑鼠左鍵相同（消滅動物／砍樹／在準星地面位置種果實）。

---

其它生態規則（體重、能量、日長度、麋鹿啃樹、鳥吃蝴蝶、總生物量曲線等），
與 v0.18 說明相同，此處不再重複。`;

const hText = document.getElementById("hText");
const hDl   = document.getElementById("hDl");
const help  = document.getElementById("help");
document.getElementById("helpBtn").onclick = () => help.style.display = "flex";
document.getElementById("hClose").onclick  = () => help.style.display = "none";
help.onclick = e => { if (e.target === help) help.style.display = "none"; };
hText.textContent = README;
hDl.href = "data:text/markdown;charset=utf-8," + encodeURIComponent(README);

// UI refs
const mini = document.querySelector("#mini canvas"), mCtx = mini.getContext("2d");
const stats = document.getElementById("stats");
const statsHd = document.getElementById("statsHd");
const statsArrow = document.getElementById("statsArrow");
const chartCount = document.getElementById("chartCount");
const chartMass  = document.getElementById("chartMass");
const ccCtx = chartCount.getContext("2d");
const cmCtx = chartMass.getContext("2d");
const nFruit = document.getElementById("nFruit");
const nButterfly = document.getElementById("nButterfly");
const nSquirrel  = document.getElementById("nSquirrel");
const nRabbit    = document.getElementById("nRabbit");
const nDeer      = document.getElementById("nDeer");
const nBird      = document.getElementById("nBird");
const shootBtn   = document.getElementById("shootBtn");
const bioLabel   = document.getElementById("bioLabel");
const clkHand    = document.getElementById("clkHand");
const dayText    = document.getElementById("dayText");

// 折疊統計面板
statsHd.onclick = () => {
  stats.classList.toggle("collapsed");
  statsArrow.textContent = stats.classList.contains("collapsed") ? "▲" : "▼";
};

// 點擊加生物
stats.addEventListener("click", e => {
  let t = e.target;
  while (t && !t.classList.contains("srow")) t = t.parentElement;
  if (!t) return;
  addEntity(t.dataset.e);
});

// three.js 初始化
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.002);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
const holder = new THREE.Object3D();
holder.position.set(0, 3, 0);
camera.position.set(0, 2, 0);
holder.add(camera);
scene.add(holder);

// 射線
const raycaster = new THREE.Raycaster();

// 地面格線
const grid = new THREE.GridHelper(400, 40, 0x333333, 0x111111);
grid.material.transparent = true;
grid.material.opacity = 0.6;
scene.add(grid);

// 樹木幾何
const trees = [], treePos = [], saplings = [];
const forestR = 180;
function wMat(c) { return new THREE.MeshBasicMaterial({ color: c, wireframe: true }); }
const trunkThin  = new THREE.CylinderGeometry(.25, .35, 5, 8);
const trunkThick = new THREE.CylinderGeometry(.5, .7, 6, 8);
const tall       = new THREE.CylinderGeometry(.3, .4, 8, 6);
const cone       = new THREE.ConeGeometry(2, 5, 10);
const coneW      = new THREE.ConeGeometry(3, 4, 12);
const sph        = new THREE.SphereGeometry(2.2, 10, 8);
const sSph       = new THREE.SphereGeometry(1.4, 10, 8);
const box        = new THREE.BoxGeometry(3, 3, 3);
const bush       = new THREE.SphereGeometry(1.3, 8, 6);

function makeTree(type) {
  const g = new THREE.Group(), tm = [], cm = [], mats = [];
  g.userData.isTreeRoot = true;
  function pushMesh(mesh, isCrown) {
    g.add(mesh);
    mats.push(mesh.material);
    if (isCrown) cm.push(mesh.material); else tm.push(mesh.material);
  }
  if (type === 0) {
    const mT = wMat(0x226633), mC = wMat(0x55ff99);
    const t = new THREE.Mesh(trunkThin, mT); t.position.y = 3; t.scale.y = 1 + Math.random();
    const c = new THREE.Mesh(cone, mC); c.position.y = t.position.y + 3.5;
    pushMesh(t,false); pushMesh(c,true);
  } else if (type === 1) {
    const mT = wMat(0x226633), mC = wMat(0x66ffcc);
    const t = new THREE.Mesh(tall, mT); t.position.y = 4; t.scale.y = 1 + Math.random();
    pushMesh(t,false);
    const lv = 3 + Math.floor(Math.random() * 2);
    for (let i = 0; i < lv; i++) {
      const c = new THREE.Mesh(coneW, mC);
      c.position.y = t.position.y + 1.5 + i * 1.8;
      const s = 1.1 - i * 0.2; c.scale.set(s, s, s);
      pushMesh(c,true);
    }
  } else if (type === 2) {
    const mT = wMat(0x885533), mC = wMat(0x88ff88);
    const t = new THREE.Mesh(trunkThick, mT); t.position.y = 3;
    const c = new THREE.Mesh(sph, mC); c.position.y = t.position.y + 3.5;
    pushMesh(t,false); pushMesh(c,true);
    for (let i = 0; i < 2; i++) {
      const s = new THREE.Mesh(sSph, mC);
      const a = Math.random() * Math.PI * 2, r = 2 + Math.random();
      s.position.set(c.position.x + Math.cos(a) * r, c.position.y - 0.4 + Math.random(), c.position.z + Math.sin(a) * r);
      pushMesh(s,true);
    }
  } else if (type === 3) {
    const mT = wMat(0x996633), mC = wMat(0x66ff88);
    const t = new THREE.Mesh(trunkThin, mT); t.position.y = 2.8;
    const c = new THREE.Mesh(box, mC); c.position.y = t.position.y + 3;
    pushMesh(t,false); pushMesh(c,true);
  } else {
    const mT = wMat(0x335533), mC = wMat(0x77ffbb);
    const t = new THREE.Mesh(trunkThin, mT); t.position.y = 1.8; t.scale.y = .7;
    pushMesh(t,false);
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const b = new THREE.Mesh(bush, mC);
      const a = i / n * Math.PI * 2 + Math.random() * 0.4, r = 1.2 + Math.random();
      b.position.set(Math.cos(a) * r, t.position.y + 1 + Math.random(), Math.sin(a) * r);
      pushMesh(b,true);
    }
  }
  g.userData.mats = mats;
  const baseEnergy = [30,40,45,35,25][type] || 30;
  return { g, tm, cm, energy: baseEnergy };
}

// 果實
const fruitGeo = new THREE.SphereGeometry(.3, 8, 8);
const fruitMat = new THREE.MeshBasicMaterial({ color: 0x99ffee, wireframe: true, transparent: true, opacity: .6 });
const fruits = [];
function spawnFruitOnTree(treeObj) {
  const m = new THREE.Mesh(fruitGeo, fruitMat.clone());
  const a = Math.random() * Math.PI * 2, r = 1.5 + Math.random() * 1.2, h = 3 + Math.random() * 3;
  m.position.set(treeObj.g.position.x + Math.cos(a) * r, h, treeObj.g.position.z + Math.sin(a) * r);
  m.userData = { vy: 0, age: 0, delay: 2 + Math.random() * 6, attached: true, eaten: false, sapling: false };
  scene.add(m); fruits.push(m);
}
function spawnFruitAt(x, z) {
  const m = new THREE.Mesh(fruitGeo, fruitMat.clone());
  m.position.set(x, 0.3, z);
  m.userData = { vy: 0, age: 0, delay: 0, attached: false, eaten: false, sapling: false };
  scene.add(m); fruits.push(m);
}

// 生成森林與果實
for (let i = 0; i < 220; i++) {
  const a = Math.random() * Math.PI * 2, r = (.3 + .7 * Math.random()) * forestR;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const t = makeTree(Math.floor(Math.random() * 5));
  t.g.position.set(x, 0, z);
  scene.add(t.g);
  trees.push(t);
  treePos.push({ x, z, s: false });
  const n = 2 + Math.floor(Math.random() * 3);
  for (let k = 0; k < n; k++) spawnFruitOnTree(t);
}

// 河流
const riverPts = [
  { x: -120, z: -40 },
  { x: -60,  z: -20 },
  { x: 10,   z: 10  },
  { x: 70,   z: 40  },
  { x: 130,  z: 80  }
], riverW = 14, riverMini = [];

function addRiver(p1, p2) {
  const dx = p2.x - p1.x, dz = p2.z - p1.z;
  const len = Math.hypot(dx, dz) || 1, ang = Math.atan2(dx, dz);
  const g = new THREE.PlaneGeometry(riverW, len, 1, 1);
  const m = new THREE.MeshBasicMaterial({ color: 0x3399ff, wireframe: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.z = ang;
  mesh.position.set((p1.x + p2.x) / 2, 0.02, (p1.z + p2.z) / 2);
  scene.add(mesh);
}

for (let i = 0; i < riverPts.length - 1; i++) {
  addRiver(riverPts[i], riverPts[i + 1]);
  riverMini.push(riverPts[i]);
}
riverMini.push(riverPts[riverPts.length - 1]);

function distRiver(x, z) {
  let m = 1e9;
  for (let i = 0; i < riverPts.length - 1; i++) {
    const p1 = riverPts[i], p2 = riverPts[i + 1];
    const vx = p2.x - p1.x, vz = p2.z - p1.z;
    const wx = x - p1.x, wz = z - p1.z;
    const L = vx * vx + vz * vz || 1;
    const t = Math.max(0, Math.min(1, (wx * vx + wz * vz) / L));
    const px = p1.x + vx * t, pz = p1.z + vz * t;
    const d = Math.hypot(x - px, z - pz);
    if (d < m) m = d;
  }
  return m;
}

// 相機與控制
let yaw = 0, pitch = 0, lastX = null, lastY = null;
let lockView = false;

function updRot() {
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}
updRot();

const isMobile = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;

const joyk  = document.getElementById("joyk");

// 滑鼠移動視角（桌機，在 lockView 模式下）
window.addEventListener("mousemove", e => {
  if (isMobile || !lockView) return;
  if (lastX == null) { lastX = e.clientX; lastY = e.clientY; return; }
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  const s = 0.003; yaw -= dx * s; pitch -= dy * s;
  const L = Math.PI / 2 - 0.05;
  if (pitch >  L) pitch = L;
  if (pitch < -L) pitch = -L;
  updRot();
});

// Tab 鍵切換滑鼠模式（僅桌機）

// 取得十字標指向的地面座標
function getCrosshairGroundPoint(yTarget = 0.3) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  if (Math.abs(dir.y) < 1e-3) return null;
  const t = (yTarget - camera.position.y) / dir.y;
  if (t <= 0) return null;
  const pos = new THREE.Vector3().copy(camera.position).addScaledVector(dir, t);
  const dC = Math.hypot(pos.x, pos.z);
  if (dC > forestR * 1.1) return null;
  return pos;
}

// 動物資料結構
const animals = { beetle: [], squirrel: [], rabbit: [], deer: [], bird: [] }; // beetle = 蝴蝶

// 射擊 / 砍樹 / 種果實
function shootOrPlant() {
  const targets = [];
  ["beetle","squirrel","rabbit","deer","bird"].forEach(t => animals[t].forEach(a => targets.push(a.g)));
  trees.forEach(t => targets.push(t.g));
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const hits = raycaster.intersectObjects(targets, true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !obj.userData.isAnimalGroup && !obj.userData.isTreeRoot) obj = obj.parent;
    if (!obj) return;
    if (obj.userData.isAnimalGroup) {
      const type = obj.userData.type;
      const list = animals[type];
      for (let i = 0; i < list.length; i++) {
        if (list[i].g === obj) {
          scene.remove(obj);
          list.splice(i, 1);
          return;
        }
      }
    } else if (obj.userData.isTreeRoot) {
      const idx = trees.findIndex(t => t.g === obj);
      if (idx >= 0) {
        trees.splice(idx, 1);
        treePos.splice(idx, 1);
        scene.remove(obj);
        for (let i = saplings.length - 1; i >= 0; i--) {
          if (saplings[i].t === obj) saplings.splice(i, 1);
        }
      } else {
        scene.remove(obj);
      }
      return;
    }
  } else {
    const pos = getCrosshairGroundPoint(0.3);
    if (!pos) return;
    spawnFruitAt(pos.x, pos.z);
  }
}

window.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  if (e.target !== canvas) return;
  shootOrPlant();
});
shootBtn.onclick = e => { e.preventDefault(); shootOrPlant(); };

// 滾輪視角縮放
window.addEventListener("wheel", e => {
  e.preventDefault();
  camera.fov += e.deltaY * 0.02;
  if (camera.fov < 30) camera.fov = 30;
  if (camera.fov > 90) camera.fov = 90;

// 觸控旋轉與縮放
let tRot = false, tLastX = 0, tLastY = 0, pinch = false, pinchStart = 0, pinchFov = 60;
canvas.addEventListener("touchstart", e => {
  if (!isMobile) return;
  if (e.target === joy || e.target === joyb || e.target === joyk || e.target === shootBtn) return;
  if (e.touches.length === 1) {
    tRot = true; tLastX = e.touches[0].clientX; tLastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    pinch = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStart = Math.hypot(dx, dy); pinchFov = camera.fov;
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  if (!isMobile) return;
  if (e.touches.length === 1 && tRot) {
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    const dx = x - tLastX, dy = y - tLastY; tLastX = x; tLastY = y;
    const s = 0.003; yaw -= dx * s; pitch -= dy * s;
    const L = Math.PI / 2 - 0.05;
    if (pitch >  L) pitch = L;
    if (pitch < -L) pitch = -L;
    updRot();
  } else if (e.touches.length === 2 && pinch) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    const scale = d / (pinchStart || d);
    camera.fov = pinchFov / scale;
    if (camera.fov < 30) camera.fov = 30;
    if (camera.fov > 90) camera.fov = 90;
    camera.updateProjectionMatrix();
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend", e => {
  if (!isMobile) return;
  if (e.touches.length === 0) tRot = false;
  if (e.touches.length < 2) pinch = false;
});

// 搖桿控制（手機）
let jAct = false, jCX = 0, jCY = 0, jR = 40, jF = 0, jS = 0;
function jStart(e) {
  if (!isMobile) return;
  jAct = true;
  const r = joyb.getBoundingClientRect();
  jCX = r.left + r.width / 2; jCY = r.top + r.height / 2;
  const t = e.touches[0]; jMove(t.clientX, t.clientY);
}
function jMove(x, y) {
  let dx = x - jCX, dy = y - jCY;
  const d = Math.hypot(dx, dy), mx = jR;
  if (d > mx) {
    const s = mx / (d || 1); dx *= s; dy *= s;
  }
  const nx = dx / mx, ny = dy / mx;
  jS = nx; jF = -ny;
  joyk.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function jMoveEvt(e) {
  if (!jAct) return;
  const t = e.touches[0]; jMove(t.clientX, t.clientY);
  e.preventDefault();
}
function jEnd(e) {
  if (e.touches.length === 0) {
    jAct = false; jF = 0; jS = 0; joyk.style.transform = "translate(-50%,-50%)";
  }
}
joy.addEventListener("touchstart", jStart,    { passive: false });
joy.addEventListener("touchmove",  jMoveEvt,  { passive: false });
joy.addEventListener("touchend",   jEnd,      { passive: false });
joy.addEventListener("touchcancel",jEnd,      { passive: false });

// 物種參數設定
const speciesCfg = {
  butterfly: { initW: 2,   loss: 0.1, need: 3,  repro: 100 },
  squirrel:  { initW: 40,  loss: 1,   need: 10, repro: 10  },
  rabbit:    { initW: 40,  loss: 1,   need: 10, repro: 10  },
  deer:      { initW: 200, loss: 5,   need: 30, repro: 2   },
  bird:      { initW: 100, loss: 2.5, need: 15, repro: 5   }
};

// 動物外觀
const aColNorm = 0xffee55;
const aColWarn = 0xffaa44;
const aColCrit = 0xff4444;

function aMesh(type) {
  const g = new THREE.Group(), mats = [];
  function mLine(color) {
    const m = new THREE.MeshBasicMaterial({ color, wireframe: true });
    mats.push(m);
    return m;
  }
  if (type === "beetle") {
    const body = new THREE.Mesh(new THREE.SphereGeometry(.25, 8, 8), mLine(aColNorm));
    const wingGeo = new THREE.PlaneGeometry(1, 1.2);
    const wL = new THREE.Mesh(wingGeo, mLine(aColNorm)), wR = new THREE.Mesh(wingGeo, mLine(aColNorm));
    wL.position.set(-.25, 0, 0); wR.position.set(.25, 0, 0);
    wL.rotation.y = Math.PI / 4; wR.rotation.y = -Math.PI / 4;
    g.add(body, wL, wR);
  } else if (type === "rabbit") {
    const body = new THREE.Mesh(new THREE.SphereGeometry(.7, 10, 10), mLine(aColNorm));
    const head = new THREE.Mesh(new THREE.SphereGeometry(.4, 10, 10), mLine(aColNorm)); head.position.set(.5, .2, 0);
    const ear = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .6, 6), mLine(aColNorm));
    const ear2 = ear.clone(); ear.position.set(.35, .8, .15); ear2.position.set(.45, .8, -.15);
    g.add(body, head, ear, ear2);
  } else if (type === "squirrel") {
    const body = new THREE.Mesh(new THREE.SphereGeometry(.7, 10, 10), mLine(aColNorm));
    const head = new THREE.Mesh(new THREE.SphereGeometry(.4, 10, 10), mLine(aColNorm)); head.position.set(.4, .2, 0);
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(.15, .25, 1.2, 8), mLine(aColNorm)); tail.position.set(-.6, .4, 0); tail.rotation.z = Math.PI / 2;
    g.add(body, head, tail);
  } else if (type === "deer") {
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1, .6), mLine(aColNorm)); body.position.y = .6;
    const head = new THREE.Mesh(new THREE.SphereGeometry(.4, 8, 8), mLine(aColNorm)); head.position.set(1.1, 1.4, 0);
    g.add(body, head);
  } else if (type === "bird") {
    const body = new THREE.Mesh(new THREE.SphereGeometry(.4, 8, 8), mLine(aColNorm));
    const head = new THREE.Mesh(new THREE.SphereGeometry(.25, 8, 8), mLine(aColNorm)); head.position.set(.35, .1, 0);
    const wing = new THREE.BoxGeometry(.7, .12, .3);
    const wL = new THREE.Mesh(wing, mLine(aColNorm)), wR = new THREE.Mesh(wing, mLine(aColNorm));
    wL.position.set(-.4, 0, .3); wR.position.set(-.4, 0, -.3);
    g.add(body, head, wL, wR);
  }
  g.userData.isAnimalGroup = true;
  g.userData.type = type;
  g.userData.mats = mats;
  return g;
}

function randPos() {
  const a = Math.random() * Math.PI * 2, r = Math.random() * forestR * 0.9;
  return { x: Math.cos(a) * r, z: Math.sin(a) * r };
}

function spawnAnimal(type, pos) {
  const g = aMesh(type), p = pos || randPos();
  const y = type === "bird" ? 8 + Math.random() * 4 : type === "beetle" ? 1 + Math.random() * 3 : .3;
  g.position.set(p.x, y, p.z);
  scene.add(g);
  const cfgName = (type === "beetle") ? "butterfly" : type;
  const cfg = speciesCfg[cfgName];
  const obj = {
    type, g,
    s: (type === "deer" ? 6 : type === "bird" ? 8 : 4),
    vx: 0, vz: 0,
    t: Math.random() * Math.PI * 2,
    baseY: y,
    cfgName,
    initW: cfg.initW,
    weight: cfg.initW,
    dailyFood: 0,
    reproEnergy: 0,
    reproRemain: cfg.repro,
    sex: Math.random() < 0.5 ? "M" : "F",
    treeTarget: null,
    target: null
  };
  animals[type].push(obj);
  return obj;
}

// 初始群聚
function initAnimals() {
  for (let i = 0; i < 40; i++) spawnAnimal("beetle");
  for (let i = 0; i < 18; i++) spawnAnimal("squirrel");
  for (let i = 0; i < 20; i++) spawnAnimal("rabbit");
  for (let i = 0; i < 8;  i++) spawnAnimal("deer");
  for (let i = 0; i < 14; i++) spawnAnimal("bird");
}
initAnimals();

// 生物攝食與體重更新
function gainFood(a, foodW) {
  const cfg = speciesCfg[a.cfgName];
  const need = cfg.need;
  const remaining = Math.max(0, Math.min(foodW, Math.max(0, need - a.dailyFood)));
  a.dailyFood += foodW;
  a.weight += remaining * 0.1;
  a.reproEnergy += foodW;
}

// 果實 / 小樹更新
function remFruit(f) {
  const i = fruits.indexOf(f);
  if (i >= 0) fruits.splice(i, 1);
  if (f.parent) f.parent.remove(f);
}

function updFruits(dt) {
  for (const f of fruits) {
    const d = f.userData; d.age += dt;
    if (d.attached) {
      if (d.age > d.delay) { d.attached = false; d.vy = 0; }
    } else {
      d.vy -= 9.8 * dt * .8;
      f.position.y += d.vy * dt;
      if (f.position.y <= 0.1) {
        f.position.y = 0.1; d.vy = 0;
        if (!d.eaten && !d.sapling) {
          const t = makeTree(Math.floor(Math.random() * 5));
          t.g.position.set(f.position.x, 0, f.position.z);
          t.g.scale.set(.2, .2, .2);
          scene.add(t.g);
          trees.push(t);
          treePos.push({ x: t.g.position.x, z: t.g.position.z, s: true });
          saplings.push({ t, age: 0, target: .9 + Math.random() * .6 });
          d.sapling = true;
        }
      }
    }
  }
}

function updSaplings(dt) {
  for (const s of saplings) {
    s.age += dt;
    const k = Math.min(s.age / 60, 1), b = .2, sc = b + (s.target - b) * k;
    s.t.g.scale.set(sc, sc, sc);
  }
}

function nearFruit(x, z, maxD) {
  let best = null, b = maxD;
  for (const f of fruits) {
    const d = Math.hypot(f.position.x - x, f.position.z - z);
    if (d < b) { b = d; best = f; }
  }
  return best;
}

function nearTree(x, z, maxD) {
  let best = null, b = maxD;
  for (const t of trees) {
    if (t.energy <= 0) continue;
    const px = t.g.position.x, pz = t.g.position.z;
    const d = Math.hypot(px - x, pz - z);
    if (d < b) { b = d; best = t; }
  }
  return best;
}

// 生物行為與生殖
function updAnimals(dt) {
  const w = 0.5;
  for (const type of ["beetle","rabbit","squirrel","deer","bird"]) {
    const list = animals[type];
    for (const a of list) {
      a.t += dt;

      if (type === "beetle") {
        if (!a.target && Math.random() < .02) a.target = nearFruit(a.g.position.x, a.g.position.z, 40);
        if (a.target) {
          const tx = a.target.position.x, tz = a.target.position.z;
          const dx = tx - a.g.position.x, dz = tz - a.g.position.z, len = Math.hypot(dx, dz) || 1;
          const nx = dx / len, nz = dz / len;
          a.vx += nx * a.s * .35 * dt; a.vz += nz * a.s * .35 * dt;
          if (len < 1.2) {
            a.target.userData.eaten = true;
            gainFood(a, 1);
            remFruit(a.target); a.target = null;
          }
        } else {
          a.vx += Math.cos(a.t * 1.7) * w * dt;
          a.vz += Math.sin(a.t * 1.3) * w * dt;
        }
        a.g.position.y = a.baseY + Math.sin(a.t * 2) * .4;
      } else if (type === "rabbit") {
        if (!a.target && Math.random() < .02) a.target = nearFruit(a.g.position.x, a.g.position.z, 25);
        if (a.target) {
          const tx = a.target.position.x, tz = a.target.position.z;
          const dx = tx - a.g.position.x, dz = tz - a.g.position.z, len = Math.hypot(dx, dz) || 1;
          const nx = dx / len, nz = dz / len;
          a.vx += nx * a.s * .4 * dt; a.vz += nz * a.s * .4 * dt;
          if (len < 1.4) {
            a.target.userData.eaten = true;
            gainFood(a, 1);
            remFruit(a.target); a.target = null;
          }
        } else {
          a.vx += Math.cos(a.t * 1.3) * w * dt;
          a.vz += Math.sin(a.t * 1.1) * w * dt;
        }
        a.g.position.y = a.baseY;
      } else if (type === "squirrel") {
        if (!a.target && Math.random() < .03) a.target = nearFruit(a.g.position.x, a.g.position.z, 30);
        if (a.target) {
          const tx = a.target.position.x, ty = a.target.position.y, tz = a.target.position.z;
          const dx = tx - a.g.position.x, dz = tz - a.g.position.z, len = Math.hypot(dx, dz) || 1;
          const nx = dx / len, nz = dz / len;
          a.vx += nx * a.s * .45 * dt; a.vz += nz * a.s * .45 * dt;
          const ty2 = ty > 2 ? ty : a.baseY;
          a.g.position.y += (ty2 - a.g.position.y) * .1;
          if (len < 1.4 && Math.abs(a.g.position.y - ty) < 1.5) {
            a.target.userData.eaten = true;
            gainFood(a, 1);
            remFruit(a.target); a.target = null;
          }
        } else {
          a.vx += Math.cos(a.t * 1.6) * w * dt;
          a.vz += Math.sin(a.t * 1.4) * w * dt;
          a.g.position.y = a.baseY + Math.abs(Math.sin(a.t * 3)) * 1.1;
        }
      } else if (type === "deer") {
        if (!a.target && Math.random() < .02) a.target = nearFruit(a.g.position.x, a.g.position.z, 35);
        if (a.target && a.target.position) {
          const tx = a.target.position.x, tz = a.target.position.z;
          const dx = tx - a.g.position.x, dz = tz - a.g.position.z, len = Math.hypot(dx, dz) || 1;
          const nx = dx / len, nz = dz / len;
          a.vx += nx * a.s * .35 * dt; a.vz += nz * a.s * .35 * dt;
          if (len < 2) {
            a.target.userData.eaten = true;
            gainFood(a, 1);
            remFruit(a.target); a.target = null;
            a.treeTarget = null;
          }
        } else {
          if (!a.treeTarget && Math.random() < .02) a.treeTarget = nearTree(a.g.position.x, a.g.position.z, 40);
          if (a.treeTarget && a.treeTarget.energy > 0) {
            const tx = a.treeTarget.g.position.x, tz = a.treeTarget.g.position.z;
            const dx = tx - a.g.position.x, dz = tz - a.g.position.z, len = Math.hypot(dx, dz) || 1;
            const nx = dx / len, nz = dz / len;
            a.vx += nx * a.s * .3 * dt; a.vz += nz * a.s * .3 * dt;
            if (len < 3) {
              const bite = Math.min(10, a.treeTarget.energy);
              if (bite > 0) {
                a.treeTarget.energy -= bite;
                gainFood(a, bite);
                const s = 1 - 0.02 * (bite / 10);
                a.treeTarget.g.scale.multiplyScalar(s);
              } else {
                a.treeTarget = null;
              }
            }
          } else {
            a.treeTarget = null;
            const dR = distRiver(a.g.position.x, a.g.position.z);
            if (dR > riverW * .8) {
              const mid = riverPts[Math.floor(riverPts.length / 2)];
              const dx = mid.x - a.g.position.x, dz = mid.z - a.g.position.z, len = Math.hypot(dx, dz) || 1;
              const nx = dx / len, nz = dz / len;
              a.vx += nx * a.s * .25 * dt; a.vz += nz * a.s * .25 * dt;
            } else {
              a.vx += Math.cos(a.t * .7) * w * dt;
              a.vz += Math.sin(a.t * .9) * w * dt;
            }
          }
        }
        a.g.position.y = a.baseY;
      } else if (type === "bird") {
        if (!a.target && Math.random() < .02) {
          const bs = animals.beetle;
          if (bs.length && Math.random() < .7) a.target = bs[Math.floor(Math.random() * bs.length)];
          else a.target = nearFruit(a.g.position.x, a.g.position.z, 50);
        }
        if (a.target && a.target.g) {
          const tx = a.target.g.position.x, tz = a.target.g.position.z;
          const dx = tx - a.g.position.x, dz = tz - a.g.position.z, len = Math.hypot(dx, dz) || 1;
          const nx = dx / len, nz = dz / len;
          a.vx += nx * a.s * .4 * dt; a.vz += nz * a.s * .4 * dt;
          a.g.position.y += (a.baseY + 2 - a.g.position.y) * .05;
          if (len < 1.6) {
            const arr = animals.beetle, idx = arr.indexOf(a.target);
            if (idx >= 0) {
              const victim = arr[idx];
              scene.remove(victim.g);
              arr.splice(idx, 1);
              gainFood(a, 2);
            }
            a.target = null;
          }
        } else if (a.target && a.target.position) {
          const tx = a.target.position.x, tz = a.target.position.z;
          const dx = tx - a.g.position.x, dz = tz - a.g.position.z, len = Math.hypot(dx, dz) || 1;
          const nx = dx / len, nz = dz / len;
          a.vx += nx * a.s * .4 * dt; a.vz += nz * a.s * .4 * dt;
          a.g.position.y += (a.baseY - a.g.position.y) * .05;
          if (len < 1.6) {
            a.target.userData.eaten = true;
            gainFood(a, 1);
            remFruit(a.target); a.target = null;
          }
        } else {
          a.vx += Math.cos(a.t * .9) * w * dt;
          a.vz += Math.sin(a.t * 1.1) * w * dt;
          a.g.position.y = a.baseY + Math.sin(a.t * 1.5) * 1.2;
        }
      }

      a.vx *= .96; a.vz *= .96;
      a.g.position.x += a.vx * dt;
      a.g.position.z += a.vz * dt;
      const dC = Math.hypot(a.g.position.x, a.g.position.z);
      if (dC > forestR * .95) {
        const s = (forestR * .95) / (dC || 1);
        a.g.position.x *= s; a.g.position.z *= s;
      }

      const ratio = a.weight / a.initW;
      const scale = 0.6 + Math.max(0, Math.min(ratio, 2.0)) * 0.7;
      a.g.scale.set(scale, scale, scale);
      let col = aColNorm;
      if (ratio <= 0.5 && ratio > 0.4) col = aColWarn;
      else if (ratio <= 0.4 && ratio >= 0.31) col = aColCrit;
      const mats = a.g.userData.mats || [];
      mats.forEach(m => m.color.setHex(col));
    }

    const cfgName = (type === "beetle") ? "butterfly" : type;
    const cfg = speciesCfg[cfgName];
    const thr = 0.5 * cfg.initW;
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (a.reproRemain <= 0 || a.reproEnergy < thr) continue;
      for (let j = 0; j < list.length; j++) {
        if (i === j) continue;
        const b = list[j];
        if (b.sex === a.sex || b.reproRemain <= 0 || b.reproEnergy < thr) continue;
        const dx = a.g.position.x - b.g.position.x, dz = a.g.position.z - b.g.position.z;
        if (dx * dx + dz * dz < 16) {
          spawnAnimal(type, {
            x: (a.g.position.x + b.g.position.x) / 2,
            z: (a.g.position.z + b.g.position.z) / 2
          });
          a.reproRemain--; b.reproRemain--;
          a.reproEnergy *= 0.3; b.reproEnergy *= 0.3;
          a.weight -= cfg.initW * 0.1; b.weight -= cfg.initW * 0.1;
          break;
        }
      }
    }
  }
}

// 能量塔式族群調整：只補，不砍
let popTimer = 0;
function updPop(dt) {
  popTimer += dt; if (popTimer < 8) return; popTimer = 0;
  const fN = fruits.length;
  const bt = animals.beetle;
  const fFactor = Math.min(fN / (trees.length * 3), 1);
  const tgt = {
    beetle: 30 + Math.round(30 * fFactor),
    rabbit: 10 + Math.round(12 * fFactor),
    squirrel: 8 + Math.round(10 * fFactor),
    deer: 4 + Math.round(4 * fFactor * .7)
  };
  const bFactor = Math.min(bt.length / 35, 1);
  tgt.bird = 6 + Math.round(10 * bFactor);

  for (const k of ["beetle","rabbit","squirrel","deer","bird"]) {
    const arr = animals[k], t = tgt[k] || arr.length;
    if (arr.length < t) {
      for (let i = 0; i < t - arr.length; i++) spawnAnimal(k);
    }
  }
}

// 日結算
const DAY_SEC = 120;
let dayTimer = 0;
let dayCount = 0;
function endOfDay() {
  for (const type of ["beetle","rabbit","squirrel","deer","bird"]) {
    const arr = animals[type];
    for (let i = arr.length - 1; i >= 0; i--) {
      const a = arr[i];
      const cfg = speciesCfg[a.cfgName];
      if (a.dailyFood < cfg.need) a.weight -= cfg.loss;
      if (a.weight < cfg.initW * 0.3) {
        scene.remove(a.g); arr.splice(i, 1);
      } else if (a.weight < 0) a.weight = 0;
      a.dailyFood = 0;
    }
  }
  dayCount++;
}

// 統計歷史
const hist = [], histMax = 120; let histAcc = 0, lastTotalBio = 0;
function totalW(list) { let s = 0; for (const a of list) s += a.weight; return s; }

function recHist(dt) {
  histAcc += dt; if (histAcc < 1) return; histAcc -= 1;
  const totalBio =
    totalW(animals.beetle) +
    totalW(animals.squirrel) +
    totalW(animals.rabbit) +
    totalW(animals.deer) +
    totalW(animals.bird);
  lastTotalBio = totalBio;
  hist.push({
    fruit: fruits.length,
    butterfly: animals.beetle.length,
    squirrel: animals.squirrel.length,
    rabbit: animals.rabbit.length,
    deer: animals.deer.length,
    bird: animals.bird.length,
    totalW: totalBio
  });
  if (hist.length > histMax) hist.shift();
}

function drawCharts() {
  const w = chartCount.width, h = chartCount.height;
  ccCtx.clearRect(0,0,w,h);
  cmCtx.clearRect(0,0,w,h);
  if (hist.length < 2) {
    bioLabel.textContent = "總生物量：0";
    return;
  }
  let maxN = 1, maxW = 1;
  for (const s of hist) {
    maxN = Math.max(maxN, s.fruit, s.butterfly, s.squirrel, s.rabbit, s.deer, s.bird);
    maxW = Math.max(maxW, s.totalW);
  }
  const left = 4, right = 4, top = 3, bottom = 10, uw = w - left - right, uh = h - top - bottom;
  const seriesN = [
    { k: "fruit",      c: "#99ffee" },
    { k: "butterfly",  c: "#ffd85c" },
    { k: "squirrel",   c: "#ff66cc" },
    { k: "rabbit",     c: "#ff9866" },
    { k: "deer",       c: "#7aa9ff" },
    { k: "bird",       c: "#ffffff" }
  ];
  for (const s of seriesN) {
    ccCtx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const v = hist[i][s.k], t = i / (hist.length - 1);
      const x = left + t * uw, y = h - bottom - (v / maxN) * uh;
      if (i === 0) ccCtx.moveTo(x, y); else ccCtx.lineTo(x, y);
    }
    ccCtx.strokeStyle = s.c; ccCtx.lineWidth = 1; ccCtx.stroke();
  }
  cmCtx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    const v = hist[i].totalW, t = i / (hist.length - 1);
    const x = left + t * uw, y = h - bottom - (v / maxW) * uh;
    if (i === 0) cmCtx.moveTo(x, y); else cmCtx.lineTo(x, y);
  }
  cmCtx.strokeStyle = "#a0fffa"; cmCtx.lineWidth = 1.4; cmCtx.stroke();
  bioLabel.textContent = "總生物量：" + lastTotalBio.toFixed(1);
}

// 迷你地圖
function drawMini(cam, fx, fz) {
  const size = Math.min(mini.parentElement.clientWidth, mini.parentElement.clientHeight);
  if (mini.width !== size || mini.height !== size) { mini.width = size; mini.height = size; }
  const w = mini.width, h = mini.height, ctx = mCtx;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = "rgba(5,10,20,.98)"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2; ctx.strokeRect(2,2,w-4,h-4);
  const cx = w * .5, cy = h * .5, scale = 0.6 / forestR;

  ctx.beginPath();
  riverMini.forEach((p,i) => {
    const x = cx + p.x * scale * w, y = cy - p.z * scale * h;
    if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = "rgba(80,160,255,.9)"; ctx.lineWidth = 2; ctx.stroke();

  for (const p of treePos) {
    const x = cx + p.x * scale * w, y = cy - p.z * scale * h;
    const dx = p.x - cam.x, dz = p.z - cam.z;
    const d = Math.hypot(dx, dz);
    if (d < forestR * 1.2) {
      ctx.beginPath();
      ctx.arc(x, y, d < 30 ? 2 : 1.4, 0, Math.PI * 2);
      ctx.fillStyle = p.s ? "rgba(170,255,170,.95)" : "rgba(80,255,140,.85)";
      ctx.fill();
    }
  }

  const px = cx + cam.x * scale * w, py = cy - cam.z * scale * h, len = 7, a = Math.atan2(-fz, fx);
  ctx.beginPath();
  ctx.moveTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
  ctx.lineTo(px + Math.cos(a + 2.4) * len * .6, py + Math.sin(a + 2.4) * len * .6);
  ctx.lineTo(px + Math.cos(a - 2.4) * len * .6, py + Math.sin(a - 2.4) * len * .6);
  ctx.closePath(); ctx.fillStyle = "rgba(255,90,90,.95)"; ctx.fill();

  const r = 18, cx2 = w - r - 8, cy2 = r + 8;
  ctx.beginPath(); ctx.arc(cx2, cy2, r, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "10px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("N", cx2, cy2 - r + 7); ctx.fillText("S", cx2, cy2 + r - 7);
}

// 統計數字更新
function updStats() {
  nFruit.textContent = fruits.length;
  nButterfly.textContent = animals.beetle.length;
  nSquirrel.textContent  = animals.squirrel.length;
  nRabbit.textContent    = animals.rabbit.length;
  nDeer.textContent      = animals.deer.length;
  nBird.textContent      = animals.bird.length;
}

// 點擊面板增加個體：動物**必須**在十字準星對到的地面位置附近生成
function addEntity(t) {
  if (t === "fruit") {
    for (let i = 0; i < 10; i++) {
      const tr = trees[Math.floor(Math.random() * trees.length)];
      spawnFruitOnTree(tr);
    }
  } else {
    const pos = getCrosshairGroundPoint(0.3);
    if (!pos) return; // 沒有對到地面就不生成
    const p2 = { x: pos.x, z: pos.z };
    if (t === "butterfly") {
      for (let i = 0; i < 10; i++) spawnAnimal("beetle", p2);
    } else if (t === "rabbit") {
      spawnAnimal("rabbit", p2);
    } else if (t === "squirrel") {
      spawnAnimal("squirrel", p2);
    } else if (t === "deer") {
      spawnAnimal("deer", p2);
    } else if (t === "bird") {
      spawnAnimal("bird", p2);
    }
  }
}

// 視窗尺寸更新
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// 主迴圈
let last = performance.now(), bob = 0;
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0,1,0), tmp = new THREE.Vector3();

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = (now - last) / 1000; last = now;

  const base = 18;
  const kF = (keys["w"] || keys["arrowup"] ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 1 : 0);
  const kS = (keys["d"] || keys["arrowright"] ? 1 : 0) - (keys["a"] || keys["arrowleft"] ? 1 : 0);
  const mF = kF + jF, mS = kS + jS;

  camera.getWorldDirection(tmp); tmp.y = 0;
  if (tmp.lengthSq() > 1e-4) tmp.normalize();
  fwd.copy(tmp);
  right.crossVectors(fwd, up).normalize();
  holder.position.x += (fwd.x * mF + right.x * mS) * base * dt;
  holder.position.z += (fwd.z * mF + right.z * mS) * base * dt;
  const dC = Math.hypot(holder.position.x, holder.position.z);
  if (dC > forestR * .95) {
    const s = (forestR * .95) / (dC || 1);
    holder.position.x *= s; holder.position.z *= s;
  }
  holder.position.y = 3;

  const moving = Math.abs(mF) + Math.abs(mS) > 0.01;
  if (moving) bob += dt * 7; else bob *= .9;
  camera.position.set(Math.sin(bob * 4) * .12, 2 + Math.sin(bob * 2) * .2, 0);

  const cam = holder.position;
  for (const t of trees) {
    const p = t.g.position;
    const d = Math.hypot(p.x - cam.x, p.z - cam.z), k = Math.min(d / 260, 1);
    const gCol = .3 + .7 * (1 - k), bCol = .2 + .5 * k;
    const tc = new THREE.Color(0, gCol * 0.5, 0), cc = new THREE.Color(0, gCol, bCol);
    t.tm.forEach(m => m.color.copy(tc));
    t.cm.forEach(m => m.color.copy(cc));
  }

  updFruits(dt);
  updSaplings(dt);
  updAnimals(dt);
  updPop(dt);

  dayTimer += dt;
  if (dayTimer > DAY_SEC) { dayTimer -= DAY_SEC; endOfDay(); }
  recHist(dt);

  const frac = dayTimer / DAY_SEC;
  clkHand.style.transform = "translate(-50%,-100%) rotate(" + (frac * 360) + "deg)";
  dayText.textContent = "已過 " + dayCount + " 天";

  renderer.render(scene, camera);
  drawMini(cam, fwd.x, fwd.z);
  updStats();
  drawCharts();
}
loop();

})();</script>
