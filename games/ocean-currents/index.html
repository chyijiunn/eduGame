<!DOCTYPE html>
<html lang="zh-Hant">
<head><script src="/eduGame/ga4.js"></script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>全球洋流互動地圖（夜視無地名｜2D MapLibre＋可切換 3D Cesium）</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- CesiumJS（選用；若提供 Token 可切 3D） -->
  <link href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>
  <style>
    :root{ --bg:#040911; --panel:#0b1224dd; --ink:#e5e7eb; --muted:#9ca3af; --accent:#00f5c8; }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui, -apple-system, Segoe UI, Arial, 'Noto Sans TC', sans-serif;}
    .app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 340px}
    #map{position:relative}
    #map,#cesiumContainer{height:100%;width:100%}
    #overlay{position:absolute;inset:0;pointer-events:none;z-index:9999}
    aside{background:var(--panel);border-left:1px solid #1f2937;padding:10px;display:flex;flex-direction:column;gap:8px}
    h1{font-size:18px;margin:2px 0 6px}
    .row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
    .row label{color:var(--muted);font-size:12px}
    input[type=range]{width:100%}
    .btn{cursor:pointer;border:1px solid #334155;background:#0b1224;color:#e5e7eb;padding:8px 10px;border-radius:10px}
    .btn:hover{background:#111a30}
    .tag{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid #334155;background:#0b1224aa;display:inline-block}
    .note{font-size:12px;color:#a1a1aa;line-height:1.6}
    .toolbar{display:flex;gap:6px;flex-wrap:wrap}
    .mode{display:flex;gap:6px;align-items:center}
    .small{font-size:12px;color:#9ca3af}
  </style>
</head>
<body>
<div class="app">
  <div id="map">
    <div id="cesiumContainer" style="display:none"></div>
    <canvas id="overlay"></canvas>
  </div>
  <aside>
    <div><span class="tag">v1.0</span> 全球洋流互動地圖｜2D(免金鑰)／3D(需 Cesium Token)</div>
    <div class="mode">
      <button id="mode2d" class="btn">2D MapLibre</button>
      <button id="mode3d" class="btn">3D Cesium</button>
    </div>
    <div class="row"><label>月份</label><input id="month" type="range" min="1" max="12" step="1" value="7"/><span id="mval">7</span></div>
    <div class="row"><label>粒子數</label><input id="count" type="range" min="2000" max="50000" step="1000" value="10000"/><span id="cval">10000</span></div>
    <div class="row"><label>速度倍數</label><input id="speed" type="range" min="0.5" max="6" step="0.1" value="2.0"/><span id="sval">2.0×</span></div>
    <div class="row"><label>殘影強度</label><input id="fade" type="range" min="0" max="0.35" step="0.01" value="0.10"/><span id="fval">0.10</span></div>
    <div class="toolbar">
      <button id="place" class="btn">放鴨模式：關</button>
      <button id="dropTW" class="btn">在台灣東側放一隻</button>
      <button id="go" class="btn">全部漂流</button>
      <button id="stop" class="btn">全部停止</button>
      <button id="clear" class="btn">清除鴨軌跡</button>
      <button id="remove" class="btn">移除所有鴨</button>
    </div>
    <div class="note">
      2D 模式使用 <strong>MapLibre + OSM</strong>（免金鑰）；3D 模式需在 <code>main.js</code> 設定 <strong>CESIUM_ION_TOKEN</strong>。<br/>
      若已用 <code>process_currents.py</code> 轉好資料，請將 12 個 JSON 放進 <code>data/</code> 覆蓋示例檔。
    </div>
  </aside>
</div>
<script src="main.js"></script>
</body>
</html>
