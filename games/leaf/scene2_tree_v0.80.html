<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Scene 2｜樹形生成（v0.80）</title>
<style>
  :root{ --bg:#0f172a; --panel:#0b1220; --ink:#e2e8f0; --muted:#94a3b8; --brand:#22c55e; --accent:#34d399 }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans TC",Segoe UI,Roboto}
  .wrap{display:grid;grid-template-columns:1fr 420px;height:100%}
  #stage{position:relative;background:#0b1020;height:100%;min-height:360px}
  canvas{display:block;width:100%;height:100%}
  .panel{height:100%;overflow:auto;background:linear-gradient(180deg,var(--panel),#0a0f1b 55%);border-left:1px solid #1f2937;padding:14px 16px 120px}
  h1{font-size:18px;margin:0 0 10px}
  .sec{border:1px solid #1f2937;border-radius:12px;padding:10px 10px;margin:10px 0}
  .sec h2{font-size:14px;margin:0 0 6px;color:#cfe4d6}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:6px 0}
  .lbl{font-size:12px;color:var(--muted)}
  .val{font-size:12px}
  input[type=range]{width:100%}
  select,button{padding:8px 10px;border-radius:10px;background:#0e1729;border:1px solid #263142;color:#e2e8f0}
  button{cursor:pointer}
  button.primary{background:linear-gradient(180deg,#0e2d1b,#0b1f14);border-color:#21543a}
  .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .hint{font-size:12px;color:#93a1b5;margin-top:8px;line-height:1.4}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .card{border:1px solid #1f2937;border-radius:12px;padding:10px;text-align:center}
  .card b{display:block;font-size:16px}
  .card span{display:block;color:#94a3b8;font-size:11px}
  #diag{position:fixed;right:10px;top:10px;background:#0a1120e6;border:1px solid #1e293b;border-radius:10px;padding:8px 10px;color:#cbd5e1;font-size:12px;max-width:54ch;z-index:9999;display:none}
  #diag.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"></div>
  <aside class="panel">
    <h1>場景二：樹形生成（v0.80）</h1>

    <div class="kpi">
      <div class="card"><b id="kpiBranches">—</b><span>枝段數</span></div>
      <div class="card"><b id="kpiLeaves">—</b><span>葉片數</span></div>
      <div class="card"><b id="kpiFPS">—</b><span>FPS</span></div>
    </div>

    <section class="sec" id="secCrown">
      <h2>① 樹冠外觀（Crown Form）</h2>
      <div class="row"><label class="lbl">外觀</label>
        <select id="form">
          <option value="rounded">圓傘</option>
          <option value="oval" selected>橢圓/卵形</option>
          <option value="columnar">柱形</option>
          <option value="vase">花瓶/漏斗</option>
          <option value="conical">圓錐/尖塔</option>
          <option value="flatTop">扁頂</option>
          <option value="weeping">垂枝</option>
          <option value="spreading">擴張不規則</option>
        </select>
      </div>
      <div class="row"><label class="lbl">冠幅 (m)</label><span class="val" id="valCrownR"></span></div>
      <input id="crownR" type="range" min="1" max="8" step="0.1" value="3.0"/>
      <div class="row"><label class="lbl">冠高 (m)</label><span class="val" id="valCrownH"></span></div>
      <input id="crownH" type="range" min="1" max="12" step="0.1" value="4.5"/>
      <div class="row"><label class="lbl">下垂程度</label><span class="val" id="valWeep"></span></div>
      <input id="weeping" type="range" min="0" max="1" step="0.01" value="0.2"/>
      <div class="row"><label class="lbl">頂部扁平</label><span class="val" id="valFlat"></span></div>
      <input id="flatness" type="range" min="0" max="1" step="0.01" value="0.2"/>
    </section>

    <section class="sec" id="secBranch">
      <h2>② 分枝建築（Branch Architecture）</h2>
      <div class="row"><label class="lbl">模式</label>
        <select id="branchMode">
          <option value="monopodial" selected>主軸型</option>
          <option value="sympodial">假二歧/傘形</option>
          <option value="whorled">輪生層級</option>
          <option value="tiered">水平層板</option>
          <option value="pendulous">垂枝</option>
          <option value="shrubby">叢生灌木</option>
        </select>
      </div>
      <div class="row"><label class="lbl">分枝層數（1–100）</label><span class="val" id="valMaxOrder"></span></div>
      <input id="maxOrder" type="range" min="1" max="100" step="1" value="12"/>
      <div class="row"><label class="lbl">平均分枝角 (°)</label><span class="val" id="valAngle"></span></div>
      <input id="branchAngle" type="range" min="10" max="75" step="1" value="35"/>
      <div class="row"><label class="lbl">角度變異</label><span class="val" id="valAngVar"></span></div>
      <input id="branchAngleVar" type="range" min="0" max="30" step="1" value="8"/>
      <div class="row"><label class="lbl">節間長 (m)</label><span class="val" id="valInternode"></span></div>
      <input id="internode" type="range" min="0.05" max="0.60" step="0.01" value="0.22"/>
      <div class="row"><label class="lbl">頂芽優勢</label><span class="val" id="valApical"></span></div>
      <input id="apical" type="range" min="0" max="1" step="0.01" value="0.6"/>
      <div class="row"><label class="lbl">向地/向光</label><span class="val" id="valGV"></span></div>
      <input id="graviPhoto" type="range" min="0" max="1" step="0.01" value="0.4"/>
    </section>

    <section class="sec" id="secPhy">
      <h2>③ 葉序（Phyllotaxis）</h2>
      <div class="row"><label class="lbl">葉序</label>
        <select id="phyllo">
          <option value="alternate" selected>互生螺旋</option>
          <option value="opposite">對生</option>
          <option value="decussate">十字對生</</option>
          <option value="whorled">輪生</option>
          <option value="distichous">二列互生</option>
          <option value="pseudoWhorl">假輪生</option>
        </select>
      </div>
      <div class="row"><label class="lbl">互生角度 (°)</label><span class="val" id="valDiv"></span></div>
      <input id="divergence" type="range" min="80" max="180" step="0.1" value="137.5"/>
      <div class="row"><label class="lbl">節點密度 (/m)</label><span class="val" id="valNodes"></span></div>
      <input id="nodesPerM" type="range" min="5" max="60" step="1" value="24"/>
      <div class="row"><label class="lbl">對/輪生每節葉數</label><span class="val" id="valPairs"></span></div>
      <input id="leafPairs" type="range" min="2" max="6" step="1" value="2"/>
    </section>

    <section class="sec" id="secCluster">
      <h2>④ 葉叢/團簇（Clusters）</h2>
      <div class="row"><label class="lbl">模式</label>
        <select id="clusterMode">
          <option value="none" selected>無</option>
          <option value="fascicles">束生/針葉簇</option>
          <option value="spur">短枝簇</option>
          <option value="terminal">枝端簇</option>
          <option value="pseudoWhorl">假輪生簇</option>
          <option value="banded">帶狀增密</option>
        </select>
      </div>
      <div class="row"><label class="lbl">簇大小</label><span class="val" id="valCluSize"></span></div>
      <input id="clusterSize" type="range" min="1" max="8" step="1" value="3"/>
      <div class="row"><label class="lbl">簇緊密</label><span class="val" id="valCluTight"></span></div>
      <input id="clusterTight" type="range" min="0" max="1" step="0.01" value="0.6"/>
      <div class="row"><label class="lbl">端部簇機率</label><span class="val" id="valTermP"></span></div>
      <input id="terminalP" type="range" min="0" max="1" step="0.01" value="0.2"/>
      <div class="row"><label class="lbl">帶狀起訖 (0–1)</label><span class="val" id="valBand"></span></div>
      <input id="bandStart" type="range" min="0" max="0.9" step="0.01" value="0.6"/>
      <input id="bandEnd" type="range" min="0.1" max="1" step="0.01" value="0.95"/>
      <div class="row"><label class="lbl">帶狀密度倍數</label><span class="val" id="valBandMul"></span></div>
      <input id="bandMul" type="range" min="1" max="10" step="0.1" value="3"/>
    </section>

    <section class="sec" id="secLOD">
      <h2>⑤ 葉量與 LOD（上限 30,000）</h2>
      <div class="row"><label class="lbl">目標葉片數</label><span class="val" id="valLeafCount"></span></div>
      <input id="leafCount" type="range" min="500" max="30000" step="100" value="10000"/>
      <div class="row"><label class="lbl">合卡比例（遠處卡片化）</label><span class="val" id="valCard"></span></div>
      <input id="leafCardRatio" type="range" min="0" max="1" step="0.01" value="0.85"/>
      <div class="row"><label class="lbl">參與落葉模擬比例</label><span class="val" id="valSimPct"></span></div>
      <input id="simulatePct" type="range" min="0.05" max="0.5" step="0.01" value="0.1"/>
      <div class="row"><label class="lbl">Instancing</label>
        <select id="instancing">
          <option value="on" selected>開</option>
          <option value="off">關</option>
        </select>
      </div>
      <div class="hint">提示：場景二以 instanced quads 表示遠處葉片，近景少量真葉；場景三將把抽樣葉片轉為物理。</div>
    </section>

    <div class="btns">
      <button id="btnGenerate" class="primary">生成樹形</button>
      <button id="btnReset">重設參數</button>
    </div>

    <div class="io">
      <button id="btnExport">匯出 CSV</button>
      <label style="display:flex;align-items:center;gap:8px;border:1px solid #263142;border-radius:12px;padding:8px 10px;background:#0e1729">
        <span>匯入 CSV</span>
        <input id="fileImport" type="file" accept=".csv,text/csv"/>
      </label>
    </div>

    <div class="hint">匯出檔名：<b>treeStructure.csv</b>（包含以上五大區塊所有參數）。</div>
  </aside>
</div>

<div id="diag"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js?module';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js?module';

const diagEl = document.getElementById('diag');
function diag(msg, ok=false){ diagEl.classList.add('show'); diagEl.innerHTML = (ok?'<b style="color:#22c55e">OK</b> ':'<b style="color:#f97316">LOG</b> ') + String(msg); console.log('[DIAG]', msg); }
window.addEventListener('error', e=>{ diag('錯誤：'+e.message); });
window.addEventListener('unhandledrejection', e=>{ diag('Promise 拋錯：'+e.reason); });

// THREE
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x0b1020, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 5000);
camera.position.set(6, 6, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.enablePan = true;
controls.target.set(0,2,0);

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const dir1 = new THREE.DirectionalLight(0xffffff, 1.0); dir1.position.set(6,10,6); scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.6); dir2.position.set(-10,6,-6); scene.add(dir2);
const hemi = new THREE.HemisphereLight(0x93c5fd, 0x0b1020, 0.35); scene.add(hemi);
const grid = new THREE.GridHelper(200, 100, 0x334155, 0x1f2a44); grid.position.y = 0; scene.add(grid);

let trunkGroup = null, leafInst = null, leafGeo = null, leafMat = null;

function makeLeafCardGeometry(){
  const g = new THREE.PlaneGeometry(0.14, 0.28, 1, 1);
  g.translate(0, 0.14, 0);
  return g;
}
function makeLeafMaterial(){
  const m = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.9, metalness: 0.02, side: THREE.DoubleSide, vertexColors: true
  });
  const col = new Float32Array(4*3);
  const cTop = new THREE.Color().setHSL(0.33,0.65,0.52);
  const cBot = new THREE.Color().setHSL(0.30,0.70,0.42);
  for(let i=0;i<4;i++){
    const c = i<2? cBot : cTop;
    col[i*3+0]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  leafGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
  return m;
}
function v(id){ return document.getElementById(id).value; }
function vn(id){ return parseFloat(document.getElementById(id).value); }
function vi(id){ return parseInt(document.getElementById(id).value); }

function collectParams(){
  return {
    form: v('form'),
    crownR: vn('crownR'),
    crownH: vn('crownH'),
    weeping: vn('weeping'),
    flatness: vn('flatness'),
    branchMode: v('branchMode'),
    maxOrder: vi('maxOrder'),
    branchAngle: vn('branchAngle'),
    branchAngleVar: vn('branchAngleVar'),
    internode: vn('internode'),
    apical: vn('apical'),
    graviPhoto: vn('graviPhoto'),
    phyllo: v('phyllo'),
    divergence: vn('divergence'),
    nodesPerM: vi('nodesPerM'),
    leafPairs: vi('leafPairs'),
    clusterMode: v('clusterMode'),
    clusterSize: vi('clusterSize'),
    clusterTight: vn('clusterTight'),
    terminalP: vn('terminalP'),
    bandStart: vn('bandStart'),
    bandEnd: vn('bandEnd'),
    bandMul: vn('bandMul'),
    leafCount: vi('leafCount'),
    leafCardRatio: vn('leafCardRatio'),
    simulatePct: vn('simulatePct'),
    instancing: v('instancing')
  };
}
function syncLabels(p){
  document.getElementById('valCrownR').textContent = p.crownR.toFixed(1);
  document.getElementById('valCrownH').textContent = p.crownH.toFixed(1);
  document.getElementById('valWeep').textContent = p.weeping.toFixed(2);
  document.getElementById('valFlat').textContent = p.flatness.toFixed(2);
  document.getElementById('valMaxOrder').textContent = p.maxOrder;
  document.getElementById('valAngle').textContent = p.branchAngle.toFixed(0);
  document.getElementById('valAngVar').textContent = p.branchAngleVar.toFixed(0);
  document.getElementById('valInternode').textContent = p.internode.toFixed(2);
  document.getElementById('valApical').textContent = p.apical.toFixed(2);
  document.getElementById('valGV').textContent = p.graviPhoto.toFixed(2);
  document.getElementById('valDiv').textContent = p.divergence.toFixed(1);
  document.getElementById('valNodes').textContent = p.nodesPerM;
  document.getElementById('valPairs').textContent = p.leafPairs;
  document.getElementById('valCluSize').textContent = p.clusterSize;
  document.getElementById('valCluTight').textContent = p.clusterTight.toFixed(2);
  document.getElementById('valTermP').textContent = p.terminalP.toFixed(2);
  document.getElementById('valBand').textContent = p.bandStart.toFixed(2)+'–'+p.bandEnd.toFixed(2);
  document.getElementById('valBandMul').textContent = p.bandMul.toFixed(1);
  document.getElementById('valLeafCount').textContent = p.leafCount;
  document.getElementById('valCard').textContent = p.leafCardRatio.toFixed(2);
  document.getElementById('valSimPct').textContent = p.simulatePct.toFixed(2);
}
function rnd(a,b){ return a + Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }
function clamp(x,a,b){ return Math.max(a, Math.min(b,x)); }

let trunkGroup = null, leafInst = null;
let leafGeo = null, leafMat = null;

function buildTree(){
  const p = collectParams();
  syncLabels(p);

  if(trunkGroup){ scene.remove(trunkGroup); trunkGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material && !o.material.isShaderMaterial) o.material.dispose(); }); trunkGroup=null; }
  if(leafInst){ scene.remove(leafInst); if(leafInst.geometry) leafInst.geometry.dispose(); if(leafInst.material) leafInst.material.dispose(); leafInst=null; }
  leafGeo = makeLeafCardGeometry();
  leafMat = makeLeafMaterial();

  trunkGroup = new THREE.Group(); scene.add(trunkGroup);

  const trunkMat = new THREE.MeshStandardMaterial({color:0x8b7355, roughness:0.95});
  const segs = [];
  const maxOrder = p.maxOrder;
  const angleMean = THREE.MathUtils.degToRad(p.branchAngle);
  const angleVar = THREE.MathUtils.degToRad(p.branchAngleVar);
  const nodeStep = p.internode;

  const trunkHeight = p.crownH;
  const trunkSegs = Math.ceil(trunkHeight / nodeStep);
  const trunkGeom = new THREE.CylinderGeometry(0.18, 0.28, trunkHeight, 10);
  trunkGeom.translate(0, trunkHeight/2, 0);
  const trunkMesh = new THREE.Mesh(trunkGeom, trunkMat);
  trunkGroup.add(trunkMesh);

  const branchPts = [];
  for(let i=1;i<=trunkSegs;i++){
    const y = i * nodeStep;
    if(y>trunkHeight) break;
    branchPts.push(new THREE.Vector3(0,y,0));
  }

  let branchCount = 0;
  const q = new THREE.Quaternion();
  const tmpV = new THREE.Vector3();

  function spawnBranch(origin, order, yawBase){
    if(order>maxOrder || branchCount>6000) return;
    const segN = rndi(2, clamp(Math.floor((p.crownR + p.crownH)*1.5),2,12));
    let cur = origin.clone();
    let yaw = yawBase;
    for(let s=0;s<segN;s++){
      const len = rnd(nodeStep*0.7, nodeStep*1.3);
      const ang = angleMean + rnd(-angleVar, angleVar);
      yaw += THREE.MathUtils.degToRad(rnd(40, 160));
      const up = new THREE.Vector3(0,1,0);
      const right = new THREE.Vector3(Math.cos(yaw), 0, Math.sin(yaw));
      tmpV.copy(up).multiplyScalar(Math.cos(ang)).addScaledVector(right, Math.sin(ang));
      const relH = clamp(cur.y / p.crownH, 0, 1);
      const flatCap = (v('form')==='flatTop') ? (relH>0.8 ? -0.4 : 0) : 0;
      tmpV.y += -p.weeping*0.6 + flatCap;
      const nxt = cur.clone().addScaledVector(tmpV.normalize(), len);
      const radAtY = p.crownR * (v('form')==='conical' ? (1 - relH) : v('form')==='vase' ? (0.6+0.8*relH) : 1.0);
      const rxy = Math.hypot(nxt.x, nxt.z);
      if(rxy>radAtY){ const k = radAtY / (rxy+1e-6); nxt.x*=k; nxt.z*=k; }
      if(nxt.y<0) nxt.y=0; if(nxt.y>p.crownH) nxt.y=p.crownH;
      const segLen = nxt.distanceTo(cur);
      if(segLen<1e-3) continue;
      const cyl = new THREE.CylinderGeometry(Math.max(0.02, 0.14*Math.pow(0.82,order)), Math.max(0.03, 0.2*Math.pow(0.8,order)), segLen, 6);
      const m = new THREE.Matrix4();
      const axis = new THREE.Vector3(0,1,0);
      const segDir = new THREE.Vector3().subVectors(nxt, cur).normalize();
      q.setFromUnitVectors(axis, segDir);
      m.makeRotationFromQuaternion(q);
      m.setPosition(new THREE.Vector3().addVectors(cur, nxt).multiplyScalar(0.5));
      cyl.applyMatrix4(m);
      const segMesh = new THREE.Mesh(cyl, trunkMat);
      trunkGroup.add(segMesh);
      segs.push({pos:nxt.clone(), dir:segDir.clone(), order});
      cur.copy(nxt);
      branchCount++;
      if(branchCount>6000) break;
    }
    if(order<maxOrder){
      const childN = rndi(1, (v('branchMode')==='whorled'||v('branchMode')==='tiered')?3:2);
      for(let c=0;c<childN;c++){
        spawnBranch(cur, order+1, THREE.MathUtils.degToRad(rnd(0,360)));
      }
    }
  }

  branchPts.forEach((pt,i)=>{
    const chance = 0.6 * (1 - Math.pow(1 - i/branchPts.length, 1.2));
    if(Math.random()<chance){
      spawnBranch(pt, 1, THREE.MathUtils.degToRad(rnd(0,360)));
    }
  });

  const totalLeaves = clamp(vi('leafCount'), 0, 30000);
  const instanced = (v('instancing')==='on');
  const leafCount = totalLeaves;
  const spacing = Math.max(1, Math.floor(segs.length / Math.max(leafCount,1)));
  const mat = leafMat;
  const geo = leafGeo;
  if(instanced){
    const mesh = new THREE.InstancedMesh(geo, mat, leafCount);
    const m4 = new THREE.Matrix4(); const q4 = new THREE.Quaternion(); const s3 = new THREE.Vector3();
    for(let i=0;i<leafCount;i++){
      const j = (i*spacing) % segs.length;
      const {pos,dir,order} = segs[j];
      const scale = 0.7*Math.pow(0.92, order) * (0.8 + 0.4*Math.random());
      const yaw = rnd(0, Math.PI*2);
      const pitch = rnd(-0.8, 0.2);
      q4.setFromEuler(new THREE.Euler(pitch, yaw, 0));
      s3.set(scale, scale, scale);
      m4.compose(new THREE.Vector3(
        pos.x + rnd(-0.12,0.12), pos.y + rnd(-0.12,0.12), pos.z + rnd(-0.12,0.12)
      ), q4, s3);
      mesh.setMatrixAt(i, m4);
    }
    mesh.instanceMatrix.needsUpdate = true;
    leafInst = mesh;
    trunkGroup.add(leafInst);
  }else{
    const group = new THREE.Group();
    for(let i=0;i<leafCount;i++){
      const j = (i*spacing) % segs.length;
      const {pos,dir,order} = segs[j];
      const scale = 0.7*Math.pow(0.92, order) * (0.8 + 0.4*Math.random());
      const yaw = rnd(0, Math.PI*2);
      const pitch = rnd(-0.8, 0.2);
      const mleaf = new THREE.Mesh(geo, mat);
      mleaf.position.set(pos.x + rnd(-0.12,0.12), pos.y + rnd(-0.12,0.12), pos.z + rnd(-0.12,0.12));
      mleaf.rotation.set(pitch, yaw, 0);
      mleaf.scale.setScalar(scale);
      group.add(mleaf);
    }
    leafInst = group;
    trunkGroup.add(leafInst);
  }

  document.getElementById('kpiBranches').textContent = branchCount;
  document.getElementById('kpiLeaves').textContent = leafCount;

  fitCameraTo(trunkGroup, 1.4);
  diag('樹形生成完成：枝 '+branchCount+'，葉 '+leafCount, true);
}

function fitCameraTo(obj, pad=1.6){
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); const center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  const radius = Math.max(size.x, size.y, size.z)*0.5 || 1;
  const fov = camera.fov * Math.PI/180;
  const dist = (radius/Math.tan(fov/2)) * pad;
  const dir = new THREE.Vector3(1,0.6,1).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = Math.max(0.01, dist/1000);
  camera.far = dist*10 + 200;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function resize(){
  const w = stage.clientWidth || stage.getBoundingClientRect().width || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let last = performance.now(), frames=0;
function loop(){
  frames++; const now = performance.now();
  if(now-last>1000){
    document.getElementById('kpiFPS').textContent = frames.toString();
    frames=0; last=now;
  }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
}

const csvKeys = ["form","crownR","crownH","weeping","flatness","branchMode","maxOrder","branchAngle","branchAngleVar","internode","apical","graviPhoto","phyllo","divergence","nodesPerM","leafPairs","clusterMode","clusterSize","clusterTight","terminalP","bandStart","bandEnd","bandMul","leafCount","leafCardRatio","simulatePct","instancing"];
function exportCSV(){
  const p = collectParams();
  const header = csvKeys.join(',');
  const values = csvKeys.map(k=> p[k]);
  const rows = header + "
" + values.join(',');
  const blob = new Blob([rows], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'treeStructure.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  diag('已匯出 treeStructure.csv', true);
}
function importCSV(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const txt = String(reader.result).trim();
      const lines = txt.split(/?
/);
      if(lines.length<2) throw new Error('CSV 無資料列');
      const header = lines[0].split(',').map(s=>s.trim());
      const vals = lines[1].split(',').map(s=>s.trim());
      const map = {}; header.forEach((k,i)=> map[k]=vals[i]);
      csvKeys.forEach(k=>{
        const el = document.getElementById(k);
        if(el){
          if(el.tagName==='SELECT'){ el.value = map[k]; }
          else if(el.type==='range'){ el.value = map[k]; }
        }
      });
      diag('CSV 匯入完成，請按「生成樹形」以套用。', true);
    }catch(err){ diag('CSV 匯入錯誤：'+err.message); }
  };
  reader.readAsText(file);
}

document.getElementById('btnGenerate').addEventListener('click', buildTree);
document.getElementById('btnReset').addEventListener('click', ()=>{
  ["form","branchMode","phyllo","clusterMode","instancing"].forEach(id=>{
    const el=document.getElementById(id); el.value = el.querySelector('option[selected]')?el.querySelector('option[selected]').value:el.options[0].value;
  });
  ["crownR","crownH","weeping","flatness","maxOrder","branchAngle","branchAngleVar","internode","apical","graviPhoto","divergence","nodesPerM","leafPairs","clusterSize","clusterTight","terminalP","bandStart","bandEnd","bandMul","leafCount","leafCardRatio","simulatePct"].forEach(id=>{
    const el=document.getElementById(id); el.value = el.getAttribute('value');
  });
  syncLabels(collectParams());
  diag('參數已重設。');
});
document.getElementById('btnExport').addEventListener('click', exportCSV);
document.getElementById('fileImport').addEventListener('change', e=>{
  const f = e.target.files?.[0]; if(f) importCSV(f);
});

function init(){
  resize();
  loop();
  const p = collectParams(); syncLabels(p);
  buildTree();
  diag('場景二 v0.80 已啟動，預設生成一棵樹（葉上限 30,000）。', true);
}
init();
</script>
