<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Leaf / Tree / Fall Designer 3D｜v0.752-merge (online)</title>
<style>
  :root{ --bg:#0f172a; --panel:#0b1220; --ink:#e2e8f0; --muted:#94a3b8; --brand:#22c55e; --accent:#34d399; --danger:#ef4444 }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans TC",Segoe UI,Roboto}
  .wrap{display:grid;grid-template-columns:1fr 400px;height:100%}
  #stage{position:relative;background:#0b1020;height:100%;min-height:360px}
  canvas{display:block;width:100%;height:100%}
  .panel{height:100%;overflow:auto;background:linear-gradient(180deg,var(--panel),#0a0f1b 55%);border-left:1px solid #1f2937;padding:14px 14px 160px}
  .h{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
  .h .dot{width:10px;height:10px;border-radius:999px;background:var(--brand);box-shadow:0 0 16px var(--brand)}
  h1{font-size:18px;margin:0 0 2px}
  p.sub{margin:0;color:var(--muted);font-size:12px}
  .g{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:10px 0}
  .row{margin:8px 0}
  .lbl{font-size:12px;color:var(--muted);letter-spacing:.2px}
  .val{font-variant-numeric:tabular-nums}
  input[type=range]{width:100%}
  select{width:100%;padding:8px;border-radius:10px;background:#0e1729;border:1px solid #243246;color:var(--ink)}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  button{padding:10px 12px;border:1px solid #263142;background:#0e1729;color:#e2e8f0;border-radius:12px;cursor:pointer}
  button:hover{border-color:#334155}
  button.primary{background:linear-gradient(180deg,#0e2d1b,#0b1f14);border-color:#1d3b29}
  button.primary:hover{border-color:#27533a}
  .small{font-size:12px;color:#94a3b8;margin-top:8px;line-height:1.5}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .card{border:1px solid #1f2937;border-radius:12px;padding:10px;text-align:center}
  .card b{display:block;font-size:16px}
  .card span{display:block;color:#94a3b8;font-size:11px}
  .sep{height:1px;background:#1e293b;margin:12px 0}
  #diag{position:fixed;right:10px;top:10px;background:#0a1120e6;border:1px solid #1e293b;border-radius:10px;padding:8px 10px;color:#cbd5e1;font-size:12px;max-width:56ch;z-index:9999;display:none}
  #diag.show{display:block}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  input[type="file"]{width:100%}
  .debugRow{display:flex;gap:10px;align-items:center;margin-top:8px}
  .warn{color:#fbbf24}
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"></div>
  <aside class="panel">
    <div class="h"><span class="dot"></span><div><h1>Leaf / Tree / Fall Designer 3D</h1><p class="sub">v0.752-merge｜以 0.752 場景一為基底，加入場景二/三（五樹型、先轉色再落葉）</p></div></div>

    <div class="btns" style="grid-template-columns:repeat(3,1fr);margin:8px 0 10px">
      <button id="btnScene1" class="primary">場景一：葉片</button>
      <button id="btnScene2">場景二：樹</button>
      <button id="btnScene3">場景三：落葉</button>
    </div>

    <!-- Scene 1 (from v0.752) -->
    <div id="sceneLeaf">
      <div class="kpi">
        <div class="card"><b id="kpiVerts">—</b><span>頂點</span></div>
        <div class="card"><b id="kpiFaces">—</b><span>面數</span></div>
        <div class="card"><b id="kpiArea">—</b><span>估算面積 (cm²)</span></div>
      </div>

      <div class="sep"></div>
      <div class="row"><label class="lbl">葉形（Leaf Shape）</label>
        <select id="leafShape">
          <option value="elliptic" selected>橢圓 Elliptic</option>
          <option value="ovate">卵形 Ovate</option>
          <option value="obovate">倒卵形 Obovate</option>
          <option value="lanceolate">披針 Lanceolate</option>
          <option value="oblanceolate">倒披針 Oblanceolate</option>
          <option value="linear">線形 Linear</option>
          <option value="orbicular">圓形 Orbicular</option>
          <option value="reniform">腎形 Reniform</option>
          <option value="cordate">心形 Cordate</option>
          <option value="sagittate">箭形 Sagittate</option>
          <option value="spatulate">匙形 Spatulate</option>
          <option value="palmate_lobed">掌狀深裂 Palmate-lobed</option>
          <option value="pinnate_lobed">羽狀深裂 Pinnate-lobed</option>
        </select>
      </div>

      <div class="row"><label class="lbl">邊緣（Margin）</label>
        <select id="leafMargin">
          <option value="entire" selected>全緣 Entire</option>
          <option value="serrate">鋸齒 Serrate</option>
          <option value="crenate">圓齒 Crenate</option>
          <option value="dentate">具齒 Dentate</option>
          <option value="double_serr">重鋸齒 Doubly serrate</option>
          <option value="undulate">波狀 Undulate</option>
        </select>
      </div>

      <div class="row"><label class="lbl">葉脈（Venation）</label>
        <select id="leafVein">
          <option value="pinnate" selected>羽狀 Pinnate</option>
          <option value="palmate3">掌狀（3）</option>
          <option value="palmate5">掌狀（5）</option>
          <option value="palmate7">掌狀（7）</option>
          <option value="parallel">平行 Parallel</option>
          <option value="arcuate">弧狀 Arcuate</option>
        </select>
      </div>

      <div class="sep"></div>
      <div class="row g"><label class="lbl">長度 (cm)</label><span class="val" id="valLen"></span></div>
      <input id="len" type="range" min="4" max="40" step="0.1" value="12" />
      <div class="row g"><label class="lbl">寬度比例</label><span class="val" id="valWidth"></span></div>
      <input id="width" type="range" min="0.15" max="0.7" step="0.01" value="0.40" />
      <div class="row g"><label class="lbl">尖端銳利度</label><span class="val" id="valTip"></span></div>
      <input id="tip" type="range" min="0.2" max="2.5" step="0.01" value="1.0" />
      <div class="row g"><label class="lbl">基部圓潤度</label><span class="val" id="valBase"></span></div>
      <input id="base" type="range" min="0.2" max="2.5" step="0.01" value="1.0" />
      <div class="row g"><label class="lbl">基部凹陷（心形）</label><span class="val" id="valNotch"></span></div>
      <input id="baseNotch" type="range" min="0" max="0.4" step="0.01" value="0.00" />
      <div class="row g"><label class="lbl">葉尖收斂（apexConverge）</label><span class="val" id="valApex"></span></div>
      <input id="apexConverge" type="range" min="0" max="1" step="0.01" value="0.20" />

      <div class="row g"><label class="lbl">鋸齒幅度</label><span class="val" id="valSerrA"></span></div>
      <input id="serrA" type="range" min="0" max="0.25" step="0.005" value="0.00" />
      <div class="row g"><label class="lbl">鋸齒密度</label><span class="val" id="valSerrF"></span></div>
      <input id="serrF" type="range" min="0" max="30" step="1" value="0" />
      <div class="row g"><label class="lbl">鋸齒尖銳度</label><span class="val" id="valToothSharp"></span></div>
      <input id="toothSharp" type="range" min="0" max="1" step="0.01" value="0.0" />
      <div class="row g"><label class="lbl">重鋸齒強度</label><span class="val" id="valDoubleSerr"></span></div>
      <input id="doubleSerr" type="range" min="0" max="1" step="0.01" value="0.0" />

      <div class="row g"><label class="lbl">裂片數</label><span class="val" id="valLobeCount"></span></div>
      <input id="lobeCount" type="range" min="0" max="9" step="1" value="0" />
      <div class="row g"><label class="lbl">裂片深度</label><span class="val" id="valLobeDepth"></span></div>
      <input id="lobeDepth" type="range" min="0" max="1" step="0.01" value="0.00" />
      <div class="row g"><label class="lbl">裂片圓鈍度</label><span class="val" id="valLobeRound"></span></div>
      <input id="lobeRound" type="range" min="0" max="1" step="0.01" value="0.60" />

      <div class="row g"><label class="lbl">主脈厚度（視覺）</label><span class="val" id="valRib"></span></div>
      <input id="rib" type="range" min="0" max="0.6" step="0.01" value="0.12" />

      <div class="row g"><label class="lbl">捲曲度（橫向）</label><span class="val" id="valCurl"></span></div>
      <input id="curl" type="range" min="0" max="1.2" step="0.01" value="0" />
      <div class="row g"><label class="lbl">扭轉度（縱向）</label><span class="val" id="valTwist"></span></div>
      <input id="twist" type="range" min="0" max="1.5" step="0.01" value="0" />
      <div class="row g"><label class="lbl">上拱彎曲</label><span class="val" id="valBend"></span></div>
      <input id="bend" type="range" min="-0.8" max="1.2" step="0.01" value="0.2" />
      <div class="row g"><label class="lbl">波浪幅度</label><span class="val" id="valWaveAmp"></span></div>
      <input id="waveAmp" type="range" min="0" max="0.3" step="0.01" value="0" />
      <div class="row g"><label class="lbl">波浪頻率</label><span class="val" id="valWaveFreq"></span></div>
      <input id="waveFreq" type="range" min="0" max="20" step="1" value="0" />
      <div class="row g"><label class="lbl">非對稱度</label><span class="val" id="valAsym"></span></div>
      <input id="asym" type="range" min="0" max="1" step="0.01" value="0" />

      <div class="row"><label class="lbl"><input id="double" type="checkbox" checked> 雙面曲面</label></div>
      <div class="row"><label class="lbl"><input id="stem" type="checkbox" checked> 顯示葉柄</label></div>

      <div class="btns" style="grid-template-columns:repeat(2,1fr)">
        <button id="reset">重設</button>
        <button id="randomize">隨機</button>
      </div>

      <div class="sep"></div>
      <div class="io">
        <button id="exportCSV">匯出 CSV</button>
        <label class="lbl" style="display:flex;align-items:center;gap:8px;border:1px solid #263142;border-radius:12px;padding:8px 10px;background:#0e1729">
          <span>匯入 CSV</span>
          <input id="importCSV" type="file" accept=".csv,text/csv" />
        </label>
      </div>

      <div class="debugRow">
        <label><input id="toggleAxes" type="checkbox"> 顯示座標軸</label>
        <label><input id="toggleBox" type="checkbox"> 顯示包圍盒</label>
        <button id="goTree" class="primary" title="把目前葉片帶到樹場景">→ 送到樹場景</button>
      </div>
    </div>

    <!-- Scene 2 (five presets + sliders) -->
    <div id="sceneTree" style="display:none">
      <div class="row g"><label class="lbl">樹型預設</label><span class="val" id="valPreset"></span></div>
      <select id="treePreset">
        <option value="maple" selected>楓（闊葉、球形/圓傘）</option>
        <option value="oak">橡（闊葉、寬圓冠）</option>
        <option value="pine">松（針葉、圓錐/層狀）</option>
        <option value="willow">柳（長垂、傾斜下垂）</option>
        <option value="banyan">榕（橫展、分枝繁密）</option>
      </select>

      <div class="row g"><label class="lbl">樹高 (m)</label><span class="val" id="valTreeH"></span></div>
      <input id="treeH" type="range" min="2" max="20" step="0.1" value="5.0" />
      <div class="row g"><label class="lbl">樹冠半徑 (m)</label><span class="val" id="valCrownR"></span></div>
      <input id="crownR" type="range" min="1" max="12" step="0.1" value="3.0" />
      <div class="row g"><label class="lbl">分枝層數（5–30）</label><span class="val" id="valLevels"></span></div>
      <input id="levels" type="range" min="5" max="30" step="1" value="15" />
      <div class="row g"><label class="lbl">分枝張角 (°)</label><span class="val" id="valSpread"></span></div>
      <input id="spread" type="range" min="20" max="120" step="1" value="70" />
      <div class="row g"><label class="lbl">樹幹傾斜 (°)</label><span class="val" id="valLean"></span></div>
      <input id="lean" type="range" min="-10" max="10" step="1" value="0" />
      <div class="row g"><label class="lbl">葉片數量 <span class="warn">(上限 30,000)</span></label><span class="val" id="valLeafCount"></span></div>
      <input id="leafCount" type="range" min="50" max="30000" step="50" value="2000" />
      <div class="row g"><label class="lbl">樹冠形狀</label><span class="val" id="valShape"></span></div>
      <select id="shape">
        <option value="sphere" selected>球形</option>
        <option value="cone">圓錐</option>
        <option value="vase">花瓶</option>
      </select>

      <div class="btns" style="grid-template-columns:repeat(3,1fr);margin-top:10px">
        <button id="btnBuildTree" class="primary">生成/更新</button>
        <button id="btnClearTree">清除樹</button>
        <button id="btnFit">視角置中</button>
      </div>
      <p class="small">說明：預設為五種樹型，調整任何參數會立即更新；葉片使用場景一的當前葉形。</p>
    </div>

    <!-- Scene 3 (color first, then fall) -->
    <div id="sceneFall" style="display:none">
      <div class="row g"><label class="lbl">落葉倍率</label><span class="val" id="valFallRate"></span></div>
      <input id="fallRate" type="range" min="0.1" max="20" step="0.1" value="1.0"/>
      <div class="row g"><label class="lbl">再長回速度</label><span class="val" id="valRegrow"></span></div>
      <input id="regrow" type="range" min="0" max="20" step="0.5" value="0"/>
      <div class="row g"><label class="lbl">風強度</label><span class="val" id="valWind"></span></div>
      <input id="windAmp" type="range" min="0" max="8" step="0.1" value="3.0"/>
      <div class="row g"><label class="lbl">亂流（類 Perlin）</label><span class="val" id="valTurb"></span></div>
      <input id="turb" type="range" min="0" max="3" step="0.05" value="1.2"/>
      <div class="row g"><label class="lbl">模擬並行上限（當前飄落葉片數）</label><span class="val" id="valMaxActive"></span></div>
      <input id="maxActive" type="range" min="200" max="4000" step="100" value="1200"/>
      <div class="btns" style="margin-top:10px">
        <button id="btnStartFall" class="primary">開始落葉</button>
        <button id="btnStopFall">停止</button>
        <button id="btnResetFall">重置季節</button>
      </div>
      <p class="small">機制：先「轉色」→ 再「脫離飄落」。轉色受高度與風場干擾，落地後可堆積，並按再長回速度恢復綠葉。</p>
    </div>
  </aside>
</div>

<div id="diag"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js?module';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js?module';

const diagEl = document.getElementById('diag');
function diag(msg, ok=false){ diagEl.classList.add('show'); diagEl.innerHTML = (ok?'<b style="color:#22c55e">OK</b> ':'<b style="color:#f97316">LOG</b> ') + String(msg); console.log('[DIAG]',msg); }
window.addEventListener('error', e=>{ diag(`錯誤：${e.message}`); });
window.addEventListener('unhandledrejection', e=>{ diag(`Promise 拋錯：${e.reason}`); });

// --- THREE setup ---
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x0b1020, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 5000);
camera.position.set(3.2, 2.6, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.enablePan = true;
controls.target.set(0,0.8,0);

scene.add(new THREE.AmbientLight(0xffffff, 0.38));
const dir1 = new THREE.DirectionalLight(0xffffff, 1.0); dir1.position.set(4,6,4); scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.6); dir2.position.set(-6,2,-6); scene.add(dir2);
const hemi = new THREE.HemisphereLight(0x8ecae6, 0x0b1020, 0.35); scene.add(hemi);
const grid = new THREE.GridHelper(120, 60, 0x334155, 0x1f2a44); grid.position.y = 0; scene.add(grid);

const matLeaf = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9, metalness:0.02, side:THREE.DoubleSide, vertexColors:true});
const matStem = new THREE.MeshStandardMaterial({color:0x10b981, roughness:0.95});
const groundMat = new THREE.MeshStandardMaterial({color:0x2b3344, metalness:0.0, roughness:0.95});

function qs(sel){return document.querySelector(sel)}
const ui = {
  shape: qs('#leafShape'), margin: qs('#leafMargin'), vein: qs('#leafVein'),
  len: qs('#len'), width: qs('#width'), tip: qs('#tip'), base: qs('#base'), baseNotch: qs('#baseNotch'),
  apexConverge: qs('#apexConverge'),
  serrA: qs('#serrA'), serrF: qs('#serrF'), toothSharp: qs('#toothSharp'), doubleSerr: qs('#doubleSerr'),
  lobeCount: qs('#lobeCount'), lobeDepth: qs('#lobeDepth'), lobeRound: qs('#lobeRound'),
  rib: qs('#rib'), curl: qs('#curl'), twist: qs('#twist'), bend: qs('#bend'), waveAmp: qs('#waveAmp'), waveFreq: qs('#waveFreq'), asym: qs('#asym'),
  double: qs('#double'), stem: qs('#stem'),
  reset: qs('#reset'), rnd: qs('#randomize'), goTree: qs('#goTree')
};
const label = {
  len: qs('#valLen'), width: qs('#valWidth'), tip: qs('#valTip'), base: qs('#valBase'), serrA: qs('#valSerrA'), serrF: qs('#valSerrF'),
  rib: qs('#valRib'), curl: qs('#valCurl'), twist: qs('#valTwist'), bend: qs('#valBend'),
  baseNotch: qs('#valNotch'), apexConverge: qs('#valApex'),
  toothSharp: qs('#valToothSharp'), doubleSerr: qs('#valDoubleSerr'),
  lobeCount: qs('#valLobeCount'), lobeDepth: qs('#valLobeDepth'), lobeRound: qs('#valLobeRound'),
  waveAmp: qs('#valWaveAmp'), waveFreq: qs('#valWaveFreq'), asym: qs('#valAsym')
};
const KPIV = qs('#kpiVerts'), KPIF = qs('#kpiFaces'), KPIA = qs('#kpiArea');

const P = {
  len: parseFloat(ui.len.value),
  width: parseFloat(ui.width.value),
  tip: parseFloat(ui.tip.value),
  base: parseFloat(ui.base.value),
  baseNotch: parseFloat(ui.baseNotch.value),
  apexConverge: parseFloat(ui.apexConverge.value),
  serrA: parseFloat(ui.serrA.value),
  serrF: parseInt(ui.serrF.value),
  toothSharp: parseFloat(ui.toothSharp?.value||0),
  doubleSerr: parseFloat(ui.doubleSerr?.value||0),
  lobeCount: parseInt(ui.lobeCount.value),
  lobeDepth: parseFloat(ui.lobeDepth.value),
  lobeRound: parseFloat(ui.lobeRound.value),
  rib: parseFloat(ui.rib.value),
  curl: parseFloat(ui.curl.value),
  twist: parseFloat(ui.twist.value),
  bend: parseFloat(ui.bend.value),
  waveAmp: parseFloat(ui.waveAmp.value),
  waveFreq: parseInt(ui.waveFreq.value),
  asym: parseFloat(ui.asym.value),
  double: qs('#double').checked,
  stem: qs('#stem').checked,
  resU: 64, resV: 28
};
let leafMesh=null, stemMesh=null, boxHelper=null, axes=null;
let treeGroup = null, leavesInst = null;
let ground = null, groundHeights = null;
let fallRunning = false; let fallClock = 0; let firstFit = true;

// Fall state
let leafVel, leafAngVel, leafPhase, leafState;
let fallingList = [];
let windBaseDir = 0, windTime = 0;

function smoothstep(e0,e1,x){const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0))); return t*t*(3-2*t)}
function rotY(ang,x,y,z){ const c=Math.cos(ang), s=Math.sin(ang); return {x:c*x + s*z, y, z:-s*x + c*z}; }
function rotX(ang,x,y,z){ const c=Math.cos(ang), s=Math.sin(ang); return {x, y:c*y - s*z, z:s*y + c*z}; }
function lerp(a,b,t){return a+(b-a)*t}

// --- scene switching ---
const sceneLeaf = document.getElementById('sceneLeaf');
const sceneTree = document.getElementById('sceneTree');
const sceneFall = document.getElementById('sceneFall');
document.getElementById('btnScene1').addEventListener('click', ()=> showScene(1));
document.getElementById('btnScene2').addEventListener('click', ()=> { showScene(2); buildTree(true); });
document.getElementById('btnScene3').addEventListener('click', ()=> { showScene(3); prepareFall(); });
function showScene(n){ sceneLeaf.style.display = (n===1)?'block':'none'; sceneTree.style.display = (n===2)?'block':'none'; sceneFall.style.display = (n===3)?'block':'none'; }

// --- presets mapping (leaf, same as v0.752) ---
const SHAPE = {
  elliptic:      {len:12,width:0.40,tip:1.0,base:1.0,baseNotch:0.00,apexConverge:0.20,lobeCount:0,lobeDepth:0.00,lobeRound:0.6},

// --- leaf geometry (from 0.752) ---
function buildLeaf(){
  let geo;
  try{ geo = buildLeafGeometry(P, veinConf); }
  catch(err){ diag('幾何生成錯誤，改用備援方片：'+err.message); geo = new THREE.PlaneGeometry(0.6,0.3,1,1); }
  if(!leafMesh){ leafMesh = new THREE.Mesh(geo, matLeaf); scene.add(leafMesh); }
  else { leafMesh.geometry.dispose(); leafMesh.geometry = geo; }

  if(P.stem){
    const st = buildStemGeometry(P);
    if(!stemMesh){ stemMesh = new THREE.Mesh(st, matStem); scene.add(stemMesh); }
    else { stemMesh.geometry.dispose(); stemMesh.geometry = st; }
  } else if(stemMesh){ scene.remove(stemMesh); stemMesh.geometry.dispose(); stemMesh=null; }

  KPIV.textContent = geo.attributes.position.count;
  KPIF.textContent = geo.index ? (geo.index.count/3) : (geo.attributes.position.count/3);
  KPIA.textContent = (estimateArea(geo)).toFixed(2);

  if(firstFit){ fitCameraTo(leafMesh, 1.9); firstFit = false; }
  updateHelpers();
}

function buildLeafGeometry(p, vein){
  const L = p.len/100;
  const Wmax = (p.len * p.width)/100;
  const resU = p.resU, resV = p.resV;
  const pos = new Float32Array((resU+1)*(resV+1)*3);
  const col = new Float32Array((resU+1)*(resV+1)*3);
  const idx=[]; let ptr=0, cptr=0;
  for(let iu=0; iu<=resU; iu++){
    const u = iu/resU;
    const s = Math.sin(Math.PI * Math.min(1, Math.max(0,u)));
    const tipPow=p.tip, basePow=p.base;
    const tipFactor=Math.pow(1-u,tipPow);
    const baseFactor=Math.pow(u,basePow);
    let halfW = Wmax * s * (0.65 + 0.35*(1 - tipFactor) * (0.7 + 0.3*baseFactor));
    halfW *= (1 - p.baseNotch * (1 - Math.min(1, u*3)));
    const apexK = 1 - (p.apexConverge||0)*0.6 * smoothstep(0.7, 1.0, u);
    halfW *= Math.max(0.15, apexK);

    const serrAmp=(p.serrA)*Wmax;
    for(let iv=0; iv<=resV; iv++){
      const vv=iv/resV; const v=vv*2-1;
      const edge = smoothstep(0.6,1.0,Math.abs(v));
      let serr = serrAmp * Math.sin(2*Math.PI * p.serrF * u + (p.toothSharp||0)*0.6*Math.sign(v)) * edge * Math.sign(v);
      if((p.doubleSerr||0)>0){
        serr += p.doubleSerr * serrAmp*0.5 * Math.sin(2*Math.PI * p.serrF * 2 * u + 1.2) * edge * Math.sign(v);
      }

      if(p.lobeCount>0 && p.lobeDepth>0){
        const ang = Math.PI * (u);
        const lobing = Math.sin(p.lobeCount * ang);
        halfW *= (1 + p.lobeDepth * 0.25 * Math.max(0, lobing));
      }

      const asymK = 1 + p.asym * (v>0? 0.12 : -0.12);
      let x=(u - 0.1)*L;
      let y=(v)*(halfW + serr)*asymK;
      let z=0;

      let ribZ = 0;
      if(vein.type==='pinnate'){
        const mid=1 - Math.min(1, Math.abs(v)/0.8);
        ribZ += (p.rib/100) * Math.pow(mid,2);
      } else if(vein.type==='palmate'){
        const m = vein.palmRibs||5;
        for(let k=0;k<m;k++){
          const angv = (k/(m-1)-0.5)*0.9;
          const proj = 1 - Math.min(1, Math.abs(v - angv)/0.6);
          ribZ += (p.rib/160) * Math.max(0, proj);
        }
      } else if(vein.type==='parallel'){
        const n = vein.parallelCount||12;
        const stripe = Math.sin(v* n * Math.PI)*0.5+0.5;
        ribZ += (p.rib/160) * stripe;
      } else if(vein.type==='arcuate'){
        const arc = 1 - Math.abs(v) * (0.7 + 0.3*u);
        ribZ += (p.rib/120) * Math.max(0, arc);
      }
      z += ribZ;

      const curlAngle=p.curl*(u)*0.8*Math.PI*(Math.abs(v));
      ({x,y,z}=rotY(Math.sign(v)*curlAngle,x,y,z));
      const twA=p.twist*Math.PI*u; ({x,y,z}=rotX(twA,x,y,z));
      z += (p.bend/100) * ( -4*Math.pow(u-0.5,2) + 1 );

      if(p.waveAmp>0 && p.waveFreq>0){
        z += p.waveAmp * Math.sin( (u*3.14159)*p.waveFreq ) * (1 - Math.abs(v));
      }

      pos[ptr++]=x; pos[ptr++]=y; pos[ptr++]=z;
      const c = new THREE.Color().setHSL(0.33 - 0.08*u, 0.7, 0.48+0.18*(1-u));
      col[cptr++]=c.r; col[cptr++]=c.g; col[cptr++]=c.b;
    }
  }
  for(let iu=0; iu<resU; iu++) for(let iv=0; iv<resV; iv++){
    const a=(resV+1)*iu+iv; const b=a+(resV+1); const c=b+1; const d=a+1; idx.push(a,b,d, b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

// Leaf thickness estimate & petiole
function estimateLeafThickness(p){
  const L = p.len/100;
  const ribZ = Math.max(p.rib/100, p.rib/120, p.rib/160);
  const baseline = L * 0.002;
  return Math.max(baseline, ribZ*1.6);
}
function buildStemGeometry(p){
  const L = p.len/100;
  const stemLen = Math.max(0.04, Math.min(0.18, L*0.18));
  const t = estimateLeafThickness(p);
  const r = Math.max(0.0008, Math.min(L*0.01, t*2.5));
  const geo=new THREE.CylinderGeometry(r, r, stemLen, 12, 1, true);
  geo.rotateZ(Math.PI/2);
  const baseX = -0.1 * L;
  geo.translate(baseX - stemLen/2, 0, 0);
  return geo;
}

function estimateArea(geo){ const pos=geo.attributes.position, index=geo.index; let area=0; const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(); if(!index){ for(let i=0;i<pos.count;i+=9){ a.set(pos.array[i],pos.array[i+1],pos.array[i+2]); b.set(pos.array[i+3],pos.array[i+4],pos.array[i+5]); c.set(pos.array[i+6],pos.array[i+7],pos.array[i+8]); area+=triangleArea(a,b,c);} } else { for(let i=0;i<index.count;i+=3){ a.fromBufferAttribute(pos,index.getX(i)); b.fromBufferAttribute(pos,index.getX(i+1)); c.fromBufferAttribute(pos,index.getX(i+2)); area+=triangleArea(a,b,c);} } return area*10000; }
function triangleArea(a,b,c){ const ab=new THREE.Vector3().subVectors(b,a); const ac=new THREE.Vector3().subVectors(c,a); return ab.cross(ac).length()/2; }

  const vals = csvKeys.map(k=> (typeof P[k]==='boolean') ? (P[k]?1:0) : P[k]);
  rows.push(vals.join(','));
  const blob = new Blob([rows.join('\\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'leaf_params_v0752.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  diag('CSV 已匯出。', true);
});
document.getElementById('importCSV').addEventListener('change', (e)=>{
  const file = e.target.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const text = String(reader.result).trim();
      const lines = text.split(/\\r?\\n/);
      if(lines.length<2) throw new Error('CSV 無資料');
      const header = lines[0].split(',').map(s=>s.trim());
      const values = lines[1].split(',').map(s=>s.trim());
      const map = {};
      header.forEach((k,i)=>{ if(values[i]!==undefined){ const v = values[i]; map[k] = (v==='0'||v==='1') && (k==='double'||k==='stem') ? (v==='1') : parseFloat(v); }});
      Object.assign(P, map);
      csvKeys.forEach(k=>{ const el=document.getElementById(k); if(el){ el.value = (typeof P[k]==='boolean')?(P[k]?1:0):P[k]; if(el.type==='checkbox') el.checked = !!P[k]; }});
      syncLeafLabels(); buildLeaf();
      diag('CSV 匯入完成。', true);
    }catch(err){ diag('CSV 匯入錯誤：'+err.message); }
  };
  reader.readAsText(file);
});

const TREE_PRESETS = {
  maple:  { H:5.0, R:3.2, levels:16, spread:85,  lean:0,   shape:'sphere', child:3, prune:0.04, tipJ:0.05 },
  oak:    { H:6.0, R:3.8, levels:18, spread:80,  lean:0,   shape:'sphere', child:3, prune:0.05, tipJ:0.06 },
  pine:   { H:8.0, R:2.6, levels:20, spread:45,  lean:0,   shape:'cone',   child:2, prune:0.03, tipJ:0.03 },
  willow: { H:5.0, R:3.5, levels:17, spread:100, lean:4,   shape:'vase',   child:3, prune:0.06, tipJ:0.08 },
  banyan: { H:7.0, R:4.5, levels:22, spread:95,  lean:0,   shape:'sphere', child:4, prune:0.05, tipJ:0.07 }
};
function applyTreePreset(key){
  const p = TREE_PRESETS[key]||TREE_PRESETS.maple;
  treeUI.treeH.value=p.H; treeUI.crownR.value=p.R; treeUI.levels.value=p.levels; treeUI.spread.value=p.spread; treeUI.lean.value=p.lean; treeUI.shape.value=p.shape;

let trunkMat = new THREE.MeshStandardMaterial({color:0x6b4f3a, roughness:0.95});
let branchMat = new THREE.MeshStandardMaterial({color:0x6e5840, roughness:0.95});

function buildTree(fit=false){
  clearTree();
  if(!ground){
    const g = new THREE.PlaneGeometry(120,120,120,120); g.rotateX(-Math.PI/2);
    groundHeights = new Float32Array((121)*(121));
    ground = new THREE.Mesh(g, groundMat); scene.add(ground);
  }
  treeGroup = new THREE.Group(); scene.add(treeGroup);

  const H = parseFloat(treeUI.treeH.value);
  const levels = Math.min(30, parseInt(treeUI.levels.value));
  const spread = parseFloat(treeUI.spread.value)*Math.PI/180;
  const lean = parseFloat(treeUI.lean.value)*Math.PI/180;
  const preset = TREE_PRESETS[treeUI.preset.value]||TREE_PRESETS.maple;
  const CHILD_PER_NODE = preset.child;
  const PRUNE_BASE = preset.prune;
  const TIP_JITTER = preset.tipJ;
  const MAX_BRANCHES = 20000;
  const LEN_DECAY = 0.75;
  const RAD_DECAY = 0.72;

  const branches = [];
  const queue = [];
  const base = new THREE.Vector3(0,0,0);
  const trunkDir = new THREE.Vector3(Math.sin(lean), Math.cos(lean), 0).normalize();
  const trunkLen = H*0.7;
  const trunkTop = base.clone().addScaledVector(trunkDir, trunkLen);
  queue.push({a:base, b:trunkTop, dir:trunkDir.clone(), len:H*0.5, r:0.12*H, lvl:1});

  while(queue.length && branches.length < MAX_BRANCHES){
    const cur = queue.shift();
    branches.push({a:cur.a.clone(), b:cur.b.clone(), r:cur.r});
    if(cur.lvl>=levels) continue;
    for(let c=0;c<CHILD_PER_NODE;c++){
      const pruneP = PRUNE_BASE + 0.01*cur.lvl;
      if(Math.random()<pruneP) continue;
      const angA = (c - (CHILD_PER_NODE-1)/2) * (spread/(CHILD_PER_NODE-1||1));
      const angY = (Math.random()*Math.PI*2);
      const tilt = new THREE.Vector3(Math.cos(angY)*Math.sin(angA), Math.cos(angA), Math.sin(angY)*Math.sin(angA));
      const newDir = cur.dir.clone().multiplyScalar(0.3).add(tilt.multiplyScalar(0.7)).normalize();
      const newLen = cur.len * (LEN_DECAY + 0.03*Math.random());
      const nb = cur.b.clone().addScaledVector(newDir, newLen);
      nb.x += (Math.random()-0.5)*newLen*TIP_JITTER;
      nb.z += (Math.random()-0.5)*newLen*TIP_JITTER;
      queue.push({a:cur.b.clone(), b:nb, dir:newDir, len:newLen, r:Math.max(0.012, cur.r*RAD_DECAY), lvl:cur.lvl+1});
      if(queue.length + branches.length >= MAX_BRANCHES) break;
    }
  }

  const cyls = new THREE.Group();
  for(const s of branches){
    const v = new THREE.Vector3().subVectors(s.b, s.a);
    const len = v.length();
    const r1 = Math.max(0.012, s.r*0.6);
    const r2 = Math.max(0.010, s.r*0.5);
    const geo = new THREE.CylinderGeometry(r2, r1, len, 8);
    const mesh = new THREE.Mesh(geo, (len>H*0.45? trunkMat: branchMat));
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), v.clone().normalize());
    mesh.setRotationFromQuaternion(q);
    mesh.position.copy(s.a).addScaledVector(v,0.5);
    cyls.add(mesh);
  }
  treeGroup.add(cyls);

  // Leaves instancing using current leaf geometry
  const leafGeo = leafMesh?.geometry?.clone() || new THREE.PlaneGeometry(0.3,0.15);
  const count = parseInt(treeUI.leafCount.value);
  const leaves = new THREE.InstancedMesh(leafGeo, matLeaf, count);
  leaves.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(count*3), 3, false);
  matLeaf.vertexColors = true;
  const dummy = new THREE.Object3D();
  const biasTip = (t)=> Math.pow(t, 4);
  for(let i=0;i<count;i++){
    const s = branches[(Math.random()*branches.length)|0];
    const t = 0.55 + 0.45*biasTip(Math.random());
    const pos = s.a.clone().lerp(s.b, t);
    const rad = (0.035 + 0.11*Math.random());
    const ang = Math.random()*Math.PI*2;
    pos.x += Math.cos(ang)*rad; pos.z += Math.sin(ang)*rad; pos.y += (Math.random()-0.5)*0.05;
    dummy.position.copy(pos);
    const dir = new THREE.Vector3().subVectors(s.b, s.a).normalize();
    const up = new THREE.Vector3(0,1,0);
    const side = new THREE.Vector3().crossVectors(dir, up).normalize();
    const leafUp = new THREE.Vector3().crossVectors(side, dir).normalize();
    const m = new THREE.Matrix4().lookAt(new THREE.Vector3(0,0,0), dir, leafUp).invert();
    dummy.rotation.setFromRotationMatrix(m);
    dummy.rotation.x += (Math.random()-0.5)*0.6;
    dummy.rotation.y += (Math.random()-0.5)*Math.PI;
    dummy.rotation.z += (Math.random()-0.5)*0.6;
    const sc = 0.7 + Math.random()*0.7; dummy.scale.setScalar(sc);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
    const c = new THREE.Color().setHSL(0.28 + 0.10*Math.random()*0.3, 0.75, 0.48);
    leaves.setColorAt(i, c);
  }
  leaves.instanceMatrix.needsUpdate = true;
  if(leaves.instanceColor) leaves.instanceColor.needsUpdate = true;
  treeGroup.add(leaves);
  leavesInst = leaves;

  if(fit) fitCameraTo(treeGroup, 2.0);
  diag(`樹生成：節數 ${branches.length}，葉片 ${count}`, true);
}

function clearTree(){ if(treeGroup){ scene.remove(treeGroup); treeGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose?.(); }); treeGroup=null; leavesInst=null; } }

// --- Fall scene: color first then detach ---
const fallUI = { fallRate: qs('#fallRate'), windAmp: qs('#windAmp'), turb: qs('#turb'), regrow: qs('#regrow'), start: qs('#btnStartFall'), stop: qs('#btnStopFall'), reset: qs('#btnResetFall'), maxActive: qs('#maxActive') };
const fallLbl = { fallRate: qs('#valFallRate'), windAmp: qs('#valWind'), turb: qs('#valTurb'), regrow: qs('#valRegrow'), maxActive: qs('#valMaxActive') };
['fallRate','windAmp','turb','regrow','maxActive'].forEach(k=> fallUI[k].addEventListener('input', ()=>{ syncFallLabels(); }));
function syncFallLabels(){ fallLbl.fallRate.textContent=fallUI.fallRate.value+'×'; fallLbl.windAmp.textContent=fallUI.windAmp.value; fallLbl.turb.textContent=fallUI.turb.value; fallLbl.regrow.textContent=fallUI.regrow.value+'×'; fallLbl.maxActive.textContent=fallUI.maxActive.value; }
syncFallLabels();
fallUI.start.addEventListener('click', ()=>{ showScene(3); prepareFall(); fallRunning=true; });
fallUI.stop.addEventListener('click', ()=>{ fallRunning=false; });
fallUI.reset.addEventListener('click', ()=>{ resetFallSeason(); });

function ensureFallArrays(n){
  leafVel = new Array(n);
  leafAngVel = new Array(n);
  leafPhase = new Float32Array(n);   // 0:綠 → 1:黃 → 2:橘紅
  leafState = new Uint8Array(n);     // 0:附著, 1:飄落, 2:落地
  for(let i=0;i<n;i++){ leafVel[i]=new THREE.Vector3(); leafAngVel[i]=new THREE.Vector3(); leafPhase[i]=0; leafState[i]=0; }
  fallingList = [];
}
function prepareFall(){
  if(!leavesInst){ buildTree(true); }
  const n = leavesInst.count;
  if(!ground){
    const g = new THREE.PlaneGeometry(120,120,120,120); g.rotateX(-Math.PI/2);
    groundHeights = new Float32Array((121)*(121));
    ground = new THREE.Mesh(g, groundMat); scene.add(ground);
  }
  ensureFallArrays(n);
  fallRunning=false; fallClock=0; windTime=0;
  fitCameraTo(treeGroup??leavesInst, 2.2);
}
function resetFallSeason(){ if(!leavesInst) return;
  const n=leavesInst.count; const dm = new THREE.Matrix4(); const pos=new THREE.Vector3(); const quat=new THREE.Quaternion(); const scl=new THREE.Vector3();
  for(let i=0;i<n;i++){
    leavesInst.getMatrixAt(i, dm); dm.decompose(pos, quat, scl);
    pos.y = Math.max(pos.y, 0.2);
    dm.compose(pos, quat, scl);
    leavesInst.setMatrixAt(i, dm);
    leafVel[i].set(0,0,0); leafAngVel[i].set(0,0,0);
    leafState[i]=0; leafPhase[i]=0;
    const c = new THREE.Color().setHSL(0.28, 0.75, 0.48);
    leavesInst.setColorAt(i, c);
  }
  leavesInst.instanceMatrix.needsUpdate=true;
  if(leavesInst.instanceColor) leavesInst.instanceColor.needsUpdate=true;
  fallClock=0; fallRunning=false; fallingList.length=0;
}

// noise & wind
function nrand(x,y,z){ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return s-Math.floor(s); }
function smoothNoise3(x,y,z){ const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z); const xf=x-xi, yf=y-yi, zf=z-zi; function fade(t){return t*t*(3-2*t)}
  let n000=nrand(xi,yi,zi), n100=nrand(xi+1,yi,zi), n010=nrand(xi,yi+1,zi), n110=nrand(xi+1,yi+1,zi); let n001=nrand(xi,yi,zi+1), n101=nrand(xi+1,yi,zi+1), n011=nrand(xi,yi+1,zi+1), n111=nrand(xi+1,yi+1,zi+1);
  const u=fade(xf), v=fade(yf), w=fade(zf);
  const x00=THREE.MathUtils.lerp(n000,n100,u), x10=THREE.MathUtils.lerp(n010,n110,u), x01=THREE.MathUtils.lerp(n001,n101,u), x11=THREE.MathUtils.lerp(n011,n111,u);
  const y0=THREE.MathUtils.lerp(x00,x10,v), y1=THREE.MathUtils.lerp(x01,x11,v);
  return THREE.MathUtils.lerp(y0,y1,w);
}
function windAt(x,y,z){
  const A=parseFloat(fallUI.windAmp.value);
  const T=parseFloat(fallUI.turb.value);
  const dirRad=(windBaseDir)*Math.PI/180;
  const baseX=Math.cos(dirRad)*A, baseZ=Math.sin(dirRad)*A;
  const n1 = smoothNoise3((x*0.25)+windTime*0.8, (z*0.25)-windTime*0.6, 0);
  const n2 = smoothNoise3((-x*0.2)+windTime*0.5, (y*0.25)+windTime*0.6, 1);
  return new THREE.Vector3(baseX + T*(n1-0.5), 0.3*T*(n2-0.5), baseZ + T*(n2-0.5));
}

// stepFall: while attached -> phase↑ -> recolor; when phase>1.0, detach quota; simulate falling; pile on ground; regrow
function stepFall(){
  if(!leavesInst) return;
  const n = leavesInst.count;
  const dm = new THREE.Matrix4(); const pos=new THREE.Vector3(); const quat=new THREE.Quaternion(); const eul=new THREE.Euler(); const scl=new THREE.Vector3();
  const fallRate=parseFloat(fallUI.fallRate.value);
  const regrow=parseFloat(fallUI.regrow.value);
  const maxActive = parseInt(fallUI.maxActive.value);

  windTime += 0.01;
  windBaseDir = (Math.sin(windTime*0.07)*15);

  // 1) attached leaves: advance color phase; some cross threshold -> mark for detaching quota
  let detQuota = Math.min(300, 30 + (n*0.001)|0);
  for(let trial=0; trial<detQuota; trial++){
    const i = (Math.random()*n)|0;
    if(leafState[i]!==0) continue;
    leavesInst.getMatrixAt(i, dm); dm.decompose(pos, quat, scl);
    const heightFactor = THREE.MathUtils.clamp(pos.y / (parseFloat(treeUI.treeH.value)+0.01), 0, 1);
    // phase grows faster higher up & with turbulence
    const dphi = 0.0008*(1+0.6*heightFactor) + 0.0005*parseFloat(fallUI.turb.value);
    leafPhase[i] = Math.min(2.0, leafPhase[i] + dphi);
    // recolor even while attached
    const c = (leafPhase[i]<1) ? new THREE.Color().setHSL(0.16 + 0.10*leafPhase[i], 0.7, 0.5 + 0.2*(1-leafPhase[i]))
                               : new THREE.Color().setHSL(0.04 + 0.02*(leafPhase[i]-1), 0.8, 0.55 - 0.1*(leafPhase[i]-1));
    leavesInst.setColorAt(i, c);
    // when surpassing threshold & active quota allows, detach into falling
    if(leafPhase[i] > 1.05 && fallingList.length < maxActive){
      leafState[i]=1; fallingList.push(i);
      const w = windAt(pos.x,pos.y,pos.z);
      leafVel[i].set((Math.random()-0.5)*0.05 + 0.003*w.x, -0.02, (Math.random()-0.5)*0.05 + 0.003*w.z);
      leafAngVel[i].set((Math.random()-0.5)*1.2, (Math.random()-0.5)*0.8, (Math.random()-0.5)*1.2);
    }
  }

  // 2) simulate active falling leaves
  for(let k=fallingList.length-1; k>=0; k--){
    const i = fallingList[k];
    leavesInst.getMatrixAt(i, dm); dm.decompose(pos, quat, scl);

    const w = windAt(pos.x,pos.y,pos.z).multiplyScalar(0.002*fallRate);
    const L = P.len/100, W = (P.len*P.width)/100;
    const area = L*W;
    const curlK = 1 + P.curl*1.5;
    const Cd = 0.8*curlK;
    leafVel[i].y += (-0.0022*fallRate);
    const v2 = leafVel[i].lengthSq();
    const drag = leafVel[i].clone().multiplyScalar(-Cd*area*Math.max(0.0, v2));
    leafVel[i].add(drag);
    leafVel[i].x += w.x - 0.002*leafVel[i].x;
    leafVel[i].z += w.z - 0.002*leafVel[i].z;
    leafVel[i].y += w.y*0.3 - 0.001*leafVel[i].y;
    const zz = Math.sin(windTime*3 + i*0.37) * 0.005 * (1 + 0.6*P.width);
    leafVel[i].x += zz;

    // rotation tumble
    eul.setFromQuaternion(quat);
    eul.x += (w.x*8 + leafAngVel[i].x)*0.01;
    eul.y += (w.y*6 + leafAngVel[i].y)*0.01;
    eul.z += (w.z*8 + leafAngVel[i].z)*0.01;
    quat.setFromEuler(eul);
    leafAngVel[i].multiplyScalar(0.98);
    leafAngVel[i].x += (Math.random()-0.5)*0.02*curlK;
    leafAngVel[i].z += (Math.random()-0.5)*0.02*curlK;

    pos.add(leafVel[i]);

    // ground pile
    if(pos.y<=0){
      const gx = Math.round((pos.x/120+0.5)*120); const gz = Math.round((pos.z/120+0.5)*120);
      if(gx>=0 && gx<=120 && gz>=0 && gz<=120){
        const gi = gz*121 + gx;
        const h = groundHeights[gi] += 0.0015*(0.6 + 0.8*Math.random());
        pos.y = h;
      } else { pos.y = 0; }
      leafVel[i].set(0,0,0); leafState[i]=2;
      leafPhase[i] = Math.max(leafPhase[i], 1.6);
      fallingList[k] = fallingList[fallingList.length-1]; fallingList.pop();
    }

    dm.compose(pos, quat, scl); leavesInst.setMatrixAt(i, dm);
  }

  if(fallingList.length>0){
    leavesInst.instanceMatrix.needsUpdate=true;
    if(leavesInst.instanceColor) leavesInst.instanceColor.needsUpdate = true;
  }

  // 3) regrow
  if(parseFloat(fallUI.regrow.value)>0){
    const dm2 = new THREE.Matrix4(); const pos2=new THREE.Vector3(); const quat2=new THREE.Quaternion(); const scl2=new THREE.Vector3();
    let regenBatch = 300;
    for(let i=0; i<n && regenBatch>0; i++){
      if(leafState[i]!==2) continue;
      leavesInst.getMatrixAt(i, dm2); dm2.decompose(pos2, quat2, scl2);
      pos2.y += 0.03*regrow;
      if(pos2.y > Math.random()*parseFloat(treeUI.treeH.value)){
        leafState[i]=0; leafPhase[i]=0;
        const c = new THREE.Color().setHSL(0.28, 0.75, 0.48);
        leavesInst.setColorAt(i, c);
        regenBatch--;
      }
      dm2.compose(pos2, quat2, scl2); leavesInst.setMatrixAt(i, dm2);
    }
    leavesInst.instanceMatrix.needsUpdate=true;
    if(leavesInst.instanceColor) leavesInst.instanceColor.needsUpdate = true;
  }
}

function fitCameraTo(obj, pad=1.8){
  if(!obj) return;
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); const center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  const radius = Math.max(size.x, size.y, size.z)*0.5 || 0.1;
  const fov = camera.fov * Math.PI/180;
  const dist = (radius/Math.tan(fov/2)) * pad;
  const dir = new THREE.Vector3(1,0.6,1).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = Math.max(0.001, dist/1000);
  camera.far = dist*10 + 100;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function resize(){
  const w = stage.clientWidth || stage.getBoundingClientRect().width || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function loop(){
  controls.update();
  if(fallRunning && leavesInst){ stepFall(); }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

function init(){
  // Scene 1 initial
  document.getElementById('leafShape').value='elliptic';
  document.getElementById('leafMargin').value='entire';
  document.getElementById('leafVein').value='pinnate';
  veinConf = VEIN.pinnate;
  applyPreset(SHAPE.elliptic);
  applyPreset(MARGIN.entire);
  Object.assign(P,{curl:0,twist:0,waveAmp:0,waveFreq:0,asym:0});
  ['curl','twist','waveAmp','waveFreq','asym'].forEach(k=> document.getElementById(k).value=P[k]);
  syncLeafLabels();
  buildLeaf();
  fitCameraTo(leafMesh, 2.0);

  // Scene 2 preset
  applyTreePreset('maple'); syncTreeLabels();

  loop();
  diag('v0.752-merge 啟動完成（場景一可見、場景二五樹型、場景三先轉色再落葉）', true);
}

try{ resize(); init(); }catch(err){ diag('初始化錯誤：'+err.message); }
</script>
