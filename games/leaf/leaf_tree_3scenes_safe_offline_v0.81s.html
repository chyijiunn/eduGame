<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Leaf & Tree 3 Scenes (SAFE Offline Merge) v0.81s</title>
<style>
  :root{--bg:#0b1020;--panel:#0c1324;--ink:#eaf2ff;--muted:#9fb0c9;--brand:#22c55e;--line:#23324a}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans TC",Segoe UI,Roboto}
  .app{display:grid;grid-template-columns:1fr 380px;height:100%}
  #stage{position:relative;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  aside{background:linear-gradient(180deg,#0c1324,#0a0f1b 60%);border-left:1px solid #1f2937;padding:14px 16px 160px;overflow:auto}
  h2{font-size:16px;margin:4px 0 10px;color:#cfe4d6}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
  .tab{padding:8px 10px;border-radius:10px;border:1px solid #263142;background:#0e1729;color:#e2e8f0;cursor:pointer}
  .tab.active{background:linear-gradient(180deg,#112c1d,#0b1e13);border-color:#1d3b29;color:#ccffdd}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
  .card{border:1px solid #1f2937;border-radius:12px;padding:8px;text-align:center}
  .hint{font-size:12px;color:#93a1b5;margin-top:6px}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  button,select{padding:8px 10px;border-radius:10px;background:#0e1729;border:1px solid #263142;color:#e2e8f0;cursor:pointer}
  button.primary{background:linear-gradient(180deg,#112c1d,#0b1e13);border-color:#1d3b29}
  input[type=range]{width:100%}
  .toast{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none}
  .sect{display:none}
  .sect.show{display:block}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  input[type="file"]{width:100%}
  .sep{height:1px;background:#1e293b;margin:10px 0}
</style>
</head>
<body>
<div class="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast" class="toast">狀態：初始化中…</div>
  </div>
  <aside>
    <div class="tabs">
      <button class="tab active" data-tab="leaf">場景一：葉片設計</button>
      <button class="tab" data-tab="tree">場景二：樹形生成</button>
      <button class="tab" data-tab="fall">場景三：秋季落葉</button>
    </div>

    <!-- Scene 1 -->
    <section id="sect-leaf" class="sect show">
      <h2>場景一：葉片設計（自動置中＋縮放）</h2>
      <div class="kpi">
        <div class="card"><b id="kpiArea">—</b><div class="hint">估算葉面積 (cm²)</div></div>
        <div class="card"><b id="kpiVerts">—</b><div class="hint">頂點數</div></div>
        <div class="card"><b id="kpiFaces">—</b><div class="hint">面數</div></div>
      </div>
      <div class="toolbar">
        <button id="btnFitLeaf" class="primary">一鍵可視（置中＋縮放）</button>
        <button id="btnResetLeaf">重置視角</button>
        <button id="btnRebuildLeaf">重建葉片</button>
        <button id="btnToTree">→ 送到樹場景</button>
      </div>
      <div class="row"><label>葉長 (cm)</label><span id="valLen">12.0</span></div>
      <input id="leafLen" type="range" min="6" max="40" step="0.1" value="12"/>
      <div class="row"><label>寬度比例</label><span id="valWid">0.40</span></div>
      <input id="leafWid" type="range" min="0.15" max="0.7" step="0.01" value="0.40"/>
      <div class="row"><label>尖端收斂</label><span id="valTip">0.20</span></div>
      <input id="leafTip" type="range" min="0" max="1" step="0.01" value="0.20"/>
      <div class="io">
        <button id="leafExport">匯出葉片 CSV</button>
        <label style="border:1px solid #263142;border-radius:10px;padding:8px 10px;background:#0e1729;display:flex;align-items:center;gap:8px">
          <span>匯入葉片 CSV</span>
          <input id="leafImport" type="file" accept=".csv,text/csv"/>
        </label>
      </div>
      <div class="hint">本場景完全離線，保證開啟即見葉片。</div>
    </section>

    <!-- Scene 2 -->
    <section id="sect-tree" class="sect">
      <h2>場景二：樹形生成（五種預設＋即時更新）</h2>
      <div class="row"><label>樹型預設</label><span id="valPreset"></span></div>
      <select id="treePreset">
        <option value="maple" selected>楓（闊葉、球形/圓傘）</option>
        <option value="oak">橡（闊葉、寬圓冠）</option>
        <option value="pine">松（針葉、圓錐/層狀）</option>
        <option value="willow">柳（長垂、傾斜下垂）</option>
        <option value="banyan">榕（橫展、分枝繁密）</option>
      </select>
      <div class="row"><label>樹高 (m)</label><span id="valTreeH">5.0 m</span></div>
      <input id="treeH" type="range" min="2" max="20" step="0.1" value="5.0"/>
      <div class="row"><label>樹冠半徑 (m)</label><span id="valCrownR">3.0 m</span></div>
      <input id="crownR" type="range" min="1" max="12" step="0.1" value="3.0"/>
      <div class="row"><label>分枝層數（5–30）</label><span id="valLevels">15</span></div>
      <input id="levels" type="range" min="5" max="30" step="1" value="15"/>
      <div class="row"><label>分枝張角 (°)</label><span id="valSpread">70°</span></div>
      <input id="spread" type="range" min="20" max="120" step="1" value="70"/>
      <div class="row"><label>樹幹傾斜 (°)</label><span id="valLean">0°</span></div>
      <input id="lean" type="range" min="-10" max="10" step="1" value="0"/>
      <div class="row"><label>葉片數量（上限 30,000）</label><span id="valLeafCount">2000</span></div>
      <input id="leafCount" type="range" min="50" max="30000" step="50" value="2000"/>
      <div class="row"><label>樹冠形狀</label><span id="valShape">球形</span></div>
      <select id="shape">
        <option value="sphere" selected>球形</option>
        <option value="cone">圓錐</option>
        <option value="vase">花瓶</option>
      </select>

      <div class="toolbar">
        <button id="btnBuildTree" class="primary">生成/更新</button>
        <button id="btnClearTree">清除樹</button>
        <button id="btnFitTree">視角置中</button>
      </div>

      <div class="io">
        <button id="treeExport">匯出樹形 CSV</button>
        <label style="border:1px solid #263142;border-radius:10px;padding:8px 10px;background:#0e1729;display:flex;align-items:center;gap:8px">
          <span>匯入樹形 CSV</span>
          <input id="treeImport" type="file" accept=".csv,text/csv"/>
        </label>
      </div>
      <div class="hint">葉片使用場景一目前葉形；任何參數改動即時更新（或按下生成）。</div>
    </section>

    <!-- Scene 3 -->
    <section id="sect-fall" class="sect">
      <h2>場景三：秋季落葉（先轉色→再飄落→落地堆積→再長回）</h2>
      <div class="row"><label>落葉倍率</label><span id="valFallRate">1×</span></div>
      <input id="fallRate" type="range" min="0.1" max="20" step="0.1" value="1.0"/>
      <div class="row"><label>再長回速度</label><span id="valRegrow">0×</span></div>
      <input id="regrow" type="range" min="0" max="20" step="0.5" value="0"/>
      <div class="row"><label>風強度</label><span id="valWind">3.0</span></div>
      <input id="windAmp" type="range" min="0" max="8" step="0.1" value="3.0"/>
      <div class="row"><label>亂流（類 Perlin）</label><span id="valTurb">1.2</span></div>
      <input id="turb" type="range" min="0" max="3" step="0.05" value="1.2"/>
      <div class="row"><label>同時飄落上限</label><span id="valMaxActive">1200</span></div>
      <input id="maxActive" type="range" min="200" max="4000" step="100" value="1200"/>
      <div class="toolbar">
        <button id="btnStartFall" class="primary">開始落葉</button>
        <button id="btnStopFall">停止</button>
        <button id="btnResetFall">重置季節</button>
        <button id="btnFitFall">視角置中</button>
      </div>
      <div class="hint">附著→轉色（綠→黃→橘紅）→門檻值後脫離飄落；落地堆積，並可依速度再長回。</div>
    </section>
  </aside>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
// ===== Shared Canvas "pseudo-3D" engine (離線保險) =====
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
// Orbit-like camera (簡化)
let yaw=0.25, pitch=0.16, dist=2.0, target=[0,0.0,0];
let dragging=false, lx=0, ly=0;
cv.addEventListener('wheel', e=>{e.preventDefault(); dist=Math.max(0.3, Math.min(60, dist*(1+Math.sign(e.deltaY)*0.1))); }, {passive:false});
cv.addEventListener('mousedown', e=>{dragging=true; lx=e.clientX; ly=e.clientY;});
addEventListener('mouseup', ()=>dragging=false);
addEventListener('mousemove', e=>{ if(!dragging) return; const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; yaw+=dx*0.005; pitch+=dy*0.004; pitch=Math.max(-1.2,Math.min(1.2,pitch));});

function resize(){
  const r = document.getElementById('stage').getBoundingClientRect();
  W = Math.max(320, r.width|0); H = Math.max(320, r.height|0);
  cv.width=(W*DPR)|0; cv.height=(H*DPR)|0; ctx.setTransform(DPR,0,0,DPR,0,0);
  requestFit();
}
addEventListener('resize', resize);

function lookAt(){ const cx=target[0]+dist*Math.cos(pitch)*Math.cos(yaw); const cy=target[1]+dist*Math.sin(pitch); const cz=target[2]+dist*Math.cos(pitch)*Math.sin(yaw); return {eye:[cx,cy,cz]} }
function project(pt){
  const cam=lookAt().eye;
  const vx=pt[0]-cam[0], vy=pt[1]-cam[1], vz=pt[2]-cam[2];
  const sy=Math.sin(-yaw), cy=Math.cos(-yaw);
  const sp=Math.sin(-pitch), cp=Math.cos(-pitch);
  let x=vx*cy - vz*sy;
  let z=vx*sy + vz*cy;
  let y=vy*cp - z*sp; z=vy*sp + z*cp;
  const f=1.6; const s=f/(z+f+0.0001);
  return {x: W*0.5 + x*s*W*0.6, y: H*0.62 - y*s*H*0.6, z:z, s};
}

function clear(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0c1a34'); g.addColorStop(0.5,'#0b162b'); g.addColorStop(1,'#0a1323');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // ground
  ctx.fillStyle='#0d182c'; ctx.fillRect(0,H*0.68,W,H*0.32);
  // grid
  ctx.strokeStyle='#21324a'; ctx.lineWidth=1;
  for(let x=-5; x<=5; x+=0.5){ const a=project([x,0,-5]), b=project([x,0,5]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  for(let z=-5; z<=5; z+=0.5){ const a=project([-5,0,z]), b=project([5,0,z]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
}

const toast=document.querySelector('.toast');
function info(txt){ toast.style.display='block'; toast.textContent=txt; }

// ===== Scene 1: Leaf =====
const ui=(id)=>document.getElementById(id); const label=(id,v)=>ui(id).textContent=v;
function leafParams(){
  const p={ len: parseFloat(ui('leafLen').value), wid: parseFloat(ui('leafWid').value), tip: parseFloat(ui('leafTip').value) };
  label('valLen',p.len.toFixed(1)); label('valWid',p.wid.toFixed(2)); label('valTip',p.tip.toFixed(2)); return p;
}
let leafMesh=null;
function hsl2rgb(h,s,l){ const a = s*Math.min(l,1-l); function f(n){ const k=(n+ h*12)%12; const color=l - a*Math.max(-1, Math.min(Math.min(k-3, 9-k),1)); return color; } return [f(0),f(8),f(4)]; }
function buildLeafMesh(){
  const p=leafParams(), L=p.len/100, Wmax=(p.len*p.wid)/100, segU=36, segV=64;
  const verts=[], faces=[], col=[];
  for(let iu=0; iu<=segU; iu++){
    const u = iu/segU;
    const s = Math.sin(Math.PI*Math.min(1, Math.max(0,u)));
    const tipK = 1 - 0.6*p.tip*0.6 * ((u>0.7)? (u-0.7)/0.3 : 0);
    const halfW = Math.max(0.0001, Wmax * s * (0.85*tipK + 0.15));
    for(let iv=0; iv<=segV; iv++){
      const v = iv/segV * 2 - 1;
      const x = (u-0.1)*L;
      const y = v*halfW;
      const z = 0.0 + 0.002 * (1 - Math.abs(v)) * Math.sin(u*3.14159*4);
      verts.push([x,y,z]);
      const h = 0.33 - 0.07*u, s2 = 0.75, l = 0.50 + 0.18*(1-u);
      const c = hsl2rgb(h, s2, l); col.push(c);
    }
  }
  for(let iu=0; iu<segU; iu++){ for(let iv=0; iv<segV; iv++){ const a=(segV+1)*iu + iv; const b=a + (segV+1); const c=b + 1; const d=a + 1; faces.push([a,b,d],[b,c,d]); } }
  return {verts,faces,col,type:'leaf'};
}
function bbox(verts){
  let min=[Infinity,Infinity,Infinity], max=[-Infinity,-Infinity,-Infinity];
  for(const v of verts){ if(v[0]<min[0]) min[0]=v[0]; if(v[1]<min[1]) min[1]=v[1]; if(v[2]<min[2]) min[2]=v[2];
                         if(v[0]>max[0]) max[0]=v[0]; if(v[1]>max[1]) max[1]=v[1]; if(v[2]>max[2]) max[2]=v[2]; }
  return {min,max, size:[max[0]-min[0], max[1]-min[1], max[2]-min[2]], center:[(min[0]+max[0])/2,(min[1]+max[1])/2,(min[2]+max[2])/2]};
}
function autoFit(mesh, pad=0.92){
  const b=bbox(mesh.verts);
  target=[b.center[0], b.center[1], b.center[2]];
  const sizeX=b.size[0], sizeY=b.size[1]; const major=Math.max(sizeX,sizeY,0.001);
  const f=1.6, targetFill=0.55*pad, s=Math.min(0.9, Math.max(0.15, targetFill/(0.6*major))); let newDist=Math.max(0.3,(f/s)-f);
  newDist = Math.min(Math.max(newDist, 0.35), 8.0); dist=newDist; yaw=0.25; pitch=0.16;
}
function drawMesh(mesh){
  const facesZ=mesh.faces.map((f,idx)=>{
    const z=(mesh.verts[f[0]][2]+mesh.verts[f[1]][2]+mesh.verts[f[2]][2])/3; return {idx,z};
  }).sort((a,b)=>b.z-a.z);
  for(const {idx} of facesZ){
    const f=mesh.faces[idx]; const pts=f.map(i=>project(mesh.verts[i])); const base=mesh.col[f[0]];
    const col = `rgb(${(base[0]*255)|0},${(base[1]*255)|0},${(base[2]*255)|0})`;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y); ctx.lineTo(pts[2].x,pts[2].y);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  }
}
function estimateArea(mesh){ const b=bbox(mesh.verts); const area=b.size[0]*b.size[1]*0.8*10000; return area; }
function updateLeafKPI(mesh){ ui('kpiVerts').textContent = mesh.verts.length; ui('kpiFaces').textContent = mesh.faces.length; ui('kpiArea').textContent  = estimateArea(mesh).toFixed(1); }
function rebuildLeaf(){ leafMesh = buildLeafMesh(); autoFit(leafMesh, 0.92); updateLeafKPI(leafMesh); }

// CSV I/O for leaf
ui('leafExport').onclick = ()=>{
  const p=leafParams(); const keys=['len','wid','tip']; const headers=keys.join(',');
  const row=[p.len,p.wid,p.tip].join(',');
  const blob = new Blob([headers+'\n'+row], {type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leaf_params.csv'; a.click(); URL.revokeObjectURL(a.href);
};
ui('leafImport').addEventListener('change', (e)=>{
  const f=e.target.files?.[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const lines=String(r.result).trim().split(/\r?\n/); if(lines.length<2) throw new Error('空白 CSV');
    const vals=lines[1].split(','); ui('leafLen').value=parseFloat(vals[0]); ui('leafWid').value=parseFloat(vals[1]); ui('leafTip').value=parseFloat(vals[2]);
    leafParams(); rebuildLeaf(); info('已匯入葉片參數'); }catch(err){ alert('匯入錯誤：'+err.message); } };
  r.readAsText(f);
});

['leafLen','leafWid','leafTip'].forEach(id=> ui(id).addEventListener('input', ()=>{ leafParams(); rebuildLeaf(); }));
ui('btnRebuildLeaf').onclick = rebuildLeaf;
ui('btnFitLeaf').onclick = ()=>{ if(leafMesh) autoFit(leafMesh,0.92); };
ui('btnResetLeaf').onclick = ()=>{ dist=2.0; yaw=0.25; pitch=0.16; if(leafMesh) autoFit(leafMesh,0.92); };
ui('btnToTree').onclick = ()=>{ switchTab('tree'); buildTree(true); };

// ===== Scene 2: Tree (branches + instanced leaves projected) =====
const treeUI = { preset: ui('treePreset'), H: ui('treeH'), R: ui('crownR'), levels: ui('levels'), spread: ui('spread'), lean: ui('lean'), count: ui('leafCount'), shape: ui('shape') };
const treeLbl = { preset: ui('valPreset'), H: ui('valTreeH'), R: ui('valCrownR'), levels: ui('valLevels'), spread: ui('valSpread'), lean: ui('valLean'), count: ui('valLeafCount'), shape: ui('valShape') };
const TREE_PRESETS = {
  maple:  { H:5.0, R:3.2, levels:16, spread:85,  lean:0,   shape:'sphere', child:3, prune:0.04, tipJ:0.05 },
  oak:    { H:6.0, R:3.8, levels:18, spread:80,  lean:0,   shape:'sphere', child:3, prune:0.05, tipJ:0.06 },
  pine:   { H:8.0, R:2.6, levels:20, spread:45,  lean:0,   shape:'cone',   child:2, prune:0.03, tipJ:0.03 },
  willow: { H:5.0, R:3.5, levels:17, spread:100, lean:4,   shape:'vase',   child:3, prune:0.06, tipJ:0.08 },
  banyan: { H:7.0, R:4.5, levels:22, spread:95,  lean:0,   shape:'sphere', child:4, prune:0.05, tipJ:0.07 }
};
function syncTreeLabels(){
  treeLbl.preset.textContent = treeUI.preset.options[treeUI.preset.selectedIndex].text;
  treeLbl.H.textContent = treeUI.H.value+' m'; treeLbl.R.textContent = treeUI.R.value+' m'; treeLbl.levels.textContent = treeUI.levels.value;
  treeLbl.spread.textContent = treeUI.spread.value+'°'; treeLbl.lean.textContent = treeUI.lean.value+'°'; 
  treeLbl.count.textContent = treeUI.count.value; treeLbl.shape.textContent = {'sphere':'球形','cone':'圓錐','vase':'花瓶'}[treeUI.shape.value];
}
;['H','R','levels','spread','lean','count'].forEach(k=> treeUI[k].addEventListener('input', ()=>{ syncTreeLabels(); buildTree(false); }));
treeUI.shape.addEventListener('change', ()=>{ syncTreeLabels(); buildTree(false); });
treeUI.preset.addEventListener('change', ()=>{ applyTreePreset(treeUI.preset.value); buildTree(true); });
function applyTreePreset(key){
  const p=TREE_PRESETS[key]||TREE_PRESETS.maple;
  treeUI.H.value=p.H; treeUI.R.value=p.R; treeUI.levels.value=p.levels; treeUI.spread.value=p.spread; treeUI.lean.value=p.lean; treeUI.shape.value=p.shape;
  if(parseInt(treeUI.count.value||2000) > 30000) treeUI.count.value=30000;
  syncTreeLabels();
}
ui('btnBuildTree').onclick = ()=> buildTree(true);
ui('btnClearTree').onclick = ()=> { tree = null; leaves=null; info('已清除樹'); };
ui('btnFitTree').onclick = ()=> requestFit();

// Tree internal
let tree=null, leaves=null;
function buildTree(fit=false){
  // make sure leaf exists
  if(!leafMesh) rebuildLeaf();
  // generate branches
  const H=parseFloat(treeUI.H.value), levels=Math.min(30, parseInt(treeUI.levels.value)), spread=parseFloat(treeUI.spread.value)*Math.PI/180;
  const lean=parseFloat(treeUI.lean.value)*Math.PI/180; const preset=TREE_PRESETS[treeUI.preset.value]||TREE_PRESETS.maple;
  const CHILD = preset.child, PRUNE = preset.prune, TIPJ=preset.tipJ;
  const branches=[], queue=[]; const base=[0,0,0];
  const trunkDir=[Math.sin(lean), Math.cos(lean), 0]; // normalized approx
  const trunkLen=H*0.7;
  const trunkTop=[base[0]+trunkDir[0]*trunkLen, base[1]+trunkDir[1]*trunkLen, base[2]+trunkDir[2]*trunkLen];
  queue.push({a:base, b:trunkTop, dir:trunkDir.slice(), len:H*0.5, lvl:1});
  const LEN_DECAY=0.75;
  while(queue.length && branches.length < 20000){
    const cur=queue.shift(); branches.push({a:cur.a, b:cur.b});
    if(cur.lvl>=levels) continue;
    for(let c=0;c<CHILD;c++){
      if(Math.random() < (PRUNE + 0.01*cur.lvl)) continue;
      const angA = (c - (CHILD-1)/2) * (spread/(CHILD-1||1));
      const angY = (Math.random()*Math.PI*2);
      const tilt=[Math.cos(angY)*Math.sin(angA), Math.cos(angA), Math.sin(angY)*Math.sin(angA)];
      const newDir=[ cur.dir[0]*0.3 + tilt[0]*0.7, cur.dir[1]*0.3 + tilt[1]*0.7, cur.dir[2]*0.3 + tilt[2]*0.7 ];
      const len=cur.len*(LEN_DECAY + 0.03*Math.random());
      const nb=[ cur.b[0]+newDir[0]*len, cur.b[1]+newDir[1]*len, cur.b[2]+newDir[2]*len ];
      nb[0] += (Math.random()-0.5)*len*TIPJ; nb[2] += (Math.random()-0.5)*len*TIPJ;
      queue.push({a:cur.b.slice(), b:nb, dir:newDir, len:len, lvl:cur.lvl+1});
      if(queue.length + branches.length >= 20000) break;
    }
  }
  // leaves from branch tips region
  const count = Math.min(30000, parseInt(treeUI.count.value));
  const leafPts = new Array(count);
  for(let i=0;i<count;i++){
    const s = branches[(Math.random()*branches.length)|0];
    const t = 0.55 + Math.pow(Math.random(),4)*0.45;
    const pos=[ s.a[0] + (s.b[0]-s.a[0])*t, s.a[1] + (s.b[1]-s.a[1])*t, s.a[2] + (s.b[2]-s.a[2])*t ];
    const rad = (0.035 + 0.11*Math.random());
    const ang = Math.random()*Math.PI*2;
    pos[0] += Math.cos(ang)*rad; pos[2] += Math.sin(ang)*rad; pos[1] += (Math.random()-0.5)*0.05;
    leafPts[i] = {p:pos, r: (0.7 + Math.random()*0.7), rot:[(Math.random()-0.5)*0.6,(Math.random()-0.5)*Math.PI,(Math.random()-0.5)*0.6], c: hsl2rgb(0.28 + 0.10*Math.random()*0.3, 0.75, 0.48)};
  }
  tree = {branches, shape:treeUI.shape.value, H, R:parseFloat(treeUI.R.value)};
  leaves = {pts:leafPts};
  if(fit) requestFit();
  info(`樹生成：枝數 ${branches.length}，葉片 ${count}`);
}
function drawTree(){
  if(!tree) return;
  // draw branches as simple segments (dark)
  ctx.strokeStyle='#4a3a2a'; ctx.lineWidth=2;
  for(const s of tree.branches){
    const a=project(s.a), b=project(s.b);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  // draw leaves as small triangles from leafMesh footprint, colored per leaf pts
  if(leaves && leafMesh){
    for(const it of leaves.pts){
      // take a few triangles from leafMesh silhouette for a cheap sprite
      const base = it.p;
      // choose one representative triangle (center strip)
      const f = leafMesh.faces[(leafMesh.faces.length*0.6)|0];
      const v0 = leafMesh.verts[f[0]], v1 = leafMesh.verts[f[1]], v2 = leafMesh.verts[f[2]];
      const s = it.r * 0.6;
      const tri = [
        [ base[0] + v0[0]*s, base[1] + v0[1]*s, base[2] + v0[2]*s ],
        [ base[0] + v1[0]*s, base[1] + v1[1]*s, base[2] + v1[2]*s ],
        [ base[0] + v2[0]*s, base[1] + v2[1]*s, base[2] + v2[2]*s ]
      ];
      const p0=project(tri[0]), p1=project(tri[1]), p2=project(tri[2]);
      const c = it.c; ctx.fillStyle=`rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})`;
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.closePath(); ctx.fill();
    }
  }
}

// CSV I/O for tree
ui('treeExport').onclick = ()=>{
  const keys=['preset','H','R','levels','spread','lean','shape','leafCount'];
  const row=[ treeUI.preset.value, treeUI.H.value, treeUI.R.value, treeUI.levels.value, treeUI.spread.value, treeUI.lean.value, treeUI.shape.value, treeUI.count.value ].join(',');
  const blob=new Blob([keys.join(',')+'\n'+row],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='treeStructure.csv'; a.click(); URL.revokeObjectURL(a.href);
};
ui('treeImport').addEventListener('change', (e)=>{
  const f=e.target.files?.[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const lines=String(r.result).trim().split(/\r?\n/); if(lines.length<2) throw new Error('空白 CSV');
    const vals=lines[1].split(','); treeUI.preset.value=vals[0]; treeUI.H.value=vals[1]; treeUI.R.value=vals[2];
    treeUI.levels.value=vals[3]; treeUI.spread.value=vals[4]; treeUI.lean.value=vals[5]; treeUI.shape.value=vals[6]; treeUI.count.value=vals[7];
    syncTreeLabels(); buildTree(true); info('已匯入樹形參數'); }catch(err){ alert('匯入錯誤：'+err.message); } };
  r.readAsText(f);
});

// ===== Scene 3: Fall =====
const fallUI = { rate: ui('fallRate'), regrow: ui('regrow'), wind: ui('windAmp'), turb: ui('turb'), maxActive: ui('maxActive') };
const fallLbl = { rate: ui('valFallRate'), regrow: ui('valRegrow'), wind: ui('valWind'), turb: ui('valTurb'), maxActive: ui('valMaxActive') };
function syncFallLabels(){ fallLbl.rate.textContent=fallUI.rate.value+'×'; fallLbl.regrow.textContent=fallUI.regrow.value+'×'; fallLbl.wind.textContent=fallUI.wind.value; fallLbl.turb.textContent=fallUI.turb.value; fallLbl.maxActive.textContent=fallUI.maxActive.value; }
;['rate','regrow','wind','turb','maxActive'].forEach(k=> fallUI[k].addEventListener('input', syncFallLabels));
syncFallLabels();
ui('btnStartFall').onclick = ()=>{ startFall(); switchTab('fall'); };
ui('btnStopFall').onclick   = ()=>{ runningFall=false; };
ui('btnResetFall').onclick  = ()=>{ resetFall(); };
ui('btnFitFall').onclick    = ()=>{ requestFit(); };

let runningFall=false, fallTime=0, windTime=0;
let fallState=null; // per-leaf: {phase, state, vel:[3], ang:[3], pos:[3]}
function ensureFallState(){
  if(!leaves || !leaves.pts) return;
  fallState = leaves.pts.map((it)=>({ phase:0, state:0, vel:[0,0,0], ang:[0,0,0], pos:it.p.slice(), col:it.c.slice() }));
}
function startFall(){
  if(!leaves) buildTree(true);
  ensureFallState();
  runningFall=true; fallTime=0; windTime=0;
}
function resetFall(){
  if(!leaves || !fallState) return;
  for(let i=0;i<fallState.length;i++){ const st=fallState[i]; st.phase=0; st.state=0; st.vel=[0,0,0]; st.ang=[0,0,0]; st.pos = leaves.pts[i].p.slice(); st.col = [0.2,0.7,0.4]; }
  runningFall=false; fallTime=0; windTime=0; info('落葉狀態已重置');
}

function nrand(x,y,z){ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return s-Math.floor(s); }
function smoothNoise3(x,y,z){ const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z); const xf=x-xi, yf=y-yi, zf=z-zi; function fade(t){return t*t*(3-2*t)}
  let n000=nrand(xi,yi,zi), n100=nrand(xi+1,yi,zi), n010=nrand(xi,yi+1,zi), n110=nrand(xi+1,yi+1,zi); let n001=nrand(xi,yi,zi+1), n101=nrand(xi+1,yi,zi+1), n011=nrand(xi,yi+1,zi+1), n111=nrand(xi+1,yi+1,zi+1);
  const u=fade(xf), v=fade(yf), w=fade(zf);
  const x00=(n000*(1-u)+n100*u), x10=(n010*(1-u)+n110*u), x01=(n001*(1-u)+n101*u), x11=(n011*(1-u)+n111*u);
  const y0=(x00*(1-v)+x10*v), y1=(x01*(1-v)+x11*v);
  return y0*(1-w)+y1*w;
}
function windAt(x,y,z){
  const A=parseFloat(fallUI.wind.value), T=parseFloat(fallUI.turb.value);
  const baseDir = Math.sin(windTime*0.07)*15 * Math.PI/180;
  const baseX=Math.cos(baseDir)*A, baseZ=Math.sin(baseDir)*A;
  const n1 = smoothNoise3((x*0.25)+windTime*0.8, (z*0.25)-windTime*0.6, 0);
  const n2 = smoothNoise3((-x*0.2)+windTime*0.5, (y*0.25)+windTime*0.6, 1);
  return [ baseX + T*(n1-0.5), 0.3*T*(n2-0.5), baseZ + T*(n2-0.5) ];
}
function stepFall(){
  if(!leaves || !fallState) return;
  const rate=parseFloat(fallUI.rate.value), reg=parseFloat(fallUI.regrow.value), maxAct=parseInt(fallUI.maxActive.value);
  windTime += 0.01;

  // attach: color phase
  let actCount = fallState.filter(s=>s.state===1).length;
  for(let t=0;t<300;t++){
    const i=(Math.random()*fallState.length)|0; const s=fallState[i]; if(s.state!==0) continue;
    const hgt = Math.max(0, Math.min(1, (s.pos[1]/( (tree?.H)||5 )) ));
    const dphi = 0.0008*(1+0.6*hgt) + 0.0005*parseFloat(fallUI.turb.value);
    s.phase = Math.min(2.0, s.phase + dphi*rate);
    // recolor
    let c;
    if(s.phase<1) c=hsl2rgb(0.16 + 0.10*s.phase, 0.7, 0.5 + 0.2*(1-s.phase));
    else          c=hsl2rgb(0.04 + 0.02*(s.phase-1), 0.8, 0.55 - 0.1*(s.phase-1));
    s.col = c;
    if(s.phase>1.05 && actCount<maxAct){ s.state=1; actCount++; const w=windAt(s.pos[0],s.pos[1],s.pos[2]); s.vel=[ (Math.random()-0.5)*0.05 + 0.003*w[0], -0.02, (Math.random()-0.5)*0.05 + 0.003*w[2] ]; s.ang=[(Math.random()-0.5)*1.2,(Math.random()-0.5)*0.8,(Math.random()-0.5)*1.2]; }
  }

  // falling
  for(let i=0;i<fallState.length;i++){
    const s=fallState[i]; if(s.state!==1) continue;
    const w=windAt(s.pos[0],s.pos[1],s.pos[2]);
    // parameters from leaf
    const L=(parseFloat(ui('leafLen').value)/100), W=(parseFloat(ui('leafLen').value)*parseFloat(ui('leafWid').value)/100);
    const area=L*W, curlK=1; const Cd=0.8*curlK;
    s.vel[1] += (-0.0022*rate);
    const v2 = s.vel[0]*s.vel[0]+s.vel[1]*s.vel[1]+s.vel[2]*s.vel[2];
    s.vel[0] += -Cd*area*Math.max(0,v2)*s.vel[0] + (w[0]*0.002*rate) - 0.002*s.vel[0];
    s.vel[2] += -Cd*area*Math.max(0,v2)*s.vel[2] + (w[2]*0.002*rate) - 0.002*s.vel[2];
    s.vel[1] += (w[1]*0.001*rate) - 0.001*s.vel[1];
    // little zigzag
    s.vel[0] += Math.sin(windTime*3 + i*0.37) * 0.005 * (1 + 0.6*(parseFloat(ui('leafWid').value)));
    // integrate
    s.pos[0]+=s.vel[0]; s.pos[1]+=s.vel[1]; s.pos[2]+=s.vel[2];
    if(s.pos[1]<=0){ s.pos[1]=0; s.state=2; s.vel=[0,0,0]; s.phase=Math.max(s.phase,1.6); }
  }

  // regrow: raise fallen leaves upward and reset
  if(reg>0){
    let quota=300;
    for(const s of fallState){
      if(quota<=0) break;
      if(s.state===2){
        s.pos[1]+= 0.03*reg;
        if(s.pos[1]> (Math.random()*((tree?.H)||5)) ){ s.state=0; s.phase=0; s.col=hsl2rgb(0.28,0.75,0.48); quota--; }
      }
    }
  }
}

function drawFall(){
  if(!leaves || !fallState || !leafMesh) return;
  // draw ground pile shaded rectangle to hint accumulation
  ctx.fillStyle='rgba(255,165,0,0.08)';
  const g0=project([-2,0,-2]), g1=project([2,0,2]);
  ctx.fillRect(Math.min(g0.x,g1.x), Math.min(g0.y,g1.y), Math.abs(g1.x-g0.x), Math.abs(g1.y-g0.y));

  // draw every leaf as tiny triangle sample with current color
  const f = leafMesh.faces[(leafMesh.faces.length*0.6)|0];
  const v0 = leafMesh.verts[f[0]], v1 = leafMesh.verts[f[1]], v2 = leafMesh.verts[f[2]];
  for(let i=0;i<fallState.length;i++){
    const s=fallState[i]; const sc= (leaves.pts[i].r || 1)*0.6;
    const tri = [
      [ s.pos[0] + v0[0]*sc, s.pos[1] + v0[1]*sc, s.pos[2] + v0[2]*sc ],
      [ s.pos[0] + v1[0]*sc, s.pos[1] + v1[1]*sc, s.pos[2] + v1[2]*sc ],
      [ s.pos[0] + v2[0]*sc, s.pos[1] + v2[1]*sc, s.pos[2] + v2[2]*sc ]
    ];
    const p0=project(tri[0]), p1=project(tri[1]), p2=project(tri[2]);
    const c=s.col; ctx.fillStyle=`rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})`;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.closePath(); ctx.fill();
  }
}

// ===== Tabs =====
function switchTab(name){
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.sect').forEach(s=> s.classList.remove('show'));
  if(name==='leaf'){ document.getElementById('sect-leaf').classList.add('show'); requestFit(); }
  if(name==='tree'){ document.getElementById('sect-tree').classList.add('show'); requestFit(); }
  if(name==='fall'){ document.getElementById('sect-fall').classList.add('show'); requestFit(); }
}
document.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));

// ===== Render Loop =====
let needFit=true;
function requestFit(){ needFit=true; }
function loop(){
  clear();
  const active = document.querySelector('.tab.active')?.dataset.tab || 'leaf';
  if(active==='leaf'){ if(leafMesh) drawMesh(leafMesh); }
  if(active==='tree'){ drawTree(); }
  if(active==='fall'){ drawTree(); if(runningFall){ stepFall(); } drawFall(); }
  if(needFit){
    if(active==='leaf' && leafMesh) autoFit(leafMesh,0.92);
    if(active!=='leaf' && tree){ // center tree by height & crown
      target=[0, tree.H*0.45, 0];
      dist = Math.max(2.0, tree.H*0.9);
      yaw=0.35; pitch=0.22;
    }
    needFit=false;
  }
  requestAnimationFrame(loop);
}

// ===== Init =====
function init(){
  resize();
  leafParams(); rebuildLeaf();
  applyTreePreset('maple'); syncTreeLabels(); buildTree(true);
  syncFallLabels();
  loop();
  info('v0.81s：離線合併完成（可見性保險已啟用）');
}
init();
</script>
