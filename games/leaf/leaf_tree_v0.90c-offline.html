<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Leaf→Tree→Fall v0.90c-offline（修正主畫面為黑的問題）</title>
<style>
  :root{--bg:#0b1020;--panel:#0c1324;--ink:#eaf2ff;--muted:#9fb0c9}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans TC",Segoe UI,Roboto}
  .app{display:grid;grid-template-columns:1fr 420px;height:100%}
  #stageWrap{position:relative;height:100%;background:#0b1020}
  /* 關鍵修正：讓畫布填滿舞台，且在最上層可見 */
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  aside.panel{height:100%;overflow:auto;background:linear-gradient(180deg,#0c1324,#0a0f1b 60%);border-left:1px solid #1f2937;padding:14px 16px 120px}
  h2{font-size:14px;margin:10px 0 8px;color:#cfe4d6}
  .sec{border:1px solid #1f2937;border-radius:12px;padding:10px;margin:10px 0}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:6px 0}
  .lbl{font-size:12px;color:var(--muted)}
  .val{font-size:12px}
  input[type=range]{width:100%}
  select,button{padding:8px 10px;border-radius:10px;background:#0e1729;border:1px solid #263142;color:#e2e8f0;cursor:pointer}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
  .card{border:1px solid #1f2937;border-radius:12px;padding:8px;text-align:center}
  .hide{display:none}
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .on{background:#17314e}
  .hint{font-size:12px;color:#93a1b5}
</style>
</head>
<body>
<div class="app">
  <div id="stageWrap">
    <canvas id="cv"></canvas>
  </div>
  <aside class="panel">
    <div class="sec">
      <div class="tabs">
        <button id="tab1" class="on">場景一：葉片（0.752 離線）</button>
        <button id="tab2">場景二：樹形（離線輕量）</button>
        <button id="tab3">場景三：落葉（離線模擬）</button>
      </div>
      <div class="hint" style="margin-top:8px">此為完全離線單檔，不依賴任何外部庫。若仍出現黑畫面，請回報瀏覽器與平台。</div>
    </div>

    <div id="p1" class="sec">
      <h2>場景一：葉片（0.752 規格）</h2>
      <div class="kpi">
        <div class="card"><b id="kpiArea">—</b><div class="hint">葉面積 m²</div></div>
        <div class="card"><b id="kpiVerts">—</b><div class="hint">頂點</div></div>
        <div class="card"><b id="kpiFaces">—</b><div class="hint">面數</div></div>
        <div class="card"><b id="kpiFPS1">—</b><div class="hint">FPS</div></div>
      </div>
      <div class="row"><label class="lbl">葉形</label>
        <select id="leafShape">
          <option value="ellipse" selected>橢圓</option>
          <option value="ovate">卵形</option>
          <option value="lanceolate">披針形</option>
          <option value="cordate">心形</option>
        </select>
      </div>
      <div class="row"><label class="lbl">葉長 (m)</label><span class="val" id="valLen">0.20</span></div>
      <input id="leafLen" type="range" min="0.06" max="0.40" step="0.01" value="0.20"/>
      <div class="row"><label class="lbl">葉寬 (m)</label><span class="val" id="valWid">0.10</span></div>
      <input id="leafWid" type="range" min="0.03" max="0.25" step="0.005" value="0.10"/>
      <div class="row"><label class="lbl">厚度 (m)</label><span class="val" id="valThk">0.0015</span></div>
      <input id="leafThk" type="range" min="0.0005" max="0.0035" step="0.0001" value="0.0015"/>
      <div class="row"><label class="lbl">葉尖收斂</label><span class="val" id="valTip">0.35</span></div>
      <input id="leafTip" type="range" min="0" max="1" step="0.01" value="0.35"/>
      <div class="row"><label class="lbl">葉柄半徑 ≈ 厚度 ×</label><span class="val" id="valPet">2.5</span></div>
      <input id="petMul" type="range" min="1.5" max="4" step="0.1" value="2.5"/>
      <div class="row"><label class="lbl">捲曲度（橫向）</label><span class="val" id="valCX">0</span></div>
      <input id="curveX" type="range" min="0" max="0.3" step="0.01" value="0"/>
      <div class="row"><label class="lbl">扭轉度（縱向）</label><span class="val" id="valTY">0</span></div>
      <input id="twistY" type="range" min="0" max="1.0" step="0.02" value="0"/>
      <div class="row"><label class="lbl">波浪幅度</label><span class="val" id="valWA">0</span></div>
      <input id="waveAmp" type="range" min="0" max="0.06" step="0.002" value="0"/>
      <div class="row"><label class="lbl">波浪頻率</label><span class="val" id="valWF">0</span></div>
      <input id="waveFreq" type="range" min="0" max="20" step="1" value="0"/>
      <div class="row"><label class="lbl">非對稱度</label><span class="val" id="valASY">0</span></div>
      <input id="asym" type="range" min="0" max="0.5" step="0.01" value="0"/>
    </div>

    <div id="p2" class="sec hide">
      <h2>場景二：樹形（輕量渲染）</h2>
      <div class="kpi">
        <div class="card"><b id="kpiBranches">—</b><div class="hint">枝段數</div></div>
        <div class="card"><b id="kpiLeaves">—</b><div class="hint">葉片數</div></div>
        <div class="card"><b id="kpiFPS2">—</b><div class="hint">FPS</div></div>
        <div class="card"><b id="kpiHeight">—</b><div class="hint">樹高 m</div></div>
      </div>
      <div class="row"><label class="lbl">樹型預設</label>
        <select id="preset">
          <option value="maple" selected>楓</option>
          <option value="oak">橡</option>
          <option value="pine">松</option>
          <option value="willow">柳</option>
          <option value="banyan">榕</option>
        </select>
      </div>
      <div class="row"><label class="lbl">外觀</label>
        <select id="form">
          <option value="rounded">圓傘</option>
          <option value="oval" selected>橢圓</option>
          <option value="columnar">柱形</option>
          <option value="vase">花瓶</option>
          <option value="conical">圓錐</option>
          <option value="flatTop">扁頂</option>
          <option value="weeping">垂枝</option>
          <option value="spreading">擴張</option>
        </select>
      </div>
      <div class="row"><label class="lbl">冠幅 (m)</label><span class="val" id="valCR">3.0</span></div>
      <input id="crownR" type="range" min="1" max="8" step="0.1" value="3.0"/>
      <div class="row"><label class="lbl">冠高 (m)</label><span class="val" id="valCH">4.5</span></div>
      <input id="crownH" type="range" min="1" max="12" step="0.1" value="4.5"/>
      <div class="row"><label class="lbl">分枝層數 5–30（預設 15）</label><span class="val" id="valOrder">15</span></div>
      <input id="maxOrder" type="range" min="5" max="30" step="1" value="15"/>
      <div class="row"><label class="lbl">平均分枝角 (°)</label><span class="val" id="valAng">35</span></div>
      <input id="branchAngle" type="range" min="10" max="75" step="1" value="35"/>
      <div class="row"><label class="lbl">角度變異</label><span class="val" id="valAngV">8</span></div>
      <input id="branchAngleVar" type="range" min="0" max="30" step="1" value="8"/>
      <div class="row"><label class="lbl">節間長 (m)</label><span class="val" id="valIN">0.22</span></div>
      <input id="internode" type="range" min="0.05" max="0.60" step="0.01" value="0.22"/>
      <div class="row"><label class="lbl">葉片數（50–30000）</label><span class="val" id="valLC">200</span></div>
      <input id="leafCount" type="range" min="50" max="30000" step="50" value="200"/>
    </div>

    <div id="p3" class="sec hide">
      <h2>場景三：落葉（完全離線）</h2>
      <div class="kpi">
        <div class="card"><b id="kpiActive">—</b><div class="hint">模擬葉片</div></div>
        <div class="card"><b id="kpiGrounded">—</b><div class="hint">已落地</div></div>
        <div class="card"><b id="kpiFPS3">—</b><div class="hint">FPS</div></div>
        <div class="card"><b id="kpiWind">—</b><div class="hint">風速</div></div>
      </div>
      <div class="row"><label class="lbl">落葉倍率 (0.1×–20×)</label><span class="val" id="valFR">1×</span></div>
      <input id="fallRate" type="range" min="0.1" max="20" step="0.1" value="1"/>
      <div class="row"><label class="lbl">再長回速度 (0×–20×)</label><span class="val" id="valRG">0×</span></div>
      <input id="regrowRate" type="range" min="0" max="20" step="0.1" value="0"/>
    </div>
  </aside>
</div>

<script>
/* ====== Minimal 3D engine (Canvas 2D + perspective) ====== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0, DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  const r=cv.parentElement.getBoundingClientRect(); // 用父層大小，不用自身，避免初始 0
  W=Math.max(300, r.width|0); H=Math.max(300, r.height|0);
  cv.width=(W*DPR)|0; cv.height=(H*DPR)|0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

// Simple orbit camera
let yaw=0.9, pitch=0.5, dist=2.2, target=[0,0.8,0];
cv.addEventListener('wheel', e=>{ e.preventDefault(); dist=Math.max(0.5, Math.min(50, dist*(1+Math.sign(e.deltaY)*0.1))); }, {passive:false});
let dragging=false, lx=0, ly=0;
cv.addEventListener('mousedown', e=>{dragging=true; lx=e.clientX; ly=e.clientY;});
addEventListener('mouseup', ()=>dragging=false);
addEventListener('mousemove', e=>{ if(!dragging) return; const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; yaw+=dx*0.005; pitch+=dy*0.004; pitch=Math.max(-1.2,Math.min(1.2,pitch)); });

function lookAt(){
  const cx = target[0] + dist*Math.cos(pitch)*Math.cos(yaw);
  const cy = target[1] + dist*Math.sin(pitch);
  const cz = target[2] + dist*Math.cos(pitch)*Math.sin(yaw);
  return {eye:[cx,cy,cz]};
}
function project(pt){
  const cam=lookAt().eye;
  const vx=pt[0]-cam[0], vy=pt[1]-cam[1], vz=pt[2]-cam[2];
  const sy=Math.sin(-yaw), cy=Math.cos(-yaw);
  const sp=Math.sin(-pitch), cp=Math.cos(-pitch);
  let x=vx*cy - vz*sy;
  let z=vx*sy + vz*cy;
  let y=vy*cp - z*sp; z=vy*sp + z*cp;
  const f=1.2; const s=f/(z+f+0.0001);
  return {x: W*0.5 + x*s*W*0.6, y: H*0.6 - y*s*H*0.6, z:z};
}

/* ====== Scene state ====== */
const ui = (id)=>document.getElementById(id);
function label(id,v){ const el=ui(id); if(el) el.textContent=v; }

/*** Leaf geometry (0.752) ***/
function shapeWidthProfile(kind,t,asym){
  switch(kind){
    case 'ovate': return Math.max(0,1.2*t*(1-0.4*t)-0.1*asym);
    case 'lanceolate': return Math.max(0,0.6+0.6*(1-Math.pow(2*t-1,2))-0.2*t);
    case 'cordate': return Math.max(0,1.1*Math.sin(Math.min(1,t)*Math.PI*0.9)+0.1*(0.5-t));
    default: return Math.sqrt(Math.max(0,1-Math.pow(2*t-1,2)));
  }
}
function leafParams(){
  const p={
    leafShape: ui('leafShape').value,
    len: parseFloat(ui('leafLen').value),
    wid: parseFloat(ui('leafWid').value),
    thk: parseFloat(ui('leafThk').value),
    tip: parseFloat(ui('leafTip').value),
    pet: parseFloat(ui('petMul').value),
    cx: parseFloat(ui('curveX').value),
    ty: parseFloat(ui('twistY').value),
    wa: parseFloat(ui('waveAmp').value),
    wf: parseFloat(ui('waveFreq').value),
    asy: parseFloat(ui('asym').value)
  };
  label('valLen',p.len.toFixed(2)); label('valWid',p.wid.toFixed(3)); label('valThk',p.thk.toFixed(4)); label('valTip',p.tip.toFixed(2));
  label('valPet',p.pet.toFixed(1)); label('valCX',p.cx.toFixed(2)); label('valTY',p.ty.toFixed(2)); label('valWA',p.wa.toFixed(3)); label('valWF',p.wf.toFixed(0)); label('valASY',p.asy.toFixed(2));
  return p;
}
function buildLeafMesh(p){
  const segU=24, segV=44;
  const verts=[], faces=[], cols=[];
  for(let j=0;j<=segV;j++){
    const y=j/segV;
    const w=p.wid*(1-p.tip*y);
    const halfW=0.5*w*shapeWidthProfile(p.leafShape,y,p.asy);
    const wav=p.wa*Math.sin(y*Math.PI*p.wf);
    for(let i=0;i<=segU;i++){
      let sx = (i/segU-0.5)*2;
      let x = Math.sign(sx)*(halfW+wav)*Math.abs(sx);
      let axial=p.len*y;
      const bendZ=p.cx*(1-Math.pow(1-y,2))*(1-(Math.abs(sx)));
      const tw=p.ty*(y-0.5); const c=Math.cos(tw), s=Math.sin(tw);
      const X = x*c; const Z = x*s + bendZ; const Y=axial;
      verts.push([X,Y,Z]);
      cols.push([0.6+0.1*y,0.85-0.1*y,0.5-0.05*y]);
    }
  }
  for(let j=0;j<segV;j++){
    for(let i=0;i<segU;i++){
      const a=j*(segU+1)+i, b=a+1, c=a+segU+1, d=c+1;
      faces.push([a,b,d],[a,d,c]);
    }
  }
  // petiole prism
  const pl=Math.max(0.04,0.18*p.len);
  const pr=p.thk*p.pet;
  const base=[[ -pr,0,0],[ pr,0,0],[ pr,-pl,0],[ -pr,-pl,0]];
  const off = verts.length;
  for(const v of base) verts.push(v);
  faces.push([off,off+1,off+2],[off,off+2,off+3]);
  for(let k=0;k<4;k++) cols.push([0.55,0.45,0.35]);
  return {verts,faces,cols, segU, segV};
}

/*** Tree (lightweight) ***/
let segCache=[]; // for scene3 leaves
function buildTreeStructure(params, leafMesh){
  segCache.length=0;
  const branches=[];
  const trunkH=params.crownH;
  const internode=params.internode;
  const trunkSegs=Math.ceil(trunkH/internode);
  const angleMean=params.branchAngle*Math.PI/180, angleVar=params.branchAngleVar*Math.PI/180;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  function spawnBranch(origin,order,yawBase){
    if(order>params.maxOrder || segCache.length>12000) return;
    const segN=2+Math.floor((params.crownR+params.crownH)*0.8*Math.random()+1);
    let cur=origin.slice(); let yaw=yawBase;
    for(let s=0;s<segN;s++){
      const len=rnd(internode*0.7,internode*1.2);
      const ang=angleMean + rnd(-angleVar, angleVar);
      yaw += rnd(0.7,2.2);
      const up=[0,1,0]; const right=[Math.cos(yaw),0,Math.sin(yaw)];
      const dir=[ right[0]*Math.sin(ang)+up[0]*Math.cos(ang),
                  right[1]*Math.sin(ang)+up[1]*Math.cos(ang),
                  right[2]*Math.sin(ang)+up[2]*Math.cos(ang) ];
      const relH=clamp(cur[1]/params.crownH,0,1);
      let nxt=[ cur[0]+dir[0]*len, cur[1]+dir[1]*len, cur[2]+dir[2]*len ];
      const radAtY=params.crownR*(params.form==='conical'?(1-relH):params.form==='vase'?(0.6+0.8*relH):params.form==='spreading'?(1.2-0.2*relH):1.0);
      const rxy=Math.hypot(nxt[0],nxt[2]); if(rxy>radAtY){ const k=radAtY/(rxy+1e-6); nxt[0]*=k; nxt[2]*=k; }
      nxt[1]=clamp(nxt[1],0,params.crownH);
      branches.push([cur.slice(),nxt.slice(),order]);
      segCache.push({pos:nxt.slice(), order});
      cur=nxt;
      if(segCache.length>12000) break;
    }
    if(order<params.maxOrder){
      const childN=(params.form==='weeping'||params.form==='tiered')?2:1+Math.floor(Math.random()*2);
      for(let c=0;c<childN;c++) spawnBranch(cur,order+1,Math.random()*Math.PI*2);
    }
  }
  for(let i=1;i<=trunkSegs;i++){
    const y=i*internode; if(y>trunkH) break;
    if(Math.random()<0.8) spawnBranch([0,y,0],1,Math.random()*Math.PI*2);
  }
  // leaves
  const totalLeaves = Math.max(50, Math.min( parseInt(ui('leafCount').value||200,10), 30000 ));
  const spacing=Math.max(1, Math.floor(segCache.length/Math.max(totalLeaves,1)));
  const bb = leafBillboardFromMesh(leafMesh);
  const leaves=[];
  for(let i=0;i<totalLeaves;i++){
    const j=(i*spacing)%segCache.length; const seg=segCache[j]||{pos:[0,1,0],order:1};
    const pos=[ seg.pos[0]+(Math.random()*0.24-0.12), seg.pos[1]+(Math.random()*0.24-0.12), seg.pos[2]+(Math.random()*0.24-0.12) ];
    const yaw=Math.random()*Math.PI*2, pitch = -0.6 + Math.random()*0.8;
    leaves.push({pos,yaw,pitch,scale: Math.pow(0.93, seg.order)*(0.85+0.35*Math.random()) , bb});
  }
  return {branches, leaves, height:trunkH};
}
function leafBillboardFromMesh(leafMesh){
  const p = leafParams();
  const hw = p.wid*0.45, hh = p.len*0.45;
  return [[-hw,0,0],[hw,0,0],[hw,p.len*0.9,0],[-hw,p.len*0.9,0]];
}

/*** Fall sim with Perlin ***/
const pperm=new Uint8Array(512); (function(){ const p=new Uint8Array(256); for(let i=0;i<256;i++) p[i]=i; for(let i=255;i>0;i--){ const j=(Math.random()*256)|0; const t=p[i]; p[i]=p[j]; p[j]=t; } for(let i=0;i<512;i++) pperm[i]=p[i&255]; })();
const fade=(t)=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+(b-a)*t;
function grad(h,x,y,z){ const u=(h&1)?-x:x, v=(h&2)?-y:y, w=(h&4)?-z:z; return u+v+w; }
function noise3(x,y,z){ const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255; x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
  const u=fade(x), v=fade(y), w=fade(z); const A=pperm[X]+Y, AA=pperm[A]+Z, AB=pperm[A+1]+Z; const B=pperm[X+1]+Y, BA=pperm[B]+Z, BB=pperm[B+1]+Z;
  return lerp(lerp(lerp(grad(pperm[AA],x,y,z),grad(pperm[BA],x-1,y,z),u), lerp(grad(pperm[AB],x,y-1,z),grad(pperm[BB],x-1,y-1,z),u),v),
              lerp(lerp(grad(pperm[AA+1],x,y,z-1),grad(pperm[BA+1],x-1,y,z-1),u), lerp(grad(pperm[AB+1],x,y-1,z-1),grad(pperm[BB+1],x-1,y-1,z-1),u),v), w);
}

/* ====== Renderers ====== */
function clear(){ ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,W,H); }

function drawLeafMesh(mesh){
  // painter's algorithm
  const facesZ=mesh.faces.map((f,idx)=>{
    const z=(mesh.verts[f[0]][2]+mesh.verts[f[1]][2]+mesh.verts[f[2]][2])/3;
    return {idx,z};
  }).sort((a,b)=>b.z-a.z);
  for(const {idx} of facesZ){
    const f=mesh.faces[idx];
    const pts=f.map(i=>project(mesh.verts[i]));
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    ctx.lineTo(pts[1].x,pts[1].y);
    ctx.lineTo(pts[2].x,pts[2].y);
    ctx.closePath();
    ctx.fillStyle='rgb(160,220,160)';
    ctx.fill();
  }
  // 葉柄畫一條線示意
  const p=leafParams();
  const pl=Math.max(0.04,0.18*p.len);
  const pr=p.thk*p.pet;
  const a=project([ -pr,0,0 ]), b=project([ -pr,-pl,0 ]);
  ctx.strokeStyle='#8b7355'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}

function drawCylinder(p0,p1,r,col){
  const a=project(p0), b=project(p1);
  ctx.strokeStyle=col||'#8b7355';
  ctx.lineWidth=Math.max(1, r*120/dist);
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}
function drawQuadBillboard(center,yaw,pitch,scale,bb,fill){
  const c=Math.cos(yaw), s=Math.sin(yaw);
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const pts=bb.map(v=>{
    let x=v[0]*scale, y=v[1]*scale, z=v[2]*scale;
    let y2=y*cp - z*sp, z2=y*sp + z*cp; y=y2; z=z2;
    let x2=x*c - z*s, z3=x*s + z*c; x=x2; z=z3;
    return project([center[0]+x,center[1]+y,center[2]+z]);
  });
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();
  ctx.fillStyle=fill||'#6fbf6f';
  ctx.fill();
}

/* ====== Scenes ====== */
let scene=1;
function show(n){
  scene=n;
  ui('tab1').classList.toggle('on', n===1);
  ui('tab2').classList.toggle('on', n===2);
  ui('tab3').classList.toggle('on', n===3);
  ui('p1').classList.toggle('hide', n!==1);
  ui('p2').classList.toggle('hide', n!==2);
  ui('p3').classList.toggle('hide', n!==3);
  if(n===2) rebuildTree();
  if(n===3) setupFall();
}
ui('tab1').onclick=()=>show(1);
ui('tab2').onclick=()=>show(2);
ui('tab3').onclick=()=>show(3);

/*** Scene1 data ***/
let leafMesh=null;
function rebuildLeaf(){
  const p=leafParams();
  leafMesh=buildLeafMesh(p);
  const verts=leafMesh.verts.length, faces=leafMesh.faces.length;
  const area=Math.PI*(p.len*0.5)*(p.wid*0.5);
  label('kpiVerts',verts); label('kpiFaces',faces); label('kpiArea',area.toFixed(4));
}
['leafShape','leafLen','leafWid','leafThk','leafTip','petMul','curveX','twistY','waveAmp','waveFreq','asym'].forEach(id=>ui(id).addEventListener('input',()=>{rebuildLeaf(); if(scene===2) rebuildTree(); }));

/*** Scene2 data ***/
let tree=null;
function treeParams(){
  return {
    preset: ui('preset').value,
    form: ui('form').value,
    crownR: parseFloat(ui('crownR').value),
    crownH: parseFloat(ui('crownH').value),
    maxOrder: parseInt(ui('maxOrder').value,10),
    branchAngle: parseFloat(ui('branchAngle').value),
    branchAngleVar: parseFloat(ui('branchAngleVar').value),
    internode: parseFloat(ui('internode').value),
    leafCount: parseInt(ui('leafCount').value,10)
  };
}
function rebuildTree(){
  const p=treeParams();
  label('valCR',p.crownR.toFixed(1)); label('valCH',p.crownH.toFixed(1)); label('valOrder',p.maxOrder);
  label('valAng',p.branchAngle.toFixed(0)); label('valAngV',p.branchAngleVar.toFixed(0)); label('valIN',p.internode.toFixed(2)); label('valLC',p.leafCount);
  if(!leafMesh) rebuildLeaf();
  tree = buildTreeStructure(p, leafMesh);
  label('kpiBranches',tree.branches.length); label('kpiLeaves',tree.leaves.length); label('kpiHeight', p.crownH.toFixed(2));
}

/*** Scene3 data ***/
let fallPool=[]; let tSim=0;
function setupFall(){
  if(!tree) rebuildTree();
  fallPool = tree.leaves.slice(0, Math.min(tree.leaves.length, 3000)).map((L,i)=>({
    pos: L.pos.slice(), yaw: L.yaw, pitch: L.pitch, scale: L.scale, bb: L.bb,
    v:[(Math.random()*0.04-0.02),(Math.random()*0.02-0.01),(Math.random()*0.04-0.02)],
    w:[(Math.random()*0.6-0.3),(Math.random()*0.8-0.4),(Math.random()*0.3-0.15)],
    phase: Math.random()*0.4, state:0
  }));
  tSim=0;
}

/*** Loop ***/
let f1=0,t1=performance.now(), f2=0,t2=performance.now(), f3=0,t3=performance.now();
function loop(){
  clear();
  if(scene===1){
    drawGrid();
    if(!leafMesh) rebuildLeaf();
    drawLeafMesh(leafMesh);
    f1++; const now=performance.now(); if(now-t1>1000){ label('kpiFPS1',f1); f1=0; t1=now; }
  } else if(scene===2){
    drawGrid();
    if(!tree) rebuildTree();
    for(const b of tree.branches){
      drawCylinder(b[0], b[1], 0.05*Math.pow(0.85,b[2]), '#8b7355');
    }
    for(const L of tree.leaves){
      const col='#6fbf6f';
      drawQuadBillboard(L.pos, L.yaw, L.pitch, L.scale, L.bb, col);
    }
    f2++; const now2=performance.now(); if(now2-t2>1000){ label('kpiFPS2',f2); f2=0; t2=now2; }
  } else if(scene===3){
    drawGrid();
    const fallRate = parseFloat(ui('fallRate').value);
    const regrow = parseFloat(ui('regrowRate').value);
    label('valFR', fallRate.toFixed(1)+'×'); label('valRG', regrow.toFixed(1)+'×');
    tSim += 0.016*fallRate;
    let active=0, grounded=0;
    for(const L of fallPool){
      if(L.state===0){
        L.phase += 0.003*fallRate; if(L.phase>=1){ L.state=1; }
      }else if(L.state===1){
        const wind = [ noise3(L.pos[0]*0.4, tSim*0.3, L.pos[2]*0.4),
                       noise3(L.pos[0]*0.3+3, tSim*0.27+2, L.pos[2]*0.3+7),
                       noise3(L.pos[0]*0.4+11, tSim*0.33+5, L.pos[2]*0.4+13) ];
        L.v[0]+= wind[0]*0.01; L.v[2]+= wind[2]*0.01; L.v[1] -= 0.006;
        const p=leafParams(); const area=p.len*p.wid; const drag = 1.0 - Math.max(0.0005, Math.min(0.01,0.002*area));
        L.v[0]*=drag; L.v[1]*=drag; L.v[2]*=drag;
        L.pos[0]+= L.v[0] + Math.sin(tSim*3)*0.002;
        L.pos[2]+= L.v[2] + Math.cos(tSim*2.7)*0.002;
        L.pos[1]+= L.v[1];
        L.pitch += (Math.random()*0.02-0.01);
        L.yaw   += (Math.random()*0.02-0.01);
        if(L.pos[1]<=0.01){ L.pos[1]=0.01; L.v=[0,0,0]; L.state=2; }
        active++;
      }else grounded++;
      const c=phaseColor(L.phase);
      drawQuadBillboard(L.pos, L.yaw, L.pitch, L.scale, L.bb, c);
    }
    label('kpiActive',active); label('kpiGrounded',grounded);
    f3++; const now3=performance.now(); if(now3-t3>1000){ label('kpiFPS3',f3); f3=0; t3=now3; }
  }
  requestAnimationFrame(loop);
}
function drawGrid(){
  ctx.strokeStyle='#243043'; ctx.lineWidth=1;
  const step=0.5;
  for(let x=-5; x<=5; x+=step){
    const a=project([x,0,-5]), b=project([x,0,5]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for(let z=-5; z<=5; z+=step){
    const a=project([-5,0,z]), b=project([5,0,z]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
}
function phaseColor(phase){
  const g=[0.2,0.75,0.35], y=[0.95,0.85,0.25], o=[0.95,0.45,0.2];
  const mix=(a,b,t)=>[a[0]*(1-t)+b[0]*t, a[1]*(1-t)+b[1]*t, a[2]*(1-t)+b[2]*t];
  let c; if(phase<0.5) c=mix(g,y,phase*2); else c=mix(y,o,(phase-0.5)*2);
  return `rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})`;
}

/* init */
rebuildLeaf();
show(1);
resize();
requestAnimationFrame(loop);
</script>
