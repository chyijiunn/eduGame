</style></head><body><div class="app"><main class="stage" id="stage"><canvas id="view" aria-label="3D 葉片樹形與落葉模擬"></canvas><div class="overlay"><div class="tag"><strong id="sceneTitle">葉片設計</strong><span id="statusText" class="screen-reader-only">正在初始化…</span></div><div class="tag meter" id="performance">FPS —</div></div><div class="stagefoot"><span></span><span id="engine">—</span></div><div class="fail" id="fatal"></div></main><button id="panelToggle" class="panel-toggle" type="button" aria-label="展開或收合控制面板" aria-expanded="false">☷ 設定</button><aside class="panel" id="settingsPanel"><header class="brand"><div><h1>LEAF · TREE · FALL</h1><small>葉形 · 樹形 · 落葉</small></div><span class="version">v0.9</span></header><nav class="tabs"><button class="tab active" data-scene="leaf">01 葉片</button><button class="tab" data-scene="tree">02 樹木</button><button class="tab" data-scene="fall">03 落葉</button></nav>
<section class="section active" id="p_leaf"><div class="stats"><div><b id="metricVerts">—</b><span>頂點</span></div><div><b id="metricFaces">—</b><span>三角面</span></div><div><b id="metricArea">—</b><span>葉面積 cm²</span></div></div><div class="twobuttons"><button id="fitLeaf" class="primary">置中與自動取景</button><button id="resetLeaf">恢復預設</button></div><div class="field"><label>葉形</label><select id="leafShape"><option value="elliptic">橢圓</option><option value="ovate">卵形</option><option value="obovate">倒卵形</option><option value="lanceolate">披針形</option><option value="oblanceolate">倒披針形</option><option value="linear">線形</option><option value="orbicular">圓形</option><option value="reniform">腎形</option><option value="cordate">心形</option><option value="sagittate">箭形</option><option value="spatulate">匙形</option><option value="palmate_lobed">掌狀深裂</option><option value="pinnate_lobed">羽狀深裂</option></select></div><div class="field"><label>葉緣</label><select id="leafMargin"><option value="entire">全緣</option><option value="serrate">鋸齒</option><option value="crenate">圓齒</option><option value="dentate">具齒</option><option value="double_serr">重鋸齒</option><option value="undulate">波狀</option></select></div><div class="field"><label>葉脈</label><select id="leafVein"><option value="pinnate">羽狀</option><option value="palmate3">掌狀 3</option><option value="palmate5">掌狀 5</option><option value="palmate7">掌狀 7</option><option value="parallel">平行</option><option value="arcuate">弧狀</option></select></div><div class="control"><div class="cr"><label for="len">葉長</label><output id="v_len"></output></div><input type="range" id="len" min="4" max="40" step=".1" value="12" data-unit="cm"></div>

<div class="control"><div class="cr"><label for="serrA">齒緣幅度</label><output id="v_serrA"></output></div><input type="range" id="serrA" min="0" max=".25" step=".005" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="serrF">鋸齒密度</label><output id="v_serrF"></output></div><input type="range" id="serrF" min="0" max="30" step="1" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="toothSharp">鋸齒銳利度</label><output id="v_toothSharp"></output></div><input type="range" id="toothSharp" min="0" max="1" step=".01" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="doubleSerr">重鋸齒強度</label><output id="v_doubleSerr"></output></div><input type="range" id="doubleSerr" min="0" max="1" step=".01" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="lobeCount">裂片數</label><output id="v_lobeCount"></output></div><input type="range" id="lobeCount" min="0" max="9" step="1" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="lobeDepth">裂片深度</label><output id="v_lobeDepth"></output></div><input type="range" id="lobeDepth" min="0" max="1" step=".01" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="lobeRound">裂片圓鈍度</label><output id="v_lobeRound"></output></div><input type="range" id="lobeRound" min="0" max="1" step=".01" value=".6" data-unit=""></div>
<div class="control"><div class="cr"><label for="rib">主脈隆起</label><output id="v_rib"></output></div><input type="range" id="rib" min="0" max=".6" step=".01" value=".12" data-unit="cm"></div>
<div class="control"><div class="cr"><label for="curl">橫向捲曲</label><output id="v_curl"></output></div><input type="range" id="curl" min="0" max="1.2" step=".01" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="twist">縱向扭轉</label><output id="v_twist"></output></div><input type="range" id="twist" min="0" max="1.5" step=".01" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="bend">上拱彎曲</label><output id="v_bend"></output></div><input type="range" id="bend" min="-.8" max="1.2" step=".01" value=".2" data-unit=""></div>
<div class="control"><div class="cr"><label for="waveAmp">波浪幅度</label><output id="v_waveAmp"></output></div><input type="range" id="waveAmp" min="0" max=".3" step=".01" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="waveFreq">波浪頻率</label><output id="v_waveFreq"></output></div><input type="range" id="waveFreq" min="0" max="20" step="1" value="0" data-unit=""></div>
<div class="control"><div class="cr"><label for="asym">非對稱度</label><output id="v_asym"></output></div><input type="range" id="asym" min="0" max="1" step=".01" value="0" data-unit=""></div><label class="smallrow"><input type="checkbox" id="stem" checked> 顯示葉柄</label><label class="smallrow"><input type="checkbox" id="double" checked> 葉片雙面</label><div class="twobuttons"><button id="leafExport">匯出葉片 CSV</button><button id="leafImportBtn">匯入葉片 CSV</button></div><input type="file" id="leafImport" accept=".csv,text/csv" class="hidden"><button class="primary" id="sendTree" style="width:100%">將葉片套用至樹木</button></section>
<section class="section" id="p_tree"><h2>樹木</h2><div class="field"><label>樹種預設</label><select id="treePreset"><option value="maple">楓樹｜掌狀葉·放射圓冠</option><option value="oak">橡樹｜圓闊冠·粗枝</option><option value="pine">松樹｜針葉·圓錐層狀</option><option value="willow">柳樹｜披針葉·下垂枝條</option><option value="banyan">榕樹｜橫向展枝·氣生根</option></select></div><div class="control"><div class="cr"><label for="treeH">樹高</label><output id="v_treeH"></output></div><input type="range" id="treeH" min="2" max="20" step=".1" value="5" data-unit="m"></div>
<div class="control"><div class="cr"><label for="crownR">樹冠半徑</label><output id="v_crownR"></output></div><input type="range" id="crownR" min="1" max="12" step=".1" value="3" data-unit="m"></div>

<div class="control"><div class="cr"><label for="leafCount">葉片數量</label><output id="v_leafCount"></output></div><input type="range" id="leafCount" min="50" max="30000" step="50" value="2000" data-unit=""></div><div class="field"><label>樹冠外形</label><select id="shape"><option value="sphere">球形／圓傘</option><option value="cone">圓錐</option><option value="vase">花瓶狀</option></select></div><div class="twobuttons"><button id="fitTree" class="primary">置中整棵樹</button><button id="buildTree">重新生成</button></div><div class="twobuttons"><button id="treeExport">匯出樹木 CSV</button><button id="treeImportBtn">匯入樹木 CSV</button></div><input type="file" id="treeImport" accept=".csv,text/csv" class="hidden"><p class="note" id="treeStatus" hidden>樹冠資料尚未產生。</p></section>
<section class="section" id="p_fall"><h2>落葉</h2><div class="stats"><div><b id="nGreen">—</b><span>仍在樹上</span></div><div><b id="nFalling">—</b><span>空中落葉</span></div><div><b id="nGround">—</b><span>落地</span></div></div><div class="control"><div class="cr"><label for="fallRate">落葉時間倍率</label><output id="v_fallRate"></output></div><input type="range" id="fallRate" min=".1" max="20" step=".1" value="1" data-unit="×"></div>

<div class="control"><div class="cr"><label for="maxActive">精細動畫葉片預算</label><output id="v_maxActive"></output></div><input type="range" id="maxActive" min="100" max="4000" step="100" value="1000" data-unit="片"></div><div class="twobuttons"><button id="startFall" class="primary">開始／繼續</button><button id="pauseFall">暫停</button></div><div class="twobuttons"><button id="resetFall">季節重置</button><button id="fitFall">置中樹木</button></div><label class="smallrow"><input type="checkbox" id="sun" checked> 動態日照</label></section>
<details class="advanced"><summary>畫質與效能</summary><div class="sectionblock"><div class="field"><label>渲染模式</label><select id="backend"><option value="auto">自動（優先 WebGL2 穩定模式）</option><option value="webgl2">WebGL2 · GPU Instancing</option><option value="webgpu">WebGPU · Compute（支援時）</option><option value="canvas">Canvas 2D · 安全備援</option></select></div><div class="field"><label>畫質／裝置像素密度</label><select id="quality"><option value="0.75">0.75× 省電</option><option value="1" selected>1× 平衡</option><option value="1.5">1.5× 精細</option><option value="native">原生</option></select></div><label class="smallrow"><input type="checkbox" id="autoQuality" checked> 低 FPS 時自動降低畫質</label><p class="note" id="capability"></p></div></div></details></aside></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const PI=Math.PI, TAU=2*PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const v3=(x=0,y=0,z=0)=>[x,y,z];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const k=Math.hypot(...a)||1;return mul(a,1/k)};
function seeded(seed){let v=seed>>>0;return ()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296;};}
function persp(fovy,aspect,near,far){const f=1/Math.tan(fovy/2);const o=new Float32Array(16);o[0]=f/aspect;o[5]=f;o[10]=(far+near)/(near-far);o[11]=-1;o[14]=2*far*near/(near-far);return o;}
function lookAt(eye,target,up=[0,1,0]){const z=norm(sub(eye,target)),x=norm(cross(up,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);}
function matmul(a,b){const r=new Float32Array(16);for(let c=0;c<4;c++)for(let row=0;row<4;row++){let k=0;for(let j=0;j<4;j++)k+=a[j*4+row]*b[c*4+j];r[c*4+row]=k;}return r;}
const encodeNum=x=>Number.isFinite(x)?x:0;
const state={scene:'leaf',backend:'none',wanted:'auto',engine:null,tree:null,leaf:null,leafTree:null,ground:null,running:false,season:0,quality:1,autoQ:true,webgpuSupported:false,canvasSupported:true,frame:0,fps:60,frames:0,lastFps:0,actualFps:60,fitNext:true,treeUseCustom:false,status:'',err:''};
const LKEY=['len','width','tip','base','baseNotch','apexConverge','serrA','serrF','toothSharp','doubleSerr','lobeCount','lobeDepth','lobeRound','rib','curl','twist','bend','waveAmp','waveFreq','asym'];
const TKEY=['treeH','crownR','levels','spread','lean','leafCount'];
const FKEY=['fallRate','regrow','windAmp','turb','maxActive'];
const getP=()=>Object.fromEntries(LKEY.map(k=>[k,+$(k).value]));
const getT=()=>Object.fromEntries(TKEY.map(k=>[k,+$(k).value]).concat([['preset',$('treePreset').value],['shape',$('shape').value]]));
const getF=()=>Object.fromEntries(FKEY.map(k=>[k,+$(k).value]));

    let t=n/pieces,nxt=n===pieces?b:add(add(mul(a,1-t),mul(b,t)),[(rng()-.5)*length*.03,Math.sin(t*PI)*length*.035,(rng()-.5)*length*.03]);

 const leanDir=[Math.sin(lean),0,Math.cos(lean)-1];
 let spine=[];
 for(let i=0;i<=10;i++){const y=trH*i/10,x=Math.sin(i*.31)*.045*H+Math.sin(lean)*y;spine.push([x,y,Math.cos(i*.4)*.025*H]);}

function switchScene(name){state.scene=name;state.running=false;for(const b of document.querySelectorAll('.tab'))b.classList.toggle('active',b.dataset.scene===name);for(const p of document.querySelectorAll('.section'))p.classList.toggle('active',p.id==='p_'+name);$('sceneTitle').textContent=name==='leaf'?'葉片設計':name==='tree'?'樹木生成':'落葉模擬';fitScene();notify(name==='leaf'?'可拖曳查看葉片曲率':name==='tree'?'可旋轉查看整棵樹':'點擊「開始／繼續」啟動落葉');}
function applyTreePreset(spec,regen){state.treeUseCustom=false;const t=TREE[spec]||TREE.maple;for(const [id,v]of [['treeH',t.h],['crownR',t.r],['levels',t.levels],['spread',t.spread],['lean',t.lean],['shape',t.shape]])$(id).value=v;
 // The scene 1 leaf shape is preserved; individual species use a species-specific leaf silhouette only when tree instance built.
 syncLabels();if(regen)rebuildTree(true);
}
function computeStats(){const t=state.tree;if(!t)return;let attached=0,moving=0,ground=0;
 const base=state.season;
 for(const s of t.schedules){if(base<s)attached++;else{const height=t.H*.65;const age=(base-s)*45;const fall=.13*age*age/(1+.5*age);if(fall<height)moving++;else ground++;}}
 $('nGreen').textContent=attached.toLocaleString();$('nFalling').textContent=moving.toLocaleString();$('nGround').textContent=ground.toLocaleString();
}
function tickStats(time){if(time-state.lastFps>800){let fps=state.frames*1000/Math.max(1,time-state.lastFps);state.fps=lerp(state.fps,fps,.45);state.frames=0;state.lastFps=time;$('performance').textContent=`${Math.round(state.fps)} FPS · ${state.tree?.count.toLocaleString()||0} 葉`;if(state.scene==='fall')computeStats();
 if(state.autoQ&&state.fps<19&&state.quality>0.75){state.quality=0.75;$('quality').value='0.75';state.engine?.resize();notify('已降至省電畫質以提高幀率');}}}
const SHADER_LEAF_VERT=`#version 300 es
precision highp float;
layout(location=0) in vec3 position;
layout(location=1) in vec3 normalIn;
layout(location=2) in vec3 colorIn;
layout(location=3) in vec4 instance0; // xyz position, scale
layout(location=4) in vec4 instance1; // yaw, pitch, roll, seed
layout(location=5) in vec4 instance2; // release, aerodynamic trait, randomness, randomness
uniform mat4 uVP;
uniform int uMode;
uniform float uSeason,uWind,uTurb,uRegrow;
uniform float uShapeDrag;
uniform float uDetailFraction;
out vec3 vColor;
out vec3 vNormal;
out float vGround;
mat3 rx(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
mat3 ry(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
mat3 rz(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.,-s,c,0.,0.,0.,1.);}
vec3 wind(vec3 q,float t,float seed){
 float s1=sin(q.x*.53+q.z*.20+t*.93)*cos(q.y*.31+t*.62);
 float s2=sin(q.x*1.19-q.z*.65-t*1.53+seed)*sin(q.z*.47+t*.65);
 float s3=cos(q.z*2.1+t*2.33+seed*.19)*.25;

}
void main(){
 vec3 p=position*instance0.w;
 vec3 N=normalIn;
 vec3 center=instance0.xyz;
 float age=max(0.,(uSeason-instance2.x)*45.);
 float t=age;
 vec3 flow=wind(center,t*.18+instance1.w,instance1.w);
 float flutter=0.;
 float detail=step(fract(instance1.w*1.618),uDetailFraction);
 if(uMode==2&&uSeason>=instance2.x){
   float drag=max(.3,uShapeDrag*instance2.y);
   float vt=.72*sqrt(1./drag); // size and curvature influence aerodynamic drag
   float drop=vt*t-(vt*vt/3.2)*(1.-exp(-3.2*t/vt));
   float bottom=max(.012,center.y-.018);
   float fallen=min(drop,bottom);
   float ground=step(bottom-.001,drop);
   center.y-=fallen;
   float horizontal=min(t,8.5);
   vec3 gust=mix(vec3(uWind,0.,uWind*.18),wind(instance0.xyz,t*.14+instance1.w,instance1.w),detail);
   center.x+=horizontal*(.10*gust.x+.04*sin(.8*t+instance1.w)*uTurb);
   center.z+=horizontal*(.08*gust.z+.05*cos(1.1*t+instance1.w)*uTurb);
   flutter=sin(t*(6.8-.3*drag)+instance1.w*10.)*(.12+.4*detail*min(1.,t));
   float lateral=sin(t*2.8+instance1.w*6.)*.15*min(1.,t);
   center.x+=lateral*(1.-ground);
   center.y=max(.014,center.y);
   center.x=mix(center.x,center.x,ground);
   // on ground: lie flat rather than keep spinning
   flutter*=1.-ground;
   vGround=ground;
 } else vGround=0.;

 if(vGround>.5)M=ry(instance1.x)*rx(1.48);

 vec3 world=center+p;
 vec3 green=colorIn;
 float warm=uMode==2?smoothstep(instance2.x-.27,instance2.x-.055,uSeason):0.;
 vec3 yellow=vec3(.87,.68,.16),red=vec3(.80,.26,.09);
 vec3 tint=mix(green,mix(yellow,red,smoothstep(.48,1.,warm)),smoothstep(0.,.85,warm));
 vColor=uMode==0?colorIn:tint*(.90+.15*instance2.z);
 vNormal=normalize(M*N);

}`;
const SHADER_LEAF_FRAG=`#version 300 es
precision highp float;
in vec3 vColor;
in vec3 vNormal;
in float vGround;
uniform float uDay;
out vec4 outColor;
void main(){

function cylGeometry(){let V=[],N=[],I=[];const n=9;for(let j=0;j<=1;j++)for(let k=0;k<=n;k++){let a=TAU*k/n,x=Math.cos(a),z=Math.sin(a);V.push(x,j,z);N.push(x,0,z);}for(let j=0;j<1;j++)for(let k=0;k<n;k++){const a=j*(n+1)+k,b=a+n+1;I.push(a,b,a+1,b,b+1,a+1);}return {vertices:new Float32Array(V),normals:new Float32Array(N),indices:new Uint16Array(I)};}

 let I=inst[index];var center=I.a.xyz;var age:f32=0.;var ground:f32=0.;
 if(u.extra.x>1.5){center=sim[index].p.xyz;age=max(0.,(u.meta.x-I.c.x)*45.);ground=sim[index].p.w;}

@fragment fn fs(@location(0) color:vec3<f32>,@location(1) n:vec3<f32>)->@location(0) vec4<f32>{return vec4<f32>(color*(.50+.44*abs(dot(normalize(n),normalize(vec3<f32>(.5,.8,.4))))),1.);}

const WGSL_GROUND=`

struct Out{@builtin(position) pos:vec4<f32>,@location(0) p:vec3<f32>};
@vertex fn vs(@location(0) p:vec3<f32>)->Out{var o:Out;o.pos=u.vp*vec4<f32>(p,1.);o.p=p;return o;}

class CanvasRenderer{

 updateLeaf(){}updateTree(){}resetFall(){}
 resize(){let d=Math.min(1.35,state.quality),w=Math.round(camera.W*d),h=Math.round(camera.H*d);this.canvas.width=Math.max(1,w);this.canvas.height=Math.max(1,h);this.ctx.setTransform(d,0,0,d,0,0);}
 render(){const ctx=this.ctx,w=camera.W,h=camera.H;let grd=ctx.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#253d50');grd.addColorStop(1,'#0a1a28');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);

  const mesh=state.leaf;if(!mesh)return;const verts=mesh.vertices,ind=mesh.indices;
  let proj=[];const m=cameraMatrix();for(let i=0;i<verts.length;i+=3){let x=verts[i],y=verts[i+1],z=verts[i+2],hw=m[3]*x+m[7]*y+m[11]*z+m[15];proj.push(hw>.00001?[(m[0]*x+m[4]*y+m[8]*z+m[12])/hw*w*.5+w*.5,-(m[1]*x+m[5]*y+m[9]*z+m[13])/hw*h*.5+h*.5]:[0,0]);}

let backendGeneration=0;
async function selectBackend(kind='auto'){
 const ticket=++backendGeneration;
 state.wanted=kind;state.running=false;
 try{state.engine?.dispose();}catch(e){}
 state.engine=null;
 const next=document.createElement('canvas');next.id='view';next.setAttribute('aria-label','3D 樹木與落葉視圖');stage.replaceChild(next,cv);cv=next;
 let engine=null,label='';
 function initGL(){engine=new WebGLRenderer(cv);label='WebGL2 · Instancing';}
 try{
  if(kind==='webgpu'){
   if(!navigator.gpu)throw Error('目前瀏覽器或 file:// 不支援 WebGPU');
   engine=await WebGPURenderer.create(cv);label='WebGPU · Compute';
  }else if(kind==='canvas'){
   engine=new CanvasRenderer(cv);label='Canvas 2D · 安全模式';
  }else initGL();
 }catch(err){console.warn('Backend failed:',err);
  if(ticket!==backendGeneration)return;
  try{initGL();notify(`WebGPU 不可用，已改用 WebGL2：${err.message}`);}catch(err2){
   try{engine=new CanvasRenderer(cv);label='Canvas 2D · 安全模式';notify('GPU 模式不可用，已啟用 Canvas 備援');}catch(err3){showError(err3);return;}
  }
 }
 if(ticket!==backendGeneration){engine?.dispose();return;}
 state.engine=engine;state.backend=label;$('engine').textContent=label;
 if(state.leaf)state.engine.updateLeaf();if(state.tree)state.engine.updateTree();
 state.engine.resize();fitScene();
 if(!state.status)notify('載入完成，可旋轉觀察葉片');
}
function showError(err){$('fatal').style.display='block';$('fatal').textContent='渲染初始化失敗：\n'+(err?.stack||err);console.error(err);}
window.addEventListener('error',e=>{console.error('Unhandled:',e.error||e.message);$('statusText').textContent='程式錯誤：'+e.message;});
window.addEventListener('unhandledrejection',e=>{console.error('Unhandled async:',e.reason);$('statusText').textContent='非同步錯誤：'+(e.reason?.message||e.reason);});
let lastFrame=0,lastUI=0;
function animate(t){requestAnimationFrame(animate);let dt=Math.min(.06,Math.max(0,(t-lastFrame)/1000||.016));lastFrame=t;state.frames++;
 if(state.running&&state.scene==='fall'){
  const f=getF();state.season=Math.min(1.8,state.season+dt*f.fallRate/74);
  if(state.season>=1.8&&f.regrow>0){state.season=0;state.engine?.resetFall();}
  else if(state.season>=1.8){state.running=false;notify('落葉模擬完成');}
 }
 try{if(state.engine)state.engine.render(dt);}catch(err){showError(err);state.engine=null;}
 if(t-lastUI>900){tickStats(t);lastUI=t;}
}
async function startup(){
 try{
  attachEvents();syncLabels();updateViewport();
  rebuildLeaf();applyTreePreset('maple',false);rebuildTree(false);
  state.scene='leaf';state.fitNext=true;fitScene();
  requestAnimationFrame(animate);
  let support=!!navigator.gpu;$('capability').textContent='WebGL2 使用 GPU 實例化；'+(support?'WebGPU API 可偵測，選用時會檢查實際裝置。':'目前未提供 WebGPU（可能是瀏覽器、裝置或本機檔案限制）。');
  await selectBackend('auto');notify('葉片已置中；切換場景可查看樹木與落葉');
 }catch(err){showError(err);}
}
startup();
