<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>可愛演化生存模擬器 v0.21（隨機場景/事件＋小動畫）</title>
  <style>
    :root{ color-scheme: dark; }
    body{
      margin:0; background:#0b0f14; color:#e8eef7;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang TC", "Noto Sans TC", Arial;
    }
    header{
      padding:14px 16px; border-bottom:1px solid #1f2a36;
      display:flex; gap:10px; flex-wrap:wrap; align-items:baseline;
    }
    header h1{ margin:0; font-size:16px; font-weight:900; }
    header .sub{ opacity:.75; font-size:12px; }
    .wrap{ display:grid; grid-template-columns: 390px 1fr; gap:14px; padding:14px; }
    @media (max-width: 980px){ .wrap{ grid-template-columns:1fr; } }

    .card{
      background:#0f1722; border:1px solid #1f2a36; border-radius:14px;
      padding:12px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid #263445; background:#0c1420;
      font-size:12px; opacity:.95;
    }
    .btn{
      background:#1a2634; border:1px solid #2a3a4c; color:#e8eef7;
      padding:10px 12px; border-radius:12px; cursor:pointer; font-weight:800;
    }
    .btn:hover{ filter:brightness(1.06); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ background:#20344a; border-color:#35506a; }
    .btn.danger{ background:#3a1f2a; border-color:#6a3550; }
    .sep{ height:1px; background:#1f2a36; margin:10px 0; }

    label{ font-size:12px; opacity:.85; display:flex; justify-content:space-between; gap:10px; }
    input[type="range"]{ width:100%; }
    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    @media (max-width: 980px){ .grid2{ grid-template-columns:1fr; } }
    .tiny{ font-size:12px; opacity:.75; line-height:1.45; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New"; }

    canvas{
      width:100%; height:520px; display:block;
      background:#081018; border:1px solid #1f2a36; border-radius:14px;
    }
    .cards{ display:grid; grid-template-columns: 1fr; gap:10px; }
    .mcard{
      border:1px solid #223244; background:#0b111a; border-radius:14px; padding:10px;
      cursor:pointer; transition: transform .12s ease, filter .12s ease;
    }
    .mcard:hover{ transform: translateY(-1px); filter:brightness(1.06); }
    .mcard.selected{ outline:2px solid rgba(120,200,255,.8); }
    .mcard .t{ font-weight:900; }
    .mcard .d{ font-size:12px; opacity:.8; margin-top:6px; line-height:1.35; }
    .mcard .tag{ display:inline-flex; margin-top:8px; font-size:11px; opacity:.85; border:1px solid #263445; padding:4px 8px; border-radius:999px; background:#0c1420; }
    .log{
      max-height: 230px; overflow:auto; padding:10px; border-radius:12px;
      background:#0b111a; border:1px solid #1f2a36; font-size:12px; line-height:1.45;
    }
    .log .e{ margin:0 0 8px 0; }
    .stat{
      display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:12px;
    }
    .stat .box{
      padding:10px; border:1px solid #1f2a36; border-radius:12px; background:#0b111a;
    }
    .stat b{ font-size:13px; }
  </style>
</head>
<body>
<header>
  <h1>可愛演化生存模擬器 v0.21</h1>
  <div class="sub">隨機場景/事件＋特徵外觀＋「掠食者驚嚇跑、暴風雪縮抖、熱浪冒汗、豐收星星、洪水漂浮」</div>
</header>

<div class="wrap">
  <section class="card">
    <div class="row">
      <span class="pill">代數：<b id="gen">0</b></span>
      <span class="pill">族群：<b id="pop">0</b></span>
      <span class="pill">場景：<b id="sceneName">—</b></span>
      <span class="pill">事件：<b id="eventName">—</b></span>
    </div>

    <div class="sep"></div>

    <div class="grid2">
      <div>
        <label>初始毛量 <span class="mono" id="valFur">55</span></label>
        <input id="fur" type="range" min="0" max="100" value="55"/>
      </div>
      <div>
        <label>初始體型 <span class="mono" id="valSize">55</span></label>
        <input id="size" type="range" min="0" max="100" value="55"/>
      </div>
      <div>
        <label>初始速度 <span class="mono" id="valSpeed">55</span></label>
        <input id="speed" type="range" min="0" max="100" value="55"/>
      </div>
      <div>
        <label>初始偽裝 <span class="mono" id="valCamo">55</span></label>
        <input id="camo" type="range" min="0" max="100" value="55"/>
      </div>
    </div>

    <div class="sep"></div>

    <div class="grid2">
      <div>
        <label>初始族群 <span class="mono" id="valInitPop">70</span></label>
        <input id="initPop" type="range" min="30" max="180" value="70"/>
      </div>
      <div>
        <label>每代突變強度 <span class="mono" id="valMut">10</span></label>
        <input id="mut" type="range" min="1" max="25" value="10"/>
      </div>
      <div>
        <label>環境嚴苛度 <span class="mono" id="valHarsh">65</span></label>
        <input id="harsh" type="range" min="25" max="90" value="65"/>
      </div>
      <div>
        <label>事件強度 <span class="mono" id="valEvPow">70</span></label>
        <input id="evPow" type="range" min="20" max="100" value="70"/>
      </div>
    </div>

    <div class="sep"></div>

    <div class="row">
      <button class="btn primary" id="btnStart">建立族群 / 重新開始</button>
      <button class="btn" id="btnNext" disabled>下一代</button>
      <button class="btn" id="btnAuto" disabled>自動跑</button>
      <button class="btn danger" id="btnStop" disabled>停止</button>
    </div>

    <div class="sep"></div>

    <div class="stat">
      <div class="box">
        <div class="tiny">平均性狀</div>
        <div class="mono" id="avgTraits">—</div>
      </div>
      <div class="box">
        <div class="tiny">存活率（上一代）</div>
        <div class="mono" id="surviveRate">—</div>
      </div>
    </div>

    <div class="sep"></div>
    <div class="tiny"><b>本代突變卡（先選 1 張）</b></div>
    <div class="cards" id="mutCards"></div>

    <div class="sep"></div>
    <div class="log" id="log"></div>
  </section>

  <section class="card">
    <canvas id="view" width="1400" height="900"></canvas>
    <div class="sep"></div>
    <div class="tiny">
      想「動畫更明顯」：把 <b>事件強度</b> 調到 80↑（掠食者/洪水/熱浪會更常造成差異）。
    </div>
  </section>
</div>

<script>
(() => {
  // helpers
  const qs = s => document.querySelector(s);
  const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const rnd = (n=1)=>Math.random()*n;
  const rndi = (a,b)=>Math.floor(a+Math.random()*(b-a+1));
  const fmt = n => (Math.round(n*10)/10).toFixed(1);
  function randn(){
    let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }
  function gauss(x, mu, sigma){
    const z=(x-mu)/sigma;
    return Math.exp(-0.5*z*z);
  }

  // UI
  const ui = {
    gen: qs("#gen"), pop: qs("#pop"), sceneName: qs("#sceneName"), eventName: qs("#eventName"),
    avgTraits: qs("#avgTraits"), surviveRate: qs("#surviveRate"),
    log: qs("#log"), cards: qs("#mutCards"),
    canvas: qs("#view"),
    fur: qs("#fur"), size: qs("#size"), speed: qs("#speed"), camo: qs("#camo"),
    initPop: qs("#initPop"), mut: qs("#mut"), harsh: qs("#harsh"), evPow: qs("#evPow"),
    valFur: qs("#valFur"), valSize: qs("#valSize"), valSpeed: qs("#valSpeed"), valCamo: qs("#valCamo"),
    valInitPop: qs("#valInitPop"), valMut: qs("#valMut"), valHarsh: qs("#valHarsh"), valEvPow: qs("#valEvPow"),
    btnStart: qs("#btnStart"), btnNext: qs("#btnNext"), btnAuto: qs("#btnAuto"), btnStop: qs("#btnStop"),
  };
  bindRange(ui.fur, ui.valFur);
  bindRange(ui.size, ui.valSize);
  bindRange(ui.speed, ui.valSpeed);
  bindRange(ui.camo, ui.valCamo);
  bindRange(ui.initPop, ui.valInitPop);
  bindRange(ui.mut, ui.valMut);
  bindRange(ui.harsh, ui.valHarsh);
  bindRange(ui.evPow, ui.valEvPow);
  function bindRange(input, out){ const f=()=>out.textContent=input.value; input.addEventListener("input", f); f(); }

  // scenes
  const SCENES = [
    { key:"ice", name:"冰原", base:[140,190,230], accent:[220,240,255] },
    { key:"plains", name:"草原", base:[160,190,120], accent:[235,220,170] },
    { key:"forest", name:"森林", base:[80,140,110], accent:[160,220,190] },
    { key:"desert", name:"沙漠", base:[215,185,120], accent:[255,230,170] },
  ];
  function rgb(a, alpha=1){ return `rgba(${a[0]},${a[1]},${a[2]},${alpha})`; }

  // events
  const EVENTS = [
    { key:"blizzard", name:"暴風雪", sceneBias:["ice"],
      desc:"很冷：毛量高更容易活。",
      score(ind){ return gauss(ind.fur, 85, 20); }
    },
    { key:"heatwave", name:"熱浪", sceneBias:["desert","plains"],
      desc:"很熱：毛量太高吃虧。",
      score(ind){ return gauss(ind.fur, 20, 22); }
    },
    { key:"drought", name:"乾旱", sceneBias:["desert","plains"],
      desc:"缺水：體型小～中較省資源。",
      score(ind){ return gauss(ind.size, 35, 20); }
    },
    { key:"flood", name:"洪水", sceneBias:["forest","plains"],
      desc:"水淹：速度快更能逃、體型太大不利。",
      score(ind){ return 0.55*gauss(ind.speed, 75, 20) + 0.45*gauss(ind.size, 35, 25); }
    },
    { key:"predator", name:"掠食者來襲", sceneBias:["forest","plains"],
      desc:"天敵：速度快＋偽裝高更安全。",
      score(ind){ return 0.52*gauss(ind.speed, 80, 20) + 0.48*gauss(ind.camo, 80, 20); }
    },
    { key:"boom", name:"食物豐收", sceneBias:["plains","forest"],
      desc:"資源多：族群更容易成長。",
      score(ind){ return 0.6*gauss(ind.size, 75, 24) + 0.4*gauss(ind.speed, 65, 28); }
    },
  ];

  function pickEventForScene(sc){
    const prefer = EVENTS.filter(e => e.sceneBias.includes(sc.key));
    const pool = (prefer.length && Math.random()<0.65) ? prefer : EVENTS;
    return pool[rndi(0, pool.length-1)];
  }
  function maybeShiftScene(sc){
    if(Math.random()>0.38) return sc;
    const map = {
      ice:["plains","forest"],
      plains:["forest","desert","ice"],
      forest:["plains","ice"],
      desert:["plains"]
    };
    const choices = map[sc.key].map(k => SCENES.find(s=>s.key===k)).filter(Boolean);
    return choices.length ? choices[rndi(0,choices.length-1)] : sc;
  }

  // mutation cards
  const MUT_CARDS = [
    { title:"🧥 毛毛變厚", delta:{fur:+14}, tag:"抗寒↑ 熱浪↓", desc:"毛量上升：冰原更穩，但遇熱浪更痛。" },
    { title:"🪶 毛毛變薄", delta:{fur:-14}, tag:"抗熱↑ 寒冬↓", desc:"毛量下降：熱浪更穩，但暴風雪更痛。" },
    { title:"🍔 體型變大", delta:{size:+14}, tag:"抗餓↑ 需食物↑", desc:"更能撐餓，但乾旱成本高。" },
    { title:"🥦 體型變小", delta:{size:-14}, tag:"乾旱↑ 抗餓↓", desc:"更省資源，但連災害更脆。" },
    { title:"🏃 速度提升", delta:{speed:+14}, tag:"逃跑↑ 洪水↑", desc:"天敵/洪水更安全，但耗能。" },
    { title:"🐢 速度下降", delta:{speed:-14}, tag:"省能↑ 逃跑↓", desc:"比較省能，但天敵很危險。" },
    { title:"🎭 偽裝更強", delta:{camo:+14}, tag:"隱蔽↑", desc:"更不容易被看見（含天敵）。" },
    { title:"✨ 偽裝變弱", delta:{camo:-14}, tag:"顯眼↑", desc:"更容易被看見。" },
    { title:"🧬 平衡調整", delta:{fur:+6,size:+6,speed:+6,camo:+6}, tag:"全面小幅↑", desc:"穩健但不極端。" },
    { title:"🎲 風險突變", delta:{random:true}, tag:"可能大好/大壞", desc:"隨機大幅變動兩個性狀。" },
  ];
  function pick3Cards(){
    const pool=[...MUT_CARDS], out=[];
    for(let i=0;i<3;i++){ out.push(pool.splice(rndi(0,pool.length-1),1)[0]); }
    return out;
  }

  // state
  let generation=0;
  let population=[];
  let lastSurvive=null;
  let autoTimer=null;
  let scene = SCENES[1];
  let event = EVENTS[0];
  let currentCards=[], selectedCardIndex=null;

  // fx & per-creature emotes
  const fx = {
    snow: [],
    predatorSweep: 0, // 0..1
    heat: 0,
    flood: 0,
    boom: 0
  };

  // ---------- UI actions ----------
  ui.btnStart.addEventListener("click", () => { stopAuto(); startNew(); });
  ui.btnNext.addEventListener("click", () => step());
  ui.btnAuto.addEventListener("click", () => {
    ui.btnAuto.disabled=true; ui.btnNext.disabled=true; ui.btnStop.disabled=false;
    autoTimer=setInterval(()=>{ step(); if(population.length===0) stopAuto(true); }, 850);
  });
  ui.btnStop.addEventListener("click", () => stopAuto());

  function stopAuto(fromExt=false){
    if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
    ui.btnStop.disabled=true;
    ui.btnAuto.disabled = population.length===0;
    ui.btnNext.disabled = population.length===0;
    if(fromExt) log(`⚠️ 族群滅絕，自動跑停止。`);
  }

  // ---------- start ----------
  function startNew(){
    generation=0;
    population=[];
    lastSurvive=null;
    ui.log.innerHTML="";
    scene = SCENES[rndi(0,SCENES.length-1)];
    event = pickEventForScene(scene);

    const n = +ui.initPop.value;
    const base = {fur:+ui.fur.value,size:+ui.size.value,speed:+ui.speed.value,camo:+ui.camo.value};
    const spread = Math.max(2, Math.round(+ui.mut.value*0.55));

    for(let i=0;i<n;i++){
      population.push(makeInd(
        clamp(base.fur + randn()*spread, 0, 100),
        clamp(base.size + randn()*spread, 0, 100),
        clamp(base.speed + randn()*spread, 0, 100),
        clamp(base.camo + randn()*spread, 0, 100)
      ));
    }

    nextCards();
    syncUI();
    log(`✅ 建立族群 ${n} 隻。先選 1 張突變卡，再按「下一代」。`);
    ui.btnNext.disabled=false;
    ui.btnAuto.disabled=false;
  }

  function makeInd(fur,size,speed,camo){
    return {
      fur,size,speed,camo,
      phase:rnd(10), seed:rnd(9999),
      // emotes timers (seconds-ish in frames)
      scared:0, sweat:0, star:0,
      float:0, // for flood
      // run offset when scared
      runDx:0
    };
  }

  // ---------- step ----------
  function step(){
    if(population.length===0) return;
    if(selectedCardIndex===null){ log(`🃏 你還沒選突變卡。請先選 1 張再進入下一代。`); return; }

    const chosen = currentCards[selectedCardIndex];
    const mutStrength = +ui.mut.value;
    const harsh = +ui.harsh.value/100;
    const evPow = +ui.evPow.value/100;

    scene = maybeShiftScene(scene);
    event = pickEventForScene(scene);

    // score individuals
    const scores = population.map(ind => {
      const affinity = clamp(event.score(ind), 0, 1);
      const pressure = lerp(0.50, 1.0, affinity);
      const evEffect = lerp(1.0-0.58*evPow, 1.0, pressure);

      // camo & scene match (simplified)
      const camoEffect = lerp(0.78, 1.06, ind.camo/100);

      // speed cost mild
      const speedCost = lerp(1.02, 0.92, ind.speed/100);

      const luck = lerp(0.92, 1.08, Math.random());
      return clamp(evEffect*camoEffect*speedCost*luck, 0, 2);
    });

    // survival
    const surviveFrac = clamp(1.0 - harsh, 0.12, 0.78);
    const targetSurvivors = Math.max(1, Math.floor(population.length * surviveFrac));
    const order = scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
    const survivors = order.slice(0,targetSurvivors).map(o=>population[o.i]);
    lastSurvive = survivors.length / population.length;

    // growth by event
    let growth = 1.7;
    if(event.key==="boom") growth = 2.2;
    if(event.key==="drought") growth = 1.25;
    if(event.key==="blizzard") growth = 1.35;
    if(event.key==="heatwave") growth = 1.35;
    if(event.key==="predator") growth = 1.45;
    if(event.key==="flood") growth = 1.35;

    const nextN = clamp(Math.round(survivors.length * growth), 0, 260);

    generation++;
    population = reproduce(survivors, nextN, mutStrength, chosen);

    // trigger emotes/FX strongly
    triggerEventEffects(event.key);

    // next cards
    nextCards();
    syncUI();
    log(
      `第 <b>${generation}</b> 代｜場景：<b>${scene.name}</b>｜事件：<b>${event.name}</b><br>`+
      `存活率：<span class="mono">${Math.round(lastSurvive*100)}%</span> → 族群：<span class="mono">${population.length}</span><br>`+
      `<span style="opacity:.78">${event.desc}</span>｜你選：<b>${chosen.title}</b>`
    );

    if(population.length===0){
      log(`💀 族群滅絕。建議：降低嚴苛度/事件強度或提高突變強度。`);
      stopAuto(true);
    }
  }

  function reproduce(parents, n, mutStrength, chosen){
    if(parents.length===0 || n===0) return [];
    const kids=[];
    for(let i=0;i<n;i++){
      const a=parents[rndi(0,parents.length-1)];
      const b=parents[rndi(0,parents.length-1)];
      let fur=(a.fur+b.fur)/2, size=(a.size+b.size)/2, speed=(a.speed+b.speed)/2, camo=(a.camo+b.camo)/2;

      const d=chosen.delta||{};
      if(d.random){
        const traits=["fur","size","speed","camo"];
        for(let k=0;k<2;k++){
          const t=traits.splice(rndi(0,traits.length-1),1)[0];
          const bump=(Math.random()<0.5?-1:1)*rndi(10,18);
          if(t==="fur") fur+=bump;
          if(t==="size") size+=bump;
          if(t==="speed") speed+=bump;
          if(t==="camo") camo+=bump;
        }
      }else{
        fur += (d.fur||0);
        size += (d.size||0);
        speed += (d.speed||0);
        camo += (d.camo||0);
      }

      fur += randn()*mutStrength;
      size += randn()*mutStrength;
      speed += randn()*mutStrength;
      camo += randn()*mutStrength;

      kids.push(makeInd(
        clamp(fur,0,100),
        clamp(size,0,100),
        clamp(speed,0,100),
        clamp(camo,0,100)
      ));
    }
    return kids;
  }

  // ---------- cards ----------
  function nextCards(){ currentCards=pick3Cards(); selectedCardIndex=null; renderCards(); }
  function renderCards(){
    ui.cards.innerHTML="";
    currentCards.forEach((c, idx) => {
      const el=document.createElement("div");
      el.className="mcard";
      el.innerHTML=`<div class="t">${c.title}</div><div class="d">${c.desc}</div><div class="tag">${c.tag}</div>`;
      el.addEventListener("click", ()=>{
        selectedCardIndex=idx;
        [...ui.cards.children].forEach(ch=>ch.classList.remove("selected"));
        el.classList.add("selected");
      });
      ui.cards.appendChild(el);
    });
  }

  // ---------- UI ----------
  function calcAvg(arr){
    if(arr.length===0) return {fur:0,size:0,speed:0,camo:0};
    let fur=0,size=0,speed=0,camo=0;
    for(const x of arr){ fur+=x.fur; size+=x.size; speed+=x.speed; camo+=x.camo; }
    const n=arr.length;
    return {fur:fur/n,size:size/n,speed:speed/n,camo:camo/n};
  }
  function syncUI(){
    ui.gen.textContent=generation;
    ui.pop.textContent=population.length;
    ui.sceneName.textContent=scene?scene.name:"—";
    ui.eventName.textContent=event?event.name:"—";
    const avg=calcAvg(population);
    ui.avgTraits.textContent=`fur ${fmt(avg.fur)} | size ${fmt(avg.size)} | speed ${fmt(avg.speed)} | camo ${fmt(avg.camo)}`;
    ui.surviveRate.textContent=(lastSurvive==null)?"—":`${Math.round(lastSurvive*100)}%`;
    const alive=population.length>0;
    ui.btnNext.disabled=!alive || !!autoTimer;
    ui.btnAuto.disabled=!alive || !!autoTimer;
    ui.btnStop.disabled=!autoTimer;
  }
  function log(html){
    const div=document.createElement("div");
    div.className="e";
    div.innerHTML=html;
    ui.log.prepend(div);
  }

  // ---------- event effects ----------
  function triggerEventEffects(key){
    // reset global fx intensity to 1, then decay in render
    if(key==="blizzard"){
      fx.snow = new Array(240).fill(0).map(()=>({
        x:rnd(1), y:rnd(1), r:lerp(0.8,2.4,Math.random()), v:lerp(0.18,0.75,Math.random()), sway:rnd(10)
      }));
    }
    if(key==="predator") fx.predatorSweep = 1;
    if(key==="heatwave") fx.heat = 1;
    if(key==="flood") fx.flood = 1;
    if(key==="boom") fx.boom = 1;

    // per creature emotes
    const n = population.length;
    if(n===0) return;

    if(key==="predator"){
      // mark some as "scared": more likely among low speed / low camo
      const count = Math.min(18, Math.max(6, Math.round(n*0.22)));
      for(let k=0;k<count;k++){
        const ind = population[rndi(0,n-1)];
        const p = (1 - ind.speed/100)*0.6 + (1 - ind.camo/100)*0.4;
        if(Math.random() < clamp(p,0.15,0.85)){
          ind.scared = 90;
          ind.runDx = (Math.random()<0.5?-1:1) * lerp(8, 24, 1 - ind.speed/100);
        }
      }
    }
    if(key==="heatwave"){
      for(const ind of population){
        if(Math.random() < lerp(0.15, 0.65, ind.fur/100)) ind.sweat = 80;
      }
    }
    if(key==="boom"){
      for(const ind of population){
        if(Math.random() < 0.35) ind.star = 90;
      }
    }
    if(key==="flood"){
      for(const ind of population){
        if(Math.random() < 0.55) ind.float = 110;
      }
    }
    if(key==="blizzard"){
      for(const ind of population){
        if(Math.random() < lerp(0.15, 0.75, 1 - ind.fur/100)) ind.scared = Math.max(ind.scared, 60); // low fur shiver
      }
    }
  }

  // ---------- Rendering ----------
  const ctx = ui.canvas.getContext("2d");
  const W = ui.canvas.width, H = ui.canvas.height;
  const SAMPLE_MAX = 36;

  function drawScene(t){
    const base=scene.base, acc=scene.accent;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, rgb(base, 0.95));
    g.addColorStop(1, rgb(acc, 0.35));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    ctx.fillStyle=rgb(base, 0.35);
    ctx.fillRect(0, H*0.62, W, H*0.38);

    // landscape
    ctx.globalAlpha=0.22;
    ctx.fillStyle=rgb(acc, 1);
    for(let i=0;i<7;i++){
      const x=(i/6)*W + Math.sin(t*0.0003+i)*30;
      const y=H*0.60 + Math.sin(i*1.7)*12;
      const w=260+i*40, h=110+i*16;
      hill(x-w/2, y, w, h);
    }
    ctx.globalAlpha=1;

    // decorations
    if(scene.key==="forest"){
      ctx.globalAlpha=0.25;
      for(let i=0;i<18;i++){ tree((i/18)*W + Math.sin(t*0.0002+i)*20, H*0.62 + (i%3)*8, 55+(i%5)*14, 90+(i%7)*16); }
      ctx.globalAlpha=1;
    }
    if(scene.key==="ice"){
      ctx.globalAlpha=0.18;
      for(let i=0;i<14;i++){ ice((i/13)*W + Math.sin(t*0.00022+i)*22, H*0.62 + (i%3)*8, 60+(i%6)*18, 45+(i%5)*12); }
      ctx.globalAlpha=1;
    }
    if(scene.key==="desert"){
      ctx.globalAlpha=0.20;
      for(let i=0;i<12;i++){ cactus((i/11)*W + Math.sin(t*0.00024+i)*18, H*0.64 + (i%4)*6, 20+(i%4)*6, 70+(i%5)*10); }
      ctx.globalAlpha=1;
    }
  }
  function hill(cx, y, w, h){
    ctx.beginPath(); ctx.ellipse(cx, y, w/2, h/2, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();
  }
  function tree(x,y,w,h){
    ctx.fillStyle="rgba(15,30,22,0.55)";
    ctx.fillRect(x-6,y-48,12,48);
    ctx.beginPath(); ctx.ellipse(x, y-60, w/2, h/2, 0, 0, Math.PI*2); ctx.fill();
  }
  function ice(x,y,w,h){
    ctx.fillStyle="rgba(230,245,255,0.55)";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-w/2, y+h); ctx.lineTo(x+w/2, y+h); ctx.closePath(); ctx.fill();
  }
  function cactus(x,y,w,h){
    ctx.fillStyle="rgba(30,80,60,0.55)";
    ctx.fillRect(x-w/2, y-h, w, h);
    ctx.fillRect(x-w/2-16, y-h*0.65, 14, h*0.35);
    ctx.fillRect(x+w/2+2, y-h*0.75, 14, h*0.35);
  }

  function drawFX(t){
    // decay intensities
    fx.predatorSweep *= 0.992;
    fx.heat *= 0.992;
    fx.flood *= 0.992;
    fx.boom *= 0.992;

    // snow
    if(event.key==="blizzard" && fx.snow.length){
      ctx.globalAlpha=0.75;
      ctx.fillStyle="rgba(255,255,255,0.9)";
      fx.snow.forEach(p=>{
        p.y += p.v*0.007;
        p.x += Math.sin(t*0.001 + p.sway)*0.0007;
        if(p.y>1){ p.y=0; p.x=rnd(1); }
        ctx.beginPath(); ctx.ellipse(p.x*W, p.y*H*0.95, p.r, p.r, 0,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;
    }

    // heat shimmer
    if(event.key==="heatwave" || fx.heat>0.05){
      const a = (event.key==="heatwave"?0.18:0.10) * clamp(fx.heat,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle="rgba(255,220,140,1)";
      for(let i=0;i<10;i++){
        const y=H*0.60 + i*18 + Math.sin(t*0.004+i)*8;
        ctx.fillRect(0,y,W,6);
      }
      ctx.globalAlpha=1;
    }

    // flood waves
    if(event.key==="flood" || fx.flood>0.05){
      const a = (event.key==="flood"?0.24:0.12) * clamp(fx.flood,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle="rgba(120,190,255,1)";
      const baseY=H*0.70;
      for(let i=0;i<7;i++){
        const y=baseY + i*22 + Math.sin(t*0.004+i)*10;
        ctx.fillRect(0,y,W,8);
      }
      ctx.globalAlpha=1;
    }

    // predator shadow sweep
    if(event.key==="predator" || fx.predatorSweep>0.05){
      const a = (event.key==="predator"?0.25:0.12) * clamp(fx.predatorSweep,0,1);
      const sweep=(Math.sin(t*0.0012)+1)/2;
      ctx.globalAlpha=a;
      ctx.fillStyle="rgba(0,0,0,1)";
      const w=W*0.48;
      const x=lerp(-w, W, sweep);
      ctx.beginPath(); ctx.ellipse(x, H*0.42, w, H*0.22, -0.18, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }

    // boom sparkles
    if(event.key==="boom" || fx.boom>0.05){
      const a = (event.key==="boom"?0.22:0.10) * clamp(fx.boom,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle="rgba(255,255,255,1)";
      for(let i=0;i<22;i++){
        const x=(i/22)*W + Math.sin(t*0.002+i)*40;
        const y=H*0.20 + (i%7)*22 + Math.sin(t*0.003+i)*18;
        ctx.fillRect(x,y,3,3);
      }
      ctx.globalAlpha=1;
    }
  }

  function drawCreature(ind, t, i, total){
    const cols = Math.ceil(Math.sqrt(total));
    const rows = Math.ceil(total/cols);
    const col = i % cols;
    const row = Math.floor(i/cols);
    const cellW = W/(cols+1);
    const bandY0 = H*0.64, bandY1 = H*0.95;
    const cellH = (bandY1-bandY0)/(rows+0.7);

    const cx = cellW*(col+1);
    const cy = bandY0 + cellH*(row+0.8);

    const size = lerp(22, 46, ind.size/100);
    const speed = ind.speed/100;

    // base wiggle
    let hop = Math.sin(t*0.006 + ind.phase) * lerp(1.5, 7.5, speed);
    let sway = Math.sin(t*0.004 + ind.phase*1.3) * lerp(1.0, 6.0, speed);

    // scared shake (predator or blizzard low fur)
    if(ind.scared>0){
      ind.scared--;
      const sh = Math.sin(t*0.08 + ind.phase*4) * 6;
      sway += sh;
      hop += Math.abs(Math.sin(t*0.06 + ind.phase))*4;
      // run sideways
      ind.runDx *= 0.96;
      sway += ind.runDx;
    }

    // flood float
    if(ind.float>0){
      ind.float--;
      hop += Math.sin(t*0.01 + ind.phase)*10;
    }

    const camo = ind.camo/100;
    const fun = [240, 165 + (ind.seed%60), 210];
    const body = [
      Math.round(lerp(fun[0], scene.base[0], camo)),
      Math.round(lerp(fun[1], scene.base[1], camo)),
      Math.round(lerp(fun[2], scene.base[2], camo)),
    ];

    // fur spikes
    const fur = ind.fur/100;
    const spikes = Math.round(lerp(6, 18, fur));
    const spikeLen = lerp(3, 10, fur);

    const x = cx + sway;
    const y = cy + hop*0.35;

    // shadow
    ctx.globalAlpha=0.22;
    ctx.fillStyle="rgba(0,0,0,0.9)";
    ctx.beginPath(); ctx.ellipse(x, cy+size*0.62, size*0.65, size*0.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;

    // fur ring
    if(fur>0.06){
      ctx.strokeStyle = `rgba(255,255,255,${lerp(0.08,0.22,fur)})`;
      ctx.lineWidth=2;
      for(let k=0;k<spikes;k++){
        const ang=(k/spikes)*Math.PI*2;
        const wig=Math.sin(t*0.012 + ind.phase + k)*lerp(0.4,1.6,fur);
        const r0=size*0.92;
        const r1=r0 + spikeLen + wig;
        ctx.beginPath();
        ctx.moveTo(x+Math.cos(ang)*r0, y+Math.sin(ang)*r0);
        ctx.lineTo(x+Math.cos(ang)*r1, y+Math.sin(ang)*r1);
        ctx.stroke();
      }
    }

    // body
    ctx.fillStyle=rgb(body, 0.96);
    ctx.beginPath(); ctx.ellipse(x, y, size, size*0.92, Math.sin(ind.phase)*0.03, 0, Math.PI*2); ctx.fill();

    // cheeks
    ctx.globalAlpha=0.35;
    ctx.fillStyle="rgba(255,120,160,1)";
    ctx.beginPath(); ctx.ellipse(x-size*0.45, y+size*0.10, size*0.18, size*0.12, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+size*0.45, y+size*0.10, size*0.18, size*0.12, 0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;

    // eyes blink
    const blink = (Math.sin(t*0.006 + ind.phase*2.2) > 0.97) ? 0.12 : 1.0;
    const eyeY=y-size*0.18, eyeX=size*0.36;

    ctx.fillStyle="rgba(255,255,255,0.96)";
    ctx.beginPath(); ctx.ellipse(x-eyeX, eyeY, size*0.22, size*0.20*blink, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+eyeX, eyeY, size*0.22, size*0.20*blink, 0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle="rgba(20,25,30,0.96)";
    const pupJ=Math.sin(t*0.002 + ind.phase)*0.08;
    ctx.beginPath(); ctx.ellipse(x-eyeX + pupJ*size, eyeY, size*0.10, size*0.10*blink, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+eyeX + pupJ*size, eyeY, size*0.10, size*0.10*blink, 0,0,Math.PI*2); ctx.fill();

    // mouth
    ctx.strokeStyle="rgba(30,30,35,0.65)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(x, y+size*0.18, size*0.35, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();

    // legs (more if speed)
    const legAmp=lerp(2,10,speed);
    const legPh=t*0.02+ind.phase;
    const legY=y+size*0.70;
    const l1=Math.sin(legPh)*legAmp;
    const l2=Math.sin(legPh+Math.PI)*legAmp;
    ctx.strokeStyle="rgba(20,25,30,0.35)";
    ctx.lineWidth=4; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x-size*0.35, legY); ctx.lineTo(x-size*0.35 + l1*0.25, legY + legAmp*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+size*0.35, legY); ctx.lineTo(x+size*0.35 + l2*0.25, legY + legAmp*0.25); ctx.stroke();

    // emotes: sweat, star (above head)
    if(ind.sweat>0){
      ind.sweat--;
      ctx.globalAlpha=0.85;
      ctx.fillStyle="rgba(180,220,255,0.95)";
      const dropY = y - size*0.95 - (ind.sweat%20)*0.8;
      ctx.beginPath();
      ctx.ellipse(x+size*0.65, dropY, 4, 7, 0.2, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    }
    if(ind.star>0){
      ind.star--;
      ctx.globalAlpha=0.9;
      ctx.fillStyle="rgba(255,255,220,0.98)";
      const sy = y - size*1.05 + Math.sin(t*0.02 + ind.phase)*6;
      drawStar(x-size*0.70, sy, 7);
      drawStar(x+size*0.70, sy+8, 6);
      ctx.globalAlpha=1;
    }
  }

  function drawStar(x,y,r){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a = (i/10)*Math.PI*2;
      const rr = (i%2===0) ? r : r*0.45;
      const px = x + Math.cos(a)*rr;
      const py = y + Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawHUD(){
    ctx.fillStyle="rgba(0,0,0,0.35)";
    roundRect(18,18,560,90,14); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.12)"; ctx.stroke();

    ctx.fillStyle="rgba(255,255,255,0.86)";
    ctx.font="900 22px ui-sans-serif, system-ui";
    ctx.fillText(`第 ${generation} 代`, 34, 52);

    ctx.font="700 14px ui-sans-serif, system-ui";
    ctx.fillStyle="rgba(255,255,255,0.78)";
    ctx.fillText(`場景：${scene.name}   事件：${event.name}   族群：${population.length}`, 34, 78);
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function render(t){
    ctx.clearRect(0,0,W,H);
    drawScene(t);

    const n=population.length;
    const sampleCount=Math.min(SAMPLE_MAX, n);
    const step = sampleCount ? Math.max(1, Math.floor(n/sampleCount)) : 1;

    const sample=[];
    for(let i=0,k=0;i<n && k<sampleCount;i+=step,k++) sample.push(population[i]);
    sample.sort((a,b)=>a.size-b.size);

    for(let i=0;i<sample.length;i++) drawCreature(sample[i], t, i, sample.length);

    drawFX(t);
    drawHUD();
    requestAnimationFrame(render);
  }

  // init
  function init(){
    syncUI();
    renderCards();
    log(`👋 先按「建立族群 / 重新開始」。每代先選 1 張突變卡再前進。`);
    requestAnimationFrame(render);
  }
  init();

})();
</script>
</body>
