<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>genGrift 0.99 - 自主演化生態系</title>
    <style>
        :root { --bg: #050505; --accent: #00ffcc; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: 'Consolas', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #top-hud { background: #111; padding: 10px 25px; display: flex; justify-content: space-between; border-bottom: 2px solid #333; align-items: center; }
        .biomass-val { color: #ffd700; font-size: 1.5em; font-weight: bold; }
        #stage { flex-grow: 1; position: relative; background: #080808; overflow: hidden; }
        #env-effect { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 5; }
        #ui-bottom { height: 200px; background: #0a0a0a; border-top: 2px solid #333; display: flex; }
        .control-panel { width: 220px; padding: 15px; border-right: 1px solid #333; }
        .chart-panel { flex-grow: 1; padding: 10px; position: relative; display: flex; }
        #game-over { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<div id="top-hud">
    <div>YEAR: <span id="y-val">0</span> | POP: <span id="p-val">0</span></div>
    <div id="disaster-msg" style="color:var(--accent); font-weight:bold;">環境穩定</div>
    <div class="biomass-val">ENERGY: <span id="b-val">3000</span></div>
</div>

<div id="stage">
    <div id="env-effect"></div>
    <canvas id="mainCanvas"></canvas>
    <div id="game-over">
        <h1 style="color:#ff3333; font-size: 4em; margin:0;">族群滅絕</h1>
        <p style="font-size: 1.5em; color:#ffd700;">存活紀錄：<span id="final-year">0</span> 年</p>
        <button class="btn" onclick="location.reload()">重新挑戰</button>
    </div>
</div>

<div id="ui-bottom">
    <div class="control-panel">
        <button class="btn" style="width:100%" onclick="openBreedModal()">人擇干預</button>
        <div style="font-size: 10px; color:#777; margin-top:10px;">
            ● 藍色圓點：僅[S]可吃<br>
            ● 紅色圓點：僅[R]可吃<br>
            ● 碰撞同類：自動生殖
        </div>
    </div>
    <div class="chart-panel">
        <canvas id="chartCanvas"></canvas>
        <div id="legend" style="width:120px; font-size:11px; padding-left:10px;"></div>
    </div>
</div>

<script>
/** 核心類別與邏輯 **/
const GENES = {
    f: { name: '毛皮(F)', col: '#ff5555' },
    c: { name: '斑點(C)', col: '#55ff55' },
    s: { name: '速度(S)', col: '#5555ff' },
    r: { name: '體型(R)', col: '#ffff55' }
};

let state = {
    year: 0, biomass: 3000, population: [], foods: [],
    history: [], isDead: false, disaster: null
};

class Food {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * (window.innerHeight - 250);
        const rand = Math.random();
        this.type = rand > 0.8 ? 'R' : (rand > 0.6 ? 'S' : 'N'); // R:硬殼, S:快速, N:普通
        this.color = this.type === 'R' ? '#ff3333' : (this.type === 'S' ? '#33ccff' : '#33ff33');
        this.vx = this.type === 'S' ? (Math.random()-0.5)*10 : 0;
        this.vy = this.type === 'S' ? (Math.random()-0.5)*10 : 0;
    }
    update(w, h) {
        this.x += this.vx; this.y += this.vy;
        if(this.x < 0 || this.x > w) this.vx *= -1;
        if(this.y < 0 || this.y > h) this.vy *= -1;
    }
    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
    }
}

class Creature {
    constructor(x, y, genes, gender) {
        this.x = x; this.y = y;
        this.genes = genes;
        this.gender = gender || (Math.random() > 0.5 ? 'M' : 'F');
        this.age = 0; this.reproCooldown = 100; // 生殖冷卻
        this.angle = Math.random() * Math.PI * 2;
        
        this.isBig = genes.r.some(a => a === 'R');
        this.isFast = genes.s.some(a => a === 'S');
        this.hasFur = genes.f.some(a => a === 'F');
        this.hasCamo = genes.c.some(a => a === 'C');
        
        this.radius = this.isBig ? 18 : 9;
        this.speed = this.isFast ? 4.5 : 1.5;
    }

    update(w, h) {
        this.age++; if(this.reproCooldown > 0) this.reproCooldown--;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        if (this.x < 0 || this.x > w) this.angle = Math.PI - this.angle;
        if (this.y < 0 || this.y > h) this.angle = -this.angle;
        if (Math.random() < 0.02) this.angle += (Math.random()-0.5);

        // 代謝與紅利
        let cost = 0.08 + (this.isBig?0.05:0) + (this.isFast?0.05:0);
        if (state.disaster === 'cold' && !this.hasFur) cost *= 5; // 毛皮紅利：抗寒
        if (this.hasCamo) cost -= 0.04; // 斑點紅利：光合作用補償
        state.biomass -= cost;

        // 覓食檢測
        state.foods.forEach((f, index) => {
            let dist = Math.hypot(this.x - f.x, this.y - f.y);
            if (dist < this.radius + 5) {
                let canEat = (f.type === 'N') || (f.type === 'S' && this.isFast) || (f.type === 'R' && this.isBig);
                if (canEat) {
                    state.biomass += (f.type === 'N' ? 10 : 50);
                    state.foods.splice(index, 1);
                }
            }
        });
    }

    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y);
        ctx.fillStyle = this.gender === 'M' ? '#1a3a5a' : '#5a1a3a';
        // 畫身體與腳 (簡化呈現)
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
        if(this.hasFur) { ctx.strokeStyle = '#666'; ctx.lineWidth=1; for(let i=0;i<8;i++){ let a=i*Math.PI/4; ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*(this.radius+5),Math.sin(a)*(this.radius+5)); ctx.stroke();}}
        if(this.hasCamo) { ctx.fillStyle = this.gender==='M'?'#0cf':'#f0a'; ctx.beginPath(); ctx.arc(0,0,this.radius/2,0,Math.PI*2); ctx.fill();}
        ctx.restore();
    }
}

/** 碰撞檢測與自主生殖 **/
function handleReproduction() {
    for (let i = 0; i < state.population.length; i++) {
        for (let j = i + 1; j < state.population.length; j++) {
            let a = state.population[i];
            let b = state.population[j];
            let dist = Math.hypot(a.x - b.x, a.y - b.y);
            
            if (dist < a.radius + b.radius && a.gender !== b.gender && a.reproCooldown === 0 && b.reproCooldown === 0) {
                if (state.biomass > 100) { // 生殖門檻
                    let childGenes = {};
                    ['f','c','s','r'].forEach(k => {
                        childGenes[k] = [a.genes[k][Math.floor(Math.random()*2)], b.genes[k][Math.floor(Math.random()*2)]];
                    });
                    state.population.push(new Creature(a.x, a.y, childGenes));
                    a.reproCooldown = 300; b.reproCooldown = 300; // 防止連環生殖
                    state.biomass -= 50; // 生殖消耗
                }
            }
        }
    }
}

/** 主循環 **/
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function loop() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight - 200;
    if (state.isDead) return;

    // 食物生成
    if (state.foods.length < 40) state.foods.push(new Food());

    state.foods.forEach(f => { f.update(canvas.width, canvas.height); f.draw(ctx); });
    state.population.forEach((p, i) => { 
        p.update(canvas.width, canvas.height); p.draw(ctx);
        if (p.age > 2000) state.population.splice(i, 1); // 老死機制
    });
    
    handleReproduction();

    if (Date.now() % 1000 < 20) { state.year++; recordHistory(); }
    if (state.biomass <= 0 || state.population.length === 0) {
        state.isDead = true; document.getElementById('game-over').style.display='flex';
        document.getElementById('final-year').innerText = state.year;
    }
    
    document.getElementById('y-val').innerText = state.year;
    document.getElementById('p-val').innerText = state.population.length;
    document.getElementById('b-val').innerText = Math.floor(state.biomass);
    drawChart();
    requestAnimationFrame(loop);
}

// 數據圖表邏輯 (簡化)
function recordHistory() {
    let snap = { pop: state.population.length };
    ['f','c','s','r'].forEach(k => {
        snap[k] = state.population.filter(p => p.genes[k].includes(k.toUpperCase())).length / (state.population.length || 1);
    });
    state.history.push(snap); if(state.history.length > 100) state.history.shift();
}
function drawChart() {
    const c = document.getElementById('chartCanvas'); const cx = c.getContext('2d');
    c.width = c.offsetWidth; c.height = 180;
    state.history.forEach((d, i) => {
        let x = (i/100)*c.width;
        ['f','c','s','r'].forEach(k => {
            cx.fillStyle = GENES[k].col; cx.fillRect(x, c.height - d[k]*150 - 20, 2, 2);
        });
    });
}

// 初始化
for(let i=0; i<20; i++) state.population.push(new Creature(Math.random()*600, 200, {f:['f','f'], c:['c','c'], s:['s','s'], r:['r','r']}));
loop();
</script>
</body>
</html>
