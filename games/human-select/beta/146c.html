<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>genGrift 1.46c - 自然繁育修復版</title>
    <style>
        :root { --bg: #050505; --accent: #00ffcc; --text: #eee; --panel: #111; --btn-bg: #1a1a1a; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #top-hud { background: var(--panel); padding: 10px 25px; display: flex; justify-content: space-between; border-bottom: 2px solid #333; align-items: center; z-index: 10; }
        .biomass-val { color: #ffd700; font-size: 1.5em; font-weight: bold; }
        #stage { flex-grow: 1; position: relative; background: #080808; }
        #ui-bottom { height: 220px; background: var(--panel); border-top: 2px solid #333; display: flex; }
        .btn { background: var(--btn-bg); color: var(--accent); border: 1px solid var(--accent); padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; font-size: 13px; }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 10px var(--accent); }
        .tab-btn { background: #111; color: #666; border: 1px solid #333; padding: 5px 12px; cursor: pointer; font-size: 11px; margin-left: 5px; }
        .tab-btn.active { border-color: var(--accent); color: var(--accent); }
        #breed-modal { display: none; position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 920px; height: 85vh; background: #111; border: 2px solid var(--accent); padding: 25px; z-index: 3000; flex-direction: column; border-radius: 8px; box-shadow: 0 0 50px #000; }
        .embryo-pool { flex-grow: 1; background: #000; border: 1px solid #333; margin: 20px 0; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: flex-start; padding: 15px; gap: 12px; }
        .embryo-card { width: 85px; height: 110px; border: 1px solid #222; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; border-radius: 4px; }
        .gene-tag { font-size: 9px; color: #888; margin-top: 5px; font-family: monospace; line-height: 1.2; text-align: center; }
        .genotype-btn { width: 55px; height: 32px; background: #000; color: #555; border: 1px solid #333; cursor: pointer; font-size: 11px; }
        .genotype-btn.active { color: var(--accent); border-color: var(--accent); }
        .input-qty { background: #000; color: var(--accent); border: 1px solid #444; padding: 8px; width: 70px; text-align: center; font-size: 16px; }
        #end-screen { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.96); z-index:4000; color:white; padding:40px; box-sizing:border-box; overflow-y: auto; }
    </style>
</head>
<body>

<div id="top-hud">
    <div>YEAR: <span id="y-val">0</span> | POP: <span id="p-val">0</span></div>
    <div id="status-msg" style="color:var(--accent); font-weight:bold;">ENVIRONMENT MONITORING</div>
    <div class="biomass-val">ENERGY: <span id="b-val">0</span></div>
</div>

<div id="stage">
    <canvas id="mainCanvas"></canvas>
    <div id="end-screen">
        <h1 style="color:var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 10px;">族群演化終局報告</h1>
        <p id="end-stats" style="font-size: 1.2em; line-height: 1.6;"></p>
        <canvas id="endChart" width="1000" height="400" style="background:#111; border:1px solid #333; width:100%;"></canvas>
        <div style="margin-top:20px;"><button class="btn" onclick="location.reload()">重新啟動模擬</button></div>
    </div>
</div>

<div id="ui-bottom">
    <div class="control-panel">
        <button class="btn" style="width:100%;" onclick="openBreedModal()">OPEN BREEDING LAB</button>
        <p style="color:#555; margin-top:15px; font-size: 10px; line-height:1.4;">Ver 1.46c | 繁育機制修復</p>
    </div>
    <div class="chart-panel">
        <div style="display:flex; justify-content: flex-end; margin-bottom: 5px;">
            <button class="tab-btn active" id="btn-pop" onclick="setChart('pop')">人口</button>
            <button class="tab-btn" id="btn-freq" onclick="setChart('freq')">基因頻率</button>
            <button class="tab-btn" id="btn-pheno" onclick="setChart('pheno')">性狀比例</button>
        </div>
        <canvas id="chartCanvas"></canvas> 
    </div>
</div>

<div id="breed-modal">
    <h2 style="margin:0; color:var(--accent); text-align:center; letter-spacing: 2px;">EMBRYO LAB</h2>
    <div style="display:flex; justify-content:space-around; align-items:center; margin-top:15px;">
        <div style="text-align:center;"><canvas id="male-pre" width="70" height="70"></canvas></div>
        <div style="flex-grow:1; max-width:550px;" id="gene-selector-rows"></div>
        <div style="text-align:center;"><canvas id="female-pre" width="70" height="70"></canvas></div>
    </div>
    <div style="text-align:center; margin-top:15px;">
        QTY: <input type="number" id="breed-qty" class="input-qty" value="32"> 
        <button class="btn" style="margin-left:15px;" onclick="generatePreview()">CROSS BREED</button>
    </div>
    <div class="embryo-pool" id="embryo-pool"></div>
    <div style="display:flex; justify-content:center; gap:20px;">
        <button class="btn" id="confirm-btn" style="display:none; border-color:#0f0; color:#0f0;" onclick="confirmRelease()">RELEASE</button>
        <button class="btn" style="border-color:#f55; color:#f55;" onclick="closeBreedModal()">ABORT</button>
    </div>
</div>

<script>
const CONFIG = {
    INITIAL_BIOMASS: 20000,    
    INITIAL_POP_SIZE: 50,      
    FOOD_SPAWN_RATE: 3,        
    MAX_FOOD_COUNT: 150,       
    ENERGY_N: 25, ENERGY_S: 250, ENERGY_R: 450,
    RATIO_R: 0.94, RATIO_S: 0.80,
    ADULT_AGE: 600, AVG_LIFESPAN: 3000, STD_DEVIATION: 500,
    DISASTER_CYCLE: 24, DISASTER_DURATION: 12
};

const GENES = { f:{name:'毛皮',dom:'F',rec:'f',col:'#ff5555'}, c:{name:'花紋',dom:'C',rec:'c',col:'#55ff55'}, s:{name:'速度',dom:'S',rec:'s',col:'#5555ff'}, r:{name:'體型',dom:'R',rec:'r',col:'#ffff55'} };

let state = {
    startTime: new Date(), year: 0, biomass: CONFIG.INITIAL_BIOMASS, population: [], foods: [], history: [], 
    chartMode: 'pop', isEnded: false, isPaused: false, event: 'normal', tempEmbryos: [],
    parentGeno: { male: { f:['F','F'], c:['c','c'], s:['S','S'], r:['r','r'] }, female: { f:['f','f'], c:['C','C'], s:['s','s'], r:['r','r'] } }
};

const EVENTS = {
    normal:{name:"穩定時期",bg:"#080808"}, ice:{name:"極寒流",bg:"#001a33"}, heat:{name:"酷暑熱浪",bg:"#331a00"}, radiation:{name:"光能輻射",bg:"#1a3300"}, dust:{name:"毒素塵埃",bg:"#1a1a1a"}, storm:{name:"電磁風暴",bg:"#1a0033"}, marsh:{name:"黏稠沼澤",bg:"#0d1a0d"}, meteor:{name:"隕石撞擊",bg:"#330000"}, hypoxia:{name:"氧氣稀薄",bg:"#1a0d00"}
};

function randomNormal(m, s) { let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return (Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))*s+m; }

class Food {
    constructor() { this.x=Math.random()*window.innerWidth; this.y=Math.random()*(window.innerHeight-250); let r=Math.random(); this.type=r>CONFIG.RATIO_R?'R':(r>CONFIG.RATIO_S?'S':'N'); this.vx=(this.type==='S')?(Math.random()-0.5)*7:0; this.vy=(this.type==='S')?(Math.random()-0.5)*7:0; }
    update(w,h){ this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>w)this.vx*=-1; if(this.y<0||this.y>h)this.vy*=-1; }
    draw(ctx){ ctx.strokeStyle='#555'; ctx.beginPath(); if(this.type==='N')ctx.arc(this.x,this.y,5,0,Math.PI*2); else if(this.type==='S'){ctx.moveTo(this.x,this.y-6);ctx.lineTo(this.x+6,this.y+4);ctx.lineTo(this.x-6,this.y+4);ctx.closePath();} else ctx.rect(this.x-5,this.y-5,10,10); ctx.stroke(); }
}

class Creature {
    constructor(x, y, g, gd, age=0) {
        this.x=x; this.y=y; this.genes=g; this.gender=gd||(Math.random()>0.5?'M':'F'); this.age=age;
        this.reproCooldown=400; this.angle=Math.random()*Math.PI*2; this.maxAge=randomNormal(CONFIG.AVG_LIFESPAN,CONFIG.STD_DEVIATION);
        this.isFast=g.s.includes('S'); this.isBig=g.r.includes('R'); this.hasFur=g.f.includes('F'); this.hasCamo=g.c.includes('C');
        this.radius=this.isBig?18:9; this.speedBase=this.isFast?3.8:1.4;
    }
    update(w,h){
        this.age++; if(this.reproCooldown>0) this.reproCooldown--;
        if(this.age>this.maxAge) return "dead";
        if(state.biomass>0){
            this.angle+=(Math.random()-0.5)*0.2; let s=this.speedBase; this.x+=Math.cos(this.angle)*s; this.y+=Math.sin(this.angle)*s;
            if(this.x<0||this.x>w)this.x=(this.x+w)%w; if(this.y<0||this.y>h)this.y=(this.y+h)%h;
        }
        state.biomass-=(0.1+(this.isBig?0.06:0)+(this.isFast?0.04:0));
        
        // 攝食與繁育
        state.foods.forEach((f,i)=>{ if(Math.hypot(this.x-f.x,this.y-f.y)<this.radius+6){ if(f.type==='N'||(f.type==='S'&&this.isFast)||(f.type==='R'&&this.isBig)){ state.biomass+=(f.type==='N'?25:(f.type==='S'?250:450)); state.foods.splice(i,1); } } });
        
        // 修正：補回碰撞檢測觸發自然繁育
        if(this.age > CONFIG.ADULT_AGE && this.reproCooldown <= 0) {
            state.population.forEach(other => {
                if(other !== this && other.age > CONFIG.ADULT_AGE && other.gender !== this.gender && other.reproCooldown <= 0) {
                    if(Math.hypot(this.x - other.x, this.y - other.y) < 20) {
                        this.handleReproduction(other);
                    }
                }
            });
        }
    }
    handleReproduction(partner) {
        this.reproCooldown = 1200; partner.reproCooldown = 1200; // 繁育後冷卻
        let cg = {};
        ['f','c','s','r'].forEach(k => {
            cg[k] = [this.genes[k][Math.floor(Math.random()*2)], partner.genes[k][Math.floor(Math.random()*2)]];
        });
        state.population.push(new Creature(this.x, this.y, cg, Math.random()>0.5?'M':'F'));
    }
    draw(ctx, isEmbryo=false){
        let grow=(!isEmbryo && this.age<CONFIG.ADULT_AGE)?(this.age/CONFIG.ADULT_AGE*0.7+0.3):1;
        ctx.save(); ctx.translate(this.x,this.y); ctx.scale(grow,grow); let r=this.radius;
        if(this.hasFur){ ctx.strokeStyle=(this.gender==='M'?'#1a3a5a':'#5a1a3a'); ctx.lineWidth=2; for(let i=0;i<12;i++){ let a=i*Math.PI/6; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); ctx.lineTo(Math.cos(a)*(r+10),Math.sin(a)*(r+10)); ctx.stroke(); } }
        ctx.fillStyle=this.gender==='M'?'#1a3a5a':'#5a1a3a'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
        if(this.hasCamo){ ctx.fillStyle=this.gender==='M'?'#0cf':'#f0a'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc((i-1)*r*0.4,0,3,0,Math.PI*2); ctx.fill(); } }
        ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-r/3,-r/4,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(r/3,-r/4,2,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

// --- 實驗室 UI 邏輯 ---
function openBreedModal() {
    state.isPaused=true; document.getElementById('breed-modal').style.display='flex';
    const container=document.getElementById('gene-selector-rows'); container.innerHTML='';
    for(let k in GENES){
        const g=GENES[k]; const row=document.createElement('div');
        row.style="display:flex; align-items:center; justify-content:space-between; margin:4px 0; background:#1a1a1a; padding:4px 12px; border:1px solid #333;";
        row.innerHTML=`<div style="display:flex; gap:3px">${['FF','Ff','ff'].map(t=>`<button class="genotype-btn ${getGType('male',k)===t?'active':''}" onclick="setGType('male','${k}','${t}')">${t.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}</div><div style="color:var(--accent); font-size:11px; width:70px; text-align:center">${g.name}</div><div style="display:flex; gap:3px">${['FF','Ff','ff'].map(t=>`<button class="genotype-btn ${getGType('female',k)===t?'active':''}" onclick="setGType('female','${k}','${t}')">${t.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}</div>`;
        container.appendChild(row);
    }
    updatePre();
}

function generatePreview(){
    const qty=parseInt(document.getElementById('breed-qty').value)||24;
    const pool=document.getElementById('embryo-pool'); pool.innerHTML=''; state.tempEmbryos=[];
    for(let i=0;i<qty;i++){
        let cg={}; ['f','c','s','r'].forEach(k=>{cg[k]=[state.parentGeno.male[k][Math.floor(Math.random()*2)],state.parentGeno.female[k][Math.floor(Math.random()*2)]];});
        let e=new Creature(42,45,cg,Math.random()>0.5?'M':'F'); state.tempEmbryos.push(e);
        const card=document.createElement('div'); card.className='embryo-card';
        const c=document.createElement('canvas'); c.width=85; c.height=70; e.draw(c.getContext('2d'),true);
        const tag=document.createElement('div'); tag.className='gene-tag'; tag.innerHTML=`${cg.f.join('')}${cg.c.join('')}<br>${cg.s.join('')}${cg.r.join('')}`;
        card.appendChild(c); card.appendChild(tag); pool.appendChild(card);
    }
    document.getElementById('confirm-btn').style.display='inline-block';
}

function closeBreedModal(){ state.isPaused=false; document.getElementById('breed-modal').style.display='none'; }
function confirmRelease(){ if(state.biomass<state.tempEmbryos.length*120)return alert("能量不足"); state.biomass-=state.tempEmbryos.length*120; state.tempEmbryos.forEach(e=>{e.x=Math.random()*window.innerWidth; e.y=Math.random()*(window.innerHeight-300); state.population.push(e);}); closeBreedModal(); }
function getGType(p,k){let g=state.parentGeno[p][k]; return g[0]===g[1]?(g[0]===k.toUpperCase()?'FF':'ff'):'Ff';}
function setGType(p,k,t){let D=k.toUpperCase(),r=k.toLowerCase(); state.parentGeno[p][k]=t==='FF'?[D,D]:(t==='ff'?[r,r]:[D,r]); updatePre(); openBreedModal();}
function updatePre(){['male','female'].forEach(s=>{const ctx=document.getElementById(s+'-pre').getContext('2d'); ctx.clearRect(0,0,100,100); new Creature(35,35,state.parentGeno[s],s==='male'?'M':'F').draw(ctx,true);});}

function loop() {
    const canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth; canvas.height=window.innerHeight-220;
    if(!state.isPaused && !state.isEnded){
        ctx.fillStyle=(EVENTS[state.event]||{bg:"#080808"}).bg; ctx.fillRect(0,0,canvas.width,canvas.height);
        if(state.biomass<=0||(state.population.length===0&&state.year>5)){ showEndReport(); return; }
        if(state.foods.length<CONFIG.MAX_FOOD_COUNT)for(let i=0;i<CONFIG.FOOD_SPAWN_RATE;i++)state.foods.push(new Food());
        state.foods.forEach(f=>{f.update(canvas.width,canvas.height);f.draw(ctx);});
        for(let i=state.population.length-1;i>=0;i--){let p=state.population[i]; if(p.update(canvas.width,canvas.height)==="dead")state.population.splice(i,1); else p.draw(ctx);}
        if(Date.now()%1000<20){
            state.year++;
            if(state.year%CONFIG.DISASTER_CYCLE===0)state.event=Object.keys(EVENTS)[Math.floor(Math.random()*9)];
            else if(state.year%CONFIG.DISASTER_CYCLE===CONFIG.DISASTER_DURATION)state.event='normal';
            recordHistory();
        }
    }
    document.getElementById('y-val').innerText=state.year;
    document.getElementById('p-val').innerText=state.population.length;
    document.getElementById('b-val').innerText=Math.floor(state.biomass);
    document.getElementById('status-msg').innerText=EVENTS[state.event].name;
    drawChart(); requestAnimationFrame(loop);
}

function recordHistory(){
    let snap={pop:state.population.length, event:EVENTS[state.event].name, year:state.year};
    for(let k in GENES){
        let total=state.population.length*2||1, domCount=0;
        state.population.forEach(p=>{if(p.genes[k][0]===GENES[k].dom)domCount++; if(p.genes[k][1]===GENES[k].dom)domCount++;});
        snap['freq_'+k]=domCount/total; snap['pheno_'+k]=state.population.filter(p=>p.genes[k].includes(GENES[k].dom)).length/(state.population.length||1);
    }
    state.history.push(snap); if(state.history.length>120)state.history.shift();
}

function drawChart(){
    const c=document.getElementById('chartCanvas'),cx=c.getContext('2d');
    c.width=c.offsetWidth; c.height=150; if(state.history.length<2)return;
    const data=state.history;
    if(state.chartMode==='pop'){
        const maxPop=Math.max(...data.map(d=>d.pop), 100);
        cx.strokeStyle='#00ffcc'; cx.lineWidth=2; cx.beginPath();
        data.forEach((d,i)=>{let x=(i/(data.length-1))*c.width, y=c.height-(d.pop/maxPop)*c.height*0.8-10; i===0?cx.moveTo(x,y):cx.lineTo(x,y);});
        cx.stroke();
    }else{
        let pre=state.chartMode==='freq'?'freq_':'pheno_';
        for(let k in GENES){
            cx.strokeStyle=GENES[k].col; cx.beginPath();
            data.forEach((d,i)=>{let x=(i/(data.length-1))*c.width, y=c.height-d[pre+k]*c.height*0.8-10; i===0?cx.moveTo(x,y):cx.lineTo(x,y);});
            cx.stroke();
        }
    }
}

function setChart(m){
    state.chartMode=m;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('btn-'+m).classList.add('active');
}

function showEndReport() {
    state.isEnded=true;
    const playSec=Math.floor((new Date()-state.startTime)/1000);
    const screen=document.getElementById('end-screen');
    const stats=document.getElementById('end-stats');
    screen.style.display='block';
    stats.innerHTML=`遊戲時長：${playSec} 秒 | 終局年份：${state.year} 年<br>滅絕原因：${state.biomass<=0?"環境能量耗盡 (Energy Crash)":"個體全部死亡 (Extinction)"}`;
    const cvs=document.getElementById('endChart'), ctx=cvs.getContext('2d');
    const data=state.history; if(data.length<5) return;
    const pad=50, w=cvs.width-pad*2, h=cvs.height-pad*2;
    const maxP=Math.max(...data.map(d=>d.pop), 10);
    ctx.strokeStyle='#444'; ctx.beginPath(); ctx.moveTo(pad,pad); ctx.lineTo(pad,h+pad); ctx.lineTo(w+pad,h+pad); ctx.stroke();
    ctx.strokeStyle='#00ffcc'; ctx.lineWidth=3; ctx.beginPath();
    data.forEach((d,i)=>{ let x=pad+(i/(data.length-1))*w, y=pad+h-(d.pop/maxP)*h; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
}

window.onload=()=>{ for(let i=0;i<CONFIG.INITIAL_POP_SIZE;i++){state.population.push(new Creature(Math.random()*window.innerWidth, Math.random()*400, {f:['f','f'],c:['c','c'],s:['s','s'],r:['r','r']}, null, Math.random()*2000));} loop(); };
</script>
</body>
</html>
