<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>genGrift 1.4 - 終局分析與工業全性狀版</title>
    <style>
        :root { --bg: #050505; --accent: #00ffcc; --text: #eee; --panel: #111; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #top-hud { background: var(--panel); padding: 10px 25px; display: flex; justify-content: space-between; border-bottom: 2px solid #333; align-items: center; z-index: 10; }
        .biomass-val { color: #ffd700; font-size: 1.5em; font-weight: bold; }
        #stage { flex-grow: 1; position: relative; background: #080808; transition: 1.5s; }
        #ui-bottom { height: 220px; background: var(--panel); border-top: 2px solid #333; display: flex; }
        .control-panel { width: 280px; padding: 15px; border-right: 1px solid #333; font-size: 11px; }
        .chart-panel { flex-grow: 1; padding: 10px; display: flex; flex-direction: column; }
        #breed-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 850px; background: #1a1a1a; border: 2px solid var(--accent); padding: 25px; z-index: 1001; box-shadow: 0 0 100px #000; }
        .genotype-btn { width: 55px; height: 32px; background: #000; color: #666; border: 1px solid #444; cursor: pointer; font-size: 11px; }
        .genotype-btn.active { color: var(--accent); border-color: var(--accent); }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .tab-btn { background: #222; color: #777; border: none; padding: 5px 12px; cursor: pointer; font-size: 11px; margin-left: 5px; }
        .tab-btn.active { background: var(--accent); color: #000; }
        .input-qty { background: #000; color: var(--accent); border: 1px solid #444; padding: 5px; width: 60px; text-align: center; }
        /* 終局螢幕 */
        #end-screen { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.96); z-index:2000; color:white; padding:40px; box-sizing:border-box; overflow-y: auto; }
    </style>
</head>
<body>

<div id="top-hud">
    <div>YEAR: <span id="y-val">0</span> | POP: <span id="p-val">0</span></div>
    <div id="status-msg" style="color:var(--accent); font-weight:bold;">系統啟動中...</div>
    <div class="biomass-val">ENERGY: <span id="b-val">0</span></div>
</div>

<div id="stage">
    <canvas id="mainCanvas"></canvas>
    <div id="end-screen">
        <h1 style="color:var(--accent); border-bottom: 2px solid var(--accent); padding-bottom:10px;">族群演化終局報告 (V1.4)</h1>
        <p id="end-stats" style="font-size:1.2em; line-height:1.6; color:#bbb;"></p>
        <canvas id="endChart" width="1000" height="350" style="background:#111; border:1px solid #333; width: 100%; max-width: 1200px;"></canvas>
        <div style="margin-top:30px;"><button class="btn" onclick="location.reload()">重置實驗環境</button></div>
    </div>
</div>

<div id="ui-bottom">
    <div class="control-panel">
        <button class="btn" style="width:100%" onclick="openBreedModal()">人擇基因配對</button>
        <div style="color:#666; margin-top:10px; line-height:1.5;">
            <b style="color:#bbb">1.4 運行參數：</b><br>
            ● <b>災難標註</b>：自動偵測人口大轉折點<br>
            ● <b>全性狀回歸</b>：[F]毛皮 [C]花紋 [S]速度 [R]體型<br>
            ● <b>高回報機制</b>：△(250) □(450)
        </div>
    </div>
    <div class="chart-panel">
        <div style="display:flex; justify-content: flex-end; margin-bottom: 5px;">
            <button class="tab-btn active" onclick="setChart('pop')">人口</button>
            <button class="tab-btn" onclick="setChart('freq')">基因頻率</button>
            <button class="tab-btn" onclick="setChart('pheno')">性狀表現</button>
        </div>
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<div id="breed-modal">
    <h3 style="margin:0 0 20px 0; color:var(--accent); text-align:center;">工業化育種控制中心</h3>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <canvas id="male-pre" width="100" height="100" style="background:#000; border-radius:8px;"></canvas>
        <div style="flex-grow:1; padding: 0 20px;" id="gene-selector-rows"></div>
        <canvas id="female-pre" width="100" height="100" style="background:#000; border-radius:8px;"></canvas>
    </div>
    <div style="margin-top:25px; text-align:center;">
        數量：<input type="number" id="breed-qty" class="input-qty" value="100"> 
        <button class="btn" onclick="doMassBreed()">投放新族群</button>
        <button class="btn" style="background:#444; color:#ccc; margin-left:10px;" onclick="document.getElementById('breed-modal').style.display='none'">關閉</button>
    </div>
</div>

<script>
const CONFIG = {
    INITIAL_BIOMASS: 20000, INITIAL_POP_SIZE: 40,
    FOOD_SPAWN_RATE: 3, MAX_FOOD_COUNT: 150,
    ENERGY_N: 25, ENERGY_S: 250, ENERGY_R: 450,
    RATIO_R: 0.94, RATIO_S: 0.80,
    ADULT_AGE: 600, AVG_LIFESPAN: 3000, STD_DEVIATION: 500,
    DISASTER_CYCLE: 24, DISASTER_DURATION: 12
};

const GENES = {
    f: { name: '毛皮(F)', dom: 'F', rec: 'f', col: '#ff5555' },
    c: { name: '花紋(C)', dom: 'C', rec: 'c', col: '#55ff55' },
    s: { name: '速度(S)', dom: 'S', rec: 's', col: '#5555ff' },
    r: { name: '體型(R)', dom: 'R', rec: 'r', col: '#ffff55' }
};

let state = {
    startTime: new Date(), year: 0, biomass: CONFIG.INITIAL_BIOMASS, 
    population: [], foods: [], history: [], chartMode: 'pop', isEnded: false, event: 'normal',
    parentGeno: {
        male:   { f:['F','F'], c:['c','c'], s:['S','S'], r:['r','r'] },
        female: { f:['f','f'], c:['C','C'], s:['s','s'], r:['r','r'] }
    }
};

const EVENTS = {
    normal: { name: "穩定時期", bg: "#080808", desc: "環境溫和" },
    ice:    { name: "極寒流", bg: "#001a33", desc: "非[F]代謝 x5" },
    heat:   { name: "酷暑熱浪", bg: "#331a00", desc: "有[F]代謝 x2" },
    radiation: { name: "光能輻射", bg: "#1a3300", desc: "有[C]持續回能" },
    dust:   { name: "毒素塵埃", bg: "#1a1a1a", desc: "有[C]代謝 x1.5" },
    storm:  { name: "電磁風暴", bg: "#1a0033", desc: "高回報食物爆發" },
    marsh:  { name: "黏稠沼澤", bg: "#0d1a0d", desc: "有[S]速度減半" },
    meteor: { name: "隕石撞擊", bg: "#330000", desc: "□ 方塊食物爆發" },
    hypoxia:{ name: "氧氣稀薄", bg: "#1a0d00", desc: "有[R]代謝 x2" }
};

// 工具函式
function randomNormal(m, s) { let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return (Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))*s+m; }

class Food {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * (window.innerHeight - 250);
        let r = Math.random();
        this.type = r > CONFIG.RATIO_R ? 'R' : (r > CONFIG.RATIO_S ? 'S' : 'N');
        this.vx = (this.type === 'S') ? (Math.random()-0.5)*7 : 0;
        this.vy = (this.type === 'S') ? (Math.random()-0.5)*7 : 0;
    }
    update(w, h) { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>w)this.vx*=-1; if(this.y<0||this.y>h)this.vy*=-1; }
    draw(ctx) {
        ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5; ctx.beginPath();
        if(this.type==='N') ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
        else if(this.type==='S') { ctx.moveTo(this.x, this.y-6); ctx.lineTo(this.x+6, this.y+4); ctx.lineTo(this.x-6, this.y+4); ctx.closePath(); }
        else ctx.rect(this.x-5, this.y-5, 10, 10);
        ctx.stroke();
    }
}

class Creature {
    constructor(x, y, genes, gender, initialAge = 0) {
        this.x = x; this.y = y; this.genes = genes; 
        this.gender = gender || (Math.random() > 0.5 ? 'M' : 'F');
        this.age = initialAge;
        this.reproCooldown = 400;
        this.angle = Math.random() * Math.PI * 2;
        this.isResting = false;
        this.restTimer = Math.random() * 100;
        this.maxAge = randomNormal(CONFIG.AVG_LIFESPAN, CONFIG.STD_DEVIATION); 
        this.isFast = genes.s.includes('S');
        this.isBig = genes.r.includes('R');
        this.hasFur = genes.f.includes('F');
        this.hasCamo = genes.c.includes('C');
        this.radius = this.isBig ? 18 : 9;
        this.speedBase = this.isFast ? 3.8 : 1.4;
    }
    update(w, h) {
        this.age++; if(this.age > this.maxAge) return "dead";
        if(this.reproCooldown > 0) this.reproCooldown--;
        
        if (state.biomass > 0) {
            this.restTimer--;
            if(this.restTimer <= 0) { this.isResting = Math.random() < 0.25; this.restTimer = Math.random() * 300 + 100; }
            if(!this.isResting) {
                this.angle += (Math.random() - 0.5) * 0.2;
                let s = this.speedBase; if(state.event === 'marsh' && this.isFast) s *= 0.5;
                this.x += Math.cos(this.angle) * s; this.y += Math.sin(this.angle) * s;
                if(this.x<0||this.x>w) this.x=(this.x+w)%w; if(this.y<0||this.y>h) this.y=(this.y+h)%h;
            }
        }
        let cost = (0.1 + (this.isBig?0.06:0) + (this.isFast?0.04:0)) * (this.isResting?0.1:1);
        if(state.event==='ice'&&!this.hasFur) cost*=5; if(state.event==='heat'&&this.hasFur) cost*=2;
        state.biomass -= cost;

        state.foods.forEach((f, i) => {
            if(Math.hypot(this.x-f.x, this.y-f.y) < this.radius+6) {
                if(f.type==='N' || (f.type==='S'&&this.isFast) || (f.type==='R'&&this.isBig)) {
                    state.biomass += (f.type==='N'?CONFIG.ENERGY_N:(f.type==='S'?CONFIG.ENERGY_S:CONFIG.ENERGY_R));
                    state.foods.splice(i, 1);
                }
            }
        });
    }
    draw(ctx) {
        let grow = (this.age < CONFIG.ADULT_AGE) ? (this.age/CONFIG.ADULT_AGE*0.7+0.3) : 1;
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(grow, grow);
        if(this.isResting) ctx.globalAlpha = 0.5;
        const r = this.radius;
        // 繪製毛皮
        if(this.hasFur){ ctx.strokeStyle=this.gender==='M'?'#1a3a5a':'#5a1a3a'; for(let i=0;i<12;i++){ let a=i*Math.PI/6; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); ctx.lineTo(Math.cos(a)*(r+10),Math.sin(a)*(r+10)); ctx.stroke(); }}
        // 身體
        ctx.fillStyle = this.gender==='M'?'#1a3a5a':'#5a1a3a'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
        // 繪製花紋
        if(this.hasCamo){ ctx.fillStyle=this.gender==='M'?'#0cf':'#f0a'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc((i-1)*r*0.4,0,3,0,Math.PI*2); ctx.fill(); }}
        // 眼睛
        ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-r/3,-r/4,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(r/3,-r/4,3,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

function handleReproduction() {
    if(state.biomass < 200) return;
    for (let i=0; i<state.population.length; i++) {
        for (let j=i+1; j<state.population.length; j++) {
            let a = state.population[i], b = state.population[j];
            if (a.age > CONFIG.ADULT_AGE && b.age > CONFIG.ADULT_AGE && a.gender!==b.gender && a.reproCooldown===0) {
                if (Math.hypot(a.x-b.x, a.y-b.y) < a.radius+b.radius) {
                    let cg = {}; ['f','c','s','r'].forEach(k => cg[k] = [a.genes[k][Math.floor(Math.random()*2)], b.genes[k][Math.floor(Math.random()*2)]]);
                    state.population.push(new Creature(a.x, a.y, cg)); a.reproCooldown=600; b.reproCooldown=600; state.biomass -= 120;
                }
            }
        }
    }
}

// 1.4 終局報告邏輯
function showEndReport() {
    state.isEnded = true;
    const screen = document.getElementById('end-screen');
    const stats = document.getElementById('end-stats');
    const playSec = Math.floor((new Date() - state.startTime)/1000);
    
    screen.style.display = 'block';
    stats.innerHTML = `
        模擬運行時間：${playSec} 秒 | 最終年份：${state.year} 年<br>
        結束原因：${state.biomass <= 0 ? "<b>能量生態崩潰 (Energy Depleted)</b>" : "<b>族群全面滅絕 (Population Extinct)</b>"}
    `;

    const canvas = document.getElementById('endChart');
    const ctx = canvas.getContext('2d');
    const data = state.history; if(data.length<5) return;
    
    const pad = 60, w = canvas.width - pad*2, h = canvas.height - pad*2;
    const maxP = Math.max(...data.map(d=>d.pop), 10);
    
    // 繪製人口線
    ctx.strokeStyle='#00ffcc'; ctx.lineWidth=3; ctx.beginPath();
    data.forEach((d,i)=>{
        let x = pad + (i/(data.length-1))*w;
        let y = pad + h - (d.pop/maxP)*h;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();

    // 尋找轉折點 (斜率分析)
    let slopes = [];
    for(let i=2; i<data.length; i++){
        let diff = Math.abs((data[i].pop - data[i-1].pop) - (data[i-1].pop - data[i-2].pop));
        slopes.push({idx: i, val: diff, event: data[i].event});
    }
    let topEvents = slopes.sort((a,b)=>b.val-a.val).slice(0,3);
    
    topEvents.forEach(ev => {
        let x = pad + (ev.idx/(data.length-1))*w;
        let y = pad + h - (data[ev.idx].pop/maxP)*h;
        ctx.fillStyle='yellow'; ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='white'; ctx.fillText(ev.event, x+10, y-10);
    });
}

function loop() {
    if(state.isEnded) return;
    const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight-220;
    
    ctx.fillStyle = (EVENTS[state.event]||{bg:"#080808"}).bg; ctx.fillRect(0,0,canvas.width, canvas.height);

    if(state.biomass <= 0 || (state.population.length === 0 && state.year > 3)) { showEndReport(); return; }

    if(state.foods.length<CONFIG.MAX_FOOD_COUNT) for(let i=0;i<CONFIG.FOOD_SPAWN_RATE;i++) state.foods.push(new Food());
    state.foods.forEach(f=>{f.update(canvas.width, canvas.height); f.draw(ctx);});
    
    for(let i=state.population.length-1; i>=0; i--){
        let p=state.population[i]; if(p.update(canvas.width, canvas.height)==="dead") state.population.splice(i,1); else p.draw(ctx);
    }
    handleReproduction();

    if(Date.now()%1000<20) {
        state.year++;
        if(state.year % CONFIG.DISASTER_CYCLE === 0) state.event = Object.keys(EVENTS)[Math.floor(Math.random()*9)];
        else if(state.year % CONFIG.DISASTER_CYCLE === CONFIG.DISASTER_DURATION) state.event = 'normal';
        recordHistory();
    }
    document.getElementById('y-val').innerText=state.year;
    document.getElementById('p-val').innerText=state.population.length;
    document.getElementById('b-val').innerText=Math.floor(state.biomass);
    document.getElementById('status-msg').innerText=EVENTS[state.event].name;
    drawChart(); requestAnimationFrame(loop);
}

// 基因控制台
function openBreedModal() {
    const container = document.getElementById('gene-selector-rows'); container.innerHTML = '';
    for (let k in GENES) {
        const g = GENES[k]; const row = document.createElement('div');
        row.style = "display:flex; align-items:center; justify-content:space-between; margin:8px 0; background:#222; padding:6px 12px;";
        row.innerHTML = `<div style="display:flex; gap:3px">${['FF','Ff','ff'].map(t=>`<button class="genotype-btn ${getGType('male',k)===t?'active':''}" onclick="setGType('male','${k}','${t}')">${t.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}</div><div style="color:var(--accent); font-weight:bold; width:70px; text-align:center">${g.name}</div><div style="display:flex; gap:3px">${['FF','Ff','ff'].map(t=>`<button class="genotype-btn ${getGType('female',k)===t?'active':''}" onclick="setGType('female','${k}','${t}')">${t.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}</div>`;
        container.appendChild(row);
    }
    updatePre(); document.getElementById('breed-modal').style.display = 'block';
}
function getGType(p,k){let g=state.parentGeno[p][k]; return g[0]===g[1]?(g[0]===k.toUpperCase()?'FF':'ff'):'Ff';}
function setGType(p,k,t){let D=k.toUpperCase(),r=k.toLowerCase(); state.parentGeno[p][k]=t==='FF'?[D,D]:(t==='ff'?[r,r]:[D,r]); openBreedModal();}
function doMassBreed(){
    let qty=parseInt(document.getElementById('breed-qty').value)||100;
    if(state.biomass < qty*120) return alert("能量不足！");
    state.biomass -= qty*120;
    for(let i=0;i<qty;i++){
        let cg={}; ['f','c','s','r'].forEach(k=>cg[k]=[state.parentGeno.male[k][Math.floor(Math.random()*2)], state.parentGeno.female[k][Math.floor(Math.random()*2)]]);
        state.population.push(new Creature(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.4, cg));
    }
    document.getElementById('breed-modal').style.display='none';
}
function updatePre(){['male','female'].forEach(s=>{const ctx=document.getElementById(s+'-pre').getContext('2d'); ctx.clearRect(0,0,100,100); new Creature(50,50,state.parentGeno[s],s==='male'?'M':'F').draw(ctx);});}
function recordHistory(){
    let snap={pop:state.population.length, event: EVENTS[state.event].name, year: state.year};
    for(let k in GENES){
        let total=state.population.length*2||1, domCount=0;
        state.population.forEach(p=>{if(p.genes[k][0]===GENES[k].dom)domCount++; if(p.genes[k][1]===GENES[k].dom)domCount++;});
        snap['freq_'+k]=domCount/total; snap['pheno_'+k]=state.population.filter(p=>p.genes[k].includes(GENES[k].dom)).length/(state.population.length||1);
    }
    state.history.push(snap); if(state.history.length>100)state.history.shift();
}
function drawChart(){
    const c=document.getElementById('chartCanvas'),cx=c.getContext('2d'); c.width=c.offsetWidth; c.height=150; if(state.history.length<2)return;
    if(state.chartMode==='pop'){cx.strokeStyle='#fff';cx.beginPath();state.history.forEach((d,i)=>{let x=(i/100)*c.width,y=c.height-(d.pop/600)*c.height; i===0?cx.moveTo(x,y):cx.lineTo(x,y);});cx.stroke();}
    else{let pre=state.chartMode==='freq'?'freq_':'pheno_'; for(let k in GENES){cx.strokeStyle=GENES[k].col;cx.beginPath();state.history.forEach((d,i)=>{let x=(i/100)*c.width,y=c.height-d[pre+k]*c.height; i===0?cx.moveTo(x,y):cx.lineTo(x,y);});cx.stroke();}}
}
function setChart(m){state.chartMode=m; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');}

window.onload = () => {
    for(let i=0;i<CONFIG.INITIAL_POP_SIZE;i++) {
        state.population.push(new Creature(Math.random()*window.innerWidth, Math.random()*400, {f:['f','f'],c:['c','c'],s:['s','s'],r:['r','r']}, null, Math.random()*2000));
    }
    loop();
};
</script>
</body>
</html>
