<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>genGrift 1.35c - 鋼鐵永續工程</title>
    <style>
        :root { --bg: #050505; --accent: #00ffcc; --text: #eee; --panel: #111; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #top-hud { background: var(--panel); padding: 10px 25px; display: flex; justify-content: space-between; border-bottom: 2px solid #333; align-items: center; z-index: 10; }
        .biomass-val { color: #ffd700; font-size: 1.5em; font-weight: bold; }
        #stage { flex-grow: 1; position: relative; background: #080808; transition: 1.5s; }
        #ui-bottom { height: 220px; background: var(--panel); border-top: 2px solid #333; display: flex; }
        .control-panel { width: 280px; padding: 15px; border-right: 1px solid #333; font-size: 11px; }
        .chart-panel { flex-grow: 1; padding: 10px; display: flex; flex-direction: column; }
        #breed-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 850px; background: #1a1a1a; border: 2px solid var(--accent); padding: 25px; z-index: 1000; box-shadow: 0 0 100px #000; }
        .genotype-btn { width: 55px; height: 32px; background: #000; color: #666; border: 1px solid #444; cursor: pointer; font-size: 11px; }
        .genotype-btn.active { color: var(--accent); border-color: var(--accent); }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .tab-btn { background: #222; color: #777; border: none; padding: 5px 12px; cursor: pointer; font-size: 11px; margin-left: 5px; }
        .tab-btn.active { background: var(--accent); color: #000; }
        .input-qty { background: #000; color: var(--accent); border: 1px solid #444; padding: 5px; width: 60px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="top-hud">
    <div>YEAR: <span id="y-val">0</span> | POP: <span id="p-val">0</span></div>
    <div id="status-msg" style="color:var(--accent); font-weight:bold;">系統初始化...</div>
    <div class="biomass-val">ENERGY: <span id="b-val">0</span></div>
</div>

<div id="stage"><canvas id="mainCanvas"></canvas></div>

<div id="ui-bottom">
    <div class="control-panel">
        <button class="btn" style="width:100%" onclick="openBreedModal()">人擇基因配對 (R)</button>
        <div style="color:#666; margin-top:10px; line-height:1.4;">
            <b style="color:#bbb">1.35c 核心邏輯：</b><br>
            ● <b>靜止節能</b>：原地休息時消耗降至 10%<br>
            ● <b>高風險回報</b>：△(250) □(450)<br>
            ● <b>年齡結構</b>：初始人口具備隨機歲數<br>
            ● <b>週期</b>：<span id="cfg-cycle"></span>年 (災難長 <span id="cfg-dur"></span>年)
        </div>
    </div>
    <div class="chart-panel">
        <div style="display:flex; justify-content: flex-end; margin-bottom: 5px;">
            <button class="tab-btn active" onclick="setChart('pop')">人口</button>
            <button class="tab-btn" onclick="setChart('freq')">基因頻率</button>
            <button class="tab-btn" onclick="setChart('pheno')">性狀表現</button>
        </div>
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<div id="breed-modal">
    <h3 style="margin:0 0 20px 0; color:var(--accent); text-align:center;">1.35c 基因控制台</h3>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <canvas id="male-pre" width="100" height="100" style="background:#000; border-radius:8px;"></canvas>
        <div style="flex-grow:1; padding: 0 20px;" id="gene-selector-rows"></div>
        <canvas id="female-pre" width="100" height="100" style="background:#000; border-radius:8px;"></canvas>
    </div>
    <div style="margin-top:25px; text-align:center;">
        數量：<input type="number" id="breed-qty" class="input-qty" value="100"> 
        <button class="btn" onclick="doMassBreed()">執行批量繁育</button>
        <button class="btn" style="background:#444; color:#ccc; margin-left:10px;" onclick="document.getElementById('breed-modal').style.display='none'">返回</button>
    </div>
</div>

<script>
/** * ==========================================
 * 【CONFIG 參數修改區】
 * ========================================== 
 */
const CONFIG = {
    INITIAL_BIOMASS: 30000,      // 初始能量
    INITIAL_POP_SIZE: 40,        // 初始生物數
    FOOD_SPAWN_RATE: 3,          // 每幀食物量
    MAX_FOOD_COUNT: 150,         // 食物上限
    
    // 食物能量值
    ENERGY_N: 25,                // 一般 (圓)
    ENERGY_S: 250,               // 速度 (三)
    ENERGY_R: 450,               // 體型 (方)

    // 食物生成比例
    RATIO_R: 0.94,               // 方形 6%
    RATIO_S: 0.80,               // 三角 14%

    // 生物學設定
    ADULT_AGE: 600,              // 性成熟年齡
    AVG_LIFESPAN: 3000,          // 平均壽命
    STD_DEVIATION: 500,          // 壽命標準差

    // 災難週期 (年)
    DISASTER_CYCLE: 24,          
    DISASTER_DURATION: 12        
};

document.getElementById('cfg-cycle').innerText = CONFIG.DISASTER_CYCLE;
document.getElementById('cfg-dur').innerText = CONFIG.DISASTER_DURATION;

const GENES = {
    f: { name: '毛皮(F)', dom: 'F', rec: 'f', col: '#ff5555' },
    c: { name: '花紋(C)', dom: 'C', rec: 'c', col: '#55ff55' },
    s: { name: '速度(S)', dom: 'S', rec: 's', col: '#5555ff' },
    r: { name: '體型(R)', dom: 'R', rec: 'r', col: '#ffff55' }
};

let state = {
    year: 0, 
    biomass: CONFIG.INITIAL_BIOMASS, 
    population: [], 
    foods: [],
    history: [], 
    chartMode: 'pop', 
    event: 'normal',
    parentGeno: {
        male:   { f:['F','F'], c:['c','c'], s:['S','S'], r:['r','r'] },
        female: { f:['f','f'], c:['C','C'], s:['s','s'], r:['r','r'] }
    }
};

const EVENTS = {
    normal: { name: "穩定時期", bg: "#080808", desc: "環境溫和" },
    ice:    { name: "極寒流", bg: "#001a33", desc: "非[F]個體代謝 x5" },
    heat:   { name: "酷暑熱浪", bg: "#331a00", desc: "有[F]個體代謝 x2" },
    radiation: { name: "光能輻射", bg: "#1a3300", desc: "有[C]個體持續回能" },
    dust:   { name: "毒素塵埃", bg: "#1a1a1a", desc: "有[C]個體代謝 x1.5" },
    storm:  { name: "電磁風暴", bg: "#1a0033", desc: "僅生成 △ 高回報食物" },
    marsh:  { name: "黏稠沼澤", bg: "#0d1a0d", desc: "有[S]個體速度減半" },
    meteor: { name: "隕石撞擊", bg: "#330000", desc: "僅生成 □ 巨量食物" },
    hypoxia:{ name: "氧氣稀薄", bg: "#1a0d00", desc: "有[R]個體代謝 x2" }
};

function randomNormal(mean, stdDev) {
    let u = 0, v = 0;
    while(u === 0) u = Math.random();
    while(v === 0) v = Math.random();
    return (Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v)) * stdDev + mean;
}

class Food {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * (window.innerHeight - 250);
        let r = Math.random();
        if(state.event === 'storm') this.type = 'S';
        else if(state.event === 'meteor') this.type = 'R';
        else this.type = r > CONFIG.RATIO_R ? 'R' : (r > CONFIG.RATIO_S ? 'S' : 'N');
        this.vx = (this.type === 'S') ? (Math.random()-0.5)*7 : 0;
        this.vy = (this.type === 'S') ? (Math.random()-0.5)*7 : 0;
    }
    update(w, h) {
        this.x += this.vx; this.y += this.vy;
        if(this.x<0 || this.x>w) this.vx *= -1;
        if(this.y<0 || this.y>h) this.vy *= -1;
    }
    draw(ctx) {
        ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5; ctx.beginPath();
        if(this.type==='N') ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
        else if(this.type==='S') { ctx.moveTo(this.x, this.y-6); ctx.lineTo(this.x+6, this.y+4); ctx.lineTo(this.x-6, this.y+4); ctx.closePath(); }
        else { ctx.rect(this.x-5, this.y-5, 10, 10); }
        ctx.stroke();
    }
}

class Creature {
    constructor(x, y, genes, gender, initialAge = 0) {
        this.x = x; this.y = y; this.genes = genes; 
        this.gender = gender || (Math.random() > 0.5 ? 'M' : 'F');
        this.age = initialAge;
        this.reproCooldown = 400;
        this.angle = Math.random() * Math.PI * 2;
        this.turnSpeed = (Math.random() - 0.5) * 0.08;
        this.isResting = false;
        this.restTimer = Math.random() * 100;
        this.maxAge = randomNormal(CONFIG.AVG_LIFESPAN, CONFIG.STD_DEVIATION); 
        this.isFast = genes.s.includes('S');
        this.isBig = genes.r.includes('R');
        this.hasFur = genes.f.includes('F');
        this.hasCamo = genes.c.includes('C');
        this.radius = this.isBig ? 18 : 9;
        this.speedBase = this.isFast ? 3.8 : 1.4;
    }
    update(w, h) {
        this.age++;
        if(this.age > this.maxAge) return "dead";
        if(this.reproCooldown > 0) this.reproCooldown--;
        
        // 只有能量充足時才移動
        if (state.biomass > 0) {
            this.restTimer--;
            if(this.restTimer <= 0) {
                this.isResting = Math.random() < 0.25;
                this.restTimer = Math.random() * 300 + 100;
            }
            if(!this.isResting) {
                this.angle += (Math.random() - 0.5) * 0.2 + this.turnSpeed;
                let s = this.speedBase;
                if(state.event === 'marsh' && this.isFast) s *= 0.5;
                this.x += Math.cos(this.angle) * s;
                this.y += Math.sin(this.angle) * s;
                if(this.x<0 || this.x>w) this.angle = Math.PI - this.angle;
                if(this.y<0 || this.y>h) this.angle = -this.angle;
            }
        }

        let cost = (0.1 + (this.isBig?0.06:0) + (this.isFast?0.04:0)) * (this.isResting?0.1:1);
        if(state.event==='ice'&&!this.hasFur) cost*=5;
        if(state.event==='heat'&&this.hasFur) cost*=2;
        if(state.event==='dust'&&this.hasCamo) cost*=1.5;
        if(state.event==='hypoxia'&&this.isBig) cost*=2;
        if(state.event==='radiation'&&this.hasCamo) cost-=0.15;
        state.biomass -= cost;

        state.foods.forEach((f, i) => {
            if(Math.hypot(this.x-f.x, this.y-f.y) < this.radius+6) {
                if(f.type==='N' || (f.type==='S'&&this.isFast) || (f.type==='R'&&this.isBig)) {
                    state.biomass += (f.type==='N'?CONFIG.ENERGY_N:(f.type==='S'?CONFIG.ENERGY_S:CONFIG.ENERGY_R));
                    state.foods.splice(i, 1);
                }
            }
        });
    }
    draw(ctx) {
        let grow = (this.age < CONFIG.ADULT_AGE) ? (this.age/CONFIG.ADULT_AGE*0.7+0.3) : 1;
        let opac = (this.age > this.maxAge*0.85) ? (this.maxAge-this.age)/(this.maxAge*0.15) : 1;
        ctx.save();
        ctx.globalAlpha = Math.max(0, opac);
        ctx.translate(this.x, this.y);
        ctx.scale(grow, grow);
        if(this.isResting) ctx.globalAlpha *= 0.5;
        const r = this.radius;
        ctx.strokeStyle = '#444'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-r/2,0); ctx.lineTo(-r/2,(this.isFast?18:6)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r/2,0); ctx.lineTo(r/2,(this.isFast?18:6)); ctx.stroke();
        ctx.fillStyle = this.gender==='M'?'#1a3a5a':'#5a1a3a';
        ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
        if(this.hasFur){ ctx.strokeStyle=ctx.fillStyle; for(let i=0;i<12;i++){ let a=i*Math.PI/6; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); ctx.lineTo(Math.cos(a)*(r+10),Math.sin(a)*(r+10)); ctx.stroke(); }}
        if(this.hasCamo){ ctx.fillStyle=this.gender==='M'?'#0cf':'#f0a'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc((i-1)*r*0.4,0,3,0,Math.PI*2); ctx.fill(); }}
        ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-r/3,-r/4,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(r/3,-r/4,3,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

function updateEnvironment() {
    if (state.year % CONFIG.DISASTER_CYCLE === 0 && Math.random() < 0.45) {
        const keys = Object.keys(EVENTS).filter(k => k !== 'normal');
        state.event = keys[Math.floor(Math.random() * keys.length)];
    } else if (state.year % CONFIG.DISASTER_CYCLE === CONFIG.DISASTER_DURATION) {
        state.event = 'normal';
    }
    const ev = EVENTS[state.event];
    document.getElementById('status-msg').innerText = ev.name;
    document.getElementById('stage').style.background = ev.bg;
}

function handleReproduction() {
    if (state.biomass < 200) return;
    for (let i=0; i<state.population.length; i++) {
        for (let j=i+1; j<state.population.length; j++) {
            let a = state.population[i], b = state.population[j];
            if (a.age > CONFIG.ADULT_AGE && b.age > CONFIG.ADULT_AGE && a.gender!==b.gender && a.reproCooldown===0 && b.reproCooldown===0) {
                if (Math.hypot(a.x-b.x, a.y-b.y) < a.radius+b.radius) {
                    let cg = {}; ['f','c','s','r'].forEach(k => cg[k] = [a.genes[k][Math.floor(Math.random()*2)], b.genes[k][Math.floor(Math.random()*2)]]);
                    state.population.push(new Creature(a.x, a.y, cg));
                    a.reproCooldown=600; b.reproCooldown=600; state.biomass -= 120;
                }
            }
        }
    }
}

const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');

function loop() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 220;
    
    // 背景強制渲染
    ctx.fillStyle = (EVENTS[state.event]||{bg:"#080808"}).bg;
    ctx.fillRect(0,0,canvas.width, canvas.height);

    // 食物生產
    if(state.foods.length < CONFIG.MAX_FOOD_COUNT) {
        for(let i=0; i<CONFIG.FOOD_SPAWN_RATE; i++) state.foods.push(new Food());
    }
    state.foods.forEach(f => { f.update(canvas.width, canvas.height); f.draw(ctx); });
    
    // 生態更新
    if (state.population.length > 0) {
        for (let i = state.population.length - 1; i >= 0; i--) {
            let p = state.population[i];
            if (p.update(canvas.width, canvas.height) === "dead") state.population.splice(i, 1);
            else p.draw(ctx);
        }
        handleReproduction();
    } else {
        ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.font = "20px Arial";
        ctx.fillText("族群已滅絕，請打開人擇基因控制台", canvas.width/2, canvas.height/2);
    }

    if(Date.now()%1000<20) { state.year++; updateEnvironment(); recordHistory(); }
    document.getElementById('y-val').innerText=state.year;
    document.getElementById('p-val').innerText=state.population.length;
    document.getElementById('b-val').innerText=Math.floor(state.biomass);
    drawChart(); 
    requestAnimationFrame(loop);
}

// 工業化 UI
function openBreedModal() {
    const container = document.getElementById('gene-selector-rows'); container.innerHTML = '';
    for (let k in GENES) {
        const g = GENES[k]; const row = document.createElement('div');
        row.style = "display:flex; align-items:center; justify-content:space-between; margin:8px 0; background:#222; padding:6px 12px;";
        row.innerHTML = `<div style="display:flex; gap:3px">${['FF','Ff','ff'].map(t=>`<button class="genotype-btn ${getGType('male',k)===t?'active':''}" onclick="setGType('male','${k}','${t}')">${t.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}</div><div style="color:var(--accent); font-weight:bold; width:70px; text-align:center">${g.name}</div><div style="display:flex; gap:3px">${['FF','Ff','ff'].map(t=>`<button class="genotype-btn ${getGType('female',k)===t?'active':''}" onclick="setGType('female','${k}','${t}')">${t.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}</div>`;
        container.appendChild(row);
    }
    updatePre(); document.getElementById('breed-modal').style.display = 'block';
}
function getGType(p,k){let g=state.parentGeno[p][k]; return g[0]===g[1]?(g[0]===k.toUpperCase()?'FF':'ff'):'Ff';}
function setGType(p,k,t){let D=k.toUpperCase(),r=k.toLowerCase(); state.parentGeno[p][k]=t==='FF'?[D,D]:(t==='ff'?[r,r]:[D,r]); openBreedModal();}
function doMassBreed(){
    let qty=parseInt(document.getElementById('breed-qty').value)||100;
    if(state.biomass < qty*120) return alert("能量不足！");
    state.biomass -= qty*120;
    for(let i=0;i<qty;i++){
        let cg={}; ['f','c','s','r'].forEach(k=>cg[k]=[state.parentGeno.male[k][Math.floor(Math.random()*2)], state.parentGeno.female[k][Math.floor(Math.random()*2)]]);
        state.population.push(new Creature(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.4, cg));
    }
    document.getElementById('breed-modal').style.display='none';
}
function updatePre(){['male','female'].forEach(s=>{const ctx=document.getElementById(s+'-pre').getContext('2d'); ctx.clearRect(0,0,100,100); new Creature(50,50,state.parentGeno[s],s==='male'?'M':'F').draw(ctx);});}
function recordHistory(){let snap={pop:state.population.length}; for(let k in GENES){let total=state.population.length*2||1,domCount=0; state.population.forEach(p=>{if(p.genes[k][0]===GENES[k].dom)domCount++; if(p.genes[k][1]===GENES[k].dom)domCount++;}); snap['freq_'+k]=domCount/total; snap['pheno_'+k]=state.population.filter(p=>p.genes[k].includes(GENES[k].dom)).length/(state.population.length||1);} state.history.push(snap); if(state.history.length>100)state.history.shift();}
function drawChart(){const c=document.getElementById('chartCanvas'),cx=c.getContext('2d'); c.width=c.offsetWidth; c.height=150; if(state.history.length<2)return; if(state.chartMode==='pop'){cx.strokeStyle='#fff';cx.beginPath();state.history.forEach((d,i)=>{let x=(i/100)*c.width,y=c.height-(d.pop/600)*c.height; i===0?cx.moveTo(x,y):cx.lineTo(x,y);});cx.stroke();}else{let pre=state.chartMode==='freq'?'freq_':'pheno_'; for(let k in GENES){cx.strokeStyle=GENES[k].col;cx.beginPath();state.history.forEach((d,i)=>{let x=(i/100)*c.width,y=c.height-d[pre+k]*c.height; i===0?cx.moveTo(x,y):cx.lineTo(x,y);});cx.stroke();}}}
function setChart(m){state.chartMode=m; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');}

window.onload = function() {
    // 初始族群與隨機年齡分佈
    for(let i=0; i<CONFIG.INITIAL_POP_SIZE; i++) {
        state.population.push(new Creature(
            Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.5,
            {f:['f','f'],c:['c','c'],s:['s','s'],r:['r','r']}, null, Math.random()*2200
        ));
    }
    loop();
};
</script>
</body>
</html>
