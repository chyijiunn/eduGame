<style>

color:#efc787;width:16px;height:16px}.row-actions{display:flex;gap:8px;margin-top:10px}.action{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,243,220,.14);color:var(--txt);border-radius:999px;padding:11px 10px;font-size:12px}.action.main{background:rgba(242,203,140,.88);color:#312117;border-color:transparent;font-weight:700}.hintRow{font-size:10px;line-height:1.55;color:rgba(255,239,214,.52);margin-top:8px}
#compareLabels{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;width:100%;display:flex;justify-content:space-around;pointer-events:none;z-index:2;font-size:11px;letter-spacing:.12em;font-weight:700;color:rgba(74,53,31,.82);text-shadow:0 1px 10px rgba(255,251,242,.72)}#compareLabels[hidden]{display:none}#compareLabels:after{content:"";position:fixed;top:0;bottom:0;left:50%;width:1px;background:rgba(255,239,214,.74);box-shadow:0 0 4px rgba(74,53,31,.24)}

@media(max-width:600px){#hud{left:14px;top:calc(env(safe-area-inset-top,0px) + 12px)}.hudTitle{font-size:23px}.hudMeta{font-size:11px;gap:5px;max-width:70vw}.dock{left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);gap:10px}.fab{width:48px;height:48px;font-size:22px}.fab.main{font-size:28px}#hint{display:none}#compareLabels{font-size:9px;top:calc(env(safe-area-inset-top,0px) + 14px)}#profile{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:9px 10px}.key{font-size:9px;gap:8px}}

<body>
<canvas id="scene" aria-label="可旋轉的風塑沙丘三維模擬畫面"></canvas>
<div id="hud"><div class="hudTitle">Dune Lab</div><div class="hudMeta"><span id="timeLabel">第 0 年 · 0 日</span><span class="sep">·</span><span id="windStat">10 m/s · 東</span></div></div>
<div id="compareLabels" hidden><span>初始</span><span>目前</span></div>
<div id="profile" aria-label="初始與演化地形剖面圖"><div class="profileHead"><strong>地形剖面</strong><span id="changeAmount">0.0% 變化</span></div><canvas id="profileCanvas" width="640" height="212" aria-label="沙丘剖面圖，虛線為初始、實線為目前"></canvas><div class="key"><span class="keyOld">初始</span><span class="keyNow">目前</span></div></div>
<div id="dock" class="dock" aria-label="快速控制">
  <button id="compareFab" class="fab child" aria-label="切換前後對照" title="前後對照">◫</button>
  <button id="pauseFab" class="fab child" aria-label="暫停演化" title="暫停 / 繼續">Ⅱ</button>
  <button id="fullscreenFab" class="fab child" aria-label="全螢幕" title="全螢幕">⛶</button>
  <button id="settingsFab" class="fab child" aria-label="開啟設定" title="設定">⚙</button>
  <button id="menuFab" class="fab main" aria-label="顯示控制按鈕" aria-expanded="false" title="控制按鈕">⋯</button>
</div>
<section id="panel" role="region" aria-label="風況設定">
  <header><span>設定</span><button id="close" aria-label="關閉設定">×</button></header>
  <div class="group"><div class="group-head"><label for="windSpeed">風速</label><span class="out" id="windSpeedValue">10.0 m/s</span></div><input class="range" type="range" id="windSpeed" min="0" max="20" value="10" step="0.5"><div class="range-bottom"><span>0</span><span>起砂門檻約 4</span><span>20</span></div></div>
  <div class="group"><div class="group-head"><label for="direction">風吹往方向</label><span class="out" id="directionValue">東 · 90°</span></div><input class="range" type="range" id="direction" min="0" max="359" value="90" step="1"><div class="range-bottom"><span>北</span><span>東</span><span>南</span><span>西</span></div></div>
  <div class="group"><div class="group-head"><label>時間倍率</label><span class="out" id="speedValue">20×</span></div><div class="grid-buttons" id="speeds"><button class="opt" data-speed="1">1×</button><button class="opt active" data-speed="20">20×</button><button class="opt" data-speed="100">100×</button></div></div>
  <div class="group"><div class="group-head"><label for="transport">搬運強度</label><span class="out" id="transportValue">100%</span></div><input class="range" type="range" id="transport" min="20" max="180" step="10" value="100"></div>
  <div class="group"><div class="group-head"><label>地形</label></div><div class="grid-buttons" id="terrains"><button class="opt active" data-terrain="barchan">新月丘</button><button class="opt" data-terrain="transverse">橫向丘</button><button class="opt" data-terrain="mixed">混合</button></div></div>
  <div class="group"><div class="row-check"><label for="particles">風沙粒子</label><input type="checkbox" id="particles" checked></div><div class="row-check"><label for="ripples">細沙風紋</label><input type="checkbox" id="ripples" checked></div><div class="row-check"><label for="compare">前後對照</label><input type="checkbox" id="compare"></div><div class="row-check"><label for="changeMap">侵蝕／堆積色層</label><input type="checkbox" id="changeMap"></div><div class="row-check"><label for="profileCheck">顯示剖面</label><input type="checkbox" id="profileCheck" checked></div></div>
  <div class="group"><div class="group-head"><label>跳轉時間</label><span class="out" id="skipStatus"></span></div><div class="grid-buttons" id="jumps"><button class="opt" data-years="1">+1 年</button><button class="opt" data-years="5">+5 年</button><button class="opt" data-years="20">+20 年</button></div></div>
  <div class="row-actions"><button class="action main" id="playPause">Ⅱ 暫停</button><button class="action" id="reset">↻ 重置</button></div>
  <div class="hintRow">拖曳旋轉視角，滑輪或雙指縮放。模擬年為教學用時間刻度。</div>
</section>
<div id="hint">拖曳旋轉 · 雙指縮放</div>
<div id="error">此裝置無法啟用 WebGL。請改用更新版本的 Safari 或 Chrome 開啟。</div>
<script>
'use strict';
(function(){
const $ = id=>document.getElementById(id);
const canvas=$('scene'),gl=canvas.getContext('webgl',{alpha:false,antialias:true,powerPreference:'high-performance',depth:true,stencil:false});
if(!gl){$('error').style.display='flex';return;}
const VERTS=145, WORLD=380, SPACING=WORLD/(VERTS-1), COUNT=VERTS*VERTS, BASE=.72;
const state={speed:10,direction:90,rate:20,transport:1,terrain:'barchan',particles:true,ripples:true,paused:false,days:0};
const h=new Float32Array(COUNT),original=new Float32Array(COUNT),delta=new Float32Array(COUNT),verts=new Float32Array(COUNT*7),originalVerts=new Float32Array(COUNT*7);
let comparison=false,heatmap=false,chartShown=true,initialMass=1,bulkMoved=0, busy=false;
const wx=()=>Math.sin(state.direction*Math.PI/180),wz=()=>-Math.cos(state.direction*Math.PI/180);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function rnd(x,y){return (Math.sin(x*127.1+y*311.7)*43758.5453)%1}
function dune(s,t,w,l,high){const v=Math.abs(t)/w;if(v>1.24)return 0;const aa=Math.min(1,v);const hump=Math.pow(Math.max(0,1-aa*aa),1.12);const crest=w*.8*Math.pow(aa,2.35);const ds=s-crest;const frontWidth=l*(.84-.15*aa);const backWidth=l*(.19+.05*aa);const profile=ds<0?Math.exp(-Math.pow(ds/frontWidth,2)*1.18):Math.exp(-ds/backWidth*1.35);const horn=Math.exp(-Math.pow((v-.86)/.13,2))*Math.exp(-Math.pow((s-crest)/(.36*l),2))*.1;return high*(hump*profile+horn)}
const DUNES=[[-95,-96,39,53,21],[-18,-49,51,64,26],[105,-91,36,47,17],[-116,52,41,53,19],[59,47,54,64,25],[-31,116,33,46,16],[135,115,28,37,11],[-133,-150,30,38,12],[-4,-151,42,50,15]];
function initialHeight(x,z){let v=BASE+0.095*(Math.sin(x*.08+z*.047)+Math.sin(z*.057-x*.035));let b=0;
 if(state.terrain!=='transverse'){for(let i=0;i<DUNES.length;i++){let d=DUNES[i];b+=dune(x-d[0],z-d[1],d[2],d[3],d[4])}}
 if(state.terrain!=='barchan'){for(let j=0;j<5;j++){let crest=-143+j*79+6*Math.sin(z*.024+j);let dist=x-crest;let transverse=(dist<0?Math.exp(-Math.pow(dist/40,2)):Math.exp(-dist/10.8));let envelope=smooth(191,125,Math.abs(z));b+=transverse*(15+5*Math.sin(z*.026+j*.6))*envelope*(state.terrain==='mixed'?.40:1)}}
 let edge=smooth(180,131,Math.max(Math.abs(x),Math.abs(z)));return Math.max(BASE+.03,v+b*edge)}
function reset(){for(let z=0;z<VERTS;z++)for(let x=0;x<VERTS;x++){const px=(x/(VERTS-1)-.5)*WORLD,pz=(z/(VERTS-1)-.5)*WORLD;h[z*VERTS+x]=initialHeight(px,pz);}original.set(h);state.days=0;bulkMoved=0;initialMass=sandMass(h);uploadTerrain();uploadOriginal();updateLabels();drawProfile();}
function sandMass(data){let sum=0;for(let z=1;z<VERTS-1;z++)for(let x=1;x<VERTS-1;x++)sum+=Math.max(0,data[z*VERTS+x]-BASE);return sum;}
const shader=(type,src)=>{let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw Error(gl.getShaderInfoLog(s))}return s};
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
const terrainProg=program(`
attribute vec3 aPos;attribute vec3 aNorm;attribute float aChange;uniform mat4 uVP;varying vec3 vPos,vNorm;varying float vChange;void main(){vPos=aPos;vNorm=aNorm;vChange=aChange;gl_Position=uVP*vec4(aPos,1.);}`,`
precision highp float;varying vec3 vPos,vNorm;varying float vChange;uniform vec3 uEye;uniform vec2 uWind;uniform float uRipples;uniform float uHeat;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec3 n=normalize(vNorm);vec3 light=normalize(vec3(-.62,.72,-.3));float lit=max(.0,dot(n,light));
vec2 v=vPos.xz;float grain=hash(floor(v*4.3));float ripple=sin(dot(v,uWind)*3.45+.28*sin(dot(v,vec2(-uWind.y,uWind.x))*.21));
float fine=sin(dot(v,uWind)*7.4+sin(v.y*.8)*.32);float ridges=uRipples*(ripple*.043+fine*.013)*(clamp(n.y,.0,1.));
float sand=mix(.82,1.,clamp(vPos.y/30.,0.,1.));vec3 base=vec3(.81,.596,.37)*sand;
base*=.89+grain*.07+ridges;vec3 shade=base*(.51+.68*lit);shade+=vec3(.09,.052,.024)*pow(lit,8.);
float contrast=smoothstep(.35,5.5,abs(vChange))*.82*uHeat;
vec3 dye=vChange>=0.?vec3(.98,.35,.15):vec3(.08,.52,.63);
shade=mix(shade,dye,contrast);
float dist=length(vPos.xz-uEye.xz);float fog=1.-exp(-pow(max(0.,dist-85.)/310.,2.));vec3 fogColor=vec3(.82,.708,.56);gl_FragColor=vec4(mix(shade,fogColor,clamp(fog,.0,.96)),1.);
}`);
const skyProg=program(`attribute vec2 aPoint;varying vec2 vUv;void main(){vUv=aPoint*.5+.5;gl_Position=vec4(aPoint,0.,1.);}`,`
precision mediump float;varying vec2 vUv;uniform float uAspect;void main(){float y=vUv.y;vec3 low=vec3(.91,.776,.60);vec3 high=vec3(.50,.68,.72);vec3 sky=mix(low,high,smoothstep(.15,.97,y));sky=mix(vec3(.96,.81,.62),sky,smoothstep(.0,.42,y));
vec2 sun=(vUv-vec2(.78,.81))*vec2(uAspect,1.);float r=length(sun);sky+=vec3(.45,.33,.15)*exp(-r*8.)*.38;sky+=vec3(.9,.73,.44)*exp(-r*120.)*.32;gl_FragColor=vec4(sky,1.);}`);
const particleProg=program(`attribute vec3 aP;attribute float aA;uniform mat4 uVP;uniform vec3 uEye;varying float vA;void main(){gl_Position=uVP*vec4(aP,1.);float d=length(aP-uEye);gl_PointSize=clamp(3.5*160./max(50.,d),1.,3.8);vA=aA*clamp(1.-(d-150.)/260.,.15,.75);}`,`
precision mediump float;varying float vA;void main(){vec2 q=gl_PointCoord-.5;float a=(1.-smoothstep(.12,.5,length(q)))*vA;gl_FragColor=vec4(1.,.93,.75,a);}`);
const attr=(p,name)=>gl.getAttribLocation(p,name),uni=(p,name)=>gl.getUniformLocation(p,name);
const aT=attr(terrainProg,'aPos'),nT=attr(terrainProg,'aNorm'),cT=attr(terrainProg,'aChange'),vpT=uni(terrainProg,'uVP'),eyeT=uni(terrainProg,'uEye'),windT=uni(terrainProg,'uWind'),ripT=uni(terrainProg,'uRipples'),heatT=uni(terrainProg,'uHeat');
const skyA=attr(skyProg,'aPoint'),skyAspect=uni(skyProg,'uAspect');
const pP=attr(particleProg,'aP'),pA=attr(particleProg,'aA'),pVP=uni(particleProg,'uVP'),pEye=uni(particleProg,'uEye');
const mainBuffer=gl.createBuffer(),originalBuffer=gl.createBuffer(),indexBuffer=gl.createBuffer(),skyBuffer=gl.createBuffer(),baseBuffer=gl.createBuffer(),baseIndex=gl.createBuffer(),particleBuffer=gl.createBuffer();
let indices=[];for(let z=0;z<VERTS-1;z++)for(let x=0;x<VERTS-1;x++){let k=z*VERTS+x;indices.push(k,k+VERTS,k+1,k+1,k+VERTS,k+VERTS+1)}
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER,skyBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const baseV=new Float32Array([-3500,.50,-3500,0,1,0,0, 3500,.50,-3500,0,1,0,0, -3500,.50,3500,0,1,0,0, 3500,.50,3500,0,1,0,0]);
gl.bindBuffer(gl.ARRAY_BUFFER,baseBuffer);gl.bufferData(gl.ARRAY_BUFFER,baseV,gl.STATIC_DRAW);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,baseIndex);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,2,1,1,2,3]),gl.STATIC_DRAW);
function fillGeometry(src,dst,changes){
 for(let z=0;z<VERTS;z++)for(let x=0;x<VERTS;x++){
  const k=z*VERTS+x,o=k*7;
  const left=src[z*VERTS+Math.max(0,x-1)],right=src[z*VERTS+Math.min(VERTS-1,x+1)];
  const top=src[Math.max(0,z-1)*VERTS+x],bot=src[Math.min(VERTS-1,z+1)*VERTS+x];
  const nx=(left-right)/(SPACING*(x===0||x===VERTS-1?1:2));
  const nz=(top-bot)/(SPACING*(z===0||z===VERTS-1?1:2));
  const norm=Math.hypot(nx,1,nz);
  dst[o]=(x/(VERTS-1)-.5)*WORLD;dst[o+1]=src[k];dst[o+2]=(z/(VERTS-1)-.5)*WORLD;
  dst[o+3]=nx/norm;dst[o+4]=1/norm;dst[o+5]=nz/norm;dst[o+6]=changes?src[k]-original[k]:0;
 }
}
function uploadTerrain(){fillGeometry(h,verts,true);gl.bindBuffer(gl.ARRAY_BUFFER,mainBuffer);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.DYNAMIC_DRAW);}
function uploadOriginal(){fillGeometry(original,originalVerts,false);gl.bindBuffer(gl.ARRAY_BUFFER,originalBuffer);gl.bufferData(gl.ARRAY_BUFFER,originalVerts,gl.STATIC_DRAW);}
function sample(x,z){const fx=clamp((x/WORLD+.5)*(VERTS-1),0,VERTS-1.001),fz=clamp((z/WORLD+.5)*(VERTS-1),0,VERTS-1.001),ix=fx|0,iz=fz|0,ax=fx-ix,az=fz-iz;const a=iz*VERTS+ix,b=a+VERTS;return h[a]*(1-ax)*(1-az)+h[a+1]*ax*(1-az)+h[b]*(1-ax)*az+h[b+1]*ax*az}
// Volume-conserving pedagogical cellular transport: short saltation hops and slope failure.
// Physical wind (m/s) is an input; "years" are accelerated illustrative time, NOT calibrated years.
function step(days){
 const v=state.speed;if(v<=4||days<=0)return;

 const potential=.00062*days*windPower;

 const signX=windX>=0?1:-1,signZ=windZ>=0?1:-1;
 const windSlopeScale=1/SPACING;
 const edge=2;
 for(let pass=0;pass<passes;pass++){
  delta.fill(0);
  for(let z=edge;z<VERTS-edge;z++)for(let x=edge;x<VERTS-edge;x++){
   let k=z*VERTS+x,sand=h[k]-BASE;if(sand<=.006)continue;

   let up=h[z*VERTS+(x-signX)]*aX+h[(z-signZ)*VERTS+x]*aZ;
   let distant=h[z*VERTS+(x-2*signX)]*aX+h[(z-2*signZ)*VERTS+x]*aZ;
   const slope=(h[k]-up)*windSlopeScale;
   const shadow=Math.max(0,up-h[k],distant-h[k]-.75);
   let exposure=clamp(.70+1.65*slope-.24*shadow,.055,1.55);
   // A small hop crosses approximately 1.6 grid cells, rather than shifting the whole dune mesh.
   const tx=x+windX*1.65,tz=z+windZ*1.65;
   const ix=Math.floor(tx),iz=Math.floor(tz);
   if(ix<1||iz<1||ix>=VERTS-2||iz>=VERTS-2)continue; // closed field boundaries

   delta[idx+VERTS]+=amount*(1-fx)*fz;
   delta[idx+VERTS+1]+=amount*fx*fz;

  const limit=SPACING*Math.tan(33*Math.PI/180);

   delta.fill(0);
   for(let z=1;z<VERTS-2;z++)for(let x=1;x<VERTS-2;x++){
    let k=z*VERTS+x;
    // The two nearest-axis neighbors are sufficient for a lightweight browser model.
    for(let neighbor of [k+1,k+VERTS]){

  }
 }

}

function updateLabels(){const year=Math.floor(state.days/365),days=Math.floor(state.days%365);$('timeLabel').textContent=`第 ${year} 年 · ${days} 日`;$('windStat').textContent=`${state.speed.toFixed(0)} m/s · ${compassName(state.direction)}`;$('windSpeedValue').textContent=state.speed.toFixed(1)+' m/s';$('directionValue').textContent=`${compassName(state.direction)} · ${state.direction}°`;$('transportValue').textContent=Math.round(state.transport*100)+'%';$('speedValue').textContent=state.rate+'×';updateChangeValue();}
