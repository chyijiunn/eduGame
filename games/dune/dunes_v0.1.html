<body>

<p class="footnote">這是教學用的簡化形態演化模型，包含迎風搬運、背風沉積與坡面鬆弛；時間和風速不代表特定沙漠的實測遷移率。</p>
</section>

<script>

const shader=(type,src)=>{let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw Error(gl.getShaderInfoLog(s))}return s};

const terrainProg=program(`
attribute vec3 aPos;attribute vec3 aNorm;uniform mat4 uVP;varying vec3 vPos,vNorm;void main(){vPos=aPos;vNorm=aNorm;gl_Position=uVP*vec4(aPos,1.);}`,`
precision highp float;varying vec3 vPos,vNorm;uniform vec3 uEye;uniform vec2 uWind;uniform float uRipples;uniform float uBase;

const skyProg=program(`attribute vec2 aPoint;varying vec2 vUv;void main(){vUv=aPoint*.5+.5;gl_Position=vec4(aPoint,0.,1.);}`,`
precision mediump float;varying vec2 vUv;uniform float uAspect;void main(){float y=vUv.y;vec3 low=vec3(.91,.776,.60);vec3 high=vec3(.50,.68,.72);vec3 sky=mix(low,high,smoothstep(.15,.97,y));sky=mix(vec3(.96,.81,.62),sky,smoothstep(.0,.42,y));

const particleProg=program(`attribute vec3 aP;attribute float aA;uniform mat4 uVP;uniform vec3 uEye;varying float vA;void main(){gl_Position=uVP*vec4(aP,1.);float d=length(aP-uEye);gl_PointSize=clamp(3.5*160./max(50.,d),1.,3.8);vA=aA*clamp(1.-(d-150.)/260.,.15,.75);}`,`

const attr=(p,name)=>gl.getAttribLocation(p,name),uni=(p,name)=>gl.getUniformLocation(p,name);
const aT=attr(terrainProg,'aPos'),nT=attr(terrainProg,'aNorm'),vpT=uni(terrainProg,'uVP'),eyeT=uni(terrainProg,'uEye'),windT=uni(terrainProg,'uWind'),ripT=uni(terrainProg,'uRipples');
const skyA=attr(skyProg,'aPoint'),skyAspect=uni(skyProg,'uAspect');
const pP=attr(particleProg,'aP'),pA=attr(particleProg,'aA'),pVP=uni(particleProg,'uVP'),pEye=uni(particleProg,'uEye');
const mainBuffer=gl.createBuffer(),indexBuffer=gl.createBuffer(),skyBuffer=gl.createBuffer(),baseBuffer=gl.createBuffer(),baseIndex=gl.createBuffer(),particleBuffer=gl.createBuffer();
let indices=[];for(let z=0;z<VERTS-1;z++)for(let x=0;x<VERTS-1;x++){let k=z*VERTS+x;indices.push(k,k+VERTS,k+1,k+1,k+VERTS,k+VERTS+1)}

gl.bindBuffer(gl.ARRAY_BUFFER,skyBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const baseV=new Float32Array([-3500,.50,-3500,0,1,0, 3500,.50,-3500,0,1,0, -3500,.50,3500,0,1,0, 3500,.50,3500,0,1,0]);
gl.bindBuffer(gl.ARRAY_BUFFER,baseBuffer);gl.bufferData(gl.ARRAY_BUFFER,baseV,gl.STATIC_DRAW);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,baseIndex);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,2,1,1,2,3]),gl.STATIC_DRAW);

function sample(x,z){const fx=clamp((x/WORLD+.5)*(VERTS-1),0,VERTS-1.001),fz=clamp((z/WORLD+.5)*(VERTS-1),0,VERTS-1.001),ix=fx|0,iz=fz|0,ax=fx-ix,az=fz-iz;const a=iz*VERTS+ix,b=a+VERTS;return h[a]*(1-ax)*(1-az)+h[a+1]*ax*(1-az)+h[b]*(1-ax)*az+h[b+1]*ax*az}

function updateParticles(dt){const xw=wx(),zw=wz(),vel=(.4+state.speed*.18)*dt;for(let i=0;i<particles.length;i++){let p=particles[i];if(!state.paused){p.x+=xw*vel*(.75+p.seed)+Math.sin(p.z*.17+p.seed*10)*dt*.25;p.z+=zw*vel*(.75+p.seed);if(p.x>182)p.x=-182;if(p.x< -182)p.x=182;if(p.z>182)p.z=-182;if(p.z< -182)p.z=182;}const k=i*4;parData[k]=p.x;parData[k+1]=sample(p.x,p.z)+.22+p.seed*(1+state.speed*.11);parData[k+2]=p.z;parData[k+3]=p.a*(state.speed>4?smooth(4,9,state.speed):0)}gl.bindBuffer(gl.ARRAY_BUFFER,particleBuffer);gl.bufferData(gl.ARRAY_BUFFER,parData,gl.DYNAMIC_DRAW)}
function perspective(fovy,asp,near,far){const t=1/Math.tan(fovy/2),nf=1/(near-far);return [t/asp,0,0,0,0,t,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]}
function lookAt(eye,target){let z=[eye[0]-target[0],eye[1]-target[1],eye[2]-target[2]],zl=Math.hypot(...z);z=z.map(v=>v/zl);let x=[z[2],0,-z[0]],xl=Math.hypot(...x);x=x.map(v=>v/xl);let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x[0]*eye[0]-x[1]*eye[1]-x[2]*eye[2],-y[0]*eye[0]-y[1]*eye[1]-y[2]*eye[2],-z[0]*eye[0]-z[1]*eye[1]-z[2]*eye[2],1]}
function mul(A,B){let out=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)out[c*4+r]=A[r]*B[c*4]+A[4+r]*B[c*4+1]+A[8+r]*B[c*4+2]+A[12+r]*B[c*4+3];return out}
const cam={yaw:-.80,pitch:.43,radius:255,target:[0,2,0]},maxDPR=()=>Math.min(window.devicePixelRatio||1,window.innerWidth<650?1.35:1.6);
function resize(){let dpr=maxDPR(),w=Math.max(1,Math.floor(innerWidth*dpr)),hh=Math.max(1,Math.floor(innerHeight*dpr));if(canvas.width!==w||canvas.height!==hh){canvas.width=w;canvas.height=hh;}gl.viewport(0,0,w,hh)}
function drawMesh(buf,ibo,count,program_,posLoc,normLoc){gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(posLoc);gl.vertexAttribPointer(posLoc,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(normLoc);gl.vertexAttribPointer(normLoc,3,gl.FLOAT,false,24,12);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_SHORT,0)}
function render(dt){resize();const eye=[cam.target[0]+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.radius,cam.target[1]+Math.sin(cam.pitch)*cam.radius,cam.target[2]+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.radius];const view=lookAt(eye,cam.target),proj=perspective(.84,canvas.width/canvas.height,1,6500),vp=mul(proj,view);
gl.clear(gl.DEPTH_BUFFER_BIT);gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.useProgram(skyProg);gl.bindBuffer(gl.ARRAY_BUFFER,skyBuffer);gl.enableVertexAttribArray(skyA);gl.vertexAttribPointer(skyA,2,gl.FLOAT,false,0,0);gl.uniform1f(skyAspect,canvas.width/canvas.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);gl.useProgram(terrainProg);gl.uniformMatrix4fv(vpT,false,vp);gl.uniform3fv(eyeT,eye);gl.uniform2f(windT,wx(),wz());gl.uniform1f(ripT,state.ripples?1:0);drawMesh(baseBuffer,baseIndex,6,terrainProg,aT,nT);drawMesh(mainBuffer,indexBuffer,indices.length,terrainProg,aT,nT);
if(state.particles){updateParticles(dt);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);gl.useProgram(particleProg);gl.uniformMatrix4fv(pVP,false,vp);gl.uniform3fv(pEye,eye);gl.bindBuffer(gl.ARRAY_BUFFER,particleBuffer);gl.enableVertexAttribArray(pP);gl.vertexAttribPointer(pP,3,gl.FLOAT,false,16,0);gl.enableVertexAttribArray(pA);gl.vertexAttribPointer(pA,1,gl.FLOAT,false,16,12);gl.drawArrays(gl.POINTS,0,particles.length);gl.depthMask(true);gl.disable(gl.BLEND)} }
function compassName(deg){const names=['北','東北','東','東南','南','西南','西','西北'];return names[Math.round(deg/45)%8]}
function updateLabels(){const year=Math.floor(state.days/365),days=Math.floor(state.days%365);$('timeLabel').textContent=`第 ${year} 年 · ${days} 日`;$('windStat').textContent=`${state.speed.toFixed(0)} m/s · ${compassName(state.direction)}`;$('windSpeedValue').textContent=state.speed.toFixed(1)+' m/s';$('directionValue').textContent=`${compassName(state.direction)} · ${state.direction}°`;$('windArrow').style.transform=`rotate(${state.direction+180}deg)`;$('transportValue').textContent=Math.round(state.transport*100)+'%';$('speedValue').textContent=state.rate+'×';}
function pauseSet(paused){state.paused=paused;$('playPause').textContent=paused?'▶ 繼續':'Ⅱ 暫停';$('pauseMini').textContent=paused?'▶':'Ⅱ';$('pauseMini').setAttribute('aria-label',paused?'繼續演化':'暫停演化')}
$('windSpeed').oninput=e=>{state.speed=+e.target.value;updateLabels()};$('direction').oninput=e=>{state.direction=+e.target.value;updateLabels()};$('transport').oninput=e=>{state.transport=+e.target.value/100;updateLabels()};$('particles').onchange=e=>state.particles=e.target.checked;$('ripples').onchange=e=>state.ripples=e.target.checked;
$('speeds').onclick=e=>{const b=e.target.closest('[data-speed]');if(!b)return;state.rate=+b.dataset.speed;$('speeds').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));updateLabels()};$('terrains').onclick=e=>{const b=e.target.closest('[data-terrain]');if(!b)return;state.terrain=b.dataset.terrain;$('terrains').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));reset()};
$('playPause').onclick=$('pauseMini').onclick=()=>pauseSet(!state.paused);$('reset').onclick=()=>reset();
const setPanel=(open)=>{$('panel').classList.toggle('open',open);$('toggle').setAttribute('aria-expanded',String(open));$('toggle').innerHTML=open?'<span style="font-size:17px">×</span> 收合設定':'<span style="font-size:17px">☷</span> 風況與時間設定'};
$('toggle').onclick=()=>setPanel(!$('panel').classList.contains('open'));$('close').onclick=()=>setPanel(false);if(innerWidth>920)setPanel(true);
let drag=null,pinch=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);if(!drag){drag={id:e.pointerId,x:e.clientX,y:e.clientY};}});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||pinch)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;cam.yaw-=dx*.006;cam.pitch=clamp(cam.pitch+dy*.005,.10,1.42);drag.x=e.clientX;drag.y=e.clientY});
const endDrag=e=>{if(drag?.id===e.pointerId)drag=null};canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.radius=clamp(cam.radius*Math.exp(e.deltaY*.001),85,560)},{passive:false});
const touchDistance=ev=>Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,ev.touches[0].clientY-ev.touches[1].clientY);
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={dist:touchDistance(e),radius:cam.radius};drag=null}},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){if(!pinch)pinch={dist:touchDistance(e),radius:cam.radius};cam.radius=clamp(pinch.radius*pinch.dist/Math.max(30,touchDistance(e)),85,560)}},{passive:true});
canvas.addEventListener('touchend',e=>{if(e.touches.length<2){pinch=null;drag=null}},{passive:true});
reset();updateParticles(0);let then=performance.now(),acc=0,tick=0;
function frame(now){const dt=Math.min(.06,(now-then)/1000);then=now;if(!state.paused){acc+=dt;if(acc>.11){let elapsed=Math.min(.22,acc);acc=0;let days=elapsed*10*state.rate;state.days+=days;step(days)}if(now-tick>220){updateLabels();tick=now}}render(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{then=performance.now();acc=0});
})();
</script>
