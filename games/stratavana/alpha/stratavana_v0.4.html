const TYPES={E:'🐘',L:'🦁',G:'🦌',Z:'🦓'},NAMES={E:'大象',L:'獅子',G:'瞪羚',Z:'斑馬'},KEY='stratavana_v04';

let yaw=S.view?.yaw??-2,pitch=S.view?.pitch??-48,drag=null,velYaw=0,velPitch=0,cellPolys=[],anim=null,shakeUntil=0,shakeCell=-1,renderLayer=0,shapeTransform=null,particles=[];

const D4=[[-1,0],[1,0],[0,-1],[0,1]],D8=[...D4,[-1,-1],[-1,1],[1,-1],[1,1]];
function movesBoard(i,b=S.board){let p=b[i];if(!p)return[];let[r,c]=rc(i),out=[];
 if(p.t==='Z')for(let[dR,dC]of D8){for(let k=1;;k++){let nr=r+dR*k,nc=c+dC*k;if(!inside(nr,nc)||b[ix(nr,nc)])break;out.push({from:i,to:ix(nr,nc),kind:'move'})}}

 return out}

function allMoves(p,b=S.board,res=S.reserve){let a=[];for(let i=0;i<16;i++)if(b[i]?.p===p)a.push(...movesBoard(i,b));for(let t of ['E','L','G','Z'])if(res[p][t]>0)for(let i=0;i<16;i++)if(!b[i]&&!restricted(i))a.push({from:null,to:i,kind:'place',t,p});return a}
function winner(p){if(S.dead[opp(p)]>=5)return p;let L=[];for(let r=0;r<4;r++)L.push([0,1,2,3].map(c=>ix(r,c)));for(let c=0;c<4;c++)L.push([0,1,2,3].map(r=>ix(r,c)));L.push([0,5,10,15],[3,6,9,12]);if(L.some(a=>a.every(i=>S.board[i]?.p===p)))return p;if(allMoves(opp(p)).length===0)return p;return null}

 else if(m.kind==='move'||m.kind==='jump'||m.kind==='capture'){maps.push({to:m.to,from:m.from,delay:0,span:m.kind==='jump'?650:520});dur=m.kind==='jump'?690:570;if(m.kind==='capture'&&before[m.to])ghosts.push({kind:'capture',piece:before[m.to],at:m.to,delay:260,span:260})}

function apply(m){unlockAudio();let mover=S.turn,before=S.board.map((x,i)=>x?{...normPiece({...x},i)}:null);if(m.kind==='place'){S.board[m.to]={p:mover,t:m.t,d:defaultDir(m.to,mover)};S.reserve[mover][m.t]--;playSfx('place');playAnimal(m.t,.55)}

 else if(m.kind==='push'){let[dR,dC]=m.dir,last=m.line[m.line.length-1],[lr,lc]=rc(last),nr=lr+dR,nc=lc+dC;if(!inside(nr,nc)){let v=S.board[last];S.dead[v.p]++}for(let k=m.line.length-1;k>=0;k--){let idx=m.line[k],[rr,cc]=rc(idx),tr=rr+dR,tc=cc+dC;if(inside(tr,tc))S.board[ix(tr,tc)]=S.board[idx]}let q=S.board[m.from];q.d=cellDir(m.from,m.line[0]);S.board[m.line[0]]=q;S.board[m.from]=null;playSfx('push');for(let j=1;j<=m.line.length;j++)setTimeout(()=>playSfx('thud',.55),j*105)}

 endTurn(mover)}

function renderRack(p,el){el.innerHTML='';for(let t of ['E','L','G','Z']){let n=S.reserve[p][t],b=document.createElement('button');b.className='rackpiece '+(p==='W'?'white':'black')+(n<=0?' dead':'');b.dataset.p=p;b.dataset.t=t;b.innerHTML=`<span class="token">${TYPES[t]}</span><span class="count">${n}</span>`;el.appendChild(b)}}

// ---------- true 3D geometry + software projection ----------
const V=(x,y,z)=>({x,y,z}), faces=[];
function rot(v){let a=yaw*Math.PI/180,b=pitch*Math.PI/180;let x=v.x*Math.cos(a)-v.y*Math.sin(a),y=v.x*Math.sin(a)+v.y*Math.cos(a),z=v.z;let yy=y*Math.cos(b)-z*Math.sin(b),zz=y*Math.sin(b)+z*Math.cos(b);return{x,y:yy,z:zz}}

function rod(a,b,r,mat,n=6){let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,L=Math.hypot(dx,dy,dz);let yaw2=Math.atan2(dy,dx),pitch2=Math.acos(dz/L);let pts1=[],pts2=[];let ux=Math.cos(yaw2)*Math.cos(pitch2),uy=Math.sin(yaw2)*Math.cos(pitch2),uz=-Math.sin(pitch2),vx=-Math.sin(yaw2),vy=Math.cos(yaw2),vz=0;for(let i=0;i<n;i++){let t=i*Math.PI*2/n,c=Math.cos(t)*r,s=Math.sin(t)*r;pts1.push(V(a.x+ux*c+vx*s,a.y+uy*c+vy*s,a.z+uz*c+vz*s));pts2.push(V(b.x+ux*c+vx*s,b.y+uy*c+vy*s,b.z+uz*c+vz*s))}for(let i=0;i<n;i++)poly3([pts1[i],pts1[(i+1)%n],pts2[(i+1)%n],pts2[i]],i%2?mat.fill:mat.mid,mat.edge,mat.a);poly3(pts2,mat.fill,mat.edge,mat.a)}
const mats={W:{fill:'rgba(226,248,255,.72)',mid:'rgba(170,220,238,.64)',dark:'rgba(120,184,210,.56)',edge:'rgba(255,255,255,.80)',a:.90},B:{fill:'rgba(35,45,56,.46)',mid:'rgba(73,88,102,.42)',dark:'rgba(7,11,16,.58)',edge:'rgba(180,203,214,.28)',a:.78}};
function animal(t,p,x,y,z=0,phase=0,heading=0,motion={}){

   for(let dx of [-.22,.17])for(let dy of [-.18,.18])box(x+dx+lean*.5,y+dy,z+.24+run*(dx>0?1:-1)+(legW&&dx<0?legW*.05:0),.155,.155,.26,m);

const help=`# stratavana

## 勝利
四子連線、淘汰對手 5 隻，或讓對手沒有合法行動。

## 動物
- **大象**：前後左右推動相鄰棋子；推動序列中若有任何大象則不能推。平時偶爾會甩耳或抬鼻。
- **獅子**：前後左右吃相鄰的斑馬或瞪羚，平時可能左右張望或打呵欠。
- **瞪羚**：八方向跳過 1～2 隻棋，可連跳，也可按 ✓ 主動結束。
