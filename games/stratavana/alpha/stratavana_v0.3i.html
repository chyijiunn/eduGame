<script>
const $=s=>document.querySelector(s), cv=$('#cv'),ctx=cv.getContext('2d'),vp=$('#viewport');
const TYPES={E:'🐘',L:'🦁',G:'🦌',Z:'🦓'},NAMES={E:'大象',L:'獅子',G:'瞪羚',Z:'斑馬'},KEY='stratavana_v03h';
function fresh(){return{board:Array(16).fill(null),reserve:{W:{E:2,L:2,G:2,Z:2},B:{E:2,L:2,G:2,Z:2}},dead:{W:0,B:0},turn:'W',mode:'standard',solo:false,hints:false,selected:null,jump:null,over:false}}
let S=fresh();try{let x=JSON.parse(localStorage.getItem(KEY));if(x)S={...fresh(),...x,selected:null,jump:null,over:false}}catch(e){}
let yaw=-2,pitch=-48,drag=null,velYaw=0,velPitch=0,cellPolys=[],anim=null,shakeUntil=0,shakeCell=-1,renderLayer=0;
const opp=p=>p==='W'?'B':'W',rc=i=>[Math.floor(i/4),i%4],ix=(r,c)=>r*4+c,inside=(r,c)=>r>=0&&r<4&&c>=0&&c<4;
function save(){localStorage.setItem(KEY,JSON.stringify({...S,selected:null,jump:null}))}
function restricted(i){let[r,c]=rc(i);return S.mode==='standard'?((r===0||r===3)&&(c===0||c===3)):(r>=1&&r<=2&&c>=1&&c<=2)}
const D4=[[-1,0],[1,0],[0,-1],[0,1]],D8=[...D4,[-1,-1],[-1,1],[1,-1],[1,1]];
function movesBoard(i,b=S.board){let p=b[i];if(!p)return[];let[r,c]=rc(i),out=[];
 if(p.t==='Z')for(let[dR,dC]of D8){for(let k=1;;k++){let nr=r+dR*k,nc=c+dC*k;if(!inside(nr,nc)||b[ix(nr,nc)])break;out.push({from:i,to:ix(nr,nc),kind:'move'})}}
 if(p.t==='L')for(let[dR,dC]of D4){let nr=r+dR,nc=c+dC;if(inside(nr,nc)){let q=b[ix(nr,nc)];if(q&&(q.t==='Z'||q.t==='G'))out.push({from:i,to:ix(nr,nc),kind:'capture'})}}
 if(p.t==='G')for(let[dR,dC]of D8){for(let n=1;n<=2;n++){let ok=true;for(let k=1;k<=n;k++){let nr=r+dR*k,nc=c+dC*k;if(!inside(nr,nc)||!b[ix(nr,nc)])ok=false}let tr=r+dR*(n+1),tc=c+dC*(n+1);if(ok&&inside(tr,tc)&&!b[ix(tr,tc)])out.push({from:i,to:ix(tr,tc),kind:'jump'})}}
 if(p.t==='E')for(let[dR,dC]of D4){let nr=r+dR,nc=c+dC;if(!inside(nr,nc)||!b[ix(nr,nc)])continue;let line=[];while(inside(nr,nc)&&b[ix(nr,nc)]){line.push(ix(nr,nc));if(b[ix(nr,nc)].t==='E'){line=[];break}nr+=dR;nc+=dC}if(line.length)out.push({from:i,to:line[0],kind:'push',line,dir:[dR,dC]})}
 return out}
function legal(){if(!S.selected)return[];if(S.selected.source==='rack'){let a=[];for(let i=0;i<16;i++)if(!S.board[i]&&!restricted(i))a.push({from:null,to:i,kind:'place',t:S.selected.t,p:S.turn});return a}let a=movesBoard(S.selected.i);if(S.jump)a=a.filter(m=>m.kind==='jump');return a}
function allMoves(p,b=S.board,res=S.reserve){let a=[];for(let i=0;i<16;i++)if(b[i]?.p===p)a.push(...movesBoard(i,b));for(let t of ['E','L','G','Z'])if(res[p][t]>0)for(let i=0;i<16;i++)if(!b[i]&&!restricted(i))a.push({from:null,to:i,kind:'place',t,p});return a}
function winner(p){if(S.dead[opp(p)]>=5)return p;let L=[];for(let r=0;r<4;r++)L.push([0,1,2,3].map(c=>ix(r,c)));for(let c=0;c<4;c++)L.push([0,1,2,3].map(r=>ix(r,c)));L.push([0,5,10,15],[3,6,9,12]);if(L.some(a=>a.every(i=>S.board[i]?.p===p)))return p;if(allMoves(opp(p)).length===0)return p;return null}
function apply(m){let mover=S.turn, before=S.board.map(x=>x?{...x}:null);if(m.kind==='place'){S.board[m.to]={p:mover,t:m.t};S.reserve[mover][m.t]--}
 else if(m.kind==='capture'){let victim=S.board[m.to];S.dead[victim.p]++;S.board[m.to]=S.board[m.from];S.board[m.from]=null}
 else if(m.kind==='move'||m.kind==='jump'){S.board[m.to]=S.board[m.from];S.board[m.from]=null}
 else if(m.kind==='push'){let[dR,dC]=m.dir,last=m.line[m.line.length-1],[lr,lc]=rc(last),nr=lr+dR,nc=lc+dC;if(!inside(nr,nc)){let v=S.board[last];S.dead[v.p]++}for(let k=m.line.length-1;k>=0;k--){let idx=m.line[k],[rr,cc]=rc(idx),tr=rr+dR,tc=cc+dC;if(inside(tr,tc))S.board[ix(tr,tc)]=S.board[idx]}S.board[m.line[0]]=S.board[m.from];S.board[m.from]=null}
 anim={m,before,start:performance.now(),dur:m.kind==='jump'?620:m.kind==='push'?700:500};S.selected=null;if(m.kind==='jump'){let more=movesBoard(m.to).filter(x=>x.kind==='jump');if(more.length){S.jump={i:m.to};S.selected={source:'board',i:m.to};renderUI();save();return}}
 endTurn(mover)}
function endTurn(mover){S.jump=null;let w=winner(mover);if(w){S.over=true;$('#winner').textContent=w==='W'?'◇':'◆';$('#finish').classList.add('open')}else{S.turn=opp(S.turn)}renderUI();save();if(S.solo&&S.turn==='B'&&!S.over)setTimeout(aiTurn,260)}
function illegal(i){shakeCell=i;shakeUntil=performance.now()+330}
function renderRack(p,el){el.innerHTML='';for(let t of ['E','L','G','Z']){let n=S.reserve[p][t],b=document.createElement('button');b.className='rackpiece '+(p==='W'?'white':'black')+(n<=0?' dead':'');b.dataset.p=p;b.dataset.t=t;b.innerHTML=`<span class="token">${TYPES[t]}</span><span class="count">${n}</span>`;el.appendChild(b)}}
function renderUI(){renderRack('W',$('#rackW'));renderRack('B',$('#rackB'));$('#rackW').classList.toggle('active',S.turn==='W');$('#rackB').classList.toggle('active',S.turn==='B');$('#hintSw').classList.toggle('on',S.hints);$('#soloSw').classList.toggle('on',S.solo);$('#advSw').classList.toggle('on',S.mode==='advanced');$('#jumpDone').classList.toggle('show',!!S.jump)}
// ---------- true 3D geometry + software projection ----------
const V=(x,y,z)=>({x,y,z}), faces=[];
function rot(v){let a=yaw*Math.PI/180,b=pitch*Math.PI/180;let x=v.x*Math.cos(a)-v.y*Math.sin(a),y=v.x*Math.sin(a)+v.y*Math.cos(a),z=v.z;let yy=y*Math.cos(b)-z*Math.sin(b),zz=y*Math.sin(b)+z*Math.cos(b);return{x,y:yy,z:zz}}
function proj(v){let q=rot(v),d=11,sc=cv.width/9.2,k=d/(d-q.y);return{x:cv.width/2+q.x*sc*k,y:cv.height*.52-q.z*sc*k,depth:q.y}}
function poly3(pts,fill,stroke='rgba(255,255,255,.12)',alpha=1){let p=pts.map(proj),depth=pts.reduce((s,v)=>s+rot(v).y,0)/pts.length;faces.push({p,fill,stroke,depth,alpha,layer:renderLayer})}
function box(cx,cy,cz,sx,sy,sz,mat){let x0=cx-sx/2,x1=cx+sx/2,y0=cy-sy/2,y1=cy+sy/2,z0=cz-sz/2,z1=cz+sz/2,P=[V(x0,y0,z0),V(x1,y0,z0),V(x1,y1,z0),V(x0,y1,z0),V(x0,y0,z1),V(x1,y0,z1),V(x1,y1,z1),V(x0,y1,z1)];for(let f of [[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]])poly3(f.map(i=>P[i]),mat.fill,mat.edge,mat.a)}
function prism(cx,cy,cz,rx,ry,h,n,mat,phase=0){let bot=[],top=[];for(let i=0;i<n;i++){let a=phase+i*Math.PI*2/n;bot.push(V(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,cz-h/2));top.push(V(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,cz+h/2))}poly3(top,mat.fill,mat.edge,mat.a);poly3([...bot].reverse(),mat.dark,mat.edge,mat.a);for(let i=0;i<n;i++)poly3([bot[i],bot[(i+1)%n],top[(i+1)%n],top[i]],i%2?mat.fill:mat.mid,mat.edge,mat.a)}
function rod(a,b,r,mat,n=6){let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,L=Math.hypot(dx,dy,dz);let yaw2=Math.atan2(dy,dx),pitch2=Math.acos(dz/L);let pts1=[],pts2=[];let ux=Math.cos(yaw2)*Math.cos(pitch2),uy=Math.sin(yaw2)*Math.cos(pitch2),uz=-Math.sin(pitch2),vx=-Math.sin(yaw2),vy=Math.cos(yaw2),vz=0;for(let i=0;i<n;i++){let t=i*Math.PI*2/n,c=Math.cos(t)*r,s=Math.sin(t)*r;pts1.push(V(a.x+ux*c+vx*s,a.y+uy*c+vy*s,a.z+uz*c+vz*s));pts2.push(V(b.x+ux*c+vx*s,b.y+uy*c+vy*s,b.z+uz*c+vz*s))}for(let i=0;i<n;i++)poly3([pts1[i],pts1[(i+1)%n],pts2[(i+1)%n],pts2[i]],i%2?mat.fill:mat.mid,mat.edge,mat.a);poly3(pts2,mat.fill,mat.edge,mat.a)}
const mats={W:{fill:'rgba(220,246,255,.66)',mid:'rgba(166,218,238,.58)',dark:'rgba(116,181,210,.50)',edge:'rgba(255,255,255,.72)',a:.86},B:{fill:'rgba(24,29,35,.94)',mid:'rgba(49,58,68,.90)',dark:'rgba(5,8,12,.96)',edge:'rgba(132,154,170,.25)',a:.98}};
function animal(t,p,x,y,z=0,phase=0){
 let m=mats[p],run=Math.sin(phase*16)*.07;
 // compact faceted base; the animal silhouette must remain readable without relying on it
 prism(x,y,z+.14,.38,.32,.22,8,m,Math.PI/8);
 if(t==='E'){
   // elephant: broad body, four heavy legs, huge ears, long trunk and tusks
   prism(x-.05,y,z+.77,.43,.33,.52,8,m,Math.PI/8);
   for(let dx of [-.23,.18])for(let dy of [-.19,.19])box(x+dx,y+dy,z+.43,.14,.14,.48,m);
   prism(x+.36,y,z+1.00,.28,.26,.34,8,m);
   box(x+.28,y-.30,z+1.04,.09,.30,.34,m); box(x+.28,y+.30,z+1.04,.09,.30,.34,m);
   rod(V(x+.49,y,z+1.02),V(x+.57,y,z+.61),.075,m,7);
   rod(V(x+.48,y-.11,z+.94),V(x+.63,y-.13,z+.79),.025,{...m,fill:'#eefcff'},5);
   rod(V(x+.48,y+.11,z+.94),V(x+.63,y+.13,z+.79),.025,{...m,fill:'#eefcff'},5);
 }
 if(t==='L'){
   // lion: low muscular body and deliberately oversized mane visible from every azimuth
   prism(x-.08,y,z+.72,.39,.28,.42,8,m);for(let dx of [-.24,.18])for(let dy of [-.17,.17])box(x+dx,y+dy,z+.40+run*(dx>0?1:-1),.11,.11,.42,m);
   prism(x+.31,y,z+1.00,.43,.40,.38,10,{...m,fill:p==='W'?'rgba(205,235,246,.76)':'rgba(8,11,15,.99)'});
   prism(x+.43,y,z+1.02,.23,.21,.28,7,m);
   rod(V(x-.39,y,z+.79),V(x-.59,y+.04,z+.96),.045,m,6);prism(x-.61,y+.04,z+.99,.075,.07,.12,6,m);
 }
 if(t==='G'){
   // gazelle: very slender body, long legs/neck and widely separated swept-back horns
   prism(x-.04,y,z+.77,.31,.20,.37,7,m);for(let dx of [-.18,.16])for(let dy of [-.13,.13])box(x+dx,y+dy,z+.43,.065,.065,.60,m);
   rod(V(x+.17,y,z+.89),V(x+.31,y,z+1.25),.075,m,6);prism(x+.37,y,z+1.34,.15,.13,.22,6,m);
   rod(V(x+.39,y-.075,z+1.43),V(x+.34,y-.14,z+1.78),.024,m,5);rod(V(x+.39,y+.075,z+1.43),V(x+.34,y+.14,z+1.78),.024,m,5);
   rod(V(x+.34,y-.14,z+1.78),V(x+.25,y-.18,z+1.91),.020,m,5);rod(V(x+.34,y+.14,z+1.78),V(x+.25,y+.18,z+1.91),.020,m,5);
 }
 if(t==='Z'){
   // zebra: horse silhouette plus a tall saw-tooth mane running along the neck/back
   prism(x-.06,y,z+.76,.38,.24,.42,8,m);for(let dx of [-.21,.18])for(let dy of [-.145,.145])box(x+dx,y+dy,z+.42+run*(dx>0?1:-1),.075,.075,.56,m);
   rod(V(x+.17,y,z+.88),V(x+.34,y,z+1.24),.09,m,6);prism(x+.40,y,z+1.32,.18,.15,.24,6,m);
   rod(V(x-.39,y,z+.79),V(x-.58,y,z+.58),.035,m,5);
   // paired ears remain visible from front/back
   rod(V(x+.43,y-.07,z+1.42),V(x+.45,y-.10,z+1.57),.025,m,5);rod(V(x+.43,y+.07,z+1.42),V(x+.45,y+.10,z+1.57),.025,m,5);
   // exaggerated ridge: multiple vertical fins so side and oblique views read as zebra/horse mane
   for(let k=0;k<6;k++){let xx=x+.27-k*.105,zz=z+1.26-k*.055;box(xx,y,zz,.045,.30,.17,m)}
 }
}
function terrain(){
 // v0.3i: v0.3b-inspired soft grassland, layered cliff and pronounced river.
 let grassTop={fill:'#789759',mid:'#6d8e50',dark:'#5e7e45',edge:'rgba(231,255,211,.18)',a:1};
 let rock1={fill:'#7d5637',mid:'#72543b',dark:'#513826',edge:'rgba(255,220,180,.08)',a:1};
 let rock2={fill:'#8b6542',mid:'#735039',dark:'#4c3526',edge:'rgba(255,220,180,.07)',a:1};
 // thick hill / cliff, using staggered layers rather than one geometric slab
 box(0,0,-.46,6.25,6.25,.78,rock1);
 box(-.06,.04,-.73,6.08,6.03,.20,rock2);
 box(.05,-.03,-.88,5.88,5.93,.13,{...rock1,fill:'#5a422f',mid:'#4f3929',dark:'#3f3025'});
 // grass cap
 box(0,0,.015,5.88,5.88,.13,grassTop);
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
   let x=(c-1.5)*1.36,y=(r-1.5)*1.36;
   let light=(r+c)%3===0;
   box(x,y,.105,1.26,1.26,.105,{fill:light?'#85aa61':'#789b58',mid:light?'#739955':'#6b8e50',dark:'#5e7e45',edge:'rgba(255,255,255,.12)',a:1});
 }
 // irregular darker rock facets on two exposed sides
 for(let k=0;k<8;k++){
   let x=-2.75+k*.78;
   poly3([V(x,-3.13,-.10),V(x+.55,-3.13,-.13),V(x+.43,-3.13,-.72),V(x-.10,-3.13,-.62)],k%2?'#60432f':'#76543a','rgba(255,220,180,.06)',1);
 }
 for(let k=0;k<7;k++){
   let y=-2.72+k*.82;
   poly3([V(3.12,y,-.12),V(3.12,y+.60,-.10),V(3.12,y+.48,-.70),V(3.12,y-.08,-.60)],k%2?'#513826':'#72543b','rgba(255,220,180,.05)',1);
 }
 // broad river along the right/lower cliff, inspired by v0.3b radial blue-green water.
 for(let i=0;i<9;i++){
   let y=-4.15+i*1.05,x=3.78+Math.sin(i*.82)*.26,w=.72+Math.sin(i*.6)*.08;
   poly3([V(x-w,y-.64,-.78),V(x+w,y-.66,-.78),V(x+w+.12,y+.65,-.78),V(x-w-.08,y+.65,-.78)],i%3===0?'rgba(171,220,224,.72)':i%2?'rgba(71,137,165,.78)':'rgba(92,177,192,.76)','rgba(220,250,255,.30)',.90);
 }
 // pale water highlights
 for(let i=0;i<5;i++){
   let y=-3.5+i*1.55,x=3.83+Math.sin(i)*.20;
   poly3([V(x-.42,y-.05,-.765),V(x+.42,y-.05,-.765),V(x+.28,y+.08,-.765),V(x-.30,y+.08,-.765)],'rgba(220,250,248,.34)','rgba(255,255,255,.12)',.55);
 }
}
function piecePose(i,p,t,now){let[r,c]=rc(i),x=(c-1.5)*1.36,y=(r-1.5)*1.36,z=.18,ph=0;if(anim){let m=anim.m,u=Math.min(1,(now-anim.start)/anim.dur),e=1-Math.pow(1-u,3);if(m.to===i&&m.from!=null){let[fr,fc]=rc(m.from),sx=(fc-1.5)*1.36,sy=(fr-1.5)*1.36;x=sx+(x-sx)*e;y=sy+(y-sy)*e;if(m.kind==='jump')z+=Math.sin(Math.PI*u)*1.35;if(t==='Z')ph=u}if(u>=1)anim=null}if(shakeCell===i&&now<shakeUntil)x+=Math.sin((shakeUntil-now)*.12)*.09;animal(t,p,x,y,z,ph)}
function draw(now=performance.now()){let dpr=Math.min(2,devicePixelRatio||1),w=vp.clientWidth,h=vp.clientHeight;if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0); // logical CSS px below by scale correction
 let oldW=cv.width,oldH=cv.height;cv.width=oldW;cv.height=oldH; // reset state
 faces.length=0;renderLayer=0;terrain();renderLayer=1;for(let i=0;i<16;i++)if(S.board[i])piecePose(i,S.board[i].p,S.board[i].t,now);
 faces.sort((a,b)=>a.layer-b.layer || a.depth-b.depth);ctx.clearRect(0,0,cv.width,cv.height);ctx.lineJoin='round';for(let f of faces){ctx.beginPath();ctx.moveTo(f.p[0].x,f.p[0].y);for(let i=1;i<f.p.length;i++)ctx.lineTo(f.p[i].x,f.p[i].y);ctx.closePath();ctx.globalAlpha=f.alpha;ctx.fillStyle=f.fill;ctx.fill();ctx.strokeStyle=f.stroke;ctx.lineWidth=1.1*dpr;ctx.stroke()}ctx.globalAlpha=1;
 // projected cells for hit testing + hints
 cellPolys=[];let leg=S.hints&&S.selected?legal():[];for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=ix(r,c),x=(c-1.5)*1.36,y=(r-1.5)*1.36,s=.63,P=[proj(V(x-s,y-s,.18)),proj(V(x+s,y-s,.18)),proj(V(x+s,y+s,.18)),proj(V(x-s,y+s,.18))];cellPolys[i]=P;if(leg.some(m=>m.to===i)){let q=proj(V(x,y,.30));ctx.beginPath();ctx.arc(q.x,q.y,9*dpr,0,Math.PI*2);ctx.fillStyle='rgba(255,242,145,.78)';ctx.fill()}}
 requestAnimationFrame(draw)}
function pointIn(poly,x,y){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a.y>y)!=(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))ins=!ins}return ins}
function hitCell(clientX,clientY){let r=cv.getBoundingClientRect(),x=(clientX-r.left)*(cv.width/r.width),y=(clientY-r.top)*(cv.height/r.height);for(let i=15;i>=0;i--)if(pointIn(cellPolys[i],x,y))return i;return-1}
cv.addEventListener('pointerdown',e=>{let i=hitCell(e.clientX,e.clientY);drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,cell:i,moved:false};velYaw=velPitch=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;if(drag.moved){yaw+=dx*.16;pitch=Math.max(-60,Math.min(-35,pitch+dy*.12));velYaw=dx*.16;velPitch=dy*.12;drag.lx=e.clientX;drag.ly=e.clientY}});
cv.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.moved){let vy=velYaw,vp=velPitch;(function coast(){vy*=.89;vp*=.89;yaw+=vy;pitch=Math.max(-60,Math.min(-35,pitch+vp));if(pitch===-60||pitch===-35)vp*=.3;if(Math.abs(vy)+Math.abs(vp)>.05)requestAnimationFrame(coast)})();return}let i=hitCell(e.clientX,e.clientY);if(i<0)return;if(S.over||(S.solo&&S.turn==='B'))return;if(S.selected){let m=legal().find(x=>x.to===i);if(m)return apply(m);if(S.board[i]?.p===S.turn&&!S.jump){S.selected={source:'board',i};renderUI();return}illegal(i)}else if(S.board[i]?.p===S.turn){S.selected={source:'board',i};renderUI()}else illegal(i)});
for(let id of ['rackW','rackB'])$('#'+id).addEventListener('click',e=>{let b=e.target.closest('.rackpiece');if(!b||S.over||(S.solo&&S.turn==='B'))return;if(b.dataset.p!==S.turn||S.reserve[S.turn][b.dataset.t]<=0)return;S.selected={source:'rack',p:S.turn,t:b.dataset.t};renderUI()});
function aiTurn(){if(!S.solo||S.turn!=='B'||S.over)return;$('#thinking').classList.add('on');setTimeout(()=>{let ms=allMoves('B');let best=null,score=-1e9;for(let m of ms){let sc=Math.random()*.2;if(m.kind==='capture')sc+=5;if(m.kind==='push')sc+=3;if(m.kind==='place')sc+=1;let[r,c]=rc(m.to);sc+=2.5-Math.abs(r-1.5)-Math.abs(c-1.5);if(sc>score){score=sc;best=m}}$('#thinking').classList.remove('on');if(best)apply(best)},500)}
$('#jumpDone').onclick=()=>{if(S.jump)endTurn(S.turn)};$('#more').onclick=()=>$('#pop').classList.toggle('open');$('#hintSw').onclick=()=>{S.hints=!S.hints;renderUI();save()};$('#soloSw').onclick=()=>{S.solo=!S.solo;renderUI();save();if(S.solo&&S.turn==='B')aiTurn()};$('#advSw').onclick=()=>{S.mode=S.mode==='standard'?'advanced':'standard';renderUI();save()};$('#newGame').onclick=()=>{let keep={solo:S.solo,hints:S.hints,mode:S.mode};S={...fresh(),...keep};$('#finish').classList.remove('open');renderUI();save()};$('#clearAll').onclick=()=>{localStorage.removeItem(KEY);S=fresh();renderUI()};$('#again').onclick=()=>$('#newGame').click();$('#closeFinish').onclick=()=>$('#finish').classList.remove('open');
const help=`# stratavana\n\n## 勝利\n四子連線、淘汰對手 5 隻，或讓對手沒有合法行動。\n\n## 動物\n- **大象**：前後左右推動相鄰棋子；推動序列中若有任何大象則不能推。\n- **獅子**：前後左右吃相鄰的斑馬或瞪羚。\n- **瞪羚**：八方向跳過 1～2 隻棋，可連跳，也可按 ✓ 主動結束。\n- **斑馬**：八方向直線移動任意格，不可穿越棋子。\n\n## 進場\n標準模式不能直接放四角；進階模式不能直接放中央四格。`;
function md(s){return s.replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\n\n/g,'<p></p>')}
$('#help').onclick=()=>{$('#sheet').innerHTML=md(help);$('#modal').classList.add('open')};$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
