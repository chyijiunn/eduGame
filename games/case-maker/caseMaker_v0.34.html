<script>
const $ = id => document.getElementById(id);
let CW=0, CH=0, scalePx=1;
const mainCanvas = $('canvas');
if(!mainCanvas){ console.error('找不到 #canvas'); }
const ctx = mainCanvas ? mainCanvas.getContext('2d') : null;
const mini = $('mini');
const mctx = mini ? mini.getContext('2d') : null;
let cam = { yaw: Math.PI/6, pitch: -Math.PI/7, zoom: 1.1, dragging:false, lastX:0,lastY:0 };

function resizeNow(){
  const v = document.getElementById('view').getBoundingClientRect();
  const dpr = (window.devicePixelRatio||1);
  CW = mainCanvas.width  = Math.max(320, Math.floor((v.width||600)*dpr));
  CH = mainCanvas.height = Math.max(320, Math.floor((v.height||420)*dpr));
  const mb = document.getElementById('miniBox').getBoundingClientRect();
  mini.width  = Math.max(220, Math.floor((mb.width||260)*dpr));
  mini.height = Math.max(120, Math.floor((mb.height||170)*dpr));
  draw();
}
window.addEventListener('resize', resizeNow);
if(mainCanvas){
  mainCanvas.addEventListener('pointerdown', e=>{ mainCanvas.setPointerCapture(e.pointerId); cam.dragging=true; cam.lastX=e.clientX; cam.lastY=e.clientY; mainCanvas.style.cursor='grabbing'; });
  mainCanvas.addEventListener('pointerup',   e=>{ try{mainCanvas.releasePointerCapture(e.pointerId);}catch(_){ } cam.dragging=false; mainCanvas.style.cursor='grab'; });
  mainCanvas.addEventListener('pointermove', e=>{ if(!cam.dragging) return; const dx=e.clientX-cam.lastX, dy=e.clientY-cam.lastY; cam.lastX=e.clientX; cam.lastY=e.clientY; cam.yaw+=dx*0.005; cam.pitch=Math.max(-1.4, Math.min(1.4, cam.pitch+dy*0.005)); draw(); });
  mainCanvas.addEventListener('wheel', e=>{ e.preventDefault(); cam.zoom = Math.max(0.3, Math.min(4.0, cam.zoom * Math.pow(1.001,-e.deltaY))); draw(); }, {passive:false});
}

function rotY(p,a){ const s=Math.sin(a), c=Math.cos(a); return [ c*p[0]+s*p[2], p[1], -s*p[0]+c*p[2] ]; }
function rotX(p,a){ const s=Math.sin(a), c=Math.cos(a); return [ p[0], c*p[1]-s*p[2], s*p[1]+c*p[2] ]; }
function project(p){ return [ p[0]*scalePx*cam.zoom + CW/2, -p[1]*scalePx*cam.zoom + CH/2 ]; }

function computeDims(L,W,H,t,hasLid,mode){
  let extL=L, extW=W, extH=H, intL=L, intW=W, intH=H;
  if(mode==='inner'){ extL=L+2*t; extW=W+2*t; extH=H + (hasLid?2*t:1*t); }
  else { intL=L-2*t; intW=W-2*t; intH=H - (hasLid?2*t:1*t); }
  return {extL,extW,extH,intL,intW,intH};
}
function faceRectBase(face, dims, mode){
  const Lb = (mode==='inner')? dims.intL : dims.extL;
  const Wb = (mode==='inner')? dims.intW : dims.extW;
  const Hb = (mode==='inner')? dims.intH : dims.extH;
  if(face==='front'||face==='back') return {u:Lb, v:Hb};
  if(face==='left'||face==='right') return {u:Wb, v:Hb};
  if(face==='bottom'||face==='top') return {u:Lb, v:Wb};
  return {u:0,v:0};
}
function faceRectOuter(face, dims){
  const L = dims.extL, W = dims.extW, H = dims.extH;
  if(face==='front'||face==='back') return {u:L, v:H};
  if(face==='left'||face==='right') return {u:W, v:H};
  if(face==='bottom'||face==='top') return {u:L, v:W};
  return {u:0,v:0};
}
function uvTo3D(face, u, v, dims, delta){
  const L=dims.extL, W=dims.extW, H=dims.extH;
  switch(face){
    case 'front':  return [u, v,  W/2 - delta];
    case 'back':   return [-u, v, -W/2 + delta];
    case 'left':   return [-L/2 + delta, v, u];
    case 'right':  return [ L/2 - delta, v, -u];
    case 'bottom': return [u, -H/2 + delta, -v];
    case 'top':    return [u,  H/2 - delta,  v];
  }
  return [u,v,0];
}
function computeAdjPairsWithPhase(dims, hasLid){
  const faces = hasLid? ['bottom','front','back','left','right','top'] : ['bottom','front','back','left','right'];
  const corners = (o)=>[[-o.u/2,o.v/2],[o.u/2,o.v/2],[o.u/2,-o.v/2],[-o.u/2,-o.v/2]];
  const sideSeg = (f,side)=>{
    const o=faceRectOuter(f,dims); const c=corners(o);
    if(side==='top')    return [uvTo3D(f,c[0][0],c[0][1],dims,0), uvTo3D(f,c[1][0],c[1][1],dims,0)];
    if(side==='right')  return [uvTo3D(f,c[1][0],c[1][1],dims,0), uvTo3D(f,c[2][0],c[2][1],dims,0)];
    if(side==='bottom') return [uvTo3D(f,c[2][0],c[2][1],dims,0), uvTo3D(f,c[3][0],c[3][1],dims,0)];
    if(side==='left')   return [uvTo3D(f,c[3][0],c[3][1],dims,0), uvTo3D(f,c[0][0],c[0][1],dims,0)];
  };
  const keyPt = p=>p.map(v=>v.toFixed(3)).join(',');
  const canonKey=(a,b)=>{const ka=keyPt(a), kb=keyPt(b); return (ka<kb)? [ka,kb] : [kb,ka];};
  const isCanonOrient=(a,b)=>{const ka=keyPt(a), kb=keyPt(b); const [lo,hi]=canonKey(a,b); return ka===lo && kb===hi;};
  const segMap=new Map();
  for(const f of faces){
    for(const side of ['top','right','bottom','left']){
      const [A,B]=sideSeg(f,side);
      const [K1,K2]=canonKey(A,B);
      const k=K1+'|'+K2;
      if(!segMap.has(k)) segMap.set(k,[]);
      segMap.get(k).push({f,side,A,B,isCanon:isCanonOrient(A,B)});
    }
  }
  const pairs=[];
  for(const [k,arr] of segMap){
    if(arr.length===2){ pairs.push({A:arr[0], B:arr[1], key:k}); }
  }
  return pairs;
}
function buildRolesAndPhase(dims, hasLid){
  const pairs = computeAdjPairsWithPhase(dims, hasLid);
  const role = {
    bottom:{top:'straight',right:'straight',bottom:'straight',left:'straight'},
    front:{top:'straight',right:'straight',bottom:'straight',left:'straight'},
    back:{top:'straight',right:'straight',bottom:'straight',left:'straight'},
    left:{top:'straight',right:'straight',bottom:'straight',left:'straight'},
    right:{top:'straight',right:'straight',bottom:'straight',left:'straight'},
    top:{top:'straight',right:'straight',bottom:'straight',left:'straight'},
  };
  const phase = {
    bottom:{top:0,right:0,bottom:0,left:0},
    front:{top:0,right:0,bottom:0,left:0},
    back:{top:0,right:0,bottom:0,left:0},
    left:{top:0,right:0,bottom:0,left:0},
    right:{top:0,right:0,bottom:0,left:0},
    top:{top:0,right:0,bottom:0,left:0},
  };
  const key = x=> `${x.f}:${x.side}`;
  for(const p of pairs){
    const aKey = key(p.A), bKey = key(p.B);
    const AM = (aKey < bKey);
    const m = AM ? p.A : p.B; // male
    const f = AM ? p.B : p.A; // female
    role[m.f][m.side] = 'male';
    role[f.f][f.side] = 'female';
    phase[m.f][m.side] = p.A.isCanon ? (m===p.A?0:1) : (m===p.A?1:0);
    phase[f.f][f.side] = p.B.isCanon ? (f===p.B?1:0) : (f===p.B?0:1);
  }
  if(!hasLid){ for(const f of ['front','back','left','right']) role[f].top='straight'; }
  return {role,phase};
}
function edgeVec(side){
  if(side==='top')    return {t:[ 1, 0], n:[ 0,-1]};
  if(side==='right')  return {t:[ 0, 1], n:[ 1, 0]};
  if(side==='bottom') return {t:[-1, 0], n:[ 0, 1]};
  if(side==='left')   return {t:[ 0,-1], n:[-1, 0]};
  return {t:[1,0], n:[0,-1]};
}
function computeN(len, toothW){
  let N = Math.max(1, Math.round((len / toothW - 1) / 2));
  if (2*N+1 < 3) N = 1; return N;
}
function edgePolyline(x,y,w,h, side, role, depth, toothW, mode, phaseShift){
  const v=edgeVec(side); let cx,cy;
  if(side==='top'){cx=x;      cy=y;}
  if(side==='right'){cx=x+w;  cy=y;}
  if(side==='bottom'){cx=x+w; cy=y+h;}
  if(side==='left'){cx=x;     cy=y+h;}
  const tx=v.t[0],ty=v.t[1], nx=v.n[0],ny=v.n[1];
  const len = (side==='top'||side==='bottom')? w : h;
  const N = computeN(len, toothW);
  const step = len/(2*N+1);
  const pts=[[cx,cy]];
  const fw=(dx,dy,L)=>{ cx+=dx*L; cy+=dy*L; pts.push([cx,cy]); };
  if(role==='straight'||N<=0){
    if(side==='top'){ fw(1,0,w); }
    if(side==='right'){ fw(0,1,h); }
    if(side==='bottom'){ fw(-1,0,w); }
    if(side==='left'){ fw(0,-1,h); }
    return pts;
  }
  const dir = (mode==='inner')? +1 : -1;
  fw(tx,ty, step);
  for(let i=0;i<N;i++){
    const par = (i + (phaseShift||0)) % 2;
    const doExtrude = (role==='male') ? (par===0) : (par===1);
    if(doExtrude){ fw(nx,ny, dir*depth); }
    fw(tx,ty, step);
    if(doExtrude){ fw(-nx,-ny, dir*depth); }
    fw(tx,ty, step);
  }
  return pts;
}
function rectPath(face, dims, mode, t, kerf, toothW, role, phase){
  const base = faceRectBase(face, dims, mode);
  const x=-base.u/2, y=-base.v/2, w=base.u, h=base.v;
  const depth = ($('depthMode').value==='equal'? t : (t+kerf));
  const order=['top','right','bottom','left'];
  let ptsAll=[];
  function join(poly){
    if(ptsAll.length){
      const a=ptsAll[ptsAll.length-1], b=poly[0];
      if(Math.hypot(a[0]-b[0], a[1]-b[1])<1e-6) poly=poly.slice(1);
    }
    ptsAll = ptsAll.concat(poly);
  }
  for(const side of order){
    const poly = edgePolyline(x,y,w,h, side, role[face][side], depth, toothW, mode, phase[face][side]||0);
    join(poly);
  }
  const fmt=n=>Number(n.toFixed(4));
  const d = 'M '+fmt(ptsAll[0][0])+' '+fmt(ptsAll[0][1])+' '+ptsAll.slice(1).map(p=>'L '+fmt(p[0])+' '+fmt(p[1])).join(' ')+' Z';
  return d;
}
function layoutRects(dims, mode, hasLid, toothW, t, kerf, role){
  const faces = hasLid? ['bottom','front','right','back','left','top'] : ['bottom','front','back','left','right'];
  const needOutExtra = (mode==='inner');
  function extras(face){
    if(!needOutExtra) return {top:0,right:0,bottom:0,left:0};
    const r=role[face], has=(s)=>r[s]!=='straight';
    const depth = ($('depthMode').value==='equal'? +$('thk').value : (+$('thk').value + +$('kerf').value));
    return { top:has('top')?depth:0, right:has('right')?depth:0, bottom:has('bottom')?depth:0, left:has('left')?depth:0 };
  }
  if(hasLid){
    const L=dims.extL, W=dims.extW, H=dims.extH; const M=10, xB=M+W, yB=M+H;
    return {
      bottom:{x:xB, y:yB, w:L, h:W, face:'bottom'},
      front: {x:xB, y:yB-H, w:L, h:H, face:'front'},
      back:  {x:xB, y:yB+W, w:L, h:H, face:'back'},
      left:  {x:xB-W, y:yB, w:W, h:H, face:'left'},
      right: {x:xB+L, y:yB, w:W, h:H, face:'right'},
      top:   {x:xB, y:yB+W+H, w:L, h:W, face:'top'},
    };
  }else{
    const base={};
    for(const f of faces){
      const b=faceRectBase(f,dims,mode); const e=extras(f);
      base[f]={w:b.u+(e.left+e.right), h:b.v+(e.top+e.bottom), ex:e};
    }
    const gap=10, M=10;
    const row1H=Math.max(base.bottom.h, base.front.h, base.back.h);
    const row2H=Math.max(base.left.h, base.right.h);
    const rects={}; let x=M, y=M + (row1H-base.bottom.h)/2;
    rects.bottom={x,y,w:base.bottom.w,h:base.bottom.h,face:'bottom'}; x+=base.bottom.w+gap;
    y=M + (row1H-base.front.h)/2;
    rects.front={x,y,w:base.front.w,h:base.front.h,face:'front'}; x+=base.front.w+gap;
    y=M + (row1H-base.back.h)/2;
    rects.back={x,y,w:base.back.w,h:base.back.h,face:'back'};
    x=M; y=M + row1H + gap + (row2H-base.left.h)/2;
    rects.left={x,y,w:base.left.w,h:base.left.h,face:'left'}; x+=base.left.w+gap;
    y=M + row1H + gap + (row2H-base.right.h)/2;
    rects.right={x,y,w:base.right.w,h:base.right.h,face:'right'};
    return rects;
  }
}
function edgeLength(face, side, dims, mode){
  const b = faceRectBase(face,dims,mode);
  if(side==='top'||side==='bottom') return b.u; else return b.v;
}
function calcNFor(face, side, dims, mode, toothW){
  return computeN(edgeLength(face,side,dims,mode), toothW);
}
function edgePattern(roleType, phaseShift, N){
  const arr=[];
  for(let i=0;i<N;i++){
    const par = (i + (phaseShift||0)) % 2;
    arr.push(roleType==='male' ? (par===0?1:0) : (par===1?1:0));
  }
  return arr;
}
function enforceComplement(dims, mode, toothW, role, phase, hasLid){
  const pairs = computeAdjPairsWithPhase(dims, hasLid);
  for(const p of pairs){
    const A = p.A, B = p.B;
    if(role[A.f][A.side] === role[B.f][B.side]){
      role[B.f][B.side] = (role[A.f][A.side]==='male')?'female':'male';
    }
    const NA = calcNFor(A.f,A.side,dims,mode,toothW);
    const NB = calcNFor(B.f,B.side,dims,mode,toothW);
    const N = Math.min(NA,NB);
    const pattA = edgePattern(role[A.f][A.side], phase[A.f][A.side]||0, N);
    let pattB = edgePattern(role[B.f][B.side], phase[B.f][B.side]||0, N);
    let ok=true; for(let i=0;i<N;i++){ if( (pattA[i]^pattB[i])!==1 ){ ok=false; break; } }
    if(!ok){
      phase[B.f][B.side] = (phase[B.f][B.side]||0)^1;
      pattB = edgePattern(role[B.f][B.side], phase[B.f][B.side]||0, N);
      ok=true; for(let i=0;i<N;i++){ if( (pattA[i]^pattB[i])!==1 ){ ok=false; break; } }
      if(!ok){
        role[B.f][B.side] = (role[B.f][B.side]==='male')?'female':'male';
        const pattB2 = edgePattern(role[B.f][B.side], phase[B.f][B.side]||0, N);
        let ok2=true; for(let i=0;i<N;i++){ if( (pattA[i]^pattB2[i])!==1 ){ ok2=false; break; } }
        if(!ok2){ phase[B.f][B.side] = (phase[B.f][B.side]||0)^1; }
      }
    }
  }
  return {role,phase};
}

function draw(){
  if(!ctx||!mctx){ const box=$('errInfo'); if(box) box.textContent='錯誤：找不到繪圖環境（canvas/micro-canvas）'; return; }
  const errBox = $('errInfo'); errBox.textContent='';
  try{
    const mode=$('dimMode').value, hasLid=$('hasLid').checked;
    const L=+$('len').value, W=+$('wid').value, H=+$('hei').value, t=+$('thk').value;
    const kerf=+$('kerf').value, toothW=+$('toothW').value;
    const dims=computeDims(L,W,H,t,hasLid,mode);
    $('dimInfo').textContent = `外形：${dims.extL.toFixed(1)}×${dims.extW.toFixed(1)}×${dims.extH.toFixed(1)} mm  ·  內空：${Math.max(0,dims.intL).toFixed(1)}×${Math.max(0,dims.intW).toFixed(1)}×${Math.max(0,dims.intH).toFixed(1)} mm`;
    const sampleSideLen = Math.max(dims.extL,dims.extW,dims.extH);
    const Nsample = computeN(sampleSideLen, toothW);
    const stepEq = (sampleSideLen / (2*Nsample+1));
    $('extraInfo').textContent = `mode=${mode} · t=${t.toFixed(2)} · kerf=${kerf.toFixed(2)} · 目標齒寬=${toothW.toFixed(1)}mm · 等寬step≈${stepEq.toFixed(2)}mm`;

    const dpr=(window.devicePixelRatio||1);
    const maxDim=Math.max(dims.extL,dims.extW,dims.extH);
    scalePx = (Math.min(CW,CH)*0.40)/maxDim;
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,CW,CH);
    // grid
    ctx.save(); ctx.globalAlpha=0.12; ctx.strokeStyle='#9fb3c8'; const st=40*dpr;
    for(let x=(CW/2)%st; x<CW; x+=st){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
    for(let y=(CH/2)%st; y<CH; y+=st){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }
    ctx.restore();

    const showTeeth = $('showTeeth3D').checked;
    let {role,phase} = buildRolesAndPhase(dims, hasLid);
    ({role,phase} = enforceComplement(dims, mode, toothW, role, phase, hasLid));
    const faces = hasLid? ['back','front','bottom','top','right','left'] : ['back','front','bottom','right','left'];
    const tSurf = (mode==='inner')? 0 : t;

    // painter order（按視角深度）
    const order=[];
    for(const f of faces){
      const P = uvTo3D(f,0,0,dims,0);
      const R = rotX(rotY(P,cam.yaw),cam.pitch);
      order.push({f,z:R[2]});
    }
    order.sort((a,b)=>a.z-b.z);

    for(const {f} of order){
      const out = faceRectOuter(f,dims);
      const base = faceRectBase(f,dims,mode);
      const outerCorners=[[-out.u/2,out.v/2],[out.u/2,out.v/2],[out.u/2,-out.v/2],[-out.u/2,-out.v/2]]
        .map(([uu,vv])=>project(rotX(rotY(uvTo3D(f,uu,vv,dims,0),cam.yaw),cam.pitch)));
      ctx.beginPath(); ctx.moveTo(outerCorners[0][0],outerCorners[0][1]);
      for(let i=1;i<4;i++) ctx.lineTo(outerCorners[i][0],outerCorners[i][1]);
      ctx.closePath(); ctx.fillStyle='rgba(60,130,210,0.55)'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(220,235,255,0.95)'; ctx.stroke();

      if(showTeeth){
        const x=-base.u/2, y=-base.v/2, w=base.u, h=base.v;
        function drawEdge(side,color){
          const poly = edgePolyline(x,y,w,h, side, role[f][side], ($('depthMode').value==='equal'? t : (t+kerf)), +$('toothW').value, $('dimMode').value, phase[f][side]||0);
          ctx.save(); ctx.beginPath();
          let [u0,v0]=poly[0];
          let P0 = project(rotX(rotY(uvTo3D(f,u0,v0,dims,tSurf),cam.yaw),cam.pitch));
          ctx.moveTo(P0[0],P0[1]);
          for(let i=1;i<poly.length;i++){
            let [u,v]=poly[i];
            let P = project(rotX(rotY(uvTo3D(f,u,v,dims,tSurf),cam.yaw),cam.pitch));
            ctx.lineTo(P[0],P[1]);
          }
          ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
        }
        const colMale='rgba(170,220,255,0.98)', colFem='rgba(255,220,170,0.98)';
        if(role[f].top    !=='straight') drawEdge('top',    role[f].top   ==='male'?colMale:colFem);
        if(role[f].right  !=='straight') drawEdge('right',  role[f].right ==='male'?colMale:colFem);
        if(role[f].bottom !=='straight') drawEdge('bottom', role[f].bottom==='male'?colMale:colFem);
        if(role[f].left   !=='straight') drawEdge('left',   role[f].left  ==='male'?colMale:colFem);
      }
    }

    drawMini(dims, mode, hasLid, +$('toothW').value, +$('thk').value, +$('kerf').value, role, phase);
  }catch(e){
    $('errInfo').textContent = '錯誤：' + (e?.message||e);
    console.error(e);
  }
}

function rectPolyPoints(face, dims, mode, t, kerf, toothW, role, phase){
  const base = faceRectBase(face, dims, mode);
  const x=-base.u/2, y=-base.v/2, w=base.u, h=base.v;
  const depth = ($('depthMode').value==='equal'? t : (t+kerf));
  const order=['top','right','bottom','left'];
  let ptsAll=[];
  function join(poly){
    if(ptsAll.length){
      const a=ptsAll[ptsAll.length-1], b=poly[0];
      if(Math.hypot(a[0]-b[0], a[1]-b[1])<1e-6) poly=poly.slice(1);
    }
    ptsAll = ptsAll.concat(poly);
  }
  for(const side of order){
    const poly = edgePolyline(x,y,w,h, side, role[face][side], depth, toothW, mode, phase[face][side]||0);
    join(poly);
  }
  return ptsAll;
}
function drawMini(dims, mode, hasLid, toothW, t, kerf, role, phase){
  const rects = layoutRects(dims, mode, hasLid, toothW, t, kerf, role);
  const w=mini.width, h=mini.height; mctx.setTransform(1,0,0,1,0,0); mctx.clearRect(0,0,w,h);
  const rectVals = Object.values(rects);
  if(!rectVals.length) return;
  const totalW = Math.max(...rectVals.map(r=>r.x+r.w)) - Math.min(...rectVals.map(r=>r.x));
  const totalH = Math.max(...rectVals.map(r=>r.y+r.h)) - Math.min(...rectVals.map(r=>r.y));
  const minX   = Math.min(...rectVals.map(r=>r.x));
  const minY   = Math.min(...rectVals.map(r=>r.y));
  const s=Math.min((w-6)/totalW, (h-6)/totalH); const ox=3, oy=3;
  mctx.save(); mctx.translate(ox-minX*s, oy-minY*s); mctx.scale(s,s);
  mctx.lineWidth = Math.max(1.0, 1.0/(window.devicePixelRatio||1));
  mctx.strokeStyle = '#8cc2ff';
  const order = hasLid? ['bottom','front','right','back','left','top'] : ['bottom','front','back','left','right'];
  for(const name of order){
    const r = rects[name]; if(!r) continue;
    const pts = rectPolyPoints(name, dims, mode, t, kerf, toothW, role, phase);
    mctx.save(); mctx.translate(r.x, r.y);
    mctx.beginPath();
    mctx.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) mctx.lineTo(pts[i][0], pts[i][1]);
    mctx.closePath();
    mctx.stroke();
    mctx.restore();
  }
  mctx.restore();
}

function buildSVG(kind){
  const mode=$('dimMode').value, hasLid=$('hasLid').checked;
  const L=+$('len').value, W=+$('wid').value, H=+$('hei').value, t=+$('thk').value;
  const kerf=+$('kerf').value, toothW=+$('toothW').value;
  const dims=computeDims(L,W,H,t,hasLid,mode);
  let {role,phase} = buildRolesAndPhase(dims, hasLid);
  ({role,phase} = enforceComplement(dims, mode, toothW, role, phase, hasLid));
  const rects = layoutRects(dims, mode, hasLid, toothW, t, kerf, role);

  const totalW = Math.max(...Object.values(rects).map(r=>r.x+r.w)) - Math.min(...Object.values(rects).map(r=>r.x));
  const totalH = Math.max(...Object.values(rects).map(r=>r.y+r.h)) - Math.min(...Object.values(rects).map(r=>r.y));
  const minX   = Math.min(...Object.values(rects).map(r=>r.x));
  const minY   = Math.min(...Object.values(rects).map(r=>r.y));

  const parts=[];
  const order = hasLid? ['bottom','front','right','back','left','top'] : ['bottom','front','back','left','right'];
  for(const name of order){
    const r=rects[name]; if(!r) continue;
    const d = rectPath(name, dims, mode, t, kerf, toothW, role, phase);
    const tx = (r.x - minX);
    const ty = (r.y - minY);
    parts.push(`<path d="${d}" transform="translate(${tx.toFixed(3)},${ty.toFixed(3)})" data-closed="true"/>`);
  }

  const svgHead = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n`+
    `<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="${(totalW).toFixed(3)}mm" height="${(totalH).toFixed(3)}mm" viewBox="0 0 ${(totalW).toFixed(3)} ${(totalH).toFixed(3)}" xml:space="preserve">`;

  // 單一輸出：雷切 CUT 層
  return [
    svgHead,
    `<g id="CUT" inkscape:groupmode="layer" inkscape:label="CUT" fill="none" stroke="#ff0000" stroke-width="0.001mm" stroke-linejoin="miter" stroke-linecap="square" shape-rendering="geometricPrecision">`,
    parts.join('\n'),
    `</g>`,
    `</svg>`
  ].join('\n');
}

function downloadText(text, filename){
  const blob = new Blob([text], {type:'image/svg+xml;charset=utf-8'});
  const url = (window.URL||window.webkitURL).createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  return url;
}
function makeSVG(){
  try{
    const svg = buildSVG('laser');
    const fname = `caseMaker_v0.35b_${$('dimMode').value}_laser.svg`;
    downloadText(svg, fname);
    const dataUrlInline = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    let base64='';
    try{ base64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))); }catch(_){ }
    let parseOk=true, msg='';
    try{ const doc = new DOMParser().parseFromString(svg,'image/svg+xml'); const perr=doc.getElementsByTagName('parsererror'); if(perr && perr.length){ parseOk=false; msg=perr[0].textContent||'parsererror'; } }catch(e){ parseOk=false; msg=e.message; }
    const parseBadge = parseOk? '✅ SVG 結構正常' : ('❌ 解析警告：'+msg);
    const b64Link = base64? ` | <a class="link" href="${base64}" target="_blank" rel="noopener">在新分頁開啟（Base64）</a>` : '';
    $('links').innerHTML = `<a class="link" href="${dataUrlInline}" target="_blank" rel="noopener">在新分頁開啟</a>${b64Link} | <span>${parseBadge}</span>`;
    $('svgText').style.display='block'; $('svgText').value=svg;
  }catch(e){ $('links').textContent='匯出失敗：'+(e?.message||e); console.error(e); }
}

function runTests(){
  const log = [];
  const push=(ok,msg)=>{log.push((ok?'✅ ':'❌ ')+msg); if(!ok) console.error('[TEST]',msg);};
  try{
    const mode='outer', hasLid=false; const L=120,W=80,H=60,t=3,kerf=0.05, toothW=12;
    const dims=computeDims(L,W,H,t,hasLid,mode);
    let {role,phase}=buildRolesAndPhase(dims,hasLid);
    ({role,phase}=enforceComplement(dims, mode, toothW, role, phase, hasLid));
    const pairs=computeAdjPairsWithPhase(dims,hasLid);
    let okPairs=true;
    for(const p of pairs){
      const a=role[p.A.f][p.A.side]; const b=role[p.B.f][p.B.side];
      if(!((a==='male'&&b==='female')||(a==='female'&&b==='male'))){ okPairs=false; break; }
    }
    push(okPairs,'相鄰邊公/母互補');
    const faces = ['bottom','front','back','left','right'];
    let okPaths=true;
    for(const f of faces){
      const d=rectPath(f,dims,mode,t,kerf,toothW,role,phase);
      if(!(d && d.endsWith('Z') && d.indexOf('NaN')===-1 && d.indexOf('undefined')===-1)) okPaths=false;
    }
    push(okPaths,'每一面 SVG path 封閉且無 NaN/undefined');
    try{ const s=buildSVG('laser'); const doc=new DOMParser().parseFromString(s,'image/svg+xml'); const ok = doc.getElementsByTagName('parsererror').length===0; push(ok,'DOMParser 解析通過（單一CUT層）'); }catch(e){ push(false,'輸出測試失敗: '+e.message); }
  }catch(e){ push(false,'測試例外: '+e.message); }
  const txt=log.join(' · ');
  const node=$('extraInfo'); node.textContent = (node.textContent? node.textContent+' · ': '') + txt;
}

function syncToothControls(){
  const n = +$('toothW').value; $('toothWRange').value = n; $('toothWLive').textContent = n.toFixed(1);
}

function drawOnceSized(){ resizeNow(); runTests(); }
['dimMode','len','wid','hei','thk','hasLid','toothW','kerf','depthMode','showTeeth3D','showThickness3D','toothWRange'].forEach(id=>{
  const el=$(id); if(!el) return; el.addEventListener('input', ()=>{
    if(id==='toothWRange'){ $('toothW').value = $('toothWRange').value; }
    if(id==='toothW'){ $('toothWRange').value = $('toothW').value; }
    syncToothControls(); draw();
  });
});
$('btnReset').addEventListener('click', ()=>{ cam.yaw=Math.PI/6; cam.pitch=-Math.PI/7; cam.zoom=1.1; draw(); });
$('btnSVG').addEventListener('click', ()=>makeSVG());
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', ()=>{ syncToothControls(); requestAnimationFrame(drawOnceSized); });
}else{ syncToothControls(); requestAnimationFrame(drawOnceSized); }
</script>
