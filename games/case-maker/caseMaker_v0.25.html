<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>caseMaker v0.25 — 共享骨架榫接盒（五面分離 / 六面網狀）</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --card:#0f1520; --text:#e6edf3; --muted:#9fb3c8; --border:#1e2633; --accent:#8cc2ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Helvetica Neue",Arial}
  .wrap{display:grid;grid-template-columns:minmax(300px,1fr) 360px;gap:12px;height:100vh;padding:12px}
  #view{position:relative;background:#0c141d;border:1px solid var(--border);border-radius:12px;overflow:hidden;min-height:320px}
  #canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #hud{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:rgba(10,15,22,.65);border:1px solid var(--border);border-radius:8px;padding:6px 8px;backdrop-filter:blur(4px)}
  #miniBox{position:absolute;right:10px;bottom:10px;width:240px;height:150px;background:rgba(12,18,26,.55);border:1px solid var(--border);border-radius:10px;padding:6px}
  #mini{width:100%;height:100%;display:block}
  #overlayMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb3c8;font-size:14px;pointer-events:none}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;overflow:auto}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
  label{font-size:13px;color:var(--muted)}
  input[type="number"],select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
  input[type="range"]{width:100%}
  .title{font-weight:700;margin:4px 0 6px 0}
  .badge{display:inline-block;font-size:11px;padding:2px 6px;border:1px solid var(--border);border-radius:999px;color:var(--muted);margin-left:6px}
  .section{margin:12px 0;padding-top:8px;border-top:1px dashed var(--border)}
  .btn{background:#1a2432;color:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btnRow{display:flex;gap:8px;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--muted)}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">
  <div id="view">
    <canvas id="canvas"></canvas>
    <div id="overlayMsg">初始化畫布…</div>
    <div id="hud">
      <div><span class="badge">v0.25</span><span class="badge">共享骨架</span><span class="badge">角落不開孔</span></div>
      <div class="mono" id="dimInfo">—</div>
      <div class="mono" id="extraInfo">—</div>
      <div>拆裝 <span id="explodeStat">OFF</span> · <span class="mono" id="explodeVal">0mm</span></div>
    </div>
    <div id="miniBox"><canvas id="mini"></canvas></div>
  </div>

  <div class="panel">
    <div class="title">盒子參數</div>
    <div class="hint">依 <span class="mono">v0.13</span> 的正確卡榫幾何：<b>共享骨架＋中心起始＋角落不開孔</b>；結合 <span class="mono">v0.24</span> 的穩定渲染與五面分離輸出。</div>

    <div class="section">
      <div class="row">
        <label>尺寸基準</label>
        <label>有蓋</label>
        <select id="dimMode">
          <option value="outer">外徑</option>
          <option value="inner">內徑</option>
        </select>
        <div><input id="hasLid" type="checkbox"><span class="hint"> 勾＝六面（含蓋）</span></div>
      </div>
      <div class="row">
        <label>長 L (mm)</label><label>寬 W (mm)</label>
        <input id="len" type="number" step="0.1" min="1" value="120">
        <input id="wid" type="number" step="0.1" min="1" value="80">
      </div>
      <div class="row">
        <label>高 H (mm)</label><label>板厚 t (mm)</label>
        <input id="hei" type="number" step="0.1" min="1" value="60">
        <input id="thk" type="number" step="0.05" min="0.1" value="3.0">
      </div>
      <div class="row">
        <label>每邊齒數 <span class="mono" id="fingersVal">6</span></label>
        <label>Kerf 外擴 (mm)</label>
        <input id="fingers" type="range" min="1" max="20" step="1" value="6">
        <input id="kerf" type="number" step="0.01" min="0" value="0.05">
      </div>
      <div class="row">
        <label>齒深模式</label><label>拆裝距離 (mm)</label>
        <select id="depthMode">
          <option value="auto">自動：公=t+kerf；母=t</option>
          <option value="equal">等深：公=母=t</option>
        </select>
        <input id="explodeDist" type="range" min="0" max="80" step="1" value="12">
      </div>
      <div><input id="explodeOn" type="checkbox"><span class="hint"> 啟用拆裝（Exploded View）</span></div>
      <div class="hint">五面（無蓋）輸出為「分離 tiles」（每片是單一封閉 path 且包含公齒外擴）；六面（有蓋）輸出為「網狀 net」。</div>
    </div>

    <div class="section">
      <div class="title">匯出</div>
      <div class="btnRow">
        <button id="btnSVG" class="btn">輸出 SVG 展開圖</button>
        <button id="btnReset" class="btn">重設視角</button>
      </div>
      <div id="info" class="hint" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

const canvas = $('canvas'); const ctx = canvas.getContext('2d');
const mini = $('mini'); const mctx = mini.getContext('2d', {alpha:true});
const overlay = $('overlayMsg');
let CW=0, CH=0, scalePx=1;
let cam = { yaw: Math.PI/6, pitch: -Math.PI/7, zoom: 1.1, dragging:false, lastX:0,lastY:0, touchMode:null, lastPinchDist:0 };
let pointers = new Map();

function safeSizeCanvas(){
  const v = document.getElementById('view');
  let r = v.getBoundingClientRect();
  let w = r.width, h = r.height;
  if((!w || !h) && v.parentElement){
    const rp = v.parentElement.getBoundingClientRect();
    w = w || (rp.width - 370 - 24) || window.innerWidth - 380;
    h = h || (rp.height || window.innerHeight - 24);
  }
  w = Math.max(320, Math.floor((w||window.innerWidth*0.6) * (window.devicePixelRatio||1)));
  h = Math.max(320, Math.floor((h||window.innerHeight*0.6) * (window.devicePixelRatio||1)));
  return [w,h];
}
function safeSizeMini(){
  const box = document.getElementById('miniBox').getBoundingClientRect();
  const dpr = (window.devicePixelRatio||1);
  const w = Math.max(200, Math.floor((box.width||240)*dpr));
  const h = Math.max(120, Math.floor((box.height||150)*dpr));
  return [w,h];
}

function resizeNow(){
  const [w,h] = safeSizeCanvas();
  CW = canvas.width = w; CH = canvas.height = h;
  const [mw,mh] = safeSizeMini();
  mini.width = mw; mini.height = mh;
  overlay.style.display = 'none';
  draw();
}
function ensureSized(){
  let tries = 0;
  const tick = ()=>{ tries++; resizeNow(); if(tries<3) requestAnimationFrame(tick); };
  tick();
}
window.addEventListener('resize', resizeNow);

canvas.addEventListener('pointerdown', (e)=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cam.dragging=true; cam.lastX=e.clientX; cam.lastY=e.clientY; canvas.style.cursor='grabbing';
  if(pointers.size===2){ cam.touchMode='pinch'; cam.lastPinchDist = pinchDist(); }
});
canvas.addEventListener('pointerup', (e)=>{
  try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
  pointers.delete(e.pointerId);
  if(pointers.size<2) cam.touchMode=null;
  cam.dragging=false; canvas.style.cursor='grab';
});
canvas.addEventListener('pointermove', (e)=>{
  if(!pointers.has(e.pointerId)) return;
  const p = pointers.get(e.pointerId); p.x=e.clientX; p.y=e.clientY;
  if(cam.touchMode==='pinch' && pointers.size===2){
    const d = pinchDist(); if(cam.lastPinchDist>0){ cam.zoom = clamp(cam.zoom * d/cam.lastPinchDist, 0.3, 4); cam.lastPinchDist = d; draw(); }
    return;
  }
  if(cam.dragging){
    const dx=e.clientX-cam.lastX, dy=e.clientY-cam.lastY;
    cam.lastX=e.clientX; cam.lastY=e.clientY;
    cam.yaw += dx*0.005; cam.pitch = clamp(cam.pitch + dy*0.005, -Math.PI/2+0.05, Math.PI/2-0.05);
    draw();
  }
});
canvas.addEventListener('wheel', (e)=>{ e.preventDefault(); cam.zoom = clamp(cam.zoom*Math.pow(1.001,-e.deltaY),0.3,4); draw(); }, {passive:false});
function pinchDist(){ const a=[...pointers.values()]; if(a.length<2) return 0; const dx=a[0].x-a[1].x, dy=a[0].y-a[1].y; return Math.hypot(dx,dy); }

function rotY(p,a){ const s=Math.sin(a), c=Math.cos(a); return [ c*p[0]+s*p[2], p[1], -s*p[0]+c*p[2] ]; }
function rotX(p,a){ const s=Math.sin(a), c=Math.cos(a); return [ p[0], c*p[1]-s*p[2], s*p[1]+c*p[2] ]; }
function project(p){ return [ p[0]*scalePx*cam.zoom + CW/2, -p[1]*scalePx*cam.zoom + CH/2 ]; }

function computeDims(L,W,H,t,hasLid,mode){
  let extL=L, extW=W, extH=H, intL=L, intW=W, intH=H;
  if(mode==='inner'){ extL=L+2*t; extW=W+2*t; extH=H+(hasLid?2*t:1*t); }
  else{ intL=L-2*t; intW=W-2*t; intH=H-(hasLid?2*t:1*t); }
  return {extL,extW,extH,intL,intW,intH};
}
function faceRectCorners(face, Lx, Wy, Hz){
  let uSpan=0, vSpan=0;
  if(face==='front'||face==='back'){ uSpan=Lx; vSpan=Hz; }
  else if(face==='left'||face==='right'){ uSpan=Wy; vSpan=Hz; }
  else if(face==='bottom'||face==='top'){ uSpan=Lx; vSpan=Wy; }
  const u0=-uSpan/2, v0=-vSpan/2, u1=uSpan/2, v1=vSpan/2;
  return [[u0,v1],[u1,v1],[u1,v0],[u0,v0]];
}
function uvTo3D(face, u, v, Lx, Wy, Hz, explode){
  switch(face){
    case 'front':  return [u, v,  Wy/2 + explode];
    case 'back':   return [-u, v, -Wy/2 - explode];
    case 'left':   return [-Lx/2 - explode, v, u];
    case 'right':  return [ Lx/2 + explode, v, -u];
    case 'bottom': return [u, -Hz/2 - explode, -v];
    case 'top':    return [u,  Hz/2 + explode,  v];
  }
  return [u,v,0];
}
function dist3(a,b){ const dx=a[0]-b[0], dy=a[1]-b[1], dz=a[2]-b[2]; return Math.hypot(dx,dy,dz); }

// v0.13 role map
function roles(hasLid){
  return {
    bottom:{top:'male', right:'male', bottom:'male', left:'male'},
    front: {top: hasLid?'male':'straight', right:'male', bottom:'female', left:'female'},
    back:  {top:'female', right:'male', bottom: hasLid?'male':'straight', left:'female'},
    left:  {top: hasLid?'male':'straight', right:'female', bottom:'female', left:'male'},
    right: {top: hasLid?'male':'straight', right:'male', bottom:'female', left:'female'},
    top:   {top: hasLid?'female':'straight', right:hasLid?'female':'straight', bottom:hasLid?'female':'straight', left:hasLid?'female':'straight'}
  };
}

// -------- 3D 預覽（面+指示齒） --------
function draw(){
  if(!CW||!CH){ overlay.style.display='flex'; return; }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,CW,CH);

  // 背景格線
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = '#9fb3c8';
  ctx.lineWidth = 1;
  const step=40*(window.devicePixelRatio||1);
  for(let x=(CW/2)%step; x<CW; x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
  for(let y=(CH/2)%step; y<CH; y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }
  ctx.restore();

  const thk=+$('thk').value, hasLid=$('hasLid').checked, mode=$('dimMode').value;
  const len=+$('len').value, wid=+$('wid').value, hei=+$('hei').value;
  const kerf=+$('kerf').value, fingers=+$('fingers').value|0, depthMode=$('depthMode').value;
  const explodeOn=$('explodeOn').checked, explodeDist=+$('explodeDist').value;
  const {extL, extW, extH} = computeDims(len,wid,hei,thk,hasLid,mode);
  const Lx=Math.max(1e-3,extL), Wy=Math.max(1e-3,extW), Hz=Math.max(1e-3,extH);

  $('dimInfo').textContent = `外形（${mode==='outer'?'外徑':'依內徑換算'}）：${extL.toFixed(1)} × ${extW.toFixed(1)} × ${extH.toFixed(1)} mm`;
  $('extraInfo').textContent = `t=${thk.toFixed(2)} · fingers=${fingers}/邊 · kerf=+${kerf.toFixed(2)} · ${hasLid?'有蓋':'無蓋'}（五面分離）`;
  $('fingersVal').textContent = fingers;
  $('explodeStat').textContent = explodeOn?'ON':'OFF';
  $('explodeVal').textContent = `${explodeDist|0}mm`;

  const maxDim=Math.max(Lx,Wy,Hz);
  scalePx = (Math.min(CW,CH)*0.4)/maxDim;

  const faces = hasLid? ['back','front','bottom','top','right','left'] : ['back','front','bottom','right','left'];
  const explode = explodeOn? explodeDist : 0;

  const depth=[];
  for(const f of faces){
    const c = uvTo3D(f, 0, 0, Lx, Wy, Hz, explode);
    const r = rotX(rotY(c, cam.yaw), cam.pitch);
    depth.push({f, z:r[2]});
  }
  depth.sort((a,b)=>a.z-b.z);

  for(const {f} of depth){
    const corners = faceRectCorners(f, Lx, Wy, Hz).map(([u,v])=> uvTo3D(f,u,v,Lx,Wy,Hz,explode)).map(p=> rotX(rotY(p,cam.yaw),cam.pitch)).map(project);
    ctx.beginPath(); ctx.moveTo(corners[0][0], corners[0][1]);
    for(let i=1;i<corners.length;i++) ctx.lineTo(corners[i][0], corners[i][1]);
    ctx.closePath();
    // 簡單明暗
    const p0 = rotX(rotY(uvTo3D(f,0,0,Lx,Wy,Hz,explode), cam.yaw), cam.pitch);
    const pu = rotX(rotY(uvTo3D(f, maxDim*0.1,0,Lx,Wy,Hz,explode), cam.yaw), cam.pitch);
    const pv = rotX(rotY(uvTo3D(f,0,maxDim*0.1,Lx,Wy,Hz,explode), cam.yaw), cam.pitch);
    const ux = pu[0]-p0[0], uy=pu[1]-p0[1], uz=pu[2]-p0[2];
    const vx = pv[0]-p0[0], vy=pv[1]-p0[1], vz=pv[2]-p0[2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    const nl = Math.hypot(nx,ny,nz)||1; const nxx=nx/nl, nyy=ny/nl, nzz=nz/nl;
    const Lgt=[0.4,0.7,0.9]; let dp = Math.max(0.35, Math.min(0.95,(nxx*Lgt[0]+nyy*Lgt[1]+nzz*Lgt[2])*0.8+0.35));
    ctx.fillStyle = `rgba(${Math.round(40*dp)}, ${Math.round(130*dp)}, ${Math.round(220*dp)}, 0.55)`;
    ctx.fill();
    ctx.lineWidth = 2.0; ctx.strokeStyle = 'rgba(220,235,255,0.95)'; ctx.stroke();
  }

  // 指示齒：只畫可見面邊緣（矩形齒，貼合面）
  const rolesMap = roles(hasLid);
  for(const {f} of depth){
    // Back-face cull by normal Z after rotation
    const c0 = uvTo3D(f,0,0,Lx,Wy,Hz,explode);
    const pu = uvTo3D(f,maxDim*0.1,0,Lx,Wy,Hz,explode);
    const pv = uvTo3D(f,0,maxDim*0.1,Lx,Wy,Hz,explode);
    const r0=rotX(rotY(c0,cam.yaw),cam.pitch);
    const ru=rotX(rotY(pu,cam.yaw),cam.pitch);
    const rv=rotX(rotY(pv,cam.yaw),cam.pitch);
    const ux = ru[0]-r0[0], uy=ru[1]-r0[1], uz=ru[2]-r0[2];
    const vx = rv[0]-r0[0], vy=rv[1]-r0[1], vz=rv[2]-r0[2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    if(nz <= 0) continue;

    const corners = faceRectCorners(f, Lx, Wy, Hz).map(([u,v])=> uvTo3D(f,u,v,Lx,Wy,Hz,explode)).map(p=> rotX(rotY(p,cam.yaw),cam.pitch)).map(project);
    const conf = rolesMap[f];
    drawFingerEdgeCenterRect(corners[2], corners[3], conf.top==='male', thk, kerf, fingers);    // top (2-3)
    drawFingerEdgeCenterRect(corners[1], corners[2], conf.right==='male', thk, kerf, fingers);  // right (1-2)
    drawFingerEdgeCenterRect(corners[0], corners[1], conf.bottom==='male', thk, kerf, fingers); // bottom (0-1)
    drawFingerEdgeCenterRect(corners[3], corners[0], conf.left==='male', thk, kerf, fingers);   // left (3-0)
  }

  drawMiniInset(Lx,Wy,Hz, thk, kerf, fingers, hasLid);
}

function drawFingerEdgeCenterRect(A, B, male, t, kerf, f){
  const dx=B[0]-A[0], dy=B[1]-A[1];
  const L = Math.hypot(dx,dy);
  if(L<=1 || f<=0){ ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.strokeStyle='rgba(230,240,255,0.45)'; ctx.stroke(); return; }
  const ux=dx/L, uy=dy/L;
  const nx=-uy, ny=ux;
  const step = L/(2*f+1);
  const depthPx = clamp((t + (male?kerf:0)) * scalePx * cam.zoom, 1, Math.min(50, L*0.25));

  let cx=A[0], cy=A[1];
  ctx.beginPath(); ctx.moveTo(cx,cy);
  cx+=ux*step; cy+=uy*step; ctx.lineTo(cx,cy);
  for(let i=0;i<f;i++){
    const sgn = male?1:-1;
    ctx.lineTo(cx + nx*depthPx*sgn, cy + ny*depthPx*sgn);
    cx+=ux*step; cy+=uy*step; ctx.lineTo(cx + nx*depthPx*sgn, cy + ny*depthPx*sgn);
    ctx.lineTo(cx,cy);
    cx+=ux*step; cy+=uy*step; ctx.lineTo(cx,cy);
  }
  ctx.strokeStyle = male ? 'rgba(170,220,255,0.95)' : 'rgba(255,220,170,0.95)';
  ctx.lineWidth = 2.0;
  ctx.stroke();
}

// -------- 迷你展開圖（Path2D 失敗時降級） --------
function drawMiniInset(Lx,Wy,Hz, t, kerf, fingers, hasLid){
  const w=mini.width, h=mini.height;
  mctx.setTransform(1,0,0,1,0,0); mctx.clearRect(0,0,w,h);
  const mode=$('dimMode').value;
  const {extL, extW, extH} = computeDims(+$('len').value,+$('wid').value,+$('hei').value,+$('thk').value,hasLid,mode);
  Lx=extL; Wy=extW; Hz=extH;

  const depth = ($('depthMode').value==='equal'? t : (t+kerf));
  const M=6, GAP = hasLid? 0 : 8;
  const layout = layoutRects(Lx,Wy,Hz, hasLid, GAP, M, depth);
  const rects = layout.rects, totalW=layout.totalW, totalH=layout.totalH;

  const s=Math.min((w)/(totalW), (h)/(totalH));
  const ox=(w-totalW*s)/2, oy=(h-totalH*s)/2;
  mctx.save(); mctx.translate(ox,oy); mctx.scale(s,s);
  mctx.lineWidth = Math.max(1.0, 1.0/(window.devicePixelRatio||1)); mctx.strokeStyle= getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#8cc2ff';

  const order = hasLid? ['bottom','front','right','back','left','top'] : ['bottom','front','back','left','right'];
  try{
    for(const n of order){ const r=rects[n]; if(!r) continue; const p=new Path2D(rectPathSharedSkeleton(n,r,hasLid,t,kerf,fingers)); mctx.stroke(p); }
  }catch(e){
    for(const n of order){ const r=rects[n]; if(!r) continue; mctx.strokeRect(r.x, r.y, r.w, r.h); }
  }
  mctx.restore();
}

// -------- 版面配置（五面分離：tile 外擴包含公齒） --------
function layoutRects(Lx,Wy,Hz, hasLid, gap, margin, depth){
  const role = roles(hasLid);
  function baseSize(face){
    if(face==='front'||face==='back') return {w:Lx, h:Hz};
    if(face==='left'||face==='right') return {w:Wy, h:Hz};
    if(face==='bottom'||face==='top') return {w:Lx, h:Wy};
    return {w:0,h:0};
  }
  function extras(face){
    const r = role[face];
    return {
      top:    r.top==='male'    ? depth : 0,
      right:  r.right==='male'  ? depth : 0,
      bottom: r.bottom==='male' ? depth : 0,
      left:   r.left==='male'   ? depth : 0
    };
  }
  if(hasLid){
    const totalW = (Lx + 2*Wy) + 2*margin;
    const totalH = (Hz + Wy + Hz + Wy) + 2*margin;
    const xB = margin + Wy, yB = margin + Hz;
    const rects = {
      bottom: {x:xB, y:yB, w:Lx, h:Wy, ix:xB, iy:yB, iw:Lx, ih:Wy, ex:{top:0,right:0,bottom:0,left:0}},
      front:  {x:xB, y:yB - Hz, w:Lx, h:Hz, ix:xB, iy:yB - Hz, iw:Lx, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      back:   {x:xB, y:yB + Wy, w:Lx, h:Hz, ix:xB, iy:yB + Wy, iw:Lx, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      left:   {x:xB - Wy, y:yB, w:Wy, h:Hz, ix:xB - Wy, iy:yB, iw:Wy, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      right:  {x:xB + Lx, y:yB, w:Wy, h:Hz, ix:xB + Lx, iy:yB, iw:Wy, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      top:    {x:xB, y:yB + Wy + Hz, w:Lx, h:Wy, ix:xB, iy:yB + Wy + Hz, iw:Lx, ih:Wy, ex:{top:0,right:0,bottom:0,left:0}}
    };
    return {rects,totalW,totalH};
  }else{
    const faces = ['bottom','front','back','left','right'];
    const tiles = {};
    for(const f of faces){
      const b = baseSize(f); const e = extras(f);
      const tw = b.w + e.left + e.right;
      const th = b.h + e.top + e.bottom;
      tiles[f] = { w:tw, h:th, iw:b.w, ih:b.h, ex:e };
    }
    const colGap = gap, rowGap=gap;
    const row1H = Math.max(tiles.bottom.h, tiles.front.h, tiles.back.h);
    const row1W = tiles.bottom.w + colGap + tiles.front.w + colGap + tiles.back.w;
    const row2H = Math.max(tiles.left.h, tiles.right.h);
    const row2W = tiles.left.w + colGap + tiles.right.w;
    const totalW = Math.max(row1W, row2W) + 2*margin;
    const totalH = row1H + rowGap + row2H + 2*margin;
    const x0 = margin, y0 = margin;
    let x = x0, y = y0 + (row1H - tiles.bottom.h)/2;
    const rects = {};
    rects.bottom = { x:x, y:y, w:tiles.bottom.w, h:tiles.bottom.h, ix: x + tiles.bottom.ex.left, iy: y + tiles.bottom.ex.top, iw: tiles.bottom.iw, ih: tiles.bottom.ih, ex: tiles.bottom.ex };
    x += tiles.bottom.w + colGap;
    y = y0 + (row1H - tiles.front.h)/2;
    rects.front = { x:x, y:y, w:tiles.front.w, h:tiles.front.h, ix: x + tiles.front.ex.left, iy: y + tiles.front.ex.top, iw: tiles.front.iw, ih: tiles.front.ih, ex: tiles.front.ex };
    x += tiles.front.w + colGap;
    y = y0 + (row1H - tiles.back.h)/2;
    rects.back = { x:x, y:y, w:tiles.back.w, h:tiles.back.h, ix: x + tiles.back.ex.left, iy: y + tiles.back.ex.top, iw: tiles.back.iw, ih: tiles.back.ih, ex: tiles.back.ex };
    x = x0;
    y = y0 + row1H + rowGap + (row2H - tiles.left.h)/2;
    rects.left = { x:x, y:y, w:tiles.left.w, h:tiles.left.h, ix: x + tiles.left.ex.left, iy: y + tiles.left.ex.top, iw: tiles.left.iw, ih: tiles.left.ih, ex: tiles.left.ex };
    x += tiles.left.w + colGap;
    y = y0 + row1H + rowGap + (row2H - tiles.right.h)/2;
    rects.right = { x:x, y:y, w:tiles.right.w, h:tiles.right.h, ix: x + tiles.right.ex.left, iy: y + tiles.right.ex.top, iw: tiles.right.iw, ih: tiles.right.ih, ex: tiles.right.ex };
    return {rects,totalW,totalH};
  }
}

// -------- v0.13：共享骨架邊緣產生（中心起始＋角落不開孔） --------
function rectPathSharedSkeleton(name, info, hasLid, t, kerf, fingers){
  // skeleton registry
  const SK = {};
  const role = roles(hasLid);

  function getSk(key, len, N){
    if(!SK[key]) SK[key] = {len, N, step: len/(2*N+1)};
    return SK[key];
  }
  function fmt(n){ return Number(n.toFixed(4)); }
  function edgePathBySk(side, x,y,w,h, role, skKey){
    if(role==='straight' || (fingers|0)<=0){
      const ex = side==='top'? x+w : side==='bottom'? x-w : x;
      const ey = side==='left'? y-h : side==='right'? y+h : y;
      return `L ${fmt(ex)} ${fmt(ey)}`;
    }
    const male = (role==='male');
    const len = (side==='top'||side==='bottom') ? w : h;
    const sk = getSk(skKey, len, fingers|0);
    const step = sk.step;
    const depth = ($('depthMode').value==='equal'? t : (male? t+kerf : t));

    const dir = {
      top:    {dx:1, dy:0, nx:0, ny:-1},
      right:  {dx:0, dy:1, nx:1, ny:0},
      bottom: {dx:-1,dy:0, nx:0, ny:1},
      left:   {dx:0, dy:-1,nx:-1,ny:0}
    }[side];

    let cx=x, cy=y;
    const d0=[];
    const forward=(dx,dy,len)=>{ cx += dx*len; cy += dy*len; d0.push(`L ${fmt(cx)} ${fmt(cy)}`); };

    forward(dir.dx,dir.dy, step);
    for(let i=0;i<sk.N;i++){
      forward(dir.nx,dir.ny, depth);
      forward(dir.dx,dir.dy, step);
      forward(-dir.nx,-dir.ny, depth);
      forward(dir.dx,dir.dy, step);
    }
    return d0.join(' ');
  }

  // skeleton key mapping（與 v0.13 一致）
  const skKey = {};
  skKey.bottom = { top:'sk_bTop_frontBottom', right:'sk_bRight_rightBottom', bottom:'sk_bBottom_backBottom', left:'sk_bLeft_leftBottom' };
  skKey.front  = { bottom:'sk_bTop_frontBottom', top:'sk_lid_L_frontTop', right:'sk_ring_FR', left:'sk_ring_LF' };
  skKey.back   = { bottom:'sk_bBottom_backBottom', top:'sk_lid_L_backTop', right:'sk_ring_RB2', left:'sk_ring_BL2' };
  skKey.left   = { bottom:'sk_bLeft_leftBottom',  top:'sk_lid_W_leftTop',  right:'sk_ring_LF', left:'sk_ring_BL2' };
  skKey.right  = { bottom:'sk_bRight_rightBottom', top:'sk_lid_W_rightTop', right:'sk_ring_RB2', left:'sk_ring_FR' };
  if(hasLid){
    skKey.top   = { top:'sk_lid_L_frontTop', right:'sk_lid_W_rightTop', bottom:'sk_lid_L_backTop', left:'sk_lid_W_leftTop' };
  }

  // 重要：以「內矩形」為基準繪齒（tile 已對應外擴）
  const x = info.ix, y = info.iy, w = info.iw, h = info.ih;
  const rm = role[name] || {top:'straight',right:'straight',bottom:'straight',left:'straight'};
  const km = skKey[name] || {top:'',right:'',bottom:'',left:''};

  let d = `M ${fmt(x)} ${fmt(y)} `;
  d += edgePathBySk('top', x,y,w,h, rm.top, km.top);
  d += edgePathBySk('right', x+w, y, w,h, rm.right, km.right);
  d += edgePathBySk('bottom', x+w, y+h, w,h, rm.bottom, km.bottom);
  d += edgePathBySk('left', x, y+h, w,h, rm.left, km.left);
  d += 'Z';
  return d;
}

// -------- 匯出 SVG（五面＝分離 tiles；六面＝網狀 net） --------
function makeSVG(){
  const mode=$('dimMode').value, L=+$('len').value, Wd=+$('wid').value, Ht=+$('hei').value, t=+$('thk').value;
  const kerf=+$('kerf').value, fingers=+$('fingers').value|0, hasLid=$('hasLid').checked;
  const {extL, extW, extH} = computeDims(L,Wd,Ht,t,hasLid,mode);
  const Lx=extL, Wy=extW, Hz=extH;
  const depth = ($('depthMode').value==='equal'? t : (t+kerf));

  let svg='', fname='';
  if(!hasLid){
    const M = 10, GAP = 10;
    const layout = layoutRects(Lx,Wy,Hz, hasLid, GAP, M, depth);
    const rects = layout.rects, totalW=layout.totalW, totalH=layout.totalH;
    const order = ['bottom','front','back','left','right'];
    const parts = [];
    const lbs=[];
    for(const n of order){
      const r = rects[n]; if(!r) continue;
      parts.push(`<path d="${rectPathSharedSkeleton(n,r,hasLid,t,kerf,fingers)}" data-closed="true"/>`);
      lbs.push([r.x+r.w/2, r.y+r.h/2, n]);
    }
    svg = [
      `<?xml version="1.0" encoding="UTF-8" standalone="no"?>`,
      `<svg xmlns="http://www.w3.org/2000/svg" width="${(totalW).toFixed(3)}mm" height="${(totalH).toFixed(3)}mm" viewBox="0 0 ${(totalW).toFixed(3)} ${(totalH).toFixed(3)}">`,
      `<g fill="none" stroke="#000" stroke-width="0.10" stroke-linejoin="miter" shape-rendering="geometricPrecision">`,
      ...parts,
      `</g>`,
      `<g fill="#666" font-size="4" font-family="monospace">`,
      ...lbs.map(([x,y,t])=>`<text x="${x.toFixed(3)}" y="${y.toFixed(3)}" dominant-baseline="middle" text-anchor="middle">${t}</text>`),
      `<text x="10" y="${(totalH-5).toFixed(3)}" font-size="3.2" fill="#333">caseMaker v0.25 · ${Lx.toFixed(1)}×${Wy.toFixed(1)}×${Hz.toFixed(1)}mm · t=${t.toFixed(2)} · kerf+${kerf.toFixed(2)} · fingers=${fingers} · sep-tiles include male protrusions · shared-skeleton center-start</text>`,
      `</g>`,
      `</svg>`
    ].join('\n');
    fname = `caseMaker_${Lx.toFixed(1)}x${Wy.toFixed(1)}x${Hz.toFixed(1)}_t${t.toFixed(2)}_sepTiles_v025.svg`;
  }else{
    // 六面：沿用 v0.13 的網狀配置（不做外擴 tile）
    const M = 10;
    const totalW = (Lx + 2*Wy) + 2*M;
    const totalH = (Hz + Wy + Hz + Wy) + 2*M;
    const xB = M + Wy, yB = M + Hz;
    const rects = {
      bottom: {x:xB, y:yB, w:Lx, h:Wy, ix:xB, iy:yB, iw:Lx, ih:Wy, ex:{top:0,right:0,bottom:0,left:0}},
      front:  {x:xB, y:yB - Hz, w:Lx, h:Hz, ix:xB, iy:yB - Hz, iw:Lx, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      back:   {x:xB, y:yB + Wy, w:Lx, h:Hz, ix:xB, iy:yB + Wy, iw:Lx, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      left:   {x:xB - Wy, y:yB, w:Wy, h:Hz, ix:xB - Wy, iy:yB, iw:Wy, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      right:  {x:xB + Lx, y:yB, w:Wy, h:Hz, ix:xB + Lx, iy:yB, iw:Wy, ih:Hz, ex:{top:0,right:0,bottom:0,left:0}},
      top:    {x:xB, y:yB + Wy + Hz, w:Lx, h:Wy, ix:xB, iy:yB + Wy + Hz, iw:Lx, ih:Wy, ex:{top:0,right:0,bottom:0,left:0}}
    };
    const order = ['bottom','front','right','back','left','top'];
    const parts = [];
    const lbs=[];
    for(const n of order){
      const r = rects[n]; if(!r) continue;
      parts.push(`<path d="${rectPathSharedSkeleton(n,r,true,t,kerf,fingers)}" data-closed="true"/>`);
      lbs.push([r.x+r.w/2, r.y+r.h/2, n]);
    }
    svg = [
      `<?xml version="1.0" encoding="UTF-8" standalone="no"?>`,
      `<svg xmlns="http://www.w3.org/2000/svg" width="${(totalW).toFixed(3)}mm" height="${(totalH).toFixed(3)}mm" viewBox="0 0 ${(totalW).toFixed(3)} ${(totalH).toFixed(3)}">`,
      `<g fill="none" stroke="#000" stroke-width="0.10" stroke-linejoin="miter" shape-rendering="geometricPrecision">`,
      ...parts,
      `</g>`,
      `<g fill="#666" font-size="4" font-family="monospace">`,
      ...lbs.map(([x,y,t])=>`<text x="${x.toFixed(3)}" y="${y.toFixed(3)}" dominant-baseline="middle" text-anchor="middle">${t}</text>`),
      `<text x="10" y="${(totalH-5).toFixed(3)}" font-size="3.2" fill="#333">caseMaker v0.25 · ${Lx.toFixed(1)}×${Wy.toFixed(1)}×${Hz.toFixed(1)}mm · t=${t.toFixed(2)} · kerf+${kerf.toFixed(2)} · fingers=${fingers} · NET · shared-skeleton center-start</text>`,
      `</g>`,
      `</svg>`
    ].join('\n');
    fname = `caseMaker_${Lx.toFixed(1)}x${Wy.toFixed(1)}x${Hz.toFixed(1)}_t${t.toFixed(2)}_NET_v025.svg`;
  }

  const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a);
  a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0);
  $('info').innerHTML = `已輸出 <span class="mono">${fname}</span>`;
}

// -------- 迷你用輔助：預覽邊齒（中心起始） --------
function rectPathFromInfo(name, info, hasLid, t, kerf, fingers){
  return rectPathSharedSkeleton(name, info, hasLid, t, kerf, fingers);
}

// -------- UI hook --------
;['dimMode','len','wid','hei','thk','hasLid','fingers','kerf','explodeOn','explodeDist','depthMode'].forEach(id=>{
  $(id).addEventListener('input', ()=>{
    if(id==='fingers') $('fingersVal').textContent=$('fingers').value;
    draw();
  });
});
$('btnReset').addEventListener('click', ()=>{ cam.yaw=Math.PI/6; cam.pitch=-Math.PI/7; cam.zoom=1.1; draw(); });
$('btnSVG').addEventListener('click', makeSVG);

function init(){ overlay.style.display='flex'; ensureSized(); }
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); }
else{ init(); }
</script>
