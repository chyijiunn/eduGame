<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Box Maker v0.31 – 深色 / 指接卡榫 / 伸縮補償 / Canvas 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 10px 14px;
      background: #020617;
      border-bottom: 1px solid #111827;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 14px;
    }

    header .title-main {
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header .title-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-left: 6px;
    }
    header .ver {
      font-size: 11px;
      color: #6b7280;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 10px;
      gap: 10px;
    }

    @media (max-width: 900px) {
      main { flex-direction: column; }
    }

    .panel {
      background: #020617;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid #111827;
    }

    .left-panel {
      flex: 0 0 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-sub {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
    }
    .field-group label {
      font-size: 11px;
      margin-bottom: 3px;
      color: #d1d5db;
    }
    .field-group input,
    .field-group select {
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 12px;
      outline: none;
    }
    .field-group input:focus,
    .field-group select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.6);
    }

    .field-inline {
      display: flex;
      gap: 8px;
    }
    .field-inline .field-group { flex: 1; }

    .radio-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .radio-row label {
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #1d4ed8, #4f46e5);
      color: #e5e7eb;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }
    button.secondary {
      background: #111827;
      color: #e5e7eb;
      box-shadow: none;
      border: 1px solid #1f2937;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
    }

    #preview-container {
      width: 100%;
      height: 320px;
      border-radius: 10px;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.18) 0, transparent 45%),
        radial-gradient(circle at bottom, rgba(94, 234, 212, 0.15) 0, transparent 50%),
        #020617;
      position: relative;
      overflow: hidden;
      border: 1px solid #111827;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    #preview-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #preview-info {
      position: absolute;
      left: 8px;
      bottom: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      color: #e5e7eb;
      font-size: 10px;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      pointer-events: none;
    }
    #preview-info span.key {
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(31, 41, 55, 0.9);
      font-family: "SF Mono", Menlo, monospace;
      font-size: 9px;
    }

    #svg-output {
      width: 100%;
      min-height: 170px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px;
      font-family: "SF Mono", Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 11px;
      resize: vertical;
      background: #020617;
      color: #e5e7eb;
      white-space: pre;
      overflow: auto;
    }

    footer {
      font-size: 10px;
      color: #6b7280;
      text-align: center;
      padding: 6px 4px 10px;
      border-top: 1px solid #020617;
    }
  </style>
</head>
<body>
<header>
  <div>
    <span class="title-main">Box Maker</span>
    <span class="title-sub">深色主題．指接卡榫．伸縮補償．Canvas 3D</span>
  </div>
  <span class="ver">v0.31 – 不依賴外部庫，預覽一定有畫面</span>
</header>

<main>
  <!-- 左側參數 -->
  <section class="panel left-panel">
    <div class="section-title">
      <span>盒子尺寸設定</span>
    </div>
    <div class="section-sub">
      單位 mm，支援內部 / 外部尺寸切換與板厚補正。
    </div>

    <div class="field-group">
      <label>尺寸模式</label>
      <div class="radio-row">
        <label>
          <input type="radio" name="size-mode" value="inner" checked />
          內部尺寸（淨空）
        </label>
        <label>
          <input type="radio" name="size-mode" value="outer" />
          外部尺寸（成品外觀）
        </label>
      </div>
    </div>

    <div class="field-inline">
      <div class="field-group">
        <label for="box-width">寬（X, 左右）</label>
        <input id="box-width" type="number" min="10" value="120" step="1" />
      </div>
      <div class="field-group">
        <label for="box-depth">深（Z, 前後）</label>
        <input id="box-depth" type="number" min="10" value="80" step="1" />
      </div>
    </div>

    <div class="field-group">
      <label for="box-height">高（Y）</label>
      <input id="box-height" type="number" min="10" value="60" step="1" />
    </div>

    <div class="field-group">
      <label for="thickness">板厚（mm）</label>
      <input id="thickness" type="number" min="1" value="3" step="0.1" />
    </div>

    <div class="field-group">
      <label for="tab-count">每邊指接卡榫數量</label>
      <input id="tab-count" type="number" min="2" value="4" step="1" />
      <div class="section-sub" style="margin-top:3px;">
        底板四邊 + 四側板所有邊都使用此指接數量。
      </div>
    </div>

    <div class="field-group">
      <label for="comp">榫接伸縮補償（mm）</label>
      <input id="comp" type="number" min="0" value="0.04" step="0.01" />
      <div class="section-sub" style="margin-top:3px;">
        公榫深度 = 板厚 − 補償；母榫深度 = 板厚 + 補償。
      </div>
    </div>

    <div class="field-group">
      <label for="lid-type">上蓋形式</label>
      <select id="lid-type">
        <option value="none">無上蓋</option>
        <option value="flat">獨立平蓋（同底板）</option>
        <option value="hinged">掀蓋（與後板連接）</option>
        <option value="inset">壓入式內蓋（縮小 2×板厚）</option>
      </select>
    </div>

    <button id="update-btn">更新預覽 / 重新產生 SVG</button>
  </section>

  <!-- 右側：3D + SVG -->
  <section class="panel right-panel">
    <div>
      <div class="section-title">
        <span>3D 預覽（Canvas 線框）</span>
        <span style="font-size:10px;color:#6b7280;">滑鼠：左鍵旋轉／滾輪縮放</span>
      </div>
      <div id="preview-container">
        <canvas id="preview-canvas"></canvas>
        <div id="preview-info">
          <span class="key">LMB</span> 旋轉
          <span class="key">Wheel</span> 縮放
        </div>
      </div>
    </div>

    <div>
      <div class="section-title" style="margin-top:8px;">
        <span>SVG 展開圖</span>
        <button id="download-btn" class="secondary">下載 SVG 展開圖</button>
      </div>
      <div class="section-sub">
        單位 mm。底板與四側板所有邊為公母指接榫，上蓋依選項不同。
      </div>
      <textarea id="svg-output" readonly></textarea>
    </div>
  </section>
</main>

<footer>
  v0.31：預覽改用 Canvas 3D 線框，不依賴外部庫；指接邊＋伸縮補償皆保留。
</footer>
<script>
  // --- DOM 取得 ---
  const inputWidth = document.getElementById("box-width");
  const inputDepth = document.getElementById("box-depth");
  const inputHeight = document.getElementById("box-height");
  const inputThickness = document.getElementById("thickness");
  const inputTabCount = document.getElementById("tab-count");
  const inputComp = document.getElementById("comp");
  const lidTypeSelect = document.getElementById("lid-type");
  const svgOutput = document.getElementById("svg-output");
  const btnUpdate = document.getElementById("update-btn");
  const btnDownload = document.getElementById("download-btn");
  const previewContainer = document.getElementById("preview-container");
  const canvas = document.getElementById("preview-canvas");
  const ctx = canvas.getContext("2d");
  const sizeModeRadios = document.querySelectorAll('input[name="size-mode"]');

  // --- Canvas 3D 狀態 ---
  let boxOuterW = 120;
  let boxOuterD = 80;
  let boxOuterH = 60;
  let yaw = 0.7;
  let pitch = 0.5;
  let zoom = 1.0;
  let isDragging = false;
  let lastX = 0;
  let lastY = 0;

  function getSizeMode() {
    let mode = "inner";
    sizeModeRadios.forEach(r => { if (r.checked) mode = r.value; });
    return mode;
  }

  // --- Canvas 尺寸與繪製 ---
  function resizeCanvas() {
    const rect = previewContainer.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    drawBox();
  }

  window.addEventListener("resize", resizeCanvas);

  // 鼠標操作
  canvas.addEventListener("mousedown", (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  window.addEventListener("mouseup", () => { isDragging = false; });
  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    yaw += dx * 0.01;
    pitch += dy * 0.01;
    const maxPitch = Math.PI / 2 - 0.1;
    if (pitch > maxPitch) pitch = maxPitch;
    if (pitch < -maxPitch) pitch = -maxPitch;
    drawBox();
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY || e.wheelDelta;
    const factor = delta > 0 ? 0.9 : 1.1;
    zoom *= factor;
    if (zoom < 0.3) zoom = 0.3;
    if (zoom > 3.0) zoom = 3.0;
    drawBox();
  }, { passive: false });

  function drawBox() {
    const w = boxOuterW;
    const d = boxOuterD;
    const h = boxOuterH;
    const cw = canvas.width;
    const ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);

    if (cw <= 0 || ch <= 0) return;

    const hx = w / 2;
    const hy = h / 2;
    const hz = d / 2;

    const vertices = [
      [-hx, -hy, -hz],
      [ hx, -hy, -hz],
      [-hx, -hy,  hz],
      [ hx, -hy,  hz],
      [-hx,  hy, -hz],
      [ hx,  hy, -hz],
      [-hx,  hy,  hz],
      [ hx,  hy,  hz],
    ];

    const edges = [
      [0,1],[1,3],[3,2],[2,0],
      [4,5],[5,7],[7,6],[6,4],
      [0,4],[1,5],[2,6],[3,7]
    ];

    const maxDim = Math.max(w, h, d);
    const baseScale = Math.min(cw, ch) * 0.4 / maxDim;
    const s = baseScale * zoom;

    const cx = cw / 2;
    const cy = ch / 2 + 20;

    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    const cosX = Math.cos(pitch), sinX = Math.sin(pitch);

    const projected = vertices.map(v => {
      let x = v[0], y = v[1], z = v[2];

      let x1 = x * cosY - z * sinY;
      let z1 = x * sinY + z * cosY;

      let y1 = y * cosX - z1 * sinX;
      let z2 = y * sinX + z1 * cosX;

      const px = cx + x1 * s;
      const py = cy - y1 * s;
      return { x: px, y: py, z: z2 };
    });

    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "#e5e7eb";
    ctx.beginPath();
    edges.forEach(([i, j]) => {
      const a = projected[i];
      const b = projected[j];
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    });
    ctx.stroke();

    ctx.fillStyle = "rgba(15,23,42,0.7)";
    const shadowW = w * s * 1.1;
    const shadowD = d * s * 1.1;
    ctx.beginPath();
    ctx.ellipse(cx, cy + hy * s + 6, shadowW / 2, shadowD / 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- 路徑簡化：刪掉重複點與共線點 ---
  function simplifyPoints(pts) {
    const eps = 1e-4;
    if (pts.length <= 2) return pts.slice();
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (out.length === 0) {
        out.push({ x: p.x, y: p.y });
        continue;
      }
      const last = out[out.length - 1];
      const dx = p.x - last.x;
      const dy = p.y - last.y;
      if (Math.hypot(dx, dy) < eps) {
        continue; // 重複點
      }
      if (out.length >= 2) {
        const a = out[out.length - 2];
        const b = last;
        const c = p;
        const abx = b.x - a.x;
        const aby = b.y - a.y;
        const bcx = c.x - b.x;
        const bcy = c.y - b.y;
        const cross = abx * bcy - aby * bcx;
        const dot = abx * bcx + aby * bcy;
        if (Math.abs(cross) < eps && dot >= 0) {
          // 共線且方向一致：把中間點 b 合併到 c
          out[out.length - 1] = { x: c.x, y: c.y };
          continue;
        }
      }
      out.push({ x: p.x, y: p.y });
    }
    return out;
  }

  // --- SVG 生成 ---

  function generateBoxSVG(innerW, innerD, innerH, t, tabCount, comp, lidType, mode) {
    const bottomW = innerW;
    const bottomD = innerD;
    const frontW  = innerW;
    const frontH  = innerH;
    const backW   = innerW;
    const backH   = innerH;
    const leftD   = innerD;
    const leftH   = innerH;
    const rightD  = innerD;
    const rightH  = innerH;

    const margin = 10;

    const bottomX = margin + leftD + margin + bottomW;
    const bottomY = margin + backH + margin;

    const baseWidth  = bottomX + bottomW + margin + rightD + margin;
    const baseHeight = bottomY + bottomD + margin + frontH + margin;

    const lidExtraFlat   = (lidType === "flat" || lidType === "inset") ? (bottomD + 2 * margin) : 0;
    const lidExtraHinged = (lidType === "hinged") ? (bottomD + margin) : 0;

    const svgWidth  = baseWidth;
    const svgHeight = baseHeight + lidExtraFlat + lidExtraHinged;

    const rects = [];

    rects.push({
      kind: "bottom",
      label: "底板",
      w: bottomW,
      h: bottomD,
      offset: { x: bottomX, y: bottomY },
      joints: {
        top:    { enabled: true, male: true  },
        right:  { enabled: true, male: false },
        bottom: { enabled: true, male: true  },
        left:   { enabled: true, male: false }
      }
    });

    rects.push({
      kind: "front",
      label: "前板",
      w: frontW,
      h: frontH,
      offset: { x: bottomX, y: bottomY + bottomD },
      joints: {
        top:    { enabled: false, male: false },
        right:  { enabled: true,  male: true  },
        bottom: { enabled: true,  male: false },
        left:   { enabled: true,  male: true  }
      }
    });

    rects.push({
      kind: "back",
      label: "後板",
      w: backW,
      h: backH,
      offset: { x: bottomX, y: bottomY - backH },
      joints: {
        top:    { enabled: false, male: false },
        right:  { enabled: true,  male: true  },
        bottom: { enabled: true,  male: false },
        left:   { enabled: true,  male: true  }
      }
    });

    rects.push({
      kind: "left",
      label: "左板",
      w: leftD,
      h: leftH,
      offset: { x: bottomX - leftD - margin, y: bottomY },
      joints: {
        top:    { enabled: false, male: false },
        right:  { enabled: true,  male: false },
        bottom: { enabled: true,  male: false },
        left:   { enabled: true,  male: false }
      }
    });

    rects.push({
      kind: "right",
      label: "右板",
      w: rightD,
      h: rightH,
      offset: { x: bottomX + bottomW + margin, y: bottomY },
      joints: {
        top:    { enabled: false, male: false },
        right:  { enabled: true,  male: false },
        bottom: { enabled: true,  male: false },
        left:   { enabled: true,  male: false }
      }
    });

    if (lidType === "flat" || lidType === "inset") {
      const insetShrink = lidType === "inset" ? 2 * t : 0;
      const lidW = bottomW - insetShrink;
      const lidD = bottomD - insetShrink;
      const lidX = bottomX + (bottomW - lidW) / 2;
      const lidY = bottomY + bottomD + margin + frontH + margin;
      rects.push({
        kind: "lid",
        label: lidType === "inset" ? "壓入式內蓋" : "獨立平蓋",
        w: lidW,
        h: lidD,
        offset: { x: lidX, y: lidY },
        joints: {
          top:    { enabled: false, male: false },
          right:  { enabled: false, male: false },
          bottom: { enabled: false, male: false },
          left:   { enabled: false, male: false }
        }
      });
    }

    if (lidType === "hinged") {
      const lidW = backW;
      const lidD = bottomD;
      const lidX = bottomX;
      const lidY = bottomY - backH - margin - lidD;
      rects.push({
        kind: "hinged-lid",
        label: "掀蓋",
        w: lidW,
        h: lidD,
        offset: { x: lidX, y: lidY },
        joints: {
          top:    { enabled: false, male: false },
          right:  { enabled: false, male: false },
          bottom: { enabled: false, male: false },
          left:   { enabled: false, male: false }
        }
      });
    }

    const strokeWidth = 0.1;
    let svgParts = [];
    svgParts.push(`<?xml version="1.0" encoding="UTF-8" standalone="no"?>`);
    svgParts.push(
      `<svg xmlns="http://www.w3.org/2000/svg" width="${svgWidth}mm" height="${svgHeight}mm" viewBox="0 0 ${svgWidth} ${svgHeight}">`
    );
    svgParts.push(`  <title>Box Layout v0.32</title>`);
    svgParts.push(
      `  <desc>內部約：${innerW.toFixed(2)}×${innerD.toFixed(2)}×${innerH.toFixed(
        2
      )} mm；板厚：${t.toFixed(
        2
      )} mm；指接數：${tabCount}；補償：${comp.toFixed(
        3
      )} mm；模式：${mode === "inner" ? "內部" : "外部"}；上蓋：${lidType}。</desc>`
    );

    svgParts.push(`  <g fill="none" stroke="#000" stroke-width="${strokeWidth}">`);

    rects.forEach((r) => {
      const d = buildFingerJointPath(r.w, r.h, t, tabCount, comp, r.joints, r.offset);
      svgParts.push(`    <path d="${d}" />`);
    });

    svgParts.push("  </g>");

    svgParts.push(`  <g fill="#000000" font-size="4">`);
    rects.forEach((r) => {
      const cx = r.offset.x + r.w / 2;
      const cy = r.offset.y + r.h / 2;
      svgParts.push(
        `    <text x="${cx.toFixed(3)}" y="${cy.toFixed(
          3
        )}" text-anchor="middle" dominant-baseline="middle">${r.label}</text>`
      );
    });
    svgParts.push("  </g>");

    svgParts.push("</svg>");

    return svgParts.join("\n");
  }

  function buildFingerJointPath(w, h, t, tabCount, comp, joints, offset) {
  const pts = [];
  pts.push({ x: 0, y: 0 });

  addTopEdge(pts, w, t, comp, tabCount, joints.top);
  addRightEdge(pts, w, h, t, comp, tabCount, joints.right);
  addBottomEdge(pts, w, h, t, comp, tabCount, joints.bottom);
  addLeftEdge(pts, w, h, t, comp, tabCount, joints.left);

  let d = "";
  pts.forEach((p, idx) => {
    const x = p.x + offset.x;
    const y = p.y + offset.y;
    if (idx === 0) d += `M ${x.toFixed(3)} ${y.toFixed(3)} `;
    else d += `L ${x.toFixed(3)} ${y.toFixed(3)} `;
  });
  d += "Z";
  return d;
}



  function addTopEdge(pts, w, t, comp, tabCount, jointInfo) {
  const has = jointInfo && jointInfo.enabled;
  const male = jointInfo && jointInfo.male;
  if (!has) {
    pts.push({ x: w, y: 0 });
    return;
  }
  const tOut = t - comp;
  const tIn  = t + comp;
  const segments = tabCount * 2;
  const segLen = w / segments;

  for (let i = 0; i < segments; i++) {
    const xStart = i * segLen;
    const xEnd   = (i + 1) * segLen;

    // 角落不做卡榫：i=0、i=segments-1 一律視為平直
    const isFeature = (i % 2 === 1) && i > 0 && i < segments - 1;

    if (!isFeature) {
      pts.push({ x: xEnd, y: 0 });
    } else {
      if (male) {
        pts.push({ x: xStart, y: -tOut });
        pts.push({ x: xEnd,   y: -tOut });
        pts.push({ x: xEnd,   y: 0 });
      } else {
        pts.push({ x: xStart, y:  tIn });
        pts.push({ x: xEnd,   y:  tIn });
        pts.push({ x: xEnd,   y: 0 });
      }
    }
  }
}


  function addRightEdge(pts, w, h, t, comp, tabCount, jointInfo) {
  const has = jointInfo && jointInfo.enabled;
  const male = jointInfo && jointInfo.male;
  const start = pts[pts.length - 1];
  if (Math.abs(start.x - w) > 1e-6 || Math.abs(start.y - 0) > 1e-6) {
    pts.push({ x: w, y: 0 });
  }
  if (!has) {
    pts.push({ x: w, y: h });
    return;
  }
  const tOut = t - comp;
  const tIn  = t + comp;
  const segments = tabCount * 2;
  const segLen = h / segments;

  for (let i = 0; i < segments; i++) {
    const yStart = i * segLen;
    const yEnd   = (i + 1) * segLen;
    const isFeature = (i % 2 === 1) && i > 0 && i < segments - 1;

    if (!isFeature) {
      pts.push({ x: w, y: yEnd });
    } else {
      if (male) {
        pts.push({ x: w + tOut, y: yStart });
        pts.push({ x: w + tOut, y: yEnd });
        pts.push({ x: w,        y: yEnd });
      } else {
        pts.push({ x: w - tIn,  y: yStart });
        pts.push({ x: w - tIn,  y: yEnd });
        pts.push({ x: w,        y: yEnd });
      }
    }
  }
}


  function addBottomEdge(pts, w, h, t, comp, tabCount, jointInfo) {
  const has = jointInfo && jointInfo.enabled;
  const male = jointInfo && jointInfo.male;
  const start = pts[pts.length - 1];
  if (Math.abs(start.x - w) > 1e-6 || Math.abs(start.y - h) > 1e-6) {
    pts.push({ x: w, y: h });
  }
  if (!has) {
    pts.push({ x: 0, y: h });
    return;
  }
  const tOut = t - comp;
  const tIn  = t + comp;
  const segments = tabCount * 2;
  const segLen = w / segments;

  for (let i = 0; i < segments; i++) {
    const xStart = w - i * segLen;
    const xEnd   = w - (i + 1) * segLen;
    const isFeature = (i % 2 === 1) && i > 0 && i < segments - 1;

    if (!isFeature) {
      pts.push({ x: xEnd, y: h });
    } else {
      if (male) {
        pts.push({ x: xStart, y: h + tOut });
        pts.push({ x: xEnd,   y: h + tOut });
        pts.push({ x: xEnd,   y: h });
      } else {
        pts.push({ x: xStart, y: h - tIn });
        pts.push({ x: xEnd,   y: h - tIn });
        pts.push({ x: xEnd,   y: h });
      }
    }
  }
}


  function addLeftEdge(pts, w, h, t, comp, tabCount, jointInfo) {
  const has = jointInfo && jointInfo.enabled;
  const male = jointInfo && jointInfo.male;
  const start = pts[pts.length - 1];
  if (Math.abs(start.x - 0) > 1e-6 || Math.abs(start.y - h) > 1e-6) {
    pts.push({ x: 0, y: h });
  }
  if (!has) {
    pts.push({ x: 0, y: 0 });
    return;
  }
  const tOut = t - comp;
  const tIn  = t + comp;
  const segments = tabCount * 2;
  const segLen = h / segments;

  for (let i = 0; i < segments; i++) {
    const yStart = h - i * segLen;
    const yEnd   = h - (i + 1) * segLen;
    const isFeature = (i % 2 === 1) && i > 0 && i < segments - 1;

    if (!isFeature) {
      pts.push({ x: 0, y: yEnd });
    } else {
      if (male) {
        pts.push({ x: -tOut, y: yStart });
        pts.push({ x: -tOut, y: yEnd });
        pts.push({ x: 0,     y: yEnd });
      } else {
        pts.push({ x:  tIn,  y: yStart });
        pts.push({ x:  tIn,  y: yEnd });
        pts.push({ x: 0,     y: yEnd });
      }
    }
  }
}


  function updateAll() {
    let w = Math.max(10, Number(inputWidth.value) || 0);
    let d = Math.max(10, Number(inputDepth.value) || 0);
    let h = Math.max(10, Number(inputHeight.value) || 0);
    let t = Math.max(0.5, Number(inputThickness.value) || 3);
    let tabCount = Math.max(2, Math.floor(Number(inputTabCount.value) || 4));
    let comp = Number(inputComp.value);
    if (isNaN(comp) || comp < 0) comp = 0.04;
    if (comp > t * 0.9) comp = t * 0.9;

    const lidType = lidTypeSelect.value;
    const mode = getSizeMode();

    inputWidth.value = w;
    inputDepth.value = d;
    inputHeight.value = h;
    inputThickness.value = t.toFixed(2);
    inputTabCount.value = tabCount;
    inputComp.value = comp.toFixed(3);

    let innerW, innerD, innerH;
    if (mode === "inner") {
      innerW = w;
      innerD = d;
      innerH = h;
    } else {
      innerW = Math.max(1, w - 2 * t);
      innerD = Math.max(1, d - 2 * t);
      innerH = Math.max(1, h - t);
    }

    boxOuterW = innerW + 2 * t;
    boxOuterD = innerD + 2 * t;
    boxOuterH = innerH + t;
    drawBox();

    const svgText = generateBoxSVG(innerW, innerD, innerH, t, tabCount, comp, lidType, mode);
    svgOutput.value = svgText;
  }

  btnUpdate.addEventListener("click", updateAll);

  btnDownload.addEventListener("click", () => {
    const svgText = svgOutput.value;
    if (!svgText.trim()) return;
    const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "box-layout-v0.32.svg";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // 初始化
  resizeCanvas();
  updateAll();
</script>
