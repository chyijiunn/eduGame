
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>3D 線稿森林 v0.11</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang TC","Microsoft JhengHei",sans-serif;
      touch-action: none;
    }
    #container {
      position: fixed;
      inset: 0;
    }
    #info {
      position: fixed;
      top: 8px;
      left: 8px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.5);
      font-size: 12px;
      border-radius: 4px;
      pointer-events: none;
    }
    #minimap {
      position: fixed;
      left: 8px;
      bottom: 8px;
      width: 140px;
      height: 140px;
      border-radius: 8px;
      background: rgba(10,10,20,0.9);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    #minimap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #touchHint {
      position: fixed;
      right: 8px;
      bottom: 8px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.4);
      font-size: 11px;
      border-radius: 4px;
      max-width: 40vw;
    }
    @media (min-width: 900px) {
      #touchHint { display: none; }
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="info">
    3D 線稿森林 v0.11<br/>
    W：前進　S：後退　A/D：側移　滑鼠拖曳：視角　滾輪 / 兩指：縮放
  </div>
  <div id="minimap"><canvas></canvas></div>
  <div id="touchHint">單指拖曳旋轉視角｜畫面左側上下滑動可前進/後退｜雙指縮放視角</div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
  (() => {
    const container = document.getElementById('container');
    const miniWrap = document.getElementById('minimap');
    const miniCanvas = miniWrap.querySelector('canvas');
    const miniCtx = miniCanvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;

    // THREE 基本設定
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(width, height);
    renderer.setClearColor(0x000000, 1);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1500);
    camera.position.set(0, 5, 20);

    // 用一個 holder 來做視角晃動 + 位置
    const cameraHolder = new THREE.Object3D();
    cameraHolder.position.set(0, 3, 0);
    cameraHolder.add(camera);
    scene.add(cameraHolder);

    // 地面線框
    const gridSize = 400;
    const gridDivisions = 40;
    const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x333333, 0x111111);
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.7;
    scene.add(gridHelper);

    // 簡單霧化讓遠方淡出
    scene.fog = new THREE.FogExp2(0x000000, 0.002);

    // 樹的生成（多種樹型）
    const trees = [];
    const treePositions = [];
    const treeCount = 260;
    const forestRadius = 180;

    // 共用幾種幾何
    const trunkThinGeo   = new THREE.CylinderGeometry(0.25, 0.35, 5, 8);
    const trunkThickGeo  = new THREE.CylinderGeometry(0.5, 0.7, 6, 8);
    const trunkTallGeo   = new THREE.CylinderGeometry(0.3, 0.4, 8, 6);
    const crownConeGeo   = new THREE.ConeGeometry(2, 5, 10);
    const crownWideConeGeo = new THREE.ConeGeometry(3, 4, 12);
    const crownSphereGeo = new THREE.SphereGeometry(2.2, 10, 8);
    const crownSmallSphereGeo = new THREE.SphereGeometry(1.4, 10, 8);
    const crownBoxGeo    = new THREE.BoxGeometry(3, 3, 3);
    const bushGeo        = new THREE.SphereGeometry(1.3, 8, 6);

    function createWireMaterial(colorHex) {
      return new THREE.MeshBasicMaterial({
        color: colorHex,
        wireframe: true
      });
    }

    function createTreeVariant(typeIndex) {
      const group = new THREE.Group();
      const trunkMats = [];
      const crownMats = [];

      const baseY = 0;

      switch (typeIndex) {
        // 0 - 單層針葉樹
        case 0: {
          const trunkMat = createWireMaterial(0x227744);
          const crownMat = createWireMaterial(0x55ff99);
          const trunk = new THREE.Mesh(trunkThinGeo, trunkMat);
          trunk.position.y = baseY + 3;
          trunk.scale.y = 1 + Math.random() * 0.8;

          const crown = new THREE.Mesh(crownConeGeo, crownMat);
          crown.position.y = trunk.position.y + 3.5;
          crown.scale.y = 0.9 + Math.random() * 0.6;

          group.add(trunk, crown);
          trunkMats.push(trunkMat);
          crownMats.push(crownMat);
        } break;

        // 1 - 多層針葉樹（聖誕樹型）
        case 1: {
          const trunkMat = createWireMaterial(0x227744);
          const crownMat = createWireMaterial(0x66ffcc);
          const trunk = new THREE.Mesh(trunkTallGeo, trunkMat);
          trunk.position.y = baseY + 4;
          trunk.scale.y = 1.2 + Math.random() * 0.8;
          group.add(trunk);
          trunkMats.push(trunkMat);

          const levels = 3 + Math.floor(Math.random() * 2);
          for (let i = 0; i < levels; i++) {
            const crown = new THREE.Mesh(crownWideConeGeo, crownMat);
            crown.position.y = trunk.position.y + 1.5 + i * 1.8;
            const scale = 1.2 - i * 0.2;
            crown.scale.set(scale, scale, scale);
            group.add(crown);
            crownMats.push(crownMat);
          }
        } break;

        // 2 - 圓冠闊葉樹
        case 2: {
          const trunkMat = createWireMaterial(0x885533);
          const crownMat = createWireMaterial(0x88ff88);
          const trunk = new THREE.Mesh(trunkThickGeo, trunkMat);
          trunk.position.y = baseY + 3;
          trunk.scale.y = 1 + Math.random() * 0.6;
          group.add(trunk);
          trunkMats.push(trunkMat);

          const crown = new THREE.Mesh(crownSphereGeo, crownMat);
          crown.position.y = trunk.position.y + 3.5;
          crown.scale.set(1 + Math.random() * 0.5, 1 + Math.random() * 0.5, 1 + Math.random() * 0.5);
          group.add(crown);
          crownMats.push(crownMat);

          // 側邊多幾個小球當側枝
          for (let i = 0; i < 2; i++) {
            const side = new THREE.Mesh(crownSmallSphereGeo, crownMat);
            const angle = Math.random() * Math.PI * 2;
            const r = 2 + Math.random() * 1;
            side.position.set(
              crown.position.x + Math.cos(angle) * r,
              crown.position.y - 0.4 + (Math.random() - 0.5),
              crown.position.z + Math.sin(angle) * r
            );
            group.add(side);
            crownMats.push(crownMat);
          }
        } break;

        // 3 - 方塊（像素）樹
        case 3: {
          const trunkMat = createWireMaterial(0x996633);
          const crownMat = createWireMaterial(0x66ff88);
          const trunk = new THREE.Mesh(trunkThinGeo, trunkMat);
          trunk.position.y = baseY + 2.8;
          trunk.scale.y = 0.9 + Math.random() * 0.5;
          group.add(trunk);
          trunkMats.push(trunkMat);

          const crown = new THREE.Mesh(crownBoxGeo, crownMat);
          crown.position.y = trunk.position.y + 3;
          crown.scale.set(1.3 + Math.random() * 0.6, 1.2 + Math.random() * 0.4, 1.3 + Math.random() * 0.6);
          group.add(crown);
          crownMats.push(crownMat);
        } break;

        // 4 - 矮灌木 / 叢林樹
        default: {
          const trunkMat = createWireMaterial(0x335533);
          const crownMat = createWireMaterial(0x77ffbb);
          const trunk = new THREE.Mesh(trunkThinGeo, trunkMat);
          trunk.position.y = baseY + 1.8;
          trunk.scale.y = 0.6 + Math.random() * 0.4;
          group.add(trunk);
          trunkMats.push(trunkMat);

          const bushCount = 3 + Math.floor(Math.random() * 3);
          for (let i = 0; i < bushCount; i++) {
            const bush = new THREE.Mesh(bushGeo, crownMat);
            const angle = (i / bushCount) * Math.PI * 2 + Math.random() * 0.4;
            const r = 1.2 + Math.random() * 0.8;
            bush.position.set(
              Math.cos(angle) * r,
              trunk.position.y + 1 + Math.random() * 0.6,
              Math.sin(angle) * r
            );
            group.add(bush);
            crownMats.push(crownMat);
          }
        } break;
      }

      return { group, trunkMats, crownMats };
    }

    for (let i = 0; i < treeCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = (Math.random() * 0.7 + 0.3) * forestRadius;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      const typeIndex = Math.floor(Math.random() * 5);
      const tree = createTreeVariant(typeIndex);
      tree.group.position.set(x, 0, z);
      scene.add(tree.group);

      trees.push(tree);
      treePositions.push({ x, z });
    }

    // 河流：用多條矩形片段 + 迷你地圖路徑
    const riverSegments = [];
    const riverPoints = [];

    function addRiverStrip(x1, z1, x2, z2, widthStrip) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.sqrt(dx * dx + dz * dz) || 1;
      const angle = Math.atan2(dx, dz);
      const geo = new THREE.PlaneGeometry(widthStrip, length, 2, 2);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x3399ff,
        wireframe: true,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = angle;
      mesh.position.set((x1 + x2) / 2, 0.02, (z1 + z2) / 2);
      scene.add(mesh);
      riverSegments.push({ x1, z1, x2, z2 });
    }

    // 簡單彎曲河流
    const riverPath = [
      { x: -120, z: -40 },
      { x: -60, z: -20 },
      { x:  10, z:  10 },
      { x:  70, z:  40 },
      { x: 130, z:  80 }
    ];
    const riverWidth = 14;

    for (let i = 0; i < riverPath.length - 1; i++) {
      const p1 = riverPath[i];
      const p2 = riverPath[i + 1];
      addRiverStrip(p1.x, p1.z, p2.x, p2.z, riverWidth);
      riverPoints.push(p1);
    }
    riverPoints.push(riverPath[riverPath.length - 1]);

    // 鍵盤控制
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup',   (e) => { keys[e.key.toLowerCase()] = false; });

    // 滑鼠視角拖曳
    let isPointerDown = false;
    let lastX = 0, lastY = 0;
    let yaw = 0;
    let pitch = 0;

    camera.lookAt(new THREE.Vector3(0, 2, -10));
    yaw = 0;
    pitch = 0;

    function updateCameraRotation() {
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }
    updateCameraRotation();

    function pointerDown(e) {
      isPointerDown = true;
      lastX = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX);
      lastY = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY);
    }
    function pointerMove(e) {
      if (!isPointerDown || (e.touches && e.touches.length > 1)) return;
      const x = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX);
      const y = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY);
      const dx = x - lastX;
      const dy = y - lastY;
      lastX = x;
      lastY = y;
      const sensitivity = 0.003;
      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;
      const limit = Math.PI / 2 - 0.05;
      if (pitch > limit) pitch = limit;
      if (pitch < -limit) pitch = -limit;
      updateCameraRotation();
    }
    function pointerUp() { isPointerDown = false; }

    renderer.domElement.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);

    // 觸控控制
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        pointerDown(e);
      }
      if (e.touches.length === 2) {
        pinchStart(e);
      }
    }, { passive: false });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        pointerMove(e);
      } else if (e.touches.length === 2) {
        pinchMove(e);
      }
      e.preventDefault();
    }, { passive: false });

    renderer.domElement.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        pinchActive = false;
      }
      if (e.touches.length === 0) {
        pointerUp();
      }
    });

    // 視角縮放：滑鼠滾輪 / 兩指
    function onWheel(e) {
      e.preventDefault();
      const delta = e.deltaY || e.wheelDelta;
      camera.fov += delta * 0.02;
      if (camera.fov < 30) camera.fov = 30;
      if (camera.fov > 90) camera.fov = 90;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('wheel', onWheel, { passive: false });

    let pinchActive = false;
    let pinchStartDist = 0;
    let pinchStartFov = camera.fov;

    function distanceTouches(t0, t1) {
      const dx = t0.clientX - t1.clientX;
      const dy = t0.clientY - t1.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function pinchStart(e) {
      pinchActive = true;
      pinchStartDist = distanceTouches(e.touches[0], e.touches[1]);
      pinchStartFov = camera.fov;
    }
    function pinchMove(e) {
      if (!pinchActive || e.touches.length < 2) return;
      const dist = distanceTouches(e.touches[0], e.touches[1]);
      const scale = dist / (pinchStartDist || dist);
      camera.fov = pinchStartFov / scale;
      if (camera.fov < 30) camera.fov = 30;
      if (camera.fov > 90) camera.fov = 90;
      camera.updateProjectionMatrix();
    }

    // 手機上簡單的「前進/後退」：靠近左邊 1/3 區域上下滑動
    let mobileForwardFactor = 0;
    renderer.domElement.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        const t = e.touches[0];
        if (t.clientX < window.innerWidth * 0.3) {
          const centerY = window.innerHeight * 0.5;
          const dy = centerY - t.clientY;
          mobileForwardFactor = dy / centerY; // -1~1
        } else {
          mobileForwardFactor = 0;
        }
      }
    }, { passive: false });
    renderer.domElement.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) mobileForwardFactor = 0;
    });

    // 視角晃動
    let bobPhase = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      const baseSpeed = 18;
      const forwardKey = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
      const strafeKey = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
      const forwardTotal = forwardKey + mobileForwardFactor;

      const sinY = Math.sin(yaw);
      const cosY = Math.cos(yaw);

      // 以視線方向為前進方向
      const forwardX = sinY;
      const forwardZ = -cosY;
      const rightX = cosY;
      const rightZ = sinY;

      let moveX = 0;
      let moveZ = 0;

      moveX += forwardX * forwardTotal * baseSpeed * dt;
      moveZ += forwardZ * forwardTotal * baseSpeed * dt;
      moveX += rightX * strafeKey * baseSpeed * dt;
      moveZ += rightZ * strafeKey * baseSpeed * dt;

      cameraHolder.position.x += moveX;
      cameraHolder.position.z += moveZ;
      cameraHolder.position.y = 3;

      const moving = Math.abs(moveX) + Math.abs(moveZ) > 0.001;
      if (moving) {
        bobPhase += dt * 7;
      } else {
        bobPhase *= 0.9;
      }

      const bobHeight = Math.sin(bobPhase * 2) * 0.2;
      const bobSide = Math.sin(bobPhase * 4) * 0.12;
      camera.position.set(bobSide, 2 + bobHeight, 0);

      // 根據距離設定樹的顏色
      const camPos = cameraHolder.position;
      for (const t of trees) {
        const gp = t.group.position;
        const dx = gp.x - camPos.x;
        const dz = gp.z - camPos.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const maxDist = 260;
        const k = Math.min(dist / maxDist, 1);
        const bright = 1 - k;
        const g = 0.3 + 0.7 * bright;
        const b = 0.2 + 0.5 * k;

        const trunkColor = new THREE.Color(0, g * 0.5, 0);
        const crownColor = new THREE.Color(0, g, b);

        for (const m of t.trunkMats) {
          m.color.copy(trunkColor);
        }
        for (const m of t.crownMats) {
          m.color.copy(crownColor);
        }
      }

      renderer.render(scene, camera);

      // 更新迷你地圖
      drawMinimap();
    }

    function drawMinimap() {
      const size = Math.min(miniWrap.clientWidth, miniWrap.clientHeight);
      if (miniCanvas.width !== size || miniCanvas.height !== size) {
        miniCanvas.width = size;
        miniCanvas.height = size;
      }
      const ctx = miniCtx;
      const w = miniCanvas.width;
      const h = miniCanvas.height;
      ctx.clearRect(0, 0, w, h);

      // 背景
      ctx.fillStyle = 'rgba(5,10,20,0.98)';
      ctx.fillRect(0, 0, w, h);

      // 邊框
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, 2, w-4, h-4);

      const cx = w * 0.5;
      const cy = h * 0.5;
      const worldScale = 0.6 / forestRadius;

      // 河流
      ctx.strokeStyle = 'rgba(80,160,255,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < riverPoints.length; i++) {
        const p = riverPoints[i];
        const sx = cx + p.x * worldScale * w;
        const sy = cy - p.z * worldScale * h;
        if (i === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();

      // 樹
      ctx.fillStyle = 'rgba(80,255,140,0.85)';
      const camPos = cameraHolder.position;
      for (const pos of treePositions) {
        const sx = cx + (pos.x) * worldScale * w;
        const sy = cy - (pos.z) * worldScale * h;
        const dx = pos.x - camPos.x;
        const dz = pos.z - camPos.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < forestRadius * 1.2) {
          const r = dist < 30 ? 2.2 : 1.4;
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 玩家位置 + 朝向（以視線方向為準）
      const px = cx + camPos.x * worldScale * w;
      const py = cy - camPos.z * worldScale * h;

      const len = 7;

      // 計算視線前方向量 -> 轉成平面角度
      const forwardX = Math.sin(yaw);
      const forwardZ = -Math.cos(yaw);
      const sxv = forwardX;
      const syv = -forwardZ;
      const angle = Math.atan2(sxv, -syv);

      ctx.fillStyle = 'rgba(255,90,90,0.95)';
      ctx.beginPath();
      const left = angle + Math.PI * 0.75;
      const right = angle - Math.PI * 0.75;
      ctx.moveTo(px + Math.sin(angle) * len, py - Math.cos(angle) * len);
      ctx.lineTo(px + Math.sin(left) * len * 0.6,  py - Math.cos(left) * len * 0.6);
      ctx.lineTo(px + Math.sin(right) * len * 0.6, py - Math.cos(right) * len * 0.6);
      ctx.closePath();
      ctx.fill();

      // 指北針（地圖上方為北）
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '10px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const compassRadius = 18;
      const compassCx = w - compassRadius - 8;
      const compassCy = compassRadius + 8;

      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(compassCx, compassCy, compassRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillText('N', compassCx, compassCy - compassRadius + 7);
      ctx.fillText('S', compassCx, compassCy + compassRadius - 7);
    }

    function onResize() {
      width = window.innerWidth;
      height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', onResize);

    animate();
  })();
  </script>
</body>
</html>
