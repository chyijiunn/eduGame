<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>genGrift 1.2 - 孟德爾育種實驗室</title>
    <style>
        :root { --bg: #050505; --accent: #00ffcc; --text: #eee; --panel: #111; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #top-hud { background: var(--panel); padding: 10px 25px; display: flex; justify-content: space-between; border-bottom: 2px solid #333; align-items: center; z-index: 10; }
        .biomass-val { color: #ffd700; font-size: 1.5em; font-weight: bold; }

        #stage { flex-grow: 1; position: relative; background: radial-gradient(circle, #151515 0%, #050505 100%); overflow: hidden; }
        #ui-bottom { height: 220px; background: var(--panel); border-top: 2px solid #333; display: flex; }
        
        .control-panel { width: 250px; padding: 15px; border-right: 1px solid #333; font-size: 11px; }
        .chart-panel { flex-grow: 1; padding: 10px; position: relative; display: flex; flex-direction: column; }
        
        /* 育種彈窗優化 */
        #breed-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                       width: 850px; background: #1a1a1a; border: 2px solid var(--accent); padding: 25px; z-index: 1000; box-shadow: 0 0 100px #000; }
        .genotype-btn { width: 60px; height: 35px; background: #000; color: #888; border: 1px solid #444; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        .genotype-btn.active { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,204,0.3); }

        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .tab-btn { background: #222; color: #777; border: none; padding: 5px 12px; cursor: pointer; font-size: 11px; margin-left: 5px; border-radius: 3px; }
        .tab-btn.active { background: var(--accent); color: #000; }
        
        #game-over { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); 
                     z-index: 2000; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

<div id="top-hud">
    <div>YEAR: <span id="y-val">0</span> | POP: <span id="p-val">0</span></div>
    <div id="status-msg" style="color:var(--accent); font-weight:bold;">環境穩定</div>
    <div class="biomass-val">ENERGY: <span id="b-val">5000</span></div>
</div>

<div id="stage">
    <canvas id="mainCanvas"></canvas>
    <div id="game-over">
        <h1 style="color:#ff3333; font-size: 4em; margin-bottom: 0;">族群滅絕</h1>
        <p style="font-size: 1.5em; color: #ffd700;">存活紀錄：<span id="final-year">0</span> 年</p>
        <button class="btn" onclick="location.reload()">重新啟動</button>
    </div>
</div>

<div id="ui-bottom">
    <div class="control-panel">
        <button class="btn" style="width:100%" onclick="openBreedModal()">人擇基因配對</button>
        <div style="color:#666; margin-top:12px; line-height:1.4;">
            <b style="color:#bbb">提示：</b><br>
            ● 點擊基因型按鈕切換(FF/Ff/ff)<br>
            ● 藍圈: 高速[S]限定<br>
            ● 紅圈: 體型[R]限定<br>
            ● 碰撞會觸發自主生殖
        </div>
    </div>
    <div class="chart-panel">
        <div style="display:flex; justify-content: flex-end; margin-bottom: 5px;">
            <button class="tab-btn active" onclick="setChart('pop')">人口</button>
            <button class="tab-btn" onclick="setChart('freq')">基因頻率(p)</button>
            <button class="tab-btn" onclick="setChart('pheno')">性狀表現%</button>
        </div>
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<div id="breed-modal">
    <h3 style="margin:0 0 20px 0; color:var(--accent); text-align:center;">孟德爾基因配對編輯器</h3>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="text-align:center;">
            <div style="color:#0cf; font-size:12px; margin-bottom:5px;">FATHER</div>
            <canvas id="male-pre" width="100" height="100" style="background:#000; border-radius:8px;"></canvas>
        </div>

        <div style="flex-grow:1; padding: 0 30px;">
            <div id="gene-selector-rows"></div>
        </div>

        <div style="text-align:center;">
            <div style="color:#f0a; font-size:12px; margin-bottom:5px;">MOTHER</div>
            <canvas id="female-pre" width="100" height="100" style="background:#000; border-radius:8px;"></canvas>
        </div>
    </div>
    <div style="margin-top:25px; text-align:center; border-top:1px solid #333; padding-top:20px;">
        <div style="color:#888; font-size:12px; margin-bottom:10px;">預計產生 40 隻遵守遺傳規律之代幣後代</div>
        <button class="btn" onclick="doMassBreed()">執行繁育 (消耗 1000 能量)</button>
        <button class="btn" style="background:#444; color:#ccc; margin-left:10px;" onclick="document.getElementById('breed-modal').style.display='none'">取消</button>
    </div>
</div>

<script>
/** 核心邏輯 **/
const GENES = {
    f: { name: '毛皮(F)', dom: 'F', rec: 'f', col: '#ff5555' },
    c: { name: '花紋(C)', dom: 'C', rec: 'c', col: '#55ff55' },
    s: { name: '速度(S)', dom: 'S', rec: 's', col: '#5555ff' },
    r: { name: '體型(R)', dom: 'R', rec: 'r', col: '#ffff55' }
};

let state = {
    year: 0, biomass: 5000, population: [], foods: [],
    history: [], chartMode: 'pop', isDead: false,
    // 預設基因型：FF, Ff, ff
    parentGeno: {
        male:   { f:['F','F'], c:['c','c'], s:['S','S'], r:['r','r'] },
        female: { f:['f','f'], c:['C','C'], s:['s','s'], r:['r','r'] }
    }
};

class Food {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * (window.innerHeight - 250);
        let r = Math.random();
        this.type = r > 0.9 ? 'R' : (r > 0.75 ? 'S' : 'N');
        this.vx = this.type === 'S' ? (Math.random()-0.5)*8 : 0;
        this.vy = this.type === 'S' ? (Math.random()-0.5)*8 : 0;
    }
    update(w, h) {
        this.x += this.vx; this.y += this.vy;
        if(this.x<0 || this.x>w) this.vx *= -1;
        if(this.y<0 || this.y>h) this.vy *= -1;
    }
    draw(ctx) {
        ctx.strokeStyle = this.type==='R'?'#ff4444':(this.type==='S'?'#00ccff':'#44ff44');
        ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI*2); ctx.stroke();
    }
}

class Creature {
    constructor(x, y, genes, gender) {
        this.x = x; this.y = y;
        this.genes = genes; 
        this.gender = gender || (Math.random() > 0.5 ? 'M' : 'F');
        this.age = 0; this.reproCooldown = 400;
        this.angle = Math.random() * Math.PI * 2;
        this.turnSpeed = (Math.random() - 0.5) * 0.1;
        
        this.hasFur = genes.f.includes('F');
        this.hasCamo = genes.c.includes('C');
        this.isFast = genes.s.includes('S');
        this.isBig = genes.r.includes('R');
        this.radius = this.isBig ? 18 : 9;
        this.speed = this.isFast ? 3.8 : 1.4;
    }

    update(w, h) {
        this.age++; if(this.reproCooldown > 0) this.reproCooldown--;
        this.angle += this.turnSpeed;
        if(Math.random()<0.02) this.turnSpeed = (Math.random()-0.5)*0.15;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        if(this.x<0 || this.x>w) this.angle = Math.PI - this.angle;
        if(this.y<0 || this.y>h) this.angle = -this.angle;

        let cost = 0.08 + (this.isBig?0.06:0) + (this.isFast?0.04:0);
        if(this.hasCamo) cost -= 0.05;
        state.biomass -= cost;

        state.foods.forEach((f, i) => {
            if(Math.hypot(this.x-f.x, this.y-f.y) < this.radius+6) {
                if(f.type==='N' || (f.type==='S'&&this.isFast) || (f.type==='R'&&this.isBig)) {
                    state.biomass += (f.type==='N'?25:100);
                    state.foods.splice(i, 1);
                }
            }
        });
    }

    draw(ctx, scale=1) {
        ctx.save(); ctx.translate(this.x, this.y);
        const s = scale, r = this.radius * s;
        ctx.strokeStyle = '#444'; ctx.lineWidth = 3*s;
        let legL = (this.isFast?18:6)*s;
        ctx.beginPath(); ctx.moveTo(-r/2,0); ctx.lineTo(-r/2, legL); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r/2,0); ctx.lineTo(r/2, legL); ctx.stroke();
        ctx.fillStyle = this.gender==='M'?'#1a3a5a':'#5a1a3a';
        ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
        if(this.hasFur){ ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth=2*s; for(let i=0;i<12;i++){ let a=i*Math.PI/6; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r); ctx.lineTo(Math.cos(a)*(r+10*s), Math.sin(a)*(r+10*s)); ctx.stroke(); }}
        if(this.hasCamo){ ctx.fillStyle = this.gender==='M'?'#0cf':'#f0a'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc((i-1)*r*0.4, 0, 3*s, 0, Math.PI*2); ctx.fill(); }}
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-r/3,-r/4,3*s,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(r/3,-r/4,3*s,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

/** 育種介面邏輯 **/
function openBreedModal() {
    const container = document.getElementById('gene-selector-rows');
    container.innerHTML = '';
    for (let k in GENES) {
        const g = GENES[k];
        const row = document.createElement('div');
        row.style = "display:flex; align-items:center; justify-content:space-between; margin:10px 0; background:#252525; padding:8px 15px; border-radius:6px;";
        row.innerHTML = `
            <div style="display:flex; gap:5px">
                ${['FF','Ff','ff'].map(type => `<button class="genotype-btn ${getGenoType('male',k)===type?'active':''}" onclick="setGeno('male','${k}','${type}')">${type.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}
            </div>
            <div style="color:var(--accent); font-weight:bold; width:80px; text-align:center">${g.name}</div>
            <div style="display:flex; gap:5px">
                ${['FF','Ff','ff'].map(type => `<button class="genotype-btn ${getGenoType('female',k)===type?'active':''}" onclick="setGeno('female','${k}','${type}')">${type.replace(/F/g,g.dom).replace(/f/g,g.rec)}</button>`).join('')}
            </div>
        `;
        container.appendChild(row);
    }
    updatePre();
    document.getElementById('breed-modal').style.display = 'block';
}

function getGenoType(parent, key) {
    let g = state.parentGeno[parent][key];
    if(g[0]===g[1]) return g[0]===key.toUpperCase() ? 'FF' : 'ff';
    return 'Ff';
}

function setGeno(parent, key, type) {
    let D = key.toUpperCase(), r = key.toLowerCase();
    if(type==='FF') state.parentGeno[parent][key] = [D, D];
    else if(type==='ff') state.parentGeno[parent][key] = [r, r];
    else state.parentGeno[parent][key] = [D, r];
    openBreedModal();
}

function updatePre() {
    ['male','female'].forEach(s => {
        const ctx = document.getElementById(s+'-pre').getContext('2d');
        ctx.clearRect(0,0,100,100);
        new Creature(50, 50, state.parentGeno[s], s==='male'?'M':'F').draw(ctx, 0.7);
    });
}

function doMassBreed() {
    if(state.biomass < 1000) return alert("能量不足");
    state.biomass -= 1000;
    for(let i=0; i<40; i++) {
        let childG = {};
        ['f','c','s','r'].forEach(k => {
            childG[k] = [state.parentGeno.male[k][Math.floor(Math.random()*2)], state.parentGeno.female[k][Math.floor(Math.random()*2)]];
        });
        state.population.push(new Creature(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.5, childG));
    }
    document.getElementById('breed-modal').style.display='none';
}

/** 數據與循環 **/
function handleReproduction() {
    for (let i=0; i<state.population.length; i++) {
        for (let j=i+1; j<state.population.length; j++) {
            let a = state.population[i], b = state.population[j];
            if (Math.hypot(a.x-b.x, a.y-b.y) < a.radius+b.radius && a.gender !== b.gender && a.reproCooldown===0 && b.reproCooldown===0) {
                if (state.biomass > 250) {
                    let childG = {};
                    ['f','c','s','r'].forEach(k => childG[k] = [a.genes[k][Math.floor(Math.random()*2)], b.genes[k][Math.floor(Math.random()*2)]]);
                    state.population.push(new Creature(a.x, a.y, childG));
                    a.reproCooldown = 600; b.reproCooldown = 600; state.biomass -= 120;
                }
            }
        }
    }
}

function recordHistory() {
    let snap = { pop: state.population.length };
    for(let k in GENES) {
        let total = state.population.length * 2 || 1;
        let domCount = 0;
        state.population.forEach(p => { if(p.genes[k][0]===GENES[k].dom) domCount++; if(p.genes[k][1]===GENES[k].dom) domCount++; });
        snap['freq_'+k] = domCount / total;
        let phenos = state.population.filter(p => p.genes[k].includes(GENES[k].dom)).length;
        snap['pheno_'+k] = phenos / (state.population.length || 1);
    }
    state.history.push(snap); if(state.history.length > 100) state.history.shift();
}

function drawChart() {
    const c = document.getElementById('chartCanvas'); const cx = c.getContext('2d');
    c.width = c.offsetWidth; c.height = 150; cx.clearRect(0,0,c.width,c.height);
    if(state.history.length < 2) return;
    if(state.chartMode === 'pop') {
        cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.beginPath();
        state.history.forEach((d, i) => { let x=(i/100)*c.width, y=c.height-(d.pop/400)*c.height; if(i===0) cx.moveTo(x,y); else cx.lineTo(x,y); });
        cx.stroke();
    } else {
        let prefix = state.chartMode === 'freq' ? 'freq_' : 'pheno_';
        for(let k in GENES) {
            cx.strokeStyle = GENES[k].col; cx.lineWidth = 2; cx.beginPath();
            state.history.forEach((d, i) => { let x=(i/100)*c.width, y=c.height-d[prefix+k]*c.height; if(i===0) cx.moveTo(x,y); else cx.lineTo(x,y); });
            cx.stroke();
        }
    }
}

function setChart(m) { state.chartMode = m; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); }

const mainCanvas = document.getElementById('mainCanvas');
const mainCtx = mainCanvas.getContext('2d');

function loop() {
    mainCanvas.width = window.innerWidth; mainCanvas.height = window.innerHeight - 220;
    if(state.isDead) return;
    if(state.foods.length < 50) state.foods.push(new Food());
    state.foods.forEach(f => { f.update(mainCanvas.width, mainCanvas.height); f.draw(mainCtx); });
    state.population.forEach((p, i) => { p.update(mainCanvas.width, mainCanvas.height); p.draw(mainCtx); if(p.age > 3500) state.population.splice(i, 1); });
    handleReproduction();
    if(Date.now() % 1000 < 20) { state.year++; recordHistory(); }
    if(state.biomass <= 0 || state.population.length === 0) { state.isDead = true; document.getElementById('game-over').style.display='flex'; document.getElementById('final-year').innerText = state.year; }
    document.getElementById('y-val').innerText = state.year;
    document.getElementById('p-val').innerText = state.population.length;
    document.getElementById('b-val').innerText = Math.max(0, Math.floor(state.biomass));
    drawChart();
    requestAnimationFrame(loop);
}

// 初始人口：純隱性
for(let i=0; i<30; i++) state.population.push(new Creature(Math.random()*800, 200, {f:['f','f'], c:['c','c'], s:['s','s'], r:['r','r']}));
loop();
</script>
</body>
</html>
