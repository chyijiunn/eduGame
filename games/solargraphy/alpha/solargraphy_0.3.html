# Solargraphy 0.3 使用說明

## 主舞台
- 拖曳滑鼠或單指拖曳：旋轉觀看3D天球；可轉至地平線下方。
- 滾輪或雙指縮放：改變攝影機距離。
- N／E／S／W 為真實方位；旋轉視角不會改變天文座標。
- 金色、藍色及紅色分別標示夏至、春秋分、冬至的幾何參考軌跡。
- 地平線以下的太陽以淡色及虛線表示。中央人物面向依半球設定。
- 在 Solargraphy 中展開「相機設定」，中央人物切換成3D相機；拖曳鏡頭的金色指向線可直接設定方位角（北0°、東90°、南180°、西270°）。針孔相機幾何中的「朝向 °」輸入框與指向線雙向同步。收起設定後恢復人物。

## 四個功能視窗
1. 時間：日期、當地時間、播放、三檔速度、可展開日出日落。
2. 控制台：緯度、經度、經度估算時區、重置。
3. Solargraphy：窄版半透明攝影視窗，可切換科學／攝影模式及投影方式。
4. 地球公轉：公轉軌道、地軸、24節氣；拖曳地球改變日期。

## 曝光規則
- 只有播放實際經過的時間區間會新增曝光；直接跳轉日期不補齊中間時間。
- 同一時段重複播放可重複曝光。暫停不增加曝光。
- 改變緯度、經度或相機參數時，保留曝光事件，重新計算軌跡及投影。
- 最高速採用日期區間壓縮與代表性取樣，保留累積曝光時間權重；視覺細節為近似重建。

- 離線時區採經度每15°估算標準 UTC 偏移，無法精確處理政治時區、跨國界與夏令時間。

## 投影與相紙
- 等距魚眼為以光軸為中心的半球魚眼投影，水平窄版預覽仍保留完整投影比例。
- 圓筒針孔模型：側壁針孔，光線投射至對側內壁相紙。相紙覆蓋角度與有效視角不相等。
- 原始倒像與校正方向只是顯示轉換，不修改曝光事件。
- 攝影模式的色調、光暈、亮度與隨機雲層均屬視覺模擬，不能預測特定相紙的光化學變化。

## 天文精度
- 太陽位置使用常見的低精度太陽視黃經、赤緯、均時差近似式，適合教學可視化，不適用於專業天文測量。
- 日出日落使用太陽中心高度角約 -0.833° 的標準大氣近似；真實地形、海拔與氣象未納入。
- 節氣由太陽視黃經每15°數值求解。公轉視圖的地球與太陽大小不按比例。
- 北極與南極的方位使用固定參考子午線約定。

## 保存與匯出
- 本機 localStorage 自動保存設定、時間與曝光區間。瀏覽器儲存限制、無痕模式或清除資料可能導致遺失。
- Solargraphy 攝影視窗可匯出 PNG；控制台不再提供 JSON 匯入／匯出及說明入口。
- 恢復視角不影響曝光；清除曝光與全部重置立即生效。

## 離線使用
- HTML 主體不依賴外部 CDN；直接開啟檔案可執行模擬。
- /eduGame/ga4.js 是網站統計用可選資源，離線時載入失敗不影響模擬。

function boundPanel(p){if(!p.classList.contains('visible'))return;const vw=innerWidth,vh=innerHeight;let width=Math.min(p.offsetWidth,vw-8),height=Math.min(p.offsetHeight,vh-8);if(p.offsetWidth>vw-8)p.style.width=Math.max(138,vw-8)+'px';if(p.offsetHeight>vh-8)p.style.height=Math.max(110,vh-8)+'px';let x=Number.parseFloat(p.style.left),y=Number.parseFloat(p.style.top);if(!Number.isFinite(x))x=vw-p.offsetWidth-18;if(!Number.isFinite(y))y=80;x=clamp(x,4,Math.max(4,vw-p.offsetWidth-4));y=clamp(y,4,Math.max(4,vh-p.offsetHeight-4));p.style.left=x+'px';p.style.top=y+'px'}
function front(p){p.style.zIndex=++zCounter}
function syncQuickTools(){document.querySelectorAll('#quickTools [data-open]').forEach(b=>b.setAttribute('aria-pressed',String(panels[b.dataset.open].classList.contains('visible'))))}
function openPanel(key){const p=panels[key];p.classList.add('visible');front(p);boundPanel(p);syncQuickTools();if(key==='orbit')renderOrbit();if(key==='photo'){renderPhoto();renderSky()}scheduleSave()}
function closePanel(key){panels[key].classList.remove('visible');syncQuickTools();if(key==='photo')renderSky();scheduleSave()}
function initPanels(){const vw=innerWidth;const coords={photo:[vw-(vw<650?166:224),75],time:[Math.max(7,vw*.07),85],controls:[Math.max(7,vw*.2),120],orbit:[Math.max(7,vw*.36),90]};for(const [key,p] of Object.entries(panels)){if(!p.style.left)p.style.left=coords[key][0]+'px';if(!p.style.top)p.style.top=coords[key][1]+'px';boundPanel(p);p.addEventListener('pointerdown',()=>front(p));const header=p.querySelector('.panel-header'),grip=p.querySelector('.grip');for(const [handle,resize] of [[header,false],[grip,true]]){let state=null;handle.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;e.preventDefault();e.stopPropagation();front(p);handle.setPointerCapture(e.pointerId);state={x:e.clientX,y:e.clientY,left:parseFloat(p.style.left),top:parseFloat(p.style.top),width:p.offsetWidth,height:p.offsetHeight}});handle.addEventListener('pointermove',e=>{if(!state)return;const dx=e.clientX-state.x,dy=e.clientY-state.y;if(resize){p.style.width=clamp(state.width+dx,p.classList.contains('photo-panel')?138:220,innerWidth-8)+'px';p.style.height=clamp(state.height+dy,110,innerHeight-8)+'px'}else{p.style.left=clamp(state.left+dx,4,Math.max(4,innerWidth-p.offsetWidth-4))+'px';p.style.top=clamp(state.top+dy,4,Math.max(4,innerHeight-p.offsetHeight-4))+'px'}if(p===panels.orbit)renderOrbit()});const done=()=>{if(state){state=null;boundPanel(p);scheduleSave();if(p===panels.photo)renderPhoto();if(p===panels.orbit)renderOrbit()}};handle.addEventListener('pointerup',done);handle.addEventListener('pointercancel',done)}}}
document.querySelectorAll('#quickTools [data-open]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.open;panels[key].classList.contains('visible')?closePanel(key):openPanel(key)}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closePanel(b.dataset.close)));
// Settings and input handlers.
$('playBtn').addEventListener('click',()=>playing?pause():play());$('dateInput').addEventListener('change',e=>timeJumpDate(e.target.value));$('timeText').addEventListener('change',e=>{const m=/^(\d{2}):(\d{2})/.exec(e.target.value);if(m)timeJumpMinute(+m[1]*60+(+m[2]))});$('timeSlider').addEventListener('input',e=>timeJumpMinute(+e.target.value));document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{S.speed=Number(b.dataset.speed);updateTimeUI();scheduleSave()}));
for(const b of document.querySelectorAll('[data-lat]'))b.addEventListener('click',()=>setLat(+b.dataset.lat));
for(const [id,key,min,max] of [['latInput','lat',-90,90],['lonInput','lon',-180,180]])$(id).addEventListener('change',e=>{const v=Number(e.target.value);if(!Number.isFinite(v))return;S[key]=clamp(v,min,max);changeLocation()});
$('referenceToggle').addEventListener('change',e=>{S.showRefs=e.target.checked;renderSky();scheduleSave()});$('groundToggle').addEventListener('change',e=>{S.showGrid=e.target.checked;renderSky();scheduleSave()});
$('photoMode').addEventListener('change',e=>{S.mode=e.target.value;markPhoto();renderPhoto()});$('projectionInput').addEventListener('change',e=>{S.projection=e.target.value;markPhoto();renderPhoto()});
for(const [id,key,min,max] of [['diamInput','diam',20,500],['heightInput','height',20,500],['paperInput','paper',90,270],['headingInput','heading',0,359.9]])$(id).addEventListener('change',e=>{if(!Number.isFinite(+e.target.value))return;S[key]=clamp(+e.target.value,min,max);if(key==='heading')S.headingAuto=false;markPhoto();updateControls();renderSky();renderPhoto()});
$('imageDirection').addEventListener('change',e=>{S.direction=e.target.value;markPhoto();renderPhoto()});$('cloudToggle').addEventListener('change',e=>{S.cloud=e.target.checked;cloudSeed=Math.random()*1e9|0;markPhoto();renderPhoto()});$('regenCloud').addEventListener('click',()=>{cloudSeed=Math.random()*1e9|0;markPhoto();renderPhoto();notify('已重新隨機生成模擬雲層')});$('photoSettingsBtn').addEventListener('click',()=>{$('cameraSettings').classList.toggle('hidden');$('photoSettingsBtn').setAttribute('aria-expanded',String(cameraSettingsActive()));boundPanel(panels.photo);renderSky()});
$('resetView').addEventListener('click',()=>{S.yaw=210;S.pitch=28;S.zoom=3.7;renderSky();scheduleSave()});
function showModal(title,html,actions=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalActions').replaceChildren();for(const a of actions){const b=document.createElement('button');b.textContent=a.text;if(a.primary)b.classList.add('primary');b.addEventListener('click',()=>{closeModal();a.fn?.()});$('modalActions').appendChild(b)}$('modalBackdrop').classList.add('show')}
function closeModal(){$('modalBackdrop').classList.remove('show')}$('modalClose').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('pointerdown',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('resetExposure').addEventListener('click',()=>{events=[];changeExposure();renderSky();renderPhoto();updateTimeUI();notify('已清除累積曝光')});
$('resetAll').addEventListener('click',()=>{pause();$('cameraSettings').classList.add('hidden');$('photoSettingsBtn').setAttribute('aria-expanded','false');S=defaults();sim=clamp(Date.now(),YEARMIN,YEARMAX);events=[];changeExposure();for(const [key,p] of Object.entries(panels)){p.style.left='';p.style.top='';p.style.width='';p.style.height='';p.classList.toggle('visible',key==='photo')}initPanelCoords();syncQuickTools();updateControls();updateTimeUI(true);renderSky();renderPhoto();save();notify('已恢復全部初始設定')});
function initPanelCoords(){const vw=innerWidth,coords={photo:[vw-(vw<650?166:224),75],time:[Math.max(7,vw*.07),85],controls:[Math.max(7,vw*.2),120],orbit:[Math.max(7,vw*.36),90]};for(const [key,p] of Object.entries(panels)){p.style.left=coords[key][0]+'px';p.style.top=coords[key][1]+'px';boundPanel(p)}}
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportPNG(){const c=document.createElement('canvas');c.width=1500;c.height=990;drawPhoto(c.getContext('2d'),c.width,c.height,true);c.toBlob(blob=>{if(blob)download('solargraphy_'+localDateStr(sim)+'.png',blob)},'image/png')}
$('exportPNG').addEventListener('click',exportPNG);
$('photoExpand').addEventListener('click',()=>{const c=document.createElement('canvas');c.width=1200;c.height=792;drawPhoto(c.getContext('2d'),1200,792);showModal('Solargraphy｜放大檢視','<div id="largePhotoContainer"></div><p class="hint">此為目前投影、攝影模式及累積曝光的放大結果。</p>',[{text:'關閉'},{text:'匯出 PNG',primary:true,fn:exportPNG}]);$('largePhotoContainer').appendChild(c);c.style.width='100%';c.style.height='auto'});$('photoCanvasWrap').addEventListener('click',()=>$('photoExpand').click());
function frame(now){const dt=Math.min(1000,Math.max(0,now-frameLast));frameLast=now;if(playing){const old=sim,advance=dt*(DAY/10000)*S.speed;sim=Math.min(YEARMAX,sim+advance);if(sim>old)appendExposure(old,sim);if(sim>=YEARMAX){pause();notify('已到達2100年12月31日，播放自動停止。')}if(now-lastUI>230){updateTimeUI();lastUI=now}if(now-skyStamp>(S.speed>=1000?240:100)){renderSky();skyStamp=now}if(now-orbitStamp>200)renderOrbit();}
 if(photoDirty&&now-photoStamp>(S.speed>=1000?1500:850)&&panels.photo.classList.contains('visible'))renderPhoto();if(playing&&now-lastSave>4000)save();requestAnimationFrame(frame)}
function init(){load();sanitize();$('photoSettingsBtn').setAttribute('aria-expanded','false');updateControls();initPanels();syncQuickTools();skyResize();updateTimeUI(true);renderPhoto();renderOrbit();window.addEventListener('resize',()=>{skyResize();for(const p of Object.values(panels))boundPanel(p);renderPhoto();renderOrbit()});new ResizeObserver(()=>{if(panels.orbit.classList.contains('visible'))renderOrbit()}).observe($('orbitCanvas'));document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});requestAnimationFrame(frame)}init();
})();
</script>
</body>
