<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>節奏音樂生成器 0.4</title>
<style>
  :root{
    --bg:#0d1017;
    --panel:#151a23;
    --panel2:#0f141d;
    --text:#eef3f9;
    --muted:#98a5b6;
    --line:#283244;
    --accent:#f7c948;
    --accent2:#ff9f43;
    --ok:#7ee787;
    --bad:#ff7b72;
    --btn:#222b38;
    --btn2:#303b4d;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(247,201,72,.16), transparent 26%),
      radial-gradient(circle at 85% 8%, rgba(255,159,67,.10), transparent 24%),
      linear-gradient(180deg,#111722,#080a0f);
    color:var(--text);
  }
  .wrap{
    width:min(980px,100%);
    margin:0 auto;
    padding:18px;
  }
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom:14px;
  }
  h1{
    margin:0;
    font-size:clamp(24px,5vw,36px);
    letter-spacing:.02em;
  }
  .subtitle{
    color:var(--muted);
    margin:6px 0 0;
    line-height:1.55;
    font-size:14px;
  }
  .version{
    color:#171717;
    background:linear-gradient(180deg,#ffdf6a,#d9a514);
    border-radius:999px;
    padding:7px 12px;
    font-weight:800;
    white-space:nowrap;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015)),var(--panel);
    border:1px solid rgba(255,255,255,.085);
    border-radius:18px;
    padding:16px;
    box-shadow:0 12px 38px rgba(0,0,0,.24);
  }
  h2{
    margin:0 0 12px;
    font-size:18px;
  }
  label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin:12px 0 7px;
  }
  select,input{
    width:100%;
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--text);
    border-radius:12px;
    padding:12px;
    font-size:16px;
    outline:none;
  }
  select:focus,input:focus{border-color:rgba(247,201,72,.75)}
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .buttons{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    gap:10px;
    margin-top:14px;
  }
  button{
    border:1px solid rgba(255,255,255,.1);
    background:var(--btn);
    color:var(--text);
    border-radius:12px;
    padding:12px;
    min-height:46px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
  }
  button:hover{background:var(--btn2)}
  button.primary{
    background:linear-gradient(180deg,#ffdf6a,#d9a514);
    color:#171717;
    border-color:#f5ca3d;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .downloads{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
  }
  .downloads.three{
    grid-template-columns:1fr 1fr 1fr;
  }
  .status{
    min-height:42px;
    padding:11px 12px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.075);
    color:var(--muted);
    line-height:1.45;
    font-size:14px;
    margin-top:12px;
  }
  .meter{
    width:100%;
    height:10px;
    border-radius:999px;
    background:#080b10;
    border:1px solid rgba(255,255,255,.08);
    margin-top:10px;
    overflow:hidden;
  }
  .bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .12s linear;
  }
  canvas{
    width:100%;
    height:230px;
    display:block;
    border-radius:16px;
    background:#080b10;
    border:1px solid rgba(255,255,255,.08);
  }
  audio{
    width:100%;
    margin-top:10px;
  }
  .note{
    color:var(--muted);
    line-height:1.65;
    font-size:13px;
    margin-top:10px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .chip{
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.035);
    color:var(--muted);
    border-radius:999px;
    padding:7px 10px;
    font-size:12px;
  }
  .license{
    margin-top:14px;
    color:var(--muted);
    font-size:12px;
    line-height:1.65;
  }
  @media(max-width:760px){
    .wrap{padding:14px}
    header{display:block}
    .version{display:inline-block;margin-top:10px}
    .grid{grid-template-columns:1fr}
    .buttons,.downloads,.downloads.three{grid-template-columns:1fr}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>節奏音樂生成器</h1>
      <p class="subtitle">真實樂器 beta：加入保底伴奏床、MIDI 下載、更多曲風與樂器組合。生成後自動播放，可下載 WAV、MIDI 與節奏 JSON。</p>
    </div>
    <div class="version">0.4</div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>生成設定</h2>

      <div class="row">
        <div>
          <label for="length">樂曲長短</label>
          <select id="length">
            <option value="30">30 秒</option>
            <option value="45">45 秒</option>
            <option value="60" selected>60 秒</option>
            <option value="90">90 秒</option>
          </select>
        </div>
        <div>
          <label for="difficulty">節奏難度</label>
          <select id="difficulty">
            <option value="easy">簡單</option>
            <option value="medium" selected>中等</option>
            <option value="hard">困難</option>
          </select>
        </div>
      </div>

      <label for="mood">曲風</label>
      <select id="mood">
        <option value="clean" selected>Swing Jazz</option>
        <option value="funk">Funk Jazz</option>
        <option value="lofi">Lo-fi Jazz</option>
        <option value="latin">Latin Jazz</option>
        <option value="noir">Noir Jazz</option>
        <option value="playful">Playful Jazz</option>
        <option value="intense">Big Band 感</option>
      </select>

      <label for="motion">節奏變化</label>
      <select id="motion">
        <option value="ramp" selected>由慢到急，最後重落</option>
        <option value="steady">穩定 Swing</option>
        <option value="dense">越來越密集</option>
        <option value="drop">多停頓，強烈落點</option>
      </select>

      <div class="row">
        <div>
          <label for="seed">Seed</label>
          <input id="seed" value="" placeholder="留空＝隨機" />
        </div>
        <div>
          <label for="swing">Swing 比例</label>
          <select id="swing">
            <option value="0.58">微 Swing</option>
            <option value="0.62" selected>標準 Swing</option>
            <option value="0.67">重 Swing</option>
          </select>
        </div>
      </div>

      <label for="quality">音色模式</label>
      <select id="quality">
        <option value="sampled" selected>真實樂器 beta（需網路載入音源）</option>
        <option value="synth">快速合成備援</option>
      </select>

      <label for="ensemble">樂器組合</label>
      <select id="ensemble">
        <option value="jazz_trio" selected>Jazz Trio：鋼琴、Bass、鼓</option>
        <option value="jazz_quartet">Jazz Quartet：鋼琴、Bass、鼓、銅管</option>
        <option value="guitar_quartet">Guitar Quartet：吉他、鋼琴、Bass、鼓</option>
        <option value="string_trio">弦樂三重奏：小提琴、中提琴、大提琴</option>
        <option value="brass_combo">Brass Combo：鋼琴、Bass、鼓、銅管群</option>
      </select>

      <div class="buttons">
        <button class="primary" id="generateBtn">生成並播放</button>
        <button id="randomSeedBtn">換 Seed</button>
        <button id="stopBtn" disabled>停止</button>
      </div>

      <div class="downloads three">
        <button id="downloadWavBtn" disabled>下載 WAV</button>
        <button id="downloadMidiBtn" disabled>下載 MIDI</button>
        <button id="downloadJsonBtn" disabled>下載 JSON</button>
      </div>

      <div class="status" id="status">尚未生成。按「生成並播放」。</div>
      <div class="meter"><div class="bar" id="progressBar"></div></div>
    </section>

    <section class="card">
      <h2>試聽</h2>
      <canvas id="viz" width="900" height="300"></canvas>
      <audio id="audio" controls></audio>
      <p class="note">
        生成後會直接播放。若手機瀏覽器阻擋自動播放，按一次上方播放列即可。
      </p>
      <p class="license">
        音源使用瀏覽器載入的 General MIDI SoundFont。正式公開或商用前，請保留授權標示，並確認你採用的音源授權符合用途。
      </p>
    </section>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const els = {
    length: $("length"),
    difficulty: $("difficulty"),
    mood: $("mood"),
    motion: $("motion"),
    seed: $("seed"),
    swing: $("swing"),
    quality: $("quality"),
    ensemble: $("ensemble"),
    generateBtn: $("generateBtn"),
    randomSeedBtn: $("randomSeedBtn"),
    stopBtn: $("stopBtn"),
    downloadWavBtn: $("downloadWavBtn"),
    downloadMidiBtn: $("downloadMidiBtn"),
    downloadJsonBtn: $("downloadJsonBtn"),
    status: $("status"),
    progressBar: $("progressBar"),
    audio: $("audio"),
    viz: $("viz"),
  };

  const VERSION = "0.4";
  const SAMPLE_BASE = "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/";
  const INSTRUMENTS = {
    piano: "acoustic_grand_piano",
    bass: "acoustic_bass",
    guitar: "electric_guitar_jazz",
    brass: "brass_section",
    trumpet: "trumpet",
    violin: "violin",
    viola: "viola",
    cello: "cello",
    strings: "string_ensemble_1",
    drum: "synth_drum",
    cymbal: "reverse_cymbal",
    taiko: "taiko_drum",
    wood: "woodblock"
  };

  window.MIDI = window.MIDI || {};
  window.MIDI.Soundfont = window.MIDI.Soundfont || {};

  let audioCtx = null;
  let current = {
    song: null,
    wavBlob: null,
    midiBlob: null,
    wavUrl: null,
    jsonBlob: null,
    audioBuffer: null,
    rawData: null,
    raf: null
  };

  const sampleCache = new Map();
  const scriptCache = new Map();

  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function sec(n){ return Math.round(n*1000)/1000; }
  function midiToHz(n){ return 440 * Math.pow(2, (n-69)/12); }

  function midiToName(midi){
    const names = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
    return names[midi % 12] + (Math.floor(midi / 12) - 1);
  }
  function nameToMidi(name){
    const m = /^([A-G])([b#]?)(-?\d+)$/.exec(name);
    if(!m) return null;
    const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
    const acc = m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0;
    const octave = Number(m[3]);
    return (octave + 1) * 12 + base + acc;
  }

  const palettes = {
    clean: {
      key: "C major / A minor",
      scale: [60,62,64,65,67,69,70,71,72,74,76,77],
      blues: [60,63,65,66,67,70,72,75,77],
      chords: [
        {name:"Dm9", root:50, notes:[62,65,69,72,76]},
        {name:"G13", root:43, notes:[59,65,69,74,76]},
        {name:"Cmaj9", root:48, notes:[60,64,67,71,74]},
        {name:"A7b9", root:45, notes:[61,67,69,72,75]}
      ]
    },
    funk: {
      key: "D dorian / G mixolydian",
      scale: [50,52,53,55,57,59,60,62,64,65,67,69,71,72],
      blues: [50,53,55,56,57,60,62,65,67,68,69],
      chords: [
        {name:"Dm9", root:50, notes:[62,65,69,72,76]},
        {name:"G9", root:43, notes:[59,62,65,69,74]},
        {name:"Dm11", root:50, notes:[60,65,69,72,76]},
        {name:"A7#9", root:45, notes:[61,67,72,75,76]}
      ]
    },
    lofi: {
      key: "A minor / C major",
      scale: [57,59,60,62,64,65,67,69,71,72,74,76],
      blues: [57,60,62,63,64,67,69,72,74],
      chords: [
        {name:"Am9", root:45, notes:[57,60,64,67,71]},
        {name:"Dm9", root:50, notes:[57,62,65,69,72]},
        {name:"G13", root:43, notes:[59,65,69,74,76]},
        {name:"Cmaj9", root:48, notes:[60,64,67,71,74]}
      ]
    },
    latin: {
      key: "F major / D minor",
      scale: [53,55,57,58,60,62,64,65,67,69,70,72,74],
      blues: [53,56,58,59,60,63,65,68,70],
      chords: [
        {name:"Dm9", root:50, notes:[57,62,65,69,72]},
        {name:"Gm9", root:43, notes:[58,62,65,69,72]},
        {name:"C13", root:48, notes:[58,64,67,70,74]},
        {name:"Fmaj9", root:41, notes:[57,60,65,69,72]}
      ]
    },
    noir: {
      key: "C minor",
      scale: [60,62,63,65,67,68,70,72,74,75,77],
      blues: [60,63,65,66,67,70,72,75,77],
      chords: [
        {name:"Cm9", root:48, notes:[60,63,67,70,74]},
        {name:"Fm9", root:41, notes:[60,63,68,72,75]},
        {name:"Dm7b5", root:50, notes:[62,65,68,72]},
        {name:"G7b9", root:43, notes:[59,63,65,68,74]}
      ]
    },
    playful: {
      key: "F major",
      scale: [53,55,57,58,60,62,64,65,67,69,70,72,74],
      blues: [53,56,58,59,60,63,65,68,70],
      chords: [
        {name:"Gm7", root:43, notes:[58,62,65,69,72]},
        {name:"C9", root:48, notes:[58,62,64,67,70]},
        {name:"F6", root:41, notes:[57,60,65,69,72]},
        {name:"D7", root:50, notes:[57,60,66,69,72]}
      ]
    },
    intense: {
      key: "Bb major",
      scale: [58,60,62,63,65,67,69,70,72,74,75,77],
      blues: [58,61,63,64,65,68,70,73,75],
      chords: [
        {name:"Cm9", root:48, notes:[60,63,67,70,74]},
        {name:"F13", root:41, notes:[57,63,67,72,74]},
        {name:"Bb6", root:46, notes:[58,62,65,67,72]},
        {name:"G7alt", root:43, notes:[59,63,66,68,73]}
      ]
    }
  };

  function buildSections(duration, motion){
    const d = duration;
    if(motion === "steady"){
      return [
        {name:"intro", start:0, end:d*.14, bpm:104, density:.65},
        {name:"theme", start:d*.14, end:d*.45, bpm:108, density:.85},
        {name:"variation", start:d*.45, end:d*.76, bpm:112, density:1.0},
        {name:"tag", start:d*.76, end:d*.93, bpm:112, density:1.15},
        {name:"final_drop", start:d*.93, end:d, bpm:84, density:1.2}
      ];
    }
    if(motion === "dense"){
      return [
        {name:"intro", start:0, end:d*.16, bpm:92, density:.45},
        {name:"theme", start:d*.16, end:d*.42, bpm:102, density:.75},
        {name:"busy", start:d*.42, end:d*.70, bpm:118, density:1.2},
        {name:"climax", start:d*.70, end:d*.93, bpm:136, density:1.75},
        {name:"final_drop", start:d*.93, end:d, bpm:76, density:1.5}
      ];
    }
    if(motion === "drop"){
      return [
        {name:"intro", start:0, end:d*.16, bpm:86, density:.55},
        {name:"space", start:d*.16, end:d*.38, bpm:96, density:.60},
        {name:"breaks", start:d*.38, end:d*.63, bpm:114, density:.75},
        {name:"climax", start:d*.63, end:d*.90, bpm:142, density:1.55},
        {name:"final_drop", start:d*.90, end:d, bpm:66, density:1.1}
      ];
    }
    return [
      {name:"intro", start:0, end:d*.14, bpm:82, density:.50},
      {name:"main_theme", start:d*.14, end:d*.36, bpm:96, density:.78},
      {name:"syncopation", start:d*.36, end:d*.58, bpm:112, density:1.0},
      {name:"drive", start:d*.58, end:d*.80, bpm:132, density:1.32},
      {name:"climax", start:d*.80, end:d*.93, bpm:152, density:1.75},
      {name:"final_drop", start:d*.93, end:d, bpm:72, density:1.1}
    ];
  }

  function swingOffset(eighthIndex, beatDur, swingRatio){
    const pair = Math.floor(eighthIndex / 2);
    const inPair = eighthIndex % 2;
    return pair * beatDur + (inPair ? beatDur * swingRatio : 0);
  }

  function addEvent(song, time, type, section, lane, motif){
    if(time < 0 || time > song.duration) return;
    const last = song.events[song.events.length-1];
    if(last && Math.abs(last.time - time) < .055) return;
    song.events.push({time:sec(time), type, lane, section, motif});
  }

  function buildSongData(opts){
    const seedString = opts.seed || String(Date.now());
    const rng = mulberry32(hashString(seedString));
    const duration = Number(opts.length);
    const swingRatio = Number(opts.swing);
    const palette = palettes[opts.mood];
    const sections = buildSections(duration, opts.motion);
    const difficultyMap = {easy:.65, medium:1.0, hard:1.35};
    const diff = difficultyMap[opts.difficulty] || 1.0;

    const song = {
      title: "Rhythm Music Generator",
      version: VERSION,
      seed: seedString,
      soundMode: opts.quality,
      mixProfile: "v0.4 continuous accompaniment bed, MIDI export, ensemble presets",
      ensemble: opts.ensemble,
      style: "Original browser-generated rhythm-game music",
      mood: opts.mood,
      motion: opts.motion,
      difficulty: opts.difficulty,
      duration,
      key: palette.key,
      sampleRate: 44100,
      soundfontAttribution: "FluidR3_GM-derived MIDI.js soundfonts, CC BY 3.0 as listed by midi-js-soundfonts.",
      sections: sections.map(s => ({name:s.name, start:sec(s.start), end:sec(s.end), bpm:s.bpm, density:s.density})),
      bpmMap: sections.map(s => ({time:sec(s.start), bpm:s.bpm})),
      events: []
    };

    const notes = [];
    const drums = [];

    function push(inst, time, dur, midi, vel=.75, meta={}){
      if(time < 0 || time > duration + .2) return;
      notes.push({inst, time:sec(time), dur:sec(dur), midi, vel:clamp(vel,0,1.4), ...meta});
    }
    function drum(kind, time, vel=.7){
      if(time < 0 || time > duration + .2) return;
      drums.push({kind, time:sec(time), vel:clamp(vel,0,1.4)});
    }

    const motifCells = [
      [0,2,3,2],
      [0,3,4,6],
      [4,3,2,0],
      [2,4,6,7],
      [7,6,4,3],
      [0,2,4,3,2]
    ];
    const motif = pick(rng, motifCells);
    let phrase = 0;

    for(const secn of sections){
      const len = secn.end - secn.start;
      const beatDur = 60 / secn.bpm;
      const barDur = beatDur * 4;
      const bars = Math.max(1, Math.floor(len / barDur));
      const level = secn.density * diff;

      if(secn.name === "final_drop"){
        const t = secn.start + Math.min(1.05, len*.42);
        const chord = palette.chords[phrase % palette.chords.length];
        push("bass", t, 1.35, chord.root, 1.15, {role:"final_bass", chord:chord.name});
        chord.notes.forEach((m,i) => push(i < 2 ? "brass" : "trumpet", t + i*.016, 1.65, m + (i>1 ? 12 : 0), 1.22, {role:"final_chord", chord:chord.name}));
        push("piano", t + .04, 1.0, chord.root + 24, .74, {role:"final_high"});
        drum("kick", t, 1.15);
        drum("crash", t + .02, .95);
        addEvent(song, t, "finalTap", secn.name, "center", "final_drop");
        continue;
      }

      for(let b=0;b<bars;b++){
        const barStart = secn.start + b * barDur;
        const chord = palette.chords[(phrase + b) % palette.chords.length];
        const nextChord = palette.chords[(phrase + b + 1) % palette.chords.length];

        // sampled jazz drum feel
        for(let beat=0;beat<4;beat++){
          const t = barStart + beat * beatDur;
          if(beat === 0) drum("kick", t, .8);
          if(beat === 2 && rng() < .55) drum("kick", t, .52);
          if(beat === 1 || beat === 3) drum("snare", t + (rng()-.5)*.015, .62);
          drum("ride", t + (rng()-.5)*.01, .32);
          drum("hat", t + beatDur * swingRatio, .24 + rng()*.08);
        }

        // acoustic walking bass
        const bassLine = [
          chord.root,
          chord.root + pick(rng,[7,10,12]),
          chord.root + pick(rng,[4,5,9]),
          nextChord.root + pick(rng,[-1,1,2,-2])
        ];
        bassLine.forEach((m, beat) => {
          push("bass", barStart + beat*beatDur + (rng()-.5)*.018, beatDur*.88, m, .76 + rng()*.08, {chord:chord.name});
        });

        // guitar comp, sparse
        const gTimes = [
          barStart + beatDur * swingRatio,
          barStart + beatDur * 1.0 + beatDur * swingRatio,
          barStart + beatDur * 2.0,
          barStart + beatDur * 3.0 + beatDur * swingRatio
        ];
        gTimes.forEach((t, idx) => {
          if(rng() < .18 + level*.07){
            chord.notes.slice(0,4).forEach((m,i) => push("guitar", t + i*.012, beatDur*.48, m + (idx>1 ? 12 : 0), .24 + level*.04, {chord:chord.name, role:"guitar_comp"}));
            if(rng() < .18*level) addEvent(song, t, "tap", secn.name, idx%2 ? "right" : "left", "guitar_comp");
          }
        });

        // piano comp, fuller
        const pTimes = [
          barStart + beatDur * swingRatio,
          barStart + beatDur * 1.5,
          barStart + beatDur * 2 + beatDur * swingRatio,
          barStart + beatDur * 3.0
        ];
        pTimes.forEach((t, idx) => {
          if(rng() < .38 + level*.12){
            chord.notes.slice(0,5).forEach((m,i) => push("piano", t + i*.010, beatDur*.72, m + (idx>1 && rng()>.55 ? 12 : 0), .42 + level*.07, {chord:chord.name, role:"piano_comp"}));
            if(rng() < .22*level) addEvent(song, t, "tap", secn.name, pick(rng,["left","right","center"]), "piano_comp");
          }
        });

        // lead melody: trumpet/brass alternating
        if(rng() < clamp(.42 + level*.14, .34, .82)){
          const baseOct = opts.mood === "intense" ? 72 : 67;
          const cell = (b + phrase) % 2 === 0 ? motif : motif.slice().reverse();
          const slots = opts.difficulty === "hard" ? [0,1,2,3,4,5,6] : [0,2,3,5];
          slots.forEach((slot, idx) => {
            if(rng() > clamp(.68 + level*.06, .60, .96)) return;
            const offset = swingOffset(slot, beatDur, swingRatio);
            const t = barStart + offset + (rng()-.5)*.018;
            const degree = cell[idx % cell.length] || 0;
            const pool = rng() < .25 ? palette.blues : palette.scale;
            let midi = pool[(degree + Math.floor(rng()*2)) % pool.length];
            while(midi < baseOct - 8) midi += 12;
            while(midi > baseOct + 10) midi -= 12;
            const inst = (secn.name === "climax" || rng() < .35) ? "trumpet" : "brass";
            push(inst, t, beatDur * pick(rng,[.50,.62,.78,.92]), midi, .72 + level*.12, {role:"lead"});
            if(rng() < clamp(.36 + level*.18, .28, .86)) addEvent(song, t, "tap", secn.name, pick(rng,["left","right","center"]), "lead");
          });
        }

        if(opts.difficulty !== "easy"){
          const t = barStart + beatDur * 2 + beatDur * swingRatio;
          if(rng() < .25 + level*.16) addEvent(song, t, "tap", secn.name, "center", "syncopation");
        }

        if(opts.difficulty === "hard" && b % 4 === 2 && secn.name !== "intro"){
          const start = barStart + beatDur*.5;
          const end = start + beatDur * pick(rng,[1.5,2,2.5]);
          if(end < secn.end - .2){
            addEvent(song, start, "holdStart", secn.name, "center", "held_stab");
            addEvent(song, end, "holdEnd", secn.name, "center", "held_stab");
            chord.notes.slice(0,4).forEach((m,i)=>push("brass", start+i*.009, end-start, m + 12, .45, {role:"held_stab", chord:chord.name}));
          }
        }

        if(secn.name === "climax" || secn.name === "drive" || secn.name === "busy"){
          const chance = secn.name === "climax" ? .78 : .42;
          if(rng() < chance){
            const t = barStart + beatDur * pick(rng,[0, 1+swingRatio, 2, 3+swingRatio]);
            chord.notes.forEach((m,i) => push(i%2 ? "trumpet" : "brass", t + i*.010, beatDur*.92, m+12, .78 + level*.10, {role:"brass_stab", chord:chord.name}));
            drum("crash", t, .55);
            addEvent(song, t, "tap", secn.name, "center", "brass_stab");
          }
        }
      }
      phrase += bars;
    }

    if(opts.difficulty === "easy"){
      for(const secn of sections){
        if(secn.name === "final_drop") continue;
        const beatDur = 60 / secn.bpm;
        const barDur = beatDur * 4;
        for(let t = secn.start + barDur; t < secn.end - .5; t += barDur){
          addEvent(song, t, "tap", secn.name, "center", "downbeat");
        }
      }
    }

    song.events.sort((a,b)=>a.time-b.time);
    const minGap = opts.difficulty === "hard" ? .20 : opts.difficulty === "medium" ? .28 : .40;
    const filtered = [];
    for(const e of song.events){
      const last = filtered[filtered.length-1];
      if(!last || e.time - last.time >= minGap || e.type === "holdEnd" || e.type === "finalTap"){
        filtered.push(e);
      }
    }
    song.events = filtered.map((e,i)=>({id:i+1, ...e}));

    applyEnsembleAndContinuousBed(song, notes, drums, sections, palette, opts);

    return {song, notes, drums};
  }


  function addGeneratedNote(notes, inst, time, dur, midi, vel=.6, meta={}){
    notes.push({inst, time:sec(time), dur:sec(dur), midi, vel:clamp(vel,0,1.4), ...meta});
  }

  function applyEnsembleAndContinuousBed(song, notes, drums, sections, palette, opts){
    const rng = mulberry32(hashString(song.seed + "_v04_bed_" + (opts.ensemble || "jazz_trio")));
    const ensemble = opts.ensemble || "jazz_trio";
    const isString = ensemble === "string_trio";

    // Filter ensemble first, then add a deterministic background bed.
    let allowedNotes;
    let keepDrums = true;

    if(ensemble === "jazz_trio"){
      allowedNotes = new Set(["piano","bass"]);
    }else if(ensemble === "jazz_quartet"){
      allowedNotes = new Set(["piano","bass","brass","trumpet"]);
    }else if(ensemble === "guitar_quartet"){
      allowedNotes = new Set(["piano","bass","guitar"]);
    }else if(ensemble === "brass_combo"){
      allowedNotes = new Set(["piano","bass","brass","trumpet"]);
    }else if(ensemble === "string_trio"){
      allowedNotes = new Set(["violin","viola","cello","strings"]);
      keepDrums = false;
    }else{
      allowedNotes = new Set(["piano","bass","brass","trumpet"]);
    }

    for(let i=notes.length-1; i>=0; i--){
      if(!allowedNotes.has(notes[i].inst)) notes.splice(i,1);
    }
    if(!keepDrums) drums.splice(0, drums.length);

    // Continuous accompaniment bed: prevents empty silent bars.
    for(const secn of sections){
      const beatDur = 60 / secn.bpm;
      const barDur = beatDur * 4;
      const bars = Math.max(1, Math.ceil((secn.end - secn.start) / barDur));

      for(let b=0; b<bars; b++){
        const barStart = secn.start + b * barDur;
        if(barStart >= song.duration) continue;
        const chord = palette.chords[(b + Math.floor(secn.start)) % palette.chords.length];

        if(isString){
          // String trio keeps sustained harmony; no empty silence.
          const celloRoot = chord.root;
          addGeneratedNote(notes, "cello", barStart, Math.min(barDur*.98, song.duration-barStart+.2), celloRoot, .52, {role:"continuous_cello_bed", chord:chord.name});
          addGeneratedNote(notes, "viola", barStart + beatDur*.04, Math.min(barDur*.92, song.duration-barStart+.2), chord.notes[1] || chord.root+7, .38, {role:"continuous_viola_bed", chord:chord.name});
          addGeneratedNote(notes, "violin", barStart + beatDur*.08, Math.min(barDur*.86, song.duration-barStart+.2), (chord.notes[3] || chord.root+12) + 12, .34, {role:"continuous_violin_bed", chord:chord.name});

          // Light melodic figure every other bar.
          if(b % 2 === 0 && secn.name !== "final_drop"){
            const pool = palette.scale;
            for(let k=0;k<4;k++){
              const t = barStart + k*beatDur + beatDur*.08;
              let m = pool[(k*2 + b) % pool.length];
              while(m < 72) m += 12;
              while(m > 84) m -= 12;
              addGeneratedNote(notes, "violin", t, beatDur*.62, m, .30, {role:"string_motif"});
            }
          }
          continue;
        }

        // Piano bed: at least one warm piano layer in every bar.
        const bedVel = (opts.mood === "lofi") ? .30 : .34;
        const dur1 = Math.min(beatDur*1.72, song.duration - barStart + .2);
        chord.notes.slice(0,4).forEach((m,i)=>{
          addGeneratedNote(notes, "piano", barStart + i*.012, dur1, m + (i>1 ? 12 : 0), bedVel, {role:"continuous_piano_bed", chord:chord.name});
        });

        // Second soft chord on beat 3, except during the final heavy landing.
        const t2 = barStart + beatDur*2;
        if(t2 < song.duration - .15 && secn.name !== "final_drop"){
          chord.notes.slice(1,5).forEach((m,i)=>{
            addGeneratedNote(notes, "piano", t2 + i*.010, Math.min(beatDur*1.25, song.duration-t2+.2), m + (i>1 ? 12 : 0), bedVel*.82, {role:"continuous_piano_bed_beat3", chord:chord.name});
          });
        }

        // Bass guarantee for jazz ensembles, to keep pulse present.
        if(ensemble !== "guitar_quartet" || rng() > .15){
          addGeneratedNote(notes, "bass", barStart, Math.min(beatDur*.92, song.duration-barStart+.2), chord.root, .56, {role:"bass_floor", chord:chord.name});
          if(barStart + beatDur*2 < song.duration) addGeneratedNote(notes, "bass", barStart+beatDur*2, Math.min(beatDur*.85, song.duration-barStart+.2), chord.root+7, .46, {role:"bass_floor", chord:chord.name});
        }

        // Ensemble-specific color.
        if(ensemble === "guitar_quartet" && secn.name !== "final_drop"){
          const gt = barStart + beatDur*.62;
          chord.notes.slice(0,4).forEach((m,i)=>addGeneratedNote(notes, "guitar", gt+i*.014, beatDur*.46, m+12, .23, {role:"guitar_quartet_chop", chord:chord.name}));
        }

        if((ensemble === "jazz_quartet" || ensemble === "brass_combo") && (secn.name === "climax" || secn.name === "drive" || secn.name === "busy")){
          const bt = barStart + beatDur*(rng()>.5 ? 1 : 3);
          chord.notes.slice(0,4).forEach((m,i)=>addGeneratedNote(notes, i%2 ? "trumpet" : "brass", bt+i*.012, beatDur*.85, m+12, ensemble === "brass_combo" ? .68 : .54, {role:"ensemble_brass_answer", chord:chord.name}));
        }

        // Final-drop no longer goes blank: it keeps a very low, quiet piano breath before the hit.
        if(secn.name === "final_drop"){
          const breath = Math.max(secn.start, barStart);
          if(breath < song.duration - .3){
            chord.notes.slice(0,3).forEach((m,i)=>{
              addGeneratedNote(notes, "piano", breath+i*.018, Math.min(beatDur*1.2, song.duration-breath+.2), m, .18, {role:"final_drop_breath", chord:chord.name});
            });
          }
        }
      }
    }
  }

  function makeOptions(){
    let seed = els.seed.value.trim();
    if(!seed){
      seed = String(Math.floor(Math.random()*99999999));
      els.seed.value = seed;
    }
    return {
      length: Number(els.length.value),
      difficulty: els.difficulty.value,
      mood: els.mood.value,
      motion: els.motion.value,
      seed,
      swing: Number(els.swing.value),
      quality: els.quality.value,
      ensemble: els.ensemble.value
    };
  }

  function loadScript(src){
    if(scriptCache.has(src)) return scriptCache.get(src);
    const p = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("音源載入失敗：" + src));
      document.head.appendChild(s);
    });
    scriptCache.set(src, p);
    return p;
  }

  async function ensureInstrument(instrument){
    if(window.MIDI.Soundfont[instrument]) return;
    const src = `${SAMPLE_BASE}${instrument}-mp3.js`;
    await loadScript(src);
    if(!window.MIDI.Soundfont[instrument]) throw new Error("找不到音源：" + instrument);
  }

  async function decodeDataUri(ctx, dataUri){
    const res = await fetch(dataUri);
    const arr = await res.arrayBuffer();
    return await ctx.decodeAudioData(arr.slice(0));
  }

  async function loadNeededSamples(ctx, data){
    const required = new Map();
    function add(inst, midi){
      const instrument = INSTRUMENTS[inst];
      if(!instrument) return;
      if(!required.has(instrument)) required.set(instrument, new Set());
      required.get(instrument).add(midi);
    }

    for(const n of data.notes) add(n.inst, n.midi);

    // sampled percussion notes. Several are intentionally fixed because those instruments are percussive one-shot fonts.
    for(const d of data.drums){
      if(d.kind === "kick") add("taiko", 36);
      if(d.kind === "snare") add("drum", 38);
      if(d.kind === "hat") add("wood", 76);
      if(d.kind === "ride") add("wood", 77);
      if(d.kind === "crash") add("cymbal", 60);
    }

    const sampleSets = {};
    for(const [instrument, midiSet] of required.entries()){
      await ensureInstrument(instrument);
      const sf = window.MIDI.Soundfont[instrument];
      const available = Object.keys(sf).map(name => ({name, midi:nameToMidi(name)})).filter(x => x.midi !== null);
      sampleSets[instrument] = {buffers:new Map(), available};

      for(const targetMidi of midiSet){
        const nearest = nearestSample(available, targetMidi);
        if(!nearest) continue;
        const key = `${instrument}:${nearest.name}`;
        if(!sampleCache.has(key)){
          const buffer = await decodeDataUri(ctx, sf[nearest.name]);
          sampleCache.set(key, buffer);
        }
        sampleSets[instrument].buffers.set(nearest.name, sampleCache.get(key));
      }
    }
    return sampleSets;
  }

  function nearestSample(available, targetMidi){
    let best = null;
    let bestDist = Infinity;
    for(const item of available){
      const d = Math.abs(item.midi - targetMidi);
      if(d < bestDist){
        best = item;
        bestDist = d;
      }
    }
    return best;
  }

  function makeOutputGraph(ctx, destination){
    const master = ctx.createGain();
    master.gain.value = .70;

    const dry = ctx.createGain();
    const wet = ctx.createGain();
    dry.gain.value = .86;
    wet.gain.value = .16;

    const reverb = ctx.createConvolver();
    reverb.buffer = makeImpulse(ctx, 1.25, 2.4);

    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -16;
    compressor.knee.value = 22;
    compressor.ratio.value = 3.8;
    compressor.attack.value = .012;
    compressor.release.value = .24;

    const low = ctx.createBiquadFilter();
    low.type = "lowshelf";
    low.frequency.value = 115;
    low.gain.value = 4.2;

    const highTame = ctx.createBiquadFilter();
    highTame.type = "highshelf";
    highTame.frequency.value = 5200;
    highTame.gain.value = -1.6;

    master.connect(dry);
    master.connect(reverb);
    reverb.connect(wet);

    dry.connect(low);
    wet.connect(low);
    low.connect(highTame);
    highTame.connect(compressor);
    compressor.connect(destination);
    return master;
  }

  function makeImpulse(ctx, seconds, decay){
    const length = Math.floor(ctx.sampleRate * seconds);
    const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0; i<length; i++){
        const tail = Math.pow(1 - i / length, decay);
        data[i] = (Math.random()*2 - 1) * tail * 0.55;
      }
    }
    return impulse;
  }

  function playSample(ctx, master, sampleSets, inst, midi, time, dur, vel, pan=0){
    const instrument = INSTRUMENTS[inst];
    if(!instrument || !sampleSets[instrument]) return;
    const set = sampleSets[instrument];
    const nearest = nearestSample(set.available, midi);
    if(!nearest) return;
    const buffer = set.buffers.get(nearest.name);
    if(!buffer) return;

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = Math.pow(2, (midi - nearest.midi) / 12);

    const g = ctx.createGain();
    const start = Math.max(0, time);
    const rel = releaseFor(inst);
    const end = Math.max(start + .04, time + dur + rel);
    const sustainEnd = Math.max(start + .02, time + dur);
    const peak = clamp(vel,0,1.4) * volumeFor(inst);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), start + attackFor(inst));
    g.gain.setValueAtTime(Math.max(.0002, peak * sustainFor(inst)), sustainEnd);
    g.gain.exponentialRampToValueAtTime(0.0001, end);

    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if(panner){
      panner.pan.value = pan;
      src.connect(g);
      g.connect(panner);
      panner.connect(master);
    }else{
      src.connect(g);
      g.connect(master);
    }

    const offset = 0;
    const playDur = Math.min(buffer.duration, Math.max(.08, dur + releaseFor(inst) + .08));
    src.start(start, offset, playDur);
  }

  function volumeFor(inst){
    if(inst === "bass") return .42;
    if(inst === "piano") return .31;
    if(inst === "guitar") return .15;
    if(inst === "brass") return .48;
    if(inst === "trumpet") return .52;
    if(inst === "violin") return .34;
    if(inst === "viola") return .34;
    if(inst === "cello") return .38;
    if(inst === "strings") return .30;
    if(inst === "taiko") return .28;
    if(inst === "drum") return .30;
    if(inst === "wood") return .12;
    if(inst === "cymbal") return .22;
    return .24;
  }

  function releaseFor(inst){
    if(inst === "piano") return .34;
    if(inst === "guitar") return .12;
    if(inst === "bass") return .08;
    if(inst === "brass" || inst === "trumpet") return .26;
    if(inst === "violin" || inst === "viola" || inst === "cello" || inst === "strings") return .38;
    if(inst === "cymbal") return .55;
    return .06;
  }

  function attackFor(inst){
    if(inst === "brass" || inst === "trumpet") return .022;
    if(inst === "violin" || inst === "viola" || inst === "cello" || inst === "strings") return .045;
    if(inst === "piano") return .010;
    if(inst === "bass") return .006;
    return .005;
  }

  function sustainFor(inst){
    if(inst === "piano") return .48;
    if(inst === "brass" || inst === "trumpet") return .68;
    if(inst === "violin" || inst === "viola" || inst === "cello" || inst === "strings") return .80;
    if(inst === "bass") return .72;
    return .45;
  }

  function scheduleSampleSong(ctx, destination, data, sampleSets){
    const master = makeOutputGraph(ctx, destination);

    for(const n of data.notes){
      let pan = 0;
      if(n.inst === "bass") pan = -.12;
      if(n.inst === "guitar") pan = .18;
      if(n.inst === "trumpet") pan = .12;
      if(n.inst === "brass") pan = -.06;
      if(n.inst === "violin") pan = .18;
      if(n.inst === "viola") pan = -.04;
      if(n.inst === "cello") pan = -.18;
      playSample(ctx, master, sampleSets, n.inst, n.midi, n.time, n.dur, n.vel, pan);
    }

    for(const d of data.drums){
      if(d.kind === "kick"){
        synthKick(ctx, master, d.time, d.vel*.98);
        playSample(ctx, master, sampleSets, "taiko", 36, d.time, .24, d.vel*.34, -.08);
      }else if(d.kind === "snare"){
        playSample(ctx, master, sampleSets, "drum", 38, d.time, .18, d.vel*.54, .04);
        synthNoise(ctx, master, d.time, .18, d.vel*.32, 850, 3600);
      }else if(d.kind === "hat"){
        playSample(ctx, master, sampleSets, "wood", 76, d.time, .06, d.vel*.30, .20);
        synthNoise(ctx, master, d.time, .045, d.vel*.035, 6500, 11000);
      }else if(d.kind === "ride"){
        playSample(ctx, master, sampleSets, "wood", 77, d.time, .09, d.vel*.28, .28);
        synthNoise(ctx, master, d.time, .08, d.vel*.028, 5000, 9000);
      }else if(d.kind === "crash"){
        playSample(ctx, master, sampleSets, "cymbal", 60, d.time, .85, d.vel*.55, .25);
        synthNoise(ctx, master, d.time, .62, d.vel*.18, 4200, 9500);
      }
    }
  }

  function synthKick(ctx, master, time, vel){
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(82, time);
    osc.frequency.exponentialRampToValueAtTime(32, time + .34);

    const click = ctx.createOscillator();
    click.type = "triangle";
    click.frequency.setValueAtTime(180, time);
    click.frequency.exponentialRampToValueAtTime(70, time + .06);

    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, time);
    g.gain.exponentialRampToValueAtTime(.19*vel, time+.008);
    g.gain.exponentialRampToValueAtTime(.0001, time+.42);

    const cg = ctx.createGain();
    cg.gain.setValueAtTime(.0001, time);
    cg.gain.exponentialRampToValueAtTime(.035*vel, time+.004);
    cg.gain.exponentialRampToValueAtTime(.0001, time+.07);

    osc.connect(g); g.connect(master);
    click.connect(cg); cg.connect(master);
    osc.start(time); osc.stop(time+.46);
    click.start(time); click.stop(time+.08);
  }

  function synthNoise(ctx, master, time, dur, vel, hp=1000, lp=8000){
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = Math.random()*2-1;

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const high = ctx.createBiquadFilter();
    high.type = "highpass";
    high.frequency.value = hp;
    const low = ctx.createBiquadFilter();
    low.type = "lowpass";
    low.frequency.value = lp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, time);
    g.gain.exponentialRampToValueAtTime(.08*vel, time+.004);
    g.gain.exponentialRampToValueAtTime(.0001, time+dur);
    src.connect(high); high.connect(low); low.connect(g); g.connect(master);
    src.start(time); src.stop(time+dur);
  }

  // Fast fallback renderer from 0.1-like synth engine
  function envGain(ctx, time, dur, peak, attack=.006, decay=.08, sustain=.45, release=.05){
    const g = ctx.createGain();
    const end = time + Math.max(.03, dur);
    const aEnd = time + attack;
    const dEnd = aEnd + decay;
    const rStart = Math.max(dEnd, end - release);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), aEnd);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak*sustain), dEnd);
    g.gain.setValueAtTime(Math.max(.0002, peak*sustain), rStart);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    return g;
  }

  function scheduleSynthSong(ctx, destination, data){
    const master = makeOutputGraph(ctx, destination);
    for(const n of data.notes){
      const osc = ctx.createOscillator();
      const freq = midiToHz(n.midi);
      osc.frequency.setValueAtTime(freq, n.time);
      osc.type = n.inst === "bass" ? "triangle" : n.inst === "guitar" ? "square" : n.inst === "piano" ? "triangle" : "sawtooth";
      const gain = envGain(ctx, n.time, n.dur, volumeFor(n.inst)*n.vel, .006, .06, .40, .08);
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = n.inst === "bass" ? 900 : n.inst === "guitar" ? 1600 : n.inst === "piano" ? 2600 : 1900;
      osc.connect(filter); filter.connect(gain); gain.connect(master);
      osc.start(n.time); osc.stop(n.time + n.dur + .12);
    }
    for(const d of data.drums){
      if(d.kind === "kick") synthKick(ctx, master, d.time, d.vel*.8);
      else synthNoise(ctx, master, d.time, d.kind === "crash" ? .55 : .12, d.vel*.24, d.kind === "snare" ? 900 : 4500, d.kind === "crash" ? 9000 : 7000);
    }
  }

  async function renderToAudioBuffer(data, sampleSets, useSamples){
    const sr = 44100;
    const ctx = new OfflineAudioContext(2, Math.ceil(sr * (data.song.duration + 1.4)), sr);
    if(useSamples) scheduleSampleSong(ctx, ctx.destination, data, sampleSets);
    else scheduleSynthSong(ctx, ctx.destination, data);
    return await ctx.startRendering();
  }

  function audioBufferToWavBlob(buffer){
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const length = buffer.length;
    const bytesPerSample = 2;
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = length * blockAlign;
    const ab = new ArrayBuffer(44 + dataSize);
    const view = new DataView(ab);

    function writeString(offset, str){
      for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i));
    }

    writeString(0, "RIFF");
    view.setUint32(4, 36 + dataSize, true);
    writeString(8, "WAVE");
    writeString(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeString(36, "data");
    view.setUint32(40, dataSize, true);

    const channels = [];
    for(let ch=0; ch<numChannels; ch++) channels.push(buffer.getChannelData(ch));

    let offset = 44;
    for(let i=0;i<length;i++){
      for(let ch=0; ch<numChannels; ch++){
        let s = clamp(channels[ch][i], -1, 1);
        s = s < 0 ? s * 0x8000 : s * 0x7fff;
        view.setInt16(offset, s, true);
        offset += 2;
      }
    }
    return new Blob([ab], {type:"audio/wav"});
  }


  function makeMidiBlob(data){
    const ppq = 480;
    const ticksPerSecond = 960; // MIDI tempo fixed at 120 BPM; preserves real-time duration.
    const events = [];

    function pushEvent(tick, bytes){
      events.push({tick:Math.max(0, Math.round(tick)), bytes});
    }

    const channelMap = {
      piano:0,
      bass:1,
      guitar:2,
      brass:3,
      trumpet:4,
      violin:5,
      viola:6,
      cello:7,
      strings:8
    };
    const programMap = {
      piano:0,       // acoustic grand
      bass:32,       // acoustic bass
      guitar:26,     // jazz guitar
      brass:61,      // brass section
      trumpet:56,    // trumpet
      violin:40,
      viola:41,
      cello:42,
      strings:48
    };

    // Tempo 120 BPM.
    pushEvent(0, [0xFF,0x51,0x03,0x07,0xA1,0x20]);
    // Track name
    pushEvent(0, metaText(0x03, "Rhythm Music Generator v0.4"));

    Object.keys(channelMap).forEach(inst=>{
      const ch = channelMap[inst];
      pushEvent(0, [0xC0 | ch, programMap[inst] || 0]);
      pushEvent(0, [0xB0 | ch, 7, 100]); // volume
      pushEvent(0, [0xB0 | ch, 10, ch === 1 ? 48 : ch === 2 ? 78 : 64]); // pan
    });

    for(const n of data.notes){
      const ch = channelMap[n.inst];
      if(ch === undefined) continue;
      const start = n.time * ticksPerSecond;
      const end = (n.time + Math.max(.06, n.dur)) * ticksPerSecond;
      const vel = Math.max(1, Math.min(120, Math.round((n.vel || .7) * 90)));
      pushEvent(start, [0x90 | ch, clampMidi(n.midi), vel]);
      pushEvent(end, [0x80 | ch, clampMidi(n.midi), 0]);
    }

    const drumMap = {kick:36, snare:38, hat:42, ride:51, crash:49};
    for(const d of data.drums){
      const midi = drumMap[d.kind];
      if(!midi) continue;
      const start = d.time * ticksPerSecond;
      const end = start + (d.kind === "crash" ? .65 : .12) * ticksPerSecond;
      const vel = Math.max(1, Math.min(120, Math.round((d.vel || .7) * 95)));
      pushEvent(start, [0x99, midi, vel]);
      pushEvent(end, [0x89, midi, 0]);
    }

    events.sort((a,b)=>a.tick-b.tick || eventOrder(a.bytes)-eventOrder(b.bytes));
    const track = [];
    let lastTick = 0;
    for(const e of events){
      writeVarLen(track, e.tick - lastTick);
      track.push(...e.bytes);
      lastTick = e.tick;
    }
    writeVarLen(track, 0);
    track.push(0xFF,0x2F,0x00);

    const header = [
      ...strBytes("MThd"), 0x00,0x00,0x00,0x06,
      0x00,0x00, // format 0
      0x00,0x01, // one track
      (ppq >> 8) & 255, ppq & 255
    ];
    const body = [
      ...strBytes("MTrk"),
      (track.length >>> 24) & 255,
      (track.length >>> 16) & 255,
      (track.length >>> 8) & 255,
      track.length & 255,
      ...track
    ];
    return new Blob([new Uint8Array([...header, ...body])], {type:"audio/midi"});
  }

  function eventOrder(bytes){
    const s = bytes[0] & 0xF0;
    if(s === 0x80) return 0;
    if(s === 0x90) return 1;
    return 2;
  }

  function clampMidi(n){ return Math.max(0, Math.min(127, Math.round(n))); }
  function strBytes(s){ return Array.from(s).map(c=>c.charCodeAt(0)); }

  function metaText(type, text){
    const bytes = strBytes(text);
    const out = [0xFF,type];
    writeVarLen(out, bytes.length);
    out.push(...bytes);
    return out;
  }

  function writeVarLen(out, value){
    value = Math.max(0, Math.round(value));
    let buffer = value & 0x7F;
    while((value >>= 7)){
      buffer <<= 8;
      buffer |= ((value & 0x7F) | 0x80);
    }
    while(true){
      out.push(buffer & 0xFF);
      if(buffer & 0x80) buffer >>= 8;
      else break;
    }
  }

  function drawViz(song){
    const canvas = els.viz;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#080b10";
    ctx.fillRect(0,0,w,h);

    song.sections.forEach((s,i)=>{
      const x = s.start / song.duration * w;
      const ww = (s.end - s.start) / song.duration * w;
      ctx.fillStyle = i%2 ? "rgba(255,255,255,.04)" : "rgba(255,255,255,.02)";
      ctx.fillRect(x,0,ww,h);
      ctx.fillStyle = "rgba(238,243,249,.60)";
      ctx.font = "20px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(s.name, x+10, 28);
      ctx.font = "14px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(String(s.bpm) + " BPM", x+10, 48);
    });

    ctx.strokeStyle = "rgba(255,255,255,.08)";
    for(let i=0;i<=10;i++){
      const x = i/10*w;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }

    song.events.forEach(e=>{
      const x = e.time / song.duration * w;
      let y = h*.74;
      if(e.lane === "left") y = h*.62;
      if(e.lane === "right") y = h*.84;
      if(e.type.startsWith("hold")) y = h*.50;
      if(e.type === "finalTap") y = h*.38;
      ctx.beginPath();
      ctx.arc(x,y,e.type === "finalTap" ? 7 : 4,0,Math.PI*2);
      ctx.fillStyle = e.type === "finalTap" ? "#ff7b72" : e.type.startsWith("hold") ? "#7ee787" : "#f7c948";
      ctx.fill();
    });

    ctx.fillStyle = "rgba(238,243,249,.74)";
    ctx.font = "14px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("節奏點視覺化", 12, h-16);
  }

  function setBusy(busy, msg){
    els.generateBtn.disabled = busy;
    els.randomSeedBtn.disabled = busy;
    els.downloadWavBtn.disabled = busy || !current.wavBlob;
    els.downloadMidiBtn.disabled = busy || !current.midiBlob;
    els.downloadJsonBtn.disabled = busy || !current.song;
    els.status.textContent = msg;
  }

  function stopProgress(){
    if(current.raf) cancelAnimationFrame(current.raf);
    current.raf = null;
  }
  function startProgress(){
    stopProgress();
    const audio = els.audio;
    function tick(){
      if(audio.duration && !audio.paused){
        els.progressBar.style.width = clamp(audio.currentTime / audio.duration * 100, 0, 100) + "%";
      }
      current.raf = requestAnimationFrame(tick);
    }
    tick();
  }

  function cleanupUrls(){
    if(current.wavUrl) URL.revokeObjectURL(current.wavUrl);
    current.wavUrl = null;
  }

  async function generate(){
    cleanupUrls();
    stopProgress();
    els.progressBar.style.width = "0%";
    current.wavBlob = null;
    current.midiBlob = null;
    current.song = null;
    current.rawData = null;
    els.downloadWavBtn.disabled = true;
    els.downloadMidiBtn.disabled = true;
    els.downloadJsonBtn.disabled = true;
    els.stopBtn.disabled = true;

    const opts = makeOptions();
    setBusy(true, "正在產生樂曲與節奏點……");
    await new Promise(r=>setTimeout(r,40));
    const data = buildSongData(opts);
    current.song = data.song;
    current.rawData = data;
    drawViz(data.song);

    const useSamples = opts.quality === "sampled";
    let sampleSets = null;

    try{
      if(useSamples){
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
        setBusy(true, "正在載入真實樂器音源。第一次會比較慢……");
        sampleSets = await loadNeededSamples(audioCtx, data);
      }

      setBusy(true, "正在渲染 WAV……");
      await new Promise(r=>setTimeout(r,40));
      const buffer = await renderToAudioBuffer(data, sampleSets, useSamples);
      current.audioBuffer = buffer;
      current.wavBlob = audioBufferToWavBlob(buffer);
      current.midiBlob = makeMidiBlob(data);
      current.wavUrl = URL.createObjectURL(current.wavBlob);

      const jsonText = JSON.stringify(data.song, null, 2);
      current.jsonBlob = new Blob([jsonText], {type:"application/json"});

      els.audio.src = current.wavUrl;
      els.audio.load();

      els.downloadWavBtn.disabled = false;
      els.downloadMidiBtn.disabled = false;
      els.downloadJsonBtn.disabled = false;
      els.stopBtn.disabled = false;
      setBusy(false, "生成完成，正在播放。");

      try{
        await els.audio.play();
      }catch(err){
        els.status.textContent = "生成完成。瀏覽器阻擋自動播放，請按播放列一次。";
      }
    }catch(err){
      console.error(err);
      if(useSamples){
        setBusy(true, "真實樂器音源載入失敗，改用快速合成備援……");
        await new Promise(r=>setTimeout(r,60));
        const buffer = await renderToAudioBuffer(data, null, false);
        current.audioBuffer = buffer;
        current.wavBlob = audioBufferToWavBlob(buffer);
        current.midiBlob = makeMidiBlob(data);
        current.wavUrl = URL.createObjectURL(current.wavBlob);
        current.jsonBlob = new Blob([JSON.stringify(data.song, null, 2)], {type:"application/json"});
        els.audio.src = current.wavUrl;
        els.audio.load();
        els.downloadWavBtn.disabled = false;
        els.downloadMidiBtn.disabled = false;
        els.downloadJsonBtn.disabled = false;
        els.stopBtn.disabled = false;
        setBusy(false, "真實音源無法載入，已用合成備援生成並播放。");
        try{ await els.audio.play(); }catch(e){}
      }else{
        setBusy(false, "生成失敗：" + (err && err.message ? err.message : err));
      }
    }
  }

  function randomSeed(){
    els.seed.value = String(Math.floor(Math.random()*99999999));
  }

  function downloadBlob(blob, filename){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }

  els.generateBtn.addEventListener("click", generate);
  els.randomSeedBtn.addEventListener("click", () => { randomSeed(); generate(); });
  els.stopBtn.addEventListener("click", () => {
    els.audio.pause();
    els.audio.currentTime = 0;
    els.progressBar.style.width = "0%";
  });
  els.downloadWavBtn.addEventListener("click", () => {
    if(current.wavBlob && current.song) downloadBlob(current.wavBlob, `rhythm_music_v04_${current.song.seed}.wav`);
  });
  els.downloadMidiBtn.addEventListener("click", () => {
    if(current.midiBlob && current.song) downloadBlob(current.midiBlob, `rhythm_music_v04_${current.song.seed}.mid`);
  });
  els.downloadJsonBtn.addEventListener("click", () => {
    if(current.song){
      const blob = new Blob([JSON.stringify(current.song, null, 2)], {type:"application/json"});
      downloadBlob(blob, `rhythm_music_v04_${current.song.seed}.json`);
    }
  });
  els.audio.addEventListener("play", startProgress);
  els.audio.addEventListener("pause", stopProgress);
  els.audio.addEventListener("ended", () => {
    stopProgress();
    els.progressBar.style.width = "100%";
  });

  drawViz({duration:60, sections:[{name:"未生成", start:0, end:60, bpm:"—"}], events:[]});
})();
</script>
</body>
