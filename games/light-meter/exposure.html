<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>曝光計算機</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0b0c;
    --tile:#151518;
    --line:#2a2a2f;
    --text:#f3f3f3;
    --muted:#a9a9a9;
    --accent:#5aa7ff;
  }
  html,body{height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,Arial,sans-serif;}
  .app{
    height:100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  h2{
    margin:0;
    font-size:16px; /* H2 但維持小，讓畫面留給數值 */
    font-weight:700;
    letter-spacing:.5px;
    color:var(--muted);
  }
  .grid{
    flex:1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap:10px;
  }
  .tile{
    background:var(--tile);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:10px;
  }
  .top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .label{
    font-size:11px;
    color:var(--muted);
    letter-spacing:.4px;
  }
  .tiny{
    font-size:10px;
    color:var(--muted);
    text-align:right;
    white-space:nowrap;
  }
  .value{
    font-size:40px;         /* 數值最大 */
    font-weight:800;
    line-height:1.05;
    letter-spacing:.2px;
  }
  .subvalue{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  input[type="range"]{
    width:100%;
    accent-color: var(--accent);
  }
  .footer{
    font-size:10px;
    color:var(--muted);
    line-height:1.35;
  }
  .btnrow{
    display:flex; gap:8px; justify-content:flex-end;
  }
  button{
    border:1px solid var(--line);
    background:rgba(255,255,255,.06);
    color:var(--text);
    border-radius:12px;
    padding:8px 10px;
    font-size:12px;
  }
</style>
</head>
<body>
<div class="app">
  <h2>曝光計算機</h2>

  <div class="grid">
    <!-- Shutter -->
    <div class="tile" id="tileSh">
      <div class="top">
        <div class="label">快門</div>
        <div class="tiny" id="shNote"></div>
      </div>
      <div>
        <div class="value" id="shVal">—</div>
        <div class="subvalue" id="shExact"></div>
      </div>
      <input id="shSlider" type="range" min="0" max="10" step="1" value="6" />
    </div>

    <!-- Aperture -->
    <div class="tile" id="tileAp">
      <div class="top">
        <div class="label">光圈</div>
        <div class="tiny" id="apNote"></div>
      </div>
      <div>
        <div class="value" id="apVal">f/1.4</div>
        <div class="subvalue" id="apExact"></div>
      </div>
      <input id="apSlider" type="range" min="0" max="0" step="1" value="0" />
    </div>

    <!-- EV -->
    <div class="tile" id="tileEV">
      <div class="top">
        <div class="label">EV</div>
        <div class="tiny">可到 0.1</div>
      </div>
      <div>
        <div class="value" id="evVal">8.0</div>
        <div class="subvalue">預設：室內 EV 8</div>
      </div>
      <input id="evSlider" type="range" min="-2.0" max="20.0" step="0.1" value="8.0" />
    </div>

    <!-- ISO -->
    <div class="tile" id="tileISO">
      <div class="top">
        <div class="label">ISO</div>
        <div class="tiny" id="isoNote">變更 ISO：優先常用快門</div>
      </div>
      <div>
        <div class="value" id="isoVal">100</div>
        <div class="subvalue" id="isoExact"></div>
      </div>
      <input id="isoSlider" type="range" min="0" max="0" step="1" value="0" />
    </div>
  </div>

  <div class="btnrow">
    <button id="resetBtn" type="button">重置</button>
  </div>

  <div class="footer">
    公式：EV = log₂(N² / t) − log₂(ISO / 100)；N=f-number；t=秒。<br/>
    操作：動光圈→算快門；動快門→算光圈；動 ISO → 優先吸附常用快門再算光圈。
  </div>
</div>

<script>
(() => {
  // ---- math ----
  const log2 = x => Math.log(x)/Math.log(2);
  const pow2 = x => Math.pow(2,x);

  // EV = log2(N^2/t) - log2(ISO/100)
  function calcT(N, EV, ISO){
    return (N*N) / pow2(EV + log2(ISO/100));
  }
  function calcN(t, EV, ISO){
    return Math.sqrt(t * pow2(EV + log2(ISO/100)));
  }

  // ---- discrete sets ----
  // Leica M-A standard shutter speeds (no >1s here)
  const SH_MA_FAST = [1, 1/2, 1/4, 1/8, 1/15, 1/30, 1/60, 1/125, 1/250, 1/500, 1/1000];
  // Only enable when ISO < 100
  const SH_SLOW = [2, 4, 8, 15, 30];

  // common apertures (include 1.4)
  const AP_LIST = [1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22];

  // ISO list (include low values)
  const ISO_LIST = [3, 6, 12, 25, 50, 100, 200, 400, 800];

  // ---- UI refs ----
  const shSlider = document.getElementById('shSlider');
  const apSlider = document.getElementById('apSlider');
  const evSlider = document.getElementById('evSlider');
  const isoSlider= document.getElementById('isoSlider');

  const shVal = document.getElementById('shVal');
  const apVal = document.getElementById('apVal');
  const evVal = document.getElementById('evVal');
  const isoVal= document.getElementById('isoVal');

  const shExact= document.getElementById('shExact');
  const apExact= document.getElementById('apExact');
  const isoExact=document.getElementById('isoExact');

  const shNote = document.getElementById('shNote');
  const apNote = document.getElementById('apNote');

  // last “direction”: 'ap' means user was adjusting aperture to get shutter; 'sh' means user was adjusting shutter to get aperture.
  let lastMode = 'ap';

  function fmtShutter(t){
    if (t >= 1) return `${t}s`;
    return `1/${Math.round(1/t)}`;
  }
  function fmtAperture(n){
    const s = (Math.round(n*10)/10).toString().replace(/\.0$/,'');
    return `f/${s}`;
  }
  function nearestIndex(value, arr){
    let bestI = 0;
    let bestD = Math.abs(arr[0]-value);
    for (let i=1;i<arr.length;i++){
      const d = Math.abs(arr[i]-value);
      if (d < bestD){ bestD = d; bestI = i; }
    }
    return bestI;
  }

  function getShutterList(ISO){
    return (ISO < 100) ? SH_MA_FAST.concat(SH_SLOW) : SH_MA_FAST.slice();
  }

  function syncRanges(){
    // Aperture slider setup
    apSlider.min = 0;
    apSlider.max = AP_LIST.length - 1;
    apSlider.step = 1;

    // ISO slider setup
    isoSlider.min = 0;
    isoSlider.max = ISO_LIST.length - 1;
    isoSlider.step = 1;
  }

  function setDefaults(){
    // EV preset indoor 8.0
    evSlider.value = "8.0";
    // ISO preset 100
    isoSlider.value = String(ISO_LIST.indexOf(100));
    // aperture preset 1.4
    apSlider.value = String(AP_LIST.indexOf(1.4));

    // choose a reasonable initial shutter for EV8, f1.4, ISO100
    const EV = parseFloat(evSlider.value);
    const ISO = ISO_LIST[parseInt(isoSlider.value,10)];
    const N = AP_LIST[parseInt(apSlider.value,10)];
    const tExact = calcT(N, EV, ISO);
    const shList = getShutterList(ISO);
    const i = nearestIndex(tExact, shList);
    shSlider.min = 0;
    shSlider.max = shList.length - 1;
    shSlider.step = 1;
    shSlider.value = String(i);
    lastMode = 'ap';
  }

  function render(){
    const EV = parseFloat(evSlider.value);
    const ISO = ISO_LIST[parseInt(isoSlider.value,10)];
    const shList = getShutterList(ISO);

    // update shutter slider range if ISO threshold changed
    const prevMax = parseInt(shSlider.max,10);
    const newMax = shList.length - 1;
    if (prevMax !== newMax){
      shSlider.max = String(newMax);
      // keep current shutter value in-range
      const cur = Math.min(parseInt(shSlider.value,10), newMax);
      shSlider.value = String(cur);
    }

    const sh = shList[parseInt(shSlider.value,10)];
    const N  = AP_LIST[parseInt(apSlider.value,10)];

    // display
    evVal.textContent  = EV.toFixed(1);
    isoVal.textContent = String(ISO);
    apVal.textContent  = fmtAperture(N);
    shVal.textContent  = fmtShutter(sh);

    // small exact info (keep minimal)
    shExact.textContent = `t = ${sh.toFixed(5)} s`;
    apExact.textContent = `N = ${N.toFixed(2)}`;
    isoExact.textContent = (ISO < 100) ? `ISO<100：開放 >1s 檔位` : `ISO≥100：僅 M-A 檔位`;

    shNote.textContent = (ISO < 100) ? `含 2–30s` : `≤1s`;
    apNote.textContent = (lastMode === 'ap') ? `動光圈→算快門` : `動快門→算光圈`;
  }

  function solveFromAperture(){
    // user moved aperture -> compute shutter (snap to Leica list)
    const EV = parseFloat(evSlider.value);
    const ISO = ISO_LIST[parseInt(isoSlider.value,10)];
    const N = AP_LIST[parseInt(apSlider.value,10)];

    const tExact = calcT(N, EV, ISO);
    const shList = getShutterList(ISO);
    const i = nearestIndex(tExact, shList);

    shSlider.max = String(shList.length - 1);
    shSlider.value = String(i);
    lastMode = 'ap';
    render();
  }

  function solveFromShutter(){
    // user moved shutter -> compute aperture (snap to AP list)
    const EV = parseFloat(evSlider.value);
    const ISO = ISO_LIST[parseInt(isoSlider.value,10)];
    const shList = getShutterList(ISO);
    const t = shList[parseInt(shSlider.value,10)];

    const nExact = calcN(t, EV, ISO);
    const i = nearestIndex(nExact, AP_LIST);
    apSlider.value = String(i);
    lastMode = 'sh';
    render();
  }

  function onISOChange(){
    // rule: ISO changed -> prioritize common shutter
    // We keep current shutter at nearest Leica detent (already detents), then compute aperture.
    const ISO = ISO_LIST[parseInt(isoSlider.value,10)];
    const shList = getShutterList(ISO);

    // ensure shutter index exists; keep closest shutter time if list changed length
    const currentShownSh = shList[Math.min(parseInt(shSlider.value,10), shList.length-1)];
    const iSh = nearestIndex(currentShownSh, shList);
    shSlider.max = String(shList.length - 1);
    shSlider.value = String(iSh);

    // now compute aperture from this shutter (EV fixed)
    solveFromShutter();
  }

  function onEVChange(){
    // EV changed -> follow lastMode: if lastMode=='ap' then compute shutter from current aperture,
    // else compute aperture from current shutter.
    if (lastMode === 'ap') solveFromAperture();
    else solveFromShutter();
  }

  // ---- events ----
  syncRanges();
  setDefaults();
  render();

  apSlider.addEventListener('input', solveFromAperture);
  shSlider.addEventListener('input', solveFromShutter);
  isoSlider.addEventListener('input', onISOChange);
  evSlider.addEventListener('input', onEVChange);

  document.getElementById('resetBtn').addEventListener('click', () => {
    setDefaults();
    render();
  });
})();
</script>
</body>
</html>
