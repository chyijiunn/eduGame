<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>手機測光器 v0.1</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:rgba(10,14,20,.72);
      --text:#e8eef6;
      --muted:#9fb0c3;
      --line:rgba(255,255,255,.12);
      --accent:#ffffff;
      --good:#b9ffb3;
      --warn:#ffe28a;
      --bad:#ffb3b3;
      --pad:14px;
      --radius:16px;
    }
    html,body{height:100%; background:var(--bg); color:var(--text); margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
    .app{max-width:980px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 14px);}

    .hero{
      position:relative;
      border-radius:24px;
      overflow:hidden;
      background:#111;
      border:1px solid var(--line);
      height:min(56vh, 520px);
    }
    video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1);} /* mirror for user familiarity; disable if you prefer */
    .overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;}
    .ev{
      text-align:center;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.14);
      border-radius:26px;
      padding:16px 18px;
      min-width: 160px;
    }
    .ev .label{font-size:12px; letter-spacing:.12em; color:var(--muted); margin-bottom:8px;}
    .ev .value{font-size:72px; font-weight:750; line-height:1; margin:0;}
    .ev .sub{margin-top:10px; font-size:13px; color:var(--muted); display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
    .pill{border:1px solid rgba(255,255,255,.14); padding:6px 10px; border-radius:999px; background:rgba(0,0,0,.18);}

    .roi{
      position:absolute;
      left:50%; top:50%;
      width:40%; height:40%;
      transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.70);
      border-radius:14px;
      box-shadow:0 0 0 2000px rgba(0,0,0,.10) inset;
      pointer-events:none;
      display:none;
    }

    .controls{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    .card{
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.04);
      overflow:hidden;
    }
    .card .hd{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px var(--pad);
      border-bottom:1px solid var(--line);
      background: rgba(255,255,255,.03);
    }
    .card .hd .title{font-weight:650;}
    .card .bd{padding:12px var(--pad);}

    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    .btn{
      appearance:none; border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.18); color:var(--text);
      padding:10px 12px; border-radius:12px; font-weight:650; cursor:pointer;
    }
    .btn:active{transform:translateY(1px);}
    .btn.primary{background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.24);}
    .btn.toggle[aria-pressed="true"]{background:rgba(255,255,255,.20); border-color:rgba(255,255,255,.28);}
    .btn:disabled{opacity:.55; cursor:not-allowed;}
    .kv{
      display:grid;
      grid-template-columns: 120px 1fr 70px;
      gap:10px;
      align-items:center;
    }
    .kv label{color:var(--muted); font-size:13px;}
    input[type="range"]{width:100%;}
    input[type="number"]{
      width:100%;
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.16);
      border-radius:10px;
      color:var(--text);
      padding:10px 10px;
      font-weight:650;
    }
    .hint{color:var(--muted); font-size:12.5px; line-height:1.45; margin-top:10px;}

    table{
      width:100%;
      border-collapse:collapse;
      font-variant-numeric: tabular-nums;
    }
    th,td{padding:10px 10px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left;}
    th{color:var(--muted); font-weight:650; font-size:12.5px; letter-spacing:.06em;}
    td{font-weight:650;}
    .right{text-align:right;}
    .muted{color:var(--muted); font-weight:600;}
    .badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.16);
      color: var(--muted);
      font-size:12px;
    }
    .dot{width:8px; height:8px; border-radius:50%; background:var(--warn); display:inline-block;}
    .dot.ok{background:var(--good);}
    .dot.bad{background:var(--bad);}

    canvas{display:none;}
    @media (min-width: 860px){
      .controls{grid-template-columns: 1fr 1fr;}
      .hero{height:min(62vh, 580px);}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero" id="hero">
      <video id="video" playsinline muted></video>
      <div class="roi" id="roi"></div>
      <div class="overlay">
        <div class="ev" aria-live="polite">
          <div class="label">EV（四捨五入）</div>
          <p class="value" id="evInt">--</p>
          <div class="sub">
            <span class="pill" id="modePill">平均測光</span>
            <span class="pill">ISO <span id="isoShow">100</span></span>
            <span class="pill">偏移 <span id="offShow">0.0</span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="card">
        <div class="hd">
          <div class="title">控制</div>
          <div class="badge" id="statusBadge"><span class="dot" id="statusDot"></span><span id="statusText">尚未開啟相機</span></div>
        </div>
        <div class="bd">
          <div class="row" style="margin-bottom:10px;">
            <button class="btn primary" id="btnStart">開啟相機</button>
            <button class="btn" id="btnStop" disabled>停止</button>
            <button class="btn toggle" id="btnModeAvg" aria-pressed="true" title="以整個畫面平均亮度估算">平均測光</button>
            <button class="btn toggle" id="btnModeCenter" aria-pressed="false" title="以中央方框區域估算">中央重點</button>
          </div>

          <div class="kv">
            <label for="iso">ISO</label>
            <input id="iso" type="range" min="50" max="6400" step="50" value="100" />
            <input id="isoNum" type="number" min="50" max="6400" step="50" value="100" />
          </div>

          <div class="kv" style="margin-top:10px;">
            <label for="offset">校準偏移（EV）</label>
            <input id="offset" type="range" min="-8" max="8" step="0.1" value="0" />
            <input id="offsetNum" type="number" min="-8" max="8" step="0.1" value="0" />
          </div>

          <div class="hint">
            說明：本工具以相機畫面亮度「估算」EV。不同手機、HDR/自動曝光、螢幕內容都會影響讀值。若需要更準確，請用「校準偏移」對照你熟悉的相機測光或一張灰卡進行校準。<br/>
            使用限制：必須在 <span class="muted">HTTPS</span> 或 <span class="muted">localhost</span> 才能呼叫相機權限（GitHub Pages 可用）。
          </div>
        </div>
      </div>

      <div class="card">
        <div class="hd">
          <div class="title">建議光圈 / 快門（依 ISO）</div>
          <div class="muted" id="ev100Line">EV100：--（估算）</div>
        </div>
        <div class="bd">
          <table>
            <thead>
              <tr>
                <th>光圈</th>
                <th class="right">建議快門</th>
              </tr>
            </thead>
            <tbody id="comboBody">
              <tr><td class="muted">--</td><td class="right muted">--</td></tr>
            </tbody>
          </table>
          <div class="hint">
            計算式：<span class="muted">t = N² / (2^EV100 × ISO/100)</span>。表格快門為「接近的常用檔位」。
          </div>
        </div>
      </div>
    </div>

    <canvas id="c"></canvas>
  </div>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const evIntEl = document.getElementById('evInt');
  const isoEl = document.getElementById('iso');
  const isoNumEl = document.getElementById('isoNum');
  const isoShowEl = document.getElementById('isoShow');

  const offsetEl = document.getElementById('offset');
  const offsetNumEl = document.getElementById('offsetNum');
  const offShowEl = document.getElementById('offShow');

  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnModeAvg = document.getElementById('btnModeAvg');
  const btnModeCenter = document.getElementById('btnModeCenter');
  const modePill = document.getElementById('modePill');
  const roi = document.getElementById('roi');

  const comboBody = document.getElementById('comboBody');
  const ev100Line = document.getElementById('ev100Line');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let stream = null;
  let running = false;
  let mode = localStorage.getItem('lm_mode') || 'avg'; // 'avg' | 'center'
  let iso = Number(localStorage.getItem('lm_iso') || 100);
  let offset = Number(localStorage.getItem('lm_offset') || 0);

  // A very rough base constant. You should calibrate.
  // EV100 ≈ log2(luminance_linear) + K + offset
  // For typical phone video frames, K between ~6 to ~10 is common.
  const BASE_K = 8.2;

  function setStatus(kind, text){
    statusText.textContent = text;
    statusDot.classList.remove('ok','bad');
    if(kind==='ok') statusDot.classList.add('ok');
    if(kind==='bad') statusDot.classList.add('bad');
  }

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function formatShutter(t){
    // t in seconds
    if (!isFinite(t) || t <= 0) return '--';
    if (t >= 1) {
      // round to nice values (1,2,4,8,15,30)
      const nice = [1,2,4,8,15,30];
      let best = nice[0], bestErr = Math.abs(Math.log2(t/best));
      for (const n of nice){
        const err = Math.abs(Math.log2(t/n));
        if (err < bestErr){ bestErr = err; best = n; }
      }
      return best + 's';
    } else {
      const denomNice = [8000,4000,2000,1000,500,250,125,60,30,15,8,4,2];
      let best = denomNice[0], bestErr = Infinity;
      for (const d of denomNice){
        const cand = 1/d;
        const err = Math.abs(Math.log2(t/cand));
        if (err < bestErr){ bestErr = err; best = d; }
      }
      return '1/' + best;
    }
  }

  const apertures = [1.4, 2, 2.8, 4, 5.6, 8, 11, 16];

  function updateCombos(ev100){
    if (!isFinite(ev100)){
      comboBody.innerHTML = `<tr><td class="muted">--</td><td class="right muted">--</td></tr>`;
      ev100Line.textContent = 'EV100：--（估算）';
      return;
    }
    ev100Line.textContent = `EV100：${ev100.toFixed(1)}（估算）`;

    const S = iso;
    const isoFactor = S/100;

    let rows = '';
    for (const N of apertures){
      const t = (N*N) / (Math.pow(2, ev100) * isoFactor);
      rows += `<tr><td>f/${N}</td><td class="right">${formatShutter(t)}</td></tr>`;
    }
    comboBody.innerHTML = rows;
  }

  function srgbToLinear(c){
    // c: 0..1
    if (c <= 0.04045) return c / 12.92;
    return Math.pow((c + 0.055) / 1.055, 2.4);
  }

  function computeLuminance(imageData, x0, y0, w, h){
    const data = imageData.data;
    const width = imageData.width;

    let sum = 0;
    let count = 0;

    // Sample every 2 pixels for speed (adaptive downscale already)
    const step = 2;
    for (let y = y0; y < y0 + h; y += step){
      let idx = (y * width + x0) * 4;
      for (let x = x0; x < x0 + w; x += step){
        const r = srgbToLinear(data[idx] / 255);
        const g = srgbToLinear(data[idx+1] / 255);
        const b = srgbToLinear(data[idx+2] / 255);
        // relative luminance (linear)
        const Y = 0.2126*r + 0.7152*g + 0.0722*b;
        sum += Y;
        count++;
        idx += 4 * step;
      }
    }
    return count ? (sum / count) : NaN;
  }

  function luminanceToEV100(lum){
    // Guard
    lum = clamp(lum, 1e-6, 1);
    const ev = (Math.log(lum) / Math.log(2)) + BASE_K + offset;
    return ev;
  }

  let lastTick = 0;
  function tick(ts){
    if (!running) return;
    if (!video.videoWidth || !video.videoHeight) {
      requestAnimationFrame(tick);
      return;
    }

    // Throttle ~8 fps
    if (ts - lastTick < 125) { requestAnimationFrame(tick); return; }
    lastTick = ts;

    // Downscale for speed
    const target = 96;
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const aspect = vw / vh;
    let cw = target, ch = target;
    if (aspect >= 1) { ch = target; cw = Math.round(target * aspect); }
    else { cw = target; ch = Math.round(target / aspect); }

    canvas.width = cw;
    canvas.height = ch;

    // Draw current frame
    ctx.drawImage(video, 0, 0, cw, ch);
    const img = ctx.getImageData(0, 0, cw, ch);

    let x0 = 0, y0 = 0, w = cw, h = ch;
    if (mode === 'center'){
      const sideW = Math.round(cw * 0.40);
      const sideH = Math.round(ch * 0.40);
      x0 = Math.round((cw - sideW)/2);
      y0 = Math.round((ch - sideH)/2);
      w = sideW; h = sideH;
    }
    const lum = computeLuminance(img, x0, y0, w, h);
    const ev100 = luminanceToEV100(lum);

    const evRounded = Math.round(ev100);
    evIntEl.textContent = String(evRounded);

    updateCombos(ev100);

    requestAnimationFrame(tick);
  }

  async function startCamera(){
    try{
      setStatus('', '請求相機權限…');
      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
      running = true;
      btnStart.disabled = true;
      btnStop.disabled = false;
      setStatus('ok', '相機運作中');
      requestAnimationFrame(tick);
    } catch (e){
      console.error(e);
      setStatus('bad', '無法開啟相機（請確認 HTTPS 與權限）');
      alert('無法開啟相機。請確認：\n1) 網站在 HTTPS/localhost\n2) 已允許相機權限\n3) 不是在內嵌瀏覽器限制環境（可改用 Safari/Chrome 直接開）');
    }
  }

  function stopCamera(){
    running = false;
    btnStart.disabled = false;
    btnStop.disabled = true;
    if (stream){
      for (const t of stream.getTracks()) t.stop();
      stream = null;
    }
    video.srcObject = null;
    setStatus('', '已停止');
  }

  function setMode(next){
    mode = next;
    localStorage.setItem('lm_mode', mode);
    const isAvg = (mode === 'avg');
    btnModeAvg.setAttribute('aria-pressed', String(isAvg));
    btnModeCenter.setAttribute('aria-pressed', String(!isAvg));
    modePill.textContent = isAvg ? '平均測光' : '中央重點測光';
    roi.style.display = isAvg ? 'none' : 'block';
  }

  function setISO(val){
    iso = clamp(Number(val || 100), 50, 6400);
    isoEl.value = iso;
    isoNumEl.value = iso;
    isoShowEl.textContent = iso;
    localStorage.setItem('lm_iso', String(iso));
  }

  function setOffset(val){
    offset = clamp(Number(val || 0), -8, 8);
    offsetEl.value = offset;
    offsetNumEl.value = offset;
    offShowEl.textContent = offset.toFixed(1);
    localStorage.setItem('lm_offset', String(offset));
  }

  // Wire UI
  btnStart.addEventListener('click', startCamera);
  btnStop.addEventListener('click', stopCamera);

  btnModeAvg.addEventListener('click', () => setMode('avg'));
  btnModeCenter.addEventListener('click', () => setMode('center'));

  isoEl.addEventListener('input', (e) => setISO(e.target.value));
  isoNumEl.addEventListener('change', (e) => setISO(e.target.value));

  offsetEl.addEventListener('input', (e) => setOffset(e.target.value));
  offsetNumEl.addEventListener('change', (e) => setOffset(e.target.value));

  // Init
  setMode(mode);
  setISO(iso);
  setOffset(offset);
  setStatus('', '尚未開啟相機');

  // Safety: stop camera when leaving
  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
