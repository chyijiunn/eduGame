<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣股市模擬交易系統 v0.22</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
    body {
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 16px;
      background: linear-gradient(90deg, #0f172a, #1e293b);
      border-bottom: 1px solid #1f2937;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fbbf24;
      margin-right: 12px;
    }
    .header-info {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 0.85rem;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: #111827;
      border: 1px solid #374151;
      font-size: 0.75rem;
    }
    .index-value {
      font-weight: 700;
      color: #f9fafb;
    }
    .index-change-up {
      color: #f87171;
    }
    .index-change-down {
      color: #34d399;
    }

    .container {
      flex: 1;
      display: flex;
      gap: 10px;
      padding: 10px;
    }
    .left-panel,
    .right-panel {
      background: #020617;
      border-radius: 10px;
      border: 1px solid #1f2937;
      padding: 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .left-panel {
      flex: 3;
    }
    .right-panel {
      flex: 2;
      max-width: 420px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
      font-size: 0.85rem;
    }
    .chart-title-main {
      font-weight: 700;
      color: #e5e7eb;
    }
    .chart-sub {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .stock-selector {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .stock-btn {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #9ca3af;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .stock-btn.active {
      background: #f97316;
      border-color: #f59e0b;
      color: #111827;
      font-weight: 700;
    }

    .chart-container {
      position: relative;
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 6px;
      margin-bottom: 8px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }
    canvas#price-chart {
      width: 100%;
      height: 260px;
      background: #020617;
      border-radius: 6px;
    }
    .chart-legend {
      margin-top: 4px;
      font-size: 0.75rem;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #60a5fa;
      margin-right: 4px;
    }
    .legend-open {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .legend-open-line {
      width: 18px;
      border-top: 2px dashed #facc15;
    }

    .stock-list {
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      overflow: hidden;
    }
    .stock-list-header,
    .stock-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      padding: 4px 8px;
      font-size: 0.8rem;
      align-items: center;
    }
    .stock-list-header {
      background: #020617;
      border-bottom: 1px solid #1f2937;
      color: #9ca3af;
      font-weight: 600;
    }
    .stock-row {
      border-bottom: 1px solid #111827;
      cursor: pointer;
    }
    .stock-row:hover {
      background: #111827;
    }
    .stock-name {
      display: flex;
      flex-direction: column;
    }
    .stock-name-code {
      font-size: 0.72rem;
      color: #6b7280;
    }
    .price-up {
      color: #f97373;
    }
    .price-down {
      color: #4ade80;
    }
    .price-flat {
      color: #e5e7eb;
    }

    .panel-title {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title strong {
      color: #e5e7eb;
    }

    .orderbook {
      border-radius: 8px;
      border: 1px solid #1f2937;
      overflow: hidden;
      margin-bottom: 8px;
      font-size: 0.78rem;
    }
    .orderbook-header {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      background: #020617;
      border-bottom: 1px solid #1f2937;
      padding: 4px 8px;
      color: #9ca3af;
      font-weight: 600;
    }
    .orderbook-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .orderbook-side-header {
      padding: 4px 8px;
      font-weight: 600;
      border-bottom: 1px solid #111827;
    }
    .orderbook-side {
      border-right: 1px solid #111827;
    }
    .orderbook-side:last-child {
      border-right: none;
    }
    .orderbook-row {
      display: grid;
      grid-template-columns: 0.7fr 0.8fr 1fr;
      padding: 3px 8px;
      align-items: center;
    }
    .orderbook-row:nth-child(odd) {
      background: #020617;
    }
    .orderbook-row:nth-child(even) {
      background: #020617;
    }
    .orderbook-level-label {
      color: #6b7280;
      font-size: 0.7rem;
    }
    .orderbook-price {
      text-align: right;
    }
    .orderbook-qty {
      text-align: right;
      color: #9ca3af;
    }

    .trade-panel {
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .trade-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .input-group label {
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .input-group input,
    .input-group select {
      background: #020617;
      border-radius: 6px;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 4px 6px;
      font-size: 0.8rem;
      outline: none;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }
    .trade-btn-row {
      display: flex;
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-start {
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
    }
    .btn-start.stop {
      background: #ef4444;
      color: #f9fafb;
    }
    .btn-buy {
      background: #ef4444;
      color: #f9fafb;
      flex: 1;
    }
    .btn-sell {
      background: #22c55e;
      color: #052e16;
      flex: 1;
    }
    .btn-small {
      padding: 2px 6px;
      font-size: 0.7rem;
      background: #020617;
      color: #9ca3af;
      border: 1px solid #374151;
      border-radius: 999px;
      cursor: pointer;
    }

    .speed-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .speed-row input[type="range"] {
      flex: 1;
    }

    .assets-panel {
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .assets-balance {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .assets-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .holdings-list {
      max-height: 120px;
      overflow-y: auto;
      margin-top: 4px;
      border-top: 1px solid #111827;
      padding-top: 4px;
      font-size: 0.75rem;
    }
    .holding-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      cursor: pointer;
    }
    .holding-row:hover {
      background: #020617;
    }

    .seed-panel {
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px;
      font-size: 0.75rem;
    }
    .seed-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 4px;
    }
    .seed-row label {
      color: #9ca3af;
    }
    .seed-row input {
      background: #020617;
      border-radius: 6px;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 4px 6px;
      font-size: 0.78rem;
      outline: none;
    }
    .seed-note {
      color: #6b7280;
      font-size: 0.7rem;
    }

    .status-bar {
      padding: 4px 10px;
      font-size: 0.75rem;
      color: #9ca3af;
      border-top: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    @media (max-width: 960px) {
      .container {
        flex-direction: column;
      }
      .right-panel {
        max-width: none;
      }
    }
    @media (max-width: 600px) {
      header h1 {
        flex-basis: 100%;
      }
      .stock-list-header,
      .stock-row {
        grid-template-columns: 1.6fr 1fr 1fr;
      }
      .stock-row-change {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>台灣股市模擬交易系統 v0.22</h1>
    <div class="header-info">
      <span class="badge">資料來源：TWSE 日收盤價（若連線失敗則改用模擬數據）</span>
      <span>大盤指數：<span id="index-value" class="index-value">--</span>
        <span id="index-change" class=""></span></span>
      <span>當日成交量：
        <span id="index-volume">--</span> 張</span>
      <span id="sim-date-label"></span>
    </div>
  </header>
  <div class="container">
    <section class="left-panel">
      <div class="chart-header">
        <div>
          <div class="chart-title-main" id="chart-title">加權指數 (^TWII) 折線圖</div>
          <div class="chart-sub" id="chart-subtitle">橫軸：模擬時間（累積），縱軸：價格（新台幣）</div>
        </div>
        <div class="stock-selector" id="stock-selector"></div>
      </div>
      <div class="chart-container">
        <canvas id="price-chart"></canvas>
        <div class="chart-legend">
          <div><span class="legend-dot"></span>價格折線</div>
          <div class="legend-open">
            <span class="legend-open-line"></span>
            <span>當日開盤價</span>
            <span id="open-line-label"></span>
          </div>
        </div>
      </div>

      <div class="stock-list">
        <div class="stock-list-header">
          <div>股票</div>
          <div>成交價</div>
          <div id="header-change">漲跌</div>
          <div class="stock-row-change">成交量</div>
        </div>
        <div id="stock-list-body"></div>
      </div>
    </section>

    <section class="right-panel">
      <div class="panel-title">
        <strong>最佳五檔</strong>
        <span id="orderbook-title" style="font-size:0.75rem;color:#9ca3af;">--</span>
      </div>
      <div class="orderbook">
        <div class="orderbook-header">
          <div>檔數</div>
          <div>價格</div>
          <div>數量(張)</div>
        </div>
        <div class="orderbook-body">
          <div class="orderbook-side" id="buy-side">
            <div class="orderbook-side-header">買進</div>
            <div id="buy-rows"></div>
          </div>
          <div class="orderbook-side" id="sell-side">
            <div class="orderbook-side-header">賣出</div>
            <div id="sell-rows"></div>
          </div>
        </div>
      </div>

      <div class="panel-title">
        <strong>下單 / 模擬交易</strong>
      </div>
      <div class="trade-panel">
        <div class="trade-row">
          <div class="input-group">
            <label>股票</label>
            <select id="trade-stock"></select>
          </div>
          <div class="input-group">
            <label>買賣別</label>
            <select id="trade-side">
              <option value="buy">買進</option>
              <option value="sell">賣出</option>
            </select>
          </div>
        </div>
        <div class="trade-row">
          <div class="input-group">
            <label>委託價 (依檔位跳動)</label>
            <input type="number" id="trade-price" step="0.05" />
          </div>
          <div class="input-group">
            <label>委託量 (張)</label>
            <input type="number" id="trade-qty" min="1" value="1" />
          </div>
        </div>
        <div class="trade-btn-row">
          <button class="btn btn-buy" id="btn-buy">買進</button>
          <button class="btn btn-sell" id="btn-sell">賣出</button>
        </div>
        <div class="speed-row">
          <button class="btn btn-start" id="btn-start">開始模擬</button>
          <span>時間倍率：<span id="speed-label">1x</span></span>
        </div>
        <div class="speed-row">
          <span>拉桿調整速度 (1x～40x)</span>
          <input type="range" id="speed-range" min="1" max="40" value="1" />
        </div>
        <div id="order-status" style="margin-top:4px;font-size:0.75rem;color:#9ca3af;">
          尚未成交
        </div>
      </div>

      <div class="panel-title">
        <strong>資產 / 持股</strong>
      </div>
      <div class="assets-panel">
        <div class="assets-balance">
          現金餘額：<span id="cash-balance">--</span> 元
        </div>
        <div class="assets-line">
          <span>持股市值：<span id="hold-value">--</span> 元</span>
          <span>總資產：<span id="total-value">--</span> 元</span>
        </div>
        <div class="holdings-list" id="holdings-list"></div>
      </div>

      <div class="panel-title">
        <strong>心情 SEED</strong>
      </div>
      <div class="seed-panel">
        <div class="seed-row">
          <label for="seed-mood">現在心情：</label>
          <input
            id="seed-mood"
            placeholder="開心、緊張、佛系..."
            maxlength="20"
          />
        </div>
        <div class="seed-row">
          <label for="seed-food">最想吃的食物：</label>
          <input
            id="seed-food"
            placeholder="滷肉飯、火鍋、珍奶..."
            maxlength="20"
          />
        </div>
        <div class="seed-row">
          <label for="seed-view">眼睛看到的第一樣東西：</label>
          <input
            id="seed-view"
            placeholder="滑鼠、窗戶、課本..."
            maxlength="20"
          />
        </div>
        <div class="seed-row">
          <label>目前 SEED 值：</label>
          <input id="seed-value" readonly />
        </div>
        <div class="seed-note">
          說明：上述三個欄位會轉成一組亂數 SEED，用來影響五檔委託深度與價格波動。
        </div>
      </div>
    </section>
  </div>

  <div class="status-bar">
    <span id="status-time">模擬時間：--</span>
    <span id="status-msg">載入中...</span>
  </div>

  <script>
    // === 公用工具 ===
    function clone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }
    function rand() {
      return Math.random();
    }
    function pseudoRandomFromSeed(seed, salt) {
      const str = seed + "|" + salt;
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = (h * 31 + str.charCodeAt(i)) >>> 0;
      }
      return (h % 100000) / 100000;
    }

    function priceTickSize(price) {
      if (price >= 1000) return 1;
      if (price >= 500) return 1;
      if (price >= 100) return 0.5;
      if (price >= 50) return 0.1;
      return 0.05;
    }

    function formatPrice(p) {
      if (!isFinite(p)) return "--";
      let v = p;
      const tick = priceTickSize(p);
      v = Math.round(v / tick) * tick;
      if (v >= 1000) {
        return Math.round(v).toLocaleString("zh-TW", {
          maximumFractionDigits: 0,
        });
      } else if (v >= 100) {
        return v.toLocaleString("zh-TW", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        });
      } else {
        let s = v.toFixed(2);
        const parts = s.split(".");
        if (parts.length === 2) {
          let d = parts[1];
          if (d.length < 2) d = d + "0";
          let d2 = d[1];
          if (d2 !== "0" && d2 !== "5") {
            d2 = parseInt(d2, 10) < 5 ? "0" : "5";
          }
          d = d[0] + d2;
          s = parts[0] + "." + d;
        }
        return s;
      }
    }

    function parseTWNumber(str) {
      if (!str) return NaN;
      return parseFloat(String(str).replace(/,/g, ""));
    }

    function formatNumber(n, decimals = 0) {
      if (!isFinite(n)) return "--";
      return n.toLocaleString("zh-TW", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function getTodayYMD() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const da = String(d.getDate()).padStart(2, "0");
      return "" + y + m + da;
    }

    // === 狀態 ===
    const defaultStocks = [
      { code: "TWII", name: "加權指數 (模擬)", isIndex: true },
      { code: "2330", name: "台積電", isIndex: false },
      { code: "2317", name: "鴻海", isIndex: false },
      { code: "2412", name: "中華電信", isIndex: false },
      { code: "2603", name: "長榮", isIndex: false },
      { code: "0050", name: "元大台灣50", isIndex: false },
    ];

    const state = {
      stocks: {},
      indexCode: "TWII",
      selectedCode: "TWII",
      isRunning: false,
      speed: 1,
      simTick: 0,
      simDate: null,
      simTime: null,
      dailyOpens: {}, // code -> [{price, tick}]
      chartData: {}, // code -> [{tick, price}]
      cash: 1_000_000,
      holdings: {}, // code -> {qty, avg}
      seedStr: "",
      seedValue: 0.12345,
    };

    // 初始化基礎結構
    defaultStocks.forEach((s) => {
      state.stocks[s.code] = {
        code: s.code,
        name: s.name,
        isIndex: s.isIndex,
        last: NaN,
        prevClose: NaN,
        open: NaN,
        volume: 0,
        dayVolume: 0,
        limitUp: NaN,
        limitDown: NaN,
        buyBook: [],
        sellBook: [],
      };
      state.chartData[s.code] = [];
      state.dailyOpens[s.code] = [];
    });

    // === 抓取 TWSE 日收盤價 ===
    async function fetchStockDayTWSE(stockNo) {
      const ymd = getTodayYMD();
      const url =
        "https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?response=json&date=" +
        ymd +
        "&stockNo=" +
        stockNo;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.data || !data.data.length) {
          throw new Error("no data");
        }
        const rows = data.data;
        const last = rows[rows.length - 1];
        // [日期, 成交股數, 成交金額, 開盤價, 最高價, 最低價, 收盤價, 漲跌價差, 成交筆數]
        const open = parseTWNumber(last[3]);
        const close = parseTWNumber(last[6]);
        const vol = parseTWNumber(last[1]) / 1000; // 換算成張
        const title = data.title || "";
        let name = "";
        const m = title.match(/「(.+?)」/);
        if (m) name = m[1];
        const dateStr = last[0]; // e.g. 113/11/21
        return { open, close, vol, name, dateStr };
      } catch (e) {
        console.warn("fetchStockDayTWSE failed for", stockNo, e);
        return null;
      }
    }

    async function initFromTWSE() {
      const statusMsg = document.getElementById("status-msg");
      statusMsg.textContent = "從 TWSE 載入日收盤價中...";
      const dateCandidates = [];

      // 個股
      for (const s of defaultStocks) {
        if (s.isIndex) continue;
        const info = await fetchStockDayTWSE(s.code);
        const stock = state.stocks[s.code];
        if (info) {
          stock.open = info.open;
          stock.prevClose = info.close; // 前一日收盤，簡化處理
          stock.last = info.close;
          stock.volume = info.vol;
          stock.dayVolume = 0;
          stock.name = info.name || stock.name;
          stock.limitUp = +(info.close * 1.1).toFixed(2);
          stock.limitDown = +(info.close * 0.9).toFixed(2);
          if (info.dateStr) dateCandidates.push(info.dateStr);
        } else {
          // 模擬數據
          stock.prevClose = 100 + Math.round(rand() * 50);
          stock.open = stock.prevClose;
          stock.last = stock.prevClose;
          stock.volume = 0;
          stock.dayVolume = 0;
          stock.limitUp = +(stock.prevClose * 1.1).toFixed(2);
          stock.limitDown = +(stock.prevClose * 0.9).toFixed(2);
        }
      }

      // 取日期 (民國 -> 公元)
      let simDate = new Date();
      if (dateCandidates.length > 0) {
        const last = dateCandidates[dateCandidates.length - 1]; // "113/11/21"
        const parts = last.split("/");
        if (parts.length === 3) {
          const y = 1911 + parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const d = parseInt(parts[2], 10);
          simDate = new Date(y, m, d);
        }
      }
      state.simDate = simDate;
      state.simTime = new Date(
        simDate.getFullYear(),
        simDate.getMonth(),
        simDate.getDate(),
        9,
        0,
        0
      );

      document.getElementById(
        "sim-date-label"
      ).textContent = `模擬交易日：${simDate.getFullYear()}-${String(
        simDate.getMonth() + 1
      ).padStart(2, "0")}-${String(simDate.getDate()).padStart(2, "0")}`;

      // 大盤：用簡化方式：平均價 * 100
      const eqCodes = defaultStocks
        .filter((s) => !s.isIndex)
        .map((s) => s.code);
      let sum = 0;
      for (const c of eqCodes) sum += state.stocks[c].last || 0;
      let avg = sum / eqCodes.length;
      if (!isFinite(avg) || avg <= 0) avg = 17000;
      const indexStock = state.stocks[state.indexCode];
      indexStock.prevClose = avg;
      indexStock.open = avg;
      indexStock.last = avg;
      indexStock.volume = 0;
      indexStock.dayVolume = 0;
      indexStock.limitUp = avg * 1.1;
      indexStock.limitDown = avg * 0.9;

      // 開盤線記錄
      for (const code in state.stocks) {
        state.dailyOpens[code] = [{ price: state.stocks[code].open, tick: 0 }];
      }

      document.getElementById("index-value").textContent =
        formatNumber(indexStock.last, 2);
      document.getElementById("index-change").textContent = "(+0.00)";
      document.getElementById("index-change").className = "";

      document.getElementById("index-volume").textContent = formatNumber(
        indexStock.volume,
        0
      );

      statusMsg.textContent = "載入完成，可開始模擬。";

      buildInitialBooks();
      initUIFromState();
      drawChart();
    }

    function buildInitialBooks() {
      for (const code in state.stocks) {
        const s = state.stocks[code];
        if (!isFinite(s.last) || s.last <= 0) continue;
        const tick = priceTickSize(s.last);
        const center = s.last;
        const buyBook = [];
        const sellBook = [];
        for (let i = 0; i < 5; i++) {
          const buyPrice = center - tick * (1 + i);
          const sellPrice = center + tick * (1 + i);
          if (buyPrice >= s.limitDown) {
            buyBook.push({
              level: i + 1,
              price: buyPrice,
              qty:
                50 +
                Math.round(
                  pseudoRandomFromSeed(state.seedStr || "init", code + "B" + i) *
                    400
                ),
            });
          }
          if (sellPrice <= s.limitUp) {
            sellBook.push({
              level: i + 1,
              price: sellPrice,
              qty:
                50 +
                Math.round(
                  pseudoRandomFromSeed(state.seedStr || "init", code + "S" + i) *
                    400
                ),
            });
          }
        }
        s.buyBook = buyBook.sort((a, b) => b.price - a.price); // 買價由高到低
        s.sellBook = sellBook.sort((a, b) => a.price - b.price); // 賣價由低到高
      }
    }

    // === UI 初始化 ===

        btn.dataset.code = s.code;
        btn.addEventListener("click", () => {
          state.selectedCode = s.code;
          updateSelectorActive();
          updateChartTitle();
          updateOrderbookUI();
          syncTradeStockSelect();
          drawChart();
        });
        selector.appendChild(btn);
      });

      const tradeStockSelect = document.getElementById("trade-stock");
      tradeStockSelect.innerHTML = "";
      defaultStocks
        .filter((s) => !s.isIndex)
        .forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s.code;
          opt.textContent = `${s.name} (${s.code})`;

        });

      syncTradePriceStep();

      const code = state.selectedCode;

      const titleEl = document.getElementById("chart-title");
      if (s.isIndex) {
        titleEl.textContent = "加權指數 (^TWII) 折線圖";

    function syncTradeStockSelect() {
      if (state.stocks[state.selectedCode]?.isIndex) return;
      const sel = document.getElementById("trade-stock");
      sel.value = state.selectedCode;
      syncTradePriceStep();

    function syncTradePriceStep() {
      const code = document.getElementById("trade-stock").value;
      const s = state.stocks[code];
      const input = document.getElementById("trade-price");
      const tick = priceTickSize(s.last || 100);
      input.step = tick;
      if (!input.value || !isFinite(parseFloat(input.value))) {
        input.value = (s.last || s.open || 100).toFixed(
          tick >= 1 ? 0 : tick === 0.5 ? 1 : 2
        );
      }
    }

    // 五檔顏色：相對當日開盤價
    function priceColorRelativeToOpen(price, open) {
      if (!isFinite(price) || !isFinite(open)) return "price-flat";
      if (price > open) return "price-up";
      if (price < open) return "price-down";
      return "price-flat";
    }

    function updateOrderbookUI() {
      const code =
        state.stocks[state.selectedCode]?.isIndex && !state.selectedCode === "TWII"
          ? "2330"
          : state.selectedCode === "TWII"
          ? "2330"
          : state.selectedCode;
      const s = state.stocks[code];
      if (!s) return;
      document.getElementById(
        "orderbook-title"
      ).textContent = `${s.name} (${s.code})`;

      const buyRows = document.getElementById("buy-rows");
      const sellRows = document.getElementById("sell-rows");
      buyRows.innerHTML = "";
      sellRows.innerHTML = "";
      const open = s.open;

      // 買進：買一在上
      const buys = s.buyBook.slice().sort((a, b) => b.price - a.price);
      for (let i = 0; i < 5; i++) {
        const row = buys[i];
        if (!row) continue;
        const div = document.createElement("div");
        div.className = "orderbook-row";

      // 賣出：賣一在上，價格由低到高

      for (let i = 0; i < 5; i++) {
        const row = sells[i];
        if (!row) continue;
        const div = document.createElement("div");
        div.className = "orderbook-row";
        const colorClass = priceColorRelativeToOpen(row.price, open);
        div.innerHTML = `
          <div class="orderbook-level-label">賣${i + 1}</div>
          <div class="orderbook-price ${colorClass}">${formatPrice(
          row.price
        )}</div>
          <div class="orderbook-qty">${formatNumber(row.qty, 0)}</div>

        sellRows.appendChild(div);

      // 當前開盤價黃線標籤

    function updateStockListUI() {
      const body = document.getElementById("stock-list-body");

        .filter((s) => !s.isIndex)
        .forEach((cfg) => {
          const s = state.stocks[cfg.code];

    function updateSeedFromInputs() {

      const food = document.getElementById("seed-food").value || "";
      const view = document.getElementById("seed-view").value || "";
      const seedStr = mood + "|" + food + "|" + view;
      state.seedStr = seedStr;
      const pr = pseudoRandomFromSeed(seedStr || "default", "seed");
      state.seedValue = pr;

    function updateSimTimeLabel() {
      const t = state.simTime;
      if (!t) {
        document.getElementById("status-time").textContent =
          "模擬時間：--";
        return;
      }
      const hh = String(t.getHours()).padStart(2, "0");
      const mm = String(t.getMinutes()).padStart(2, "0");

    // === Chart ===
    function drawChart() {
      const canvas = document.getElementById("price-chart");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, rect.width, rect.height);

      const code = state.selectedCode;
      const data = state.chartData[code] || [];
      if (!data.length) {
        // 若沒有資料，至少畫出當前價
        const s = state.stocks[code];
        const p = s.last || s.open || 100;
        state.chartData[code].push({ tick: state.simTick, price: p });
      }

      const points = state.chartData[code];
      const visibleCount = 240;
      const startIndex = Math.max(0, points.length - visibleCount);
      const visible = points.slice(startIndex);

      let minPrice = Infinity;
      let maxPrice = -Infinity;
      visible.forEach((pt) => {
        if (pt.price < minPrice) minPrice = pt.price;
        if (pt.price > maxPrice) maxPrice = pt.price;
      });
      if (!isFinite(minPrice) || !isFinite(maxPrice)) return;
      if (minPrice === maxPrice) {
        minPrice *= 0.99;
        maxPrice *= 1.01;
      }

      const paddingLeft = 40;
      const paddingRight = 10;
      const paddingTop = 10;
      const paddingBottom = 20;

      const chartWidth = rect.width - paddingLeft - paddingRight;
      const chartHeight = rect.height - paddingTop - paddingBottom;

      const minTick = visible[0].tick;
      const maxTick = visible[visible.length - 1].tick || minTick + 1;
      const tickSpan = Math.max(1, maxTick - minTick);

      function xForTick(tick) {
        return (
          paddingLeft + ((tick - minTick) / tickSpan) * chartWidth
        );
      }
      function yForPrice(price) {
        return (
          paddingTop +
          ((maxPrice - price) / (maxPrice - minPrice)) * chartHeight
        );
      }

      // grid + 左側價位刻度
      ctx.strokeStyle = "#1f2937";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      const gridLines = 4;
      for (let i = 0; i <= gridLines; i++) {
        const y = paddingTop + (chartHeight * i) / gridLines;
        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(rect.width - paddingRight, y);
        ctx.stroke();

        const price =
          maxPrice - ((maxPrice - minPrice) * i) / gridLines;
        ctx.fillStyle = "#6b7280";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(
          formatPrice(price),
          paddingLeft - 4,
          y
        );
      }
      ctx.setLineDash([]);

      // 時間刻度
      const timeSteps = 6;
      ctx.fillStyle = "#6b7280";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let i = 0; i <= timeSteps; i++) {
        const t = minTick + (tickSpan * i) / timeSteps;
        const x = xForTick(t);
        const simulatedMinutes = t; // 1 tick ≈ 1 分鐘
        const hh = 9 + Math.floor(simulatedMinutes / 60);
        const mm = simulatedMinutes % 60;
        const hhStr = String(hh).padStart(2, "0");
        const mmStr = String(mm).padStart(2, "0");
        ctx.fillText(
          `${hhStr}:${mmStr}`,
          x,
          rect.height - paddingBottom + 2
        );
      }

      // 當日開盤價黃虛線
      const s = state.stocks[code];
      const opens = state.dailyOpens[code] || [];
      if (opens.length) {
        const lastOpen = opens[opens.length - 1];
        const y = yForPrice(lastOpen.price);
        ctx.strokeStyle = "#facc15";
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(rect.width - paddingRight, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#facc15";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(
          "開盤 " + formatPrice(lastOpen.price),
          paddingLeft + 4,
          y - 2
        );
      }

      // 價格折線
      ctx.strokeStyle = "#60a5fa";
      ctx.lineWidth = 2;
      ctx.beginPath();
      visible.forEach((pt, idx) => {
        const x = xForTick(pt.tick);
        const y = yForPrice(pt.price);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    // === 模擬邏輯 ===
    function stepSimulation() {
      if (!state.isRunning) return;
      const steps = state.speed;
      for (let i = 0; i < steps; i++) {
        singleStep();
      }
      drawChart();
      updateStockListUI();
      updateAssetsUI();
      updateOrderbookUI();
      updateSimTimeLabel();
    }

    function singleStep() {
      state.simTick += 1;
      if (state.simTime) {
        state.simTime = new Date(state.simTime.getTime() + 60 * 1000);
      }
      // 收盤刷新新的一天 (約 4 小時 = 240 tick)
      if (state.simTick > 0 && state.simTick % 240 === 0) {
        for (const code in state.stocks) {
          const s = state.stocks[code];
          s.prevClose = s.last;
          s.open = s.last;
          s.dayVolume = 0;
          state.dailyOpens[code].push({
            price: s.open,
            tick: state.simTick,
          });
        }
      }

      // 價格波動
      for (const code in state.stocks) {
        const s = state.stocks[code];
        if (!isFinite(s.last) || s.last <= 0) continue;
        const tick = priceTickSize(s.last);
        const baseRandom =
          (rand() - 0.5) * tick * (code === state.indexCode ? 0.7 : 1.2);
        const seedBias = (state.seedValue - 0.5) * tick;
        let next = s.last + baseRandom + seedBias;
        // 漲跌停限制（大盤不限制）
        if (!s.isIndex) {
          if (next > s.limitUp) next = s.limitUp;
          if (next < s.limitDown) next = s.limitDown;
        }
        s.last = next;
        s.dayVolume += Math.round(5 + rand() * 20);
        if (code === state.indexCode) {
          const idxValEl = document.getElementById("index-value");
          const idxChgEl = document.getElementById("index-change");
          const chg = s.last - s.prevClose;
          const pct =
            s.prevClose && isFinite(s.prevClose)
              ? (chg / s.prevClose) * 100
              : 0;
          idxValEl.textContent = formatNumber(s.last, 2);
          idxChgEl.textContent =
            (chg >= 0 ? "+" : "") +
            formatNumber(chg, 2) +
            " (" +
            (pct >= 0 ? "+" : "") +
            formatNumber(pct, 2) +
            "%)";
          idxChgEl.className =
            chg > 0
              ? "index-change-up"
              : chg < 0
              ? "index-change-down"
              : "";
          document.getElementById("index-volume").textContent = formatNumber(
            s.dayVolume,
            0
          );
        }
        if (!state.chartData[code]) state.chartData[code] = [];
        state.chartData[code].push({
          tick: state.simTick,
          price: s.last,
        });

        // 重建五檔價位中心
        if (!s.isIndex) {
          const buyBook = [];
          const sellBook = [];
          for (let i = 0; i < 5; i++) {
            const buyPrice = s.last - tick * (1 + i);
            const sellPrice = s.last + tick * (1 + i);
            if (buyPrice >= s.limitDown) {
              buyBook.push({
                level: i + 1,
                price: buyPrice,
                qty:
                  50 +
                  Math.round(
                    pseudoRandomFromSeed(
                      state.seedStr || "run",
                      code + "B" + (state.simTick % 997) + i
                    ) * 400
                  ),
              });
            }
            if (sellPrice <= s.limitUp) {
              sellBook.push({
                level: i + 1,
                price: sellPrice,
                qty:
                  50 +
                  Math.round(
                    pseudoRandomFromSeed(
                      state.seedStr || "run",
                      code + "S" + (state.simTick % 997) + i
                    ) * 400
                  ),
              });
            }
          }
          s.buyBook = buyBook.sort((a, b) => b.price - a.price);
          s.sellBook = sellBook.sort((a, b) => a.price - b.price);
        }
      }
    }

    // === 交易 ===
    function placeOrder(side) {
      const code = document.getElementById("trade-stock").value;
      const s = state.stocks[code];
      if (!s) return;
      const rawPrice = parseFloat(
        document.getElementById("trade-price").value
      );
      const qty = parseInt(
        document.getElementById("trade-qty").value,
        10
      );
      const statusEl = document.getElementById("order-status");
      if (!isFinite(rawPrice) || rawPrice <= 0 || !isFinite(qty) || qty <= 0) {
        statusEl.textContent = "請輸入有效價格與數量。";
        return;
      }
      const tick = priceTickSize(rawPrice);
      const p = Math.round(rawPrice / tick) * tick;

      if (!s.isIndex) {
        if (p > s.limitUp || p < s.limitDown) {
          statusEl.textContent = "價格超出漲跌停範圍。";
          return;
        }
      }

      // 成交邏輯：簡化為以當前五檔最優價成交
      let dealPrice = p;
      if (side === "buy") {
        const bestSell = s.sellBook.find((lv) => lv.price <= p);
        if (!bestSell) {
          statusEl.textContent = "目前無法以此價格成交（賣方無掛單）。";
          return;
        }
        dealPrice = bestSell.price;
      } else {
        const bestBuy = s.buyBook.find((lv) => lv.price >= p);
        if (!bestBuy) {
          statusEl.textContent = "目前無法以此價格成交（買方無掛單）。";
          return;
        }
        dealPrice = bestBuy.price;
      }

      const amount = dealPrice * qty * 1000;
      if (side === "buy") {
        if (state.cash < amount) {
          statusEl.textContent = "現金不足，無法買進。";
          return;
        }
        state.cash -= amount;
        if (!state.holdings[code]) {
          state.holdings[code] = { qty: 0, avg: dealPrice };
        }
        const h = state.holdings[code];
        const totalQty = h.qty + qty;
        h.avg = (h.avg * h.qty + dealPrice * qty) / totalQty;
        h.qty = totalQty;
        statusEl.textContent = `買進 ${s.name} ${
          qty
        } 張，成交價 ${formatPrice(dealPrice)}。`;
      } else {
        const h = state.holdings[code];
        if (!h || h.qty < qty) {
          statusEl.textContent = "持股不足，無法賣出。";
          return;
        }
        h.qty -= qty;
        if (h.qty === 0) delete state.holdings[code];
        state.cash += amount;
        statusEl.textContent = `賣出 ${s.name} ${
          qty
        } 張，成交價 ${formatPrice(dealPrice)}。`;
      }

      // 成交量與五檔掛單減少
      if (!s.isIndex) {
        s.dayVolume += qty;
        if (side === "buy") {
          const lvl = s.sellBook.find((lv) => lv.price === dealPrice);
          if (lvl) {
            lvl.qty = Math.max(0, lvl.qty - qty);
          }
        } else {
          const lvl = s.buyBook.find((lv) => lv.price === dealPrice);
          if (lvl) {
            lvl.qty = Math.max(0, lvl.qty - qty);
          }
        }
      }

      // 更新價格與圖表
      s.last = dealPrice;
      state.chartData[code].push({
        tick: state.simTick,
        price: s.last,
      });
      updateAssetsUI();
      updateOrderbookUI();
      updateStockListUI();
      drawChart();
    }

    // === 事件繫結 ===
    function bindEvents() {
      document
        .getElementById("btn-start")
        .addEventListener("click", () => {
          state.isRunning = !state.isRunning;
          const btn = document.getElementById("btn-start");
          btn.textContent = state.isRunning ? "暫停模擬" : "開始模擬";
          btn.classList.toggle("stop", state.isRunning);
        });
      document
        .getElementById("speed-range")
        .addEventListener("input", (e) => {
          const v = parseInt(e.target.value, 10);
          state.speed = v;
          document.getElementById(
            "speed-label"
          ).textContent = `${v}x`;
        });

      document
        .getElementById("btn-buy")
        .addEventListener("click", () => placeOrder("buy"));
      document
        .getElementById("btn-sell")
        .addEventListener("click", () => placeOrder("sell"));

      document
        .getElementById("trade-stock")
        .addEventListener("change", () => {
          syncTradePriceStep();
          const code = document.getElementById("trade-stock").value;
          state.selectedCode = code;
          updateSelectorActive();
          updateChartTitle();
          updateOrderbookUI();
          drawChart();
        });

      document
        .getElementById("seed-mood")
        .addEventListener("input", updateSeedFromInputs);
      document
        .getElementById("seed-food")
        .addEventListener("input", updateSeedFromInputs);
      document
        .getElementById("seed-view")
        .addEventListener("input", updateSeedFromInputs);

      window.addEventListener("resize", drawChart);
    }

    // === 主流程 ===
    document.addEventListener("DOMContentLoaded", async () => {
      bindEvents();
      updateSeedFromInputs();
      await initFromTWSE();

      // 初始圖表資料
      for (const code in state.stocks) {
        const s = state.stocks[code];
        if (!isFinite(s.last) || s.last <= 0) continue;
        state.chartData[code].push({
          tick: 0,
          price: s.last,
        });
      }
      drawChart();

      // 定時模擬
      setInterval(stepSimulation, 1000);
    });
  </script>
</body>
</html>
