  <style>

      cursor: pointer;
      background: #222;
      color: #f8f7f4;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
    }

      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr);
      gap: 18px;

      main {
        grid-template-columns: 1fr;

      "冷若冰霜","冷嘲熱諷","冷眼旁觀","冷靜思考","冷暖自知","冷水澆頭","冷語冰人","冷若冰雪",
      "熱淚盈眶","熱心助人","熱火朝天","熱血沸騰","熱情洋溢","熱鍋上螞蟻","熱淚縱橫","熱氣騰騰",
      "喜出望外","喜上眉梢","喜怒無常","喜怒哀樂","喜氣洋洋","喜聞樂見","喜新厭舊","喜不自勝",
      "悲天憫人","悲歡離合","悲痛欲絕","悲喜交集","愁眉苦臉","愁雲慘霧","愁腸百結","愁思綿綿"
    ];

    const BOARD_SIZE = 7;
    const IDIOMS_PER_ROUND = 3;
    const IDIOM_LENGTH = 4;

    let grid = [];
    let targetIdioms = [];
    let targetIdiomsCells = []; // array of arrays of {r,c}
    let selectedCells = [];     // array of {r,c}
    let foundIdioms = [];       // strings
    let foundIdiomsCells = [];  // array of arrays of {r,c}

    const boardEl = document.getElementById('board');
    const targetListEl = document.getElementById('targetList');
    const logEl = document.getElementById('log');
    const statusFoundCountEl = document.getElementById('status-found-count');

    function log(message) {
      const time = new Date();
      const hh = time.getHours().toString().padStart(2,'0');
      const mm = time.getMinutes().toString().padStart(2,'0');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<small>${hh}:${mm}</small>${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function randInt(max) {
      return Math.floor(Math.random() * max);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickRandomIdioms(n) {
      const copy = [...IDIOM_POOL];
      shuffleArray(copy);
      const picked = [];
      const seen = new Set();
      for (const idiom of copy) {
        if (idiom.length === IDIOM_LENGTH && !seen.has(idiom)) {
          picked.push(idiom);
          seen.add(idiom);
          if (picked.length >= n) break;
        }
      }
      return picked;
    }

    function initEmptyGrid() {
      grid = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        const row = [];
        for (let c = 0; c < BOARD_SIZE; c++) {
          row.push({ char: "", isTarget: false });
        }
        grid.push(row);
      }
    }

    function placeIdioms() {
      targetIdiomsCells = [];
      const directions = [
        { dr: 0, dc: 1 },
        { dr: 0, dc: -1 },
        { dr: 1, dc: 0 },
        { dr: -1, dc: 0 },
        { dr: 1, dc: 1 },
        { dr: 1, dc: -1 },
        { dr: -1, dc: 1 },
        { dr: -1, dc: -1 }
      ];
      for (const idiom of targetIdioms) {
        let placed = false;
        let attempts = 0;
        while (!placed && attempts < 200) {
          attempts++;
          const dir = directions[randInt(directions.length)];
          const dr = dir.dr;
          const dc = dir.dc;
          const maxRowStart = BOARD_SIZE - 1 - dr * (IDIOM_LENGTH - 1);
          const minRowStart = 0 - Math.min(0, dr * (IDIOM_LENGTH - 1));
          const maxColStart = BOARD_SIZE - 1 - dc * (IDIOM_LENGTH - 1);
          const minColStart = 0 - Math.min(0, dc * (IDIOM_LENGTH - 1));
          const rowStart = randInt(maxRowStart - minRowStart + 1) + minRowStart;
          const colStart = randInt(maxColStart - minColStart + 1) + minColStart;

          const cells = [];
          let ok = true;
          for (let i = 0; i < IDIOM_LENGTH; i++) {
            const r = rowStart + dr * i;
            const c = colStart + dc * i;
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) {
              ok = false;
              break;
            }
            const ch = idiom[i];
            const existing = grid[r][c].char;
            if (existing && existing !== ch) {
              ok = false;
              break;
            }
            cells.push({ r, c, ch });
          }
          if (!ok) continue;
          for (const cell of cells) {
            grid[cell.r][cell.c].char = cell.ch;
            grid[cell.r][cell.c].isTarget = true;
          }
          targetIdiomsCells.push(cells.map(({ r, c }) => ({ r, c })));
          placed = true;
        }
        if (!placed) {
          log(`⚠ 無法成功擺入成語「${idiom}」，本局可能只會有部分成語。`);
        }
      }
    }

    function collectAllCharsFromIdioms() {
      const chars = new Set();
      for (const idiom of IDIOM_POOL) {
        for (const ch of idiom) {
          chars.add(ch);
        }
      }
      return Array.from(chars);
    }

    const FILLER_CHARS = collectAllCharsFromIdioms();

    function fillRemainingCells() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (!grid[r][c].char) {
            const ch = FILLER_CHARS[randInt(FILLER_CHARS.length)];
            grid[r][c].char = ch;
          }
        }
      }
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.dataset.row = String(r);
          cellEl.dataset.col = String(c);
          const span = document.createElement('span');
          span.textContent = grid[r][c].char || "□";
          cellEl.appendChild(span);

          cellEl.addEventListener('click', () => handleCellClick(r, c));

          boardEl.appendChild(cellEl);
        }
      }
      updateFoundHighlights();
    }

    function sameCell(a, b) {
      return a.r === b.r && a.c === b.c;
    }

    function handleCellClick(r, c) {
      const idx = selectedCells.findIndex(cell => cell.r === r && cell.c === c);
      if (idx >= 0) {
        selectedCells.splice(idx, 1);
      } else {
        if (selectedCells.length >= IDIOM_LENGTH) {
          selectedCells = [];
        }
        selectedCells.push({ r, c });
      }
      updateSelectionHighlights();
      if (selectedCells.length === IDIOM_LENGTH) {
        trySubmitSelection();
      }
    }

    function updateSelectionHighlights() {
      const cellEls = boardEl.querySelectorAll('.cell');
      cellEls.forEach(el => {
        el.classList.remove('selected');
      });
      for (const sel of selectedCells) {
        const selector = `.cell[data-row="${sel.r}"][data-col="${sel.c}"]`;
        const el = boardEl.querySelector(selector);
        if (el) el.classList.add('selected');
      }
    }

    function updateFoundHighlights() {
      const cellEls = boardEl.querySelectorAll('.cell');
      cellEls.forEach(el => {
        el.classList.remove('found');
      });
      for (const group of foundIdiomsCells) {
        for (const cell of group) {
          const selector = `.cell[data-row="${cell.r}"][data-col="${cell.c}"]`;
          const el = boardEl.querySelector(selector);
          if (el) el.classList.add('found');
        }
      }
    }

    function cellsToSortedLine(cells) {
      if (cells.length !== IDIOM_LENGTH) return null;
      const sorted = [...cells].sort((a, b) => {
        if (a.r === b.r) return a.c - b.c;
        return a.r - b.r;
      });
      const drTotal = sorted[IDIOM_LENGTH - 1].r - sorted[0].r;
      const dcTotal = sorted[IDIOM_LENGTH - 1].c - sorted[0].c;
      const stepR = drTotal / (IDIOM_LENGTH - 1);
      const stepC = dcTotal / (IDIOM_LENGTH - 1);
      if (!Number.isInteger(stepR) || !Number.isInteger(stepC)) return null;
      if (stepR === 0 && stepC === 0) return null;
      if (Math.abs(stepR) > 1 || Math.abs(stepC) > 1) return null;
      for (let i = 0; i < IDIOM_LENGTH; i++) {
        const expectedR = sorted[0].r + stepR * i;
        const expectedC = sorted[0].c + stepC * i;
        if (sorted[i].r !== expectedR || sorted[i].c !== expectedC) {
          return null;
        }
      }
      return sorted;
    }

    function trySubmitSelection() {
      const line = cellsToSortedLine(selectedCells);
      if (!line) {
        log("⚠ 請沿著同一條直線，選擇四個連續的字。");
        selectedCells = [];
        updateSelectionHighlights();
        return;
      }
      let text = "";
      for (const cell of line) {
        text += grid[cell.r][cell.c].char;
      }
      const isTarget = targetIdioms.includes(text);
      const isAnyIdiom = IDIOM_POOL.includes(text);
      if (isTarget) {
        if (!foundIdioms.includes(text)) {
          foundIdioms.push(text);
          foundIdiomsCells.push(line.map(({ r, c }) => ({ r, c })));
          log(`✅ 找到目標成語：「${text}」`);
        } else {
          log(`ℹ 你已經找過「${text}」了。`);
        }
      } else if (isAnyIdiom) {
        log(`☑ 「${text}」是成語，但不是本局預設的目標。`);
      } else {
        log(`✘ 「${text}」不是成語庫中的成語。`);
      }
      selectedCells = [];
      updateSelectionHighlights();
      updateFoundHighlights();
      updateStatus();
      updateTargetList();
    }

    function updateStatus() {
      statusFoundCountEl.innerHTML = `已找到 ${foundIdioms.length} / ${targetIdioms.length}`;
    }

    function updateTargetList() {
      targetListEl.innerHTML = "";
      for (const idiom of targetIdioms) {
        const row = document.createElement('div');
        row.className = 'target-item';
        const name = document.createElement('div');
        name.className = 'target-idiom';
        name.textContent = idiom;
        const status = document.createElement('div');
        status.className = 'target-status';
        if (foundIdioms.includes(idiom)) {
          status.classList.add('found');
          status.textContent = "已找到";
        } else {
          status.classList.add('not-found');
          status.textContent = "尚未找到";
        }
        row.appendChild(name);
        row.appendChild(status);
        targetListEl.appendChild(row);
      }
    }

    function clearSelection() {
      selectedCells = [];
      updateSelectionHighlights();
      log("🧽 已清除目前選取。");
    }

    function checkAnswers() {
      const total = targetIdioms.length;
      const found = foundIdioms.length;
      if (found === total) {
        log("🎉 恭喜！你已經找出本局全部三個成語！");
      } else if (found === 0) {
        log("🔍 還沒有找到任何目標成語，再仔細看看吧～");
      } else {
        log(`📌 目前找到 ${found} / ${total} 個成語，加油！`);
      }
    }

    function newGame() {
      initEmptyGrid();
      selectedCells = [];
      foundIdioms = [];
      foundIdiomsCells = [];
      boardEl.innerHTML = "";
      logEl.innerHTML = "";
      targetIdioms = pickRandomIdioms(IDIOMS_PER_ROUND);
      log(`🀄 本局已隨機選定 ${IDIOMS_PER_ROUND} 個成語，試著在棋盤中把它們找出來吧。`);
      placeIdioms();
      fillRemainingCells();
      renderBoard();
      updateStatus();
      updateTargetList();
    }

    document.getElementById('btn-new').addEventListener('click', () => {
      newGame();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      clearSelection();
    });

    document.getElementById('btn-check').addEventListener('click', () => {
      checkAnswers();
    });

    newGame();
  </script>
</body>
</html>
