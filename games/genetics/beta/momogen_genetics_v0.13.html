<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Momo Genetics v0.13</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --panel-border: #30363d;
            --text: #c9d1d9;
            --primary: #58a6ff;
            --accent: #79c0ff;
            --success: #3fb950;
            --error: #f85149;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg); color: var(--text);
            touch-action: none;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .sidebar {
            position: absolute; top: 10px; left: 10px; width: 150px;
            background: var(--panel); border: 1px solid var(--panel-border);
            border-radius: 8px; padding: 10px; pointer-events: auto;
            max-height: 80vh; overflow-y: auto;
        }
        .nav-group { margin-bottom: 12px; }
        .nav-title { font-size: 11px; color: #8b949e; margin-bottom: 4px; font-weight: bold; }
        .nav-btn {
            display: block; width: 100%; padding: 6px; margin: 2px 0;
            background: transparent; border: 1px solid transparent; color: var(--text);
            text-align: left; cursor: pointer; border-radius: 4px; font-size: 12px;
        }
        .nav-btn.active { background: #1f6feb; border-color: #388bfd; }
        
        .info-box {
            position: absolute; top: 10px; right: 10px; width: 240px;
            background: var(--panel); border: 1px solid var(--panel-border);
            padding: 12px; border-radius: 8px; pointer-events: auto; font-size: 13px;
        }

        .controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; pointer-events: auto;
            background: var(--panel); padding: 12px 18px; border-radius: 40px;
            border: 1px solid var(--panel-border); box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            flex-wrap: wrap; justify-content: center; max-width: 90vw;
        }

        .btn {
            padding: 8px 14px; border: none; border-radius: 20px;
            background: var(--primary); color: white; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: #30363d; border: 1px solid #8b949e; }
        .btn-success { background: var(--success); }

        .correct-overlay {
            position: fixed; inset: 0; display: none;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.4); z-index: 100; pointer-events: none;
        }
        .correct-text {
            font-size: 80px; font-weight: 900; color: var(--success);
            text-shadow: 0 0 20px rgba(63, 185, 80, 0.6);
            transform: scale(0); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { to { transform: scale(1); } }

        .gene-ctrl {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 4px 6px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117;
        }
        .gene-label { font-size: 10px; color: var(--accent); }

        select {
            background: #0d1117; color: white; border: 1px solid var(--panel-border);
            padding: 4px 8px; border-radius: 4px; outline: none;
        }

        svg { width: 100%; height: 100%; cursor: grab; background: var(--bg); }
        #viewport { transform-origin: 0 0; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="sidebar">
        <div style="font-weight: bold; color: var(--primary); margin-bottom: 8px; font-size: 14px;">MomoGen v0.13</div>
        <div class="nav-group">
            <div class="nav-title">第一大關 (單基因)</div>
            <button class="nav-btn" onclick="switchL(1,1)" id="btn-1-1">1-1 匹配性狀</button>
            <button class="nav-btn" onclick="switchL(1,2)" id="btn-1-2">1-2 編輯父母</button>
            <button class="nav-btn" onclick="switchL(1,3)" id="btn-1-3">1-3 猜親代</button>
        </div>
        <div class="nav-group">
            <div class="nav-title">第二大關 (雙聯鎖)</div>
            <button class="nav-btn" onclick="switchL(2,1)" id="btn-2-1">2-1 聯鎖匹配</button>
            <button class="nav-btn" onclick="switchL(2,2)" id="btn-2-2">2-2 編輯父母</button>
            <button class="nav-btn" onclick="switchL(2,3)" id="btn-2-3">2-3 終極挑戰</button>
        </div>
    </div>

    <div class="info-box">
        <div id="mission-title" style="font-weight: bold; color: var(--accent); margin-bottom: 3px;"></div>
        <div id="mission-desc" style="line-height: 1.3;"></div>
    </div>

    <div class="controls" id="game-controls"></div>
</div>

<div class="correct-overlay" id="win-overlay">
    <div class="correct-text">答對了！</div>
</div>

<svg id="svg-root">
    <g id="viewport"></g>
</svg>

<script>
    const state = {
        mainL: 1, subL: 1,
        zoom: 1, panX: 0, panY: 0,
        isWon: false,
        
        traits: {
            E: { name: '耳朵', dom: '貓耳', rec: '垂耳' },
            T: { name: '尾巴', dom: '長尾', rec: '圓尾' }
        },
        
        playerChroms: [], 
        targetChroms: [],
        motherChroms: [],
        fatherChroms: [],
        hiddenFather: null,
        children: []
    };

    const viewport = document.getElementById('viewport');
    const controls = document.getElementById('game-controls');
    const overlay = document.getElementById('win-overlay');

    function init() {
        setupInteractions();
        switchL(1, 1);
    }

    function switchL(m, s) {
        state.mainL = m; state.subL = s;
        state.children = [];
        state.isWon = false;
        overlay.style.display = 'none';
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${m}-${s}`).classList.add('active');

        // 初始化
        randomizeTarget();
        randomizeParents();
        if (s === 3) state.hiddenFather = generateRandomChroms(m===2);

        updateText();
        render();
    }

    function updateText() {
        const descs = {
            "1-1": "點擊下方的基因改變大小寫。貓耳(E)是顯性，垂耳(e)是隱性。請匹配右邊的目標性狀！",
            "1-2": "本關可隨機更換父母。點擊父母下方的染色體基因即可變換基因型，再點雜合看結果。",
            "1-3": "父親基因被隱藏了。點擊繁殖產生寶寶，從比例推斷父親是 EE, Ee 還是 ee 並提交。",
            "2-1": "雙性狀聯鎖遺傳。調整同一條染色體上的兩個基因位點，匹配右側的複合性狀。",
            "2-2": "編輯父母的聯鎖排列（如 ET/et）。觀察兩個性狀是如何成組遺傳的。",
            "2-3": "難度最高！根據寶寶出現的性狀組合，判斷父親兩條染色體分別帶有什麼基因（即聯鎖排列）。"
        };
        document.getElementById('mission-title').innerText = `關卡 ${state.mainL}-${state.subL}`;
        document.getElementById('mission-desc').innerText = descs[`${state.mainL}-${state.subL}`];
    }

    function randomizeTarget() {
        state.targetChroms = generateRandomChroms(state.mainL === 2);
        state.playerChroms = [
            {g: state.mainL === 2 ? ['e','t'] : ['e']},
            {g: state.mainL === 2 ? ['e','t'] : ['e']}
        ];
    }

    function randomizeParents() {
        state.motherChroms = generateRandomChroms(state.mainL === 2);
        state.fatherChroms = generateRandomChroms(state.mainL === 2);
    }

    function generateRandomChroms(isLinked) {
        const poolE = ['E','e'];
        const poolT = ['T','t'];
        const g1 = isLinked ? [poolE[Math.floor(Math.random()*2)], poolT[Math.floor(Math.random()*2)]] : [poolE[Math.floor(Math.random()*2)]];
        const g2 = isLinked ? [poolE[Math.floor(Math.random()*2)], poolT[Math.floor(Math.random()*2)]] : [poolE[Math.floor(Math.random()*2)]];
        return [{g:g1}, {g:g2}];
    }

    function getPheno(chroms) {
        const res = {};
        const allGenes = chroms[0].g.concat(chroms[1].g);
        ['E','T'].forEach(k => { res[k] = allGenes.includes(k); });
        return res;
    }

    // --- 繪圖功能 ---
    function drawMomo(chroms, x, y, scale=1, label="") {
        const p = getPheno(chroms);
        let h = `<g transform="translate(${x},${y}) scale(${scale})">`;
        if (state.mainL === 2) {
            if (p.T) h += `<path d="M-20,20 Q-60,60 -20,70 Q0,50 -10,30" fill="#ff7a45" stroke="#333" />`;
            else h += `<circle cx="-25" cy="25" r="10" fill="#eee" stroke="#333" />`;
        }
        h += `<circle cx="0" cy="15" r="40" fill="#fff1f1" stroke="#333" stroke-width="2" />`;
        h += `<ellipse cx="0" cy="35" rx="20" ry="10" fill="#ffd6d6" opacity="0.5" />`;
        if (p.E) { 
            h += `<path d="M-30,-15 L-45,-50 L-10,-35 Z" fill="#fff1f1" stroke="#333" />`;
            h += `<path d="M30,-15 L45,-50 L10,-35 Z" fill="#fff1f1" stroke="#333" />`;
        } else {
            h += `<path d="M-30,-15 Q-50,20 -25,30 Q-10,20 -15,-10 Z" fill="#fff1f1" stroke="#333" />`;
            h += `<path d="M30,-15 Q50,20 25,30 Q10,20 15,-10 Z" fill="#fff1f1" stroke="#333" />`;
        }
        h += `<circle cx="-15" cy="5" r="4" fill="#333" />`;
        h += `<circle cx="15" cy="5" r="4" fill="#333" />`;
        h += `<path d="M-5,15 Q0,20 5,15" fill="none" stroke="#333" stroke-width="2" />`;
        if(label) h += `<text y="70" text-anchor="middle" fill="#8b949e" font-size="12">${label}</text>`;
        h += `</g>`;
        return h;
    }

    function drawInteractiveChroms(chroms, x, y, stateKey) {
        let h = `<g transform="translate(${x},${y})">`;
        chroms.forEach((c, idx) => {
            const cx = idx * 34 - 17;
            h += `<rect x="${cx}" y="0" width="14" height="60" rx="7" fill="#30363d" stroke="#58a6ff" stroke-width="1.5" />`;
            c.g.forEach((gene, gIdx) => {
                const gy = gIdx * 25 + 15;
                const isDom = gene === gene.toUpperCase();
                // 點擊區域
                h += `<rect x="${cx}" y="${gy-10}" width="30" height="20" fill="transparent" style="cursor:pointer" onclick="toggleStateGene('${stateKey}',${idx},${gIdx})"/>`;
                h += `<rect x="${cx+2}" y="${gy}" width="10" height="4" rx="2" fill="${isDom?'#ff7a45':'#58a6ff'}" pointer-events="none" />`;
                h += `<text x="${cx+18}" y="${gy+5}" font-size="11" fill="white" font-weight="bold" pointer-events="none">${gene}</text>`;
            });
        });
        h += `</g>`;
        return h;
    }

    function toggleStateGene(key, cIdx, gIdx) {
        if (state.isWon) return;
        const target = state[key];
        const cur = target[cIdx].g[gIdx];
        target[cIdx].g[gIdx] = cur === cur.toUpperCase() ? cur.toLowerCase() : cur.toUpperCase();
        render();
        if (state.subL === 1) checkWin1();
    }

    function render() {
        let h = "";
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;

        if (state.subL === 1) {
            h += drawMomo(state.playerChroms, cx - 180, cy - 60, 1.6, "你的小獸");
            h += drawInteractiveChroms(state.playerChroms, cx - 180, cy + 50, 'playerChroms');
            h += drawMomo(state.targetChroms, cx + 180, cy - 60, 1.6, "目標外型");
            controls.innerHTML = `<button class="btn btn-secondary" onclick="randomizeTarget();render();">更換目標</button>`;
        } 
        else if (state.subL === 2) {
            h += drawMomo(state.motherChroms, cx - 220, cy - 140, 1, "母本");
            h += drawInteractiveChroms(state.motherChroms, cx - 220, cy - 80, 'motherChroms');
            h += drawMomo(state.fatherChroms, cx + 220, cy - 140, 1, "父本");
            h += drawInteractiveChroms(state.fatherChroms, cx + 220, cy - 80, 'fatherChroms');
            
            if (state.children.length > 0) {
                const baby = state.children[state.children.length-1];
                h += drawMomo(baby, cx, cy + 40, 1.6, "子代結果");
                h += drawInteractiveChroms(baby, cx, cy + 120, ''); // 子代不可編輯
            }
            controls.innerHTML = `
                <button class="btn btn-secondary" onclick="randomizeParents();render();">隨機父母</button>
                <button class="btn" onclick="breed(1)">執行雜合 (配對)</button>
            `;
        }
        else if (state.subL === 3) {
            h += drawMomo(state.motherChroms, cx - 250, cy - 150, 0.8, "母親");
            h += `<g transform="translate(${cx+200},${cy-150})">
                <rect x="-40" y="-40" width="80" height="80" rx="10" fill="#161b22" stroke="#30363d" />
                <text y="15" text-anchor="middle" font-size="50" fill="#30363d" font-weight="bold">?</text>
                <text y="60" text-anchor="middle" fill="#8b949e">神秘父親</text>
            </g>`;
            
            if (state.children.length > 0) {
                const batch = state.children[state.children.length-1];
                batch.forEach((child, i) => {
                    const r = Math.floor(i/10); const c = i%10;
                    h += drawMomo(child, cx - 240 + c*55, cy + 50 + r*75, 0.45);
                });
            }
            renderControlsGuess();
        }

        viewport.innerHTML = h;
    }

    function renderControlsGuess() {
        let optionsHtml = "";
        if (state.mainL === 1) {
            optionsHtml = `<select id="guess-select">
                <option value="EE">父親為 EE (純合顯性)</option>
                <option value="Ee">父親為 Ee (雜合子)</option>
                <option value="ee">父親為 ee (純合隱性)</option>
            </select>`;
        } else {
            // 聯鎖排列選項
            const combos = ["ET/ET", "ET/Et", "ET/eT", "ET/et", "Et/Et", "Et/eT", "Et/et", "eT/eT", "eT/et", "et/et"];
            optionsHtml = `<select id="guess-select">` + 
                combos.map(c => `<option value="${c}">${c}</option>`).join("") + 
                `</select>`;
        }

        controls.innerHTML = `
            <button class="btn btn-secondary" onclick="state.hiddenFather=generateRandomChroms(state.mainL==2);state.children=[];render();">更換父親</button>
            <button class="btn" onclick="breed(20)">產生 20 個寶寶</button>
            <div style="display:flex; align-items:center; gap:5px; margin-left:10px; border-left:1px solid #30363d; padding-left:10px;">
                ${optionsHtml}
                <button class="btn btn-success" onclick="checkGuess()">提交答案</button>
            </div>
        `;
    }

    function checkWin1() {
        const p1 = JSON.stringify(getPheno(state.playerChroms));
        const p2 = JSON.stringify(getPheno(state.targetChroms));
        if (p1 === p2) triggerWin();
    }

    function checkGuess() {
        const guess = document.getElementById('guess-select').value;
        const actualArr = state.hiddenFather.map(c => c.g.join(""));
        // 標準化實際基因型字串
        let actual = actualArr.sort().join("/");
        if (state.mainL === 1) {
            actual = actual.replace("/", "");
            // 對於單基因 Ee vs eE 做處理
            if (actual === "eE") actual = "Ee";
        } else {
            // 對於 ET/et 這類排序做處理
        }

        // 簡單的比對邏輯：將使用者選擇與實際組合排序後比對
        const guessNormalized = guess.split("/").sort().join("/");
        const actualNormalized = actual.split("/").sort().join("/");

        if (guessNormalized === actualNormalized) triggerWin();
        else alert("不對喔，再觀察一下寶寶的性狀比例！");
    }

    function triggerWin() {
        state.isWon = true;
        overlay.style.display = 'flex';
        setTimeout(() => {
            overlay.style.display = 'none';
            state.isWon = false;
        }, 3000);
    }

    function breed(count) {
        if (state.isWon) return;
        const father = state.subL === 3 ? state.hiddenFather : state.fatherChroms;
        if (count === 1) {
            const child = [ JSON.parse(JSON.stringify(state.motherChroms[Math.floor(Math.random()*2)])), 
                            JSON.parse(JSON.stringify(father[Math.floor(Math.random()*2)])) ];
            state.children.push(child);
        } else {
            const batch = [];
            for(let i=0; i<20; i++) {
                batch.push([ JSON.parse(JSON.stringify(state.motherChroms[Math.floor(Math.random()*2)])), 
                             JSON.parse(JSON.stringify(father[Math.floor(Math.random()*2)])) ]);
            }
            state.children.push(batch);
        }
        render();
    }

    function setupInteractions() {
        let isDown = false;
        window.addEventListener('pointerdown', e => { 
            if(e.target.tagName==='rect' || e.target.tagName==='button' || e.target.tagName==='select') return;
            isDown = true; state.lastMouse = {x:e.clientX, y:e.clientY}; 
        });
        window.addEventListener('pointermove', e => {
            if(!isDown) return;
            state.panX += e.clientX - state.lastMouse.x;
            state.panY += e.clientY - state.lastMouse.y;
            state.lastMouse = {x:e.clientX, y:e.clientY};
            viewport.setAttribute('transform', `translate(${state.panX},${state.panY}) scale(${state.zoom})`);
        });
        window.addEventListener('pointerup', () => isDown = false);
        window.addEventListener('wheel', e => {
            const d = e.deltaY > 0 ? 0.9 : 1.1;
            state.zoom *= d;
            viewport.setAttribute('transform', `translate(${state.panX},${state.panY}) scale(${state.zoom})`);
        }, {passive:false});
    }

    init();
</script>
</body>
</html>
