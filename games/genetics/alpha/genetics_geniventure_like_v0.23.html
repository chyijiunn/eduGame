<style>
  :root{
    --bg:#0b0f17;
    --panel:#121a28cc;
    --panel2:#0f1624e6;
    --txt:#e9eefc;
    --muted:#a8b3d6;
    --accent:#7cf3c7;
    --warn:#ffcf5a;
    --bad:#ff6b8b;
    --good:#67e06f;
    --line:#223052;
    --btn:#1b2946;
    --btn2:#213257;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", Arial;}
  #wrap{position:fixed;inset:0;overflow:hidden}
  canvas{position:absolute;inset:0;touch-action:none;}

  .bottomBar{
    position:absolute; left:12px; right:12px; bottom:12px;
    display:flex; flex-direction:column; gap:10px;
    pointer-events:none;
  }
  .card{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:10px 12px;
    backdrop-filter: blur(8px);
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .col{display:flex; flex-direction:column; gap:10px; align-items:center}
  .spacer{flex:1}
  .btn{
    appearance:none; border:1px solid var(--line);
    background:linear-gradient(180deg,var(--btn),var(--btn2));
    color:var(--txt);
    border-radius:14px;
    padding:10px 12px;
    font-size:13px; font-weight:900;
    cursor:pointer;
    user-select:none;
  }
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{border-color:#2f7c66; box-shadow:0 0 0 1px rgba(124,243,199,.15) inset}
  .btn.warn{border-color:#6c5731}
  .btn.big{padding:14px 18px; font-size:15px; border-radius:16px}
  .btn.nav{padding:12px 14px; font-size:13px; border-radius:14px}
  .btn.hyb{padding:16px 22px; font-size:18px; border-radius:18px; letter-spacing:.5px}
  .btn.wide{min-width:min(340px, 92vw)}
  .btn.center{display:inline-flex; justify-content:center}
  .select{
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--txt);
    border-radius:12px;
    padding:10px 12px;
    font-size:13px;
    font-weight:900;
    cursor:pointer;
  }
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 11px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel2);
    font-size:13px;
    color:var(--txt);
    user-select:none;
  }
  .dot{width:8px;height:8px;border-radius:999px;background:var(--accent); box-shadow:0 0 10px rgba(124,243,199,.6)}
  .dot.good{background:var(--good); box-shadow:0 0 10px rgba(103,224,111,.55)}
  .dot.warn{background:var(--warn); box-shadow:0 0 10px rgba(255,207,90,.55)}
  .toast{
    position:absolute; left:50%; bottom:140px; transform:translateX(-50%);
    background:rgba(15,22,36,.92);
    border:1px solid #2a3a63;
    border-radius:14px;
    padding:10px 12px;
    box-shadow:var(--shadow);
    font-size:12px;
    color:var(--txt);
    opacity:0;
    transition:opacity .18s ease, transform .18s ease;
    pointer-events:none;
    max-width:min(740px, calc(100% - 20px));
    text-align:center;
    z-index:5;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-2px)}
  .ctlNote{
    width:100%;
    color:var(--muted);
    font-weight:900;
    font-size:13px;
    text-align:center;
    padding:8px 6px;
    border-radius:12px;
    border:1px dashed rgba(168,179,214,.28);
    background:rgba(15,22,36,.38);
  }

  
  .topBar{
    position:absolute; left:12px; right:12px; top:12px;
    pointer-events:none;
    z-index:6;
  }
  .topBar .card{ pointer-events:auto; }

  @media (max-width:720px){
    .bottomBar{left:10px; right:10px; bottom:10px}
    .card{border-radius:14px}
    .toast{bottom:160px}
  }

<script>
(() => {
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const pick = (arr)=>arr[(Math.random()*arr.length)|0];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });

  let W=1,H=1, DPR=1;
  const bottomBar = document.getElementById('bottomBar');
  const topBar = document.getElementById('topBar');
  function bottomBarH(){ return bottomBar ? bottomBar.offsetHeight : 220; }
  function topBarH(){ return topBar ? topBar.offsetHeight : 72; }

  const view = { x:0, y:0, s:1 };
  const viewTarget = { x:0, y:0, s:1 };

  function isSmallDevice(){
    const m = Math.min(W,H);
    return (m < 760) || (W < 900);
  }

  function resize(){
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    // Use visualViewport when available (mobile address bar / rotation stability)
    const vv = window.visualViewport;
    const w = Math.max(1, Math.floor((vv ? vv.width : window.innerWidth)));
    const h = Math.max(1, Math.floor((vv ? vv.height : window.innerHeight)));

    W = w; H = h;

    // Explicit CSS size (some browsers can return 0 if only relying on inset sizing during layout)
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    // Ensure drawing uses CSS pixels
    ctx.setTransform(DPR,0,0,DPR,0,0);

    // Always try to fit after resize/orientation changes so內容不會跑出畫面
    autoFitStage(true);
  }
  window.addEventListener('resize', resize, {passive:true});
  window.addEventListener('orientationchange', ()=>setTimeout(resize, 60), {passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', ()=>setTimeout(resize, 0), {passive:true});
    window.visualViewport.addEventListener('scroll', ()=>setTimeout(resize, 0), {passive:true});
  }
  resize();


  function resetView(silent=false){
    viewTarget.x = 0; viewTarget.y = 0; viewTarget.s = 1;
    if(isSmallDevice()) autoFitStage(true);
    if(!silent) toast("已重置視角");
  }
  document.getElementById('resetViewBtn').addEventListener('click', ()=>resetView(false));

  function worldToScreen(wx, wy){
    return { x: (wx + view.x)*view.s + W/2, y: (wy + view.y)*view.s + H/2 };
  }
  function screenToWorld(sx, sy){
    return { x: (sx - W/2)/view.s - view.x, y: (sy - H/2)/view.s - view.y };
  }

  // Pan/zoom
  const pointers = new Map();
  let isPanning = false;
  let panStart = null;
  let pinch = null;

  function onPointerDown(e){
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1){
      isPanning = true;
      panStart = {sx:e.clientX, sy:e.clientY, vx:viewTarget.x, vy:viewTarget.y};
    }else if(pointers.size === 2){
      const pts = [...pointers.values()];
      const dx = pts[1].x - pts[0].x;
      const dy = pts[1].y - pts[0].y;
      pinch = { d0: Math.hypot(dx,dy), s0:viewTarget.s, cx0:(pts[0].x+pts[1].x)/2, cy0:(pts[0].y+pts[1].y)/2 };
      isPanning = false;
      panStart = null;
    }
  }
  function onPointerMove(e){
    const p = pointers.get(e.pointerId);
    if(!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if(pointers.size === 1 && isPanning && panStart){
      const dx = (e.clientX - panStart.sx)/viewTarget.s;
      const dy = (e.clientY - panStart.sy)/viewTarget.s;
      viewTarget.x = panStart.vx + dx;
      viewTarget.y = panStart.vy + dy;
    }else if(pointers.size === 2 && pinch){
      const pts = [...pointers.values()];
      const dx = pts[1].x - pts[0].x;
      const dy = pts[1].y - pts[0].y;
      const d = Math.hypot(dx,dy);
      const scale = clamp(d / pinch.d0, 0.5, 2.5);
      const newS = clamp(pinch.s0 * scale, 0.5, 2.8);

      const before = screenToWorld(pinch.cx0, pinch.cy0);
      viewTarget.s = newS;
      const after = screenToWorld(pinch.cx0, pinch.cy0);
      viewTarget.x += (after.x - before.x);
      viewTarget.y += (after.y - before.y);

      pinch.d0 = d;
      pinch.s0 = viewTarget.s;
      pinch.cx0 = (pts[0].x+pts[1].x)/2;
      pinch.cy0 = (pts[0].y+pts[1].y)/2;
    }
  }
  function onPointerUp(e){
    pointers.delete(e.pointerId);
    if(pointers.size === 0){
      isPanning = false; panStart = null; pinch = null;
    }else if(pointers.size === 1){
      const pt = [...pointers.values()][0];
      isPanning = true;
      panStart = {sx:pt.x, sy:pt.y, vx:viewTarget.x, vy:viewTarget.y};
      pinch = null;
    }
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const delta = -e.deltaY;
    const zoomFactor = Math.exp(delta * 0.0012);
    const newS = clamp(viewTarget.s * zoomFactor, 0.5, 2.8);

    const sx = e.clientX, sy = e.clientY;
    const before = screenToWorld(sx, sy);
    viewTarget.s = newS;
    const after = screenToWorld(sx, sy);
    viewTarget.x += (after.x - before.x);
    viewTarget.y += (after.y - before.y);
  }, {passive:false});

  // Click to toggle alleles
  let clickCandidate = null;
  canvas.addEventListener('pointerdown', (e)=>{
    clickCandidate = {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now()};
  }, {passive:true});
  canvas.addEventListener('pointerup', (e)=>{
    if(!clickCandidate || clickCandidate.id !== e.pointerId) return;
    const dx = e.clientX - clickCandidate.x;
    const dy = e.clientY - clickCandidate.y;
    const dt = performance.now() - clickCandidate.t;
    if(Math.hypot(dx,dy) < 6 && dt < 450 && pointers.size===0){
      const w = screenToWorld(e.clientX, e.clientY);
      handleClick(w.x, w.y);
    }
    clickCandidate = null;
  }, {passive:true});

  function phenotype1_fromGeno(geno){ return geno.includes("A") ? "Trait1" : "Trait2"; }
  function prettyGeno(a1,a2){
    if((a1==="A"&&a2==="a")||(a1==="a"&&a2==="A")) return "Aa";
    return a1+a2;
  }

  function prettyGeno2(h1, h2){
    const g1 = (h1.E===h2.E) ? (h1.E+h2.E) : "Ee";
    const g2 = (h1.T===h2.T) ? (h1.T+h2.T) : "Tt";
    return {g1, g2};
  }
  function phenotype2(h1,h2){
    const hasE = (h1.E==="E" || h2.E==="E");
    const hasT = (h1.T==="T" || h2.T==="T");
    return {ear: hasE ? "floppy" : "pointy", tail: hasT ? "curly" : "straight"};
  }

  const ui = {
    controls: document.getElementById('controls'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    lvTitle: document.getElementById('lvTitle'),
    lvDot: document.getElementById('lvDot'),
    toast: document.getElementById('toast'),
    stageSelect: document.getElementById('stageSelect'),
  };
  function toast(msg){
    ui.toast.textContent = msg;
    ui.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>ui.toast.classList.remove('show'), 1200);
  }


  // Help / README modal
  const modalBack = document.getElementById('modalBack');
  const modalClose = document.getElementById('modalClose');
  const mdHost = document.getElementById('md');
  const helpBtn = document.getElementById('helpBtn');

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  // Minimal markdown renderer (headings, lists, bold/italic, code, links, blockquote, fenced code)
  function renderMarkdown(md){
    md = md.replace(/\r\n/g, "\n");

    // fenced code blocks
    const codeBlocks = [];
    md = md.replace(/```([\s\S]*?)```/g, (_, code) => {
      codeBlocks.push(code);
      return `@@CODEBLOCK_${codeBlocks.length-1}@@`;
    });

    // escape html in remaining text
    md = escapeHtml(md);

    // restore codeblocks as escaped inside <pre><code>
    md = md.replace(/@@CODEBLOCK_(\d+)@@/g, (_, i) => {
      const code = escapeHtml(codeBlocks[+i]);
      return `<pre><code>${code}</code></pre>`;
    });

    // blockquotes
    md = md.replace(/(^|\n)&gt;\s?(.*)(?=\n|$)/g, (_, p, line) => `${p}<blockquote>${line}</blockquote>`);

    // headings
    md = md.replace(/(^|\n)###\s+(.*)(?=\n|$)/g, (_, p, t) => `${p}<h3>${t}</h3>`);
    md = md.replace(/(^|\n)##\s+(.*)(?=\n|$)/g,  (_, p, t) => `${p}<h2>${t}</h2>`);
    md = md.replace(/(^|\n)#\s+(.*)(?=\n|$)/g,   (_, p, t) => `${p}<h1>${t}</h1>`);

    // links [text](url)
    md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g, `<a href="$2" target="_blank" rel="noopener">$1</a>`);

    // inline code
    md = md.replace(/`([^`]+)`/g, `<code>$1</code>`);

    // bold / italic
    md = md.replace(/\*\*([^*]+)\*\*/g, `<strong>$1</strong>`);
    md = md.replace(/\*([^*]+)\*/g, `<em>$1</em>`);

    // lists
    // Convert consecutive - items into <ul>
    md = md.replace(/(^|\n)(?:-\s.*(?:\n|$))+?/g, (block) => {
      const lines = block.trim().split("\n").filter(Boolean);
      if(!lines.every(l => l.startsWith("- "))) return block;
      const items = lines.map(l => `<li>${l.slice(2)}</li>`).join("");
      return `\n<ul>${items}</ul>\n`;
    });

    // paragraphs: split by blank lines, wrap plain text lines
    const parts = md.split(/\n{2,}/).map(p => p.trim()).filter(p=>p.length);
    const out = parts.map(p => {
      if(/^<h\d|^<ul|^<pre|^<blockquote/.test(p)) return p;
      // join lines within paragraph
      p = p.replace(/\n/g, "<br/>");
      return `<p>${p}</p>`;
    }).join("\n");

    return out;
  }

  function autoFitStage(silent){
    const b = stageBounds(stage().id);
    const pad = 28;
    const availW = Math.max(320, W - pad*2);
    const availH = Math.max(360, (H - bottomBarH() - topBarH()) - pad*2);
    const bw = b.maxX - b.minX;
    const bh = b.maxY - b.minY;

    let s = Math.min(availW / bw, availH / bh);
    s = clamp(s, 0.40, 1.25);

    const cx = (b.minX + b.maxX)/2;
    const cy = (b.minY + b.maxY)/2;

    const centerY = (topBarH() + (H - bottomBarH()))/2;
    const targetY = (centerY - H/2)/s - cy;

    viewTarget.s = s;
    viewTarget.x = -cx;
    viewTarget.y = targetY;

    if(!silent) toast("已自動置中");
  }

  function drawGrid(){
    const step = 140;
    const tl = screenToWorld(0,0);
    const br = screenToWorld(W,H);
    const x0 = Math.floor(tl.x/step)*step;
    const y0 = Math.floor(tl.y/step)*step;
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 1;
    for(let x=x0; x<br.x+step; x+=step){
      const s1 = worldToScreen(x, tl.y);
      const s2 = worldToScreen(x, br.y);
      ctx.strokeStyle = '#16213a';
      ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
    }
    for(let y=y0; y<br.y+step; y+=step){
      const s1 = worldToScreen(tl.x, y);
      const s2 = worldToScreen(br.x, y);
      ctx.strokeStyle = '#16213a';
      ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
    }
    ctx.restore();
  }
  function fillRoundedRect(sx,sy,w,h,r, fill, stroke){
    ctx.beginPath();
    const rr = Math.min(r, w/2, h/2);
    ctx.moveTo(sx+rr, sy);
    ctx.arcTo(sx+w, sy, sx+w, sy+h, rr);
    ctx.arcTo(sx+w, sy+h, sx, sy+h, rr);
    ctx.arcTo(sx, sy+h, sx, sy, rr);
    ctx.arcTo(sx, sy, sx+w, sy, rr);
    ctx.closePath();
    if(fill){ ctx.fillStyle = fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }
  function drawLabel(wx,wy,text,kind="muted"){
    const s = worldToScreen(wx,wy);
    ctx.save();
    ctx.font = '900 14px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC"';
    const padX=10;
    const w = ctx.measureText(text).width + padX*2;
    const h = 26;
    const x = s.x - w/2, y = s.y - h/2;
    const fill = kind==="muted" ? 'rgba(15,22,36,.80)' : kind==="good" ? 'rgba(16,42,22,.85)' : kind==="bad" ? 'rgba(56,16,26,.85)' : 'rgba(43,34,14,.85)';
    const stroke = kind==="muted" ? '#2a3a63' : kind==="good" ? '#2f6f36' : kind==="bad" ? '#7c2f43' : '#6c5731';
    fillRoundedRect(x,y,w,h,12,fill,stroke);
    ctx.fillStyle = '#e9eefc';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x+padX, y+h/2);
    ctx.restore();
  }

    ctx.fillStyle = 'rgba(233,238,252,.95)';

    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, R*0.78, R*0.72, R*0.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = st.body;
    ctx.beginPath(); ctx.ellipse(0,0, R*0.72, R*0.62, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = st.belly;
    ctx.beginPath(); ctx.ellipse(0, R*0.10, R*0.45, R*0.36, 0, 0, Math.PI*2); ctx.fill();
    const wig = Math.sin(t*3 + wx*0.02)*0.18;
    ctx.fillStyle = st.body;
    ctx.save(); ctx.rotate(-wig);
    ctx.beginPath();
    ctx.moveTo(-R*0.42, -R*0.45);
    ctx.quadraticCurveTo(-R*0.70, -R*0.78, -R*0.30, -R*0.66);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.rotate(wig);
    ctx.beginPath();
    ctx.moveTo(R*0.42, -R*0.45);
    ctx.quadraticCurveTo(R*0.70, -R*0.78, R*0.30, -R*0.66);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = st.eye;
    ctx.beginPath(); ctx.arc(-R*0.22, -R*0.05, R*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.22, -R*0.05, R*0.08, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(-R*0.25, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.19, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(11,15,23,.85)';
    ctx.lineWidth = Math.max(2, R*0.03);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R*0.08, R*0.15);
    ctx.quadraticCurveTo(0, R*0.22, R*0.08, R*0.15);
    ctx.stroke();
    ctx.fillStyle = st.blush;
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(-R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function drawCreature2(wx, wy, scale, ph, t=0){
    const pal = (ph.ear==="floppy") ? basePalette("mint") : basePalette("pink");
    const s = worldToScreen(wx,wy);
    const R = 120*scale*view.s;
    ctx.save();
    ctx.translate(s.x,s.y);
    const wag = Math.sin(t*4 + wx*0.02)*0.35;
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, R*0.82, R*0.74, R*0.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(R*0.62, R*0.18);
    ctx.rotate(wag);
    ctx.strokeStyle = pal.body;
    ctx.lineWidth = Math.max(6, R*0.10);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if(ph.tail==="curly"){
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(R*0.35,-R*0.10, R*0.35, R*0.30, 0, R*0.28);
      ctx.bezierCurveTo(-R*0.22, R*0.25, -R*0.15, R*0.08, R*0.06, R*0.10);
    }else{
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(R*0.45, R*0.05, R*0.55, R*0.26);
    }
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = pal.body;
    ctx.beginPath(); ctx.ellipse(0,0, R*0.72, R*0.62, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = pal.belly;
    ctx.beginPath(); ctx.ellipse(0, R*0.12, R*0.46, R*0.36, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = pal.body;
    if(ph.ear==="floppy"){
      ctx.save(); ctx.rotate(-0.15);
      ctx.beginPath();
      ctx.moveTo(-R*0.45,-R*0.42);
      ctx.quadraticCurveTo(-R*0.70,-R*0.35, -R*0.58,-R*0.10);
      ctx.quadraticCurveTo(-R*0.52, R*0.05, -R*0.38, -R*0.05);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.rotate(0.15);
      ctx.beginPath();
      ctx.moveTo(R*0.45,-R*0.42);
      ctx.quadraticCurveTo(R*0.70,-R*0.35, R*0.58,-R*0.10);
      ctx.quadraticCurveTo(R*0.52, R*0.05, R*0.38, -R*0.05);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-R*0.58, -R*0.12, R*0.10, R*0.06, -0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(R*0.58, -R*0.12, R*0.10, R*0.06, 0.1, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }else{
      const wig = Math.sin(t*2.8 + wx*0.02)*0.18;
      ctx.save(); ctx.rotate(-wig);
      ctx.beginPath();
      ctx.moveTo(-R*0.42, -R*0.48);
      ctx.quadraticCurveTo(-R*0.74, -R*0.90, -R*0.26, -R*0.68);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.rotate(wig);
      ctx.beginPath();
      ctx.moveTo(R*0.42, -R*0.48);
      ctx.quadraticCurveTo(R*0.74, -R*0.90, R*0.26, -R*0.68);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = pal.eye;
    ctx.beginPath(); ctx.arc(-R*0.22, -R*0.05, R*0.082, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.22, -R*0.05, R*0.082, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(-R*0.25, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.19, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(11,15,23,.85)';
    ctx.lineWidth = Math.max(2, R*0.03);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R*0.08, R*0.16);
    ctx.quadraticCurveTo(0, R*0.23, R*0.08, R*0.16);
    ctx.stroke();
    ctx.fillStyle = pal.blush;
    ctx.globalAlpha = 0.33;
    ctx.beginPath(); ctx.arc(-R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawChromosomePanel(wx, wy, title){
    const s = worldToScreen(wx,wy);
    const w = 240*view.s, h = 160*view.s;
    fillRoundedRect(s.x-w/2, s.y-h/2, w, h, 18, 'rgba(18,26,40,.70)', '#223052');
    ctx.save();
    ctx.fillStyle = '#e9eefc';
    ctx.font = '900 ' + (14*view.s) + 'px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC"';
    ctx.textBaseline = 'top';
    const tw = ctx.measureText(title).width;
    ctx.fillText(title, s.x - tw/2, s.y-h/2 + 10*view.s);
    ctx.restore();
  }

  function drawChromosome1(wx, wy, allele, hitId){
    const s = worldToScreen(wx,wy);
    const h = 94*view.s, w = 44*view.s, r=18*view.s;
    fillRoundedRect(s.x-w/2, s.y-h/2, w, h, r, 'rgba(35,50,87,.55)', '#2a3a63');
    ctx.fillStyle = 'rgba(124,243,199,.20)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, w*0.40, h*0.09, 0, 0, Math.PI*2); ctx.fill();
    const badgeW = 36*view.s, badgeH = 34*view.s;
    const bx = s.x-badgeW/2, by = s.y - h*0.12;
    const isDom = (allele==="A");
    const stroke = isDom ? '#2f7c66' : '#6c5731';
    const fill2 = isDom ? 'rgba(124,243,199,.18)' : 'rgba(255,207,90,.12)';
    fillRoundedRect(bx,by,badgeW,badgeH,12*view.s,fill2, stroke);
    ctx.fillStyle = '#e9eefc';
    ctx.font = '900 ' + (22*view.s) + 'px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC"';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(allele).width;
    ctx.fillText(allele, s.x - tw/2, by+badgeH/2+1*view.s);
    addHit(wx-40, wy-60, 80, 120, ()=>toggleAllele(hitId));
  }

  function drawChromosome2(wx, wy, haplo, hitPrefix){
    const s = worldToScreen(wx,wy);
    const h = 102*view.s, w = 44*view.s, r=18*view.s;
    fillRoundedRect(s.x-w/2, s.y-h/2, w, h, r, 'rgba(35,50,87,.55)', '#2a3a63');
    ctx.fillStyle = 'rgba(124,243,199,.20)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, w*0.40, h*0.08, 0, 0, Math.PI*2); ctx.fill();
    badge(s.x, s.y - h*0.24, haplo.E, hitPrefix + ":E");
    badge(s.x, s.y + h*0.10, haplo.T, hitPrefix + ":T");
    function badge(cx, cy, allele, hitId){
      const badgeW = 36*view.s, badgeH = 32*view.s;
      const bx = cx-badgeW/2, by = cy-badgeH/2;
      const isDom = (allele===allele.toUpperCase());
      const stroke = isDom ? '#2f7c66' : '#6c5731';
      const fill2 = isDom ? 'rgba(124,243,199,.18)' : 'rgba(255,207,90,.12)';
      fillRoundedRect(bx,by,badgeW,badgeH,12*view.s,fill2, stroke);
      ctx.fillStyle = '#e9eefc';
      ctx.font = '900 ' + (20*view.s) + 'px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC"';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(allele).width;
      ctx.fillText(allele, cx - tw/2, cy+1*view.s);
      addHit(wx-40, (hitId.endsWith(":E")? wy-62 : wy-5), 80, 60, ()=>toggleAllele(hitId));
    }
  }

  function render(){
    const id = stage().id;
    const POS = {L:-300, R:300, PANEL_Y:-210, CHR_Y:-195, CRE_Y:150, MID_Y:170};

    if(id==="1-1"){
      const l = game.big1.l11;
      const playerG = prettyGeno(l.player[0], l.player[1]);
      const playerP = phenotype1_fromGeno(playerG);
      drawChromosomePanel(POS.L,POS.PANEL_Y,"你的染色體");
      drawChromosome1(POS.L-70,POS.CHR_Y,l.player[0], "p0");
      drawChromosome1(POS.L+70,POS.CHR_Y,l.player[1], "p1");
      drawCreature1(POS.L, POS.CRE_Y, 1.0, playerP, timeAcc);
      if(l.solved){ drawBigCorrect(); }
      else{ drawLabel(POS.R, POS.PANEL_Y, "目標外觀", "muted"); drawCreature1(POS.R, POS.CRE_Y, 1.0, l.target.pheno, timeAcc); }
      return;
    }

    if(id==="1-2"){
      const l = game.big1.l12;
      const mP = phenotype1_fromGeno(prettyGeno(l.mother.chrom[0], l.mother.chrom[1]));
      const fP = phenotype1_fromGeno(prettyGeno(l.father.chrom[0], l.father.chrom[1]));
      drawChromosomePanel(POS.L,POS.PANEL_Y,"母親");
      drawChromosome1(POS.L-70,POS.CHR_Y,l.mother.chrom[0], "m0");
      drawChromosome1(POS.L+70,POS.CHR_Y,l.mother.chrom[1], "m1");
      drawCreature1(POS.L, POS.CRE_Y, 1.0, mP, timeAcc);
      drawChromosomePanel(POS.R,POS.PANEL_Y,"父親");
      drawChromosome1(POS.R-70,POS.CHR_Y,l.father.chrom[0], "f0");
      drawChromosome1(POS.R+70,POS.CHR_Y,l.father.chrom[1], "f1");
      drawCreature1(POS.R, POS.CRE_Y, 1.0, fP, timeAcc);
      if(l.chosen){
        drawLabel(0, -290, `母配子：${l.chosen.mAllele}　父配子：${l.chosen.fAllele}`, "muted");
        drawCreature1(0, POS.MID_Y, 1.05, l.child.pheno, timeAcc);
        drawLabel(0, 380, `子代：${l.child.geno}`, "good");
      }else{
        drawLabel(0, -290, "按下下方『雜合』按鈕產生子代", "warn");
        drawCreature1(0, POS.MID_Y, 1.05, "Trait2", timeAcc);
      }
      return;
    }

    if(id==="1-3"){
      const l = game.big1.l13;
      const mP = phenotype1_fromGeno(prettyGeno(l.mother.chrom[0], l.mother.chrom[1]));
      drawChromosomePanel(POS.L,POS.PANEL_Y,"母親");
      drawChromosome1(POS.L-70,POS.CHR_Y,l.mother.chrom[0], "m0");
      drawChromosome1(POS.L+70,POS.CHR_Y,l.mother.chrom[1], "m1");
      drawCreature1(POS.L, POS.CRE_Y, 1.0, mP, timeAcc);
      drawLabel(POS.R, POS.PANEL_Y, "父親（？）", "warn");
      if(l.revealed){
        const fP = phenotype1_fromGeno(prettyGeno(l.fatherHidden.chrom[0], l.fatherHidden.chrom[1]));
        drawCreature1(POS.R, POS.CRE_Y, 1.0, fP, timeAcc);
      }else{
        drawQuestionCreature(POS.R, POS.CRE_Y);
      }
      if(l.solved){ drawBigCorrect(); }
      drawLabel(0,-320, `第 ${l.history.length} 輪`, "muted");
      if(l.history.length===0){ drawLabel(0, -285, "按下下方『雜合 +20』按鈕生成寶寶", "warn"); return; }
      const cur = l.history[l.history.length-1];
      const AA = cur.summary["AA"]||0, Aa = cur.summary["Aa"]||0, aa = cur.summary["aa"]||0;
      drawLabel(0, -285, `AA ${AA} / Aa ${Aa} / aa ${aa}`, "muted");
      const babies = cur.babies;
      const cols = 5, rows = 4;
      const startX = -210, startY = -120;
      let idx=0;
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          const b = babies[idx++];
          const x = startX + c*105;
          const y = startY + r*105;
          drawCreature1(x, y, 0.28, b.pheno, timeAcc);
          drawLabel(x, y+62, b.geno, "muted");
        }
      }
      return;
    }

    if(id==="2-1"){
      const l = game.big2.l21;
      const phP = phenotype2(l.player[0], l.player[1]);
      drawChromosomePanel(POS.L,POS.PANEL_Y,"你的染色體");
      drawChromosome2(POS.L-70,POS.CHR_Y,l.player[0], "p0");
      drawChromosome2(POS.L+70,POS.CHR_Y,l.player[1], "p1");
      drawCreature2(POS.L, POS.CRE_Y, 1.0, phP, timeAcc);
      if(l.solved){ drawBigCorrect(); }
      else{ drawLabel(POS.R, POS.PANEL_Y, "目標外觀", "muted"); drawCreature2(POS.R, POS.CRE_Y, 1.0, l.target.ph, timeAcc); }
      return;
    }

    if(id==="2-2"){
      const l = game.big2.l22;
      const mPh = phenotype2(l.mother.chrom[0], l.mother.chrom[1]);
      const fPh = phenotype2(l.father.chrom[0], l.father.chrom[1]);
      drawChromosomePanel(POS.L,POS.PANEL_Y,"母親");
      drawChromosome2(POS.L-70,POS.CHR_Y,l.mother.chrom[0], "m0");
      drawChromosome2(POS.L+70,POS.CHR_Y,l.mother.chrom[1], "m1");
      drawCreature2(POS.L, POS.CRE_Y, 1.0, mPh, timeAcc);
      drawChromosomePanel(POS.R,POS.PANEL_Y,"父親");
      drawChromosome2(POS.R-70,POS.CHR_Y,l.father.chrom[0], "f0");
      drawChromosome2(POS.R+70,POS.CHR_Y,l.father.chrom[1], "f1");
      drawCreature2(POS.R, POS.CRE_Y, 1.0, fPh, timeAcc);
      if(l.chosen){
        drawLabel(0, -290, `母取第${l.chosen.mIdx}條｜父取第${l.chosen.fIdx}條`, "muted");
        drawCreature2(0, POS.MID_Y, 1.05, l.child.ph, timeAcc);
        drawLabel(0, 380, `子代：${l.child.g.g1}；${l.child.g.g2}`, "good");
      }else{
        drawLabel(0, -290, "按下下方『雜合』按鈕產生子代", "warn");
        drawCreature2(0, POS.MID_Y, 1.05, {ear:"pointy", tail:"straight"}, timeAcc);
      }
      return;
    }

    // 2-3
    const l = game.big2.l23;
    const mPh = phenotype2(l.mother.chrom[0], l.mother.chrom[1]);
    drawChromosomePanel(POS.L,POS.PANEL_Y,"母親");
    drawChromosome2(POS.L-70,POS.CHR_Y,l.mother.chrom[0], "m0");
    drawChromosome2(POS.L+70,POS.CHR_Y,l.mother.chrom[1], "m1");
    drawCreature2(POS.L, POS.CRE_Y, 1.0, mPh, timeAcc);
    drawLabel(POS.R, POS.PANEL_Y, "父親（？）", "warn");
    if(l.revealed){
      const fG = prettyGeno2(l.fatherHidden.chrom[0], l.fatherHidden.chrom[1]);
      const fPh = phenotype2(l.fatherHidden.chrom[0], l.fatherHidden.chrom[1]);
      drawCreature2(POS.R, POS.CRE_Y, 1.0, fPh, timeAcc);
      drawLabel(POS.R, 390, `父：${fG.g1}；${fG.g2}`, "muted");
    }else{
      drawQuestionCreature(POS.R, POS.CRE_Y);
    }
    if(l.solved){ drawBigCorrect(); }
    drawLabel(0,-320, `第 ${l.history.length} 輪`, "muted");
    if(l.history.length===0){ drawLabel(0, -285, "按下下方『雜合 +20』按鈕生成寶寶", "warn"); return; }
    const cur = l.history[l.history.length-1];
    drawLabel(0, -285, `本輪：${top2(cur.summary)}`, "muted");
    const babies = cur.babies;
    const cols = 5, rows = 4;
    const startX = -210, startY = -120;
    let idx=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const b = babies[idx++];
        const x = startX + c*105;
        const y = startY + r*105;
        drawCreature2(x, y, 0.26, b.ph, timeAcc);
        drawLabel(x, y+62, shortPh(b.ph), "muted");
      }
    }
    function top2(map){
      const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,2);
      return arr.map(([k,v])=>`${shortKey(k)}=${v}`).join("  ");
    }
    function shortKey(k){
      const [e,t] = k.split("|");
      return (e==="floppy"?"垂":"尖") + (t==="curly"?"捲":"直");
    }
    function shortPh(ph){
      const e = (ph.ear==="floppy")?"垂":"尖";
      const ta = (ph.tail==="curly")?"捲":"直";
      return `${e}${ta}`;
    }
  }

  let last = performance.now();
  let timeAcc = 0;
  function tick(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    timeAcc += dt;

    view.x = lerp(view.x, viewTarget.x, 1-Math.pow(0.0006, dt*60));
    view.y = lerp(view.y, viewTarget.y, 1-Math.pow(0.0006, dt*60));
    view.s = lerp(view.s, viewTarget.s, 1-Math.pow(0.0006, dt*60));

    ctx.fillStyle = '#0b0f17';
    ctx.fillRect(0,0,W,H);
    hits.length = 0;
    drawGrid();

    render();

    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#a8b3d6';
    ctx.font = '12px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC"';
    ctx.fillText('v0.23', 14, H-14);
    ctx.restore();

    requestAnimationFrame(tick);
  }

  buildControls();
  setStage(0);
  // iOS/Safari: ensure layout settled before first frame
  setTimeout(()=>autoFitStage(true), 0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
