<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>遺傳闖關 v0.12（單檔）</title>
<style>
  :root{
    --bg:#0b0f17;
    --panel:#121a28cc;
    --panel2:#0f1624e6;
    --txt:#e9eefc;
    --muted:#a8b3d6;
    --accent:#7cf3c7;
    --warn:#ffcf5a;
    --bad:#ff6b8b;
    --good:#67e06f;
    --line:#223052;
    --btn:#1b2946;
    --btn2:#213257;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", Arial;}
  #wrap{position:fixed;inset:0;overflow:hidden}
  canvas{position:absolute;inset:0;touch-action:none;}

  .bottomBar{
    position:absolute; left:12px; right:12px; bottom:12px;
    display:flex; flex-direction:column; gap:10px;
    pointer-events:none;
  }
  .card{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:10px 12px;
    backdrop-filter: blur(8px);
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .spacer{flex:1}
  .btn{
    appearance:none; border:1px solid var(--line);
    background:linear-gradient(180deg,var(--btn),var(--btn2));
    color:var(--txt);
    border-radius:12px;
    padding:9px 10px;
    font-size:12px; font-weight:900;
    cursor:pointer;
    user-select:none;
  }
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{border-color:#2f7c66; box-shadow:0 0 0 1px rgba(124,243,199,.15) inset}
  .btn.warn{border-color:#6c5731}
  .btn.small{padding:8px 10px; font-size:12px}

  .select{
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--txt);
    border-radius:12px;
    padding:8px 10px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
  }
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel2);
    font-size:12px;
    color:var(--txt);
    user-select:none;
  }
  .dot{width:8px;height:8px;border-radius:999px;background:var(--accent); box-shadow:0 0 10px rgba(124,243,199,.6)}
  .dot.bad{background:var(--bad); box-shadow:0 0 10px rgba(255,107,139,.55)}
  .dot.good{background:var(--good); box-shadow:0 0 10px rgba(103,224,111,.55)}
  .dot.warn{background:var(--warn); box-shadow:0 0 10px rgba(255,207,90,.55)}
  .toast{
    position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    background:rgba(15,22,36,.92);
    border:1px solid #2a3a63;
    border-radius:14px;
    padding:10px 12px;
    box-shadow:var(--shadow);
    font-size:12px;
    color:var(--txt);
    opacity:0;
    transition:opacity .18s ease, transform .18s ease;
    pointer-events:none;
    max-width:min(740px, calc(100% - 20px));
    text-align:center;
    z-index:5;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-2px)}

  @media (max-width:720px){
    .bottomBar{left:10px; right:10px; bottom:10px}
    .card{border-radius:14px}
    .toast{bottom:130px}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="bottomBar">
    <div class="card">
      <div id="controls" class="row"></div>
    </div>

    <div class="card">
      <div class="row">
        <button class="btn small" id="prevBtn" title="上一關">&lt;</button>

        <span class="pill">
          <span class="dot warn" id="lvDot"></span>
          <span id="lvTitle">1-1</span>
        </span>

        <select class="select" id="stageSelect" title="選擇關卡"></select>

        <span class="spacer"></span>

        <button class="btn small warn" id="resetViewBtn" title="重置視角">重置視角</button>
        <button class="btn small primary" id="nextBtn" title="下一關">&gt;</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const pick = (arr)=>arr[(Math.random()*arr.length)|0];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });

  let W=1,H=1, DPR=1;
  function resize(){
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize, {passive:true});
  resize();

  const view = { x:0, y:0, s:1 };
  const viewTarget = { x:0, y:0, s:1 };
  function resetView(silent=false){
    viewTarget.x = 0; viewTarget.y = 0; viewTarget.s = 1;
    if(!silent) toast("已重置視角");
  }
  document.getElementById('resetViewBtn').addEventListener('click', ()=>resetView(false));

  function worldToScreen(wx, wy){
    return { x: (wx + view.x)*view.s + W/2, y: (wy + view.y)*view.s + H/2 };
  }
  function screenToWorld(sx, sy){
    return { x: (sx - W/2)/view.s - view.x, y: (sy - H/2)/view.s - view.y };
  }

  const pointers = new Map();
  let isPanning = false;
  let panStart = null;
  let pinch = null;

  function onPointerDown(e){
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1){
      isPanning = true;
      panStart = {sx:e.clientX, sy:e.clientY, vx:viewTarget.x, vy:viewTarget.y};
    }else if(pointers.size === 2){
      const pts = [...pointers.values()];
      const dx = pts[1].x - pts[0].x;
      const dy = pts[1].y - pts[0].y;
      pinch = { d0: Math.hypot(dx,dy), s0:viewTarget.s, cx0:(pts[0].x+pts[1].x)/2, cy0:(pts[0].y+pts[1].y)/2 };
      isPanning = false;
      panStart = null;
    }
  }
  function onPointerMove(e){
    const p = pointers.get(e.pointerId);
    if(!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if(pointers.size === 1 && isPanning && panStart){
      const dx = (e.clientX - panStart.sx)/viewTarget.s;
      const dy = (e.clientY - panStart.sy)/viewTarget.s;
      viewTarget.x = panStart.vx + dx;
      viewTarget.y = panStart.vy + dy;
    }else if(pointers.size === 2 && pinch){
      const pts = [...pointers.values()];
      const dx = pts[1].x - pts[0].x;
      const dy = pts[1].y - pts[0].y;
      const d = Math.hypot(dx,dy);
      const scale = clamp(d / pinch.d0, 0.5, 2.5);
      const newS = clamp(pinch.s0 * scale, 0.5, 2.8);

      const before = screenToWorld(pinch.cx0, pinch.cy0);
      viewTarget.s = newS;
      const after = screenToWorld(pinch.cx0, pinch.cy0);
      viewTarget.x += (after.x - before.x);
      viewTarget.y += (after.y - before.y);

      pinch.d0 = d;
      pinch.s0 = viewTarget.s;
      pinch.cx0 = (pts[0].x+pts[1].x)/2;
      pinch.cy0 = (pts[0].y+pts[1].y)/2;
    }
  }
  function onPointerUp(e){
    pointers.delete(e.pointerId);
    if(pointers.size === 0){
      isPanning = false; panStart = null; pinch = null;
    }else if(pointers.size === 1){
      const pt = [...pointers.values()][0];
      isPanning = true;
      panStart = {sx:pt.x, sy:pt.y, vx:viewTarget.x, vy:viewTarget.y};
      pinch = null;
    }
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const delta = -e.deltaY;
    const zoomFactor = Math.exp(delta * 0.0012);
    const newS = clamp(viewTarget.s * zoomFactor, 0.5, 2.8);

    const sx = e.clientX, sy = e.clientY;
    const before = screenToWorld(sx, sy);
    viewTarget.s = newS;
    const after = screenToWorld(sx, sy);
    viewTarget.x += (after.x - before.x);
    viewTarget.y += (after.y - before.y);
  }, {passive:false});

  let clickCandidate = null;
  canvas.addEventListener('pointerdown', (e)=>{
    clickCandidate = {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now()};
  }, {passive:true});
  canvas.addEventListener('pointerup', (e)=>{
    if(!clickCandidate || clickCandidate.id !== e.pointerId) return;
    const dx = e.clientX - clickCandidate.x;
    const dy = e.clientY - clickCandidate.y;
    const dt = performance.now() - clickCandidate.t;
    if(Math.hypot(dx,dy) < 6 && dt < 450 && pointers.size===0){
      const w = screenToWorld(e.clientX, e.clientY);
      handleClick(w.x, w.y);
    }
    clickCandidate = null;
  }, {passive:true});

  // Big 1 (single locus)
  function phenotype1_fromGeno(geno, dom){
    const hasA = geno.includes("A");
    const hasa = geno.includes("a");
    if(dom==="A") return hasA ? "Trait1" : "Trait2";
    return hasa ? "Trait1" : "Trait2";
  }
  function prettyGeno(a1,a2){
    if((a1==="A"&&a2==="a")||(a1==="a"&&a2==="A")) return "Aa";
    return a1+a2;
  }

  // Big 2 (two loci, linked)
  function prettyGeno2(h1, h2){
    const g1 = (h1.E===h2.E) ? (h1.E+h2.E) : "Ee";
    const g2 = (h1.T===h2.T) ? (h1.T+h2.T) : "Tt";
    return {g1, g2};
  }
  function phenotype2(h1,h2, domE="E", domT="T"){
    const hasE = (h1.E==="E" || h2.E==="E");
    const hase = (h1.E==="e" || h2.E==="e");
    const hasT = (h1.T==="T" || h2.T==="T");
    const hast = (h1.T==="t" || h2.T==="t");

    const ear = (domE==="E") ? (hasE ? "floppy" : "pointy") : (hase ? "floppy" : "pointy");
    const tail = (domT==="T") ? (hasT ? "curly" : "straight") : (hast ? "curly" : "straight");
    const sparkle = (hasE && hasT) ? "star" : (hasE && !hasT) ? "heart" : (!hasE && hasT) ? "dot" : "none";
    return {ear, tail, sparkle};
  }

  const ui = {
    controls: document.getElementById('controls'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    resetViewBtn: document.getElementById('resetViewBtn'),
    lvTitle: document.getElementById('lvTitle'),
    lvDot: document.getElementById('lvDot'),
    toast: document.getElementById('toast'),
    stageSelect: document.getElementById('stageSelect'),
  };
  function toast(msg){
    ui.toast.textContent = msg;
    ui.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>ui.toast.classList.remove('show'), 1300);
  }

  const stages = [
    {id:"1-1", big:1, sub:1, label:"1-1 單性狀：顯隱性"},
    {id:"1-2", big:1, sub:2, label:"1-2 單性狀：雜合出子代"},
    {id:"1-3", big:1, sub:3, label:"1-3 單性狀：反推父親"},
    {id:"2-1", big:2, sub:1, label:"2-1 兩性狀：連鎖配對"},
    {id:"2-2", big:2, sub:2, label:"2-2 兩性狀：雜合出子代"},
    {id:"2-3", big:2, sub:3, label:"2-3 兩性狀：反推父親"},
  ];

  const game = {
    stageIndex: 0,
    big1: {
      dom:"A",
      l11:{ player:["A","a"], target:null, solved:false },
      l12:{ dom:"A", mother:{chrom:["A","a"]}, father:{chrom:["A","A"]}, chosen:null, child:null },
      l13:{ dom:"A", mother:{chrom:["A","a"]}, fatherHidden:{chrom:["a","a"]}, history:[], guess:"AA", revealed:false }
    },
    big2: {
      domE:"E", domT:"T",
      l21:{ player:[{E:"E",T:"T"},{E:"e",T:"t"}], target:null, solved:false },
      l22:{ domE:"E", domT:"T",
            mother:{chrom:[{E:"E",T:"t"},{E:"e",T:"T"}]},
            father:{chrom:[{E:"E",T:"T"},{E:"e",T:"t"}]},
            chosen:null, child:null
      },
      l23:{ domE:"E", domT:"T",
            mother:{chrom:[{E:"E",T:"t"},{E:"e",T:"t"}]},
            fatherHidden:{chrom:[{E:"E",T:"T"},{E:"e",T:"t"}]},
            history:[], guess:"EE;TT", revealed:false
      }
    }
  };

  function newTarget11(){
    const dom = pick(["A","a"]);
    const g = pick([["A","A"],["A","a"],["a","a"]]);
    const geno = prettyGeno(g[0],g[1]);
    const ph = phenotype1_fromGeno(geno, dom);
    return { dom, geno, pheno:ph };
  }
  function randomParents12(){
    const genos = [["A","A"],["A","a"],["a","a"]];
    const m = pick(genos), f = pick(genos);
    game.big1.l12.mother.chrom = [m[0],m[1]];
    game.big1.l12.father.chrom = [f[0],f[1]];
    game.big1.l12.dom = pick(["A","a"]);
    game.big1.l12.chosen=null; game.big1.l12.child=null;
  }
  function randomHiddenFather13(){
    const genos = [["A","A"],["A","a"],["a","a"]];
    const f = pick(genos);
    game.big1.l13.fatherHidden.chrom = [f[0],f[1]];
    game.big1.l13.dom = pick(["A","a"]);
    game.big1.l13.history=[]; game.big1.l13.guess="AA"; game.big1.l13.revealed=false;
  }

  function newTarget21(){
    const domE = pick(["E","e"]);
    const domT = pick(["T","t"]);
    const haplos = [
      {E:"E",T:"T"},{E:"E",T:"t"},{E:"e",T:"T"},{E:"e",T:"t"}
    ];
    const h1 = pick(haplos), h2 = pick(haplos);
    const ph = phenotype2(h1,h2, domE, domT);
    const g = prettyGeno2(h1,h2);
    return { domE, domT, h1, h2, g, ph };
  }
  function randomParents22(){
    const haplos = [
      {E:"E",T:"T"},{E:"E",T:"t"},{E:"e",T:"T"},{E:"e",T:"t"}
    ];
    game.big2.l22.mother.chrom = [structuredClone(pick(haplos)), structuredClone(pick(haplos))];
    game.big2.l22.father.chrom = [structuredClone(pick(haplos)), structuredClone(pick(haplos))];
    game.big2.l22.domE = pick(["E","e"]);
    game.big2.l22.domT = pick(["T","t"]);
    game.big2.l22.chosen=null; game.big2.l22.child=null;
  }
  function randomHiddenFather23(){
    const haplos = [
      {E:"E",T:"T"},{E:"E",T:"t"},{E:"e",T:"T"},{E:"e",T:"t"}
    ];
    game.big2.l23.fatherHidden.chrom = [structuredClone(pick(haplos)), structuredClone(pick(haplos))];
    game.big2.l23.domE = pick(["E","e"]);
    game.big2.l23.domT = pick(["T","t"]);
    game.big2.l23.history=[]; game.big2.l23.guess="EE;TT"; game.big2.l23.revealed=false;
  }

  game.big1.l11.target = newTarget11();
  randomParents12();
  randomHiddenFather13();
  game.big2.l21.target = newTarget21();
  randomParents22();
  randomHiddenFather23();

  function clearEl(el){ while(el.firstChild) el.removeChild(el.firstChild); }
  function makeBtn(label, cls, onClick){
    const b = document.createElement('button');
    b.className = 'btn ' + (cls||'');
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }
  function makeSelect(options, value, onChange){
    const s = document.createElement('select');
    s.className = 'select';
    for(const opt of options){
      const o = document.createElement('option');
      o.value = opt.value;
      o.textContent = opt.label;
      s.appendChild(o);
    }
    s.value = value;
    s.addEventListener('change', ()=>onChange(s.value));
    return s;
  }

  function stage(){ return stages[game.stageIndex]; }
  function setStage(idx){
    game.stageIndex = clamp(idx, 0, stages.length-1);
    ui.prevBtn.disabled = (game.stageIndex===0);
    ui.nextBtn.disabled = (game.stageIndex===stages.length-1);

    ui.lvTitle.textContent = stages[game.stageIndex].id;
    ui.lvDot.className = 'dot ' + (stage().big===1 ? 'warn' : 'good');

    ui.stageSelect.value = String(game.stageIndex);

    resetView(true);
    buildControls();
    toast(stages[game.stageIndex].label);
  }

  ui.prevBtn.addEventListener('click', ()=>setStage(game.stageIndex-1));
  ui.nextBtn.addEventListener('click', ()=>setStage(game.stageIndex+1));

  // stage select bottom
  clearEl(ui.stageSelect);
  stages.forEach((s,i)=>{
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = s.label;
    ui.stageSelect.appendChild(o);
  });
  ui.stageSelect.addEventListener('change', ()=>{
    setStage(parseInt(ui.stageSelect.value,10));
  });

  function buildControls(){
    clearEl(ui.controls);
    const id = stage().id;

    const domSelect_Aa = (obj, key) => makeSelect([
      {value:"A", label:"顯性：A"},
      {value:"a", label:"顯性：a"},
    ], obj[key], (v)=>{obj[key]=v; toast("已更新顯性");});
    const domSelect_Ee = (obj, key) => makeSelect([
      {value:"E", label:"耳顯性：E"},
      {value:"e", label:"耳顯性：e"},
    ], obj[key], (v)=>{obj[key]=v; toast("已更新耳顯性");});
    const domSelect_Tt = (obj, key) => makeSelect([
      {value:"T", label:"尾顯性：T"},
      {value:"t", label:"尾顯性：t"},
    ], obj[key], (v)=>{obj[key]=v; toast("已更新尾顯性");});

    if(id==="1-1"){
      ui.controls.appendChild(makeBtn("新題目", "", ()=>{
        game.big1.l11.target = newTarget11();
        game.big1.l11.solved = false;
        game.big1.dom = pick(["A","a"]);
        game.big1.l11.player = pick([["A","A"],["A","a"],["a","a"]]).slice();
        toast("已換一題");
      }));
      ui.controls.appendChild(domSelect_Aa(game.big1, "dom"));
      ui.controls.appendChild(makeBtn("檢查", "primary", ()=>check11()));
    }else if(id==="1-2"){
      ui.controls.appendChild(makeBtn("重抽親代", "", ()=>{ randomParents12(); toast("已重抽父母"); }));
      ui.controls.appendChild(domSelect_Aa(game.big1.l12, "dom"));
      ui.controls.appendChild(makeBtn("雜合", "primary", ()=>hybrid12()));
      ui.controls.appendChild(makeBtn("清除子代", "", ()=>{ game.big1.l12.chosen=null; game.big1.l12.child=null; toast("已清除"); }));
    }else if(id==="1-3"){
      ui.controls.appendChild(makeBtn("新回合", "", ()=>{ randomHiddenFather13(); toast("已更換未知父親"); }));
      ui.controls.appendChild(domSelect_Aa(game.big1.l13, "dom"));
      ui.controls.appendChild(makeBtn("雜合 +20", "primary", ()=>hybrid13()));
      ui.controls.appendChild(makeBtn("回溯", "", ()=>undo13()));
      ui.controls.appendChild(makeBtn("揭曉", "warn", ()=>reveal13()));
      ui.controls.appendChild(makeSelect([
        {value:"AA", label:"猜：AA"},
        {value:"Aa", label:"猜：Aa"},
        {value:"aa", label:"猜：aa"},
      ], game.big1.l13.guess, (v)=>{game.big1.l13.guess=v; checkGuess13();}));
    }else if(id==="2-1"){
      ui.controls.appendChild(makeBtn("新題目", "", ()=>{
        game.big2.l21.target = newTarget21();
        game.big2.l21.solved = false;
        game.big2.domE = pick(["E","e"]);
        game.big2.domT = pick(["T","t"]);
        const haplos = [{E:"E",T:"T"},{E:"E",T:"t"},{E:"e",T:"T"},{E:"e",T:"t"}];
        game.big2.l21.player = [structuredClone(pick(haplos)), structuredClone(pick(haplos))];
        toast("已換一題");
      }));
      ui.controls.appendChild(domSelect_Ee(game.big2, "domE"));
      ui.controls.appendChild(domSelect_Tt(game.big2, "domT"));
      ui.controls.appendChild(makeBtn("檢查", "primary", ()=>check21()));
    }else if(id==="2-2"){
      ui.controls.appendChild(makeBtn("重抽親代", "", ()=>{ randomParents22(); toast("已重抽父母"); }));
      ui.controls.appendChild(domSelect_Ee(game.big2.l22, "domE"));
      ui.controls.appendChild(domSelect_Tt(game.big2.l22, "domT"));
      ui.controls.appendChild(makeBtn("雜合", "primary", ()=>hybrid22()));
      ui.controls.appendChild(makeBtn("清除子代", "", ()=>{ game.big2.l22.chosen=null; game.big2.l22.child=null; toast("已清除"); }));
    }else{
      ui.controls.appendChild(makeBtn("新回合", "", ()=>{ randomHiddenFather23(); toast("已更換未知父親"); }));
      ui.controls.appendChild(domSelect_Ee(game.big2.l23, "domE"));
      ui.controls.appendChild(domSelect_Tt(game.big2.l23, "domT"));
      ui.controls.appendChild(makeBtn("雜合 +20", "primary", ()=>hybrid23()));
      ui.controls.appendChild(makeBtn("回溯", "", ()=>undo23()));
      ui.controls.appendChild(makeBtn("揭曉", "warn", ()=>reveal23()));
      ui.controls.appendChild(makeSelect([
        {value:"EE;TT", label:"猜：EE；TT"},
        {value:"EE;Tt", label:"猜：EE；Tt"},
        {value:"EE;tt", label:"猜：EE；tt"},
        {value:"Ee;TT", label:"猜：Ee；TT"},

  function drawGrid(){
    const step = 120;
    const tl = screenToWorld(0,0);
    const br = screenToWorld(W,H);
    const x0 = Math.floor(tl.x/step)*step;
    const y0 = Math.floor(tl.y/step)*step;
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 1;
    for(let x=x0; x<br.x+step; x+=step){
      const s1 = worldToScreen(x, tl.y);
      const s2 = worldToScreen(x, br.y);
      ctx.strokeStyle = '#16213a';
      ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
    }
    for(let y=y0; y<br.y+step; y+=step){
      const s1 = worldToScreen(tl.x, y);
      const s2 = worldToScreen(br.x, y);
      ctx.strokeStyle = '#16213a';
      ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
    }
    ctx.restore();
  }
  function fillRoundedRect(sx,sy,w,h,r, fill, stroke){
    ctx.beginPath();
    const rr = Math.min(r, w/2, h/2);
    ctx.moveTo(sx+rr, sy);
    ctx.arcTo(sx+w, sy, sx+w, sy+h, rr);
    ctx.arcTo(sx+w, sy+h, sx, sy+h, rr);
    ctx.arcTo(sx, sy+h, sx, sy, rr);
    ctx.arcTo(sx, sy, sx+w, sy, rr);
    ctx.closePath();
    if(fill){ ctx.fillStyle = fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }
  function drawLabel(wx,wy,text,kind="muted"){
    const s = worldToScreen(wx,wy);
    ctx.save();
    ctx.font = '900 14px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC"';
    const padX=10;
    const w = ctx.measureText(text).width + padX*2;
    const h = 26;
    const x = s.x - w/2, y = s.y - h/2;
    const fill = kind==="muted" ? 'rgba(15,22,36,.80)' : kind==="good" ? 'rgba(16,42,22,.85)' : kind==="bad" ? 'rgba(56,16,26,.85)' : 'rgba(43,34,14,.85)';
    const stroke = kind==="muted" ? '#2a3a63' : kind==="good" ? '#2f6f36' : kind==="bad" ? '#7c2f43' : '#6c5731';
    fillRoundedRect(x,y,w,h,12,fill,stroke);
    ctx.fillStyle = '#e9eefc';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x+padX, y+h/2);
    ctx.restore();
  }

  function basePalette(seed){
    if(seed==="mint") return {body:'#7cf3c7', belly:'#e9fdf5', eye:'#0b0f17', blush:'#6fe7ff'};
    return {body:'#ff6b8b', belly:'#ffe4ea', eye:'#0b0f17', blush:'#ffd66f'};
  }

  function drawCreature1(wx, wy, scale, pheno, label, t=0){
    const st = (pheno==="Trait1") ? basePalette("mint") : basePalette("pink");
    const s = worldToScreen(wx,wy);
    const R = 58*scale*view.s;

    ctx.save();
    ctx.translate(s.x,s.y);

    const bob = Math.sin(t*2.2 + wx*0.01)*R*0.03;
    ctx.translate(0, bob);

    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, R*0.78, R*0.72, R*0.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = st.body;
    ctx.beginPath(); ctx.ellipse(0,0, R*0.72, R*0.62, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = st.belly;
    ctx.beginPath(); ctx.ellipse(0, R*0.10, R*0.45, R*0.36, 0, 0, Math.PI*2); ctx.fill();

    const wig = Math.sin(t*3 + wx*0.02)*0.18;
    ctx.fillStyle = st.body;
    ctx.save();
    ctx.rotate(-wig);
    ctx.beginPath();
    ctx.moveTo(-R*0.42, -R*0.45);
    ctx.quadraticCurveTo(-R*0.70, -R*0.78, -R*0.30, -R*0.66);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.rotate(wig);
    ctx.beginPath();
    ctx.moveTo(R*0.42, -R*0.45);
    ctx.quadraticCurveTo(R*0.70, -R*0.78, R*0.30, -R*0.66);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.fillStyle = st.eye;
    ctx.beginPath(); ctx.arc(-R*0.22, -R*0.05, R*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.22, -R*0.05, R*0.08, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(-R*0.25, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.19, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(11,15,23,.85)';
    ctx.lineWidth = Math.max(2, R*0.03);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R*0.08, R*0.15);
    ctx.quadraticCurveTo(0, R*0.22, R*0.08, R*0.15);
    ctx.stroke();

    ctx.fillStyle = st.blush;
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(-R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();
    if(label) drawLabel(wx, wy + 95*scale, label, "muted");
  }

    const pal = (ph.ear==="floppy") ? basePalette("mint") : basePalette("pink");

    ctx.fillStyle = pal.belly;
    ctx.beginPath(); ctx.ellipse(0, R*0.12, R*0.46, R*0.36, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = pal.body;
    if(ph.ear==="floppy"){
      ctx.save(); ctx.rotate(-0.15);
      ctx.beginPath();
      ctx.moveTo(-R*0.45,-R*0.42);
      ctx.quadraticCurveTo(-R*0.70,-R*0.35, -R*0.58,-R*0.10);
      ctx.quadraticCurveTo(-R*0.52, R*0.05, -R*0.38, -R*0.05);

      ctx.restore();
      ctx.save(); ctx.rotate(0.15);
      ctx.beginPath();
      ctx.moveTo(R*0.45,-R*0.42);
      ctx.quadraticCurveTo(R*0.70,-R*0.35, R*0.58,-R*0.10);
      ctx.quadraticCurveTo(R*0.52, R*0.05, R*0.38, -R*0.05);

      ctx.restore();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-R*0.58, -R*0.12, R*0.10, R*0.06, -0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(R*0.58, -R*0.12, R*0.10, R*0.06, 0.1, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }else{
      const wig = Math.sin(t*2.8 + wx*0.02)*0.18;
      ctx.save(); ctx.rotate(-wig);
      ctx.beginPath();
      ctx.moveTo(-R*0.42, -R*0.48);
      ctx.quadraticCurveTo(-R*0.74, -R*0.90, -R*0.26, -R*0.68);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.rotate(wig);
      ctx.beginPath();
      ctx.moveTo(R*0.42, -R*0.48);
      ctx.quadraticCurveTo(R*0.74, -R*0.90, R*0.26, -R*0.68);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = pal.eye;
    ctx.beginPath(); ctx.arc(-R*0.22, -R*0.05, R*0.082, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.22, -R*0.05, R*0.082, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(-R*0.25, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.19, -R*0.08, R*0.028, 0, Math.PI*2); ctx.fill();

    if(ph.sparkle!=="none"){
      ctx.save();
      ctx.translate(0, -R*0.08);
      ctx.globalAlpha = 0.8;
      if(ph.sparkle==="star"){
        ctx.fillStyle = '#fff6b6';
        star(0,0,R*0.18,R*0.08,5);
      }else if(ph.sparkle==="heart"){
        ctx.fillStyle = '#ffd1e0';
        heart(0,0,R*0.16);
      }else{
        ctx.fillStyle = '#d7e6ff';
        ctx.beginPath(); ctx.arc(0,0,R*0.11,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    ctx.strokeStyle = 'rgba(11,15,23,.85)';
    ctx.lineWidth = Math.max(2, R*0.03);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R*0.08, R*0.16);
    ctx.quadraticCurveTo(0, R*0.23, R*0.08, R*0.16);
    ctx.stroke();

    ctx.fillStyle = pal.blush;
    ctx.globalAlpha = 0.33;
    ctx.beginPath(); ctx.arc(-R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.36, R*0.08, R*0.10, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();
    if(label) drawLabel(wx, wy + 98*scale, label, "muted");

    function star(x,y,outer,inner,points){
      ctx.beginPath();
      for(let i=0;i<points*2;i++){
        const ang = i*Math.PI/points - Math.PI/2;
        const rad = (i%2===0)?outer:inner;
        ctx.lineTo(x+Math.cos(ang)*rad, y+Math.sin(ang)*rad);
      }
      ctx.closePath(); ctx.fill();
    }
    function heart(x,y,sz){
      ctx.beginPath();
      ctx.moveTo(x, y+sz*0.18);
      ctx.bezierCurveTo(x-sz*0.60, y-sz*0.25, x-sz*0.35, y-sz*0.85, x, y-sz*0.45);
      ctx.bezierCurveTo(x+sz*0.35, y-sz*0.85, x+sz*0.60, y-sz*0.25, x, y+sz*0.18);
      ctx.closePath(); ctx.fill();
    }
  }

  function toggleAllele(hitId){
    const id = stage().id;

    if(id==="1-1"){
      const idx = hitId.endsWith("0") ? 0 : 1;
      game.big1.l11.player[idx] = (game.big1.l11.player[idx]==="A") ? "a" : "A";
      return;
    }
    if(id==="1-2"){
      const who = hitId[0];
      const idx = hitId.endsWith("0") ? 0 : 1;
      const l = game.big1.l12;
      if(who==='m') l.mother.chrom[idx] = (l.mother.chrom[idx]==="A") ? "a" : "A";
      if(who==='f') l.father.chrom[idx] = (l.father.chrom[idx]==="A") ? "a" : "A";
      l.chosen=null; l.child=null;
      return;
    }
    if(id==="1-3"){
      const who = hitId[0];
      if(who==='m'){
        const idx = hitId.endsWith("0") ? 0 : 1;
        const l = game.big1.l13;
        l.mother.chrom[idx] = (l.mother.chrom[idx]==="A") ? "a" : "A";
        l.history=[];
      }
      return;
    }

    if(id==="2-1"){
      const [p, locus] = hitId.split(":");
      const idx = p.endsWith("0") ? 0 : 1;
      const h = game.big2.l21.player[idx];
      if(locus==="E") h.E = (h.E==="E") ? "e" : "E";
      if(locus==="T") h.T = (h.T==="T") ? "t" : "T";
      return;
    }
    if(id==="2-2"){
      const [p, locus] = hitId.split(":");
      const who = p[0];
      const idx = p.endsWith("0") ? 0 : 1;
      const l = game.big2.l22;
      const h = (who==='m') ? l.mother.chrom[idx] : l.father.chrom[idx];
      if(locus==="E") h.E = (h.E==="E") ? "e" : "E";
      if(locus==="T") h.T = (h.T==="T") ? "t" : "T";
      l.chosen=null; l.child=null;
      return;
    }
    if(id==="2-3"){
      const [p, locus] = hitId.split(":");
      const who = p[0];
      if(who!=='m') return;
      const idx = p.endsWith("0") ? 0 : 1;
      const l = game.big2.l23;
      const h = l.mother.chrom[idx];
      if(locus==="E") h.E = (h.E==="E") ? "e" : "E";
      if(locus==="T") h.T = (h.T==="T") ? "t" : "T";
      l.history=[];
      return;
    }
  }

  function render_1_1(t){
    const l = game.big1.l11, dom = game.big1.dom;
    const playerG = prettyGeno(l.player[0], l.player[1]);
    const playerP = phenotype1_fromGeno(playerG, dom);

    drawChromosomePanel(-330,-160,"你的染色體");
    drawChromosome1(-392,-150,l.player[0], dom, "p0");
    drawChromosome1(-268,-150,l.player[1], dom, "p1");
    drawLabel(-330, -95, "你的基因型："+playerG, "muted");
    drawCreature1(-330, 120, 1.0, playerP, "你", t);

    const target = l.target;
    drawChromosomePanel(330,-160,"目標（提示）");
    drawChromosome1(268,-150,target.geno[0], target.dom, "t0");
    drawChromosome1(392,-150,target.geno[1], target.dom, "t1");
    drawLabel(330, -95, `顯性：${target.dom}｜基因型：${target.geno}`, "muted");
    drawCreature1(330, 120, 1.0, target.pheno, "目標", t);

    drawLabel(0, -20, `顯性：${dom}｜表現：${playerP==="Trait1"?"薄荷":"草莓"}`, l.solved?"good":"muted");
  }

  function render_1_2(t){
    const l = game.big1.l12, dom = l.dom;
    const mG = prettyGeno(l.mother.chrom[0], l.mother.chrom[1]);
    const fG = prettyGeno(l.father.chrom[0], l.father.chrom[1]);
    const mP = phenotype1_fromGeno(mG, dom);
    const fP = phenotype1_fromGeno(fG, dom);

    drawChromosomePanel(-330,-160,"母親");
    drawChromosome1(-392,-150,l.mother.chrom[0], dom, "m0");
    drawChromosome1(-268,-150,l.mother.chrom[1], dom, "m1");
    drawLabel(-330, -95, "基因型："+mG, "muted");
    drawCreature1(-330, 120, 1.0, mP, "母", t);

    drawChromosomePanel(330,-160,"父親");
    drawChromosome1(268,-150,l.father.chrom[0], dom, "f0");
    drawChromosome1(392,-150,l.father.chrom[1], dom, "f1");
    drawLabel(330, -95, "基因型："+fG, "muted");
    drawCreature1(330, 120, 1.0, fP, "父", t);

    if(l.chosen){
      drawLabel(0, -220, `母配子：${l.chosen.mAllele}　父配子：${l.chosen.fAllele}`, "muted");
      drawCreature1(0, 120, 1.05, l.child.pheno, "子代", t);
      drawLabel(0, 235, `子代：${l.child.geno}（${l.child.pheno==="Trait1"?"薄荷":"草莓"}）`, "good");
    }else{
      drawLabel(0, -220, "按『雜合』產生子代", "warn");
      drawCreature1(0, 120, 1.05, "Trait2", "子代", t);
    }
  }

  function render_1_3(t){
    const l = game.big1.l13, dom = l.dom;
    const mG = prettyGeno(l.mother.chrom[0], l.mother.chrom[1]);
    const mP = phenotype1_fromGeno(mG, dom);

    drawChromosomePanel(-330,-160,"母親");
    drawChromosome1(-392,-150,l.mother.chrom[0], dom, "m0");
    drawChromosome1(-268,-150,l.mother.chrom[1], dom, "m1");
    drawLabel(-330, -95, "基因型："+mG, "muted");
    drawCreature1(-330, 120, 1.0, mP, "母", t);

    drawChromosomePanel(330,-160,"父親（？）");
    drawLabel(330, -150, "？？", "warn");
    drawCreature1(330, 120, 1.0, "Trait1",
      l.revealed ? ("父："+prettyGeno(l.fatherHidden.chrom[0], l.fatherHidden.chrom[1])) : "父（未知）", t);

    drawLabel(0,-235, `第 ${l.history.length} 輪`, "muted");

    if(l.history.length===0){
      drawLabel(0, -200, "按『雜合 +20』生成寶寶", "warn");
      return;
    }
    const cur = l.history[l.history.length-1];
    const AA = cur.summary["AA"]||0, Aa = cur.summary["Aa"]||0, aa = cur.summary["aa"]||0;
    drawLabel(0, -200, `AA ${AA} / Aa ${Aa} / aa ${aa}`, "muted");

    const babies = cur.babies;
    const cols = 5, rows = 4;
    const startX = -200, startY = -110;
    let idx=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const b = babies[idx++];
        const x = startX + c*100;
        const y = startY + r*90;
        drawCreature1(x, y, 0.55, b.pheno, null, t);
        drawLabel(x, y+52, b.geno, "muted");
      }
    }

    drawLabel(0, 300, l.revealed ? "答案已揭曉" : ("你的猜測："+l.guess), l.revealed?"good":"warn");
  }

  function render_2_1(t){
    const l = game.big2.l21, domE=game.big2.domE, domT=game.big2.domT;
    const phP = phenotype2(l.player[0], l.player[1], domE, domT);
    const gP = prettyGeno2(l.player[0], l.player[1]);

    drawChromosomePanel(-330,-160,"你的染色體");
    drawChromosome2(-392,-150,l.player[0], domE, domT, "p0");
    drawChromosome2(-268,-150,l.player[1], domE, domT, "p1");
    drawLabel(-330, -95, `基因型：${gP.g1}；${gP.g2}`, "muted");
    drawCreature2(-330, 120, 1.02, phP, "你", t);

    const target = l.target;
    drawChromosomePanel(330,-160,"目標（提示）");
    drawChromosome2(268,-150,target.h1, target.domE, target.domT, "t0");
    drawChromosome2(392,-150,target.h2, target.domE, target.domT, "t1");
    drawLabel(330, -95, `顯性：${target.domE}/${target.domT}｜${target.g.g1}；${target.g.g2}`, "muted");
    drawCreature2(330, 120, 1.02, target.ph, "目標", t);

    drawLabel(0,-20, `耳：${phP.ear==="floppy"?"垂":"尖"}　尾：${phP.tail==="curly"?"捲":"直"}　標記：${markName(phP.sparkle)}`, l.solved?"good":"muted");

    function markName(s){
      if(s==="star") return "★";
      if(s==="heart") return "♥";
      if(s==="dot") return "●";
      return "–";
    }
  }

  function render_2_2(t){
    const l = game.big2.l22, domE=l.domE, domT=l.domT;

    const mPh = phenotype2(l.mother.chrom[0], l.mother.chrom[1], domE, domT);
    const fPh = phenotype2(l.father.chrom[0], l.father.chrom[1], domE, domT);
    const mG = prettyGeno2(l.mother.chrom[0], l.mother.chrom[1]);
    const fG = prettyGeno2(l.father.chrom[0], l.father.chrom[1]);

    drawChromosomePanel(-330,-160,"母親");
    drawChromosome2(-392,-150,l.mother.chrom[0], domE, domT, "m0");
    drawChromosome2(-268,-150,l.mother.chrom[1], domE, domT, "m1");
    drawLabel(-330, -95, `基因型：${mG.g1}；${mG.g2}`, "muted");
    drawCreature2(-330, 120, 1.02, mPh, "母", t);

    drawChromosomePanel(330,-160,"父親");
    drawChromosome2(268,-150,l.father.chrom[0], domE, domT, "f0");
    drawChromosome2(392,-150,l.father.chrom[1], domE, domT, "f1");
    drawLabel(330, -95, `基因型：${fG.g1}；${fG.g2}`, "muted");
    drawCreature2(330, 120, 1.02, fPh, "父", t);

    if(l.chosen){
      drawLabel(0, -220, `母取第${l.chosen.mIdx}條（${l.chosen.mH.E}${l.chosen.mH.T}）｜父取第${l.chosen.fIdx}條（${l.chosen.fH.E}${l.chosen.fH.T}）`, "muted");
      drawCreature2(0, 120, 1.08, l.child.ph, "子代", t);
      drawLabel(0, 242, `子代：${l.child.g.g1}；${l.child.g.g2}`, "good");
    }else{
      drawLabel(0, -220, "按『雜合』產生子代", "warn");
      drawCreature2(0, 120, 1.08, {ear:"pointy", tail:"straight", sparkle:"none"}, "子代", t);
    }
  }

  function render_2_3(t){
    const l = game.big2.l23, domE=l.domE, domT=l.domT;
    const mPh = phenotype2(l.mother.chrom[0], l.mother.chrom[1], domE, domT);
    const mG = prettyGeno2(l.mother.chrom[0], l.mother.chrom[1]);

    drawChromosomePanel(-330,-160,"母親");
    drawChromosome2(-392,-150,l.mother.chrom[0], domE, domT, "m0");
    drawChromosome2(-268,-150,l.mother.chrom[1], domE, domT, "m1");
    drawLabel(-330, -95, `基因型：${mG.g1}；${mG.g2}`, "muted");
    drawCreature2(-330, 120, 1.02, mPh, "母", t);

    drawChromosomePanel(330,-160,"父親（？）");
    drawLabel(330, -150, "？？", "warn");
    drawCreature2(330, 120, 1.02, {ear:"floppy", tail:"curly", sparkle:"star"},
      l.revealed ? (()=>{const g=prettyGeno2(l.fatherHidden.chrom[0],l.fatherHidden.chrom[1]); return "父："+g.g1+"；"+g.g2;})() : "父（未知）", t);

    drawLabel(0,-235, `第 ${l.history.length} 輪`, "muted");

    if(l.history.length===0){
      drawLabel(0, -200, "按『雜合 +20』生成寶寶", "warn");
      return;
    }
    const cur = l.history[l.history.length-1];
    drawLabel(0, -200, `本輪：${top3(cur.summary)}`, "muted");

    const babies = cur.babies;
    const cols = 5, rows = 4;
    const startX = -200, startY = -110;
    let idx=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const b = babies[idx++];
        const x = startX + c*100;
        const y = startY + r*90;
        drawCreature2(x, y, 0.52, b.ph, null, t);
        drawLabel(x, y+52, shortPh(b.ph), "muted");
      }
    }

    drawLabel(0, 300, l.revealed ? "答案已揭曉" : ("你的猜測："+l.guess.replace(';','；')), l.revealed?"good":"warn");

    function top3(map){
      const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3);
      return arr.map(([k,v])=>`${shortKey(k)}=${v}`).join("  ");
    }
    function shortKey(k){
      const [e,t,m] = k.split("|");
      return (e==="floppy"?"垂":"尖") + (t==="curly"?"捲":"直") + (m==="star"?"★":m==="heart"?"♥":m==="dot"?"●":"–");
    }
    function shortPh(ph){
      const e = (ph.ear==="floppy")?"垂":"尖";
      const ta = (ph.tail==="curly")?"捲":"直";
      const m = ph.sparkle==="star"?"★":ph.sparkle==="heart"?"♥":ph.sparkle==="dot"?"●":"–";
      return `${e}${ta}${m}`;
    }
  }

  let last = performance.now();
  let timeAcc = 0;
  function tick(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    timeAcc += dt;

    view.x = lerp(view.x, viewTarget.x, 1-Math.pow(0.0006, dt*60));
    view.y = lerp(view.y, viewTarget.y, 1-Math.pow(0.0006, dt*60));
    view.s = lerp(view.s, viewTarget.s, 1-Math.pow(0.0006, dt*60));

    ctx.fillStyle = '#0b0f17';
    ctx.fillRect(0,0,W,H);
    hits.length = 0;
    drawGrid();

    const id = stage().id;
    if(id==="1-1") render_1_1(timeAcc);
    else if(id==="1-2") render_1_2(timeAcc);
    else if(id==="1-3") render_1_3(timeAcc);
    else if(id==="2-1") render_2_1(timeAcc);
    else if(id==="2-2") render_2_2(timeAcc);
    else render_2_3(timeAcc);

    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#a8b3d6';
    ctx.font = '12px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC"';
    ctx.fillText('v0.12', 14, H-14);
    ctx.restore();

    requestAnimationFrame(tick);
  }

  buildControls();
  setStage(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
