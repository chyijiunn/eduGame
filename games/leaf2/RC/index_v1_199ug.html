<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>混沌落葉時2：繽紛森林，讓你見樹又見林 v1.192</title>
<style>
  :root{ --bg:#0f172a; --panel:#0b1220; --ink:#e2e8f0; --muted:#94a3b8; --brand:#22c55e; --accent:#34d399; --danger:#ef4444 }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans TC",Segoe UI,Roboto}
  .wrap{display:grid;grid-template-columns:1fr 380px;height:100%}
  #stage{position:relative;background:#0b1020;height:100%;min-height:360px}
  canvas{display:block;width:100%;height:100%}
  .panel{height:100%;overflow:auto;background:linear-gradient(180deg,var(--panel),#0a0f1b 55%);border-left:1px solid #1f2937;padding:14px 14px 140px}
  .h{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
  .h .dot{width:10px;height:10px;border-radius:999px;background:var(--brand);box-shadow:0 0 16px var(--brand)}
  h1{font-size:18px;margin:0 0 2px}
  p.sub{margin:0;color:var(--muted);font-size:12px}
  .g{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:10px 0}
  .row{margin:8px 0}
  .lbl{font-size:12px;color:var(--muted);letter-spacing:.2px}
  .val{font-variant-numeric:tabular-nums}
  input[type=range]{width:100%}
  select{width:100%;padding:8px;border-radius:10px;background:#0e1729;border:1px solid #243246;color:var(--ink)}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  button{padding:10px 12px;border:1px solid #263142;background:#0e1729;color:#e2e8f0;border-radius:12px;cursor:pointer}
  button:hover{border-color:#334155}
  button.primary{background:linear-gradient(180deg,#0e2d1b,#0b1f14);border-color:#1d3b29}
  button.primary:hover{border-color:#27533a}
  .small{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .card{border:1px solid #1f2937;border-radius:12px;padding:10px;text-align:center}
  .card b{display:block;font-size:16px}
  .card span{display:block;color:#94a3b8;font-size:11px}
  .sep{height:1px;background:#1e293b;margin:12px 0}
  #diag{position:fixed;right:10px;top:10px;background:#0a1120e6;border:1px solid #1e293b;border-radius:10px;padding:8px 10px;color:#cbd5e1;font-size:12px;max-width:54ch;z-index:9999;display:none}
  #diag.show{display:block}
  /* From v0.752: */
  .io{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  input[type="file"]{width:100%;}
  .debugRow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .debugRow label{font-size:12px;color:#a3b3c7}
  .kpi + .sep{margin-top:8px}
</style>
<style>
/* v1.192 floating shell */
#panelShell{ position:fixed; top:56px; right:0; z-index:30000; width:460px; max-width:92vw;
  background:rgba(16,20,30,.96); color:#cfe9ff; border-radius:10px 0 0 10px; box-shadow:0 8px 28px rgba(0,0,0,.45); overflow:hidden;
  transform:translateX(0); transition:transform .22s ease; }
#panelShell.hidden{ transform:translateX(calc(100% - 34px)); }
#panelHandle{ position:fixed; top:120px; right:0; z-index:30001; width:48px; height:76px;
  background:rgba(16,20,30,.97); color:#cfe9ff; display:flex; align-items:center; justify-content:center;
  border-radius:14px 0 0 14px; cursor:pointer; user-select:none; font-size:20px; line-height:1; }
#panelTabs{ display:flex; gap:6px; padding:8px; border-bottom:1px solid rgba(255,255,255,.08); }
#panelTabs button{ flex:1; padding:8px 10px; border-radius:9px; border:1px solid rgba(255,255,255,.18);
  background:rgba(26,36,56,.85); color:#cfe9ff; cursor:pointer; }
#panelTabs button.active{ outline:2px solid rgba(120,200,255,.45); }
#panelBody{ max-height:76vh; overflow:auto; padding:8px; }
#panelBody > .scenePanel{ position:relative !important; top:0 !important; right:auto !important; background:transparent !important; padding:0 !important; border-radius:0 !important; display:none; }
.scenePanel .group{ background:rgba(24,28,40,.66); padding:10px; border-radius:10px; margin-bottom:10px; }
.scenePanel input[type=range]{ width:100%; }
.okFlash{ animation: okflash 0.35s ease 0s 1; }
@keyframes okflash{ from{outline:2px solid rgba(120,255,180,.8);} to{outline:0;} }
</style>
<style>
/* v1.193 layout: hide legacy right-side pane, expand main */
#rightPanel, #right-pane, #rightSidebar, .right-panel, .side-panel, #uiRight, .ui-right, #panelRight, #rightControls {
  display: none !important;
}
#ui, #container, #canvasWrap, #root, body, html {
  width: 100% !important; max-width: 100% !important;
}
canvas { display:block; }
</style>
<style>
/* v1.194 layout cleanup */
#rightPanel, #right-pane, #rightSidebar, .right-panel, .side-panel, #uiRight, .ui-right, #panelRight, #rightControls,
#bottomPanel, #bottom-pane, #bottomBar, .bottom-panel, .footer-panel, #footerControls, #controlDock, .dock-bottom,
#legacyControls, #legacyPanel, #controlBar, #toolbarBottom, #toolbar, #sidebar, .sidebar, #uiSidebar, .ui-sidebar {
  display: none !important;
}
html, body, #root, #app, #container, #canvasWrap, #stage, #main, canvas {
  width: 100% !important;
  max-width: 100% !important;
}
canvas { display:block; }
</style>
<style>
/* v1.195 Right-rail remover + ensure floating panel on top */
:root { --panel-shell-z: 50000; }
#panelShell, #panelHandle { z-index: var(--panel-shell-z) !important; }
html, body, #root, #app, #container, #canvasWrap, #stage, #main, canvas {
  width: 100% !important; max-width: 100% !important;
}
/* Hide extremely likely right rails by name, but NEVER our floating shell */
aside[id*="right" i]:not(#panelShell):not(#panelHandle),
div[id*="right" i]:not(#panelShell):not(#panelHandle),
section[id*="right" i]:not(#panelShell):not(#panelHandle),
div[class*="right" i]:not(#panelShell):not(#panelHandle),
div[class*="sidebar" i]:not(#panelShell):not(#panelHandle),
div[class*="control" i]:not(#panelShell):not(#panelHandle),
div[class*="toolbar" i]:not(#panelShell):not(#panelHandle) {
  /* will also be force-hidden by JS when on the right side */
}
</style>
<style>
/* v1.196 Full-viewport canvas + safer hidden panel */
html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
#panelShell, #panelHandle { z-index: 60000 !important; }
#panelShell.hidden{ transform: translateX(100%) !important; pointer-events: none !Important; }
#panelHandle{ pointer-events: auto !important; right:0; }
/* common canvas containers fill */
#root, #app, #container, #canvasWrap, #stage, #main { width:100vw !important; height:100vh !important; max-width:100vw !important; max-height:100vh !important; }
canvas { display:block; }
/* kill any generic right overlay remnants by class/id (extra safety) */
.overlay, .backdrop, .shade, #overlay, #backdrop, #shade, .scrim, #scrim {
  display:none !important;
}
</style>
<style>
/* v1.197 CSV & Scene4 fixes */
#csvStatus{position:fixed;left:10px;bottom:10px;z-index:65000;background:rgba(0,0,0,.6);color:#d9f7ff;
 padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;max-width:60vw;white-space:pre-wrap}
#csvStatus.ok{outline:2px solid rgba(90,240,160,.6)}
#csvStatus.err{outline:2px solid rgba(255,120,120,.6)}
#panelShell #sceneFall .group label{display:block;margin:6px 0 2px;opacity:.9}
</style>
<style>
/* v1.198 CSV completeness + Scene4 terrain panel */
#csvStatus{position:fixed;left:10px;bottom:10px;z-index:65000;background:rgba(0,0,0,.6);color:#d9f7ff;
 padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;max-width:60vw;white-space:pre-wrap}
#csvStatus.ok{outline:2px solid rgba(90,240,160,.6)}
#csvStatus.err{outline:2px solid rgba(255,120,120,.6)}
#panelShell #sceneFall .group label{display:block;margin:6px 0 2px;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"></div>
  <aside class="panel">
    <div class="h"><span class="dot"></span><div><h1>Leaf / Tree / Fall Designer 3D</h1><p class="sub">v0.7.2（樹/落葉）＋ 場景一 v0.752（葉片進階）</p></div></div>

    <div class="btns" style="grid-template-columns:repeat(3,1fr);margin:8px 0 10px">
      <button id="btnScene1" class="primary">場景一：葉片</button>
      <button id="btnScene2">場景二：樹</button>
      <button id="btnScene3">場景三：落葉</button>
    </div>

    <!-- Scene 1 (from v0.752, plus a 'goTree' button to keep index behavior) -->
    <div id="sceneLeaf">
      <div class="kpi">
        <div class="card"><b id="kpiVerts">—</b><span>頂點</span></div>
        <div class="card"><b id="kpiFaces">—</b><span>面數</span></div>
        <div class="card"><b id="kpiArea">—</b><span>估算面積 (cm²)</span></div>
      </div>

      <div class="sep"></div>
      <div class="row"><label class="lbl">葉形（Leaf Shape）</label>
        <select id="leafShape">
          <option value="elliptic" selected>橢圓 Elliptic</option>
          <option value="ovate">卵形 Ovate</option>
          <option value="obovate">倒卵形 Obovate</option>
          <option value="lanceolate">披針 Lanceolate</option>
          <option value="oblanceolate">倒披針 Oblanceolate</option>
          <option value="linear">線形 Linear</option>
          <option value="orbicular">圓形 Orbicular</option>
          <option value="reniform">腎形 Reniform</option>
          <option value="cordate">心形 Cordate</option>
          <option value="sagittate">箭形 Sagittate</option>
          <option value="spatulate">匙形 Spatulate</option>
          <option value="palmate_lobed">掌狀深裂 Palmate-lobed</option>
          <option value="pinnate_lobed">羽狀深裂 Pinnate-lobed</option>
        </select>
      </div>

      <div class="row"><label class="lbl">邊緣（Margin）</label>
        <select id="leafMargin">
          <option value="entire" selected>全緣 Entire</option>
          <option value="serrate">鋸齒 Serrate</option>
          <option value="crenate">圓齒 Crenate</option>
          <option value="dentate">具齒 Dentate</option>
          <option value="double_serr">重鋸齒 Doubly serrate</option>
          <option value="undulate">波狀 Undulate</option>
        </select>
      </div>

      <div class="row"><label class="lbl">葉脈（Venation）</label>
        <select id="leafVein">
          <option value="pinnate" selected>羽狀 Pinnate</option>
          <option value="palmate3">掌狀（3）</option>
          <option value="palmate5">掌狀（5）</option>
          <option value="palmate7">掌狀（7）</option>
          <option value="parallel">平行 Parallel</option>
          <option value="arcuate">弧狀 Arcuate</option>
        </select>
      </div>

      <div class="sep"></div>
      <!-- 基本尺寸 -->
      <div class="row g"><label class="lbl">長度 (cm)</label><span class="val" id="valLen"></span></div>
      <input id="len" type="range" min="4" max="40" step="0.1" value="12" />
      <div class="row g"><label class="lbl">寬度比例</label><span class="val" id="valWidth"></span></div>
      <input id="width" type="range" min="0.15" max="0.7" step="0.01" value="0.40" />
      <div class="row g"><label class="lbl">尖端銳利度</label><span class="val" id="valTip"></span></div>
      <input id="tip" type="range" min="0.2" max="2.5" step="0.01" value="1.0" />
      <div class="row g"><label class="lbl">基部圓潤度</label><span class="val" id="valBase"></span></div>
      <input id="base" type="range" min="0.2" max="2.5" step="0.01" value="1.0" />
      <div class="row g"><label class="lbl">基部凹陷（心形）</label><span class="val" id="valNotch"></span></div>
      <input id="baseNotch" type="range" min="0" max="0.4" step="0.01" value="0.00" />
      <div class="row g"><label class="lbl">葉尖收斂（apexConverge）</label><span class="val" id="valApex"></span></div>
      <input id="apexConverge" type="range" min="0" max="1" step="0.01" value="0.20" />

      <!-- 邊緣控制 -->
      <div class="row g"><label class="lbl">鋸齒幅度</label><span class="val" id="valSerrA"></span></div>
      <input id="serrA" type="range" min="0" max="0.25" step="0.005" value="0.00" />
      <div class="row g"><label class="lbl">鋸齒密度</label><span class="val" id="valSerrF"></span></div>
      <input id="serrF" type="range" min="0" max="30" step="1" value="0" />
      <div class="row g"><label class="lbl">鋸齒尖銳度</label><span class="val" id="valToothSharp"></span></div>
      <input id="toothSharp" type="range" min="0" max="1" step="0.01" value="0.0" />
      <div class="row g"><label class="lbl">重鋸齒強度</label><span class="val" id="valDoubleSerr"></span></div>
      <input id="doubleSerr" type="range" min="0" max="1" step="0.01" value="0.0" />

      <!-- 裂片 -->
      <div class="row g"><label class="lbl">裂片數</label><span class="val" id="valLobeCount"></span></div>
      <input id="lobeCount" type="range" min="0" max="9" step="1" value="0" />
      <div class="row g"><label class="lbl">裂片深度</label><span class="val" id="valLobeDepth"></span></div>
      <input id="lobeDepth" type="range" min="0" max="1" step="0.01" value="0.00" />
      <div class="row g"><label class="lbl">裂片圓鈍度</label><span class="val" id="valLobeRound"></span></div>
      <input id="lobeRound" type="range" min="0" max="1" step="0.01" value="0.60" />

      <!-- 葉脈與視覺 -->
      <div class="row g"><label class="lbl">主脈厚度（視覺）</label><span class="val" id="valRib"></span></div>
      <input id="rib" type="range" min="0" max="0.6" step="0.01" value="0.12" />

      <!-- 彎曲/姿態（預設為 0） -->
      <div class="row g"><label class="lbl">捲曲度（橫向）</label><span class="val" id="valCurl"></span></div>
      <input id="curl" type="range" min="0" max="1.2" step="0.01" value="0" />
      <div class="row g"><label class="lbl">扭轉度（縱向）</label><span class="val" id="valTwist"></span></div>
      <input id="twist" type="range" min="0" max="1.5" step="0.01" value="0" />
      <div class="row g"><label class="lbl">上拱彎曲</label><span class="val" id="valBend"></span></div>
      <input id="bend" type="range" min="-0.8" max="1.2" step="0.01" value="0.2" />
      <div class="row g"><label class="lbl">波浪幅度</label><span class="val" id="valWaveAmp"></span></div>
      <input id="waveAmp" type="range" min="0" max="0.3" step="0.01" value="0" />
      <div class="row g"><label class="lbl">波浪頻率</label><span class="val" id="valWaveFreq"></span></div>
      <input id="waveFreq" type="range" min="0" max="20" step="1" value="0" />
      <div class="row g"><label class="lbl">非對稱度</label><span class="val" id="valAsym"></span></div>
      <input id="asym" type="range" min="0" max="1" step="0.01" value="0" />

      <div class="row"><label class="lbl"><input id="double" type="checkbox" checked> 雙面曲面</label></div>
      <div class="row"><label class="lbl"><input id="stem" type="checkbox" checked> 顯示葉柄</label></div>

      <div class="btns" style="grid-template-columns:repeat(2,1fr)">
        <button id="reset">重設</button>
        <button id="randomize">隨機</button>
      </div>

      <div class="sep"></div>
      <div class="io">
        <button id="exportCSV">匯出 CSV</button>
        <label class="lbl" style="display:flex;align-items:center;gap:8px;border:1px solid #263142;border-radius:12px;padding:8px 10px;background:#0e1729">
          <span>匯入 CSV</span>
          <input id="importCSV" type="file" accept=".csv,text/csv" />
        </label>
      </div>

      <div class="debugRow">
        <label><input id="toggleAxes" type="checkbox"> 顯示座標軸</label>
        <label><input id="toggleBox" type="checkbox"> 顯示包圍盒</label>
      </div>

      <div class="sep"></div>
      <button id="goTree" class="primary" title="把目前葉片帶到下一個場景">→ 送到樹場景</button>
      <p class="small">操作：拖曳旋轉、滾輪縮放、右鍵平移；手機可雙指縮放、兩指拖曳平移。</p>
    </div>

    <!-- Scene 2 (keep full from index v0.7.2) -->
    <div id="sceneTree" style="display:none">
      <div class="row g"><label class="lbl">樹高 (m)</label><span class="val" id="valTreeH"></span></div>
      <input id="treeH" type="range" min="2" max="20" step="0.1" value="2.5" />
      <div class="row g"><label class="lbl">樹冠半徑 (m)</label><span class="val" id="valCrownR"></span></div>
      <input id="crownR" type="range" min="1" max="12" step="0.1" value="10" />
      <div class="row g"><label class="lbl">分枝層數（1–100）</label><span class="val" id="valLevels"></span></div>
      <input id="levels" type="range" min="1" max="30" step="1" value="10" />
      <div class="row g"><label class="lbl">分枝張角 (°)</label><span class="val" id="valSpread"></span></div>
      <input id="spread" type="range" min="10" max="120" step="1" value="65" />
      <div class="row g"><label class="lbl">樹幹傾斜 (°)</label><span class="val" id="valLean"></span></div>
      <input id="lean" type="range" min="-8" max="8" step="1" value="2" />
      <div class="row g"><label class="lbl">葉片數量 <span class="warn">(高於 40k 需強效顯卡)</span></label><span class="val" id="valLeafCount"></span></div>
      <input id="leafCount" type="range" min="50" max="100000" step="50" value="11200" />
      <div class="row g"><label class="lbl">樹型</label><span class="val" id="valShape"></span></div>
      <select id="shape">
        <option value="sphere" selected>球形（自然）</option>
        <option value="cone">圓錐</option>
        <option value="vase">花瓶</option>
      </select>
      <div class="btns" style="grid-template-columns:repeat(3,1fr);margin-top:10px">
        <button id="btnBuildTree" class="primary">生成樹</button>
        <button id="btnClearTree">清除樹</button>
        <button id="btnFit">視角置中</button>
      </div>
      <p class="small">說明：分枝層數採「迭代廣度優先 + 安全上限」，避免指數爆炸。可同時搭配葉片數量 100k。</p>
    </div>

    <!-- Scene 3 (keep full from index v0.7.2) -->
    <div id="sceneFall" style="display:none">
      <div class="row g"><label class="lbl">季節時間倍率</label><span class="val" id="valSeasonRate"></span></div>
      <input id="seasonRate" type="range" min="0.1" max="4" step="0.1" value="1.0"/>
      <div class="row g"><label class="lbl">落葉速度倍率</label><span class="val" id="valFallRate"></span></div>
      <input id="fallRate" type="range" min="0.5" max="2" step="0.1" value="1.0"/>
      <div class="row g"><label class="lbl">風強度</label><span class="val" id="valWind"></span></div>
      <input id="windAmp" type="range" min="0" max="8" step="0.1" value="3.0"/>
      <div class="row g"><label class="lbl">亂流（類 Perlin）</label><span class="val" id="valTurb"></span></div>
      <input id="turb" type="range" min="0" max="3" step="0.05" value="1.2"/>
      <div class="row g"><label class="lbl">再長回速度</label><span class="val" id="valRegrow"></span></div>
      <input id="regrow" type="range" min="0.1" max="3" step="0.1" value="1.0"/>
      <div class="row g"><label class="lbl">每幀模擬上限（葉片數）</label><span class="val" id="valMaxActive"></span></div>
      <input id="maxActive" type="range" min="200" max="4000" step="100" value="1200"/>
      <div class="btns" style="margin-top:10px">
        <button id="btnStartFall" class="primary">開始落葉</button>
        <button id="btnStopFall">停止</button>
        <button id="btnResetFall">重置季節</button>
      </div>
      <p class="small">說明：落葉「逐片」脫離；100k 模式僅對上限數量的「正在飄落」葉片做物理更新。</p>
    </div>
  </aside>
</div>

<div id="diag"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js?module';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js?module';

const diagEl = document.getElementById('diag');
function diag(msg, ok=false){ diagEl.classList.add('show'); diagEl.innerHTML = (ok?'<b style="color:#22c55e">OK</b> ':'<b style="color:#f97316">LOG</b> ') + String(msg); }

// --- THREE setup ---
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x0b1020, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 5000);

// --- geometry builders ---
function buildLeaf(){
  let geo;
  try{
    geo = buildLeafGeometry(P, veinConf);
  }catch(err){
    diag('幾何生成錯誤，改用備援方片：'+err.message);
    geo = new THREE.PlaneGeometry(0.6,0.3,1,1);
  }

  else { leafMesh.geometry.dispose(); leafMesh.geometry = geo; }

  if(P.stem){
    const st = buildStemGeometry(P);
    if(!stemMesh){ stemMesh = new THREE.Mesh(st, matStem); scene.add(stemMesh); }
    else { stemMesh.geometry.dispose(); stemMesh.geometry = st; }
  } else if(stemMesh){ scene.remove(stemMesh); stemMesh.geometry.dispose(); stemMesh=null; }

  KPIV.textContent = geo.attributes.position.count;
  KPIF.textContent = geo.index ? (geo.index.count/3) : (geo.attributes.position.count/3);
  KPIA.textContent = (estimateArea(geo)).toFixed(2);

  if(firstFit){ fitCameraTo(leafMesh, 1.8); firstFit = false; }
  updateHelpers();
}

function buildLeafGeometry(p, vein){
  const L = p.len/100;
  const Wmax = (p.len * p.width)/100;
  const resU = p.resU, resV = p.resV;
  const pos = new Float32Array((resU+1)*(resV+1)*3);
  const col = new Float32Array((resU+1)*(resV+1)*3);
  const idx=[]; let ptr=0, cptr=0;
  for(let iu=0; iu<=resU; iu++){
    const u = iu/resU;
    const s = Math.sin(Math.PI * Math.min(1, Math.max(0,u)));
    const tipPow=p.tip, basePow=p.base;
    const tipFactor=Math.pow(1-u,tipPow);
    const baseFactor=Math.pow(u,basePow);
    let halfW = Wmax * s * (0.65 + 0.35*(1 - tipFactor) * (0.7 + 0.3*baseFactor));
    halfW *= (1 - p.baseNotch * (1 - Math.min(1, u*3))); // 基部凹陷
    const apexK = 1 - (p.apexConverge||0)*0.6 * smoothstep(0.7, 1.0, u);
    halfW *= Math.max(0.15, apexK);

    const serrAmp=(p.serrA)*Wmax;
    for(let iv=0; iv<=resV; iv++){
      const vv=iv/resV; const v=vv*2-1;
      const edge = smoothstep(0.6,1.0,Math.abs(v));
      let serr = serrAmp * Math.sin(2*Math.PI * p.serrF * u + (p.toothSharp*0.6)*Math.sign(v)) * edge * Math.sign(v);
      if(p.doubleSerr>0){
        serr += p.doubleSerr * serrAmp*0.5 * Math.sin(2*Math.PI * p.serrF * 2 * u + 1.2) * edge * Math.sign(v);
      }

      if(p.lobeCount>0 && p.lobeDepth>0){
        const ang = Math.PI * (u);
        const lobing = Math.sin(p.lobeCount * ang);
        halfW *= (1 + p.lobeDepth * 0.25 * Math.max(0, lobing));
      }

      const asymK = 1 + p.asym * (v>0? 0.12 : -0.12);
      let x=(u - 0.1)*L;
      let y=(v)*(halfW + serr)*asymK;
      let z=0;

      let ribZ = 0;
      if(vein.type==='pinnate'){
        const mid=1 - Math.min(1, Math.abs(v)/0.8);
        ribZ += (p.rib/100) * Math.pow(mid,2);
      } else if(vein.type==='palmate'){
        const m = vein.palmRibs||5;
        for(let k=0;k<m;k++){
          const angv = (k/(m-1)-0.5)*0.9;
          const proj = 1 - Math.min(1, Math.abs(v - angv)/0.6);
          ribZ += (p.rib/160) * Math.max(0, proj);
        }
      } else if(vein.type==='parallel'){
        const n = vein.parallelCount||12;
        const stripe = Math.sin(v* n * Math.PI)*0.5+0.5;
        ribZ += (p.rib/160) * stripe;
      } else if(vein.type==='arcuate'){
        const arc = 1 - Math.abs(v) * (0.7 + 0.3*u);
        ribZ += (p.rib/120) * Math.max(0, arc);
      }
      z += ribZ;

      const curlAngle=p.curl*(u)*0.8*Math.PI*(Math.abs(v));
      ({x,y,z}=rotY(Math.sign(v)*curlAngle,x,y,z));
      const twA=p.twist*Math.PI*u; ({x,y,z}=rotX(twA,x,y,z));
      z += (p.bend/100) * ( -4*Math.pow(u-0.5,2) + 1 );

      if(p.waveAmp>0 && p.waveFreq>0){
        z += p.waveAmp * Math.sin( (u*3.14159)*p.waveFreq ) * (1 - Math.abs(v));
      }

      pos[ptr++]=x; pos[ptr++]=y; pos[ptr++]=z;
      const c = new THREE.Color().setHSL(0.33 - 0.08*u, 0.7, 0.48+0.18*(1-u));
      col[cptr++]=c.r; col[cptr++]=c.g; col[cptr++]=c.b;
    }
  }
  for(let iu=0; iu<resU; iu++) for(let iv=0; iv<resV; iv++){
    const a=(resV+1)*iu+iv; const b=a+(resV+1); const c=b+1; const d=a+1; idx.push(a,b,d, b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

// Estimate leaf "thickness" from length and rib setting; use 2.5× as petiole radius.
function estimateLeafThickness(p){
  const L = p.len/100;
  const ribZ = Math.max(p.rib/100, p.rib/120, p.rib/160);
  const baseline = L * 0.002; // 0.2% of leaf length
  return Math.max(baseline, ribZ*1.6);
}

// Petiole aligned to leaf base (u=0, x = -0.1 * L), radius tied to thickness.
function buildStemGeometry(p){
  const L = p.len/100;
  const stemLen = Math.max(0.04, Math.min(0.18, L*0.18));
  const t = estimateLeafThickness(p);
  const r = Math.max(0.0008, Math.min(L*0.01, t*2.5)); // ≈ 葉厚 2~3 倍
  const geo=new THREE.CylinderGeometry(r, r, stemLen, 12, 1, true);
  geo.rotateZ(Math.PI/2);
  const baseX = -0.1 * L;
  geo.translate(baseX - stemLen/2, 0, 0);
  return geo;
}

function estimateArea(geo){ const pos=geo.attributes.position, index=geo.index; let area=0; const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(); if(!index){ for(let i=0;i<pos.count;i+=9){ a.set(pos.array[i],pos.array[i+1],pos.array[i+2]); b.set(pos.array[i+3],pos.array[i+4],pos.array[i+5]); c.set(pos.array[i+6],pos.array[i+7],pos.array[i+8]); area+=triangleArea(a,b,c);} } else { for(let i=0;i<index.count;i+=3){ a.fromBufferAttribute(pos,index.getX(i)); b.fromBufferAttribute(pos,index.getX(i+1)); c.fromBufferAttribute(pos,index.getX(i+2)); area+=triangleArea(a,b,c);} } return area*10000; }
function triangleArea(a,b,c){ const ab=new THREE.Vector3().subVectors(b,a); const ac=new THREE.Vector3().subVectors(c,a); return ab.cross(ac).length()/2; }

function smoothstep(e0,e1,x){const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0))); return t*t*(3-2*t)}
function rotY(ang,x,y,z){ const c=Math.cos(ang), s=Math.sin(ang); return {x:c*x + s*z, y, z:-s*x + c*z}; }
function rotX(ang,x,y,z){ const c=Math.cos(ang), s=Math.sin(ang); return {x, y:c*y - s*z, z:s*y + c*z}; }

function fitCameraTo(obj, pad=1.8){
  if(!obj) return;
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); const center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  const radius = Math.max(size.x, size.y, size.z)*0.5 || 0.1;
  const fov = camera.fov * Math.PI/180;
  const dist = (radius/Math.tan(fov/2)) * pad;
  const dir = new THREE.Vector3(1,0.6,1).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = Math.max(0.001, dist/1000);
  camera.far = dist*10 + 100;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

document.getElementById('importCSV').addEventListener('change', (e)=>{
  const file = e.target.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const text = String(reader.result).trim();
      const lines = text.split(/\\r?\\n/);
      if(lines.length<2) throw new Error('CSV 無資料');
      const header = lines[0].split(',').map(s=>s.trim());
      const values = lines[1].split(',').map(s=>s.trim());
      const map = {};
      header.forEach((k,i)=>{ if(values[i]!==undefined){ const v = values[i]; map[k] = (v==='0'||v==='1') && (k==='double'||k==='stem') ? (v==='1') : parseFloat(v); }});
      Object.assign(P, map);
      csvKeys.forEach(k=>{ const el=document.getElementById(k); if(el){ el.value = (typeof P[k]==='boolean')?(P[k]?1:0):P[k]; if(el.type==='checkbox') el.checked = !!P[k]; }});
      syncLeafLabels(); buildLeaf();
      diag('CSV 匯入完成。', true);
    }catch(err){ diag('CSV 匯入錯誤：'+err.message); }
  };
  reader.readAsText(file);
});

function buildTree(){
  clearTree();
  if(!ground){
    const g = new THREE.PlaneGeometry(120,120,120,120); g.rotateX(-Math.PI/2);
    groundHeights = new Float32Array((121)*(121));
    ground = new THREE.Mesh(g, groundMat); scene.add(ground);
  }

  treeGroup = new THREE.Group(); scene.add(treeGroup);

  const H = parseFloat(treeUI.treeH.value);
  const levels = Math.min(100, parseInt(treeUI.levels.value)); // 安全上限
  const spread = parseFloat(treeUI.spread.value)*Math.PI/180;
  const lean = parseFloat(treeUI.lean.value)*Math.PI/180;

  const trunkMat = new THREE.MeshStandardMaterial({color:0x6b4f3a, roughness:0.95});
  const branchMat = new THREE.MeshStandardMaterial({color:0x6e5840, roughness:0.95});
  const branches = [];

  // iterative BFS with caps to avoid explosion
  const MAX_BRANCHES = 30000;           // 結構上限（安全）
  const LEN_DECAY = 0.75;               // 長度衰減
  const RAD_DECAY = 0.72;               // 半徑衰減
  const CHILD_PER_NODE = 2;             // 每節分叉數
  const PRUNE_BASE = 0.02;              // 基礎修剪概率（越高越稀疏）
  const PRUNE_GAIN = 0.008;             // 隨層遞增修剪
  const TIP_JITTER = 0.05;              // 末端擾動比例

  const queue = [];
  const base = new THREE.Vector3(0,0,0);
  const trunkDir = new THREE.Vector3(Math.sin(lean), Math.cos(lean), 0).normalize();
  const trunkLen = H*0.7;
  const trunkTop = base.clone().addScaledVector(trunkDir, trunkLen);
  queue.push({a:base, b:trunkTop, dir:trunkDir.clone(), len:H*0.5, r:0.12*H, lvl:1});

  while(queue.length && branches.length < MAX_BRANCHES){
    const cur = queue.shift();
    branches.push({a:cur.a.clone(), b:cur.b.clone(), r:cur.r});
    if(cur.lvl>=levels) continue;
    for(let c=0;c<CHILD_PER_NODE;c++){
      // prune probability increases with level
      const pruneP = PRUNE_BASE + PRUNE_GAIN*cur.lvl;
      if(Math.random()<pruneP) continue;
      const angA = (c===0? -1:1)*(spread*(0.6+0.4*Math.random()));
      const angY = Math.random()*Math.PI*2;
      const tilt = new THREE.Vector3(Math.cos(angY)*Math.sin(angA), Math.cos(angA), Math.sin(angY)*Math.sin(angA));
      const newDir = cur.dir.clone().multiplyScalar(0.35).add(tilt.multiplyScalar(0.65)).normalize();
      const newLen = cur.len * (LEN_DECAY + 0.03*Math.random());
      const nb = cur.b.clone().addScaledVector(newDir, newLen);
      // slight jitter near tips
      nb.x += (Math.random()-0.5)*newLen*TIP_JITTER;
      nb.z += (Math.random()-0.5)*newLen*TIP_JITTER;
      queue.push({a:cur.b.clone(), b:nb, dir:newDir, len:newLen, r:Math.max(0.012, cur.r*RAD_DECAY), lvl:cur.lvl+1});
      if(queue.length + branches.length >= MAX_BRANCHES) break;
    }
  }

  // build meshes
  const cyls = new THREE.Group();
  for(const s of branches){
    const v = new THREE.Vector3().subVectors(s.b, s.a);
    const len = v.length();
    const r1 = Math.max(0.012, s.r*0.6);
    const r2 = Math.max(0.010, s.r*0.5);
    const geo = new THREE.CylinderGeometry(r2, r1, len, 8);
    const mesh = new THREE.Mesh(geo, (len>H*0.45? trunkMat: branchMat));
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), v.clone().normalize());
    mesh.setRotationFromQuaternion(q);
    mesh.position.copy(s.a).addScaledVector(v,0.5);
    cyls.add(mesh);
  }
  treeGroup.add(cyls);

  // Leaves instancing: use current leaf geometry
  const leafGeo = leafMesh ? leafMesh.geometry.clone() : new THREE.PlaneGeometry(0.6,0.3,1,1);
  const count = parseInt(treeUI.leafCount.value);
  const leaves = new THREE.InstancedMesh(leafGeo, matLeaf, count);
  leaves.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(count*3), 3, false);
  matLeaf.vertexColors = true;
  const dummy = new THREE.Object3D();
  const tipBias = (t)=> Math.pow(t, 4);
  for(let i=0;i<count;i++){
    const s = branches[(Math.random()*branches.length)|0];
    const t = 0.55 + 0.45*tipBias(Math.random());
    const pos = s.a.clone().lerp(s.b, t);
    const rad = (0.035 + 0.11*Math.random());
    const ang = Math.random()*Math.PI*2;
    pos.x += Math.cos(ang)*rad; pos.z += Math.sin(ang)*rad; pos.y += (Math.random()-0.5)*0.05;
    dummy.position.copy(pos);
    const dir = new THREE.Vector3().subVectors(s.b, s.a).normalize();
    const up = new THREE.Vector3(0,1,0);
    const side = new THREE.Vector3().crossVectors(dir, up).normalize();
    const leafUp = new THREE.Vector3().crossVectors(side, dir).normalize();
    const m = new THREE.Matrix4().lookAt(new THREE.Vector3(0,0,0), dir, leafUp).invert();
    dummy.rotation.setFromRotationMatrix(m);
    dummy.rotation.x += (Math.random()-0.5)*0.6;
    dummy.rotation.y += (Math.random()-0.5)*Math.PI;
    dummy.rotation.z += (Math.random()-0.5)*0.6;
    const sc = 0.7 + Math.random()*0.7; dummy.scale.setScalar(sc);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
    const c = new THREE.Color().setHSL(0.28 + 0.10*Math.random()*0.3, 0.75, 0.48);
    leaves.setColorAt(i, c);
  }
  leaves.instanceMatrix.needsUpdate = true;
  if(leaves.instanceColor) leaves.instanceColor.needsUpdate = true;
  treeGroup.add(leaves);
  leavesInst = leaves;

  fitCameraTo(treeGroup, 2.0);
  const info = `樹生成完成｜分枝節數：${branches.length}（安全上限 30000），葉片：${count}`;
  diag(info, true);
}

function clearTree(){ if(treeGroup){ scene.remove(treeGroup); treeGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose?.(); }); treeGroup=null; leavesInst=null; } }

// Fall state
let leafVel, leafAngVel, leafPhase, leafState;
let fallingList = [];
let windBaseDir = 0, windTime = 0;

function ensureFallArrays(n){
  leafVel = new Array(n);
  leafAngVel = new Array(n);
  leafPhase = new Float32Array(n);
  leafState = new Uint8Array(n);
  for(let i=0;i<n;i++){ leafVel[i]=new THREE.Vector3(); leafAngVel[i]=new THREE.Vector3(); leafPhase[i]=0; leafState[i]=0; }
  fallingList = [];
}

function prepareFall(){
  if(!leavesInst){ buildTree(); }
  const n = leavesInst.count;
  if(!ground){
    const g = new THREE.PlaneGeometry(120,120,120,120); g.rotateX(-Math.PI/2);
    groundHeights = new Float32Array((121)*(121));
    ground = new THREE.Mesh(g, groundMat); scene.add(ground);
  }
  ensureFallArrays(n);
  fallRunning=false; fallClock=0;
  fitCameraTo(treeGroup??leavesInst, 2.2);
}

function resetFallSeason(){ if(!leavesInst) return;
  const n=leavesInst.count; const dm = new THREE.Matrix4(); const pos=new THREE.Vector3(); const quat=new THREE.Quaternion(); const scl=new THREE.Vector3();
  for(let i=0;i<n;i++){
    leavesInst.getMatrixAt(i, dm); dm.decompose(pos, quat, scl);
    pos.y = Math.max(pos.y, 0.2);
    dm.compose(pos, quat, scl);
    leavesInst.setMatrixAt(i, dm);
    leafVel[i].set(0,0,0); leafAngVel[i].set(0,0,0);
    leafState[i]=0; leafPhase[i]=0;
    const c = new THREE.Color().setHSL(0.28, 0.75, 0.48);
    leavesInst.setColorAt(i, c);
  }
  leavesInst.instanceMatrix.needsUpdate=true;
  if(leavesInst.instanceColor) leavesInst.instanceColor.needsUpdate=true;
  fallClock=0; fallRunning=false; fallingList.length=0;
}

// noise & wind
function nrand(x,y,z){ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return s-Math.floor(s); }
function smoothNoise(x,y,z){ const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z); const xf=x-xi, yf=y-yi, zf=z-zi; function fade(t){return t*t*(3-2*t)}
  let n000=nrand(xi,yi,zi), n100=nrand(xi+1,yi,zi), n010=nrand(xi,yi+1,zi), n110=nrand(xi+1,yi+1,zi); let n001=nrand(xi,yi,zi+1), n101=nrand(xi+1,yi,zi+1), n011=nrand(xi,yi+1,zi+1), n111=nrand(xi+1,yi+1,zi+1);
  const u=fade(xf), v=fade(yf), w=fade(zf);
  const x00=THREE.MathUtils.lerp(n000,n100,u), x10=THREE.MathUtils.lerp(n010,n110,u), x01=THREE.MathUtils.lerp(n001,n101,u), x11=THREE.MathUtils.lerp(n011,n111,u);
  const y0=THREE.MathUtils.lerp(x00,x10,v), y1=THREE.MathUtils.lerp(x01,x11,v);
  return THREE.MathUtils.lerp(y0,y1,w);
}
function windAt(x,y,z){
  const A=parseFloat(fallUI.windAmp.value);
  const T=parseFloat(fallUI.turb.value);
  const dirRad=(windBaseDir)*Math.PI/180;
  const baseX=Math.cos(dirRad)*A, baseZ=Math.sin(dirRad)*A;
  const n1 = smoothNoise((x*0.25)+windTime*0.8, (z*0.25)-windTime*0.6, 0);
  const n2 = smoothNoise((-x*0.2)+windTime*0.5, (y*0.25)+windTime*0.6, 1);
  return new THREE.Vector3(baseX + T*(n1-0.5), 0.3*T*(n2-0.5), baseZ + T*(n2-0.5));
}

function stepFall(){
  if(!leavesInst) return;
  const n = leavesInst.count;
  const dm = new THREE.Matrix4(); const pos=new THREE.Vector3(); const quat=new THREE.Quaternion(); const eul=new THREE.Euler(); const scl=new THREE.Vector3();
  const seasonRate=parseFloat(fallUI.seasonRate.value);
  const fallRate=parseFloat(fallUI.fallRate.value);
  const regrow=parseFloat(fallUI.regrow.value);
  const maxActive = parseInt(fallUI.maxActive.value);

  fallClock += 0.016*seasonRate; windTime += 0.01;
  windBaseDir = (Math.sin(windTime*0.07)*15);

  // detach quota (cap active)
  const progress = Math.min(1, fallClock/30);
  let attachQuota = Math.min(200, 5 + (n*0.0005 + n*0.002*progress)|0);
  if(fallingList.length < maxActive){
    for(let trial=0; trial<attachQuota; trial++){
      const i = (Math.random()*n)|0;
      if(leafState[i]!==0) continue;
      leavesInst.getMatrixAt(i, dm); dm.decompose(pos, quat, scl);
      const heightFactor = THREE.MathUtils.clamp(pos.y / (parseFloat(treeUI.treeH.value)+0.01), 0, 1);
      const p = (0.0006 + 0.003*progress) * (0.4 + 0.8*heightFactor);
      if(Math.random() < p){
        leafState[i]=1; fallingList.push(i);
        const w = windAt(pos.x,pos.y,pos.z);
        leafVel[i].set((Math.random()-0.5)*0.05 + 0.003*w.x, -0.02, (Math.random()-0.5)*0.05 + 0.003*w.z);
        leafAngVel[i].set((Math.random()-0.5)*1.2, (Math.random()-0.5)*0.8, (Math.random()-0.5)*1.2);
      }
    }
  }

  // simulate active
  for(let k=fallingList.length-1; k>=0; k--){
    const i = fallingList[k];
    leavesInst.getMatrixAt(i, dm); dm.decompose(pos, quat, scl);
    leafPhase[i] = Math.min(2, leafPhase[i] + 0.0007*seasonRate);
    const c = (leafPhase[i]<1) ? new THREE.Color().setHSL(0.16 + 0.10*leafPhase[i], 0.7, 0.5 + 0.2*(1-leafPhase[i]))
                               : new THREE.Color().setHSL(0.04 + 0.02*(leafPhase[i]-1), 0.8, 0.55 - 0.1*(leafPhase[i]-1));
    leavesInst.setColorAt(i, c);

    const w = windAt(pos.x,pos.y,pos.z).multiplyScalar(0.002*fallRate);
    const L = P.len/100, W = (P.len*P.width)/100;
    const area = L*W;
    const curlK = 1 + P.curl*1.5;
    const Cd = 0.8*curlK;
    leafVel[i].y += (-0.0022*fallRate);
    const v2 = leafVel[i].lengthSq();
    const drag = leafVel[i].clone().multiplyScalar(-Cd*area*Math.max(0.0, v2));
    leafVel[i].add(drag);
    leafVel[i].x += w.x - 0.002*leafVel[i].x;
    leafVel[i].z += w.z - 0.002*leafVel[i].z;
    leafVel[i].y += w.y*0.3 - 0.001*leafVel[i].y;
    const zz = Math.sin(windTime*3 + i*0.37) * 0.005 * (1 + 0.6*P.width);
    leafVel[i].x += zz;

    eul.setFromQuaternion(quat);
    eul.x += (w.x*8 + leafAngVel[i].x)*0.01;
    eul.y += (w.y*6 + leafAngVel[i].y)*0.01;
    eul.z += (w.z*8 + leafAngVel[i].z)*0.01;
    quat.setFromEuler(eul);
    leafAngVel[i].multiplyScalar(0.98);
    leafAngVel[i].x += (Math.random()-0.5)*0.02*curlK;
    leafAngVel[i].z += (Math.random()-0.5)*0.02*curlK;

    pos.add(leafVel[i]);

    if(pos.y<=0){
      const gx = Math.round((pos.x/120+0.5)*120); const gz = Math.round((pos.z/120+0.5)*120);
      if(gx>=0 && gx<=120 && gz>=0 && gz<=120){
        const gi = gz*121 + gx;
        const h = groundHeights[gi] += 0.0015*(0.6 + 0.8*Math.random());
        pos.y = h;
      } else { pos.y = 0; }
      leafVel[i].set(0,0,0); leafState[i]=2;
      leafPhase[i] = Math.max(leafPhase[i], 1.6);
      fallingList[k] = fallingList[fallingList.length-1]; fallingList.pop();
    }

    dm.compose(pos, quat, scl); leavesInst.setMatrixAt(i, dm);
  }

  if(fallingList.length>0){
    leavesInst.instanceMatrix.needsUpdate=true;
    if(leavesInst.instanceColor) leavesInst.instanceColor.needsUpdate = true;
  }

  // regrow
  const landed = leafState.reduce((a,b)=> a+(b===2?1:0), 0);
  if(landed>n*0.8 && fallingList.length===0){
    const dm2 = new THREE.Matrix4(); const pos2=new THREE.Vector3(); const quat2=new THREE.Quaternion(); const scl2=new THREE.Vector3();
    let regenBatch = Math.min(500, n - landed);
    for(let i=0; i<n && regenBatch>0; i++){
      if(leafState[i]!==2) continue;
      leavesInst.getMatrixAt(i, dm2); dm2.decompose(pos2, quat2, scl2);
      pos2.y += 0.03*regrow;
      if(pos2.y > Math.random()*parseFloat(treeUI.treeH.value)){
        leafState[i]=0; leafPhase[i]=0;
        const c = new THREE.Color().setHSL(0.28, 0.75, 0.48);
        leavesInst.setColorAt(i, c);
        regenBatch--;
      }
      dm2.compose(pos2, quat2, scl2); leavesInst.setMatrixAt(i, dm2);
    }
    leavesInst.instanceMatrix.needsUpdate=true;
    if(leavesInst.instanceColor) leavesInst.instanceColor.needsUpdate = true;
  }
}

  // Scene 1: CSV+immediate rebuild
  function s1_bind(){
    const setV=(id,val)=>{ const el=byId(id); if(el){ el.value=String(val); el.dispatchEvent(new Event('input',{bubbles:true})); } const v=byId(id+'v'); if(v){ v.textContent=String(val);} };
    const apply=(obj)=>{
      window.P=window.P||{};
      if(Number.isFinite(obj.len)) { window.P.len=obj.len; setV('len',obj.len); }
      if(Number.isFinite(obj.width)) { window.P.width=obj.width; setV('width',obj.width); }
      if(Number.isFinite(obj.thickness)) { window.P.thickness=obj.thickness; setV('thickness',obj.thickness); }
      if(Number.isFinite(obj.curvature)) { window.P.curvature=obj.curvature; setV('curvature',obj.curvature); }
      if(Number.isFinite(obj.tilt)) { window.P.tilt=obj.tilt; setV('tilt',obj.tilt); }
      try{ if(typeof window.syncLeafInit==='function') window.syncLeafInit(); }catch(e){}
      try{ if(typeof window.buildLeaf==='function') window.buildLeaf(); }catch(e){}
    };
    const parse=(text)=>{
      const raw=(text||'').replace(/[\uFEFF]/g,'').trim(); if(!raw) return {};
      const norm={}; const src=raw.replace(/;/g,','); const lines=src.split(/\r?\n/).filter(Boolean);
      if(lines.length>=2){
        const h=lines[0].split(',').map(s=>s.trim()), v=lines[1].split(',').map(s=>s.trim());
        for(let i=0;i<Math.min(h.length,v.length);i++){ const k=h[i]; const num=parseFloat(v[i]); norm[k]=Number.isFinite(num)?num:v[i]; }
      }else{
        const one=lines[0];
        if(one.includes('=')){ one.split(',').forEach(t=>{ const kv=t.split('='); if(kv.length>=2){ const k=kv[0].trim(); const vv=kv.slice(1).join('=').trim(); const num=parseFloat(vv); norm[k]=Number.isFinite(num)?num:vv; } }); }
        else{ const toks=one.split(',').map(s=>s.trim()); for(let i=0;i+1<toks.length;i+=2){ const k=toks[i], vv=toks[i+1]; const num=parseFloat(vv); norm[k]=Number.isFinite(num)?num:vv; } }
      }
      const out={};
      const pick=(keys)=>{ for(const k of keys){ if(norm[k]!=null){ const n=parseFloat(norm[k]); if(Number.isFinite(n)) return n; } } };
      out.len  = pick(['len','length','leaf_len','l']);
      out.width= pick(['width','w','leaf_w']);
      out.thickness=pick(['thickness','thick','t']);
      out.curvature=pick(['curvature','curve','cv']);
      out.tilt=pick(['tilt','angle','倾角','傾角']);
      if(out.len==null || out.width==null){
        const nums=Object.values(norm).map(v=>parseFloat(v)).filter(Number.isFinite);
        if(nums.length>=2){ if(out.len==null) out.len=nums[0]; if(out.width==null) out.width=nums[1]; }
      }
      return out;
    };
    const csv=byId('s1_csv'); if(csv && !csv._bound){ csv._bound=true; csv.addEventListener('change',()=>{
      const f=csv.files && csv.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ const obj=parse(ev.target.result||''); apply(obj); }; r.readAsText(f);
    }); }
    const btn=byId('s1_build'); if(btn && !btn._bound){ btn._bound=true; btn.onclick=()=>{
      const obj={ len: parseFloat(byId('len')?.value||'8'), width: parseFloat(byId('width')?.value||'3'),
                  thickness: parseFloat(byId('thickness')?.value||'0.02'), curvature: parseFloat(byId('curvature')?.value||'0.2'),
                  tilt: parseFloat(byId('tilt')?.value||'0') };

    ['len','width','thickness','curvature','tilt'].forEach(id=>{ const el=byId(id); if(el){ const v=byId(id+'v'); if(v) v.textContent = el.value; } });

  function s3_sync(){
    const r=parseFloat(byId('s3_radius').value), area=Math.PI*r*r;

  function s3_clear(){
    if(s3_group){ scene.remove(s3_group); s3_group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material&&o.material.dispose) o.material.dispose(); }); s3_group=null; }
    s3_forest.length=0;
  }
  function s3_fit(){
    if(!s3_group||!window.THREE) return;
    const box=new THREE.Box3().setFromObject(s3_group); const size=new THREE.Vector3(); const center=new THREE.Vector3(); box.getSize(size); box.getCenter(center);
    const radius=Math.max(size.x,size.y,size.z)*0.5||1; const fov=camera.fov*Math.PI/180; const dist=(radius/Math.tan(fov/2))*3.2; const dir=new THREE.Vector3(1,0.4,1).normalize();
    camera.position.copy(center).addScaledVector(dir,dist); camera.near=Math.max(0.01, dist/1000); camera.far=dist*12+800; camera.updateProjectionMatrix(); if(window.controls){ controls.target.copy(center); controls.update(); }
  }
  function vary(x,p){ return x*(1+(Math.random()*2-1)*p); }
  function baseTreeFromScene(){
    function gv(sel, def){ const el = q(sel); return el? parseFloat(el.value): def; }
    return { H: gv('#treeH', 8), R: gv('#crownR', 5), levels: Math.round(gv('#levels', 8)), spreadDeg: gv('#spread', 55), leafCount: Math.round(gv('#leafCount', 50)) };
  }
  function buildTreeFromCfg(cfg){
    if(!window.THREE) return {group:new THREE.Group(), leaves:null, meta:{H:cfg.H}};
    const group=new THREE.Group();
    const trunk=new THREE.MeshStandardMaterial({color:0x694c35, roughness:0.95});
    const branch=new THREE.MeshStandardMaterial({color:0x5b4733, roughness:0.95});
    const matLeaf=new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.85, metalness:0.02, side:THREE.DoubleSide, vertexColors:true, emissive:new THREE.Color(0x1aa952), emissiveIntensity:0.28});
    const leafGeo=(window.leafMesh && window.leafMesh.geometry) ? window.leafMesh.geometry : new THREE.PlaneGeometry(0.6,0.3,1,1);

    const levels=(cfg.levels|0), H=cfg.H, spread=(cfg.spreadDeg||55)*Math.PI/180;
    const segs=[], tips=[]; const base = new THREE.Vector3(0,0,0);
    const trunkTop = base.clone().add(new THREE.Vector3(0, H*0.9, 0));
    const queue=[{a:base, b:trunkTop, r:0.12*H, lvl:1}];
    while(queue.length && segs.length<20000){
      const cur = queue.shift(); segs.push(cur);
      if(cur.lvl>=levels){ tips.push({p:cur.b.clone(), dir:new THREE.Vector3(0,1,0)}); continue; }
      for(let c=0;c<2;c++){
        const ang=(c?1:-1)*(spread*(0.6+0.4*Math.random())), yaw=Math.random()*Math.PI*2;
        const d=new THREE.Vector3(Math.cos(yaw)*Math.sin(ang), Math.cos(ang), Math.sin(yaw)*Math.sin(ang));
        const len=(H/levels)*(0.9+0.2*Math.random()); const nb=cur.b.clone().addScaledVector(d,len);
        queue.push({a:cur.b.clone(), b:nb, r:cur.r*0.72, lvl:cur.lvl+1});
      }
    }
    const segGroup=new THREE.Group();
    for(const s of segs){
      const v=new THREE.Vector3().subVectors(s.b,s.a), len=v.length();
      const geo=new THREE.CylinderGeometry(Math.max(0.009,s.r*0.6), Math.max(0.010,s.r*0.8), len, 10);
      const m=new THREE.Mesh(geo, s.lvl===1?trunk:branch); m.castShadow=true; m.receiveShadow=true;
      const q2=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), v.clone().normalize());
      m.setRotationFromQuaternion(q2); m.position.copy(s.a).addScaledVector(v,0.5); segGroup.add(m);
    }

    const total=Math.max(2, cfg.leafCount|0);
    const leaves=new THREE.InstancedMesh(leafGeo, matLeaf, total);
    leaves.castShadow=true; leaves.receiveShadow=true; leaves.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(total*3),3,false);
    const d=new THREE.Object3D();
    for(let i=0;i<total;i++){
      const tip=tips[i%Math.max(1,tips.length)]; const pos=(tip?tip.p: new THREE.Vector3()).clone();
      pos.x += (Math.random()*2-1)*0.4; pos.z += (Math.random()*2-1)*0.3; pos.y += (Math.random()*2-1)*0.18;
      d.position.copy(pos); d.rotation.set(Math.random()*0.4, Math.random()*Math.PI*2, Math.random()*0.4); d.scale.setScalar(0.8+Math.random()*0.5); d.updateMatrix();
      leaves.setMatrixAt(i, d.matrix); const c = new THREE.Color().setHSL(0.32+0.04*Math.random(),0.78,0.50); leaves.setColorAt(i,c);
    }
    leaves.instanceMatrix.needsUpdate=true; leaves.instanceColor.needsUpdate=true; group.add(leaves);
    return {group, leaves, meta:{H}};
  }
  function s3_build(){
    s3_clear();
    const r=parseFloat(byId('s3_radius').value), n=parseInt(byId('s3_count').value,10), sep=parseFloat(byId('s3_sep').value);
    function ok(pts,x,z){ for(const p of pts){ const dx=p.x-x, dz=p.z-z; if(dx*dx+dz*dz<sep*sep) return false; } return true; }
    const pts=[]; let tryN=0; while(pts.length<n && tryN<n*1000){ tryN++; const a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*r; const x=Math.cos(a)*rr, z=Math.sin(a)*rr; if(ok(pts,x,z)) pts.push({x,z}); }
    const base=baseTreeFromScene();

      const t=buildTreeFromCfg(cfg); t.group.position.set(p.x,0,p.z); s3_group.add(t.group); s3_forest.push(t);

  window.s3_prepare = s3_prepare;

  // Scene 4: ensure ground options enriched when panel is created by previous scripts
  function s4_enrichGroundOptions(){
    const sel=byId('s4_ground'); if(!sel) return;
    const wanted=[
      ['soil','土壤（深）'],

  }
  // 若你的場景四是外部建立，這裡只負責補齊；若沒有，我們不重做落葉引擎（避免雙重循環）。
  function s4_prepare(forceOpen){
    s4_enrichGroundOptions();
    if(forceOpen){ setActiveTab('tabS4'); showPanel('sceneFall'); }
  }
  window.s4_prepare = window.s4_prepare || s4_prepare;

  function attachTabs(){
    const t1=byId('tabS1'), t2=byId('tabS2'), t3=byId('tabS3'), t4=byId('tabS4');
    if(t1 && !t1._b){ t1._b=true; t1.onclick=()=>{ setActiveTab('tabS1'); showPanel('sceneLeaf'); }; }

    if(t4 && !t4._b){ t4._b=true; t4.onclick=()=>{ setActiveTab('tabS4'); s4_prepare(true); }; }
  }

  function init(){

  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init, {once:true}); } else { init(); }

        const t = age/0.4;

      }else if(age < 0.6){
        const t = (age-0.4)/0.2;
        c.setHSL(0.16 + 0.16*(1-t), 0.85 - 0.25*t, 0.45 + 0.05*t); // green -> yellow
      }else if(age < 0.8){
        const t = (age-0.6)/0.2;
        c.setHSL(0.10 - 0.04*t, 0.85, 0.50 - 0.05*t); // yellow -> orange
      }else{
        const t = (age-0.8)/0.2;
        c.setHSL(0.02 - 0.02*t, 0.70 - 0.3*t, 0.40 - 0.2*t); // orange -> red/brown
      }
      return c;
    },
    maybeDetach(item){
      // Probabilistic fall: increases with age and wind; still allow green leaves to drop under strong wind
      const base = Math.max(0, item.age-0.4)*0.6; // older -> higher
      const windBoost = this.wind*0.02;
      const p = base + windBoost;
      if(Math.random() < p*0.02*this.speed){
        item.state = 'falling';
        // initial nudge
        item.vel.y = - (0.05 + 0.1*Math.random());
        item.vel.x += (Math.random()-0.5)*0.02*(1+this.wind);
        item.vel.z += (Math.random()-0.5)*0.02*(1+this.wind);

    },
    step(dt){
      // dt in seconds
      if(!this.running) return;
      const g = 0.98; // gravity
      const wind = this.wind;

      // advance season (auto)
      this.season += dt * 0.02 * this.speed;
      for(const t of this.trees){
        const inst = t.mesh;

        const d=t.helper;

          if(it.state === 'attached'){

            it.rot.z += Math.sin((performance.now()/1000 + i*0.13))*0.001;

            this.maybeDetach(it);
          }else if(it.state === 'falling'){
            // physics
            const wdir = new THREE.Vector3(Math.sin(performance.now()/1500), 0, Math.cos(performance.now()/1300)).normalize();
            it.vel.x += (wdir.x * 0.05 * wind + (Math.random()-0.5)*0.02*turb) * dt * this.speed;
            it.vel.z += (wdir.z * 0.05 * wind + (Math.random()-0.5)*0.02*turb) * dt * this.speed;
            it.vel.y -= g * 0.2 * dt * this.speed;
            it.pos.addScaledVector(it.vel, dt * (1+0.5*Math.random()));
            it.rot.x += it.angVel.x * dt; it.rot.y += it.angVel.y * dt; it.rot.z += it.angVel.z * dt;
            // ground hit: y<=0
            if(it.pos.y <= 0){
              it.pos.y = 0; it.vel.set(0,0,0); it.angVel.set(0,0,0);
              it.state='landed';
            }
          }else{ // landed
            // slight wind slide
            it.pos.x += (Math.random()-0.5)*0.002*wind;
            it.pos.z += (Math.random()-0.5)*0.002*wind;
          }
          // write back transform
          d.position.copy(it.pos);
          d.rotation.set(it.rot.x, it.rot.y, it.rot.z);
          d.scale.copy(it.scale);
          d.updateMatrix();
          inst.setMatrixAt(i, d.matrix);
          // color by age
          if(inst.instanceColor){
            const c = this.colorForAge(it.age);
            inst.setColorAt(i, c);
          }
        }
        inst.instanceMatrix.needsUpdate = true;
        if(inst.instanceColor) inst.instanceColor.needsUpdate = true;
      }
    },
    frame(ts){
      if(!this._last) this._last = ts;
      const dt = Math.min(0.05, (ts - this._last)/1000); this._last = ts;
      this.step(dt);
      this._raf = requestAnimationFrame(this.frame.bind(this));
    },
    start(){
      this.running=true;
      if(!this._raf) this._raf = requestAnimationFrame(this.frame.bind(this));
    },
    pause(){
      this.running=false;
    },
    reset(){
      for(const t of this.trees){
        if(!t.mesh) continue;
        const m4 = new THREE.Matrix4(), p=new THREE.Vector3(), s=new THREE.Vector3(), q=new THREE.Quaternion(), e=new THREE.Euler();
        for(let i=0;i<t.count;i++){
          t.mesh.getMatrixAt(i, m4); m4.decompose(p,q,s); e.setFromQuaternion(q);
          const it=t.items[i];
          if(!it) continue;
          it.pos.copy(p); it.rot.set(e.x,e.y,e.z); it.scale.copy(s);
          it.vel.set(0,0,0); it.angVel.set((Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8);
          it.state='attached'; it.age=Math.random()*0.2;
        }
        t.mesh.instanceMatrix.needsUpdate = true;
        if(t.mesh.instanceColor) t.mesh.instanceColor.needsUpdate = true;
      }
      this.season=0;
    }
  };
  window.LeafEngine = LeafEngine;

  // Scene4 panel hookup
  function buildScene4Controls(){
    ensureScene4Panel();
    const rate = byId('fallRate'), wind = byId('wind'), turb = byId('turb');
    const rateV = byId('fallRateV'), windV = byId('windV'), turbV = byId('turbV');
    if(rate && !rate._b){ rate._b=true; rate.addEventListener('input', ()=>{ LeafEngine.speed = parseFloat(rate.value)||1; rateV.textContent = (LeafEngine.speed.toFixed(1))+'×'; }); rate.dispatchEvent(new Event('input')); }

<!-- v1.194 LeafEngine: auto-run + scene-scan fallback -->
<script>
(function(){
  const W = window;
  function hasTHREE(){ try{ return !!W.THREE; }catch(e){ return false; } }
  function byId(id){ return document.getElementById(id); }

  // attach if LeafEngine exists
  function augmentLeafEngine(){
    if(!W.LeafEngine || !hasTHREE()) return;
    const LE = W.LeafEngine;
    // add scene-scan fallback
    LE.scanSceneForLeaves = function(){
      try{
        const scene = W.scene; if(!scene || !W.THREE) return false;
        const found = [];
        scene.traverse(obj=>{
          if(obj && obj.isInstancedMesh){
            // heuristics: likely leaves
            const mat = obj.material || {};
            const isLeafy = (mat.vertexColors===true) || (mat.side===W.THREE.DoubleSide);
            const geo = obj.geometry;
            if(isLeafy && geo && obj.count>0){
              found.push(obj);
            }
          }
        });
        if(found.length===0) return false;
        this.trees = [];
        const d=new W.THREE.Object3D();
        for(const mesh of found){
          const count = mesh.count|0;
          const items = new Array(count);
          const m4 = new W.THREE.Matrix4(), p=new W.THREE.Vector3(), s=new W.THREE.Vector3(), q=new W.THREE.Quaternion(), e=new W.THREE.Euler();
          for(let i=0;i<count;i++){
            mesh.getMatrixAt(i, m4); m4.decompose(p,q,s); e.setFromQuaternion(q);
            items[i] = {
              pos: p.clone(),
              rot: new W.THREE.Euler(e.x, e.y, e.z),
              scale: s.clone(),
              vel: new W.THREE.Vector3(0,0,0),
              angVel: new W.THREE.Vector3((Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8),
              state: 'attached',
              age: Math.random()*0.2
            };
          }
          this.trees.push({mesh, count, items, helper:d});
        }
        return this.trees.length>0;
      }catch(e){ console.warn('scanSceneForLeaves error', e); return false; }
    };

    const _oldRefresh = LE.refreshFromForest.bind(LE);
    LE.refreshFromForest = function(){
      _oldRefresh();
      if(!this.trees || this.trees.length===0){
        // try scene scan fallback
        if(this.scanSceneForLeaves()){
          // ok
        }
      }
      // auto-start at mild speed
      this.speed = Math.max(this.speed||0.6, 0.6);
      this.start();
    };

    // auto-start when s3 built
    if(typeof W.s3_build === 'function'){
      const old = W.s3_build;
      W.s3_build = function(){ old(); setTimeout(()=>{ LE.speed = Math.max(LE.speed||0.6,0.6); LE.refreshFromForest(); }, 60); };
    }
    // ensure scene4 prepare also starts
    if(typeof W.s4_prepare === 'function'){
      const old4 = W.s4_prepare;
      W.s4_prepare = function(force){ old4(force); setTimeout(()=>{ LE.refreshFromForest(); }, 80); };
    }
  }

  function onReady(){
    augmentLeafEngine();
    // if forest already there, try refreshing once
    setTimeout(()=>{ if(W.LeafEngine){ W.LeafEngine.refreshFromForest(); } }, 200);
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', onReady, {once:true}); }
  else { onReady(); }
})();
</script>


<!-- v1.195 Right-rail remover (heuristic + observer) -->
<script>
(function(){
  const WHITELIST = new Set(['panelShell','panelHandle']);
  function isWhitelisted(el){
    if(!el) return false;
    if(WHITELIST.has(el.id)) return true;
    return !!el.closest('#panelShell');
  }
  function looksLikeRightRail(el, st, rect, vw){
    if(isWhitelisted(el)) return false;
    if(!rect || rect.width<=0 || rect.height<=0) return false;
    const name = (el.id + ' ' + el.className).toLowerCase();
    const probableName = /(right|sidebar|control|toolbar|panel|dock)/.test(name);
    const onRight = (rect.left > vw*0.6) || (parseFloat(st.right||'99999') < 40);
    const sized = rect.width < vw*0.48 && rect.height > 120;
    const pos = (st.position==='fixed' || st.position==='absolute' || st.position==='sticky');
    // If it's on right and named like a rail, or fixed to right edge, consider it a rail.
    return (onRight && sized && (probableName || pos));
  }
  function nukeRightRails(){
    try{
      const vw = window.innerWidth || document.documentElement.clientWidth || 1920;
      const elems = Array.from(document.body.querySelectorAll('body *')).slice(0, 5000);
      const hidden=[];
      for(const el of elems){
        if(!el || el===document.body) continue;
        if(isWhitelisted(el)) continue;
        const st = getComputedStyle(el);
        if(st.display==='none') continue;
        // Skip canvas/webgl main containers by heuristic
        if(el.tagName==='CANVAS') continue;
        if(el.contains(document.getElementById('panelShell'))) continue;
        const rect = el.getBoundingClientRect();
        if(looksLikeRightRail(el, st, rect, vw)){
          el.style.setProperty('display','none','important');
          el.style.setProperty('visibility','hidden','important');
          hidden.push(el);
        }
      }
      window.__hiddenRightRails = hidden;
    }catch(e){ console.warn('nukeRightRails error', e); }
  }
  const obs = new MutationObserver((ml)=>{
    for(const m of ml){
      if(m.addedNodes && m.addedNodes.length){
        nukeRightRails();
        break;
      }
    }
  });
  function boot(){
    nukeRightRails();
    try{ obs.observe(document.body, {childList:true, subtree:true}); }catch(e){}
    window.addEventListener('resize', ()=>{ nukeRightRails(); }, {passive:true});
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot, {once:true}); }
  else { boot(); }
})();
</script>


<!-- v1.196 Right-overlay killer & renderer resizer -->
<script>
(function(){
  const WHITE = new Set(['panelShell','panelHandle']);
  function isWhite(el){ return el && (WHITE.has(el.id) || (el.closest && el.closest('#panelShell'))); }
  function rgbToLuma(c){
    const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(c||''); if(!m) return {Y:1, a:0};
    const r=+m[1]/255, g=+m[2]/255, b=+m[3]/255, a = m[4]!=null? +m[4]: 1;
    const Y = 0.2126*r + 0.7152*g + 0.0722*b;
    return {Y, a};
  }
  function isRightDarkOverlay(el, rect, st, vw){
    if(isWhite(el)) return false;
    if(rect.width<40 || rect.height<120) return false;
    const onRight = rect.left > vw*0.6 || (parseFloat(st.right||'9999') < 2);
    if(!onRight) return false;
    const bg = st.backgroundColor || 'rgba(0,0,0,0)';
    const o = st.opacity||'1';
    const la = rgbToLuma(bg); const Y = la.Y, a = la.a;
    const op = parseFloat(o);
    const darkish = (Y < 0.35);
    const opaque = (a*op > 0.12);
    const pos = (st.position==='fixed' || st.position==='absolute' || st.position==='sticky');
    const pe = st.pointerEvents !== 'none';
    return pos && opaque && darkish && pe;
  }
  function nukeOverlays(){
    try{
      const vw = window.innerWidth || 1920;
      const all = Array.from(document.body.querySelectorAll('*'));
      for(const el of all){
        if(!el || isWhite(el)) continue;
        const st = getComputedStyle(el);
        if(st.display==='none' || st.visibility==='hidden') continue;
        const rect = el.getBoundingClientRect();
        if(isRightDarkOverlay(el, rect, st, vw)){
          el.style.setProperty('display','none','important');
          el.style.setProperty('visibility','hidden','important');
        }
      }
    }catch(e){ console.warn('nukeOverlays error', e); }
  }
  function resizeRenderer(){
    try{
      if(window.renderer && window.camera){
        const w = window.innerWidth, h = window.innerHeight;
        if(typeof renderer.setSize==='function'){ renderer.setSize(w, h, false); }
        if('aspect' in window.camera){ camera.aspect = w/h; camera.updateProjectionMatrix && camera.updateProjectionMatrix(); }
        window.controls && window.controls.update && window.controls.update();
      }
      const cvs = document.querySelectorAll('canvas');
      cvs.forEach(c=>{ c.style.width = '100vw'; c.style.height = '100vh'; });
    }catch(e){}
  }
  function boot(){
    nukeOverlays(); resizeRenderer();
    window.addEventListener('resize', ()=>{ nukeOverlays(); resizeRenderer(); }, {passive:true});
    if(window.s3_build){ const old=window.s3_build; window.s3_build=function(){ old(); setTimeout(()=>{ nukeOverlays(); resizeRenderer(); }, 60); }; }
    const handle = document.getElementById('panelHandle');
    if(handle){ handle.addEventListener('click', ()=>{ setTimeout(()=>{ nukeOverlays(); resizeRenderer(); }, 60); }); }
    setTimeout(nukeOverlays, 300); setTimeout(resizeRenderer, 320);
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot, {once:true}); } else { boot(); }
})();
</script>

<!-- v1.197: Robust CSV import + Scene4 panel filler -->
<script>
(function(){
  function byId(id){ return document.getElementById(id); }
  const STATUS = (function(){
    let box = document.getElementById('csvStatus');
    if(!box){
      box = document.createElement('div'); box.id='csvStatus'; box.style.display='none';
      document.body.appendChild(box);
    }
    function show(msg, ok=true){
      box.textContent = msg; box.className = ok?'ok':'err'; box.style.display='block';
      clearTimeout(box._t); box._t = setTimeout(()=>{ box.style.display='none'; }, 3200);
    }
    return {show};
  })();

  // ---- Robust CSV parsing ----
  function toNum(v){
    if(v==null) return NaN;
    if(typeof v === 'number') return v;
    let s = String(v).trim().replace(/^[\uFEFF]+/,''); // strip BOM + trim
    // accept "12.3mm" "4,5" "10cm"
    s = s.replace(',', '.'); // decimal comma -> dot
    const unit = s.match(/\s*(mm|cm|m)\s*$/i);
    let mul = 1;
    if(unit){
      const u = unit[1].toLowerCase();
      if(u==='cm') mul = 10;
      else if(u==='m') mul = 1000;
      s = s.replace(/\s*(mm|cm|m)\s*$/i, '');
    }
    const n = parseFloat(s.replace(/[^\d.+-eE]/g,''));
    return isFinite(n) ? n*mul : NaN;
  }
  function parseCSVText(text){
    const raw = (text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
    if(!raw) return null;
    // remove comment lines
    const lines = raw.split('\n').filter(l=>!/^(\s*#|$)/.test(l));
    if(lines.length===0) return null;
    const all = lines.join('\n').replace(/;/g,',');

    // If "key=value" style present in first non-empty line, parse pairs (possibly comma-separated)
    if(/=/.test(lines[0])){
      const dict={};
      lines.forEach(line=>{
        line.split(',').forEach(tok=>{
          const m = tok.split('=');
          if(m.length>=2){
            const k = m[0].trim();
            const v = m.slice(1).join('=').trim();
            dict[k]=v;
          }
        });
      });
      return pickParams(dict);
    }

    // Try header + data rows (CSV)
    const header = lines[0].split(',').map(s=>s.trim());
    // Find the first data row that has at least one number
    let dataRow = null;
    for(let i=1;i<lines.length;i++){
      const vals = lines[i].split(',').map(s=>s.trim());
      const hasNum = vals.some(v=>isFinite(toNum(v)));
      if(hasNum){ dataRow = vals; break; }
    }
    if(dataRow){
      const dict={};
      for(let i=0;i<Math.min(header.length, dataRow.length); i++){
        dict[header[i]] = dataRow[i];
      }
      const out = pickParams(dict);
      if(out) return out;
    }

    // Fallback: scan tokens as alternating key,value or just numeric sequence
    const tokens = all.split(',').map(s=>s.trim()).filter(Boolean);
    if(tokens.length>=2){
      // try key,value alternating
      const dict={};
      for(let i=0;i+1<tokens.length;i+=2){
        dict[tokens[i]] = tokens[i+1];
      }
      const out = pickParams(dict);
      if(out) return out;
      // else numeric sequence: len,width,thickness,curvature,tilt
      const nums = tokens.map(toNum).filter(n=>isFinite(n));
      if(nums.length>=2){
        return {len:nums[0], width:nums[1], thickness:nums[2], curvature:nums[3], tilt:nums[4]};
      }
    }
    return null;
  }
  function pickParams(dict){
    if(!dict) return null;
    const get = (keys)=>{
      for(const k of keys){
        if(dict[k]!=null && String(dict[k]).trim()!==''){
          const n = toNum(dict[k]);
          if(isFinite(n)) return n;
        }
      }
      return null;
    };
    const out = {
      len: get(['len','length','leaf_len','l','長度','葉長','Length','L']),
      width: get(['width','w','leaf_w','寬度','葉寬','Width','W']),
      thickness: get(['thickness','thick','t','厚度','Thickness','T']),
      curvature: get(['curvature','curve','cv','彎曲','曲率','Curvature','Curve']),
      tilt: get(['tilt','angle','傾角','Angle'])
    };
    if(out.len==null && out.width==null) return null;
    return out;
  }

  function applyLeafParams(obj){
    try{
      window.P = window.P || {};
      const sync = (id, v)=>{
        const el = document.getElementById(id);
        const valEl = document.getElementById(id+'v');
        if(el && v!=null){
          el.value = String(v);
          el.dispatchEvent(new Event('input', {bubbles:true}));
          if(valEl) valEl.textContent = String(v);
        }
      };
      if(obj.len!=null){ window.P.len = obj.len; sync('len', obj.len); }
      if(obj.width!=null){ window.P.width = obj.width; sync('width', obj.width); }
      if(obj.thickness!=null){ window.P.thickness = obj.thickness; sync('thickness', obj.thickness); }
      if(obj.curvature!=null){ window.P.curvature = obj.curvature; sync('curvature', obj.curvature); }
      if(obj.tilt!=null){ window.P.tilt = obj.tilt; sync('tilt', obj.tilt); }
      if(typeof window.syncLeafInit==='function') try{ window.syncLeafInit(); }catch(e){}
      if(typeof window.buildLeaf==='function') try{ window.buildLeaf(); }catch(e){}
      STATUS.show('CSV 匯入成功：'
        + (obj.len!=null?`len=${obj.len} `:'')
        + (obj.width!=null?`width=${obj.width} `:'')
        + (obj.thickness!=null?`thickness=${obj.thickness} `:'')
        + (obj.curvature!=null?`curvature=${obj.curvature} `:'')

      const rate = byId('fallRate'), wind = byId('wind'), turb = byId('turb');

      if(pa && !pa._b){ pa._b=true; pa.onclick=()=>LE.pause(); }
      if(rs && !rs._b){ rs._b=true; rs.onclick=()=>LE.reset(); }
    }
  }

  function boot(){

    const obs = new MutationObserver(()=>{ hookCSVInput(); ensureScene4Panel(); });
    try{ obs.observe(document.body, {subtree:true, childList:true}); }catch(e){}
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot, {once:true}); } else { boot(); }

<script>
(function(){
  function byId(id){ return document.getElementById(id); }

  // --- CSV robust import (full field mapping + defaults) ---
  const CSV_DEFAULTS = {
    len: 8, width: 3, thickness: 0.02, curvature: 0.2, tilt: 0,
    curl: 0, twist: 0, waveAmp: 0, waveFreq: 0, asym: 0, petioleR: 0.05,
    leafScale: 1, randTilt: 0
  };
  function toNum(v){
    if(v==null) return NaN;
    if(typeof v === 'number') return v;
    let s = String(v).trim().replace(/^[\uFEFF]+/,''); // strip BOM
    s = s.replace(',', '.'); // decimal comma
    const unit = s.match(/\s*(mm|cm|m)\s*$/i);
    let mul = 1;
    if(unit){
      const u = unit[1].toLowerCase();
      if(u==='cm') mul = 10;
      else if(u==='m') mul = 1000;
      s = s.replace(/\s*(mm|cm|m)\s*$/i, '');
    }
    const n = parseFloat(s.replace(/[^\d.+-eE]/g,''));
    return isFinite(n) ? n*mul : NaN;
  }
  function parseCSVText(text){
    const raw = (text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
    if(!raw) return null;
    const lines = raw.split('\n').filter(l=>!/^(\s*#|$)/.test(l));
    if(lines.length===0) return null;
    const all = lines.join('\n').replace(/;/g,',');

    // 1) key=value style
    if(/=/.test(lines[0])){
      const d={};
      lines.forEach(line=>{
        line.split(',').forEach(tok=>{
          const m = tok.split('=');
          if(m.length>=2){ d[m[0].trim()] = m.slice(1).join('=').trim(); }
        });
      });
      return mapFields(d);
    }

    // 2) header+row style
    const header = lines[0].split(',').map(s=>s.trim());
    let dataRow = null;
    for(let i=1;i<lines.length;i++){
      const vals = lines[i].split(',').map(s=>s.trim());
      const hasNum = vals.some(v=>isFinite(toNum(v)));
      if(hasNum){ dataRow = vals; break; }
    }
    if(dataRow){
      const d={};
      for(let i=0;i<Math.min(header.length,dataRow.length);i++){ d[header[i]] = dataRow[i]; }
      return mapFields(d);
    }

    // 3) key,value alternating
    const toks = all.split(',').map(s=>s.trim()).filter(Boolean);
    if(toks.length>=2){
      const d={}; for(let i=0;i+1<toks.length;i+=2){ d[toks[i]] = toks[i+1]; }
      const out = mapFields(d); if(out) return out;
      // 4) numeric list len,width,thickness,curvature,tilt,(curl,twist,wAmp,wFreq,asym,petioleR,leafScale,randTilt)
      const nums = toks.map(toNum).filter(x=>isFinite(x));
      if(nums.length>=2){
        const out = Object.assign({}, CSV_DEFAULTS);
        const keys = ['len','width','thickness','curvature','tilt','curl','twist','waveAmp','waveFreq','asym','petioleR','leafScale','randTilt'];
        for(let i=0;i<Math.min(keys.length, nums.length); i++){ out[keys[i]] = nums[i]; }
        return out;
      }
    }
    return null;
  }
  function mapFields(dict){
    const get = (names)=>{
      for(const k of names){ if(dict[k]!=null && String(dict[k]).trim()!==''){ const n=toNum(dict[k]); if(isFinite(n)) return n; } }
      return null;
    };
    const out = Object.assign({}, CSV_DEFAULTS);
    out.len  = get(['len','length','leaf_len','l','長度','葉長','Length','L']) ?? out.len;
    out.width= get(['width','w','leaf_w','寬度','葉寬','Width','W']) ?? out.width;
    out.thickness=get(['thickness','thick','t','厚度','Thickness','T']) ?? out.thickness;
    out.curvature=get(['curvature','curve','cv','彎曲','曲率','Curvature','Curve']) ?? out.curvature;
    out.tilt = get(['tilt','angle','傾角','Angle']) ?? out.tilt;
    out.curl = get(['curl','捲曲','curling']) ?? out.curl;
    out.twist= get(['twist','扭轉']) ?? out.twist;
    out.waveAmp = get(['waveAmp','wave_amplitude','waveA','波浪幅度']) ?? out.waveAmp;
    out.waveFreq= get(['waveFreq','wave_frequency','waveF','波浪頻率']) ?? out.waveFreq;
    out.asym = get(['asym','asymmetry','非對稱','不對稱']) ?? out.asym;
    out.petioleR = get(['petioleR','petiole_radius','leafstalkR','葉柄半徑']) ?? out.petioleR;
    out.leafScale= get(['leafScale','sizeScale','leaf_size_scale','葉片尺寸倍率']) ?? out.leafScale;
    out.randTilt = get(['randTilt','randomTilt','葉片隨機傾角']) ?? out.randTilt;
    return out;
  }
  const STATUS=(function(){ let box=document.getElementById('csvStatus'); if(!box){ box=document.createElement('div'); box.id='csvStatus'; box.style.display='none'; document.body.appendChild(box);} return {show:(msg,ok=true)=>{ box.textContent=msg; box.className=ok?'ok':'err'; box.style.display='block'; clearTimeout(box._t); box._t=setTimeout(()=>{ box.style.display='none'; }, 3600); }}; })();
  function applyLeafParams(p){

      // 同步 UI

      // 若有加強參數的滑桿也同步（若頁面沒有就忽略）
      [['curl','curlv'],['twist','twistv'],['waveAmp','waveAmpv'],['waveFreq','waveFreqv'],['asym','asymv'],['petioleR','petioleRv'],['leafScale','leafScalev'],['randTilt','randTiltv']].forEach(([a,b])=>{
        const el=byId(a), sv=byId(b); if(el){ el.value=String(p[a]); el.dispatchEvent(new Event('input',{bubbles:true})); } if(sv){ sv.textContent=String(p[a]); }

    }catch(e){

  }
  function hookCSVInputs(){

        r.readAsText(f);

  // --- Scene4: terrain/sky/sun panel & generator ---

  function ensureScene4Logic(){
    if(!window.THREE || !window.scene) return;
    window.__env = window.__env || {};
    const env = window.__env;
    const THREE = window.THREE;

    // ground builder
    env.buildGround = function(){
      const size = 600, seg=200;
      const amp = parseFloat(byId('gAmp')?.value||'8');
      const slopeDeg = parseFloat(byId('gSlope')?.value||'5');
      const slope = Math.tan(slopeDeg*Math.PI/180)*0.2;
      const type = byId('gType')?.value || 'soil';

      if(env.ground){ scene.remove(env.ground); env.ground.geometry.dispose(); env.ground.material.dispose(); env.ground=null; }
      const geo = new THREE.PlaneGeometry(size, size, seg, seg);
      const pos = geo.attributes.position;
      for(let i=0;i<pos.count;i++){
        const x = pos.getX(i), z = pos.getY(i); // in PlaneGeometry, y is second axis before rotation
        const nx = x/size, nz = z/size;
        // simple multi-sine height (no noise lib)
        const h = amp*( 0.5*Math.sin(nx*8.3) + 0.35*Math.sin(nz*10.1+1.2) + 0.15*Math.sin((nx+nz)*5.7) ) + slope*(x/size)*size*0.6;
        pos.setZ(i, h);
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({color: colorByType(type), roughness: 0.95, metalness:0.0});
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI/2;
      mesh.receiveShadow = true;
      env.ground = mesh; scene.add(mesh);
    };

    function colorByType(t){
      switch(t){
        case 'soil': return 0x3a2a1f; // 深土
        case 'grass': return 0x506a2a; // 綠黃褐
        case 'moss': return 0x1f6a2a; // 蘚苔純綠
        case 'rock': return 0x2d2f33; // 深灰
        case 'sand': return 0x8a6a32; // 偏黃
        case 'mud':  return 0x2a2018; // 深褐
        case 'mixed': return 0x3c3c2e;
        default: return 0x3a2a1f;
      }
    }

    // sky + sun
    if(!env.hemi){
      env.hemi = new THREE.HemisphereLight(0x87b5ff, 0x1b1b1b, 0.55);
      scene.add(env.hemi);
    }
    if(!env.sun){
      env.sun = new THREE.DirectionalLight(0xffffff, 1.1);
      env.sun.castShadow = true;
      env.sun.shadow.mapSize.width = 2048;
      env.sun.shadow.mapSize.height = 2048;
      env.sun.shadow.camera.near = 0.5;
      env.sun.shadow.camera.far = 2000;
      env.sun.position.set(200, 300, 100);
      scene.add(env.sun);
    }
    if(!env.sunBall){
      const g = new THREE.SphereGeometry(6, 16, 16);
      const m = new THREE.MeshBasicMaterial({color:0xffe07a});
      env.sunBall = new THREE.Mesh(g,m);
      env.sunBall.layers.enable(0);
      scene.add(env.sunBall);
    }

    env.timeH = env.timeH || 12;
    env.sunAutoTimer = env.sunAutoTimer || null;

    env.updateSun = function(){
      const h = env.timeH; // 0..24
      const t = (h/24)*Math.PI*2; // one cycle
      const r = 400;
      const y = Math.sin(t)*250 + 40; // height
      const x = Math.cos(t)*r;
      const z = Math.sin(t*0.7)*r*0.6;
      env.sun.position.set(x, y, z);
      env.sunBall.position.copy(env.sun.position);
      // sky color
      const sky = skyColorByHour(h);
      if(renderer && renderer.setClearColor) renderer.setClearColor(sky, 1);
      // shadow direction already from sun
    };

    function skyColorByHour(h){
      // simple gradient mapping
      if(h<5){ return 0x0b0d1a; } // 夜
      if(h<6.5){ return 0x2b2444; } // 破曉紫

      if(h<19){ return 0xff9150; } // 黃昏橘

      return 0x0a0c18; // 夜
    }

    env.centerView = function(){
      if(!window.camera || !window.controls || !env.ground) return;
      const box = new THREE.Box3().setFromObject(env.ground);
      const size = new THREE.Vector3(); const center = new THREE.Vector3();

        if(wind && !wind._b){ wind._b=true; wind.addEventListener('input', ()=>{ LE.wind = parseFloat(wind.value)||0; windV.textContent = wind.value; }); wind.dispatchEvent(new Event('input')); }
        if(turb && !turb._b){ turb._b=true; turb.addEventListener('input', ()=>{ LE.turb = parseFloat(turb.value)||0; turbV.textContent = turb.value; }); turb.dispatchEvent(new Event('input')); }
        const st=byId('fallStart'), pa=byId('fallPause'), rs=byId('fallReset');

        if(pa && !pa._b){ pa._b=true; pa.onclick=()=>LE.pause(); }
        if(rs && !rs._b){ rs._b=true; rs.onclick=()=>LE.reset(); }
