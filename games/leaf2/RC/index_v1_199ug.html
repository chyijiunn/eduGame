  }

  // Ensure tab handlers call our Scene4
  function attachTabFix(){
    const t4 = byId('tabS4');
    if(t4 && !t4._b198){
      t4._b198=true;
      t4.addEventListener('click', ()=>{
        try{ if(window.s4_prepare) window.s4_prepare(true); }catch(e){}
        ensureScene4UI();
        ensureScene4Logic();
      });
    }
  }

  function boot(){
    hookCSVInputs();
    ensureScene4UI();
    attachTabFix();
    // Also if currently on Scene4, ensure logic runs
    setTimeout(()=>{ ensureScene4Logic(); }, 150);
    // Mutation observer to keep hooks alive
    const obs = new MutationObserver(()=>{ hookCSVInputs(); ensureScene4UI(); attachTabFix(); });
    try{ obs.observe(document.body, {subtree:true, childList:true}); }catch(e){}
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot, {once:true}); } else { boot(); }
})();
</script>
<!-- v1.199: remove placement ring + leaf physics land on terrain + per-tree drag -->
<script>
(function(){
  const W = window;
  function onReady(fn){ if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', fn, {once:true}); } else { fn(); } }

  // --- Remove any "placement ring / helper circles" near the forest ---
  function removeRings(){
    try{
      if(!W.scene || !W.THREE) return;
      const dead = [];
      W.scene.traverse(obj=>{
        if(!obj || obj===W.scene) return;
        if(obj === W.panelShell || (obj.id && String(obj.id).includes('panelShell'))) return;
        const g = obj.geometry;
        const name = (obj.name||'').toLowerCase();
        const isRing = g && (
          g.type === 'RingGeometry' || g.type==='CircleGeometry' || g.type==='TorusGeometry' ||
          name.includes('ring') || name.includes('radius') || name.includes('placement')
        );
        // also catch flat dark disks close to ground possibly used as placement radius
        if(isRing){
          dead.push(obj);
        }
      });
      dead.forEach(el=>{ try{ el.parent && el.parent.remove(el); }catch(e){} });
      if(dead.length>0) console.log('[v1.199] 移除圈圈/輔助環：', dead.length);
    }catch(e){ console.warn('removeRings error', e); }
  }

  // --- Terrain height helper using same formula as buildGround ---
  function ensureHeightAPI(){
    const env = W.__env || (W.__env = {});
    if(!env.heightAt){
      env.heightAt = function(x, z){
        // must match buildGround() in your page
        const size = 600;
        const amp = parseFloat(document.getElementById('gAmp')?.value||'8');
        const slopeDeg = parseFloat(document.getElementById('gSlope')?.value||'5');
        const slope = Math.tan(slopeDeg*Math.PI/180)*0.2;
        const nx = x/size, nz = z/size;
        const h = amp*( 0.5*Math.sin(nx*8.3) + 0.35*Math.sin(nz*10.1+1.2) + 0.15*Math.sin((nx+nz)*5.7) )
                + slope*(x/size)*size*0.6;
        return h; // world Y height
      };
    }
  }

  // --- Patch LeafEngine.step so leaves land on terrain (not y=0 flat) ---
  function patchLeafEngine(){
    const LE = W.LeafEngine; if(!LE || !W.THREE) return;
    const THREE = W.THREE;
    // override step:
    LE.step = function(dt){
      if(!this.running) return;
      const g = 0.98;
      const wind = this.wind;
      const turb = this.turb;

      this.season += dt * 0.02 * this.speed;
      const tmpWorld = new THREE.Vector3();
      const tmpLocal = new THREE.Vector3();
      const wdir = new THREE.Vector3();
      const obj3 = new THREE.Object3D();

      for(const t of this.trees){
        const inst = t.mesh; if(!inst) continue;
        const d = t.helper || (t.helper = new THREE.Object3D());
        const m = new THREE.Matrix4();
        const matWorld = inst.matrixWorld;
        const matWorldInv = new THREE.Matrix4().copy(matWorld).invert();

        for(let i=0;i<t.count;i++){
          const it = t.items[i]; if(!it) continue;
          // "aerodynamic" drag based on leaf projected area (approx scale.x * scale.y)
          const area = Math.max(0.2, (it.scale.x*it.scale.y));
          const drag = 0.12 * area;

          it.age = Math.min(1, it.age + dt*0.01*this.speed);
          if(it.state === 'attached'){
            it.rot.z += Math.sin((performance.now()/1000 + i*0.13))*0.0015;
            // detach:
            const base = Math.max(0, it.age-0.4)*0.6;
            const windBoost = wind*0.02;
            const p = base + windBoost;
            if(Math.random() < p*0.02*this.speed){
              it.state = 'falling';
              it.vel.y = - (0.05 + 0.1*Math.random());
              it.vel.x += (Math.random()-0.5)*0.02*(1+wind);
              it.vel.z += (Math.random()-0.5)*0.02*(1+wind);
            }
          }else if(it.state === 'falling'){
            wdir.set(Math.sin(performance.now()/1500), 0, Math.cos(performance.now()/1300)).normalize();
            // wind + turbulence
            it.vel.x += (wdir.x * 0.05 * wind + (Math.random()-0.5)*0.02*turb) * dt * this.speed;
            it.vel.z += (wdir.z * 0.05 * wind + (Math.random()-0.5)*0.02*turb) * dt * this.speed;
            // gravity
            it.vel.y -= g * 0.20 * dt * this.speed;
            // drag
            it.vel.multiplyScalar(1 - Math.min(0.9, drag*dt));
            // flutter (depend on tilt/shape) -> small lift oscillation
            it.rot.x += it.angVel.x * dt; it.rot.y += it.angVel.y * dt; it.rot.z += it.angVel.z * dt;
            const flutter = Math.sin((performance.now()+i*37)/180) * 0.02 * (1+0.3*turb);
            it.vel.y += flutter*dt;

            // integrate in local space
            it.pos.addScaledVector(it.vel, dt * (1+0.5*Math.random()));

            // terrain collision in world space
            // local->world
            tmpWorld.copy(it.pos).applyMatrix4(matWorld);
            const env = W.__env;
            if(env && typeof env.heightAt==='function'){
              const groundY = env.heightAt(tmpWorld.x, tmpWorld.z);
              if(tmpWorld.y <= groundY){
                tmpWorld.y = groundY;
                // world->local
                tmpLocal.copy(tmpWorld).applyMatrix4(matWorldInv);
                it.pos.copy(tmpLocal);
                it.vel.set(0,0,0);
                it.angVel.set(0,0,0);
                it.state = 'landed';
              }
            }else{
              // fallback to y=0
              if(tmpWorld.y <= 0){
                tmpWorld.y = 0;
                tmpLocal.copy(tmpWorld).applyMatrix4(matWorldInv);
                it.pos.copy(tmpLocal);
                it.vel.set(0,0,0); it.angVel.set(0,0,0);
                it.state='landed';
              }
            }
          }else{
            // landed: tiny slide with wind
            it.pos.x += (Math.random()-0.5)*0.002*wind;
            it.pos.z += (Math.random()-0.5)*0.002*wind;
          }

          // write back
          d.position.copy(it.pos);
          d.rotation.set(it.rot.x, it.rot.y, it.rot.z);
          d.scale.copy(it.scale);
          d.updateMatrix();
          inst.setMatrixAt(i, d.matrix);

          if(inst.instanceColor){
            // color by age
            const c = W.LeafEngine.colorForAge(it.age);
            inst.setColorAt(i, c);
          }
        }
        inst.instanceMatrix.needsUpdate = true;
        if(inst.instanceColor) inst.instanceColor.needsUpdate = true;
      }
    };

    console.log('[v1.199] LeafEngine.step 已改寫：支援地形起伏落地與依葉片面積的阻力');
  }

  function boot(){
    removeRings();
    ensureHeightAPI();
    patchLeafEngine();
    // also re-run after forest build / scene4 prepare
    if(W.s3_build){ const old=W.s3_build; W.s3_build=function(){ old(); setTimeout(()=>{ removeRings(); ensureHeightAPI(); }, 60); }; }
    if(W.s4_prepare){ const old4=W.s4_prepare; W.s4_prepare=function(force){ old4(force); setTimeout(()=>{ removeRings(); ensureHeightAPI(); }, 80); }; }
    // run again after 200ms to catch late inserts
    setTimeout(removeRings, 200);
  }
  onReady(boot);
})();
</script>
