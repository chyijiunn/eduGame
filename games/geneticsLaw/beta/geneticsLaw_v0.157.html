<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>geneticsLaw v0.157 - 聯鎖遺傳與交互控制修正</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#121a28cc; --txt:#e9eefc; --muted:#a8b3d6;
    --accent:#7cf3c7; --warn:#ffcf5a; --bad:#ff6b8b; --good:#67e06f;
    --line:#223052; --btn:#1b2946;
  }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--txt); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; overflow:hidden; }
  #wrap{ position:fixed; inset:0; overflow:hidden; }
  canvas{ position:absolute; inset:0; touch-action:none; }
  .topBar{ position:absolute; left:12px; right:12px; top:12px; display:flex; justify-content:center; align-items:center; pointer-events:none; z-index:10; }
  .topRow{ pointer-events:auto; display:flex; align-items:center; gap:8px; background: rgba(18, 26, 40, 0.4); padding: 4px 12px; border-radius: 20px; }
  .btn{ appearance:none; border:none; background:transparent; color:var(--txt); padding:8px 12px; font-size:14px; font-weight:900; cursor:pointer; border-radius:8px; transition: opacity 0.2s; }
  .btn:hover{ opacity: 0.7; }
  .btn.primary{ color: var(--accent); }
  .btn.warn{ color: var(--warn); }
  .select{ appearance:none; border:none; background:transparent; color:var(--txt); padding:6px 8px; font-weight:900; cursor:pointer; font-size:15px; outline:none; text-align:center; }
  .bottomBar{ position:absolute; left:12px; right:12px; bottom:24px; display:flex; flex-direction:column; align-items:center; gap:12px; pointer-events:none; z-index:10; }
  .controls-box{ pointer-events:auto; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .stats-pill{ background: rgba(15, 22, 36, 0.7); padding: 6px 16px; border-radius: 20px; font-size:12px; color: var(--muted); border: 1px solid var(--line); backdrop-filter: blur(4px); }
  #win-overlay { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); z-index: 100; pointer-events: none; }
  .win-text { font-size: 80px; font-weight: 900; color: var(--good); text-shadow: 0 0 30px rgba(103, 224, 111, 0.4); animation: pop 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.27); }
  @keyframes pop { 0% { transform: scale(0.5); opacity:0; } 100% { transform: scale(1); opacity:1; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="topBar">
    <div class="topRow">
      <button class="btn" onclick="changeLv(-1)">←</button>
      <select class="select" id="stageSelect" onchange="jumpToLv(this.value)">
        <option value="1-1">1-1 匹配性狀</option>
        <option value="1-2">1-2 雜交觀察</option>
        <option value="1-3">1-3 猜測親代</option>
        <option value="2-1">2-1 聯鎖匹配</option>
        <option value="2-2">2-2 雙基因雜交</option>
        <option value="2-3">2-3 終極挑戰</option>
      </select>
      <button class="btn primary" onclick="changeLv(1)">→</button>
    </div>
  </div>
  <div class="bottomBar">
    <div id="stats-area" class="stats-pill" style="display:none"></div>
    <div class="controls-box" id="ctrls"></div>
  </div>
  <div id="win-overlay"><div class="win-text">答對了！</div></div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d'); const winOverlay = document.getElementById('win-overlay');
  let W, H;
  const state = { lv: "1-1", view: { x: 0, y: 0, s: 1 }, target: null, player: null, mother: null, father: null, babies: [], guess: null, hiddenFather: null, isWon: false };

  function init() { window.addEventListener('resize', resize); resize(); setupInputs(); setLv("1-1"); requestAnimationFrame(tick); }
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }

  function getFullRandom(linked) {
    const pool = linked ? [['E','T'],['E','t'],['e','T'],['e','t']] : [['E'],['e']];
    const r = () => pool[Math.floor(Math.random()*pool.length)];
    return [{g:r()},{g:r()}];
  }

  function setLv(id) {
    state.lv = id; state.babies = []; state.isWon = false;
    document.getElementById('stageSelect').value = id;
    const isL2 = id.startsWith("2");
    state.target = getFullRandom(isL2);
    state.player = [{g:isL2?['e','t']:['e']},{g:isL2?['e','t']:['e']}];
    state.mother = getFullRandom(isL2);
    state.father = getFullRandom(isL2);
    state.hiddenFather = getFullRandom(isL2);
    state.guess = [{g:isL2?['E','T']:['E']},{g:isL2?['E','T']:['E']}];
    renderCtrls();
  }

  function getPh(chroms) {
    const all = chroms[0].g.concat(chroms[1].g);
    return { ear: all.includes('E'), tail: all.includes('T') };
  }

  function drawCreature(x, y, scale, chroms, label) {
    const ph = getPh(chroms); ctx.save(); ctx.translate(x, y); ctx.scale(scale * state.view.s, scale * state.view.s);
    if(state.lv.startsWith("2")) {
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        if(ph.tail) { ctx.fillStyle = '#ff7a45'; ctx.beginPath(); ctx.moveTo(-20, 20); ctx.quadraticCurveTo(-60, 60, -20, 70); ctx.quadraticCurveTo(0, 50, -10, 30); ctx.closePath(); ctx.fill(); ctx.stroke(); }
        else { ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.arc(-25, 25, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
    }
    ctx.fillStyle = '#fff1f1'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 15, 40, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd6d6'; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.ellipse(0, 35, 20, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1.0; ctx.fillStyle = '#fff1f1';
    if(ph.ear) { ctx.beginPath(); ctx.moveTo(-30, -15); ctx.lineTo(-45, -50); ctx.lineTo(-10, -35); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(30, -15); ctx.lineTo(45, -50); ctx.lineTo(10, -35); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(-30, -15); ctx.quadraticCurveTo(-50, 20, -25, 30); ctx.quadraticCurveTo(-10, 20, -15, -10); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(30, -15); ctx.quadraticCurveTo(50, 20, 25, 30); ctx.quadraticCurveTo(10, 20, 15, -10); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-15, 5, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(15, 5, 4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-5, 15); ctx.quadraticCurveTo(0, 20, 5, 15); ctx.stroke();
    if(label) { ctx.fillStyle = 'rgba(15,22,36,0.8)'; const txtW = ctx.measureText(label).width + 16; ctx.beginPath(); ctx.roundRect(-txtW/2, -85, txtW, 24, 12); ctx.fill(); ctx.fillStyle = '#7cf3c7'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, 0, -68); }
    ctx.restore();
  }

  function drawChrom(x, y, chroms, key) {
    const s = state.view.s;
    chroms.forEach((c, i) => {
        const cx = x + (i*36 - 18) * s; ctx.fillStyle = '#1b2946'; ctx.strokeStyle = '#2a3a63'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(cx-8*s, y, 16*s, 64*s, 8*s); ctx.fill(); ctx.stroke();
        c.g.forEach((gene, gi) => {
            const gy = y + (16 + gi*26)*s; const isDom = gene === gene.toUpperCase(); ctx.fillStyle = isDom ? '#ff7a45' : '#58a6ff'; ctx.fillRect(cx-4*s, gy, 8*s, 4*s); ctx.fillStyle = '#fff'; ctx.font = `bold ${12*s}px sans-serif`; ctx.textAlign='left'; ctx.fillText(gene, cx+10*s, gy+4*s);
            // 修正點選判定：只要提供 key (如 'mother')，不論是哪關，兩條染色體都應能獨立操作
            if(key) registerHit(cx-15*s, gy-12*s, 40*s, 24*s, () => toggleGene(key, i, gi));
        });
    });
  }

  const hitMap = []; function registerHit(x, y, w, h, cb) { hitMap.push({x,y,w,h,cb}); }

  function toggleGene(key, ci, gi) {
    if(state.isWon) return; 
    const target = state[key]; 
    const cur = target[ci].g[gi];
    target[ci].g[gi] = cur === cur.toUpperCase() ? cur.toLowerCase() : cur.toUpperCase();
    
    // 聯鎖邏輯：2-x 關卡中，如果手動改動了母本或父本，子代必須清空，因為比例基礎變了
    if(state.lv.endsWith("-2") || state.lv.endsWith("-3")) {
        state.babies = [];
        updateStats();
    }
    if(state.lv.endsWith("-1")) checkAutoWin();
    renderCtrls();
  }

  function breed(count) {
    const father = (state.lv.endsWith("-3")) ? state.hiddenFather : state.father;
    for(let i=0; i<count; i++) { 
        // 嚴格遵守聯鎖分配：從兩條染色體中隨機抽一條，保持 ET 或 Et 的組合
        const b = [ 
            JSON.parse(JSON.stringify(state.mother[Math.floor(Math.random()*2)])), 
            JSON.parse(JSON.stringify(father[Math.floor(Math.random()*2)])) 
        ]; 
        state.babies.push(b); 
    }
    updateStats();
  }

  function updateStats() {
    const area = document.getElementById('stats-area'); if(state.babies.length === 0) { area.style.display='none'; return; }
    area.style.display='block'; const counts = {};
    state.babies.forEach(b => { 
        const ph = getPh(b); 
        const k = state.lv.startsWith("1") ? (ph.ear?'尖耳':'垂耳') : (ph.ear?'尖耳':'垂耳')+(ph.tail?'有尾':'無尾'); 
        counts[k] = (counts[k]||0) + 1; 
    });
    area.innerText = "統計: " + Object.entries(counts).map(([k,v]) => `${k}:${v}`).join(" | ");
  }

  function renderCtrls() {
    const box = document.getElementById('ctrls'); box.innerHTML = "";
    const btn = (txt, cl, cb) => { const b = document.createElement('button'); b.className = 'btn '+cl; b.innerText = txt; b.onclick = cb; box.appendChild(b); };
    if(state.lv.endsWith("-1")) { btn("換個目標", "", () => setLv(state.lv)); }
    else if(state.lv.endsWith("-2")) { btn("執行雜交 +1", "primary", () => breed(1)); btn("清除紀錄", "", () => { state.babies=[]; updateStats(); }); }
    else {
        btn("刷新神祕題庫", "warn", () => {
            const isL2 = state.lv.startsWith("2");
            state.mother = getFullRandom(isL2);
            state.hiddenFather = getFullRandom(isL2); // 點擊此按鈕會連父親一起刷新，產生新題目
            state.babies = []; updateStats();
        });
        btn("雜交 +20", "primary", () => breed(20)); btn("回溯 20 隻", "", () => { state.babies.splice(-20); updateStats(); }); btn("提交答案", "primary", checkGuess);
    }
  }

  function checkGuess() {
    const isL2 = state.lv.startsWith("2");
    function getDist(m, f) {
        const dist = {};
        for(let i=0; i<2; i++) { for(let j=0; j<2; j++) {
                const ph = getPh([m[i], f[j]]);
                const key = isL2 ? (ph.ear?'E':'e')+(ph.tail?'T':'t') : (ph.ear?'E':'e');
                dist[key] = (dist[key]||0) + 0.25;
        } }
        return JSON.stringify(Object.keys(dist).sort().reduce((obj, key) => { obj[key] = dist[key]; return obj; }, {}));
    }
    if(getDist(state.mother, state.hiddenFather) === getDist(state.mother, state.guess)) triggerWin();
    else alert("觀察統計！此基因型組合產出的性狀比例不正確。");
  }

  function tick() {
    ctx.clearRect(0, 0, W, H); hitMap.length = 0; const midX = W/2 + state.view.x, midY = H/2 + state.view.y;
    if(state.lv.endsWith("-1")) { drawCreature(midX-140, midY-50, 1.2, state.player, "你的小獸"); drawChrom(midX-140, midY+60, state.player, 'player'); drawCreature(midX+140, midY-50, 1.2, state.target, "目標外型"); }
    else if(state.lv.endsWith("-2")) { 
        drawCreature(midX-150, midY-150, 0.8, state.mother, "母本"); drawChrom(midX-150, midY-60, state.mother, 'mother'); 
        drawCreature(midX+150, midY-150, 0.8, state.father, "父本"); drawChrom(midX+150, midY-60, state.father, 'father'); 
        if(state.babies.length > 0) { const last = state.babies[state.babies.length-1]; drawCreature(midX, midY+100, 1.2, last, "最新寶寶"); drawChrom(midX, midY+190, last); } 
    }
    else { 
        // 2-3 的母本現在可以點選染色體分別更動
        drawCreature(midX-100, midY-180, 0.7, state.mother, "母本基因"); drawChrom(midX-100, midY-100, state.mother, 'mother'); 
        ctx.fillStyle='#1b2946'; ctx.beginPath(); ctx.roundRect(midX+80, midY-210, 80, 80, 16); ctx.fill(); ctx.fillStyle='#7cf3c7'; ctx.font='bold 50px sans-serif'; ctx.textAlign='center'; ctx.fillText("?", midX+120, midY-155); ctx.fillStyle='#e9eefc'; ctx.font='bold 16px sans-serif'; ctx.fillText("神祕父親", midX+120, midY-230); 
        drawChrom(midX+120, midY-100, state.guess, 'guess'); const startX = midX - 320; 
        state.babies.forEach((b, i) => { const r = Math.floor(i/15), c = i%15; drawCreature(startX + c*45, midY + 40 + r*65, 0.35, b); }); 
    }
    requestAnimationFrame(tick);
  }
  function setupInputs() {
    let isDown = false, lp;
    canvas.onpointerdown = e => { for(let h of hitMap) { if(e.offsetX >= h.x && e.offsetX <= h.x+h.w && e.offsetY >= h.y && e.offsetY <= h.y+h.h) { h.cb(); return; } } isDown = true; lp = { x:e.clientX, y:e.clientY }; };
    window.onpointermove = e => { if(!isDown) return; state.view.x += e.clientX - lp.x; state.view.y += e.clientY - lp.y; lp = {x:e.clientX, y:e.clientY}; };
    window.onpointerup = () => isDown = false;
    canvas.onwheel = e => { const d = e.deltaY > 0 ? 0.9 : 1.1; state.view.s = Math.max(0.4, Math.min(2.5, state.view.s * d)); };
  }
  window.changeLv = (dir) => { const opts = document.getElementById('stageSelect').options; let idx = document.getElementById('stageSelect').selectedIndex + dir; if(idx >= 0 && idx < opts.length) setLv(opts[idx].value); };
  window.jumpToLv = (id) => setLv(id);
  init();
})();
</script>
</body>
</html>
