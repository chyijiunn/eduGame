<!DOCTYPE html>
<html lang="zh-Hant">
<head><script src="/eduGame/ga4.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相簿</title>
  <style>
    :root{
      --bg:#111827;
      --panel:#1f2937;
      --panel-2:#374151;
      --text:#f9fafb;
      --muted:#cbd5e1;
      --accent:#60a5fa;
      --border:rgba(255,255,255,.08);
      --shadow:0 12px 36px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:linear-gradient(180deg,#0f172a 0%, #111827 100%);
      color:var(--text);
    }
    .wrap{max-width:1400px;margin:0 auto;padding:20px}
    .topbar{
      display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
      margin-bottom:18px;padding:16px 18px;background:rgba(255,255,255,.04);border:1px solid var(--border);
      border-radius:18px;backdrop-filter: blur(10px);
    }
    h1{margin:0;font-size:clamp(24px,3vw,34px)}
    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    label{color:var(--muted)}
    select,button{
      background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;
      padding:10px 12px;font-size:15px;
    }
    button{cursor:pointer}
    button:hover, select:hover{border-color:rgba(255,255,255,.18)}
    button:disabled{opacity:.45;cursor:not-allowed}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:16px;
    }
    .card{
      background:rgba(255,255,255,.04);
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
      transition:transform .18s ease, border-color .18s ease;
    }
    .card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.16)}
    .thumb-btn{
      display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;
    }
    .thumb{
      display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#0b1220;
    }
    .caption{
      padding:10px 12px;font-size:13px;color:var(--muted);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .pager{
      margin-top:18px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
    }
    .page-info{color:var(--muted);min-width:140px;text-align:center}

    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;
      align-items:center;justify-content:center;padding:24px;z-index:9999;
    }
    .modal.show{display:flex}
    .modal-box{
      width:min(1100px,100%);max-height:100%;overflow:auto;
      background:rgba(17,24,39,.96);border:1px solid var(--border);border-radius:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);padding:18px;
    }
    .modal-head{
      display:flex;justify-content:flex-start;align-items:center;gap:12px;margin-bottom:12px;
    }
    .modal-title{font-size:16px;color:var(--muted);word-break:break-all}
    .viewer{
      display:flex;flex-direction:column;align-items:center;gap:14px;
    }
    .viewer img{
      max-width:100%;max-height:min(78vh,900px);object-fit:contain;border-radius:16px;background:#000;
      cursor:pointer;
    }
    .filename{
      width:100%;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);
      border:1px solid var(--border);text-align:center;word-break:break-all;font-size:15px;
    }
    .viewer-actions{
      width:100%;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
    }
    .viewer-actions button{
      min-width:110px;
    }
    .viewer-tip{
      color:var(--muted);font-size:13px;text-align:center;
    }
    .empty{
      padding:36px;text-align:center;color:var(--muted);background:rgba(255,255,255,.04);
      border:1px dashed var(--border);border-radius:18px;
    }
    @media (max-width:640px){
      .wrap{padding:14px}
      .topbar{padding:14px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .modal{padding:12px}
      .modal-box{padding:12px}
      .viewer-actions{gap:10px}
      .viewer-actions button{flex:1 1 calc(33.333% - 10px);min-width:90px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>相簿</h1>
      <div class="controls">
        <label for="perPage">每頁顯示</label>
        <select id="perPage">
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <div id="gallery" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">
      尚未找到照片。請先把原圖放到 <code>pics/</code>、縮圖放到 <code>thumbnail/</code>，再執行清單產生工具。
    </div>

    <div class="pager">
      <button id="prevBtn">上一頁</button>
      <div id="pageInfo" class="page-info"></div>
      <button id="nextBtn">下一頁</button>
    </div>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <div id="modalTitle" class="modal-title">檢視照片</div>
      </div>
      <div class="viewer">
        <img id="fullImage" alt="">
        <div id="fileName" class="filename"></div>
        <div class="viewer-actions">
          <button id="viewerPrevBtn" type="button">上一張</button>
          <button id="viewerNextBtn" type="button">下一張</button>
          <button id="closeBtn" type="button">關閉</button>
        </div>
        <div class="viewer-tip">點選照片本身，也會直接切到下一張。</div>
      </div>
    </div>
  </div>

  <script>
    const galleryEl = document.getElementById('gallery');
    const emptyEl = document.getElementById('empty');
    const perPageEl = document.getElementById('perPage');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('closeBtn');
    const viewerPrevBtn = document.getElementById('viewerPrevBtn');
    const viewerNextBtn = document.getElementById('viewerNextBtn');
    const fullImage = document.getElementById('fullImage');
    const fileName = document.getElementById('fileName');
    const modalTitle = document.getElementById('modalTitle');

    let photos = [];
    let currentPage = 1;
    let perPage = Number(perPageEl.value);
    let currentIndex = -1;

    async function loadPhotos() {
      try {
        const res = await fetch('gallery.json?ts=' + Date.now());
        photos = await res.json();
        if (!Array.isArray(photos)) photos = [];
      } catch (err) {
        photos = [];
      }
      render();
    }

    function render() {
      galleryEl.innerHTML = '';

      if (photos.length === 0) {
        emptyEl.style.display = 'block';
        pageInfo.textContent = '0 / 0';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      emptyEl.style.display = 'none';
      const totalPages = Math.max(1, Math.ceil(photos.length / perPage));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * perPage;
      const pagePhotos = photos.slice(start, start + perPage);

      pagePhotos.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <button class="thumb-btn" type="button">
            <img class="thumb" src="${escapeHtml(photo.thumbnail)}" alt="${escapeHtml(photo.name)}" loading="lazy">
          </button>
          <div class="caption">${escapeHtml(photo.name)}</div>
        `;
        card.querySelector('.thumb-btn').addEventListener('click', () => openViewerByName(photo.name));
        galleryEl.appendChild(card);
      });

      pageInfo.textContent = `${currentPage} / ${totalPages}`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    }

    function openViewerByName(name) {
      const index = photos.findIndex(photo => photo.name === name);
      if (index === -1) return;
      openViewer(index);
    }

    function openViewer(index) {
      currentIndex = index;
      const photo = photos[currentIndex];
      if (!photo) return;

      fullImage.src = photo.full;
      fullImage.alt = photo.name;
      fileName.textContent = photo.name;
      modalTitle.textContent = photo.name;
      viewerPrevBtn.disabled = photos.length <= 1;
      viewerNextBtn.disabled = photos.length <= 1;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function showPrevPhoto() {
      if (photos.length === 0 || currentIndex === -1) return;
      currentIndex = (currentIndex - 1 + photos.length) % photos.length;
      openViewer(currentIndex);
    }

    function showNextPhoto() {
      if (photos.length === 0 || currentIndex === -1) return;
      currentIndex = (currentIndex + 1) % photos.length;
      openViewer(currentIndex);
    }

    function closeViewer() {
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
      fullImage.src = '';
      currentIndex = -1;
      document.body.style.overflow = '';
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    perPageEl.addEventListener('change', () => {
      perPage = Number(perPageEl.value);
      currentPage = 1;
      render();
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage -= 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      const totalPages = Math.max(1, Math.ceil(photos.length / perPage));
      if (currentPage < totalPages) {
        currentPage += 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    viewerPrevBtn.addEventListener('click', showPrevPhoto);
    viewerNextBtn.addEventListener('click', showNextPhoto);
    closeBtn.addEventListener('click', closeViewer);
    fullImage.addEventListener('click', showNextPhoto);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeViewer();
    });

    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('show')) return;
      if (e.key === 'Escape') closeViewer();
      if (e.key === 'ArrowLeft') showPrevPhoto();
      if (e.key === 'ArrowRight') showNextPhoto();
    });

    loadPhotos();
  </script>
</body>
</html>
