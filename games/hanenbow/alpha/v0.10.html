<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hanenbow v0.1</title>
  <style>
    :root{
      --bg0:#04111d;
      --bg1:#0b2137;
      --bg2:#143451;
      --ink:#e8fbff;
      --sub:rgba(232,251,255,.72);
      --panel:rgba(7,20,34,.78);
      --line:#9ee4ff;
      --accent:#8cf5b6;
      --warn:#ffd06f;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(137,255,230,.12), transparent 22%),
        radial-gradient(circle at 78% 16%, rgba(103,189,255,.16), transparent 24%),
        linear-gradient(180deg, var(--bg2), var(--bg1) 44%, var(--bg0));
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:none;
    }
    #app{
      position:relative;
      width:100%;
      height:100%;
    }
    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }
    .hud{
      position:absolute;
      left:10px;
      top:calc(10px + var(--safe-top));
      z-index:10;
      display:grid;
      gap:8px;
      max-width:min(520px, calc(100vw - 20px));
    }
    .card{
      background:var(--panel);
      border:1px solid rgba(158,228,255,.18);
      border-radius:18px;
      padding:12px 14px;
      backdrop-filter:blur(10px);
      box-shadow:0 10px 36px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .title{
      margin:0;
      font-size:1rem;
      font-weight:800;
      letter-spacing:.02em;
    }
    .status{
      color:var(--sub);
      font-size:.8rem;
    }
    .mini{
      color:var(--sub);
      font-size:.78rem;
      line-height:1.45;
      margin-top:6px;
    }
    .controls{
      display:grid;
      gap:8px;
    }
    .row{
      display:grid;
      grid-template-columns:repeat(6, minmax(0,1fr));
      gap:8px;
    }
    .row.compact{
      grid-template-columns:repeat(4, minmax(0,1fr));
    }
    .field{
      display:grid;
      gap:4px;
      min-width:0;
    }
    .field label{
      color:var(--sub);
      font-size:.76rem;
      line-height:1.2;
    }
    .field output{
      color:var(--ink);
      font-size:.8rem;
      font-weight:700;
      text-align:right;
    }
    .range-wrap{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
    }
    input[type="range"], select, button{
      width:100%;
      min-height:38px;
      border-radius:12px;
      border:1px solid rgba(158,228,255,.18);
      background:rgba(14,31,50,.92);
      color:var(--ink);
      font-size:.85rem;
    }
    input[type="range"]{
      padding:0 4px;
    }
    select, button{
      padding:0 10px;
      font-weight:700;
    }
    button{
      cursor:pointer;
      touch-action:manipulation;
      transition:transform .12s ease, border-color .12s ease, background .12s ease;
    }
    button:active{transform:scale(.985)}
    .primary{background:linear-gradient(180deg, rgba(20,64,94,.96), rgba(10,30,49,.96));}
    .accent{background:linear-gradient(180deg, rgba(35,88,70,.96), rgba(18,48,38,.96)); border-color:rgba(140,245,182,.28)}
    .warn{background:linear-gradient(180deg, rgba(96,65,28,.96), rgba(55,35,15,.96)); border-color:rgba(255,208,111,.28)}
    .legend{
      display:flex;
      flex-wrap:wrap;
      gap:8px 10px;
      margin-top:8px;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:5px 9px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      font-size:.75rem;
      color:var(--ink);
      white-space:nowrap;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;flex:0 0 auto;
    }
    .footer-tip{
      position:absolute;
      left:10px;
      right:10px;
      bottom:calc(10px + var(--safe-bottom));
      z-index:10;
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .footer-tip .card{
      padding:10px 12px;
      font-size:.78rem;
      color:var(--sub);
      max-width:min(880px, 100%);
      text-align:center;
    }
    @media (max-width: 860px){
      .hud{max-width:calc(100vw - 20px)}
      .row{grid-template-columns:repeat(2, minmax(0,1fr));}
      .row.compact{grid-template-columns:repeat(2, minmax(0,1fr));}
      .title{font-size:.95rem}
      .status{font-size:.76rem}
    }
  </style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="card">
      <div class="title-row">
        <h1 class="title">Hanenbow v0.1</h1>
        <div class="status" id="statusText">待命</div>
      </div>
      <div class="mini">獨立版本。所有粒子都從同一個發射器、同一個角度射出；受重力往下掉落；撞到線段就反彈並發出和弦。拖曳線段中心可移動，拖曳端點可改角度與長度，點一下線段可切換和弦。</div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card controls">
      <div class="row compact">
        <button class="primary" id="audioBtn">啟動音訊</button>
        <button class="accent" id="fireBtn">發射一顆</button>
        <button class="primary" id="autoBtn">連續發射：關</button>
        <button class="warn" id="resetBtn">重置</button>
      </div>

      <div class="row">
        <div class="field">
          <label for="angleRange">發射角度（0 = 垂直向下）</label>
          <div class="range-wrap"><input id="angleRange" type="range" min="-75" max="75" step="1" value="26"><output id="angleOut">26°</output></div>
        </div>
        <div class="field">
          <label for="speedRange">初速度</label>
          <div class="range-wrap"><input id="speedRange" type="range" min="220" max="980" step="10" value="520"><output id="speedOut">520</output></div>
        </div>
        <div class="field">
          <label for="gravityRange">重力</label>
          <div class="range-wrap"><input id="gravityRange" type="range" min="260" max="1600" step="20" value="860"><output id="gravityOut">860</output></div>
        </div>
        <div class="field">
          <label for="intervalRange">連發間隔（ms）</label>
          <div class="range-wrap"><input id="intervalRange" type="range" min="150" max="1200" step="10" value="420"><output id="intervalOut">420</output></div>
        </div>
        <div class="field">
          <label for="sizeRange">粒子大小</label>
          <div class="range-wrap"><input id="sizeRange" type="range" min="7" max="18" step="1" value="11"><output id="sizeOut">11</output></div>
        </div>
        <div class="field">
          <label for="timbreSelect">音色</label>
          <select id="timbreSelect">
            <option value="piano" selected>鋼琴 Piano</option>
            <option value="glass">玻璃 Glass</option>
            <option value="marimba">木琴 Marimba</option>
            <option value="pad">柔和 Pad</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-tip">
    <div class="card" id="tipText">先按「啟動音訊」，再按「發射一顆」即可測試。若要快速聽到和弦，先把角度調到 20°～35°。</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const statusText = document.getElementById('statusText');
  const tipText = document.getElementById('tipText');
  const audioBtn = document.getElementById('audioBtn');
  const fireBtn = document.getElementById('fireBtn');
  const autoBtn = document.getElementById('autoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const legend = document.getElementById('legend');
  const angleRange = document.getElementById('angleRange');
  const speedRange = document.getElementById('speedRange');
  const gravityRange = document.getElementById('gravityRange');
  const intervalRange = document.getElementById('intervalRange');
  const sizeRange = document.getElementById('sizeRange');
  const timbreSelect = document.getElementById('timbreSelect');
  const angleOut = document.getElementById('angleOut');
  const speedOut = document.getElementById('speedOut');
  const gravityOut = document.getElementById('gravityOut');
  const intervalOut = document.getElementById('intervalOut');
  const sizeOut = document.getElementById('sizeOut');

  const state = {
    w: innerWidth,
    h: innerHeight,
    balls: [],
    splashes: [],
    emitter: { x: innerWidth * 0.5, y: 72 },
    angleDeg: 26,
    speed: 520,
    gravity: 860,
    emitInterval: 420,
    ballRadius: 11,
    autoFire: false,
    autoTimer: 0,
    timbre: 'piano',
    drag: null,
    lastNow: performance.now(),
    launched: 0,
    hits: 0,
    audioReady: false,
  };

  const chordLibrary = [
    { name:'Cmaj7', color:'#8cf5b6', mids:[60,64,67,71] },
    { name:'Am7', color:'#ffd06f', mids:[57,60,64,67] },
    { name:'Fmaj9', color:'#96dbff', mids:[53,57,60,64] },
    { name:'G7sus4', color:'#ff9b8f', mids:[55,60,62,65] },
    { name:'Dm7', color:'#c7b5ff', mids:[50,53,57,60] },
    { name:'Em7', color:'#b7ffdc', mids:[52,55,59,62] },
    { name:'Bbmaj7', color:'#ffc7ec', mids:[58,62,65,69] },
    { name:'Csus2', color:'#a6ffd3', mids:[60,62,67,72] },
  ];

  function makeSegments(){
    const w = state.w, h = state.h;
    return [
      { id:1, x:w*0.28, y:h*0.26, len:150, angle:-0.32, chord:0 },
      { id:2, x:w*0.62, y:h*0.24, len:170, angle:0.26, chord:1 },
      { id:3, x:w*0.44, y:h*0.43, len:185, angle:-0.48, chord:2 },
      { id:4, x:w*0.77, y:h*0.47, len:155, angle:0.44, chord:3 },
      { id:5, x:w*0.24, y:h*0.61, len:175, angle:0.34, chord:4 },
      { id:6, x:w*0.57, y:h*0.68, len:190, angle:-0.28, chord:5 },
      { id:7, x:w*0.82, y:h*0.72, len:145, angle:0.52, chord:6 },
    ];
  }
  let segments = makeSegments();

  let audio = null;
  const TIMBRES = {
    piano:{partials:[[1,'triangle',1],[2,'sine',0.42],[3,'sine',0.16],[4,'sine',0.08],[5,'sine',0.04]], attack:.0016, decay:1.55, sustain:.05, release:.72, filterType:'lowpass', filterFreq:3600, q:.9, hammerNoise:{amount:.10,freq:2600,q:1.8,decay:.010}, body:{amount:.23,freq:180,q:1.05,decay:.54}, wet:.22},
    glass:{partials:[[1,'sine',1],[2.98,'sine',0.22],[5.96,'triangle',0.08]], attack:.004, decay:1.22, sustain:.07, release:.54, filterType:'highpass', filterFreq:980, q:.82, hammerNoise:{amount:.02,freq:4200,q:2.0,decay:.008}, body:{amount:.10,freq:920,q:1.2,decay:.42}, wet:.28},
    marimba:{partials:[[1,'triangle',1],[3,'sine',0.16],[5,'sine',0.05]], attack:.002, decay:.48, sustain:.04, release:.22, filterType:'bandpass', filterFreq:820, q:1.55, hammerNoise:{amount:.10,freq:1900,q:1.9,decay:.012}, body:{amount:.15,freq:520,q:1.4,decay:.24}, wet:.12},
    pad:{partials:[[1,'sine',1],[2,'triangle',0.2],[3,'sine',0.08]], attack:.020, decay:1.55, sustain:.36, release:.68, filterType:'lowpass', filterFreq:1400, q:.42, hammerNoise:{amount:0}, body:{amount:.08,freq:300,q:.9,decay:.58}, wet:.30},
  };

  function updateOutputs(){
    angleOut.textContent = `${state.angleDeg}°`;
    speedOut.textContent = `${state.speed}`;
    gravityOut.textContent = `${state.gravity}`;
    intervalOut.textContent = `${state.emitInterval}`;
    sizeOut.textContent = `${state.ballRadius}`;
    autoBtn.textContent = `連續發射：${state.autoFire ? '開' : '關'}`;
    statusText.textContent = `球 ${state.balls.length}｜撞擊 ${state.hits}｜${state.audioReady ? '音訊已啟動' : '音訊未啟動'}`;
  }

  function renderLegend(){
    legend.innerHTML = '';
    segments.forEach(seg => {
      const chord = chordLibrary[seg.chord % chordLibrary.length];
      const el = document.createElement('div');
      el.className = 'tag';
      el.innerHTML = `<span class="dot" style="background:${chord.color}"></span>${seg.id}：${chord.name}`;
      legend.appendChild(el);
    });
  }

  function resize(){
    state.w = innerWidth;
    state.h = innerHeight;
    canvas.width = Math.floor(state.w * dpr);
    canvas.height = Math.floor(state.h * dpr);
    canvas.style.width = `${state.w}px`;
    canvas.style.height = `${state.h}px`;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    state.emitter.x = state.w * 0.5;
    state.emitter.y = 72;
  }

  function ensureAudio(){
    if(audio) return audio;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return null;
    const a = new AudioCtx();
    const master = a.createGain();
    master.gain.value = 0.82;
    const comp = a.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 14;
    comp.ratio.value = 2.1;
    comp.attack.value = .004;
    comp.release.value = .18;
    const filter = a.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 4200;
    filter.Q.value = .2;
    const delay = a.createDelay(.7);
    delay.delayTime.value = .23;
    const feedback = a.createGain();
    feedback.gain.value = .18;
    const wet = a.createGain();
    wet.gain.value = .18;
    filter.connect(comp); comp.connect(master); master.connect(a.destination);
    wet.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(filter);
    audio = { ctx:a, master, comp, filter, wet };
    return audio;
  }

  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function makeNoiseBuffer(a){
    const len = Math.floor(a.sampleRate * .28);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  let noiseCache = null;
  function getNoiseBuffer(a){
    if(!noiseCache || noiseCache.sampleRate !== a.sampleRate) noiseCache = makeNoiseBuffer(a);
    return noiseCache;
  }

  function playNoiseBurst(start, amount, freq, q, decay){
    const a = ensureAudio(); if(!a) return;
    const src = a.ctx.createBufferSource();
    src.buffer = getNoiseBuffer(a.ctx);
    const bp = a.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = a.ctx.createGain();
    g.gain.setValueAtTime(.0001, start);
    g.gain.linearRampToValueAtTime(amount, start + .001);
    g.gain.exponentialRampToValueAtTime(.0001, start + decay);
    const w = a.ctx.createGain(); w.gain.value = .08;
    src.connect(bp); bp.connect(g); g.connect(a.filter); g.connect(w); w.connect(a.wet);
    src.start(start); src.stop(start + decay + .02);
  }

  function playChord(seg, impact=1){
    const a = ensureAudio();
    if(!a) return;
    if(a.ctx.state === 'suspended') a.ctx.resume();
    const timbre = TIMBRES[state.timbre] || TIMBRES.piano;
    const chord = chordLibrary[seg.chord % chordLibrary.length];
    const now = a.ctx.currentTime;
    const startSpread = 0.012;
    chord.mids.forEach((mid, idx) => {
      const freq = midiToFreq(mid);
      const start = now + idx * startSpread;
      const env = a.ctx.createGain();
      const filter = a.ctx.createBiquadFilter();
      const wetSend = a.ctx.createGain();
      filter.type = timbre.filterType;
      filter.frequency.value = timbre.filterFreq * (0.95 + impact * .15);
      filter.Q.value = timbre.q;
      wetSend.gain.value = timbre.wet;
      env.gain.setValueAtTime(.0001, start);
      const peak = (.15 - idx * .018) * Math.max(.4, impact);
      env.gain.linearRampToValueAtTime(peak, start + timbre.attack);
      env.gain.exponentialRampToValueAtTime(Math.max(.0001, peak * timbre.sustain), start + timbre.decay * .55);
      env.gain.exponentialRampToValueAtTime(.0001, start + timbre.decay + timbre.release);
      env.connect(filter); filter.connect(a.filter); filter.connect(wetSend); wetSend.connect(a.wet);

      timbre.partials.forEach(([mul, wave, gainMul]) => {
        const osc = a.ctx.createOscillator();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq * mul, start);
        osc.detune.value = (idx - 1.5) * 3.5;
        const g = a.ctx.createGain();
        g.gain.value = gainMul;
        osc.connect(g); g.connect(env);
        osc.start(start);
        osc.stop(start + timbre.decay + timbre.release + .1);
      });

      if(timbre.body && timbre.body.amount > 0 && idx === 0){
        const body = a.ctx.createBiquadFilter();
        body.type = 'bandpass'; body.frequency.value = timbre.body.freq; body.Q.value = timbre.body.q;
        const bg = a.ctx.createGain();
        bg.gain.setValueAtTime(timbre.body.amount * peak, start + .01);
        bg.gain.exponentialRampToValueAtTime(.0001, start + timbre.body.decay + .08);
        filter.connect(body); body.connect(bg); bg.connect(a.filter);
      }
    });
    if((timbre.hammerNoise?.amount || 0) > 0){
      playNoiseBurst(now, timbre.hammerNoise.amount * Math.max(.55, impact), timbre.hammerNoise.freq, timbre.hammerNoise.q, timbre.hammerNoise.decay);
    }
    state.audioReady = true;
    updateOutputs();
  }

  function createBall(){
    const ang = state.angleDeg * Math.PI / 180;
    const vx = Math.sin(ang) * state.speed;
    const vy = Math.cos(ang) * state.speed;
    const hue = 160 + (state.launched * 27) % 120;
    state.balls.push({
      x: state.emitter.x,
      y: state.emitter.y,
      vx, vy,
      r: state.ballRadius,
      hue,
      life: 0,
      lastHitSeg: -1,
      lastHitAt: -999,
    });
    state.launched += 1;
    updateOutputs();
  }

  function resetAll(){
    state.balls = [];
    state.splashes = [];
    state.launched = 0;
    state.hits = 0;
    segments = makeSegments();
    renderLegend();
    updateOutputs();
    tipText.textContent = '已重置。先按「啟動音訊」，再按「發射一顆」即可測試。';
  }

  function segEnds(seg){
    const dx = Math.cos(seg.angle) * seg.len * .5;
    const dy = Math.sin(seg.angle) * seg.len * .5;
    return { x1: seg.x - dx, y1: seg.y - dy, x2: seg.x + dx, y2: seg.y + dy };
  }

  function closestPointOnSeg(px, py, seg){
    const {x1,y1,x2,y2} = segEnds(seg);
    const vx = x2 - x1, vy = y2 - y1;
    const len2 = vx*vx + vy*vy || 1;
    let t = ((px - x1)*vx + (py - y1)*vy) / len2;
    t = Math.max(0, Math.min(1, t));
    return { x: x1 + vx*t, y: y1 + vy*t, t, vx, vy };
  }

  function addSplash(x, y, color){
    state.splashes.push({ x, y, r: 0, alpha: .8, color });
  }

  function stepBall(ball, dt, nowSec){
    ball.life += dt;
    ball.vy += state.gravity * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if(ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx) * .92; }
    if(ball.x > state.w - ball.r){ ball.x = state.w - ball.r; ball.vx = -Math.abs(ball.vx) * .92; }
    if(ball.y < ball.r){ ball.y = ball.r; ball.vy = Math.abs(ball.vy) * .92; }

    const thickness = 7;
    for(const seg of segments){
      const cp = closestPointOnSeg(ball.x, ball.y, seg);
      const dx = ball.x - cp.x;
      const dy = ball.y - cp.y;
      const dist = Math.hypot(dx, dy);
      const target = ball.r + thickness;
      if(dist > target) continue;

      const len = Math.hypot(cp.vx, cp.vy) || 1;
      const tx = cp.vx / len, ty = cp.vy / len;
      let nx = -ty, ny = tx;
      if(dx * nx + dy * ny < 0){ nx *= -1; ny *= -1; }

      const rel = ball.vx * nx + ball.vy * ny;
      if(rel >= 0) continue;

      const penetration = target - dist;
      ball.x += nx * penetration;
      ball.y += ny * penetration;

      const restitution = 0.88;
      ball.vx = ball.vx - (1 + restitution) * rel * nx + tx * 18;
      ball.vy = ball.vy - (1 + restitution) * rel * ny + ty * 18;
      ball.vx *= .995;
      ball.vy *= .995;

      const hitCooldown = 0.065;
      if(ball.lastHitSeg !== seg.id || nowSec - ball.lastHitAt > hitCooldown){
        ball.lastHitSeg = seg.id;
        ball.lastHitAt = nowSec;
        state.hits += 1;
        const chord = chordLibrary[seg.chord % chordLibrary.length];
        addSplash(cp.x, cp.y, chord.color);
        playChord(seg, Math.min(1.15, Math.max(.42, Math.abs(rel) / 520)));
        tipText.textContent = `撞到 ${seg.id} 號線段：${chord.name}`;
        updateOutputs();
      }
    }
  }

  function update(dt, now){
    const nowSec = now / 1000;
    if(state.autoFire){
      state.autoTimer += dt * 1000;
      while(state.autoTimer >= state.emitInterval){
        state.autoTimer -= state.emitInterval;
        createBall();
      }
    }

    const sub = 2;
    const sdt = dt / sub;
    for(let i=0;i<sub;i++){
      for(const ball of state.balls) stepBall(ball, sdt, nowSec);
    }

    state.balls = state.balls.filter(ball => ball.y < state.h + 160 && ball.life < 18);
    state.splashes.forEach(s => { s.r += 120 * dt; s.alpha -= 1.7 * dt; });
    state.splashes = state.splashes.filter(s => s.alpha > 0);
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,state.h);
    g.addColorStop(0,'rgba(24,52,81,1)');
    g.addColorStop(.45,'rgba(10,27,44,1)');
    g.addColorStop(1,'rgba(4,17,29,1)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,state.w,state.h);

    for(let i=0;i<26;i++){
      const x = (i * 137) % state.w;
      const y = (i * 91) % state.h;
      const rad = 22 + (i * 7 % 40);
      const rg = ctx.createRadialGradient(x,y,2,x,y,rad);
      rg.addColorStop(0,'rgba(150,240,255,.12)');
      rg.addColorStop(1,'rgba(150,240,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(x,y,rad,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawEmitter(){
    const x = state.emitter.x, y = state.emitter.y;
    const ang = state.angleDeg * Math.PI / 180;
    const dx = Math.sin(ang), dy = Math.cos(ang);
    ctx.save();
    ctx.beginPath();
    ctx.fillStyle = 'rgba(236,252,255,.95)';
    ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.moveTo(x,y);
    ctx.lineTo(x + dx * 58, y + dy * 58);
    ctx.stroke();
    ctx.beginPath();
    ctx.fillStyle = 'rgba(140,245,182,.95)';
    ctx.arc(x + dx * 58, y + dy * 58, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawSegments(){
    for(const seg of segments){
      const chord = chordLibrary[seg.chord % chordLibrary.length];
      const {x1,y1,x2,y2} = segEnds(seg);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineWidth = 12;
      ctx.strokeStyle = 'rgba(12,58,44,.72)';
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const lg = ctx.createLinearGradient(x1,y1,x2,y2);
      lg.addColorStop(0, chord.color + 'CC');
      lg.addColorStop(1, 'rgba(255,255,255,.75)');
      ctx.lineWidth = 8;
      ctx.strokeStyle = lg;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.fillStyle = chord.color;
      ctx.beginPath(); ctx.arc(x1,y1,7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x2,y2,7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.fillStyle = 'rgba(4,17,29,.9)'; ctx.arc(seg.x,seg.y,15,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.arc(seg.x,seg.y,15,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(232,251,255,.96)';
      ctx.font = '700 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(seg.id), seg.x, seg.y + .5);
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(232,251,255,.88)';
      ctx.fillText(chord.name, seg.x, seg.y - 24);
      ctx.restore();
    }
  }

  function drawBalls(){
    for(const ball of state.balls){
      const rg = ctx.createRadialGradient(ball.x - ball.r*.2, ball.y - ball.r*.24, 1, ball.x, ball.y, ball.r*2.2);
      rg.addColorStop(0, `hsla(${ball.hue}, 100%, 88%, .98)`);
      rg.addColorStop(.35, `hsla(${ball.hue}, 100%, 70%, .92)`);
      rg.addColorStop(1, `hsla(${ball.hue}, 100%, 50%, 0)`);
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r*2.1, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = `hsla(${ball.hue}, 100%, 66%, .97)`;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.88)';
      ctx.beginPath(); ctx.arc(ball.x - ball.r*.28, ball.y - ball.r*.28, ball.r*.22, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawSplashes(){
    state.splashes.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });
  }

  function draw(){
    drawBackground();
    drawEmitter();
    drawSegments();
    drawSplashes();
    drawBalls();
  }

  function loop(now){
    const dt = Math.min(.032, (now - state.lastNow) / 1000 || .016);
    state.lastNow = now;
    update(dt, now);
    draw();
    requestAnimationFrame(loop);
  }

  function dist(a,b,c,d){ return Math.hypot(a-c, b-d); }

  function pickSegmentHandle(x,y){
    for(let i=segments.length-1;i>=0;i--){
      const seg = segments[i];
      const {x1,y1,x2,y2} = segEnds(seg);
      if(dist(x,y,x1,y1) <= 20) return { seg, mode:'end1' };
      if(dist(x,y,x2,y2) <= 20) return { seg, mode:'end2' };
      if(dist(x,y,seg.x,seg.y) <= 22) return { seg, mode:'move' };
      const cp = closestPointOnSeg(x,y,seg);
      if(dist(x,y,cp.x,cp.y) <= 14) return { seg, mode:'body' };
    }
    return null;
  }

  function pointerPos(e){ return { x:e.clientX, y:e.clientY }; }

  canvas.addEventListener('pointerdown', (e) => {
    const p = pointerPos(e);
    const hit = pickSegmentHandle(p.x, p.y);
    if(hit){
      canvas.setPointerCapture(e.pointerId);
      state.drag = {
        pointerId:e.pointerId,
        seg:hit.seg,
        mode:hit.mode,
        startX:p.x,
        startY:p.y,
        origX:hit.seg.x,
        origY:hit.seg.y,
        origAngle:hit.seg.angle,
        origLen:hit.seg.len,
        moved:false,
      };
      return;
    }
    ensureAudio();
    if(audio?.ctx?.state === 'suspended') audio.ctx.resume();
  });

  canvas.addEventListener('pointermove', (e) => {
    if(!state.drag || state.drag.pointerId !== e.pointerId) return;
    const p = pointerPos(e);
    const drag = state.drag;
    const seg = drag.seg;
    const dx = p.x - drag.startX;
    const dy = p.y - drag.startY;
    if(Math.hypot(dx,dy) > 4) drag.moved = true;

    if(drag.mode === 'move' || drag.mode === 'body'){
      seg.x = drag.origX + dx;
      seg.y = drag.origY + dy;
    } else {
      const anchorAngle = drag.mode === 'end1' ? Math.atan2((seg.y + Math.sin(drag.origAngle)*drag.origLen*.5) - p.y, (seg.x + Math.cos(drag.origAngle)*drag.origLen*.5) - p.x)
                                               : Math.atan2(p.y - (seg.y - Math.sin(drag.origAngle)*drag.origLen*.5), p.x - (seg.x - Math.cos(drag.origAngle)*drag.origLen*.5));
      const anchorX = drag.mode === 'end1' ? drag.origX + Math.cos(drag.origAngle) * drag.origLen * .5 : drag.origX - Math.cos(drag.origAngle) * drag.origLen * .5;
      const anchorY = drag.mode === 'end1' ? drag.origY + Math.sin(drag.origAngle) * drag.origLen * .5 : drag.origY - Math.sin(drag.origAngle) * drag.origLen * .5;
      const len = Math.max(90, Math.min(260, dist(p.x,p.y,anchorX,anchorY)));
      seg.len = len;
      seg.angle = anchorAngle;
      seg.x = (anchorX + p.x) * .5;
      seg.y = (anchorY + p.y) * .5;
    }
  });

  function endDrag(e){
    if(!state.drag || state.drag.pointerId !== e.pointerId) return;
    const drag = state.drag;
    if(!drag.moved){
      drag.seg.chord = (drag.seg.chord + 1) % chordLibrary.length;
      renderLegend();
      tipText.textContent = `${drag.seg.id} 號線段切換為 ${chordLibrary[drag.seg.chord].name}`;
    }
    state.drag = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  audioBtn.addEventListener('click', async () => {
    const a = ensureAudio();
    if(!a){ tipText.textContent = '這個瀏覽器不支援 Web Audio。'; return; }
    try {
      await a.ctx.resume();
      state.audioReady = true;
      updateOutputs();
      playChord({ chord:0 }, .65);
      tipText.textContent = '音訊已啟動，現在撞到線段就會發出和弦。';
    } catch(err) {
      tipText.textContent = '音訊啟動失敗，請再按一次。';
    }
  });

  fireBtn.addEventListener('click', () => {
    const a = ensureAudio();
    if(a && a.ctx.state === 'suspended') a.ctx.resume();
    createBall();
    tipText.textContent = '已發射 1 顆。';
  });

  autoBtn.addEventListener('click', () => {
    const a = ensureAudio();
    if(a && a.ctx.state === 'suspended') a.ctx.resume();
    state.autoFire = !state.autoFire;
    state.autoTimer = 0;
    updateOutputs();
  });

  resetBtn.addEventListener('click', resetAll);

  angleRange.addEventListener('input', () => { state.angleDeg = Number(angleRange.value); updateOutputs(); });
  speedRange.addEventListener('input', () => { state.speed = Number(speedRange.value); updateOutputs(); });
  gravityRange.addEventListener('input', () => { state.gravity = Number(gravityRange.value); updateOutputs(); });
  intervalRange.addEventListener('input', () => { state.emitInterval = Number(intervalRange.value); updateOutputs(); });
  sizeRange.addEventListener('input', () => { state.ballRadius = Number(sizeRange.value); updateOutputs(); });
  timbreSelect.addEventListener('change', () => { state.timbre = timbreSelect.value; tipText.textContent = `音色切換為 ${timbreSelect.options[timbreSelect.selectedIndex].textContent}`; });

  window.addEventListener('resize', () => {
    const oldW = state.w, oldH = state.h;
    resize();
    const sx = state.w / Math.max(1, oldW);
    const sy = state.h / Math.max(1, oldH);
    segments.forEach(seg => { seg.x *= sx; seg.y *= sy; });
    state.balls.forEach(ball => { ball.x *= sx; ball.y *= sy; });
  });

  resize();
  renderLegend();
  updateOutputs();
  requestAnimationFrame((t) => { state.lastNow = t; loop(t); });
})();
</script>
</body>
</html>
