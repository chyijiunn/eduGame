<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>v0.12</title>
  <style>
    :root{
      --bg0:#030c16;
      --bg1:#0a1c2d;
      --bg2:#14354f;
      --ink:#e8fbff;
      --sub:rgba(232,251,255,.72);
      --panel:rgba(8,20,34,.92);
      --line:#98e5ff;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(145,255,228,.12), transparent 22%),
        radial-gradient(circle at 78% 14%, rgba(105,183,255,.16), transparent 24%),
        linear-gradient(180deg, var(--bg2), var(--bg1) 44%, var(--bg0));
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:none;
    }
    #app{position:relative;width:100%;height:100%}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .topbar{
      position:absolute;
      top:calc(10px + var(--safe-top));
      right:10px;
      z-index:20;
      display:flex;
      gap:8px;
    }
    .floating-stack{
      position:absolute;
      right:10px;
      bottom:calc(12px + var(--safe-bottom));
      z-index:20;
      display:grid;
      gap:8px;
    }
    .icon-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:14px;
      background:rgba(8,20,34,.74);
      color:var(--ink);
      font-size:1.35rem;
      font-weight:800;
      line-height:1;
      cursor:pointer;
      backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .icon-btn:active{transform:scale(.98)}
    .icon-btn.active{
      background:rgba(83,29,34,.84);
      box-shadow:0 10px 30px rgba(0,0,0,.24), inset 0 0 0 1px rgba(255,180,180,.20);
    }
    .modal{
      position:absolute;
      inset:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      background:rgba(2,8,14,.48);
      backdrop-filter:blur(8px);
    }
    .modal[hidden]{display:none}
    .sheet{
      width:min(100%, 520px);
      max-height:min(88vh, 780px);
      overflow:auto;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(12,27,45,.96), rgba(8,20,34,.96));
      border:1px solid rgba(152,229,255,.14);
      box-shadow:0 16px 44px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
      padding:16px;
    }
    .sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }
    .sheet-title{margin:0;font-size:1rem;font-weight:800;letter-spacing:.02em}
    .close-btn{
      width:34px;height:34px;border:none;border-radius:999px;
      background:rgba(255,255,255,.06);color:var(--ink);font-size:1.1rem;cursor:pointer;
    }
    .grid{display:grid;gap:12px}
    .field{display:grid;gap:6px}
    .field label{font-size:.82rem;color:var(--sub)}
    .range-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
    .value{min-width:62px;text-align:right;font-weight:700;font-size:.85rem}
    input[type="range"], select, button.ctrl{
      width:100%;min-height:42px;border-radius:14px;border:1px solid rgba(152,229,255,.15);
      background:rgba(11,25,42,.94);color:var(--ink);font-size:.92rem;
    }
    input[type="range"]{padding:0 6px}
    select, button.ctrl{padding:0 12px;font-weight:700}
    .action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .hint{font-size:.78rem;color:var(--sub);line-height:1.55}
    .tutorial-copy{display:grid;gap:10px;font-size:.92rem;line-height:1.65}
    .tutorial-copy p{margin:0}
    .tutorial-actions{display:flex;justify-content:flex-end;margin-top:14px}
    .section-title{
      margin:4px 0 0;
      padding-top:8px;
      border-top:1px solid rgba(255,255,255,.06);
      font-size:.8rem;
      color:var(--sub);
      letter-spacing:.06em;
    }
    .chord-list{display:grid;gap:10px}
    .chord-row{
      display:grid;
      gap:8px;
      padding:10px;
      border-radius:16px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.05);
    }
    .chord-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      font-size:.86rem;
      font-weight:700;
    }
    .mini-toggle{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:.78rem;
      color:var(--sub);
    }
    .mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    @media (max-width:560px){
      .sheet{padding:14px}
      .action-row{grid-template-columns:1fr}
      .mini-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div class="topbar">
    <button class="icon-btn" id="moreBtn" aria-label="更多">⋯</button>
  </div>

  <div class="floating-stack">
    <button class="icon-btn" id="addBtn" aria-label="增加和弦線">+</button>
    <button class="icon-btn" id="removeBtn" aria-label="刪除和弦線">−</button>
  </div>

  <div class="modal" id="tutorialModal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2 class="sheet-title">操作方式</h2>
        <button class="close-btn" id="tutorialCloseX" aria-label="關閉">×</button>
      </div>
      <div class="tutorial-copy">
        <p>點一下發射器會發射一顆粒子。</p>
        <p>拖曳發射器本體可移動位置；拖曳前方虛線端點可改方向與速度，拉越長射得越快。</p>
        <p>拖曳線中央可移動和弦線；拖曳兩端可改角度與長度；點一下線可切換和弦。</p>
        <p>右下角 <strong>+</strong> 可新增線，<strong>−</strong> 可進入刪除模式後點選線刪除。</p>
        <p>更多設定可調整重力、連發間隔、粒子大小、音色，以及每條線的調性與開關。設定會自動記住，除非你手動清除資料。</p>
      </div>
      <div class="tutorial-actions">
        <button class="ctrl" id="tutorialCloseBtn">關閉</button>
      </div>
    </div>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2 class="sheet-title">更多</h2>
        <button class="close-btn" id="closeBtn" aria-label="關閉">×</button>
      </div>
      <div class="grid">
        <div class="field">
          <label for="gravityRange">重力</label>
          <div class="range-row">
            <input id="gravityRange" type="range" min="160" max="1800" step="20" value="900">
            <div class="value" id="gravityOut">900</div>
          </div>
        </div>
        <div class="field">
          <label for="intervalRange">連發間隔（ms）</label>
          <div class="range-row">
            <input id="intervalRange" type="range" min="80" max="1400" step="10" value="340">
            <div class="value" id="intervalOut">340</div>
          </div>
        </div>
        <div class="field">
          <label for="sizeRange">粒子大小</label>
          <div class="range-row">
            <input id="sizeRange" type="range" min="6" max="24" step="1" value="11">
            <div class="value" id="sizeOut">11</div>
          </div>
        </div>
        <div class="field">
          <label for="timbreSelect">音色</label>
          <select id="timbreSelect">
            <option value="piano" selected>鋼琴 Piano</option>
            <option value="glass">玻璃 Glass</option>
            <option value="glock">鐵琴 Glockenspiel</option>
            <option value="organ">風琴 Organ</option>
            <option value="pad">Pad</option>
            <option value="marimba">木琴 Marimba</option>
            <option value="bamboo">竹音 Bamboo</option>
            <option value="choir">人聲 Choir</option>
          </select>
        </div>
        <div class="field">
          <label for="autoToggle">連發</label>
          <select id="autoToggle">
            <option value="off" selected>關</option>
            <option value="on">開</option>
          </select>
        </div>

        <div class="section-title">和弦線設定</div>
        <div class="chord-list" id="chordList"></div>

        <div class="action-row">
          <button class="ctrl" id="clearParticlesBtn">清空粒子</button>
          <button class="ctrl" id="resetSceneBtn">重置場景</button>
          <button class="ctrl" id="clearDataBtn">清除資料</button>
        </div>
        <div class="hint">發射速度不在這裡設定，改為直接拖曳發射器前方虛線長度決定。</div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  /*
    v0.12 可調參數說明
    ------------------------------------------------------------
    STORAGE_KEY            : 瀏覽器暫存 key，會記住是否看過教學、設定值、發射器位置、和弦線資料
    DEFAULT_GRAVITY        : 預設重力
    DEFAULT_INTERVAL_MS    : 預設連發間隔
    DEFAULT_PARTICLE_SIZE  : 預設粒子半徑
    EMITTER_RADIUS         : 發射器本體半徑
    HANDLE_DIST_MIN/MAX    : 瞄準虛線可拉出的最短/最長距離
    LAUNCH_SPEED_MIN/MAX   : 將瞄準虛線長度映射成發射速度後的最小/最大值
    DEFAULT_LINE_COUNT     : 初始和弦線數量
    LINE_LENGTH_MIN/MAX    : 和弦線可調最短/最長長度
    COLLISION_PADDING      : 粒子與線段判定碰撞的額外距離
    HIT_COOLDOWN_MS        : 同一粒子連續撞到線段時，兩次發聲最短間隔
    PARTICLE_LIFE_SEC      : 粒子存活秒數上限
    AUTO_FIRE_DEFAULT      : 連發預設開關
    ------------------------------------------------------------
    使用者若想直接改預設值，可優先修改上面這一組常數。
  */
  const STORAGE_KEY = 'hanenbow_v012_state';
  const DEFAULT_GRAVITY = 900;
  const DEFAULT_INTERVAL_MS = 340;
  const DEFAULT_PARTICLE_SIZE = 11;
  const EMITTER_RADIUS = 18;
  const HANDLE_DIST_MIN = 60;
  const HANDLE_DIST_MAX = 220;
  const LAUNCH_SPEED_MIN = 200;
  const LAUNCH_SPEED_MAX = 1280;
  const DEFAULT_LINE_COUNT = 5;
  const LINE_LENGTH_MIN = 86;
  const LINE_LENGTH_MAX = 260;
  const COLLISION_PADDING = 3.2;
  const HIT_COOLDOWN_MS = 70;
  const PARTICLE_LIFE_SEC = 14;
  const AUTO_FIRE_DEFAULT = false;

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const moreBtn = document.getElementById('moreBtn');
  const addBtn = document.getElementById('addBtn');
  const removeBtn = document.getElementById('removeBtn');

  const tutorialModal = document.getElementById('tutorialModal');
  const tutorialCloseBtn = document.getElementById('tutorialCloseBtn');
  const tutorialCloseX = document.getElementById('tutorialCloseX');

  const settingsModal = document.getElementById('settingsModal');
  const closeBtn = document.getElementById('closeBtn');
  const gravityRange = document.getElementById('gravityRange');
  const intervalRange = document.getElementById('intervalRange');
  const sizeRange = document.getElementById('sizeRange');
  const timbreSelect = document.getElementById('timbreSelect');
  const autoToggle = document.getElementById('autoToggle');
  const gravityOut = document.getElementById('gravityOut');
  const intervalOut = document.getElementById('intervalOut');
  const sizeOut = document.getElementById('sizeOut');
  const chordList = document.getElementById('chordList');
  const clearParticlesBtn = document.getElementById('clearParticlesBtn');
  const resetSceneBtn = document.getElementById('resetSceneBtn');
  const clearDataBtn = document.getElementById('clearDataBtn');

  const state = {
    gravity: DEFAULT_GRAVITY,
    intervalMs: DEFAULT_INTERVAL_MS,
    particleSize: DEFAULT_PARTICLE_SIZE,
    timbre: 'piano',
    autoFire: AUTO_FIRE_DEFAULT,
    width: 1,
    height: 1,
    lastTs: performance.now(),
    spawnAcc: 0,
    deleteMode: false,
    tutorialDismissed: false,
  };

  const emitter = {
    x: 0,
    y: 0,
    angle: -28 * Math.PI / 180,
    radius: EMITTER_RADIUS,
    handleDist: 116,
  };

  const CHORD_LIBRARY = [
    { name:'Maj', intervals:[0,4,7] },
    { name:'Min', intervals:[0,3,7] },
    { name:'Sus2', intervals:[0,2,7] },
    { name:'Sus4', intervals:[0,5,7] },
    { name:'Dim', intervals:[0,3,6] },
    { name:'Aug', intervals:[0,4,8] },
    { name:'6', intervals:[0,4,7,9] },
    { name:'m6', intervals:[0,3,7,9] },
    { name:'7', intervals:[0,4,7,10] },
    { name:'Maj7', intervals:[0,4,7,11] },
    { name:'m7', intervals:[0,3,7,10] },
    { name:'Add9', intervals:[0,4,7,14] },
    { name:'mAdd9', intervals:[0,3,7,14] },
    { name:'Power', intervals:[0,7,12] },
    { name:'Quartal', intervals:[0,5,10] },
    { name:'Cluster', intervals:[0,1,7] },
  ];
  const ROOTS = [
    { name:'C', midi:48 }, { name:'C#', midi:49 }, { name:'D', midi:50 }, { name:'D#', midi:51 },
    { name:'E', midi:52 }, { name:'F', midi:53 }, { name:'F#', midi:54 }, { name:'G', midi:55 },
    { name:'G#', midi:56 }, { name:'A', midi:57 }, { name:'A#', midi:58 }, { name:'B', midi:59 },
  ];

  const TIMBRES = {
    piano:  { attack:.002, decay:1.6, sustain:.04, filter:'lowpass', freq:3300, q:.8, wet:.20, partials:[[1,'triangle',1],[2,'sine',.42],[3,'sine',.18],[4,'sine',.09]], noise:.08 },
    glass:  { attack:.004, decay:1.1, sustain:.06, filter:'highpass', freq:1200, q:1.0, wet:.28, partials:[[1,'sine',1],[3,'sine',.24],[6,'sine',.08]], noise:0 },
    glock:  { attack:.002, decay:1.25, sustain:.03, filter:'highpass', freq:1800, q:1.1, wet:.26, partials:[[1,'triangle',1],[2,'sine',.30],[4.1,'sine',.16]], noise:.03 },
    organ:  { attack:.012, decay:1.0, sustain:.45, filter:'lowpass', freq:1500, q:.4, wet:.12, partials:[[1,'sine',1],[2,'sine',.42],[3,'sine',.16]], noise:0 },
    pad:    { attack:.040, decay:1.4, sustain:.38, filter:'lowpass', freq:1400, q:.3, wet:.26, partials:[[1,'sine',1],[2,'triangle',.16],[3,'sine',.08]], noise:0 },
    marimba:{ attack:.002, decay:.45, sustain:.03, filter:'bandpass', freq:760, q:1.7, wet:.08, partials:[[1,'triangle',1],[3,'sine',.14],[5,'sine',.04]], noise:.05 },
    bamboo: { attack:.003, decay:.52, sustain:.04, filter:'bandpass', freq:980, q:1.4, wet:.10, partials:[[1,'triangle',1],[2.4,'sine',.20],[4.8,'sine',.07]], noise:.05 },
    choir:  { attack:.055, decay:2.0, sustain:.30, filter:'bandpass', freq:720, q:.95, wet:.28, partials:[[1,'triangle',1],[2,'sine',.22],[.5,'sine',.11]], noise:0 },
  };

  const audio = {
    ctx: null,
    master: null,
    dry: null,
    wet: null,
    filter: null,
    delay: null,
    noiseBuffer: null,
  };

  let particles = [];
  let leaves = [];
  let drag = null;

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function mapValue(v, inMin, inMax, outMin, outMax){
    const t = clamp((v - inMin) / (inMax - inMin || 1), 0, 1);
    return lerp(outMin, outMax, t);
  }
  function midiToFreq(m){ return 440 * Math.pow(2, (m-69)/12); }
  function signedAngle(x1,y1,x2,y2){ return Math.atan2(y2-y1, x2-x1); }
  function segEndpoints(seg){
    const dx = Math.cos(seg.angle) * seg.length * .5;
    const dy = Math.sin(seg.angle) * seg.length * .5;
    return { ax: seg.x - dx, ay: seg.y - dy, bx: seg.x + dx, by: seg.y + dy };
  }
  function segNormal(seg){ return { x: -Math.sin(seg.angle), y: Math.cos(seg.angle) }; }
  function closestPointOnSegment(px,py, ax,ay,bx,by){
    const abx = bx-ax, aby = by-ay;
    const len2 = abx*abx + aby*aby || 1;
    let t = ((px-ax)*abx + (py-ay)*aby) / len2;
    t = clamp(t, 0, 1);
    return { x: ax + abx*t, y: ay + aby*t, t };
  }

  function getRootName(midi){
    const found = ROOTS.find(r => r.midi === midi);
    return found ? found.name : 'C';
  }
  function getChordName(index){
    return CHORD_LIBRARY[((index % CHORD_LIBRARY.length) + CHORD_LIBRARY.length) % CHORD_LIBRARY.length].name;
  }
  function leafLabel(leaf){ return `${getRootName(leaf.root)} ${getChordName(leaf.chordIndex)}`; }
  function currentLaunchSpeed(){ return Math.round(mapValue(emitter.handleDist, HANDLE_DIST_MIN, HANDLE_DIST_MAX, LAUNCH_SPEED_MIN, LAUNCH_SPEED_MAX)); }

  function makeLeaf(index, count){
    const columns = state.width < state.height ? 2 : 3;
    const col = index % columns;
    const row = Math.floor(index / columns);
    const colSpacing = state.width / (columns + 1);
    const rowSpacing = Math.max(90, Math.min(160, state.height * .16));
    const baseY = state.height * .34;
    return {
      id: Date.now() + Math.random() + index,
      x: clamp(colSpacing * (col + 1) + ((row % 2) ? 18 : -18), 60, state.width - 60),
      y: clamp(baseY + row * rowSpacing, 90, state.height - 90),
      angle: (-22 + (index % 5) * 11) * Math.PI / 180,
      length: 145,
      chordIndex: index % CHORD_LIBRARY.length,
      root: ROOTS[index % ROOTS.length].midi,
      enabled: true,
      hue: 120 + ((index * 31) % 90),
    };
  }

  function defaultLeaves(count = DEFAULT_LINE_COUNT){
    leaves = [];
    for(let i=0;i<count;i++) leaves.push(makeLeaf(i, count));
  }

  function saveState(){
    try{
      const payload = {
        tutorialDismissed: state.tutorialDismissed,
        gravity: state.gravity,
        intervalMs: state.intervalMs,
        particleSize: state.particleSize,
        timbre: state.timbre,
        autoFire: state.autoFire,
        emitter: {
          x: emitter.x,
          y: emitter.y,
          angle: emitter.angle,
          handleDist: emitter.handleDist,
        },
        leaves: leaves.map(leaf => ({
          id: leaf.id,
          x: leaf.x,
          y: leaf.y,
          angle: leaf.angle,
          length: leaf.length,
          chordIndex: leaf.chordIndex,
          root: leaf.root,
          enabled: !!leaf.enabled,
          hue: leaf.hue,
        })),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }catch(_err){}
  }

  function clearStoredData(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(_err){}
  }

  function applyLoadedState(data){
    if(!data || typeof data !== 'object') return false;
    state.tutorialDismissed = !!data.tutorialDismissed;
    state.gravity = clamp(Number(data.gravity) || DEFAULT_GRAVITY, 160, 1800);
    state.intervalMs = clamp(Number(data.intervalMs) || DEFAULT_INTERVAL_MS, 80, 1400);
    state.particleSize = clamp(Number(data.particleSize) || DEFAULT_PARTICLE_SIZE, 6, 24);
    state.timbre = TIMBRES[data.timbre] ? data.timbre : 'piano';
    state.autoFire = !!data.autoFire;

    if(data.emitter){
      emitter.x = Number(data.emitter.x) || 0;
      emitter.y = Number(data.emitter.y) || 0;
      emitter.angle = Number.isFinite(Number(data.emitter.angle)) ? Number(data.emitter.angle) : emitter.angle;
      emitter.handleDist = clamp(Number(data.emitter.handleDist) || 116, HANDLE_DIST_MIN, HANDLE_DIST_MAX);
    }

    if(Array.isArray(data.leaves) && data.leaves.length){
      leaves = data.leaves.map((leaf, i) => ({
        id: leaf.id || (Date.now() + Math.random() + i),
        x: Number(leaf.x) || 100,
        y: Number(leaf.y) || 100,
        angle: Number.isFinite(Number(leaf.angle)) ? Number(leaf.angle) : 0,
        length: clamp(Number(leaf.length) || 145, LINE_LENGTH_MIN, LINE_LENGTH_MAX),
        chordIndex: clamp(Math.round(Number(leaf.chordIndex) || 0), 0, CHORD_LIBRARY.length - 1),
        root: ROOTS.some(r => r.midi === Number(leaf.root)) ? Number(leaf.root) : ROOTS[i % ROOTS.length].midi,
        enabled: leaf.enabled !== false,
        hue: Number(leaf.hue) || (120 + ((i * 31) % 90)),
      }));
    }
    return true;
  }

  function syncControls(){
    gravityRange.value = String(state.gravity);
    intervalRange.value = String(state.intervalMs);
    sizeRange.value = String(state.particleSize);
    timbreSelect.value = state.timbre;
    autoToggle.value = state.autoFire ? 'on' : 'off';
    gravityOut.textContent = String(state.gravity);
    intervalOut.textContent = String(state.intervalMs);
    sizeOut.textContent = String(state.particleSize);
  }

  function renderChordRows(){
    chordList.innerHTML = '';
    leaves.forEach((leaf, index) => {
      const row = document.createElement('div');
      row.className = 'chord-row';

      const head = document.createElement('div');
      head.className = 'chord-head';
      head.innerHTML = `<span>線 ${index + 1}</span>`;
      const toggleWrap = document.createElement('label');
      toggleWrap.className = 'mini-toggle';
      const toggle = document.createElement('input');
      toggle.type = 'checkbox';
      toggle.checked = !!leaf.enabled;
      toggle.addEventListener('change', () => {
        leaf.enabled = toggle.checked;
        saveState();
      });
      toggleWrap.append(toggle, document.createTextNode('啟用'));
      head.appendChild(toggleWrap);

      const grid = document.createElement('div');
      grid.className = 'mini-grid';

      const rootField = document.createElement('div');
      rootField.className = 'field';
      const rootLabel = document.createElement('label');
      rootLabel.textContent = '調';
      const rootSelect = document.createElement('select');
      ROOTS.forEach(root => {
        const opt = document.createElement('option');
        opt.value = String(root.midi);
        opt.textContent = root.name;
        if(root.midi === leaf.root) opt.selected = true;
        rootSelect.appendChild(opt);
      });
      rootSelect.addEventListener('change', () => {
        leaf.root = Number(rootSelect.value);
        saveState();
      });
      rootField.append(rootLabel, rootSelect);

      const chordField = document.createElement('div');
      chordField.className = 'field';
      const chordLabel = document.createElement('label');
      chordLabel.textContent = '和弦';
      const chordSelect = document.createElement('select');
      CHORD_LIBRARY.forEach((chord, chordIndex) => {
        const opt = document.createElement('option');
        opt.value = String(chordIndex);
        opt.textContent = chord.name;
        if(chordIndex === leaf.chordIndex) opt.selected = true;
        chordSelect.appendChild(opt);
      });
      chordSelect.addEventListener('change', () => {
        leaf.chordIndex = Number(chordSelect.value);
        saveState();
      });
      chordField.append(chordLabel, chordSelect);

      grid.append(rootField, chordField);
      row.append(head, grid);
      chordList.appendChild(row);
    });
  }

  function resize(){
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    canvas.width = Math.floor(state.width * dpr);
    canvas.height = Math.floor(state.height * dpr);
    canvas.style.width = state.width + 'px';
    canvas.style.height = state.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if(!emitter.x && !emitter.y){
      emitter.x = state.width * .22;
      emitter.y = state.height * .18;
    }
    emitter.x = clamp(emitter.x, 40, state.width - 40);
    emitter.y = clamp(emitter.y, 40, state.height - 40);
    leaves.forEach((leaf, i) => {
      leaf.x = clamp(leaf.x, 40, state.width - 40);
      leaf.y = clamp(leaf.y, 60, state.height - 40);
      leaf.length = clamp(leaf.length, LINE_LENGTH_MIN, LINE_LENGTH_MAX);
      if(!Number.isFinite(leaf.hue)) leaf.hue = 120 + ((i * 31) % 90);
    });
  }

  function resetScene(){
    particles = [];
    emitter.x = state.width * .22;
    emitter.y = state.height * .18;
    emitter.angle = -28 * Math.PI / 180;
    emitter.handleDist = 116;
    defaultLeaves(DEFAULT_LINE_COUNT);
    renderChordRows();
    saveState();
  }

  function initAudio(){
    if(audio.ctx) return audio.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    const ac = new AC();
    const master = ac.createGain(); master.gain.value = .62;
    const dry = ac.createGain(); dry.gain.value = .95;
    const wet = ac.createGain(); wet.gain.value = .22;
    const filter = ac.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 3000; filter.Q.value = .4;
    const delay = ac.createDelay(.6); delay.delayTime.value = .18;
    const fb = ac.createGain(); fb.gain.value = .22;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -22; comp.knee.value = 14; comp.ratio.value = 2.2; comp.attack.value = .006; comp.release.value = .18;
    dry.connect(filter); wet.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(filter); filter.connect(comp); comp.connect(master); master.connect(ac.destination);
    audio.ctx = ac; audio.master = master; audio.dry = dry; audio.wet = wet; audio.filter = filter; audio.delay = delay;
    return ac;
  }

  async function resumeAudio(){
    const ac = initAudio();
    if(ac && ac.state === 'suspended'){
      try{ await ac.resume(); }catch(_e){}
    }
  }

  function getNoiseBuffer(){
    const ac = initAudio();
    if(!ac) return null;
    if(audio.noiseBuffer && audio.noiseBuffer.sampleRate === ac.sampleRate) return audio.noiseBuffer;
    const len = Math.floor(ac.sampleRate * .3);
    const buffer = ac.createBuffer(1, len, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
    audio.noiseBuffer = buffer;
    return buffer;
  }

  function applyTimbreSettings(){
    const ac = initAudio();
    if(!ac) return;
    const t = TIMBRES[state.timbre];
    audio.filter.type = t.filter;
    audio.filter.frequency.setTargetAtTime(t.freq, ac.currentTime, .03);
    audio.filter.Q.setTargetAtTime(t.q, ac.currentTime, .03);
    audio.wet.gain.setTargetAtTime(t.wet, ac.currentTime, .03);
  }

  function playNote(freq, velocity = 1, detuneCents = 0){
    const ac = initAudio();
    if(!ac) return;
    const t = TIMBRES[state.timbre];
    const now = ac.currentTime;
    const env = ac.createGain();
    const peak = .12 * velocity;
    env.gain.setValueAtTime(.0001, now);
    env.gain.linearRampToValueAtTime(peak, now + t.attack);
    env.gain.exponentialRampToValueAtTime(Math.max(.0001, peak * t.sustain), now + t.decay * .45 + t.attack);
    env.gain.exponentialRampToValueAtTime(.0001, now + t.decay + .05);
    const wetSend = ac.createGain();
    wetSend.gain.value = Math.min(.42, t.wet + .04);
    const f = ac.createBiquadFilter();
    f.type = t.filter;
    f.frequency.value = t.freq;
    f.Q.value = t.q;
    env.connect(f);
    f.connect(audio.dry);
    f.connect(wetSend);
    wetSend.connect(audio.wet);

    for(const [mul, wave, gainMul] of t.partials){
      const osc = ac.createOscillator();
      osc.type = wave;
      osc.frequency.value = freq * mul;
      osc.detune.value = detuneCents + (Math.random() * 2 - 1) * 4;
      const g = ac.createGain();
      g.gain.value = gainMul;
      osc.connect(g);
      g.connect(env);
      osc.start(now);
      osc.stop(now + t.decay + .08);
    }
    if(t.noise > 0){
      const src = ac.createBufferSource();
      src.buffer = getNoiseBuffer();
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = Math.max(800, t.freq * .8);
      bp.Q.value = 1.8;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(t.noise * velocity, now);
      ng.gain.exponentialRampToValueAtTime(.0001, now + .04);
      src.connect(bp);
      bp.connect(ng);
      ng.connect(env);
      src.start(now);
      src.stop(now + .05);
    }
  }

  function playChord(leaf, impact = 1){
    if(!leaf.enabled) return;
    const chord = CHORD_LIBRARY[leaf.chordIndex % CHORD_LIBRARY.length];
    const spread = chord.intervals.length > 3 ? 4 : 7;
    chord.intervals.forEach((interval, i) => {
      const midi = leaf.root + interval + (i >= 3 ? -12 : 0);
      const detune = (i - (chord.intervals.length - 1) / 2) * spread;
      playNote(midiToFreq(midi), clamp(.74 * impact - i * .08, .18, .95), detune);
    });
  }

  function fireParticle(){
    resumeAudio();
    const speed = currentLaunchSpeed();
    const vx = Math.cos(emitter.angle) * speed;
    const vy = Math.sin(emitter.angle) * speed;
    particles.push({
      x: emitter.x + Math.cos(emitter.angle) * (emitter.radius + state.particleSize + 2),
      y: emitter.y + Math.sin(emitter.angle) * (emitter.radius + state.particleSize + 2),
      vx, vy,
      r: state.particleSize,
      life: 0,
      hue: 160 + Math.random() * 60,
      lastHitAt: -999,
      lastLeafId: null,
    });
  }

  function update(dt, ts){
    if(state.autoFire){
      state.spawnAcc += dt * 1000;
      while(state.spawnAcc >= state.intervalMs){
        state.spawnAcc -= state.intervalMs;
        fireParticle();
      }
    }

    for(const p of particles){
      p.vy += state.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life += dt;

      for(const leaf of leaves){
        if(!leaf.enabled) continue;
        const {ax, ay, bx, by} = segEndpoints(leaf);
        const hit = closestPointOnSegment(p.x, p.y, ax, ay, bx, by);
        let dx = p.x - hit.x;
        let dy = p.y - hit.y;
        let d = Math.hypot(dx, dy);

        if(d < p.r + COLLISION_PADDING){
          if(d < .0001){
            const n0 = segNormal(leaf);
            dx = n0.x; dy = n0.y; d = 1;
          }
          let nx = dx / d;
          let ny = dy / d;
          const dot = p.vx * nx + p.vy * ny;
          if(dot < 0){
            p.x = hit.x + nx * (p.r + COLLISION_PADDING);
            p.y = hit.y + ny * (p.r + COLLISION_PADDING);
            p.vx = (p.vx - 2 * dot * nx) * .96;
            p.vy = (p.vy - 2 * dot * ny) * .92;
            p.vx += Math.cos(leaf.angle) * 14;
            p.vy += Math.sin(leaf.angle) * 14;
            if(ts - p.lastHitAt > HIT_COOLDOWN_MS || p.lastLeafId !== leaf.id){
              const impact = clamp(Math.abs(dot) / 360, .28, 1);
              playChord(leaf, impact);
              p.lastHitAt = ts;
              p.lastLeafId = leaf.id;
            }
          }
        }
      }

      if(p.x < p.r){ p.x = p.r; p.vx = Math.abs(p.vx) * .94; }
      if(p.x > state.width - p.r){ p.x = state.width - p.r; p.vx = -Math.abs(p.vx) * .94; }
      if(p.y < p.r){ p.y = p.r; p.vy = Math.abs(p.vy) * .9; }
    }

    particles = particles.filter(p => p.y < state.height + 120 && p.life < PARTICLE_LIFE_SEC);
  }

  function drawBackground(){
    const g = ctx.createRadialGradient(state.width * .5, state.height * .45, 20, state.width * .5, state.height * .45, Math.max(state.width, state.height) * .7);
    g.addColorStop(0, 'rgba(80,145,190,.08)');
    g.addColorStop(1, 'rgba(5,15,28,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, state.width, state.height);

    for(let i=0;i<22;i++){
      const x = (i * 191 % 997) / 997 * state.width;
      const y = (i * 337 % 991) / 991 * state.height;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,.05)';
      ctx.arc(x, y, 1.5 + (i % 3), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLeaf(leaf){
    const {ax, ay, bx, by} = segEndpoints(leaf);
    const alpha = leaf.enabled ? .96 : .24;
    const grad = ctx.createLinearGradient(ax, ay, bx, by);
    grad.addColorStop(0, `hsla(${leaf.hue}, 72%, 72%, ${alpha})`);
    grad.addColorStop(.5, `hsla(${leaf.hue + 18}, 76%, 62%, ${alpha})`);
    grad.addColorStop(1, `hsla(${leaf.hue + 34}, 72%, 72%, ${alpha})`);

    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = grad;
    ctx.lineWidth = 8;
    ctx.shadowBlur = leaf.enabled ? 14 : 0;
    ctx.shadowColor = `hsla(${leaf.hue}, 90%, 70%, .34)`;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = leaf.enabled ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.10)';
    ctx.beginPath(); ctx.arc(leaf.x, leaf.y, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ax, ay, 5.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, 5.6, 0, Math.PI * 2); ctx.fill();

    ctx.font = '600 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = leaf.enabled ? 'rgba(255,255,255,.94)' : 'rgba(255,255,255,.42)';
    ctx.fillText(leafLabel(leaf), leaf.x, leaf.y - 13);
    ctx.restore();
  }

  function emitterHandle(){
    return {
      x: emitter.x + Math.cos(emitter.angle) * emitter.handleDist,
      y: emitter.y + Math.sin(emitter.angle) * emitter.handleDist,
    };
  }

  function drawEmitter(){
    const h = emitterHandle();
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = state.deleteMode ? 'rgba(255,150,150,.35)' : 'rgba(190,240,255,.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.moveTo(emitter.x, emitter.y);
    ctx.lineTo(h.x, h.y);
    ctx.stroke();
    ctx.setLineDash([]);

    const rg = ctx.createRadialGradient(emitter.x - 4, emitter.y - 6, 4, emitter.x, emitter.y, 40);
    rg.addColorStop(0, 'rgba(255,255,255,.95)');
    rg.addColorStop(.28, 'rgba(126,236,255,.96)');
    rg.addColorStop(1, 'rgba(126,236,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(emitter.x, emitter.y, 40, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(118,238,255,.98)';
    ctx.beginPath();
    ctx.arc(emitter.x, emitter.y, emitter.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.beginPath();
    ctx.arc(emitter.x - 5, emitter.y - 6, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,218,126,.96)';
    ctx.beginPath();
    ctx.arc(h.x, h.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.arc(h.x - 2.5, h.y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const glow = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.r * 3.4);
      glow.addColorStop(0, `hsla(${p.hue},100%,80%,.98)`);
      glow.addColorStop(1, `hsla(${p.hue},100%,65%,0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `hsla(${p.hue},100%,72%,.98)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath();
      ctx.arc(p.x - p.r * .28, p.y - p.r * .28, Math.max(1.5, p.r * .24), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render(){
    ctx.clearRect(0, 0, state.width, state.height);
    drawBackground();
    leaves.forEach(drawLeaf);
    drawParticles();
    drawEmitter();
  }

  function frame(ts){
    const dt = Math.min(.03, (ts - state.lastTs) / 1000);
    state.lastTs = ts;
    update(dt, ts);
    render();
    requestAnimationFrame(frame);
  }

  function canvasPoint(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function hitTestEmitter(x, y){
    const h = emitterHandle();
    if(dist(x, y, h.x, h.y) <= 16) return { type:'handle' };
    if(dist(x, y, emitter.x, emitter.y) <= emitter.radius + 10) return { type:'emitter' };
    return null;
  }

  function hitTestLeaf(x, y){
    for(let i=leaves.length - 1; i >= 0; i--){
      const leaf = leaves[i];
      const {ax, ay, bx, by} = segEndpoints(leaf);
      if(dist(x, y, leaf.x, leaf.y) <= 12) return { type:'leaf-center', leaf };
      if(dist(x, y, ax, ay) <= 13) return { type:'leaf-a', leaf };
      if(dist(x, y, bx, by) <= 13) return { type:'leaf-b', leaf };
      const cp = closestPointOnSegment(x, y, ax, ay, bx, by);
      if(dist(x, y, cp.x, cp.y) <= 12) return { type:'leaf-line', leaf };
    }
    return null;
  }

  function cycleLeafChord(leaf){
    leaf.chordIndex = (leaf.chordIndex + 1) % CHORD_LIBRARY.length;
    renderChordRows();
    saveState();
  }

  function addLeaf(){
    leaves.push(makeLeaf(leaves.length, leaves.length + 1));
    renderChordRows();
    saveState();
  }

  function removeLeafById(id){
    leaves = leaves.filter(leaf => leaf.id !== id);
    renderChordRows();
    saveState();
  }

  function setDeleteMode(enabled){
    state.deleteMode = enabled;
    removeBtn.classList.toggle('active', enabled);
  }

  async function closeTutorial(){
    state.tutorialDismissed = true;
    tutorialModal.hidden = true;
    saveState();
    await resumeAudio();
  }

  function onPointerDown(e){
    if(!tutorialModal.hidden || !settingsModal.hidden) return;
    resumeAudio();
    const p = canvasPoint(e);

    const emitterHit = hitTestEmitter(p.x, p.y);
    if(emitterHit){
      drag = {
        mode: emitterHit.type,
        startX: p.x,
        startY: p.y,
        moved: false,
        startEmitterX: emitter.x,
        startEmitterY: emitter.y,
        startAngle: emitter.angle,
        startHandleDist: emitter.handleDist,
        pointerId: e.pointerId,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }

    const leafHit = hitTestLeaf(p.x, p.y);
    if(leafHit){
      if(state.deleteMode){
        removeLeafById(leafHit.leaf.id);
        setDeleteMode(false);
        return;
      }
      drag = {
        mode: leafHit.type,
        leaf: leafHit.leaf,
        startX: p.x,
        startY: p.y,
        moved: false,
        pointerId: e.pointerId,
        startLeafX: leafHit.leaf.x,
        startLeafY: leafHit.leaf.y,
        startAngle: leafHit.leaf.angle,
        startLength: leafHit.leaf.length,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }

    setDeleteMode(false);
  }

  function onPointerMove(e){
    if(!drag || drag.pointerId !== e.pointerId) return;
    const p = canvasPoint(e);
    if(dist(p.x, p.y, drag.startX, drag.startY) > 5) drag.moved = true;

    if(drag.mode === 'emitter'){
      emitter.x = clamp(drag.startEmitterX + (p.x - drag.startX), 30, state.width - 30);
      emitter.y = clamp(drag.startEmitterY + (p.y - drag.startY), 30, state.height - 30);
    } else if(drag.mode === 'handle'){
      emitter.angle = signedAngle(emitter.x, emitter.y, p.x, p.y);
      emitter.handleDist = clamp(dist(emitter.x, emitter.y, p.x, p.y), HANDLE_DIST_MIN, HANDLE_DIST_MAX);
    } else if(drag.mode === 'leaf-center' || drag.mode === 'leaf-line'){
      drag.leaf.x = clamp(drag.startLeafX + (p.x - drag.startX), 40, state.width - 40);
      drag.leaf.y = clamp(drag.startLeafY + (p.y - drag.startY), 60, state.height - 40);
    } else if(drag.mode === 'leaf-a' || drag.mode === 'leaf-b'){
      const cx = drag.leaf.x;
      const cy = drag.leaf.y;
      drag.leaf.angle = signedAngle(cx, cy, p.x, p.y);
      drag.leaf.length = clamp(dist(cx, cy, p.x, p.y) * 2, LINE_LENGTH_MIN, LINE_LENGTH_MAX);
    }
  }

  function onPointerUp(e){
    if(!drag || drag.pointerId !== e.pointerId) return;
    if(!drag.moved){
      if(drag.mode === 'emitter') fireParticle();
      else if(drag.mode.startsWith('leaf-')) cycleLeafChord(drag.leaf);
    }
    saveState();
    drag = null;
  }

  function bootFromStorage(){
    let loaded = false;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const data = JSON.parse(raw);
        loaded = applyLoadedState(data);
      }
    }catch(_err){}
    if(!loaded){
      defaultLeaves(DEFAULT_LINE_COUNT);
      state.tutorialDismissed = false;
    }
  }

  gravityRange.addEventListener('input', () => {
    state.gravity = Number(gravityRange.value);
    gravityOut.textContent = String(state.gravity);
    saveState();
  });
  intervalRange.addEventListener('input', () => {
    state.intervalMs = Number(intervalRange.value);
    intervalOut.textContent = String(state.intervalMs);
    state.spawnAcc = 0;
    saveState();
  });
  sizeRange.addEventListener('input', () => {
    state.particleSize = Number(sizeRange.value);
    sizeOut.textContent = String(state.particleSize);
    saveState();
  });
  timbreSelect.addEventListener('change', () => {
    state.timbre = timbreSelect.value;
    applyTimbreSettings();
    saveState();
  });
  autoToggle.addEventListener('change', () => {
    state.autoFire = autoToggle.value === 'on';
    state.spawnAcc = 0;
    saveState();
  });

  moreBtn.addEventListener('click', async () => {
    await resumeAudio();
    settingsModal.hidden = false;
  });
  closeBtn.addEventListener('click', () => { settingsModal.hidden = true; });
  settingsModal.addEventListener('click', (e) => { if(e.target === settingsModal) settingsModal.hidden = true; });

  addBtn.addEventListener('click', async () => {
    await resumeAudio();
    setDeleteMode(false);
    addLeaf();
  });
  removeBtn.addEventListener('click', async () => {
    await resumeAudio();
    setDeleteMode(!state.deleteMode);
  });

  tutorialCloseBtn.addEventListener('click', closeTutorial);
  tutorialCloseX.addEventListener('click', closeTutorial);
  tutorialModal.addEventListener('click', (e) => { if(e.target === tutorialModal) closeTutorial(); });

  clearParticlesBtn.addEventListener('click', () => { particles = []; });
  resetSceneBtn.addEventListener('click', () => { resetScene(); });
  clearDataBtn.addEventListener('click', () => {
    clearStoredData();
    particles = [];
    state.gravity = DEFAULT_GRAVITY;
    state.intervalMs = DEFAULT_INTERVAL_MS;
    state.particleSize = DEFAULT_PARTICLE_SIZE;
    state.timbre = 'piano';
    state.autoFire = AUTO_FIRE_DEFAULT;
    state.tutorialDismissed = false;
    emitter.handleDist = 116;
    syncControls();
    applyTimbreSettings();
    resetScene();
    settingsModal.hidden = true;
    tutorialModal.hidden = false;
  });

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  window.addEventListener('resize', () => {
    resize();
    saveState();
  });
  document.addEventListener('visibilitychange', () => { state.lastTs = performance.now(); });

  initAudio();
  bootFromStorage();
  resize();
  syncControls();
  renderChordRows();
  applyTimbreSettings();

  if(!state.tutorialDismissed) tutorialModal.hidden = false;
  requestAnimationFrame((ts) => { state.lastTs = ts; frame(ts); });
})();
</script>
</body>
</html>
