<!--
FFT Ocean v0.37 — 介面、Safari 相容手勢、音效與畫質擴充。
此 JS 不依賴任何外部程式；原作者 FFT 核心位於上方 module script。
Safari/Chrome 的音訊自動播放與原生全螢幕均受使用者手勢限制：
  * 音效預設為開，會嘗試自動啟動；若被封鎖，在首次觸控時繼續播放。
  * 首次有效觸控會嘗試進入原生全螢幕；不支援時保持沉浸式頁面佈局。
  * 不建立「退出全螢幕」按鈕；交由瀏覽器/系統自行退出。
-->
<script id="fft-extension-js">
(function () {
  'use strict';
  const cfg = window.__FFT_OCEAN;
  const $ = id => document.getElementById(id);
  const quality = $('fft-quality');
  const state = $('fft-state');
  const renderStatus = $('fft-render-status');
  const menu = $('fft-controls');
  const oceanDrawer = $('fft-ocean-drawer');
  const menuButton = $('fft-menu-button');
  const audioToggle = $('fft-audio-toggle');
  const sea = $('fft-audio-sea');
  const originalPanel = $('panel');
  const originalError = $('err');
  const audioStatus = $('fft-audio-status');
  const touchHint = $('fft-first-touch-hint');
  const fullscreenButton = $('fft-fullscreen-request');

  // 原作者的 #panel 仍使用相同 id；只移動 DOM 位置，不重建滑桿或干預 FFT。
  $('fft-original-panel-slot').appendChild(originalPanel);
  $('fft-error-slot').appendChild(originalError);

  const extraActions = $('fft-extra-actions');
  const oceanButton = $('fft-show-ocean');
  const gaugeButton = $('fft-quality-gauge');
  const soundButton = $('fft-sound-cycle');
  const feedback = $('fft-feedback');
  let feedbackTimer;
  function announce(message) {
    feedback.textContent = message;
    feedback.classList.add('visible');
    clearTimeout(feedbackTimer);
    feedbackTimer=setTimeout(()=>feedback.classList.remove('visible'),1000);
  }
  function showOcean(on) {
    document.documentElement.classList.toggle('fft-ocean-open',on);
    oceanDrawer.setAttribute('aria-hidden',String(!on));
    oceanButton.setAttribute('aria-expanded',String(on));
    oceanButton.dataset.active=String(on);
  }
  function showMenu(on) {
    document.documentElement.classList.toggle('fft-menu-open',on);
    extraActions.setAttribute('aria-hidden',String(!on));
    menuButton.setAttribute('aria-expanded',String(on));
    menuButton.setAttribute('aria-label',on?'收起工具列':'展開工具列');
    if (!on) showOcean(false);
  }
  menuButton.addEventListener('click',()=>showMenu(!document.documentElement.classList.contains('fft-menu-open')));
  oceanButton.addEventListener('click',()=>showOcean(!document.documentElement.classList.contains('fft-ocean-open')));
  $('fft-close-ocean').addEventListener('click',()=>showOcean(false));
  $('fft-source-link').addEventListener('click',()=>window.open('https://github.com/Noniv/web-ocean','_blank','noopener,noreferrer'));
  document.addEventListener('pointerdown',e=>{
    if(document.documentElement.classList.contains('fft-ocean-open') && !oceanDrawer.contains(e.target) && !oceanButton.contains(e.target)) showOcean(false);
    if(document.documentElement.classList.contains('fft-menu-open') && !extraActions.contains(e.target) && !menuButton.contains(e.target) && !oceanDrawer.contains(e.target) && !$('fft-height-buttons').contains(e.target)) showMenu(false);
  },{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')showMenu(false)});

  const debugToggle = $('fft-debug-toggle');
  debugToggle.addEventListener('change',()=>document.documentElement.classList.toggle('fft-debug',debugToggle.checked));

  // 四刻度畫質表：每按一次切到下一段，立刻更新原作者畫布 DPR。
  const qualities=['0.75','1','1.5','native'];
  const qualityNames=['0.75×','1×','1.5×','原生'];
  const needleAngles=['-135deg','-75deg','-15deg','45deg'];
  function updateGauge() {
    const i=Math.max(0,qualities.indexOf(quality.value));
    gaugeButton.style.setProperty('--needle',needleAngles[i]);
    gaugeButton.title='畫質 '+qualityNames[i];
    gaugeButton.setAttribute('aria-label','畫質 '+qualityNames[i]+'，點擊切換');
  }
  quality.value=cfg.quality;
  quality.addEventListener('change',()=>{
    cfg.quality=quality.value;
    cfg.effectiveDpr=cfg.quality==='native'?null:Number(cfg.quality);
    try{localStorage.setItem(cfg.settingsKey,cfg.quality)}catch(_){}
    window.dispatchEvent(new Event('resize'));
    updateGauge();
  });
  gaugeButton.addEventListener('click',()=>{
    quality.value=qualities[(qualities.indexOf(quality.value)+1)%qualities.length];
    quality.dispatchEvent(new Event('change',{bubbles:true}));
    announce('畫質 '+qualityNames[qualities.indexOf(quality.value)]);
  });
  updateGauge();

  // 音效模式四態：按鈕圖示直接反映目前狀態，音效引擎仍使用既有 sea 下拉值。
  const seaModes=['follow','0.55','1','1.55'];
  const seaNames=['跟隨海況','平靜','一般','強浪'];
  const seaIcons=[
    '<svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 0 1 14-5l2 2M20 13a8 8 0 0 1-14 5l-2-2"/><path d="M20 3v5h-5M4 21v-5h5"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M2 14c3-3 5-3 8 0s5 3 8 0 4-2 4-2"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M2 10c3-3 5-3 8 0s5 3 8 0 4-2 4-2M2 17c3-3 5-3 8 0s5 3 8 0 4-2 4-2"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M2 8c3-5 5-5 8 0s5 5 8 0 4-3 4-3M2 15c3-5 5-5 8 0s5 5 8 0 4-3 4-3M2 21c3-2 5-2 8 0"/></svg>'
  ];
  function updateSoundIcon(){const i=Math.max(0,seaModes.indexOf(sea.value));soundButton.innerHTML=seaIcons[i];soundButton.title='音效 '+seaNames[i];soundButton.setAttribute('aria-label','音效 '+seaNames[i]+'，點擊切換')}
  soundButton.addEventListener('click',()=>{
    sea.value=seaModes[(seaModes.indexOf(sea.value)+1)%seaModes.length];
    sea.dispatchEvent(new Event('change',{bubbles:true}));
    updateSoundIcon();announce('音效 '+seaNames[seaModes.indexOf(sea.value)]);
  });
  updateSoundIcon();

  // v0.33：不再建立前後左右搖桿。只保留按住箭頭以升降原本的相機高度。
  const axes = window.__FFT_TOUCH_NAV;
  const heldHeights = new Set();
  function updateHeight() {
    axes.vertical = (heldHeights.has('up') ? 1 : 0) - (heldHeights.has('down') ? 1 : 0);
  }
  for (const [id, dir] of [['fft-ascend','up'],['fft-descend','down']]) {
    const btn = $(id);
    btn.addEventListener('pointerdown', e => {
      if (e.cancelable) e.preventDefault();
      heldHeights.add(dir);
      updateHeight();
      try {btn.setPointerCapture(e.pointerId);}catch (_){}
    }, {passive:false});
    for (const eventName of ['pointerup','pointercancel','lostpointercapture']) {
      btn.addEventListener(eventName, () => {heldHeights.delete(dir);updateHeight();});
    }
  }
  function releaseHeights(){heldHeights.clear();axes.vertical=0;}
  window.addEventListener('blur', releaseHeights);
  document.addEventListener('visibilitychange', () => {if (document.hidden) releaseHeights();});

  // v0.36 全螢幕：瀏覽器不允許在網頁載入後自行呼叫 Fullscreen。
  // 必須在 trusted 手勢的同一個 JavaScript 任務內同步呼叫 requestFullscreen。
  // 先解鎖 Web Audio，再呼叫全螢幕；切勿 await，否則 Safari 可能失去手勢授權。
  // iPhone Safari 一般網頁沒有標準元素 Fullscreen API；採用既有的全視窗畫布。
  let fullscreenAttempted = false;
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFullscreenUI() {
    // 圖示按鈕不顯示提示文；不支援原生 Fullscreen 時直接隱藏。
    const available = typeof (document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen) === 'function';
    fullscreenButton.hidden = !available || isFullscreen();
  }
  function tryNativeFullscreen() {
    if (isFullscreen()) { updateFullscreenUI(); return; }
    const root = document.documentElement;
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    if (typeof request !== 'function') { updateFullscreenUI(); return; }
    fullscreenAttempted = true;
    try {
      // 使用者手勢中直接執行，不先等待音效 Promise。
      const p = request.call(root);
      if (p && typeof p.then === 'function') {
        p.then(() => updateFullscreenUI()).catch(err => {
          // 失敗後仍能在設定選單裡主動重試，不能誤稱已成功全螢幕。
          fullscreenAttempted = false;
          updateFullscreenUI();
          console.info('Fullscreen unavailable:', err);
        });
      } else updateFullscreenUI();
    } catch (err) {

  document.addEventListener('fullscreenchange', () => updateFullscreenUI());
  document.addEventListener('webkitfullscreenchange', () => updateFullscreenUI());
  updateFullscreenUI();

  // 原作者 #fps 提供實際渲染數據，但 UI 診斷只在設定選單可見。
  let lastStatus = '';
  const monitor = setInterval(() => {

  let windSpeed=7, swellHeight=1.8;
  function readOceanControls() {
    for (const row of originalPanel.querySelectorAll('label')) {
      const label=row.querySelector('span'), input=row.querySelector('input');
      if (!label || !input) continue;
      if (label.textContent === 'Wind speed (m/s)') windSpeed=Number(input.value)||0;
      if (label.textContent === 'Swell height (m)') swellHeight=Number(input.value)||0;
    }
  }

  const poll=setInterval(readOceanControls,1500);
  window.addEventListener('pagehide',()=>clearInterval(poll),{once:true});

  // v0.36 程序化立體海浪聲：Web Audio 直接合成，不需下載聲音檔。
  // active=true 是「使用者偏好開啟」，不代表 Safari 已允許真正出聲。
  // 將 AudioContext 的建立及 resume 留在首次手勢裡，避免載入時先創建
  // 一個永久 suspended 的 AudioContext，再被原生 Fullscreen 消耗手勢授權。
  // v0.36：只保留一個喇叭圖示。音量恆為 100%，不再額外提供範圍滑桿。

  let audioCtx=null, master=null, layers=[], active=true, muted=false;
  let audioTimer=null, audioStartTime=0, startupError='';
  const SOUND_ICON_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

      if (cfg.mobile) tryNativeFullscreen();

  document.addEventListener('click',e=>{
    if(!firstGestureSeen) handleActivation(e);
  },{capture:true});
  document.addEventListener('visibilitychange',()=>{
    if(!audioCtx) return;
    if(document.hidden) audioCtx.suspend().catch(()=>{});
    else syncAudioUI(); // 回到頁面時等待下一次有效手勢；避免誤稱已播放。
  });
  window.addEventListener('pagehide',()=>{
    if(audioTimer)clearInterval(audioTimer);
    if(audioCtx && audioCtx.state==='running')audioCtx.suspend().catch(()=>{});

  // 桌面瀏覽器若允許自動播放，嘗試直接播放；被封鎖則等待首次互動。
  syncAudioUI();
  if (!cfg.mobile) startDefaultAudio();
