<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ocean FFT · Audio</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#091522;color:#edf4f7;font:14px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#panel{position:fixed;left:12px;top:12px;max-width:min(330px,calc(100vw - 44px));padding:14px;background:#071523c9;border:1px solid #ffffff35;border-radius:14px;backdrop-filter:blur(14px)}h2{font-size:15px;margin:0 0 10px}label{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:8px 0}select,input,button{accent-color:#8ed8ee}select,button{color:inherit;background:#21374b;border:1px solid #648095;border-radius:7px;padding:7px}button{cursor:pointer}#row{display:flex;gap:6px;flex-wrap:wrap}small{color:#c1d0db}#status{position:fixed;bottom:14px;left:14px;font-size:12px;color:#d6e2e9;text-shadow:0 1px 4px #000}#toggle{position:fixed;right:12px;top:12px} @media(max-width:600px){#panel{font-size:12px;padding:10px}h2{font-size:13px}}</style><canvas id="c"></canvas><button id="toggle">隱藏設定</button><section id="panel"><h2>Ocean FFT · 即時海浪與聲音</h2><label>海況<select id="sea"><option value="0">平靜</option><option value="1" selected>一般</option><option value="2">洶湧</option></select></label><label>風向 <input id="wind" type="range" min="0" max="360" value="35"></label><label>風速 <input id="speed" type="range" min="2" max="22" value="11"></label><label>音量 <input id="volume" type="range" min="0" max="100" value="55"></label><label>畫質<select id="quality"><option value="0.55">省電</option><option value="0.8" selected>標準</option><option value="1">高畫質</option></select></label><div id="row"><button id="sound">啟動海浪聲</button><button id="pause">暫停</button><button id="reset">重設視角</button><button id="full">全螢幕</button></div><p><small>WebGPU · 2D 頻譜 FFT · 動態網格 · 程序化海浪聲。拖曳調整視角，滾輪縮放。</small></p></section><div id="status">初始化 WebGPU…</div><s 'use strict';
const $=id=>document.getElementById(id),canvas=$('c'),status=$('status');let device,context,format,renderPipeline,computePipeline,fftPipe,fftBind=[],evolveBind,uniform,bufA,bufB,meshV,meshI,indices,fftN=64,paused=false,clock=0,last=performance.now(),camera={yaw:0.18,pitch:0.12,dist:48},pointer=null,settings={sea:1,wind:35,speed:11,quality:.8};

struct Params {time:f32,wind:f32,speed:f32,sea:f32,axis:f32,stage:f32,mode:f32,pad:f32};

// FFT operates on bit-reversed spectral samples: separate bit-reversal in the first pass.
const reverseShader=`struct Params {time:f32,wind:f32,speed:f32,sea:f32,axis:f32,stage:f32,mode:f32,pad:f32};@group(0) @binding(0) var<storage,read> src:array<vec4f>;@group(0) @binding(1) var<storage,read_write> dst:array<vec4f>;@group(0) @binding(2) var<uniform> p:Params;fn rev(v:u32)->u32{var n=v;var r=0u;for(var j=0u;j<6u;j++){r=(r<<1u)|(n&1u);n=n>>1u;}return r;}@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){if(id.x>=${N}u||id.y>=${N}u){return;}let x=id.x;let y=id.y;let xx=select(rev(x),x,p.axis>0.5);let yy=select(y,rev(y),p.axis>0.5);dst[y*${N}u+x]=src[yy*${N}u+xx];}`;
const renderShader=`struct Params {time:f32,wind:f32,speed:f32,sea:f32,axis:f32,stage:f32,mode:f32,pad:f32};@group(0) @binding(0) var<storage,read> waves:array<vec4f>;@group(0) @binding(1) var<uniform> p:Params;struct Camera{aspect:f32,yaw:f32,pitch:f32,dist:f32};@group(0) @binding(2) var<uniform> cam:Camera;struct VOut{@builtin(position) pos:vec4f,@location(0) world:vec3f,@location(1) norm:vec3f,@location(2) foam:f32,@location(3) view:vec3f};fn h(x:i32,y:i32)->f32{let xx=u32((x+${N*8})%${N});let yy=u32((y+${N*8})%${N});let v=waves[yy*${N}u+xx].x/f32(${N*N});return v*200.0*select(1.0,-1.0,(xx+yy)%2u==1u);}

@fragment fn fs(i:VOut)->@location(0) vec4f{let n=normalize(i.norm);let v=normalize(i.view);let sun=normalize(vec3f(-.35,.28,.89));let ndv=clamp(dot(n,v),0.0,1.0);let fres=.02+.98*pow(1.0-ndv,5.0);let sky=vec3f(.24,.42,.61)+vec3f(.7,.34,.11)*pow(max(dot(v,sun),0.0),7.0);let diffuse=vec3f(.015,.14,.20)+vec3f(.035,.11,.12)*max(dot(n,sun),0.0);let reflected=reflect(-v,n);let glitter=pow(max(dot(reflected,sun),0.0),220.0)*2.8+pow(max(dot(reflected,sun),0.0),16.0)*.18;let grain=fract(sin(dot(i.world.xz,vec2f(17.13,89.23)))*43758.5);let foam=clamp(i.foam*(.55+.45*grain),0.0,.8);let col=mix(diffuse,sky,fres)+vec3f(1.0,.75,.42)*glitter;let color=mix(col,vec3f(.78,.86,.86),foam*.55);let distance=length(i.view);let fog=1.0-exp(-distance*.006);color=mix(color,vec3f(.27,.43,.58),fog);color=color/(color+vec3f(1.0));color=pow(color,vec3f(.83));return vec4f(color,1.0);}`;
function makeShader(code){return device.createShaderModule({code})}function storage(){return device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST})}function setParams(axis=0,stage=0){device.queue.writeBuffer(uniform,0,new Float32Array([clock,settings.wind*Math.PI/180,settings.speed,settings.sea,axis,stage,0,0]))}
function computeBind(pipe,a,b,u=uniform){return device.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:a}},{binding:1,resource:{buffer:b}},{binding:2,resource:{buffer:u}}]})}
async function init(){if(!navigator.gpu){throw Error('瀏覽器不支援 WebGPU，請使用支援 WebGPU 的最新版 Chrome 或 Edge。')}const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('裝置未提供 WebGPU GPU adapter');device=await adapter.requestDevice();device.lost.then(e=>status.textContent='GPU 連線中斷：'+e.message);context=canvas.getContext('webgpu');format=navigator.gpu.getPreferredCanvasFormat();context.configure({device,format,alphaMode:'opaque'});uniform=device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});bufA=storage();bufB=storage();let module=makeShader(shader);computePipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'evolve'}});fftPipe=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'butterfly'}});let revModule=makeShader(reverseShader);let reversePipe=device.createComputePipeline({layout:'auto',compute:{module:revModule,entryPoint:'main'}});let camBuf=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});let mesh=[];let idx=[];const grid=220;for(let y=0;y<=grid;y++)for(let x=0;x<=grid;x++)mesh.push(x/grid,y/grid);for(let y=0;y<grid;y++)for(let x=0;x<grid;x++){let a=y*(grid+1)+x,b=a+grid+1;idx.push(a,b,a+1,b,b+1,a+1)}indices=idx.length;meshV=device.createBuffer({size:mesh.length*4,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST});device.queue.writeBuffer(meshV,0,new Float32Array(mesh));meshI=device.createBuffer({size:idx.length*4,usage:GPUBufferUsage.INDEX|GPUBufferUsage.COPY_DST});device.queue.writeBuffer(meshI,0,new Uint32Array(idx));let rm=makeShader(renderShader);renderPipeline=device.createRenderPipeline({layout:'auto',vertex:{module:rm,entryPoint:'vs',buffers:[{arrayStride:8,attributes:[{shaderLocation:0,offset:0,format:'float32x2'}]}]},fragment:{module:rm,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list',cullMode:'none'}});

let passParams=[];for(let axis=0;axis<2;axis++){let row=[];for(let st=0;st<7;st++)row.push(device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST}));passParams.push(row)}let evolveBG=computeBind(computePipeline,bufA,bufB),reverseAB=passParams.map((r,i)=>computeBind(reversePipe,bufA,bufB,r[0])),reverseBA=passParams.map((r,i)=>computeBind(reversePipe,bufB,bufA,r[0])),fftAB=passParams.map(r=>r.slice(1).map(u=>computeBind(fftPipe,bufA,bufB,u))),fftBA=passParams.map(r=>r.slice(1).map(u=>computeBind(fftPipe,bufB,bufA,u)));
function resize(){let dpr=Math.min(device.limits.maxTextureDimension2D/window.innerWidth,device.limits.maxTextureDimension2D/window.innerHeight,devicePixelRatio||1)*settings.quality;canvas.width=Math.max(1,Math.floor(innerWidth*dpr));canvas.height=Math.max(1,Math.floor(innerHeight*dpr))}addEventListener('resize',resize);resize();status.textContent='WebGPU FFT 已啟動';
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.05);last=now;if(!paused)clock+=dt;setParams();device.queue.writeBuffer(camBuf,0,new Float32Array([canvas.width/canvas.height,camera.yaw,camera.pitch,camera.dist]));let enc=device.createCommandEncoder();let pass=enc.beginComputePass();function dispatch(pipe,bg){pass.setPipeline(pipe);pass.setBindGroup(0,bg);pass.dispatchWorkgroups(8,8)}dispatch(computePipeline,evolveBG);let current=bufB;for(let axis=0;axis<2;axis++){device.queue.writeBuffer(passParams[axis][0],0,new Float32Array([clock,settings.wind*Math.PI/180,settings.speed,settings.sea,axis,0,0,0]));dispatch(reversePipe,current===bufB?reverseBA[axis]:reverseAB[axis]);current=current===bufB?bufA:bufB;for(let st=0;st<6;st++){device.queue.writeBuffer(passParams[axis][st+1],0,new Float32Array([clock,settings.wind*Math.PI/180,settings.speed,settings.sea,axis,st,0,0]));dispatch(fftPipe,current===bufA?fftAB[axis][st]:fftBA[axis][st]);current=current===bufA?bufB:bufA;}}pass.end();setParams();let view=context.getCurrentTexture().createView();let rp=enc.beginRenderPass({colorAttachments:[{view,clearValue:{r:.20,g:.33,b:.49,a:1},loadOp:'clear',storeOp:'store'}]});rp.setPipeline(renderPipeline);rp.setBindGroup(0,bindRender(current));rp.setVertexBuffer(0,meshV);rp.setIndexBuffer(meshI,'uint32');rp.drawIndexed(indices);rp.end();device.queue.submit([enc.finish()]);updateSound(dt)}requestAnimationFrame(frame)}
// Web Audio: four independent shaped noise bands with staggered envelopes.
let audio=null,audioOn=false,noiseNodes=[],master=null,phase=0;function createAudio(){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=0;let limiter=audio.createDynamicsCompressor();limiter.threshold.value=-14;limiter.ratio.value=4;master.connect(limiter);limiter.connect(audio.destination);const len=audio.sampleRate*3;for(let k=0;k<4;k++){let b=audio.createBuffer(1,len,audio.sampleRate),d=b.getChannelData(0);let prev=0;for(let i=0;i<len;i++){let v=Math.random()*2-1;prev=prev*.86+v*.14;d[i]=k===0?prev:v}let src=audio.createBufferSource();src.buffer=b;src.loop=true;let filter=audio.createBiquadFilter();filter.type=k<2?'lowpass':'bandpass';filter.frequency.value=[180,550,1600,3900][k];filter.Q.value=[.4,.7,.6,1][k];let gain=audio.createGain();gain.gain.value=0;src.connect(filter);filter.connect(gain);gain.connect(master);src.start();noiseNodes.push(gain)}}function updateSound(dt){if(!audio||!audioOn)return;phase+=dt*(.27+settings.sea*.08);let t=audio.currentTime;let swell=.55+.45*Math.sin(phase*2*Math.PI),crash=Math.pow(Math.max(0,Math.sin(phase*2*Math.PI-.6)),3),foam=Math.pow(Math.max(0,Math.sin(phase*2*Math.PI-1.6)),2);let env=[.28+.3*swell,.13+.3*crash,.035+.21*crash,.018+.12*foam];for(let i=0;i<4;i++)noiseNodes[i].gain.gain.setTargetAtTime(env[i]*(.5+settings.sea*.45),t,.15);master.gain.setTargetAtTime(+$('volume').value/100,t,.08)}$('sound').onclick=async()=>{if(!audio)createAudio();await audio.resume();audioOn=!audioOn;master.gain.setTargetAtTime(audioOn?+$('volume').value/100:0,audio.currentTime,.08);$('sound').textContent=audioOn?'靜音':'啟動海浪聲'};
$('sea').onchange=e=>{settings.sea=+e.target.value;settings.speed=[6,11,17][settings.sea];$('speed').value=settings.speed};$('wind').oninput=e=>settings.wind=+e.target.value;$('speed').oninput=e=>settings.speed=+e.target.value;$('quality').onchange=e=>{settings.quality=+e.target.value;dispatchEvent(new Event('resize'))};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續':'暫停'};$('reset').onclick=()=>camera={yaw:.18,pitch:.12,dist:48};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('toggle').onclick=()=>{let p=$('panel');p.hidden=!p.hidden;$('toggle').textContent=p.hidden?'顯示設定':'隱藏設定'};canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer)return;camera.yaw+=(e.clientX-pointer.x)*.006;camera.pitch=Math.max(-.25,Math.min(.85,camera.pitch+(pointer.y-e.clientY)*.005));pointer={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('wheel',e=>{e.preventDefault();camera.dist=Math.max(16,Math.min(90,camera.dist+e.deltaY*.035))},{passive:false});init().catch(e=>{status.textContent='無法啟動：'+e.message;console.error(e)});
