  const choices = ['0.75', '1', '1.5', 'native'];
  let selected = mobile ? '1' : 'native';
  try {
    const saved = localStorage.getItem(settingsKey);
    if (choices.includes(saved)) selected = saved;
  } catch (_) { /* private browsing might disable storage */ }

  quality.value = cfg.quality;

  // v0.31：只切換原作者 HUD 的可見性。原有 FPS 統計持續供程式使用，

  const debugToggle = $('fft-debug-toggle');

  debugToggle.addEventListener('change', function () {

    const canvas = $('c');
    if (!debugToggle.checked && canvas && canvas.width) state.textContent = '海浪運行中';
  });

  function applyQuality() {
    cfg.quality = quality.value;
    cfg.effectiveDpr = cfg.quality === 'native' ? null : Number(cfg.quality);
    try { localStorage.setItem(cfg.settingsKey, cfg.quality); } catch (_) {}
    window.dispatchEvent(new Event('resize'));

  $('fft-show-ocean').addEventListener('click', function () {

    knob.style.transform = 'translate(0px,0px)';

    const length = Math.hypot(dx, dy);
    const scale = length > maxRadius ? maxRadius / length : 1;

  // actual framebuffer resolution to #fps. We display only measured values.

    const canvas = $('c');
    const hud = $('fps');
    const info = hud ? hud.textContent || '' : '';
    if (info.includes('fps')) {
      renderStatus.textContent = 'WebGPU 運行中';
    } else if (!navigator.gpu) {
      renderStatus.textContent = '無 WebGPU';
    }
    const engineError = $('err');
    if (!navigator.gpu) {
      renderStatus.textContent = '無 WebGPU';
      state.textContent = '此瀏覽器無法使用 WebGPU。請使用相容瀏覽器，或改用 WebGL 版本。';

      const input = row.querySelector('input');
      if (!name || !input) continue;
