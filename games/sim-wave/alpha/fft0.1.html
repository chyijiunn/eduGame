<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FFT Ocean v0.1 — Adaptive</title><style>body{margin:0;background:#07111b;color:#eee;font:15px system-ui;display:grid;place-items:center;min-height:100vh}main{max-width:450px;padding:30px}button{padding:12px;border:0;border-radius:8px}small{opacity:.7}</style><main><h2>Ocean FFT + Sound</h2><p id="status">正在載入原作 WebGPU FFT 海洋引擎…</p><small>首次載入需要網路。原始海洋渲染：Noniv/web-ocean (MIT)。本版本新增程序化音效。</small></main><script>
const sources=['https://cdn.jsdelivr.net/gh/Noniv/web-ocean@main/ocean.min.html','https://raw.githubusercontent.com/Noniv/web-ocean/main/ocean.min.html'];
const addon=String.raw`<style id="audio-style">#audio-panel{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:14px;z-index:99999;background:#09131cdd;color:#fff;padding:12px;border:1px solid #ffffff30;border-radius:12px;font:13px system-ui;backdrop-filter:blur(12px);max-width:calc(100vw - 52px);box-sizing:border-box} @media(max-width:700px){#audio-panel{padding:8px;left:8px;bottom:max(8px,env(safe-area-inset-bottom));font-size:12px}#audio-panel button,#audio-panel select{padding:5px;margin:2px}}#audio-panel button,#audio-panel select{background:#27394a;color:#fff;border:1px solid #526779;border-radius:6px;padding:7px;margin:3px}#audio-panel input{vertical-align:middle;accent-color:#8fc6e9}#audio-panel .sub{font-size:11px;opacity:.75}</style><div id="audio-panel"><div><button id="audio-toggle">啟用海浪聲</button><button id="audio-mute">靜音</button><select id="audio-sea"><option value="0.55">平靜</option><option value="1" selected>一般</option><option value="1.55">洶湧</option></select></div><label>音量 <input id="audio-volume" type="range" min="0" max="100" value="55"></label><div class="sub">FFT Ocean v0.1 · 聲音獨立控制 · 行動裝置建議降低原作畫質</div></div><script type="module">
const toggle=document.getElementById('audio-toggle'),mute=document.getElementById('audio-mute'),volume=document.getElementById('audio-volume'),sea=document.getElementById('audio-sea');let ctx,master,noiseBuffer,active=false,muted=false,tick,phase=0;
function makeNoise(seconds){let b=ctx.createBuffer(2,Math.ceil(ctx.sampleRate*seconds),ctx.sampleRate);for(let c=0;c<2;c++){let a=b.getChannelData(c),last=0;for(let i=0;i<a.length;i++){last=(last+0.035*(Math.random()*2-1))/1.035;a[i]=last*3.3}}return b}
function loopNoise(freq,q,gain,pan){let s=ctx.createBufferSource();s.buffer=noiseBuffer;s.loop=true;let f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;let g=ctx.createGain();g.gain.value=gain;let p=ctx.createStereoPanner();p.pan.value=pan;s.connect(f).connect(g).connect(p).connect(master);s.start();return {g,f,p}}
async function start(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;let comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;master.connect(comp).connect(ctx.destination);noiseBuffer=makeNoise(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)?3:6);let layers=[loopNoise(105,.5,.5,-.22),loopNoise(480,.7,.2,.24),loopNoise(1450,.55,.13,-.12),loopNoise(3200,.8,.06,.2)];let t0=ctx.currentTime;tick=setInterval(()=>{let t=ctx.currentTime-t0;let k=Number(sea.value);let wave=.5+.5*Math.sin(t*.42+Math.sin(t*.14)*.7);let burst=Math.pow(Math.max(0,Math.sin(t*.55+1)),5);layers[0].g.gain.setTargetAtTime((.22+.26*wave)*k,ctx.currentTime,.3);layers[1].g.gain.setTargetAtTime((.08+.22*burst)*k,ctx.currentTime,.2);layers[2].g.gain.setTargetAtTime((.04+.13*burst)*k,ctx.currentTime,.12);layers[3].g.gain.setTargetAtTime((.02+.07*burst)*k,ctx.currentTime,.12);layers[1].p.pan.setTargetAtTime(Math.sin(t*.15)*.35,ctx.currentTime,.8)},180)}await ctx.resume();active=true;sync()}
function sync(){if(ctx)master.gain.setTargetAtTime(active&&!muted?Math.pow(Number(volume.value)/100,1.6)*.8:0,ctx.currentTime,.08);toggle.textContent=active?'暫停聲音':'啟用海浪聲';mute.textContent=muted?'取消靜音':'靜音'}
toggle.onclick=async()=>{try{if(!active)await start();else{active=false;sync()}}catch(e){toggle.textContent='音訊啟動失敗';console.error(e)}};mute.onclick=()=>{muted=!muted;sync()};volume.oninput=sync;document.addEventListener('visibilitychange',()=>{if(ctx){if(document.hidden)ctx.suspend();else if(active)ctx.resume()}});window.addEventListener('pagehide',()=>{if(ctx)ctx.suspend()});
<\/script>`;
(async()=>{try{let html='',errors=[];for(const source of sources){try{const r=await fetch(source,{cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);html=await r.text();if(html.includes('navigator.gpu'))break;throw Error('invalid source')}catch(e){errors.push(e.message)}}if(!html.includes('navigator.gpu'))throw Error(errors.join('; '));if(!html.includes('navigator.gpu')||!html.includes('<'+'/body>'))throw Error('來源格式不符');html=html.replace(/<\/body>/i,addon.replace('<\\/script>','<'+'/script>')+'<'+'/body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='無法載入海洋引擎：'+e.message+'。請確認網路連線及瀏覽器支援 WebGPU。'}})();
</script></html>
