<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ocean Simulator v6 · FFT + Sound</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050d16;color:#fff;font:14px system-ui,sans-serif;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#ui{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(95vw,580px);background:#091523df;backdrop-filter:blur(14px);border:1px solid #ffffff35;border-radius:16px;padding:14px;box-shadow:0 8px 40px #0008}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}small{opacity:.7}button,select,input{accent-color:#8cd4f4}button,select{background:#17334a;color:white;border:1px solid #ffffff40;border-radius:9px;padding:9px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #fff}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.controls label{display:flex;align-items:center;gap:6px}input[type=range]{width:90px}#status{font-size:12px;opacity:.8;margin-top:8px}#fallback{display:none;position:absolute;top:20%;left:10%;right:10%;text-align:center;background:#091523ee;padding:20px;border-radius:15px}a{color:#9ad9ff}#collapse{padding:4px 9px}#ui.min .controls,#ui.min #status{display:none}#ui.min{width:auto;min-width:220px}@media(max-width:480px){#ui{padding:10px}.controls{gap:6px}button,select{padding:8px}}</style></head><body><iframe id="ocean" title="原作者 WebGPU FFT 海浪" allow="fullscreen" referrerpolicy="no-referrer" src="https://ocean-noniv.vercel.app/"></iframe><div id="fallback">原作頁面可能無法被嵌入，或瀏覽器不支援 WebGPU。<p><a href="https://ocean-noniv.vercel.app/" target="_blank" rel="noopener">直接開啟原作者海浪</a></p></div><section id="ui"><header><strong>Ocean · FFT + Audio</strong><span><small>v6.0 線上版</small> <button id="collapse" aria-label="收合面板">−</button></span></header><div class="controls"><button id="play">啟用海浪聲</button><label>海況 <select id="sea"><option value="calm">平靜</option><option value="normal" selected>一般</option><option value="rough">洶湧</option></select></label><label>音量 <input id="vol" type="range" min="0" max="100" value="55" aria-label="音量"><output id="pct">55%</output></label><button id="mute">靜音</button></div><div id="status">畫面由原作者線上渲染；音效為獨立程序合成，尚非逐浪同步。首次播放需點擊啟用。</div></section><script>
const $=id=>document.getElementById(id),play=$('play'),mute=$('mute'),sea=$('sea'),vol=$('vol');let ctx,master,low,high,noiseSource,playing=false,muted=false,phase=0,raf=0;
function noiseBuffer(c){let b=c.createBuffer(1,c.sampleRate*4,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-18;limiter.ratio.value=3;master.connect(limiter).connect(ctx.destination);noiseSource=ctx.createBufferSource();noiseSource.buffer=noiseBuffer(ctx);noiseSource.loop=true;low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.value=330;high=ctx.createBiquadFilter();high.type='bandpass';high.frequency.value=1350;high.Q.value=.5;const lowGain=ctx.createGain(),highGain=ctx.createGain();lowGain.gain.value=.7;highGain.gain.value=.24;noiseSource.connect(low).connect(lowGain).connect(master);noiseSource.connect(high).connect(highGain).connect(master);noiseSource.start()}
function tick(){if(!ctx)return;const t=ctx.currentTime,k=sea.value==='calm'?.55:sea.value==='rough'?1.5:1;const envelope=Math.pow(.5+.5*Math.sin(t*(sea.value==='rough'?1.2:.68)+.45*Math.sin(t*.13)),2);const level=(.09+.25*envelope)*k*(muted?0:Number(vol.value)/100);master.gain.setTargetAtTime(playing?level:0,t,.13);low.frequency.setTargetAtTime(210+320*envelope,t,.25);high.frequency.setTargetAtTime(750+1400*envelope,t,.2);raf=requestAnimationFrame(tick)}
play.onclick=async()=>{try{if(!ctx){init();tick()}if(playing){playing=false;play.textContent='繼續海浪聲';}else{await ctx.resume();playing=true;play.textContent='暫停海浪聲';} }catch(e){$('status').textContent='音效啟動失敗：'+e.message}};
mute.onclick=()=>{muted=!muted;mute.textContent=muted?'取消靜音':'靜音'};vol.oninput=()=>{$('pct').textContent=vol.value+'%'};$('collapse').onclick=()=>{const el=$('ui');el.classList.toggle('min');$('collapse').textContent=el.classList.contains('min')?'+':'−'};
$('ocean').addEventListener('error',()=>{$('fallback').style.display='block'});
</script></body></html>
