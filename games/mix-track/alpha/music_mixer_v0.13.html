<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="/eduGame/ga4.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Music Mixer v0.13</title>
<style>
  :root {
    --bg: #09100d;
    --panel: #101714;
    --panel-2: #121c17;
    --track: #0f1713;
    --track-inner: #102317;
    --accent: #1f7a4d;
    --accent-2: #30b86a;
    --yellow: #ffd84c;
    --red: #da3f3f;
    --green: #33c46a;
    --text: #f5f7f6;
    --muted: #aab6af;
    --border: rgba(255,255,255,.08);
    --shadow: 0 10px 26px rgba(0,0,0,.3);
    --btn: #1a2320;
    --btn-hover: #24312c;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: radial-gradient(circle at top, #18231c 0%, var(--bg) 45%, #050806 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .workspace-shell {
    flex: 1;
    padding: 14px 14px 8px;
  }

  .workspace-frame {
    width: 100%;
    min-height: calc(100dvh - 132px);
    border-radius: 24px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
    box-shadow: var(--shadow);
    padding: 16px;
  }

  .tracks {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .track {
    width: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.02));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 12px;
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr) 58px 148px;
    gap: 12px;
    align-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.02), 0 12px 22px rgba(0,0,0,.14);
  }

  .record-wrap,
  .play-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-base,
  .transport-btn,
  .small-btn,
  .pill-btn {
    border: none;
    outline: none;
    cursor: pointer;
    color: var(--text);
    background: var(--btn);
    transition: transform .15s ease, background .15s ease, opacity .15s ease;
    box-shadow: 0 10px 18px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .btn-base:hover,
  .transport-btn:hover,
  .small-btn:hover,
  .pill-btn:hover { background: var(--btn-hover); }
  .btn-base:active,
  .transport-btn:active,
  .small-btn:active,
  .pill-btn:active { transform: translateY(1px) scale(.98); }

  .record-btn {
    width: 54px;
    height: 54px;
    border-radius: 999px;
    position: relative;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.14), rgba(255,255,255,0) 40%), #241414;
    border: 1px solid rgba(255,255,255,.06);
  }
  .record-btn::before {
    content: "";
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: var(--red);
    display: block;
    margin: auto;
    box-shadow: 0 0 12px rgba(218,63,63,.58);
    transition: all .15s ease;
  }
  .record-btn.recording {
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.15), rgba(255,255,255,0) 40%), #102116;
  }
  .record-btn.recording::before {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: var(--green);
    box-shadow: 0 0 16px rgba(51,196,106,.55);
  }

  .wave-wrap {
    position: relative;
    height: 104px;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.06);
    background:
      linear-gradient(180deg, rgba(58, 255, 156, .06), rgba(58, 255, 156, .015)),
      linear-gradient(180deg, rgba(9, 18, 14, .94), rgba(14, 31, 20, .98));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.015), inset 0 0 22px rgba(0,0,0,.24);
  }
  .wave-wrap.empty::after {
    content: "等待錄音";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.28);
    font-size: 14px;
    letter-spacing: .08em;
    pointer-events: none;
  }
  .wave-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .playhead {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, rgba(255,240,169,.2), rgba(255,216,76,1), rgba(255,240,169,.25));
    box-shadow: 0 0 14px rgba(255,216,76,.68);
    left: 0;
    opacity: 0;
    pointer-events: none;
  }
  .playhead.active { opacity: 1; }
  .countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.36);
    color: white;
    font-size: 40px;
    font-weight: 800;
    text-shadow: 0 4px 16px rgba(0,0,0,.45);
    backdrop-filter: blur(3px);
    pointer-events: none;
  }
  .track.counting .countdown { display: flex; }

  .track-meta {
    position: absolute;
    left: 12px;
    bottom: 9px;
    font-size: 11px;
    color: rgba(255,255,255,.62);
    background: rgba(0,0,0,.18);
    border-radius: 999px;
    padding: 4px 8px;
    border: 1px solid rgba(255,255,255,.06);
    pointer-events: none;
  }

  .play-btn {
    width: 46px;
    height: 46px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, #16201b, #121814);
    border: 1px solid rgba(255,255,255,.05);
  }
  .play-btn .icon-play,
  .play-btn .icon-stop { display: block; }
  .play-btn.playing .icon-play { display: none; }
  .play-btn:not(.playing) .icon-stop { display: none; }

  .volume-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .volume-icon {
    font-size: 18px;
    color: rgba(255,255,255,.82);
    user-select: none;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: #fff7d0;
    border: 2px solid #242824;
    box-shadow: 0 2px 10px rgba(0,0,0,.34);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: #fff7d0;
    border: 2px solid #242824;
    box-shadow: 0 2px 10px rgba(0,0,0,.34);
    cursor: pointer;
  }

  .bottom-bar {
    position: sticky;
    bottom: 0;
    padding: 10px 14px 14px;
    background: linear-gradient(180deg, rgba(9,16,13,0), rgba(9,16,13,.68) 28%, rgba(9,16,13,.92) 100%);
  }
  .bottom-controls {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(14, 18, 16, .86);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }
  .transport-btn {
    width: 74px;
    height: 74px;
    border-radius: 18px;
    background: linear-gradient(180deg, #171f1b, #111714);
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.06);
  }
  .transport-btn svg { width: 30px; height: 30px; }
  .transport-btn.exporting {
    opacity: .72;
    cursor: wait;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.42);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    backdrop-filter: blur(8px);
    padding: 18px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    width: min(560px, 100%);
    max-height: min(88dvh, 920px);
    overflow: auto;
    background: linear-gradient(180deg, rgba(22,29,25,.98), rgba(15,21,18,.98));
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 24px;
    padding: 18px 18px 16px;
    box-shadow: 0 28px 70px rgba(0,0,0,.5);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .modal-close {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.06);
  }
  .setting-group {
    padding: 14px 2px;
    border-top: 1px solid rgba(255,255,255,.06);
  }
  .setting-group:first-of-type { border-top: none; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 10px 0;
  }
  .setting-label {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .setting-label strong { font-size: 15px; }
  .setting-label span {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }
  .seg { display: inline-flex; gap: 10px; align-items: center; }
  .stepper { display: inline-flex; align-items: center; gap: 8px; }
  .stepper-value { min-width: 28px; text-align: center; font-weight: 700; }
  .pill-btn {
    min-width: 42px;
    height: 42px;
    padding: 0 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.06);
    background: linear-gradient(180deg, #171f1b, #101512);
    color: var(--text);
  }
  .danger-btn {
    background: linear-gradient(180deg, #381717, #241111);
  }
  .time-wrap { min-width: 220px; }
  .time-value {
    text-align: right;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 6px;
    color: #fff3b4;
  }

  .switch {
    position: relative;
    width: 56px;
    height: 32px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.06);
    cursor: pointer;
    transition: background .18s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    left: 3px;
    top: 3px;
    border-radius: 999px;
    background: white;
    transition: transform .18s ease;
  }
  .switch.on { background: rgba(34, 174, 95, .6); }
  .switch.on::after { transform: translateX(24px); }

  @media (max-width: 860px) {
    .workspace-frame { min-height: calc(100dvh - 122px); padding: 12px; }
    .track { grid-template-columns: 64px minmax(0, 1fr) 54px 128px; gap: 10px; padding: 10px; }
    .wave-wrap { height: 92px; }
    .record-btn { width: 48px; height: 48px; }
    .transport-btn { width: 68px; height: 68px; }
  }

  @media (max-width: 680px) {
    .workspace-shell { padding: 10px 10px 6px; }
    .workspace-frame { min-height: calc(100dvh - 114px); padding: 10px; border-radius: 20px; }
    .track {
      grid-template-columns: 58px minmax(0, 1fr) 50px;
      grid-template-areas:
        "record wave play"
        "volume volume volume";
      gap: 8px;
    }
    .record-wrap { grid-area: record; }
    .wave-cell { grid-area: wave; min-width: 0; }
    .play-wrap { grid-area: play; }
    .volume-wrap { grid-area: volume; padding: 0 4px 2px; }
    .wave-wrap { height: 82px; }
    .record-btn { width: 46px; height: 46px; }
    .play-btn { width: 44px; height: 44px; }
    .bottom-bar { padding: 8px 10px 10px; }
    .bottom-controls { padding: 10px; gap: 12px; border-radius: 18px; }
    .transport-btn { width: 62px; height: 62px; border-radius: 16px; }
    .transport-btn svg { width: 28px; height: 28px; }
    .modal { padding: 14px; border-radius: 20px; }
    .setting-row { align-items: flex-start; flex-direction: column; }
    .seg, .time-wrap { width: 100%; }
    .stepper { align-self: flex-end; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="workspace-shell">
    <div class="workspace-frame">
      <div class="tracks" id="tracks"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-controls">
      <button class="transport-btn" id="playAllBtn" aria-label="全部播放" title="全部播放">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M21 14l28 18-28 18z"></path></svg>
      </button>
      <button class="transport-btn" id="stopAllBtn" aria-label="全部暫停" title="全部暫停">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M18 18h28v28H18z"></path></svg>
      </button>
      <button class="transport-btn" id="settingsBtn" aria-label="更多設定" title="更多設定">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <circle cx="16" cy="32" r="5"></circle>
          <circle cx="32" cy="32" r="5"></circle>
          <circle cx="48" cy="32" r="5"></circle>
        </svg>
      </button>
      <button class="transport-btn" id="exportMixBtn" aria-label="下載混音" title="下載混音">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M32 12v24"></path>
          <path d="M22 28l10 10 10-10"></path>
          <path d="M14 48h36"></path>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <div class="modal-title" id="settingsTitle">更多設定</div>
      <button class="small-btn modal-close" id="modalCloseBtn" aria-label="關閉">✕</button>
    </div>

    <div class="setting-group">
      <div class="setting-row">
        <div class="setting-label">
          <strong>軌道數量</strong>
          <span>可增加或減少軌道，範圍 1～8 軌。</span>
        </div>
        <div class="stepper">
          <button class="pill-btn" id="removeTrackBtn">－</button>
          <div class="stepper-value" id="trackCountValue">4</div>
          <button class="pill-btn" id="addTrackBtn">＋</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <strong>清除全部</strong>
          <span>清空目前所有已錄製內容，並同步更新瀏覽器暫存。</span>
        </div>
        <div class="seg">
          <button class="pill-btn danger-btn" id="clearAllBtn">清除</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <strong>刪除暫存</strong>
          <span>清除瀏覽器內保存的錄音與設定，重新整理後也不會復原。</span>
        </div>
        <div class="seg">
          <button class="pill-btn danger-btn" id="deleteCacheBtn">刪除暫存</button>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-row">
        <div class="setting-label">
          <strong>軌道時間</strong>
          <span>預設 4 秒。變更時間會刪除全部已錄製原檔。</span>
        </div>
        <div class="time-wrap">
          <input type="range" id="durationSlider" min="2" max="12" step="0.5" value="4" />
          <div class="time-value" id="durationValue">4.0 秒</div>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-row">
        <div class="setting-label">
          <strong>循環播放</strong>
          <span>全部播放或單軌播放時，自動循環。</span>
        </div>
        <button class="switch on" id="loopSwitch" aria-pressed="true"></button>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <strong>倒數錄音</strong>
          <span>開始錄音前顯示 3、2、1 倒數。</span>
        </div>
        <button class="switch" id="countdownSwitch" aria-pressed="false"></button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const tracksEl = document.getElementById('tracks');
  const trackCountValue = document.getElementById('trackCountValue');
  const durationSlider = document.getElementById('durationSlider');
  const durationValue = document.getElementById('durationValue');
  const loopSwitch = document.getElementById('loopSwitch');
  const countdownSwitch = document.getElementById('countdownSwitch');
  const modalBackdrop = document.getElementById('modalBackdrop');

  const MAX_TRACKS = 8;
  const MIN_TRACKS = 1;
  const DB_NAME = 'musicMixer_v013_cache';
  const STORE_NAME = 'kv';
  const STATE_KEY = 'state';

  let loopDuration = 4;
  let trackCount = 4;
  let loopEnabled = true;
  let countdownEnabled = false;
  let tracks = [];
  let mediaStream = null;
  let audioCtx = null;
  let analyser = null;
  let analyserSource = null;
  let globalPlayback = null;
  let dbPromise = null;

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function setSwitch(btn, on) {
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
  }

  function createTrack(index) {
    return {
      id: index,
      label: index + 1,
      volume: 1,
      blob: null,
      buffer: null,
      recorder: null,
      recording: false,
      counting: false,
      autoStopTimer: null,
      recordToken: 0,
      player: null,
      gainNode: null,
      playheadRaf: 0,
      playheadActive: false,
      elements: null
    };
  }

  function renderTracks() {
    tracksEl.innerHTML = '';
    tracks.forEach(track => {
      const trackEl = document.createElement('section');
      trackEl.className = 'track';
      trackEl.dataset.id = track.id;
      trackEl.innerHTML = `
        <div class="record-wrap">
          <button class="btn-base record-btn" aria-label="錄音"></button>
        </div>
        <div class="wave-cell">
          <div class="wave-wrap empty">
            <canvas class="wave-canvas"></canvas>
            <div class="playhead"></div>
            <div class="countdown">3</div>
            <div class="track-meta">軌 ${track.label} · ${loopDuration.toFixed(1)}s</div>
          </div>
        </div>
        <div class="play-wrap">
          <button class="btn-base play-btn" aria-label="播放 / 停止">
            <svg class="icon-play" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M21 14l28 18-28 18z"></path></svg>
            <svg class="icon-stop" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M18 18h28v28H18z"></path></svg>
          </button>
        </div>
        <div class="volume-wrap">
          <div class="volume-icon">🔊</div>
          <input class="volume-slider" type="range" min="0" max="1" step="0.01" value="${track.volume}">
        </div>
      `;
      tracksEl.appendChild(trackEl);
      track.elements = {
        root: trackEl,
        recordBtn: trackEl.querySelector('.record-btn'),
        waveWrap: trackEl.querySelector('.wave-wrap'),
        canvas: trackEl.querySelector('.wave-canvas'),
        playhead: trackEl.querySelector('.playhead'),
        countdown: trackEl.querySelector('.countdown'),
        meta: trackEl.querySelector('.track-meta'),
        playBtn: trackEl.querySelector('.play-btn'),
        volumeSlider: trackEl.querySelector('.volume-slider')
      };
      setupTrackEvents(track);
      resizeCanvas(track);
      redrawTrack(track);
      syncTrackUI(track);
    });
    trackCountValue.textContent = String(tracks.length);
  }

  function resizeCanvas(track) {
    const canvas = track.elements.canvas;
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(rect.width * ratio));
    canvas.height = Math.max(1, Math.floor(rect.height * ratio));
    redrawTrack(track);
  }

  function syncTrackUI(track) {
    if (!track.elements) return;
    track.elements.meta.textContent = `軌 ${track.label} · ${loopDuration.toFixed(1)}s`;
    track.elements.recordBtn.classList.toggle('recording', track.recording);
    track.elements.root.classList.toggle('counting', track.counting);
    track.elements.waveWrap.classList.toggle('empty', !track.buffer && !track.recording);
    track.elements.playBtn.classList.toggle('playing', !!track.player);
    track.elements.volumeSlider.value = track.volume;
  }

  function setupTrackEvents(track) {
    track.elements.recordBtn.addEventListener('click', async () => {
      await onRecordPressed(track);
    });
    track.elements.playBtn.addEventListener('click', async () => {
      await toggleSingleTrackPlayback(track);
    });
    track.elements.volumeSlider.addEventListener('input', async (e) => {
      track.volume = parseFloat(e.target.value);
      if (track.gainNode) track.gainNode.gain.value = track.volume;
      redrawTrack(track);
      await saveState();
    });
  }

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    return audioCtx;
  }

  async function ensureMic() {
    if (!mediaStream) {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
    }
    const ctx = ensureAudioContext();
    if (audioCtx.state === 'suspended') {
      try { await audioCtx.resume(); } catch (_) {}
    }
    if (!analyserSource) {
      analyserSource = ctx.createMediaStreamSource(mediaStream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.78;
      analyserSource.connect(analyser);
    }
  }

  function pickRecorderOptions() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      ''
    ];
    for (const mimeType of candidates) {
      if (!mimeType || (window.MediaRecorder && MediaRecorder.isTypeSupported?.(mimeType))) {
        return mimeType ? { mimeType } : {};
      }
    }
    return {};
  }

  function cropBufferToDuration(buffer, seconds, ctx) {
    const sampleRate = buffer.sampleRate;
    const desiredFrames = Math.max(1, Math.floor(seconds * sampleRate));
    const frameCount = Math.min(desiredFrames, buffer.length);
    const out = ctx.createBuffer(buffer.numberOfChannels, desiredFrames, sampleRate);
    for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
      const source = buffer.getChannelData(ch);
      const target = out.getChannelData(ch);
      target.fill(0);
      if (frameCount > 0) {
        target.set(source.slice(0, frameCount), 0);
      }
    }
    return out;
  }

  async function decodeBlobToBuffer(blob) {
    if (!blob) return null;
    const ctx = ensureAudioContext();
    const ab = await blob.arrayBuffer();
    return await ctx.decodeAudioData(ab.slice(0));
  }

  function mixToMono(buffer) {
    const length = buffer.length;
    const out = new Float32Array(length);
    for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < length; i++) out[i] += data[i] / buffer.numberOfChannels;
    }
    return out;
  }

  function drawQuarterGrid(ctx, w, h, ratio) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1 * ratio;
    const xMid = w / 2;
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();

    for (let i = 1; i <= 3; i++) {
      const x = (w / 4) * i;
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,216,76,0.55)';
      ctx.lineWidth = 2 * ratio;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, 10 * ratio);
      ctx.moveTo(x, h - 10 * ratio);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLiveWave(ctx, w, h, ratio) {
    if (!analyser) return;
    const bufferLength = analyser.fftSize;
    const data = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(data);
    ctx.save();
    ctx.strokeStyle = 'rgba(80,255,160,.92)';
    ctx.lineWidth = 2 * ratio;
    ctx.shadowColor = 'rgba(64,255,153,.22)';
    ctx.shadowBlur = 12 * ratio;
    ctx.beginPath();
    for (let i = 0; i < bufferLength; i++) {
      const x = (i / (bufferLength - 1)) * w;
      const y = (data[i] / 255) * h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawBufferWave(ctx, buffer, w, h, ratio, volume) {
    const data = mixToMono(buffer);
    const step = Math.ceil(data.length / Math.max(1, Math.floor(w / ratio)));
    const mid = h / 2;
    const amp = h * 0.36;
    ctx.save();
    ctx.strokeStyle = 'rgba(94,255,170,.95)';
    ctx.lineWidth = 1.25 * ratio;
    ctx.shadowColor = 'rgba(64,255,153,.14)';
    ctx.shadowBlur = 10 * ratio;
    for (let x = 0; x < w / ratio; x++) {
      let min = 1;
      let max = -1;
      const start = x * step;
      const end = Math.min(start + step, data.length);
      for (let i = start; i < end; i++) {
        const v = data[i] * Math.max(0.2, volume);
        if (v < min) min = v;
        if (v > max) max = v;
      }
      const y1 = mid + min * amp;
      const y2 = mid + max * amp;
      const drawX = x * ratio;
      ctx.beginPath();
      ctx.moveTo(drawX, y1);
      ctx.lineTo(drawX, y2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function redrawTrack(track) {
    if (!track.elements) return;
    const canvas = track.elements.canvas;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const ratio = window.devicePixelRatio || 1;

    ctx.clearRect(0, 0, w, h);
    drawQuarterGrid(ctx, w, h, ratio);

    if (track.recording && analyser) {
      drawLiveWave(ctx, w, h, ratio);
      track.elements.waveWrap.classList.remove('empty');
    } else if (track.buffer) {
      drawBufferWave(ctx, track.buffer, w, h, ratio, track.volume);
      track.elements.waveWrap.classList.remove('empty');
    } else {
      track.elements.waveWrap.classList.add('empty');
    }

    track.elements.meta.textContent = `軌 ${track.label} · ${loopDuration.toFixed(1)}s`;
  }

  function setPlayheadPosition(track, progress) {
    if (!track.elements) return;
    const wrap = track.elements.waveWrap;
    const head = track.elements.playhead;
    const usable = Math.max(0, wrap.clientWidth - 3);
    const clamped = Math.max(0, Math.min(1, progress));
    head.style.left = `${usable * clamped}px`;
  }

  function stopPlayhead(track) {
    cancelAnimationFrame(track.playheadRaf);
    track.playheadRaf = 0;
    track.playheadActive = false;
    if (track.elements) {
      track.elements.playhead.classList.remove('active');
      setPlayheadPosition(track, 0);
    }
  }

  function startPlayhead(track, durationMs, looped = false) {
    stopPlayhead(track);
    track.playheadActive = true;
    const started = performance.now();
    if (track.elements) track.elements.playhead.classList.add('active');

    const tick = () => {
      if (!track.playheadActive) return;
      const elapsed = performance.now() - started;
      let progress = elapsed / durationMs;
      if (looped) progress = progress % 1;
      setPlayheadPosition(track, progress);
      redrawTrack(track);
      if (!looped && elapsed >= durationMs) {
        stopPlayhead(track);
        return;
      }
      track.playheadRaf = requestAnimationFrame(tick);
    };
    track.playheadRaf = requestAnimationFrame(tick);
  }

  function stopSingleTrack(track) {
    if (!track.player) {
      stopPlayhead(track);
      syncTrackUI(track);
      return;
    }
    try { track.player.source.stop(); } catch (_) {}
    track.player = null;
    track.gainNode = null;
    stopPlayhead(track);
    syncTrackUI(track);
  }

  function stopAllSinglesExcept(trackId) {
    tracks.forEach(track => {
      if (track.id !== trackId) stopSingleTrack(track);
    });
  }

  async function toggleSingleTrackPlayback(track) {
    if (!track.buffer) return;
    const ctx = ensureAudioContext();
    if (ctx.state === 'suspended') {
      try { await ctx.resume(); } catch (_) {}
    }
    stopGlobalPlayback();
    if (track.player) {
      stopSingleTrack(track);
      return;
    }
    stopAllSinglesExcept(track.id);

    const source = ctx.createBufferSource();
    const gain = ctx.createGain();
    source.buffer = track.buffer;
    source.loop = !!loopEnabled;
    source.loopStart = 0;
    source.loopEnd = Math.min(loopDuration, track.buffer.duration || loopDuration);
    gain.gain.value = track.volume;
    source.connect(gain).connect(ctx.destination);

    track.player = { source };
    track.gainNode = gain;
    source.onended = () => {
      if (!source.loop) {
        track.player = null;
        track.gainNode = null;
        stopPlayhead(track);
        syncTrackUI(track);
      }
    };
    source.start();
    startPlayhead(track, loopDuration * 1000, !!loopEnabled);
    syncTrackUI(track);
  }

  async function playAll() {
    const playable = tracks.filter(track => track.buffer);
    if (!playable.length) return;
    const ctx = ensureAudioContext();
    if (ctx.state === 'suspended') {
      try { await ctx.resume(); } catch (_) {}
    }
    stopAllPlayback();
    const when = ctx.currentTime + 0.05;
    globalPlayback = { sources: [] };
    playable.forEach(track => {
      const source = ctx.createBufferSource();
      const gain = ctx.createGain();
      source.buffer = track.buffer;
      source.loop = !!loopEnabled;
      source.loopStart = 0;
      source.loopEnd = Math.min(loopDuration, track.buffer.duration || loopDuration);
      gain.gain.value = track.volume;
      source.connect(gain).connect(ctx.destination);
      track.player = { source };
      track.gainNode = gain;
      source.onended = () => {
        if (!source.loop) {
          track.player = null;
          track.gainNode = null;
          stopPlayhead(track);
          syncTrackUI(track);
        }
      };
      source.start(when);
      startPlayhead(track, loopDuration * 1000, !!loopEnabled);
      syncTrackUI(track);
      globalPlayback.sources.push({ track, source });
    });
  }

  function stopGlobalPlayback() {
    if (!globalPlayback) return;
    globalPlayback.sources.forEach(({ track, source }) => {
      try { source.stop(); } catch (_) {}
      track.player = null;
      track.gainNode = null;
      stopPlayhead(track);
      syncTrackUI(track);
    });
    globalPlayback = null;
  }

  function stopAllPlayback() {
    stopGlobalPlayback();
    tracks.forEach(track => stopSingleTrack(track));
  }

  async function onRecordPressed(track) {
    stopAllPlayback();
    tracks.forEach(other => {
      if (other.id !== track.id && other.recording) finishRecording(other);
    });

    if (track.recording) {
      finishRecording(track);
      return;
    }

    if (countdownEnabled) {
      track.counting = true;
      syncTrackUI(track);
      const numbers = ['3', '2', '1'];
      for (const n of numbers) {
        track.elements.countdown.textContent = n;
        await sleep(700);
        if (!track.counting) return;
      }
      track.counting = false;
      syncTrackUI(track);
    }

    await startRecording(track);
  }

  function finishRecording(track) {
    if (track.recorder && track.recorder.state !== 'inactive') {
      track.recorder.stop();
    }
    clearTimeout(track.autoStopTimer);
    stopPlayhead(track);
    track.recording = false;
    syncTrackUI(track);
  }

  async function startRecording(track) {
    try {
      await ensureMic();
      const ctx = ensureAudioContext();
      if (ctx.state === 'suspended') {
        try { await ctx.resume(); } catch (_) {}
      }
      const token = ++track.recordToken;
      const chunks = [];
      const recorder = new MediaRecorder(mediaStream, pickRecorderOptions());
      track.recorder = recorder;
      track.recording = true;
      track.blob = null;
      track.buffer = null;
      syncTrackUI(track);
      startPlayhead(track, loopDuration * 1000, false);

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = async () => {
        if (token !== track.recordToken) return;
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        const decoded = await decodeBlobToBuffer(blob);
        track.buffer = cropBufferToDuration(decoded, loopDuration, ctx);
        track.blob = blob;
        track.recording = false;
        syncTrackUI(track);
        redrawTrack(track);
        await saveTrack(track);
      };

      recorder.start(120);
      track.autoStopTimer = setTimeout(() => {
        if (track.recording) finishRecording(track);
      }, loopDuration * 1000);
    } catch (error) {
      console.error(error);
      alert('無法啟用錄音，請確認瀏覽器已允許麥克風權限。');
      track.recording = false;
      track.counting = false;
      stopPlayhead(track);
      syncTrackUI(track);
    }
  }

  async function clearAllBuffers(persist = true) {
    stopAllPlayback();
    tracks.forEach(track => {
      if (track.recording) finishRecording(track);
      track.recordToken++;
      track.blob = null;
      track.buffer = null;
      stopPlayhead(track);
      syncTrackUI(track);
      redrawTrack(track);
    });
    if (persist) await saveAllTracks();
  }

  async function addTrack() {
    if (tracks.length >= MAX_TRACKS) return;
    tracks.push(createTrack(tracks.length));
    trackCount = tracks.length;
    renderTracks();
    await saveState();
  }

  async function removeTrack() {
    if (tracks.length <= MIN_TRACKS) return;
    const removed = tracks.pop();
    stopSingleTrack(removed);
    trackCount = tracks.length;
    await dbDelete(`track-${removed.id}`);
    renderTracks();
    await saveState();
  }

  function updateDurationUI() {
    durationValue.textContent = `${loopDuration.toFixed(1)} 秒`;
    tracks.forEach(track => {
      if (track.elements) track.elements.meta.textContent = `軌 ${track.label} · ${loopDuration.toFixed(1)}s`;
    });
  }

  function audioBufferToWav(buffer) {
    const numChannels = Math.min(2, buffer.numberOfChannels || 1);
    const sampleRate = buffer.sampleRate;
    const length = buffer.length;
    const bytesPerSample = 2;
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = length * blockAlign;
    const wavBuffer = new ArrayBuffer(44 + dataSize);
    const view = new DataView(wavBuffer);

    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    let offset = 0;
    writeString(offset, 'RIFF'); offset += 4;
    view.setUint32(offset, 36 + dataSize, true); offset += 4;
    writeString(offset, 'WAVE'); offset += 4;
    writeString(offset, 'fmt '); offset += 4;
    view.setUint32(offset, 16, true); offset += 4;
    view.setUint16(offset, 1, true); offset += 2;
    view.setUint16(offset, numChannels, true); offset += 2;
    view.setUint32(offset, sampleRate, true); offset += 4;
    view.setUint32(offset, sampleRate * blockAlign, true); offset += 4;
    view.setUint16(offset, blockAlign, true); offset += 2;
    view.setUint16(offset, 16, true); offset += 2;
    writeString(offset, 'data'); offset += 4;
    view.setUint32(offset, dataSize, true); offset += 4;

    const channels = [];
    for (let ch = 0; ch < numChannels; ch++) channels.push(buffer.getChannelData(ch));
    for (let i = 0; i < length; i++) {
      for (let ch = 0; ch < numChannels; ch++) {
        let sample = channels[ch][i] || 0;
        sample = Math.max(-1, Math.min(1, sample));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        offset += 2;
      }
    }
    return new Blob([wavBuffer], { type: 'audio/wav' });
  }

  async function buildMixedBuffer() {
    const playable = tracks.filter(track => track.buffer);
    if (!playable.length) return null;
    const sampleRate = 44100;
    const frameCount = Math.max(1, Math.ceil(loopDuration * sampleRate));
    const offline = new OfflineAudioContext(2, frameCount, sampleRate);
    playable.forEach(track => {
      const source = offline.createBufferSource();
      const gain = offline.createGain();
      source.buffer = track.buffer;
      source.loop = false;
      gain.gain.value = track.volume;
      source.connect(gain).connect(offline.destination);
      source.start(0);
    });
    return await offline.startRendering();
  }

  function supportsMp3Export() {
    return !!(window.MediaRecorder && MediaRecorder.isTypeSupported && (MediaRecorder.isTypeSupported('audio/mpeg') || MediaRecorder.isTypeSupported('audio/mp3')));
  }

  async function renderBufferToMp3(buffer) {
    const mimeType = MediaRecorder.isTypeSupported('audio/mpeg') ? 'audio/mpeg' : 'audio/mp3';
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const destination = ctx.createMediaStreamDestination();
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(destination);

    const chunks = [];
    const recorder = new MediaRecorder(destination.stream, { mimeType });
    recorder.ondataavailable = (e) => {
      if (e.data && e.data.size) chunks.push(e.data);
    };

    const stopped = new Promise((resolve, reject) => {
      recorder.onerror = () => reject(recorder.error || new Error('mp3 export failed'));
      recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
    });

    if (ctx.state === 'suspended') {
      try { await ctx.resume(); } catch (_) {}
    }
    recorder.start();
    source.start(0);
    source.onended = () => {
      if (recorder.state !== 'inactive') recorder.stop();
      ctx.close().catch(() => {});
    };
    return await stopped;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function exportMixedAudio() {
    const exportBtn = document.getElementById('exportMixBtn');
    const playable = tracks.filter(track => track.buffer);
    if (!playable.length) {
      alert('目前沒有可匯出的錄音內容。');
      return;
    }
    exportBtn.disabled = true;
    exportBtn.classList.add('exporting');
    const originalTitle = exportBtn.title;
    exportBtn.title = '正在輸出混音';
    try {
      stopAllPlayback();
      const mixed = await buildMixedBuffer();
      if (!mixed) throw new Error('沒有可混音的音軌');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      if (supportsMp3Export()) {
        const mp3Blob = await renderBufferToMp3(mixed);
        downloadBlob(mp3Blob, `music_mixer_mix_${stamp}.mp3`);
      } else {
        const wavBlob = audioBufferToWav(mixed);
        downloadBlob(wavBlob, `music_mixer_mix_${stamp}.wav`);
        alert('此瀏覽器不支援原生 MP3 編碼，已改為下載 WAV 混音檔。');
      }
    } catch (error) {
      console.error(error);
      alert('混音匯出失敗，請稍後再試。');
    } finally {
      exportBtn.disabled = false;
      exportBtn.classList.remove('exporting');
      exportBtn.title = originalTitle;
    }
  }

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function dbGet(key) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbSet(key, value) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('DB write failed'));
    });
  }

  async function dbDelete(key) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('DB delete failed'));
    });
  }

  async function dbClearAll() {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('DB clear failed'));
    });
  }

  async function saveState() {
    const state = {
      loopDuration,
      trackCount: tracks.length,
      loopEnabled,
      countdownEnabled,
      volumes: tracks.map(track => track.volume)
    };
    await dbSet(STATE_KEY, state);
  }

  async function saveTrack(track) {
    await saveState();
    if (track.blob) await dbSet(`track-${track.id}`, track.blob);
    else await dbDelete(`track-${track.id}`);
  }

  async function saveAllTracks() {
    await saveState();
    for (const track of tracks) {
      if (track.blob) await dbSet(`track-${track.id}`, track.blob);
      else await dbDelete(`track-${track.id}`);
    }
  }

  async function restoreFromCache() {
    try {
      const state = await dbGet(STATE_KEY);
      if (state) {
        loopDuration = typeof state.loopDuration === 'number' ? state.loopDuration : 4;
        trackCount = Math.max(MIN_TRACKS, Math.min(MAX_TRACKS, state.trackCount || 4));
        loopEnabled = !!state.loopEnabled;
        countdownEnabled = !!state.countdownEnabled;
      }
      durationSlider.value = String(loopDuration);
      updateDurationUI();
      setSwitch(loopSwitch, loopEnabled);
      setSwitch(countdownSwitch, countdownEnabled);
      tracks = Array.from({ length: trackCount }, (_, i) => createTrack(i));
      if (state && Array.isArray(state.volumes)) {
        tracks.forEach((track, i) => {
          if (typeof state.volumes[i] === 'number') track.volume = state.volumes[i];
        });
      }
      renderTracks();

      for (const track of tracks) {
        const blob = await dbGet(`track-${track.id}`);
        if (blob instanceof Blob) {
          try {
            const decoded = await decodeBlobToBuffer(blob);
            track.blob = blob;
            track.buffer = cropBufferToDuration(decoded, loopDuration, ensureAudioContext());
          } catch (err) {
            console.warn('音檔暫存復原失敗', err);
          }
          syncTrackUI(track);
          redrawTrack(track);
        }
      }
    } catch (err) {
      console.warn('讀取暫存失敗', err);
      tracks = Array.from({ length: trackCount }, (_, i) => createTrack(i));
      renderTracks();
    }
  }

  async function deleteCacheAndReset() {
    stopAllPlayback();
    await dbClearAll();
    loopDuration = 4;
    trackCount = 4;
    loopEnabled = true;
    countdownEnabled = false;
    durationSlider.value = '4';
    updateDurationUI();
    setSwitch(loopSwitch, loopEnabled);
    setSwitch(countdownSwitch, countdownEnabled);
    tracks = Array.from({ length: trackCount }, (_, i) => createTrack(i));
    renderTracks();
  }

  document.getElementById('playAllBtn').addEventListener('click', playAll);
  document.getElementById('stopAllBtn').addEventListener('click', stopAllPlayback);
  document.getElementById('settingsBtn').addEventListener('click', () => modalBackdrop.classList.add('show'));
  document.getElementById('exportMixBtn').addEventListener('click', exportMixedAudio);
  document.getElementById('modalCloseBtn').addEventListener('click', () => modalBackdrop.classList.remove('show'));
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) modalBackdrop.classList.remove('show');
  });

  document.getElementById('addTrackBtn').addEventListener('click', addTrack);
  document.getElementById('removeTrackBtn').addEventListener('click', removeTrack);

  document.getElementById('clearAllBtn').addEventListener('click', async () => {
    if (!tracks.some(t => t.buffer || t.blob)) return;
    if (!confirm('要清除全部已錄製內容嗎？')) return;
    await clearAllBuffers(true);
  });

  document.getElementById('deleteCacheBtn').addEventListener('click', async () => {
    if (!confirm('要刪除瀏覽器暫存的錄音與設定嗎？')) return;
    await deleteCacheAndReset();
  });

  durationSlider.addEventListener('input', async (e) => {
    const newValue = parseFloat(e.target.value);
    if (newValue === loopDuration) return;
    const hasContent = tracks.some(t => t.buffer || t.recording || t.blob);
    if (hasContent) {
      const ok = confirm('更改軌道時間會刪除全部已錄製原檔，是否繼續？');
      if (!ok) {
        durationSlider.value = String(loopDuration);
        return;
      }
      await clearAllBuffers(false);
    }
    loopDuration = newValue;
    updateDurationUI();
    tracks.forEach(track => {
      syncTrackUI(track);
      redrawTrack(track);
    });
    await saveAllTracks();
  });

  loopSwitch.addEventListener('click', async () => {
    loopEnabled = !loopEnabled;
    setSwitch(loopSwitch, loopEnabled);
    stopAllPlayback();
    await saveState();
  });

  countdownSwitch.addEventListener('click', async () => {
    countdownEnabled = !countdownEnabled;
    setSwitch(countdownSwitch, countdownEnabled);
    await saveState();
  });

  window.addEventListener('resize', () => {
    tracks.forEach(track => resizeCanvas(track));
  });

  restoreFromCache();
})();
</script>
</body>
</html>
