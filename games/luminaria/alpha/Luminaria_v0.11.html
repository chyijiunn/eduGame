<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Luminaria v0.11</title>
  <style>
    :root {
      --bg0: #03101f;
      --bg1: #07192d;
      --bg2: #0b2746;
      --text: #dbf6ff;
      --sub: rgba(219, 246, 255, 0.72);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ui-shadow: 0 10px 30px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(78, 144, 255, 0.18), transparent 26%),
        radial-gradient(circle at 78% 30%, rgba(91, 232, 255, 0.12), transparent 24%),
        linear-gradient(180deg, var(--bg2), var(--bg1) 42%, var(--bg0));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    body { display:flex; justify-content:center; align-items:stretch; }
    .app {
      width: min(100vw, 840px);
      height: 100vh;
      padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      position: relative;
    }
    .header {
      display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 4px 0;
      min-height: 28px;
    }
    .title-wrap { display:flex; align-items:baseline; gap:8px; min-width:0; }
    .title { margin:0; font-size:1rem; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
    .subtitle { color:var(--sub); font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .status { display:inline-flex; align-items:center; gap:6px; color:var(--sub); font-size:.78rem; white-space:nowrap; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:rgba(160, 208, 255, .55); box-shadow:0 0 12px rgba(120, 180, 255, .55); }
    .status-dot.running { background:#99f4ff; box-shadow:0 0 14px rgba(153, 244, 255, .8); }

    .stage-shell {
      position:relative; min-height:0; border-radius:24px; padding:12px;
      background:linear-gradient(180deg, rgba(8, 23, 43, .72), rgba(5, 17, 33, .82));
      border:1px solid rgba(170, 220, 255, .12); box-shadow:var(--ui-shadow); overflow:hidden;
    }
    .stage-shell::before {
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(circle at 25% 20%, rgba(117, 194, 255, .08), transparent 20%),
        radial-gradient(circle at 72% 26%, rgba(130, 255, 239, .07), transparent 22%),
        radial-gradient(circle at 48% 80%, rgba(123, 128, 255, .08), transparent 24%);
      pointer-events:none;
    }
    .stage {
      position:relative; width:100%; height:100%; min-height:0; border-radius:18px; overflow:hidden;
      background:
        linear-gradient(180deg, rgba(6, 18, 35, .84), rgba(4, 14, 27, .92)),
        radial-gradient(circle at 50% 50%, rgba(50, 130, 190, .08), transparent 62%);
    }
    #fxCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
    .grid {
      position:absolute; inset:0; z-index:2;
      display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(8, 1fr);
      justify-items:center; align-items:center;
      padding:10px;
      gap:0;
    }
    .cell {
      position:relative; appearance:none; border:none; outline:none; border-radius:18px; background:transparent;
      color:var(--text); display:flex; align-items:center; justify-content:center; overflow:visible;
      cursor:pointer; touch-action:manipulation; transition:transform 120ms ease;
      padding:0;
      aspect-ratio:1 / 1;
      width:min(100%, calc((100dvh - 240px) / 8));
      max-width:100%;
    }
    .cell:active { transform:scale(.985); }
    .cell .halo {
      position:absolute; inset:8%; border-radius:20px; pointer-events:none; opacity:.9;
      background:radial-gradient(circle at center, rgba(88, 192, 255, .08), rgba(88, 192, 255, .035) 45%, rgba(88, 192, 255, 0) 72%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .cell::after {
      content:""; position:absolute; inset:-24%; pointer-events:none; opacity:0; transform:scale(.85);
      background: radial-gradient(circle at center, rgba(123, 227, 255, 0), rgba(123, 227, 255, 0) 45%, rgba(123, 227, 255, 0) 70%);
    }
    .cell .arrow {
      position:relative; z-index:2; font-size:clamp(1.35rem, 4.2vw, 2rem); font-weight:700; line-height:1;
      text-shadow:0 0 10px rgba(148, 244, 255, .28), 0 0 26px rgba(119, 170, 255, .18);
      transition:transform 120ms ease;
    }
    .cell .note-hint {
      position:absolute; right:10%; bottom:8%; z-index:2; font-size:.62rem; color:rgba(219, 246, 255, .38);
      letter-spacing:.04em; pointer-events:none;
    }
    .cell.rotate-flash .arrow { animation: arrowKick 160ms ease; }
    .cell.pulse::after {
      opacity:1; animation:pulseRing 380ms ease-out;
      background: radial-gradient(circle at center, rgba(123,227,255,.28), rgba(123,227,255,.10) 32%, rgba(123,227,255,0) 72%);
    }
    .cell.global-flash .halo {
      background:radial-gradient(circle at center, rgba(160, 238, 255, .18), rgba(123, 227, 255, .06) 45%, rgba(123, 227, 255, 0) 72%);
    }
    @keyframes pulseRing { 0%{opacity:.95; transform:scale(.72);} 100%{opacity:0; transform:scale(1.18);} }
    @keyframes arrowKick { 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }

    .controls { display:grid; gap:10px; }
    .control-row { display:grid; gap:8px; }
    .control-row.primary { grid-template-columns: repeat(7, 1fr); }
    .control-row.secondary { grid-template-columns: repeat(6, 1fr); }
    .btn {
      appearance:none; border:1px solid rgba(152, 233, 255, .16); border-radius:16px;
      background:linear-gradient(180deg, rgba(16, 37, 66, .82), rgba(9, 22, 43, .86));
      color:var(--text); min-height:48px; padding:0 12px; font-size:.92rem; font-weight:700; letter-spacing:.02em;
      box-shadow:var(--ui-shadow); cursor:pointer; transition:transform 120ms ease, border-color 140ms ease, background 160ms ease;
      touch-action:manipulation;
    }
    .btn:active { transform:scale(.985); }
    .btn.active {
      border-color:rgba(153, 244, 255, .46);
      background:linear-gradient(180deg, rgba(20, 54, 95, .95), rgba(11, 28, 55, .92));
      box-shadow:0 0 20px rgba(108, 200, 255, .14), var(--ui-shadow);
    }
    .btn.small-label { font-size:.84rem; }

    .overlay {
      position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center; padding:20px;
      background:linear-gradient(180deg, rgba(2,7,15,.34), rgba(2,7,15,.7)); backdrop-filter:blur(8px);
    }
    .overlay[hidden] { display:none; }
    .card, .modal-card {
      width:min(100%, 460px); border-radius:24px; padding:22px 18px 18px;
      background:linear-gradient(180deg, rgba(10, 27, 49, .92), rgba(7, 19, 35, .94));
      border:1px solid rgba(152, 233, 255, .16); box-shadow:0 18px 44px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .card h2, .modal-card h2 { margin:0 0 8px; font-size:1.22rem; }
    .card p, .modal-card p { margin:0; color:var(--sub); line-height:1.6; font-size:.93rem; }
    .hint-list { margin:14px 0 18px; padding-left:1.1em; color:var(--sub); font-size:.92rem; line-height:1.55; }
    .start-btn { width:100%; min-height:54px; border-radius:18px; border:1px solid rgba(153, 244, 255, .3); background:linear-gradient(180deg, rgba(24, 67, 118, .96), rgba(12, 34, 67, .96)); color:#f2fdff; font-size:1rem; font-weight:800; letter-spacing:.04em; box-shadow:0 14px 36px rgba(41, 97, 170, .28); cursor:pointer; }
    .legend { position:absolute; left:14px; bottom:14px; z-index:4; padding:8px 10px; border-radius:12px; background:rgba(7, 18, 34, .44); border:1px solid rgba(152, 233, 255, .08); color:rgba(219, 246, 255, .58); font-size:.74rem; line-height:1.45; pointer-events:none; backdrop-filter:blur(4px); }

    .modal { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(1,8,15,.48); backdrop-filter: blur(8px); }
    .modal[hidden] { display:none; }
    .modal-grid { display:grid; gap:12px; margin-top:14px; }
    .field { display:grid; gap:6px; }
    .field label { font-size:.86rem; color:var(--sub); }
    .field select {
      width:100%; min-height:44px; border-radius:14px; border:1px solid rgba(152, 233, 255, .18);
      background:rgba(9, 22, 43, .88); color:var(--text); padding:0 12px; font-size:.95rem;
    }
    .speed-swatches { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    .sw { border-radius:12px; padding:8px 6px; text-align:center; font-size:.76rem; background:rgba(255,255,255,.04); }
    .sw i { display:block; width:14px; height:14px; margin:0 auto 6px; border-radius:50%; }
    .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }

    @media (max-width: 640px) {
      .control-row.primary { grid-template-columns: repeat(4, 1fr); }
      .control-row.secondary { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 560px) {
      .app { padding-left:10px; padding-right:10px; }
      .stage-shell { padding:10px; border-radius:22px; }
      .grid { padding:8px; }
      .btn { min-height:46px; }
      .legend, .subtitle { display:none; }
      .cell { width:min(100%, calc((100dvh - 250px) / 8)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title-wrap">
        <h1 class="title">Luminaria v0.11</h1>
        <div class="subtitle">4×8｜正方格距｜音色浮窗｜速度 Set</div>
      </div>
      <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">未開始</span></div>
    </div>

    <div class="stage-shell">
      <div class="stage" id="stage">
        <canvas id="fxCanvas"></canvas>
        <div class="grid" id="grid"></div>
        <div class="legend">點一下單格旋轉｜按住連轉但不發聲｜下方可全場刷向</div>
      </div>
      <div class="overlay" id="startOverlay">
        <div class="card">
          <h2>Luminaria v0.11</h2>
          <p>加入音色選擇與速度 set，並把方格改成正方形間距，四隻顏色依速度由快到慢顯示為紅、橘、綠、藍。</p>
          <ul class="hint-list">
            <li>點一下任一格：該格順時針旋轉一格</li>
            <li>按住任一格：約 0.22 秒後開始持續旋轉，但不會發出旋轉提示音</li>
            <li>下方設定可切換 10 種和弦音色與多組速度關係</li>
          </ul>
          <button class="start-btn" id="startBtn">開始</button>
        </div>
      </div>
      <div class="modal" id="settingsModal" hidden>
        <div class="modal-card">
          <h2>音色與速度</h2>
          <p>音色會套用到四隻 Luminaria 的和弦觸發；速度會成套改變四隻的節拍關係。</p>
          <div class="modal-grid">
            <div class="field">
              <label for="timbreSelect">音色選擇</label>
              <select id="timbreSelect"></select>
            </div>
            <div class="field">
              <label for="speedSetSelect">速度 Set</label>
              <select id="speedSetSelect"></select>
            </div>
            <div class="speed-swatches">
              <div class="sw"><i style="background:#ff5d66"></i>最快</div>
              <div class="sw"><i style="background:#ffae57"></i>次快</div>
              <div class="sw"><i style="background:#62d88c"></i>次慢</div>
              <div class="sw"><i style="background:#61b8ff"></i>最慢</div>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn" id="closeSettingsBtn">關閉</button>
            <button class="btn active" id="applySettingsBtn">套用</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="control-row primary">
        <button class="btn" id="rotateAllBtn">↺</button>
        <button class="btn" data-global-dir="0">↑</button>
        <button class="btn" data-global-dir="2">→</button>
        <button class="btn" data-global-dir="4">↓</button>
        <button class="btn" data-global-dir="6">←</button>
        <button class="btn" id="resetBtn">重置</button>
        <button class="btn small-label" id="settingsBtn">音色 / 速度</button>
      </div>
      <div class="control-row secondary">
        <button class="btn active small-label" id="presetBBtn">Preset B</button>
        <button class="btn small-label" id="presetABtn">Preset A</button>
        <button class="btn" id="pauseBtn">暫停</button>
        <button class="btn small-label" id="restartBtn">重新開始</button>
        <button class="btn small-label" id="helpBtn">說明</button>
        <button class="btn small-label" id="quickTimbreBtn">試音</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const COLS = 4;
      const ROWS = 8;
      const DIRS = [
        { dx: 0, dy: -1, symbol: '↑' },
        { dx: 1, dy: -1, symbol: '↗' },
        { dx: 1, dy: 0, symbol: '→' },
        { dx: 1, dy: 1, symbol: '↘' },
        { dx: 0, dy: 1, symbol: '↓' },
        { dx: -1, dy: 1, symbol: '↙' },
        { dx: -1, dy: 0, symbol: '←' },
        { dx: -1, dy: -1, symbol: '↖' }
      ];

      const PRESET_A = [
        [3, 4, 4, 5], [2, 3, 5, 6], [1, 2, 6, 7], [0, 1, 7, 0],
        [4, 3, 5, 4], [1, 2, 6, 7], [2, 1, 7, 6], [1, 0, 0, 7]
      ];
      const PRESET_B = [
        [2, 3, 5, 6], [1, 2, 4, 7], [0, 1, 6, 5], [3, 0, 7, 6],
        [2, 1, 7, 4], [5, 2, 0, 7], [1, 4, 2, 5], [0, 1, 7, 6]
      ];
      const NOTE_GRID = [
        ['D3','F3','A3','E4'], ['D3','F3','A3','E4'], ['F3','A3','C4','E4'], ['F3','A3','C4','E4'],
        ['C3','E3','G3','D4'], ['C3','E3','G3','D4'], ['A2','C3','E3','B3'], ['A2','C3','E3','B3']
      ];
      const NOTE_FREQ = {
        'A2':110.00,'B3':246.94,'C3':130.81,'C4':261.63,'D3':146.83,'D4':293.66,'E3':164.81,'E4':329.63,'F3':174.61,'G3':196.00,'A3':220.00
      };
      const SPEED_SETS = {
        calm:[1200, 900, 650, 450],
        triad:[1350, 900, 675, 450],
        pulse:[1440, 1080, 720, 540],
        dotted:[1200, 800, 600, 400],
        dense:[1000, 750, 500, 375],
        bloom:[1500, 1000, 750, 500],
        canon:[1600, 1200, 800, 400]
      };
      const SPEED_SET_LABELS = {
        calm:'Calm 4:3:2.17:1.5',
        triad:'Triad 3:2:1.5:1',
        pulse:'Pulse 8:6:4:3',
        dotted:'Dotted 3:2:1.5:1',
        dense:'Dense 8:6:4:3',
        bloom:'Bloom 3:2:1.5:1',
        canon:'Canon 4:3:2:1'
      };
      const TIMBRES = {
        warmPad:   { name:'暖霧 Pad', base:'sine', overtone:'triangle', sparkle:'sine', lowpass:1500, attack:.022, decay:.90, sustain:.42, wet:.24, spread:.015, gain:[.26,.21,.17,.14], harmonics:[1,2,3.01] },
        glassChoir:{ name:'玻璃 Choir', base:'triangle', overtone:'sine', sparkle:'sine', lowpass:2200, attack:.010, decay:.58, sustain:.25, wet:.28, spread:.020, gain:[.22,.18,.15,.12], harmonics:[1,2.01,4.02] },
        mellowBell:{ name:'柔鐘 Bell', base:'sine', overtone:'sine', sparkle:'triangle', lowpass:2600, attack:.004, decay:.72, sustain:.18, wet:.20, spread:.022, gain:[.23,.18,.14,.11], harmonics:[1,2.99,5.02] },
        reedCloud: { name:'簧霧 Reed', base:'triangle', overtone:'triangle', sparkle:'sine', lowpass:1700, attack:.014, decay:.82, sustain:.34, wet:.23, spread:.017, gain:[.24,.20,.16,.13], harmonics:[1,2,2.5] },
        aquaOrgan: { name:'水紋 Organ', base:'sine', overtone:'triangle', sparkle:'sine', lowpass:1400, attack:.018, decay:1.0, sustain:.46, wet:.26, spread:.010, gain:[.25,.20,.16,.13], harmonics:[1,2,4] },
        amberChime:{ name:'琥珀 Chime', base:'triangle', overtone:'sine', sparkle:'triangle', lowpass:2400, attack:.006, decay:.66, sustain:.20, wet:.21, spread:.024, gain:[.22,.18,.15,.12], harmonics:[1,3.01,6.02] },
        nightBloom: { name:'夜綻 Bloom', base:'sine', overtone:'triangle', sparkle:'sine', lowpass:1800, attack:.026, decay:1.08, sustain:.40, wet:.30, spread:.018, gain:[.25,.20,.16,.13], harmonics:[1,2.01,3.99] },
        softPluck: { name:'柔撥 Pluck', base:'triangle', overtone:'sine', sparkle:'sine', lowpass:2000, attack:.003, decay:.44, sustain:.12, wet:.16, spread:.012, gain:[.20,.17,.14,.11], harmonics:[1,2.5,4.5] },
        lunarFM:   { name:'月面 FM', base:'sine', overtone:'sine', sparkle:'triangle', lowpass:2100, attack:.008, decay:.74, sustain:.22, wet:.24, spread:.028, gain:[.22,.18,.15,.11], harmonics:[1,2.01,3.7] },
        velvetPipe:{ name:'絲絨 Pipe', base:'triangle', overtone:'triangle', sparkle:'sine', lowpass:1600, attack:.016, decay:.88, sustain:.38, wet:.22, spread:.016, gain:[.24,.20,.16,.13], harmonics:[1,1.99,3.01] }
      };

      const COLOR_FAST_TO_SLOW = ['#ff5d66','#ffae57','#62d88c','#61b8ff'];
      const CORNERS = [{x:0,y:0},{x:COLS-1,y:0},{x:0,y:ROWS-1},{x:COLS-1,y:ROWS-1}];
      const HOLD_DELAY = 220;
      const HOLD_STEP = 100;

      const stage = document.getElementById('stage');
      const gridEl = document.getElementById('grid');
      const canvas = document.getElementById('fxCanvas');
      const ctx = canvas.getContext('2d');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const settingsModal = document.getElementById('settingsModal');
      const settingsBtn = document.getElementById('settingsBtn');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');
      const applySettingsBtn = document.getElementById('applySettingsBtn');
      const timbreSelect = document.getElementById('timbreSelect');
      const speedSetSelect = document.getElementById('speedSetSelect');
      const rotateAllBtn = document.getElementById('rotateAllBtn');
      const resetBtn = document.getElementById('resetBtn');
      const restartBtn = document.getElementById('restartBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const presetABtn = document.getElementById('presetABtn');
      const presetBBtn = document.getElementById('presetBBtn');
      const helpBtn = document.getElementById('helpBtn');
      const quickTimbreBtn = document.getElementById('quickTimbreBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      const cells = [];
      const cellButtons = [];
      const particles = [];
      const voices = [];
      let currentPreset = 'B';
      let isStarted = false;
      let isRunning = false;
      let audio = null;
      let lastTime = performance.now();
      let stageRect = { width:1, height:1, left:0, top:0 };
      let currentTimbreKey = 'warmPad';
      let currentSpeedSetKey = 'calm';
      let previewTimbreKey = currentTimbreKey;
      let previewSpeedSetKey = currentSpeedSetKey;

      function clonePreset(name){ const src = name==='A' ? PRESET_A : PRESET_B; return src.map(row => row.slice()); }
      function wrap(v,max){ return (v+max)%max; }
      function indexOfCell(x,y){ return y*COLS+x; }
      function speedArray(){ return SPEED_SETS[currentSpeedSetKey]; }

      function sortedSpeedIndicesDesc() {
        return speedArray().map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v).map(o=>o.i); // fastest smallest interval first
      }
      function colorForVoice(voiceIdx){
        const order = sortedSpeedIndicesDesc();
        const rank = order.indexOf(voiceIdx);
        return COLOR_FAST_TO_SLOW[Math.max(0, rank)];
      }

      function computeGridMetrics(){
        const pad = 10;
        const availW = stageRect.width - pad*2;
        const availH = stageRect.height - pad*2;
        const cell = Math.floor(Math.min(availW / COLS, availH / ROWS));
        const totalW = cell * COLS;
        const totalH = cell * ROWS;
        const startX = Math.floor((stageRect.width - totalW) / 2);
        const startY = Math.floor((stageRect.height - totalH) / 2);
        return { cell, startX, startY };
      }

      function applyGridLayout(){
        const m = computeGridMetrics();
        gridEl.style.gridTemplateColumns = `repeat(${COLS}, ${m.cell}px)`;
        gridEl.style.gridTemplateRows = `repeat(${ROWS}, ${m.cell}px)`;
        gridEl.style.justifyContent = 'start';
        gridEl.style.alignContent = 'start';
        gridEl.style.padding = '0';
        gridEl.style.left = m.startX + 'px';
        gridEl.style.top = m.startY + 'px';
        gridEl.style.right = 'auto';
        gridEl.style.bottom = 'auto';
        gridEl.style.width = (m.cell*COLS) + 'px';
        gridEl.style.height = (m.cell*ROWS) + 'px';
        for (const btn of cellButtons) {
          btn.style.width = m.cell + 'px';
          btn.style.height = m.cell + 'px';
        }
      }

      function cellCenter(x,y){
        const m = computeGridMetrics();
        return {
          x: m.startX + x * m.cell + m.cell/2,
          y: m.startY + y * m.cell + m.cell/2,
          cellW: m.cell,
          cellH: m.cell,
          gap: 0
        };
      }

      function createGrid(){
        gridEl.innerHTML='';
        for(let y=0;y<ROWS;y++){
          for(let x=0;x<COLS;x++){
            const btn=document.createElement('button');
            btn.className='cell'; btn.type='button'; btn.setAttribute('aria-label',`cell-${x}-${y}`); btn.dataset.x=String(x); btn.dataset.y=String(y);
            btn.innerHTML='<span class="halo"></span><span class="arrow">↑</span><span class="note-hint"></span>';
            gridEl.appendChild(btn); cellButtons.push(btn);
            const cell={ x,y,dir:0,note:NOTE_GRID[y][x],freq:NOTE_FREQ[NOTE_GRID[y][x]],button:btn,arrowEl:btn.querySelector('.arrow'),noteEl:btn.querySelector('.note-hint') };
            cell.noteEl.textContent = cell.note; cells.push(cell); bindCellInput(cell);
          }
        }
      }

      function bindCellInput(cell){
        let holdTimer=null, repeatTimer=null, didHold=false;
        const clearTimers=()=>{ if(holdTimer){clearTimeout(holdTimer); holdTimer=null;} if(repeatTimer){clearInterval(repeatTimer); repeatTimer=null;} };
        const endInteraction=()=>{ clearTimers(); if(!didHold) rotateCell(cell.x, cell.y, 1, true); didHold=false; };
        cell.button.addEventListener('pointerdown',(e)=>{
          e.preventDefault();
          didHold=false; clearTimers();
          holdTimer=setTimeout(()=>{
            didHold=true;
            rotateCell(cell.x, cell.y, 1, false); // long press no sound
            repeatTimer=setInterval(()=>rotateCell(cell.x, cell.y, 1, false), HOLD_STEP);
          }, HOLD_DELAY);
        });
        cell.button.addEventListener('pointerup',(e)=>{ e.preventDefault(); endInteraction(); });
        cell.button.addEventListener('pointercancel',()=>{ clearTimers(); didHold=false; });
        cell.button.addEventListener('pointerleave',()=>{ clearTimers(); });
        cell.button.addEventListener('contextmenu',(e)=>e.preventDefault());
      }

      function updateCellVisual(x,y){ cells[indexOfCell(x,y)].arrowEl.textContent = DIRS[cells[indexOfCell(x,y)].dir].symbol; }
      function updateAllCellVisuals(){ for(const cell of cells) updateCellVisual(cell.x, cell.y); }
      function markCellPulse(x,y){ const btn = cells[indexOfCell(x,y)].button; btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse'); setTimeout(()=>btn.classList.remove('pulse'),380); }
      function markRotateFlash(x,y){ const btn = cells[indexOfCell(x,y)].button; btn.classList.remove('rotate-flash'); void btn.offsetWidth; btn.classList.add('rotate-flash'); setTimeout(()=>btn.classList.remove('rotate-flash'),160); }
      function flashAllCells(){ for(const btn of cellButtons){ btn.classList.remove('global-flash'); void btn.offsetWidth; btn.classList.add('global-flash'); setTimeout(()=>btn.classList.remove('global-flash'),260); } }

      function loadPreset(name){
        currentPreset=name; const preset=clonePreset(name);
        for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) cells[indexOfCell(x,y)].dir = preset[y][x];
        updateAllCellVisuals();
        presetABtn.classList.toggle('active', name==='A'); presetBBtn.classList.toggle('active', name==='B');
      }
      function rotateCell(x,y,step=1,playUi=false){ const cell=cells[indexOfCell(x,y)]; cell.dir=wrap(cell.dir+step,8); updateCellVisual(x,y); markRotateFlash(x,y); if(playUi) playUiTick(.16, 420 + cell.dir * 16); }
      function setAllDirections(dir){ for(const cell of cells) cell.dir=dir; updateAllCellVisuals(); flashAllCells(); playUiSweep(dir); }
      function rotateAllDirections(){ for(const cell of cells) cell.dir=wrap(cell.dir+1,8); updateAllCellVisuals(); flashAllCells(); playUiSweep(); }

      function applySpeedSetToVoices(){
        const arr = speedArray();
        for (let i=0;i<voices.length;i++) {
          voices[i].interval = arr[i];
          voices[i].color = colorForVoice(i);
        }
      }

      function resetVoices(triggerStartNotes=true){
        voices.length=0;
        const arr = speedArray();
        for(let i=0;i<4;i++){
          const start=CORNERS[i];
          const voice={ idx:i, x:start.x, y:start.y, nextX:start.x, nextY:start.y, elapsed:0, interval:arr[i], color:colorForVoice(i) };
          const next=nextPosition(start.x,start.y); voice.nextX=next.x; voice.nextY=next.y; voices.push(voice);
          if(triggerStartNotes) triggerCell(start.x,start.y,i,true);
        }
      }
      function resetBoard(triggerNotes=true){ loadPreset(currentPreset); resetVoices(triggerNotes); if(triggerNotes) playUiTick(.24,320); }
      function restartFlow(){ resetVoices(true); }
      function nextPosition(x,y){ const dir=DIRS[cells[indexOfCell(x,y)].dir]; return { x:wrap(x+dir.dx,COLS), y:wrap(y+dir.dy,ROWS) }; }
      function triggerCell(x,y,voiceIdx,isStart=false){ markCellPulse(x,y); const cell=cells[indexOfCell(x,y)]; playNote(cell.freq, voiceIdx, isStart ? .85 : 1.0); }

      function updateStatus(){
        if(!isStarted){ statusText.textContent='未開始'; statusDot.classList.remove('running'); return; }
        const tLabel = TIMBRES[currentTimbreKey].name;
        const sLabel = speedSetSelect.options[speedSetSelect.selectedIndex]?.text || SPEED_SET_LABELS[currentSpeedSetKey];
        if(isRunning){ statusText.textContent=`運行中｜${tLabel}｜${sLabel}`; statusDot.classList.add('running'); }
        else { statusText.textContent=`已暫停｜${tLabel}`; statusDot.classList.remove('running'); }
      }

      function setupParticles(){ particles.length=0; for(let i=0;i<28;i++) particles.push({x:Math.random(), y:Math.random(), r:.6+Math.random()*1.7, vx:(Math.random()-.5)*.002, vy:(Math.random()-.5)*.003, a:.15+Math.random()*.35}); }
      function resizeCanvas(){
        const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2));
        stageRect = stage.getBoundingClientRect();
        canvas.width=Math.round(stageRect.width*dpr); canvas.height=Math.round(stageRect.height*dpr);
        canvas.style.width=stageRect.width+'px'; canvas.style.height=stageRect.height+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
        applyGridLayout();
      }
      function moveVoices(dt){
        if(!isStarted || !isRunning) return;
        for(const voice of voices){
          voice.elapsed += dt;
          while(voice.elapsed >= voice.interval){
            voice.elapsed -= voice.interval;
            voice.x = voice.nextX; voice.y = voice.nextY;
            triggerCell(voice.x, voice.y, voice.idx, false);
            const next = nextPosition(voice.x, voice.y); voice.nextX = next.x; voice.nextY = next.y;
          }
        }
      }
      function drawBackgroundGlow(){ const grad=ctx.createRadialGradient(stageRect.width*.5,stageRect.height*.48,10,stageRect.width*.5,stageRect.height*.48,Math.max(stageRect.width,stageRect.height)*.6); grad.addColorStop(0,'rgba(69, 127, 176, .08)'); grad.addColorStop(1,'rgba(6, 18, 35, 0)'); ctx.fillStyle=grad; ctx.fillRect(0,0,stageRect.width,stageRect.height); }
      function drawParticles(dt){ for(const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; if(p.x<-.05)p.x=1.05; if(p.x>1.05)p.x=-.05; if(p.y<-.05)p.y=1.05; if(p.y>1.05)p.y=-.05; ctx.beginPath(); ctx.fillStyle=`rgba(182,219,255,${p.a})`; ctx.arc(p.x*stageRect.width,p.y*stageRect.height,p.r,0,Math.PI*2); ctx.fill(); } }
      function drawVoice(voice){
        const from = cellCenter(voice.x,voice.y); const to = cellCenter(voice.nextX,voice.nextY); const dir = DIRS[cells[indexOfCell(voice.x,voice.y)].dir];
        const t = Math.min(1, voice.elapsed / voice.interval); const wrapped = Math.abs(voice.nextX-voice.x)>1 || Math.abs(voice.nextY-voice.y)>1;
        let px,py,alpha=1;
        if(!wrapped){ px=from.x+(to.x-from.x)*t; py=from.y+(to.y-from.y)*t; }
        else {
          const step = from.cellW;
          if(t<.5){ const local=t/.5; px=from.x+dir.dx*step*local; py=from.y+dir.dy*step*local; alpha=1-local*.8; }
          else { const local=(t-.5)/.5; px=to.x-dir.dx*step*(1-local); py=to.y-dir.dy*step*(1-local); alpha=.2+local*.8; }
        }
        const radius = Math.min(from.cellW, from.cellH) * .14;
        const tailLen = radius * 2.8; const tx = -dir.dx*tailLen*.7; const ty = -dir.dy*tailLen*.7;
        ctx.save(); ctx.globalAlpha = alpha;
        const tailGrad = ctx.createLinearGradient(px,py,px+tx,py+ty); tailGrad.addColorStop(0, hexToRgba(voice.color,.34)); tailGrad.addColorStop(1, hexToRgba(voice.color,0));
        ctx.strokeStyle=tailGrad; ctx.lineWidth=Math.max(2,radius*.9); ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+tx,py+ty); ctx.stroke();
        const glow=ctx.createRadialGradient(px,py,radius*.4,px,py,radius*3.0); glow.addColorStop(0, hexToRgba(voice.color,.95)); glow.addColorStop(1, hexToRgba(voice.color,0));
        ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(px,py,radius*3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=voice.color; ctx.beginPath(); ctx.arc(px,py,radius,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(px-radius*.25, py-radius*.25, radius*.22, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
      function drawScene(dt){ ctx.clearRect(0,0,stageRect.width,stageRect.height); drawBackgroundGlow(); drawParticles(dt); for(const voice of voices) drawVoice(voice); }
      function raf(now){ const dt=Math.min(32,now-lastTime); lastTime=now; moveVoices(dt); drawScene(dt); requestAnimationFrame(raf); }

      function setupAudio(){
        if(audio) return audio;
        const AudioCtx = window.AudioContext || window.webkitAudioContext; if(!AudioCtx) return null;
        const ctxAudio = new AudioCtx();
        const master = ctxAudio.createGain(); master.gain.value = .55;
        const filter = ctxAudio.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = TIMBRES[currentTimbreKey].lowpass; filter.Q.value=.2;
        const delay = ctxAudio.createDelay(.65); delay.delayTime.value=.21;
        const fb = ctxAudio.createGain(); fb.gain.value=.22;
        const wet = ctxAudio.createGain(); wet.gain.value=TIMBRES[currentTimbreKey].wet;
        const dry = ctxAudio.createGain(); dry.gain.value=.95;
        const comp = ctxAudio.createDynamicsCompressor(); comp.threshold.value=-22; comp.knee.value=14; comp.ratio.value=2.2; comp.attack.value=.006; comp.release.value=.18;
        dry.connect(filter); wet.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(filter); filter.connect(comp); comp.connect(master); master.connect(ctxAudio.destination);
        audio = { ctx:ctxAudio, dry, wet, filter }; return audio;
      }
      function ensureAudio(){ const a=setupAudio(); if(!a) return null; if(a.ctx.state==='suspended') a.ctx.resume(); return a; }
      function applyAudioSettings(){ const a = ensureAudio(); if(!a) return; const t = TIMBRES[currentTimbreKey]; a.filter.frequency.setTargetAtTime(t.lowpass, a.ctx.currentTime, .03); a.wet.gain.setTargetAtTime(t.wet, a.ctx.currentTime, .03); }
      function oscillatorOfType(ctxAudio, type, freq){ const o=ctxAudio.createOscillator(); o.type=type; o.frequency.value=freq; return o; }

      function playNote(freq, voiceIdx, velocity=1){
        const a=ensureAudio(); if(!a) return;
        const t = TIMBRES[currentTimbreKey]; const now = a.ctx.currentTime; const gains=t.gain;
        const env = a.ctx.createGain(); const wetSend = a.ctx.createGain(); wetSend.gain.value = Math.min(.42, t.wet + .06);
        const specGain = gains[voiceIdx] || .16;
        env.gain.setValueAtTime(.0001, now);
        env.gain.linearRampToValueAtTime(specGain*velocity, now + t.attack);
        env.gain.exponentialRampToValueAtTime(Math.max(.0001, specGain*velocity*t.sustain), now + t.decay*.45);
        env.gain.exponentialRampToValueAtTime(.0001, now + t.decay);
        const [h1,h2,h3] = t.harmonics;
        const osc1 = oscillatorOfType(a.ctx, t.base, freq * h1);
        const osc2 = oscillatorOfType(a.ctx, t.overtone, freq * h2);
        const osc3 = oscillatorOfType(a.ctx, t.sparkle, freq * h3);
        const spread = t.spread * 120;
        osc1.detune.value = (voiceIdx - 1.5) * spread;
        osc2.detune.value = (voiceIdx - 1.5) * spread * .55;
        osc3.detune.value = (voiceIdx - 1.5) * spread * .28;
        const mix2 = a.ctx.createGain(); mix2.gain.value = .11;
        const mix3 = a.ctx.createGain(); mix3.gain.value = .022;
        osc1.connect(env); osc2.connect(mix2); mix2.connect(env); osc3.connect(mix3); mix3.connect(env);
        env.connect(a.dry); env.connect(wetSend); wetSend.connect(a.wet);
        osc1.start(now); osc2.start(now); osc3.start(now); osc1.stop(now + t.decay + .05); osc2.stop(now + t.decay + .05); osc3.stop(now + t.decay + .05);
      }
      function playUiTick(level=.14, freq=360){ const a=ensureAudio(); if(!a) return; const now=a.ctx.currentTime; const osc=a.ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq; const gain=a.ctx.createGain(); gain.gain.setValueAtTime(.0001, now); gain.gain.linearRampToValueAtTime(level, now+.01); gain.gain.exponentialRampToValueAtTime(.0001, now+.12); osc.connect(gain); gain.connect(a.dry); osc.start(now); osc.stop(now+.14); }
      function playUiSweep(dir=null){ const base = dir==null ? 300 : 280 + dir*22; playUiTick(.12,base); setTimeout(()=>playUiTick(.08,base+44),36); }

      function populateSettings(){
        timbreSelect.innerHTML='';
        for(const [k,v] of Object.entries(TIMBRES)){
          const opt=document.createElement('option'); opt.value=k; opt.textContent=v.name; if(k===currentTimbreKey) opt.selected=true; timbreSelect.appendChild(opt);
        }
        speedSetSelect.innerHTML='';
        for(const [k,label] of Object.entries(SPEED_SET_LABELS)){
          const arr = SPEED_SETS[k]; const opt=document.createElement('option'); opt.value=k; opt.textContent=`${label} ｜ ${arr.join(' / ')} ms`; if(k===currentSpeedSetKey) opt.selected=true; speedSetSelect.appendChild(opt);
        }
      }
      function openSettings(){ previewTimbreKey=currentTimbreKey; previewSpeedSetKey=currentSpeedSetKey; timbreSelect.value=currentTimbreKey; speedSetSelect.value=currentSpeedSetKey; settingsModal.hidden=false; }
      function closeSettings(){ settingsModal.hidden=true; }
      function applySettings(){
        currentTimbreKey = timbreSelect.value; currentSpeedSetKey = speedSetSelect.value; applyAudioSettings(); applySpeedSetToVoices(); updateStatus(); closeSettings(); playUiSweep(2);
      }

      function startExperience(){ ensureAudio(); isStarted=true; isRunning=true; startOverlay.hidden=true; resetBoard(true); applyAudioSettings(); updateStatus(); }
      function togglePause(){ if(!isStarted) return; isRunning=!isRunning; pauseBtn.textContent=isRunning?'暫停':'播放'; if(isRunning) playUiTick(.16,340); else playUiTick(.12,240); updateStatus(); }
      function showHelp(){
        if(!startOverlay.hidden) return; startOverlay.hidden=false;
        if(isStarted){ const card=startOverlay.querySelector('.card'); card.querySelector('h2').textContent='操作說明'; card.querySelector('p').textContent='目前是 v0.11，加入音色與速度 set，先優先維持玩法與觸控手感。'; card.querySelector('.hint-list').innerHTML=`<li>點一下單格：該格順時針旋轉一格</li><li>按住單格：約 0.22 秒後開始持續旋轉，但不發出旋轉提示音</li><li>音色 / 速度：切換 10 種音色與多組速度關係</li>`; startBtn.textContent='回到遊戲'; }
      }
      function hideHelp(){ if(!isStarted) return; startOverlay.hidden=true; const card=startOverlay.querySelector('.card'); card.querySelector('h2').textContent='Luminaria v0.11'; card.querySelector('p').textContent='加入音色選擇與速度 set，並把方格改成正方形間距，四隻顏色依速度由快到慢顯示為紅、橘、綠、藍。'; card.querySelector('.hint-list').innerHTML=`<li>點一下任一格：該格順時針旋轉一格</li><li>按住任一格：約 0.22 秒後開始持續旋轉，但不會發出旋轉提示音</li><li>下方設定可切換 10 種和弦音色與多組速度關係</li>`; startBtn.textContent=isStarted?'回到遊戲':'開始'; }

      function hexToRgba(hex,a){ const h=hex.replace('#',''); const n=parseInt(h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return `rgba(${r},${g},${b},${a})`; }

      startBtn.addEventListener('click',()=>{ if(!isStarted) startExperience(); else hideHelp(); });
      settingsBtn.addEventListener('click', openSettings);
      closeSettingsBtn.addEventListener('click', closeSettings);
      applySettingsBtn.addEventListener('click', applySettings);
      settingsModal.addEventListener('click',(e)=>{ if(e.target===settingsModal) closeSettings(); });
      rotateAllBtn.addEventListener('click', rotateAllDirections);
      resetBtn.addEventListener('click',()=>{ resetBoard(true); if(isStarted) playUiTick(.18,320); });
      restartBtn.addEventListener('click',()=>{ restartFlow(); if(isStarted) playUiTick(.16,300); });
      pauseBtn.addEventListener('click', togglePause);
      presetABtn.addEventListener('click',()=>{ loadPreset('A'); if(isStarted) resetVoices(true); playUiSweep(1); updateStatus(); });
      presetBBtn.addEventListener('click',()=>{ loadPreset('B'); if(isStarted) resetVoices(true); playUiSweep(5); updateStatus(); });
      helpBtn.addEventListener('click', showHelp);
      quickTimbreBtn.addEventListener('click',()=>{ const notes=[146.83,174.61,220.00,329.63]; notes.forEach((f,i)=>setTimeout(()=>playNote(f,i,.92), i*90)); });
      document.querySelectorAll('[data-global-dir]').forEach(btn=>btn.addEventListener('click',()=>setAllDirections(Number(btn.dataset.globalDir))));
      startOverlay.addEventListener('click',(e)=>{ if(e.target===startOverlay && isStarted) hideHelp(); });

      const resizeObserver = new ResizeObserver(()=>resizeCanvas()); resizeObserver.observe(stage); window.addEventListener('resize', resizeCanvas);

      createGrid(); populateSettings(); loadPreset('B'); resetVoices(false); setupParticles(); resizeCanvas(); updateStatus(); requestAnimationFrame(raf);
    })();
  </script>
</body>
</html>
