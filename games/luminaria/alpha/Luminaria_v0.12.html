<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Luminaria v0.12</title>
  <style>
    :root {
      --bg0: #030d18;
      --bg1: #07192d;
      --bg2: #0b2746;
      --text: #dbf6ff;
      --sub: rgba(219, 246, 255, 0.72);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(78, 144, 255, 0.18), transparent 26%),
        radial-gradient(circle at 78% 30%, rgba(91, 232, 255, 0.12), transparent 24%),
        linear-gradient(180deg, var(--bg2), var(--bg1) 42%, var(--bg0));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }
    body { display: flex; }
    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      gap: 8px;
      padding: calc(8px + var(--safe-top)) 8px calc(8px + var(--safe-bottom));
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-height: 28px;
      padding: 0 2px;
    }
    .title { margin: 0; font-size: 0.98rem; font-weight: 700; letter-spacing: .02em; }
    .status { color: var(--sub); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background:
        radial-gradient(circle at 25% 20%, rgba(117, 194, 255, .08), transparent 20%),
        radial-gradient(circle at 72% 26%, rgba(130, 255, 239, .07), transparent 22%),
        radial-gradient(circle at 48% 80%, rgba(123, 128, 255, .08), transparent 24%),
        linear-gradient(180deg, rgba(6, 18, 35, .72), rgba(4, 14, 27, .92));
    }
    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .grid {
      position: absolute;
      z-index: 2;
      display: grid;
      gap: 0;
      justify-content: start;
      align-content: start;
      touch-action: none;
    }
    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      cursor: pointer;
      touch-action: none;
    }
    .cell .halo {
      position: absolute;
      inset: 2%;
      border-radius: 999px;
      opacity: .8;
      background: radial-gradient(circle at center, rgba(88, 192, 255, .10), rgba(88, 192, 255, .045) 42%, rgba(88, 192, 255, 0) 72%);
      pointer-events: none;
    }
    .cell .arrow {
      position: relative;
      z-index: 2;
      font-size: clamp(1.55rem, 3.8vw, 2.15rem);
      font-weight: 700;
      line-height: 1;
      color: rgba(228, 250, 255, .94);
      text-shadow: 0 0 12px rgba(148, 244, 255, .32), 0 0 30px rgba(119, 170, 255, .20);
      transition: transform 120ms ease;
      pointer-events: none;
    }
    .cell.auto .arrow {
      color: rgba(255, 238, 192, .98);
      text-shadow: 0 0 16px rgba(255, 230, 154, .40), 0 0 30px rgba(126, 185, 255, .16);
    }
    .cell.pulse .halo {
      animation: pulseRing 380ms ease-out;
      background: radial-gradient(circle at center, rgba(123,227,255,.30), rgba(123,227,255,.09) 32%, rgba(123,227,255,0) 72%);
    }
    .cell.rotate-flash .arrow { animation: arrowKick 160ms ease; }
    .cell.global-flash .halo {
      background: radial-gradient(circle at center, rgba(160, 238, 255, .18), rgba(123, 227, 255, .07) 45%, rgba(123, 227, 255, 0) 72%);
    }
    @keyframes pulseRing { 0%{opacity:.95; transform:scale(.72);} 100%{opacity:0; transform:scale(1.16);} }
    @keyframes arrowKick { 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }

    .starter-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .starter {
      position: absolute;
      width: 64px;
      height: 64px;
      border: none;
      outline: none;
      border-radius: 999px;
      background: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
    }
    .starter::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 999px;
      background: radial-gradient(circle at center, rgba(255,255,255,.06), rgba(255,255,255,0));
      opacity: .35;
    }
    .starter-layer.hidden { display: none; }

    .controls {
      display: grid;
      gap: 8px;
    }
    .control-row {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(7, 1fr);
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(152, 233, 255, .16);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(16, 37, 66, .76), rgba(9, 22, 43, .84));
      color: var(--text);
      min-height: 48px;
      padding: 0 10px;
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .02em;
      box-shadow: 0 10px 30px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05);
      cursor: pointer;
      transition: transform 120ms ease, border-color 140ms ease;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(.985); }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(1,8,15,.48);
      backdrop-filter: blur(8px);
    }
    .modal[hidden] { display: none; }
    .modal-card {
      width: min(100%, 460px);
      border-radius: 24px;
      padding: 22px 18px 18px;
      background: linear-gradient(180deg, rgba(10, 27, 49, .92), rgba(7, 19, 35, .94));
      border: 1px solid rgba(152, 233, 255, .16);
      box-shadow: 0 18px 44px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .modal-card h2 { margin: 0 0 8px; font-size: 1.18rem; }
    .modal-card p { margin: 0; color: var(--sub); line-height: 1.55; font-size: .92rem; }
    .modal-grid { display: grid; gap: 12px; margin-top: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: .86rem; color: var(--sub); }
    .field select {
      width: 100%;
      min-height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(152, 233, 255, .18);
      background: rgba(9, 22, 43, .88);
      color: var(--text);
      padding: 0 12px;
      font-size: .95rem;
    }
    .speed-swatches { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    .sw { border-radius:12px; padding:8px 6px; text-align:center; font-size:.76rem; background:rgba(255,255,255,.04); }
    .sw i { display:block; width:14px; height:14px; margin:0 auto 6px; border-radius:50%; }
    .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }

    @media (max-width: 680px) {
      .control-row { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 class="title">Luminaria v0.12</h1>
      <div class="status" id="statusText">點一下四角的藻類開始</div>
    </div>

    <div class="stage" id="stage">
      <canvas id="fxCanvas"></canvas>
      <div class="grid" id="grid"></div>
      <div class="starter-layer" id="starterLayer">
        <button class="starter" data-voice="0" aria-label="start-voice-0"></button>
        <button class="starter" data-voice="1" aria-label="start-voice-1"></button>
        <button class="starter" data-voice="2" aria-label="start-voice-2"></button>
        <button class="starter" data-voice="3" aria-label="start-voice-3"></button>
      </div>
      <div class="modal" id="settingsModal" hidden>
        <div class="modal-card">
          <h2>音色與速度</h2>
          <p>音色會套用到四隻 Luminaria 的和弦觸發；速度會成套改變四隻的節拍關係。</p>
          <div class="modal-grid">
            <div class="field">
              <label for="timbreSelect">音色選擇</label>
              <select id="timbreSelect"></select>
            </div>
            <div class="field">
              <label for="speedSetSelect">速度 Set</label>
              <select id="speedSetSelect"></select>
            </div>
            <div class="speed-swatches">
              <div class="sw"><i style="background:#ff5d66"></i>最快</div>
              <div class="sw"><i style="background:#ffae57"></i>次快</div>
              <div class="sw"><i style="background:#62d88c"></i>次慢</div>
              <div class="sw"><i style="background:#61b8ff"></i>最慢</div>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn" id="closeSettingsBtn">關閉</button>
            <button class="btn" id="applySettingsBtn">套用</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="control-row">
        <button class="btn" id="rotateAllBtn">↺</button>
        <button class="btn" data-global-dir="0">↑</button>
        <button class="btn" data-global-dir="2">→</button>
        <button class="btn" data-global-dir="4">↓</button>
        <button class="btn" data-global-dir="6">←</button>
        <button class="btn" id="resetBtn">重置</button>
        <button class="btn" id="settingsBtn">音色 / 速度</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const PORTRAIT_COLS = 4;
      const PORTRAIT_ROWS = 8;
      const HOLD_DELAY = 260;
      const HOLD_STEP = 100;
      const DRAG_THRESHOLD = 10;
      const COLOR_FAST_TO_SLOW = ['#ff5d66','#ffae57','#62d88c','#61b8ff'];
      const PRESET_B = [
        [2, 3, 5, 6], [1, 2, 4, 7], [0, 1, 6, 5], [3, 0, 7, 6],
        [2, 1, 7, 4], [5, 2, 0, 7], [1, 4, 2, 5], [0, 1, 7, 6]
      ];
      const NOTE_GRID_PORTRAIT = [
        ['D3','F3','A3','E4'], ['D3','F3','A3','E4'], ['F3','A3','C4','E4'], ['F3','A3','C4','E4'],
        ['C3','E3','G3','D4'], ['C3','E3','G3','D4'], ['A2','C3','E3','B3'], ['A2','C3','E3','B3']
      ];
      const NOTE_FREQ = {
        'A2':110.00,'B3':246.94,'C3':130.81,'C4':261.63,'D3':146.83,'D4':293.66,'E3':164.81,'E4':329.63,'F3':174.61,'G3':196.00,'A3':220.00
      };
      const DIRS = [
        { dx: 0, dy: -1, symbol: '↑' },
        { dx: 1, dy: -1, symbol: '↗' },
        { dx: 1, dy: 0, symbol: '→' },
        { dx: 1, dy: 1, symbol: '↘' },
        { dx: 0, dy: 1, symbol: '↓' },
        { dx: -1, dy: 1, symbol: '↙' },
        { dx: -1, dy: 0, symbol: '←' },
        { dx: -1, dy: -1, symbol: '↖' }
      ];
      const SPEED_SETS = {
        calm:[1200, 900, 650, 450],
        triad:[1350, 900, 675, 450],
        pulse:[1440, 1080, 720, 540],
        dotted:[1200, 800, 600, 400],
        dense:[1000, 750, 500, 375],
        bloom:[1500, 1000, 750, 500],
        canon:[1600, 1200, 800, 400]
      };
      const SPEED_SET_LABELS = {
        calm:'Calm 4:3:2.17:1.5',
        triad:'Triad 3:2:1.5:1',
        pulse:'Pulse 8:6:4:3',
        dotted:'Dotted 3:2:1.5:1',
        dense:'Dense 8:6:4:3',
        bloom:'Bloom 3:2:1.5:1',
        canon:'Canon 4:3:2:1'
      };
      const TIMBRES = {
        warmPad:   { name:'暖霧 Pad', base:'sine', overtone:'triangle', sparkle:'sine', lowpass:1500, attack:.022, decay:.90, sustain:.42, wet:.24, spread:.015, gain:[.26,.21,.17,.14], harmonics:[1,2,3.01] },
        glassChoir:{ name:'玻璃 Choir', base:'triangle', overtone:'sine', sparkle:'sine', lowpass:2200, attack:.010, decay:.58, sustain:.25, wet:.28, spread:.020, gain:[.22,.18,.15,.12], harmonics:[1,2.01,4.02] },
        mellowBell:{ name:'柔鐘 Bell', base:'sine', overtone:'sine', sparkle:'triangle', lowpass:2600, attack:.004, decay:.72, sustain:.18, wet:.20, spread:.022, gain:[.23,.18,.14,.11], harmonics:[1,2.99,5.02] },
        reedCloud: { name:'簧霧 Reed', base:'triangle', overtone:'triangle', sparkle:'sine', lowpass:1700, attack:.014, decay:.82, sustain:.34, wet:.23, spread:.017, gain:[.24,.20,.16,.13], harmonics:[1,2,2.5] },
        aquaOrgan: { name:'水紋 Organ', base:'sine', overtone:'triangle', sparkle:'sine', lowpass:1400, attack:.018, decay:1.0, sustain:.46, wet:.26, spread:.010, gain:[.25,.20,.16,.13], harmonics:[1,2,4] },
        amberChime:{ name:'琥珀 Chime', base:'triangle', overtone:'sine', sparkle:'triangle', lowpass:2400, attack:.006, decay:.66, sustain:.20, wet:.21, spread:.024, gain:[.22,.18,.15,.12], harmonics:[1,3.01,6.02] },
        nightBloom: { name:'夜綻 Bloom', base:'sine', overtone:'triangle', sparkle:'sine', lowpass:1800, attack:.026, decay:1.08, sustain:.40, wet:.30, spread:.018, gain:[.25,.20,.16,.13], harmonics:[1,2.01,3.99] },
        softPluck: { name:'柔撥 Pluck', base:'triangle', overtone:'sine', sparkle:'sine', lowpass:2000, attack:.003, decay:.44, sustain:.12, wet:.16, spread:.012, gain:[.20,.17,.14,.11], harmonics:[1,2.5,4.5] },
        lunarFM:   { name:'月面 FM', base:'sine', overtone:'sine', sparkle:'triangle', lowpass:2100, attack:.008, decay:.74, sustain:.22, wet:.24, spread:.028, gain:[.22,.18,.15,.11], harmonics:[1,2.01,3.7] },
        velvetPipe:{ name:'絲絨 Pipe', base:'triangle', overtone:'triangle', sparkle:'sine', lowpass:1600, attack:.016, decay:.88, sustain:.38, wet:.22, spread:.016, gain:[.24,.20,.16,.13], harmonics:[1,1.99,3.01] }
      };

      const stage = document.getElementById('stage');
      const gridEl = document.getElementById('grid');
      const fxCanvas = document.getElementById('fxCanvas');
      const ctx = fxCanvas.getContext('2d');
      const starterLayer = document.getElementById('starterLayer');
      const statusText = document.getElementById('statusText');
      const rotateAllBtn = document.getElementById('rotateAllBtn');
      const resetBtn = document.getElementById('resetBtn');
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsModal = document.getElementById('settingsModal');
      const timbreSelect = document.getElementById('timbreSelect');
      const speedSetSelect = document.getElementById('speedSetSelect');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');
      const applySettingsBtn = document.getElementById('applySettingsBtn');

      const portraitDirs = PRESET_B.map(r => r.slice());
      let cellButtons = [];
      let currentLayout = { portrait: true, cols: 4, rows: 8 };
      let currentTimbreKey = 'warmPad';
      let currentSpeedSetKey = 'calm';
      let audio = null;
      let isStarted = false;
      let isRunning = false;
      let lastTime = performance.now();
      let stageRect = { width:1, height:1 };
      let particles = [];
      let voices = [];
      let pointerState = null;
      const spinnerTimers = new Map();

      function updateLayoutChoice(){
        const portrait = window.innerWidth <= window.innerHeight;
        currentLayout = portrait ? { portrait:true, cols:4, rows:8 } : { portrait:false, cols:8, rows:4 };
      }
      function cols(){ return currentLayout.cols; }
      function rows(){ return currentLayout.rows; }
      function wrap(v,max){ return (v + max) % max; }
      function keyOfPortrait(px,py){ return `${px},${py}`; }
      function displayToPortrait(x,y){ return currentLayout.portrait ? { px:x, py:y } : { px:y, py:x }; }
      function portraitToDisplay(px,py){ return currentLayout.portrait ? { x:px, y:py } : { x:py, y:px }; }
      function indexOfCell(x,y){ return y * cols() + x; }
      function getPortraitDir(px,py){ return portraitDirs[py][px]; }
      function setPortraitDir(px,py,dir){ portraitDirs[py][px] = wrap(dir,8); }
      function getDisplayedDir(x,y){ const p=displayToPortrait(x,y); return getPortraitDir(p.px,p.py); }
      function getDisplayedNote(x,y){ const p=displayToPortrait(x,y); return NOTE_GRID_PORTRAIT[p.py][p.px]; }
      function speedArray(){ return SPEED_SETS[currentSpeedSetKey]; }
      function sortedSpeedIndicesDesc(){ return speedArray().map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v).map(o=>o.i); }
      function colorForVoice(voiceIdx){ const order = sortedSpeedIndicesDesc(); const rank = order.indexOf(voiceIdx); return COLOR_FAST_TO_SLOW[Math.max(0, rank)]; }
      function isSpinnerPortrait(px,py){ return spinnerTimers.has(keyOfPortrait(px,py)); }

      function populateSettings(){
        timbreSelect.innerHTML='';
        for(const [k,v] of Object.entries(TIMBRES)){
          const opt=document.createElement('option');
          opt.value=k;
          opt.textContent=v.name;
          if(k===currentTimbreKey) opt.selected=true;
          timbreSelect.appendChild(opt);
        }
        speedSetSelect.innerHTML='';
        for(const [k,label] of Object.entries(SPEED_SET_LABELS)){
          const arr = SPEED_SETS[k];
          const opt=document.createElement('option');
          opt.value=k;
          opt.textContent=`${label} ｜ ${arr.join(' / ')} ms`;
          if(k===currentSpeedSetKey) opt.selected=true;
          speedSetSelect.appendChild(opt);
        }
      }

      function computeGridMetrics(){
        const pad = 2;
        const availW = stageRect.width - pad * 2;
        const availH = stageRect.height - pad * 2;
        const cell = Math.floor(Math.min(availW / cols(), availH / rows()));
        const totalW = cell * cols();
        const totalH = cell * rows();
        const startX = Math.floor((stageRect.width - totalW) / 2);
        const startY = Math.floor((stageRect.height - totalH) / 2);
        return { cell, startX, startY, totalW, totalH };
      }
      function cellCenter(x,y){
        const m = computeGridMetrics();
        return { x: m.startX + x*m.cell + m.cell/2, y: m.startY + y*m.cell + m.cell/2, cell: m.cell };
      }
      function pointToCell(clientX, clientY){
        const rect = stage.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const m = computeGridMetrics();
        if (x < m.startX || y < m.startY || x >= m.startX + m.totalW || y >= m.startY + m.totalH) return null;
        const cx = Math.floor((x - m.startX) / m.cell);
        const cy = Math.floor((y - m.startY) / m.cell);
        if(cx < 0 || cy < 0 || cx >= cols() || cy >= rows()) return null;
        return { x: cx, y: cy };
      }
      function vectorToDir(dx,dy){
        const ang = Math.atan2(dy, dx);
        const oct = Math.round(ang / (Math.PI / 4));
        return wrap(oct + 2, 8);
      }

      function buildGrid(){
        gridEl.innerHTML = '';
        cellButtons = [];
        gridEl.style.gridTemplateColumns = `repeat(${cols()}, 1fr)`;
        gridEl.style.gridTemplateRows = `repeat(${rows()}, 1fr)`;
        for(let y=0; y<rows(); y++){
          for(let x=0; x<cols(); x++){
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.x = String(x);
            cell.dataset.y = String(y);
            cell.innerHTML = '<span class="halo"></span><span class="arrow">↑</span>';
            gridEl.appendChild(cell);
            cellButtons.push(cell);
          }
        }
        applyGridLayout();
        refreshGridVisuals();
      }

      function applyGridLayout(){
        const m = computeGridMetrics();
        gridEl.style.left = `${m.startX}px`;
        gridEl.style.top = `${m.startY}px`;
        gridEl.style.width = `${m.totalW}px`;
        gridEl.style.height = `${m.totalH}px`;
        for(const el of cellButtons){
          el.style.width = `${m.cell}px`;
          el.style.height = `${m.cell}px`;
        }
        layoutStarterButtons();
      }
      function layoutStarterButtons(){
        const starters = [...starterLayer.querySelectorAll('.starter')];
        for(let i=0;i<4;i++){
          const pos = currentVoiceVisualPosition(i);
          const size = Math.max(34, pos.cell * 0.88);
          const btn = starters[i];
          btn.style.width = `${size}px`;
          btn.style.height = `${size}px`;
          btn.style.left = `${pos.x}px`;
          btn.style.top = `${pos.y}px`;
        }
      }
      function currentVoiceVisualPosition(i){
        const voice = voices[i];
        const center = voice ? cellCenter(voice.x, voice.y) : cellCenter(i % 2 ? cols()-1 : 0, i < 2 ? 0 : rows()-1);
        return center;
      }

      function refreshGridVisuals(){
        for(let y=0;y<rows();y++){
          for(let x=0;x<cols();x++) updateCellVisual(x,y);
        }
      }
      function updateCellVisual(x,y){
        const el = cellButtons[indexOfCell(x,y)];
        if(!el) return;
        const p = displayToPortrait(x,y);
        el.querySelector('.arrow').textContent = DIRS[getPortraitDir(p.px,p.py)].symbol;
        el.classList.toggle('auto', isSpinnerPortrait(p.px,p.py));
      }
      function markCellPulse(x,y){
        const el = cellButtons[indexOfCell(x,y)];
        if(!el) return;
        el.classList.remove('pulse');
        void el.offsetWidth;
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 380);
      }
      function markRotateFlash(x,y){
        const el = cellButtons[indexOfCell(x,y)];
        if(!el) return;
        el.classList.remove('rotate-flash');
        void el.offsetWidth;
        el.classList.add('rotate-flash');
        setTimeout(() => el.classList.remove('rotate-flash'), 160);
      }
      function flashAllCells(){
        for(const el of cellButtons){
          el.classList.remove('global-flash');
          void el.offsetWidth;
          el.classList.add('global-flash');
          setTimeout(() => el.classList.remove('global-flash'), 260);
        }
      }

      function setDisplayedDirection(x,y,dir,{flash=true, stopSpin=true}={}){
        const p = displayToPortrait(x,y);
        if(stopSpin) stopSpinner(p.px,p.py);
        setPortraitDir(p.px,p.py,dir);
        updateCellVisual(x,y);
        if(flash) markRotateFlash(x,y);
        updateVoiceNextTargets();
      }
      function rotateDisplayedCell(x,y,step=1,{playUi=false, stopSpin=true}={}){
        const p = displayToPortrait(x,y);
        if(stopSpin) stopSpinner(p.px,p.py);
        setPortraitDir(p.px,p.py, getPortraitDir(p.px,p.py) + step);
        updateCellVisual(x,y);
        markRotateFlash(x,y);
        if(playUi) playUiTick(.16, 420 + getPortraitDir(p.px,p.py) * 16);
        updateVoiceNextTargets();
      }
      function rotateAllDirections(){
        stopAllSpinners();
        for(let py=0; py<PORTRAIT_ROWS; py++) for(let px=0; px<PORTRAIT_COLS; px++) setPortraitDir(px,py, getPortraitDir(px,py)+1);
        refreshGridVisuals();
        flashAllCells();
        updateVoiceNextTargets();
        playUiSweep();
      }
      function setAllDirections(dir){
        stopAllSpinners();
        for(let py=0; py<PORTRAIT_ROWS; py++) for(let px=0; px<PORTRAIT_COLS; px++) setPortraitDir(px,py, dir);
        refreshGridVisuals();
        flashAllCells();
        updateVoiceNextTargets();
        playUiSweep(dir);
      }

      function startSpinner(x,y){
        const key = keyOfPortrait(x,y);
        if(spinnerTimers.has(key)) return;
        const timer = setInterval(() => {
          setPortraitDir(x,y, getPortraitDir(x,y) + 1);
          const display = portraitToDisplay(x,y);
          updateCellVisual(display.x, display.y);
          markRotateFlash(display.x, display.y);
          updateVoiceNextTargets();
        }, HOLD_STEP);
        spinnerTimers.set(key, timer);
        const display = portraitToDisplay(x,y);
        updateCellVisual(display.x, display.y);
      }
      function stopSpinner(x,y){
        const key = keyOfPortrait(x,y);
        const timer = spinnerTimers.get(key);
        if(timer){ clearInterval(timer); spinnerTimers.delete(key); }
        const display = portraitToDisplay(x,y);
        updateCellVisual(display.x, display.y);
      }
      function stopAllSpinners(){
        for(const timer of spinnerTimers.values()) clearInterval(timer);
        spinnerTimers.clear();
        refreshGridVisuals();
      }

      function initVoices(){
        voices = [];
        const intervals = speedArray();
        const starts = [
          {x:0, y:0},
          {x:cols()-1, y:0},
          {x:0, y:rows()-1},
          {x:cols()-1, y:rows()-1}
        ];
        for(let i=0;i<4;i++){
          const s = starts[i];
          const next = nextPosition(s.x,s.y);
          voices.push({ idx:i, x:s.x, y:s.y, nextX:next.x, nextY:next.y, elapsed:0, interval:intervals[i], color:colorForVoice(i) });
        }
      }
      function updateVoiceIntervals(){
        const intervals = speedArray();
        for(let i=0;i<voices.length;i++){
          voices[i].interval = intervals[i];
          voices[i].color = colorForVoice(i);
        }
      }
      function updateVoiceNextTargets(){
        for(const voice of voices){
          const next = nextPosition(voice.x, voice.y);
          voice.nextX = next.x;
          voice.nextY = next.y;
        }
      }
      function nextPosition(x,y){
        const dir = DIRS[getDisplayedDir(x,y)];
        return { x: wrap(x + dir.dx, cols()), y: wrap(y + dir.dy, rows()) };
      }
      function triggerCell(x,y,voiceIdx,isStart=false){
        markCellPulse(x,y);
        const note = getDisplayedNote(x,y);
        playNote(NOTE_FREQ[note], voiceIdx, isStart ? .85 : 1.0);
      }
      function startMotion(){
        ensureAudio();
        isStarted = true;
        isRunning = true;
        starterLayer.classList.add('hidden');
        for(let i=0;i<voices.length;i++) triggerCell(voices[i].x, voices[i].y, i, true);
        updateStatus();
      }
      function resetFlow(){
        stopAllSpinners();
        initVoices();
        if(isStarted) {
          isRunning = true;
          starterLayer.classList.add('hidden');
          for(let i=0;i<voices.length;i++) triggerCell(voices[i].x, voices[i].y, i, true);
        } else {
          starterLayer.classList.remove('hidden');
        }
        updateStatus();
      }

      function hexToRgba(hex,a){ const h=hex.replace('#',''); const n=parseInt(h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return `rgba(${r},${g},${b},${a})`; }
      function setupParticles(){ particles = []; for(let i=0;i<28;i++) particles.push({x:Math.random(), y:Math.random(), r:.6+Math.random()*1.7, vx:(Math.random()-.5)*.002, vy:(Math.random()-.5)*.002, a:.06+Math.random()*.16}); }
      function drawBackgroundGlow(){ const grad=ctx.createRadialGradient(stageRect.width*.5,stageRect.height*.48,10,stageRect.width*.5,stageRect.height*.48,Math.max(stageRect.width,stageRect.height)*.6); grad.addColorStop(0,'rgba(69, 127, 176, .08)'); grad.addColorStop(1,'rgba(6, 18, 35, 0)'); ctx.fillStyle=grad; ctx.fillRect(0,0,stageRect.width,stageRect.height); }
      function drawParticles(dt){ for(const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; if(p.x<-.05)p.x=1.05; if(p.x>1.05)p.x=-.05; if(p.y<-.05)p.y=1.05; if(p.y>1.05)p.y=-.05; ctx.beginPath(); ctx.fillStyle=`rgba(182,219,255,${p.a})`; ctx.arc(p.x*stageRect.width,p.y*stageRect.height,p.r,0,Math.PI*2); ctx.fill(); } }
      function drawVoice(voice){
        const from = cellCenter(voice.x, voice.y);
        const to = cellCenter(voice.nextX, voice.nextY);
        const dir = DIRS[getDisplayedDir(voice.x, voice.y)];
        const t = (!isStarted || !isRunning) ? 0 : Math.min(1, voice.elapsed / voice.interval);
        const wrapped = Math.abs(voice.nextX - voice.x) > 1 || Math.abs(voice.nextY - voice.y) > 1;
        let px, py, alpha = 1;
        if(!wrapped){ px = from.x + (to.x - from.x) * t; py = from.y + (to.y - from.y) * t; }
        else {
          const step = from.cell;
          if(t < .5){ const local=t/.5; px=from.x+dir.dx*step*local; py=from.y+dir.dy*step*local; alpha=1-local*.8; }
          else { const local=(t-.5)/.5; px=to.x-dir.dx*step*(1-local); py=to.y-dir.dy*step*(1-local); alpha=.2+local*.8; }
        }
        const radius = Math.max(6, from.cell * .14);
        const tailLen = radius * 2.8;
        const tx = -dir.dx*tailLen*.7;
        const ty = -dir.dy*tailLen*.7;
        ctx.save();
        ctx.globalAlpha = alpha;
        const tailGrad = ctx.createLinearGradient(px,py,px+tx,py+ty);
        tailGrad.addColorStop(0, hexToRgba(voice.color,.34));
        tailGrad.addColorStop(1, hexToRgba(voice.color,0));
        ctx.strokeStyle = tailGrad;
        ctx.lineWidth = Math.max(2, radius*.9);
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+tx,py+ty); ctx.stroke();
        const glow = ctx.createRadialGradient(px,py,radius*.4,px,py,radius*3.0);
        glow.addColorStop(0, hexToRgba(voice.color,.95));
        glow.addColorStop(1, hexToRgba(voice.color,0));
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px,py,radius*3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = voice.color; ctx.beginPath(); ctx.arc(px,py,radius,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(px-radius*.25, py-radius*.25, radius*.22, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
      function drawScene(dt){ ctx.clearRect(0,0,stageRect.width,stageRect.height); drawBackgroundGlow(); drawParticles(dt); for(const voice of voices) drawVoice(voice); }
      function moveVoices(dt){
        if(!isStarted || !isRunning) return;
        for(const voice of voices){
          voice.elapsed += dt;
          while(voice.elapsed >= voice.interval){
            voice.elapsed -= voice.interval;
            voice.x = voice.nextX;
            voice.y = voice.nextY;
            triggerCell(voice.x, voice.y, voice.idx, false);
            const next = nextPosition(voice.x, voice.y);
            voice.nextX = next.x;
            voice.nextY = next.y;
          }
        }
      }
      function raf(now){ const dt = Math.min(32, now - lastTime); lastTime = now; moveVoices(dt); drawScene(dt); requestAnimationFrame(raf); }

      function setupAudio(){
        if(audio) return audio;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if(!AudioCtx) return null;
        const ctxAudio = new AudioCtx();
        const master = ctxAudio.createGain(); master.gain.value = .55;
        const filter = ctxAudio.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = TIMBRES[currentTimbreKey].lowpass; filter.Q.value=.2;
        const delay = ctxAudio.createDelay(.65); delay.delayTime.value=.21;
        const fb = ctxAudio.createGain(); fb.gain.value=.22;
        const wet = ctxAudio.createGain(); wet.gain.value = TIMBRES[currentTimbreKey].wet;
        const dry = ctxAudio.createGain(); dry.gain.value = .95;
        const comp = ctxAudio.createDynamicsCompressor(); comp.threshold.value=-22; comp.knee.value=14; comp.ratio.value=2.2; comp.attack.value=.006; comp.release.value=.18;
        dry.connect(filter); wet.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(filter); filter.connect(comp); comp.connect(master); master.connect(ctxAudio.destination);
        audio = { ctx:ctxAudio, dry, wet, filter };
        return audio;
      }
      function ensureAudio(){ const a=setupAudio(); if(!a) return null; if(a.ctx.state==='suspended') a.ctx.resume(); return a; }
      function applyAudioSettings(){ const a = ensureAudio(); if(!a) return; const t = TIMBRES[currentTimbreKey]; a.filter.frequency.setTargetAtTime(t.lowpass, a.ctx.currentTime, .03); a.wet.gain.setTargetAtTime(t.wet, a.ctx.currentTime, .03); }
      function oscillatorOfType(ctxAudio, type, freq){ const o=ctxAudio.createOscillator(); o.type=type; o.frequency.value=freq; return o; }
      function playNote(freq, voiceIdx, velocity=1){
        const a=ensureAudio(); if(!a) return;
        const t = TIMBRES[currentTimbreKey]; const now = a.ctx.currentTime; const gains=t.gain;
        const env = a.ctx.createGain(); const wetSend = a.ctx.createGain(); wetSend.gain.value = Math.min(.42, t.wet + .06);
        const specGain = gains[voiceIdx] || .16;
        env.gain.setValueAtTime(.0001, now);
        env.gain.linearRampToValueAtTime(specGain*velocity, now + t.attack);
        env.gain.exponentialRampToValueAtTime(Math.max(.0001, specGain*velocity*t.sustain), now + t.decay*.45);
        env.gain.exponentialRampToValueAtTime(.0001, now + t.decay);
        const [h1,h2,h3] = t.harmonics;
        const osc1 = oscillatorOfType(a.ctx, t.base, freq * h1);
        const osc2 = oscillatorOfType(a.ctx, t.overtone, freq * h2);
        const osc3 = oscillatorOfType(a.ctx, t.sparkle, freq * h3);
        const spread = t.spread * 120;
        osc1.detune.value = (voiceIdx - 1.5) * spread;
        osc2.detune.value = (voiceIdx - 1.5) * spread * .55;
        osc3.detune.value = (voiceIdx - 1.5) * spread * .28;
        const mix2 = a.ctx.createGain(); mix2.gain.value = .11;
        const mix3 = a.ctx.createGain(); mix3.gain.value = .022;
        osc1.connect(env); osc2.connect(mix2); mix2.connect(env); osc3.connect(mix3); mix3.connect(env);
        env.connect(a.dry); env.connect(wetSend); wetSend.connect(a.wet);
        osc1.start(now); osc2.start(now); osc3.start(now);
        osc1.stop(now + t.decay + .05); osc2.stop(now + t.decay + .05); osc3.stop(now + t.decay + .05);
      }
      function playUiTick(level=.14, freq=360){ const a=ensureAudio(); if(!a) return; const now=a.ctx.currentTime; const osc=a.ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq; const gain=a.ctx.createGain(); gain.gain.setValueAtTime(.0001, now); gain.gain.linearRampToValueAtTime(level, now+.01); gain.gain.exponentialRampToValueAtTime(.0001, now+.12); osc.connect(gain); gain.connect(a.dry); osc.start(now); osc.stop(now+.14); }
      function playUiSweep(dir=null){ const base = dir==null ? 300 : 280 + dir*22; playUiTick(.12,base); setTimeout(()=>playUiTick(.08,base+44),36); }

      function updateStatus(){
        const tLabel = TIMBRES[currentTimbreKey].name;
        const sLabel = SPEED_SET_LABELS[currentSpeedSetKey];
        if(!isStarted) statusText.textContent = `點一下四角的藻類開始｜${tLabel}｜${sLabel}`;
        else statusText.textContent = `運行中｜${tLabel}｜${sLabel}`;
      }

      function applySettings(){
        currentTimbreKey = timbreSelect.value;
        currentSpeedSetKey = speedSetSelect.value;
        applyAudioSettings();
        updateVoiceIntervals();
        updateStatus();
        settingsModal.hidden = true;
        playUiSweep(2);
      }
      function openSettings(){ timbreSelect.value = currentTimbreKey; speedSetSelect.value = currentSpeedSetKey; settingsModal.hidden = false; }
      function closeSettings(){ settingsModal.hidden = true; }

      function handleTapCell(cell){
        const p = displayToPortrait(cell.x, cell.y);
        if(isSpinnerPortrait(p.px,p.py)) { stopSpinner(p.px,p.py); return; }
        rotateDisplayedCell(cell.x, cell.y, 1, {playUi:true, stopSpin:false});
      }
      function assignDirectionAlongSegment(x1,y1,x2,y2,dir){
        const dx = x2 - x1;
        const dy = y2 - y1;
        const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 8));
        for(let i=0;i<=steps;i++){
          const px = x1 + dx * (i / steps);
          const py = y1 + dy * (i / steps);
          const cell = pointToCell(px + stage.getBoundingClientRect().left, py + stage.getBoundingClientRect().top);
          if(cell) setDisplayedDirection(cell.x, cell.y, dir, {flash:true, stopSpin:true});
        }
      }

      function bindGridGestures(){
        gridEl.addEventListener('pointerdown', (e) => {
          if(e.target.closest('.starter') || settingsModal.contains(e.target)) return;
          const cell = pointToCell(e.clientX, e.clientY);
          if(!cell) return;
          e.preventDefault();
          gridEl.setPointerCapture(e.pointerId);
          pointerState = {
            pointerId: e.pointerId,
            downCell: cell,
            startX: e.clientX,
            startY: e.clientY,
            lastX: e.clientX,
            lastY: e.clientY,
            dragActive: false,
            holdTriggered: false,
            holdTimer: setTimeout(() => {
              if(!pointerState || pointerState.pointerId !== e.pointerId || pointerState.dragActive) return;
              const p = displayToPortrait(cell.x, cell.y);
              startSpinner(p.px, p.py);
              pointerState.holdTriggered = true;
            }, HOLD_DELAY)
          };
        });

        gridEl.addEventListener('pointermove', (e) => {
          if(!pointerState || pointerState.pointerId !== e.pointerId) return;
          const dxTotal = e.clientX - pointerState.startX;
          const dyTotal = e.clientY - pointerState.startY;
          const movedEnough = Math.hypot(dxTotal, dyTotal) > DRAG_THRESHOLD;
          if(movedEnough && !pointerState.dragActive){
            pointerState.dragActive = true;
            clearTimeout(pointerState.holdTimer);
          }
          if(pointerState.dragActive){
            const segDx = e.clientX - pointerState.lastX;
            const segDy = e.clientY - pointerState.lastY;
            if(Math.hypot(segDx, segDy) > 6){
              const dir = vectorToDir(segDx, segDy);
              assignDirectionAlongSegment(pointerState.lastX - stage.getBoundingClientRect().left, pointerState.lastY - stage.getBoundingClientRect().top, e.clientX - stage.getBoundingClientRect().left, e.clientY - stage.getBoundingClientRect().top, dir);
              pointerState.lastX = e.clientX;
              pointerState.lastY = e.clientY;
            }
          }
        });

        function endPointer(e){
          if(!pointerState || pointerState.pointerId !== e.pointerId) return;
          clearTimeout(pointerState.holdTimer);
          const local = pointToCell(e.clientX, e.clientY) || pointerState.downCell;
          if(!pointerState.dragActive && !pointerState.holdTriggered && local) handleTapCell(local);
          pointerState = null;
        }
        gridEl.addEventListener('pointerup', endPointer);
        gridEl.addEventListener('pointercancel', endPointer);
      }

      function handleResize(){
        const oldLayout = { ...currentLayout };
        const toPortraitOld = (x,y) => oldLayout.portrait ? { px:x, py:y } : { px:y, py:x };
        const oldVoicesPortrait = voices.map(v => ({
          base: toPortraitOld(v.x, v.y),
          next: toPortraitOld(v.nextX, v.nextY),
          elapsed: v.elapsed,
          interval: v.interval,
          idx: v.idx,
          color: v.color
        }));
        updateLayoutChoice();
        stageRect.width = stage.clientWidth;
        stageRect.height = stage.clientHeight;
        fxCanvas.width = Math.max(1, Math.floor(stageRect.width * devicePixelRatio));
        fxCanvas.height = Math.max(1, Math.floor(stageRect.height * devicePixelRatio));
        fxCanvas.style.width = `${stageRect.width}px`;
        fxCanvas.style.height = `${stageRect.height}px`;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        if(oldLayout.portrait !== currentLayout.portrait || cellButtons.length !== cols() * rows()){
          buildGrid();
          if(oldVoicesPortrait.length){
            voices = oldVoicesPortrait.map(v => {
              const base = portraitToDisplay(v.base.px, v.base.py);
              const next = portraitToDisplay(v.next.px, v.next.py);
              return { idx:v.idx, x:base.x, y:base.y, nextX:next.x, nextY:next.y, elapsed:v.elapsed, interval:v.interval, color:v.color };
            });
          } else {
            initVoices();
          }
        } else {
          applyGridLayout();
          refreshGridVisuals();
        }
        updateVoiceNextTargets();
        layoutStarterButtons();
      }

      [...starterLayer.querySelectorAll('.starter')].forEach(btn => {
        btn.addEventListener('click', () => { if(!isStarted) startMotion(); });
      });
      rotateAllBtn.addEventListener('click', rotateAllDirections);
      resetBtn.addEventListener('click', resetFlow);
      document.querySelectorAll('[data-global-dir]').forEach(btn => btn.addEventListener('click', () => setAllDirections(Number(btn.dataset.globalDir))));
      settingsBtn.addEventListener('click', openSettings);
      closeSettingsBtn.addEventListener('click', closeSettings);
      applySettingsBtn.addEventListener('click', applySettings);
      settingsModal.addEventListener('click', (e) => { if(e.target === settingsModal) closeSettings(); });

      populateSettings();
      updateLayoutChoice();
      buildGrid();
      initVoices();
      setupParticles();
      bindGridGestures();
      handleResize();
      updateStatus();
      requestAnimationFrame(raf);
      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', handleResize);
    })();
  </script>
</body>
</html>
