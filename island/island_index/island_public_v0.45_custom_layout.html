function isValidGames(g){return Array.isArray(g)&&g.length>=20&&g.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.url==='string'&&Array.isArray(x.cats)&&x.cats.length>0)}
function readGameCache(){try{const c=JSON.parse(localStorage.getItem(GAME_CACHE_KEY)||'null');return c&&isValidGames(c.games)&&Number.isFinite(c.checkedAt)?c:null}catch{return null}}
function writeGameCache(games){if(!isValidGames(games))return;try{localStorage.setItem(GAME_CACHE_KEY,JSON.stringify({checkedAt:Date.now(),games}))}catch(e){console.warn('GAME_LIST 快取無法儲存',e)}}
async function fetchFreshGames(){let err;for(const u of URLS){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const games=parseGames(await r.text());if(!isValidGames(games))throw Error('GAME_LIST 格式無效');return games}catch(e){err=e}}throw err}
function refreshGameCache(){fetchFreshGames().then(g=>{const old=readGameCache();const changed=!old||JSON.stringify(old.games)!==JSON.stringify(g);writeGameCache(g);if(changed)console.info('遊戲清單已更新，下次重新載入套用。')}).catch(e=>console.warn('背景更新 GAME_LIST 失敗，繼續使用現有資料',e))}
async function loadGames(){
 const cache=readGameCache();
 if(cache){if(Date.now()-cache.checkedAt>=GAME_CACHE_TTL)refreshGameCache();return cache.games}
 try{const games=await fetchFreshGames();writeGameCache(games);return games}
 catch(err){console.warn('使用內建備援遊戲清單',err);return FALLBACK_GAMES.map(g=>({...g,cats:[...g.cats],tags:[...g.tags]}))}
}

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
const hoverTip=$('#hover-tip'),hoverTitle=$('#hover-title'),hoverMeta=$('#hover-meta'),hoverHelp=$('#hover-help');
let down=null,hoveredKey='',lastHoverCheck=0;

function pickGameOrLandmark(e){
 if(!pointerRay(e))return null;
 // Pick the nearest game/landmark, while allowing a game within a larger landmark's hit region.

// otherwise an eligible game takes priority over the surrounding island surface.
// Only a short, one-finger tap selects. Two-finger gestures and drags control the camera.
const activeTouchPointers=new Set();let gestureHadMultipleFingers=false;

renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'){activeTouchPointers.add(e.pointerId);if(activeTouchPointers.size>1){gestureHadMultipleFingers=true;pointerDownPoint=null}}

  pointerDownPoint={x:e.clientX,y:e.clientY,id:e.pointerId,type:e.pointerType,when:performance.now()};

});

// v0.323: tap targets are the visible screen-space silhouettes of each game,
// not just its central point. This works when a mesh is partly occluded by terrain.
const tapBox=new THREE.Box3(),tapCorner=new THREE.Vector3(),tapProjected=new THREE.Vector3();
function screenGameNearPointer(e){
 const rect=renderer.domElement.getBoundingClientRect();
 const touch=e.pointerType==='touch'||matchMedia('(pointer:coarse)').matches;
 const pad=touch?Math.max(12,Math.min(22,rect.width*.036)):8;
 let best=null,bestScore=Infinity;
 for(const [key,obj] of gameTargets){
  if(!obj.visible)continue;
  obj.updateWorldMatrix(true,true);
  tapBox.setFromObject(obj);
  if(tapBox.isEmpty())continue;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,visible=0;
  for(let i=0;i<8;i++){
   tapCorner.set(i&1?tapBox.max.x:tapBox.min.x,i&2?tapBox.max.y:tapBox.min.y,i&4?tapBox.max.z:tapBox.min.z);
   tapProjected.copy(tapCorner).project(camera);
   if(tapProjected.z<=-1||tapProjected.z>=1)continue;
   visible++;
   const x=rect.left+(tapProjected.x*.5+.5)*rect.width;
   const y=rect.top+(-tapProjected.y*.5+.5)*rect.height;
   minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
  }

  const ny=Math.max(0,Math.abs(e.clientY-cy)-ry)/pad;
  const outside=Math.hypot(nx,ny);
  if(outside>1)continue;

  const score=outside*5+Math.hypot((e.clientX-cx)/(rx+pad),(e.clientY-cy)/(ry+pad))*.25+camera.position.distanceTo(obj.getWorldPosition(tapCorner))*.0001;
  if(score<bestScore){bestScore=score;best=key}
 }
 if(!best)return null;

function islandNearPointer(e){
 // Support tapping the island silhouette in a distant overview, even when
 // the ray misses the uneven terrain geometry or the terrain is occluded.
 const viewRect=renderer.domElement.getBoundingClientRect();
 const projected=new THREE.Vector3(),edge=new THREE.Vector3();
 let best=null,bestScore=Infinity;

  projected.copy(island.center).project(camera);
  if(projected.z<=-1||projected.z>=1)continue;

  const cx=viewRect.left+(projected.x*.5+.5)*viewRect.width;
  const cy=viewRect.top+(-projected.y*.5+.5)*viewRect.height;
  const r=Math.max(14,Math.abs(edge.x-projected.x)*viewRect.width*.5);
  const score=Math.hypot((e.clientX-cx)/r,(e.clientY-cy)/(r*.73));

 }

function selectAtPointer(e){
 if(!pointerRay(e))return;
 // Independent transport picking; the rest of v0.323 game selection is untouched.
 const transportHit=ray.intersectObjects(transportHits,false)[0];
 if(transportHit){startTransportFollow(transportHit.object.userData.transport);return;}
 const gameHit=ray.intersectObjects(gameMeshes,false)[0];

 // Game and landmark selection only takes priority after approaching it.

  const id=landHit?.object.userData.island||islandNearPointer(e);
  if(id){fly(id);return}

const clock=new THREE.Clock(),projection=new THREE.Vector3();

function render(){
 requestAnimationFrame(render);

   // Use the absolute elapsed time to avoid motion jumps when a scene becomes visible.
   if(d>170*170&&renderFrame%4!==0)continue;
